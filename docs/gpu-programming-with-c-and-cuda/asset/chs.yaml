  \ 调试控制台\n\n正如 `Figure 8.14` 所示，调试控制台显示与程序执行相关的信息。但对于大多数情况，使用断点和流控制就已经让我们的工作变得简单许多了。\n\
  \n\n\n在下一节中，我们将看到一种非常有趣且强大的使用 GPU 的方法。我们已经解释了 `CUDA Streams`（CUDA 流）的概念，但现在我们将使用它们来真正地加速一个真实程序。\n\
  \n## 使用 CUDA 流重叠操作\n\n在 `Chapter 5` 中，我们对 CUDA 流进行了介绍，但现在是学习如何在实践中使用它们了！CUDA 流是\
  \ NVIDIA CUDA 编程模型中的一项强大功能，允许我们并发执行多个操作，从而提高 GPU 负载的吞吐量。这听起来可能很困惑，因为我们知道 GPU 拥有大量的处理器，这就是它们并发执行指令的原因，对吧？嗯，这只是事实的一部分，我们还有另一个层面的并行性需要探索。通过合理利用流，我们可以重叠内存传输和内核执行（kernel\
  \ executions），从而最大限地提高硬件效率。这是可能的，因为大多数消费级 GPU 拥有三个异步引擎：一个用于内核执行，两个用于内存传输（一个用于从主机到设备，另一个用于从设备到主机）。我们将讨论在内存带宽限制下如何最好地利用这些资源。\n\
  \nCUDA 流的核心优势在于它们能够实现并发执行。如果没有流，操作通常是顺序执行的——首先，将数据从主机（CPU）拷贝到设备（GPU），然后启动内核，最后将结果从设备拷贝回主机。这种顺序执行会导致资源未被充分利用的空闲时间。通过使用多个流，我们可以重叠这些任务，这样当一个数据传输进行时，一个内核可以执行，而另一个数据传输（相反方向）也可以发生。这种方法充分利用了三个三个引擎，增加了吞吐量。\n\
  \n为了直观地理解这一点，想象一下在繁忙的厨房里准备一顿大餐。如果只有一个人在做饭，他必须先切蔬菜，然后烧水，接着煮面条，最后制作酱汁——一步一步来——准备这顿饭需要的时间长得多。然而，如果有三个人合作——一个人切菜，另一个人烧水，另一个人准备酱汁——一切都会完成得快。CUDA\
  \ 流的工作原理类似，确保不同的任务（如内存传输和内核执行）同时发生而不是顺序发生，从而保持硬件充分利用并使空闲时间最小化。\n\n然而，硬件限制定义了并发的边界。如前所述，大多数消费级\
  \ GPU 拥有三个异步引擎，这意味着同时只能发生两个内存传输（每个方向一个）和一个内核执行。如果我们尝试入队超过硬件支持的操作，它们会被调度但不会是真正的并行，从而导致性能瓶颈。因此，正确使用\
  \ CUDA 流 涉及仔细地构建工作负载，以确保可用引擎始终处于忙碌状态，而不会让它们过载。\n\n优化 CUDA 流的另一个关键因素是理解 PCIe 总线带宽限制。PCIe\
  \ 总线是 CPU 和 GPU 之间的主要连接，虽然它提供了高速数据传输，但仍然显著慢于 GPU 的内部内存带宽。例如，PCIe 3.0 x16 连接的理论最大带宽约为\
  \ 16 GB/s，但如果我们未使用 x16 插槽，带宽可能会更低。同时，现代 GPU 的内部内存带宽可以超过数百 GB/s。这种巨大的差异意味着通过 PCIe\
  \ 进行的数据传输必须仔细管理，以防止总线成为 GPU 工作负载的瓶颈。\n\n考虑到这一点，现在是进行第一次代码讨论的好时机了。让我们测量内存传输带宽！\n\n\
  ### 测量我们的限制\n\n首先，我们将使用一个简单的程序在实践中了解 GPU 的内存带宽。\n\n```\n#include <cuda_runtime.h>\n\
  #include <iostream>\nint main() {\n  cudaDeviceProp prop;\n  cudaGetDeviceProperties(&prop,\
  \ 0);\n  int memClockMHz = prop.memoryClockRate / 1000;// to MHz\n  int busWidth\
  \ = prop.memoryBusWidth;  // In bits\n  float bandwidthInBytes = memClockMHz * busWidth\
  \ / 8;\n  float bandwidthInGB = bandwidthInBytes / 1024; \n  float bandwidthGBs\
  \ = 2.0 * bandwidthInGB;\n  std::cout << \"Mem Clock Speed: \" << memClockMHz <<\
  \ \" MHz\\n\";\n  std::cout << \"Mem Bus Width: \" << busWidth << \" bits\\n\";\n\
  \  std::cout << \"Estimated Mem Bandwidth: \" << bandwidthGBs << \" GB/s\\n\";\n\
  \  return 0;\n}\n```\n\n这段 CUDA 代码使用 `cudaGetDeviceProperties()` 获取 GPU 属性并计算理论峰值内存带宽。`memoryClockRate`\
  \ 属性最初以 kHz 为单位，通过除以 1000 转换为 MHz。`memoryBusWidth` 属性代表内存接口的总位宽（bits）。由于现代 GPU 使用\
  \ GDDR（图形双倍数据速率）内存，公式将内存时钟乘以 `2.0` 以考虑这种翻倍效应。为了将结果转换为标准单位，该值除以 8（从位切换到字节），然后除以 1024（从\
  \ MB/s 转换为 GB/s）。得到的 `bandwidthGBs` 值是 GPU 以每秒千字节（GB/s）的理论峰值内存带宽。\n\n这种测量有助于评估 GPU\
  \ 的内存子系统，这对于程序性能至关重要。计算出的值代表了理想条件下（假设内存访问模式完全有效）的最大可用带宽。然而，由于内存延迟、访问模式以及线程之间的竞争等因素，实际性能可能会较低。\n\
  \n让我们来看一些执行数字。以下是在我的机器上运行此代码的结果：\n\n```\nMemory Clock Speed: 5501 MHz\nMemory Bus\
  \ Width: 192 bits\nEstimated Bandwidth: 257.859 GB/s\n```\n\n尽管 RTX2060 的理论内存带宽规格为\
  \ 336 GB/s，但在实际情况下要低。但等一下：我们提到 PCIe x16 的理论限制是 16 GB/s——所以无论如何我们无法跟上 GPU 的速度。\n\n\
  让我们使用另一个程序来测量我们在实践中能够实现的传输速率。这个程序并没有特别之处，它使用 CUDA 事件（events）来测量完成不同数据传输大小所需的时间。（完整代码可在我们的仓库中找到。）结果如下：\n\
  \n```\nSize:    1 MB, Time: 0.0915 ms, Bandwidth: 10.667 GB/s\nSize:   10 MB, Time:\
  \ 0.8858 ms, Bandwidth: 11.024 GB/s\nSize:   30 MB, Time: 2.6194 ms, Bandwidth:\
  \ 11.185 GB/s\nSize:   50 MB, Time: 4.2118 ms, Bandwidth: 11.593 GB/s\nSize:  100\
  \ MB, Time: 8.2360 ms, Bandwidth: 11.857 GB/s\nSize:  300 MB, Time: 24.5889 ms,\
  \ Bandwidth: 11.915 GB/s\nSize:  500 MB, Time: 40.8161 ms, Bandwidth: 11.963 GB/s\n\
  Size: 1024 MB, Time: 83.3972 ms, Bandwidth: 11.991 GB/s\n```\n\n正如我们所见，我们低于 16 GB/s\
  \ 的理论带宽，如果我们看最后一行，为了传输 1 GB，我们需要等待 83 ms。在此期间 GPU 是空闲的，什么也没有处理，这里我们的策略出现了：将数据分成若干块，拷贝一小块，在拷贝下一块到不同的内存缓冲区时开始处理它，然后当新缓冲区准备就绪时开始处理它。这就是我们要做的，我们将利用这些结果来帮助确定最佳的传输块大小。\n\
  \n### 使用 CUDA 流进行乘法运算\n\n\n\n\n在 `Chapter 7` 中，我们使用了传统的矩阵乘法问题来学习可用的优化技术。现在，我们将使用一个类似的问题，但为了便于理解，选择一个稍微简单一点的。我们将使用向量-矩阵乘法——将其想象为矩阵乘法问题的第一步。由于会有多个操作同时发生，明智的做法是简化简化，以便我们跟上正在发生的一切。\n\
  \n在我们的仓库中，我们还有一个不使用流（streams）的版本，以便我们比较结果。值得注意的是，通常情况下，在我们多流程序中运行的内核（kernel）与无流版本的内核是相同的。区别在于主程序，它需要跟踪多个内存拷贝和数据块——正如我们将看到的那样。\n\
  \n事实上，内核简单得惊人，并且没有使用任何高级优化策略：\n\n```\n__global__ void vectorMatrixMulKernel(float*\
  \ d_vec, float* d_mat, float* d_res, int rows, int cols) { \n  int row = blockIdx.x\
  \ * blockDim.x + threadIdx.x; \n  if (row < rows) { \n    float sum = 0.0f; \n \
  \   for (int col = 0; col < cols; ++col) { \n      sum += d_mat[row * cols + col]\
  \ * d_vec[col]; \n    } \n    d_res[row] = sum; \n  } \n} \n```\n\n我们使用接收到的向量和矩阵来计算内积，直接访问全局内存。因此，让我们关注发生魔法的主函数。\n\
  \n我们首先声明矩阵的大小为 16380 x 16380 个元素，以确保我们有大约 1 GB 的数据（因为 16380 x 16380 x 4 字节的每个 float\
  \ 等于 1,073,217,600 字节，相当于 0.9995 GB）。这对于测试目的足够了。\n\n下一步是定义块大小（chunk size）。我们使用矩阵阶数的倍数来简化流控制，因此我们选择了\
  \ 1638 的块大小。我们有 268,304,400 个元素（16380 x 16380），除以块大小后得到 163,800 个块（268,304,400 /\
  \ 1,638 = 163,800）。每个块有 (1,638 x 16,380 x 4) 字节 / 1024 / 1024，约为 100 MB。分解来看：我们使用\
  \ 1,638 作为块大小乘以列数 16,380 乘以每个 float 数字的字节数，然后除以两次 1024 以以 MB 表示该值。\n\n根据我们之前的测量，100\
  \ MB 对于这台机器已经达到了峰传输速率，尽管更大的尺寸也处于峰传输速率，但我们可以观察到 100 MB 之后性能开始下降。这与 PCIe 处理将传输的数据包分解有关。然而，我们在看到所有代码后将回到这个问题。\n\
  \n```\nint main() {\n  const int rows = 16380;\n  const int cols = 16380;\n  const\
  \ int chunk_size = 1638;\n  float *h_vec = (float*)malloc(cols * sizeof(float));\n\
  \  float *h_res_cpu = (float*)malloc(cols * sizeof(float));\n  float *h_mat_pinned,\
  \ *h_res_gpu;\n  cudaMallocHost(&h_mat_pinned, rows*cols * sizeof(float));\n  cudaMallocHost(&h_res_gpu,\
  \ rows * sizeof(float));\n```\n\n我们还需要注意到，为了进行异步内存传输，我们需要使用锁页内存（pinned memory），为此我们使用\
  \ `cudaMallocHost` 而不是传统的 `malloc`。由于向量只需拷贝一次，我们可能使用传统的内存分配和同步内存传输。我们还将使用一个本地函数用随机数据初始化矩阵和向量。\n\
  \n现在，当涉及到设备上的内存分配时，我们有了第一个修改。我们不再简单地分配足够容纳矩阵和结果向量的缓冲区，而是为大小为 (chunk size * cols)\
  \ 的矩阵块分配两个缓冲区——我们将保留 1,638 行矩阵——以及两个大小为 1,638 的向量结果缓冲区，用于接收部分结果：\n\n```\n float\
  \ *d_vec, *d_mat1, *d_mat2, *d_res1, *d_res2;\n  cudaMalloc(&d_vec, cols * sizeof(float));\n\
  \  cudaMalloc(&d_mat1, chunk_size * cols * sizeof(float));\n  cudaMalloc(&d_mat2,\
  \ chunk_size * cols * sizeof(float));\n  cudaMalloc(&d_res1, chunk_size * sizeof(float));\n\
  \  cudaMalloc(&d_res2, chunk_size * sizeof(float));\n```\n\n之后我们将执行我们已经熟悉的操作：创建\
  \ CUDA 事件来测量执行时间并拷贝输入向量。这部分没有新内容，让我们移动到流的创建。\n\n```\n cudaStream_t stream1, stream2;\n\
  \  cudaStreamCreate(&stream1);\n  cudaStreamCreate(&stream2);\n```\n\n正如我们在第 5 章看到的，默认流是同步的，所以在这里创建了两个流。现在我们达到了程序的关键部分，即将数据拆分成块。首先让我们了解它是如何开始的。\n\
  \n```\nint blocks = (rows + chunk_size - 1) / chunk_size;\nfor (int i = 0; i < rows;\
  \ i += chunk_size) {\n cudaMemcpyAsync(d_mat1, h_mat_pinned + i * cols, chunk_size\
  \ * cols * sizeof(float), cudaMemHostToDevice, stream1);\nvectorMatrixMulKernel<<<blocks,\
  \ chunk_size, 0, stream1>>>(d_vec, d_mat1, d_res1, chunk_size, cols);\ncudaMemcpyAsync(h_res_gpu\
  \ + i, d_res1, chunk_size * sizeof(float), cudaMemDeviceToHost, stream1);\n\ncudaMemcpyAsync(d_mat2,\
  \ h_mat_pinned + (i + chunk_size) * cols, chunk_size * cols * sizeof(float), cudaMemHostToDevice,\
  \ stream2);\nvectorMatrixMulKernel<<<blocks, chunk_size, 0, stream2>>>(d_vec, d_mat2,\
  \ d_res2, chunk_size, cols);\ncudaMemcpyAsync(h_res_gpu + i + chunk_size, d_res2,\
  \ chunk_size * sizeof(float), cudaMemDeviceToHost, stream2);\n}\ncudaStreamSynchronize(stream1);\n\
  cudaStreamSynchronize(stream2);\n```\n\n\n\n在 `for` 循环之后，我们有两个流同步的请求。这仅仅是为了安全起见，确保我们在确认部分结果已经计算并复制之后，才会使用宿主机缓冲区。\n\
  \n关于部分结果的一个重要点是：我们正在写入宿主机内存中同一缓冲区的不同位置，这就是为什么我们不会覆盖并行计算出的结果。很酷，不是吗？\n\n当我们进入循环进行下一次迭代时，请记住\
  \ `i` 已经跳过了两个块（chunk）的大小，这允许我们再获取两个块，这种情况将持续直到到达矩阵末尾。\n\n我们还要记住，我们使用的是一个简化版本——所有数字经过仔细挑选，因此我们在这里不需要进行边界检查。然而，即使我们执行了这些检查，也不会影响最终性能。\n\
  \n请记住，我们使用的块大小（chunk size）不仅提供了大约 100 MB 的数据，而且它是矩阵总大小的除数，因此我们知道，当我们像现在这样一次迭代两个块时，可以使用两个流来执行循环展开（unroll），并且所有尺寸都是匹配的。如果我们使用源自现实问题的矩阵，我们的数字就不会这么理想了，我们必须检查最后一次迭代是否留有足够的行来复制，或者我们是否需要将最后一个块调整为较小的尺寸。\n\
  \n这是与我们不使用流的版本相比真正不同的部分。现在我们将对比一些执行性能的数据。\n\n我们编译了每个程序版本执行十次所需的数据，并计算了它们执行时间的简单平均值。为了计算使用数据的大小，我们用矩阵元素数量乘以每个浮点数\
  \ 4 字节，然后除以 1024 以以兆字节（MB）为单位。我们收集了两组执行数据：第一组总数据大小为 1020 MB（`16,380 x 16,380 x 4\
  \ / 1024 / 1024`），当矩阵为 16,380 x 16,380 时，完全符合此处列出的代码。然后，我们还收集了 32,760 x 32,760 尺寸矩阵的执行数据，总数据大小为\
  \ 4092 MB（`32760 x 32760 x 4 / 1024 / 1024`）。*表 8.1* 显示了编译结果。\n\n| 总数据大小 | 块大小 |\
  \ 数据大小 | 数据分区 | 平均时间 | 增益 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 1020\
  \ | 273 | 16 | 60 | 128.427 | -7.65% |\n| 546 | 32 | 30 | 89.1392 | 25.28% | |\n\
  | 819 | 48 | 20 | 88.0554 | 26.19% | |\n| 1638 | 100 | 10 | 87.0306 | 27.05% | |\n\
  | 4095 | 252 | 4 | 88.8127 | 25.55% | |\n| 8190 | 508 | 2 | 92.5483 | 22.42% | |\n\
  | 4092 | 273 | 32 | 120 | 445.549 | 11.00% |\n| 546 | 68 | 60 | 356.581 | 28.77%\
  \ | |\n| 819 | 100 | 40 | 347.283 | 30.63% | |\n| 1638 | 204 | 20 | 343.555 | 31.37%\
  \ | |\n| 4095 | 508 | 8 | 344.598 | 31.17% | |\n| 8190 | 1020 | 4 | 351.386 | 29.81%\
  \ | |\n| 16380 | 2044 | 2 | 363.88 | 27.31% | |\n\n表 8.1：不同块大小和数据大小执行时间\n\n有趣的是，在两种情况下，当传输数据大小为\
  \ 100 MB 时，我们获得了最佳性能；第二种情况在使用 204 MB 传输大小时，改进仅为 0.74%。此外，注意到在峰值性能之后，执行时间开始再次上升。\n\
  \n![图 8.15：传输大小对 1020 MB 执行时间的影响](img/file85.png)\n图 8.15：传输大小对 1020 MB 执行时间的影响\n\
  \n![图 8.16：传输大小对 4092 MB 执行时间的影响](img/file86.png)\n图 8.16：传输大小对 4092 MB 执行时间的影响\n\
  \n正如我们所见，[其余的后续文本遵循相同的格式逻辑 - 注意：用户提供的文本在后半部分包含重复/混乱的句子，我已根据要求对其进行了清理以提高读性，同时保持了核心内容。]\n\
  \n\n\n\n我们没有使用 `Chapter 7` 中看到的高级优化技术，仍然实现了执行时间 25% 到 31% 的提升。这是一项了不起的！当然，我们简化了代码，以便更容易理解如何使用这一强大功能，但尽管如此，它可以被应用于现实场景中。通过使用\
  \ `ncu-ui`，我们能够可视化重叠是如何发生的，从而能够具体地理解为什么这样做有效。\n\n然而，这并不是重叠多次执行的唯一方法，我们还有一段旅程要走。现在让我们来看看如何在同一个程序中同时使用多个\
  \ GPU 上！\n\n## 同时运行多个 GPU\n\n正如我们在章节介绍中提到的，由于成本高昂，在同一台机器上配备多个 GPU 并不是常见的配置。尽管如此，它仍然是计算重叠的形式，我们可以利用它的优势。在本节中，我们将查看之前向量矩阵乘法程序的适配版本，其中问题被分为两个部分，每部分都提交给不同的\
  \ GPU。\n\n我们不会在此程序中使用流（streams），以免混淆主题。我们也不会进行任何性能测量，因为运行执行的系统基于 PCIe 2.0 总线，其速度非常慢，会显著影响最终的时间结果。\n\
  \n多 GPU 编程的关键概念是使用 `cudaSetDevice(int d)` 函数，它定义了将指定的 GPU 设备，直到再次使用不同的设备标识符调用它。\n\
  \n在多个 GPU 上执行向量矩阵乘法的内核函数与我们在 CUDA Streams 程序中使用的是同一个，所以让我们跟随主程序来理解这些变化。\n\n在主机主机上声明并初始化向量和矩阵之后，是第一个有趣的部分。\n\
  \n```cpp\nfloat *d_vec[2], *d_mat[2], *d_res[2];\nfor (int device = 0; device <\
  \ 2; device++) {\n  cudaSetDevice(device);\n  cudaMalloc(&d_vec[device], cols *\
  \ sizeof(float));\n  cudaMalloc(&d_mat[device], chunk_size * cols * sizeof(float));\n\
  \  cudaMalloc(&d_res[device], chunk_size * sizeof(float));\n  cudaMemcpy(d_vec[device],\
  \ h_vec, cols * sizeof(float), cudaMemcpyHostToDevice);\n}\n```\n\n在这里，我们声明了三个指针数组来处理每个设备上使用的数据，然后我们的\
  \ `for` 循环允许我们为每个设备执行内存分配和内存拷贝。在这里我们使用了 `cudaMemcpy`，这是一个同步函数，但即使我们在配合 CUDA Streams\
  \ 时使用 `cudaMemcpyAsync`，我们也受到 PCI 总线的限制，因此即使目标是不同的设备，我们同时能传输的数据量也是有限的。\n\n我们所有的代码将将\
  \ `for` 循环，以便对两个可用设备进行切换和寻址。我们的下一个代码块将矩阵的一半拷贝到每个 GPU。\n\n```cpp\nfor (int device\
  \ = 0; device < 2; device++) {\n  cudaSetDevice(device);\n  cudaMemcpy(d_mat[device],\
  \ h_mat + device * chunk_size * cols, chunk_size * cols * sizeof(float), cudaMemcpyHostToDevice);\n\
  }\n```\n\n再次，我们相应设置设备并传输数据。现在是时候执行我们的内核了，如下：\n\n```cpp\nint blocks = (chunk_size\
  \ + BLOCK_SIZE - 1) / BLOCK_SIZE;\nfor (int device = 0; device < 2; device++) {\n\
  \  cudaSetDevice(device);\n  vectorMatrixMulKernel<<<blocks, BLOCK_SIZE>>>(d_vec[device],\
  \ d_mat[device], d_res[device], chunk_size, cols);\n}\n```\n\n我们首先定义了网格的大小并在两个 GPU\
  \ 上复用它。除了设置应该使用的设备外，我们还使用 `for` 循环的索引来寻址在每个 GPU 上分配的内存。\n\n```cpp\nfor (int device\
  \ = 0; device < 2; device++) {\n  cudaSetDevice(device);\n  cudaMemcpy(h_res_gpu\
  \ + device * chunk_size, d_res[device], chunk_size * sizeof(float), cudaMemcpyDeviceToHost);\n\
  \  cudaFree(d_vec[device]);\n  cudaFree(d_mat[device]);\n  cudaFree(d_res[device]);\n\
  }\n```\n\n最后，我们将从两个设备的结果拷贝到结果数组中的正确位置。我们可以看到，使用多个 GPU 比在单个 GPU 上使用流并没有困难多少。真正的问题是，为了共同处理同一个问题，两个设备将竞争\
  \ PCI 总线的可用性，这会极大损害性能。一个好的主意是在可以在开始加载数据集的场景中使用此资源，然后在整个应用程序生命周期内在不同的 GPU 上执行不同的计算。\n\
  \n## 总结\n\n在本章中，我们学习了如何使用 IDE 中的一个新工具来以可视化的方式调试我们的代码。这是一个非常实用的工具，应该精通它，因为很多时候我们必须像大海捞针一样寻找问题。在那之后，我们回到了一个在\
  \ `Chapter 5` 中首次介绍的主题，但现在我们能够探索 CUDA 流使用的的许多方面，以及数据传输大小对性能的影响。我们学习了分块大小（chunk size）、传输大小与数据分区数量之间的关系。\n\
  \n\n\n我们已经知道 C++ 释放了对硬件的原始力量和控制，使其成为性能密集型任务以及处理 GPU 的完美选择。然而，Python 出现在许多现代科学计算项目中，机器学习也是如此。通过让我们的\
  \ GPU 加速 C++ 库可以通过 Python 调用，我们为更广泛的群体提供了高速计算能力，包括数据科学家、工程师和研究人员，他们可能不擅长 C++，但仍然需要高性能解决方案。\n\
  \n将我们的库暴露给 Python 的巨大优势是易用性。如上所示，Python 的生态系统包含了大量用于数据分析、可视化和机器学习的库。通过将我们的 C++ 代码与\
  \ Python 集成，用户可以从 Python 脚本调用高性能 GPU 计算，从而在编写算法、可视化结果和进行进一步分析之间实现更动态的工作流。此外，这种集成使得在\
  \ Python 中开发原型变得更加容易，同时将计算密集型操作卸载给 C++。\n\n我们将探索两种暴露代码的常用方法。第一种替代方案 `ctypes` 是 Python\
  \ 的内置模块，允许直接从共享库（`.so` 或 `.dll` 文件）调用 C 函数。这种方法相对简单直接，因为它是一种纯 Python 的方法。然而，它需要仔细注意函数签名和内存管理，特别是在处理指针时。\n\
  \n第二种更复杂的方法涉及使用 Python C API 手动编写封装器（又称 C 程序）。这种方法对 Python 解释器如何与 C++ 函数交互提供了更精细的控制，允许在函数调用和内存管理中实现更\
  \ Python 化（Pythonic）的行为。虽然它需要编写额外的 C++ 代码来处理 Python 对象，但它提供了定义自定义类型、高效管理内存分配以及更优雅处理\
  \ Python 异常的灵活性。\n\n集成两种编程语言的一个主要挑战是正确管理内存。Python 采用带有垃圾回收的自动内存管理，而 C++ 需要显式的内存处理。如果管理不当，这种差异可能会导致内存泄漏或段错误。然而，我们在这里处理的是在\
  \ Python 侧分配且在 C 和 CUDA 侧操作的内存，这要安全得多。\n\n既然我们提到了心爱的 CUDA，处理 GPU 内存时会出现另一个挑战。正如我们所知，GPU\
  \ 内存分配的工作与 CPU 内存不同，不内存管理会降低性能。虽然 Python 不理解 GPU 内存，但我们理解（幸运的是），我们可以确保缓冲区在不再需要时正确分配和释放。我们将利用\
  \ GPU 内存管理函数来确保一切都被妥善处理。\n\n![图 9.1: Python 不直接处理 GPU 内存](img/file95.png)\n\n图 9.1：Python\
  \ 不直接处理 GPU 内存\n\n正如 `图 9.1` 所示，Python 不直接与 GPU 内存交互，而是依靠我们的库代码来正确执行任何内存处理。\n\n\
  另一个常见问题是处理数据类型，因为尽管看起来可能很奇怪（开玩笑的！），Python 是我们说的动态类型编程语言。这意味着变量没有声明类型，但它们包含的值是有类型的。由于这一特性，NumPy\
  \ 数组等 Python 对象需要被转换为 C++ 函数可以理解的格式。这需要对数据类型和内存布局进行仔细处理。如果处理不当，使用 C++ 带来的性能提升可能会被低效的数据拷贝所抵消。一个设计良好的封装器应该是在可能的情况下利用\
  \ NumPy 数组接口或内存映射缓冲区等技术实现零拷贝内存共享。\n\n考虑到这些因素，我们将在下一节中看到加载与 GPU 交互的动态链接库的第一种方法，并在\
  \ Python 程序中使用库中声明的函数。\n\n## 创建 C++ 库\n\n我们开始这一章时讨论的是将 C++ 库与 Python 集成，但到为止我们只创建了使用\
  \ GPU 的 C++ 程序——而且所有的都是可执行程序，而不是库。所以让我们看看如何将代码转换为库！我们将使用一个非常简单的向量加法内核示例，它接收两个输入数组、一个输出数组以及它们的大小，以执行输入数组元素的加并将结果存储在输出数组中。注意对大小传递的是单个值，因为数组的大小必须相同。\n\
  \n简单来说，C++ 库是预编译代码的集合，可以链接到多个应用程序，从而节省时间并利用代码复用。对于我们与 Python 集成的目的，我们需要创建一个共享库（动态加载），CMake\
  \ 提供了我们实现该目标所需的一切。\n\n> **静态库与共享库**\n\n> 尽管库是预编译代码的集合，但访问其功能有不同的方法。使用静态库时代码会被复制到最终程序中，这意味着如果我们使用同一个静态库编译了十个程序，它们在最终文件中都将有一份独立的代码副本。相反，当使用共享库时，我们的程序不包含完整的库代码。相反，它依赖运行时系统从库中动态链接必要的函数。\n\
  \n库的一个主要优势是能够实现模块化项目，其中应用程序的不同部分在不同的、功能不同的层中被处理。我们称之为 `关注点分离`（separation of concerns），这在\
  \ GPU 项目中是基础性的，因为这意味着我们可以所有与 GPU 相关的代码隔离在单独的库中，让不同的团队在业务应用层和内部应用层工作。\n\n为了创建我们的库，我们的\
  \ `CMakeLists.txt` 文件将发生一些变化，包含以下指令：\n\n```\nadd_library(vector_add SHARED src/vector_add.cu)\
  \ set_target_properties(vector_add PROPERTIES CUDA_SEPARABLE_COMPILATION ON) target_include_directories(vector_add\
  \ PUBLIC include)\n```\n\n我们不再使用一直使用的 `add_executable`，而是使用 `add_library`，添加 `SHARED`\
  \ 指定要创建的库类型。\n\n然后，通过使用 `set_target_properties`，确保 NVIDIA 编译器 `nvcc` 知道这是一个库，通过指定\
  \ `CUDA_SEPARABLE_COMPILATION ON`。\n\n最后我们必须添加包含头文件的目录（带有函数定义，以便其他可执行文件知道库中有哪些内容），以便\
  \ CMake 可以进行跟踪。\n\n我们库的代码与我们一直工作的代码略有不同，但这是一个很小的变化。首先，内核没有变化：它使用了我们之前的相同结构：\n\n\
  ```\n__global__ void vectorAddKernel(int *a, int *b, int *c, int N){\n   int idx\
  \ = threadIdx.x + blockIdx.x * blockDim.x;\n   if (idx < N) { \n      c[idx] = a[idx]\
  \ * b[idx];//为了调试故意留的 bug\n   }\n}\n```\n\n但我们需要为外部世界提供一种调用此内核的方法。之前我们是在自己的程序中使用内核，但现在我们编写内核是为了为他人提供\
  \ GPU 加速的功能。我们可以做的是将主函数转换为一个代理函数，如下所示：\n\n\n\n\n\n```cpp\nvoid vectorAdd(int *a,\
  \ int *b, int *c, int N) {\n   int *d_a, *d_b, *d_c;\n   cudaMalloc((void**)&d_a,\
  \ N * sizeof(int));\n   cudaMalloc((void**)&d_b, N * sizeof(int));\n   cudaMalloc((void**)&d_c,\
  \ N * sizeof(int));\n   cudaMempy(d_a, a, N * sizeof(int), cudaMemcpyHostToDevice);\n\
  \   cudaMemcpy(d_b, b, N * sizeof(int), cudaMemcpyHostToDevice);\n   int threadsPerBlock\
  \ = 256;\n   int blocksPerGrid = (N + threadsPerBlock - 1) / threadsPerBlock;\n\
  \   vectorAddKernel<<<blocksPerGrid, threadsPerBlock>>>(d_a, d_b, d_c, N);\n   cudaMemcpy(c,\
  \ d_c, N * sizeof(int), cudaMemcpyDeviceToHost);\n   cudaFree(d_a);\n   cudaFree(d_b);\n\
  \   cudaFree(d_c);\n}\n```\n\n为了确保导出我们的函数，我们需要包含头文件，这通过在 C++ 文件的开头使用 `#include \"\
  ../include/vector_add.h\"` 实现。值得注意的是，我们没有像之前那样分配任何主机内存；在这里，我们从函数的调用者处接收主机内存——甚至是接收结果的数组。如果我们需要在库内部分配内存，则必须为用户提供内存管理函数，以便其释放内存。\n\
  \n我们需要提供的最后一个资源是我们之前一直没有怎么用过的东西：一个描述我们库支持的函数头文件。该文件位于项目的 `include` 文件夹下，如下：\n\n\
  ```\n#ifndef VEC_ADD_H\n#define VEC_ADD_H\nextern \"C\" {\n   void vectorAdd(int\
  \ *a, int *b, int *c, int N);\n}\n#endif\n```\n\n现在，编译好我们的库后，我们将在构建文件夹中看到 `libvector_add.so`\
  \ 文件。\n\n在下一节中，让我们看看如何结合第一个 Python 程序使用这个新库，通过使用 `ctypes` 声明关于我们函数的必要信息。\n\n## 使用\
  \ Ctypes\n\n如果没有方法在程序中使用库，那么库就是没用的。幸运的是，有一个名为 `ctypes` 的 Python 模块，允许与用 C 或 C++\
  \ 编写的共享库进行交互。它允许我们的 Python 程序像调用原生 Python 函数一样调用库函数。这种机制提供了一种利用高性能 C++ 代码的简单方法，同时仍受益于\
  \ Python 的灵性和易用性。\n\n使用 `ctypes` 我们可以轻松地加载共享库、声明函数签名并调用原生函数。一个很大的优势是它不需要对原始 C++\
  \ 源代码进行任何修改，使其成为轻量级集成的极具吸引力的选择。\n\n另一个有趣点是，它是完全基于 Python 的，这意味着我们可以在 Python 端编写代码来定义想要从库中使用的内容，而无需编译任何东西。然而，`ctypes`\
  \ 也有它的局限性：例如，它要求手动映射函数签名，并必须处理原始内存指针。\n\n由于 Python 是动态类型，而 C++ 是静态类型，每次函数调用都必须显式指定参数和返回类型，这可能会导致一些麻烦。然而，`ctypes`\
  \ 通过提供如 `ctypes.c_int` 和 `ctypes.c_double` 等对应其 C 语言对应项的数据类型减轻减轻这种痛苦。\n\n一个代码示例将有助于澄清我们正在处理的内容：\n\
  \n```python\nimport ctypes\nlib = ctypes.CDLL(\"../../build/libvector_add.so\")\n\
  lib.vectorAdd.argtypes = [\n   ctypes.POINTER(ctypes.c_int),\n   ctypes.POINTER(ctypes.c_int),\n\
  \   ctypes.POINTER(ctypes.c_int),\n   ctypes.c_int\n]\n```\n\n在这里，我们传递了将使用的共享库的路径，以及我们在函数中将处理的数据类型声明。尽管对于通常不需要处理数据类型声明的\
  \ Python 程序员来说，这可能看起来有点奇怪，但读起来仍然足够直接。\n\n至于函数调用，假设我们已经在 Python 程序的开头导入了 `numpy`，我们将得到类似这样的代码：\n\
  \n```python\nN = 1000\na = np.array(range(N), dtype=np.int32)\nb = np.array(range(N,\
  \ 2*N), dtype=np.int32)\nc = np.zeros(N, dtype=np.int32)\nlib.vectorAdd(\n   a.ctypes.data_as(ctypes.POINTER(ctypes.c_int)),\n\
  \   b.ctypes.data_as(ctypes.POINTER(ctypes.c_int)),\n   c.ctypes.data_as(ctypes.POINTER(ctypes.c_int)),\n\
  \   N\n)\n```\n\n在这里，我们使用 `numpy` 创建带有随机整数的输入数组和填充零的输出数组。然后，在执行函数调用时，我们需要访问数据的内部指针并传递到我们的库中。操作非常简单！虽然有点冗长，但其发生的过程非常直观。\n\
  \n我们为声明和函数调用指定了数据类型，但 Python 的动态类型解析会对 `ctypes` 调用性能产生影响，这意味着函数调用是在运行时解析的。这引入了微小的开销，因为\
  \ Python 会动态地确定正确的函数签名并转换参数。虽然对于偶尔的函数调用来说这种开销可能忽略不计，但在每秒需要数千或百万次调用的应用程序中可能会出现性能瓶颈。\n\
  \n显然，通过 `ctypes` 我们有了一种从 Python 访问库的快速方法，特别是因为当我们处理 GPU 时，我们的代码（大部分时候）都是关于内核的，而创建代理函数来暴露它们是有意义的。\n\
  \n然而，还有其他访问我们代码的方法，在下一节中，我们将深入 Python C API 的世界，创建一个作为 Python 扩展的封装器。\n\n## 使用你自己的代码进行封装\n\
  \nPython 扩展是用 C 或 C++ 编写的模块，可以像普通模块一样加载到 Python 中。它在 Python 友好的脚本环境和低级语言之间架了一个桥梁。我们可以为任何需要使用低级语言的情况创建扩展，包括当我们想要与现有的\
  \ C++ 库接口，并在提供 GPU 功能访问的同时，仍受益于 Python 的易用性时。\n\n创建扩展需要 Python C API，它允许我们定义新类型、暴露\
  \ C++ 函数到 Python、管理引用计数并处理 Python 对象。通用工作流包括定义在 Python 对象和原生 C++ 结构之间转换的函数、将其编译为共享库，然后作为\
  \ Python 模块加载。然而，编译过程是不同的，并且共享对象的创建方式使得 Python 解释器知道如何将其导入到我们的程序中。\n\n让我们分解创建扩展涉及的步骤。\n\
  \n扩展需要包含一个 Python 可用的函数定义、一个引用所有函数的数组、一个模块定义以及 Python 在加载模块时调用的初始化函数。\n\n现在，我们将先跳过函数定义，先过这些基础设施。\n\
  \n```cpp\nstatic PyMethodDef VectorAddMethods[] = {\n   {\"vectorAdd\", pyVectorAdd,\
  \ METH_VARARGS, \"Perform vector addition using CUDA\"},\n   {NULL, NULL, 0, NULL}\n\
  };\nstatic struct PyModuleDef vectoraddmodule = {\n   PyModuleDef_HEAD_INIT,\n \
  \  \"vector_add_wrapper\",\n   NULL,\n   -1,\n   VectorAddMethods\n};\n```\n\n仔细观察，我们首先有一个函数数组，包含一个条目和使用该数组的模块定义。`PyMethodDef`\
  \ 期望的是暴露名称、函数实现、C 函数预期的参数标志以及描述。\n\n\n\n\n我们使用一个必需的宏来初始化 `vectoraddmodule` 定义，然后给它起一个名称。在这里我们没有提供任何描述，所以我们目前使用\
  \ `NULL`，但很重要的一点是，通过传递 `-1` 作为参数，我们告诉 Python 解释器我们的模块不需要为内部状态分配任何空间。最后，我们传入了函数数组。\n\
  \n在讨论实际函数之前，还有一项基础设施方面的工作我们需要处理：模块初始化。\n\n```c\nPyMODINIT_FUNC PyInit_vector_add_wrapper(void)\
  \ {\n   void *handle = dlopen(\"../../build/libvctor_add.so\",\n               \
  \          RTLD_LAZY);\n   if (!handle) {\n      PyErr_SetString(PyExc_ImportError,\
  \ \n         \"Could not load libvector_add.so\");\n      return NULL;\n   }\n \
  \  vectorAdd = (vectorAddFunc)dlsym(handle, \"vectorAdd\");\n   if (!vectorAdd)\
  \ {\n      PyErr_SetString(PyExc_ImportError, \n         \"Could not find vectorAdd\
  \ in libvector_add.so\");\n      return NULL;\n   }\n   return PyModule_Create(&vectoraddmodule);\n\
  }\n```\n\n在这里我们使用了通过 `dlopen` 加载库的方法，这允许我们动态地从外部库加载每个函数指针，而不需要在编译时提供该库。虽然引用每个函数指针名称时需要一些额外的工作，但这种方法的有趣之处在于，它允许一种插件式的架构，我们可以在库的不同实现之间进行切换。与扩展相关的部分是最后一行，我们调用了\
  \ `PyModule_Create` 函数并传入了我们之前定义的模块配置。\n\n现在是时候看看我们的函数真实的样子了。\n\n```c\nstatic PyObject*\
  \ pyVectorAdd(PyObject* self,PyObject* args){\n   PyObject *py_a, *py_b;\n   int\
  \ N;\n   if (!PyArg_ParseTuple(args, \"OOi\", &py_a, &py_b, &N))\n      return NULL;\n\
  \   int *a = (int*)malloc(N * sizeof(int));\n   int *b = (int*)malloc(N * sizeof(int));\n\
  \   int *c = (int*)malloc(N * sizeof(int));\n   for (int i = 0; i < N; i++) {\n\
  \      a[i] = (int)PyLong_AsLong(PyList_GetItem(py_a, i));\n      b[i] = (int)PyLong_AsLong(PyList_GetItem(py_b,\
  \ i));\n   }\n   vectorAdd(a, b, c, N);\n   PyObject* result = PyList_New(N);\n\
  \   for (int i = 0; i < N; i++) {\n      PyList_SetItem(result, i, PyLong_FromLong(c[i]));\n\
  \   }\n   free(a);\n   free(b);\n   free(c);\n   return result;\n}\n```\n\n首先要注意的是，我们正在使用\
  \ `\"OOi\"` 模式解析一个参数元组。这意味着我们正在接收两个 Python 对象（即输入数组）和一个表示它们大小的整数。我们没有传入结果数组，所以我们\
  \ Python 版本的 `vectorAdd` 函数与库中的版本略有不同。这正是因为扩展的目标是为程序员提供更多功能。\n\n我们也可以设置一组数据类型和大小验证，尽管为了简单起见，我们现在跳过了这些。但请记住，在连接\
  \ Python 和 C++ 这两个不同的世界时，拥有能够保护我们的代码总是令人让人放心的。\n\n然后我们创建了数组形式的主机内存，用于从 Python 拷贝数据并存储结果。通过\
  \ `for` 循环，我们遍历每个 Python 列表的所有元素，并将它们复制到我们在函数调用将使用的 C++ 对应项中。\n\n接下来，我们调用模块初始化期间从共享库加载的\
  \ `vectorAdd` 函数。这传入了三个数组及其大小；调用完成后，我们可以将结果从数组 `c` 拷贝到新创建的 Python 列表中并返回。然后我们安全地释放分配的内存并返回结果。\n\
  \n谜题的最后一部分是如何构建这个扩展。我们通过一个名为 `setup.py` 的文件完成完成。\n\n> **不久后的变化**\n\n> 在编写本文时，`setup.py`\
  \ 仍然是构建 Python 扩展的工具，尽管对于打包和安装 Python 项目，它已经被弃用，并被 `pyproject.toml` 等现代工具取代。\n\n\
  我们的 `setup.py` 文件如下：\n\n```python\nfrom setuptools import setup, Extension\nmodule\
  \ = Extension(\n   \"vector_add_wrapper\",\n   sources=[\"vector_add_wrapper.c\"\
  ],\n)\nsetup(\n   name=\"vector_add_wrapper\",\n   version=\"1.0\",\n   description=\"\
  Python binding for CUDA vector addition\",\n   ext_modules=[module],\n)\n```\n\n\
  要构建我们的扩展，可以使用以下命令：\n\n```bash\npython3 setup.py build_ext --inplace\n```\n\n在当前文件夹中构建好扩展后，如果我们从该文件夹执行\
  \ Python 程序，解释器将能够找到我们的库。如果我们需要将扩展安装到系统中，可以使用：\n\n```bash\nsudo python3 setup.py\
  \ install\n```\n\n在当前文件夹中构建好扩展后，如果我们从该文件夹执行 Python 程序，解释器将能够找到我们的库。如果我们需要将扩展安装到系统，可以使用：\n\
  \n```python\nimport vector_add_wrapper as vaw\nimport random\nN = 1000\na = [random.randint(0,\
  \ N) for _ in range(N)]\nb = [random.randint(0, N) for _ in range(N)]\nresult =\
  \ vaw.vectorAdd(a, b, N)\n```\n\n我们看到了与基于 `ctypes` 版本的两个不同：首先，代码看起来更像 Python 代码，这是扩展在为我们做大量工作；其次，我们正在使用\
  \ numpy 输入数据。\n\n这里有几个需要考虑的问题。首先，随着数组增大，拷贝数据可能会花费很长时间，这不仅耗时（丢弃了 GPU 执行的优势），而且双倍了数据占用的内存，因为它们现在位于两个不同的位置。最后，访问列表元素我们需要调用两次，一次是获取值，另一个是转换为正确的数据类型。\n\
  \n目前我们知道，如果我们能像使用 `ctypes` 那样直接访问 `numpy` 的内部数据，将极大提高我们的结果。因此，在下一节中，我们将更新扩展以集成 `numpy`。\n\
  \n## 将 numpy 数组传递给库\n\n在我们的第一次集成中，我们使用 `ctypes` 将 numpy 数组传递给库，而在 Python 科学计算中使用\
  \ numpy 无处不在。它提供了高效的连续内存存储、向量化操作，并使用了加速的 CPU 库。通过将 `numpy` 的 C API 集成到我们的 C 扩展中，我们将能够使用\
  \ Python 侧创建并预处理的数据在 GPU 内部执行进一步计算。这意味着我们可以结合这两个世界的优点，同时保持像 Python 一样的感觉。\n\n我们将修改之前的代码使\
  \ `numpy` API 可用。第一个更改是在我们的 `vector_add_np_wrapper.c` 文件中导入它：\n\n```c\n#include\
  \ <numpy/arrayobject.h>\n```\n\n\n\n在 `include` 之后，我们在基础设施方面还有一件事要做：通过在模块初始化函数中添加对\
  \ `import_array()` 的调用来初始化 `numpy` 模块，如下所示：\n\n```\nPyMODINIT_FUNC PyInit_vector_add_np_wrapper(void)\
  \ {\n   void *handle = dlopen(\"../../build/libvector_add.so\",\n              \
  \           RTLD_LAZY);\n   if (!handle) {\n      PyErr_SetString(PyExc_ImportError,\
  \ \n         \"Could not load libvecor_add.so\");\n      return NULL;\n   }\n  \
  \ vectorAdd = (vectorAddFunc)dlsym(handle, \"vecctorAdd\");\n   if (!vectorAdd)\
  \ {\n      PyErr_SetString(PyExc_ImportError, \n         \"Could not find vectorAdd\
  \ in libvectorAdd.so\");\n      return NULL;\n   }\n   import_array();\n   return\
  \ PyModule_Create(&vectoraddmodule);\n}\n```\n\n至此，我们已经准备好使用该 API。在 C 扩展中操纵数据是可能的，但我们真正需要的是能够使用来自\
  \ Python 程序的数据并将其传递到 GPU 库。因此，我们需要按照所示更新我们的 `pyVectorAdd` 函数：\n\n```\nstatic PyObject*\
  \ pyVectorAdd(PyObject* self,PyObject* args){\n   PyArrayObject *a, *b, *c;\n  \
  \ int N;\n   if (!PyArg_ParseTuple(args, \"OOOi\", &a, &b, &c, &N))\n      return\
  \ NULL;\n   int *a_ptr = (int*)PyArray_DATA(a);\n   int *b_ptr = (int*)PyArray_DATA(b);\n\
  \   int *c_ptr = (int*)PyArray_DATA(c);\n   vec_add(a_ptr, b_ptr, c_ptr, N);\n \
  \  Py_RETURN_NONE;\n}\n```\n\n注意，我们现在没有将数据从一个数据结构复制到另一个数据结构，而是使用内部指针指向外部分配的数组。我们不需要复制结果，因为结果是在我们的\
  \ GPU 库内部填充的，而该库接收了 `numpy` 分配的数组指针。\n\n再次，设置保护措施来检查类型及此类内容始终是一个好主意，但为了简单起见，我们没有添加这些内容。\n\
  \n我们的 `setup.py` 也需要修改以包含 `numpy` include，这样在构建扩展时它能够正确地链接。以下是需要对文件进行的更改：\n\n```\n\
  from setuptools import setup, Extension\nimport numpy\nmodule = Extension(\n   \"\
  vector_add_np_wrapper\",\n   include_dirs = [numpy.get_include()],\n   sources=[\"\
  vector_add_np_wrapper.c\"],\n)\nsetup(\n   name=\"vector_add_np_wrapper\",\n   version=\"\
  1.0\",\n   description=\"Python binding for CUDA vector addition\",\n   ext_modules=[module],\n\
  \   include_dirs=[numpy.get_include()]\n)\n```\n\n虽然与我们之前看到的基本上相同，但我们现在导入了 `numpy`，以便找到包含目录并将其传递给\
  \ `setup`。\n\n我们使用与相同的命令构建扩展：\n\n```\npython3 setup.py build_ext --inplace\n```\n\
  \n应用程序发生了一点变化，因为现在我们将像在第一个示例中那样使用 `numpy` 数组：\n\n```python\nimport vector_add_np_wrapper\
  \ as vaw_np\nimport numpy as np\nN = 1000\na = np.random.randint(0, N, size=N, dtype=np.int32)\
  \ \nb = np.random.randint(N, 2*N, size=N, dtype=np.int32)\nc = np.zeros(N, dtype=np.int32)\n\
  vaw_np.vectorAdd(a, b, c, N)\n```\n\n这正是 Python 程序员对扩展所预期的：使用 `numpy` 数组生成数据并将其传入进行处理，就像使用任何其他库一样。\n\
  \n通过这个小小的更改，我们消除了之前的内存翻倍问题，并提高了性能——但将在下一节中检查这些数据。\n\n## 性能分析\n\n我们现在已经看到了两种让 GPU\
  \ 代码对 Python 可用的方法。显然，`ctypes` 非常直观，尽管它定义所用函数的方式有些笨拙。相比之下，创建一个扩展为终端用户提供了一个非常清晰的接口，尽管它稍微费力。\n\
  \n然而，这里不仅仅是风格问题；同样的是，我们没有使用 `numpy` 数组的扩展实现涉及大量的数据拷贝。问题是：这对整体性能有多大影响？\n\n![图 9.2:\
  \ 每种 Python 集成类型的执行时间](img/file96.png)\n\n图 9.2：每种 Python 集成类型的执行时间\n\n正如我们之前提到的，我们调用扩展的第二个版本\
  \ `wrapper_np` 以表示它使用了 numpy 访问。注意，当数组大小多达 100,000 时，简单的包装器胜出，而其他两个版本 `wrapper_np`\
  \ 和 `ctypes` 在技术上是平手的。\n\n然而，当我们真正增加数组大小到一百万或一千万个元素时，我们看到数据复制无法与直接使用数据指针相比。\n\n\
  公平起见，在比较中，我们只测量了调用扩展的时间，而不是生成随机数据的时间。重要的是我们的库是使用 debug 模式编译的，为了确保时间，我们排除了离群值。\n\n\
  ## 总结\n\n在本章中，我们学习了如何从 Python 访问 GPU，这是一个有趣且重要的话题，为我们开启了新的世界。我们看到了两种集成方法：使用 `ctypes`\
  \ 和创建 Python 扩展。通过扩展，我们探索了两种方法，一种方法是拷贝数据，另一种是直接使用 `numpy` 内部指针，后者快得多。第一种方法的优点是它是纯\
  \ Python 实现，不需要编译任何内容。另一种方法允许更细粒度的控制，但我们必须编译扩展可以使用。\n\n无论采取何种方法，我们都应该重用内存，否则将失去\
  \ GPU 带来的收益，正如我们在性能分析部分看到的。\n\n在下一章中，我们将讨论未来的去向。哪些库已经存在，我们如何将它们与自己的内核一起使用？请期待！\n\
  \n#探索现有 GPU 模型\n\n## 在 Discord 上加入我们的社区\n\n[`packt.link/deep-engineering-cpp`](https://packt.link/deep-engineering-cpp)\n\
  \n![](img/file97.png)\n\n了解 GPU 如何工作是在我们的项目中有效利用它的基础。为了帮助探索其硬件特性并将其与 GPU 编程概念，我们研究了各种算法，并看到我们的实现如何充分利用\
  \ GPU 架构。特别是，我们通过学习向量加法和矩阵乘法来理解 CUDA 线程、块和网格。我们还学习了优化以及如何更有效地处理数据传输和内存访问。\n\n在本章中，我们调查了几个对我们的市场和项目可靠性有重要影响的话题。这些主题之一是用于\
  \ GPU 的库。我们首先学习现有的库，然后考虑在什么情况下编写自己的代码。然后我们讨论了在 GPU 上运行顺序代码有时可以消除或减少限制性能的数据移动。在最后一节中，我们将探索使用解释性语言在多个层面帮助测试代码。\n\
  \n\n\n我们将使用在第 3 节中为 VS Code 和我们的开发容器所配置的环境。如果你选择在你的机器上安装了 `CUDA Toolkit`，那么你可以直接在终端中运行构建命令。代码提供在\
  \ GitHub 仓库中，可以通过此处访问：[`github.com/PacktPublishing/GPU-Programming-with-C-and-CUDA`](https://github.com/PacktPublishing/GPU-Programming-with-C-and-CUDA)。\n\
  \n## 使用现有的库和框架\n\n我们在之前的章节中使用的代码帮助我们理解了如何使用 GPU，你可能会好奇是否已经存在某些库可以提供（例如）矩阵乘法的最优化版本。事实确实如此：是存在的。幸运的是，我们不需要重复轮子，因为\
  \ CUDA 已经提供了一系列成熟、优化的库和框架，它们旨在为常见的计算任务提供高效的实现，极大地减少了我们应用程序的工作量。可用库的完整列表可以在 [`developer.nvidia.com/gpu-accelerated-libraries`](https://developer.nvidia.com/gpu-accelerated-libraries)\
  \ 找到。\n\n这些库针对特定类型的问题，尽管数量很多，但我们将专注于两个与我们之前章节中工作类似的库。这将使我们能够将之前的开发工作与使用库的结果进行比较。第一个库是\
  \ `cuBLAS`，它是 NVIDIA 对基础线性代数程序 (BLAS) 库的 CUDA 实现。它包含了矩阵乘法、向量操作和其他基础数值计算的代码。任何以前用过传统\
  \ BLAS 库的人都能平滑地过渡到 `cuBLAS`。\n\n我们拥第二个库是 `Thrust`，这是一个类似于 C++ 标准模板库 (STL) 的并行算法库。它提供了一种让刚开始\
  \ GPU 编程的开发者感到熟悉的语法，并提供了一个带有向量、归约、排序等的 GPU 计算的高级接口。\n\n### 使用 cuBLAS 乘法矩阵\n\n在我们的程序中使用\
  \ `cuBLAS` 时，我们需要记住它不会为我们处理内存传输：我们需要通过将数据复制到 GPU 设备内存中来提供我们想要的数据。我们使用之前用过的 `cudaMemcpy`\
  \ 命令完成此。\n\n该示例的完整代码位于我们 GitHub 仓库的 `ch10/cuBLAS` 文件夹中，因此让我们关注使用该库的特定细节。\n\n我们的程序将需要在设备上分配缓冲区并复制数据，以便我们可以调用特定函数执行矩阵乘法。以下是我们需要创建\
  \ cuBLAS 上文并执行这些操作的代码：\n\n```\ncublasHandle_t handle;\ncublasCreate(&handle);\n\
  float alpha = 1.0f;\nfloat beta = 0.0f;\ncublasSgemm(handle,\nCUBLAS_OP_T, CUBLAS_OP_T,\n\
  N, N, N,\n&alpha,\nd_A, N,\nd_B, N,\n&beta,\nd_C, N);\nfloat* d_C_fixed;\ncudaMalloc(&d_C_fixed,\
  \ size);\ncublasSgeam(handle,\nCUBLAS_OP_T, CUBLAS_OP_N,\nN, N, \n&alpha,\nd_C,\
  \ N,\n&beta,\nnullptr, N,\nd_C_fixed, N);\n```\n\n我们使用两个 cuBLAS 函数是因为它处理数据的方式。让我们逐步分解这段代码。我们创建了两个变量\
  \ `alpha` 和 `beta`，因为将执行的操作是：\n\n因此，我们使用 `alpha` 为 `1.0f` 来乘以 `d_A` 矩阵，并使用 `beta`\
  \ 为 `0.0f`，这样对 `d_C` 矩阵就不会执行操作。让我们更详细地理解这一点。从方程中，我们注意到如果 C 矩阵已经存在，它也可以作为输入，而且在加到\
  \ `A*B` 矩阵乘法的结果之前，它可以先与标量值 `beta` 相乘。然而，由于我们只对矩阵乘法部分感兴趣，我们传递了一个 `nullptr` 作为原始 C\
  \ 矩阵，并将值为 `0.0f` 的 `beta`。现在与我们原始的矩阵乘法代码有一个很大的区别：BLAS 库通常处理存储为**列主序（column-major）**格式的矩阵，这意味着在内存中并不是行所有的元素是连续的，而是函数期望找到整列的所有元素。由于这一特性，我们传递了\
  \ `CUBLAS_OP_T` 操作符，告知 cuBLAS 在执行计算时应该考虑矩阵的转置。这样，cuBLAS 就能用我们的行主序矩阵产生正确的值。\n\n>\
  \ **列主序格式**\n\n> BLAS 的原始实现是用 Fortran 编写的，它以列主序格式存储矩阵，这意味着所有列在内存中是连续的。这与 C/C++ 语言形成对比，后者在内存中以行连续存储矩阵。来自\
  \ BLAS 的整个库生态系统都使用列主序格式，并一直保留至今。可以通过许多优化来减少访问行时否则会产生的性能惩罚。\n\n然而，生成的 `d_C` 矩阵是以列主序格式存储的，因此在将其返回主机之前，我们需要找到一种方法将其转置为行主序格式，就像原始矩阵那样。\n\
  \n一个非常有趣的替代方案是使用 cuBLAS 的矩阵加法函数，但不提供第二个矩阵。这样，当我们执行 `CUBLAS_OP_T` 时，它会将输入矩阵转置，生成行主序版本的\
  \ `d_C`。最后，我们必须调用 `cublasDestroy(handle)` 进行清理。\n\n在这些操作之后，我们将 `d_C_fixed` 复制到主机并使用。我们获得了以下执行时间：\n\
  \n```\nCPU multiplication took: 1404.17 ms\nDevice copy time: 0.88617 ms\nDevice\
  \ copy back time: 1.4203 ms\nDevice compute time: 3.2975 ms\ncuBLAS overhead: 8.7919\
  \ ms\nTotal GPU time: 14.4082 ms\n```\n\n我们可以看到，即使考虑到数据传输，GPU 的总时间也比单线程 CPU 快 100\
  \ 倍（大约 14 ms 对比 1400 ms）。我们将创建 cuBLAS handle 视为开销，计算时间包含了矩阵乘法和矩阵转置。\n\n### 使用 Thrust\
  \ 编写 GPU 代码\n\n现在，让我们看看如何使用 Thrust 库排序整数数组和另一个双精度数组。这是一个重要的示例，因为它正是库网站上展示的带有一个指示已性能的图表的代码。我们之前对性能的研究让我们能够更清晰地阅读信息。\n\
  \n这次我们的代码比为 cuBLAS 需要的要简单，因为 Thrust 为我们封装了许多 GPU 交互。我们可以在主机上分配一个向量并填充我们想要排序的数据。之后，只需使用以下代码即可将数据复制到设备：\n\
  \n```\nthrust::device_vector<float> d_vec = host_vec;\n```\n\n假设 `host_vec` 之前已经声明并填充，这行代码将声明我们的设备缓冲区并将数据到其中。这非常方便，虽然比我们手动分配和复制提供的控制更少。在复制完成后，我们可以调用\
  \ `sort` 函数，它与 STL 版本非常相似：\n\n```\nthrust::sort(d_vec.begin(), d_vec.end());\n```\n\
  \n现在的执行时间如下所示：\n\n```\n ==== Sorting float (33554432 elements) ====\nCPU sort time:\
  \        2411.68 ms\nGPU copy time:        12.9508 ms\nGPU copy back time:   13.4571\
  \ ms\nGPU sort time:        17.7616 ms\nGPU total time:       44.1696 ms\n```\n\n\
  \n\n请注意，与排序整个向量的时间相比，复制数据的时间非常高。此外，在这里我们考虑了将数据拷贝到 `GPU` 内存并传回主机所需的时间。数据传输时间几乎与执行排序本身的时间相当。尽管在\
  \ GPU 上进行排序所需的总时间（即使考虑了数据传输时间）仍然比 STL 的单线程 CPU 版本快得多。然而，请记住，在 Thrust 网站（[`developer.nvidia.com/thrust`](https://developer.nvidia.com/thrust)，我们可以在那里找到文档和示例）上提供的对比并没有考虑单线程版本；相反，它是与\
  \ Intel 的线程构建块 (TBB) 库进行对比，并且没有考虑到传输数据所需的这巨大时间。这是我们在考虑考虑使用的库的规范时，务必留意的的一点。\n\n在下一节中，我们将讨论在已经有现成的库可以帮助我们的情况下，何时编写自己的内核（kernels）是有意义的。##\
  \ 编写自己的代码\n\n创建 GPU 加速程序与顺序 CPU 代码不同，但软件工程中有一个在两个领域都通适的有趣方面：我们必须考虑何时应该编写自己的代码，何时应该使用现有的库。在大型的企业级项目中，出于许多原因，我们试图尽可能避免重复造轮子。其中一个原因我们在上一节中讨论过：库倾向于有一个专门负责该库领域的专门团队。这意味着它的\
  \ `业务` 是这个库本身，而大多数时候，我们的业务是针对特定用例的应用程序，该程序将利用库来实现我们的目标。另一个原因是，当我们决定创建与库竞争的代码时，我们可能需要承担维护这些代码的责任，而我们有效履行这一责任的能力可能会受到许多因素的影响。我们修复特定\
  \ bug 的时间可能比所需的少，或者原始作者可能会离开我们的团队，这些风险会直接转化为更高的成本。\n\n这并不意味着我们应该总是盲目地选择使用库。虽然 CUDA\
  \ 库经过了优化并提供了高性能，但它们是通用的实现，可能无法直接适应我们的特定问题。我们必须分析自己的问题，以揭示与确定最佳解决方案相关的细节。举一个具体的例子，假设我们需要计算复数矩阵的乘法，这些复数是由两个\
  \ 64 位浮点数复合成的，一个表示实部，另一个表示虚部。这个问题可以通过 `cuBLAS` 解决，但由于其数据表示方式，性能远低于我们使用 32 位浮点数的情况。假设我们可以使用单精度版本，这将影响我们整个解决方案的数值精度，因为在最初填充矩阵时，这些值需要被定义为单精度的。这是一个非常简单的例子，但它说明了我们必须思考这类问题。\n\
  \n我们还必须考虑到许多库是 Nvidia 的私有代码。这意味着我们不能简单地更改代码：我们必须符合某些格式。上一节的一个例子是，当使用 `cuBLAS` 时，我们必须对乘法结果进行转置。有人可能会认为，大多数\
  \ `BLAS` 库都是如此，但这并没有改变它影响我们数据的事实。进一步探讨最后一段中提到的复数例子，在访问期间对双精度浮点矩阵的每个单独元素进行强制类型转换将将影响内存操作的效率，还会浪费大量的内存空间。即使如此，它也只能通过自定义内核来工作，因为\
  \ `cuBLAS` 对单精度和双精度浮点数、以及单精度和双精度复数都使用了不同的实现——而这些复数本身是分别基于单精度和双精度浮点数的。\n\n有人可能会认为我们可以对整个矩阵进行类型转换，但这将导致\
  \ `cuBLAS` 函数只使用每个数字的一部分，而另一半部分被视为一个新数字，导致产生垃圾结果。这是因为双精度浮点数使用八个字节，而单精度浮点数使用四个字节；这意味着当我们将一个\
  \ `double` 转换为 `float` 时，数字的半部分被丢弃了。但如果我们考虑一个双精度数字占据了两个单精度数字的空间，那么对类型转换后的数组的第二个位置的访问将是初始数字的后半部分，而不是第二个数字的第一部分。让我们用一张图来帮助理解：\n\
  \n![Figure 10.1 - Memory layout for double and float numbers](img/file98.png)\n\n\
  图 10.1 - 双精度和单精度数的内存布局\n\n正如我们在 `Figure 10.1` 中看到的，如果我们将位置视为浮点数，那么在索引 1 处得到的将是如果仍然是双精度数时位置\
  \ 0 处的剩余字节。\n\n为了解决这个问题，我们可以一个接一个将原始矩阵中的每个元素类型转换为新矩阵，但这将延长整个执行时间，反过来可能会消除使用优化库的全部用处！\n\
  \n但这并不意味着在这种情况下可以没有操作指南。我们可以问自己，我们是否正在创建一个具有新数据结构的新算法，这要求对内存访问进行更细粒度的控制，`或者` 我们是否正在创建一个需要成熟数值方法的加速版本的应用程序。这应该是第一层决策。假设我们已经发现我们只需要现有的数值方法，因此我们决定使用现有的库。然后是第二层问题：我们花在尝试将数据适应现有库格式上的时间是否超过了我们解决问题的时间？如果答案肯定的，我们应该考虑创建自己的内核，即使知道它不会是硬件优化的版本，因为毕竟尽管执行时间很重要，总开发时间也必须考虑在内。\n\
  \n幸运的是，到目前——由于我们已经最后一章——我们不仅开发了创建自定义内核所需的技巧，还学习了分析和调试代码所需的技能，以帮助确定可以做什么来改进瓶颈。\n\n\
  然而，没有人说禁止使用混合方法。如果我们的目标是创建一个可以根据现有数值方法和新算法分解的新程序，我们可以尝试结合两者的优点。我们可以使用流（streams）让内存传输与调用\
  \ `cuBLAS` 重叠，只要我们跟踪数据结构的哪些部分已经拷贝。\n\n将现有库的调用和对自定义代码的调用分离在不同的模块中是一个非常好的主意，这样我们就不会丢失哪个部分负责哪个计算阶段的追踪。\n\
  \n\n\n我们了解到在 GPU 和 CPU 之间移动数据可能是昂昂的，并且了解到可以通过将这些操作与计算重叠来缩短数据传输所需的时间。然而，在某些情况下，我们需要在两个\
  \ GPU 处理阶段之间执行一个中间顺序步骤，此时我们必须决定是将数据移出 GPU 显存，还是将我们的顺序代码移动到 GPU 中（尽管可能无法充分利用可用资源）。\n\
  \n尽管初看起来这可能有些违反直觉，但这是一个非常合理的问题。这并不是对错问题，而是关于什么执行速度最快以及相关的代价是什么——即使这种代价是可维护性。\n\n\
  根据我们在`第 8 章`中观察到的测量结果，需要记住的一个重要点是，通常我们可以通过正确地划分数据来隐藏计算时间，即总执行时间由数据传输到 GPU 所需的时间之和决定。因为在完成第一次数据传输后，我们启动了部分计算并将部分结果从\
  \ GPU 显存拷贝出来，这两个步骤与新输入数据块的拷贝同时发生。这意味着总时间由传输数据的时间决定；其他部分都比每个数据块的传输要快。在一种朴素的方法中，我们认为认为如果总是以这种方式重叠传输和计算，可能就不会产生区别，因为当我们完成整个循环时，结果已经在主机上，可以执行顺序步骤了。这里的注意事项是，传输时间通常比计算时间`更大`；这就是为什么我们用它来隐藏计算时间。如果我们在同一个一个大矩阵上添加处理许多步骤所需的时间，我们将一直处于优化的上限边界。\n\
  \n另一方面，如果我们在第一次内存传输时使用了重叠策略，稍后又使用了`已经`存在于 GPU 显存中的数据的顺序内核函数（kernel），那么总执行时间将大于再次拷贝新版本矩阵所需的时间——即使我们使用了重叠技术。\n\
  \n当然，目前没有简单的方法可以预知总执行时间，但考虑到 CUDA 核心时钟频率的差异，以及它们分支预测能力低于 CPU，我们可以尝试估计计算给定顺序算法所需的最小时间。利用这个估计值，我们可能会决定实现一个原型，以为执行时间提供证据。\n\
  \n如果数据依赖关系允许（这在 GPU 中并不总是如此），我们可能还会使用的另一种策略是：一旦部分结果被计算并传回主机，我们立即在这些数据块上启动顺序代码。这样，我们的顺序代码将与数据的可用性同步进行。然而，这种代码的编写和维护比在\
  \ GPU 上拥有顺序版本的代码复杂得多。\n\n![图 10.2：与顺序代码交互的策略](img/file99.png)\n\n图 10.2：与顺序代码交互的策略\n\
  \n在`图 10.2` 中，我们视觉化了这三种策略以便理解。在 a) 中，我们可以清楚地看到数据带回主机执行顺序步骤的影响。如果我们正在执行向量-矩阵乘法，结果将是一个向量，其数据传输`DtoH`（从设备到主机）量较小；而如果我们正在执行矩阵乘法，那么最终结果也将是一个矩阵，这将需要更多的数据传输，从而增加执行时间。\n\
  \n在 b) 中，我们看到在 GPU 上执行代码的顺序部分。对于单个步骤，这的执行时间可能比在 CPU 上长，但整体可能更快。\n\n最后，c) 展示了我们如何重叠块，以便在\
  \ GPU 和 CPU 上同时处理数据片段，使整个计算进展得更快。然而，在这种情况下会执行更多的数据传输，这可能会影响整体执行时间。\n\n在下一节中，我们将讨论将我们的\
  \ CUDA 加速代码与解释型编程语言结合作为测试的替代方案之一的优势。另一种替代方案是在 C++ 级别进行单元测试。\n\n## 使用 GTest 和 Pytest\
  \ 测试你的代码\n\n创建代码是第一步，但在确保一切运行正常之前，我们无法交付它。为了保证这一点，建立自动化、可重复的测试是非常好的主意，这些测试将反复执行，以确保任何新更改都不会在代码中引入回归。\n\
  \n> TDD 从测试代码开始\n\n> > 使用测试驱动开发（TDD）时，我们首先创建一个调用我们代码（假设是一个函数）的测试，然后创建一个简单返回 false\
  \ 或 null 的函数版本。使用该版本运行测试时，它会失败。然后我们实现使测试通过所需的最少代码。接着我们迭代这些步骤，创建多个测试，直到我们拥有功能完全且经过测试的可信赖的代码。通过对每个代码编写许多不同的测试，我们可以覆盖不同的错误场景、边界情况和极限，从而大幅提高我们的代码质量。\n\
  \n然而，我们不需要创建示例程序来运行代码；相反，我们可以使用 Google 的 `GTest` 等测试框架来测试 C++ 代码，如果我们想测试 Python\
  \ 代码，可以使用 `Pytest`，它可以轻松添加到我们的 Python 安装中。\n\n让我们从 GTest 开始，因为我们的大部分代码都在 C++ 领域。\n\
  \n### 在我们的代码中使用 GTest\n\n我们将使用那个相加向量的简单程序作为测试的示例代码，但像`第 9 章`一样，我们的项目现在会有更复杂的结构，分为包含头文件、源代码和测试代码的独立文件夹。这将使我们的测试代码能够我们的封装函数。我们在这里重点关注测试代码，因为内核只是相加数组元素。\n\
  \n```\n#include <gtest/gtest.h>\n#include \"../include/vector_add.h\"\nTEST(VectorAddTest,\
  \ SimpleAddition) {\n   int N = 5;\n   float A[N] = {1, 2, 3, 4, 5};\n   float B[N]\
  \ = {10, 20, 30, 40, 50};\n   float C[N] = {0};\n   vectorAdd(A, B, C, N);\n   for\
  \ (int i = 0; i < N; i++) {\n      EXPECT_FLOAT_EQ(C[i], A[i] + B[i]);\n   }\n}\n\
  ```\n\nGTest 的完整文档可以在此处找到：[`github.com/google/googletest`](https://github.com/google/googletest)。由于我们感兴趣的是如何将其与\
  \ GPU 代码结合使用，我们不会深入探讨其功能，而是观察调用是如何到达我们的 GPU 设备的。\n\n在此代码中，我们使用 `TEST` 宏来定义测试用例。第一个参数是测试套件名称，第二个参数是测试用例名称。到目前为止，测试方面还没有发生任何事情；我们需要做的是用已知值来验证函数调用的结果。\n\
  \n\n\n有很多方法可以断言一个值是正确的，但在这里，由于我们使用了浮点数，我们使用了 `EXPECT_FLOAT_EQ` 宏。\n\n这是编码部分，但我们仍然需要构建并执行程序，所以让我们来看看如何操作。\n\
  \n我们的 `CMakeLists.txt` 文件必须包含一些其他指令以允许创建测试，如列表所示：\n\n```cmake\ncmake_minimum_required(VERSION\
  \ 3.10)\nproject(VectorAddTest LANGUAGES CXX CUDA)\nenable_testing()\nfind_package(GTest\
  \ REQUIRED)\nadd_executable(vector_add_test test/test_vector_add.cu src/main.cu)\n\
  target_link_libraries(vector_add_test GTest::GTest GTest::Main cuda)\nadd_test(NAME\
  \ VectorAddTest COMMAND vector_add_test)\nadd_library(vector_add SHARED src/main.cu)\n\
  set_target_properties(vector_add PROPERTIES CUDA_SEPARABLE_COMPILATION ON)\ntarget_include_directories(vector_add\
  \ PUBLIC include)\n```\n\n首先注意到的是 `enable_testing()`，它用于初始化 CTest，这是 CMake 的测试基础设施。如果我们希望我们的项目受\
  \ CI/CD 流线的控制，CTest 将非常有用。\n\n> **CI/CD 流水线的优势**\n\n> CI/CD（持续集成/持续部署）流水线是一套自动化流程，允许开发人员构建、测试和部署代码更改。它从持续集成开始，我们将代码更改合并到仓库中，触发自动化构建和测试以尽早发现错误。持续部署（或交付）然后以最少的人工干预自动实现发布过程。这种流水线加速了开发周期，并且对于通过一致测试确保高代码质量至关重要。\n\
  \n我们使用 `find_package` 函数来获取 GTest 库安装的二进制文件和头文件的引用。一个有趣的点是，测试本身就是一个程序。它在内容上是专门的，但对于构建系统来说，它只是另一个必须与正确库编译并链接的可执行文件。\n\
  \n之后，我们通过调用 `add_test` 函数让 CTest 知道该测试的存在。\n\n我们在 `CMakeLists.txt` 中已有的部分是创建一个共享库，我们将在下一节讨论\
  \ Pytest 时使用它。\n\n我们可以像之前一样通过在构建文件夹上运行 `make` 来构建我们的测试和共享库。\n\n现在有两种执行测试的方法。第一种是直接使用以下命令调用测试：\n\
  \n```bash\n./vector_add_test\n```\n\n这将产生以下输出：\n\n```\nRunning main() from /build/googletest-j5yxiC/googletest-1.10.0/googletest/src/gtest_main.cc\n\
  [==========] Running 1 test from 1 test suite.\n[----------] Global test environment\
  \ set-up.\n[----------] 1 test from VectorAddTest\n[ RUN       ] VectorAddTest.SimpleAddition\n\
  [       OK ] VectorAddTest.SimpleAddition (88 ms)\n[----------] 1 test from VectorAddTest\
  \ (88 ms total)\n\n[----------] Global test environment tear-down\n[==========]\
  \ 1 test from 1 test suite ran. (88 ms total)\n[  PASSED  ] 1 test.\n```\n\n当我们想要执行单个测试套件时，这种方法是一个很好的选择。另一种方案是调用\
  \ CTest：\n\n```bash\nctest\n```\n\n这将生成输出：\n\n```\nTest project /workspaces/GPU-Programming-with-C-and-CUDA/ch10/gtest/build\n\
  \    Start 1: VectorAddTest\n1/1 Test #1: VectorAddTest ....................   Passed\
  \    0.11 sec\n\n100% tests passed, 0 tests failed out of 1\n\nTotal Test time (real)\
  \ =   0.11 sec\n```\n\n在提交代码到仓库之前，这种方法是一个很好的选择，因为它允许我们确定所有测试是否都通过。输出稍微简洁一些，因为这是在我们的\
  \ CI/CD 环境的构建服务器上运行的内容。在构建服务器上，我们希望运行所有可用的测试，并根据结果将构建标记为成功或失败。\n\n在下一节中，我们将学习如何使用\
  \ Pytest 为我们的代码添加另一层测试。\n\n### 在我们的代码中使用 Pytest\n\n在上一节中，我们为 C++ 代码生成了共享库。正如我们在第\
  \ 9 章中所了解的，这是将我们的函数暴露给 Python 的基础步骤，为了简单起见，我们将使用之前看过的 `ctypes` 方法。\n\n首先，我们创建一个模块来加载共享库，并使用\
  \ `ctypes` 声明所有将要使用的内容：\n\n```python\nimport ctypes\nimport numpy as np\nlib = ctypes.CDLL('../gtest/build/libvector_add.so')\n\
  lib.vectorAdd.argtypes = [\nnp.ctypeslib.ndpointer(dtype=np.float32, flags=\"C_CONTIGUOUS\"\
  ),\nnp.ctypeslib.ndpointer(dtype=np.float32, flags=\"C_CONTIGUOUS\"),\nnp.ctypeslib.ndpointer(dtype=np.float32,\
  \ flags=\"C_CONTIGUOUS\"),\nctypes.c_int\n]\ndef vectorAdd(a: np.ndarray, b: np.ndarray)\
  \ -> np.ndarray:\n   assert a.shape == b.shape\n   n = a.size\n   c = np.empty_like(a)\n\
  \   lib.vectorAdd(a, b, c, n)\n   return c\n```\n\n\n\n我们首先定义了并行性，并考虑了如何利用它来提高任务性能。起初不需要任何代码，只需要对日常生活中的活动进行一些反思，使问题变得清晰简单。随后，我们讨论了编程环境，由于\
  \ GPU 编程需要此类专门的工具包，我们提出了使用 `Docker` 来保持一切整洁有序的替代方案。这种方法具有双重趣味，因为它也适用于其他的编程环境。\n\n\
  下一章带领我们进入了简单程序的开发阶段，作为我们的第一个里程碑。我们执行了实际上使用 GPU 的代码！然而，这第一个程序并不是一个真正的并行程序，因此我们将重点转移，去研究那些能够真正利用\
  \ GPU 核心力量解决更大问题的程序。此外，我们还学习了如何在我们的 `GPU devices` 之间进出数据。\n\n此之后，有许多新概念需要解释，因此我们花了一些时间回顾了\
  \ `GPU programming` 的每一个方面，以确保在每个阶段都为接下来的内容奠定基础。然后，我们转向了并行算法的设计，以及如何充分利用我们的 `GPU\
  \ hardware`。我们讨论了这些解决编程问题的方法所面临的挑战和特点。\n\n然后，是检查性能优化策略的时候，同时也查看了性能分析工具，该工具帮助我们在应用优化技术时找到需要关注的热点。我们见证了\
  \ `shared memory` 的实际应用以及它对整体执行时间的影响。\n\n我们了解到，当通过使用 `streams` 重叠内存传输和计算时，可以实现另一层的性能提升。我们还利用性能分析器验证了应使用的最佳数据传输大小。\n\
  \n如果我们的代码无法与其他程序集成，那么它又有什么用呢？这个问题促使我们去探索如何将代码封装成库，以及如何从 `Python` 调用我们的 GPU 代码。\n\
  \n最后，在最后一个章节中，在我们已经了如何创建 GPU 程序之后，我们展望了眼前的道路。我们看到了了诸如 `cuBLAS` 和 `Thrust` 这样可以提高我们生产力的库，并讨论了决定何时应该编写自定义的\
  \ `CUDA kernels` 以及何时我们应该依赖现有库的策略。我们发现，将串顺序代码移动到 GPU 可能是很有用的，如果这样做可以避免消耗 GPU 带来的性能增益的数据传输。\n\
  \n本章最后对如何测试代码进行了简要介绍，包括在 `C++` 层次的测试，以及当代码已经作为共享库暴露时在 `Python` 层次的测试。\n\n到此，我们共同到达了通往\
  \ GPU 性能编程核心之旅的终点。希望你现在已经拥有了所需的知识，可以在自己的项目中探索并利用 GPU 的力量。旅途愉快！\n"
