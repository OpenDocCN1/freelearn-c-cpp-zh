  \ Code 询问我们将使用何种调试器。这是因为 VS Code 仅仅作为一个界面存在：繁重的工作仍由所选的调试器完成。我们将选择 `cuda-gdb`。一旦我们创建了\
  \ `launch.json` 文件（在 `.vscode` 文件夹中），界面就会更新，该文件也会向我们打开。我们仍然需要添加关于我们想要调试的程序的某些信息。文件上的初始代码如下：\n\
