- "# C++ 和 CUDA GPU 编程\n\n\n\n![cover.jpg](img/cover.jpg)\n\n1. 封面\n\n\n**欢迎阅读 Packt\
  \ 早期访问**。在本书发售之前，我们为您提供独家预览。写一本书可能需要几个月，但我们的作者今天就可以与您分享前沿信息。早期访问通过提供章节草稿让您洞察最新进展。目前的章节内容可能略显粗糙，但作者会随着时间推移对其更新。您可以抽读这本书，也可以从头到尾学习；早期访问的设计初衷就是灵活。我们希望您喜欢了解编写\
  \ Packt 书籍的过程。\n\n\n## 1 并行编程简介\n\n## 在 Discord 上加入我们的社区\n\n[`packt.link/deep-engineering-cpp`](https://packt.link/deep-engineering-cpp)\n\
  \n![](img/file0.png)\n\n欢迎来到**图形处理器** (**GPU**) 编程的世界！在讨论编程 GPU 之前，我们必须理解什么是并行编程以及它如何让我们的应用程序受益。正如生活中的一切一样，它也有自己的挑战。在这一章中，我们将探索并行编程的优缺点，为深入研究\
  \ GPU 编程奠定基础。因此，在第一章中，我们将讨论各种话题而不编写任何代码。通过这种方式，我们将为整个旅程的构建建立立基础。除了有用外，本章提供的信息对于理解\
  \ GPU 内部发生了什么也至关重要，我们稍后会讨论这一点。到本章结束时，你将理解为什么并行性很重要，以及在何时应用程序中使用它是合理的。在本章中，我们将涵盖以下主要主题：\n\
  \n* 软件中的并行性是什么，以及它为什么重要\n* 不同类型的并行性\n* GPU 架构概览\n* 比较**中央处理器** (**CPUs**) 和 GPU\n\
  * GPU 编程的优势与挑战\n* 如何高效地与朋友一起准备电影和游戏之夜（相信我）\n\n## 技术要求\n\n对于这一章，我们唯一的技术要求就是坚持阅读的意愿！\n\
  \n## 软件中的并行性是什么？\n\n并行编程是一种让计算机同时做很多事情的方法。但等一下——这不就是每天都在发生的事情吗？*是的，也不是*。今天大多数常见的处理器都能同时执行多个任务——我们指的是*同时*执行。然而，这只是并行软件的首要要求。第二个要求是让至少某些处理器核心以协调的方式在*同一个问题*上工作。让我们考虑一个例子。\n\
  \n想象你正在承担一项大任务，比如对一大堆书进行排序。与其独自完成，你请了一群朋友帮忙。每个朋友拿书堆中的一小部分并进行排序。你们同时工作，任务完成得要快得多。这类似于并行编程的工作原理：它将一个大问题分解成较小的部分，并使用多个核心同时解决它们。\n\
  \n当然，选择这个例子是因为它有一个特殊的特点：它是很容易并行化的，意味着我们可以感知到如何将大任务拆分为较小任务。并不是所有问题都能很容易分解为并行处理。我们面临的首要挑战之一是找到将问题分解为可以同时执行的小任务的方法。有时我们的算法中某些部分需要在单核上执行，而其他部分在我们可以分离并行任务之前处于空闲状态。这通常被称为*顺序部分*。是时候换另一个例子了。\n\
  \n假设你正和朋友一起过电影和游戏之夜。你们决定准备一些食物，为此你们去了超市。为了提高速度，你的朋友也一起来了，这样到达那里后每个人都可以同时选择多种食材——这就是并行部分。然而，由于你们坐同一辆车，无论车上同时有多少持执照的驾驶员，一次只能一个人开车。你总是可以说他们可以轮流开一段，但在这种情况下，去超市只会花费更长时间。\n\
  \n到达后，每人去不同的过道收集预定义的食材。一旦收集齐所有物品，就出现了另一个关键决策：每个人应该去不同的结账台用信用卡付款，还是如果他们只有一张卡，就应该一起排队？选择并行支付方法揭示了并行处理的另一个有趣方面。\n\
  \n即使任务是并行处理的（每个人在不同的结账台），执行时间也可能发生不可预测的波动。这意味着在任何时刻，不同队列以不同的速度移动，而那些已经付完食材钱的人最终可能需要等待他们的朋友（处理器）完成。一旦所有付款完成，就会接一个新的顺序部分：开车回家。这次，可能由另一个驾驶员执行这项任务，而其他处理器处于空闲状态，等待下一个任务的执行。在这里，我们收集每个处理器从超市获得的数据，并且必须将这些数据从一个地方移动到另一个地方。在这个小部分，并行性是没有用处的。\n\
  \n## 为什么并行性很重要？\n\n在很多情况下，我们要解决的问题规模会剧增。这时我们必须开始讨论更“严肃”的真实世界应用，例如天气预报、科学研究和人工智能。还记得我们开车去超市时提到可以每段路程更换驾驶员吗？这难道只会让我们浪费更多时间吗？这是由于**上下文切换**——我们必须找一个地方停车，然后换驾驶员，然后一直开车直到下一个停靠点。为什么再次谈论这个？因为在大多数时候，我们需要一个“严肃”的真实世界应用，使得投入研究并行编程的所有细节变得值得。一个例外可能是使用并行编程来加速视频游戏中的图形和物理处理；虽然这些应用对人类生命可能不是关键性的，但它们是相当严肃的。我们可以将视频游戏归类为“严肃”的模拟类别。让我们了解在软件中使用并行性所获得的一些益处。\n\
  \n### 加快任务执行\n\n将任务拆分为可以同时完成的小部分可以大大加快整个过程。我们现在有多个处理器同时处理问题的不同部分。\n\n### 资源利用效率\n\
  \n\n\n\n\n让我们回到超市的例子。如果我们所有的朋友都静静地坐在车里等其中一个人去买齐所有的食材，我们就没有高效地利用资源。然而，当每个人都负责收集清单上的某一部分时，我们就能更好地利用已经有的资源。这与计算机处理器及其多个核心是一致的——它们已经存在于那里了。当然，大多数现代处理器都能够降低时钟频率以减少能耗，但这并不能消除组件闲置带来的浪费。\n\
  \n### 处理大型数据集\n在数据科学、视频处理和科学研究等领域，发现规模增长非常快的问题是非常普遍的。许多此类问题使用矩阵来表示数据；当矩阵的大小增加时，处理它们所需的时间就会受到影响。通过使用并行性，我们可以确保在任何给定的时间点尽可能地执行任务，这使得处理大量数据的时间变得可以接受。\n\
  \n### 增强性能\n当我们缩短处理数据集所需的时间时，用户会将其感知为性能的提升。然而，这还有另一个方面。即使时间没有缩短，用户也可能通过更详细的模拟感知到性能的增强——即使用更多参数的模拟（正如我们之前讨论的，这意味着使用了更多的数据）。无论何种方式，这都会带来更好的性能和响应更快的应用程序。\n\
  \n### 启用先进技术\n通过使用并行性，我们进行模拟的能力允许科学家测试比以前多得多的假设。只有当模拟看起来指向一个可行且极具前景的方向时，我们才会用具体的材料进行尝试。这极大地降低了发现成本并加速了发现过程。\n\
  \n## 不同类型并行性的快速上手指南\n到目前为止，我们一直在谈论并行性。在本节中，在我们深入探讨 GPU 之前，我们将快速讨论不同类型的并行性——这正是大家期待的！\n\
  \n### 数据并行\n在不同的数据块上执行相同操作的过程，使得数据被不同的处理器核心同时等量处理——例如，处理一张图像以对其每个像素应用某些更改——这被称为`data\
  \ parallelism`。如果我们在超市买的食材之一是一大盒需要去皮的胡萝卜，我们可以自己去剥，也可以给每个朋友分发一个削皮刀，一起对相同的数据执行相同的处理过程，每个人负责一根独立的胡萝卜。\n\
  \n### 任务并行\n有时，我们有多个互不依赖的步骤，可以由不同的处理器核心执行。通常，一个较大的任务被分为若干较小的子任务，每个子任务都有非常明确的目标，它们对大任务做出贡献，但与其兄弟任务无关。如果我们重新回到那些刚从超市回来的朋友，我们可以将准备晚餐这个大任务分解为子任务，例如准备开胃菜、准备主菜和准备甜点。数据是带回家的食材；处理器将执行不同的操作。然而，为了技术上的准确，我们需要考虑相同的数据被用作并行子任务的输入，为了公平起见，假设我们今晚有两个菜单，但使用的是相同的食材。这样，我们就可以输入相同的数据并让不同的函数（烹饪方法）对其处理。\n\
  \n### 流水线并行\n我们还可以利用另一种并行安排方式。有时，某些数据处理依赖于之前处理的结果。如果我们有多个处理器核心可以使用，我们可以将每个处理步骤分配给一个核心，并创建一个流水线，在数据数据可用时利用并行性的优势。在水果加工厂，我们可以观察到这种并行性，当新的水果（比如苹果）运来加工和包装时。首先，苹果车运送大量水果并将其倒入人工水流中。水果在推过水流时被清洗；清洗后，一系列工人会对比水果进行检查以剔除坏苹果。筛选后，苹果按大小分开并移动到不同的传送带上，之后进行包装和密封，然后装箱并分发。这与视频处理的情况完全类似，其中每个视频帧等同于一小堆苹果。\n\
  \n## GPU 架构概览\n在完成了所有的烹饪之后，是时候改变一下了。让我们谈谈 GPU。首先，让我说明一下，我决定在与 CPU 比较之前先解释 GPU。我这样做是假设你已经对现代\
  \ CPU 的（基础）架构相当熟悉。GPU 起初被认为可以加速图形处理的输出，因为现代计算机的使用几乎完全在图形环境中进行。这与过去的计算有所不同，过去使用的字符界面对图形性能的要求并不高。然而，当人们发现能够处理计算机图形所需的计算的单元单元也可以用于任何可以用矩阵计算表示的内容时，转变发生了，而这正是线性代数的核心。在下一章中，我们将专门关注\
  \ NVIDIA GPU，但目前，我们将考虑一种通用设备。在这种情况下，GPU 拥有多个组件以便执行并行任务。需要注意的第一个重要的一点是，GPU 核心能够执行算术和逻辑操作（例如计算）。GPU\
  \ 核心不能用于程序控制；对于这一点，我们可以在`stream multiprocessor`中组织许多核心，它负责控制许多核心之间的指令执行。如`Figure\
  \ 1.1 (a)`所示，一个流多处理器有一个控制单元与`CUDA`核心协同工作，而在`Figure 1.1 (b)`中，我们可以看到单个 GPU 可以拥有许多流多处理器，这提升了它的高吞吐量：\n\
  \n![Figure 1.1 (a) a streaming multiprocessor with CUDA cores and (b) a GPU device\
  \ with many multiprocessors](img/file1.png)\n\nFigure 1.1 (a) a streaming multiprocessor\
  \ with CUDA cores and (b) a GPU device with many multiprocessors\n\n流多处理器与 CPU 核心之间有趣的区别在于，流多处理器为许多核心提供一个控制单元，而\
  \ CPU 核心为每个处理核心提供一个控制单元。如`Figure 1.2`所示：\n\n![Figure 1.2 (a) streaming multiprocessor\
  \ and (b) CPU](img/file2.png)\n\nFigure 1.2 (a) streaming multiprocessor and (b)\
  \ CPU\n\n我们还依赖于具有不同级别可用空间的内存层级。如`Figure 1.3`所示，我们从一个较大的、速度较慢的层级（全局内存）开始。这通常是你在 GPU\
  \ 盒上看到的数字。然后，我们有缓存级。在靠近核心的地方，我们有两种处理速度更快的特殊类型：共享内存（多个核心共享）和寄存器（每个核心特有）。我们将在书中学习如何处理这些内存；现在，我们只需要知道这些组件构成了我们的解决方案：\n\
  \n![Figure 1.3 – Memory hierarchy of a GPU](img/file3.png)\n\nFigure 1.3 – Memory\
  \ hierarchy of a GPU\n\n\n\n\n我们还依赖调度器，它在真实硬件内部组织并管理我们软件（以及配置）的执行。最后，为了确保所有部分都能高效通信，我们在内存和流式多处理器之间建立了高速互连。\n\
  \n### 单指令，多数据流 (SIMD)\n\n为了理解为什么 GPU 被设计成现在这样，我们需要思考它们被创建时是为了解决的问题：`图形处理`。向量运算和矩阵乘法是这里的主角，而高效处理这些操作的一种方法是：让不同的核心同时使用同一条指令处理多个数据单元。因此，我们拥有单条指令和多个数据单元——这是并行计算的常见模式之一。当然，在大多数情况下，我们没有足够的核心来一次性执行我们需要处理的`all`数据点，因此调度器会分配一组逻辑单元优先处理，然后是下一批，以此此类推，直到所有数据都处理完毕。但我们的数据是否超过了全局内存能容纳的量，由我们来判断。这个问题我们将在本书的后部分介绍。该设计的另一个有趣方面是，当有多个核心在执行且程序遇到条件语句时，会极大地影响整体性能。这是因为组会先执行第一个分支，然后执行第二个分支。并不是所有核心都会执行这两个分支，导致某些核心处于空闲状态而其他核心正在处理。我们可以通过重新思考解决方案来克服这一点。让我们考虑一个例子（不是关于烹饪的）。假设我们有大量的整数，需要将它们分为偶数和奇数，以便对它们进行不同的计算。我们需要一个分支来判断整数是奇数还是偶数，我们知道这会对性能产生影响。然而，重新思考提供数字的方式，我们可以使用每次递增二的\
  \ `for` 循环。我们也可以让一组核心从第一个奇数开始，另一组核心从第一个偶数开始。这个微小的改变允许处理过程在不被间断的情况下进行，从而提供更好的性能。\n\
  \n### 内存管理与访问\n\n正如我们之前提到的，GPU 拥有自己的内部内存，结果就是我们必须注意访问数据的方式。我们提到的另外一点是，全局内存是最慢的，因此如果我们执行直接在全局内存中加载和存储的操作，这将影响性能。所以，让我们谈谈如何管理内存访问，以释放设备的全部潜力。首先需要知道的是，设备内存与系统内存是分开的，因此我们需要将内存从计算机内存拷贝到设备的全局内存中，之后程序才能使用它。`Figure\
  \ 1.4` 显示了这种内存分离及其通过系统总线的连接：\n\n![Figure 1.4 – 系统主内存和 GPU 全局内存](img/file4.png)\n\
  \n图 1.4 – 系统主内存和 GPU 全局内存\n\n全局内存最访问，因为它的访问方式与访问主内存相同——只需引用主程序分配到全局内存的变量。另一方面，当你声明范围有限的局部变量时，它们通常被分配到寄存器中（大数组除外，它们反正也放不下）。在中间位置我们有共享存储，这是一种更快的内存形式，尺寸有限，被多个执行线程共享。通常，我们尽可能使用它来计算中间步骤，以推迟对存储最终计算结果的全局存储的访问。在离开本节之前，让我们考虑一个内存访问示例。在矩阵乘法时，我们用一个矩阵的行与另一个矩阵的列进行处理。然而，矩阵在全局内存中是连续分配的。这意味着对于列访问，所有的访问都会导致缓存未命中（cache\
  \ misses）：\n\n![Figure 1.5 – 连续分配中的矩阵](img/file5.png)\n\n图 1.5 – 连续分配中的矩阵\n\n考虑到矩阵在内存中是以行方向存储的——`C`\
  \ 和 `C++` 存储此类数据的方式——第二行的第一个元素将紧随上一行的最后一个元素。假设行的大小正好匹配我们的缓存块（cache block）的大小。当我们需要访问某行的元素时，它们最初可能不在缓存中，但在第一次加载后，我们就能直接从那里访问其他元素。但当我们想要访问行时，情况并非如此，因为每个元素在主内存中处于一个独立的位置，并且彼此之间相隔一个缓存块。一种简单的方法是将列（或至少是它的部分）加载到共享内存中，这样我们就可以针对这块预加载的数据，对另一个矩阵的所有行执行操作。结果是，通过细致地管理内存访问模式，我们可以避免瓶颈，这对于最大化内存带宽和最小化延迟至关重要。\n\
  \n### CPU 与 GPU 对\n\n现在我们对 GPU 的组织结构有了更多了解，可以将它们与 CPU 进行比较，以理解使用这些设备的影响。现代 CPU 通常由许多核心组成，因此它们能够通过线程执行并行应用程序。但虽然它们能够处理几十个线程，一个简单的\
  \ GPU 就可以处理数千个线程。正如之前提到的，GPU 核心在许多数据单元上执行相同指令，这与 CPU 核心之间有一个有趣的区别。在 CPU 上，每个核心都是一个完整的处理器，可以执行不同的应用程序，或者同一个并行应用程序的不同线程。这意味着\
  \ CPU 核心上的分支执行不会影响其他 CPU 核心执行的性能。另一个重要区别是，CPU 可以在任务之间快速切换，而 GPU 核心则由其流式多处理器控制。在内存管理方面，大多数我们不需要更改访问变量的方式。虽然这可能会影响程序的性能，但比例上比\
  \ GPU 的影响小得多。\n\n### GPU 编程的优势与挑战\n\n现在我们已经了解了更多关于 GPU 如何组织的信息，可以将它们与 CPU 进行比较，以理解使用这些设备的影响。现在是时候了解\
  \ GPU 如何增强我们的解决方案，以及如何克服这些优势带来的挑战了。既然我们已经提到了一些优势，让我们从这些挑战开始。\n\n#### GPU 挑战\n\n\n\
  \n\n最显而易见的挑战是，我们无法更改设备的组件，例如，我们无法升级它的内存。硬件限制将直接限制了我们能做的事情，以及我们如何需要拆分数据进行处理。我们还讨论了内存传输，如果我们必须不断在设备和外部之间移动数据，这很容易变成一种开销。通常，我们会尝试将数据移动到设备中，并在被迫移动更多数据之前尽可能地进行计算。另一个方面是，某些类型的计算并不适合在\
  \ GPU 内执行，例如分支过多或无法并行化的代码（还记得开车去超市的情况吗？）。如果作为将数据移出设备内存的备选方案，我们可能会选择在设备上执行顺序代码。此外，内存管理考虑是开发过程中一个贯穿的因素，因为错误的内存访问模式可能会带来性能损失，从而抵消使用\
  \ GPU 的初衷。这些限制显而易见：为 GPU 设备开发程序比为 CPU 编写传统的顺序软件要复杂得多，开发者必须投入时间来学习必要的知识。\n\n### GPU\
  \ 优势\n\n尽管开发 GPU 软件面临挑战，但其收益远大于挑战。最直接的优势是其巨大的并行性；即使是对于简单的 GPU，我们也能获得数百个处理器核心。如果我们能将解决方案建模为线性代数方法，那就更好了，因为这将允许我们在处理中实现高吞吐量，特别是当我们相应地规划了内存传输时。此外，现在有许多专门的库让开发我们的应用程序变得更容易；数学建模所需的大多数数值方法已经存在经过充分测试的库中。如果可以使用其中一个库，不仅将缩短开发时间，还将提高质量。此外，使用\
  \ GPU 实现高数据吞吐量的直接结果是更好的能源利用率——这是同时执行许多操作的另一个优势。\n\n## 总结\n\n在本章中，我们学习了关于并行软件及其主要模式的各种概念。我们学习了\
  \ GPU 的架构，并将 GPU 与 CPU 进行了比较，以理解为每种设备开发软件的差异。最后，我们讨论了在应用程序中使用 GPU 的挑战和收益。到目前，掌握了这些新知识，一个实用的附加好处是，我们可以更高效地与朋友组织活动，更快地去超市并据此准备开心菜。在下一章中，我们将学习如何配置环境以便开始编程。为了让一切都准备就绪，我们必须采取几个步骤。我们将讨论两种替代方案：使用\
  \ Docker 和直接在我们的机器上安装它。\n\n## 2 设置你的开发环境\n\n## 在 Discord 上加入我们的社区\n\n[`packt.link/deep-engineering-cpp`](https://packt.link/deep-engineering-cpp)\n\
  \n![](img/file0.png)\n\n在使用任何开发工具时，拥有一个可用于实验的功能性环境是至关重要的。在使用 GPU 时，正确设置设备变得更加重要。然而，不同的操作系统和发行版之间存在许多差异。我们将学习可以帮助构建程序的工具，以及它们所扮演的角色。此外，我们从何处获取操作系统的官方文档？作为参考，我们将使用\
  \ Ubuntu。本章从开始展示了如何使用 Docker 在配置管理方面让事情变得简单一点，然后通过讨论在我们的系统中直接安装工具来结束。在本章中，我们将涵盖以下主要主题：\n\
  \n* 开发环境的设置\n* 从何处获取官方文档\n* 如何使用 Docker 简化操作\n\n## 技术要求\n\n在本章中，我们将在计算机上工作，配置环境以使用我们的\
  \ GPU。对于操作系统，我们将使用 Linux。虽然可以使用任何发行版，但最好选择一个受 NVIDIA 官方支持的发行。在 Linux 开源发行版方面，我们有很多选择，但我们将选择\
  \ Ubuntu，因为它容易查找和安装，并且有许多在线帖子解决了常见问题。它也受到 NVIDIA 的官方支持。在编写时，Ubuntu 24.04 LTS 可用，但它尚未被列入\
  \ NVIDIA 安装程序对 `CUDA 12.4`（当前版本）的支持列表。相反，我们有 Ubuntu 20.04 和 22.04，其中任何一个都适用于我们的目的。我们需要一台带有\
  \ NVIDIA GPU 的计算机：它可以是你首选云服务上的虚拟机、一台笔记本电脑或台式机，但为了充分利用书中介绍的信息，拥有一个 NVIDIA GPU 是强制性的。另一个替代方案可能是使用云平台服务，它没有专用的全虚拟机，但提供了对\
  \ GPU 的支持，正如 Google Colab 一样，它提供了一个托管的 Jupyter Notebook 服务，并在一些配置后可以支持 `CUDA C/C++`\
  \ 编程。可以通过 [`colab.research.google.com/`](https://colab.research.google.com/) 访问服务，但其配置不在我们的范围内。\n\
  \n## 配置你的开发环境\n\n安装 NVIDIA 的专有显卡驱动程序是基础。这是一个重要的项目，因为 Linux 安装中与 NVIDIA GPU 配合的默认驱动程序是\
  \ `nouveau` 开源驱动，它可以执行图形但无法运行 `CUDA` 代码。我们将学习两种可能的配置。我们将按照一种对我们的机器侵入性较小的顺序进行；在提交直接安装之前，你将有机会对\
  \ `CUDA` 进行实验。在第一种配置中，我们将讨论通过 Docker 执行，在第二种配置中，我们将看到直接在我们的系统上安装一切。每种配置都有优缺点，我们也将进行讨论。为了让我们的策略更清晰，让我们总结一下：\n\
  \n1. 无论 `CUDA Toolkit` 如何，安装 NVIDIA 专有驱动都是必须——我们要先处理它。\n2. 关于开发环境（即 `CUDA Toolkit`），我们有两种路径：Docker\
  \ 安装或直接安装在我们的系统上。\n3. 为了确保在做出选择之前考虑两种替代方案，我们先介绍 Docker 路径，因为它的侵入性较小。\n4. 在简要查看 Docker\
  \ 及其优缺点之后，我们将看到如何利用它。\n5. 在此之后，我们将学习直接安装到系统中。\n\n现在我们已经概述了策略，在下一节中，我们将学习如何配置运行 `CUDA`\
  \ 程序所需的视频驱动程序。\n\n### 获取正确的视频驱动程序\n\n有几种方法可以确定你应该使用的驱动程序版本。最简单的方法是访问 NVIDIA 网站 ([`www.nvidia.com/Download/index.aspx?lang=en-us`](https://www.nvidia.com/Download/index.aspx?lang=en-us))\
  \ 并根据你的 GPU 和操作系统详细信息填写表单。表单将返回正确的驱动程序：\n\n![Figure 2.1 – NIVIDA site for device\
  \ driver selection](img/file7.jpg)\n\nFigure 2.1 – NIVIDA site for device driver\
  \ selection\n\n对于示例配置，我们得到了以下结果：\n\n![Figure 2.2 – NVIDIA site with device driver\
  \ result from our information](img/file8.jpg)\n\nFigure 2.2 – NVIDIA site with device\
  \ driver result from our information\n\n\n\n\n定义驱动程序版本后，我们可以直接下载它，或者按照安装驱动程序的说明结合信息进行更完整的安装。首要工作是使用以下命令更新系统：\n\
  \n```\nsudo apt update\nsudo apt upgrade\n```\n\n为了获取最新驱动程序，请添加显卡驱动的官方 Ubuntu `个人软件包存档`\
  \ (`PPA`)：\n\n```bash\nsudo add-apt-repository ppa:graphics-drivers/ppa\nsudo apt\
  \ update\n```\n\n然后我们可以使用以下命令安装在网站上找到的推荐驱动：\n\n```bash\nsudo apt install nvidia-driver-<version>\n\
  ```\n\n在我们的示例中，它应该是这样的。注意，对于 `apt` 软件包，仅使用主版本号：\n\n```bash\nsudo apt install nvidia-driver-550T\n\
  ```\n\n你可以尝试自动检测适用于系统的最佳驱动程序。可以使用此命令代替之前的之前的命令：\n\n```bash\nsudo ubuntu-drivers\
  \ autoinstall\n```\n\n两种方法都可以的。现在，我们必须防止开源驱动程序的加载。我们通过编辑一个特殊文件——使用 `nano` CLI 文本编辑器——来实现这一点，命令如下：\n\
  \n```bash\nsudo nano /etc/modprobe.d/blacklist-nouveau.conf\n```\n\n并添加以下行：\n\n\
  ```\nblacklist nouveau\noptions nouveau modeset=0\n```\n\n复制这些行后，按 `Ctrl + S` 保存并按\
  \ `Ctrl + X` 退出 `nano` 编辑器。然后执行以下操作：\n\n```bash\nsudo update-initramfs -u\n```\n\
  \n我们需要重启系统，因为需要从内存中移除开源驱动并加载新驱动。我们可以使用以下命令验证配置是否正常：\n\n```bash\nnvidia-smi\n```\n\
  \n此命令将显示有关当前 GPU 以及正在使用某些资源的进程的信息，如下：\n\n![图 2.3 – nvidia-smi 程序执行结果](img/file9.png)\n\
  \n图 2.3 – `nvidia-smi` 程序执行结果\n\n在这一节中，我们学习了如何为设备识别正确的驱动程序以及如何为安装准备 Ubuntu 准备，但这只是故事的一部分。现在我们需要通过该驱动程序使用该设备的开发工具。下一节将介绍我们之前提到的策略的第一条路径。\n\
  \n## Docker 概览\n\n如果你以前使用过 `Docker`，可能想跳过这一节。如果没有，请留下来，我们一起对这项技术进行总结概述。处理多个版本的库会产生无数问题和困难。创建一个隔离环境是一个极佳的替代方案，这正是\
  \ `Docker` 为我们做的事情。我们使用 `Docker 镜像` 作为受控环境，在其中我们可以拥有特定版本的库——即使这些库已经存在于基础系统中。另一个重要特性是可以为不同的软件版本拥有多个镜像。另一个概念是\
  \ `Docker 容器`，它是基于 `Docker 镜像` 的运行进程。当我们运行 `Docker 容器`时，可以从用户系统挂载一个文件夹，此功能允许我们拥有一个包含所有工具包并能从用户处构建源代码的开发环境，而无需直接安装所有构建工具。\n\
  \n### 使用 Docker 进行构建的优缺点\n\n在决定采取哪条路径之前，让我们了解面前面临的挑战程度。在关于容器化技术的*无休止*的争论中，这里列出了最重要的两个优点和缺点。让我们从缺点开始。\n\
  \n#### GPU 支持配置中的挑战\n\n在 `Docker 容器` 中设置 GPU 支持涉及额外的配置步骤，对于不熟悉该流程的人来说可能具有挑战性。幸运的是，本章描述了所有步骤！与基于\
  \ CPU 的容器不同，启用 GPU 加速需要 `NVIDIA Docker runtime`，它必须在宿主机上正确安装和配置。此外，并不是所有的 `Docker\
  \ 主机` 都支持 GPU 透传，这可能会限制基于 `CUDA` 的 Docker 容器运行的环境。这种限制在云环境或共享基础设施上可能特别成问题，因为那里的\
  \ GPU 资源可能无法直接可用或未被正确配置。尽管在大多数笔记本电脑上这可能不是问题，但确保宿主机支持 GPU 加速容器至关重要，这可能需要额外的步骤，例如验证硬件兼容性和更新驱动程序。\n\
  \n#### 调试中的挑战\n\n在 `Docker 容器` 内调试问题可能比在原生系统上更复杂，这会给开发者带来挑战。容器增加了一个抽象层，可能会掩盖问题的根源，使得诊断和解决问题变得困难。如果问题与容器化本身或容器与宿主机之间的交互有关，情况尤其如此。但正如我们在下一节中看到的，我们可以通过在容器内使用\
  \ `VS Code` 运行环境来克服这一点。此外，容器的临时可能会使调试过程。容器通常被设计为无状态，并且很容易重新创建，这意味着在调试期间完成的任何更改或配置都会在容器重启时丢失。因此，将日志持久化到挂载卷中可能是一个好主意；这样即使容器执行结束后也可以对其进行分析。在容器内调试\
  \ GPU 相关问题增加了另一层复杂度。GPU 驱动程序和 `CUDA 库` 需要在容器内正确配置并可访问，任何配置错误都可能导致微妙且难以追踪的问题。现在，让我们考虑使用这种方法的优势。\n\
  \n#### 隔离的益处\n\n`Docker 容器` 提供了一种非常有效的方法，将开发环境与宿主机隔离开。这种隔离确保了不同项目所需的各种依赖项不会相互冲突。对于基于\
  \ `CUDA` 的项目，这特别有趣，因为 `CUDA` 和其他库的版本可以在容器内被严格控制。这种隔离有助于保持宿主机系统的整洁，避免出现多次安装和潜在的版本冲突。此外，这种基于容器的隔离对于协作环境非常友好。工作同一个项目的开发者可以拥有相同的开发环境，消除了常见的“在我的机器上是好好的”这种场景。通过使用\
  \ `Docker`，每个团队成员可以使用相同的容器镜像，确保代码在所有开发设置中行为一致。另一个有趣的方面是，通过在容器内运行开发工具，有害代码影响宿主机系统的风险降到了最低。Docker\
  \ 容器在受限权限下运行，通过限制开发环境内安全漏洞的潜在影响增加了一层安全性。我们面临的这些限制唯一问题是它们会阻止对 `CUDA` 程序的分析，但正如我们在第\
  \ 4 节中将看到的，可以在需要运行分析器的特定时刻配置不同的运行时。\n\n#### 安装的易用性\n\n\n\n\n设置 CUDA 开发环境通常是一项艰巨的任务，特别是对于\
  \ GPU 编程或 CUDA 生态系统的初学者来说。Docker 通过允许我们使用来自 Docker Hub 等存储库的预配置 Docker 镜像，极大地简化了这一过程。这些镜像预装了\
  \ CUDA 和所有必要的依赖项，避免了复杂的安装程序。Docker 的便利性不仅适用于初学者，即使是经验丰富的开发者也能从简单的设置过程从中受益。我们无需为每个新项目配置环境或确保不同机器之间的兼容性而花费宝贵时间，只需拉取\
  \ Docker 镜像即可几乎立即开始编程。此外，Docker 易于设置，促进了更敏捷的开发工作流。在启动新项目或测试新技术时，在环境配置上节省的时间是非常可的。\n\
  \n### 准备我们的开发环境\n\n许多网站都提供了关于使用和配置 Docker 的信息，包括官方网站（获取 Docker 最新信息的权威资源）以及 NVIDIA\
  \ Docker 支持站点（该站点允许我们的容器“看到”我们的 GPU 设备）。URL 位于本节末尾。然而，为了简单起见，我们还将列出当前让开发环境准备就绪的命令。请注意，此列表未来可能会发生变化。\n\
  \n> 励志笔记\n\n> > 虽然这里概述的设置过程看起来相当复杂，但它只需要执行一次，所以请坚持下去，因为这是值得的！\n\n一如既常，让我们从更新系统开始，确保我们的系统是最新的：\n\
  \n```\nsudo apt update\nsudo apt upgrade -y\n```\n\n之后，我们需要安装一些所需的软件包。为了可读性，我们将其分为两行：\n\
  \n```\nsudo apt install -y apt-transport-https ca-certificates\nsudo apt install\
  \ -y curl software-properties-common\n```\n\n现在，我们需要添加 Docker 的官方 GPG 密钥。此命令不会显示任何消息：\n\
  \n```bash\ncurl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor\
  \ -o /usr/share/keyrings/docker-archive-keyring.gpg\n```\n\n将 Docker 存储库添加到我们的系统中。这同样不会显示任何消息：\n\
  \n```bash\necho \"deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]\
  \ https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable\" | sudo tee\
  \ /etc/apt/sources.list.d/docker.list > /dev/null\n```\n\n我们的系统现在知道有一个名为 Docker\
  \ 的东西，但我们还需要再次更新，以确保任何需要兼容的包都是正确的版本。为了做到，我们需要一次新的更新，如下：\n\n```bash\nsudo apt update\n\
  ```\n\n最后，我们已经到了准备安装 Docker 的这一步！\n\n```\nsudo apt install -y docker-ce docker-ce-cli\
  \ containerd.io\n```\n\n为了进行快速测试，我们执行以下命令。它将下载 Docker 镜像并运行它，在屏幕上打印内容：\n\n```bash\n\
  sudo docker run hello-world\n```\n\n注意 `sudo` 命令。这是必要的，因为我们当前的用户不在正确的执行组中，而该组直到现在才存在。为了消除使用\
  \ `sudo` 的需求，我们需要如下所示配置用户：\n\n```bash\nsudo usermod -aG docker $USER\n```\n\n为了使此更改生效，我们需要注销并重新登录。现在我们可以不使用\
  \ `sudo` 再次运行 `hello-world`：\n\n```bash\ndocker run hello-world\n```\n\n还需要理解的另外一点是，Docker\
  \ 是我们操作系统的服务运行的。让它在计算机启动时自动启动是一个好主意。我们使用以下命令进行配置：\n\n```bash\nsudo systemctl enable\
  \ docker\nsudo systemctl start docker\n```\n\n请深呼吸；我们已经实现了一个重要的里程碑：我们的系统能够执行 Docker。它也可以用于其他类型的系统。做得好！但现在我们需要回到工作中，因为如果我们想让\
  \ Docker 使用 GPU，还有更多工作要做。我们必须安装 NVIDIA 的软件，允许我们在容器内部使用 GPU。为了做到，我们需要像添加 Docker 那样向系统添加一个新的新的存储库：\n\
  \n```bash\ncurl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo\
  \ gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg \\\n\
  \  && curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list\
  \ | \\\n    sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg]\
  \ https://#g' | \\\n    sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list\n\
  sudo apt-get update\n```\n\n之后，我们可以安装软件包：\n\n```bash\nsudo apt install -y nvidia-container-toolkit\n\
  ```\n\n我们还需要定义 NVIDIA 运行时：\n\n```bash\nsudo nvidia-ctk runtime configure --runtime=docker\n\
  ```\n\n现在我们需要重启 Docker 服务以使用此新功能：\n\n```bash\nsudo systemctl restart docker\n```\n\
  \n让我们运行一个测试以确保所有安装均正常工作：\n\n```bash\ndocker run --rm --runtime=nvidia --gpus all\
  \ ubuntu nvidia-smi\n```\n\n我们所做的是通知 Docker 应该让系统上所有的 GPU 对容器可用。`ubuntu` 镜像从 Docker\
  \ Hub（各大公司在此发布其软件）下载，`nvidia-smi` 命令在运行容器内执行。我们得到如下：\n\n![图 2.4 - 容器内的 nvidia-smi](img/file10.png)\n\
  \n图 2.4 - 容器内的 nvidia-smi\n\n结果与之前非常相似；唯一的区别是没有进程正在运行，而且这与容器有关。这是我们的第二个里程碑：拥有能够运行\
  \ CUDA 软件的 Docker 安装。\n\n#### 官方网站\n\n以下是包含我们刚刚所操作内容的（当前）网站地址，未来参考时可能需要：\n\n*  \
  \ 官方 Docker - [`www.docker.com/`](https://www.docker.com/)\n*   官方 NVIDIA Container\
  \ Toolkit - [`github.com/NVIDIA/nvidia-container-toolkit`](https://github.com/NVIDIA/nvidia-container-toolkit)\n\
  \n## CUDA Toolkit 安装\n\n现在我们知道如何在隔离模式下使用 CUDA Toolkit，让我们学习如何在机器上直接安装它。这种方法提供了更大的灵活性，但也意味着需要处理在系统中的不同版本库。首先，我们需要从\
  \ NVIDIA 官方网站 [`developer.nvidia.com/cuda-toolkit`](https://developer.nvidia.com/cuda-toolkit)\
  \ 下载 Toolkit，选择我们的操作系统、硬件架构、发行版和版本。在我们的案例中：Linux，x86_64，Ubuntu，20.04。之后，我们会看到三个选项：deb\
  \ (local)、deb (network) 和 runfile (local)。最简单的方法是使用本地 `.deb` 文件，当选择此选项时，我们将看到以下命令：\n\
  \n\n\n\n\n```\nwget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-ubuntu2004.pin\n\
  sudo mv cuda-ubuntu2004.pin /etc/apt/preferences.d/cuda-repository-pin-600\nwget\
  \ https://developer.download.nvidia.com/compute/cuda/12.5.1/local_installers/cuda-repo-ubuntu2004-12-5-local_12.5.1-555.42.06-1_amd64.deb\n\
  sudo dpkg -i cuda-repo-ubuntu2004-12-5-local-12.5.1-555.42.06-1_amd64.deb\nsudo\
  \ cp /var/cuda-repo-ubuntu2004-12-5-local/cuda-*-keyring.gpg /usr/share/keyrings/\n\
  sudo apt-get update\nsudo apt-get -y install cuda-toolkit-12-5\n```\n\n该页面提到了 CUDA\
  \ 驱动的安装，但那是我们安装的第一步，所以我们可以跳过该步骤。运行完安装步骤后，建议重启系统，之后，我们可以像之前使用 Docker 那样用 `nvidia-smi`\
  \ 测试我们的安装情况。不过，使用以下命令也是一个好主意，它可以打印 CUDA 编译器的版本：\n\n```\nnvcc -V\n```\n\n这将显示 NVIDIA\
  \ 编译器的版本。直接安装 CUDA Toolkit 时的步骤较少，因为我们不需要安装 Docker。但请记住，在我们的系统上直接安装 CUDA Toolkit\
  \ 意味着我们可能需要根据项目的需求处理某些库的不同版本。这种版本管理在 Docker 方法中不是太需要担心的问题，因为所有内容都封装在 Docker 容器镜像中。如果我们想在不同版本之间切换，只需要运行不同的容器镜像即可。\n\
  \n## 总结\n\n在本章中，我们学习了运行 CUDA Toolkit 的各种选项。种方法是基于 Docker 的，在考虑了它的优缺点后，我们概述了涉及配置的步骤。配置完成后，我们能够在正在运行的容器内部查询\
  \ GPU 系统。第二种方法是将 CUDA Toolkit 直接安装到我们的系统中。这种方法稍微具有侵入性，未来我们可能需要处理多个版本，但意识到这种可能性也是重要的。完成这些工作后，是时候系好安全带了，因为在下一章中，我们将编写第一个\
  \ CUDA 程序！\n\n## 第 5 章：深入了解 GPU 世界\n\n## 在 Discord 上加入我们的社区\n\n[`packt.link/deep-engineering-cpp`](https://packt.link/deep-engineering-cpp)\n\
  \n![](img/file11.png)\n\n现在我们已经领略了带有稍大应用程序的 GPU 编程，是时候更详细地学习让 GPU 能够提供如此速度优势的原理了。首先，我们将学习映射到\
  \ GPU 核心的概念以及我们如何处理这些概念。\n\n之后，我们将介绍与现代 GPU 如何同时执行更多任务相关的进阶概念。最后，我们将首次查看如何在 GPU\
  \ 环境内部提高内存访问时间，并考虑为什么这很重要。\n\n凭借前几章节打下的坚实基础——我们已经学会了如何编译和运行 CUDA 程序，并学习了内存传输对性能的影响——我们完全能够更详细地理解创建一个高性能\
  \ GPU 应用所必需的细节。到本章结束，你将掌握代表 GPU 执行的抽象、一些加速性能测量的高级技术，以及如何思考内存使用。\n\n因此，本章的主要主题是：\n\
  \n*   线程（Thread）、块（block）和网（grid）概念\n*   异步数据传输\n*   流（Streams）\n*   事件（Events）\n\
  *   共享内存（Shared memory）\n\n## 技术要求\n\n这将是一个具概念性的章节，我们将深入探讨管理 GPU 领域题。但不要担心，更多代码在路上！\n\
  \n## 理解线程、块和网的概念\n\n在`第 4 章`中，我们终于执行了真正的并行 CUDA 程序，并看到启动内核（kernel）需要配置。不仅如此，这种启动配置也是程序本身的一部分。仔细观察向量加法程序，我们看到\
  \ CPU 版本有一个 `for` 循环，而 GPU 版本则用配置来代替这个 `for` 循环。因此，我们需要讨论决定执行如何发生的概念。线程、块和网共同工作，但让我们先单独了解它们。\n\
  \n### 线程 (Threads)\n\n`thread`（线程）是 CUDA 中的基本执行单元，每个线程都有自己的 `unique ID`（唯一 ID），允许它独立访问数据的特定部分。对于给定的问题，我们定义了一组可以处理所需数据的线程。线程\
  \ ID 可以是一维、二维或三维的（`threadIdx.x, threadIdx.y, threadIdx.z`），取决于定义的块配置。\n\n每个线程都有一些本地内存和寄存器。每个局部变量都分配到寄存器中，但每个线程的寄存器数量是的，所以如果我们定义了太多局部变量，可能会导致\
  \ `register spilling`（寄存器溢出），此时必须将变量分配到访问速度较慢的本地内存中。\n\n在我们看不的地方，每个流多处理器（`SM`）上的\
  \ `thread scheduler`（线程调度器）管理 `warps`（线程束）的执行——这是对硬件组织和控制的底层分组的说法。\n\n### 块 (Blocks)\n\
  \n块（block）是线程的高级分组，它们共同执行内核，并同步和共享内存。我们可以将块视为线程的容器。与线程一样，块可以按一、二或三维组织（`blockIdx.x,\
  \ blockIdx.y, blockIdx.z`）。这提供了一种灵活的方法，将线程和块映射到图像处理或科学模拟等多维问题。\n\n> 块和线程束不是一回事！\n\
  \n> 请记住，虽然两者都是线程组，但块是由我们在调用内核执行时定义的。另一方面，线程束是硬件为组织线程执行定义的底层分组。线程束拥有 32 个线程，它们同时执行相同的指令。\n\
  \n截至目前，每个块最多包含 1024 个线程，这是硬件的一种的一种限制。它影响了我们构建问题的方式。记住，我们拥有的内存是有限的，因此分配给块的线程越多，它们共享以及定义局部变量的内存就越少。\n\
  \n块的一个重要特性是它们允许线程通过共享内存进行协作。它们可以使用这种特殊内存来共享中间结果或相互通信，只要它们位于同一个块中。\n\n> 共享内存是一项强化功能！\n\
  \n> 共享内存是一种特殊的片上内存，靠近核心，并在块的线程之间共享。由于它比全局内存快得多，因此使用它来提高性能至关重要。\n\n像这样组织结构会有什么区别呢？嗯，系统可能会以任何顺序在可用的流多处理器上调度块，唯一的限制是不同块之间的线程将无法相互通信。\n\
  \n在块内部，线程可以通过使用 `__syncthreads()` 函数进行同步，该函数会使所有线程在该调用点处等待，直到所有线程都到达该处。我们将在`第 6\
  \ 章`中的一个具体的示例中使用它。\n\n### 网 (Grids)\n\n\n\n\n\n不出所料，网格（grid）用于执行内核（kernel）的块（blocks）集合。网格组织了许多可以在流多处理器（streaming\
  \ multiprocessors）上独立执行的块。再次，就像线程和块一样，网格也可以是一维、二维或三维的取决于问题的结构（`gridDim.x, gridDim.y,\
  \ gridDim.z`）。\n\n但这种对组织层级的痴着意味着什么？让我们记住，硬件加速计算的一种方式是尽可能地并行化代码某些部分的执行。在第 4 章中，我们看到向量加法程序没有使用循环来遍历所有数据点，这正是因为*硬件为我们处理了这些*。通过使用这三层各三个维度的组织结构，我们确保可以为每个执行线程分配一个唯一的线程\
  \ ID，该 ID 将直接映射到它需要处理的数据，使其能够随时准备好执行。\n\n> **合适的尺寸**\n> 每个块的线程数称为块大小（block size），网格中的块数称为网格大小（grid\
  \ size）。在刚开始可能会有点困惑，但这些尺寸至关重要。块维度中的数字定义了线程数量，截至本文编写最多可以为 1024。然而，块的数量将由网格的维度定义！\n\
  \n值得停下来回想一下，GPU 的原始目标是处理*图形*问题。这有助于我们理解为什么使用三维结构是完全合理的。我们正在将 GPU 用于通用目的，这一事实不应让我们忽视它们的起源。\n\
  \n### 整合一切\n\n在继续讨论如何定义我们应该使用的线程数和块数之前，值得回顾一下这些配置是如何协同工作的。\n\n我们使用 `blockDim` 来定义线程数以及它们在块中的排列方式，例如：\n\
  \n```\ndim3 blockDim(1024, 1, 1)\n```\n\n以及\n\n```\ndim3 blockDim(32, 32, 1)\n```\n\
  \n这两者将给我们提供相同数量的线程，因为 `blockDim.x * blockDim.y * blockDim.z = 1024`。然而，第一个示例是处理向量的好方法，而第二个示例更适合处理矩阵。\n\
  \n所以，我们需要注意的是，定义块维度的值被调度调度器用于分配线程，因此对于每个 `threadIdx.x`、`threadIdx.y` 和 `threadIdx.z`，我们都有不同的值。\n\
  \n在 1D 情况下，线程的全局索引由：\n\n```\nint globalIdx = blockIdx.x * blockDim.x + threadIdx.x;\n\
  ```\n\n而在 2D 情况下，线程将有两个全局索引：\n\n```\nint globalIdx_x = blockIdx.x * blockDim.x +\
  \ threadIdx.x;\nint globalIdx_y = blockIdx.x * blockDim.y + threadIdx.y;\n```\n\n\
  `gridDim` 定义块数量的方式也是如此；这为什么我们在我们在之前的全局索引计算中使用了 `blockIdx.x` 和 `blockIdx.y`。\n\n\
  ### 启动配置\n\n理解线程、块和网格是理解我们用于启动内核执行的配置的关键。当我们在第 4 章中进行向量加法时，我们选择每个块使用 256 个线程，之后我们必须计算需要多少个块来容纳所有的数据点。对于大小为\
  \ 100,000,000 的向量，我们将：\n\n`100,000,000 / 256 = 需要 390,625 个块`\n\n然而，我们并不总是有容易的数字，在这种情况下，我们使用更通用的公式来找到所需的块数：\n\
  \n我们使用整数值是为了忽略小数点后的任何内容。这等同于使用 `floor` 函数，但该函数仍然返回一个浮点值，该值需要转换为整数。随之而来的是，我们需要在内核内部计算我们的唯一线程\
  \ ID。我们通过获取当前的块 ID 和线程 ID（由运行时提供）并执行一个简单的计算来实现这一点：\n\n```\nuniqueId = (blockDim.x\
  \ * blockIdx.x) + threadIdx.x\n```\n\n在这里，我们使用 `.x` 来指代内核启动配置期间指定的块或网格的维度。由于我们的向量加法示例是一个一维问题，使用单个维度通过块大小和网格大小启动内核是有意义的。\n\
  \n每个块 256 个线程是平衡性能和占用率（occupancy）的常见选择，占用率是一个关键概念，指的是正在执行的线程束（warp）数量与流多处理器可以支持的最大\
  \ warp 数量之间的比例。占用率值越高，性能越高，但仅限于某一点点。这是因为高占用率可以通过用就绪的 warp 交换等待的 warp 来帮助隐藏内存延迟。然而，如果我们有太多等待的\
  \ warp 或太多的就绪 warp，我们将看到性能下降。\n\n> **足够大的的问题**\n> 有一个奇特的事实，如果你测量处理一个与你的 GPU 上 CUDA\
  \ 核心数量匹配的数据程序的执行情况，其结果将比那些超过可用处理器数量的更大问题的结果要差。起初这似乎有点违背直觉，但有很多因素在起作用让 CUDA 程序在设备上执行。例如，我们必须拷贝入和拷贝数据。如果问题太小，这种工作并不可值。\n\
  \n现在我们理解了所有的索引方法，以及如何定义内核执行的配置，我们准备好在下一节中学习 CUDA 如何帮助提高传输的性能。\n\n### 异步数据传输\n\n\
  正如我们在第 4 章中看到的，当从设备进拷贝数据时，我们需要指定数据移动的方向。然而，在我们的第一个示例中，我们等待拷贝整个数据集后才处理。幸运的是，有两件事共同工作提高性能：异步数据传输和流（streams）。我们将先看异步数据传输。\n\
  \n异步意味着一旦数据传输开始，控制就会立即返回给 CPU，然后 CPU 可以运行其他代码，例如，收集我们大集的另一部分。我们用于此的函数是 `cudaMemcpyAsync`，它的命名让我们非常熟悉，因为我们学过\
  \ `cudaMemcpy` 的同步版本。\n\n为了清晰起见，让我们考虑一个更具体的例子。如果我们从存储器读取数据，它可能需要一段时间（取决于我们的设备）。即使是现代\
  \ SSD（截至本文编写 NVMe 内存是最快的消费者级存储），它仍然比内存慢。这意味着我们可以加载部分数据并使用异步数据传输将其传输到设备，在调度传输后，我们可以开始从磁盘加载下一块数据。通过这种方式叠加操作，我们可以让数据传输时间变得隐形。很聪明对吧？\n\
  \n进一步探讨我们的示例，让我们把处理假设数据的时间整合在一起。\n\n场景 1 – 原始方法：\n\n1 – 从磁盘加载数据\n2 – 将传输到设备\n3 –\
  \ 在设备上处理数据\n4 – 将数据传回主机。\n\n这种场景由图 5.1 所示，我们在图中看到只有在使用大量处理核心时可能获得性能收益，但仅限于处理阶段。\n\
  \n![Figure 5.1: A naive approach](img/file12.png)\n\nFigure 5.1: 原始方法\n\n场景 2 –\
  \ 异步方法：\n\n\n\n\n\n## 数据传输与处理\n\n1 – 从磁盘加载分块数据\n2 – 使用加载的数据启动异步传输\n3 – 使用阻塞调用检查数据是否传输完成\n\
  4 – 通过内核异步调用在设备上处理数据\n5 – 开始从磁盘加载下一分块数据\n6 – 将部分结果从设备传输到主机（host）\n7 – 重复上述步骤直到所有数据处理完毕\n\
  \n在 `图 5.2` 所示的场景中，我们探索了 GPU 的其他特性以获得更高的收益。\n\n![图 5.2: 数据传输与处理的重叠](img/file13.png)\n\
  \n图 5.2: 数据传输与处理的重叠\n\n通过这个稍微复杂的第二个场景，我们实现了更大程度的重叠，这提升了整体性能。在这个场景下，我们还可以做的进一步提升性能的另一件事是执行从磁盘的异步数据加载。这与\
  \ GPU 无关，超出了我们目前的讨论范围，但基本上，我们可以拥有一个 CPU 线程池，等待数据被加载到某个共享数组中，主线程在数据从磁盘完全加载后即可使用它。\n\
  \n然而，有一个陷阱——哪不是总是如此呢？！——那就是如果我们使用异步数据传输，我们必须在在使用数据*之前*检查它是否已完成，否则我们可能会使用不完整或损坏的数据。这很有道理，对吧？我们使用\
  \ `cudaStreamSynchronize` 函数来确保传输已完成。\n\n在每一篇关于 GPU 编程的文本中都会出现一句话，内容类似于：\n\n“你应当减少计算中数据传输的量”\n\
  \n作为 GPU 程序员，我们为此苦挣、受苦并斗争，思考如果我们不在设备和主机之间拷贝数据，该如何才能获得任何结果呢？因此，让我们通过理解这一点让心灵从这种诅咒中解脱出来：我们将根据需要使用尽可能的数据传输。然而，我们会非常仔细且留心地考虑如何优化到最后一个字节，以获得更好的性能。这意味着，例如，我们不会盲目地拷贝数据，比如一个接一个地拷贝数组数组，因为拷贝单个大数组的性能比通过许多小操作拷贝相同字节的字节要好。但是，我们不会在需要时剥夺自己拷贝数据的权利。另一个需要考虑的因素是，是否可以尽可能地保留已经拷贝到设备的部分数据，并简单地拷贝其他数据以与现有数据进行处理；在可行的情况下，这也能提高性能。\n\
  \n我们之前提到的另一个概念是流（streams）。在本章的后面我们有一个专门的章节来介绍它，所以现在只需说，只要我们仔细地将它们分开，就可以让数据传输*和*计算同时发生。\n\
  \n既然我们谈了这么多内存和性能，现在是时候记住，在大多数情况下，我们在 RAM 中分配的内存是*可分页的**pageable*），这意味着操作系统可能会收回这部分内存，将数据保存到磁盘并让其他应用程序使用该资源。这意味着如果我们想传输一段位于已发送到磁盘的内存页中的数据，操作系统必须在我们开始传输之前将该数据移回\
  \ RAM。\n\n为了避免这种情况，可以使用页锁内存（page-locked，又名锁页内存/pinned memory），这是一种无法交换到磁盘的特殊内存类型，这意味着当我们需要将分配在该块内存中的数据传输到`device`时，它将是随时可用的。此外，页锁内存支持一种称为`直接内存访问`（`DMA`）的特殊功能，它允许数据传输在不涉及\
  \ CPU 的情况下发生——这意味着速度。\n\n要使用这种特殊内存，我们需要使用 CUDA 函数 `cudaHostAlloc` 或 `cudaMallocHost`\
  \ 在主机上分配内存，这些函数会分配锁页内存。这种内存可以用于同步和异步内存传输。\n\n然而，请记住，能力越大，责任越大（我想我们会在整书中多次看到这一点）。过度使用锁页内存的缺点是限制了整个系统的可用内存量，因此可能会影响整体性能。\n\
  \n在进入下一个章节之前，还有两个特殊的特性需要讨论：\n\n*   **统一内存（Unified Memory）**：这是 CUDA 的一项内存管理功能，它抽象了我们一直讨论过的所有内存处理。它向程序暴露了一个统一的内存空间，使得当我们需要使用内存时，CUDA\
  \ 运行时将根据需要确保内存页出现在设备或主机上。其缺点是它可能会导致多次不同粒度的内存传输，正如我们现在所知道的，这并不是处理性能的最优方法。但是，它确实简化了内存管理任务。\n\
  *   **零拷贝内存（Zero-Copy Memory）**：简单来说，零拷贝针对的是我们需要访问 GPU 空间内数据的情况。与其执行拷贝操作，不如你直接访问主机内存，但当数据集较小时这种方法更好，因为等待内存传输会导致更大的性能惩罚。\n\
  \n在下一节中，我们将继续关于 CUDA 流的讨论，以及我们如何将它们与刚刚学习的所有内存资源结合使用，进一步缩短执行时间。\n\n## 使用流并行化\n\n\
  现在我们将讨论帮助提高 CUDA 程序性能的第二个特性：流（streams）。\n\n我们可以将流想象成队列，我们在其中入队内核执行和内存传输，然后它们会按照被添加的顺序在\
  \ GPU 上顺序执行。有一个**默认流**（default stream）接收索引为 0，它在 ways 没有为执行定义特定流时使用。默认流的一个重要特性是它是同步的，这意味着每个操作在下一个操作开始之前都会完成。这简化了行为，但限制了性能。\n\
  \n然而，我们可以定义我们自己的非默认流，并在不同的流上执行不同的操作，从而实现内存传输和计算的重叠。由于流没有绑定任何流处理器或内存通道，任何可用的流都会执行请求的操作。\n\
  \n我们必须记住，流的数量并不直接取决于硬件，尽管它取决于两个*取决于*硬件的因素。第一个是允许到 GPU 的连接数，它由环境变量 `CUDA_DEVICE_MAX_CONNECTIONS`\
  \ 控制。该值通常设置为 8，指的是我们将使用的 PCI 连接数。第二个是存在的异步引擎数量；高端 GPU 可能支持多到七并发流，而消费级 GPU 可能支持三个并发流。\n\
  \n流的另一个强大特性是它们支持同时进行两次内存传输。条件是其中一个是从主机到设备，另一个是从设备到主机。这意味着我们可以同时在流 1 上进行主机到设备的内存传输、在流\
  \ 2 上执行内核以及在流 3 上进行设备到主机的内存传输。遗憾的是（截至目前），我们无法在不同的流上并行多个从主机到设备的内存传输。\n\n注意我们在示例中使用了\
  \ 1、2 和 3 作为流。这是因为流 0 是用于同步执行的默认流；当我们想要异步地最大化性能时，使用非默认流是非常重要的。\n\n要创建非默认流，我们使用 `cudaStreamCreate()`\
  \ 来处理特定操作，而 `cudaStreamDestroy()` 用于流不再需要时释放与其关联的资源。\n\n\n\n\n\n需要注意的是，当使用这些优秀的非默认流时，操作是异步执行的，这意味着在我们尝试使用任何上一个操作的一部分之前，必须检查该上一个操作是否已经完成。有特定的资源来控制这一点，包括所谓的`events`（事件）。尽管我们在`第\
  \ 4 章`中测量执行时间时曾浅浅地接触过 CUDA 事件，但我们将在下一节中学习到更多内容。目前，只需知道可以使用它们来保证异步流执行时的逻辑健壮性就足够了。\n\
  \n同步是使用 CUDA 流的一个至关部分，因为它确保了相互依赖的任务按照正确的顺序执行。在 CUDA 中，同步是指控制特定流相对于其他流何时应该开始执行任务，或者\
  \ CPU 何时应该等待流完成。如果没有适当的同步，你可能会遇到竞态条件，即数据在操作完全完成之前就被读取或修改，从而导致结果错误。\n\n同步流的主要函数是\
  \ `cudaStreamSynchronize()`。该函数会阻塞主机（CPU），直到指定流中的所有任务都完成。当你需要确保流在继续执行程序的其他部分之前已完成了其所有任务时，这个函数非常有用。例如，在其中一个流中启动内核并在另一个流中执行内存传输后，你可能希望同步它们，以确保在尝试进一步计算之前数据是可用的。\n\
  \n另一个常用的函数是 `cudaDeviceSynchronize()`，它强制主机等待 GPU 上所有流中之前启动的所有操作完成。与 `cudaStreamSynchronize()`\
  \ 相比，`cudaDeviceSynchronize()` 是更全局的同步点，但它通常被认为效率较低，因为它停止了整个设备而不是特定的流。因此，应该谨慎使用，并仅在必要时使用。\n\
  \n在下一节中，我们将继续讨论事件以及它们如何帮助我们 CUDA 编程和同步。\n\n跟随事件\n\nCUDA 事件的两个主要目的是测量性能和辅助同步。它们通过提供跟踪某些操作相关执行时间的机制来实现这一点。具体到同步，我们可以等待一个事件完成，通过此，运行在流中的任务就有可能等待位于不同流中的另一个任务的完成。\n\
  \n事件使用 `cudaEventCreate()` 函数创建，该函数为事件分配必要的资源。\n\n在创建事件时，我们可以指定特定的标志位来修改事件的行为。例如，`cudaEventBlockingSync`\
  \ 标志确保事件将阻塞等待它的 CPU 线程，直到事件完成。相反，`cudaEventDisableTiming` 标志允许事件仅用于同步而不进行计时测量。\n\
  \n一旦事件不再需要，释放与其相关的资源是至关重要的。这是通过 `cudaEventDestroy` 函数实现的，它接受事件作为参数。\n\n通过 CUDA 事件，我们拥有了一种测量\
  \ GPU 上各种操作之间经过时间的强大机制。计时功能主要通过 `cudaEventRecord` 和 `cudaEventElapsedTime` 函数访问。当我们调用\
  \ `cudaEventRecord` 时，当前的 GPU 时间会被捕获并与指定的事件关联。这允许我们为特定操作（如内核启动或数据传输）创建时间戳，从而实现精确的性能分析。后台发生的是，运行时会在调用\
  \ `cudaEventRecord` 时捕获正在执行的内容，并监控它以跟踪事件的完成。\n\n要测量两个事件之间经过的时间，我们使用 `cudaEventElapsedTime`\
  \ 函数。该函数计算两个记录事件之间的毫秒级时间差，并以浮点值形式返回。\n\n事件计时的一个重要方面是与使用事件相关的开销。虽然事件的创建、记录和查询是轻量级操作，但它们确实会引入某种程度的开销。在性能关键代码段中进行性能测量时，我们应该这种开销。\n\
  \n事件还可以用于衡量各种执行策略的性能影响。例如，通过在不同的内核配置前后放置事件，我们可以分析网格和线程块大小的变化如何影响执行时间。\n\n当你想要确保在继续操作之前特定操作已完成时，可以使用\
  \ `cudaEventSynchronize` 函数。该函数会阻塞调用线程，直到指定的事件被记录，保证任何依赖操作在之前的操作完成之前不会启动。这在主机代码依赖于\
  \ GPU 计算结果时特别有用。\n\n请记住，当我们开始记录事件时，运行时会捕获正在运行的内容。例如，在我们`第 4 章`的向量加法示例中，我们在没有内容在执行时记录了\
  \ `startEvent`，然后我们发布了内存传输、内核执行和最后一次内存传输。之后，我们调用了另一个事件记录，但这次有很多事情正在发生，所以当我们对 `stopEvent`\
  \ 调用 `cudaEventSynchronize` 时，程序会等待与该事件相关的所有内容完成后才再次恢复执行。*这*就是事件背后的魔术：它理解与自己相关联的内容，并可以跟踪所有内容以进行同步。\n\
  \n我们必须探索的最后一个速度加速器是共享内存，这是一种允许线程在本地进行通信的特殊内存。它是下一节的主题。\n\n使用共享内存加速\n\n正如本章前面提到的，在`线程`部分中，有一种特殊的片上内存（再次说明，截至本文编写时），每个块只有\
  \ 48KB，且对该块中的所有线程可见。这 48KB 内存足够存储一个（比方）浮点数数组，用于存储每个线程执行的结果。这样，在执行结束时，其中一个线程（通常是线程\
  \ 0）可以遍历整个共享数组并累加所有值。\n\n共享内存的另一个典型用途是从全局内存预取数据并在本地进行处理。假设我们需要计算一个向量与许多不同向量的点积。我们可以将主向量加载到共享内存中，并用它处理所有的全局访问，尽管这种方法简单，但将全局内存访问减少到了原始方法的一半。根据我们需要处理的数据大小，我们可以一次性从全局内存调入两个向量并加载两个共享数组。之后，我们的线程将在本地处理数据——节省了本应执行的所有全局访问——并在计算结束时将单个值存储到指定的全局内存地址。\n\
  \n分配到共享内存的数据的生命周期（通常是块大小的数组，即块中线程的数量）与块的周期相同。一旦块被释放，该共享内存也会被释放。\n\n到此，我们汇集了 GPU\
  \ 领域的所有内部机制，以使我们能够编写出高性能得多的程序。\n\n\n\n\n在本章中，我们已经涵盖了以更周全的方式编写程序所需的所有内部细节。注意所有这些细节非常重要，实际上这比为我们的\
  \ CPU 编写单线程程序要重要得多。在处理 `GPUs` 时，我们必须考虑诸如线程间仅共享 `48KB` 空间等问题，以及如何明智地使用这些资源以进一步加速代码。我们已经看到，通过使用不同的流（streams），我们可以同时执行许多任务，甚至同时在设备与主机之间复制数据，但再次强调，我们必须留意许多细节。不过请放心，尽管现在看起来很复杂，但它会变得简单。不久后，我们将使用并探索这些资源来编写程序，这将有助于将它们留在我们的脑海中。\n\
  \n具体来说，在下一章中，我们将涵盖这里必须掌握的概念的实际应用。我们将讨论什么让一个并行算法真正具有“并行性”。我们将实现不同版本的应用程序来解决并行编程中的一些常见问题，这些问题从\
  \ `GPUs` 的使用中极大受益。在每个版本中，我们将使用这里讨论的不同方法，并测量它们对性能的影响。我们将执行一个矩阵乘法，它就像向量加法一样，由于计算方式的原因，是我们我们所谓的“尴尬并行”（embarrassing\
  \ parallelism）示例，但我们还将处理数值积分，它与多个领域相关。\n\n## 第 6 章：使用 CUDA 的并行算法\n\n## 在 Discord\
  \ 上加入我们的社区\n\n[`packt.link/deep-engineering-cpp`](https://packt.link/deep-engineering-cpp)\n\
  \n![带有正方形和符号的二维码码，AI 生成的内容可能不正确。](img/file14.png)\n\n我们现在可以更好地讨论和理解并行程序以及如何使用 `CUDA`\
  \ 表达它们，以及硬件细节和编程概念如何影响并引导我们的程序。学习路径的下一步是提高对“什么让并行算法并行”以及“可实现的并行程度的限制”的理解。\n\n首先，我们将详细讨论指导并行算法的原理，比我们在\
  \ `第 1 章` 中更详细，因为我们现在可以参考在那里编写的程序。之后，我们将查看一些展示不同并行水平的常见算法，让我们预见到面前的挑战。本章将以对不同实现方法的讨论结束，帮助你将所学知识应用于真实场景中。\n\
  \n在整个章节中，我们将涵盖以下主要主题：\n\n*   并行算法的设计原则\n*   并行矩阵操作：乘法、加法\n*   并行积分计算、归约和排序算法\n\n\
  ## 技术要求\n\n我们将使用在 `第 3 章` 中配置的带有 `VS Code` 和我们的开发容器的环境。如果你选择在机器上安装了 `CUDA Toolkit`，你可以可以直接在终端上运行构建命令。代码在\
  \ GitHub 仓库上，可以通过此处访问：[`github.com/PacktPublishing/GPU-Programming-with-C-and-CUDA`](https://github.com/PacktPublishing/GPU-Programming-with-C-and-CUDA)。\n\
  \n## 设计并行算法\n\n在 `第 1 章` 中，我们讨论了什么是并行，并用烹饪类比来介绍同时执行多个步骤的想法，并展示了为什么某些步骤不会通过改变执行者而获益。现在我们将使用类似的类比，来更详细地探索并行算法的设计。\n\
  \n一个很好的起点是：并行算法不仅仅是顺序算法的加速版。它涉及到根本性的重构，使得任务可以同时发生以利用多个计算单元。\n\n在 `第 1 章` 中，我们想象了一组朋友一起准备餐点——一个小规模的设置让我们窥见了并行性的一端。他们可以并行地切菜，但并没有大规模的并行。然而，让我们假设他们的尝试中取得了巨大成功，现在必须准备的不是几餐，而是几千份餐。现在每一步都必须经过仔细考虑，以确保时间和精力不被浪费。这更像我们使用\
  \ `GPUs` 的场景，那里有数千个处理器，我们希望确保它们以最好的方式被使用，而不是让它们闲置。\n\n但如果我们停下来思考一下，餐厅的设置更像多核 CPU：它可以用几位厨师和帮厨处理任何种餐点。`GPU`\
  \ 可以被看作是在菜单选项上被收窄了，但它提供了巨大的吞吐量，就像音乐节上的外卖服务。记住，`CUDA cores` 在被称为 `warps` 的组中工作，这些组由流式多处理器（Streaming\
  \ Multiprocessor，简称 `SM`）进行步进控制。很难想象有一个“主厨控制器”向其他厨师发布诸如“现在切菜”之类的命令，但我们可以把 `SM` 看作厨师，把\
  \ `CUDA cores` 看作一种可以同时切碎蔬菜的工具——就像那些旧电视广告里看到的那样。\n\n然而，为了拥有一顿至少有趣的餐点，我们需要的不仅仅是一个并行切碎的蔬菜：我们应该有多种食材在并行准备，以成为最终餐点的一部分。为此，我们需要许多厨师，利用他们小组的工具来处理食材列表的不同部分，直到它们达到需要相互同步的程度。\n\
  \n> **硬件特异性的影响**\n\n> 在这里我们有一个有趣的特征需要考虑。消费级 `GPUs` 通常呈现三个异步引擎，这意味着它们可以同时执行两个不同方向的数据移动——从\
  \ `Host`（主机）到 `Device`（设备）以及从 `Device`（设备）到 `Host`（主机）——并连同一个内核执行（kernel execution）。另一方面，高级\
  \ `GPUs` 拥有更多引擎，使它们能够同时执行更多内核。这是一个重要的考虑因素，因为它可能从另一个维度加速算法。考虑一个有两个步骤的算法：第一步执行矩阵乘法以产生中间结果，第二步对中间结果和另一个输入矩阵进行矩阵加法。如果我们使用两个结果缓冲区，我们几乎可以同时执行这两个内核调用，前提是有足够的\
  \ `Streaming Multiprocessors`。\n\n### 理解如何识别和利用并行性\n\n可利用并行性的想法有助于定义哪些任务可以独立执行。高并行性发生在算法的许多部分可以在不遵循严格顺序的情况下独立进行时，就像切不同的蔬菜可以同时进行且无任何顺序一样。在并行算法中，高并行允许许多线程独立工作，从而提高速度和效率。\n\
  \n\n\n\n起初，人类并不会自然地以并行的方式来处理问题或任务。通常我们先寻找解决方案，*然后*再寻找足够独立的各个。回到我们的烹饪例子，随着经验的增加，从一开始我们就能明显看出，开头菜和甜点是可以并行准备的。\n\
  \n尽管并行性是提高性能的关键，但算法步骤之间的独立性程度直接影响了我们可能实现的并行化程度，从而限制了可行的加速比。换句话说，投入更多的处理器核心并不会带来成比例的加速提升！\n\
  \n想象我们要准备一百个纸杯蛋糕。蛋糕糊的成分必须按照特定的顺序进行混合，为了方便类比，让我们假设一批蛋糕糊将用于这百百个单位。以下是需要遵循的步骤：\n\n\
  1. 混合成分制作蛋糕糊 —— 这是一个顺序执行步骤，需要按顺序执行。\n2. 将其分成小份并倒入纸杯蛋糕模具中。这是可以并行化的，因为我们可能有许多厨师，每个人都获得一份蛋糕糊，准备模具并将其放置在烤盘上。\n\
  3. 第三步是烘烤，此时所有可用的厨师都会空闲地等待监控 `single` 台烤箱的人。这就是我们所说的同步步骤，因为只有在所有内容处理完成后我们才能继续。\n\
  4. 最后一步是将烤好的纸杯蛋糕分发给厨师，让每个人都能创作自己的糖霜样式。\n\n在这种场景下，当我们回顾描述时，看到了两个可以优化以增加并行性的点。首先，我们可以让许多厨师准备许多份蛋糕糊\
  \ —— 但注意，这并不会影响按给定顺序混合成分的需求。另一个是我们可以拥有更多的烤箱，但如果我们为每个厨师提供一台独立的烤箱，我们可能会面临空间和能量的限制。\n\
  \n这与我们 CPU 与 GPU 的情况完全相似。记得在 `Chapter 1` 中我们讨论过这样一个观点：GPU 是专用硬件，且 `CUDA` 核心与我们在\
  \ CPU 中找到的处理器核心不是同一类型：这就好像 GPU 没有自己的微型烤箱，而 CPU 却有！\n\n我们将在本章后面讨论矩阵乘法和排序算法时，看到这种算法上的差异。排序将具有依赖于上一个步骤计算结果的交替步骤，导致对同步步骤的需求。\n\
  \n> **阿达尔定律：加速比限制**\n\n阿达尔定律强调了必须保持顺序执行的任务的并行性极限。想象一个甜点配谱，其最后的冷却步骤需要 30 分钟。无论你增加多少厨师，在冷却步骤完成之前，菜品无法准备好。同样，在并行计算中，具有不可避免的顺序步骤的任务不会因为增加更多线程而无限加速。如果程序的一部分仍然保持顺序执行，那么将线程数翻倍只能提高程序另一个可并行部分的速度。即使我们可以让并行部分立即执行，总运行时间仍然是执行顺序部分所需的最短时间。\n\
  \n![图 6.1: 矩阵乘法的任务分解](img/file15.png)\n\n图 6.1：矩阵乘法的任务分解\n\n### 同步步骤以避免问题\n\n在上一节中，我们提到了同步步骤，但为什么它们是必要的呢？\n\
  \n如果我们回到纸杯蛋糕的例子，我们可以把纸杯蛋糕描述为带有某种糖霜的小蛋糕。（虽然可能有些纸杯蛋糕没有糖霜，但为了讨论，我们假设 `all` 纸杯蛋糕都有糖霜。）作为人类，由于之前见过许多纸杯蛋糕的图片，我们习惯地认为糖霜是在纸杯蛋糕的`上方`，但如果你回去再次阅读描述，并没有说糖霜一定在上方。这意味着，如果没有同步步骤，完成准备糖霜步骤的厨师可以在上一个步骤——烘烤——完成之前将糖霜倒在最后的盘子上。因此，一些纸杯蛋糕最终会落在糖霜上，而另一些糖霜则在上方。\n\
  \n在编程中，我们想要尽可能发现并利用并行化，但我们必须确保获得正确的结果。获得极快但错误的结果是没有意义的！\n\n虽然有时是必要的，同步会延迟结果，因此我们尽可能避免它。有时，通过改变算法或寻找另一个可以利用的数学属性或等式，我们可以避免同步，但如果不可行，我们就必须接受引入的延迟。处理错误的结果要糟糕得多！\n\
  \n![图 6.2: 在汇总所有和之前等待所有局部加法](img/file16.png)\n\n图 6.2：在汇总所有和之前等待所有局部加法\n\n### 平衡工作负载\n\
  \n由于处理调度是由 `SMs` 自动完成的，为我们的应用程序讨论负载均衡似乎有一点奇怪。然而，在上一节中，我们考虑了可以减少同步需求的算法更改。当我们开始寻找其他算法来避免同步需求时，我们可能会遇到某些线程最终过载的情况，这可能导致瓶颈，即使在不需要同步也会影响整体进度。\n\
  \n为了说明这一点，让我们考虑之前用过的最常见的负载均衡器：在奇偶数之间分配处理。我们测试一个数字是否能被 `2` 整除，如果是，则它是偶数；否则它是奇数。这效果良好，因为一半的数字是偶数，另一半是奇数。然而，如果我们想处理一个数字数组，并仅在值被\
  \ `3` 整除的情况下应用某些特殊处理，就会出现不平衡，因为只有 `33.33%` 的数字是 `3` 的倍数。假设我们正在处理海量的数字，我们无法预先得知会有\
  \ `3` 的倍数进入。假设我们有一个针对 `3` 的倍数的特殊内核（kernel），另一个针对所有其他数字的内核，那么这意味着我们在处理其中一组时，可能会导致核心空闲。另一方面，如果我们让\
  \ `3` 的倍数以步长 `3` 的跨度与非倍数交错排列，我们就可以将 `ids` 为 `3` 的倍数的线程分配给这些特定位置。这就像是预先分配三分之一的线程给这些数字。\n\
  \n当然，这只是一个任意的例子，但它对于反思负载均衡的影响很有用。\n\n![图 6.3: 负载均衡](img/file17.png)\n\n图 6.3：负载均衡\n\
  \n### 寻找关键路径\n\n我们一直在讨论在算法中可以找到多少并行性，但很少有应用程序像矩阵乘法那样仅有一个步骤。（除非我们正在创建一个矩阵乘法库！）通常，一个应用程序会有很多步骤或阶段，这些阶段可能具有不同的并行化程度，但这些步骤会创建一个按特定顺序完成的序列。这就像一个食谱，我们在切切土豆之前需要先削皮——我们可以并行化削皮，但在继续之前我们仍然必须完成削皮阶段。\n\
  \n\n\n\n\n这一系列依赖任务构成了所谓的应用程序“关键路径”。识别关键路径至关重要，因为它决定了在任何可以并行化的步骤上使用并行计算时所能实现的最小时间。请记住，阿姆达尔定律（Amdahl's\
  \ Law）指出，我们能实现的加速受限于应用程序中固有的顺序执行部分，我们必须考虑这些部分也将成为关键路径的一部分。\n\n在设计并行算法时，识别并最小化依赖关系对于优化性能至关重要。目标是尽可能“解锁”任务，以便它们能够并发运行。通过重新排列任务和管理依赖，我们可以缩短完成处理所需的时间。在某些算法中，这是通过结构化数据或步骤来消除不必要的依赖实现的，允许系统在尽可能的地方并行进行。\n\
  \n如果数据移动是不可避免的，我们可以尝试将内存传输与 GPU 处理重叠，在此期间我们可以让 CPU 准备数据的其他部分，以充分利用我们的硬件和异步执行能力。\n\
  \n让我们考虑这样一个应用程序：我们需要计算来自流媒体服务等系统的用户个人文件的值与一组电影指标权重之间的矩阵乘法。之后，我们对每行的值求得到每个用户的得分。最后，我们找到最小值和最大值。\n\
  \n![图 6.4: 用户排名应用程序的关键路径](img/file18.png)\n\n图 6.4：用户排名应用程序的关键路径\n\n正如`图 6.4` 所示，寻找最小值和最大值的最终步骤之间没有依赖关系，但我们必须等待之前的步骤完成。\n\
  \n> **GPU 硬件——不通用，但规模巨大**\n\n>\n\n> GPU 并行与通用并行不同之处在于，我们处理的是支持特定编程模型的特定硬件。很多时候，我们会发现自己正试图寻找一种方法让应用程序适应\
  \ GPU 处理数据的方式。其他硬件可能提供各种并行模型，但很少有能与 GPU 提供的海量并行性相比。这就是为什么可能值得从许多方面重构我们的应用程序，以使其与\
  \ GPU 处理模型兼容：海量并行化！\n\n设计并行算法需要对任务划分、同步和负载均衡进行仔细的思考。仅仅拆分任务是不够的：它们必须经过结构化以最小化依赖关系并最大化并行性，使同步点稀疏，并在线程之间平衡负载。这种平衡确保了每个线程都能对结果做出同样的贡献，从而提高算法的整体速度和效率。\n\
  \n在接下来的章节中，我们将探索执行某些可以使用并行性加速的常用计算的算法。我们将从矩阵处理开始，因为它具有任务无关的特性，然后逐渐转向更多与任务依赖相关的示例，以说明我们所讨论的所有内容。\n\
  \n## 计算矩阵加法和乘法\n\n让我们深入研究矩阵加法和矩阵乘法，这两个操作上手看起来可能相似，但实际上差异很大，特别是在计算机处理它们的方式上——特别是当使用\
  \ CUDA 进行编程时。\n\n矩阵加法是非常直观的。假设有两个大小相同的矩阵，例如 `A` 和 `B`。我们只需要将 `A` 中的每个元素加到 `B` 对应的元素上。因此，对于每一行\
  \ `i` 和每一列 `j`，都有 `C[i][j]=A[i][j]+B[i][j]`。由于每个元素的加都是独立于其他元素的，这是一个*极易并行*（embarrassingly\
  \ parallel）的任务。这是一种通俗的说法，意味着每个计算都与其他任何计算相互独立，因此在理论我们可以一次性计算所有元素，而不需要协调或等待矩阵其他部分的结果。\n\
  \n在 GPU 上，矩阵加法非常高效，因为线程之间不需要同步。每个线程只需从每个矩阵中获取单个元素，将它们相加并存储结果。酷的地方在于：如果我们的矩阵存储在连续内存块中（意味着按行存储），我们可以将其视为一个要相加的长长数字向量。我们只是在逐个元素地相加两个巨大的向量！通过顺序处理每一行，我们充分利用了内存布局，减少了缓存缺失并提高了速度。幸运的是，矩阵通常是连续存储的，因为这是数据从主机（host）移动到设备（device）的最佳方式。由于我们已经在`第\
  \ 4 章`中介绍了向量加法，我们将不再重温代码。\n\n另一方面，矩阵乘法则是完全不同的了。假设 `A[mn]` 和 `B[np]` 是两个矩阵——注意 `A`\
  \ 的列数等于 `B` 的行数。在乘以矩阵 `A[mn]` 和 `B[np]` 时，结果矩阵 `C[mp]` 中位置 `C[i][j]` 元素取决于 `A` 的整个第\
  \ `i` 行和 `B` 的整个第 `j` 列。这创建了一种“多对多”的依赖关系，这种关系在矩阵加法中是不存在的。对于 `C` 中的每个元素，我们都在计算跨该行该列的乘和，可以描述为：\n\
  \n索引元素求和的 `k` 允许我们访问 `A` 中第 `i` 行的所有元素，同时访问 `B` 中第 `j` 列的所有元素。对于矩阵 `A`，它跨越单行的所有元素，而对于矩阵\
  \ `B`，它遍历单列的所有元素。这种模式为处理器带来了更多工作量，并给内存系统带来了压力，导致了更多的缓存缺失。\n\n在 CUDA 中，矩阵乘法涉及将任务分解为许多线程，每个线程处理计算的一部分，每个线程通常负责结果矩阵\
  \ `C` 的单个元素。这意味着每个线程将使用来自 `A` 的一行和来自 `B` 的一列。然而，与矩阵加法不同，我们必须仔细考虑内存访问模式，以避免性能下降。访问非连续元素（正如我们在读取矩阵\
  \ `B` 的列时那样）会增加缓存缺失的概率，从而减慢所有速度。这是因为当我们从全局内存访问一个元素时，内存系统会调入一个放入内存缓存的块；如果我们需要的下一个元素不在缓存中，则必须从全局内存复制一个新块。如果之后再次需要之前的元素，则必须重新复制。这是一个损害性能的灾难性循环。\n\
  \n> **为什么矩阵乘法很重要？**\n\n>\n\n> 矩阵乘法之所以，是因为它是许多科学计算的核心——求解方程组、运行模拟、分析数据，甚至训练机器学习模型。当你听到\
  \ AI 模型在海量数据集上训练或气象模型预测飓风时，很有可能它们正在进行大规模的矩阵乘法。科学家和工程师可能会花费数年时间开发新方法来使这些操作更快或更高效……\n\
  \n图像可以帮助可视化必要的内存访问模式，并展示了每个元素的计算是如何与其他元素相互独立的。\n\n![图 5：矩阵乘法的任务独立性](img/file19.png)\n\
  \n图 5：矩阵乘法的任务独立性\n\n\n\n\n\n这里有一个奇特的之处：尽管矩阵乘法比矩阵加法更复杂，但它仍然被认为是一个“尴尬并行”（embarrassingly\
  \ parallel）问题，因为其核心思想是相同的：`C` 中每个元素的计算都可以独立完成。任何线程都不需要等待另一个线程完成就可以开始自己的工作，因此不需要进行同步处理。这是一个巨大的优势，因为我们可以分配多个线程同时工作，而不需要进行太多的协调。\n\
  \n现在是时候看代码了！在 own 示例中，我们考虑的是`square matrices`，即行数等于列数。以下是我们的乘法内核函数：\n\n```\n__global__\
  \ void matrixMulKernel(double *A, double *B, \ndouble *C, int width) {\n  int row\
  \ = blockIdx.y * blockDim.y + threadIdx.y;\n  int col = blockIdx.x * blockDim.x\
  \ + threadIdx.x;\n  if (row < width && col < width) {\n    double value = 0;\n \
  \   for (int k = 0; k < width; k++) {\n        value += A[row * width + k] * B[k\
  \ * width + col];\n    }\n    C[row * width + col] = value;\n  }\n}\n```\n\n值得注意的是，现在我们对\
  \ `threadId` 使用了两个维度，这使得思考索引变得稍微方便了一些。\n\n每个线程将拥有一组 `row` 和 `col` 值的组合，代表输出矩阵中计算元素的索引，同时也代表了必须处理的矩阵\
  \ `A` 的行和矩阵 `B` 的列。使用 `for` 循环允许我们访问每个对应的元素，进行乘法并存储在局部变量中。\n\n另一个重要的代码部分是启动内核的配置，如下所示：\n\
  \n```\ndim3 blockDim(16, 16);\ndim3 gridDim( (N + blockDim.x - 1) / blockDim.x,\
  \ \n              (N + blockDim.y - 1) / blockDim.y  );\nmatrixMulKernel<<<gridDim,\
  \ blockDim>>>(d_A, d_B, d_C, N);\n```\n\n在这里，`N` 代表矩阵的`order`（阶），换句话说，就是每个维度的大小，意味着我们有\
  \ `N * N` 个元素。`blockDim` 定义的是线程数——我们将拥有 256 个线程，一次为 16 行 16 列。然后我们定义块（blocks）的数量，同样在\
  \ `gridDim` 上使用两个维度，但我们需要根据矩阵的阶来计算数量。如果 `N` = 1000，计算方式如下：\n\n`( 1000 + 16 – 1 )\
  \ / 16 = 63.4375`\n\n然而，由于 `blockDim.x` 是无符号 `int` 类型，该值将变为 63，且两个维度上的值将相同，这意味着我们将拥有\
  \ `gridDim(63,63)`。这将创建 3969 个块，考虑到每个块有 256 个线程，我们最终得到了 3969 x 256 = 1,016,064 个独立线程来处理我们的数据。考虑到我们有\
  \ 1000 × 1000 = 1,000,000 个独立元素，我们可以开始运行了，但我们必须采取措施确保超出矩阵边界的额外 16,064 个线程不会计算任何内容。这就是为什么我们内核中的前几行代码始终包含一个测试，以检查\
  \ `threadId` 是否在数据范围内。\n\n现在是时候从我们的仓库下载代码进行实验的好时机，使用不同的矩阵大小值来观察对执行时间的影响。\n\n在下一节中，我们将处理一个不同的问题，但它同样可以从并行化受益。我们将进行数值积分，这意味着我们将计算许多点然后对它们求和。\n\
  \n## 计算数值积分\n\n首先：什么是积分？嗯，积分是微积分中的一个概念，代表图中两点之间曲线下方的面积。想象你正在跟踪一辆沿道路行驶的汽车路径，并在固定的间隔测量汽车的速度。现在，如果你将这些绘制出来，并计算代表速度随时间变化的曲线下方的面积，考虑到\
  \ `distance = speed × time`，你就得到了汽车行驶的总距离！简单来说，积分是通过累加微小的面积片来找到总和，这是一种测量一段范围内累积的量的强大方法。\n\
  \n> **为什么积分很有用？**\n> 积分无处不在科学、工程等领域。它们通过计算随时间或空间变化的总效应，帮助我们测量连续变化的事物——如距离、能量或增长。例如，工程师使用积分来确定结构上的力，经济学家使用它们来衡量随时间变化的总收入，环境科学家使用它们来模拟污染的扩散。积分为我们提供了从所有微小部分理解大局的方法。\n\
  \n有时我们想知道曲线下方的面积，但没有方便的公式可以处理。这时数值积分派上用场了！它使我们在数学技能或公式不足时估算面积。我们需要进行许多小型计算然后将它们全部求和——这听起来像是我们可以使用并行算法处理的事情，对吧？\n\
  \n有许多数值积分方法，但最的是**梯形法**（trapezoidal method），因为它在曲线内部使用许多梯形来计算面积的近似值。\n\n![Figure\
  \ 6.6: Two trapezoids inside curve](img/file20.png)\n\n图 6.6：曲线内部两个梯形\n\n在 `Figure\
  \ 6.6` 中我们使用了两个梯形来近似曲线下方的面积，以便理解概念，但在实践中我们通常添加更多的梯形。当然，在我们需要这种方法的情况下，曲线并不像这一个良好。使用梯形的有趣之处在于，随着宽度的减小，顶线会越接近曲线，这使得它们在计算非常简单的情况下能够提供特别好的近似。所以，就像数值方法通常一样，是用精度换取计算性。\n\
  \n梯形法的另一个有趣特点是我们可以直接在计算中使用收集的数据。使用本节开头提到的公路旅行示例，我们可能每 15 分钟（0.25 小时）记录一次汽车的速度。由于我们不知道这次旅行路线，我们使用了梯形法。\n\
  \n| 时间 (小时) | 速度 (km/h) | 速度 (mph) |\n| :--- | :--- | :--- |\n| 0 | 60 | 37.28 |\n\
  | 0.25 | 65 | 40.39 |\n| 0.50 | 70 | 43.50 |\n| 0.75 | 72 | 44.74 |\n| 1.00 | 68\
  \ | 42.25 |\n| 1.25 | 65 | 40.39 |\n| 1.50 | 62 | 38.53 |\n| 1.75 | 60 | 37.28 |\n\
  | 2.00 | 58 | 36.04 |\n| **总和** | **130.25 公里** | **79.01 英里** |\n\n当然，我们的示例非常小，可以手动计算，这样并无法有效利用我们的\
  \ GPU，但想象一下我们有成上万个数据点：那么使用 GPU 就开始有意义了。\n\n\n\n\n我们也应该注意到，这是另一种不需要在执行线程之间进行同步的问题。\n\
  \n这一次我们的内核非常简单：\n\n```cpp\n#define N 10'000'000 // 速度测量次数\n#define T 0.25 // 测量间隔（15\
  \ 分钟）\n__global__ void trapezoidalKernel(double *speeds, double *distances, int\
  \ n) {\n   int i = blockIdx.x * blockDim.x + threadIdx.x;\n   if (i < n - 1) {\n\
  \      distances[i] = 0.5 * (speeds[i] + speeds[i + 1]) * T;\n   }\n}\n```\n\n记住，我们必须除以\
  \ 2 来计算梯形形的平均高度，因此我们乘以 `0.5`，这会快一点。此外，我们必须乘以分段宽度；在这种情况下，我们将 `T` 定义为 `0.25`。所有值都经过计算并存储在一个不同的数组中。执行完此内核后，我们将结果拷贝回主机端（host），并通过累加所有部分结果来计算最终距离。以下是执行该步骤的\
  \ `main` 函数中的代码：\n\n```cpp\ncudaMemcpy(h_distances, d_distances, \n           (N\
  \ - 1) * sizeof(double), \n           cudaMemcpyDeviceToHost);\ndouble gpuResult\
  \ = 0.0;\nfor (int i = 0; i < N - 1; i++) {\n    gpuResult += h_distances[i];\n\
  }\n```\n\n一个有趣的地方是，GPU 实现的性能与 CPU 接近。这是因为我们需要拷贝数据，而且归约（reduction）步骤完全是在 CPU 上处理的。归约过程是下一节的主题，我们将学习如何利用并行性来加速这一过程。\n\
  \n## 多个值归约（Reducing from many）\n\n在并行计算中，归约是一种关键操作，允许我们获取一组值并将它们合并为一个结果。这听起来像是一项简单的任务——例如，累加数字列表或寻找最大值——但在并行上下文中，归约可能比你想象的要复杂。这是因为归约要求我们合并来自多个线程的部分结果，这引入了同步的需求。如果我们不仔细处理，并行性带来的性能提升可能会迅速消失，正如我们在上一节的示例中所看到的那样。\n\
  \n协调的需求源于不同线程正在共同工作，将数据集归约为单个结果。如果没有同步的时间控制和受控的数据访问，线程可能会互相干扰，这可能导致值被覆盖或答案错误。\n\n\
  归约的一个经典示例是对数字数组求和。当我们并行执行此操作时，每个线程可能处理数组的一小部分。但最终，我们需要将这些部分之和合并为一个结果，这需要线程在某些位点进行同步。这一步将归约与“尴尬并行”（embarrassingly\
  \ parallel）任务区分开来，后者每个线程完成其任务时永远无需检查他人。\n\n为了实现高效的归约，我们可以使用类似于树形归约（tree-based reduction）的技术，每个线程处理一对数字以计算出一个部分结果。然后，这些部分结果在下一层再次成对合并，每次将值减少一半，直到只剩下一个结果。这种方法受到二叉树启发，可以减少同步步骤的数量，因为“树”的每一层所需的线程交互都更少。\n\
  \n![图 6.7: 求和数组元素的归约示例](img/file21.png)\n\n图 6.7: 求和数组元素的归约示例\n\n归约面临的一个挑战是管理内存访问。如果多个线程试图同时更新同一个变量，它们可能会发生“竞态”（race），导致错误的结果或性能下降。为了避免这种情况，我们采用了原子操作（atomic\
  \ operations）或其他同步机制，这些机制允许线程安全地访问共享内存。这增加了复杂性，但如果没有这些机制，归约操作将变得混乱且不可靠。\n\n记得上一节，当时我们使用梯形积分法计算路程距离。当考虑\
  \ 1,000,000 个数据点时，CPU 和 GPU 方法的执行时间处于同一数量级。当我们在 GPU 上添加并行归约时，我们可以将执行时间缩短一个数量级。然而，代码经过了许多修改，如下所示。\n\
  \n```cpp\n#define N 10'000'000 // 速度测量次数\n#define T 0.25 // 测量间隔（15 分钟）\n__global__\
  \ void trapezoidalKernel(double *speeds, double *result, int n) {\n   extern __shared__\
  \ double sharedData[];\n   int tid = threadIdx.x;\n   int i = blockIdx.x * blockDim.x\
  \ + threadIdx.x;\n   double localDistance = 0.0;\n   if (i < n - 1) {\n     localDistance\
  \ = 0.5 * (speeds[i] + speeds[i + 1]) * T;\n   }\n   sharedData[tid] = localDistance;\n\
  \   __syncthreads();\n   for (int s = blockDim.x / 2; s > 0; s /= 2) {\n       \
  \ if (tid < s) {\n            sharedData[tid] += sharedData[tid + s];\n        }\n\
  \        __syncthreads();\n   }\n   if (tid == 0) {\n       result[blockIdx.x] =\
  \ sharedData[0];\n   }\n}\n```\n\n现在我们需要一步步理解它与原始内核的区别。首先，我们使用共享内存来存储每个块内部的部分结果。这很重要，因为共享内存比全局内存快得多，但它需要同步来保证一致性。\n\
  \n在 `trapezoidalKernel` 中，我们将 `tid` 定义为 `threadIdx.x`，将 `i` 定义为 `blockIdx.x * blockDim.x\
  \ + threadIdx.x`。每个线程计算其 `localDistance` 并将其存储在 `sharedData[tid]` 中。我们使用 `__syncthreads()`\
  \ 确保在继续之前所有线程都已写入。\n\n归约随后通过树的方法进行。在每次迭代中，步长 `s` 从 `blockDim.x` 的一半开始，每次减半。`tid`\
  \ 小于 `s` 的线程将其对应的 `sharedData[tid + s]` 加到自己的值中。我们在每次加法后都调用 `__syncthreads()` 以确保和为下一层就绪。最后，`tid\
  \ == 0` 的线程将最终的块和写入 `result[blockIdx.x]`。\n\n再次仔细考虑这一点，在大数据集中，我们将许多块，每个块都有许多线程。如果我们计算了每个块的部分结果，我们该如何得到最终结果呢？\n\
  \n```cpp\nint blockSize = 256;\nint gridSize = (N + blockSize - 1) / blockSize;\n\
  double *d_speeds, *d_partialResults;\ncudaMalloc(&d_speeds, N * sizeof(double));\n\
  cudaMalloc(&d_partialResults, gridSize * sizeof(double));\n```\n\n首先我们定义了计算所需的块数量——这就是我们的\
  \ `gridSize`。这也定义了 `partialResults` 数组的大小，因为每个处理完速度的块都需要一个槽位。\n\n另一个重要的变化是我们调用内核的方式：\n\
  \n\n\n\n\n```\ntrapezoidalKernel<<<gridSize, blockSize, blockSize * sizeof(double)>>>(d_speeds,\
  \ d_partialResults, N);\n```\n\n在 `gridSize` 和 `blockSize` 之后，我们传入了想要为所使用的共享内存块分配的大小。这意味着剩余空间将用作\
  \ L1 缓存。\n\n执行完成后，我们需要再次将部分结果拷贝到主机端（host），并计算最终归约。\n\n```cpp\ndouble *h_partialResults\
  \ =  (double*)malloc(gridSize * sizeof(double));\ncudaMemcpy(h_partialResults, d_partialResults,\
  \ gridSize * sizeof(double), cudaMemcpyDeviceToHost);\ndouble gpuResult = 0.0;\n\
  for (int i = 0; i < gridSize; i++) {\n    gpuResult += h_partialResults[i];\n}\n\
  ```\n\n我们在主机端上分配了一个大小为 `gridSize` 的数组并执行了拷贝。现在，一个简单的 `for` 循环就能解决我们的问题。在 CPU 上进行归约在这里并不是问题，因为\
  \ `gridSize` 比元素总数小几个数量级，所以这种计算不会产生沉重的开销。相反，如果在 GPU 上执行此操作，将导致许多线程空闲，这并不是能量的最有效利用方式。\n\
  \n在下一节中，我们将讨论如何使用简单算法对数据进行并行排序，这个示例将帮助我们讨论同步的影响。\n\n## 排序排序\n\n当我们思考排序时，脑海中浮出的第一个可能是将数字有序地重新排列成序列，从小到大或反反之。但在并行编程中，排序被证明不仅仅是简单的对齐。它是一个涉及协调、耐心和大量同步的问题。并行排序不仅仅是困难——它是一个极具挑战性的拼图，每个碎片都需要知道其他碎片在做什么。在探索中，我们将深入研究一种名为`奇偶排序`（odd-even\
  \ sort）的并行排序方法，看看它告诉了我们哪些关于并行计算中同步的独特挑战。\n\n奇偶排序为使用多个处理器进行排序提供了一个优雅而棘手的解决方案。其基本思想是，与其让每个处理器都处理整个数组，不如让处理器成对工作，比较并交换相邻位置的数字。在每一轮中，我们比较奇数索引的元素与其直接相邻的元素，然后在下一轮中，我们对偶数索引的元素执行相同的操作。通过重复这些步骤（或“阶段”），我们逐渐让未排序的数字越来越接近正确的顺序。\n\
  \n并行排序引入了一个转折：我们必须弄清楚如何协调不同的线程，以便它们不会互相干扰。如果它们不保持协调，最终可能会抵消彼此的工作，导致数据混乱，而不是我们所追求的整齐顺序。\n\
  \n奇偶排序是那些我们专门用于学习的方法之一，因为有更先进的排序算法更适合现实世界的应用。然而，在并行环境中，奇偶排序揭示了同步是多么困难。我们将发现，仅仅向问题中投入更多处理器并不一定能让问题解决得更快——让这些处理器顺畅地协同工作才是魔迹发生的地方。\n\
  \n话不多说，让我们看代码！\n\n```cpp\n__global__ void oddEvenSortStepKernel(double *arr, int\
  \ size, bool *swapped, bool isOddPhase) {\n    int idx = threadIdx.x + blockIdx.x\
  \ * blockDim.x;\n    int i = isOddPhase ? 2 * idx + 1 : 2 * idx;\n     if (i < size\
  \ - 1) {\n        if (arr[i] > arr[i + 1]) {\n            double temp = arr[i];\n\
  \            arr[i] = arr[i + 1];\n            arr[i + 1] = temp;\n            *swapped\
  \ = true;\n        }\n    }\n}\n```\n\n实际的内核函数异常地简单。给定阶段，它决定了必须比较并交换奇数还是偶数的数组元素对。如果我们处于奇数阶段，所有索引都会乘以\
  \ 2 并加 1，这保证了它是奇数。相反，在偶数阶段，所有索引只需乘以 2，保证是偶数。在验证索引在我们的范围内之后，我们测试值是否无序，如果是，我们就交换它们并更新\
  \ `swapped` 标志。这里是第一个有趣的部分。注意，我们将有许多线程并行工作，并可能覆盖这个变量。我们花了时间讨论同步的重要性，而现在我们仅仅是让混乱发生吗？不完全如此。\n\
  \n为了理解这一点，我们需要看另一段在主机端上执行的代码。\n\n```cpp\nvoid oddEvenSortGpu(double *arr, int size)\
  \ {\n    double *d_arr;\n    bool *d_swapped, h_swapped;\n    int threads = 256;\n\
  \    int blocks = (size + threads - 1) / threads;\n    cudaMalloc((void **)&d_arr,\
  \ size * sizeof(double));\n    cudaMalloc((void **)&d_swapped, sizeof(bool));\n\
  \    cudaMemcpy(d_arr, arr, size * sizeof(double), cudaMemcpyHostToDevice);\n  \
  \  do {\n        h_swapped = false;\n        cudaMemcpy(d_swapped, &h_swapped, sizeof(bool),\
  \ cudaMemcpyHostToDevice);\n        oddEvenSortStepKernel<<<blocks, threads>>>(d_arr,\
  \ size, d_swapped, true);\n        cudaSynchronize();\n        oddEvenSortStepKernel<<<blocks,\
  \ threads>>>(d_arr, size, d_swapped, false);\n        cudaSynchronize();\n     \
  \   cudaMemcpy(&h_swapped, d_swapped, sizeof(bool), cudaMemcpyDeviceToHost);\n \
  \   } while (h_swapped);\n    cudaMemcpy(arr, d_arr, size * sizeof(double), cudaMemcpyDeviceToHost);\n\
  \    cudaFree(d_arr);\n    cudaFree(d_swapped);\n}\n```\n\n我们主要感兴趣的是 `do-while`\
  \ 循环，但其余代码都是声明和准备工作。\n\n该算法交替奇数和偶数阶段，但我们如何结束呢？通过监控最后一次迭代是否发生了交换。这里是酷的地方：我们在主机上创建\
  \ `swapped` 控制变量并将其传递给内核。许多线程运行并甚至可能覆盖彼此的结果，但这不是问题，因为没有线程会将该值设为原始的 `false` 值。要么是一个或多个线程将值设置为\
  \ `true`，要么它们无论当前值如何，都保持不变。\n\n棘手的部分在于，在执行完两个阶段后，我们需要将 `swapped` 变量拷贝回主机，以检查其值并决定我们是否需要继续。在经过若干迭代后，不再发生交换，我们便停止执行。\n\
  \n尽管该算法并不复杂，但它是说明创建高效并行执行排序算法所涉及的复杂性的完美示例。\n\n\n\n\n我们已经学习了创建 CUDA 程序的许多概念和技术，并且已经在小型示例中看到了一些性能提升。然而，简单地将程序转换为并在\
  \ GPU 上运行可能无法获得预期的加速，事实上，可能会产生与预期不符的成本。其中一个例子是将数据加载到 GPU 内存所需的时间。但是，只要使用正确的策略，就可以克服这些问题。\n\
  \n在本章中，我们将重温老朋友——矩阵乘法，并讨论提高其性能的方法。但最重要的是，我们将调查*为什么*我们所做的更改有助于提高性能。在此过程中，我们将涵盖以下主题：\n\
  \n* 介绍优化\n* 使用 NVidia Nsight Compute 进行性能分析\n\n## 技术要求\n\n我们将使用在 `Chapter 3` 中配置的环境，包含\
  \ VS Code 和我们的开发容器。如果你选择在你的机器上安装 CUDA Toolkit，则可以直接在终端中运行构建命令。我们还将使用一个名为 `Nvidia\
  \ Nsight Compute` 的新工具来对代码进行性能分析，这是一个基于 GUI 的工具，在我们的容器和本地安装中均可用。官方文档可以在 [`docs.nvidia.com/nsight-compute/index.html`](https://docs.nvidia.com/nsight-compute/index.html)找到。本章的所有代码均在\
  \ GitHub 仓库提供。\n\n## 介绍优化\n\n在阅读官方文档时，很容易对关于不同硬件架构的信息感到迷茫或无所从心。每一个新 GPU 发布都会带来硬件创新，这会影响我们编写代码的方式，如果我们想要榨出每一分性能，了解我们的硬件是至关重要的。此外，了解硬件的细节可以揭示我们在内存带宽、可用内存和时钟速度可能存在的局限性。\n\
  \n评估实现更高性能所需的努力也是我们的责任，而此时使用性能分析工具（profiler）是一个巨大的优势，因为它能帮助我们找出最值得优化的条目。代码优化可能会导致代码更难阅读，因为我们需要处理多得硬件细节，但这并不意味着代码将无法维护。我们只需要小心并遵循一些软件工程的最佳实践，以补偿增加的复杂性。\n\
  \n在 `Chapter 6` 中，我们学习了一个简单的矩阵乘法内核（kernel），它的性能已经优于单线程 CPU 版本，但加载数据所需的时间会影响总执行时间。我们现在将重新审视矩阵乘法内核并应用一些优化。这是研究这些效果的完美示例，因为虽然它是那种“尴尬并行”的问题之一，但我们即将讨论的技术也适用于其他场景。\n\
  \n> **Debug 与 Release 编译标志**\n\n我们 我们传递给编译器的指令对于为我们生成的代码类型至关重要。在 CMake 中，我们可以定义不同的配置，以决定配置生成器如何准备我们的环境。我们使用的是\
  \ Makefile，它是一个单一配置生成器，这意味着为了从 Debug 切换到 Release，并在必要时切换回来，我们必须重新执行 CMake 配置步骤。我们将在\
  \ *Optimizing to speed up our code* 章节中详细查看此命令，届时我们将应用优化。\n\n尽管如此，在跳入优化之前，学习如何测量代码正在发生的情况将具有巨大的价值。这样，我们就可以对比已有的内容与通过修改代码可能实现的成果。在\
  \ `Chapter 4` 中，我们从从命令行使用了 NVidia Nsight Compute，这不允许交互式会话，但现在我们将使用它的图形界面来获取更多关于代码的信息。所以，让我们认识一下新工具——NVidia\
  \ Nsight Compute 图形界面吧。\n\n## 使用 NVidia Nsight Compute 进行性能分析\n\n我们目前在一个类似于实验室的环境工作，书中所有的程序都是很小的，而且大多数时候它们只有一个与我们正在学习的技术相关的内核。然而，在现实世界的程序中，我们将面临许多不同函数相互作用的情况，传递其结果以为用户实现结果。在这种情况下，使用性能分析工具对于识别我们应该集中精力节省时间的热点（hot\
  \ spots）变得至关重要！\n\n在没有适当信息的情况下优化代码可能会让我们在很少执行的代码上花费太多时间。这种盲目优化可能会以许多方式展开，但一种可能的结果是在应用各种优化后，我们发现完全没有改进。使用帮助我们识别瓶颈所在所在工具是重要的。\n\
  \n要执行该工具，我们在 VS Code 会话的终端中（已连接到我们的开发容器）运行以下命令：\n\n```\nncu-ui\n```\n\n这将打开一个独立的窗口，如\
  \ *Figure 7.1* 所示。\n\n![Figure 7.1: The Welcome screen](img/file23.png)\n\n图 7.1:\
  \ 欢迎界面\n\n在这里我们可以创建一个 `New Project`（新项目）来分析我们的代码，如 *Figure 7.2* 所示。\n\n![Figure\
  \ 7.2: New Project option](img/file24.png)\n\n图 7.2: New Project option\n\n点击 `New\
  \ Project` 后，将看到一个对话框，如 *Figure 7.3* 所示，在其中输入项目名称并选择创建它的文件夹。\n\n![Figure 7.3: Creating\
  \ the project folder](img/file25.png)\n\n图 7.3: 创建项目文件夹\n\n在这里我们选择在书籍仓库的 Chapter\
  \ 7 文件夹内创建，但我们也可以选择任何认为合适的位置。点击 `OK` 按钮后，将被提示配置项目，如 *Figure 7.4* 所示。\n\n![Figure\
  \ 7.4: Application executable and report name](img/file26.png)\n\n图 7.4: 可执行文件和报告名称\n\
  \n在这里我们必须注意几点。首先，我们必须选择工作的平台；我们的选择是 `Linux x86_64`。连接选择为 `localhost`，但在高级场景中我们可能会连接到远程主机。\n\
  \n下一个选择的项目是 `Application Executable`（可执行文件），注意我们正在使用创建可执行文件的构建文件夹。屏幕上最后一个要编辑的项目是报告名称（`Output\
  \ File`），在这里我们使用 `report%i`，这样每次性能分析会话都会生成一个新的报告文件，其中 `%i` 被替换为执行次数。注意报告名称是在 `Activity`\
  \ 面板的 `Profile` 选项卡中配置的，但在运行特定的性能分析会话之前，我们将切换到 `Activity` 面板上的 `System Trace` 选项卡，如\
  \ *Figure 7.5* 所示。此选项允许我们运行应用程序并让工具跟踪应用程序。目前不需要更改任何其他选项；只需点击 `Launch` 按钮。\n\n![Figure\
  \ 7.5: The system trace](img/file27.png)\n\n图 7.5: 系统跟踪\n\n跟踪执行后，我们将看到如 *Figure\
  \ 7.6* 所示的分析（图像为了适应页面在中间被分开了）。\n\n![Figure 7.6: System trace timeline (broke down\
  \ for visualization)](img/file28.png)\n\n图 7.6: System trace timeline (broke down\
  \ for visualization)\n\n在这里我们有很多信息，但感兴趣的主要项目位于窗口左侧的 `CUDA HW` 块下。当我们展开此项目时，会看到一个内核执行部分和一个内存操作部分。我们的代码首先将矩阵从主机系统拷贝到设备，因此我们将看到两个标记为\
  \ `HtoD` 的 `Memcpy` 操作，如 *Figure 7.7* 所示。\n\n\n\n\n\n![图 7.7: 内存拷贝放大——主机到设备](img/file29.png)\n\
  \n图 7.7: 内存拷贝放大——主机到设备\n\n之后，我们看到一个带有我们内核名称的大方块，代表如*图 7.8* 所示的内核执行。\n\n![图 7.8:\
  \ 内核执行放大](img/file30.png)\n\n图 7.8: 内核执行放大\n\n之后，我们的应用程序执行了一个标记为 `DtoH` 的新 `Memcpy`\
  \ 操作，以将结果矩阵从设备拷贝到主机（*图 7.9*）。\n\n![图 7.9: 内存拷贝放大——设备到主机](img/file31.png)\n\n图 7.9:\
  \ 内存拷贝放大——设备到主机\n\n一个有趣的功能是，我们可以右键点击任何已执行的内核并选择 `Profile Kernel`（性能分析内核）选项，如*图 7.10*\
  \ 所示。\n\n![图 7.10: 选择内核进行性能分析](img/file32.png)\n\n图 7.10: 选择内核进行性能分析\n\n这将返回初始配置屏幕。由于我们正准备对特定内核执行性能分析，我们需要更改一些细节。第一项已经为我们填好了，因为我们是从系统追踪（System\
  \ Trace）跳转而来的，而要分析的内核名称定义在第二个标签页上，如*图 7.11* 所示。\n\n![![图 7.11: 选定的内核名称](img/file33.png)\n\
  \n图 7.11: 选定的内核名称\n\n选择内核名称会告知性能分析器详细分析哪个项目，在系统追踪的帮助下，我们可以找出哪些内核花费了更多时间，并将精力集中在优先优化这些内核。我们的示例只有一个内核，所以这个决定是显而易见的，但在较大的应用程序中，我们必须注意这一点，以避免在错误的地方浪费时间。\n\
  \n然后我们在 `Metrics`（指标）标签页上选择我们想要跟踪的指标，并在其中选择完整分析，如*图 7.12* 所示。此选项会为所有可用指标生成数据。\n\n\
  ![图 7.12: 选择用于分析内核的指标集](img/file34.png)\n\n图 7.12: 选择用于分析内核的指标集\n\n点击 `Launch`（启动）按钮后，我们将看到如*图\
  \ 7.13* 所示的 `Progress Log`（进度日志）。我们必须等待处理完成才能获取报告。\n\n![图 7.13: 运行性能分析器](img/file35.png)\n\
  \n图 7.13: 运行性能分析器\n\n性能分析完成后，我们将得到一个带有报告的新屏幕。默认屏幕是摘要，在下一部分中，我们将采用循序渐进的方法理解工具告诉我们的信息，以及如何使用已经学习的技巧来优化代码，从而从硬件中提取最大的价值。\n\
  \n## 优化以加速我们的代码\n\n现在我们已经对内核进行了性能分析，并得到了第一份报告，它提供了我们优化代码所需的信息。在*图 7.14* 中，我们看到了由指定的执行操作产生的基本信息。我们看到了当前会话执行内核所需的时间，还可以看到所使用的启动配置：(125,125,1)\
  \ 组 (16,16,1) 线程。\n\n![图 7.14: 内核性能分析摘要](img/file36.png)\n\n图 7.14: 内核性能分析摘要\n\n\
  我们还在 `Summary`（摘要）页面上发现了根据工具对我们代码可改进之处而提出的建议列表，如*图 7.15* 所示。然而，我们需要查看 `Details`（详情）页来深入理解这些建议。\n\
  \n![图 7.15: 内核的建议](img/file37.png)\n\n图 7.15: 内核的建议\n\n我们通过选择报告左上角的 `Details` 页来完成此，如*图\
  \ 7.16* 所示。\n\n![图 7.16: 选择详情页](img/file38.png)\n\n图 7.16: 选择详情页\n\n然后我们进入 `Details`\
  \ 页，在该页有组织已收集指标的章节，如*图 7.17* 所示。\n\n第一部分是 `GPU Speed of Light Throughput`（GPU 光速吞吐量），我们我们可以在屏幕右上角看到一个下拉菜单。初始状态它是禁用的，如*图\
  \ 7.17* 所示。我们必须打开该部分才能从可用信息中进行选择。\n\n![图 7.17: 当前性能分析会话详情页](img/file39.png)\n\n\
  图 7.17: 当前性能分析会话详情页\n\n我们想要访问的图是 Roofline（顶线模型），它显示了我们的代码到为止取得的性能。如*图 7.18* 所示，圆表示当前性能。\n\
  \n此图呈现三条重要的线，其中两条是水平线。下方的线是双精度浮点运算的限制，而上方的是单精度浮点运算的限制。对角线代表内存限制，它表明如果我们的圆更靠向图表的左侧，可能可能是受内存访问模式的限制；如果它更靠向图表的右侧，则是受计算的限制。\n\
  \n![图 7.18: 内核的 Roofline 图](img/file40.png)\n\n图 7.18: 内核的 Roofline 图\n\n我们的第一次执行是经过调试编译的没有任何优化的算法。如我们在*图\
  \ 7.18* 中所示，我们的计算强度位于图表的中间，因此我们可以从内存和计算两方面进行改进。\n\n我们要查看的下一张图是 `Memory Chart`（内存图），它位于\
  \ `Workload`（负载）部分。这张图很重要，因为它显示了内存的使用情况。\n\n如我们在*图 7.19* 所示，我们的内核只访问全局内存，这是最慢的内存类型。这就是为什么我们在*图\
  \ 7.15* 的建议中提到了流水线停顿；它提到我们的内核正在等待 L1 缓存。\n\n![图 7.19: 内核的内存图](img/file41.png)\n\n\
  图 7.19: 内核的内存图\n\n下一个重要部分是 `Occupancy`（占用率），它显示了 GPU 资源的使用情况。如*图 7.20* 所示，我们可以了解改变每块线程数、寄存器数量（数据访问速度快）以及线程使用的共享内存量的影响。\n\
  \n在我们的代码版本中，没有使用共享内存，所以这提示我们应该考虑进行更改，通过不返回全局内存来加速我们的计算。\n\n![图 7.20: 内核的占用率](img/file42.png)\n\
  \n图 7.20: 内核的占用率\n\n我们将探索的下一个部分是 `Source Counters`（源码计数器），其中 `Most Instructions\
  \ Executed`（执行最多的指令）面板允许我们点击链接进入 `Source`（源码）页。在*图 7.21* 中，我们可以看到源文件中执行次数最多的行。\n\
  \n由于编译了调试信息，我们可以点击此处进入相关行，如*图 7.22* 所示。这里有一个重要的点是，当我们第一次加载此页面时，它在寻找程序源代码可能会有问题，因为我们的可执行文件在\
  \ build 文件夹中，而源代码在上一层。所以我们需要点击 `Resolve` 按钮并选择源代码文件夹。`Resolve` 按钮在第一次加载屏幕时出现，一旦源文件位置配置好，它就会如*图\
  \ 7.22* 所示变为 `Redo Resolve`（重新解析）按钮。\n\n\n\n\n现在，回到源代码，我们可以看到第 15 行是 `for` 循环，这当然是执行频率最高的指令。然而，我们真正的问题在第\
  \ 16 行。\n\n![图 7.22: 执行频率最高的代码行](img/file44.png)\n\n图 7.22: 执行频率最高的代码行\n\n第 16 行负责两次全局内存访问，这将是我们在`使用共享内存（Using\
  \ shared memory）`章节中优化的重点。不过，现在让我们继续进一步探索一下这个工具。*图 7.23* 展示了我们在*图 7.22*中看到的源代码相关的汇编代码面板。屏幕上并排显示了\
  \ C++ 代码和汇编代码，以便我们检查生成的代码是否符合我们的预期。（在书中我们不会深入研究 GPU 的汇编代码，但如果你想查看代码的编译结果，了解如何获取这些信息是非常重要的。）\n\
  \n![图 7.23: 选定代码的汇编代码](img/file45.png)\n\n图 7.23: 选定代码的汇编代码\n\n在继续之前，让我们来看看另一个有趣的工具。我们可以点击`添加基准（Add\
  \ Baseline）`来保留当前值，以便与其他性能分析会进行对比。点击按钮后，我们得到了在*图 7.24*中所示的结果。\n\n![图 7.24: 当前执行结果作为基准添加](img/file46.png)\n\
  \n图 7.24: 当前执行结果作为基准添加\n\n现在我们已经知道在`详情（Details）`页面上要寻找什么，并且已经了第一个用于对比的基准，让我们在下一节看看如何使用所有方法中最简单的一种来优化代码：使用带有编译器优化标志的\
  \ Release 配置。\n\n### 使用 Release 配置（Using the Release configuration）\n\n在上一节中，我们对矩阵乘法内核的基础版本进行了性能分析，该版本使用了我们所谓的*朴素（naive）*方法处理问题，没有任何代码优化。优化代码最简单的方法是使用编译标志来配置编译器执行优化。\n\
  \n由于我们正在使用 `CMake`，我们需要配置项目以进行不同的编译，我们在 VS Code 终端中通过以下命令来实现：\n\n```\ncmake -DCMAKE_BUILD_TYPE=Release\
  \ ..\n```\n\n这更改了我们的 Makefile，使其使用 `-O3` 优化级别进行编译，并且在生成的代码中不包含调试信息。这样，编译器将尽可能分析我们的代码，以应用一些微调，例如循环展开（关于此点的更多内容将在后续章节*使用循环展开进行进一步改进*中进行详细介绍）以及在可能的情况下使用更多的寄存器。\n\
  \n在新配置完成后后，我们需要再次运行 `make`：\n\n```\nmake\n```\n\n编译完成后，我们需要再次使用这个新的可执行文件运行性能分析器，操作方法是再次点击项目并点击`启动（Launch）`按钮。\n\
  \n我们在*图 7.25*中再次看到了新版本代码的性能分析结果。\n\n![图 7.25: 同一内核 Release 编译摘要](img/file47.png)\n\
  \n图 7.25: 同一内核 Release 编译摘要\n\n注意，寄存器的数量增加了，而时间大幅下降。鉴于我们只改变了一个简单的配置，这是一个非常好的开始！\n\
  \n在*图 7.26*中，我们可以看到新版本的性能有所提升，这反映在 Roofline 图表中。\n\n![图 7.26: Release 内核的 Roofline\
  \ 图](img/file48.png)\n\n图 7.26: Release 内核的 Roofline 图\n\n我们在*图 7.27*中注意到的另外一点是，L1\
  \ 和 L2 缓存命中率都提高了，这也导致了执行时间的缩短。但同样没有使用共享内存，因为这不能仅由编译器引导，而是需要不同的算法。\n\n![图 7.27: Release\
  \ 内核的内存图](img/file49.png)\n\n图 7.27: Release 内核的内存图\n\n我们的占用率（Occupancy）图表也发生了变化，因为我们现在使用了更多的寄存器，但正如*图\
  \ 7.28*所示，线程数量仍然没有改变，共享内存的使用也没有改变。\n\n![图 7.28: Release 内核的占用率](img/file50.png)\n\
  \n图 7.28: Release 内核的占用率\n\n现在，如果我们仔细观察*图 7.29*，会看到工具提示显示没有可用源码信息。原因是我们在生成代码时没有包含调试信息。\n\
  \n![图 7.29: Release 内核的源码计数器](img/file51.png)\n\n图 7.29: Release 内核的源码计数器\n\n使用\
  \ Release 配置的一个直接影响是丢失了源码中的调试信息，这使得理解接下来的优化步骤可能变得困难得多。然而，在进行代码更改之前，比较使用编译器标志的影响对我们的研究至关重要。我们可以看到，仅仅通过更改配置就实现了惊人的优化。\n\
  \n现在，在下一节中，让我们应用第一个真正的代码优化：更改代码以使用共享内存。\n\n### 使用共享内存改进时间（Using shared memory to\
  \ improve time）\n\n我们将应用的第一个真正的优化是使用共享内存来提高执行时间。这将从根本上改变我们的内核，所以让我们先检查代码。\n\n```cpp\n\
  #define TILE 16\n__global__ void matrixKernel_shared\n         (const float* A,\
  \ const float* B, float* C, int n){\n  __shared__ float Asub[TILE][TILE];\n  __shared__\
  \ float Bsub[TILE][TILE];\n  int tx = threadIdx.x;\n  int ty = threadIdx.y;\n  int\
  \ row = blockIdx.y * blockDim.y + ty;\n  int col = blockIdx.x * blockDim.x + tx;\n\
  \  float sum = 0.0f;\n\n  for(int i=0; i < (n + blockDim.x - 1) / blockDim.x; i++)\n\
  \  {\n     if (row < n && i * blockDim.x + tx < n)\n         Asub[ty][tx] = A[row\
  \ * n + i * blockDim.x + tx];\n     else\n         Asub[ty][tx] = 0.0f;\n\n    \
  \ if (col < n && i * blockDim.y + ty < n)\n        Bsub[ty][tx] = B[(i * blockDim.y\
  \ + ty) * n + col];\n     else\n        Bsub[ty][tx] = 0.0f;\n\n     __synctreads();\n\
  \n     for (int k = 0; k < blockDim.x; k++) {\n        sum += Assub[ty][k] * Bsub[k][tx];\n\
  \     }\n\n     __synctreads();\n  }\n\n  if (row < n && col < n)\n     C[row *\
  \ n + col] = sum;\n}\n```\n*(注：原文代码中 `Assub` 疑为 `Asub` 的笔误，此处按要求保留代码块不翻译)*\n\n我们现在要做我们在*第\
  \ 5 章*中讨论过的内容：将数据预取到共享内存中以便重复使用。\n\n\n\n\n我们的本地共享内存有限，因此我们必须从全局内存中选择一些元素。此外，我们必须记住，在全局内存中，矩阵是以连续数组存储的，因此我们必须计算给定元素的实际索引。我们可以根据每行的起始位置（由\
  \ `row * n` 提供）来计算位置，一旦找到了起始位置，就通过 `i * blockDim.x + tx` 找到我们想要拷贝的当前元素。记住 `tx` 是我们该线程的索引，而\
  \ `i` 会不断增加，直到达到矩阵限制 `n/blockDim.x` 为止。（在这里为了清晰起见，我们简化了限制条件，但实际代码是以我们熟悉的方式对其进行除法，以确保得到的值大于或等于宽度的倍数）。\n\
  \n这意味着什么呢？所有这些计算允许线程访问全局内存中的不同位置（记住 `tx` 是不同的！），由于我们通过将 `i` 乘以 `blockDim.x` 来找到我们正在加载的块（tile），这就像是在一幅非常长的图画上移动相机并拍摄快照。非常聪明，对吧？\n\
  \n我们使用相同的方法来填充本地子矩阵 `B`，因此不再需要讨论这些计算。\n\n在加载第一组块后，我们需要确保所有线程都完成了它们的工作，因此我们发出了 `__syncthreads()`\
  \ 命令让它们全部汇合。之后，我们就知道可以进行计算了，因为共享内存已经填充完毕。\n\n我们接下来将使用另一个 `for` 循环，让每个线程处理计算的一部分。我们不需要担心，因为\
  \ `sum` 变量是每个线程局部的，所以会有多个变量在运行，每个变量都存储结果矩阵中给定元素的部分和。在主循环的每次迭代中，`sum` 变量将多增加一个部分和，直到得到最终结果。\n\
  \n一旦处理完所有的块，我们的线程会将结果保存到全局内存，只要 `row` 和 `col` 的值在矩阵宽度 `n` 的边界内。\n\n在完成这些更改后，我们需要重新编译代码，但首先我们需要通过使用以下命令回到\
  \ Debug（调试）配置：\n\n```\ncmake -DCMAKE_BUILD_TYPE=Debug ..\n```\n\n然后再次使用以下命令构建应用程序：\n\
  \n```bash\nmake\n```\n\n现在，让我们用性能分析器分析这个版本的代码，在 NVidia Nsight Compute 中点击项目并再次点击\
  \ `Launch` 按钮。我们可以在图 7.30 中看到当前的会话。\n\n![Figure 7.30: Summary for shared memory\
  \ kernel](img/file52.png)\n\nFigure 7.30: Summary for shared memory kernel\n\n注意，执行这个版本的时间比朴素（naive）版本要长。这看起来可能很奇怪，但这是因为我们在\
  \ Debug 模式下编译。然而，我们可以看到寄存器的数量增加了，说明优化正在进行中！\n\n接下来，让我们看看图 7.32 中的 Roofline（顶线模型）图。\n\
  \n![Figure 7.31: Roofline for the shared memory kernel](img/file53.png)\n\nFigure\
  \ 7.31: Roofline for the shared memory kernel\n\nRoofline 图给了我们另一个惊喜，因为新版本的性能低于原始的朴素实现。较高的圆是\
  \ release（发布）版本，稍低一点的是我们当前的 debug 模式版本，而之间是朴素实现。然而，我们注意到内存图（Memory Chart）发生了剧烈变化，如图\
  \ 7.32 所示。\n\n![Figure 7.32: Memory chart for shared memory kernel](img/file54.png)\n\
  \nFigure 7.32: Memory chart for shared memory kernel\n\n我们注意到，许多直接对全局内存的访问现在集中在共享内存上，而共享内存要快得多。在这里值得停下来考虑一下。当我们从全局内存预取数据时，似乎并不值得费力处理共享内存，因为我们无论如何都要访问全局内存。但是，这里有一个陷阱。由于我们将数据加载到共享内存中，我们需要为矩阵的每个元素先从全局内存进行加载，但对于随后的计算——记住对于每一行我们都要对所有列进行计算——数据已经存在于共享内存中了，这极大地提升了我们的访问速度。注意在我们的内存图中，大多数访问被重定向到了这个块中。\n\
  \n如果我们查看占用率（Occupancy），会注意到变化还包括更多寄存器的使用以及共享内存的使用，正如图 7.33 所示。\n\n![Figure 7.33:\
  \ Occupancy for shared memory kernel](img/file55.png)\n\nFigure 7.33: Occupancy\
  \ for shared memory kernel\n\n通过使用 Debug 配置，在考虑执行时间时，我们似乎并没有改进，但我们必须考虑我们应用优化的所有维度才能理解细节。\n\
  \n接下来，让我们展开部分和计算循环，以进一步改进性能。\n\n### 使用循环展开进行进一步改进\n\n循环展开（Loop unrolling）是一种扩展循环内执行的计算的技术，以便应用程序能够从更好的寄存器利用和更多指令的并行化中获益。然而，手动这样做可能会令人困惑，因此我们将依靠编译器指令让编译器为我们完成工作。让我们来看代码。\n\
  \n```cpp\n#pragma unroll\nfor (int k = 0; k < blockDim.x; k++) {\n    sum += Asub[ty][k]\
  \ * Bsub[k][tx];\n}\n```\n\n这里新的是使用了 `#pragma unroll`，它要求编译器为我们进行展开。\n\n现在我们不需要再次执行\
  \ CMake，但我们需要通过 `make` 命令构建应用程序。\n\n在图 7.34 中，我们看到了不同版本的总结，它们都是 Debug 配置。\n\n![Figure\
  \ 7.34: Summary for shared memory kernel](img/file56.png)\n\nFigure 7.34: Summary\
  \ for shared memory kernel\n\n按照流程，我们将查看 Roofline 图（图 7.35）。\n\n![Figure 7.35: Roofline\
  \ for shared memory kernel](img/file57.png)\n\nFigure 7.35: Roofline for shared\
  \ memory kernel\n\n当前会话在性能上与上一个相同，但记住我们处于 Debug 配置中，这限制了优化的效果。\n\n下一站是图 7.36 显示的内存图，我们在这里注意到它与图\
  \ 7.32 没有太大区别。\n\n![Figure 7.36: Memory chart for shared memory kernel](img/file58.png)\n\
  \nFigure 7.36: Memory chart for shared memory kernel\n\n转向占用率，我们发现正如预期的，它与之前相同，因为我们没有更改共享内存的数量或寄存器的数量。\n\
  \n![Figure 7.37: Occupancy for shared memory kernel](img/file59.png)\n\nFigure 7.37:\
  \ Occupancy for shared memory kernel\n\n每一个优化周期都会引导我们通过相同的步骤，我们必须注意工具提供的提示和建议。现在我们使用了共享内存并展开了循环，可以关注另一个进一步的建议。在指令统计中，工具提到我们没有利用融合指令（fused\
  \ instructions）（见图 7.38）。\n\n![Figure 7.38: A new recommendation for shared memory\
  \ kernel](img/file60.png)\n\nFigure 7.38: A new recommendation for shared memory\
  \ kernel\n\n融合指令是一种特殊的指令，能够共同执行乘法和加法。这提升了整体性能，我们将在下一节中讨论。\n\n\n\n\n一个常见的例子是融合乘加（`FMA`）指令。该操作在一步内完成乘法和加法。`FMA`\
  \ 的主要优势在于它避免了乘法和加法步骤之间的中间舍入。这意味着该操作不仅速度更快（因为使用了单条指令），而且更精确，因为它减少了舍入误差的累积。本质上，`FMA`\
  \ 允许 GPU 最大化其计算效率和准确性，使其成为高性能任务的关键工具。\n\n这一次我们的代码更改非常简单。\n\n```\n #pragma unroll\n\
  \     for (int k = 0; k < blockDim.x; k++) {\n         sum = fmaf(Asub[ty][k], Bsub[k][tx],\
  \ sum);\n     }\n```\n\n我们仍然不需要执行 `CMake` 配置，但我们需要像以前一样使用 `make` 命令来构建应用程序。\n\n\
  在*图 7.39* 中，我们可以看到我们各个版本的汇总比较，它们现在都处于 Debug 配置模式下。\n\n![图 7.39: 融合指令内核总结](img/file61.png)\n\
  \n图 7.39: 融合指令内核总结\n\n我们注意到寄存器的数量增加了，时间也变增加了，这出乎意料——但同样，我们现在处于 Debug 模式。\n\n*图 7.40*\
  \ 显示了 Roofline 图。\n\n![图 7.40: 融合指令内核的 Roofline](img/file62.png)\n\n图 7.40: 融合指令内核的\
