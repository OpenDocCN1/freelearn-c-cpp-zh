  raw: "A grid, not surprisingly, is a collection of blocks used to execute a kernel.\
    \ The grid organizes many blocks that can be executed independently across the\
    \ streaming multiprocessors. Once again, like threads and blocks, a grid can also\
    \ be one-dimensional, two-dimensional, or three-dimensional, depending on the\
    \ problem structure (`gridDim.x, gridDim.y, gridDim.z`).\n\nBut what is this fixation\
    \ with levels of organization? Let's remember that one way in which our hardware\
    \ accelerates our computations is to parallelize the execution of parts of our\
    \ code as much as possible. In *Chapter 4* we saw how the vector addition program\
    \ did not have a loop to go over all data points exactly because the *hardware\
    \ took care of that for us*. By using these three layers of organization with\
    \ three dimensions each, we guarantee that we can assign a unique thread id to\
    \ each execution thread that will directly map to the data it has to process,\
    \ making it ready for execution at any time.\n\n> **The right sizes**\n\n> \n\n\
    > The number of threads per block is called the block size, and the number of\
    \ blocks in the grid is called the grid size. This can be a little confusing at\
    \ the beginning but these sizes matter. The numbers that go in the block dimensions\
    \ define the number of threads, and this can be at most 1024 (as of this writing).\
    \ However, the number of blocks will be defined by the dimensions of the grid!\n\
    \nIt is worth stopping for a moment to remember that the original objective of\
    \ GPUs was to process *graphical* problems. This helps us understand why having\
    \ three-dimensional structures makes total sense. The fact that we are using GPUs\
    \ for general purposes should not blind us to their origins.\n\n### Putting it\
    \ all together\n\nBefore we move on to discuss how to define the number of threads\
    \ and blocks we should use, it is worth recapping how these configurations work\
    \ together.\n\nWe use the `blockDim` to define the number of threads and how they\
    \ are arranged within the blocks, for example:\n\n`dim3 blockDim(1024, 1, 1)`\n\
    \nAs well as\n\n`dim3 blockDim(32, 32, 1)`\n\nWill both give us the same number\
    \ of threads because `blockDim.x * blockDim.y * blockDim.z = 1024`. However, the\
    \ first example is a good approach to working with vectors while the second is\
    \ better suited to working with matrices.\n\nSo, what we should note is that the\
    \ values that define the block dimensions are used by the scheduler to allocate\
    \ the threads, and thus we have for each `threadIdx.x`, `threadIdx.y`, and `threadIdx.z`\
    \ the different values.\n\nIn a 1D situation we have the global index for a thread\
    \ given by:\n\n`int globalIdx = blockIdx.x * blockDim.x + threadIdx.x;`\n\nWhereas\
    \ in a 2D situation we will have two global indices for the thread given by:\n\
    \n`int globalIdx_x = blockIdx.x * blockDim.x + threadIdx.x;`\n\n`int globalIdx_y\
    \ = blockIdx.y * blockDim.y + threadIdx.y;`\n\nThe same holds true for how gridDim\
    \ defines the number of blocks; this is why we have used `blockIdx.x` and `blockIdx.y`\
    \ in the previous calculation for global indices.\n\n### Launching configurations\n\
    \nUnderstanding threads, blocks, and grids is key to understanding the configuration\
    \ we use to launch a kernel execution. When we were adding vectors in *Chapter\
    \ 4*, we chose to use 256 threads per block, and after that we had to calculate\
    \ how many blocks were needed to accommodate all our data points. For the case\
    \ of vectors of size 100,000,000 we would have:\n\n*100,000,000 / 256 = 390,625\
    \ blocks needed*\n\nHowever, we do not always have easy numbers, and in that case\
    \ we use a more general formula to find the required number of blocks:\n\nWe use\
    \ the integer value so as to ignore anything after the decimal point. This is\
    \ equivalent to using the `floor` function, but that function still returns a\
    \ floating-point value which would need to be converted to an integer. And with\
    \ that, comes the need to calculate inside our kernel what our unique thread id\
    \ is. We do this by getting the current block and thread ids (which are given\
    \ to us by runtime) and performing a simple calculation like:\n\n```\nuniqueId\
    \ = (blockDim.x * blockIdx.x) + threadIdx.x\n```\n\nHere we use the `.x` to refer\
    \ to the dimension of the block or grid that was specified during kernel launch\
    \ configuration. Since our vector addition example is a one-dimensional problem,\
    \ it makes sense to launch the kernel with both block size and grid size using\
    \ just one dimension.\n\n256 threads per block is a common choice for balancing\
    \ performance and occupancy, occupancy being a key concept that refers to the\
    \ ratio of warps executing to the maximum number of warps that a streaming multiprocessor\
    \ can support. The larger the occupancy value the higher the performance, up to\
    \ a certain point. This is because high occupancy can help hide memory latency\
    \ by swapping the waiting warp with a ready warp. If we have too many waiting\
    \ warps or too many ready warps, however, we will see a performance decrease.\n\
    \n> **Big enough problems**\n\n> \n\n> It is a curious fact that if you measure\
    \ the execution of a program that is processing a piece of data that matches the\
    \ number of CUDA cores on your GPU, the numbers will be worse than those seen\
    \ for a larger problem that exceeds the number of available processors. This is\
    \ a little counterintuitive at first, but a lot of things are happening to make\
    \ a CUDA program execute on the device. For example, we have to copy data in and\
    \ out, and we have to launch the execution. If the problem is too small it is\
    \ in effect not worth all that work.\n\nNow that we understand all the indexing\
    \ we need, and how to define the configuration for our kernel executions, we are\
    \ ready to learn in the next section how CUDA can help us improve performance\
    \ when dealing with memory transfers.\n\n## Asynchronous data transfers\n\nAs\
    \ we saw in *Chapter 4*, when copying data to and from the device, we need to\
    \ specify the direction in which we are moving our data. However, in our first\
    \ examples, we waited to copy our entire dataset before starting to process the\
    \ data. After processing we waited for the results to be copied back to the host,\
    \ where our main program could use them. We saw, when considering the time necessary\
    \ to move data, that total runtime increased significantly. Luckily there is something\
    \ we can do to improve on this.\n\nActually, there are two things that work together\
    \ to improve performance: asynchronous data transfers and streams. We will look\
    \ at asynchronous data transfers first.\n\nBeing asynchronous means that once\
    \ data transfer starts, control returns immediately to the CPU which is then free\
    \ to run other code, for example, to gather another part of our large dataset.\
    \ The function that we use for this is `cudaMemcpyAsync`, which conveniently is\
    \ named in a way that's already familiar since we learned how to use `cudaMemcpy`,\
    \ the synchronous version.\n\nFor the sake of clarity let's consider a more concrete\
    \ example. If we have to read data from storage, it can take a while (depending\
    \ on our equipment). Even with modern SSDs (as of writing NVMe memory is the fastest\
    \ consumer-available storage), it is still slower than main memory. This means\
    \ we could load part of our data and start transferring it to our device with\
    \ an asynchronous data transfer, and after scheduling the transfer we can start\
    \ loading the next chunk from disk. By *overlaying* the operations in this way\
    \ we can make the data transfer time invisible. Pretty clever, right?\n\nExploring\
    \ our example a little further, let's put the times needed to process our fictitious\
    \ data together.\n\nScenario 1 – the naive approach:\n\n1 – load data from disk\n\
    \n2 – transfer data to the device\n\n3 – process data on the device\n\n4 – transfer\
    \ data back to the host.\n\nThis scenario is represented in *Figure 5.1*, where\
    \ we see that the only performance gains we might achieve are if we use a large\
    \ number of processing cores, but only during the processing phase.\n\n![Figure\
    \ 5.1: A naive approach](media/file12.png)\n\nFigure 5.1: A naive approach\n\n\
    Scenario 2 – the asynchronous approach:"
