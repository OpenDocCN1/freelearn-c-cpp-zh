    不出所料，网格（grid）用于执行内核（kernel）的块（blocks）集合。网格组织了许多可以在流多处理器（streaming multiprocessors）上独立执行的块。再次，就像线程和块一样，网格也可以是一维、二维或三维的取决于问题的结构（`gridDim.x,
    gridDim.y, gridDim.z`）。


    但这种对组织层级的痴着意味着什么？让我们记住，硬件加速计算的一种方式是尽可能地并行化代码某些部分的执行。在第 4 章中，我们看到向量加法程序没有使用循环来遍历所有数据点，这正是因为*硬件为我们处理了这些*。通过使用这三层各三个维度的组织结构，我们确保可以为每个执行线程分配一个唯一的线程
    ID，该 ID 将直接映射到它需要处理的数据，使其能够随时准备好执行。


    > **合适的尺寸**

    > 每个块的线程数称为块大小（block size），网格中的块数称为网格大小（grid size）。在刚开始可能会有点困惑，但这些尺寸至关重要。块维度中的数字定义了线程数量，截至本文编写最多可以为
    1024。然而，块的数量将由网格的维度定义！


    值得停下来回想一下，GPU 的原始目标是处理*图形*问题。这有助于我们理解为什么使用三维结构是完全合理的。我们正在将 GPU 用于通用目的，这一事实不应让我们忽视它们的起源。


    ### 整合一切


    在继续讨论如何定义我们应该使用的线程数和块数之前，值得回顾一下这些配置是如何协同工作的。


    我们使用 `blockDim` 来定义线程数以及它们在块中的排列方式，例如：


    ```

    dim3 blockDim(1024, 1, 1)

    ```


    以及


    ```

    dim3 blockDim(32, 32, 1)

    ```


    这两者将给我们提供相同数量的线程，因为 `blockDim.x * blockDim.y * blockDim.z = 1024`。然而，第一个示例是处理向量的好方法，而第二个示例更适合处理矩阵。


    所以，我们需要注意的是，定义块维度的值被调度调度器用于分配线程，因此对于每个 `threadIdx.x`、`threadIdx.y` 和 `threadIdx.z`，我们都有不同的值。


    在 1D 情况下，线程的全局索引由：


    ```

    int globalIdx = blockIdx.x * blockDim.x + threadIdx.x;

    ```


    而在 2D 情况下，线程将有两个全局索引：


    ```

    int globalIdx_x = blockIdx.x * blockDim.x + threadIdx.x;

    int globalIdx_y = blockIdx.x * blockDim.y + threadIdx.y;

    ```


    `gridDim` 定义块数量的方式也是如此；这为什么我们在我们在之前的全局索引计算中使用了 `blockIdx.x` 和 `blockIdx.y`。


    ### 启动配置


    理解线程、块和网格是理解我们用于启动内核执行的配置的关键。当我们在第 4 章中进行向量加法时，我们选择每个块使用 256 个线程，之后我们必须计算需要多少个块来容纳所有的数据点。对于大小为
    100,000,000 的向量，我们将：


    `100,000,000 / 256 = 需要 390,625 个块`


    然而，我们并不总是有容易的数字，在这种情况下，我们使用更通用的公式来找到所需的块数：


    我们使用整数值是为了忽略小数点后的任何内容。这等同于使用 `floor` 函数，但该函数仍然返回一个浮点值，该值需要转换为整数。随之而来的是，我们需要在内核内部计算我们的唯一线程
    ID。我们通过获取当前的块 ID 和线程 ID（由运行时提供）并执行一个简单的计算来实现这一点：


    ```

    uniqueId = (blockDim.x * blockIdx.x) + threadIdx.x

    ```


    在这里，我们使用 `.x` 来指代内核启动配置期间指定的块或网格的维度。由于我们的向量加法示例是一个一维问题，使用单个维度通过块大小和网格大小启动内核是有意义的。


    每个块 256 个线程是平衡性能和占用率（occupancy）的常见选择，占用率是一个关键概念，指的是正在执行的线程束（warp）数量与流多处理器可以支持的最大
    warp 数量之间的比例。占用率值越高，性能越高，但仅限于某一点点。这是因为高占用率可以通过用就绪的 warp 交换等待的 warp 来帮助隐藏内存延迟。然而，如果我们有太多等待的
    warp 或太多的就绪 warp，我们将看到性能下降。


    > **足够大的的问题**

    > 有一个奇特的事实，如果你测量处理一个与你的 GPU 上 CUDA 核心数量匹配的数据程序的执行情况，其结果将比那些超过可用处理器数量的更大问题的结果要差。起初这似乎有点违背直觉，但有很多因素在起作用让
    CUDA 程序在设备上执行。例如，我们必须拷贝入和拷贝数据。如果问题太小，这种工作并不可值。


    现在我们理解了所有的索引方法，以及如何定义内核执行的配置，我们准备好在下一节中学习 CUDA 如何帮助提高传输的性能。


    ### 异步数据传输


    正如我们在第 4 章中看到的，当从设备进拷贝数据时，我们需要指定数据移动的方向。然而，在我们的第一个示例中，我们等待拷贝整个数据集后才处理。幸运的是，有两件事共同工作提高性能：异步数据传输和流（streams）。我们将先看异步数据传输。


    异步意味着一旦数据传输开始，控制就会立即返回给 CPU，然后 CPU 可以运行其他代码，例如，收集我们大集的另一部分。我们用于此的函数是 `cudaMemcpyAsync`，它的命名让我们非常熟悉，因为我们学过
    `cudaMemcpy` 的同步版本。


    为了清晰起见，让我们考虑一个更具体的例子。如果我们从存储器读取数据，它可能需要一段时间（取决于我们的设备）。即使是现代 SSD（截至本文编写 NVMe 内存是最快的消费者级存储），它仍然比内存慢。这意味着我们可以加载部分数据并使用异步数据传输将其传输到设备，在调度传输后，我们可以开始从磁盘加载下一块数据。通过这种方式叠加操作，我们可以让数据传输时间变得隐形。很聪明对吧？


    进一步探讨我们的示例，让我们把处理假设数据的时间整合在一起。


    场景 1 – 原始方法：


    1 – 从磁盘加载数据

    2 – 将传输到设备

    3 – 在设备上处理数据

    4 – 将数据传回主机。


    这种场景由图 5.1 所示，我们在图中看到只有在使用大量处理核心时可能获得性能收益，但仅限于处理阶段。


    ![Figure 5.1: A naive approach](img/file12.png)


    Figure 5.1: 原始方法


    场景 2 – 异步方法：


