    \ at a problem will not necessarily solve it faster — getting those processors\
    \ to work together smoothly is where the magic happens.\n\nEnough talk, let’s\
    \ see the code!\n\n```\n__global__ void oddEvenSortStepKernel(double *arr, int\
    \ size, bool *swapped, bool isOddPhase) {\n    int idx = threadIdx.x + blockIdx.x\
    \ * blockDim.x;\n    int i = isOddPhase ? 2 * idx + 1 : 2 * idx;\n     if (i <\
    \ size - 1) {\n        if (arr[i] > arr[i + 1]) {\n            double temp = arr[i];\n\
    \            arr[i] = arr[i + 1];\n            arr[i + 1] = temp;\n          \
    \  *swapped = true;\n        }\n    }\n}\n```\n\nThe actual kernel is amazingly\
    \ simple. Given the phase, it determines whether it must compare and swap odd\
    \ or even pairs of array elements. If we are in the odd phase then all the indices\
    \ are multiplied by 2 and 1 is added, which guarantees an odd number. When in\
    \ the even phase, on the other hand, all the indices are just multiplied by 2,\
    \ guaranteeing an even number. After validating that the index is within our boundaries,\
    \ we test to see if the values are out of order, and if they are, we swap them\
    \ and update the `swapped` flag. Here is the first interesting part. Notice that\
    \ we will have many threads working in parallel and, possibly, overwriting this\
    \ variable. We spend time talking about the importance of synchronization and\
    \ now we are simply letting chaos take place? Not exactly.\n\nTo understand this,\
    \ we need to see another piece of code that executes on the host.\n\n```\nvoid\
    \ oddEvenSortGpu(double *arr, int size) {\n    double *d_arr;\n    bool *d_swapped,\
    \ h_swapped;\n    int threads = 256;\n    int blocks = (size + threads - 1) /\
    \ threads;\n    cudaMalloc((void **)&d_arr, size * sizeof(double));\n    cudaMalloc((void\
    \ **)&d_swapped, sizeof(bool));\n    cudaMemcpy(d_arr, arr, size * sizeof(double),\
    \ cudaMemcpyHostToDevice);\n    do {\n        h_swapped = false;\n        cudaMemcpy(d_swapped,\
    \ &h_swapped, sizeof(bool), cudaMemcpyHostToDevice);\n        oddEvenSortStepKernel<<<blocks,\
    \ threads>>>(d_arr, size, d_swapped, true);\n        cudaDeviceSynchronize();\n\
    \        oddEvenSortStepKernel<<<blocks, threads>>>(d_arr, size, d_swapped, false);\n\
    \        cudaDeviceSynchronize();\n        cudaMemcpy(&h_swapped, d_swapped, sizeof(bool),\
    \ cudaMemcpyDeviceToHost);\n     } while (h_swapped);\n     cudaMemcpy(arr, d_arr,\
    \ size * sizeof(double), cudaMemcpyDeviceToHost);\n     cudaFree(d_arr);\n   \
    \  cudaFree(d_swapped);\n}\n```\n\nOur main interest is with the `do-while` loop,\
    \ but the rest of the code is the context in terms of declarations and preparation.\n\
    \nThis algorithm alternates odd and even phases, but how do we reach termination?\
    \ By monitoring to see if there were no swaps in the last iteration. And here\
    \ is the cool part: we create the `swapped` control variable on the host and pass\
    \ it to the kernel. The many threads operate and may even overwrite each others’\
    \ results, but that is not a problem because no thread would set the value of\
    \ the `swapped` variable to its original `false` value. Either one or more threads\
    \ set the variable value to `true`, or they leave it as it is, regardless of the\
    \ current value.\n\nThe tricky part is that after execution of the two phases\
    \ we need to copy the `swapped` variable back to the host to check its value and\
    \ determine whether we need to keep going or not. After a certain number of iterations\
    \ no more swaps occur, and we terminate the execution.\n\nAlthough not sophisticated,\
    \ this is the perfect algorithm to illustrate the complexity involved in creating\
    \ sorting algorithms that execute efficiently in parallel.\n\n## Summary\n\nIn\
    \ this chapter we learned what makes a parallel algorithm really parallel, and\
    \ how to look for those special parts that can be used to reducethe execution\
    \ time. We also discussed the idea that we are looking for a specific type of\
    \ parallelism that will fit in well with the way GPUs execute programs.\n\nWe\
    \ discussed synchronization, now with more context, and saw it in practice with\
    \ our example programs. Those addressed real-world problems like matrix multiplication,\
    \ numerical integration, and parallel reductions, before finally we tackled the\
    \ hard challenge of sorting in parallel.\n\nIn the next chapter we will discuss\
    \ performance strategies to improve application efficiency, using techniques that\
    \ are more advanced in order to make the most of our hardware.\n\n# Chapter 7:\
    \ Performance Strategies\n\n## Join our community on Discord\n\n[https://packt.link/deep-engineering-cpp](https://packt.link/deep-engineering-cpp)\n\
    \n![](media/file22.png)"
