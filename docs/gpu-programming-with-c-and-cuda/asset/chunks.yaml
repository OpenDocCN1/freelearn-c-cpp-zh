    \nFigure 8.6: The Debug toolbar and our breakpoint at line 8\n\nWe can now use\
    \ the debugger to figure out what the problem is with our code by inspecting the\
    \ values at runtime. When execution hits a breakpoint we can inspect variables,\
    \ step through code, and even evaluate expressions. Since we have a breakpoint\
    \ set inside our kernel, we can click on the **Continue** button of the Debug\
    \ Toolbar and our code will run until that point.\n\n![Figure 8.7: Hitting the\
    \ breakpoint](media/file77.png)\n\nFigure 8.7: Hitting the breakpoint\n\nUsing\
    \ VS Code, we can inspect the values of our variables and the results of processing.\
    \ We can even add watches to certain variables of interest. Unlike breakpoints,\
    \ which trigger on specific code lines, watchpoints activate when the value of\
    \ a variable changes. To add a watchpoint, we select the variable or expression\
    \ and right-click on it and select the **Add to Watch** option from the menu.\n\
    \n![Figure 8.8: Adding a variable to watch](media/file78.png)\n\nFigure 8.8: Adding\
    \ a variable to watch\n\nAfter that we have the **Watch** panel on the left-hand\
    \ side of VS Code, like the following.\n\n![Figure 8.9: The Watch panel with two\
    \ expressions](media/file79.png)\n\nFigure 8.9: The Watch panel with two expressions\n\
    \nConditional breakpoints are another great resource. They allow the code to pause\
    \ only when specific conditions are met, minimizing noise and helping us to focus\
    \ more effectively. Even within the current Debug session we can edit a breakpoint\
    \ to turn it into a conditional breakpoint.\n\n![Figure 8.10: Editing the breakpoint](media/file80.png)\n\
    \nFigure 8.10: Editing the breakpoint\n\nAfter that we can enter our conditional\
    \ expression for the breakpoint and hit enter to accept it.\n\n![Figure 8.11:\
    \ The breakpoint expression](media/file81.png)\n\nFigure 8.11: The breakpoint\
    \ expression\n\nNow when we start a Debug session it will run until the variable\
    \ `idx` reaches the value 127. It is very unlikely that we will be able to add\
    \ a conditional breakpoint for a current Debug session, because once it has started,\
    \ idx will reach 127 faster than we can intervene to add the conditional breakpoint.\n\
    \nAnother powerful debugging technique involves inspecting the **call stack**.\
    \ When a breakpoint is hit, cuda-gdb provides a call stack showing how the code\
    \ arrived at the current execution point (Figure 8.12).\n\n![Figure 8.12: The\
    \ call stack paused on the breakpoint](media/file82.png)\n\nFigure 8.12: The call\
    \ stack paused on the breakpoint\n\nAnother practical aspect of this debugging\
    \ configuration is the ability to visualize variables in different scopes. The\
    \ variables pane in VS Code can show local variables, global memory contents,\
    \ and even shared memory if our code makes use of it.\n\n![Figure 8.13: The variables\
    \ pane](media/file83.png)\n\nFigure 8.13: The variables pane\n\nOne last resource\
    \ that is worth mentioning is the Debug Console.\n\n![Figure 8.14: The Debug console](media/file84.png)\n\
    \nFigure 8.14: The Debug console\n\nAs we can see in *Figure 8.14*, the Debug\
    \ console shows information relevant to program execution. However, for the majority\
    \ of our cases the use of breakpoints and flow control is enough to make our lives\
    \ considerably easier.\n\nOverall, using VS Code with cuda-gdb for CUDA debugging\
    \ offers a rich, user-friendly, and powerful environment. It combines the low-level\
    \ control and insights of cuda-gdb with the modern, intuitive interface of VS\
    \ Code. Whether we are tracking down memory issues, examining thread behavior,\
    \ or stepping through complex kernels, this setup provides all the tools we need\
    \ to make CUDA debugging highly effective. "
