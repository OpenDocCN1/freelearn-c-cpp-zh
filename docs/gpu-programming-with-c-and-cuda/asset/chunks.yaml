    \ Host), whereas if we are performing a matrix multiplication then the final result\
    \ will also be a matrix, which will demand more of the data transfer and hence\
    \ the execution time will be increased.\n\nIn b) we see execution of the sequential\
    \ part of the code on the GPU. This may take longer to execute than on the CPU\
    \ for the individual step but may be faster overall.\n\nFinally, c) demonstrates\
    \ how we could overlap blocks in order to process pieces of data on the GPU and\
    \ the CPU at the same time, making the whole computation move forwards faster.\
    \ However, in this case many more data transfers are performed and that could\
    \ affect the overall execution time.\n\nIn the next section we will discuss the\
    \ benefits of using our CUDA-accelerated code with interpreted programming languages\
    \ as one of the alternatives for testing. The other alternative is unit testing\
    \ at the C++ level.\n\n## Testing your code with GTest and Pytest\n\nCreating\
    \ our code is the first part, but we cannot deliver it until we’ve made sure that\
    \ everything is working properly. To guarantee this it is a very good idea to\
    \ have automated, repeatable tests in place that will execute again and again\
    \ to make sure that any new changes do not introduce regressions into our code.\n\
    \n> **TDD starts with the test code**\n\n> \n\n> When using test-driven development,\
    \ we first create a test that calls our code, let's say a function, and then we\
    \ create a version of the function that simply returns false or null. With that\
    \ version, we run the test and it will fail. Then we implement the minimum amount\
    \ of code necessary to make the test pass. We then iterate these steps, creating\
    \ multiple tests, until we have fully functional and tested code that we can rely\
    \ on. With many different tests for each piece of code we can cover different\
    \ error scenarios, corner cases and boundaries, drastically increasing our code\
    \ quality.\n\nHowever, we don't need to create sample programs to run our code;\
    \ instead we can use test frameworks like **GTest** from Google for testing C++\
    \ code, and if we want to test Python code we can use **Pytest**, which can be\
    \ easily added to our Python installation.\n\nLet's start with GTest, since most\
    \ of our code has been in the realm of C++.\n\n### Using GTest with our code\n\
    \nWe will be using our simple program that adds vectors as the example code for\
    \ testing, but as in *Chapter 9*, our project will now have a bit more structure,\
    \ with separate folders for an include file, the source code and the test code.\
    \ This will enable our test code to know about our wrapper function, which is\
    \ necessary because GTest does not know about GPU kernels. As a result we have\
    \ to create a function for it to call, and this function will be responsible for\
    \ handling GPU interactions.\n\nWe will focus here on the test code, since the\
    \ kernel is simply adding the elements from the input arrays as we have already\
    \ seen.\n\n```\n#include <gtest/gtest.h>\n#include \"../include/vector_add.h\"\
    \nTEST(VectorAddTest, SimpleAddition) {\n   int N = 5;\n   float A[N] = {1, 2,\
    \ 3, 4, 5};\n   float B[N] = {10, 20, 30, 40, 50};\n   float C[N] = {0};\n   vectorAdd(A,\
    \ B, C, N);\n   for (int i = 0; i < N; i++) {\n      EXPECT_FLOAT_EQ(C[i], A[i]\
    \ + B[i]);\n   }\n}\n```\n\nFully comprehensive documentation for GTest can be\
    \ found here: [https://github.com/google/googletest](https://github.com/google/googletest).\
    \ Since our interest is in how to use it together with our GPU code we will not\
    \ deep dive into its features, but instead will look at how the calls reach our\
    \ GPU device.\n\nIn this code we use the `TEST` macro to define a test case. The\
    \ first argument is the name of the test suite and the second argument is the\
    \ name of the test case. The code provides simple values to use as inputs for\
    \ our function call, and calls the `vectorAdd` function with them. Up until this\
    \ point nothing really happened in terms of testing; what we need to do is validate\
    \ the result of our function call with some other values that we know to be true.\n\
    \nIn this case we know that we have to add the respective elements, and we are\
    \ doing this inside a `for` loop, and we are adding in place. Note that if our\
    \ kernel was doing anything much more complex than simple addition then we could\
    \ have a situation where we needed, for example, to load results from an external\
    \ text file and use pre-calculated values as the source of truth for our implementation."
