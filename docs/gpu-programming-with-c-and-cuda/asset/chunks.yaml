    # 1 并行编程简介


    ## 在 Discord 上加入我们的社区


    [`packt.link/deep-engineering-cpp`](https://packt.link/deep-engineering-cpp)


    ![](img/file0.png)


    欢迎来到**图形处理器** (**GPU**) 编程的世界！在讨论编程 GPU 之前，我们必须理解什么是并行编程以及它如何让我们的应用程序受益。正如生活中的一切一样，它也有自己的挑战。在这一章中，我们将探索并行编程的优缺点，为深入研究
    GPU 编程奠定基础。因此，在第一章中，我们将讨论各种话题而不编写任何代码。通过这种方式，我们将为整个旅程的构建建立立基础。除了有用外，本章提供的信息对于理解
    GPU 内部发生了什么也至关重要，我们稍后会讨论这一点。到本章结束时，你将理解为什么并行性很重要，以及在何时应用程序中使用它是合理的。在本章中，我们将涵盖以下主要主题：


    * 软件中的并行性是什么，以及它为什么重要

    * 不同类型的并行性

    * GPU 架构概览

    * 比较**中央处理器** (**CPUs**) 和 GPU

    * GPU 编程的优势与挑战

    * 如何高效地与朋友一起准备电影和游戏之夜（相信我）


    ## 技术要求


    对于这一章，我们唯一的技术要求就是坚持阅读的意愿！


    ## 软件中的并行性是什么？


    并行编程是一种让计算机同时做很多事情的方法。但等一下——这不就是每天都在发生的事情吗？*是的，也不是*。今天大多数常见的处理器都能同时执行多个任务——我们指的是*同时*执行。然而，这只是并行软件的首要要求。第二个要求是让至少某些处理器核心以协调的方式在*同一个问题*上工作。让我们考虑一个例子。


    想象你正在承担一项大任务，比如对一大堆书进行排序。与其独自完成，你请了一群朋友帮忙。每个朋友拿书堆中的一小部分并进行排序。你们同时工作，任务完成得要快得多。这类似于并行编程的工作原理：它将一个大问题分解成较小的部分，并使用多个核心同时解决它们。


    当然，选择这个例子是因为它有一个特殊的特点：它是很容易并行化的，意味着我们可以感知到如何将大任务拆分为较小任务。并不是所有问题都能很容易分解为并行处理。我们面临的首要挑战之一是找到将问题分解为可以同时执行的小任务的方法。有时我们的算法中某些部分需要在单核上执行，而其他部分在我们可以分离并行任务之前处于空闲状态。这通常被称为*顺序部分*。是时候换另一个例子了。


    假设你正和朋友一起过电影和游戏之夜。你们决定准备一些食物，为此你们去了超市。为了提高速度，你的朋友也一起来了，这样到达那里后每个人都可以同时选择多种食材——这就是并行部分。然而，由于你们坐同一辆车，无论车上同时有多少持执照的驾驶员，一次只能一个人开车。你总是可以说他们可以轮流开一段，但在这种情况下，去超市只会花费更长时间。


    到达后，每人去不同的过道收集预定义的食材。一旦收集齐所有物品，就出现了另一个关键决策：每个人应该去不同的结账台用信用卡付款，还是如果他们只有一张卡，就应该一起排队？选择并行支付方法揭示了并行处理的另一个有趣方面。


    即使任务是并行处理的（每个人在不同的结账台），执行时间也可能发生不可预测的波动。这意味着在任何时刻，不同队列以不同的速度移动，而那些已经付完食材钱的人最终可能需要等待他们的朋友（处理器）完成。一旦所有付款完成，就会接一个新的顺序部分：开车回家。这次，可能由另一个驾驶员执行这项任务，而其他处理器处于空闲状态，等待下一个任务的执行。在这里，我们收集每个处理器从超市获得的数据，并且必须将这些数据从一个地方移动到另一个地方。在这个小部分，并行性是没有用处的。


    ## 为什么并行性很重要？


    在很多情况下，我们要解决的问题规模会剧增。这时我们必须开始讨论更“严肃”的真实世界应用，例如天气预报、科学研究和人工智能。还记得我们开车去超市时提到可以每段路程更换驾驶员吗？这难道只会让我们浪费更多时间吗？这是由于**上下文切换**——我们必须找一个地方停车，然后换驾驶员，然后一直开车直到下一个停靠点。为什么再次谈论这个？因为在大多数时候，我们需要一个“严肃”的真实世界应用，使得投入研究并行编程的所有细节变得值得。一个例外可能是使用并行编程来加速视频游戏中的图形和物理处理；虽然这些应用对人类生命可能不是关键性的，但它们是相当严肃的。我们可以将视频游戏归类为“严肃”的模拟类别。让我们了解在软件中使用并行性所获得的一些益处。


    ### 加快任务执行


    将任务拆分为可以同时完成的小部分可以大大加快整个过程。我们现在有多个处理器同时处理问题的不同部分。


    ### 资源利用效率


    '
- fmt: '

    Let’s revisit our supermarket example. If all our friends sit idle inside the
    car waiting for one of us to get all the ingredients, we aren''t using our resources
    efficiently. However, when each person is gathering a part of the list, we''re
    better utilizing the resources that were already available. This is the same with
    our computer processor and its multiple cores – they''re already there. Of course,
    most modern processors are capable of decreasing their clock speeds to reduce
    energy consumption, but that doesn''t eliminate the waste of having an idle component.


    ### Handling large datasets

    In fields such as data science, video processing, and scientific research, it''s
    very common to find problems that grow in size very fast. Many of these problems
    use matrices to represent data; when the size of the matrices increases, the time
    required to process them is impacted. By using parallelism, we can ensure that
    we''re executing as much as possible at any given point in time, which makes the
    time to process large amounts of data acceptable.


    ### Enhancing performance

    When we reduce the time needed to process our dataset, this is perceived by the
    user as a performance gain. However, there''s another aspect to this. Even when
    the time isn''t reduced, the user may perceive a performance enhancement by having
    a more detailed simulation – one that uses more parameters (and thus a larger
    amount of data, as we discussed previously). Either way, this results in better
    performance and more responsive applications.


    ### Enabling advanced technologies

    By using parallelism, our capacity to perform simulations allows scientists to
    test more hypotheses than was possible before. Only when simulations seem to point
    in a viable and promising direction do we try them with concrete materials. This
    dramatically decreases the costs of discovery and accelerates the discovery process.


    ## A quick start guide to the different types of parallelism

    So far, we''ve only been talking about parallelism. In this section, we''ll quickly
    discuss the different types of parallelism before we dive into GPUs – which is
    what we''re all waiting for!


    ### Data parallelism

    The process of performing the same operation on different pieces of data so that
    data is processed equally at the same time by different processor cores – for
    example, processing an image to apply some change to each of its pixels – is called
    `data parallelism`. If one of the ingredients that we bought at the supermarket
    was a huge box of carrots that needed to be peeled, we could do that on our own,
    or we could distribute a peeler to each of our friends and perform the same process
    on the same data together, with each person working on an individual carrot.


    ### Task parallelism

    Sometimes, we have multiple steps that aren''t dependent on each other and that
    could be executed by different processor cores. Often, one larger task is divided
    into smaller sub-tasks, each with its own very clear objective, which contributes
    to the larger task but has nothing to do with its sibling tasks. If we revisit
    our friends who have just returned from the supermarket, we can break the larger
    task of preparing dinner into sub-tasks, such as preparing some appetizers, preparing
    the main dish, and preparing a dessert. The data are the ingredients that were
    brought home; the processors will perform different operations. However, to be
    technically accurate, we need to consider that the same data is used as input
    for the parallel sub-tasks, so for the sake of fairness, let''s consider that
    we have two menus tonight but all with the same set of ingredients. That way,
    we could input the same data and have it processed by different functions (cooking
    methods).


    ### Pipeline parallelism

    There''s another arrangement for parallelism we can utilize. Sometimes, we have
    some data processing that depends on the results of some previous processing.
    If we have multiple processor cores to work with, we could assign each processing
    step to a core and create a pipeline that leverages the benefits of parallelism
    as new data becomes available. In a fruit processing factory, we can witness this
    kind of parallelism as new fruits, let''s say apples, arrive for processing and
    packaging. First, the apple truck delivers a large quantity of fruit that''s dumped
    in an artificial water stream. The fruits get washed while being pushed through
    the water stream; once cleaned, a series of workers inspect the fruits to remove
    bad apples. After selection, the apples are separated by size and moved to different
    treadmills, after which they''re packed and sealed, and then boxed and distributed.
    This is exactly analogous to what happens with video processing as well, where
    each video frame is equivalent to a small set of apples.


    ## An overview of GPU architecture

    After all that cooking, it''s time for a change. Let''s talk about GPUs. First,
    let me say that I’ve decided to explain GPUs first before comparing them with
    CPUs. I’m doing this on the assumption that you''re already somewhat familiar
    with the (basic) architecture of a modern CPU. GPUs were originally thought to
    accelerate the output of processing graphics, since modern computer usage takes
    place almost exclusively in graphical environments. This differs from computing
    in the past, where the character-based interfaces that were used weren''t graphically
    demanding. However, a shift occurred when it was noticed that a processing unit
    that was capable of dealing with the computations necessary for computer graphics
    could also be used for anything that could be expressed in terms of matrix computations,
    which is what linear algebra is all about. In the next chapter, we''re going to
    focus specifically on NVIDIA GPUs, but, for now, we''ll consider a general device.
    In this scenario, a GPU has several components so that parallel tasks can be executed.
    The first important thing to note is that a GPU core is capable of performing
    arithmetic and logic operations, such as calculations. A GPU core can''t be used
    for program control; for that, we can organize many cores within a `stream multiprocessor`,
    which is responsible for controlling instruction execution among the many cores.
    As shown in `Figure 1.1 (a)`, a streaming multiprocessor has one control unit
    that works with the `CUDA` cores, whereas in `Figure 1.1 (b)`, we can see that
