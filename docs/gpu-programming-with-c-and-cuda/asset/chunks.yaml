    # 数据传输与处理


    1 – 从磁盘加载分块数据

    2 – 使用加载的数据启动异步传输

    3 – 使用阻塞调用检查数据是否传输完成

    4 – 通过内核异步调用在设备上处理数据

    5 – 开始从磁盘加载下一分块数据

    6 – 将部分结果从设备传输到主机（host）

    7 – 重复上述步骤直到所有数据处理完毕


    在 `图 5.2` 所示的场景中，我们探索了 GPU 的其他特性以获得更高的收益。


    ![图 5.2: 数据传输与处理的重叠](img/file13.png)


    图 5.2: 数据传输与处理的重叠


    通过这个稍微复杂的第二个场景，我们实现了更大程度的重叠，这提升了整体性能。在这个场景下，我们还可以做的进一步提升性能的另一件事是执行从磁盘的异步数据加载。这与
    GPU 无关，超出了我们目前的讨论范围，但基本上，我们可以拥有一个 CPU 线程池，等待数据被加载到某个共享数组中，主线程在数据从磁盘完全加载后即可使用它。


    然而，有一个陷阱——哪不是总是如此呢？！——那就是如果我们使用异步数据传输，我们必须在在使用数据*之前*检查它是否已完成，否则我们可能会使用不完整或损坏的数据。这很有道理，对吧？我们使用
    `cudaStreamSynchronize` 函数来确保传输已完成。


    在每一篇关于 GPU 编程的文本中都会出现一句话，内容类似于：


    “你应当减少计算中数据传输的量”


    作为 GPU 程序员，我们为此苦挣、受苦并斗争，思考如果我们不在设备和主机之间拷贝数据，该如何才能获得任何结果呢？因此，让我们通过理解这一点让心灵从这种诅咒中解脱出来：我们将根据需要使用尽可能的数据传输。然而，我们会非常仔细且留心地考虑如何优化到最后一个字节，以获得更好的性能。这意味着，例如，我们不会盲目地拷贝数据，比如一个接一个地拷贝数组数组，因为拷贝单个大数组的性能比通过许多小操作拷贝相同字节的字节要好。但是，我们不会在需要时剥夺自己拷贝数据的权利。另一个需要考虑的因素是，是否可以尽可能地保留已经拷贝到设备的部分数据，并简单地拷贝其他数据以与现有数据进行处理；在可行的情况下，这也能提高性能。


    我们之前提到的另一个概念是流（streams）。在本章的后面我们有一个专门的章节来介绍它，所以现在只需说，只要我们仔细地将它们分开，就可以让数据传输*和*计算同时发生。


    既然我们谈了这么多内存和性能，现在是时候记住，在大多数情况下，我们在 RAM 中分配的内存是*可分页的**pageable*），这意味着操作系统可能会收回这部分内存，将数据保存到磁盘并让其他应用程序使用该资源。这意味着如果我们想传输一段位于已发送到磁盘的内存页中的数据，操作系统必须在我们开始传输之前将该数据移回
    RAM。


    为了避免这种情况，可以使用页锁内存（page-locked，又名锁页内存/pinned memory），这是一种无法交换到磁盘的特殊内存类型，这意味着当我们需要将分配在该块内存中的数据传输到`device`时，它将是随时可用的。此外，页锁内存支持一种称为`直接内存访问`（`DMA`）的特殊功能，它允许数据传输在不涉及
    CPU 的情况下发生——这意味着速度。


    要使用这种特殊内存，我们需要使用 CUDA 函数 `cudaHostAlloc` 或 `cudaMallocHost` 在主机上分配内存，这些函数会分配锁页内存。这种内存可以用于同步和异步内存传输。


    然而，请记住，能力越大，责任越大（我想我们会在整书中多次看到这一点）。过度使用锁页内存的缺点是限制了整个系统的可用内存量，因此可能会影响整体性能。


    在进入下一个章节之前，还有两个特殊的特性需要讨论：


    *   **统一内存（Unified Memory）**：这是 CUDA 的一项内存管理功能，它抽象了我们一直讨论过的所有内存处理。它向程序暴露了一个统一的内存空间，使得当我们需要使用内存时，CUDA
    运行时将根据需要确保内存页出现在设备或主机上。其缺点是它可能会导致多次不同粒度的内存传输，正如我们现在所知道的，这并不是处理性能的最优方法。但是，它确实简化了内存管理任务。

    *   **零拷贝内存（Zero-Copy Memory）**：简单来说，零拷贝针对的是我们需要访问 GPU 空间内数据的情况。与其执行拷贝操作，不如你直接访问主机内存，但当数据集较小时这种方法更好，因为等待内存传输会导致更大的性能惩罚。


    在下一节中，我们将继续关于 CUDA 流的讨论，以及我们如何将它们与刚刚学习的所有内存资源结合使用，进一步缩短执行时间。


    ## 使用流并行化


    现在我们将讨论帮助提高 CUDA 程序性能的第二个特性：流（streams）。


    我们可以将流想象成队列，我们在其中入队内核执行和内存传输，然后它们会按照被添加的顺序在 GPU 上顺序执行。有一个**默认流**（default stream）接收索引为
    0，它在 ways 没有为执行定义特定流时使用。默认流的一个重要特性是它是同步的，这意味着每个操作在下一个操作开始之前都会完成。这简化了行为，但限制了性能。


    然而，我们可以定义我们自己的非默认流，并在不同的流上执行不同的操作，从而实现内存传输和计算的重叠。由于流没有绑定任何流处理器或内存通道，任何可用的流都会执行请求的操作。


    我们必须记住，流的数量并不直接取决于硬件，尽管它取决于两个*取决于*硬件的因素。第一个是允许到 GPU 的连接数，它由环境变量 `CUDA_DEVICE_MAX_CONNECTIONS`
    控制。该值通常设置为 8，指的是我们将使用的 PCI 连接数。第二个是存在的异步引擎数量；高端 GPU 可能支持多到七并发流，而消费级 GPU 可能支持三个并发流。


    流的另一个强大特性是它们支持同时进行两次内存传输。条件是其中一个是从主机到设备，另一个是从设备到主机。这意味着我们可以同时在流 1 上进行主机到设备的内存传输、在流
    2 上执行内核以及在流 3 上进行设备到主机的内存传输。遗憾的是（截至目前），我们无法在不同的流上并行多个从主机到设备的内存传输。


    注意我们在示例中使用了 1、2 和 3 作为流。这是因为流 0 是用于同步执行的默认流；当我们想要异步地最大化性能时，使用非默认流是非常重要的。


    要创建非默认流，我们使用 `cudaStreamCreate()` 来处理特定操作，而 `cudaStreamDestroy()` 用于流不再需要时释放与其关联的资源。


