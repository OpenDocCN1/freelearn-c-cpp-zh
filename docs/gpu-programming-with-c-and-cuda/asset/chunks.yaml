  trans: "\n\n```\ntrapezoidalKernel<<<gridSize, blockSize, blockSize * sizeof(double)>>>(d_speeds,\
    \ d_partialResults, N);\n```\n\n在 `gridSize` 和 `blockSize` 之后，我们传入了想要为所使用的共享内存块分配的大小。这意味着剩余空间将用作\
    \ L1 缓存。\n\n执行完成后，我们需要再次将部分结果拷贝到主机端（host），并计算最终归约。\n\n```cpp\ndouble *h_partialResults\
    \ =  (double*)malloc(gridSize * sizeof(double));\ncudaMemcpy(h_partialResults,\
    \ d_partialResults, gridSize * sizeof(double), cudaMemcpyDeviceToHost);\ndouble\
    \ gpuResult = 0.0;\nfor (int i = 0; i < gridSize; i++) {\n    gpuResult += h_partialResults[i];\n\
    }\n```\n\n我们在主机端上分配了一个大小为 `gridSize` 的数组并执行了拷贝。现在，一个简单的 `for` 循环就能解决我们的问题。在 CPU\
    \ 上进行归约在这里并不是问题，因为 `gridSize` 比元素总数小几个数量级，所以这种计算不会产生沉重的开销。相反，如果在 GPU 上执行此操作，将导致许多线程空闲，这并不是能量的最有效利用方式。\n\
    \n在下一节中，我们将讨论如何使用简单算法对数据进行并行排序，这个示例将帮助我们讨论同步的影响。\n\n## 排序排序\n\n当我们思考排序时，脑海中浮出的第一个可能是将数字有序地重新排列成序列，从小到大或反反之。但在并行编程中，排序被证明不仅仅是简单的对齐。它是一个涉及协调、耐心和大量同步的问题。并行排序不仅仅是困难——它是一个极具挑战性的拼图，每个碎片都需要知道其他碎片在做什么。在探索中，我们将深入研究一种名为`奇偶排序`（odd-even\
    \ sort）的并行排序方法，看看它告诉了我们哪些关于并行计算中同步的独特挑战。\n\n奇偶排序为使用多个处理器进行排序提供了一个优雅而棘手的解决方案。其基本思想是，与其让每个处理器都处理整个数组，不如让处理器成对工作，比较并交换相邻位置的数字。在每一轮中，我们比较奇数索引的元素与其直接相邻的元素，然后在下一轮中，我们对偶数索引的元素执行相同的操作。通过重复这些步骤（或“阶段”），我们逐渐让未排序的数字越来越接近正确的顺序。\n\
    \n并行排序引入了一个转折：我们必须弄清楚如何协调不同的线程，以便它们不会互相干扰。如果它们不保持协调，最终可能会抵消彼此的工作，导致数据混乱，而不是我们所追求的整齐顺序。\n\
    \n奇偶排序是那些我们专门用于学习的方法之一，因为有更先进的排序算法更适合现实世界的应用。然而，在并行环境中，奇偶排序揭示了同步是多么困难。我们将发现，仅仅向问题中投入更多处理器并不一定能让问题解决得更快——让这些处理器顺畅地协同工作才是魔迹发生的地方。\n\
    \n话不多说，让我们看代码！\n\n```cpp\n__global__ void oddEvenSortStepKernel(double *arr, int\
    \ size, bool *swapped, bool isOddPhase) {\n    int idx = threadIdx.x + blockIdx.x\
    \ * blockDim.x;\n    int i = isOddPhase ? 2 * idx + 1 : 2 * idx;\n     if (i <\
    \ size - 1) {\n        if (arr[i] > arr[i + 1]) {\n            double temp = arr[i];\n\
    \            arr[i] = arr[i + 1];\n            arr[i + 1] = temp;\n          \
    \  *swapped = true;\n        }\n    }\n}\n```\n\n实际的内核函数异常地简单。给定阶段，它决定了必须比较并交换奇数还是偶数的数组元素对。如果我们处于奇数阶段，所有索引都会乘以\
    \ 2 并加 1，这保证了它是奇数。相反，在偶数阶段，所有索引只需乘以 2，保证是偶数。在验证索引在我们的范围内之后，我们测试值是否无序，如果是，我们就交换它们并更新\
    \ `swapped` 标志。这里是第一个有趣的部分。注意，我们将有许多线程并行工作，并可能覆盖这个变量。我们花了时间讨论同步的重要性，而现在我们仅仅是让混乱发生吗？不完全如此。\n\
    \n为了理解这一点，我们需要看另一段在主机端上执行的代码。\n\n```cpp\nvoid oddEvenSortGpu(double *arr, int\
    \ size) {\n    double *d_arr;\n    bool *d_swapped, h_swapped;\n    int threads\
    \ = 256;\n    int blocks = (size + threads - 1) / threads;\n    cudaMalloc((void\
    \ **)&d_arr, size * sizeof(double));\n    cudaMalloc((void **)&d_swapped, sizeof(bool));\n\
    \    cudaMemcpy(d_arr, arr, size * sizeof(double), cudaMemcpyHostToDevice);\n\
    \    do {\n        h_swapped = false;\n        cudaMemcpy(d_swapped, &h_swapped,\
    \ sizeof(bool), cudaMemcpyHostToDevice);\n        oddEvenSortStepKernel<<<blocks,\
    \ threads>>>(d_arr, size, d_swapped, true);\n        cudaSynchronize();\n    \
    \    oddEvenSortStepKernel<<<blocks, threads>>>(d_arr, size, d_swapped, false);\n\
    \        cudaSynchronize();\n        cudaMemcpy(&h_swapped, d_swapped, sizeof(bool),\
    \ cudaMemcpyDeviceToHost);\n    } while (h_swapped);\n    cudaMemcpy(arr, d_arr,\
    \ size * sizeof(double), cudaMemcpyDeviceToHost);\n    cudaFree(d_arr);\n    cudaFree(d_swapped);\n\
    }\n```\n\n我们主要感兴趣的是 `do-while` 循环，但其余代码都是声明和准备工作。\n\n该算法交替奇数和偶数阶段，但我们如何结束呢？通过监控最后一次迭代是否发生了交换。这里是酷的地方：我们在主机上创建\
    \ `swapped` 控制变量并将其传递给内核。许多线程运行并甚至可能覆盖彼此的结果，但这不是问题，因为没有线程会将该值设为原始的 `false` 值。要么是一个或多个线程将值设置为\
    \ `true`，要么它们无论当前值如何，都保持不变。\n\n棘手的部分在于，在执行完两个阶段后，我们需要将 `swapped` 变量拷贝回主机，以检查其值并决定我们是否需要继续。在经过若干迭代后，不再发生交换，我们便停止执行。\n\
    \n尽管该算法并不复杂，但它是说明创建高效并行执行排序算法所涉及的复杂性的完美示例。\n\n"
