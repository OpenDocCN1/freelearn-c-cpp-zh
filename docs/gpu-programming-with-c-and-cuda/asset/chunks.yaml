  trans: '


    起初，人类并不会自然地以并行的方式来处理问题或任务。通常我们先寻找解决方案，*然后*再寻找足够独立的各个。回到我们的烹饪例子，随着经验的增加，从一开始我们就能明显看出，开头菜和甜点是可以并行准备的。


    尽管并行性是提高性能的关键，但算法步骤之间的独立性程度直接影响了我们可能实现的并行化程度，从而限制了可行的加速比。换句话说，投入更多的处理器核心并不会带来成比例的加速提升！


    想象我们要准备一百个纸杯蛋糕。蛋糕糊的成分必须按照特定的顺序进行混合，为了方便类比，让我们假设一批蛋糕糊将用于这百百个单位。以下是需要遵循的步骤：


    1. 混合成分制作蛋糕糊 —— 这是一个顺序执行步骤，需要按顺序执行。

    2. 将其分成小份并倒入纸杯蛋糕模具中。这是可以并行化的，因为我们可能有许多厨师，每个人都获得一份蛋糕糊，准备模具并将其放置在烤盘上。

    3. 第三步是烘烤，此时所有可用的厨师都会空闲地等待监控 `single` 台烤箱的人。这就是我们所说的同步步骤，因为只有在所有内容处理完成后我们才能继续。

    4. 最后一步是将烤好的纸杯蛋糕分发给厨师，让每个人都能创作自己的糖霜样式。


    在这种场景下，当我们回顾描述时，看到了两个可以优化以增加并行性的点。首先，我们可以让许多厨师准备许多份蛋糕糊 —— 但注意，这并不会影响按给定顺序混合成分的需求。另一个是我们可以拥有更多的烤箱，但如果我们为每个厨师提供一台独立的烤箱，我们可能会面临空间和能量的限制。


    这与我们 CPU 与 GPU 的情况完全相似。记得在 `Chapter 1` 中我们讨论过这样一个观点：GPU 是专用硬件，且 `CUDA` 核心与我们在
    CPU 中找到的处理器核心不是同一类型：这就好像 GPU 没有自己的微型烤箱，而 CPU 却有！


    我们将在本章后面讨论矩阵乘法和排序算法时，看到这种算法上的差异。排序将具有依赖于上一个步骤计算结果的交替步骤，导致对同步步骤的需求。


    > **阿达尔定律：加速比限制**


    阿达尔定律强调了必须保持顺序执行的任务的并行性极限。想象一个甜点配谱，其最后的冷却步骤需要 30 分钟。无论你增加多少厨师，在冷却步骤完成之前，菜品无法准备好。同样，在并行计算中，具有不可避免的顺序步骤的任务不会因为增加更多线程而无限加速。如果程序的一部分仍然保持顺序执行，那么将线程数翻倍只能提高程序另一个可并行部分的速度。即使我们可以让并行部分立即执行，总运行时间仍然是执行顺序部分所需的最短时间。


    ![图 6.1: 矩阵乘法的任务分解](img/file15.png)


    图 6.1：矩阵乘法的任务分解


    ### 同步步骤以避免问题


    在上一节中，我们提到了同步步骤，但为什么它们是必要的呢？


    如果我们回到纸杯蛋糕的例子，我们可以把纸杯蛋糕描述为带有某种糖霜的小蛋糕。（虽然可能有些纸杯蛋糕没有糖霜，但为了讨论，我们假设 `all` 纸杯蛋糕都有糖霜。）作为人类，由于之前见过许多纸杯蛋糕的图片，我们习惯地认为糖霜是在纸杯蛋糕的`上方`，但如果你回去再次阅读描述，并没有说糖霜一定在上方。这意味着，如果没有同步步骤，完成准备糖霜步骤的厨师可以在上一个步骤——烘烤——完成之前将糖霜倒在最后的盘子上。因此，一些纸杯蛋糕最终会落在糖霜上，而另一些糖霜则在上方。


    在编程中，我们想要尽可能发现并利用并行化，但我们必须确保获得正确的结果。获得极快但错误的结果是没有意义的！


    虽然有时是必要的，同步会延迟结果，因此我们尽可能避免它。有时，通过改变算法或寻找另一个可以利用的数学属性或等式，我们可以避免同步，但如果不可行，我们就必须接受引入的延迟。处理错误的结果要糟糕得多！


    ![图 6.2: 在汇总所有和之前等待所有局部加法](img/file16.png)


    图 6.2：在汇总所有和之前等待所有局部加法


    ### 平衡工作负载


    由于处理调度是由 `SMs` 自动完成的，为我们的应用程序讨论负载均衡似乎有一点奇怪。然而，在上一节中，我们考虑了可以减少同步需求的算法更改。当我们开始寻找其他算法来避免同步需求时，我们可能会遇到某些线程最终过载的情况，这可能导致瓶颈，即使在不需要同步也会影响整体进度。


    为了说明这一点，让我们考虑之前用过的最常见的负载均衡器：在奇偶数之间分配处理。我们测试一个数字是否能被 `2` 整除，如果是，则它是偶数；否则它是奇数。这效果良好，因为一半的数字是偶数，另一半是奇数。然而，如果我们想处理一个数字数组，并仅在值被
    `3` 整除的情况下应用某些特殊处理，就会出现不平衡，因为只有 `33.33%` 的数字是 `3` 的倍数。假设我们正在处理海量的数字，我们无法预先得知会有
    `3` 的倍数进入。假设我们有一个针对 `3` 的倍数的特殊内核（kernel），另一个针对所有其他数字的内核，那么这意味着我们在处理其中一组时，可能会导致核心空闲。另一方面，如果我们让
    `3` 的倍数以步长 `3` 的跨度与非倍数交错排列，我们就可以将 `ids` 为 `3` 的倍数的线程分配给这些特定位置。这就像是预先分配三分之一的线程给这些数字。


    当然，这只是一个任意的例子，但它对于反思负载均衡的影响很有用。


    ![图 6.3: 负载均衡](img/file17.png)


    图 6.3：负载均衡


    ### 寻找关键路径


    我们一直在讨论在算法中可以找到多少并行性，但很少有应用程序像矩阵乘法那样仅有一个步骤。（除非我们正在创建一个矩阵乘法库！）通常，一个应用程序会有很多步骤或阶段，这些阶段可能具有不同的并行化程度，但这些步骤会创建一个按特定顺序完成的序列。这就像一个食谱，我们在切切土豆之前需要先削皮——我们可以并行化削皮，但在继续之前我们仍然必须完成削皮阶段。


    '
- fmt: '

    This sequence of dependent tasks forms what is known as the ‘critical path’ for
    the application. Identifying this is important because it determines the minimum
    amount of time that can be achieved using parallelism on whichever steps may be
    parallelized. Remember that Amdahl''s Law states that the speed-up we can achieve
    is limited by the portions of our applications that are inherently sequential,
    and we must consider that these will also be part of our critical path.


    When designing parallel algorithms, identifying and minimizing dependencies is
    crucial for optimizing performance. The goal is to ‘unblock’ as many tasks as
    possible so that they can run concurrently. By rearranging tasks and managing
    dependencies we can reduce the time required to complete processing. In some algorithms,
    this is achieved by structuring data or steps to remove unnecessary dependencies,
    allowing the system to proceed in parallel wherever possible.


    If data movement is a necessity, we may try to overlap memory transfers with GPU
    processing, and during that time we may have the CPU preparing other parts of
    data, to make full use of our hardware and asynchronous execution.


    Let us consider an application in which we need to calculate the matrix multiplication
    of values from the user profiles of some system like a streaming service and metric
    weights for a set of movies. After that we reduce the values of each row to obtain
    each user’s score. Lastly, we find the minimum and maximum values.


    ![Figure 6.4: Critical path of the user ranking application](media/file18.png)


    Figure 6.4: Critical path of the user ranking application


    As we can see in `Figure 6.4`, there is no dependency between the final steps
    to find the minimum and maximum values, but we must wait for previous steps to
    complete.


    > **GPU hardware – not so general, but massive**


    >


    > GPU parallelism is different from general parallelism in that we are dealing
    with specific hardware which supports a specific programming model. Many times,
    we will catch ourselves trying to figure out a way to make an application fit
    in with the way the GPU processes data. Other hardware may offer various models
    of parallelism, but few approach the massive parallelism made available by GPUs.
    That is why it may be worth restructuring our applications in many ways to make
    them compatible with the GPU processing model: massive parallelism!


    Designing parallel algorithms requires careful thought about task division, synchronization,
    and load balancing. It is not enough to break down tasks: they must be structured
    to minimize dependencies and maximize parallelism, making synchronization points
    rare and balancing workload among threads. This balance ensures that each thread
    can contribute equally to the outcome, enhancing the algorithm''s overall speed
    and efficiency.


    In the next and following sections we will explore algorithms to perform some
    common computations that can be accelerated using parallelism. We will start with
    matrix processing due to its task-independent nature, but then we gradually move
    to more task-dependent examples to illustrate everything we have been talking
    about.


    ## Computing matrix addition and multiplication


    Let’s dive into matrix addition and matrix multiplication, two operations that
    at first glance might look similar but which actually differ quite a bit, especially
    when it comes to how they are handled by computers – and particularly when programming
    with CUDA.


    Matrix addition is straightforward. Imagine we have two matrices, say `A` and
    `B`, that are the same size. We just add each element in `A` to the corresponding
    element in `B`. So, `C[i][j]=A[i][j]+B[i][j]` for every row `i` and column `j`.
    Since each element''s addition happens independently of the others, this is an
    *embarrassingly parallel* task. That’s a fancy way of saying that each calculation
    is independent of any others, so in theory we could compute them all at once without
    needing to coordinate or wait for results from other parts of the matrix.


    On the GPU, matrix addition is highly efficient because there is no need for synchronization
    between threads. Each thread can just grab a single element from each matrix,
    add them, and store the result. And here is the cool part: if our matrices are
    stored in contiguous blocks of memory (meaning row by row), we can treat this
    as if it is just a long vector of numbers to add. We are just adding two giant
    vectors element by element! By processing each row sequentially, we make the most
    of the memory layout, reducing cache misses and speeding things up. Fortunately,
    matrices usually are stored contiguously, because this is the best way to move
    data from host to device. Since we’ve already covered vector addition in `Chapter
    4` we will not go through the code again.


    Matrix multiplication, on the other hand, is a bit of a different beast. Suppose
    that `A[mn]` and `B[np]` are two matrices – and notice that the number of columns
    in `A` matches the number of rows in `B`. When multiplying matrices `A[mn]` and
    `B[np]`, the element at position `C[i][j]` in the resulting matrix `C[mp]` depends
    on the entire `i`-th row of `A` and the entire `j`-th column of `B`. This creates
    a ‘many-to-many’ dependency that is absent from matrix addition. For each element
    in `C`, we are calculating the sum of products across that row and column, which
    can be described as:


    The `k` that indexes the summation of the elements allows us to access all the
    elements of row `i` from `A` while accessing all the elements of column `j` from
    `B`. For matrix `A` it runs across all the elements of a single row while for
    matrix `B` it traverses all the elements of a single column. This pattern causes
    more work for the processor, and it is harder on the memory system, leading to
    more cache misses.


    In CUDA, matrix multiplication involves breaking the task down into many threads
    that each handle a portion of the computation, with each thread usually being
    responsible for a single element of the resulting matrix `C`. This means that
    each thread will use a row from `A` and a column from `B`. However, unlike matrix
    addition, we have to consider memory access patterns carefully to avoid performance
    drops. Accessing non-contiguous elements, as we do when reading across columns
    of matrix `B`, increases the chances of cache misses, which slows everything down.
    This happens because when we access the global memory for an element, the memory
    system brings a block that fits in the memory cache; if the next element that
    we need is not present in the cache, a new block will be copied from global memory
    to the cache. If after that we need the previous element again, a new copy will
    have to be made. This is a disastrous cycle that degrades performance.


    > **Why is matrix multiplication important?**


    >


    > Matrix multiplication is important because it’s at the heart of so much scientific
    computation – solving systems of equations, running simulations, analyzing data,
    or even training machine learning models. When you hear about AI models training
    on enormous datasets or weather models predicting hurricanes, there’s a high chance
    they are performing matrix multiplication at massive scale. Scientists and engineers
    might spend years developing new ways to make these operations faster or more
    efficient...


    An image can help visualize the necessary memory access patterns and also shows
    how each element calculation is independent of the others.


    ![Figure 5: Independence of tasks in matrix multiplication](media/file19.png)


    Figure 5: Independence of tasks in matrix multiplication

