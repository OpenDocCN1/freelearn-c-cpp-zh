    we will see this many times throughout the book). Overusing pinned memory has
    the drawback of restricting the amount of memory available to the system as a
    whole, so it may affect the overall performance.


    Before we move to our next section there are two more special features to discuss:


    *   **Unified Memory** – this is a memory management feature from CUDA that abstracts
    away all the memory handling that we have been talking about. It exposes a unified
    memory space to the program, such that when we need to use memory, the CUDA runtime
    will guarantee that the memory page is present on either the device or the host
    as needed. The drawback is that it may incur numerous memory transfers of varying
    granularity, and as we know by now, this is not the best way to handle performance.
    However, it is true that it simplifies the memory management tasks.


    *   **Zero-Copy Memory** – in a simpler way, zero-copy targets those times when
    we need to access data within the GPU space. Instead of performing a copy you
    access the host memory directly, but this is better when the dataset is small
    so that waiting for memory transfers would result in greater performance penalties.


    In the next section we resume our conversation about CUDA streams and how we can
    use them together with all the memory resources we''ve just learnt about to improve
    execution times even further.


    ## Parallelizing with streams


    Now we will talk about the second feature that helps improve performance of CUDA
    programs: streams.


    We can think of a stream as a queue on which we enqueue kernel executions and
    memory transfers, which are then executed sequentially on the GPU in the order
    in which they were added. There is a **default stream** which receives index 0,
    which is used when we don’t define a specific stream for execution. One important
    characteristic of the default stream is that it is synchronous, meaning that each
    operation will complete before the next starts. This simplifies behavior but limits
    performance improvements.


    However, we can define our own non-default streams and execute different operations
    on different streams so that we end up overlapping memory transfers and computations.
    Since streams are not tied to any streaming processor or memory channel, anything
    available will execute the requested operations.


    We must keep in mind that the number of streams is not directly hardware dependent,
    although it depends on two things that *are* hardware dependent. The first is
    the number of connections allowed to the GPU, which is controlled by the environment
    variable `CUDA_DEVICE_MAX_CONNECTIONS`. This is usually set to 8 and refers to
    the number of PCI connections that we will be using. The second is the number
    of async engines present; high-end GPUs may support up to seven concurrent streams
    while consumer level GPUs may support around three concurrent streams.


    Another great feature of streams is that they support two memory transfers at
    the same time. The condition is that one must be from host to device and the other
    from device to host. This means that we can have one memory transfer from host
    to device on stream 1, a kernel execution on stream 2, and a memory transfer from
    device to host on stream 3 all at the same time. Unfortunately, we cannot have
    multiple memory transfers on different streams from host to device in parallel
    (as of the time of writing).


    Notice that we used 1, 2, and 3 as the streams in our example. This is because
    stream 0 is the default one that synchronizes executions; when we want to maximize
    performance asynchronously it is important to use non-default streams.


    To create non-default streams, we use `cudaStreamCreate()`, to handle specific
    operations, while `cudaStreamDestroy()` is used to free the resources associated
    with a stream once it is no longer needed.'
