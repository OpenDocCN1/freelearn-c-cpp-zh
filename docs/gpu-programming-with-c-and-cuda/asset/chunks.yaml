    \ setup.py build_ext --inplace\n```\n\nHaving built our extension in the current\
    \ folder, if we execute our Python program from this folder, the interpreter will\
    \ be able to find our library. If we need to install our extension to the system,\
    \ we can use:\n\n```\nsudo python3 setup.py install\n```\n\nThis command uses\
    \ `setup.py` to first define which files should be built for this extension and\
    \ then specifies the setup process with the module name that we will use to import\
    \ in our programs.\n\nNow, here is what the Python program that uses this extension\
    \ looks like:\n\n```\nimport vector_add_wrapper as vaw\nimport random\nN = 1000\n\
    a = [random.randint(0, N) for _ in range(N)] \nb = [random.randint(N, 2*N) for\
    \ _ in range(N)] \nresult = vaw.vectorAdd(a, b, N)\n```\n\nWe see two differences\
    \ from the previous version based on `ctypes`: first, the code looks a lot more\
    \ like pure Python code, and this is because the extension is doing the heavy\
    \ lifting for us backstage; second, we are using Python lists to input data that\
    \ is being randomly created via the `random` module. In the previous version we\
    \ used `numpy` arrays and passed in their internal pointers to actual data.\n\n\
    There are several issues to consider here. First, copying data may take a long\
    \ time as the size of the arrays increases, but not only does it take longer (throwing\
    \ away all the benefits of GPU execution) but also it *doubles* the size of memory\
    \ that our data is occupying in the system main memory, because as we are copying\
    \ each element from the list to the array they now reside in two different memory\
    \ locations. Finally, to access the list elements we have to make two function\
    \ calls, one to get the value and the other to convert it to the correct data\
    \ type. We will see later that for smaller sized arrays this does not greatly\
    \ impact overall performance, but for large arrays it can totally degrade performance.\n\
    \nFor now, we know that if we could just directly access the internal data from\
    \ `numpy` like we did with `ctypes` that could really improve our results. So,\
    \ in the next section we will update our extension to integrate with `numpy` and\
    \ leverage that.\n\n## Passing numpy arrays to your library\n\nIn our first integration\
    \ we passed in numpy arrays to our library using `ctypes`, and using `numpy` is\
    \ essentially everywhere in scientific computing with Python. It provides efficient,\
    \ contiguous memory storage, vectorized operations, and it uses accelerated CPU-based\
    \ libraries. By integrating the C API of `numpy` into our C extension, we will\
    \ be able to use the data that has been created and preprocessed on the Python\
    \ side to execute further calculations inside our GPU. This means we can put together\
    \ the best of two worlds and still feel like Python. In many cases, the performance\
    \ gains can be orders of magnitude higher than pure Python implementations, especially\
    \ for operations involving large arrays.\n\nWe will change a little bit of our\
    \ previous code to make the `numpy` API available. The first change is to import\
    \ it in our `vector_add_np_wrapper.c` file with:\n\n```\n#include <numpy/arrayobject.h>\n\
    ```\n\n> **`numpy` `as np`**\n\n> \n\n> Python allows us to import a library and\
    \ give it a different name by using ‘`as`’, and it is usual for applications using\
    \ numpy to say ‘`import numpy as np`’ so that they can refer to the library as\
    \ np instead of by its full name. We also use this approach here to differentiate\
    \ our initial wrapper and the version that integrates with `numpy`, namely `wrapper_np`."
