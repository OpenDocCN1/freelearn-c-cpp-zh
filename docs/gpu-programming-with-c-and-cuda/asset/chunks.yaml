- fmt: '

    # Data Transfer and Processing


    1 – load a chunk of data from disk

    2 – start an asynchronous transfer with the loaded data

    3 – check if data is transferred with a blocking call even4 – process data on
    the device with an asynchronous call to the kernel

    5 – start loading the next chunk of data from disk

    6 – transfer the partial results from device to host

    7 – repeat until all data is processed


    In this scenario, shown in `Figure 5.2`, we explore other features of the GPU
    to achieve higher gains.


    ![Figure 5.2: Overlapping data transfer and processing](media/file13.png)


    Figure 5.2: Overlapping data transfer and processing


    With this second scenario, which is a little more sophisticated, we achieve greater
    overlapping, and this improves the overall performance. One more thing we can
    do in this scenario to improve performance even more is perform an asynchronous
    data load from disk. This has nothing to do with GPUs, and is outside our present
    scope, but basically we could have a pool of CPU threads waiting for data to be
    loaded to some shared array, which the main thread could use once fully loaded
    from disk.


    However, there is a catch – isn''t there always?! – in that if we use an asynchronous
    data transfer we have to check whether it has completed *before* using the data,
    otherwise we might end up using incomplete or corrupted data. Makes sense right?
    We use the `cudaStreamSynchronize` function to ensure that the transfer is complete.


    There is one more thing that is present in every text related to GPU programming,
    which reads something like this:


    “Thou shall diminish the amount of data transfer in thine computations"


    And as GPU programmers, we struggle and suffer and battle this, thinking how can
    we achieve any results if we do not copy data to and from the device? So let us
    free our hearts from such a curse by understanding that we will use as many data
    transfers as needed. However, we will be very careful and mindful about how to
    optimize things to the last byte in order to perform better. This means, for example,
    that we will not copy data recklessly, like copying an array of arrays one array
    at a time, because copying a single large array performs better than copying the
    same amount of bytes via many smaller operations. However, we will not deprive
    ourselves of copying data when necessary. Another thing to consider is whether
    it is possible to keep part of the data already copied to the device for as long
    as possible, and simple copy other parts of the data to process against the existing
    data; this also improves performance when it is possible.


    The other concept that we mentioned before was streams. We have a full section
    dedicated to it later in this chapter so, for now, it is enough to say that we
    can have data transfers *and* computation occurring at the same time if we separate
    them carefully.


    Since we are talking so much about memory and performance, now is a good time
    to remember that in the majority of cases, the memory we allocate in RAM is *pageable*,
    which means that the operating system may claim that memory, save data to disk
    and let other applications use the resource. This also means that if we want to
    transfer a piece of data that was located in a memory page that was sent to disk,
    the operating system will have to move that data back to RAM before we can start
    our transfer.


    To avoid this situation, it is possible to use page-locked (a.k.a. pinned) memory,
    which is a special type of memory that cannot be swapped to disk, meaning that
    when we need to transfer the data allocated in that piece of memory to a `device`,
    it will be readily available. Furthermore, page-locked memory supports a special
    feature called `Direct Memory Access` (`DMA`) which allows data transfers to happen
    without involving the CPU – and that means speed.


    To use this special memory, we need to allocate our memory on the host using the
    CUDA functions `cudaHostAlloc` or `cudaMallocHost` that allocate pinned memory.
    This memory may be used for both synchronous and asynchronous memory transfers.


    Remember, however, that with great power comes great responsibility (and I think
    we will see this many times throughout the book). Overusing pinned memory has
    the drawback of restricting the amount of memory available to the system as a
    whole, so it may affect the overall performance.


    Before we move to our next section there are two more special features to discuss:


    *   **Unified Memory**: this is a memory management feature from CUDA that abstracts
    away all the memory handling that we have been talking about. It exposes a unified
    memory space to the program, such that when we need to use memory, the CUDA runtime
    will guarantee that the memory page is present on either the device or the host
    as needed. The drawback is that it may incur numerous memory transfers of varying
    granularity, and as we know by now, this is not the best way to handle performance.
    However, it is true that it simplifies the memory management tasks.

    *   **Zero-Copy Memory**: in a simpler way, zero-copy targets those times when
    we need to access data within the GPU space. Instead of performing a copy you
    access the host memory directly, but this is better when the dataset is small
    so that waiting for memory transfers would result in greater performance penalties.


    In the next section we resume our conversation about CUDA streams and how we can
    use them together with all the memory resources we''ve just learnt about to improve
    execution times even further.


    ## Parallelizing with streams


    Now we will talk about the second feature that helps improve performance of CUDA
    programs: streams.


    We can think of a stream as a queue on which we enqueue kernel executions and
    memory transfers, which are then executed sequentially on the GPU in the order
    in which they were added. There is a **default stream** which receives index 0,
    which is used when we don’t define a specific stream for execution. One important
    characteristic of the default stream is that it is synchronous, meaning that each
    operation will complete before the next starts. This simplifies behavior but limits
    performance.


    However, we can define our own non-default streams and execute different operations
    on different streams so that we end up overlapping memory transfers and computations.
    Since streams are not tied to any streaming processor or memory channel, anything
    available will execute the requested operations.


    We must keep in mind that the number of streams is not directly hardware dependent,
    although it depends on two things that *are* hardware dependent. The first is
    the number of connections allowed to the GPU, which is controlled by the environment
    variable `CUDA_DEVICE_MAX_CONNECTIONS`. This is usually set to 8 and refers to
    the number of PCI connections that we will be using. The second is the number
    of async engines present; high-end GPUs may support up to seven concurrent streams
    while consumer level GPUs may support three concurrent streams.


    Another great feature of streams is that they support two memory transfers at
    the same time. The condition is that one must be from host to device and the other
    from device to host. This means that we can have one memory transfer from host
    to device on stream 1, a kernel execution on stream 2, and a memory transfer from
    device to host on stream 3 all at the same time. Unfortunately, we cannot have
    multiple memory transfers on different streams from host to device in parallel
    (as of the time of writing).


    Notice that we used 1, 2, and 3 as the streams in our example. This is because
    stream 0 is the default one that synchronizes executions; when we want to maximize
    performance asynchronously it is important to use non-default streams.


    To create non-default streams, we use `cudaStreamCreate()`, to handle specific
    operations, while `cudaStreamDestroy()` is used to free the resources associated
    with a stream once it is no longer needed.

