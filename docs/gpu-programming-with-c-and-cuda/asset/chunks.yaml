    最显而易见的挑战是，我们无法更改设备的组件，例如，我们无法升级它的内存。硬件限制将直接限制了我们能做的事情，以及我们如何需要拆分数据进行处理。我们还讨论了内存传输，如果我们必须不断在设备和外部之间移动数据，这很容易变成一种开销。通常，我们会尝试将数据移动到设备中，并在被迫移动更多数据之前尽可能地进行计算。另一个方面是，某些类型的计算并不适合在
    GPU 内执行，例如分支过多或无法并行化的代码（还记得开车去超市的情况吗？）。如果作为将数据移出设备内存的备选方案，我们可能会选择在设备上执行顺序代码。此外，内存管理考虑是开发过程中一个贯穿的因素，因为错误的内存访问模式可能会带来性能损失，从而抵消使用
    GPU 的初衷。这些限制显而易见：为 GPU 设备开发程序比为 CPU 编写传统的顺序软件要复杂得多，开发者必须投入时间来学习必要的知识。


    ### GPU 优势


    尽管开发 GPU 软件面临挑战，但其收益远大于挑战。最直接的优势是其巨大的并行性；即使是对于简单的 GPU，我们也能获得数百个处理器核心。如果我们能将解决方案建模为线性代数方法，那就更好了，因为这将允许我们在处理中实现高吞吐量，特别是当我们相应地规划了内存传输时。此外，现在有许多专门的库让开发我们的应用程序变得更容易；数学建模所需的大多数数值方法已经存在经过充分测试的库中。如果可以使用其中一个库，不仅将缩短开发时间，还将提高质量。此外，使用
    GPU 实现高数据吞吐量的直接结果是更好的能源利用率——这是同时执行许多操作的另一个优势。


    ## 总结


    在本章中，我们学习了关于并行软件及其主要模式的各种概念。我们学习了 GPU 的架构，并将 GPU 与 CPU 进行了比较，以理解为每种设备开发软件的差异。最后，我们讨论了在应用程序中使用
    GPU 的挑战和收益。到目前，掌握了这些新知识，一个实用的附加好处是，我们可以更高效地与朋友组织活动，更快地去超市并据此准备开心菜。在下一章中，我们将学习如何配置环境以便开始编程。为了让一切都准备就绪，我们必须采取几个步骤。我们将讨论两种替代方案：使用
    Docker 和直接在我们的机器上安装它。


    # 2 设置你的开发环境


    ## 在 Discord 上加入我们的社区


    [`packt.link/deep-engineering-cpp`](https://packt.link/deep-engineering-cpp)


    ![](img/file0.png)


    在使用任何开发工具时，拥有一个可用于实验的功能性环境是至关重要的。在使用 GPU 时，正确设置设备变得更加重要。然而，不同的操作系统和发行版之间存在许多差异。我们将学习可以帮助构建程序的工具，以及它们所扮演的角色。此外，我们从何处获取操作系统的官方文档？作为参考，我们将使用
    Ubuntu。本章从开始展示了如何使用 Docker 在配置管理方面让事情变得简单一点，然后通过讨论在我们的系统中直接安装工具来结束。在本章中，我们将涵盖以下主要主题：


    * 开发环境的设置

    * 从何处获取官方文档

    * 如何使用 Docker 简化操作


    ## 技术要求


    在本章中，我们将在计算机上工作，配置环境以使用我们的 GPU。对于操作系统，我们将使用 Linux。虽然可以使用任何发行版，但最好选择一个受 NVIDIA
    官方支持的发行。在 Linux 开源发行版方面，我们有很多选择，但我们将选择 Ubuntu，因为它容易查找和安装，并且有许多在线帖子解决了常见问题。它也受到
    NVIDIA 的官方支持。在编写时，Ubuntu 24.04 LTS 可用，但它尚未被列入 NVIDIA 安装程序对 `CUDA 12.4`（当前版本）的支持列表。相反，我们有
    Ubuntu 20.04 和 22.04，其中任何一个都适用于我们的目的。我们需要一台带有 NVIDIA GPU 的计算机：它可以是你首选云服务上的虚拟机、一台笔记本电脑或台式机，但为了充分利用书中介绍的信息，拥有一个
    NVIDIA GPU 是强制性的。另一个替代方案可能是使用云平台服务，它没有专用的全虚拟机，但提供了对 GPU 的支持，正如 Google Colab 一样，它提供了一个托管的
    Jupyter Notebook 服务，并在一些配置后可以支持 `CUDA C/C++` 编程。可以通过 [`colab.research.google.com/`](https://colab.research.google.com/)
    访问服务，但其配置不在我们的范围内。


    ## 配置你的开发环境


    安装 NVIDIA 的专有显卡驱动程序是基础。这是一个重要的项目，因为 Linux 安装中与 NVIDIA GPU 配合的默认驱动程序是 `nouveau`
    开源驱动，它可以执行图形但无法运行 `CUDA` 代码。我们将学习两种可能的配置。我们将按照一种对我们的机器侵入性较小的顺序进行；在提交直接安装之前，你将有机会对
    `CUDA` 进行实验。在第一种配置中，我们将讨论通过 Docker 执行，在第二种配置中，我们将看到直接在我们的系统上安装一切。每种配置都有优缺点，我们也将进行讨论。为了让我们的策略更清晰，让我们总结一下：


    1. 无论 `CUDA Toolkit` 如何，安装 NVIDIA 专有驱动都是必须——我们要先处理它。

    2. 关于开发环境（即 `CUDA Toolkit`），我们有两种路径：Docker 安装或直接安装在我们的系统上。

    3. 为了确保在做出选择之前考虑两种替代方案，我们先介绍 Docker 路径，因为它的侵入性较小。

    4. 在简要查看 Docker 及其优缺点之后，我们将看到如何利用它。

    5. 在此之后，我们将学习直接安装到系统中。


    现在我们已经概述了策略，在下一节中，我们将学习如何配置运行 `CUDA` 程序所需的视频驱动程序。


    ### 获取正确的视频驱动程序


    有几种方法可以确定你应该使用的驱动程序版本。最简单的方法是访问 NVIDIA 网站 ([`www.nvidia.com/Download/index.aspx?lang=en-us`](https://www.nvidia.com/Download/index.aspx?lang=en-us))
    并根据你的 GPU 和操作系统详细信息填写表单。表单将返回正确的驱动程序：


    ![Figure 2.1 – NIVIDA site for device driver selection](img/file7.jpg)


    Figure 2.1 – NIVIDA site for device driver selection


    对于示例配置，我们得到了以下结果：


    ![Figure 2.2 – NVIDIA site with device driver result from our information](img/file8.jpg)


    Figure 2.2 – NVIDIA site with device driver result from our information

