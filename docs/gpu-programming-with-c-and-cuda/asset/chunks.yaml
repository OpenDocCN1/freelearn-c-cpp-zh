  trans: "\n我们也应该注意到，这是另一种不需要在执行线程之间进行同步的问题。\n\n这一次我们的内核非常简单：\n\n```cpp\n#define N\
    \ 10'000'000 // 速度测量次数\n#define T 0.25 // 测量间隔（15 分钟）\n__global__ void trapezoidalKernel(double\
    \ *speeds, double *distances, int n) {\n   int i = blockIdx.x * blockDim.x + threadIdx.x;\n\
    \   if (i < n - 1) {\n      distances[i] = 0.5 * (speeds[i] + speeds[i + 1]) *\
    \ T;\n   }\n}\n```\n\n记住，我们必须除以 2 来计算梯形形的平均高度，因此我们乘以 `0.5`，这会快一点。此外，我们必须乘以分段宽度；在这种情况下，我们将\
    \ `T` 定义为 `0.25`。所有值都经过计算并存储在一个不同的数组中。执行完此内核后，我们将结果拷贝回主机端（host），并通过累加所有部分结果来计算最终距离。以下是执行该步骤的\
    \ `main` 函数中的代码：\n\n```cpp\ncudaMemcpy(h_distances, d_distances, \n          \
    \ (N - 1) * sizeof(double), \n           cudaMemcpyDeviceToHost);\ndouble gpuResult\
    \ = 0.0;\nfor (int i = 0; i < N - 1; i++) {\n    gpuResult += h_distances[i];\n\
    }\n```\n\n一个有趣的地方是，GPU 实现的性能与 CPU 接近。这是因为我们需要拷贝数据，而且归约（reduction）步骤完全是在 CPU 上处理的。归约过程是下一节的主题，我们将学习如何利用并行性来加速这一过程。\n\
    \n## 多个值归约（Reducing from many）\n\n在并行计算中，归约是一种关键操作，允许我们获取一组值并将它们合并为一个结果。这听起来像是一项简单的任务——例如，累加数字列表或寻找最大值——但在并行上下文中，归约可能比你想象的要复杂。这是因为归约要求我们合并来自多个线程的部分结果，这引入了同步的需求。如果我们不仔细处理，并行性带来的性能提升可能会迅速消失，正如我们在上一节的示例中所看到的那样。\n\
    \n协调的需求源于不同线程正在共同工作，将数据集归约为单个结果。如果没有同步的时间控制和受控的数据访问，线程可能会互相干扰，这可能导致值被覆盖或答案错误。\n\
    \n归约的一个经典示例是对数字数组求和。当我们并行执行此操作时，每个线程可能处理数组的一小部分。但最终，我们需要将这些部分之和合并为一个结果，这需要线程在某些位点进行同步。这一步将归约与“尴尬并行”（embarrassingly\
    \ parallel）任务区分开来，后者每个线程完成其任务时永远无需检查他人。\n\n为了实现高效的归约，我们可以使用类似于树形归约（tree-based\
    \ reduction）的技术，每个线程处理一对数字以计算出一个部分结果。然后，这些部分结果在下一层再次成对合并，每次将值减少一半，直到只剩下一个结果。这种方法受到二叉树启发，可以减少同步步骤的数量，因为“树”的每一层所需的线程交互都更少。\n\
    \n![图 6.7: 求和数组元素的归约示例](img/file21.png)\n\n图 6.7: 求和数组元素的归约示例\n\n归约面临的一个挑战是管理内存访问。如果多个线程试图同时更新同一个变量，它们可能会发生“竞态”（race），导致错误的结果或性能下降。为了避免这种情况，我们采用了原子操作（atomic\
    \ operations）或其他同步机制，这些机制允许线程安全地访问共享内存。这增加了复杂性，但如果没有这些机制，归约操作将变得混乱且不可靠。\n\n记得上一节，当时我们使用梯形积分法计算路程距离。当考虑\
    \ 1,000,000 个数据点时，CPU 和 GPU 方法的执行时间处于同一数量级。当我们在 GPU 上添加并行归约时，我们可以将执行时间缩短一个数量级。然而，代码经过了许多修改，如下所示。\n\
    \n```cpp\n#define N 10'000'000 // 速度测量次数\n#define T 0.25 // 测量间隔（15 分钟）\n__global__\
    \ void trapezoidalKernel(double *speeds, double *result, int n) {\n   extern __shared__\
    \ double sharedData[];\n   int tid = threadIdx.x;\n   int i = blockIdx.x * blockDim.x\
    \ + threadIdx.x;\n   double localDistance = 0.0;\n   if (i < n - 1) {\n     localDistance\
    \ = 0.5 * (speeds[i] + speeds[i + 1]) * T;\n   }\n   sharedData[tid] = localDistance;\n\
    \   __syncthreads();\n   for (int s = blockDim.x / 2; s > 0; s /= 2) {\n     \
    \   if (tid < s) {\n            sharedData[tid] += sharedData[tid + s];\n    \
    \    }\n        __syncthreads();\n   }\n   if (tid == 0) {\n       result[blockIdx.x]\
    \ = sharedData[0];\n   }\n}\n```\n\n现在我们需要一步步理解它与原始内核的区别。首先，我们使用共享内存来存储每个块内部的部分结果。这很重要，因为共享内存比全局内存快得多，但它需要同步来保证一致性。\n\
    \n在 `trapezoidalKernel` 中，我们将 `tid` 定义为 `threadIdx.x`，将 `i` 定义为 `blockIdx.x *\
    \ blockDim.x + threadIdx.x`。每个线程计算其 `localDistance` 并将其存储在 `sharedData[tid]` 中。我们使用\
    \ `__syncthreads()` 确保在继续之前所有线程都已写入。\n\n归约随后通过树的方法进行。在每次迭代中，步长 `s` 从 `blockDim.x`\
    \ 的一半开始，每次减半。`tid` 小于 `s` 的线程将其对应的 `sharedData[tid + s]` 加到自己的值中。我们在每次加法后都调用 `__syncthreads()`\
    \ 以确保和为下一层就绪。最后，`tid == 0` 的线程将最终的块和写入 `result[blockIdx.x]`。\n\n再次仔细考虑这一点，在大数据集中，我们将许多块，每个块都有许多线程。如果我们计算了每个块的部分结果，我们该如何得到最终结果呢？\n\
    \n```cpp\nint blockSize = 256;\nint gridSize = (N + blockSize - 1) / blockSize;\n\
    double *d_speeds, *d_partialResults;\ncudaMalloc(&d_speeds, N * sizeof(double));\n\
    cudaMalloc(&d_partialResults, gridSize * sizeof(double));\n```\n\n首先我们定义了计算所需的块数量——这就是我们的\
    \ `gridSize`。这也定义了 `partialResults` 数组的大小，因为每个处理完速度的块都需要一个槽位。\n\n另一个重要的变化是我们调用内核的方式：\n\
    \n"
- fmt: "\n```\ntrapezoidalKernel<<<gridSize, blockSize, blockSize * sizeof(double)>>>(d_speeds,\
    \ d_partialResults, N);\n```\n\nAfter `gridSize` and `blockSize` we pass in the\
    \ size we want to allocate for the shared memory block to be used. This means\
    \ the remaining space will be used as L1 cache.\n\nWith execution complete we\
    \ need to copy the partial results to our host again and calculate the final reduction.\n\
    \n```cpp\ndouble *h_partialResults =  (double*)malloc(gridSize * sizeof(double));\n\
    cudaMemcpy(h_partialResults, d_partialResults, gridSize * sizeof(double), cudaMemcpyDeviceToHost);\n\
    double gpuResult = 0.0;\nfor (int i = 0; i < gridSize; i++) {\n    gpuResult +=\
    \ h_partialResults[i];\n}\n```\n\nWe allocate an array of `gridSize` on the host\
    \ and perform the copy. Now a simple `for` loop will do the trick for us. Reducing\
    \ on the CPU is not a big deal here because `gridSize` is many orders of magnitude\
    \ less than the total number of elements, so this computation does not incur a\
    \ heavy overhead. Performing this on the GPU, on the other hand, would leave many\
    \ threads idle, which would not represent the most efficient use of energy.\n\n\
    In the next section we’ll discuss how we can sort data in parallel with a simple\
    \ algorithm, and that example will help us discuss the effects of synchronization.\n\
    \n## Sorting data\n\nWhen we think of sorting, the first image that comes to mind\
    \ might be the orderly rearrangement of numbers into a sequence, from smallest\
    \ to largest or vice versa. But in parallel programming, sorting turns out to\
    \ be much more than simply lining things up. It is a problem that involves coordination,\
    \ patience, and a hefty dose of synchronization. Sorting in parallel is not simply\
    \ hard — it is a challenging puzzle, where each piece needs to know what the others\
    \ are doing. In this exploration, we are going to dive into a parallel sorting\
    \ method called `odd-even sort` and see what it tells us about the unique challenges\
    \ of synchronization in parallel computation.\n\nOdd-even sort gives us an elegant\
    \ yet tricky solution to sorting with multiple processors. The basic idea is that\
    \ rather than having each processor work on the entire array, we set processors\
    \ up to work in pairs, comparing and swapping numbers in adjacent positions. In\
    \ one round we compare the elements at odd indices with their immediate neighbors,\
    \ and then in the next round we do the same for elements at even indices. By repeating\
    \ these steps, or ‘phases’, we gradually move our unsorted numbers closer and\
    \ closer to the correct order. \n\nSorting in parallel introduces a twist: we\
    \ must figure out how to coordinate different threads so they do not get in each\
    \ other's way. If they do not stay coordinated, they might end up undoing each\
    \ other's work, leading to a jumble of data instead of the neat order we aim for.\n\
    \nOdd-even sort is one of those methods that we use specifically for learning,\
    \ as there are more advanced sorting algorithms that lend themselves better to\
    \ real-world applications. In parallel, however, odd-even sort shines a light\
    \ on just how hard synchronization is. We’ll see that just throwing more processors\
    \ at a problem will not necessarily solve it faster — getting those processors\
    \ to work together smoothly is where the magic happens.\n\nEnough talk, let’s\
    \ see the code!\n\n```cpp\n__global__ void oddEvenSortStepKernel(double *arr,\
    \ int size, bool *swapped, bool isOddPhase) {\n    int idx = threadIdx.x + blockIdx.x\
    \ * blockDim.x;\n    int i = isOddPhase ? 2 * idx + 1 : 2 * idx;\n     if (i <\
    \ size - 1) {\n        if (arr[i] > arr[i + 1]) {\n            double temp = arr[i];\n\
    \            arr[i] = arr[i + 1];\n            arr[i + 1] = temp;\n          \
    \  *swapped = true;\n        }\n    }\n}\n```\n\nThe actual kernel is amazingly\
    \ simple. Given the phase, it determines whether it must compare and swap odd\
    \ or even pairs of array elements. If we are in the odd phase then all the indices\
    \ are multiplied by 2 and 1 is added, which guarantees an odd number. When in\
    \ the even phase, on the other hand, all the indices are just multiplied by 2,\
    \ guaranteeing an even number. After validating that the index is within our boundaries,\
    \ we test to see if the values are out of order, and if they are, we swap them\
    \ and update the `swapped` flag. Here is the first interesting part. Notice that\
    \ we will have many threads working in parallel and, possibly, overwriting this\
    \ variable. We spend time talking about the importance of synchronization and\
    \ now we are simply letting chaos take place? Not exactly.\n\nTo understand this,\
    \ we need to see another piece of code that executes on the host.\n\n```cpp\n\
    void oddEvenSortGpu(double *arr, int size) {\n    double *d_arr;\n    bool *d_swapped,\
    \ h_swapped;\n    int threads = 256;\n    int blocks = (size + threads - 1) /\
    \ threads;\n    cudaMalloc((void **)&d_arr, size * sizeof(double));\n    cudaMalloc((void\
    \ **)&d_swapped, sizeof(bool));\n    cudaMemcpy(d_arr, arr, size * sizeof(double),\
    \ cudaMemcpyHostToDevice);\n    do {\n        h_swapped = false;\n        cudaMemcpy(d_swapped,\
    \ &h_swapped, sizeof(bool), cudaMemcpyHostToDevice);\n        oddEvenSortStepKernel<<<blocks,\
    \ threads>>>(d_arr, size, d_swapped, true);\n        cudaSynchronize();\n    \
    \    oddEvenSortStepKernel<<<blocks, threads>>>(d_arr, size, d_swapped, false);\n\
    \        cudaSynchronize();\n        cudaMemcpy(&h_swapped, d_swapped, sizeof(bool),\
    \ cudaMemcpyDeviceToHost);\n    } while (h_swapped);\n    cudaMemcpy(arr, d_arr,\
    \ size * sizeof(double), cudaMemcpyDeviceToHost);\n    cudaFree(d_arr);\n    cudaFree(d_swapped);\n\
    }\n```\n\nOur main interest is with the `do-while` loop, but the rest of the code\
    \ is terms of declarations and preparation.\n\nThis algorithm alternates odd and\
    \ even phases, but how do we reach termination? By monitoring to see if there\
    \ were swaps in the last iteration. And here is the cool part: we create the `swapped`\
    \ control variable on the host and pass it to the kernel. The many threads operate\
    \ and may even overwrite each’ results, but that is not a problem because no thread\
    \ would set the value to its original `false` value. Either one or more threads\
    \ set the value to `true`, or they leave it as it is, regardless of the current\
    \ value.\n\nThe tricky part is that after execution of the two phases we need\
    \ to copy the `swapped` variable back to the host to check its value and determine\
    \ whether we need to keep going or not. After a certain number of iterations no\
    \ more swaps occur, and we terminate the execution.\n\nAlthough not sophisticated,\
    \ this is the perfect algorithm to illustrate the complexity involved in creating\
    \ sorting algorithms that execute efficiently in parallel.\n"
