  trans: "\n我们将使用在第 3 节中为 VS Code 和我们的开发容器所配置的环境。如果你选择在你的机器上安装了 `CUDA Toolkit`，那么你可以直接在终端中运行构建命令。代码提供在\
    \ GitHub 仓库中，可以通过此处访问：[`github.com/PacktPublishing/GPU-Programming-with-C-and-CUDA`](https://github.com/PacktPublishing/GPU-Programming-with-C-and-CUDA)。\n\
    \n## 使用现有的库和框架\n\n我们在之前的章节中使用的代码帮助我们理解了如何使用 GPU，你可能会好奇是否已经存在某些库可以提供（例如）矩阵乘法的最优化版本。事实确实如此：是存在的。幸运的是，我们不需要重复轮子，因为\
    \ CUDA 已经提供了一系列成熟、优化的库和框架，它们旨在为常见的计算任务提供高效的实现，极大地减少了我们应用程序的工作量。可用库的完整列表可以在 [`developer.nvidia.com/gpu-accelerated-libraries`](https://developer.nvidia.com/gpu-accelerated-libraries)\
    \ 找到。\n\n这些库针对特定类型的问题，尽管数量很多，但我们将专注于两个与我们之前章节中工作类似的库。这将使我们能够将之前的开发工作与使用库的结果进行比较。第一个库是\
    \ `cuBLAS`，它是 NVIDIA 对基础线性代数程序 (BLAS) 库的 CUDA 实现。它包含了矩阵乘法、向量操作和其他基础数值计算的代码。任何以前用过传统\
    \ BLAS 库的人都能平滑地过渡到 `cuBLAS`。\n\n我们拥第二个库是 `Thrust`，这是一个类似于 C++ 标准模板库 (STL) 的并行算法库。它提供了一种让刚开始\
    \ GPU 编程的开发者感到熟悉的语法，并提供了一个带有向量、归约、排序等的 GPU 计算的高级接口。\n\n### 使用 cuBLAS 乘法矩阵\n\n\
    在我们的程序中使用 `cuBLAS` 时，我们需要记住它不会为我们处理内存传输：我们需要通过将数据复制到 GPU 设备内存中来提供我们想要的数据。我们使用之前用过的\
    \ `cudaMemcpy` 命令完成此。\n\n该示例的完整代码位于我们 GitHub 仓库的 `ch10/cuBLAS` 文件夹中，因此让我们关注使用该库的特定细节。\n\
    \n我们的程序将需要在设备上分配缓冲区并复制数据，以便我们可以调用特定函数执行矩阵乘法。以下是我们需要创建 cuBLAS 上文并执行这些操作的代码：\n\n\
    ```\ncublasHandle_t handle;\ncublasCreate(&handle);\nfloat alpha = 1.0f;\nfloat\
    \ beta = 0.0f;\ncublasSgemm(handle,\nCUBLAS_OP_T, CUBLAS_OP_T,\nN, N, N,\n&alpha,\n\
    d_A, N,\nd_B, N,\n&beta,\nd_C, N);\nfloat* d_C_fixed;\ncudaMalloc(&d_C_fixed,\
    \ size);\ncublasSgeam(handle,\nCUBLAS_OP_T, CUBLAS_OP_N,\nN, N, \n&alpha,\nd_C,\
    \ N,\n&beta,\nnullptr, N,\nd_C_fixed, N);\n```\n\n我们使用两个 cuBLAS 函数是因为它处理数据的方式。让我们逐步分解这段代码。我们创建了两个变量\
    \ `alpha` 和 `beta`，因为将执行的操作是：\n\n因此，我们使用 `alpha` 为 `1.0f` 来乘以 `d_A` 矩阵，并使用 `beta`\
    \ 为 `0.0f`，这样对 `d_C` 矩阵就不会执行操作。让我们更详细地理解这一点。从方程中，我们注意到如果 C 矩阵已经存在，它也可以作为输入，而且在加到\
    \ `A*B` 矩阵乘法的结果之前，它可以先与标量值 `beta` 相乘。然而，由于我们只对矩阵乘法部分感兴趣，我们传递了一个 `nullptr` 作为原始\
    \ C 矩阵，并将值为 `0.0f` 的 `beta`。现在与我们原始的矩阵乘法代码有一个很大的区别：BLAS 库通常处理存储为**列主序（column-major）**格式的矩阵，这意味着在内存中并不是行所有的元素是连续的，而是函数期望找到整列的所有元素。由于这一特性，我们传递了\
    \ `CUBLAS_OP_T` 操作符，告知 cuBLAS 在执行计算时应该考虑矩阵的转置。这样，cuBLAS 就能用我们的行主序矩阵产生正确的值。\n\n\
    > **列主序格式**\n\n> BLAS 的原始实现是用 Fortran 编写的，它以列主序格式存储矩阵，这意味着所有列在内存中是连续的。这与 C/C++\
    \ 语言形成对比，后者在内存中以行连续存储矩阵。来自 BLAS 的整个库生态系统都使用列主序格式，并一直保留至今。可以通过许多优化来减少访问行时否则会产生的性能惩罚。\n\
    \n然而，生成的 `d_C` 矩阵是以列主序格式存储的，因此在将其返回主机之前，我们需要找到一种方法将其转置为行主序格式，就像原始矩阵那样。\n\n一个非常有趣的替代方案是使用\
    \ cuBLAS 的矩阵加法函数，但不提供第二个矩阵。这样，当我们执行 `CUBLAS_OP_T` 时，它会将输入矩阵转置，生成行主序版本的 `d_C`。最后，我们必须调用\
    \ `cublasDestroy(handle)` 进行清理。\n\n在这些操作之后，我们将 `d_C_fixed` 复制到主机并使用。我们获得了以下执行时间：\n\
    \n```\nCPU multiplication took: 1404.17 ms\nDevice copy time: 0.88617 ms\nDevice\
    \ copy back time: 1.4203 ms\nDevice compute time: 3.2975 ms\ncuBLAS overhead:\
    \ 8.7919 ms\nTotal GPU time: 14.4082 ms\n```\n\n我们可以看到，即使考虑到数据传输，GPU 的总时间也比单线程\
    \ CPU 快 100 倍（大约 14 ms 对比 1400 ms）。我们将创建 cuBLAS handle 视为开销，计算时间包含了矩阵乘法和矩阵转置。\n\
    \n### 使用 Thrust 编写 GPU 代码\n\n现在，让我们看看如何使用 Thrust 库排序整数数组和另一个双精度数组。这是一个重要的示例，因为它正是库网站上展示的带有一个指示已性能的图表的代码。我们之前对性能的研究让我们能够更清晰地阅读信息。\n\
    \n这次我们的代码比为 cuBLAS 需要的要简单，因为 Thrust 为我们封装了许多 GPU 交互。我们可以在主机上分配一个向量并填充我们想要排序的数据。之后，只需使用以下代码即可将数据复制到设备：\n\
    \n```\nthrust::device_vector<float> d_vec = host_vec;\n```\n\n假设 `host_vec` 之前已经声明并填充，这行代码将声明我们的设备缓冲区并将数据到其中。这非常方便，虽然比我们手动分配和复制提供的控制更少。在复制完成后，我们可以调用\
    \ `sort` 函数，它与 STL 版本非常相似：\n\n```\nthrust::sort(d_vec.begin(), d_vec.end());\n\
    ```\n\n现在的执行时间如下所示：\n\n```\n ==== Sorting float (33554432 elements) ====\nCPU\
    \ sort time:        2411.68 ms\nGPU copy time:        12.9508 ms\nGPU copy back\
    \ time:   13.4571 ms\nGPU sort time:        17.7616 ms\nGPU total time:      \
    \ 44.1696 ms\n```\n"
