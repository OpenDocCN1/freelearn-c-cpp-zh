    在 `for` 循环之后，我们有两个流同步的请求。这仅仅是为了安全起见，确保我们在确认部分结果已经计算并复制之后，才会使用宿主机缓冲区。


    关于部分结果的一个重要点是：我们正在写入宿主机内存中同一缓冲区的不同位置，这就是为什么我们不会覆盖并行计算出的结果。很酷，不是吗？


    当我们进入循环进行下一次迭代时，请记住 `i` 已经跳过了两个块（chunk）的大小，这允许我们再获取两个块，这种情况将持续直到到达矩阵末尾。


    我们还要记住，我们使用的是一个简化版本——所有数字经过仔细挑选，因此我们在这里不需要进行边界检查。然而，即使我们执行了这些检查，也不会影响最终性能。


    请记住，我们使用的块大小（chunk size）不仅提供了大约 100 MB 的数据，而且它是矩阵总大小的除数，因此我们知道，当我们像现在这样一次迭代两个块时，可以使用两个流来执行循环展开（unroll），并且所有尺寸都是匹配的。如果我们使用源自现实问题的矩阵，我们的数字就不会这么理想了，我们必须检查最后一次迭代是否留有足够的行来复制，或者我们是否需要将最后一个块调整为较小的尺寸。


    这是与我们不使用流的版本相比真正不同的部分。现在我们将对比一些执行性能的数据。


    我们编译了每个程序版本执行十次所需的数据，并计算了它们执行时间的简单平均值。为了计算使用数据的大小，我们用矩阵元素数量乘以每个浮点数 4 字节，然后除以 1024
    以以兆字节（MB）为单位。我们收集了两组执行数据：第一组总数据大小为 1020 MB（`16,380 x 16,380 x 4 / 1024 / 1024`），当矩阵为
    16,380 x 16,380 时，完全符合此处列出的代码。然后，我们还收集了 32,760 x 32,760 尺寸矩阵的执行数据，总数据大小为 4092
    MB（`32760 x 32760 x 4 / 1024 / 1024`）。*表 8.1* 显示了编译结果。


    | 总数据大小 | 块大小 | 数据大小 | 数据分区 | 平均时间 | 增益 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1020 | 273 | 16 | 60 | 128.427 | -7.65% |

    | 546 | 32 | 30 | 89.1392 | 25.28% | |

    | 819 | 48 | 20 | 88.0554 | 26.19% | |

    | 1638 | 100 | 10 | 87.0306 | 27.05% | |

    | 4095 | 252 | 4 | 88.8127 | 25.55% | |

    | 8190 | 508 | 2 | 92.5483 | 22.42% | |

    | 4092 | 273 | 32 | 120 | 445.549 | 11.00% |

    | 546 | 68 | 60 | 356.581 | 28.77% | |

    | 819 | 100 | 40 | 347.283 | 30.63% | |

    | 1638 | 204 | 20 | 343.555 | 31.37% | |

    | 4095 | 508 | 8 | 344.598 | 31.17% | |

    | 8190 | 1020 | 4 | 351.386 | 29.81% | |

    | 16380 | 2044 | 2 | 363.88 | 27.31% | |


    表 8.1：不同块大小和数据大小执行时间


    有趣的是，在两种情况下，当传输数据大小为 100 MB 时，我们获得了最佳性能；第二种情况在使用 204 MB 传输大小时，改进仅为 0.74%。此外，注意到在峰值性能之后，执行时间开始再次上升。


    ![图 8.15：传输大小对 1020 MB 执行时间的影响](img/file85.png)

    图 8.15：传输大小对 1020 MB 执行时间的影响


    ![图 8.16：传输大小对 4092 MB 执行时间的影响](img/file86.png)

    图 8.16：传输大小对 4092 MB 执行时间的影响


