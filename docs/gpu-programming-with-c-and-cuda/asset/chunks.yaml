    \n# Chapter 8: Overlaying Operations\n\n## Join our community on Discord\n\n[https://packt.link/deep-engineering-cpp](https://packt.link/deep-engineering-cpp)\n\
    \n![](media/file70.png)\n\nAn interesting possibility with GPUs is to execute\
    \ multiple operations at the same time. By using CUDA streams, it is possible\
    \ to copy memory to and from the GPU at the same time we execute a kernel, thereby\
    \ overlaying the operations. This means we can have three things happening in\
    \ an interleaved way. (Wait, let me re-format this specific part of the text).\n\
    \nAnother possibility is to have more than one GPU on the same machine, although\
    \ its higher cost means this is a less common setup. We will touch on this interesting\
    \ alternative in a brief overview; it requires careful thinking about the algorithm\
    \ to ensure we make the most of our devices.\n\nBut before we jump into those\
    \ interesting topics, we will start this chapter by exploring how to use VS Code\
