    ![Figure 7.7: Zoom on memory copy – Host to Device](media/file29.png)


    Figure 7.7: Zoom on memory copy – Host to Device


    After that we see a large block with our kernel''s name, representing execution
    of the kernel as shown in *Figure 7.8*.


    ![Figure 7.8: Zoom on kernel execution](media/file30.png)


    Figure 7.8: Zoom on kernel execution


    After that, our application executes a new `Memcpy` operation marked as `DtoH`
    to copy the result matrix from the device to the host (*Figure 7.9*).


    ![Figure 7.9: Zoom on memory copy – Device to Host](media/file31.png)


    Figure 7.9: Zoom on memory copy – Device to Host


    One interesting feature is that we can right-click on any kernel that was executed
    and select the `Profile Kernel` option as shown in *Figure 7.10*.


    ![Figure 7.10: Selecting a kernel to profile](media/file32.png)


    Figure 7.10: Selecting a kernel to profile


    This will bring back the initial configuration screen. Since we are about to execute
    the profile of a specific kernel we need to change some details. The first item
    is already filled for us since we came from a System Trace, while the name of
    the kernel to profile is defined on the second tab as shown in *Figure 7.11*.


    ![Figure 7.11: The selected kernel name](media/file33.png)


    Figure 7.11: The selected kernel name


    Selecting the name of the kernel informs the profiler about which item to analyze
    in detail, and with the help of the System Trace we can figure out which kernels
    we are spending more time on and focus our efforts on optimizing those first.
    Our example has only one kernel, so this decision is obvious, but in a larger
    application we would have to pay attention to this to avoid spending time in the
    wrong places.


    We then select which metrics we want to track, on the `Metrics` tab where we select
    the full analysis as shown in *Figure 7.12*. This option generates data for all
    available metrics.


    ![Figure 7.12: Selecting the metrics set to profile the kernel](media/file34.png)


    Figure 7.12: Selecting the metrics set to profile the kernel


    After clicking the `Launch` button we will see the `Progress Log` as shown in
    *Figure 7.13*. We have to wait for processing to complete in order to get the
    report.


    ![Figure 7.13: Running the profiler](media/file35.png)


    Figure 7.13: Running the profiler


    After the profiling process completes we get a new screen with the report. The
    default screen is the summary, and in the next section we follow a step-by-step
    approach to understanding what the tool is telling us and how to use the techniques
    we’ve already learned for optimizing our code so as to extract the most from our
    hardware.


    ## Optimizing to speed up our code


    Now that we’ve profiled our kernel we have our first report, which provides the
    information we need to optimize our code. In *Figure 7.14* we see the basic information
    resulting from the execution we specified. We see the time it took to execute
    the kernel of the current session, and we can also see the launch configuration
    that was used: (125,125,1) blocks of (16,16,1) threads.


    ![Figure 7.14: The summary of profiling the kernel](media/file36.png)


    Figure 7.14: The summary of profiling the kernel


    We also find, on the `Summary` page, a list of recommendations based on what the
    tool found out about our code that could be improved, as shown in *Figure 7.15*.
    However, we need to look at the details page to understand the recommendations
    in depth.


    ![Figure 7.15: The recommendations for the kernel](media/file37.png)


    Figure 7.15: The recommendations for the kernel


    We do this by selecting the `Details` page on the top left corner of the report,
    as shown in *Figure 7.16*.


    ![Figure 7.16: Selecting the Details page](media/file38.png)


    Figure 7.16: Selecting the Details page


    We then reach the `Details` page, where we have sections that organize the collected
    metrics, as shown in *Figure 7.17*.


    The first section is `GPU Speed of Light Throughput`, where we can see a dropdown
    in the top right side of the screen. Initially it is disabled, as can be seen
    in *Figure 7.17*. We have to open the section to be able to select from the available
    information.


    ![Figure 7.17: Details page for the current profiling session](media/file39.png)


    Figure 7.17: Details page for the current profiling session


    The chart that we want to access is the Roofline, which shows the performance
    our code has achieved so far. As we can see in *Figure 7.18*, a circle indicates
    current performance.


    This chart presents three important lines, two of which are horizontal. The lower
    line is the limit for double-precision floating point operations, while the higher
    is the limit of the single-precision floating point operations. The diagonal line
    represents the memory limit, and indicates that if our circle has bumped more
    on the left-hand side of the chart it is probably being limited by the memory
    access patterns, while if it is bumping more on the right-hand side of the chart
    it is being limited by the computation.


    ![Figure 7.18: Roofline for the kernel](media/file40.png)


    Figure 7.18: Roofline for the kernel


    Our first execution was the basic multiplication algorithm compiled with Debug
    – no optimizations at all! As we see in *Figure 7.18*, our arithmetic intensity
    is in the middle of the chart, so we can improve on both memory and computations.


    The next chart that we are going to look at is the `Memory Chart`, which is found
    in the `Workload` section. This chart is important because it shows how memory
    is used.


    As we see in *Figure 7.19*, our kernel only accesses global memory, which is the
    slowest type of memory. That is why our recommendations mentioned `Scoreboard
    Stalls` back in *Figure 7.15*; it mentions that our kernel is waiting on L1 cache,
    which actually depends on the rest of the memory hierarchy.


    ![Figure 7.19: Memory Chart for the kernel](media/file41.png)


    Figure 7.19: Memory Chart for the kernel


    The next important section is Occupancy, which shows how our GPU resources are
    being used. As shown in *Figure 7.20*, we can learn what the impact would be of
    varying the number of threads per block, the number of registers (which are fast
    for data access), and the amount of shared memory used by the threads.


    In this version of our code we are not using shared memory, so this is a hint
    that we should consider making changes that would help us accelerate our calculations
    by not going back to global memory so.


    ![Figure 7.20: Occupancy for the kernel](media/file42.png)


    Figure 7.20: Occupancy for the kernel


    The next section that we will explore is `Source Counters`, where the `Most Instructions
    Executed` panel enables us to click on a link to go to the `Source` page. In *Figure
    7.21* we can see the line of the source code file that was most executed.


    ![Figure 7.21: Source Counters – Most instructions executed](media/file43.png)


    Figure 7.21: Source Counters – Most instructions executed


    Since it was compiled with Debug information we can click on this to get to the
    relevant line, as shown in *Figure 7.22*. An important note here is that the first
    time we load this page it may have problems finding our program’s source file,
    because our executable is under the build folder whereas our source file is one
    folder up. So we need to click the `Resolve` button and select the correct source
    folder. The `Resolve` button appears the first time we load the screen, and then
    once the source file location is configured it becomes a `Redo Resolve` button
    as we can see in *Figure 7.22*.

