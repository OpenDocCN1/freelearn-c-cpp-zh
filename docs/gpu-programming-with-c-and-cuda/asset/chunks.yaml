  trans: "\n在下一节中，我们将看到一种非常有趣且强大的使用 GPU 的方法。我们已经解释了 `CUDA Streams`（CUDA 流）的概念，但现在我们将使用它们来真正地加速一个真实程序。\n\
    \n## 使用 CUDA 流重叠操作\n\n在 `Chapter 5` 中，我们对 CUDA 流进行了介绍，但现在是学习如何在实践中使用它们了！CUDA 流是\
    \ NVIDIA CUDA 编程模型中的一项强大功能，允许我们并发执行多个操作，从而提高 GPU 负载的吞吐量。这听起来可能很困惑，因为我们知道 GPU 拥有大量的处理器，这就是它们并发执行指令的原因，对吧？嗯，这只是事实的一部分，我们还有另一个层面的并行性需要探索。通过合理利用流，我们可以重叠内存传输和内核执行（kernel\
    \ executions），从而最大限地提高硬件效率。这是可能的，因为大多数消费级 GPU 拥有三个异步引擎：一个用于内核执行，两个用于内存传输（一个用于从主机到设备，另一个用于从设备到主机）。我们将讨论在内存带宽限制下如何最好地利用这些资源。\n\
    \nCUDA 流的核心优势在于它们能够实现并发执行。如果没有流，操作通常是顺序执行的——首先，将数据从主机（CPU）拷贝到设备（GPU），然后启动内核，最后将结果从设备拷贝回主机。这种顺序执行会导致资源未被充分利用的空闲时间。通过使用多个流，我们可以重叠这些任务，这样当一个数据传输进行时，一个内核可以执行，而另一个数据传输（相反方向）也可以发生。这种方法充分利用了三个三个引擎，增加了吞吐量。\n\
    \n为了直观地理解这一点，想象一下在繁忙的厨房里准备一顿大餐。如果只有一个人在做饭，他必须先切蔬菜，然后烧水，接着煮面条，最后制作酱汁——一步一步来——准备这顿饭需要的时间长得多。然而，如果有三个人合作——一个人切菜，另一个人烧水，另一个人准备酱汁——一切都会完成得快。CUDA\
    \ 流的工作原理类似，确保不同的任务（如内存传输和内核执行）同时发生而不是顺序发生，从而保持硬件充分利用并使空闲时间最小化。\n\n然而，硬件限制定义了并发的边界。如前所述，大多数消费级\
    \ GPU 拥有三个异步引擎，这意味着同时只能发生两个内存传输（每个方向一个）和一个内核执行。如果我们尝试入队超过硬件支持的操作，它们会被调度但不会是真正的并行，从而导致性能瓶颈。因此，正确使用\
    \ CUDA 流 涉及仔细地构建工作负载，以确保可用引擎始终处于忙碌状态，而不会让它们过载。\n\n优化 CUDA 流的另一个关键因素是理解 PCIe 总线带宽限制。PCIe\
    \ 总线是 CPU 和 GPU 之间的主要连接，虽然它提供了高速数据传输，但仍然显著慢于 GPU 的内部内存带宽。例如，PCIe 3.0 x16 连接的理论最大带宽约为\
    \ 16 GB/s，但如果我们未使用 x16 插槽，带宽可能会更低。同时，现代 GPU 的内部内存带宽可以超过数百 GB/s。这种巨大的差异意味着通过 PCIe\
    \ 进行的数据传输必须仔细管理，以防止总线成为 GPU 工作负载的瓶颈。\n\n考虑到这一点，现在是进行第一次代码讨论的好时机了。让我们测量内存传输带宽！\n\
    \n### 测量我们的限制\n\n首先，我们将使用一个简单的程序在实践中了解 GPU 的内存带宽。\n\n```\n#include <cuda_runtime.h>\n\
    #include <iostream>\nint main() {\n  cudaDeviceProp prop;\n  cudaGetDeviceProperties(&prop,\
    \ 0);\n  int memClockMHz = prop.memoryClockRate / 1000;// to MHz\n  int busWidth\
    \ = prop.memoryBusWidth;  // In bits\n  float bandwidthInBytes = memClockMHz *\
    \ busWidth / 8;\n  float bandwidthInGB = bandwidthInBytes / 1024; \n  float bandwidthGBs\
    \ = 2.0 * bandwidthInGB;\n  std::cout << \"Mem Clock Speed: \" << memClockMHz\
    \ << \" MHz\\n\";\n  std::cout << \"Mem Bus Width: \" << busWidth << \" bits\\\
    n\";\n  std::cout << \"Estimated Mem Bandwidth: \" << bandwidthGBs << \" GB/s\\\
    n\";\n  return 0;\n}\n```\n\n这段 CUDA 代码使用 `cudaGetDeviceProperties()` 获取 GPU 属性并计算理论峰值内存带宽。`memoryClockRate`\
    \ 属性最初以 kHz 为单位，通过除以 1000 转换为 MHz。`memoryBusWidth` 属性代表内存接口的总位宽（bits）。由于现代 GPU\
    \ 使用 GDDR（图形双倍数据速率）内存，公式将内存时钟乘以 `2.0` 以考虑这种翻倍效应。为了将结果转换为标准单位，该值除以 8（从位切换到字节），然后除以\
    \ 1024（从 MB/s 转换为 GB/s）。得到的 `bandwidthGBs` 值是 GPU 以每秒千字节（GB/s）的理论峰值内存带宽。\n\n这种测量有助于评估\
    \ GPU 的内存子系统，这对于程序性能至关重要。计算出的值代表了理想条件下（假设内存访问模式完全有效）的最大可用带宽。然而，由于内存延迟、访问模式以及线程之间的竞争等因素，实际性能可能会较低。\n\
    \n让我们来看一些执行数字。以下是在我的机器上运行此代码的结果：\n\n```\nMemory Clock Speed: 5501 MHz\nMemory\
    \ Bus Width: 192 bits\nEstimated Bandwidth: 257.859 GB/s\n```\n\n尽管 RTX2060 的理论内存带宽规格为\
    \ 336 GB/s，但在实际情况下要低。但等一下：我们提到 PCIe x16 的理论限制是 16 GB/s——所以无论如何我们无法跟上 GPU 的速度。\n\
    \n让我们使用另一个程序来测量我们在实践中能够实现的传输速率。这个程序并没有特别之处，它使用 CUDA 事件（events）来测量完成不同数据传输大小所需的时间。（完整代码可在我们的仓库中找到。）结果如下：\n\
    \n```\nSize:    1 MB, Time: 0.0915 ms, Bandwidth: 10.667 GB/s\nSize:   10 MB,\
    \ Time: 0.8858 ms, Bandwidth: 11.024 GB/s\nSize:   30 MB, Time: 2.6194 ms, Bandwidth:\
    \ 11.185 GB/s\nSize:   50 MB, Time: 4.2118 ms, Bandwidth: 11.593 GB/s\nSize: \
    \ 100 MB, Time: 8.2360 ms, Bandwidth: 11.857 GB/s\nSize:  300 MB, Time: 24.5889\
    \ ms, Bandwidth: 11.915 GB/s\nSize:  500 MB, Time: 40.8161 ms, Bandwidth: 11.963\
    \ GB/s\nSize: 1024 MB, Time: 83.3972 ms, Bandwidth: 11.991 GB/s\n```\n\n正如我们所见，我们低于\
    \ 16 GB/s 的理论带宽，如果我们看最后一行，为了传输 1 GB，我们需要等待 83 ms。在此期间 GPU 是空闲的，什么也没有处理，这里我们的策略出现了：将数据分成若干块，拷贝一小块，在拷贝下一块到不同的内存缓冲区时开始处理它，然后当新缓冲区准备就绪时开始处理它。这就是我们要做的，我们将利用这些结果来帮助确定最佳的传输块大小。\n\
    \n### 使用 CUDA 流进行乘法运算\n\n"
- fmt: "\nIn `Chapter 7` we used the traditional matrix multiplication problem to\
    \ learn about the optimization techniques available to us. We’ll now use a similar\
    \ problem, but for the sake of comprehensibility one which is a little simpler.\
    \ We will use vector-matrix multiplication – think of it as the first step in\
    \ a matrix multiplication problem. Since we will be having multiple things occurring\
    \ at the same time it might be wise to simplify the problem a little, so that\
    \ we can follow everything that is going on.\n\nIn our repository we also have\
    \ a version of the program that does not use streams, so that we can compare the\
    \ results. A curious thing to note is that, typically, the kernel that works in\
    \ our multi-streams program is the same as that in the no-streams version. The\
    \ difference is really in the main program, which needs to track multiple memory\
    \ copies and data chunks – as we are about to see.\n\nIn fact the kernel is amazingly\
    \ simple, and does not use any advanced optimization strategy:\n\n```\n__global__\
    \ void vectorMatrixMulKernel(float* d_vec, float* d_mat, float* d_res, int rows,\
    \ int cols) { \n  int row = blockIdx.x * blockDim.x + threadIdx.x; \n  if (row\
    \ < rows) { \n    float sum = 0.0f; \n    for (int col = 0; col < cols; ++col)\
    \ { \n      sum += d_mat[row * cols + col] * d_vec[col]; \n    } \n    d_res[row]\
    \ = sum; \n  } \n} \n```\n\nWe use the received vector and matrix to calculate\
    \ the inner product, accessing global memory directly. So, let's focus on the\
    \ main function where the magic happens.\n\nWe start by declaring the size of\
    \ our matrix to be 16380 x 16380 elements, to make sure that we have around 1\
    \ GB of data (since 16380 x 16380 x 4 bytes for each float gives us 1,073,217,600,\
    \ which translates to 0.9995 GB). This is enough for testing purposes.\n\nThe\
    \ next step is to define the chunk size. We are using a multiple of our matrix\
    \ order to simplify flow control, so we choose a chunk size of 1638. And we have\
    \ 268,304,400 elements (16380 x 16380), which when divided by the chunk size gives\
    \ us 163,800 chunks (268,304,400 / 1,638 = 163,800). Each chunk has (1,638 x 16,380\
    \ x 4) bytes / 1024 / 1024, which is approximately 100 MB. Breaking that down:\
    \ we are using 1,638 as the chunk size times the number of columns 16,380 times\
    \ the number of bytes per float number, and after that we divide by 1024 twice\
    \ to express that value in megabytes.\n\nAccording to our previous measurements\
    \ 100 MB is already at peak transfer rate for this machine, and although larger\
    \ sizes are also at peak transfer rates, we can observe that after 100 MB the\
    \ performance starts to drop. This is related to how PCIe handles the breakdown\
    \ of data packages that will be transferred. However, we will return to this after\
    \ we see all the code.\n\n```\nint main() {\n  const int rows = 16380;\n  const\
    \ int cols = 16380;\n  const int chunk_size = 1638;\n  float *h_vec = (float*)malloc(cols\
    \ * sizeof(float));\n  float *h_res_cpu = (float*)malloc(cols * sizeof(float));\n\
    \  float *h_mat_pinned, *h_res_gpu;\n  cudaMallocHost(&h_mat_pinned, rows*cols\
    \ * sizeof(float));\n  cudaMallocHost(&h_res_gpu, rows * sizeof(float));\n```\n\
    \nWe should also note that, to work with asynchronous memory transfers, we need\
    \ to use pinned memory, and for that we use `cudaMallocHost` instead of the traditional\
    \ `malloc`. Since the vector is going to be copied only once we may use traditional\
    \ memory allocation and a synchronous memory transfer. We will also use a local\
    \ function to initialize the matrix and vector with random data.\n\nNow, when\
    \ it comes to memory allocation on the device we have our first modification.\
    \ Instead of simply allocating buffers large enough to hold the matrix and the\
    \ resulting vector, we will allocate two buffers for matrix chunks of size (chunk\
    \ size * cols) – we will keep 1,638 matrix rows – and two buffers of size 1,638\
    \ for vector results which will receive parts of the result:\n\n```\n float *d_vec,\
    \ *d_mat1, *d_mat2, *d_res1, *d_res2;\n  cudaMalloc(&d_vec, cols * sizeof(float));\n\
    \  cudaMalloc(&d_mat1, chunk_size * cols * sizeof(float));\n  cudaMalloc(&d_mat2,\
    \ chunk_size * cols * sizeof(float));\n  cudaMalloc(&d_res1, chunk_size * sizeof(float));\n\
    \  cudaMalloc(&d_res2, chunk_size * sizeof(float));\n```\n\nAfter this we will\
    \ do something we are already familiar with: create CUDA events to measure the\
    \ execution time, and copy the input vector. There is nothing new in this part\
    \ so let us move to stream creation.\n\n```\n cudaStream_t stream1, stream2;\n\
    \  cudaStreamCreate(&stream1);\n  cudaStreamCreate(&stream2);\n```\n\nAs we saw\
    \ in Chapter 5, the default stream is synchronous, so here we have created two\
    \ streams. Now we have reached the crucial part of our program where we break\
    \ the data into chunks. First let's understand how we start.\n\n```\nint blocks\
    \ = (rows + chunk_size - 1) / chunk_size;\nfor (int i = 0; i < rows; i += chunk_size)\
    \ {\n cudaMemcpyAsync(d_mat1, h_mat_pinned + i * cols, chunk_size * cols * sizeof(float),\
    \ cudaMemHostToDevice, stream1);\nvectorMatrixMulKernel<<<blocks, chunk_size,\
    \ 0, stream1>>>(d_vec, d_mat1, d_res1, chunk_size, cols);\ncudaMemcpyAsync(h_res_gpu\
    \ + i, d_res1, chunk_size * sizeof(float), cudaMemDeviceToHost, stream1);\n\n\
    cudaMemcpyAsync(d_mat2, h_mat_pinned + (i + chunk_size) * cols, chunk_size * cols\
    \ * sizeof(float), cudaMemHostToDevice, stream2);\nvectorMatrixMulKernel<<<blocks,\
    \ chunk_size, 0, stream2>>>(d_vec, d_mat2, d_res2, chunk_size, cols);\ncudaMemcpyAsync(h_res_gpu\
    \ + i + chunk_size, d_res2, chunk_size * sizeof(float), cudaMemDeviceToHost, stream2);\n\
    }\ncudaStreamSynchronize(stream1);\ncudaStreamSynchronize(stream2);\n```\n"
  raw: "In *Chapter 7* we used the traditional matrix multiplication problem to learn\
    \ about the optimization techniques available to us. We’ll now use a similar problem,\
    \ but for the sake of comprehensibility one which is a little simpler. We will\
    \ use vector-matrix multiplication – think of it as the first step in a matrix\
    \ multiplication problem. Since we will be having multiple things occurring at\
    \ the same time it might be wise to simplify the problem a little, so that we\
    \ can follow everything that is going on.\n\nIn our repository we also have a\
    \ version of the program that does not use streams, so that we can compare the\
    \ results. A curious thing to note is that, typically, the kernel that works in\
    \ our multi-streams program is the same as that in the no-streams version. The\
    \ difference is really in the main program, which needs to track multiple memory\
    \ copies and data chunks – as we are about to see.\n\nIn fact the kernel is amazingly\
    \ simple, and does not use any advanced optimization strategy:\n\n```\n__global__\
    \ void vectorMatrixMulKernel(float* d_vec, float* d_mat, float* d_res, int rows,\
    \ int cols) { \n  int row = blockIdx.x * blockDim.x + threadIdx.x; \n  if (row\
    \ < rows) { \n    float sum = 0.0f; \n    for (int col = 0; col < cols; ++col)\
    \ { \n      sum += d_mat[row * cols + col] * d_vec[col]; \n    } \n    d_res[row]\
    \ = sum; \n  } \n} \n```\n\nWe use the received vector and matrix to calculate\
    \ the inner product, accessing global memory directly. So, let's focus on the\
    \ main function where the magic happens.\n\nWe start by declaring the size of\
    \ our matrix to be 16380 x 16380 elements, to make sure that we have around 1\
    \ GB of data (since 16380 x 16380 x 4 bytes for each float gives us 1,073,217,600,\
    \ which translates to 0.9995 GB). This is enough for testing purposes.\n\nThe\
    \ next step is to define the chunk size. We are using a multiple of our matrix\
    \ order to simplify flow control, so we choose a chunk size of 1638\\. And we\
    \ have 268,304,400 elements (16380 x 16380), which when divided by the chunk size\
    \ gives us 163,800 chunks (268,304,400 / 1,638 = 163,800). Each chunk has (1,638\
    \ x 16,380 x 4) bytes / 1024 / 1024, which is approximately 100 MB. Breaking that\
    \ down: we are using 1,638 as the chunk size times the number of columns 16,380\
    \ times the number of bytes per float number, and after that we divide by 1024\
    \ twice to express that value in megabytes.\n\nAccording to our previous measurements\
    \ 100 MB is already at peak transfer rate for this machine, and although larger\
    \ sizes are also at peak transfer rates, we can observe that after 100 MB the\
    \ performance starts to drop. This is related to how PCIe handles the breakdown\
    \ of data packages that will be transferred. However, we will return to this after\
    \ we see all the code.\n\n```\nint main() {\n  const int rows = 16380;\n  const\
    \ int cols = 16380;\n  const int chunk_size = 1638;\n  float *h_vec = (float*)malloc(cols\
    \ * sizeof(float));\n  float *h_res_cpu = (float*)malloc(cols * sizeof(float));\n\
    \  float *h_mat_pinned, *h_res_gpu;\n  cudaMallocHost(&h_mat_pinned, rows*cols\
    \ * sizeof(float));\n  cudaMallocHost(&h_res_gpu, rows * sizeof(float));\n```\n\
    \nWe should also note that, to work with asynchronous memory transfers, we need\
    \ to use pinned memory, and for that we use `cudaMallocHost` instead of the traditional\
    \ `malloc`. Since the vector is going to be copied only once we may use traditional\
    \ memory allocation and a synchronous memory transfer. We will also use a local\
    \ function to initialize the matrix and vector with random data.\n\nNow, when\
    \ it comes to memory allocation on the device we have our first modification.\
    \ Instead of simply allocating buffers large enough to hold the matrix and the\
    \ resulting vector, we will allocate two buffers for matrix chunks of size (chunk\
    \ size * cols) – we will keep 1,638 matrix rows – and two buffers of size 1,638\
    \ for vector results which will receive parts of the result:\n\n```\n float *d_vec,\
    \ *d_mat1, *d_mat2, *d_res1, *d_res2;\n  cudaMalloc(&d_vec, cols * sizeof(float));\n\
    \  cudaMalloc(&d_mat1, chunk_size * cols * sizeof(float));\n  cudaMalloc(&d_mat2,\
    \ chunk_size * cols * sizeof(float));\n  cudaMalloc(&d_res1, chunk_size * sizeof(float));\n\
    \  cudaMalloc(&d_res2, chunk_size * sizeof(float));\n```\n\nAfter this we will\
    \ do something we are already familiar with: create CUDA events to measure the\
    \ execution time, and copy the input vector. There is nothing new in this part\
    \ so let us move to stream creation:\n\n```\n cudaStream_t stream1, stream2;\n\
    \  cudaStreamCreate(&stream1);\n  cudaStreamCreate(&stream2);\n```\n\nAs we saw\
    \ in *Chapter 5*, the default stream is synchronous, so to achieve what we wish\
    \ here in terms of parallelization we must create two streams *and not* use stream\
    \ number 0 (which is the default). So here we have created two streams, to be\
    \ passed as parameters on our function calls to identify where the transfer or\
    \ code should happen.\n\nNow we have reached the crucial part of our program:\
    \ the point where we break our data into chunks and process it in parallel. We\
    \ will go into more detail here.\n\nFirst let's understand how we are going to\
    \ break our data into chunks.\n\n```\nint blocks = (chunk_size + BLOCK_SIZE -\
    \ 1) / BLOCK_SIZE;\nfor (int i = 0; i < rows; i += chunk_size * 2) {\n```\n\n\
    Our block dimension is defined in terms of the chunk size, our `for` loop starts\
    \ at 0 and iterates until the number of rows is reached – nothing special there.\
    \ But our step increment is twice the chunk size (1,638), so at the start the\
    \ index `i` has a value of 0, but on the second iteration it will be 3,276.\n\n\
    We now unroll our loop to process two chunks of the matrix on different destination\
    \ buffers:\n\n```\n cudaMemcpyAsync(d_mat1, h_mat_pinned + i * cols, chunk_size\
    \  * cols * sizeof(float), cudaMemcpyHostToDevice, stream1);\n  vectorMatrixMulKernel<<<blocks,\
    \ BLOCK_SIZE, 0, stream1>>>(d_vec, d_mat1, d_res1, chunk_size, cols);\n  cudaMemcpyAsync(h_res_gpu\
    \ + i, d_res1, chunk_size * sizeof(float), cudaMemcpyDeviceToHost, stream1);\n\
    \  cudaMemcpyAsync(d_mat2, h_mat_pinned + (i + chunk_size) * cols, chunk_size\
    \ * cols * sizeof(float), cudaMemcpyHostToDevice, stream2);\n  vectorMatrixMulKernel<<<blocks,\
    \ BLOCK_SIZE, 0, stream2>>>(d_vec, d_mat2, d_res2, chunk_size, cols);\n  cudaMemcpyAsync(h_res_gpu\
    \ + i + chunk_size, d_res2, chunk_size * sizeof(float), cudaMemcpyDeviceToHost,\
    \ stream2);\n}\ncudaStreamSynchronize(stream1);\ncudaStreamSynchronize(stream2);\n\
    ```\n\nWe will go through the code first and then explain some of the simplifications.\
    \ Here we have two similar blocks of code that start an asynchronous memory transfer,\
    \ then they schedule a kernel execution, and finally perform a memory transfer\
    \ from the device to the host to collect the partial results for that chunk. So,\
    \ what are the differences here? First, the two blocks operate on different streams\
    \ and with different sets of variables. Also, the second code block is always\
    \ operating on `i +` `chunk_size`, to guarantee that we are processing two chunks\
    \ of data per iteration.\n\nAnother important detail to notice is that executions\
    \ on streams other than the default *may* be asynchronous. What this means is\
    \ that we must use `cudaMemcpyAsync` to schedule an asynchronous memory transfer,\
    \ otherwise it will be synchronous. On the other hand, kernel scheduling is always\
    \ asynchronous to request but will synchronize if executed on the same stream\
    \ as a memory transfer. Finally, the secondary memory transfer for the partial\
    \ results is also synchronized with the kernel execution within its stream.\n\n\
    Putting it all together, we have a transfer + execution + transfer on stream 1\
    \ and another transfer + execution + transfer on stream 2\\. This ensures that\
    \ once the execution step starts on stream 1, the transfer on stream 2 starts.\
    \ Also, once the first execution is complete on stream 1 it starts the results\
    \ transfer which will occur *at the same time* as the transfer on stream 2 that\
    \ has just started."
