  trans: "\n在 `include` 之后，我们在基础设施方面还有一件事要做：通过在模块初始化函数中添加对 `import_array()` 的调用来初始化\
    \ `numpy` 模块，如下所示：\n\n```\nPyMODINIT_FUNC PyInit_vector_add_np_wrapper(void) {\n\
    \   void *handle = dlopen(\"../../build/libvector_add.so\",\n                \
    \         RTLD_LAZY);\n   if (!handle) {\n      PyErr_SetString(PyExc_ImportError,\
    \ \n         \"Could not load libvecor_add.so\");\n      return NULL;\n   }\n\
    \   vectorAdd = (vectorAddFunc)dlsym(handle, \"vecctorAdd\");\n   if (!vectorAdd)\
    \ {\n      PyErr_SetString(PyExc_ImportError, \n         \"Could not find vectorAdd\
    \ in libvectorAdd.so\");\n      return NULL;\n   }\n   import_array();\n   return\
    \ PyModule_Create(&vectoraddmodule);\n}\n```\n\n至此，我们已经准备好使用该 API。在 C 扩展中操纵数据是可能的，但我们真正需要的是能够使用来自\
    \ Python 程序的数据并将其传递到 GPU 库。因此，我们需要按照所示更新我们的 `pyVectorAdd` 函数：\n\n```\nstatic PyObject*\
    \ pyVectorAdd(PyObject* self,PyObject* args){\n   PyArrayObject *a, *b, *c;\n\
    \   int N;\n   if (!PyArg_ParseTuple(args, \"OOOi\", &a, &b, &c, &N))\n      return\
    \ NULL;\n   int *a_ptr = (int*)PyArray_DATA(a);\n   int *b_ptr = (int*)PyArray_DATA(b);\n\
    \   int *c_ptr = (int*)PyArray_DATA(c);\n   vec_add(a_ptr, b_ptr, c_ptr, N);\n\
    \   Py_RETURN_NONE;\n}\n```\n\n注意，我们现在没有将数据从一个数据结构复制到另一个数据结构，而是使用内部指针指向外部分配的数组。我们不需要复制结果，因为结果是在我们的\
    \ GPU 库内部填充的，而该库接收了 `numpy` 分配的数组指针。\n\n再次，设置保护措施来检查类型及此类内容始终是一个好主意，但为了简单起见，我们没有添加这些内容。\n\
    \n我们的 `setup.py` 也需要修改以包含 `numpy` include，这样在构建扩展时它能够正确地链接。以下是需要对文件进行的更改：\n\n\
    ```\nfrom setuptools import setup, Extension\nimport numpy\nmodule = Extension(\n\
    \   \"vector_add_np_wrapper\",\n   include_dirs = [numpy.get_include()],\n   sources=[\"\
    vector_add_np_wrapper.c\"],\n)\nsetup(\n   name=\"vector_add_np_wrapper\",\n \
    \  version=\"1.0\",\n   description=\"Python binding for CUDA vector addition\"\
    ,\n   ext_modules=[module],\n   include_dirs=[numpy.get_include()]\n)\n```\n\n\
    虽然与我们之前看到的基本上相同，但我们现在导入了 `numpy`，以便找到包含目录并将其传递给 `setup`。\n\n我们使用与相同的命令构建扩展：\n\n\
    ```\npython3 setup.py build_ext --inplace\n```\n\n应用程序发生了一点变化，因为现在我们将像在第一个示例中那样使用\
    \ `numpy` 数组：\n\n```python\nimport vector_add_np_wrapper as vaw_np\nimport numpy\
    \ as np\nN = 1000\na = np.random.randint(0, N, size=N, dtype=np.int32) \nb = np.random.randint(N,\
    \ 2*N, size=N, dtype=np.int32)\nc = np.zeros(N, dtype=np.int32)\nvaw_np.vectorAdd(a,\
    \ b, c, N)\n```\n\n这正是 Python 程序员对扩展所预期的：使用 `numpy` 数组生成数据并将其传入进行处理，就像使用任何其他库一样。\n\
    \n通过这个小小的更改，我们消除了之前的内存翻倍问题，并提高了性能——但将在下一节中检查这些数据。\n\n## 性能分析\n\n我们现在已经看到了两种让 GPU\
    \ 代码对 Python 可用的方法。显然，`ctypes` 非常直观，尽管它定义所用函数的方式有些笨拙。相比之下，创建一个扩展为终端用户提供了一个非常清晰的接口，尽管它稍微费力。\n\
    \n然而，这里不仅仅是风格问题；同样的是，我们没有使用 `numpy` 数组的扩展实现涉及大量的数据拷贝。问题是：这对整体性能有多大影响？\n\n![图 9.2:\
    \ 每种 Python 集成类型的执行时间](img/file96.png)\n\n图 9.2：每种 Python 集成类型的执行时间\n\n正如我们之前提到的，我们调用扩展的第二个版本\
    \ `wrapper_np` 以表示它使用了 numpy 访问。注意，当数组大小多达 100,000 时，简单的包装器胜出，而其他两个版本 `wrapper_np`\
    \ 和 `ctypes` 在技术上是平手的。\n\n然而，当我们真正增加数组大小到一百万或一千万个元素时，我们看到数据复制无法与直接使用数据指针相比。\n\n\
    公平起见，在比较中，我们只测量了调用扩展的时间，而不是生成随机数据的时间。重要的是我们的库是使用 debug 模式编译的，为了确保时间，我们排除了离群值。\n\
    \n## 总结\n\n在本章中，我们学习了如何从 Python 访问 GPU，这是一个有趣且重要的话题，为我们开启了新的世界。我们看到了两种集成方法：使用\
    \ `ctypes` 和创建 Python 扩展。通过扩展，我们探索了两种方法，一种方法是拷贝数据，另一种是直接使用 `numpy` 内部指针，后者快得多。第一种方法的优点是它是纯\
    \ Python 实现，不需要编译任何内容。另一种方法允许更细粒度的控制，但我们必须编译扩展可以使用。\n\n无论采取何种方法，我们都应该重用内存，否则将失去\
    \ GPU 带来的收益，正如我们在性能分析部分看到的。\n\n在下一章中，我们将讨论未来的去向。哪些库已经存在，我们如何将它们与自己的内核一起使用？请期待！\n\
    \n#探索现有 GPU 模型\n\n## 在 Discord 上加入我们的社区\n\n[`packt.link/deep-engineering-cpp`](https://packt.link/deep-engineering-cpp)\n\
    \n![](img/file97.png)\n\n了解 GPU 如何工作是在我们的项目中有效利用它的基础。为了帮助探索其硬件特性并将其与 GPU 编程概念，我们研究了各种算法，并看到我们的实现如何充分利用\
    \ GPU 架构。特别是，我们通过学习向量加法和矩阵乘法来理解 CUDA 线程、块和网格。我们还学习了优化以及如何更有效地处理数据传输和内存访问。\n\n\
    在本章中，我们调查了几个对我们的市场和项目可靠性有重要影响的话题。这些主题之一是用于 GPU 的库。我们首先学习现有的库，然后考虑在什么情况下编写自己的代码。然后我们讨论了在\
    \ GPU 上运行顺序代码有时可以消除或减少限制性能的数据移动。在最后一节中，我们将探索使用解释性语言在多个层面帮助测试代码。\n"
- fmt: "\nWe will use the environment configured during in Chapter 3 with VS Code\
    \ and our development container. If you have chosen to install the `CUDA Toolkit`\
    \ on your machine then you can simply run the build commands on a terminal. The\
    \ code is provided on the GitHub repository, which can be accessed here: [https://github.com/PacktPublishing/GPU-Programming-with-C-and-CUDA](https://github.com/PacktPublishing/GPU-Programming-with-C-and-CUDA).\n\
    \n## Using existing libraries and frameworks\n\nThe code we have used in previous\
    \ chapters helped us understand how to use the GPU, and you may wonder whether\
    \ libraries already exist that offer the most optimized version of, let's say,\
    \ matrix multiplication. And this is exactly the case: there are. Thankfully,\
    \ we don't need to reinvent the wheel, because CUDA already provides a suite of\
    \ mature, optimized libraries and frameworks designed to offer efficient implementations\
    \ for common computing tasks, drastically reducing the development effort for\
    \ our applications. The complete list of available libraries can be found at [https://developer.nvidia.com/gpu-accelerated-libraries](https://developer.nvidia.com/gpu-accelerated-libraries).\n\
    \nThose libraries target specific categories of problems, and although they are\
    \ numerous, we will focus on two libraries that are similar to what we have worked\
    \ on in previous chapters. This will enable us to compare our previous development\
    \ efforts with the use of the libraries. The first library is `cuBLAS`, which\
    \ is a CUDA implementation by NVidia of the Basic Linear Algebra Subprograms (BLAS)\
    \ library. It includes code for matrix multiplication, vector operations, and\
    \ other foundational numerical computations. Anyone who has used traditional BLAS\
    \ libraries before will be able to transition to `cuBLAS` smoothly.\n\nThe second\
    \ library we have is `Thrust`, a parallel algorithms library resembling the C++\
    \ Standard Template Library (STL). It offers a familiar syntax comfortable for\
    \ developers who are just starting out in GPU programming, and provides a high-level\
    \ interface to GPU computing with vectors, reductions, sorting, and more. \n\n\
    ### Using cuBLAS to multiply matrices\n\nWhen using `cuBLAS` in our programs we\
    \ need to keep in mind that it will not handle memory transfers for us: we need\
    \ to provide the data that we want to process, by copying it to the GPU device\
    \ memory. We do that with the `cudaMemcpy` command that we used previously.\n\n\
    The complete code for the example is in the `ch10/cuBLAS` folder of our GitHub\
    \ repository, so let's focus on the specific details of using the library.\n\n\
    Our program will need to allocate the buffers on the device and copy data so that\
    \ we can call the specific function to perform the matrix multiplication. Following\
    \ is the code we need to create a cuBLAS context and perform these operations:\n\
    \n```\ncublasHandle_t handle;\ncublasCreate(&handle);\nfloat alpha = 1.0f;\nfloat\
    \ beta = 0.0f;\ncublasSgemm(handle,\nCUBLAS_OP_T, CUBLAS_OP_T,\nN, N, N,\n&alpha,\n\
    d_A, N,\nd_B, N,\n&beta,\nd_C, N);\nfloat* d_C_fixed;\ncudaMalloc(&d_C_fixed,\
    \ size);\ncublasSgeam(handle,\nCUBLAS_OP_T, CUBLAS_OP_N,\nN, N, \n&alpha,\nd_C,\
    \ N,\n&beta,\nnullptr, N,\nd_C_fixed, N);\n```\n\nWe are using two cuBLAS functions\
    \ due to the way that it handles data. Let's break down this code step by step.\
    \ We create two variables `alpha` and `beta`, because the operation that will\
    \ be performed is:\n\nSo, we use `alpha` as `1.0f` to multiply the `d_A` matrix,\
    \ and we use `beta` as `0.0f` so that no operation is performed with the `d_C`\
    \ matrix. Let's understand this point in more detail. From the equation, we notice\
    \ that the C matrix could be used as an input as well if it already exists, and\
    \ furthermore it could be multiplied by a scalar value, beta, before being added\
    \ to the result of the `A*B` matrix multiplication. However, since we are just\
    \ interested in the matrix-multiplication part, we are passing a `nullptr` as\
    \ the original C matrix and `beta` with value `0.0f`. Now comes a big difference\
    \ from our original matrix multiplication code: BLAS libraries usually work with\
    \ matrices stored in column-major format, which means that instead of having all\
    \ the elements of a row contiguously in memory, the functions expect to find all\
    \ elements of a column. Due to this characteristic, we pass in the `CUBLAS_OP_T`\
    \ operators to inform cuBLAS that it should consider the transposes of the matrices\
    \ when executing the calculations. That way, cuBLAS will produce the correct value\
    \ with our row-major matrices.\n\n> **Column-major format**\n\n> The original\
    \ implementation of BLAS was in Fortran which stores matrices in column-major\
    \ format, meaning that all the columns are held contiguously in memory. This contrasts\
    \ with C/C++ languages, which store matrices with rows contiguous in memory. The\
    \ whole ecosystem of libraries that came from BLAS uses the column-major format\
    \ and it is retained to this day. Many optimizations are possible to reduce performance\
    \ penalties otherwise incurred when accessing rows.\n\nHowever, the resulting\
    \ `d_C` matrix is stored in column-major format, so before returning this to the\
    \ host we need to find a way to transpose it to row-major format, as the original\
    \ matrices were.\n\nA very interesting alternative is to use the matrix addition\
    \ function from cuBLAS but not provide a second matrix. That way, as we `CUBLAS_OP_T`\
    \ it will perform the transposition of the input matrix, generating a row-major\
    \ version of `d_C`. Finally, we must call `cublasDestroy(handle)` to clean up.\n\
    \nAfter these operations we can copy `d_C_fixed` matrix to the host and use it.\
    \ We obtain the following execution times:\n\n```\nCPU multiplication took: 1404.17\
    \ ms\nDevice copy time: 0.88617 ms\nDevice copy back time: 1.4203 ms\nDevice compute\
    \ time: 3.2975 ms\ncuBLAS overhead: 8.7919 ms\nTotal GPU time: 14.4082 ms\n```\n\
    As we can see, the total time to execute on the GPU, even allowing for data transfers,\
    \ is 100 times faster than the single threaded CPU (approximately 14 ms vs. 1400\
    \ ms). We are considering as the overhead the time necessary to create the cuBLAS\
    \ handle, and the compute time includes both the matrix multiplication and the\
    \ matrix transposition.\n\n### Using Thrust to write GPU code\n\nNow, let's see\
    \ how to use the Thrust library to sort an array of integers and another array\
    \ of double. This is an important example because it is exactly the code that\
    \ is presented on the library website with a chart indicating the performance\
    \ achieved. Our previous study on performance optimization has prepared us to\
    \ read the information more clearly.\n\nThis time our code is simpler than that\
    \ we needed for cuBLAS because Thrust encapsulates many aspects of the GPU interaction\
    \ for us. We can allocate a vector on the host and fill it with the data we want\
    \ to sort. After that we can copy data to the device by simply using the following\
    \ line of code:\n\n```\nthrust::device_vector<float> d_vec = host_vec;\n```\n\n\
    Assuming that `host_vec` was previously declared and filled, this code will declare\
    \ our device buffer and copy data to it. This is very convenient, although it\
    \ offers less control than when we allocate and copy manually. After the copy\
    \ completes, we can call the `sort` function which is very similar to the STL\
    \ version:\n\n```\nthrust::sort(d_vec.begin(), d_vec.end());\n```\n\nNow the execution\
    \ times are as follows:\n\n```\n ==== Sorting float (33554432 elements) ====\n\
    CPU sort time:        2411.68 ms\nGPU copy time:        12.9508 ms\nGPU copy back\
    \ time:   13.4571 ms\nGPU sort time:        17.7616 ms\nGPU total time:      \
    \ 44.1696 ms\n```\n"
