    图 7.7: 内存拷贝放大——主机到设备


    之后，我们看到一个带有我们内核名称的大方块，代表如*图 7.8* 所示的内核执行。


    ![图 7.8: 内核执行放大](img/file30.png)


    图 7.8: 内核执行放大


    之后，我们的应用程序执行了一个标记为 `DtoH` 的新 `Memcpy` 操作，以将结果矩阵从设备拷贝到主机（*图 7.9*）。


    ![图 7.9: 内存拷贝放大——设备到主机](img/file31.png)


    图 7.9: 内存拷贝放大——设备到主机


    一个有趣的功能是，我们可以右键点击任何已执行的内核并选择 `Profile Kernel`（性能分析内核）选项，如*图 7.10* 所示。


    ![图 7.10: 选择内核进行性能分析](img/file32.png)


    图 7.10: 选择内核进行性能分析


    这将返回初始配置屏幕。由于我们正准备对特定内核执行性能分析，我们需要更改一些细节。第一项已经为我们填好了，因为我们是从系统追踪（System Trace）跳转而来的，而要分析的内核名称定义在第二个标签页上，如*图
    7.11* 所示。


    ![![图 7.11: 选定的内核名称](img/file33.png)


    图 7.11: 选定的内核名称


    选择内核名称会告知性能分析器详细分析哪个项目，在系统追踪的帮助下，我们可以找出哪些内核花费了更多时间，并将精力集中在优先优化这些内核。我们的示例只有一个内核，所以这个决定是显而易见的，但在较大的应用程序中，我们必须注意这一点，以避免在错误的地方浪费时间。


    然后我们在 `Metrics`（指标）标签页上选择我们想要跟踪的指标，并在其中选择完整分析，如*图 7.12* 所示。此选项会为所有可用指标生成数据。


    ![图 7.12: 选择用于分析内核的指标集](img/file34.png)


    图 7.12: 选择用于分析内核的指标集


    点击 `Launch`（启动）按钮后，我们将看到如*图 7.13* 所示的 `Progress Log`（进度日志）。我们必须等待处理完成才能获取报告。


    ![图 7.13: 运行性能分析器](img/file35.png)


    图 7.13: 运行性能分析器


    性能分析完成后，我们将得到一个带有报告的新屏幕。默认屏幕是摘要，在下一部分中，我们将采用循序渐进的方法理解工具告诉我们的信息，以及如何使用已经学习的技巧来优化代码，从而从硬件中提取最大的价值。


    ## 优化以加速我们的代码


    现在我们已经对内核进行了性能分析，并得到了第一份报告，它提供了我们优化代码所需的信息。在*图 7.14* 中，我们看到了由指定的执行操作产生的基本信息。我们看到了当前会话执行内核所需的时间，还可以看到所使用的启动配置：(125,125,1)
    组 (16,16,1) 线程。


    ![图 7.14: 内核性能分析摘要](img/file36.png)


    图 7.14: 内核性能分析摘要


    我们还在 `Summary`（摘要）页面上发现了根据工具对我们代码可改进之处而提出的建议列表，如*图 7.15* 所示。然而，我们需要查看 `Details`（详情）页来深入理解这些建议。


    ![图 7.15: 内核的建议](img/file37.png)


    图 7.15: 内核的建议


    我们通过选择报告左上角的 `Details` 页来完成此，如*图 7.16* 所示。


    ![图 7.16: 选择详情页](img/file38.png)


    图 7.16: 选择详情页


    然后我们进入 `Details` 页，在该页有组织已收集指标的章节，如*图 7.17* 所示。


    第一部分是 `GPU Speed of Light Throughput`（GPU 光速吞吐量），我们我们可以在屏幕右上角看到一个下拉菜单。初始状态它是禁用的，如*图
    7.17* 所示。我们必须打开该部分才能从可用信息中进行选择。


    ![图 7.17: 当前性能分析会话详情页](img/file39.png)


    图 7.17: 当前性能分析会话详情页


    我们想要访问的图是 Roofline（顶线模型），它显示了我们的代码到为止取得的性能。如*图 7.18* 所示，圆表示当前性能。


    此图呈现三条重要的线，其中两条是水平线。下方的线是双精度浮点运算的限制，而上方的是单精度浮点运算的限制。对角线代表内存限制，它表明如果我们的圆更靠向图表的左侧，可能可能是受内存访问模式的限制；如果它更靠向图表的右侧，则是受计算的限制。


    ![图 7.18: 内核的 Roofline 图](img/file40.png)


    图 7.18: 内核的 Roofline 图


    我们的第一次执行是经过调试编译的没有任何优化的算法。如我们在*图 7.18* 中所示，我们的计算强度位于图表的中间，因此我们可以从内存和计算两方面进行改进。


    我们要查看的下一张图是 `Memory Chart`（内存图），它位于 `Workload`（负载）部分。这张图很重要，因为它显示了内存的使用情况。


    如我们在*图 7.19* 所示，我们的内核只访问全局内存，这是最慢的内存类型。这就是为什么我们在*图 7.15* 的建议中提到了流水线停顿；它提到我们的内核正在等待
    L1 缓存。


    ![图 7.19: 内核的内存图](img/file41.png)


    图 7.19: 内核的内存图


    下一个重要部分是 `Occupancy`（占用率），它显示了 GPU 资源的使用情况。如*图 7.20* 所示，我们可以了解改变每块线程数、寄存器数量（数据访问速度快）以及线程使用的共享内存量的影响。


    在我们的代码版本中，没有使用共享内存，所以这提示我们应该考虑进行更改，通过不返回全局内存来加速我们的计算。


    ![图 7.20: 内核的占用率](img/file42.png)


    图 7.20: 内核的占用率


    我们将探索的下一个部分是 `Source Counters`（源码计数器），其中 `Most Instructions Executed`（执行最多的指令）面板允许我们点击链接进入
    `Source`（源码）页。在*图 7.21* 中，我们可以看到源文件中执行次数最多的行。


    由于编译了调试信息，我们可以点击此处进入相关行，如*图 7.22* 所示。这里有一个重要的点是，当我们第一次加载此页面时，它在寻找程序源代码可能会有问题，因为我们的可执行文件在
    build 文件夹中，而源代码在上一层。所以我们需要点击 `Resolve` 按钮并选择源代码文件夹。`Resolve` 按钮在第一次加载屏幕时出现，一旦源文件位置配置好，它就会如*图
    7.22* 所示变为 `Redo Resolve`（重新解析）按钮。


