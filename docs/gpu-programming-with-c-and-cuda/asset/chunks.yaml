    \ the code first. This code uses the same approach that we can find in the CUDA\
    \ Toolkit Samples that can be found at [https://github.com/NVIDIA/cuda-samples/blob/master/Samples/0_Introduction/matrixMul/matrixMul.cu](https://github.com/NVIDIA/cuda-samples/blob/master/Samples/0_Introduction/matrixMul/matrixMul.cu).\
