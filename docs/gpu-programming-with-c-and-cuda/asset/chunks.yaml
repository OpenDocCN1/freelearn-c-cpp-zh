    在本章中，我们已经涵盖了以更周全的方式编写程序所需的所有内部细节。注意所有这些细节非常重要，实际上这比为我们的 CPU 编写单线程程序要重要得多。在处理 `GPUs`
    时，我们必须考虑诸如线程间仅共享 `48KB` 空间等问题，以及如何明智地使用这些资源以进一步加速代码。我们已经看到，通过使用不同的流（streams），我们可以同时执行许多任务，甚至同时在设备与主机之间复制数据，但再次强调，我们必须留意许多细节。不过请放心，尽管现在看起来很复杂，但它会变得简单。不久后，我们将使用并探索这些资源来编写程序，这将有助于将它们留在我们的脑海中。


    具体来说，在下一章中，我们将涵盖这里必须掌握的概念的实际应用。我们将讨论什么让一个并行算法真正具有“并行性”。我们将实现不同版本的应用程序来解决并行编程中的一些常见问题，这些问题从
    `GPUs` 的使用中极大受益。在每个版本中，我们将使用这里讨论的不同方法，并测量它们对性能的影响。我们将执行一个矩阵乘法，它就像向量加法一样，由于计算方式的原因，是我们我们所谓的“尴尬并行”（embarrassing
    parallelism）示例，但我们还将处理数值积分，它与多个领域相关。


    # 第 6 章：使用 CUDA 的并行算法


    ## 在 Discord 上加入我们的社区


    [`packt.link/deep-engineering-cpp`](https://packt.link/deep-engineering-cpp)


    ![带有正方形和符号的二维码码，AI 生成的内容可能不正确。](img/file14.png)


    我们现在可以更好地讨论和理解并行程序以及如何使用 `CUDA` 表达它们，以及硬件细节和编程概念如何影响并引导我们的程序。学习路径的下一步是提高对“什么让并行算法并行”以及“可实现的并行程度的限制”的理解。


    首先，我们将详细讨论指导并行算法的原理，比我们在 `第 1 章` 中更详细，因为我们现在可以参考在那里编写的程序。之后，我们将查看一些展示不同并行水平的常见算法，让我们预见到面前的挑战。本章将以对不同实现方法的讨论结束，帮助你将所学知识应用于真实场景中。


    在整个章节中，我们将涵盖以下主要主题：


    *   并行算法的设计原则

    *   并行矩阵操作：乘法、加法

    *   并行积分计算、归约和排序算法


    ## 技术要求


    我们将使用在 `第 3 章` 中配置的带有 `VS Code` 和我们的开发容器的环境。如果你选择在机器上安装了 `CUDA Toolkit`，你可以可以直接在终端上运行构建命令。代码在
    GitHub 仓库上，可以通过此处访问：[`github.com/PacktPublishing/GPU-Programming-with-C-and-CUDA`](https://github.com/PacktPublishing/GPU-Programming-with-C-and-CUDA)。


    ## 设计并行算法


    在 `第 1 章` 中，我们讨论了什么是并行，并用烹饪类比来介绍同时执行多个步骤的想法，并展示了为什么某些步骤不会通过改变执行者而获益。现在我们将使用类似的类比，来更详细地探索并行算法的设计。


    一个很好的起点是：并行算法不仅仅是顺序算法的加速版。它涉及到根本性的重构，使得任务可以同时发生以利用多个计算单元。


    在 `第 1 章` 中，我们想象了一组朋友一起准备餐点——一个小规模的设置让我们窥见了并行性的一端。他们可以并行地切菜，但并没有大规模的并行。然而，让我们假设他们的尝试中取得了巨大成功，现在必须准备的不是几餐，而是几千份餐。现在每一步都必须经过仔细考虑，以确保时间和精力不被浪费。这更像我们使用
    `GPUs` 的场景，那里有数千个处理器，我们希望确保它们以最好的方式被使用，而不是让它们闲置。


    但如果我们停下来思考一下，餐厅的设置更像多核 CPU：它可以用几位厨师和帮厨处理任何种餐点。`GPU` 可以被看作是在菜单选项上被收窄了，但它提供了巨大的吞吐量，就像音乐节上的外卖服务。记住，`CUDA
    cores` 在被称为 `warps` 的组中工作，这些组由流式多处理器（Streaming Multiprocessor，简称 `SM`）进行步进控制。很难想象有一个“主厨控制器”向其他厨师发布诸如“现在切菜”之类的命令，但我们可以把
    `SM` 看作厨师，把 `CUDA cores` 看作一种可以同时切碎蔬菜的工具——就像那些旧电视广告里看到的那样。


    然而，为了拥有一顿至少有趣的餐点，我们需要的不仅仅是一个并行切碎的蔬菜：我们应该有多种食材在并行准备，以成为最终餐点的一部分。为此，我们需要许多厨师，利用他们小组的工具来处理食材列表的不同部分，直到它们达到需要相互同步的程度。


    > **硬件特异性的影响**


    > 在这里我们有一个有趣的特征需要考虑。消费级 `GPUs` 通常呈现三个异步引擎，这意味着它们可以同时执行两个不同方向的数据移动——从 `Host`（主机）到
    `Device`（设备）以及从 `Device`（设备）到 `Host`（主机）——并连同一个内核执行（kernel execution）。另一方面，高级
    `GPUs` 拥有更多引擎，使它们能够同时执行更多内核。这是一个重要的考虑因素，因为它可能从另一个维度加速算法。考虑一个有两个步骤的算法：第一步执行矩阵乘法以产生中间结果，第二步对中间结果和另一个输入矩阵进行矩阵加法。如果我们使用两个结果缓冲区，我们几乎可以同时执行这两个内核调用，前提是有足够的
    `Streaming Multiprocessors`。


    ### 理解如何识别和利用并行性


    可利用并行性的想法有助于定义哪些任务可以独立执行。高并行性发生在算法的许多部分可以在不遵循严格顺序的情况下独立进行时，就像切不同的蔬菜可以同时进行且无任何顺序一样。在并行算法中，高并行允许许多线程独立工作，从而提高速度和效率。

    '
- fmt: '

    At first it does not occur naturally to humans to approach a problem or task in
    parallel. Usually we look for a solution and *then* we look for parts that are
    sufficiently independent. To continue with our cooking example, as we get increasingly
    experienced, it starts to become apparent right from the beginning that appetizers
    and desserts could be prepared in parallel.


    Although parallelism is the key to increased performance, the level of independence
    among the steps of our algorithms directly influences the amount of parallelism
    we may achieve, and thus it limits the speedup that is feasible. In other words,
    throwing in more processing cores does not yield a proportional increase in speed!


    Imagine we are going to prepare one hundred cupcakes. The ingredients for the
    cake mix must be mixed in a specific order, and for the sake of our analogy let
    us suppose that a single batch of cake mix will be used for the hundred units.
    Here are the steps to follow:


    1. Combine the ingredients to create the cake mix – a sequential step here that
    requires an ordered execution.

    2. Separate out small portions and pour them into cupcake tins. This can be parallelized,
    for we may have many cooks, each one getting a portion of cake mix, preparing
    the tin, and positioning that on the baking board.

    3. The third step is baking, in which all the available cooks idly wait for the
    one who monitors the `single` oven. This is what we call a synchronization step,
    since we can only continue after everything is processed.

    4. The last step is to distribute the cooked cupcakes to the cooks so that each
    one can create their own icing styles.


    In this scenario, when we go through the description we see two things that could
    be optimized to increase parallelism. The first is that we could have many cooks
    preparing many portions of cake mix – but notice that this does not affect the
    need to mix the ingredients in the same given order. The other is that we could
    have more ovens, but if we are to provide an individual oven to each cook, we
    may confront space and energy limitations.


    This is exactly analogous to what happens in our CPU versus GPU situation. Remember
    from `Chapter 1` how we discussed the idea that GPUs are specialized hardware
    and that `CUDA` cores are not the same type of processing cores as the ones we
    find in CPUs: it is as if GPUs do not have their own mini ovens while CPUs do
    have them!


    We will see this difference of algorithms later in the chapter when we discuss
    matrix multiplication and a sorting algorithm. Sorting will have alternate steps
    that depend on the computation of the previous step, leading to the need for a
    synchronization step.


    > **Amdahl''s Law: speedup limits**


    Amdahl’s Law highlights the limit of parallelism for tasks that must remain sequential.
    Imagine a dessert recipe with a final cooling step that takes 30 minutes. No matter
    how many cooks you add, the dish cannot be ready until the cooling step finishes.
    Similarly, in parallel computing, a task with unavoidable sequential steps will
    not speed up indefinitely, even with more threads. If a portion of the program
    remains sequential then doubling the number of threads can only improve speed
    of the other parallelizable part of the program. Even if we could make the parallel
    part execute immediately, the total running time will remain the minimum time
    needed to execute the sequential part.


    ![Figure 6.1: Task decomposition of matrix multiplication](media/file15.png)


    Figure 6.1: Task decomposition of matrix multiplication


    ### Synchronizing steps to avoid problems


    In the last section we mentioned having synchronization steps, but why are they
    necessary?


    If we go back to the cupcake example for a moment, we might describe a cupcake
    as a small cake with some icing. (Although there could be some cupcakes without
    icing, let''s assume for our discussions that `all` cupcakes have icing.) As humans,
    we tacitly expect, due to the many cupcake pictures we’ve seen before, that icing
    comes `on top of` the cupcake, but if you go back and read the description again,
    there was nothing saying that icing would be on top. This means that, without
    synchronization steps, the cooks who completed the step of preparing the icing
    could pour it onto the final plate before the previous step – baking – was completed.
    So, some cupcakes would end up sitting on the icing while others would have the
    icing on top.


    In programming we want to spot and exploit parallelization as much as possible,
    but we must make sure that we obtain the correct results. It makes no sense to
    have super-fast but incorrect results!


    Although sometimes necessary, synchronization delays results and so we try to
    avoid it as much as possible. Sometimes, by changing the algorithm or finding
    another mathematical property or identity to exploit, we can avoid a synchronization,
    but if that is not possible then we must live with the delay introduced. Dealing
    with wrong results is much worse!


    ![Figure 6.2: Wait for all local additions before summing all](media/file16.png)


    Figure 6.2: Wait for all local additions before summing all


    ### Balancing the workloads


    Given that the scheduling of processing is done automatically by `SMs`, it may
    seem a little peculiar to discuss load balancing for our applications. However,
    in the previous section we considered changes to algorithms that could decrease
    the need to synchronize. When we start looking to other algorithms to avoid the
    need for synchronization, we may reach situations in which some threads end up
    being overloaded, and that can lead to bottlenecks that affect overall progress
    even if there is no need to synchronize.


    To illustrate this, let’s consider the most common load balancer that we have
    used before: splitting the processing between odds and evens. We test whether
    a number is divisible by `2`, and if it is so divisible that makes it even; otherwise
    it is odd. This works well because half the numbers are even and the other half
    are odd. However, if we want to process an array of numbers and apply some special
    processing only in the case of values divisible by `3`, we have an imbalance,
    because only `33.33%` of numbers are multiples of `3`. Assuming that we are processing
    a huge quantity of numbers, there is no way to tell upfront that we will have
    multiples of `3` coming in. Supposing we have a special kernel for multiples of
    `3` and another for all other numbers, then this implies that we may end up having
    cores idle when processing one group or the other. On the other hand, if we arranged
    the multiples of 3 to be interweaved with non-multiples on a stride of `3`, we
    could dedicate the threads whose `ids` were multiples of `3` to the processing
    of those specific positions. That would work like pre-allocating one third of
    the threads to those numbers.


    Of course this is just an arbitrary example, but it is useful for reflecting on
    the impact of load balancing our work.


    ![Figure 6.3: Load balance](media/file17.png)


    Figure 6.3: Load balance


    ### Finding the critical path


    We have been talking about how much parallelism we can find in an algorithm, but
    rarely will an application have just a single step as is the case in the multiplication
    of two matrices. (Unless we are creating a matrix multiplication library!) Usually,
    an application will have many steps or phases which may have differing levels
    of parallelization, but those steps will create a sequence that must be completed
    in a specific order. This is like a recipe in which we need to peel all the potatoes
    before chopping them – we may parallelize the peeling, but we still need to complete
    the peeling phase before continuing.

    '
