  trans: "\n我们使用一个必需的宏来初始化 `vectoraddmodule` 定义，然后给它起一个名称。在这里我们没有提供任何描述，所以我们目前使用 `NULL`，但很重要的一点是，通过传递\
    \ `-1` 作为参数，我们告诉 Python 解释器我们的模块不需要为内部状态分配任何空间。最后，我们传入了函数数组。\n\n在讨论实际函数之前，还有一项基础设施方面的工作我们需要处理：模块初始化。\n\
    \n```c\nPyMODINIT_FUNC PyInit_vector_add_wrapper(void) {\n   void *handle = dlopen(\"\
    ../../build/libvctor_add.so\",\n                         RTLD_LAZY);\n   if (!handle)\
    \ {\n      PyErr_SetString(PyExc_ImportError, \n         \"Could not load libvector_add.so\"\
    );\n      return NULL;\n   }\n   vectorAdd = (vectorAddFunc)dlsym(handle, \"vectorAdd\"\
    );\n   if (!vectorAdd) {\n      PyErr_SetString(PyExc_ImportError, \n        \
    \ \"Could not find vectorAdd in libvector_add.so\");\n      return NULL;\n   }\n\
    \   return PyModule_Create(&vectoraddmodule);\n}\n```\n\n在这里我们使用了通过 `dlopen` 加载库的方法，这允许我们动态地从外部库加载每个函数指针，而不需要在编译时提供该库。虽然引用每个函数指针名称时需要一些额外的工作，但这种方法的有趣之处在于，它允许一种插件式的架构，我们可以在库的不同实现之间进行切换。与扩展相关的部分是最后一行，我们调用了\
    \ `PyModule_Create` 函数并传入了我们之前定义的模块配置。\n\n现在是时候看看我们的函数真实的样子了。\n\n```c\nstatic\
    \ PyObject* pyVectorAdd(PyObject* self,PyObject* args){\n   PyObject *py_a, *py_b;\n\
    \   int N;\n   if (!PyArg_ParseTuple(args, \"OOi\", &py_a, &py_b, &N))\n     \
    \ return NULL;\n   int *a = (int*)malloc(N * sizeof(int));\n   int *b = (int*)malloc(N\
    \ * sizeof(int));\n   int *c = (int*)malloc(N * sizeof(int));\n   for (int i =\
    \ 0; i < N; i++) {\n      a[i] = (int)PyLong_AsLong(PyList_GetItem(py_a, i));\n\
    \      b[i] = (int)PyLong_AsLong(PyList_GetItem(py_b, i));\n   }\n   vectorAdd(a,\
    \ b, c, N);\n   PyObject* result = PyList_New(N);\n   for (int i = 0; i < N; i++)\
    \ {\n      PyList_SetItem(result, i, PyLong_FromLong(c[i]));\n   }\n   free(a);\n\
    \   free(b);\n   free(c);\n   return result;\n}\n```\n\n首先要注意的是，我们正在使用 `\"OOi\"\
    ` 模式解析一个参数元组。这意味着我们正在接收两个 Python 对象（即输入数组）和一个表示它们大小的整数。我们没有传入结果数组，所以我们 Python\
    \ 版本的 `vectorAdd` 函数与库中的版本略有不同。这正是因为扩展的目标是为程序员提供更多功能。\n\n我们也可以设置一组数据类型和大小验证，尽管为了简单起见，我们现在跳过了这些。但请记住，在连接\
    \ Python 和 C++ 这两个不同的世界时，拥有能够保护我们的代码总是令人让人放心的。\n\n然后我们创建了数组形式的主机内存，用于从 Python\
    \ 拷贝数据并存储结果。通过 `for` 循环，我们遍历每个 Python 列表的所有元素，并将它们复制到我们在函数调用将使用的 C++ 对应项中。\n\n\
    接下来，我们调用模块初始化期间从共享库加载的 `vectorAdd` 函数。这传入了三个数组及其大小；调用完成后，我们可以将结果从数组 `c` 拷贝到新创建的\
    \ Python 列表中并返回。然后我们安全地释放分配的内存并返回结果。\n\n谜题的最后一部分是如何构建这个扩展。我们通过一个名为 `setup.py`\
    \ 的文件完成完成。\n\n> **不久后的变化**\n\n> 在编写本文时，`setup.py` 仍然是构建 Python 扩展的工具，尽管对于打包和安装\
    \ Python 项目，它已经被弃用，并被 `pyproject.toml` 等现代工具取代。\n\n我们的 `setup.py` 文件如下：\n\n```python\n\
    from setuptools import setup, Extension\nmodule = Extension(\n   \"vector_add_wrapper\"\
    ,\n   sources=[\"vector_add_wrapper.c\"],\n)\nsetup(\n   name=\"vector_add_wrapper\"\
    ,\n   version=\"1.0\",\n   description=\"Python binding for CUDA vector addition\"\
    ,\n   ext_modules=[module],\n)\n```\n\n要构建我们的扩展，可以使用以下命令：\n\n```bash\npython3\
    \ setup.py build_ext --inplace\n```\n\n在当前文件夹中构建好扩展后，如果我们从该文件夹执行 Python 程序，解释器将能够找到我们的库。如果我们需要将扩展安装到系统中，可以使用：\n\
    \n```bash\nsudo python3 setup.py install\n```\n\n在当前文件夹中构建好扩展后，如果我们从该文件夹执行 Python\
    \ 程序，解释器将能够找到我们的库。如果我们需要将扩展安装到系统，可以使用：\n\n```python\nimport vector_add_wrapper\
    \ as vaw\nimport random\nN = 1000\na = [random.randint(0, N) for _ in range(N)]\n\
    b = [random.randint(0, N) for _ in range(N)]\nresult = vaw.vectorAdd(a, b, N)\n\
    ```\n\n我们看到了与基于 `ctypes` 版本的两个不同：首先，代码看起来更像 Python 代码，这是扩展在为我们做大量工作；其次，我们正在使用\
    \ numpy 输入数据。\n\n这里有几个需要考虑的问题。首先，随着数组增大，拷贝数据可能会花费很长时间，这不仅耗时（丢弃了 GPU 执行的优势），而且双倍了数据占用的内存，因为它们现在位于两个不同的位置。最后，访问列表元素我们需要调用两次，一次是获取值，另一个是转换为正确的数据类型。\n\
    \n目前我们知道，如果我们能像使用 `ctypes` 那样直接访问 `numpy` 的内部数据，将极大提高我们的结果。因此，在下一节中，我们将更新扩展以集成\
    \ `numpy`。\n\n## 将 numpy 数组传递给库\n\n在我们的第一次集成中，我们使用 `ctypes` 将 numpy 数组传递给库，而在\
    \ Python 科学计算中使用 numpy 无处不在。它提供了高效的连续内存存储、向量化操作，并使用了加速的 CPU 库。通过将 `numpy` 的 C\
    \ API 集成到我们的 C 扩展中，我们将能够使用 Python 侧创建并预处理的数据在 GPU 内部执行进一步计算。这意味着我们可以结合这两个世界的优点，同时保持像\
    \ Python 一样的感觉。\n\n我们将修改之前的代码使 `numpy` API 可用。第一个更改是在我们的 `vector_add_np_wrapper.c`\
    \ 文件中导入它：\n\n```c\n#include <numpy/arrayobject.h>\n```\n"
- fmt: "\nAfter the include, there is one more thing we need to do in terms of infrastructure:\
    \ initialize the `numpy` module inside our module initialization function by adding\
    \ a call to `import_array()`, like this:\n\n```\nPyMODINIT_FUNC PyInit_vector_add_np_wrapper(void)\
    \ {\n   void *handle = dlopen(\"../../build/libvector_add.so\",\n            \
    \             RTLD_LAZY);\n   if (!handle) {\n      PyErr_SetString(PyExc_ImportError,\
    \ \n         \"Could not load libvecor_add.so\");\n      return NULL;\n   }\n\
    \   vectorAdd = (vectorAddFunc)dlsym(handle, \"vecctorAdd\");\n   if (!vectorAdd)\
    \ {\n      PyErr_SetString(PyExc_ImportError, \n         \"Could not find vectorAdd\
    \ in libvectorAdd.so\");\n      return NULL;\n   }\n   import_array();\n   return\
    \ PyModule_Create(&vectoraddmodule);\n}\n```\n\nWith this we have everything in\
    \ place to use the API. It is even possible to manipulate data within the C extension,\
    \ but what we really need is to be able to use what comes from the Python program\
    \ and pass it into our GPU library. So we need to update our `pyVectorAdd` function\
    \ as follows:\n\n```\nstatic PyObject* pyVectorAdd(PyObject* self,PyObject* args){\n\
    \   PyArrayObject *a, *b, *c;\n   int N;\n   if (!PyArg_ParseTuple(args, \"OOOi\"\
    , &a, &b, &c, &N))\n      return NULL;\n   int *a_ptr = (int*)PyArray_DATA(a);\n\
    \   int *b_ptr = (int*)PyArray_DATA(b);\n   int *c_ptr = (int*)PyArray_DATA(c);\n\
    \   vec_add(a_ptr, b_ptr, c_ptr, N);\n   Py_RETURN_NONE;\n}\n```\n\nNote that\
    \ we are not now copying data from one data structure to another, we are using\
    \ the internal pointer to the externally allocated array. And we do not need to\
    \ copy results either, because they are being filled inside our GPU library, which\
    \ is receiving the pointer to the array that `numpy` allocated.\n\nAgain, it is\
    \ always a good idea to have safeguards in place to check types and these kinds\
    \ of things, but for the sake of simplicity we are not adding those.\n\nOur `setup.py`\
    \ will also need to change to include our `numpy` include, so that when the extension\
    \ gets built it will be able to link correctly to it. Below are the changes that\
    \ need to be made to the file:\n\n```\nfrom setuptools import setup, Extension\n\
    import numpy\nmodule = Extension(\n   \"vector_add_np_wrapper\",\n   include_dirs\
    \ = [numpy.get_include()],\n   sources=[\"vector_add_np_wrapper.c\"],\n)\nsetup(\n\
    \   name=\"vector_add_np_wrapper\",\n   version=\"1.0\",\n   description=\"Python\
    \ binding for CUDA vector addition\",\n   ext_modules=[module],\n   include_dirs=[numpy.get_include()]\n\
    )\n```\n\nWhile basically the same as we have seen before, we have now imported\
    \ `numpy` so that we can find the include directory and pass it into `setup`.\n\
    \nWe build the extension with the same command as before:\n\n```\npython3 setup.py\
    \ build_ext --inplace\n```\n\nThe application changes a little bit, because now\
    \ we will use `numpy` arrays as we did in our first example:\n\n```\nimport vector_add_np_wrapper\
    \ as vaw_np\nimport numpy as np\nN = 1000\na = np.random.randint(0, N, size=N,\
    \ dtype=np.int32) \nb = np.random.randint(N, 2*N, size=N, dtype=np.int32)\nc =\
    \ np.zeros(N, dtype=np.int32)\nvaw_np.vectorAdd(a, b, c, N)\n```\n\nThis is exactly\
    \ what a Python programmer would expect from an extension: use `numpy` arrays\
    \ to generate their data and pass it in for processing as if it were any other\
    \ library.\n\nWith this small change we’ve got rid of the memory doubling problem\
    \ we had before and have also increased performance – but we will check the numbers\
    \ in the next section.\n\n## Analysing performance\n\nWe’ve now seen two ways\
    \ to make our GPU code available to Python. It is clear that `ctypes` is very\
    \ straightforward, even though it has that awkward way of defining the functions\
    \ that will be used. Creating an extension, on the other hand, offers a very clear\
    \ interface to the end user even though it is a little more laborious.\n\nHowever,\
    \ it is not only style that counts here; it is also clear that our extension implementation\
    \ that did not use `numpy` arrays involves extensive data copying. The question\
    \ is: how much does that affect the overall performance?\n\n![Figure 9.2: Execution\
    \ time for each type of Python integration](media/file96.png)\n\nFigure 9.2: Execution\
    \ time for each type of Python integration\n\nAs we mentioned before, we are calling\
    \ the second version of our extension `wrapper_np` to denote that it uses numpy\
    \ access. Note that with an array size of up to 100,000 the simple wrapper wins,\
    \ while the other versions `wrapper_np` and `ctypes` are technically in a draw.\n\
    \nHowever, when we really increase the array size, to one million or ten million\
    \ elements, we see that there is no way that data duplication can match using\
    \ the data pointers directly.\n\nTo be fair, in our comparisons we’ve measured\
    \ only the execution time of the call to the extension, meaning that we did not\
    \ count the time necessary to generate the random data. Also, we executed each\
    \ program ten times and calculated the average time, and to make sure the times\
    \ were not affected by outliers we removed the lowest and highest values.\n\n\
    Another important consideration is that our library was compiled using a debug\
    \ profile in CMake, but even using a release profile would make no difference\
    \ on the performance because the bottleneck is not within the GPU library but\
    \ within the wrapper used.\n\n## Summary\n\nIn this chapter we learned how to\
    \ access GPU kernels from Python, an interesting and important topic that opens\
    \ a whole new world for us to explore. We can mix the acceleration we can achieve\
    \ with the GPU kernels and the ease of use of Python.\n\nWe saw two distinct ways\
    \ to provide the integration: by using `ctypes` and by creating a Python extension.\
    \ With the extension we explored two approaches, the first by copying data and\
    \ the second by using `numpy` internal data pointers directly, which is much faster.\
    \ The great advantage of the first approach is that it is a purely Python implementation\
    \ which does not involve compiling anything extra. The second approach allows\
    \ finer grained control of everything, but we must compile the extension to make\
    \ it available.\n\nRegardless of the approach taken, we should make the effort\
    \ to reuse memory, or we lose the gains that the GPU can provide, as we saw in\
    \ the performance analysis section.\n\nIn the next chapter we discuss where we\
    \ go from here. Which libraries already exist, and how can we leverage them together\
    \ with our own kernels? Stay tuned!\n\n# 10\n\n# Exploring existing GPU models\n\
    \n## Join our community on Discord\n\n[https://packt.link/deep-engineering-cpp](https://packt.link/deep-engineering-cpp)\n\
    \n![](media/file97.png)\n\nKnowing how the GPU works is a fundamental part of\
    \ employing it effectively in our projects. To help explore its hardware features\
    \ and relate them to GPU programming concepts we've examined a variety of algorithms,\
    \ and seen how our implementations of them can best exploit the GPU's architecture.\
    \ In particular we've seen how learning to add vectors and multiply matrices helps\
    \ us understand CUDA threads, blocks and grids. We’ve also learnt about optimizations\
    \ and how to handle memory transfers and memory access more efficiently.\n\nIn\
    \ this chapter we investigate several topics that can have an important bearing\
    \ on our time market and the reliability of our projects. The first of these topics\
    \ is libraries for working with GPUs. We’ll first learn about existing libraries\
    \ and then consider the conditions under which it is appropriate to write our\
    \ own code. Then we discuss the idea that running sequential code on the GPU can\
    \ sometimes eliminate or reduce performance-limiting data movements. In the last\
    \ section we will explore the use of interpreted languages to help test the code\
    \ on multiple levels.\n\nThus, to summarize, this final chapter will cover these\
    \ topics:\n\n*   Using existing libraries and frameworks\n\n*   Writing your own\
    \ code\n\n*   Moving sequential code to GPU\n\n*   Testing our code for greater\
    \ quality\n\n## Technical requirements\n"
