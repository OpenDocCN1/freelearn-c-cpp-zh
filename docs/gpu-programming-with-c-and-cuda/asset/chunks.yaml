    ![Figure 8.15: Effect of transfer size on execution time for 1020 MB](media/file85.png)


    Figure 8.15: Effect of transfer size on execution time for 1020 MB


    ![Figure 8.16: Effect of transfer size on execution time for 4092 MB](media/file86.png)


    Figure 8.16: Effect of transfer size on execution time for 4092 MB


    As we can see in *Figures 8.15 and 8.16*, as we increase the size of the transfer,
    we achieve better execution times, but beyond a certain point further size increases
    degrade the execution time. It would be super-useful if we could visualize why
    this happens, and thanks to the visual profiler that we learned about in *Chapter
    7* we can! Let’s compare the system trace for some of the executions and understand
    those effects.


    First, we will look at how the program that does not use streams behaves.


    ![Figure 8.17: Transfer the whole data set and then compute](media/file87.png)


    Figure 8.17: Transfer the whole data set and then compute


    We can see in *Figure 8.17* that we must wait for the whole data transfer to complete
    before we can compute our results. This is a key concept here: we have a transfer
    time and a computing time that we want to better use.


    Now, we’ll compare the traces for three scenarios where total data size is 1020
    MB.


    ![Figure 8.18: Overlap data transfer with computation, too many partitions](media/file88.png)


    Figure 8.18: Overlap data transfer with computation, too many partitions


    We can see in *Figure 8.18* the system trace for a chunk size of 273, and as we
    can see in the first part of our table, it is actually *slower* than the no-streams
    version. This comes as no surprise, since the data transfer is too small and compute
    time ends up dominating program execution. It’s so bad that we even kept it out
    of the charts in *Figures 8.15 and 8.16*.


    ![Figure 8.19: Computation time is totally absorbed by transfer time](media/file89.png)


    Figure 8.19: Computation time is totally absorbed by transfer time


    *Figure 8.19* shows the system trace for a chunk size of 1,638, and as we can
    see in the first part of *Table 8.1*, it delivers the best performance. This is
    due to the good balance of execution time being overlapped by memory transfers
    and those transfers being able to fully use the PCIe bus. In this case, every
    time the transfer of a new chunk completes, processing starts, and a new memory
    transfer occurs at the same time.


    ![Figure 8.20: Transfer time is too big, like the no-streams version](media/file90.png)


    Figure 8.20: Transfer time is too big, like the no-streams version


    In *Figure 8.20* we see the system trace for a chunk size of 8190, which gives
    a total transfer size of 508 MB. This is too big, making our GPU wait too long
    before it can start to process anything. The effect is that execution time rises
    again, as we can see both in our table and in the charts shown in *Figures 8.15
    and 8.16*.


    Finally, we’ll compare the traces for three scenarios where the total data size
    is 4092 MB.


    ![Figure 8.21: Overlap data transfer with computation, too many partitions](media/file91.png)


    Figure 8.21: Overlap data transfer with computation, too many partitions


    We can see in *Figure 8.21* the system trace for a chunk size of 273, and as we
    can see in the second part of Table 8.1 this can achieve some benefit since it
    uses just 32 MB, but computation time is larger than the memory transfer times.


    ![Figure 8.22: Computation time is totally absorbed by transfer time](media/file92.png)


    Figure 8.22: Computation time is totally absorbed by transfer time


    In *Figure 8.22* we see the system trace for a chunk size of 819, and as we can
    see in the second part of our table this is almost the best performance for total
    data 4092 MB, but we selected this based on the 100 MB size to be able to compare
    with the scenario of Figure 8.19\. Here, the time to compute and copy results
    back is almost the same as the time to copy another chunk.


    ![Figure 8.23: Transfer time is too big, like the no-streams version](media/file93.png)


    Figure 8.23: Transfer time is too big, like the no-streams version


    Finally, *Figure 8.23* shows the system trace for a chunk size of 16380, which
    gives a total of 2044 MB of transfer size. This is too big, and again the GPU
    sits idly waiting to process the data, with the result that execution time rises.'
