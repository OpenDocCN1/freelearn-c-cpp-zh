- fmt: "\nHere is a curious twist: even though matrix multiplication is more complex\
    \ than matrix addition, it is still considered an embarrassingly parallel problem,\
    \ since the core idea remains the same: each calculation of an element in `C`\
    \ can be performed independently of others. No thread needs to wait for another\
    \ to finish before it can do its work, so there is no need for synchronization.\
    \ This is a huge advantage, because we can assign multiple threads to work simultaneously\
    \ without having to coordinate them very much.\n\nNow it is time for our code!\
    \ In this example we are considering `square matrices`, meaning that the number\
    \ of rows equals the number of columns. Here is our kernel for the multiplication:\n\
    \n```\n__global__ void matrixMulKernel(double *A, double *B, \ndouble *C, int\
    \ width) {\n  int row = blockIdx.y * blockDim.y + threadIdx.y;\n  int col = blockIdx.x\
    \ * blockDim.x + threadIdx.x;\n  if (row < width && col < width) {\n    double\
    \ value = 0;\n    for (int k = 0; k < width; k++) {\n        value += A[row *\
    \ width + k] * B[k * width + col];\n    }\n    C[row * width + col] = value;\n\
    \  }\n}\n```\n\nIt is worth noticing that now we are using two dimensions for\
    \ the `threadId`, which makes it a little more comfortable to think about the\
    \ indices.\n\nEach thread will have a combination of `row` and `col` values that\
    \ represent the indices of the element being calculated for the output matrix,\
    \ but also represent the row from matrix `A` and column from matrix `B` that must\
    \ be processed. Having a `for` loop allows us to access each corresponding element,\
    \ multiply and store in a local variable.\n\nAnother important piece of code is\
    \ the configuration to launch the kernel, as we can see below:\n\n```\ndim3 blockDim(16,\
    \ 16);\ndim3 gridDim( (N + blockDim.x - 1) / blockDim.x, \n              (N +\
    \ blockDim.y - 1) / blockDim.y  );\nmatrixMulKernel<<<gridDim, blockDim>>>(d_A,\
    \ d_B, d_C, N);\n```\n\nHere `N` represents the `order` of our matrices, or in\
    \ other words, the size of each dimension, meaning that we have `N * N` elements.\
    \ What `blockDim` defines is the number of threads – we will have 256 threads\
    \ being 16 rows and 16 columns at a time. Then we define the number of blocks,\
    \ also using two dimensions on the `gridDim`, but we need to calculate the quantity\
    \ based on the order of the matrices. If `N` = 1000 then we calculate as follows:\n\
    \n`( 1000 + 16 –` `1 ) / 16 = 63.4375`\n\nHowever, since `blockDim.x` has an unsigned\
    \ `int` type, the value will become 63, and and this will be the same in both\
    \ dimensions, meaning that we will have `gridDim(63,63)`. This will create 3969\
    \ blocks and, remembering that each block will have 256 threads, we end up with\
    \ 3969 x 256 = 1,016,064 individual threads for processing our data. Considering\
    \ that we have 1000 × 1000 = 1,000,000 individual elements we are good to go,\
    \ but we must take steps to ensure that the extra 16,064 threads that are off\
    \ boundaries for our matrices will not compute anything. That is why the first\
    \ lines of code in our kernels always include a test to check whether the `threadId`\
    \ is within data limits.\n\nNow would be a suitable time to experiment with the\
    \ code downloaded from our repository, using different values for the size of\
    \ the matrix in order to observe the effects on execution times.\n\nIn the next\
    \ section will work with a different problem, but one that can also benefit from\
    \ parallelism. We will be calculating integrals numerically, meaning that we’re\
    \ going to calculate many points and then sum them.\n\n## Calculating numerical\
    \ integrals\n\nTo start with: what is an integral? Well, an integral is a concept\
    \ in calculus that represents the area under a curve on a graph, between two points.\
    \ Imagine you are tracking the path of a car moving along a road, and at fixed\
    \ intervals you measure the car’s speed. Now, if you plot that and calculate the\
    \ area under the curve representing its speed over time, considering that `distance\
    \ = speed × time`, you get the total distance the car traveled! In simple terms,\
    \ an integral sums up tiny slices of area to find a total, making it a powerful\
    \ way to measure quantities that accumulate over a range.\n\n> **Why are integrals\
    \ useful?**\n> Integrals are everywhere in science, engineering, and beyond. They\
    \ help us measure things that change continuously—like distance, energy, or growth—by\
    \ calculating the total effect over time or space. For example, engineers use\
    \ integrals to determine forces on structures, economists use them to measure\
    \ total income over time, and environmental scientists use them to model pollution\
    \ spread. Integrals give us a way to understand the big picture from all the tiny\
    \ parts.\n\nSometimes we want to know the area under a curve but don’t have an\
    \ easy formula to work with. That is where numerical integration comes in! It\
    \ enables us to estimate the area when our math skills or formulae fall short.\
    \ We need to make many small calculations and then sum them all – which sounds\
    \ like something we could use a parallel algorithm for, right?\n\nThere are many\
    \ numerical integration methods, but the simplest is called **trapezoidal method**,\
    \ because it uses many trapezoids inside the curve to calculate an approximation\
    \ of the area of the curve.\n\n![Figure 6.6: Two trapezoids inside a curve](media/file20.png)\n\
    \nFigure 6.6: Two trapezoids inside a curve\n\nIn `Figure 6.6` we are using just\
    \ two trapezoids to approximate the area under the curve, to make it easy to understand\
    \ the concept, but in practice we usually add many more trapezoids. Of course,\
    \ most of the times that we need this kind of approach the curve is not as well\
    \ behaved as this one. What is interesting about using trapezoids is that as we\
    \ decrease their width, the top line gets closer to the curve, and this enables\
    \ them to provide a particularly good approximation considering that the math\
    \ is quite simple to compute. So, as is always the case with numerical methods,\
    \ there is a tradeoff of precision for computability.\n\nAnother interesting characteristic\
    \ of the trapezoidal method is that we can use collected data directly in the\
    \ computations. Using the road trip example mentioned at the beginning of this\
    \ section, we might record the car’s speed at 15-minute intervals (0.25 hours).\
    \ Since we do not know where this trip is, we use the trapezoidal method.\n\n\
    | Time (hours) | Speed (km/h) | Speed (mph) |\n| :--- | :--- | :--- |\n| 0 | 60\
    \ | 37.28 |\n| 0.25 | 65 | 40.39 |\n| 0.50 | 70 | 43.50 |\n| 0.75 | 72 | 44.74\
    \ |\n| 1.00 | 68 | 42.25 |\n| 1.25 | 65 | 40.39 |\n| 1.50 | 62 | 38.53 |\n| 1.75\
    \ | 60 | 37.28 |\n| 2.00 | 58 | 36.04 |\n| **Sum** | **130.25 Km** | **79.01 miles**\
    \ |\n\nOf course, our example is so small that it could be calculated manually,\
    \ and so would not amount to an effective use of our GPUs, but imagine that we\
    \ had tens of thousands of data points: then it would start to make sense to use\
    \ a GPU.\n"
  raw: "Here is a curious twist: even though matrix multiplication is more complex\
    \ than matrix addition, it is still considered an embarrassingly parallel problem,\
    \ since the core idea remains the same: each calculation of an element in *C*\
    \ can be performed independently of others. No thread needs to wait for another\
    \ to finish before it can do its work, so there is no need for synchronization.\
    \ This is a huge advantage, because we can assign multiple threads to work simultaneously\
    \ without having to coordinate them very much.\n\nNow it is time for our code!\
    \ In this example we are considering *square matrices*, meaning that the number\
    \ of rows equals the number of columns. Here is our kernel for the multiplication:\n\
    \n```\n__global__ void matrixMulKernel(double *A, double *B, \ndouble *C, int\
    \ width) {\n  int row = blockIdx.y * blockDim.y + threadIdx.y;\n  int col = blockIdx.x\
    \ * blockDim.x + threadIdx.x;\n  if (row < width && col < width) {\n    double\
    \ value = 0;\n    for (int k = 0; k < width; k++) {\n        value += A[row *\
    \ width + k] * B[k * width + col];\n    }\n    C[row * width + col] = value;\n\
    \  }\n}\n```\n\nIt is worth noticing that now we are using two dimensions for\
    \ the threadId, which makes it a little more comfortable to think about the indices.\n\
    \nEach thread will have a combination of `row` and `col` values that represent\
    \ the indices of the element being calculated for the output matrix, but also\
    \ represent the row from matrix *A* and column from matrix *B* that must be processed.\
    \ Having a `for` loop allows us to access each corresponding element, multiply\
    \ and store in a local variable.\n\nAnother important piece of code is the configuration\
    \ to launch the kernel, as we can see below:\n\n```\ndim3 blockDim(16, 16);\n\
    dim3 gridDim( (N + blockDim.x - 1) / blockDim.x, \n              (N + blockDim.y\
    \ - 1) / blockDim.y  );\nmatrixMulKernel<<<gridDim, blockDim>>>(d_A, d_B, d_C,\
    \ N);\n```\n\nHere *N* represents the *order* of our matrices, or in other words\
    \ it is the size of each dimension, meaning that we have *N * N* elements. What\
    \ `blockDim` defines is the number of threads – we will have 256 threads being\
    \ 16 rows and 16 columns at a time. Then we define the number of blocks, also\
    \ using two dimensions on the `gridDim`, but we need to calculate the quantity\
    \ based on the order of the matrices. If *N* = 1000 then we calculate as follows:\n\
    \n`( 1000 + 16 –` `1 ) / 16 = 63.4375`\n\nHowever, since `blockDim.x` has an unsigned\
    \ `int` type, the value will become 63, and this will be the same in both dimensions,\
    \ meaning that we will have `gridDim(63,63)`. This will create 3969 blocks and,\
    \ remembering that each block will have 256 threads, we end up with 3969 x 256\
    \ = 1,016,064 individual threads for processing our data. Considering that we\
    \ have 1000 × 1000 = 1,000,000 individual elements we are good to go, but we must\
    \ take steps to ensure that the extra 16,064 threads that are off boundaries for\
    \ our matrices will not compute anything. That is why the first lines of code\
    \ in our kernels always include a test to check whether the threadId is within\
    \ data limits.\n\nNow would be a suitable time to experiment with the code downloaded\
    \ from our repository, using different values for the size of the matrix in order\
    \ to observe the effects on execution times.\n\nIn the next section will work\
    \ with a different problem, but one that can also benefit from parallelism. We\
    \ will be calculating integrals numerically, meaning that we’re going to calculate\
    \ many points and then sum them.\n\n## Calculating numerical integrals\n\nTo start\
    \ with: what is an integral? Well, an integral is a concept in calculus that represents\
    \ the area under a curve on a graph, between two points. Imagine you are tracking\
    \ the path of a car moving along a road, and at fixed intervals you measure the\
    \ car’s speed. Now, if you plot that and calculate the area under the curve representing\
    \ its speed over time, considering that distance = speed × time, you get the total\
    \ distance the car traveled! In simple terms, an integral sums up tiny slices\
    \ of area to find a total, making it a powerful way to measure quantities that\
    \ accumulate over a range.\n\n> **Why are integrals useful?**\n\n> \n\n> Integrals\
    \ are everywhere in science, engineering, and beyond. They help us measure things\
    \ that change continuously—like distance, energy, or growth—by calculating the\
    \ total effect over time or space. For example, engineers use integrals to determine\
    \ forces on structures, economists use them to measure total income over time,\
    \ and environmental scientists use them to model pollution spread. Integrals give\
    \ us a way to understand the big picture from all the tiny parts.\n\nSometimes\
    \ we want to know the area under a curve but don’t have an easy formula to work\
    \ with. That is where numerical integration comes in! It enables us to estimate\
    \ the area when our math skills or formulae fall short. We need to make many small\
    \ calculations and then sum them all – which sounds like something we could use\
    \ a parallel algorithm for, right?\n\nThere are many numerical integration methods,\
    \ but the simplest is called the **trapezoidal method**, because it uses many\
    \ trapezoids inside the curve to calculate an approximation of the area of the\
    \ curve.\n\n![Figure 6.6: Two trapezoids inside a curve](media/file20.png)\n\n\
    Figure 6.6: Two trapezoids inside a curve\n\nIn *Figure 6.6* we are using just\
    \ two trapezoids to approximate the area under the curve, to make it easy to understand\
    \ the concept, but in practice we usually add many more trapezoids. Of course,\
    \ most of the times that we need this kind of approach the curve is not as well\
    \ behaved as this one. What is interesting about using trapezoids is that as we\
    \ decrease their width, the top line gets closer to the curve, and this enables\
    \ them to provide a particularly good approximation considering that the math\
    \ is quite simple to compute. So, as is always the case with numerical methods,\
    \ there is a tradeoff of precision for computability.\n\nAnother interesting characteristic\
    \ of the trapezoidal method is that we can use collected data directly in the\
    \ computations. Using the road trip example mentioned at the beginning of this\
    \ section, we might record the car’s speed at 15-minute intervals (0.25 hours).\
    \ Since we do not know where this trip is occurring, we will display speeds in\
    \ both kilometers/hour as well as in miles/hour:\n\n| Id | Time (hours) | Speed\
    \ (km/h) | Speed (mph) |\n\n| 0 | 0.00 | 60 | 37.28 |\n\n| 1 | 0.25 | 65 | 40.39\
    \ |\n\n| 2 | 0.50 | 70 | 43.50 |\n\n| 3 | 0.75 | 72 | 44.74 |\n\n| 4 | 1.00 |\
    \ 68 | 42.25 |\n\n| 5 | 1.25 | 65 | 40.39 |\n\n| 6 | 1.50 | 62 | 38.53 |\n\n|\
    \ 7 | 1.75 | 60 | 37.28 |\n\n| 8 | 2.00 | 58 | 36.04 |\n\nTo apply the trapezoidal\
    \ method, we use the average of the heights at the two endpoints, multiplied by\
    \ the width of the section. In this case the width of the section is 0.25, which\
    \ is our interval, and the heights are the actual measured values.\n\nOur first\
    \ section is from 0 to 0.25, the height at 0 was 60 and at 0.25 was 65 so the\
    \ average height is (60 + 65)/2 and multiplying by the section width 0.25 we get\
    \ a speed of 15.625 km / hour. Let’s use a table for that:\n\n| id | kilometers\
    \ | miles |\n\n| 1 | (60+65)/2 x 0.25 = 15.63 | (37.28+40.39)/2 x 0.25 = 9.42\
    \ |\n\n| 2 | (65+70)/2 x 0.25 = 16.88 | (40.39+43.50)/2 x 0.25=10.11 |\n\n| 3\
    \ | (70+72)/2 x 0.25 = 17.75 | (43.50+44.74)/2 x 0.25=10.56 |\n\n| 4 | (72+68)/2\
    \ x 0.25 = 17.50 | (44.74+42.25)/2 x 0.25=10.25 |\n\n| 5 | (68+65)/2 x 0.25 =\
    \ 16.63 | (42.25+40.39)/2 x 0.25=10.16 |\n\n| 6 | (65+62)/2 x 0.25 = 15.88 | (40.39+38.53)/2\
    \ x 0.25=9.73 |\n\n| 7 | (62+60)/2 x 0.25 = 15.25 | (38.53+37.28)/2 x 0.25=9.45\
    \ |\n\n| 8 | (60+58)/2 x 0.25 = 14.75 | (37.28+36.04)/2 x 0.25=9.33 |\n\n| Sum\
    \ | 130.25 Km | 79.01 miles |\n\nOf course, our example is so small that it could\
    \ be calculated manually, and so would not amount to an effective use of our GPUs,\
    \ but imagine that we had tens of thousands of data points: then it would start\
    \ to make sense to use a GPU. The truth is that the more points we add, the better\
    \ our approximation will be."
