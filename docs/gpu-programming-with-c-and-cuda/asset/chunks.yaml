- fmt: '

    The most obvious challenge is that we can''t change the device’s components, so
    we can''t upgrade its memory, for example. Hardware limitations will directly
    restrict what we can do and how we''ll need to break down our data for processing.
    We also talked about memory transfers, something that can easily become an overhead
    if we have to move data to and from the device constantly. Typically, we try to
    move data to the device and compute as much as possible before having to move
    more data. Another aspect is that some types of computation aren''t fit to be
    executed within the GPU, such as code that has too many branches or that isn’t
    parallelizable (remember driving to the supermarket?). We may choose to execute
    sequential code on the device if that''s an alternative to moving data away from
    the device''s memory. Moreover, memory management considerations are a constant
    factor during development, because the wrong memory access pattern can have a
    performance penalty that invalidates the benefits of using a GPU in the first
    place. These limitations make it obvious that developing for GPU devices is more
    complex than writing traditional sequential software for CPUs, and developers
    must invest some time to learn what''s necessary.


    ### GPU advantages


    Although there are challenges with developing GPU software, the benefits far outweigh
    them. The most immediate benefit is their massive parallelism; even with the simplest
    GPUs, we gain access to hundreds of processing cores. If we can model our solution
    to a linear algebraic method, that''s even better as it will allow us to achieve
    high throughput in our processing, especially if we project the memory transfers
    accordingly. Also, there are a lot of specialized libraries today that make it
    easier to develop our applications; most numerical methods necessary for mathematical
    modeling are already available in thoroughly tested libraries. If it''s possible
    to use one of those libraries, it will not only accelerate the development time
    but also increase its quality. Additionally, the direct effect of high data throughput
    using GPUs is better use of energy – another benefit of performing many operations
    simultaneously.


    ## Summary


    In this chapter, we learnt about various concepts regarding parallel software
    and its main patterns. We learned about the architecture of GPUs, and we compared
    GPUs with CPUs in order to understand the differences in developing software for
    each. Finally, we discussed the challenges and the benefits of using GPUs in our
    applications. At this point, armed with this new knowledge, a practical side-benefit
    is that we can organize a meeting with our friends much more efficiently, making
    faster trips to the supermarket and preparing appetizers accordingly. In the next
    chapter, we''ll learn how to configure our environment so that we can start programming.
    There are a few steps we must take to get everything is in place ready for that.
    We''ll discuss two alternatives: using Docker and installing it directly on our
    machines.


    # 2 Setting Up Your Development Environment


    ## Join our community on Discord


    [https://packt.link/deep-engineering-cpp](https://packt.link/deep-engineering-cpp)


    ![](media/file0.png)


    When working with any development tool, it is crucial to have a functional environment
    for experimentation. When working with GPUs, it becomes even more important to
    set up the device correctly. However, there are many details that differ between
    operating systems and distributions. We will learn about the tools that can help
    with program construction and the roles they play. Also, where do we get the official
    documentation for our operating system? As a reference, we are going to use Ubuntu.
    This chapter starts by showing how to make things a little easier in terms of
    configuration management by using Docker, and then wraps up by discussing the
    direct installation of tools on our system. In this chapter, we’re going to cover
    the following main topics:


    * Development environment setup

    * Where to get official documentation

    * How to use Docker to simplify things


    ## Technical requirements


    In this chapter, we are going to work on our computer to configure the environment
    in order to use our GPU. For the operating system, we will be using Linux. Although
    any distribution could be used, it''s best to select one that is officially supported
    by NVIDIA. We have a lot of choice when it comes to open source distributions
    for Linux, but we will go with Ubuntu as it is easy to find and install, with
    numerous online posts addressing common issues. It is also officially supported
    by NVIDIA. At the time of writing, Ubuntu 24.04 LTS is available, but it is not
    yet listed as supported by the NVIDIA installer for `CUDA 12.4` (the current version).
    Instead, we have Ubuntu 20.04 and 22.04, either of which is suitable for our purposes.
    We need to have a computer with an NVIDIA GPU: it could be a virtual machine on
    your preferred cloud service, a laptop, or a desktop, but to take full advantage
    of the information presented in this book, it is mandatory to have an NVIDIA GPU.
    Another alternative may be to use Cloud Platform Services, which does not have
    a dedicated full virtual machine, but which provides support for GPUs, as does
    Google Colab, which provides a hosted Jupyter Notebook service and which, after
    some configuration, can support `CUDA C/C++` programming. The service may be accessed
    at [https://colab.research.google.com/](https://colab.research.google.com/), but
    its configuration is out of our scope.


    ## Configuring your development environment


    It is fundamental to have NVIDIA''s proprietary graphic driver installed. This
    is an important item because the default driver that works with NVIDIA GPUs in
    Linux installations is the `nouveau` open source driver, which can execute graphics
    but is not capable of running `CUDA` code. We are going to learn about two possible
    configurations. We will follow an order that is less intrusive to our machines;
    you will have an opportunity to experiment with `CUDA` before committing to installing
    it directly. In the first configuration, we will discuss execution through Docker,
    and in the second configuration, we will see the installation of everything directly
    on our system. Each configuration has pros and cons, which we will also discuss.
    Just to make our strategy clearer, let''s summarize it:


    1. Installing NVIDIA proprietary device driver is mandatory, regardless of the
    `CUDA Toolkit` – so we are going to deal with that first.

    2. Regarding the development environment (a.k.a. `CUDA Toolkit`), we have two
    paths: Docker-based installation or installing it on our system directly.

    3. To make sure that we consider both alternatives before deciding on one of them,
    we are presenting the Docker path first because it is less intrusive.

    4. After taking a brief look at Docker and its pros and cons, we will see how
    to configure and use it in our favor.

    5. After all this, we will learn how to install directly onto our system.


    Now that we have outlined our strategy, in the next section we will learn how
    to configure the video driver required to run our `CUDA` programs.


    ### Getting the correct video driver


    There are several ways to determine which driver version you should use. The simplest
    one is to visit NVIDIA''s website ([https://www.nvidia.com/Download/index.aspx?lang=en-us](https://www.nvidia.com/Download/index.aspx?lang=en-us))
    and fill in the form with your GPU and operating system details. The form will
    return the correct driver to use:


    ![Figure 2.1 – NIVIDA site for device driver selection](media/file7.jpg)


    Figure 2.1 – NIVIDA site for device driver selection


    For the example configuration, we have the following result:


    ![Figure 2.2 – NVIDIA site with device driver result from our information](media/file8.jpg)


    Figure 2.2 – NVIDIA site with device driver result from our information

