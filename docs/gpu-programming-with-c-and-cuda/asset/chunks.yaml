    The page mentions CUDA driver installation, but that was the first thing we installed,
    so we can skip that step. After running the installation steps, it is recommended
    that we reboot our system and, following that, we can test our installation with
    `nvidia-smi`, as we did before with Docker. However, iIt is a good idea to use
    the following command, which prints the version of the CUDA compiler:


    ```

    nvcc -V

    ```


    This will present the version of the NVIDIA compiler. When directly installing
    the CUDA Toolkit there were fewer steps because we did not need to install Docker.
    Keep in mind though that having the CUDA Toolkit directly installed on our system
    means we may have to deal with different versions of some libraries, depending
    on our projects'' needs. This version management is not a huge concern with the
    Docker approach because everything gets packed inside the Docker container image.
    If we want to switch between versions, we just need to run a different container
    image.


    ## Summary


    In this chapter we’ve learned about the options for running the CUDA Toolkit.
    The first approach was based on Docker, and after considering some of its pros
    and cons we outlined the steps involved in its configuration. Once configured,
    we were able to query the GPU system inside a running container. The second approach
    was to install the CUDA Toolkit directly onto our system. This is a little more
    intrusive, and we may have to deal with multiple versions in the future, but is
    also important to be aware of it as a possibility. That all done, it’s now time
    to fasten our seat belts because, in the next chapter, we will write our first
    CUDA program!


    # Chapter 5: A Closer Look into the World of GPU


    ## Join our community on Discord


    [https://packt.link/deep-engineering-cpp](https://packt.link/deep-engineering-cpp)


    ![](media/file11.png)


    Now that we’ve had a glimpse of GPU programming with slightly larger applications
    it is time to learn in more detail what enables GPUs to confer such speed advantage.
    First, we are going to learn about concepts that map to the GPU cores and how
    we address them.


    After that, we will go through more advanced concepts relating to how modern GPUs
    execute much more at the same time. Finally, we will take a first look at how
    to improve memory access times inside the GPU environment, and consider why it
    matters.


    With the solid foundation of the previous chapters to build on – we’ve seen how
    to compile and run CUDA programs, and have learnt about the effects of memory
    transfers on performance – we are well placed to understand in more detail what
    is needed to create a high-performing GPU application. By the end of this chapter,
    you will have mastered the abstractions that represent GPU execution, some more
    advanced techniques to speed up performance measurement, and how to think about
    memory usage.


    The main topics of this chapter are thus:


    *   Thread, block, and grid concepts

    *   Asynchronous data transfer

    *   Streams

    *   Events

    *   Shared memory


    ## Technical requirements


    This is going to be a more conceptual chapter, in which we dive deep into topics
    governing the realm of GPU. But fear not, more code is on the way!


    ## Understanding the thread, block, and grid concepts


    In `Chapter 4` we finally executed really parallel CUDA programs, and we saw that
    a configuration is needed for launching the kernel. More than that, this launch
    configuration forms part of the program itself. Taking a closer look at the vector
    addition program, we saw that the CPU version has a `for` loop while the GPU version
    has a configuration in place of this `for` loop. Thus we need to discuss the concepts
    that determine how execution takes place. Threads, blocks, and grids work together,
    but let''s get to know them individually first.


    ### Threads


    A `thread` is the basic unit of execution in CUDA, with each thread having its
    own `unique ID` that allows it to independently access a specific portion of the
    data. For a given problem, we define a set of threads that can handle the requisite
    amount of data. Thread IDs can be one-dimensional, two-dimensional, or three-dimensional
    (`threadIdx.x, threadIdx.y, threadIdx.z`), depending on the block configuration
    defined.


    Every thread has some local memory and registers. Each local variable is allocated
    to registers, but the number of registers per thread is limited, so if we define
    too many local variables we may incur `register spilling`, when it is necessary
    to allocate variables to local memory that is slower to access.


    Hidden from our sight, the `thread scheduler` on each `streaming multiprocessor`
    (`SM`) manages the execution of `warps` – which is a fancy word for a low-level
    group organized and controlled by the hardware.


    ### Blocks


    A block is a high-level group of threads that execute a kernel together, which
    can synchronize and share memory. We may think of blocks as containers for threads.
    Just like threads, blocks can be organized in one, two, or three dimensions (`blockIdx.x,
    blockIdx.y, blockIdx.z`). This provides a flexible way in which to map the threads
    and blocks to multidimensional problems like image processing or scientific simulations.


    > Blocks and warps are not the same!


    > Keep in mind that although both are groups of threads, blocks are defined by
    us when we call for kernel execution. On the other hand, warps are a low-level
    grouping defined by the hardware to organize thread execution. Warps have 32 threads
    that execute the exact instruction at the same time.


    As of the time of writing, each block contains a maximum number of 1024 threads,
    which is a limit imposed by the hardware. It affects how we structure our problem.
    Remember that the amount of memory we have is limited, so the more threads we
    allocate to a block the less memory will be available for them, both to share
    as well as define local variables.


    An important characteristic of blocks is that they allow threads to cooperate
    via shared memory. They can use this special memory to share intermediate results
    or to communicate with each other, as long as they reside on the same block.


    > Shared memory is a power-up!


    > Shared memory is a special kind of on-chip memory that is close to the cores
    and which is shared among the threads of a block. Since it is dramatically faster
    than global memory, it is essential to use it to improve performance.


    What difference does it make to organize things like this? Well, the system may
    schedule blocks to execute in any order across the available streaming multiprocessors,
    the only restriction being that threads in separate blocks will not be able to
    communicate with each other.


    Within their block, threads can synchronize by using the `__syncthreads()` function,
    which makes all the threads wait on that call point until all threads have reached
    it. We will use this in a concrete example in `Chapter 6`.


    ### Grids

