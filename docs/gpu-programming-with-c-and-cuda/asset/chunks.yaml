    \ C++ 代码和汇编代码，以便我们检查生成的代码是否符合我们的预期。（在书中我们不会深入研究 GPU 的汇编代码，但如果你想查看代码的编译结果，了解如何获取这些信息是非常重要的。）\n\
    \n![图 7.23: 选定代码的汇编代码](img/file45.png)\n\n图 7.23: 选定代码的汇编代码\n\n在继续之前，让我们来看看另一个有趣的工具。我们可以点击`添加基准（Add\
    \ Baseline）`来保留当前值，以便与其他性能分析会进行对比。点击按钮后，我们得到了在*图 7.24*中所示的结果。\n\n![图 7.24: 当前执行结果作为基准添加](img/file46.png)\n\
    \n图 7.24: 当前执行结果作为基准添加\n\n现在我们已经知道在`详情（Details）`页面上要寻找什么，并且已经了第一个用于对比的基准，让我们在下一节看看如何使用所有方法中最简单的一种来优化代码：使用带有编译器优化标志的\
    \ Release 配置。\n\n### 使用 Release 配置（Using the Release configuration）\n\n在上一节中，我们对矩阵乘法内核的基础版本进行了性能分析，该版本使用了我们所谓的*朴素（naive）*方法处理问题，没有任何代码优化。优化代码最简单的方法是使用编译标志来配置编译器执行优化。\n\
    \n由于我们正在使用 `CMake`，我们需要配置项目以进行不同的编译，我们在 VS Code 终端中通过以下命令来实现：\n\n```\ncmake -DCMAKE_BUILD_TYPE=Release\
    \ ..\n```\n\n这更改了我们的 Makefile，使其使用 `-O3` 优化级别进行编译，并且在生成的代码中不包含调试信息。这样，编译器将尽可能分析我们的代码，以应用一些微调，例如循环展开（关于此点的更多内容将在后续章节*使用循环展开进行进一步改进*中进行详细介绍）以及在可能的情况下使用更多的寄存器。\n\
    \n在新配置完成后后，我们需要再次运行 `make`：\n\n```\nmake\n```\n\n编译完成后，我们需要再次使用这个新的可执行文件运行性能分析器，操作方法是再次点击项目并点击`启动（Launch）`按钮。\n\
    \n我们在*图 7.25*中再次看到了新版本代码的性能分析结果。\n\n![图 7.25: 同一内核 Release 编译摘要](img/file47.png)\n\
    \n图 7.25: 同一内核 Release 编译摘要\n\n注意，寄存器的数量增加了，而时间大幅下降。鉴于我们只改变了一个简单的配置，这是一个非常好的开始！\n\
    \n在*图 7.26*中，我们可以看到新版本的性能有所提升，这反映在 Roofline 图表中。\n\n![图 7.26: Release 内核的 Roofline\
    \ 图](img/file48.png)\n\n图 7.26: Release 内核的 Roofline 图\n\n我们在*图 7.27*中注意到的另外一点是，L1\
    \ 和 L2 缓存命中率都提高了，这也导致了执行时间的缩短。但同样没有使用共享内存，因为这不能仅由编译器引导，而是需要不同的算法。\n\n![图 7.27:\
    \ Release 内核的内存图](img/file49.png)\n\n图 7.27: Release 内核的内存图\n\n我们的占用率（Occupancy）图表也发生了变化，因为我们现在使用了更多的寄存器，但正如*图\
    \ 7.28*所示，线程数量仍然没有改变，共享内存的使用也没有改变。\n\n![图 7.28: Release 内核的占用率](img/file50.png)\n\
    \n图 7.28: Release 内核的占用率\n\n现在，如果我们仔细观察*图 7.29*，会看到工具提示显示没有可用源码信息。原因是我们在生成代码时没有包含调试信息。\n\
    \n![图 7.29: Release 内核的源码计数器](img/file51.png)\n\n图 7.29: Release 内核的源码计数器\n\n\
    使用 Release 配置的一个直接影响是丢失了源码中的调试信息，这使得理解接下来的优化步骤可能变得困难得多。然而，在进行代码更改之前，比较使用编译器标志的影响对我们的研究至关重要。我们可以看到，仅仅通过更改配置就实现了惊人的优化。\n\
    \n现在，在下一节中，让我们应用第一个真正的代码优化：更改代码以使用共享内存。\n\n### 使用共享内存改进时间（Using shared memory\
    \ to improve time）\n\n我们将应用的第一个真正的优化是使用共享内存来提高执行时间。这将从根本上改变我们的内核，所以让我们先检查代码。\n\
    \n```cpp\n#define TILE 16\n__global__ void matrixKernel_shared\n         (const\
    \ float* A, const float* B, float* C, int n){\n  __shared__ float Asub[TILE][TILE];\n\
    \  __shared__ float Bsub[TILE][TILE];\n  int tx = threadIdx.x;\n  int ty = threadIdx.y;\n\
    \  int row = blockIdx.y * blockDim.y + ty;\n  int col = blockIdx.x * blockDim.x\
    \ + tx;\n  float sum = 0.0f;\n\n  for(int i=0; i < (n + blockDim.x - 1) / blockDim.x;\
    \ i++)\n  {\n     if (row < n && i * blockDim.x + tx < n)\n         Asub[ty][tx]\
    \ = A[row * n + i * blockDim.x + tx];\n     else\n         Asub[ty][tx] = 0.0f;\n\
    \n     if (col < n && i * blockDim.y + ty < n)\n        Bsub[ty][tx] = B[(i *\
    \ blockDim.y + ty) * n + col];\n     else\n        Bsub[ty][tx] = 0.0f;\n\n  \
    \   __synctreads();\n\n     for (int k = 0; k < blockDim.x; k++) {\n        sum\
    \ += Assub[ty][k] * Bsub[k][tx];\n     }\n\n     __synctreads();\n  }\n\n  if\
    \ (row < n && col < n)\n     C[row * n + col] = sum;\n}\n```\n*(注：原文代码中 `Assub`\
    \ 疑为 `Asub` 的笔误，此处按要求保留代码块不翻译)*\n\n我们现在要做我们在*第 5 章*中讨论过的内容：将数据预取到共享内存中以便重复使用。\n"
- fmt: "\nOur local shared memory is limited, so we have to select a few elements\
    \ from global memory. Also, we have to remember that in global memory, our matrices\
    \ are stored as contiguous arrays so we have to calculate what the actual index\
    \ is for a given element. We can calculate the position based on the start of\
    \ each row, given by `row * n`, and once we find the starting position we have\
    \ to find the current element that we want to copy with `i * blockDim.x + tx`.\
    \ Remember that `tx` is our index for this thread and `i` is incremented until\
    \ we reach the limit `n/blockDim.x` of the matrix. (Here we simplified the limit\
    \ just for sake of clarity, but the actual code divides it in a way that is already\
    \ familiar to us, so that the resulting value is equal to or greater than a multiple\
    \ of the width).\n\nBut what does this mean? All this calculation allows the threads\
    \ to access different positions in the global memory (remember that `tx` is different!),\
    \ and since we multiply `i` by `blockDim.x` to find the tile we are loading it\
    \ is as if we were moving a camera over a really long drawing and taking snapshots.\
    \ Pretty clever right?\n\nWe use the same approach to fill our local sub-matrix\
    \ `B`, so we do not need to discuss the calculations again.\n\nAfter loading our\
    \ first set of tiles we need to make sure that all threads have completed their\
    \ work, so we issue a `__syncthreads()` command to make them all get together.\
    \ After this, we know we can perform calculations because our shared memory is\
    \ filled.\n\nWhat we do next is use another `for` loop that processes, for each\
    \ thread, a piece of the calculation. We do not have to worry because the `sum`\
    \ variable is local to each thread, so we will have multiple variables in play,\
    \ each one storing the partial sum for a given element of the resulting matrix.\
    \ On each iteration of the main loop, the `sum` variable will be incremented by\
    \ one more partial sum, until we reach the final result.\n\nOnce all the tiles\
    \ have been processed our threads will save their results to global memory, as\
    \ long as the values for `row` and `col` are within the boundaries of the matrix\
    \ width `n`.\n\nAfter all these changes we need to compile our code again, but\
    \ first we need to go back to our Debug configuration by using:\n\n```\ncmake\
    \ -DCMAKE_BUILD_TYPE=Debug ..\n```\n\nAnd again build the application with:\n\n\
    ```bash\nmake\n```\n\nNow, let's analyze this version of the code with our profiler,\
    \ by clicking on the project inside NVidia Nsight Compute and clicking the `Launch`\
    \ button again. We can see the current session in Figure 7.30.\n\n![Figure 7.30:\
    \ Summary for shared memory kernel](media/file52.png)\n\nFigure 7.30: Summary\
    \ for shared memory kernel\n\nNotice that it took longer to execute this version\
    \ than the naive one. This might seem odd, but it is due to us compiling in Debug\
    \ mode. However, we can see that the number of registers has increased, so optimizations\
    \ are on their way!\n\nNext let's take a look at our Roofline chart, in Figure\
    \ 7.32.\n\n![Figure 7.31: Roofline for the shared memory kernel](media/file53.png)\n\
    \nFigure 7.31: Roofline for the shared memory kernel\n\nThe Roofline chart gives\
    \ us another surprise, as the new version performs below the original naive implementation.\
    \ The higher circle is the release version, the slight lower one is our current\
    \ version in debug mode and in between is the naive implementation. However, we\
    \ notice a drastic change in our Memory Chart, shown in Figure 7.32.\n\n![Figure\
    \ 7.32: Memory chart for shared memory kernel](media/file54.png)\n\nFigure 7.32:\
    \ Memory chart for shared memory kernel\n\nWhat we notice is that the many accesses\
    \ that were being made directly to global memory are now focused on shared memory,\
    \ which is much faster. Here it is worth pausing for consideration. While we are\
    \ prefetching data from global memory, it may seem that it is not worth the trouble\
    \ of dealing with shared memory, since we have to access global memory anyway.\
    \ However, there is a catch here. Since we are loading data to shared memory,\
    \ we need to make a load from global memory first for each element of the matrix,\
    \ but for subsequent computations – remember that for each row we compute against\
    \ all columns – data is already present in shared memory, and this boosts our\
    \ access dramatically. Notices that the majority of the accesses were redirected\
    \ to this block in our Memory Chart.\n\nIf we take a look at our Occupancy we\
    \ will notice that the changes were more registers as well as the use of shared\
    \ memory, as we can see in Figure 7.33.\n\n![Figure 7.33: Occupancy for shared\
    \ memory kernel](media/file55.png)\n\nFigure 7.33: Occupancy for shared memory\
    \ kernel\n\nBy using the Debug configuration it seems that we are not improving\
    \ when considering the execution time, but we have to consider all the dimensions\
    \ on which we are applying optimizations to understand the details.\n\nNext let's\
    \ unroll our partial sum calculation loop to improve things a little bit further.\n\
    \n### Using loop unroll for further improvements\n\nLoop unrolling is a technique\
    \ for expanding the calculations performed withing a loop so that the application\
    \ benefits from better use of registers and parallelization of more instructions.\
    \ However, doing this manually can be confusing, so we will rely on compiler directives\
    \ so that the compiler performs this for us. Let's take a look at the code.\n\n\
    ```cpp\n#pragma unroll\nfor (int k = 0; k < blockDim.x; k++) {\n    sum += Asub[ty][k]\
    \ * Bsub[k][tx];\n}\n```\n\nNew here is the use of `#pragma unroll`, which asks\
    \ the compiler to unroll this for us.\n\nNow we do not need to perform the CMake\
    \ again, but we do need to build the application by using the `make` command.\n\
    \nIn Figure 7.34 we see a summary of our different versions, all of them in Debug\
    \ configuration.\n\n![Figure 7.34: Summary for shared memory kernel](media/file56.png)\n\
    \nFigure 7.34: Summary for shared memory kernel\n\nFollowing our flow, we will\
    \ take a look at the Roofline chart (Figure 7.35).\n\n![Figure 7.35: Roofline\
    \ for shared memory kernel](media/file57.png)\n\nFigure 7.35: Roofline for shared\
    \ memory kernel\n\nThe current session matches the previous one in terms of performance,\
    \ but remember that we are in Debug configuration which limits the effectiveness\
    \ of optimizations.\n\nNext stop is the Memory Chart, seen in Figure 7.36, where\
    \ we also notice that there is not much difference from Figure 7.32.\n\n![Figure\
    \ 7.36: Memory chart for shared memory kernel](media/file58.png)\n\nFigure 7.36:\
    \ Memory chart for shared memory kernel\n\nMoving on to Occupancy, we find that\
    \ (as expected) it is the same as before, because we did not change the amount\
    \ of shared memory or the number of registers.\n\n![Figure 7.37: Occupancy for\
    \ shared memory kernel](media/file59.png)\n\nFigure 7.37: Occupancy for shared\
    \ memory kernel\n\nEvery optimization cycle will lead us through the same steps,\
    \ and we have to take note of the hints and recommendations provided by the tool.\
    \ Now that we are using shared memory and have unrolled our loop we could pay\
    \ attention to one further recommendation. Under Instruction Statistics, the tool\
    \ mentions that we are not making use of fused instructions (see Figure 7.38).\n\
    \n![Figure 7.38: A new recommendation for shared memory kernel](media/file60.png)\n\
    \nFigure 7.38: A new recommendation for shared memory kernel\n\nFused instructions\
    \ are a special type of instruction that together perform a multiplication and\
    \ an addition. This improves the overall performance, and we discuss it in the\
    \ next section.\n"
