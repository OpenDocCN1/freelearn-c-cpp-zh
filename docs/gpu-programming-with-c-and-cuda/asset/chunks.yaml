- fmt: "\nSetting up a CUDA development environment can often be a daunting task,\
    \ especially for those who are new to GPU programming or the CUDA ecosystem. Docker\
    \ simplifies this process significantly by allowing us to use pre-configured Docker\
    \ images from repositories such as Docker Hub. These images come with CUDA and\
    \ all necessary dependencies pre-installed, circumventing the need for complicated\
    \ installation procedures. The convenience of Docker is not limited to beginners.\
    \ Even experienced developers can benefit from this simple setup process. Instead\
    \ of spending valuable time configuring the environment for each new project or\
    \ ensuring compatibility across different machines, we can simply pull a Docker\
    \ image and start programming almost immediately. Additionally, Docker's ease\
    \ of setup promotes a more agile development workflow. When starting a new project\
    \ or testing out new technologies, the time saved on environment setup can be\
    \ significant.\n\n### Readying our development environment\n\nMany websites provide\
    \ information on using and configuring Docker, including the official website,\
    \ which is the authoritative resource for the latest information on Docker, as\
    \ well as the NVIDIA Docker support site, which allows our containers to “see”\
    \ our GPU device. (URLs are given at the end of this section.) However, for the\
    \ sake of simplicity, we are also going to list the current commands to get our\
    \ development environment ready to go. Note that this list may change in the future.\n\
    \n> Motivational note\n\n> > Although the set-up process outlined here may seem\
    \ rather complicated, it will be done only once, so stick with me because it will\
    \ be worth it!\n\nAs always, let's begin with an update to make sure our system\
    \ is up to date:\n\n```\nsudo apt update\nsudo apt upgrade -y\n```\n\nAfter that,\
    \ we need to install some required packages. We’ve have broken this into two lines\
    \ for readability:\n\n```\nsudo apt install -y apt-transport-https ca-certificates\n\
    sudo apt install -y curl software-properties-common\n```\n\nNow, we need to add\
    \ Docker's official GPG key. This command will not display any message:\n\n```\n\
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o\
    \ /usr/share/keyrings/docker-archive-keyring.gpg\n```\n\nAdd the Docker repository\
    \ to our system. This will also display no message:\n\n```bash\necho \"deb [arch=$(dpkg\
    \ --print-architecture) signed-by=/usr/share/keyrings/docker-archive-keyring.gpg]\
    \ https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable\" | sudo\
    \ tee /etc/apt/sources.list.d/docker.list > /dev/null\n```\n\nOur system now knows\
    \ that there is something out there called Docker, but we need another update\
    \ to make sure that any package that needs to be compatible will be on the correct\
    \ version. To do that, we need a new update, like this:\n\n```bash\nsudo apt update\n\
    ```\n\nFinally we have got to the point where we are ready to install Docker!\n\
    \n```\nsudo apt install -y docker-ce docker-ce-cli containerd.io\n```\n\nFor a\
    \ quick test, we execute the following command. It will download a Docker image\
    \ and run it, printing something on the screen:\n\n```bash\nsudo docker run hello-world\n\
    ```\n\nNotice the `sudo` command. This is necessary because our current user is\
    \ not in the correct execution group, which didn't exist until now. To remove\
    \ the need to use `sudo`, we need to configure our user as follows:\n\n```bash\n\
    sudo usermod -aG docker $USER\n```\n\nFor this change to take effect, we need\
    \ to log out and log back in. We can now run `hello-world` again without using\
    \ `sudo`:\n\n```bash\ndocker run hello-world\n```\n\nOne more thing to understand\
    \ is that Docker runs as a service of our operating system. It is a good idea\
    \ to let it start automatically every time the computer turns on. We configure\
    \ that using the following commands:\n\n```bash\nsudo systemctl enable docker\n\
    sudo systemctl start docker\n```\n\nPlease take a breath; we have achieved an\
    \ important milestone: our system is capable of executing Docker. It can be used\
    \ also for other types of systems. Well done! But now we need to go back to work\
    \ because there is more to do if we want to enable Docker to use GPUs. We have\
    \ to install the software from NVIDIA that will allow us to use the GPU inside\
    \ our container. To do that, we need to add a new repository to our system, rather\
    \ as we did for Docker:\n\n```bash\ncurl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey\
    \ | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg\
    \ \\\n  && curl -s -L https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list\
    \ | \\\n    sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg]\
    \ https://#g' | \\\n    sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list\n\
    sudo apt-get update\n```\n\nAfter that, we can install the package:\n\n```bash\n\
    sudo apt install -y nvidia-container-toolkit\n```\n\nWe also need to define the\
    \ NVIDIA runtime:\n\n```bash\nsudo nvidia-ctk runtime configure --runtime=docker\n\
    ```\n\nNow we need to restart the Docker service to use the new capability:\n\n\
    ```bash\nsudo systemctl restart docker\n```\n\nLet's run a test to make sure that\
    \ all the installations worked fine:\n\n```bash\ndocker run --rm --runtime=nvidia\
    \ --gpus all ubuntu nvidia-smi\n```\n\nWhat we did was inform Docker that it should\
    \ make all the GPUs on the system available to the container. The `ubuntu` image\
    \ is downloaded from Docker Hub (where all major companies make their software\
    \ available) and the `nvidia-smi` command is executed inside the running container.\
    \ We get something similar to this:\n\n![Figure 2.4 – Result of nvidia-smi inside\
    \ a Docker container](media/file10.png)\n\nFigure 2.4 – Result of nvidia-smi inside\
    \ a Docker container\n\nThe result is very similar to before; the only difference\
    \ is that no processes are executing, and this is related to the container context.\
    \ This is our second milestone: having a Docker installation capable of running\
    \ CUDA software.\n\n#### Official websites\n\nHere are the (current) addresses\
    \ of the websites that contain all the information about what we just did, and\
    \ which may be necessary for future reference:\n\n*   Official Docker – [https://www.docker.com/](https://www.docker.com/)\n\
    *   Official NVIDIA Container Toolkit – [https://github.com/NVIDIA/nvidia-container-toolkit](https://github.com/NVIDIA/nvidia-container-toolkit)\n\
    \n## CUDA Toolkit installation\n\nNow that we know how to use the CUDA Toolkit\
    \ in an isolated fashion, let’s learn how to directly install it on our machine.\
    \ This option provides a greater level of flexibility but also entails having\
    \ to manage possible different versions of libraries spreading through our systems.\
    \ First we need to download the Toolkit from the official NVIDIA website at [https://developer.nvidia.com/cuda-toolkit](https://developer.nvidia.com/cuda-toolkit),\
    \ selecting our operating system, hardware architecture, distribution, and version.\
    \ In our case: Linux, x86_64, Ubuntu, 20.04. After that, we are presented with\
    \ three options: deb (local), deb (network), and runfile (local). The easiest\
    \ is to use a local `.deb` file and, when selecting this option, we are presented\
    \ with the following commands:\n"
