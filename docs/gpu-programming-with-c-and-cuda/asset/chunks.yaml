- fmt: "\nWe did not use advanced optimization techniques we saw in `Chapter 7`, and\
    \ we were still able to achieve a 25 to 31% improvement on execution time. This\
    \ is a remarkable achievement! Of course, we have simplified our code to make\
    \ it easier to understand how to use this powerful feature, but nevertheless,\
    \ it can be adapted to real-world situations. By using `ncu-ui` we were able to\
    \ visualize how the overlap happened, making it possible to gain a concrete understanding\
    \ of why this works.\n\nHowever, this is not the only way to overlap multiple\
    \ executions, and we have one more ride to take. So let us now see how to use\
    \ more than one GPU at the same time on the same program!\n\n## Running multiple\
    \ GPUs together\n\nAs we mentioned in the chapter introduction, having multiple\
    \ GPUs on the same machine is not a very common setup, due to the great cost.\
    \ Nevertheless, it is still a form of overlapping computation that we can use\
    \ to our advantage. We will look in this section at an adaptation of the previous\
    \ vector matrix multiplication program, in which the problem is divided into two\
    \ parts and each part is submitted to a different GPU.\n\nWe will not be using\
    \ streams in this program, so as not to confuse the topics. Nor will we carry\
    \ out any performance measurements, because the system on which the executions\
    \ are run is based on a PCIe 2.0 bus which is really slow, impacting significantly\
    \ on the final time results.\n\nThe key concept to multi-GPU programming is the\
    \ use of the `cudaSetDevice(int d)` function which defines the GPU device that\
    \ will be addressed until it is called again with a different device identifier.\n\
    \nThe kernel to perform vector matrix multiplication on multiple GPUs is the same\
    \ one that we had in our CUDA Streams program, so let us follow the main program\
    \ to understand the changes.\n\nAfter we declare and initialize the vector and\
    \ matrix on the host machine comes the first interesting part.\n\n```cpp\nfloat\
    \ *d_vec[2], *d_mat[2], *d_res[2];\nfor (int device = 0; device < 2; device++)\
    \ {\n  cudaSetDevice(device);\n  cudaMalloc(&d_vec[device], cols * sizeof(float));\n\
    \  cudaMalloc(&d_mat[device], chunk_size * cols * sizeof(float));\n  cudaMalloc(&d_res[device],\
    \ chunk_size * sizeof(float));\n  cudaMemcpy(d_vec[device], h_vec, cols * sizeof(float),\
    \ cudaMemcpyHostToDevice);\n}\n```\n\nHere we have declared three arrays of pointers\
    \ to handle the data that will be used on each device, and then our `for` loop\
    \ allows us to perform the memory allocation and memory copy for each device.\
    \ Here we are using `cudaMemcpy`, which is a synchronous function, but even if\
    \ were using `cudaMemcpyAsync` with CUDA Streams, we have the restriction imposed\
    \ by the PCI bus, so there is a limit to how much we can transfer at the same\
    \ time even if the targets are different devices.\n\nAll our code will have `for`\
    \ loops to allow for the changing and addressing of the two devices that are available.\
    \ Our next code block copies half of the matrix to each GPU.\n\n```cpp\nfor (int\
    \ device = 0; device < 2; device++) {\n  cudaSetDevice(device);\n  cudaMemcpy(d_mat[device],\
    \ h_mat + device * chunk_size * cols, chunk_size * cols * sizeof(float), cudaMemcpyHostToDevice);\n\
    }\n```\n\nAgain, we set the device accordingly and then transfer the data. Now\
    \ it is time to execute our kernel, as follows:\n\n```cpp\nint blocks = (chunk_size\
    \ + BLOCK_SIZE - 1) / BLOCK_SIZE;\nfor (int device = 0; device < 2; device++)\
    \ {\n  cudaSetDevice(device);\n  vectorMatrixMulKernel<<<blocks, BLOCK_SIZE>>>(d_vec[device],\
    \ d_mat[device], d_res[device], chunk_size, cols);\n}\n```\n\nWe first define\
    \ the size of our grid and reuse it for both GPUs. Besides setting the device\
    \ that should be used, we also use the index of our `for` loop to address the\
    \ memory we allocated on each GPU.\n\n```cpp\nfor (int device = 0; device < 2;\
    \ device++) {\n  cudaSetDevice(device);\n  cudaMemcpy(h_res_gpu + device * chunk_size,\
    \ d_res[device], chunk_size * sizeof(float), cudaMemcpyDeviceToHost);\n  cudaFree(d_vec[device]);\n\
    \  cudaFree(d_mat[device]);\n  cudaFree(d_res[device]);\n}\n```\n\nFinally, we\
    \ copy the results from both devices to the correct position in the results array.\
    \ As we can see, it is not much more difficult to use multiple GPUs than it is\
    \ to use streams on a single GPU. The real concern is that, to work on the same\
    \ problem together, both devices will be competing for PCI bus availability, which\
    \ can drastically penalize performance. A good idea is to use this resource in\
    \ scenarios where we can have datasets loaded at the beginning and then perform\
    \ different computations on different GPUs throughout the application lifecycle.\n\
    \n## Summary\n\nIn this chapter we learnt how to use a new tool in our IDE to\
    \ allow us to debug our code in a visual way. This is a very handy tool to be\
    \ proficient in, for many will be the times when we must find the proverbial needle\
    \ on the haystack. After that we returned to a topic first introduced in `Chapter\
    \ 5`, but now we were able to explore many aspects of the use of CUDA streams\
    \ and also the impact of data transfer size on performance. We learned about the\
    \ relations between chunk size, transfer size and the number of data partitions.\n"
  raw: "We did not use advanced optimization techniques we saw in *Chapter 7*, and\
    \ we were still able to achieve a 25 to 31% improvement on execution time. This\
    \ is a remarkable achievement! Of course, we have simplified our code to make\
    \ it easier to understand how to use this powerful feature, but nevertheless,\
    \ it can be adapted to real-world situations. By using `ncu-ui` we were able to\
    \ visualize how the overlap happened, making it possible to gain a concrete understanding\
    \ of why this works.\n\nHowever, this is not the only way to overlap multiple\
    \ executions, and we have one more ride to take. So let us now see how to use\
    \ more than one GPU at the same time on the same program!\n\n## Running multiple\
    \ GPUs together\n\nAs we mentioned in the chapter introduction, having multiple\
    \ GPUs on the same machine is not a very common setup, due to the great cost.\
    \ Nevertheless, it is still a form of overlapping computation that we can use\
    \ to our advantage. We will look in this section at an adaptation of the previous\
    \ vector matrix multiplication program, in which the problem is divided into two\
    \ parts and each part is submitted to a different GPU.\n\nWe will not be using\
    \ streams in this program, so as not to confuse the topics. Nor will we carry\
    \ out any performance measurements, because the system on which the executions\
    \ are run is based on a PCIe 2.0 bus which is really slow, impacting significantly\
    \ on the final time results.\n\nThe key concept to multi-GPU programming is the\
    \ use of the `cudaSetDevice(int d)` function which defines the GPU device that\
    \ will be addressed until it is called again with a different device identifier.\n\
    \nThe kernel to perform vector matrix multiplication on multiple GPUs is the same\
    \ one that we had in our CUDA Streams program, so let us follow the main program\
    \ to understand the changes.\n\nAfter we declare and initialize the vector and\
    \ matrix on the host machine comes the first interesting part.\n\n```\nfloat *d_vec[2],\
    \ *d_mat[2], *d_res[2];\nfor (int device = 0; device < 2; device++) {\n  cudaSetDevice(device);\n\
    \  cudaMalloc(&d_vec[device], cols * sizeof(float));\n  cudaMalloc(&d_mat[device],\
    \ chunk_size * cols * sizeof(float));\n  cudaMalloc(&d_res[device], chunk_size\
    \ * sizeof(float));\n  cudaMemcpy(d_vec[device], h_vec, cols * sizeof(float),\
    \ cudaMemcpyHostToDevice);\n}\n```\n\nHere we have declared three arrays of pointers\
    \ to handle the data that will be used on each device, and then our `for` loop\
    \ allows us to perform the memory allocation and memory copy for each device.\
    \ Here we are using `cudaMemcpy` , which is a synchronous function, but even if\
    \ were using `cudaMemcpyAsync` with CUDA Streams, we have the restriction imposed\
    \ by the PCI bus, so there is a limit to how much we can transfer at the same\
    \ time even if the targets are different devices.\n\nAll our code will have `for`\
    \ loops to allow for the changing and addressing of the two devices that are available.\
    \ Our next code block copies half of the matrix to each GPU.\n\n```\nfor (int\
    \ device = 0; device < 2; device++) {\n  cudaSetDevice(device);\n  cudaMemcpy(d_mat[device],\
    \ h_mat + device * chunk_size * cols, chunk_size * cols * sizeof(float), cudaMemcpyHostToDevice);\n\
    }\n```\n\nAgain, we set the device accordingly and then transfer the data. Now\
    \ it is time to execute our kernel, as follows:\n\n```\nint blocks = (chunk_size\
    \ + BLOCK_SIZE - 1) / BLOCK_SIZE;\nfor (int device = 0; device < 2; device++)\
    \ {\n  cudaSetDevice(device);\n  vectorMatrixMulKernel<<<blocks, BLOCK_SIZE>>>(d_vec[device],\
    \ d_mat[device], d_res[device], chunk_size, cols);\n}\n```\n\nWe first define\
    \ the size of our grid and reuse it for both GPUs. Besides setting the device\
    \ that should be used, we also use the index of our `for` loop to address the\
    \ memory we allocated on each GPU.\n\n```\nfor (int device = 0; device < 2; device++)\
    \ {\n  cudaSetDevice(device);\n  cudaMemcpy(h_res_gpu + device * chunk_size, d_res[device],\
    \ chunk_size * sizeof(float), cudaMemcpyDeviceToHost);\n  cudaFree(d_vec[device]);\n\
    \  cudaFree(d_mat[device]);\n  cudaFree(d_res[device]);\n}\n```\n\nFinally, we\
    \ copy the results from both devices to the correct position in the results array.\
    \ As we can see, it is not much more difficult to use multiple GPUs than it is\
    \ to use streams on a single GPU. The real concern is that, to work on the same\
    \ problem together, both devices will be competing for PCI bus availability, which\
    \ can drastically penalize performance. A good idea is to use this resource in\
    \ scenarios where we can have datasets loaded at the beginning and then perform\
    \ different computations on different GPUs throughout the application lifecycle.\n\
    \n## Summary\n\nIn this chapter we learnt how to use a new tool in our IDE to\
    \ allow us to debug our code in a visual way. This is a very handy tool to be\
    \ proficient in, for many will be the times when we must find the proverbial needle\
    \ on the haystack. After that we returned to a topic first introduced in *Chapter\
    \ 5*, but now we were able to explore many aspects of the use of CUDA streams\
    \ and also the impact of data transfer size on performance. We learned about the\
    \ relations between chunk size, transfer size and the number of data partitions.\n\
    \nBy using our profiler from *Chapter 7* we were able to visualize the overlapping\
    \ of memory transfers and computations. This not only illustrates that the new\
    \ technique really works, but also enables us to leverage one more use of NVidia\
    \ Nsight Compute which we learnt about previously.\n\nWe concluded the chapter\
    \ by talking about the use of multiple GPUs, even though this is a more unusual\
    \ setup.\n\nIn the next chapter we will learn how to expose our code to the Python\
    \ programming language so that we can pack our GPU code into libraries that will\
    \ allow more users to benefit from it.\n\n# Chapter 9: Exposing Your Code to Python\n\
    \n## Join our community on Discord\n\n[https://packt.link/deep-engineering-cpp](https://packt.link/deep-engineering-cpp)\n\
    \n![](media/file94.png)\n\nEvery library developer must choose how to make their\
    \ code available for the users, but when using C++, one option is simply to let\
    \ users compile against the binary library. However, many users who need GPU acceleration\
    \ have some piece of code that handles data in Python. If you are one of those\
    \ users, this chapter is for you!\n\nFirst you will learn about the alternative\
    \ ways of exposing your code to Python, and then concrete examples will show you\
    \ how to call the GPU code.\n\nThe chapter wraps up with a section on the performance\
    \ considerations for each of the alternatives.\n\nIn this chapter we’re going\
    \ to cover the following main topics:\n\n*   Using Ctypes\n\n*   Wrapping with\
    \ your own code\n\n*   Performance considerations\n\n## Technical requirements\n\
    \nWe will use the environment configured in *Chapter 3* with VS Code and our development\
    \ container. If you have chosen to install the CUDA Toolkit on your machine, you\
    \ can simply run the build commands on a terminal. We will also learn how to use\
    \ VS Code to debug GPU code. The code is provided on the GitHub repository.\n\n\
    ## Integrating with Python\n\nUp until now we have been working with C++ to develop\
    \ our programs and CUDA kernels, but it can be very useful to leverage all the\
    \ functionality that is already available in Python and make everything work together.\
    \ However, bridging the gap between C++ and Python can feel like introducing two\
    \ people from completely different social circles — they speak different languages,\
    \ have different customs, but when they get along, the results can be spectacular.\
    \ Integrating a GPU-accelerated C++ library with Python can unlock performance\
    \ benefits while keeping the ease of use and flexibility that Python developers\
    \ enjoy. Let's start by exploring why this integration is valuable, the approaches\
    \ available for making it happen, its potential pitfalls, and how memory management\
    \ plays a crucial role in the process. "
