  trans: "\n我们已经知道 C++ 释放了对硬件的原始力量和控制，使其成为性能密集型任务以及处理 GPU 的完美选择。然而，Python 出现在许多现代科学计算项目中，机器学习也是如此。通过让我们的\
    \ GPU 加速 C++ 库可以通过 Python 调用，我们为更广泛的群体提供了高速计算能力，包括数据科学家、工程师和研究人员，他们可能不擅长 C++，但仍然需要高性能解决方案。\n\
    \n将我们的库暴露给 Python 的巨大优势是易用性。如上所示，Python 的生态系统包含了大量用于数据分析、可视化和机器学习的库。通过将我们的 C++\
    \ 代码与 Python 集成，用户可以从 Python 脚本调用高性能 GPU 计算，从而在编写算法、可视化结果和进行进一步分析之间实现更动态的工作流。此外，这种集成使得在\
    \ Python 中开发原型变得更加容易，同时将计算密集型操作卸载给 C++。\n\n我们将探索两种暴露代码的常用方法。第一种替代方案 `ctypes` 是\
    \ Python 的内置模块，允许直接从共享库（`.so` 或 `.dll` 文件）调用 C 函数。这种方法相对简单直接，因为它是一种纯 Python 的方法。然而，它需要仔细注意函数签名和内存管理，特别是在处理指针时。\n\
    \n第二种更复杂的方法涉及使用 Python C API 手动编写封装器（又称 C 程序）。这种方法对 Python 解释器如何与 C++ 函数交互提供了更精细的控制，允许在函数调用和内存管理中实现更\
    \ Python 化（Pythonic）的行为。虽然它需要编写额外的 C++ 代码来处理 Python 对象，但它提供了定义自定义类型、高效管理内存分配以及更优雅处理\
    \ Python 异常的灵活性。\n\n集成两种编程语言的一个主要挑战是正确管理内存。Python 采用带有垃圾回收的自动内存管理，而 C++ 需要显式的内存处理。如果管理不当，这种差异可能会导致内存泄漏或段错误。然而，我们在这里处理的是在\
    \ Python 侧分配且在 C 和 CUDA 侧操作的内存，这要安全得多。\n\n既然我们提到了心爱的 CUDA，处理 GPU 内存时会出现另一个挑战。正如我们所知，GPU\
    \ 内存分配的工作与 CPU 内存不同，不内存管理会降低性能。虽然 Python 不理解 GPU 内存，但我们理解（幸运的是），我们可以确保缓冲区在不再需要时正确分配和释放。我们将利用\
    \ GPU 内存管理函数来确保一切都被妥善处理。\n\n![图 9.1: Python 不直接处理 GPU 内存](img/file95.png)\n\n\
    图 9.1：Python 不直接处理 GPU 内存\n\n正如 `图 9.1` 所示，Python 不直接与 GPU 内存交互，而是依靠我们的库代码来正确执行任何内存处理。\n\
    \n另一个常见问题是处理数据类型，因为尽管看起来可能很奇怪（开玩笑的！），Python 是我们说的动态类型编程语言。这意味着变量没有声明类型，但它们包含的值是有类型的。由于这一特性，NumPy\
    \ 数组等 Python 对象需要被转换为 C++ 函数可以理解的格式。这需要对数据类型和内存布局进行仔细处理。如果处理不当，使用 C++ 带来的性能提升可能会被低效的数据拷贝所抵消。一个设计良好的封装器应该是在可能的情况下利用\
    \ NumPy 数组接口或内存映射缓冲区等技术实现零拷贝内存共享。\n\n考虑到这些因素，我们将在下一节中看到加载与 GPU 交互的动态链接库的第一种方法，并在\
    \ Python 程序中使用库中声明的函数。\n\n## 创建 C++ 库\n\n我们开始这一章时讨论的是将 C++ 库与 Python 集成，但到为止我们只创建了使用\
    \ GPU 的 C++ 程序——而且所有的都是可执行程序，而不是库。所以让我们看看如何将代码转换为库！我们将使用一个非常简单的向量加法内核示例，它接收两个输入数组、一个输出数组以及它们的大小，以执行输入数组元素的加并将结果存储在输出数组中。注意对大小传递的是单个值，因为数组的大小必须相同。\n\
    \n简单来说，C++ 库是预编译代码的集合，可以链接到多个应用程序，从而节省时间并利用代码复用。对于我们与 Python 集成的目的，我们需要创建一个共享库（动态加载），CMake\
    \ 提供了我们实现该目标所需的一切。\n\n> **静态库与共享库**\n\n> 尽管库是预编译代码的集合，但访问其功能有不同的方法。使用静态库时代码会被复制到最终程序中，这意味着如果我们使用同一个静态库编译了十个程序，它们在最终文件中都将有一份独立的代码副本。相反，当使用共享库时，我们的程序不包含完整的库代码。相反，它依赖运行时系统从库中动态链接必要的函数。\n\
    \n库的一个主要优势是能够实现模块化项目，其中应用程序的不同部分在不同的、功能不同的层中被处理。我们称之为 `关注点分离`（separation of concerns），这在\
    \ GPU 项目中是基础性的，因为这意味着我们可以所有与 GPU 相关的代码隔离在单独的库中，让不同的团队在业务应用层和内部应用层工作。\n\n为了创建我们的库，我们的\
    \ `CMakeLists.txt` 文件将发生一些变化，包含以下指令：\n\n```\nadd_library(vector_add SHARED src/vector_add.cu)\
    \ set_target_properties(vector_add PROPERTIES CUDA_SEPARABLE_COMPILATION ON) target_include_directories(vector_add\
    \ PUBLIC include)\n```\n\n我们不再使用一直使用的 `add_executable`，而是使用 `add_library`，添加 `SHARED`\
    \ 指定要创建的库类型。\n\n然后，通过使用 `set_target_properties`，确保 NVIDIA 编译器 `nvcc` 知道这是一个库，通过指定\
    \ `CUDA_SEPARABLE_COMPILATION ON`。\n\n最后我们必须添加包含头文件的目录（带有函数定义，以便其他可执行文件知道库中有哪些内容），以便\
    \ CMake 可以进行跟踪。\n\n我们库的代码与我们一直工作的代码略有不同，但这是一个很小的变化。首先，内核没有变化：它使用了我们之前的相同结构：\n\n\
    ```\n__global__ void vectorAddKernel(int *a, int *b, int *c, int N){\n   int idx\
    \ = threadIdx.x + blockIdx.x * blockDim.x;\n   if (idx < N) { \n      c[idx] =\
    \ a[idx] * b[idx];//为了调试故意留的 bug\n   }\n}\n```\n\n但我们需要为外部世界提供一种调用此内核的方法。之前我们是在自己的程序中使用内核，但现在我们编写内核是为了为他人提供\
    \ GPU 加速的功能。我们可以做的是将主函数转换为一个代理函数，如下所示：\n\n"
- fmt: "\n```\nvoid vectorAdd(int *a, int *b, int *c, int N) {\n   int *d_a, *d_b,\
    \ *d_c;\n   cudaMalloc((void**)&d_a, N * sizeof(int));\n   cudaMalloc((void**)&d_b,\
    \ N * sizeof(int));\n   cudaMalloc((void**)&d_c, N * sizeof(int));\n   cudaMempy(d_a,\
    \ a, N * sizeof(int), cudaMemcpyHostToDevice);\n   cudaMemcpy(d_b, b, N * sizeof(int),\
    \ cudaMemcpyHostToDevice);\n   int threadsPerBlock = 256;\n   int blocksPerGrid\
    \ = (N + threadsPerBlock - 1) / threadsPerBlock;\n   vectorAddKernel<<<blocksPerGrid,\
    \ threadsPerBlock>>>(d_a, d_b, d_c, N);\n   cudaMemcpy(c, d_c, N * sizeof(int),\
    \ cudaMemcpyDeviceToHost);\n   cudaFree(d_a);\n   cudaFree(d_b);\n   cudaFree(d_c);\n\
    }\n```\n\nTo ensure that we export our function we need to include our header\
    \ file, which is accomplished with `#include \"../include/vector_add.h\"` at the\
    \ beginning of our C++ file. It is worth noting that we are not allocating any\
    \ host memory as we did before; here we receive the host memory – even the array\
    \ that receives the results – from the caller of the function. If we need to allocate\
    \ memory inside our library, we must provide the user with memory management functions\
    \ that allow for it to be deallocated.\n\nOne last resource that we need to provide\
    \ is something that we haven't been using much: a header file describing the functions\
    \ supported by our library. This file is under the include folder of our project\
    \ and is as follows:\n\n```\n#ifndef VEC_ADD_H\n#define VEC_ADD_H\nextern \"C\"\
    \ {\n   void vectorAdd(int *a, int *b, int *c, int N);\n}\n#endif\n```\n\nNow,\
    \ with our library compiled we will see the file `libvector_add.so` in the build\
    \ folder.\n\nIn the next section let's see how to use this new library together\
    \ with a first Python program by declaring the necessary information about our\
    \ function using `ctypes`.\n\n## Using Ctypes\n\nHaving a library is useless if\
    \ we have no way of using it in our program. Luckily there is a Python module\
    \ called `ctypes` that allows interaction with shared libraries written in C or\
    \ C++. It enables our Python programs to call library functions as if they were\
    \ native Python functions. This mechanism provides an easy way to leverage high-performance\
    \ C++ code while still benefiting from Python's flexibility and ease of use.\n\
    \nUsing `ctypes` we can load shared libraries, declare function signatures, and\
    \ invoke native functions easily. A great advantage is that it does not require\
    \ any modification to the original C++ source code, making it an appealing option\
    \ for lightweight integration.\n\nAnother interesting thing is that it is purely\
    \ Python based, meaning that we can write code on the Python side to define what\
    \ we want to use from the library without the need to compile anything. However,\
    \ `ctypes` has its limitations: for example it requires manual mapping of function\
    \ signatures and necessitates handling raw memory pointers.\n\nSince Python is\
    \ dynamically typed and C++ is statically typed, every function call must explicitly\
    \ specify argument and return types, and this can cause some headaches. However,\
    \ `ctypes` lessens the pain by providing data types like `ctypes.c_int` and `ctypes.c_double`,\
    \ which correspond to their C counterparts.\n\nA code example will help clarify\
    \ what we are dealing with:\n\n```python\nimport ctypes\nlib = ctypes.CDLL(\"\
    ../../build/libvector_add.so\")\nlib.vectorAdd.argtypes = [\n   ctypes.POINTER(ctypes.c_int),\n\
    \   ctypes.POINTER(ctypes.c_int),\n   ctypes.POINTER(ctypes.c_int),\n   ctypes.c_int\n\
    ]\n```\n\nHere we pass in the path to the shared library we are going to use,\
    \ and the declaration of the data types we will be dealing with in our function.\
    \ Although it may seem a little awkward to Python programmers who don’t usually\
    \ need to deal with data type declarations it is straightforward enough to read.\n\
    \nAs for the function call, assuming that we’ve already imported `numpy` at the\
    \ beginning of our Python program, we will have something like this:\n\n```python\n\
    N = 1000\na = np.array(range(N), dtype=np.int32)\nb = np.array(range(N, 2*N),\
    \ dtype=np.int32)\nc = np.zeros(N, dtype=np.int32)\nlib.vectorAdd(\n   a.ctypes.data_as(ctypes.POINTER(ctypes.c_int)),\n\
    \   b.ctypes.data_as(ctypes.POINTER(ctypes.c_int)),\n   c.ctypes.data_as(ctypes.POINTER(ctypes.c_int)),\n\
    \   N\n)\n```\n\nHere we use `numpy` to create the input arrays with random integers\
    \ and the output array filled with zeros. Then, when performing the function call,\
    \ we need to access the internal pointer for the data to pass into our library.\
    \ And it is simple as that! Although a little verbose, it is straightforward to\
    \ follow what is going on.\n\nWe are specifying the data types for both declaration\
    \ and function call, but the dynamic type resolution of Python has an impact on\
    \ the performance of `ctypes` calls because it means that function calls are resolved\
    \ at runtime. This introduces a small overhead, as Python determines the correct\
    \ function signature and convert arguments dynamically. While the overhead may\
    \ be negligible for occasional function calls, performance bottlenecks can appear\
    \ in applications that require thousands or millions of calls per second.\n\n\
    It is clear that with `ctypes` we have a fast way to access our library from Python,\
    \ especially because when dealing with GPU our code is (most of the time) all\
    \ about kernels, and creating proxy functions to expose them makes a lot of sense.\n\
    \nThere are other ways to access our code, however, and in the next section we\
    \ will dive into the world of the Python C API to create a wrapper that acts as\
    \ a Python extension.\n\n## Wrapping with your own code\n\nA Python extension\
    \ is a module written in C or C++ that can be loaded into Python like a regular\
    \ module. It provides a bridge between Python's friendly scripting environment\
    \ and lower-level languages. We can create an extension for anything that would\
    \ require the use of a lower-level language, including when we want to interface\
    \ with an existing C++ library and offer access to GPU functionality while still\
    \ benefiting from Python's ease of use.\n\nCreating an extension requires the\
    \ Python C API, which lets us define new types, expose C++ functions to Python,\
    \ manage reference counts, and handle Python objects. The general workflow consists\
    \ of defining wrapper functions that translate between Python objects and native\
    \ C++ structures, compiling them into a shared library, and then loading them\
    \ as Python modules. However, the compilation process is managed differently,\
    \ and the shared object is created in such a way that the Python interpreter knows\
    \ how to load it to import into our Python program.\n\nLet's break down the steps\
    \ involved in creating our extension.\n\nAn extension needs to include the definition\
    \ of the functions that will be available to Python, an array that will reference\
    \ all the functions, a module definition and an initialization function that Python\
    \ calls when it loads the module.\n\nNow, we will skip the function definition\
    \ for a moment and go through this infrastructure first.\n\n```cpp\nstatic PyMethodDef\
    \ VectorAddMethods[] = {\n   {\"vectorAdd\", pyVectorAdd, METH_VARARGS, \"Perform\
    \ vector addition using CUDA\"},\n   {NULL, NULL, 0, NULL}\n};\nstatic struct\
    \ PyModuleDef vectoraddmodule = {\n   PyModuleDef_HEAD_INIT,\n   \"vector_add_wrapper\"\
    ,\n   NULL,\n   -1,\n   VectorAddMethods\n};\n```\n\nExamining this closely, we\
    \ first have the array of functions, with a single entry and the module definition\
    \ that uses that array. What `PyMethodDef` expects is the name that will be exposed,\
    \ the function implementation, a flag to define the arguments expected by the\
    \ C function, and a description.\n\nOur function will be called `vectorAdd` and\
    \ will be performed by the `pyVectorAdd` function (that we will see a little later).\
    \ We use `METH_VARARGS` to indicate that we will have a tuple of positional arguments,\
    \ and finally we have a description of our function.\n\nAfter that, we have a\
    \ flag value set to `{NULL, NULL, 0, NULL}`.\n\nNow we can define our module and\
    \ provide the `VectorAddMethods` array.\n"
