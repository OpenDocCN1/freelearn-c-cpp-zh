- fmt: '

    In this chapter, we have covered all the internal details needed to write programs
    in a more considered way. It is very important to pay attention to all these details,
    actually much more so than when writing single-threaded programs for our CPUs.
    When dealing with `GPUs`, we have to consider things like having only `48KB` of
    space to share between threads, and how to use these resources wisely so that
    we can speed up our code a little bit more. We have seen that by using different
    streams, we can execute many things at once and even copy data to and from the
    device at the same time, but for that, again, we have to be mindful of many details.
    But rest assured that although it seems complicated now, it will become easier.
    Shortly we will write programs using and exploring all these resources, which
    will help make them stick in our minds.


    Specifically, in the next chapter we will cover practical aspects of the concepts
    that we''ve got to know here. We will discuss what makes a parallel algorithm,
    well, parallel. We will implement different versions of applications to solve
    some common problems in parallel programming which can greatly benefit from the
    use of `GPUs`. In each version we will use the different approaches discussed
    here and measure the effects on performance. We will perform a matrix multiplication
    which, just like vector addition, is an example of what we call embarrassing parallelism
    due to the way it is calculated, but we will also tackle numerical integration,
    which has relevance to a variety of domains.


    # Chapter 6: Parallel Algorithms with CUDA


    ## Join our community on Discord


    [https://packt.link/deep-engineering-cpp](https://packt.link/deep-engineering-cpp)


    ![A qr code with a square and a symbol AI-generated content may be incorrect.](media/file14.png)


    We can now better discuss and understand parallel programs and how to express
    them using `CUDA`, and how the hardware details and programming concepts affect
    and direct our programs. The next step on our learning path is to improve our
    comprehension of what makes a parallel algorithm parallel and what the limits
    are to the degree of parallelization that can be achieved.


    First, we will discuss the principles that guide parallel algorithms, in more
    detail than we did in `Chapter 1` since we can now refer to the programs we wrote
    there. After that we will look at some common algorithms that illustrate different
    levels of parallelization, allowing us to see the challenges ahead. The chapter
    wraps up with a discussion of different implementations, to help you apply the
    knowledge gained to real situations.


    Over the course of the chapter we will cover the following main topics:


    *   Design principles of parallel algorithms

    *   Parallel matrix operations: multiplication, addition

    *   Parallel integral calculation, reduction, and sort algorithms


    ## Technical requirements


    We will use the environment configured in `Chapter 3` with `VS Code` and our development
    container. If you have chosen to install the `CUDA Toolkit` on your machine, you
    can simply run the build commands on a terminal. The code is provided on the GitHub
    repository that can be accessed here: [https://github.com/PacktPublishing/GPU-Programming-with-C-and-CUDA](https://github.com/PacktPublishing/GPU-Programming-with-C-and-CUDA).


    ## Designing parallel algorithms


    In `Chapter 1` we discussed what parallelism is and used a cooking analogy to
    present some ideas for executing multiple steps simultaneously, and to show how
    some steps would not benefit from changing the executor. We are now going to use
    a similar analogy as we explore in more detail the design of parallel algorithms.


    A good starting point is the idea that a parallel algorithm is not simply a sped-up
    version of a sequential one. It involves a fundamental restructuring, such that
    tasks can occur simultaneously to take advantage of multiple computing units.


    In `Chapter 1` we imagined a group of friends preparing a meal together – a small
    setup giving us a glimpse of parallelism. They could cut and chop in parallel,
    but there was not massive parallelism. However, let''s suppose that they had tremendous
    success in their endeavor and must now prepare not a few but some thousands of
    meals. Every step must now be carefully thought about to make sure that time and
    effort are not wasted. This is more like the scenario we have when using `GPUs`,
    where there are thousands of processors and we want to make sure they are used
    in the best way possible, and not left to sit idle.


    But if we stop and think for a moment, a restaurant setting is more like a multicore
    CPU: it can handle any kind of meal with a few chefs and cooks. A `GPU` can be
    thought of as being narrowed down in terms of options on the menu, but offers
    massive throughput, rather like a catering service at a music festival. Remember
    that `CUDA cores` work in groups called `warps` that are step-controlled by a
    `Streaming Multiprocessor`, or `SM` for short. It is hard to imagine having one
    ‘controller cook’ issuing commands to other cooks like ‘chop now’, but we could
    think of an `SM` as the cook and `CUDA cores` as a tool that can dice vegetables
    all at once – like those seen on those old TV commercials.


    However, to have a minimally interesting meal we will need more than a single
    vegetable diced in parallel: we should have multiple ingredients being prepared
    in parallel to become part of the final meal. For that we will need many cooks,
    using their groups of tools to work on different parts of the ingredients list
    until they reach a point where they need to synchronize with each other.


    > **Hardware specialization impact**


    > Here we have an interesting characteristic to consider. Consumer-level `GPUs`
    usually present three asynchronous engines, which means they can perform two data
    movements in different orientations – from `Host` to `Device` and from `Device`
    to `Host` – together with one kernel execution. On the other hand, high-end `GPUs`
    have more engines, enabling them to execute more kernels simultaneously. This
    is an important consideration because it may speed up algorithms in another dimension.
    Consider an algorithm that has two steps, the first performing a matrix multiplication
    to yield an intermediate result, the second performing a matrix addition of the
    intermediate result and another input matrix. If we used two result buffers, we
    could execute both kernel calls at almost the same time, if enough `Streaming
    Multiprocessors` were available.


    Different from the relation of `CUDA cores` and `SMs`, the allocation of threads
    to `blocks` is ‘thought ahead’ to optimize occupation. In our analogy we can think
    of the number of cooks that we are allocating to a given workstation. We can even
    think of the access patterns to ingredients. Each time a cook needs more ingredients
    they request them from the shelves, but only in fixed-size boxes. This suggests
    that thinking about how we access our data can affect our achieved performance
    greatly.


    ### Understanding how to spot and exploit parallelism


    The idea of exploitable parallelism helps define which tasks can be executed independently.
    High parallelism occurs when many parts of an algorithm can proceed independently
    without a strict sequence, just as chopping different vegetables can happen simultaneously
    and in any order. In a parallel algorithm, high parallelism allows multiple threads
    to work independently, boosting speed and efficiency.

