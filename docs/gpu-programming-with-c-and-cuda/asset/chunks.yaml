    需要注意的是，当使用这些优秀的非默认流时，操作是异步执行的，这意味着在我们尝试使用任何上一个操作的一部分之前，必须检查该上一个操作是否已经完成。有特定的资源来控制这一点，包括所谓的`events`（事件）。尽管我们在`第
    4 章`中测量执行时间时曾浅浅地接触过 CUDA 事件，但我们将在下一节中学习到更多内容。目前，只需知道可以使用它们来保证异步流执行时的逻辑健壮性就足够了。


    同步是使用 CUDA 流的一个至关部分，因为它确保了相互依赖的任务按照正确的顺序执行。在 CUDA 中，同步是指控制特定流相对于其他流何时应该开始执行任务，或者
    CPU 何时应该等待流完成。如果没有适当的同步，你可能会遇到竞态条件，即数据在操作完全完成之前就被读取或修改，从而导致结果错误。


    同步流的主要函数是 `cudaStreamSynchronize()`。该函数会阻塞主机（CPU），直到指定流中的所有任务都完成。当你需要确保流在继续执行程序的其他部分之前已完成了其所有任务时，这个函数非常有用。例如，在其中一个流中启动内核并在另一个流中执行内存传输后，你可能希望同步它们，以确保在尝试进一步计算之前数据是可用的。


    另一个常用的函数是 `cudaDeviceSynchronize()`，它强制主机等待 GPU 上所有流中之前启动的所有操作完成。与 `cudaStreamSynchronize()`
    相比，`cudaDeviceSynchronize()` 是更全局的同步点，但它通常被认为效率较低，因为它停止了整个设备而不是特定的流。因此，应该谨慎使用，并仅在必要时使用。


    在下一节中，我们将继续讨论事件以及它们如何帮助我们 CUDA 编程和同步。


    跟随事件


    CUDA 事件的两个主要目的是测量性能和辅助同步。它们通过提供跟踪某些操作相关执行时间的机制来实现这一点。具体到同步，我们可以等待一个事件完成，通过此，运行在流中的任务就有可能等待位于不同流中的另一个任务的完成。


    事件使用 `cudaEventCreate()` 函数创建，该函数为事件分配必要的资源。


    在创建事件时，我们可以指定特定的标志位来修改事件的行为。例如，`cudaEventBlockingSync` 标志确保事件将阻塞等待它的 CPU 线程，直到事件完成。相反，`cudaEventDisableTiming`
    标志允许事件仅用于同步而不进行计时测量。


    一旦事件不再需要，释放与其相关的资源是至关重要的。这是通过 `cudaEventDestroy` 函数实现的，它接受事件作为参数。


    通过 CUDA 事件，我们拥有了一种测量 GPU 上各种操作之间经过时间的强大机制。计时功能主要通过 `cudaEventRecord` 和 `cudaEventElapsedTime`
    函数访问。当我们调用 `cudaEventRecord` 时，当前的 GPU 时间会被捕获并与指定的事件关联。这允许我们为特定操作（如内核启动或数据传输）创建时间戳，从而实现精确的性能分析。后台发生的是，运行时会在调用
    `cudaEventRecord` 时捕获正在执行的内容，并监控它以跟踪事件的完成。


    要测量两个事件之间经过的时间，我们使用 `cudaEventElapsedTime` 函数。该函数计算两个记录事件之间的毫秒级时间差，并以浮点值形式返回。


    事件计时的一个重要方面是与使用事件相关的开销。虽然事件的创建、记录和查询是轻量级操作，但它们确实会引入某种程度的开销。在性能关键代码段中进行性能测量时，我们应该这种开销。


    事件还可以用于衡量各种执行策略的性能影响。例如，通过在不同的内核配置前后放置事件，我们可以分析网格和线程块大小的变化如何影响执行时间。


    当你想要确保在继续操作之前特定操作已完成时，可以使用 `cudaEventSynchronize` 函数。该函数会阻塞调用线程，直到指定的事件被记录，保证任何依赖操作在之前的操作完成之前不会启动。这在主机代码依赖于
    GPU 计算结果时特别有用。


    请记住，当我们开始记录事件时，运行时会捕获正在运行的内容。例如，在我们`第 4 章`的向量加法示例中，我们在没有内容在执行时记录了 `startEvent`，然后我们发布了内存传输、内核执行和最后一次内存传输。之后，我们调用了另一个事件记录，但这次有很多事情正在发生，所以当我们对
    `stopEvent` 调用 `cudaEventSynchronize` 时，程序会等待与该事件相关的所有内容完成后才再次恢复执行。*这*就是事件背后的魔术：它理解与自己相关联的内容，并可以跟踪所有内容以进行同步。


    我们必须探索的最后一个速度加速器是共享内存，这是一种允许线程在本地进行通信的特殊内存。它是下一节的主题。


    使用共享内存加速


    正如本章前面提到的，在`线程`部分中，有一种特殊的片上内存（再次说明，截至本文编写时），每个块只有 48KB，且对该块中的所有线程可见。这 48KB 内存足够存储一个（比方）浮点数数组，用于存储每个线程执行的结果。这样，在执行结束时，其中一个线程（通常是线程
    0）可以遍历整个共享数组并累加所有值。


    共享内存的另一个典型用途是从全局内存预取数据并在本地进行处理。假设我们需要计算一个向量与许多不同向量的点积。我们可以将主向量加载到共享内存中，并用它处理所有的全局访问，尽管这种方法简单，但将全局内存访问减少到了原始方法的一半。根据我们需要处理的数据大小，我们可以一次性从全局内存调入两个向量并加载两个共享数组。之后，我们的线程将在本地处理数据——节省了本应执行的所有全局访问——并在计算结束时将单个值存储到指定的全局内存地址。


    分配到共享内存的数据的生命周期（通常是块大小的数组，即块中线程的数量）与块的周期相同。一旦块被释放，该共享内存也会被释放。


    到此，我们汇集了 GPU 领域的所有内部机制，以使我们能够编写出高性能得多的程序。


