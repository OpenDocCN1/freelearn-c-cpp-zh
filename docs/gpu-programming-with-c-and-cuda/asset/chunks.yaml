    让我们回到超市的例子。如果我们所有的朋友都静静地坐在车里等其中一个人去买齐所有的食材，我们就没有高效地利用资源。然而，当每个人都负责收集清单上的某一部分时，我们就能更好地利用已经有的资源。这与计算机处理器及其多个核心是一致的——它们已经存在于那里了。当然，大多数现代处理器都能够降低时钟频率以减少能耗，但这并不能消除组件闲置带来的浪费。


    ### 处理大型数据集

    在数据科学、视频处理和科学研究等领域，发现规模增长非常快的问题是非常普遍的。许多此类问题使用矩阵来表示数据；当矩阵的大小增加时，处理它们所需的时间就会受到影响。通过使用并行性，我们可以确保在任何给定的时间点尽可能地执行任务，这使得处理大量数据的时间变得可以接受。


    ### 增强性能

    当我们缩短处理数据集所需的时间时，用户会将其感知为性能的提升。然而，这还有另一个方面。即使时间没有缩短，用户也可能通过更详细的模拟感知到性能的增强——即使用更多参数的模拟（正如我们之前讨论的，这意味着使用了更多的数据）。无论何种方式，这都会带来更好的性能和响应更快的应用程序。


    ### 启用先进技术

    通过使用并行性，我们进行模拟的能力允许科学家测试比以前多得多的假设。只有当模拟看起来指向一个可行且极具前景的方向时，我们才会用具体的材料进行尝试。这极大地降低了发现成本并加速了发现过程。


    ## 不同类型并行性的快速上手指南

    到目前为止，我们一直在谈论并行性。在本节中，在我们深入探讨 GPU 之前，我们将快速讨论不同类型的并行性——这正是大家期待的！


    ### 数据并行

    在不同的数据块上执行相同操作的过程，使得数据被不同的处理器核心同时等量处理——例如，处理一张图像以对其每个像素应用某些更改——这被称为`data parallelism`。如果我们在超市买的食材之一是一大盒需要去皮的胡萝卜，我们可以自己去剥，也可以给每个朋友分发一个削皮刀，一起对相同的数据执行相同的处理过程，每个人负责一根独立的胡萝卜。


    ### 任务并行

    有时，我们有多个互不依赖的步骤，可以由不同的处理器核心执行。通常，一个较大的任务被分为若干较小的子任务，每个子任务都有非常明确的目标，它们对大任务做出贡献，但与其兄弟任务无关。如果我们重新回到那些刚从超市回来的朋友，我们可以将准备晚餐这个大任务分解为子任务，例如准备开胃菜、准备主菜和准备甜点。数据是带回家的食材；处理器将执行不同的操作。然而，为了技术上的准确，我们需要考虑相同的数据被用作并行子任务的输入，为了公平起见，假设我们今晚有两个菜单，但使用的是相同的食材。这样，我们就可以输入相同的数据并让不同的函数（烹饪方法）对其处理。


    ### 流水线并行

    我们还可以利用另一种并行安排方式。有时，某些数据处理依赖于之前处理的结果。如果我们有多个处理器核心可以使用，我们可以将每个处理步骤分配给一个核心，并创建一个流水线，在数据数据可用时利用并行性的优势。在水果加工厂，我们可以观察到这种并行性，当新的水果（比如苹果）运来加工和包装时。首先，苹果车运送大量水果并将其倒入人工水流中。水果在推过水流时被清洗；清洗后，一系列工人会对比水果进行检查以剔除坏苹果。筛选后，苹果按大小分开并移动到不同的传送带上，之后进行包装和密封，然后装箱并分发。这与视频处理的情况完全类似，其中每个视频帧等同于一小堆苹果。


    ## GPU 架构概览

    在完成了所有的烹饪之后，是时候改变一下了。让我们谈谈 GPU。首先，让我说明一下，我决定在与 CPU 比较之前先解释 GPU。我这样做是假设你已经对现代 CPU
    的（基础）架构相当熟悉。GPU 起初被认为可以加速图形处理的输出，因为现代计算机的使用几乎完全在图形环境中进行。这与过去的计算有所不同，过去使用的字符界面对图形性能的要求并不高。然而，当人们发现能够处理计算机图形所需的计算的单元单元也可以用于任何可以用矩阵计算表示的内容时，转变发生了，而这正是线性代数的核心。在下一章中，我们将专门关注
    NVIDIA GPU，但目前，我们将考虑一种通用设备。在这种情况下，GPU 拥有多个组件以便执行并行任务。需要注意的第一个重要的一点是，GPU 核心能够执行算术和逻辑操作（例如计算）。GPU
    核心不能用于程序控制；对于这一点，我们可以在`stream multiprocessor`中组织许多核心，它负责控制许多核心之间的指令执行。如`Figure
    1.1 (a)`所示，一个流多处理器有一个控制单元与`CUDA`核心协同工作，而在`Figure 1.1 (b)`中，我们可以看到单个 GPU 可以拥有许多流多处理器，这提升了它的高吞吐量：


    ![Figure 1.1 (a) a streaming multiprocessor with CUDA cores and (b) a GPU device
    with many multiprocessors](img/file1.png)


    Figure 1.1 (a) a streaming multiprocessor with CUDA cores and (b) a GPU device
    with many multiprocessors


    流多处理器与 CPU 核心之间有趣的区别在于，流多处理器为许多核心提供一个控制单元，而 CPU 核心为每个处理核心提供一个控制单元。如`Figure 1.2`所示：


    ![Figure 1.2 (a) streaming multiprocessor and (b) CPU](img/file2.png)


    Figure 1.2 (a) streaming multiprocessor and (b) CPU


    我们还依赖于具有不同级别可用空间的内存层级。如`Figure 1.3`所示，我们从一个较大的、速度较慢的层级（全局内存）开始。这通常是你在 GPU 盒上看到的数字。然后，我们有缓存级。在靠近核心的地方，我们有两种处理速度更快的特殊类型：共享内存（多个核心共享）和寄存器（每个核心特有）。我们将在书中学习如何处理这些内存；现在，我们只需要知道这些组件构成了我们的解决方案：


    ![Figure 1.3 – Memory hierarchy of a GPU](img/file3.png)


    Figure 1.3 – Memory hierarchy of a GPU


