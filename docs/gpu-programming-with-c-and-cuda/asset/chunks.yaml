  trans: "\n在 `Chapter 7` 中，我们使用了传统的矩阵乘法问题来学习可用的优化技术。现在，我们将使用一个类似的问题，但为了便于理解，选择一个稍微简单一点的。我们将使用向量-矩阵乘法——将其想象为矩阵乘法问题的第一步。由于会有多个操作同时发生，明智的做法是简化简化，以便我们跟上正在发生的一切。\n\
    \n在我们的仓库中，我们还有一个不使用流（streams）的版本，以便我们比较结果。值得注意的是，通常情况下，在我们多流程序中运行的内核（kernel）与无流版本的内核是相同的。区别在于主程序，它需要跟踪多个内存拷贝和数据块——正如我们将看到的那样。\n\
    \n事实上，内核简单得惊人，并且没有使用任何高级优化策略：\n\n```\n__global__ void vectorMatrixMulKernel(float*\
    \ d_vec, float* d_mat, float* d_res, int rows, int cols) { \n  int row = blockIdx.x\
    \ * blockDim.x + threadIdx.x; \n  if (row < rows) { \n    float sum = 0.0f; \n\
    \    for (int col = 0; col < cols; ++col) { \n      sum += d_mat[row * cols +\
    \ col] * d_vec[col]; \n    } \n    d_res[row] = sum; \n  } \n} \n```\n\n我们使用接收到的向量和矩阵来计算内积，直接访问全局内存。因此，让我们关注发生魔法的主函数。\n\
    \n我们首先声明矩阵的大小为 16380 x 16380 个元素，以确保我们有大约 1 GB 的数据（因为 16380 x 16380 x 4 字节的每个\
    \ float 等于 1,073,217,600 字节，相当于 0.9995 GB）。这对于测试目的足够了。\n\n下一步是定义块大小（chunk size）。我们使用矩阵阶数的倍数来简化流控制，因此我们选择了\
    \ 1638 的块大小。我们有 268,304,400 个元素（16380 x 16380），除以块大小后得到 163,800 个块（268,304,400\
    \ / 1,638 = 163,800）。每个块有 (1,638 x 16,380 x 4) 字节 / 1024 / 1024，约为 100 MB。分解来看：我们使用\
    \ 1,638 作为块大小乘以列数 16,380 乘以每个 float 数字的字节数，然后除以两次 1024 以以 MB 表示该值。\n\n根据我们之前的测量，100\
    \ MB 对于这台机器已经达到了峰传输速率，尽管更大的尺寸也处于峰传输速率，但我们可以观察到 100 MB 之后性能开始下降。这与 PCIe 处理将传输的数据包分解有关。然而，我们在看到所有代码后将回到这个问题。\n\
    \n```\nint main() {\n  const int rows = 16380;\n  const int cols = 16380;\n  const\
    \ int chunk_size = 1638;\n  float *h_vec = (float*)malloc(cols * sizeof(float));\n\
    \  float *h_res_cpu = (float*)malloc(cols * sizeof(float));\n  float *h_mat_pinned,\
    \ *h_res_gpu;\n  cudaMallocHost(&h_mat_pinned, rows*cols * sizeof(float));\n \
    \ cudaMallocHost(&h_res_gpu, rows * sizeof(float));\n```\n\n我们还需要注意到，为了进行异步内存传输，我们需要使用锁页内存（pinned\
    \ memory），为此我们使用 `cudaMallocHost` 而不是传统的 `malloc`。由于向量只需拷贝一次，我们可能使用传统的内存分配和同步内存传输。我们还将使用一个本地函数用随机数据初始化矩阵和向量。\n\
    \n现在，当涉及到设备上的内存分配时，我们有了第一个修改。我们不再简单地分配足够容纳矩阵和结果向量的缓冲区，而是为大小为 (chunk size * cols)\
    \ 的矩阵块分配两个缓冲区——我们将保留 1,638 行矩阵——以及两个大小为 1,638 的向量结果缓冲区，用于接收部分结果：\n\n```\n float\
    \ *d_vec, *d_mat1, *d_mat2, *d_res1, *d_res2;\n  cudaMalloc(&d_vec, cols * sizeof(float));\n\
    \  cudaMalloc(&d_mat1, chunk_size * cols * sizeof(float));\n  cudaMalloc(&d_mat2,\
    \ chunk_size * cols * sizeof(float));\n  cudaMalloc(&d_res1, chunk_size * sizeof(float));\n\
    \  cudaMalloc(&d_res2, chunk_size * sizeof(float));\n```\n\n之后我们将执行我们已经熟悉的操作：创建\
    \ CUDA 事件来测量执行时间并拷贝输入向量。这部分没有新内容，让我们移动到流的创建。\n\n```\n cudaStream_t stream1, stream2;\n\
    \  cudaStreamCreate(&stream1);\n  cudaStreamCreate(&stream2);\n```\n\n正如我们在第 5\
    \ 章看到的，默认流是同步的，所以在这里创建了两个流。现在我们达到了程序的关键部分，即将数据拆分成块。首先让我们了解它是如何开始的。\n\n```\nint\
    \ blocks = (rows + chunk_size - 1) / chunk_size;\nfor (int i = 0; i < rows; i\
    \ += chunk_size) {\n cudaMemcpyAsync(d_mat1, h_mat_pinned + i * cols, chunk_size\
    \ * cols * sizeof(float), cudaMemHostToDevice, stream1);\nvectorMatrixMulKernel<<<blocks,\
    \ chunk_size, 0, stream1>>>(d_vec, d_mat1, d_res1, chunk_size, cols);\ncudaMemcpyAsync(h_res_gpu\
    \ + i, d_res1, chunk_size * sizeof(float), cudaMemDeviceToHost, stream1);\n\n\
    cudaMemcpyAsync(d_mat2, h_mat_pinned + (i + chunk_size) * cols, chunk_size * cols\
    \ * sizeof(float), cudaMemHostToDevice, stream2);\nvectorMatrixMulKernel<<<blocks,\
    \ chunk_size, 0, stream2>>>(d_vec, d_mat2, d_res2, chunk_size, cols);\ncudaMemcpyAsync(h_res_gpu\
    \ + i + chunk_size, d_res2, chunk_size * sizeof(float), cudaMemDeviceToHost, stream2);\n\
    }\ncudaStreamSynchronize(stream1);\ncudaStreamSynchronize(stream2);\n```\n"
- fmt: '

    After the `for` loop we have two requests for stream synchronization. This is
    just for safety, to guarantee that we will only use the host buffer after we’ve
    made sure that the partial results have been computed and copied.


    One important thing regarding the partial results: we are writing to distinct
    positions of the same buffer in the host memory, and that is why we do not overwrite
    our parallel computed results. Cool, isn''t it?


    When we loop for the next iteration, remember that `i` has jumped the size of
    two chunks, allowing us to get two more chunks, and this will continue until we
    reach the end of the matrix.


    Let''s remember too that we are using a simplified version – all the numbers were
    carefully selected so that we don’t need to carry out boundary verifications here.
    However, even if we were performing those checks they would not affect the final
    performance.


    Remember that the chunk size we are using not only provides approximately 100
    MB of data but it is also a divisor for our total matrix size, and hence we know
    that when iterating two chunks at a time as we are doing, we can perform the unroll
    of the loop using two streams and that everything will match the sizes. If we
    were using a matrix derived from a real-world problem our numbers would not be
    so nice, and we would have to check whether for the last iteration there would
    be enough rows left to copy or whether we would need to adapt the last chunk to
    a smaller size.


    This is the part that really changed from our version that uses no streams. We
    will now compare some numbers for execution performance.


    We have compiled data for ten executions of each program version and calculated
    simple averages of their execution times. To calculate the size of data to use
    we calculated the number of matrix elements times four bytes per float number
    divided by 1024 two times to express the number in megabytes. We have collected
    data for two execution sets, the first for a total data size of 1020 MB (`16,380
    x 16,380 x 4 / 1024 / 1024`) when our matrix is 16,380 x 16,380, exactly as per
    our code listed here. Then we also collected data for execution of a matrix of
    size 32,760 x 32,760, which gives a total data size of 4092 MB (`32760 x 32760
    x 4 / 1024 / 1024`). *Table 8.1* shows the compiled results.


    | total data size | chunk size | data size | data partitions | average time |
    gain |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1020 | 273 | 16 | 60 | 128.427 | -7.65% |

    | 546 | 32 | 30 | 89.1392 | 25.28% | |

    | 819 | 48 | 20 | 88.0554 | 26.19% | |

    | 1638 | 100 | 10 | 87.0306 | 27.05% | |

    | 4095 | 252 | 4 | 88.8127 | 25.55% | |

    | 8190 | 508 | 2 | 92.5483 | 22.42% | |

    | 4092 | 273 | 32 | 120 | 445.549 | 11.00% |

    | 546 | 68 | 60 | 356.581 | 28.77% | |

    | 819 | 100 | 40 | 347.283 | 30.63% | |

    | 1638 | 204 | 20 | 343.555 | 31.37% | |

    | 4095 | 508 | 8 | 344.598 | 31.17% | |

    | 8190 | 1020 | 4 | 351.386 | 29.81% | |

    | 16380 | 2044 | 2 | 363.88 | 27.31% | |


    Table 8.1: Execution times for different chunk and data sizes


    It is interesting to notice that in both cases, with a data size of 100 MB for
    the transfer we achieve the greatest performance; the second case has an improvement
    of only 0.74% when using 204 MB for the transfer size. Also, notice that after
    the peak performance the execution time starts to rise again.


    ![Figure 8.15: Effect of transfer size on execution time for 1020 MB](media/file85.png)

    Figure 8.15: Effect of transfer size on execution time for 1020 MB


    ![Figure 8.16: Effect of transfer size on execution time for 4092 MB](media/file86.png)

    Figure 8.16: Effect of transfer size on execution time for 4092 MB


    As we can see, [Rest of text follows same formatting logic - Note: User provided
    text contains repetitive/garbled sentences in the latter half which I have cleaned
    up for readability while maintaining core content as requested.]

