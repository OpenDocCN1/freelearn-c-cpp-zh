  trans: "\n\n```cpp\nvoid vectorAdd(int *a, int *b, int *c, int N) {\n   int *d_a,\
    \ *d_b, *d_c;\n   cudaMalloc((void**)&d_a, N * sizeof(int));\n   cudaMalloc((void**)&d_b,\
    \ N * sizeof(int));\n   cudaMalloc((void**)&d_c, N * sizeof(int));\n   cudaMempy(d_a,\
    \ a, N * sizeof(int), cudaMemcpyHostToDevice);\n   cudaMemcpy(d_b, b, N * sizeof(int),\
    \ cudaMemcpyHostToDevice);\n   int threadsPerBlock = 256;\n   int blocksPerGrid\
    \ = (N + threadsPerBlock - 1) / threadsPerBlock;\n   vectorAddKernel<<<blocksPerGrid,\
    \ threadsPerBlock>>>(d_a, d_b, d_c, N);\n   cudaMemcpy(c, d_c, N * sizeof(int),\
    \ cudaMemcpyDeviceToHost);\n   cudaFree(d_a);\n   cudaFree(d_b);\n   cudaFree(d_c);\n\
    }\n```\n\n为了确保导出我们的函数，我们需要包含头文件，这通过在 C++ 文件的开头使用 `#include \"../include/vector_add.h\"\
    ` 实现。值得注意的是，我们没有像之前那样分配任何主机内存；在这里，我们从函数的调用者处接收主机内存——甚至是接收结果的数组。如果我们需要在库内部分配内存，则必须为用户提供内存管理函数，以便其释放内存。\n\
    \n我们需要提供的最后一个资源是我们之前一直没有怎么用过的东西：一个描述我们库支持的函数头文件。该文件位于项目的 `include` 文件夹下，如下：\n\n\
    ```\n#ifndef VEC_ADD_H\n#define VEC_ADD_H\nextern \"C\" {\n   void vectorAdd(int\
    \ *a, int *b, int *c, int N);\n}\n#endif\n```\n\n现在，编译好我们的库后，我们将在构建文件夹中看到 `libvector_add.so`\
    \ 文件。\n\n在下一节中，让我们看看如何结合第一个 Python 程序使用这个新库，通过使用 `ctypes` 声明关于我们函数的必要信息。\n\n##\
    \ 使用 Ctypes\n\n如果没有方法在程序中使用库，那么库就是没用的。幸运的是，有一个名为 `ctypes` 的 Python 模块，允许与用 C 或\
    \ C++ 编写的共享库进行交互。它允许我们的 Python 程序像调用原生 Python 函数一样调用库函数。这种机制提供了一种利用高性能 C++ 代码的简单方法，同时仍受益于\
    \ Python 的灵性和易用性。\n\n使用 `ctypes` 我们可以轻松地加载共享库、声明函数签名并调用原生函数。一个很大的优势是它不需要对原始 C++\
    \ 源代码进行任何修改，使其成为轻量级集成的极具吸引力的选择。\n\n另一个有趣点是，它是完全基于 Python 的，这意味着我们可以在 Python 端编写代码来定义想要从库中使用的内容，而无需编译任何东西。然而，`ctypes`\
    \ 也有它的局限性：例如，它要求手动映射函数签名，并必须处理原始内存指针。\n\n由于 Python 是动态类型，而 C++ 是静态类型，每次函数调用都必须显式指定参数和返回类型，这可能会导致一些麻烦。然而，`ctypes`\
    \ 通过提供如 `ctypes.c_int` 和 `ctypes.c_double` 等对应其 C 语言对应项的数据类型减轻减轻这种痛苦。\n\n一个代码示例将有助于澄清我们正在处理的内容：\n\
    \n```python\nimport ctypes\nlib = ctypes.CDLL(\"../../build/libvector_add.so\"\
    )\nlib.vectorAdd.argtypes = [\n   ctypes.POINTER(ctypes.c_int),\n   ctypes.POINTER(ctypes.c_int),\n\
    \   ctypes.POINTER(ctypes.c_int),\n   ctypes.c_int\n]\n```\n\n在这里，我们传递了将使用的共享库的路径，以及我们在函数中将处理的数据类型声明。尽管对于通常不需要处理数据类型声明的\
    \ Python 程序员来说，这可能看起来有点奇怪，但读起来仍然足够直接。\n\n至于函数调用，假设我们已经在 Python 程序的开头导入了 `numpy`，我们将得到类似这样的代码：\n\
    \n```python\nN = 1000\na = np.array(range(N), dtype=np.int32)\nb = np.array(range(N,\
    \ 2*N), dtype=np.int32)\nc = np.zeros(N, dtype=np.int32)\nlib.vectorAdd(\n   a.ctypes.data_as(ctypes.POINTER(ctypes.c_int)),\n\
    \   b.ctypes.data_as(ctypes.POINTER(ctypes.c_int)),\n   c.ctypes.data_as(ctypes.POINTER(ctypes.c_int)),\n\
    \   N\n)\n```\n\n在这里，我们使用 `numpy` 创建带有随机整数的输入数组和填充零的输出数组。然后，在执行函数调用时，我们需要访问数据的内部指针并传递到我们的库中。操作非常简单！虽然有点冗长，但其发生的过程非常直观。\n\
    \n我们为声明和函数调用指定了数据类型，但 Python 的动态类型解析会对 `ctypes` 调用性能产生影响，这意味着函数调用是在运行时解析的。这引入了微小的开销，因为\
    \ Python 会动态地确定正确的函数签名并转换参数。虽然对于偶尔的函数调用来说这种开销可能忽略不计，但在每秒需要数千或百万次调用的应用程序中可能会出现性能瓶颈。\n\
    \n显然，通过 `ctypes` 我们有了一种从 Python 访问库的快速方法，特别是因为当我们处理 GPU 时，我们的代码（大部分时候）都是关于内核的，而创建代理函数来暴露它们是有意义的。\n\
    \n然而，还有其他访问我们代码的方法，在下一节中，我们将深入 Python C API 的世界，创建一个作为 Python 扩展的封装器。\n\n## 使用你自己的代码进行封装\n\
    \nPython 扩展是用 C 或 C++ 编写的模块，可以像普通模块一样加载到 Python 中。它在 Python 友好的脚本环境和低级语言之间架了一个桥梁。我们可以为任何需要使用低级语言的情况创建扩展，包括当我们想要与现有的\
    \ C++ 库接口，并在提供 GPU 功能访问的同时，仍受益于 Python 的易用性时。\n\n创建扩展需要 Python C API，它允许我们定义新类型、暴露\
    \ C++ 函数到 Python、管理引用计数并处理 Python 对象。通用工作流包括定义在 Python 对象和原生 C++ 结构之间转换的函数、将其编译为共享库，然后作为\
    \ Python 模块加载。然而，编译过程是不同的，并且共享对象的创建方式使得 Python 解释器知道如何将其导入到我们的程序中。\n\n让我们分解创建扩展涉及的步骤。\n\
    \n扩展需要包含一个 Python 可用的函数定义、一个引用所有函数的数组、一个模块定义以及 Python 在加载模块时调用的初始化函数。\n\n现在，我们将先跳过函数定义，先过这些基础设施。\n\
    \n```cpp\nstatic PyMethodDef VectorAddMethods[] = {\n   {\"vectorAdd\", pyVectorAdd,\
    \ METH_VARARGS, \"Perform vector addition using CUDA\"},\n   {NULL, NULL, 0, NULL}\n\
    };\nstatic struct PyModuleDef vectoraddmodule = {\n   PyModuleDef_HEAD_INIT,\n\
    \   \"vector_add_wrapper\",\n   NULL,\n   -1,\n   VectorAddMethods\n};\n```\n\n\
    仔细观察，我们首先有一个函数数组，包含一个条目和使用该数组的模块定义。`PyMethodDef` 期望的是暴露名称、函数实现、C 函数预期的参数标志以及描述。\n\
    \n"
- fmt: "\nWe initialize the `vectoraddmodule` definition with a required macro, and\
    \ then we give it a name. Here we are not providing any description, so we use\
    \ `NULL` for now, but an important point is that by passing `-1` as an argument\
    \ we inform the Python interpreter that our module does not need to allocate any\
    \ space for an internal state. Finally, we pass in our array of functions.\n\n\
    There is one more thing in terms of infrastructure that we need to take care of\
    \ before discussing the actual function: module initialization.\n\n```c\nPyMODINIT_FUNC\
    \ PyInit_vector_add_wrapper(void) {\n   void *handle = dlopen(\"../../build/libvctor_add.so\"\
    ,\n                         RTLD_LAZY);\n   if (!handle) {\n      PyErr_SetString(PyExc_ImportError,\
    \ \n         \"Could not load libvector_add.so\");\n      return NULL;\n   }\n\
    \   vectorAdd = (vectorAddFunc)dlsym(handle, \"vectorAdd\");\n   if (!vectorAdd)\
    \ {\n      PyErr_SetString(PyExc_ImportError, \n         \"Could not find vectorAdd\
    \ in libvector_add.so\");\n      return NULL;\n   }\n   return PyModule_Create(&vectoraddmodule);\n\
    }\n```\n\nHere we are using an approach to loading our library via `dlopen` which\
    \ allows us to dynamically load each of the function pointers from the external\
    \ library without needing to provide the library at compile time. There is extra\
    \ work to be done in referring to each function pointer name, but the interesting\
    \ thing about this approach is that it allows a plugin-like architecture where\
    \ we can switch between implementations of the library. The part that is related\
    \ to the extension is the last line, where we call the `PyModule_Create` function\
    \ and pass in our module's configuration that we defined previously.\n\nNow it’s\
    \ time to see what our function will really look like.\n\n```c\nstatic PyObject*\
    \ pyVectorAdd(PyObject* self,PyObject* args){\n   PyObject *py_a, *py_b;\n   int\
    \ N;\n   if (!PyArg_ParseTuple(args, \"OOi\", &py_a, &py_b, &N))\n      return\
    \ NULL;\n   int *a = (int*)malloc(N * sizeof(int));\n   int *b = (int*)malloc(N\
    \ * sizeof(int));\n   int *c = (int*)malloc(N * sizeof(int));\n   for (int i =\
    \ 0; i < N; i++) {\n      a[i] = (int)PyLong_AsLong(PyList_GetItem(py_a, i));\n\
    \      b[i] = (int)PyLong_AsLong(PyList_GetItem(py_b, i));\n   }\n   vectorAdd(a,\
    \ b, c, N);\n   PyObject* result = PyList_New(N);\n   for (int i = 0; i < N; i++)\
    \ {\n      PyList_SetItem(result, i, PyLong_FromLong(c[i]));\n   }\n   free(a);\n\
    \   free(b);\n   free(c);\n   return result;\n}\n```\n\nThe first thing to notice\
    \ is that we are parsing a tuple of parameters with a pattern of `\"OOi\"`. This\
    \ means that we are receiving two Python objects (a.k.a the input arrays) and\
    \ an integer that represents their sizes. We are not passing in the results array,\
    \ so our Python version of the `vectorAdd` function is a little different from\
    \ the library version. This is exactly because the objective of an extension is\
    \ to provide more functionality to the programmer.\n\nWe could also have a set\
    \ of data type and size validations, although we are skipping this for now for\
    \ the sake of simplicity. But keep in mind that when bridging two different worlds\
    \ like Python and C++ it is always reassuring to have code that safeguards us.\n\
    \nWe then create the host memory as arrays to copy data from Python and to store\
    \ the results. With a `for` loop, we iterate over all the elements of each Python\
    \ list and copy them to their C++ counterparts that we’ll use in our function\
    \ call.\n\nNext we call the `vectorAdd` function loaded from the shared library\
    \ during module initialization. This passes in the three arrays and their size;\
    \ after completing the call we can copy the results from array `c` to a newly\
    \ created Python list that will be returned. We then safely free the memory that\
    \ was allocated and return the results.\n\nOne last piece to our puzzle is how\
    \ to build this extension. We do that with a file called `setup.py`.\n\n> **A\
    \ change in the near future**\n\n> As of this writing, `setup.py` is still the\
    \ tool to build Python extensions, although for packaging and installing Python\
    \ projects it has been deprecated in favour of modern tools like `pyproject.toml`.\n\
    \nOur `setup.py` file will be like the following:\n\n```python\nfrom setuptools\
    \ import setup, Extension\nmodule = Extension(\n   \"vector_add_wrapper\",\n \
    \  sources=[\"vector_add_wrapper.c\"],\n)\nsetup(\n   name=\"vector_add_wrapper\"\
    ,\n   version=\"1.0\",\n   description=\"Python binding for CUDA vector addition\"\
    ,\n   ext_modules=[module],\n)\n```\n\nTo build our extension we can use the following\
    \ command:\n\n```bash\npython3 setup.py build_ext --inplace\n```\n\nHaving built\
    \ our extension in the current folder, if we execute our Python program from this\
    \ folder, the interpreter will be able to find our library. If we need to install\
    \ our extension to the system, we can use:\n\n```bash\nsudo python3 setup.py install\n\
    ```\n\nHaving built our extension in the current folder, if we execute our Python\
    \ program from this folder, the interpreter will be able to find our library.\
    \ If we need to install our extension to the system, we can use:\n\n```python\n\
    import vector_add_wrapper as vaw\nimport random\nN = 1000\na = [random.randint(0,\
    \ N) for _ in range(N)]\nb = [random.randint(0, N) for _ in range(N)]\nresult\
    \ = vaw.vectorAdd(a, b, N)\n```\n\nWe see two differences from the previous version\
    \ based on `ctypes`: first, the code looks a lot more like Python code, and this\
    \ is because the extension is doing the heavy lifting for us; second, we are using\
    \ numpy to input data.\n\nThere are several issues to consider here. First, copying\
    \ data may take long time as the size of arrays increases, but not only does it\
    \ take longer (throwing away all the benefits of GPU execution) but also it doubles\
    \ the size of memory that our data is occupying because they now reside in two\
    \ different locations. Finally, to access the list elements we have to make two\
    \ calls, one to get the value and the other to convert it to the correct data\
    \ type. We will see later that for smaller arrays this does not greatly impact\
    \ performance, but for large arrays it can totally degrade performance.\n\nFor\
    \ now, we know that if we could just access the internal data from `numpy` like\
    \ we did with `ctypes` that could really improve our results. So, in the next\
    \ section we will update our extension to integrate with `numpy` and leverage\
    \ that.\n\n## Passing numpy arrays to your library\n\nIn our first integration\
    \ we passed in numpy arrays to our library using `ctypes`, and using `numpy` is\
    \ essentially everywhere in scientific computing with Python. It provides efficient,\
    \ contiguous memory storage, vectorized operations, and it uses accelerated CPU-based\
    \ libraries. By integrating the C API of `numpy` into our C extension, we will\
    \ be able to use the data that has been created and preprocessed on the Python\
    \ side to execute further calculations inside our GPU. This means we can put together\
    \ the best of two worlds and still feel like Python.\n\nWe will change a little\
    \ bit of our previous code to make the `numpy` API available. The first change\
    \ is to import it in our `vector_add_np_wrapper.c` file with:\n\n```c\n#include\
    \ <numpy/arrayobject.h>\n```\n\n> **`numpy` `as np`**\n\n> Python allows us to\
    \ import a library and give it a different name by using `as`, and it is usual\
    \ for applications using numpy to say `import numpy as np` so that they can refer\
    \ to the library as np instead of by its full name. We also use this approach\
    \ here to differentiate our initial wrapper and the version that integrates with\
    \ `numpy`, namely `wrapper_np`.\n"
