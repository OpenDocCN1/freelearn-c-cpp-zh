- fmt: '

    We also count on a scheduler that organizes and manages the execution of our software
    (and configuration) within the real hardware. Finally, to make sure that everything
    is capable of communicating efficiently, we have a high-speed interconnection
    between the memory and the stream multiprocessors.


    ### Single instruction, multiple data (SIMD)


    To understand why GPUs are designed the way they are, we need to think about the
    problem they were created to solve: `graphics processing`. Vector operations and
    matrix multiplication are the protagonists here, and one way to handle these efficiently
    is to have multiple pieces of data being processed with the same instruction by
    different cores at the same time. Thus, we have a single instruction and multiple
    pieces of data – this is one of the common patterns for parallelism. Of course,
    most of the time, we don''t have enough cores to execute `all` the data points
    we need to process at once, so the scheduler will allocate a set of logical units
    to be processed first, and then the next lot, and so on, until all the data has
    been processed. But it''s up to us to figure out whether our data is larger than
    the amount that can be held in global memory. This is a problem we''ll cover later
    in this book. Another interesting aspect of this design is that when we have multiple
    cores being executed and the program reaches a conditional statement, it drastically
    affects the overall performance. This is because the group will execute the first
    branch and then the second branch. Not all cores will execute both, resulting
    in some cores sitting idle while others are processing. We can overcome this by
    rethinking our solution. Let''s consider an example (not a cooking one). Let''s
    suppose we have a huge quantity of integers that we need to separate into evens
    and odds so that they can be computed differently. We''ll require a branch to
    figure out whether an integer is odd or even, which we know will result in a performance
    impact. However, to rethink the way we provide the numbers, we could use a `for`
    loop with an increment of two at a time. We could also have one group of cores
    that starts at the first odd integer and another group that starts at the first
    even integer. This small change allows processing to occur without interruption,
    thereby delivering better performance.


    ### Memory management and access


    As we mentioned previously, GPUs have their own internal memory, the consequence
    of which is that we have to be mindful of how we access data. Something we also
    mentioned was that global memory is the slowest, so if we perform operations that
    load and store directly to global memory, this will impact performance. So, let’s
    talk about how we can manage memory access to unleash our device’s full potential.
    The first thing to know is that the device''s memory is separate from the system''s
    main memory, so we need to copy memory from our computer''s memory to the device''s
    global memory, after which it can be used by our programs. `Figure 1.4` shows
    this memory separation and its connection via the system bus:


    ![Figure 1.4 – System main memory and GPU global memory](media/file4.png)


    Figure 1.4 – System main memory and GPU global memory


    Global memory is the easiest to access because it''s used in the same way that
    we access main system memory – by simply referring to the variable that was allocated
    to global memory by our main program. On the other hand, when you declare local
    variables with a limited scope, they are typically allocated to registers (except
    for large arrays, which wouldn''t fit anyway). In the middle point we have shared
    storage, which is a faster form of memory with a limited size that''s shared by
    multiple execution threads. Usually, we use this to compute intermediate steps
    as much as possible, to postpone the final access to global storage, which holds
    the final computation result. Before we leave this section, let''s consider a
    memory access example. When multiplying matrices, we process a row of a matrix
    with a column of the other matrix. However, the matrices are allocated to global
    memory contiguously. This means that for the column access, we''ll incur cache
    misses for all access:


    ![Figure 1.5 – A matrix in contiguous allocation](media/file5.png)


    Figure 1.5 – A matrix in contiguous allocation


    Considering that the matrix is stored in memory in row orientation – the way `C`
    and `C++` store this type of data – the first element of the second row will be
    immediately after the last element from the previous row. Let''s assume that the
    size of the row matches the size of our cache block. When we need to access the
    elements of a row, they may not be in the cache at first, but after the first
    load, we''ll be able to access the other elements directly from there. This isn''t
    the case when we want to access the rows since each element is in a separate location
    in the main memory and is a cache block apart from each other. A simple approach
    would be to load the column (or at least a part of it) to shared memory so that
    we can perform the operations for all the rows from the other matrix against this
    preloaded chunk of data. The upshot is that by carefully managing memory access
    patterns we can avoid bottlenecks, which is crucial for maximizing memory bandwidth
    and minimizing latency.


    ### Comparing CPUs and GPUs


    Now that we know a little more about how GPUs are organized, we can compare them
    with CPUs to understand the impact of using these devices. Modern CPUs are typically
    composed of many cores, so they''re capable of executing parallel applications
    by using threads. But while they’re capable of handling tens of threads, a simple
    GPU can handle thousands of threads. As mentioned previously, the fact that GPU
    cores execute the same instruction on many pieces of data is an interesting difference
    from CPU cores. On a CPU, each core is a complete processor that can execute either
    different applications or different threads of the same parallel application.
    This means that branch execution on a CPU core doesn''t affect the performance
    of other CPU core executions. Another important distinction is that CPUs can switch
    between tasks quickly, while GPU cores are controlled by their stream multiprocessor.
    Regarding memory management, most of the time we don''t need to change the way
    we access our variables. Although this may affect program’ performance, the impact
    is proportionally much smaller than it is in the case of GPUs.


    ### Advantages and challenges of GPU programming


    So far, we''ve learned why parallelism matters, considered the various GPU device
    components, and compared GPUs with CPUs. Now it''s time to understand how GPUs
    can enhance the performance of our solutions and how to overcome the challenges
    that come with these benefits. Since we''ve already talked about some of the benefits,
    let''s start with the challenges that come with GPU programming.


    #### GPU challenges

