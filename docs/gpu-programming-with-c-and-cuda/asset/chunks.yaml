  trans: '

    我们已经学习了创建 CUDA 程序的许多概念和技术，并且已经在小型示例中看到了一些性能提升。然而，简单地将程序转换为并在 GPU 上运行可能无法获得预期的加速，事实上，可能会产生与预期不符的成本。其中一个例子是将数据加载到
    GPU 内存所需的时间。但是，只要使用正确的策略，就可以克服这些问题。


    在本章中，我们将重温老朋友——矩阵乘法，并讨论提高其性能的方法。但最重要的是，我们将调查*为什么*我们所做的更改有助于提高性能。在此过程中，我们将涵盖以下主题：


    * 介绍优化

    * 使用 NVidia Nsight Compute 进行性能分析


    ## 技术要求


    我们将使用在 `Chapter 3` 中配置的环境，包含 VS Code 和我们的开发容器。如果你选择在你的机器上安装 CUDA Toolkit，则可以直接在终端中运行构建命令。我们还将使用一个名为
    `Nvidia Nsight Compute` 的新工具来对代码进行性能分析，这是一个基于 GUI 的工具，在我们的容器和本地安装中均可用。官方文档可以在
    [`docs.nvidia.com/nsight-compute/index.html`](https://docs.nvidia.com/nsight-compute/index.html)找到。本章的所有代码均在
    GitHub 仓库提供。


    ## 介绍优化


    在阅读官方文档时，很容易对关于不同硬件架构的信息感到迷茫或无所从心。每一个新 GPU 发布都会带来硬件创新，这会影响我们编写代码的方式，如果我们想要榨出每一分性能，了解我们的硬件是至关重要的。此外，了解硬件的细节可以揭示我们在内存带宽、可用内存和时钟速度可能存在的局限性。


    评估实现更高性能所需的努力也是我们的责任，而此时使用性能分析工具（profiler）是一个巨大的优势，因为它能帮助我们找出最值得优化的条目。代码优化可能会导致代码更难阅读，因为我们需要处理多得硬件细节，但这并不意味着代码将无法维护。我们只需要小心并遵循一些软件工程的最佳实践，以补偿增加的复杂性。


    在 `Chapter 6` 中，我们学习了一个简单的矩阵乘法内核（kernel），它的性能已经优于单线程 CPU 版本，但加载数据所需的时间会影响总执行时间。我们现在将重新审视矩阵乘法内核并应用一些优化。这是研究这些效果的完美示例，因为虽然它是那种“尴尬并行”的问题之一，但我们即将讨论的技术也适用于其他场景。


    > **Debug 与 Release 编译标志**


    我们 我们传递给编译器的指令对于为我们生成的代码类型至关重要。在 CMake 中，我们可以定义不同的配置，以决定配置生成器如何准备我们的环境。我们使用的是
    Makefile，它是一个单一配置生成器，这意味着为了从 Debug 切换到 Release，并在必要时切换回来，我们必须重新执行 CMake 配置步骤。我们将在
    *Optimizing to speed up our code* 章节中详细查看此命令，届时我们将应用优化。


    尽管如此，在跳入优化之前，学习如何测量代码正在发生的情况将具有巨大的价值。这样，我们就可以对比已有的内容与通过修改代码可能实现的成果。在 `Chapter
    4` 中，我们从从命令行使用了 NVidia Nsight Compute，这不允许交互式会话，但现在我们将使用它的图形界面来获取更多关于代码的信息。所以，让我们认识一下新工具——NVidia
    Nsight Compute 图形界面吧。


    ## 使用 NVidia Nsight Compute 进行性能分析


    我们目前在一个类似于实验室的环境工作，书中所有的程序都是很小的，而且大多数时候它们只有一个与我们正在学习的技术相关的内核。然而，在现实世界的程序中，我们将面临许多不同函数相互作用的情况，传递其结果以为用户实现结果。在这种情况下，使用性能分析工具对于识别我们应该集中精力节省时间的热点（hot
    spots）变得至关重要！


    在没有适当信息的情况下优化代码可能会让我们在很少执行的代码上花费太多时间。这种盲目优化可能会以许多方式展开，但一种可能的结果是在应用各种优化后，我们发现完全没有改进。使用帮助我们识别瓶颈所在所在工具是重要的。


    要执行该工具，我们在 VS Code 会话的终端中（已连接到我们的开发容器）运行以下命令：


    ```

    ncu-ui

    ```


    这将打开一个独立的窗口，如 *Figure 7.1* 所示。


    ![Figure 7.1: The Welcome screen](img/file23.png)


    图 7.1: 欢迎界面


    在这里我们可以创建一个 `New Project`（新项目）来分析我们的代码，如 *Figure 7.2* 所示。


    ![Figure 7.2: New Project option](img/file24.png)


    图 7.2: New Project option


    点击 `New Project` 后，将看到一个对话框，如 *Figure 7.3* 所示，在其中输入项目名称并选择创建它的文件夹。


    ![Figure 7.3: Creating the project folder](img/file25.png)


    图 7.3: 创建项目文件夹


    在这里我们选择在书籍仓库的 Chapter 7 文件夹内创建，但我们也可以选择任何认为合适的位置。点击 `OK` 按钮后，将被提示配置项目，如 *Figure
    7.4* 所示。


    ![Figure 7.4: Application executable and report name](img/file26.png)


    图 7.4: 可执行文件和报告名称


    在这里我们必须注意几点。首先，我们必须选择工作的平台；我们的选择是 `Linux x86_64`。连接选择为 `localhost`，但在高级场景中我们可能会连接到远程主机。


    下一个选择的项目是 `Application Executable`（可执行文件），注意我们正在使用创建可执行文件的构建文件夹。屏幕上最后一个要编辑的项目是报告名称（`Output
    File`），在这里我们使用 `report%i`，这样每次性能分析会话都会生成一个新的报告文件，其中 `%i` 被替换为执行次数。注意报告名称是在 `Activity`
    面板的 `Profile` 选项卡中配置的，但在运行特定的性能分析会话之前，我们将切换到 `Activity` 面板上的 `System Trace` 选项卡，如
    *Figure 7.5* 所示。此选项允许我们运行应用程序并让工具跟踪应用程序。目前不需要更改任何其他选项；只需点击 `Launch` 按钮。


    ![Figure 7.5: The system trace](img/file27.png)


    图 7.5: 系统跟踪


    跟踪执行后，我们将看到如 *Figure 7.6* 所示的分析（图像为了适应页面在中间被分开了）。


    ![Figure 7.6: System trace timeline (broke down for visualization)](img/file28.png)


    图 7.6: System trace timeline (broke down for visualization)


    在这里我们有很多信息，但感兴趣的主要项目位于窗口左侧的 `CUDA HW` 块下。当我们展开此项目时，会看到一个内核执行部分和一个内存操作部分。我们的代码首先将矩阵从主机系统拷贝到设备，因此我们将看到两个标记为
    `HtoD` 的 `Memcpy` 操作，如 *Figure 7.7* 所示。


