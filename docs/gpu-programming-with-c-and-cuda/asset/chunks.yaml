    这一系列依赖任务构成了所谓的应用程序“关键路径”。识别关键路径至关重要，因为它决定了在任何可以并行化的步骤上使用并行计算时所能实现的最小时间。请记住，阿姆达尔定律（Amdahl''s
    Law）指出，我们能实现的加速受限于应用程序中固有的顺序执行部分，我们必须考虑这些部分也将成为关键路径的一部分。


    在设计并行算法时，识别并最小化依赖关系对于优化性能至关重要。目标是尽可能“解锁”任务，以便它们能够并发运行。通过重新排列任务和管理依赖，我们可以缩短完成处理所需的时间。在某些算法中，这是通过结构化数据或步骤来消除不必要的依赖实现的，允许系统在尽可能的地方并行进行。


    如果数据移动是不可避免的，我们可以尝试将内存传输与 GPU 处理重叠，在此期间我们可以让 CPU 准备数据的其他部分，以充分利用我们的硬件和异步执行能力。


    让我们考虑这样一个应用程序：我们需要计算来自流媒体服务等系统的用户个人文件的值与一组电影指标权重之间的矩阵乘法。之后，我们对每行的值求得到每个用户的得分。最后，我们找到最小值和最大值。


    ![图 6.4: 用户排名应用程序的关键路径](img/file18.png)


    图 6.4：用户排名应用程序的关键路径


    正如`图 6.4` 所示，寻找最小值和最大值的最终步骤之间没有依赖关系，但我们必须等待之前的步骤完成。


    > **GPU 硬件——不通用，但规模巨大**


    >


    > GPU 并行与通用并行不同之处在于，我们处理的是支持特定编程模型的特定硬件。很多时候，我们会发现自己正试图寻找一种方法让应用程序适应 GPU 处理数据的方式。其他硬件可能提供各种并行模型，但很少有能与
    GPU 提供的海量并行性相比。这就是为什么可能值得从许多方面重构我们的应用程序，以使其与 GPU 处理模型兼容：海量并行化！


    设计并行算法需要对任务划分、同步和负载均衡进行仔细的思考。仅仅拆分任务是不够的：它们必须经过结构化以最小化依赖关系并最大化并行性，使同步点稀疏，并在线程之间平衡负载。这种平衡确保了每个线程都能对结果做出同样的贡献，从而提高算法的整体速度和效率。


    在接下来的章节中，我们将探索执行某些可以使用并行性加速的常用计算的算法。我们将从矩阵处理开始，因为它具有任务无关的特性，然后逐渐转向更多与任务依赖相关的示例，以说明我们所讨论的所有内容。


    ## 计算矩阵加法和乘法


    让我们深入研究矩阵加法和矩阵乘法，这两个操作上手看起来可能相似，但实际上差异很大，特别是在计算机处理它们的方式上——特别是当使用 CUDA 进行编程时。


    矩阵加法是非常直观的。假设有两个大小相同的矩阵，例如 `A` 和 `B`。我们只需要将 `A` 中的每个元素加到 `B` 对应的元素上。因此，对于每一行 `i`
    和每一列 `j`，都有 `C[i][j]=A[i][j]+B[i][j]`。由于每个元素的加都是独立于其他元素的，这是一个*极易并行*（embarrassingly
    parallel）的任务。这是一种通俗的说法，意味着每个计算都与其他任何计算相互独立，因此在理论我们可以一次性计算所有元素，而不需要协调或等待矩阵其他部分的结果。


    在 GPU 上，矩阵加法非常高效，因为线程之间不需要同步。每个线程只需从每个矩阵中获取单个元素，将它们相加并存储结果。酷的地方在于：如果我们的矩阵存储在连续内存块中（意味着按行存储），我们可以将其视为一个要相加的长长数字向量。我们只是在逐个元素地相加两个巨大的向量！通过顺序处理每一行，我们充分利用了内存布局，减少了缓存缺失并提高了速度。幸运的是，矩阵通常是连续存储的，因为这是数据从主机（host）移动到设备（device）的最佳方式。由于我们已经在`第
    4 章`中介绍了向量加法，我们将不再重温代码。


    另一方面，矩阵乘法则是完全不同的了。假设 `A[mn]` 和 `B[np]` 是两个矩阵——注意 `A` 的列数等于 `B` 的行数。在乘以矩阵 `A[mn]`
    和 `B[np]` 时，结果矩阵 `C[mp]` 中位置 `C[i][j]` 元素取决于 `A` 的整个第 `i` 行和 `B` 的整个第 `j` 列。这创建了一种“多对多”的依赖关系，这种关系在矩阵加法中是不存在的。对于
    `C` 中的每个元素，我们都在计算跨该行该列的乘和，可以描述为：


    索引元素求和的 `k` 允许我们访问 `A` 中第 `i` 行的所有元素，同时访问 `B` 中第 `j` 列的所有元素。对于矩阵 `A`，它跨越单行的所有元素，而对于矩阵
    `B`，它遍历单列的所有元素。这种模式为处理器带来了更多工作量，并给内存系统带来了压力，导致了更多的缓存缺失。


    在 CUDA 中，矩阵乘法涉及将任务分解为许多线程，每个线程处理计算的一部分，每个线程通常负责结果矩阵 `C` 的单个元素。这意味着每个线程将使用来自 `A`
    的一行和来自 `B` 的一列。然而，与矩阵加法不同，我们必须仔细考虑内存访问模式，以避免性能下降。访问非连续元素（正如我们在读取矩阵 `B` 的列时那样）会增加缓存缺失的概率，从而减慢所有速度。这是因为当我们从全局内存访问一个元素时，内存系统会调入一个放入内存缓存的块；如果我们需要的下一个元素不在缓存中，则必须从全局内存复制一个新块。如果之后再次需要之前的元素，则必须重新复制。这是一个损害性能的灾难性循环。


    > **为什么矩阵乘法很重要？**


    >


    > 矩阵乘法之所以，是因为它是许多科学计算的核心——求解方程组、运行模拟、分析数据，甚至训练机器学习模型。当你听到 AI 模型在海量数据集上训练或气象模型预测飓风时，很有可能它们正在进行大规模的矩阵乘法。科学家和工程师可能会花费数年时间开发新方法来使这些操作更快或更高效……


    图像可以帮助可视化必要的内存访问模式，并展示了每个元素的计算是如何与其他元素相互独立的。


    ![图 5：矩阵乘法的任务独立性](img/file19.png)


    图 5：矩阵乘法的任务独立性


