  trans: "\n有很多方法可以断言一个值是正确的，但在这里，由于我们使用了浮点数，我们使用了 `EXPECT_FLOAT_EQ` 宏。\n\n这是编码部分，但我们仍然需要构建并执行程序，所以让我们来看看如何操作。\n\
    \n我们的 `CMakeLists.txt` 文件必须包含一些其他指令以允许创建测试，如列表所示：\n\n```cmake\ncmake_minimum_required(VERSION\
    \ 3.10)\nproject(VectorAddTest LANGUAGES CXX CUDA)\nenable_testing()\nfind_package(GTest\
    \ REQUIRED)\nadd_executable(vector_add_test test/test_vector_add.cu src/main.cu)\n\
    target_link_libraries(vector_add_test GTest::GTest GTest::Main cuda)\nadd_test(NAME\
    \ VectorAddTest COMMAND vector_add_test)\nadd_library(vector_add SHARED src/main.cu)\n\
    set_target_properties(vector_add PROPERTIES CUDA_SEPARABLE_COMPILATION ON)\ntarget_include_directories(vector_add\
    \ PUBLIC include)\n```\n\n首先注意到的是 `enable_testing()`，它用于初始化 CTest，这是 CMake 的测试基础设施。如果我们希望我们的项目受\
    \ CI/CD 流线的控制，CTest 将非常有用。\n\n> **CI/CD 流水线的优势**\n\n> CI/CD（持续集成/持续部署）流水线是一套自动化流程，允许开发人员构建、测试和部署代码更改。它从持续集成开始，我们将代码更改合并到仓库中，触发自动化构建和测试以尽早发现错误。持续部署（或交付）然后以最少的人工干预自动实现发布过程。这种流水线加速了开发周期，并且对于通过一致测试确保高代码质量至关重要。\n\
    \n我们使用 `find_package` 函数来获取 GTest 库安装的二进制文件和头文件的引用。一个有趣的点是，测试本身就是一个程序。它在内容上是专门的，但对于构建系统来说，它只是另一个必须与正确库编译并链接的可执行文件。\n\
    \n之后，我们通过调用 `add_test` 函数让 CTest 知道该测试的存在。\n\n我们在 `CMakeLists.txt` 中已有的部分是创建一个共享库，我们将在下一节讨论\
    \ Pytest 时使用它。\n\n我们可以像之前一样通过在构建文件夹上运行 `make` 来构建我们的测试和共享库。\n\n现在有两种执行测试的方法。第一种是直接使用以下命令调用测试：\n\
    \n```bash\n./vector_add_test\n```\n\n这将产生以下输出：\n\n```\nRunning main() from /build/googletest-j5yxiC/googletest-1.10.0/googletest/src/gtest_main.cc\n\
    [==========] Running 1 test from 1 test suite.\n[----------] Global test environment\
    \ set-up.\n[----------] 1 test from VectorAddTest\n[ RUN       ] VectorAddTest.SimpleAddition\n\
    [       OK ] VectorAddTest.SimpleAddition (88 ms)\n[----------] 1 test from VectorAddTest\
    \ (88 ms total)\n\n[----------] Global test environment tear-down\n[==========]\
    \ 1 test from 1 test suite ran. (88 ms total)\n[  PASSED  ] 1 test.\n```\n\n当我们想要执行单个测试套件时，这种方法是一个很好的选择。另一种方案是调用\
    \ CTest：\n\n```bash\nctest\n```\n\n这将生成输出：\n\n```\nTest project /workspaces/GPU-Programming-with-C-and-CUDA/ch10/gtest/build\n\
    \    Start 1: VectorAddTest\n1/1 Test #1: VectorAddTest .................... \
    \  Passed    0.11 sec\n\n100% tests passed, 0 tests failed out of 1\n\nTotal Test\
    \ time (real) =   0.11 sec\n```\n\n在提交代码到仓库之前，这种方法是一个很好的选择，因为它允许我们确定所有测试是否都通过。输出稍微简洁一些，因为这是在我们的\
    \ CI/CD 环境的构建服务器上运行的内容。在构建服务器上，我们希望运行所有可用的测试，并根据结果将构建标记为成功或失败。\n\n在下一节中，我们将学习如何使用\
    \ Pytest 为我们的代码添加另一层测试。\n\n### 在我们的代码中使用 Pytest\n\n在上一节中，我们为 C++ 代码生成了共享库。正如我们在第\
    \ 9 章中所了解的，这是将我们的函数暴露给 Python 的基础步骤，为了简单起见，我们将使用之前看过的 `ctypes` 方法。\n\n首先，我们创建一个模块来加载共享库，并使用\
    \ `ctypes` 声明所有将要使用的内容：\n\n```python\nimport ctypes\nimport numpy as np\nlib =\
    \ ctypes.CDLL('../gtest/build/libvector_add.so')\nlib.vectorAdd.argtypes = [\n\
    np.ctypeslib.ndpointer(dtype=np.float32, flags=\"C_CONTIGUOUS\"),\nnp.ctypeslib.ndpointer(dtype=np.float32,\
    \ flags=\"C_CONTIGUOUS\"),\nnp.ctypeslib.ndpointer(dtype=np.float32, flags=\"\
    C_CONTIGUOUS\"),\nctypes.c_int\n]\ndef vectorAdd(a: np.ndarray, b: np.ndarray)\
    \ -> np.ndarray:\n   assert a.shape == b.shape\n   n = a.size\n   c = np.empty_like(a)\n\
    \   lib.vectorAdd(a, b, c, n)\n   return c\n```\n"
- fmt: '

    We started by defining parallelism, and considered how it can be used to improve
    the performance of tasks. At first no code was needed, just some reflection on
    activities from our daily lives to make things clear and simple. Then we discussed
    the programming environment, and since GPU programming needs such a specialized
    toolkit, we presented the alternative of using `Docker` to keep everything nice
    and tidy. This approach is doubly interesting because it can be used for other
    programming environments as well.


    The next chapter brought us to the development of a simple program as our first
    milestone. We executed code that actually used the GPU! However, this first program
    was not really a true parallel program, so we then changed focus to look at programs
    that really exploit the power of GPU cores for bigger problems. In addition we
    learnt how to move data into and out of our `GPU devices`.


    After that many new concepts needed to be explained, so we spent some time going
    through each facet of `GPU programming` to make sure that at each stage we had
    laid the foundations for what was coming next. We then moved on to the design
    of parallel algorithms and how to make the most of our `GPU hardware`. We discussed
    the challenges and characteristics of these approaches to programming problems.


    Then it was time to examine performance optimization strategies, and also to look
    at the profiling tool that helps us find the hotspots that demand our attention
    when applying optimization techniques. We saw the use of `shared memory` in practice
    and its effects on overall execution time.


    We learnt that another layer of performance improvement is possible when we overlap
    memory transfers and computation by using `streams`. And we leveraged the use
    of our profiler to validate the optimal data transfer size to use.


    What good would our code be if we couldn’t integrate it with other programs? That
    question motivated us to explore how we can pack code into libraries and how to
    call our GPU code from `Python`.


    Finally, in this final chapter we’ve looked at the paths that lie in front of
    us now that we know how to create GPU programs. We’ve seen that there are libraries
    that can boost our productivity like `cuBLAS` and `Thrust`, and we’ve discussed
    strategies for deciding when we should write our own custom `CUDA kernels` and
    when we should rely on existing libraries. We’ve seen that it may be useful to
    move even sequential code to the GPU if it ends up avoiding data transfers that
    could eat into the performance gains provided by the GPU.


    The chapter rounded off with a glimpse of how we can test our code, both at the
    `C++` level as well as on the `Python` level if our code is already exposed as
    a shared library.


    And with that, we’ve reached the end of our journey together to the heart of performance
    programming using the GPU. Hopefully you now feel you have the knowledge needed
    to venture forth and exploit the power of the GPU in your own projects. Bon voyage!

    '
