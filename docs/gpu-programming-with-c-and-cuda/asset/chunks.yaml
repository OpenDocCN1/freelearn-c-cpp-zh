  trans: "\n一个常见的例子是融合乘加（`FMA`）指令。该操作在一步内完成乘法和加法。`FMA` 的主要优势在于它避免了乘法和加法步骤之间的中间舍入。这意味着该操作不仅速度更快（因为使用了单条指令），而且更精确，因为它减少了舍入误差的累积。本质上，`FMA`\
    \ 允许 GPU 最大化其计算效率和准确性，使其成为高性能任务的关键工具。\n\n这一次我们的代码更改非常简单。\n\n```\n #pragma unroll\n\
    \     for (int k = 0; k < blockDim.x; k++) {\n         sum = fmaf(Asub[ty][k],\
    \ Bsub[k][tx], sum);\n     }\n```\n\n我们仍然不需要执行 `CMake` 配置，但我们需要像以前一样使用 `make`\
    \ 命令来构建应用程序。\n\n在*图 7.39* 中，我们可以看到我们各个版本的汇总比较，它们现在都处于 Debug 配置模式下。\n\n![图 7.39:\
    \ 融合指令内核总结](img/file61.png)\n\n图 7.39: 融合指令内核总结\n\n我们注意到寄存器的数量增加了，时间也变增加了，这出乎意料——但同样，我们现在处于\
    \ Debug 模式。\n\n*图 7.40* 显示了 Roofline 图。\n\n![图 7.40: 融合指令内核的 Roofline](img/file62.png)\n\
    \n图 7.40: 融合指令内核的 Roofline\n\n当前会话略低于之前的几次，但这仍然与使用 Debug 配置有关。\n\n接下来，我们分析我们的内存图（*图\
    \ 7.41*）。\n\n![图 7.41: 融合指令内核的内存图](img/file63.png)\n\n图 7.41: 融合指令内核的内存图\n\n我们的更改并没有在内存使用方面带来任何具体的改进，但也没有变恶化。\n\
    \n现在让我们来看*图 7.42* 中的占用率（Occupancy）。\n\n![图 7.42: 融合指令内核的占用率](img/file64.png)\n\
    \n图 7.42: 融合指令内核的占用率\n\n我们注意到寄存器的数量增加了，因为融合指令更好地利用了它们。\n\n既然我们已经使用了所有的策略，让我们把一切整合起来，并使用\
    \ Release 配置。\n\n### 使用 Release 配置整合一切\n\n现在我们不需要更改任何代码，但我们需要使用以下命令重新配置我们的项目：\n\
    \n```\ncmake -DCMAKE_BUILD_TYPE=Release ..\n```\n\n之后，我们运行 `make` 并再次执行分析器。结果可以在*图\
    \ 7.43* 中看到。注意，时间从 47.33 毫秒减少到 33.37 毫秒，通过使用正确的策略，提升了约 42%。这说明了为什么我们还需要使用 Release\
    \ 配置与朴素版本进行比较：它验证了这样一个观点，即仅仅使用编译器优化不足以最大化我们硬件资源的利用。\n\n![图 7.43: Release 版本中开启所有优化的内核总结](img/file65.png)\n\
    \n图 7.43: Release 版本中开启所有优化的内核总结\n\n我们的 Roofline 图（*图 7.44*）显示我们当前会话的吞吐量比之前的更高。\n\
    \n![图 7.44: Release 版本中开启所有优化的内核的 Roofline](img/file66.png)\n\n图 7.44: Release\
    \ 版本中开启所有优化的内核的 Roofline\n\n让我们也检查内存图（*图 7.45*）。\n\n![图 7.45: Release 版本中开启所有优化的内核的内存图](img/file67.png)\n\
    \n图 7.45: Release 版本中开启所有优化的内核的内存图\n\n当我们与之前的版本比较时，如预期地看到了共享内存的使用。接下来让我们分析我们的占用率（*图\
    \ 7.46*）。\n\n![图 7.46: Release 版本中开启所有优化的内核的占用率](img/file68.png)\n\n图 7.46: Release\
    \ 版本中开启所有优化的内核的占用率\n\n我们当前的版本使用了 25 个寄存器，以及与 Debug 版本相同的共享内存。\n\n为了 sake 起见，让我们把所有版本都放在同一个\
    \ Roofline 图（*图 7.47*）中。\n\n![图 7.47: 所有版本的合并 Roofline](img/file69.png)\n\n图 7.47:\
    \ 所有版本的合并 Roofline\n\n**我们可以看到使用编译器标志结合特定算法和代码结构对于从硬件中获得最大收益的重要性。**\n\n## 总结\n\
    \n在本章中，我们学习了各种优化策略，以及 CUDA 工具包提供的图形化分析器的使用。这是一个帮助我们处理内核中热点的关键工具，让我们尽可能高效地利用时间。\n\
    \n在下一章中，我们将学习另一种加速代码的策略：内存传输叠加。\n\n## 参考文献\n\n[1] Volkov, V. and Demmel, J. (2008)\
    \ Benchmarking GPUs to tune linear algebra. *SC ’08: Proceedings of the 2008 ACM/IEEE\
    \ conference on Supercomputing*, Article No. 31, pp.1-11. ([`dl.acm.org/doi/1145/139312`](https://dl.acm.org/doi/1145/139312))\n\
    \n# 第 8 章：操作叠加 (Overlay Operations)\n\n## 在 Discord 加入我们的社区\n\n[`packt.link/deep-engineering`](https://packt.link/deep-engineering)\n\
    \n![](img/file70.png)\n\nGPU 的一个有趣可能性是同时执行多个操作。通过使用 CUDA 流（streams），可以在执行内核的同时向和从\
    \ GPU 拷贝内存，从而实现操作叠加。这意味着我们可以以交错的方式处理三件事。\n\n另一种可能性是在同一台机器上使用多个 GPU，尽管它的成本更高，这是一个不常见的设置。我们将在简要概述中提到这种有趣的方案；它需要仔细考虑算法以充分利用我们的设备。\n\
    \n在进入这些有趣的话之前，我们将通过探索如何使用 VS Code 调试代码来开始本章。在本章中，我们将涵盖以下主要主题：\n\n*   使用 VS Code\
    \ 调试 CUDA 代码\n*   使用 CUDA 流拷贝内存并执行代码\n*   使用多个 GPU\n\n## 技术要求\n\n我们将使用在*第 3 章*中配置的环境。如果你已经在机器上安装了\
    \ CUDA Toolkit，可以简单地在终端运行构建命令。我们还将学习如何使用 VS Code 调试 GPU。代码提供在 GitHub 仓库中。\n\n\
    ## 使用 VS Code 调试 CUDA 代码\n\n调试 CUDA 应用程序有时感觉像解开乱结，但有了正确的工具，过程就会变得容易管理。针对 CUDA\
    \ 应用程序的 `cuda-gdb` 官方文档可以在 [`docs.nvidia.com/cuda/cuda-gdb`](https://docs.nvidia.com/cuda/cuda-gdb)\
    \ 找到。然而，结合 VS Code 使用 `cuda-gdb` 是一种强大的组合，可以跟踪 GPU 代码中的问题。\n\n我们的设置已经包含了调试代码所需的一切。我们只需要为想要调试的程序添加配置。首先，点击侧边栏上的\
    \ **Run and Debug**（运行和调试）图标。\n\n![](img/file71.png)\n\n图 8.1: 调试配置\n\n正如我们在*图\
    \ 8.1* 所示，我们需要创建一个 `launch.json` 文件，通过点击“create a launch.json file”链接来完成，VS Code\
    \ 将引导我们完成这一过程。\n\n![图 8.2: 选择调试器](img/file72.png)\n\n图 8.2: 选择调试器\n"
- fmt: "\nWe can see on `Figure 8.2` that VS Code asks which debugger we will be using.\
    \ This is because VS Code will be just the interface: the heavy lifting work still\
    \ be made by the selected debugger. We will go with `cuda-gdb`. Once the `launch.json`\
    \ file is created for us (in the `.vscode` folder) the interface is updated, and\
    \ the file appears open to us. We still need to add some information about the\
    \ program that we want to debug. The initial code on the file looks like this:\n\
    \n```\n{\n    // There are some comments about IntelliSense\n    \"version\":\
    \ \"0.2.0\",\n    \"configurations\": [\n        {\n            \"name\": \"CUDA\
    \ C++: Launch\",\n            \"type\": \"cuda-gdb\",\n            \"request\"\
    : \"launch\",\n            \"program\": \"\"\n        },\n        {\n        \
    \    \"name\": \"CUDA C++: Attach\",\n            \"type\": \"cuda-gdb\",\n  \
    \          \"request\": \"attach\"\n        }\n    ]\n}\n```\n\nThe file has some\
    \ comments right at the beginning that we have removed for the sake of space.\
    \ The important parts here are the two suggested configurations: `launch` or `attach`.\
    \ These options represent different situations that not everybody may be familiar\
    \ with. When we select the `launch` option the debugger will start the program\
    \ on its own, but when we select `attach`, the debugger will attach to a running\
    \ operating system process and start the debugging session. We will use `launch`\
    \ for now, and we may change the configuration file as follows:\n\n```\n{\n  \"\
    version\": \"0.2.0\",\n  \"configurations\": [\n   {\n     \"name\": \"Add Vectors\"\
    ,\n     \"type\": \"cuda-gdb\",\n     \"request\": \"launch\",\n     \"program\"\
    : \"${workspaceFolder}/ch8/build/add_vectors\",\n     \"stopAtEntry\": true,\n\
    \     \"cwd\": \"${workspaceFolder}/ch8/build\"\n   }\n  ]\n}\n```\n\nThe `name`\
    \ attribute is anything that we would like to appear in the dropdown menu to enable\
    \ us to identify the configuration. The attributes `type` and `request` are the\
    \ same as before. The `program` attribute is key: we must pass in the path to\
    \ the executable we will be using during our session. We also have `stopAtEntry`,\
    \ which is straightforward: it stops the debug session at the program's entry\
    \ point; and finally `cwd` which stands for current working directory, where dependencies\
    \ will be looked for.\n\nWe also must remember that our `CMakeLists` has to be\
    \ set to our Debug profile and we must compile our code again using the `make`\
    \ command:\n\n```\ncmake -DCMAKE_BUILD_TYPE=Debug ..\nmake\n```\n\nNow we have\
    \ everything in place to set breakpoints directly in the CUDA C/C++ code within\
    \ VS Code! Let's use a broken program to go through the process of debugging.\
    \ We will be using a simplified version of our vector addition program from `Chapter\
    \ 4`, but we have removed all time measurements and have introduced an obvious\
    \ bug. Here’s the code for our kernel:\n\n```\n__global__ void vec_add_gpu(int\
    \ *a, int *b, int *c, int N){\n    int idx = threadIdx.x + blockIdx.x * blockDim.x;\n\
    \    if (idx < N) {  \n        c[idx] = a[idx] * b[idx];\n    }\n }\n```\n\nInstead\
    \ of adding the two values we are multiplying them, and with such a small kernel\
    \ we can spot that immediately, but the point here is to use this as an example\
    \ as we walk through the tool. Now we will click the play button on the left of\
    \ the `Add Vectors` dropdown.\n\n![Figure 8.3: Start Debugging the Add Vectors\
    \ configuration](media/file73.png)\n\nFigure 8.3: Start Debugging the Add Vectors\
    \ configuration\n\nAfter it starts, since we configured `\"stopAtEntry\": true`,\
    \ we will see that the code stops at the `main` function and waits for our command.\n\
    \n![Figure 8.4: The debug session stopped at line 34](media/file74.png)\n\nFigure\
    \ 8.4: The debug session stopped at line 34\n\nTo add breakpoints, we can click\
    \ on the left side of the line numbers (`Figure 8.5`).\n\n![Figure 8.5: Adding\
    \ a breakpoint](media/file75.png)\n\nFigure 8.5: Adding a breakpoint\n\nWe also\
    \ have a toolbar that allows us to control execution flow. The options are `Continue`\
    \ - to run the code until the next breakpoint, `Step Into` - to enter a function\
    \ call, `Step Over` - to run the next command without entering the code in case\
    \ of a function, and `Step Out` - if we entered a function call and want to continue\
    \ on the next line after the function call that we entered. We also have the `Restart`\
    \ and `Stop` commands. This toolbar can be moved on the screen if needed.\n\n\
    ![Figure 8.6: The Debug toolbar and our breakpoint at line 8](media/file76.png)\n\
    \nFigure 8.6: The Debug toolbar and our breakpoint at line 8\n\nWe can now use\
    \ the debugger to figure out what the problem is with our code by inspecting the\
    \ values at runtime. When execution hits a breakpoint we can inspect variables,\
    \ step through code, and even evaluate expressions. Since we have a breakpoint\
    \ set inside our kernel, we can click on the `Continue` button of the Debug Toolbar\
    \ and our code will run until that point.\n\n![Figure 8.7: Hitting the breakpoint](media/file77.png)\n\
    \nFigure 8.7: Hitting the breakpoint\n\nUsing breakpoints, we can add watchpoints\
    \ to variables. Unlike breakpoints, which trigger on specific lines, watchpoints\
    \ activate when the value changes. To add a watchpoint, we select the variable\
    \ or expression and right-click on it and select `Add to Watch`.\n\n![Figure 8.8:\
    \ Adding a watch](media/file78.png)\n\nFigure 8.8: Adding a watch\n\nAfter that\
    \ we have the `Watch` panel on the left-hand side, we can see the following.\n\
    \n![Figure 8.9: The Watch panel with two expressions](media/file79.png)\n\nFigure\
    \ 8.9: The Watch panel with two expressions\n\nConditional breakpoints are another\
    \ great resource. They allow the code to pause only when specific conditions are\
    \ met, minimizing noise and helping us to focus more effectively. Even within\
    \ the current Debug session we can edit a breakpoint to turn it conditional.\n\
    \n![Figure 8.10: Editing the breakpoint](media/file80.png)\n\nFigure 8.10: Editing\
    \ the breakpoint\n\nAfter that we can enter our conditional expression for the\
    \ breakpoint and hit enter to accept it.\n\n![Figure 8.11: The breakpoint expression](media/file81.png)\n\
    \nFigure 8.11: The breakpoint expression\n\nAnother powerful debugging technique\
    \ involves inspecting the **call stack**. When a breakpoint is hit, cuda-gdb provides\
    \ a call stack showing how the code arrived at the execution point (Figure 8.12).\n\
    \n![Figure 8.12: The call stack paused at the breakpoint](media/file82.png)\n\n\
    Figure 8.12: The call stack paused at the breakpoint\n\nAnother practical aspect\
    \ of this debugging configuration is the ability to visualize variables in different\
    \ scopes. The variables pane in VS Code can show local variables, global memory\
    \ contents, and even shared memory if our code makes use of it.\n\n![Figure 8.13:\
    \ The variables pane](media/file83.png)\n\nFigure 8.13: The variables pane\n\n\
    One last resource that is worth mentioning is the Debug Console.\n\n![Figure 8.14:\
    \ The Debug console](media/file84.png)\n\nFigure 8.14: The Debug console\n\nAs\
    \ we can see in `Figure 8.14`, the Debug console shows information relevant to\
    \ program execution. However, for the majority of our cases the use of breakpoints\
    \ and flow control is enough to make our lives considerably easier.\n\nOverall,\
    \ using VS Code with cuda-gdb for CUDA debugging offers a rich, user-friendly,\
    \ and powerful environment. It combines the low-level control and insights of\
    \ cuda-gdb with the modern, intuitive interface of VS Code. Whether we are tracking\
    \ down memory issues, examining thread behavior, or stepping through complex kernels,\
    \ this setup provides all the tools we need to make CUDA debugging highly effective.\n"
