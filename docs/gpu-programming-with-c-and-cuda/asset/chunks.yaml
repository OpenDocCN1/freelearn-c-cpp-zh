  trans: "\n我们没有使用 `Chapter 7` 中看到的高级优化技术，仍然实现了执行时间 25% 到 31% 的提升。这是一项了不起的！当然，我们简化了代码，以便更容易理解如何使用这一强大功能，但尽管如此，它可以被应用于现实场景中。通过使用\
    \ `ncu-ui`，我们能够可视化重叠是如何发生的，从而能够具体地理解为什么这样做有效。\n\n然而，这并不是重叠多次执行的唯一方法，我们还有一段旅程要走。现在让我们来看看如何在同一个程序中同时使用多个\
    \ GPU 上！\n\n## 同时运行多个 GPU\n\n正如我们在章节介绍中提到的，由于成本高昂，在同一台机器上配备多个 GPU 并不是常见的配置。尽管如此，它仍然是计算重叠的形式，我们可以利用它的优势。在本节中，我们将查看之前向量矩阵乘法程序的适配版本，其中问题被分为两个部分，每部分都提交给不同的\
    \ GPU。\n\n我们不会在此程序中使用流（streams），以免混淆主题。我们也不会进行任何性能测量，因为运行执行的系统基于 PCIe 2.0 总线，其速度非常慢，会显著影响最终的时间结果。\n\
    \n多 GPU 编程的关键概念是使用 `cudaSetDevice(int d)` 函数，它定义了将指定的 GPU 设备，直到再次使用不同的设备标识符调用它。\n\
    \n在多个 GPU 上执行向量矩阵乘法的内核函数与我们在 CUDA Streams 程序中使用的是同一个，所以让我们跟随主程序来理解这些变化。\n\n在主机主机上声明并初始化向量和矩阵之后，是第一个有趣的部分。\n\
    \n```cpp\nfloat *d_vec[2], *d_mat[2], *d_res[2];\nfor (int device = 0; device\
    \ < 2; device++) {\n  cudaSetDevice(device);\n  cudaMalloc(&d_vec[device], cols\
    \ * sizeof(float));\n  cudaMalloc(&d_mat[device], chunk_size * cols * sizeof(float));\n\
    \  cudaMalloc(&d_res[device], chunk_size * sizeof(float));\n  cudaMemcpy(d_vec[device],\
    \ h_vec, cols * sizeof(float), cudaMemcpyHostToDevice);\n}\n```\n\n在这里，我们声明了三个指针数组来处理每个设备上使用的数据，然后我们的\
    \ `for` 循环允许我们为每个设备执行内存分配和内存拷贝。在这里我们使用了 `cudaMemcpy`，这是一个同步函数，但即使我们在配合 CUDA Streams\
    \ 时使用 `cudaMemcpyAsync`，我们也受到 PCI 总线的限制，因此即使目标是不同的设备，我们同时能传输的数据量也是有限的。\n\n我们所有的代码将将\
    \ `for` 循环，以便对两个可用设备进行切换和寻址。我们的下一个代码块将矩阵的一半拷贝到每个 GPU。\n\n```cpp\nfor (int device\
    \ = 0; device < 2; device++) {\n  cudaSetDevice(device);\n  cudaMemcpy(d_mat[device],\
    \ h_mat + device * chunk_size * cols, chunk_size * cols * sizeof(float), cudaMemcpyHostToDevice);\n\
    }\n```\n\n再次，我们相应设置设备并传输数据。现在是时候执行我们的内核了，如下：\n\n```cpp\nint blocks = (chunk_size\
    \ + BLOCK_SIZE - 1) / BLOCK_SIZE;\nfor (int device = 0; device < 2; device++)\
    \ {\n  cudaSetDevice(device);\n  vectorMatrixMulKernel<<<blocks, BLOCK_SIZE>>>(d_vec[device],\
    \ d_mat[device], d_res[device], chunk_size, cols);\n}\n```\n\n我们首先定义了网格的大小并在两个\
    \ GPU 上复用它。除了设置应该使用的设备外，我们还使用 `for` 循环的索引来寻址在每个 GPU 上分配的内存。\n\n```cpp\nfor (int\
    \ device = 0; device < 2; device++) {\n  cudaSetDevice(device);\n  cudaMemcpy(h_res_gpu\
    \ + device * chunk_size, d_res[device], chunk_size * sizeof(float), cudaMemcpyDeviceToHost);\n\
    \  cudaFree(d_vec[device]);\n  cudaFree(d_mat[device]);\n  cudaFree(d_res[device]);\n\
    }\n```\n\n最后，我们将从两个设备的结果拷贝到结果数组中的正确位置。我们可以看到，使用多个 GPU 比在单个 GPU 上使用流并没有困难多少。真正的问题是，为了共同处理同一个问题，两个设备将竞争\
    \ PCI 总线的可用性，这会极大损害性能。一个好的主意是在可以在开始加载数据集的场景中使用此资源，然后在整个应用程序生命周期内在不同的 GPU 上执行不同的计算。\n\
    \n## 总结\n\n在本章中，我们学习了如何使用 IDE 中的一个新工具来以可视化的方式调试我们的代码。这是一个非常实用的工具，应该精通它，因为很多时候我们必须像大海捞针一样寻找问题。在那之后，我们回到了一个在\
    \ `Chapter 5` 中首次介绍的主题，但现在我们能够探索 CUDA 流使用的的许多方面，以及数据传输大小对性能的影响。我们学习了分块大小（chunk\
    \ size）、传输大小与数据分区数量之间的关系。\n"
- fmt: "\nWe already known that C++ unleashes raw power and control over hardware,\
    \ making it the perfect choice for performance-intensive tasks, and for dealing\
    \ with GPUs. However, Python is present in many modern scientific computing projects,\
    \ as is machine learning. By making our GPU-accelerated C++ library accessible\
    \ from Python, we provide high-speed computing capabilities to a broader audience,\
    \ including data scientists, engineers, and researchers who may not be comfortable\
    \ with C++ but who need high-performance solutions nonetheless.\n\nA great benefit\
    \ of exposing our libraries to Python is accessibility. As implied above, Python's\
    \ ecosystem includes a vast array of libraries for data analysis, visualization,\
    \ and machine learning. By integrating our C++ code with Python, users can call\
    \ high-performance GPU computations from Python scripts, enabling a more dynamic\
    \ workflow between writing algorithms, visualizing results, and conducting further\
    \ analysis. Additionally, this integration makes it easier to develop prototypes\
    \ in Python while offloading compute-heavy operations to C++.\n\nWe will explore\
    \ two common approaches to exposing our code. The first alternative, `ctypes`,\
    \ is a built-in module in Python that allows C functions to be called directly\
    \ from shared libraries (`.so` or `.dll` files). This approach is relatively straightforward\
    \ because it is a Python-only approach. However, it requires careful attention\
    \ to function signatures and memory management, especially when dealing with pointers.\n\
    \nThe second, more sophisticated, approach involves writing a wrapper (a.k.a.\
    \ C program) manually using the Python C API. This method provides finer control\
    \ over how the Python interpreter interacts with C++ functions, allowing for more\
    \ Pythonic behavior in function calls and memory management. While it requires\
    \ writing additional C++ code to handle Python objects, it provides the flexibility\
    \ to define custom types, manage memory allocation efficiently, and handle Python\
    \ exceptions more elegantly.\n\nA major challenge when integrating the two programming\
    \ languages is managing memory correctly. Python employs automatic memory management\
    \ with garbage collection, whereas C++ requires explicit memory handling. This\
    \ difference can lead to memory leaks or segmentation faults if not managed properly.\
    \ However, we will be dealing here with memory allocated on Python's side and\
    \ just manipulated on the C and CUDA side, making it much safer.\n\nAnd since\
    \ we mentioned our beloved CUDA, another challenge arises when dealing with GPU\
    \ memory. As we know, GPU memory allocations work differently from CPU memory,\
    \ and improper memory management can degrade performance. Although Python does\
    \ not understand GPU memory, we do (luckily), and we can ensure that buffers are\
    \ properly allocated and freed when no longer needed. We will make use of our\
    \ GPU memory management functions to make sure that everything is properly handled.\n\
    \n![Figure 9.1: Python does not handle GPU memory directly](media/file95.png)\n\
    \nFigure 9.1: Python does not handle GPU memory directly\n\nAs we can see in `Figure\
    \ 9.1`, Python does not interact directly with GPU memory, instead relying on\
    \ our library code to perform any memory handling correctly.\n\nAnother common\
    \ issue is dealing with data types, because, as strange as it may seem (just kidding!),\
    \ Python is what we call a dynamically typed programming language. This means\
    \ that variables do not have a declared type, but the values they contain do.\
    \ Due to this characteristic, Python objects like NumPy arrays need to be translated\
    \ into a format that C++ functions can understand. This requires careful handling\
    \ of data types and memory layouts. If not handled properly, performance gains\
    \ resulting from the use of C++ may be negated by inefficient data copying. A\
    \ well-designed wrapper should aim for zero-copy memory sharing when possible,\
    \ by leveraging techniques such as NumPy's array interface or memory-mapped buffers.\n\
    \nWith these considerations in mind, we will see in the next section our first\
    \ approach to loading a dynamic linked library that interacts with the GPU, and\
    \ using a function declared in the library from a Python program.\n\n## Creating\
    \ the C++ Library\n\nWe started this chapter talking about integrating a C++ library\
    \ with Python, but up until now we’ve only created C++ programs that use the GPU\
    \ – and all of them were executable programs, not libraries. So let's see how\
    \ we can turn our code into a library! We will use as our example a very simple\
    \ vector addition kernel that receives two input arrays, one output array, and\
    \ their size to perform the addition of the input arrays' elements and store the\
    \ results on the output array. Note that pass a single value for the size because\
    \ the arrays must be of the same size.\n\nA C++ library, in simple terms, is a\
    \ collection of precompiled code that can be linked to multiple applications,\
    \ saving time and leveraging code reuse. For our purpose of integrating with Python\
    \ we’ll need to create a shared library (dynamically loaded), and CMake provides\
    \ everything we need to accomplish that.\n\n> **Static versus shared libraries**\n\
    \n> Although a library is a collection of precompiled code, there are different\
    \ ways to access their functionality. With a static library the code is copied\
    \ into the final program, meaning that if we compile ten programs using the same\
    \ static library, they all will have their own separate copy of the code in their\
    \ final file. On the other hand, when using a shared library our program does\
    \ not include the full library code. Instead, it depends on the runtime system\
    \ to dynamically link the necessary functions from the library.\n\nOne major advantage\
    \ of libraries is to enable modular projects in which different aspects of the\
    \ application are taken care of in different, functionally distinct, layers. We\
    \ call this `separation of concerns`, and it is fundamental in a GPU project because\
    \ it means we can isolate all the GPU-related code in a separate library and have\
    \ different teams working at the business application level and at the internal\
    \ application level.\n\nTo create our library our `CMakeLists.txt` file will change\
    \ a little bit to include the following instructions:\n\n```\nadd_library(vector_add\
    \ SHARED src/vector_add.cu) set_target_properties(vector_add PROPERTIES CUDA_SEPARABLE_COMPILATION\
    \ ON) target_include_directories(vector_add PUBLIC include)\n```\n\nInstead of\
    \ the `add_executable` that we have been using, we now use `add_library` and adding\
    \ `SHARED` specifies the type of library to create.\n\nThen, by using `set_target_properties`\
    \ we make sure that `nvcc`, the NVidia compiler, knows that this will be a library\
    \ by specifying `CUDA_SEPARABLE_COMPILATION ON`.\n\nFinally we must add the include\
    \ directory that contains our header files (with definitions of our functions\
    \ so that other executables know what is available in our library) so that CMake\
    \ can track this.\n\nThe code for our library is slightly different from that\
    \ on which we have been working, but it is a small change. First, the kernel does\
    \ not change: it uses the same structure that we had before:\n\n```\n__global__\
    \ void vectorAddKernel(int *a, int *b, int *c, int N){\n   int idx = threadIdx.x\
    \ + blockIdx.x * blockDim.x;\n   if (idx < N) { \n      c[idx] = a[idx] * b[idx];//a\
    \ bug on purpose for debugging\n   }\n}\n```\n\nBut we need to provide a way for\
    \ the external world to call this kernel. Before we were using the kernel in our\
    \ own programs, but now we are writing the kernel to provide a GPU-accelerated\
    \ feature to someone else. What we can do is to turn our main function into a\
    \ proxy-like function, as follows:\n"
