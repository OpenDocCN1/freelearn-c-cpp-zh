  trans: "\n从 `Figure 8.2` 中我们可以看到，VS Code 询问我们将使用何种调试器。这是因为 VS Code 仅仅作为一个界面存在：繁重的工作仍由所选的调试器完成。我们将选择\
    \ `cuda-gdb`。一旦我们创建了 `launch.json` 文件（在 `.vscode` 文件夹中），界面就会更新，该文件也会向我们打开。我们仍然需要添加关于我们想要调试的程序的某些信息。文件上的初始代码如下：\n\
    \n```\n{\n    // There are some comments about IntelliSense\n    \"version\":\
    \ \"0.2.0\",\n    \"configurations\": [\n        {\n            \"name\": \"CUDA\
    \ C++: Launch\",\n            \"type\": \"cuda-gdb\",\n            \"request\"\
    : \"launch\",\n            \"program\": \"\"\n        },\n        {\n        \
    \    \"name\": \"CUDA C++: Attach\",\n            \"type\": \"cuda-gdb\",\n  \
    \          \"request\": \"attach\"\n        }\n    ]\n}\n```\n\n文件开头有一些注释，为了节省空间，我们将其删除了。这里重要的部分是两个建议的配置：`launch`\
    \ 或 `attach`。这些选项代表了并非每个人都熟悉的不同情况。当我们选择 `launch` 选项时，调试器将自动启动程序；但当我们选择 `attach`\
    \ 时，调试器将附加到正在运行的操作系统进程并启动调试会话。我们现在将使用 `launch`，并如下修改配置文件：\n\n```\n{\n  \"version\"\
    : \"0.2.0\",\n  \"configurations\": [\n   {\n     \"name\": \"Add Vectors\",\n\
    \     \"type\": \"cuda-gdb\",\n     \"request\": \"launch\",\n     \"program\"\
    : \"${workspaceFolder}/ch8/build/add_vectors\",\n     \"stopAtEntry\": true,\n\
    \     \"cwd\": \"${workspaceFolder}/ch8/build\"\n   }\n  ]\n}\n```\n\n`name` 属性可以是任何我们希望出现在下拉菜单中的内容，以便我们识别配置。`type`\
    \ 和 `request` 属性与之前相同。`program` 属性是关键：我们必须传入在会话期间将使用的可执行文件路径。我们还有 `stopAtEntry`，它的作用很直观：它会在程序的入口处停止调试会话；最后是\
    \ `cwd`，它代表当前工作目录，将在其中查找依赖项。\n\n我们必须记住，我们的 `CMakeLists` 必须设置为 Debug 配置模式，并且我们必须使用\
    \ `make` 命令重新编译代码：\n\n```\ncmake -DCMAKE_BUILD_TYPE=Debug ..\nmake\n```\n\n现在，我们已经准备就绪，可以在\
    \ VS Code 中直接在 CUDA C/C++ 代码中设置断点！让我们用一个有错误的程序来演示调试过程。我们将使用 `第 4 章` 中向量加法程序的简化版本，但我们移除了所有时间测量，并引入了一个明显的\
    \ bug。以下是我们的内核代码：\n\n```\n__global__ void vec_add_gpu(int *a, int *b, int *c,\
    \ int N){\n    int idx = threadIdx.x + blockIdx.x * blockDim.x;\n    if (idx <\
    \ N) {  \n        c[idx] = a[idx] * b[idx];\n    }\n }\n```\n\n我们并没有在相加两个值，而是将它们相乘了，对于如此小的内核，我们可以立即发现这一点，但这里的重点是在我们演示工具时将其作为一个示例。现在，我们将点击\
    \ `Add Vectors` 下拉菜单左侧的播放按钮。\n\n![Figure 8.3: Start Debugging the Add Vectors\
    \ configuration](img/file73.png)\n\nFigure 8.3: 开始调试 Add Vectors 配置\n\n启动后，由于我们配置了\
    \ `\"stopAtEntry\": true`，我们将看到代码停止在 `main` 函数处等待我们的命令。\n\n![Figure 8.4: The debug\
    \ session stopped at line 34](img/file74.png)\n\nFigure 8.4: 调试会话停止在第 34 行\n\n\
    要添加断点，我们可以点击行号的左侧（`Figure 8.5`）。\n\n![Figure 8.5: Adding a breakpoint](img/file75.png)\n\
    \nFigure 8.5: 添加断点\n\n我们还有一个允许控制执行流的工具栏。选项有：`Continue`（继续）——运行代码到下一个断点；`Step Into`（步入）——进入函数调用；`Step\
    \ Over`（逐过程）——运行下一个命令而不进入函数内部；以及 `Step Out`（步出）——如果我们进入了函数调用并希望在进入的函数调用后继续执行下一行。我们还有\
    \ `Restart`（重启）和 `Stop`（停止）命令。如果需要，可以在屏幕上移动此工具栏。\n\n![Figure 8.6: The Debug toolbar\
    \ and our breakpoint at line 8](img/file76.png)\n\nFigure 8.6: 调试工具栏以及我们在第 8 行的断点\n\
    \n现在我们现在通过检查运行时的值来找出代码中的问题了。当执行到达断点处时，我们可以检查变量、单步执行代码，甚至评估表达式。由于我们在内核内部设置了断点，我们可以点击调试工具栏上的\
    \ `Continue` 按钮，我们的代码将运行到该点。\n\n![Figure 8.7: Hitting the breakpoint](img/file77.png)\n\
    \nFigure 8.7: 命中断点\n\n使用断点，我们可以通过监控运行时的值来添加观察点（watchpoints）。断点在特定行触发，而观察点在值变化时激活。要添加观察点，我们选择变量并右键点击“Add\
    \ to Watch”。\n\n![Figure 8.8: Adding a watch](img/file78.png)\n\nFigure 8.8: 添加观察点\n\
    \n此后，我们在左侧有一个 `Watch` 面板，可以看到以下：\n\n![Figure 8.9: The Watch panel with two expressions](img/file79.png)\n\
    \nFigure 8.9: 两个表达式的观察面板\n\n条件断点是另一个很好的资源。它们允许代码在满足特定条件时停止，减少干扰并帮助我们更有效地关注。在调试会话中，我们可以编辑断点将其设置为条件。\n\
    \n![Figure 8.10: Editing the breakpoint](img/file80.png)\n\nFigure 8.10: 编辑断点\n\
    \n之后，我们可以为断点输入条件表达式并回车接受。\n\n![Figure 8.11: The breakpoint expression](img/file81.png)\n\
    \nFigure 8.11: 断点表达式\n\n另一种强大的调试技术是检查**调用栈**（call stack）。当命中断点时，cuda-gdb 提供显示如何到达执行点的调用栈（Figure\
    \ 8.12）。\n\n![Figure 8.12: The debug session stopped at the breakpoint](img/file82.png)\n\
    \nFigure 8.12: 调试会话停止在断点处\n\n这种调试配置的另一个实用方面是可以可视化不同作用域的变量。VS Code 中的变量面板可以显示局部变量、全局内存内容，如果我们的代码使用了共享内存，也可以显示共享内存。\n\
    \n![Figure 8.13: The variables pane](img/file83.png)\n\nFigure 8.13: 变量面板\n\n\
    最后一个值得的资源是调试控制台（Debug Console）。\n\n![Figure 8.14: The Debug console](img/file84.png)\n\
    \nFigure 8.14: 调试控制台\n\n正如 `Figure 8.14` 所示，调试控制台显示与程序执行相关的信息。但对于大多数情况，使用断点和流控制就已经让我们的工作变得简单许多了。\n"
- fmt: "\nIn the next section we will see a remarkably interesting and powerful way\
    \ to use our GPUs. We have already explained the concept of `CUDA Streams`, but\
    \ now we’ll use them to really accelerate a real program.\n\n## Using CUDA streams\
    \ to overlay operations\n\nIn `Chapter 5` we had an introduction to CUDA streams,\
    \ but now it’s time to learn how to use them in practice! CUDA streams are a powerful\
    \ feature in NVIDIA's CUDA programming model that allow us to execute multiple\
    \ operations concurrently, increasing the throughput of GPU workloads. And this\
    \ sounds confusing because we know that GPUs have a large number of processing\
    \ cores and that is why they execute instructions concurrently, right? Well, that\
    \ is a part of the story, but we also have another level of parallelism to explore.\
    \ By properly leveraging streams, we can overlap memory transfers and kernel executions\
    \ to maximize the efficiency of the hardware. This is possible because most consumer-grade\
    \ GPUs have three asynchronous engines: one for kernel execution and two for memory\
    \ transfers (one for host-to-device and one for device-to-host). We will discuss\
    \ how to best utilize these resources given memory bandwidth limitations. \n\n\
    The key strength of CUDA streams is their ability to enable concurrent execution.\
    \ Without streams, operations are typically executed sequentially—first, data\
    \ is copied from the host (CPU) to the device (GPU), then the kernel is launched,\
    \ and finally, the results are copied back from the device to the host. This serial\
    \ execution leads to idle time where resources remain underutilized. By using\
    \ multiple streams, we can overlap these tasks so that while one data transfer\
    \ is happening, a kernel can be executing, and another data transfer (in the opposite\
    \ direction) can take place. This approach makes full use of the three available\
    \ engines, increasing throughput.\n\nTo visualize this, imagine preparing a large\
    \ meal in a busy kitchen. If only one person were cooking and they had to first\
    \ chop vegetables, then boil water, then cook the pasta, and finally make the\
    \ sauce—one step at a time—the meal would take much longer to prepare. However,\
    \ if three people worked together—one chopping ingredients, another boiling water,\
    \ and another preparing the sauce—everything would come together much faster.\
    \ CUDA streams function in an analogous way, ensuring that different tasks, like\
    \ memory transfers and kernel execution, happen simultaneously rather than sequentially,\
    \ keeping the hardware fully utilized and minimizing idle time.\n\nHowever, there\
    \ are hardware constraints that define the limits of concurrency. Most consumer\
    \ GPUs, as mentioned earlier, have three asynchronous engines, meaning that only\
    \ two memory transfers (one in each direction) and one kernel execution can happen\
    \ at the same time. If we try to enqueue more operations than the hardware can\
    \ support, they will be scheduled but will not be truly parallel, leading to performance\
    \ bottlenecks. Thus, the correct use of CUDA streams involves carefully structuring\
    \ workloads so that the available engines are always kept busy without overloading\
    \ them.\n\nAnother critical factor in optimizing CUDA streams is understanding\
    \ PCIe bus bandwidth limitations. The PCIe bus serves as the primary connection\
    \ between the CPU and the GPU, and while it provides high-speed data transfer,\
    \ it is still significantly slower than the internal memory bandwidth of the GPU.\
    \ For example, a PCIe 3.0 x16 connection has a theoretical maximum bandwidth of\
    \ about 16 GB/s, but it may be lower if we are not using a x16 slot. Meanwhile,\
    \ the internal memory bandwidth of modern GPUs can exceed hundreds of GB/s, depending\
    \ on the model. This vast difference means that data transfers over PCIe must\
    \ be carefully managed to prevent the bus from becoming a bottleneck in GPU workloads.\n\
    \nBearing that in mind, now is a suitable time for our first code discussion.\
    \ Let’s measure our memory transfer bandwidth!\n\n### Measuring our limits\n\n\
    First, we will use a simple program to understand our GPU’s memory bandwidth in\
    \ practice.\n\n```\n#include <cuda_runtime.h>\n#include <iostream>\nint main()\
    \ {\n  cudaDeviceProp prop;\n  cudaGetDeviceProperties(&prop, 0);\n  int memClockMHz\
    \ = prop.memoryClockRate / 1000;// to MHz\n  int busWidth = prop.memoryBusWidth;\
    \  // In bits\n  float bandwidthInBytes = memClockMHz * busWidth / 8;\n  float\
    \ bandwidthInGB = bandwidthInBytes / 1024; \n  float bandwidthGBs = 2.0 * bandwidthInGB;\n\
    \  std::cout << \"Mem Clock Speed: \" << memClockMHz << \" MHz\\n\";\n  std::cout\
    \ << \"Mem Bus Width: \" << busWidth << \" bits\\n\";\n  std::cout << \"Estimated\
    \ Mem Bandwidth: \" << bandwidthGBs << \" GB/s\\n\";\n  return 0;\n}\n```\n\n\
    This CUDA code retrieves GPU properties using `cudaGetDeviceProperties()` and\
    \ calculates the theoretical peak memory bandwidth. The `memoryClockRate` property,\
    \ initially given in kHz, is converted to MHz by dividing by 1000. The `memoryBusWidth`\
    \ property represents the total width of the memory interface in bits. Since modern\
    \ GPUs use GDDR (Graphics Double Data Rate) memory, the formula multiplies the\
    \ memory clock by `2.0` to account for this doubling effect. To convert the result\
    \ into a standard unit, the value is divided by 8 (to switch from bits to bytes)\
    \ and then by 1024 (to convert from MB/s to GB/s). The resulting `bandwidthGBs`\
    \ value is the GPU's theoretical peak memory bandwidth in gigabytes per second\
    \ (GB/s).\n\nThis measurement helps evaluate the GPU’s memory subsystem, which\
    \ is crucial for program performance. The calculated value represents the maximum\
    \ achievable bandwidth under ideal conditions, assuming fully efficient memory\
    \ access patterns. However, actual performance may be lower due to factors such\
    \ as memory latency, access patterns, and contention between threads.\n\nBut let's\
    \ see some execution numbers. Here are the results when running this code on my\
    \ machine:\n\n```\nMemory Clock Speed: 5501 MHz\nMemory Bus Width: 192 bits\n\
    Estimated Band Bandwidth: 257.859 GB/s\n```\n\nAlthough the theoretical memory\
    \ bandwidth on the specification says 336 GB/s for RTX2060, in real conditions\
    \ it is a little lower. But wait a minute: we mentioned that PCIe x16 has a theoretical\
    \ limit of 16 GB/s – so we would not be able to keep up with the GPU in any case.\n\
    \nLet's use another program to measure the real transfer rate that we are able\
    \ to achieve in practice. There is nothing special about this program, which uses\
    \ CUDA events to measure the time taken to complete a `cudaMemAsync` with increasing\
    \ data transfer sizes. (The full code is available in our repository.) Here are\
    \ the results:\n\n```\nSize:    1 MB, Time: 0.0915 ms, Bandwidth: 10.667 GB/s\n\
    Size:   10 MB, Time: 0.8858 ms, Bandwidth: 11.024 GB/s\nSize:   30 MB, Time: 2.6194\
    \ ms, Bandwidth: 11.185 GB/s\nSize:   50 MB, Time: 4.2118 ms, Bandwidth: 11.593\
    \ GB/s\nSize:  100 MB, Time: 8.2360 ms, Bandwidth: 11.857 GB/s\nSize:  300 MB,\
    \ Time: 24.5889 ms, Bandwidth: 11.915 GB/s\nSize:  500 MB, Time: 40.8161 ms, Bandwidth:\
    \ 11.963 GB/s\nSize: 1024 MB, Time: 83.3972 ms, Bandwidth: 11.991 GB/s\n```\n\n\
    As we can see, we are below the theoretical 16 GB/s bandwidth, and if we look\
    \ at the last row, to transfer 1 GB we must wait 83 ms. During that time the GPU\
    \ is idle, processing nothing, and here comes our strategy: split our data into\
    \ chunks, copy a little bit, start processing that while copying the next chunk\
    \ to a different memory buffer, and then when the new buffer is ready start processing\
    \ that. This is what we are going to do, and then we will use these results to\
    \ also help us determine the best transfer size to process.\n\n### Multiplying\
    \ with CUDA streams\n"
