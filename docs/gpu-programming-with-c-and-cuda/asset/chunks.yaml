- fmt: '

    With the driver version defined, we can download it directly or use the information
    with a more complete installation by following the instructions to install the
    driver. The first thing to do is update our system with the following:


    ```

    sudo apt update

    sudo apt upgrade

    ```


    To get the latest drivers, add the official Ubuntu `Personal Package Archive`
    (`PPA`) for graphics drivers:


    ```

    sudo add-apt-repository ppa:graphics-drivers/ppa

    sudo apt update

    ```


    We can then proceed to install the recommended driver that we found on the website
    using the following command:


    ```bash

    sudo apt install nvidia-driver-<version>

    ```


    In our example, it would be like this. Note that for `apt` packages, only the
    major version number is used:


    ```bash

    sudo apt install nvidia-driver-550T

    ```


    It is possible to try to auto-detect the best driver for your system. Instead
    of the previous command, you could use this:


    ```bash

    sudo ubuntu-drivers autoinstall

    ```


    Both ways are fine. Now, we have to prevent the open source driver from loading.
    We do this by editing a special file – using the `nano` CLI text editor – with
    the following command:


    ```bash

    sudo nano /etc/modprobe.d/blacklist-nouveau.conf

    ```


    And adding the following lines:


    ```

    blacklist nouveau

    options nouveau modeset=0

    ```


    After copying those lines, press `Ctrl + S` to save and `Ctrl + X` to leave the
    `nano` editor. Then, execute the following:


    ```bash

    sudo update-initramfs -u

    ```


    It is necessary to reboot our system since we need to remove the open source driver
    from memory and load the new one. We can verify that our configuration worked
    fine by using the following command:


    ```bash

    nvidia-smi

    ```


    This command will present some information about the current GPU and the process
    that is using some resources, similar to the following:


    ![Figure 2.3 – Result of nvidia-smi program execution](media/file9.png)


    Figure 2.3 – Result of `nvidia-smi` program execution


    In this section, we’ve seen how to identify the correct driver for our device
    and how to prepare Ubuntu for its installation, but this is only part of the story.
    Now we need the development tools that use the device through this driver. The
    next section will present the first path of the strategy we mentioned earlier.


    ## Docker at a glance


    If you have used `Docker` before, you may want to skip this section. If not, let''s
    stick together for a summarized overview of this technology. Dealing with multiple
    versions of libraries creates a myriad of problems and difficulties. Creating
    an isolated environment is a great alternative, and this is exactly what `Docker`
    does for us. We use `Docker images` as a controlled environment where we can have
    our own specific versions of libraries – even if they already exist on our base
    system. Another important characteristic is that it is possible to have multiple
    images for different software versions. Another concept is a `Docker container`,
    which is a running process based on a `Docker image`. When we run a `Docker container`,
    it is possible to mount a folder from the user system, and this feature allows
    us to have a development environment with all its toolkits and build source code
    from the user without having to install all the build tools directly.


    ### Pros and cons of using Docker for build


    Before we decide on which path to take, let''s find out the magnitude of the challenges
    ahead. Among the *ad infinitum* arguments about containerization technologies,
    the two most important pros and cons are listed here. Let''s start with the cons.


    #### Challenges in GPU support configuration


    Setting up GPU support in `Docker containers` involves additional configuration
    steps, which can be challenging for those unfamiliar with the process. Fortunately,
    all the steps are described in this chapter! Unlike CPU-based containers, enabling
    GPU acceleration requires the `NVIDIA Docker runtime`, which must be correctly
    installed and configured on the host system. Moreover, not all `Docker hosts`
    support GPU pass-through, which can limit the environments in which `CUDA`-based
    Docker containers can be run. This limitation can be particularly problematic
    in cloud environments or on shared infrastructure, where GPU resources might not
    be readily available or properly configured. Although it may not be a problem
    on most laptops, it is important to make sure that the host system can support
    GPU-accelerated containers, and this can require additional steps, such as verifying
    hardware compatibility and updating drivers.


    #### Challenges in debugging


    Debugging issues within a `Docker container` can be more complex than on a native
    system, which can present challenges for developers. Containers add an abstraction
    layer that can obscure the root cause of issues, making it harder to diagnose
    and resolve problems. This is particularly true if the issue is related to the
    containerization itself or to interactions between the container and the host
    system. However, as we will see in the next chapter, we can overcome this by running
    our environment inside the container with `VS Code`. Furthermore, the ephemeral
    nature of containers can complicate the debugging process. Containers are often
    designed to be stateless and can be easily recreated, which means that any changes
    or configurations made during debugging sessions can be lost when the container
    is restarted. For this reason, it may be a good idea to persist logs to mounted
    volumes; these can then be analyzed even after the container execution has terminated.
    Debugging GPU-related issues within containers adds another layer of complexity.
    GPU drivers and `CUDA libraries` need to be correctly configured and accessible
    within the container, and any misconfigurations can lead to subtle and hard-to-trace
    issues. Now, let''s consider the strengths of using this approach.


    #### The benefits of isolation


    `Docker containers` provide a highly effective way to isolate the development
    environment from the host system. This isolation ensures that the various dependencies
    required by different projects do not conflict with each other. For `CUDA`-based
    projects, this is particularly interesting because the versions of `CUDA` and
    the other libraries can be tightly controlled within the container. This isolation
    helps maintain a clean host system, free from multiple installations and potential
    version conflicts. Moreover, this container-based isolation is great for collaborative
    environments. Developers working on the same project can have identical development
    environments, eliminating the common ‘well it works on my machine’ scenario. By
    using `Docker`, every team member can use the same container image, ensuring that
    the code behaves consistently across all development setups. Another interesting
    aspect is that by running the development tools within containers, the risk of
    harmful code affecting the host system is minimized. Docker containers operate
    with restricted permissions, adding an extra layer of security by limiting the
    potential impact of security vulnerabilities within the development environment.
    The only issue we face with these restrictions is that they block the profiling
    of `CUDA` applications, but, as we will see in *Chapter 4*, it is possible to
    configure a different runtime for specific moments when we need to run the profiler.


    #### Ease of setup

