  trans: "\n我们了解到在 GPU 和 CPU 之间移动数据可能是昂昂的，并且了解到可以通过将这些操作与计算重叠来缩短数据传输所需的时间。然而，在某些情况下，我们需要在两个\
    \ GPU 处理阶段之间执行一个中间顺序步骤，此时我们必须决定是将数据移出 GPU 显存，还是将我们的顺序代码移动到 GPU 中（尽管可能无法充分利用可用资源）。\n\
    \n尽管初看起来这可能有些违反直觉，但这是一个非常合理的问题。这并不是对错问题，而是关于什么执行速度最快以及相关的代价是什么——即使这种代价是可维护性。\n\
    \n根据我们在`第 8 章`中观察到的测量结果，需要记住的一个重要点是，通常我们可以通过正确地划分数据来隐藏计算时间，即总执行时间由数据传输到 GPU 所需的时间之和决定。因为在完成第一次数据传输后，我们启动了部分计算并将部分结果从\
    \ GPU 显存拷贝出来，这两个步骤与新输入数据块的拷贝同时发生。这意味着总时间由传输数据的时间决定；其他部分都比每个数据块的传输要快。在一种朴素的方法中，我们认为认为如果总是以这种方式重叠传输和计算，可能就不会产生区别，因为当我们完成整个循环时，结果已经在主机上，可以执行顺序步骤了。这里的注意事项是，传输时间通常比计算时间`更大`；这就是为什么我们用它来隐藏计算时间。如果我们在同一个一个大矩阵上添加处理许多步骤所需的时间，我们将一直处于优化的上限边界。\n\
    \n另一方面，如果我们在第一次内存传输时使用了重叠策略，稍后又使用了`已经`存在于 GPU 显存中的数据的顺序内核函数（kernel），那么总执行时间将大于再次拷贝新版本矩阵所需的时间——即使我们使用了重叠技术。\n\
    \n当然，目前没有简单的方法可以预知总执行时间，但考虑到 CUDA 核心时钟频率的差异，以及它们分支预测能力低于 CPU，我们可以尝试估计计算给定顺序算法所需的最小时间。利用这个估计值，我们可能会决定实现一个原型，以为执行时间提供证据。\n\
    \n如果数据依赖关系允许（这在 GPU 中并不总是如此），我们可能还会使用的另一种策略是：一旦部分结果被计算并传回主机，我们立即在这些数据块上启动顺序代码。这样，我们的顺序代码将与数据的可用性同步进行。然而，这种代码的编写和维护比在\
    \ GPU 上拥有顺序版本的代码复杂得多。\n\n![图 10.2：与顺序代码交互的策略](img/file99.png)\n\n图 10.2：与顺序代码交互的策略\n\
    \n在`图 10.2` 中，我们视觉化了这三种策略以便理解。在 a) 中，我们可以清楚地看到数据带回主机执行顺序步骤的影响。如果我们正在执行向量-矩阵乘法，结果将是一个向量，其数据传输`DtoH`（从设备到主机）量较小；而如果我们正在执行矩阵乘法，那么最终结果也将是一个矩阵，这将需要更多的数据传输，从而增加执行时间。\n\
    \n在 b) 中，我们看到在 GPU 上执行代码的顺序部分。对于单个步骤，这的执行时间可能比在 CPU 上长，但整体可能更快。\n\n最后，c) 展示了我们如何重叠块，以便在\
    \ GPU 和 CPU 上同时处理数据片段，使整个计算进展得更快。然而，在这种情况下会执行更多的数据传输，这可能会影响整体执行时间。\n\n在下一节中，我们将讨论将我们的\
    \ CUDA 加速代码与解释型编程语言结合作为测试的替代方案之一的优势。另一种替代方案是在 C++ 级别进行单元测试。\n\n## 使用 GTest 和 Pytest\
    \ 测试你的代码\n\n创建代码是第一步，但在确保一切运行正常之前，我们无法交付它。为了保证这一点，建立自动化、可重复的测试是非常好的主意，这些测试将反复执行，以确保任何新更改都不会在代码中引入回归。\n\
    \n> TDD 从测试代码开始\n\n> > 使用测试驱动开发（TDD）时，我们首先创建一个调用我们代码（假设是一个函数）的测试，然后创建一个简单返回 false\
    \ 或 null 的函数版本。使用该版本运行测试时，它会失败。然后我们实现使测试通过所需的最少代码。接着我们迭代这些步骤，创建多个测试，直到我们拥有功能完全且经过测试的可信赖的代码。通过对每个代码编写许多不同的测试，我们可以覆盖不同的错误场景、边界情况和极限，从而大幅提高我们的代码质量。\n\
    \n然而，我们不需要创建示例程序来运行代码；相反，我们可以使用 Google 的 `GTest` 等测试框架来测试 C++ 代码，如果我们想测试 Python\
    \ 代码，可以使用 `Pytest`，它可以轻松添加到我们的 Python 安装中。\n\n让我们从 GTest 开始，因为我们的大部分代码都在 C++ 领域。\n\
    \n### 在我们的代码中使用 GTest\n\n我们将使用那个相加向量的简单程序作为测试的示例代码，但像`第 9 章`一样，我们的项目现在会有更复杂的结构，分为包含头文件、源代码和测试代码的独立文件夹。这将使我们的测试代码能够我们的封装函数。我们在这里重点关注测试代码，因为内核只是相加数组元素。\n\
    \n```\n#include <gtest/gtest.h>\n#include \"../include/vector_add.h\"\nTEST(VectorAddTest,\
    \ SimpleAddition) {\n   int N = 5;\n   float A[N] = {1, 2, 3, 4, 5};\n   float\
    \ B[N] = {10, 20, 30, 40, 50};\n   float C[N] = {0};\n   vectorAdd(A, B, C, N);\n\
    \   for (int i = 0; i < N; i++) {\n      EXPECT_FLOAT_EQ(C[i], A[i] + B[i]);\n\
