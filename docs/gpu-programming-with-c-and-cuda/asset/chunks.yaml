  trans: "\n\n我们的本地共享内存有限，因此我们必须从全局内存中选择一些元素。此外，我们必须记住，在全局内存中，矩阵是以连续数组存储的，因此我们必须计算给定元素的实际索引。我们可以根据每行的起始位置（由\
    \ `row * n` 提供）来计算位置，一旦找到了起始位置，就通过 `i * blockDim.x + tx` 找到我们想要拷贝的当前元素。记住 `tx`\
    \ 是我们该线程的索引，而 `i` 会不断增加，直到达到矩阵限制 `n/blockDim.x` 为止。（在这里为了清晰起见，我们简化了限制条件，但实际代码是以我们熟悉的方式对其进行除法，以确保得到的值大于或等于宽度的倍数）。\n\
    \n这意味着什么呢？所有这些计算允许线程访问全局内存中的不同位置（记住 `tx` 是不同的！），由于我们通过将 `i` 乘以 `blockDim.x` 来找到我们正在加载的块（tile），这就像是在一幅非常长的图画上移动相机并拍摄快照。非常聪明，对吧？\n\
    \n我们使用相同的方法来填充本地子矩阵 `B`，因此不再需要讨论这些计算。\n\n在加载第一组块后，我们需要确保所有线程都完成了它们的工作，因此我们发出了\
    \ `__syncthreads()` 命令让它们全部汇合。之后，我们就知道可以进行计算了，因为共享内存已经填充完毕。\n\n我们接下来将使用另一个 `for`\
    \ 循环，让每个线程处理计算的一部分。我们不需要担心，因为 `sum` 变量是每个线程局部的，所以会有多个变量在运行，每个变量都存储结果矩阵中给定元素的部分和。在主循环的每次迭代中，`sum`\
    \ 变量将多增加一个部分和，直到得到最终结果。\n\n一旦处理完所有的块，我们的线程会将结果保存到全局内存，只要 `row` 和 `col` 的值在矩阵宽度\
    \ `n` 的边界内。\n\n在完成这些更改后，我们需要重新编译代码，但首先我们需要通过使用以下命令回到 Debug（调试）配置：\n\n```\ncmake\
    \ -DCMAKE_BUILD_TYPE=Debug ..\n```\n\n然后再次使用以下命令构建应用程序：\n\n```bash\nmake\n```\n\
    \n现在，让我们用性能分析器分析这个版本的代码，在 NVidia Nsight Compute 中点击项目并再次点击 `Launch` 按钮。我们可以在图\
    \ 7.30 中看到当前的会话。\n\n![Figure 7.30: Summary for shared memory kernel](img/file52.png)\n\
    \nFigure 7.30: Summary for shared memory kernel\n\n注意，执行这个版本的时间比朴素（naive）版本要长。这看起来可能很奇怪，但这是因为我们在\
    \ Debug 模式下编译。然而，我们可以看到寄存器的数量增加了，说明优化正在进行中！\n\n接下来，让我们看看图 7.32 中的 Roofline（顶线模型）图。\n\
    \n![Figure 7.31: Roofline for the shared memory kernel](img/file53.png)\n\nFigure\
    \ 7.31: Roofline for the shared memory kernel\n\nRoofline 图给了我们另一个惊喜，因为新版本的性能低于原始的朴素实现。较高的圆是\
    \ release（发布）版本，稍低一点的是我们当前的 debug 模式版本，而之间是朴素实现。然而，我们注意到内存图（Memory Chart）发生了剧烈变化，如图\
    \ 7.32 所示。\n\n![Figure 7.32: Memory chart for shared memory kernel](img/file54.png)\n\
    \nFigure 7.32: Memory chart for shared memory kernel\n\n我们注意到，许多直接对全局内存的访问现在集中在共享内存上，而共享内存要快得多。在这里值得停下来考虑一下。当我们从全局内存预取数据时，似乎并不值得费力处理共享内存，因为我们无论如何都要访问全局内存。但是，这里有一个陷阱。由于我们将数据加载到共享内存中，我们需要为矩阵的每个元素先从全局内存进行加载，但对于随后的计算——记住对于每一行我们都要对所有列进行计算——数据已经存在于共享内存中了，这极大地提升了我们的访问速度。注意在我们的内存图中，大多数访问被重定向到了这个块中。\n\
    \n如果我们查看占用率（Occupancy），会注意到变化还包括更多寄存器的使用以及共享内存的使用，正如图 7.33 所示。\n\n![Figure 7.33:\
    \ Occupancy for shared memory kernel](img/file55.png)\n\nFigure 7.33: Occupancy\
    \ for shared memory kernel\n\n通过使用 Debug 配置，在考虑执行时间时，我们似乎并没有改进，但我们必须考虑我们应用优化的所有维度才能理解细节。\n\
    \n接下来，让我们展开部分和计算循环，以进一步改进性能。\n\n### 使用循环展开进行进一步改进\n\n循环展开（Loop unrolling）是一种扩展循环内执行的计算的技术，以便应用程序能够从更好的寄存器利用和更多指令的并行化中获益。然而，手动这样做可能会令人困惑，因此我们将依靠编译器指令让编译器为我们完成工作。让我们来看代码。\n\
    \n```cpp\n#pragma unroll\nfor (int k = 0; k < blockDim.x; k++) {\n    sum += Asub[ty][k]\
    \ * Bsub[k][tx];\n}\n```\n\n这里新的是使用了 `#pragma unroll`，它要求编译器为我们进行展开。\n\n现在我们不需要再次执行\
    \ CMake，但我们需要通过 `make` 命令构建应用程序。\n\n在图 7.34 中，我们看到了不同版本的总结，它们都是 Debug 配置。\n\n\
    ![Figure 7.34: Summary for shared memory kernel](img/file56.png)\n\nFigure 7.34:\
    \ Summary for shared memory kernel\n\n按照流程，我们将查看 Roofline 图（图 7.35）。\n\n![Figure\
    \ 7.35: Roofline for shared memory kernel](img/file57.png)\n\nFigure 7.35: Roofline\
    \ for shared memory kernel\n\n当前会话在性能上与上一个相同，但记住我们处于 Debug 配置中，这限制了优化的效果。\n\n\
    下一站是图 7.36 显示的内存图，我们在这里注意到它与图 7.32 没有太大区别。\n\n![Figure 7.36: Memory chart for\
    \ shared memory kernel](img/file58.png)\n\nFigure 7.36: Memory chart for shared\
    \ memory kernel\n\n转向占用率，我们发现正如预期的，它与之前相同，因为我们没有更改共享内存的数量或寄存器的数量。\n\n![Figure\
    \ 7.37: Occupancy for shared memory kernel](img/file59.png)\n\nFigure 7.37: Occupancy\
    \ for shared memory kernel\n\n每一个优化周期都会引导我们通过相同的步骤，我们必须注意工具提供的提示和建议。现在我们使用了共享内存并展开了循环，可以关注另一个进一步的建议。在指令统计中，工具提到我们没有利用融合指令（fused\
    \ instructions）（见图 7.38）。\n\n![Figure 7.38: A new recommendation for shared memory\
    \ kernel](img/file60.png)\n\nFigure 7.38: A new recommendation for shared memory\
    \ kernel\n\n融合指令是一种特殊的指令，能够共同执行乘法和加法。这提升了整体性能，我们将在下一节中讨论。\n\n"
- fmt: "\nOne common example is the fused multiply-add (`FMA`) instruction. This operation\
    \ performs a multiplication and an addition in one step. The key advantage of\
    \ `FMA` is that it avoids intermediate rounding between multiplication and addition\
    \ steps. This means the operation is not only faster (since it uses a single instruction)\
    \ but also more precise, as it reduces the accumulation of rounding errors. In\
    \ essence, `FMA` allows the GPU to maximize its computational efficiency and accuracy,\
    \ making it a critical tool for high-performance tasks.\n\nOur code change is\
    \ simple this time.\n\n```\n #pragma unroll\n     for (int k = 0; k < blockDim.x;\
    \ k++) {\n         sum = fmaf(Asub[ty][k], Bsub[k][tx], sum);\n     }\n```\n\n\
    Again we don’t need to perform the `CMake` configuration, but we need to build\
    \ the application by using the `make` command as before.\n\nIn *Figure 7.39* we\
    \ can see the summary comparison of our versions, all of them now in Debug configuration.\n\
    \n![Figure 7.39: Summary for fused instructions kernel](media/file61.png)\n\n\
    Figure 7.39: Summary for fused instructions kernel\n\nWe notice that the number\
    \ of registers used has increased and the time has also increased, which was not\
    \ expected – but again we are in Debug mode.\n\n*Figure 7.40* shows the Roofline\
    \ chart.\n\n![Figure 7.40: Roofline for fused instructions kernel](media/file62.png)\n\
    \nFigure 7.40: Roofline for fused instructions kernel\n\nThe current session is\
    \ slightly below the previous ones, but again this is related to use of the Debug\
    \ configuration.\n\nNext, we analyse our Memory Chart (*Figure 7.41*).\n\n![Figure\
    \ 7.41: Memory Chart for fused instructions kernel](media/file63.png)\n\nFigure\
    \ 7.41: Memory Chart for fused instructions kernel\n\nOur change did not result\
    \ in any specific improvements in memory usage, but it did not worsen things either.\n\
    \nNow let’s check the Occupancy, in *Figure 7.42*.\n\n![Figure 7.42: Occupancy\
    \ for fused instructions kernel](media/file64.png)\n\nFigure 7.42: Occupancy for\
    \ fused instructions kernel\n\nWhat we notice is that the number of registers\
    \ has increased because the fused instruction makes better use of them.\n\nNow\
    \ that we have used all our strategies, let’s put everything together and use\
    \ the Release configuration.\n\n### Putting it all together with Release configuration\n\
    \nNow we do not need to change any code, but we need to reconfigure our project\
    \ with the following command:\n\n```\ncmake -DCMAKE_BUILD_TYPE=Release ..\n```\n\
    \nAfter that we run `make` and execute the profiler again. The results can be\
    \ seen in *Figure 7.43*. Notice that the time has decreased from 47.33 milliseconds\
    \ to 33.37 milliseconds, which is approximately a 42% improvement by using the\
    \ correct strategies. It shows why we needed to compare with the naive version\
    \ using the Release configuration as well: it validates the idea that simply using\
    \ compiler optimizations is not enough to maximize the use of our hardware resources.\n\
    \n![Figure 7.43: Summary for the kernel in Release version with all optimizations](media/file65.png)\n\
    \nFigure 7.43: Summary for the kernel in Release version with all optimizations\n\
    \nOur Roofline Chart (*Figure 7.44*) shows that our current session has a greater\
    \ throughput than the previous one.\n\n![Figure 7.44: Roofline for the kernel\
    \ in Release version with all optimizations](media/file66.png)\n\nFigure 7.44:\
    \ Roofline for the kernel in Release version with all optimizations\n\nLet’s check\
    \ the Memory Chart too (*Figure 7.45*).\n\n![Figure 7.45: Memory Chart for the\
    \ kernel in Release version with all optimizations](media/file67.png)\n\nFigure\
    \ 7.45: Memory Chart for the kernel in Release version with all optimizations\n\
    \nWhen we compare with the previous version we can see the use of shared memory\
    \ as expected. Next let’s analyse our Occupancy (*Figure 7.46*).\n\n![Figure 7.46:\
    \ Occupancy for the kernel in Release version with all optimizations](media/file68.png)\n\
    \nFigure 7.46: Occupancy for the kernel in Release version with all optimizations\n\
    \nOur current version is using 25 registers and the same shared memory that was\
    \ already in place from the Debug version.\n\nJust for comparison, let’s have\
    \ all our versions together on the same Roofline Chart (*Figure 7.47*).\n\n![Figure\
    \ 7.47: Roofline for all versions together](media/file69.png)\n\nFigure 7.47:\
    \ Roofline for all versions together\n\nWe can see the significance of using compiler\
    \ flags, together with specific algorithms and code structures, for getting the\
    \ most from our hardware.\n\n## Summary\n\nIn this chapter we have worked our\
    \ way through a variety of optimization strategies, as well as the use of the\
    \ graphical profiler that is available in the CUDA toolkit. This is an essential\
    \ tool to help attack the hot spots in our kernels so that we use our time as\
    \ effectively and efficiently as possible.\n\nIn the next chapter we will learn\
    \ another strategy to accelerate our code: overlaying memory transfers with kernel\
