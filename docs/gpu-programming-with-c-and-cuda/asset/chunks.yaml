    Notice that the time to copy data was very high when compared to the time needed
    to sort the entire vector. Also, here we are considering the times necessary to
    copy data into the `GPU` memory and back to the host. Data transfer times are
    almost the same as the time needed to perform the sorting itself. Although the
    total time required to sort on the GPU, even when we consider the data transfer
    times, is still very much faster than the single threaded CPU version from the
    STL. However, bear in mind that the comparison presented on Thrust''s website
    ([https://developer.nvidia.com/thrust](https://developer.nvidia.com/thrust)),
    where we may find documentation and examples, does not consider a single-threaded
    version; instead the comparison is with the Threading Building Blocks (TBB) library
    from Intel and it does not take into account this huge amount of time necessary
    to transfer data. This is something that we always must pay attention to when
    reading the specifications of the libraries that we are thinking about using.


    In the next section we will discuss when it makes sense to write our own kernels,
    given that there are libraries already packed and ready to help us.


    ## Writing your own code


    Creating GPU-accelerated programs is different from sequential CPU code, but there
    is an interesting software engineering aspect that is constant in both worlds:
    we must consider when we should write our own code and when to use an existing
    library. In large, enterprise-level, projects we try to avoid reinventing the
    wheel as much as possible, for many reasons. One of them we already discussed
    on the previous section: a library tends to have a dedicated team that is specialized
    in the library’s domain. This means that its `business` is the library, while
    most of the time our business is an application for a specific case that will
    make use of the library to achieve our results. Another reason is that when we
    decide to create code that competes with libraries we may take on responsibility
    for maintaining that code, and our ability to discharge that responsibility effectively
    can be affected by many factors. We may have less time to correct a specific bug
    than is needed, or the original author may leave our team, and these kinds of
    risk can directly translate into higher costs.


    This does not mean that we should always chose to use libraries blindly. Although
    CUDA libraries are optimized and offer high performance, they are general-purpose
    implementations that may not immediately fit our specific problems. We have to
    analyze our problem to uncover the details relevant to determining the best solution.
    To give a specific example, let''s say that we need to compute the multiplication
    of matrices of complex numbers that are compounds of two 64-bit floating point
    values, one for the real part and the other for the imaginary part. This problem
    can be solved by `cuBLAS`, but due to its data representation the performance
    is much slower than if we were using 32-bit floating point values. Assuming we
    could use the single-precision version, that would affect the numeric precision
    of our entire solution, because the values would need to be defined as single
    precision when the matrices were first filled. This a very simple example, but
    it illustrates the kind of problem we have to think about.


    We must also take into account the fact that many libraries are proprietary code
    from Nvidia. This means that we cannot simply change the code: we have to conform
    with certain formats. An example from the previous section was that when using
    `cuBLAS` we had to transpose the result of the multiplication. It could be argued
    that that will be the case with most `BLAS` libraries, but it doesn’t change the
    fact that it affects our data. And to explore the example of complex numbers from
    the last paragraph a little further, having to cast each single element from a
    double-precision floating-point matrix during access will affect the effectiveness
    of memory operations as well as waste a lot of memory space. And even then it
    would only work with a custom kernel, because `cuBLAS` uses different implementations
    for single- and double-precision floating-point numbers, as well as for single-
    and double-precision complex numbers – which are themselves based on the single-
    and double-precision floating-point numbers respectively.


    One could argue that we could typecast the entire matrix, but that would make
    the `cuBLAS` function use only a part of each number, and the second half would
    be considered as a new number, resulting in the production of garbage results.
    This is because a double-precision floating-point number uses eight bytes, whereas
    a single-precision floating-point number uses four bytes; meaning that when we
    type-cast a `double` to a `float` half the number is discarded. But if we consider
    that one double-precision number occupies the space of two single-precision numbers,
    the access to the second position of an array that was type-cast would be the
    second half of the initial number, instead of the first half of the second number.
    Let''s use a diagram to help make sense of things:


    ![Figure 10.1 - Memory layout for double and float numbers](media/file98.png)


    Figure 10.1 - Memory layout for double and float numbers


    As we can see in `Figure 10.1` what we would get at index 1 by seeing the position
    as a float would be the remaining bytes from position 0 if it was still a double.


    To overcome this problem, we could type-cast each element, one by one, from the
    original matrix to a new one, but it would extend the overall execution time,
    which could in turn remove the benefit of using an optimized library at all!


    But this does not mean there can be no guidelines on what to do in this type of
    situation. We can ask ourselves whether we are creating a new algorithm with its
    own new data structures, which demands more fine-grained control over memory accesses,
    `or` whether we are creating an application that needs accelerated versions of
    well-established numerical methods. This should be the first level of decision.
    Let''s say we’ve figured out that we simply need existing numerical methods, so
    we decide to use the existing libraries. Then comes the second-level question:
    are we spending more time trying to accommodate our data into a format that fits
    the existing libraries than actually solving our problem? If the answer is yes,
    we should consider creating our own kernel, even knowing that it won’t be the
    most hardware-optimized version of the code, because at the end of the day, although
    execution time matters, the total development time also has to be considered.


    Fortunately, we have by now – since we have reached our last chapter – developed
    the techniques necessary not only for creating our custom kernels, but have also
    learnt what it takes to profile and debug our code to help figure out what we
    can do to improve our bottlenecks.


    However, no one said we are forbidden to use a mixed approach. If our objective
    is to create a new program that can be decomposed in terms of existing numerical
    methods and new algorithms, we may try to use the best of both worlds. We can
    use streams to overlay memory transfers with calls to `cuBLAS`, provided we keep
    track of which parts of our data structures have already been copied.


    It is a very good idea to separate calls to existing libraries and calls to custom
    code in different modules, so that we do not lose track of what is responsible
    for each computation stage.

