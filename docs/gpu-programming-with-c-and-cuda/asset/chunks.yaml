    We have learned many concepts and techniques for creating CUDA programs, and we
    have already seen some performance improvements in our small examples. However,
    simply converting a program to run on the GPU may not yield the desired speed-up,
    and indeed it may incur costs that are at odds with expectations. One example
    is the time needed to load data to the GPU memory. Use the right strategies, however,
    and you can overcome these problems.


    In this chapter we revisit our old friend matrix multiplication, and discuss some
    ways to improve its performance. But most importantly, we’ll investigate *why*
    the changes we make help to improve performance. Along the way we shall cover
    the following topics:


    * Introducing optimization

    * Profiling with NVidia Nsight Compute


    ## Technical requirements


    We will use the environment configured during `Chapter 3` with VS Code and our
    development container. If you have chosen to install the CUDA Toolkit on your
    machine, you can simply run the build commands on a terminal. We will also use
    a new tool called `Nvidia Nsight Compute` to profile our code, which is a GUI-based
    tool available both in our container as well as on the local installation. The
    official documentation can be found at [https://docs.nvidia.com/nsight-compute/index.html](https://docs.nvidia.com/nsight-compute/index.html).
    All the code for this chapter is provided in the GitHub repository.


    ## Introducing optimization


    When we go through official documentation it is easy to feel lost or overwhelmed
    by the information about different hardware architectures. Every new GPU release
    brings hardware innovations that affect the way we need to write our code, and
    knowing our hardware is of paramount importance if we are to squeeze out every
    last drop of performance. Furthermore, knowing the details of our hardware brings
    to light the limitations we may have in terms of memory bandwidth, available memory,
    and clock speed.


    It is also our responsibility to gauge the effort needed to achieve greater performance,
    and that is when using a profiler is a great advantage, for it enables us to figure
    out what the best items are to optimize. Code optimization may lead to code that
    is harder to read, because we need to deal with many more hardware details, but
    that does not mean that the code will be impossible to maintain. We just need
    to be careful and follow some software engineering best practices to compensate
    for the added complexity.


    In `Chapter 6` we learned about a simple matrix multiplication kernel which already
    performed better than a single-thread CPU version, but the time needed to load
    data impacts total execution time. We are now going to revisit our matrix multiplication
    kernel and apply some optimizations. This is the perfect example in which to study
    their effects because while it is one of those embarrassingly parallel problems,
    the techniques we are about to discuss will also apply to other scenarios.


    > **Debug versus Release compilation flags**


    > The instructions we pass to our compiler are fundamental to the type of code
    that will be generated for us. In CMake we can define different configurations
    that determine how the configuration generator prepares our environment. We are
    using Makefile, which is a single configuration generator, and this means that
    to change from Debug to Release, and back again if necessary, we have to execute
    the CMake configuration step again. We will see this command in detail in the
    section *Optimizing to speed up our code*, where we will be applying the optimizations.


    Nevertheless, before jumping into the optimizations, it will be of immense value
    to learn how to measure what is going on with our code. That way we can compare
    what we have with what we may achieve by applying changes to the code. In `Chapter
    4` we used NVidia Nsight Compute from the command line, which does not allow interactive
    sessions, but now we will use its graphical interface to learn more about our
    code. So let’s get to know our new tool, the NVidia Nsight Compute Graphical Interface.


    ## Profiling with NVidia Nsight Compute


    We are currently working in a lab-like environment where all our programs for
    the book are small, and most of the time they have a single kernel that relates
    to the technique we are learning about. However, in real-world programs we will
    face situations in which many distinct functions interact with each other, passing
    their results forward to achieve results for our users. In such scenarios, the
    use of profiling tools becomes fundamental to identifying the hot spots where
    we should concentrate our time-saving efforts!


    Optimizing code without proper information can make us spend too much time on
    a piece of code that is rarely executed. Such blind optimization can unfold in
    many ways, but one possible result is that after applying various optimizations
    we find no improvement at all. It is important to use tools that help us identify
    where the bottlenecks really are.


    To execute the tool we use the following command on the terminal of our VS Code
    session (which is connected to our development container):


    ```

    ncu-ui

    ```


    This will open a separate window, as seen in *Figure 7.1*.


    ![Figure 7.1: The Welcome screen](media/file23.png)


    Figure 7.1: The Welcome screen


    Here we can create a `New Project` to analyze our code, as we can see in *Figure
    7.2*.


    ![Figure 7.2: New Project option](media/file24.png)


    Figure 7.2: New Project option


    After clicking `New Project` we will be presented with a dialog, shown in *Figure
    7.3*, in which to enter the name of the project and select the folder in which
    it will be created.


    ![Figure 7.3: Creating the project folder](media/file25.png)


    Figure 7.3: Creating the project folder


    Here we have selected to create this inside our Chapter 7 folder from the book
    repository, but we may choose any location we see fit. After clicking the `OK`
    button we will be prompted to configure the project, as shown in *Figure 7.4*.


    ![Figure 7.4: Application executable and report name](media/file26.png)


    Figure 7.4: Application executable and report name


    Here we must pay attention to several points. First, we have to select the platform
    in which we are working; our selection is `Linux x86_64`. The connection is selected
    as `localhost`, but in advanced scenarios we might connect to a remote host.


    The next item to select is the `Application Executable`, and note that we are
    using the build folder where our projects create the executables. The last item
    to edit on this screen is the report name (`Output File`), and here we use `report%i`
    so that each profiling session generates a new report file, with `%i` being substituted
    by the number of the execution. Notice that the report name is configured on the
    `Profile` tab of the `Activity` panel, but before we run a specific profiling
    session we will change to the `System Trace` tab on the `Activity` panel as shown
    in *Figure 7.5*. This option allows us to run the application and have the tool
    trace the application. We do not need to change any other options for now; simply
    click the `Launch` button.


    ![Figure 7.5: The system trace](media/file27.png)


    Figure 7.5: The system trace


    After the trace execution we will see the analysis shown in *Figure 7.6* (the
    image was split in the middle to fit it onto the page).


    ![Figure 7.6: System trace timeline (broke down for visualization)](media/file28.png)


    Figure 7.6: System trace timeline (broke down for visualization)


    Here we have a lot of information, but the main items of interest are under the
    `CUDA HW` block on the left-hand side of the window. When we expand this item
    we see a section for kernel execution and another for memory operations. Our code
    first copies the matrices from the host system to the device, so we will see two
    `Memcpy` operations with `HtoD` marked, as shown in *Figure 7.7*.

