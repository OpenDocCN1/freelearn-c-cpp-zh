- fmt: "\nWe learned that moving data to and from the GPU can be costly, and we learned\
    \ that we can overlay those actions with computation to decrease the time taken\
    \ to transfer data. However, there are times when we need to perform an intermediate\
    \ sequential step between two GPU processing phases and we have to decide whether\
    \ to move data out of GPU memory or whether we are going to move our sequential\
    \ code into the GPU, even though it will not fully utilize the available resources.\n\
    \nAlthough it may seem a little counterintuitive at first, this is a very legitimate\
    \ question to ask. It is not a matter of right or wrong, but rather of what will\
    \ execute fastest and what the associated cost is – even if the cost is maintainability.\n\
    \nOne important thing to keep in mind, based on the measurements we observed in\
    \ `Chapter 8`, is that typically we can hide the computation time by correctly\
    \ partitioning the data, in that the total execution time was given by the sum\
    \ of the times needed to transfer the data to the GPU. This is because after completing\
    \ the first data transfer we started a partial computation and a copy of partial\
    \ results out of the GPU memory, and those two steps occurred simultaneously with\
    \ the copying of a new input chunk. This means that the total time is dominated\
    \ by the time required to transfer data in; the other parts are faster than each\
    \ chunk transfer. In a naive approach we could argue that it would not make a\
    \ difference if we could always overlay transfers and computation that way, because\
    \ by the time we completed the full cycle the results would be on the host already\
    \ to perform the sequential step. The caveat here is that transfer time is usually\
    \ `larger` than compute time; that is why we use it to hide computation times.\
    \ If we add the times necessary to process many steps over the same large matrix\
    \ we would always be at the top boundary of our optimization.\n\nOn the other\
    \ hand, if we used the overlaying strategy for the first memory transfer, but\
    \ later we used a sequential kernel with data that was `already` in GPU memory,\
    \ the total execution time would need to be larger than the time required to copy\
    \ a new version of the matrix again – even if we used overlaying.\n\nOf course\
    \ that there is no simple way to know the total execution time upfront, but considering\
    \ the difference in clock speed for CUDA cores and that they have less branch\
    \ prediction power than the CPU we could try to estimate what would be the minimum\
    \ amount of time required to compute a given sequential algorithm. Using this\
    \ estimate we might decide to implement a prototype that would provide evidence\
    \ of the execution time.\n\nAnother strategy we might use if data dependencies\
    \ allow, which is not always the case with GPUs, is that as soon as the partial\
    \ results are calculated and transferred back to the host, we start our sequential\
    \ code on those chunks of data. That way our sequential code will proceed in lock\
    \ step with the availability of data. However, this code is much more complex\
    \ to write and maintain than having a sequential version of the code on the GPU.\n\
    \n![Figure 10.2: The strategies for interacting with sequential code](media/file99.png)\n\
    \nFigure 10.2: The strategies for interacting with sequential code\n\nIn `Figure\
    \ 10.2` we have the three strategies represented visually for easier comprehension.\
    \ In a) we can see clearly the impact that bringing data back to the host for\
    \ a sequential step will have. If we are performing a vector-matrix multiplication\
    \ the result will be a vector that is lighter on data transfer `DtoH` (Device\
    \ to Host), whereas if we are performing a matrix multiplication then the final\
    \ result will also be a matrix, which will demand more of the data transfer and\
    \ hence the execution time will be increased.\n\nIn b) we see execution of the\
    \ sequential part of the code on the GPU. This may take longer to execute than\
    \ on the CPU for the individual step but may be faster overall.\n\nFinally, c)\
    \ demonstrates how we could overlap blocks in order to process pieces of data\
    \ on the GPU and the CPU at the same time, making the whole computation move forwards\
    \ faster. However, in this case many more data transfers are performed and that\
    \ could affect the overall execution time.\n\nIn the next section we will discuss\
    \ the benefits of using our CUDA-accelerated code with interpreted programming\
    \ languages as one of the alternatives for testing. The other alternative is unit\
    \ testing at the C++ level.\n\n## Testing your code with GTest and Pytest\n\n\
    Creating our code is the first part, but we cannot deliver it until we’ve made\
    \ sure that everything is working properly. To guarantee this it is a very good\
    \ idea to have automated, repeatable tests in place that will execute again and\
    \ again to make sure that any new changes do not introduce regressions into our\
    \ code.\n\n> TDD starts with the test code\n\n> > When using test-driven development,\
    \ we first create a test that calls our code, let's say a function, and then we\
    \ create a version of the function that simply returns false or null. With that\
    \ version, we run the test and it will fail. Then we implement the minimum amount\
    \ of code necessary to make the test pass. We then iterate these steps, creating\
    \ multiple tests, until we have fully functional and tested code that we can rely.\
    \ With many different tests for each piece of code we can cover different error\
    \ scenarios, corner cases and boundaries, drastically increasing our code quality.\n\
    \nHowever, we don't need to create sample programs to run our code; instead we\
    \ can use test frameworks like `GTest` from Google for testing C++ code, and if\
    \ we want to test Python code we can use `Pytest`, which can be easily added to\
    \ our Python installation.\n\nLet's start with GTest, since most of our code has\
    \ been in the realm of C++.\n\n### Using GTest with our code\n\nWe will be using\
    \ our simple program that adds vectors as the example code for testing, but as\
    \ in `Chapter 9`, our project will now have a bit more structure, with separate\
    \ folders for an include file, the source code and the test code. This will enable\
    \ our test code to know about our wrapper function. We will focus here on the\
    \ test code, since the kernel is simply adding the elements from input arrays.\n\
    \n```\n#include <gtest/gtest.h>\n#include \"../include/vector_add.h\"\nTEST(VectorAddTest,\
    \ SimpleAddition) {\n   int N = 5;\n   float A[N] = {1, 2, 3, 4, 5};\n   float\
    \ B[N] = {10, 20, 30, 40, 50};\n   float C[N] = {0};\n   vectorAdd(A, B, C, N);\n\
    \   for (int i = 0; i < N; i++) {\n      EXPECT_FLOAT_EQ(C[i], A[i] + B[i]);\n\
    \   }\n}\n```\n\nFully comprehensive documentation for GTest can be found here:\
    \ [https://github.com/google/googletest](https://github.com/google/googletest).\
    \ Since our interest is in how to use it together with our GPU code we will not\
    \ deep dive into its features, but instead will look at how the calls reach our\
    \ GPU device.\n\nIn this code we use the `TEST` macro to define a test case. The\
    \ first argument is the name of the test suite and the second argument is the\
    \ name of the test case. Up until this point nothing really happened in terms\
    \ of testing; what we need to do is validate the result of our function call with\
    \ some other values that we know to be true.\n"
