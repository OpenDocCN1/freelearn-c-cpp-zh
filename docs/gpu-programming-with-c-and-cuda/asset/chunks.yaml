    定义驱动程序版本后，我们可以直接下载它，或者按照安装驱动程序的说明结合信息进行更完整的安装。首要工作是使用以下命令更新系统：


    ```

    sudo apt update

    sudo apt upgrade

    ```


    为了获取最新驱动程序，请添加显卡驱动的官方 Ubuntu `个人软件包存档` (`PPA`)：


    ```bash

    sudo add-apt-repository ppa:graphics-drivers/ppa

    sudo apt update

    ```


    然后我们可以使用以下命令安装在网站上找到的推荐驱动：


    ```bash

    sudo apt install nvidia-driver-<version>

    ```


    在我们的示例中，它应该是这样的。注意，对于 `apt` 软件包，仅使用主版本号：


    ```bash

    sudo apt install nvidia-driver-550T

    ```


    你可以尝试自动检测适用于系统的最佳驱动程序。可以使用此命令代替之前的之前的命令：


    ```bash

    sudo ubuntu-drivers autoinstall

    ```


    两种方法都可以的。现在，我们必须防止开源驱动程序的加载。我们通过编辑一个特殊文件——使用 `nano` CLI 文本编辑器——来实现这一点，命令如下：


    ```bash

    sudo nano /etc/modprobe.d/blacklist-nouveau.conf

    ```


    并添加以下行：


    ```

    blacklist nouveau

    options nouveau modeset=0

    ```


    复制这些行后，按 `Ctrl + S` 保存并按 `Ctrl + X` 退出 `nano` 编辑器。然后执行以下操作：


    ```bash

    sudo update-initramfs -u

    ```


    我们需要重启系统，因为需要从内存中移除开源驱动并加载新驱动。我们可以使用以下命令验证配置是否正常：


    ```bash

    nvidia-smi

    ```


    此命令将显示有关当前 GPU 以及正在使用某些资源的进程的信息，如下：


    ![图 2.3 – nvidia-smi 程序执行结果](img/file9.png)


    图 2.3 – `nvidia-smi` 程序执行结果


    在这一节中，我们学习了如何为设备识别正确的驱动程序以及如何为安装准备 Ubuntu 准备，但这只是故事的一部分。现在我们需要通过该驱动程序使用该设备的开发工具。下一节将介绍我们之前提到的策略的第一条路径。


    ## Docker 概览


    如果你以前使用过 `Docker`，可能想跳过这一节。如果没有，请留下来，我们一起对这项技术进行总结概述。处理多个版本的库会产生无数问题和困难。创建一个隔离环境是一个极佳的替代方案，这正是
    `Docker` 为我们做的事情。我们使用 `Docker 镜像` 作为受控环境，在其中我们可以拥有特定版本的库——即使这些库已经存在于基础系统中。另一个重要特性是可以为不同的软件版本拥有多个镜像。另一个概念是
    `Docker 容器`，它是基于 `Docker 镜像` 的运行进程。当我们运行 `Docker 容器`时，可以从用户系统挂载一个文件夹，此功能允许我们拥有一个包含所有工具包并能从用户处构建源代码的开发环境，而无需直接安装所有构建工具。


    ### 使用 Docker 进行构建的优缺点


    在决定采取哪条路径之前，让我们了解面前面临的挑战程度。在关于容器化技术的*无休止*的争论中，这里列出了最重要的两个优点和缺点。让我们从缺点开始。


    #### GPU 支持配置中的挑战


    在 `Docker 容器` 中设置 GPU 支持涉及额外的配置步骤，对于不熟悉该流程的人来说可能具有挑战性。幸运的是，本章描述了所有步骤！与基于 CPU 的容器不同，启用
    GPU 加速需要 `NVIDIA Docker runtime`，它必须在宿主机上正确安装和配置。此外，并不是所有的 `Docker 主机` 都支持 GPU
    透传，这可能会限制基于 `CUDA` 的 Docker 容器运行的环境。这种限制在云环境或共享基础设施上可能特别成问题，因为那里的 GPU 资源可能无法直接可用或未被正确配置。尽管在大多数笔记本电脑上这可能不是问题，但确保宿主机支持
    GPU 加速容器至关重要，这可能需要额外的步骤，例如验证硬件兼容性和更新驱动程序。


    #### 调试中的挑战


    在 `Docker 容器` 内调试问题可能比在原生系统上更复杂，这会给开发者带来挑战。容器增加了一个抽象层，可能会掩盖问题的根源，使得诊断和解决问题变得困难。如果问题与容器化本身或容器与宿主机之间的交互有关，情况尤其如此。但正如我们在下一节中看到的，我们可以通过在容器内使用
    `VS Code` 运行环境来克服这一点。此外，容器的临时可能会使调试过程。容器通常被设计为无状态，并且很容易重新创建，这意味着在调试期间完成的任何更改或配置都会在容器重启时丢失。因此，将日志持久化到挂载卷中可能是一个好主意；这样即使容器执行结束后也可以对其进行分析。在容器内调试
    GPU 相关问题增加了另一层复杂度。GPU 驱动程序和 `CUDA 库` 需要在容器内正确配置并可访问，任何配置错误都可能导致微妙且难以追踪的问题。现在，让我们考虑使用这种方法的优势。


    #### 隔离的益处


    `Docker 容器` 提供了一种非常有效的方法，将开发环境与宿主机隔离开。这种隔离确保了不同项目所需的各种依赖项不会相互冲突。对于基于 `CUDA` 的项目，这特别有趣，因为
    `CUDA` 和其他库的版本可以在容器内被严格控制。这种隔离有助于保持宿主机系统的整洁，避免出现多次安装和潜在的版本冲突。此外，这种基于容器的隔离对于协作环境非常友好。工作同一个项目的开发者可以拥有相同的开发环境，消除了常见的“在我的机器上是好好的”这种场景。通过使用
    `Docker`，每个团队成员可以使用相同的容器镜像，确保代码在所有开发设置中行为一致。另一个有趣的方面是，通过在容器内运行开发工具，有害代码影响宿主机系统的风险降到了最低。Docker
    容器在受限权限下运行，通过限制开发环境内安全漏洞的潜在影响增加了一层安全性。我们面临的这些限制唯一问题是它们会阻止对 `CUDA` 程序的分析，但正如我们在第
    4 节中将看到的，可以在需要运行分析器的特定时刻配置不同的运行时。


    #### 安装的易用性


