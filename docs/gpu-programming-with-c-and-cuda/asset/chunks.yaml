- fmt: "\nNow, getting back to the source, we can see that line 15 is the `for` loop,\
    \ which of course is the most executed instruction. However, our real problem\
    \ is on line 16.\n\n![Figure 7.22: The line of code that was most executed](media/file44.png)\n\
    \nFigure 7.22: The line of code that was most executed\n\nLine 16 is responsible\
    \ for two global memory accesses and will be the focus of our optimizations in\
    \ the section `Using shared memory`. However, for now let’s continue exploring\
    \ our tool a bit more. *Figure 7.23* presents the assembly code panel that relates\
    \ to the source code we saw in *Figure 7.22*. On the screen both C++ code and\
    \ assembly code are presented side by side so that we can check whether the generated\
    \ code is what we expect. (We are not going to dive into assembly code for GPUs\
    \ in this book, but it is important to know how to access this information if\
    \ you would like to see the result of compilation of our code.)\n\n![Figure 7.23:\
    \ The assembly code for the selected line of code](media/file45.png)\n\nFigure\
    \ 7.23: The assembly code for the selected line of code\n\nBefore we continue,\
    \ let's check out another interesting tool. We can click on `Add Baseline` to\
    \ retain the current value for comparison with other profiling sessions. After\
    \ clicking the button we get the result seen in *Figure 7.24*.\n\n![Figure 7.24:\
    \ The current execution added as a baseline](media/file46.png)\n\nFigure 7.24:\
    \ The current execution added as a baseline\n\nNow that we understand what to\
    \ look for on the `Details` page, and we have our first baseline to compare against,\
    \ let’s see in the next section how to use the simplest of all possible approaches\
    \ to optimizing our code: using the Release configuration with compiler optimization\
    \ flags.\n\n### Using the Release configuration\n\nIn the previous section we\
    \ profiled the basic version of our matrix multiplication kernel, which uses what\
    \ we call a *naive* approach to the problem in which there are no code optimizations.\
    \ The simplest approach to optimizing the code is to use the compilation flags\
    \ that configure the compiler to perform optimizations.\n\nAs we are using `CMake`\
    \ we need to configure the project to compile differently, and we do that with\
    \ the following command in our VS Code terminal:\n\n```\ncmake -DCMAKE_BUILD_TYPE=Release\
    \ ..\n```\n\nThis changes our Makefiles so that they compile using the `-O3` optimization\
    \ level and do not include Debug information in the generated code. This way the\
    \ compiler will try to analyze our code as much as possible, to apply small changes\
    \ like unrolling loops (more about this in the forthcoming section *Using loop\
    \ unroll for further improvements*) and using more registers if possible.\n\n\
    After the new configuration we need to run `make` again:\n\n```\nmake\n```\n\n\
    And after compilation, we need to run the profiler once more with this new executable,\
    \ which we do by clicking on the project again and clicking the `Lauch` button.\n\
    \nWe see the result of profiling the code again with the new version in *Figure\
    \ 7.25*.\n\n![Figure 7.25: Summary for the release compilation of the same kernel](media/file47.png)\n\
    \nFigure 7.25: Summary for the release compilation of the same kernel\n\nNote\
    \ that the number of registers has increased and the time has dropped dramatically.\
    \ Given that we only changed a simple configuration this is a pretty good start!\n\
    \nIn *Figure 7.26* we can see that the new version has improved on performance,\
    \ as reflected in the Roofline chart.\n\n![Figure 7.26: Roofline for the release\
    \ kernel](media/file48.png)\n\nFigure 7.26: Roofline for the release kernel\n\n\
    Another thing that we notice, in *Figure 7.27*, is that the cache hit rate, for\
    \ both L1 as well as L2, has improved, which is also responsible for the decreased\
    \ execution time. But again there was no use of shared memory, because this cannot\
    \ be directed by the compiler alone but instead demands a different algorithm.\n\
    \n![Figure 7.27: Memory Chart for release kernel](media/file49.png)\n\nFigure\
    \ 7.27: Memory Chart for release kernel\n\nOur Occupancy chart has also changed\
    \ as we now have more registers being used, but again the number of threads has\
    \ not changed and nor does the use of shared memory, as we can see in *Figure\
    \ 7.28*.\n\n![Figure 7.28: Occupancy for release kernel](media/file50.png)\n\n\
    Figure 7.28: Occupancy for release kernel\n\nNow if we take a closer look at *Figure\
    \ 7.29* we see the tool tip indicating that no source information is available.\
    \ The reason for this is that we did not include debug information during code\
    \ generation.\n\n![Figure 7.29: Source counters for the release kernel](media/file51.png)\n\
    \nFigure 7.29: Source counters for the release kernel\n\nOne immediate effect\
    \ of using the Release configuration is that we lose debug information from the\
    \ source code, making it much harder to understand what the next steps of optimization\
    \ could be. However, it is important for our study to compare the impacts of using\
    \ compiler flags before proceeding with code changes. We can see that by simply\
    \ changing the configuration an incredible optimization was achieved.\n\nNow,\
    \ in the next section, let’s apply our first real code optimization: let’s change\
    \ the code to use shared memory.\n\n### Using shared memory to improve time\n\n\
    The first real optimization that we’ll apply will be to use shared memory to improve\
    \ the execution time. This will change our kernel drastically, so let's check\
    \ the code first.\n\n```cpp\n#define TILE 16\n__global__ void matrixKernel_shared\n\
    \         (const float* A, const float* B, float* C, int n){\n  __shared__ float\
    \ Asub[TILE][TILE];\n  __shared__ float Bsub[TILE][TILE];\n  int tx = threadIdx.x;\n\
    \  int ty = threadIdx.y;\n  int row = blockIdx.y * blockDim.y + ty;\n  int col\
    \ = blockIdx.x * blockDim.x + tx;\n  float sum = 0.0f;\n\n  for(int i=0; i < (n\
    \ + blockDim.x - 1) / blockDim.x; i++)\n  {\n     if (row < n && (i * blockDim.x\
    \ + tx) < n)\n         Asub[ty][tx] = A[row * n + i * blockDim.x + tx];\n    \
    \ else\n         Asub[ty][tx] = 0.0f;\n\n     if (col < n && (i * blockDim.y +\
    \ ty) < n)\n        Bsub[ty][tx] = B[(i * blockDim.y + ty) * n + col];\n     else\n\
    \        Bsub[ty][tx] = 0.0f;\n\n     __synctreads();\n\n     for (int k = 0;\
    \ k < blockDim.x; k++) {\n        sum += Asub[ty][k] * Bsub[k][tx];\n     }\n\n\
    \     __synctreads();\n  }\n\n  if (row < n && col < n)\n     C[row * n + col]\
    \ = sum;\n}\n```\n\nThe first thing to mention about this code is that our launch\
    \ configuration is setting a 2D block with a 2D grid; that is why we use `tx`\
    \ and `ty` to identify our threads. Also, we use block dimensions to calculate\
    \ which row and column a thread is working with. Each thread will handle one element\
    \ of the resulting *C* matrix, but to calculate that it will need to load many\
    \ elements from global memory into the block-local shared memory.\n\nTo do that\
    \ we have created two local submatrices can hold up to 256 elements of the corresponding\
    \ original matrix. We have 256 elements since `TILE` is our constant defined as\
    \ 16 and `TILE x TILE` = 256.\n\nOur main `for` loop has its limits calculated\
    \ by dividing the width of the matrix by the block dimension. In addition note\
    \ that resource allocation within the GPU may not match the size of our data structures.\
    \ That is why we need to keep track of boundaries and fill padding positions with\
    \ zeros.\n\nWe now do something that we talked about in *Chapter 5*: prefetch\
    \ data into shared memory for reuse. Let's walk through how this is done.\n"
