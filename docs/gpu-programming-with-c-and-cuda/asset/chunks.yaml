  trans: "\n\n这里有一个奇特的之处：尽管矩阵乘法比矩阵加法更复杂，但它仍然被认为是一个“尴尬并行”（embarrassingly parallel）问题，因为其核心思想是相同的：`C`\
    \ 中每个元素的计算都可以独立完成。任何线程都不需要等待另一个线程完成就可以开始自己的工作，因此不需要进行同步处理。这是一个巨大的优势，因为我们可以分配多个线程同时工作，而不需要进行太多的协调。\n\
    \n现在是时候看代码了！在 own 示例中，我们考虑的是`square matrices`，即行数等于列数。以下是我们的乘法内核函数：\n\n```\n__global__\
    \ void matrixMulKernel(double *A, double *B, \ndouble *C, int width) {\n  int\
    \ row = blockIdx.y * blockDim.y + threadIdx.y;\n  int col = blockIdx.x * blockDim.x\
    \ + threadIdx.x;\n  if (row < width && col < width) {\n    double value = 0;\n\
    \    for (int k = 0; k < width; k++) {\n        value += A[row * width + k] *\
    \ B[k * width + col];\n    }\n    C[row * width + col] = value;\n  }\n}\n```\n\
    \n值得注意的是，现在我们对 `threadId` 使用了两个维度，这使得思考索引变得稍微方便了一些。\n\n每个线程将拥有一组 `row` 和 `col`\
    \ 值的组合，代表输出矩阵中计算元素的索引，同时也代表了必须处理的矩阵 `A` 的行和矩阵 `B` 的列。使用 `for` 循环允许我们访问每个对应的元素，进行乘法并存储在局部变量中。\n\
    \n另一个重要的代码部分是启动内核的配置，如下所示：\n\n```\ndim3 blockDim(16, 16);\ndim3 gridDim( (N +\
    \ blockDim.x - 1) / blockDim.x, \n              (N + blockDim.y - 1) / blockDim.y\
    \  );\nmatrixMulKernel<<<gridDim, blockDim>>>(d_A, d_B, d_C, N);\n```\n\n在这里，`N`\
    \ 代表矩阵的`order`（阶），换句话说，就是每个维度的大小，意味着我们有 `N * N` 个元素。`blockDim` 定义的是线程数——我们将拥有\
    \ 256 个线程，一次为 16 行 16 列。然后我们定义块（blocks）的数量，同样在 `gridDim` 上使用两个维度，但我们需要根据矩阵的阶来计算数量。如果\
    \ `N` = 1000，计算方式如下：\n\n`( 1000 + 16 – 1 ) / 16 = 63.4375`\n\n然而，由于 `blockDim.x`\
    \ 是无符号 `int` 类型，该值将变为 63，且两个维度上的值将相同，这意味着我们将拥有 `gridDim(63,63)`。这将创建 3969 个块，考虑到每个块有\
    \ 256 个线程，我们最终得到了 3969 x 256 = 1,016,064 个独立线程来处理我们的数据。考虑到我们有 1000 × 1000 = 1,000,000\
    \ 个独立元素，我们可以开始运行了，但我们必须采取措施确保超出矩阵边界的额外 16,064 个线程不会计算任何内容。这就是为什么我们内核中的前几行代码始终包含一个测试，以检查\
    \ `threadId` 是否在数据范围内。\n\n现在是时候从我们的仓库下载代码进行实验的好时机，使用不同的矩阵大小值来观察对执行时间的影响。\n\n在下一节中，我们将处理一个不同的问题，但它同样可以从并行化受益。我们将进行数值积分，这意味着我们将计算许多点然后对它们求和。\n\
    \n## 计算数值积分\n\n首先：什么是积分？嗯，积分是微积分中的一个概念，代表图中两点之间曲线下方的面积。想象你正在跟踪一辆沿道路行驶的汽车路径，并在固定的间隔测量汽车的速度。现在，如果你将这些绘制出来，并计算代表速度随时间变化的曲线下方的面积，考虑到\
    \ `distance = speed × time`，你就得到了汽车行驶的总距离！简单来说，积分是通过累加微小的面积片来找到总和，这是一种测量一段范围内累积的量的强大方法。\n\
    \n> **为什么积分很有用？**\n> 积分无处不在科学、工程等领域。它们通过计算随时间或空间变化的总效应，帮助我们测量连续变化的事物——如距离、能量或增长。例如，工程师使用积分来确定结构上的力，经济学家使用它们来衡量随时间变化的总收入，环境科学家使用它们来模拟污染的扩散。积分为我们提供了从所有微小部分理解大局的方法。\n\
    \n有时我们想知道曲线下方的面积，但没有方便的公式可以处理。这时数值积分派上用场了！它使我们在数学技能或公式不足时估算面积。我们需要进行许多小型计算然后将它们全部求和——这听起来像是我们可以使用并行算法处理的事情，对吧？\n\
    \n有许多数值积分方法，但最的是**梯形法**（trapezoidal method），因为它在曲线内部使用许多梯形来计算面积的近似值。\n\n![Figure\
    \ 6.6: Two trapezoids inside curve](img/file20.png)\n\n图 6.6：曲线内部两个梯形\n\n在 `Figure\
    \ 6.6` 中我们使用了两个梯形来近似曲线下方的面积，以便理解概念，但在实践中我们通常添加更多的梯形。当然，在我们需要这种方法的情况下，曲线并不像这一个良好。使用梯形的有趣之处在于，随着宽度的减小，顶线会越接近曲线，这使得它们在计算非常简单的情况下能够提供特别好的近似。所以，就像数值方法通常一样，是用精度换取计算性。\n\
    \n梯形法的另一个有趣特点是我们可以直接在计算中使用收集的数据。使用本节开头提到的公路旅行示例，我们可能每 15 分钟（0.25 小时）记录一次汽车的速度。由于我们不知道这次旅行路线，我们使用了梯形法。\n\
    \n| 时间 (小时) | 速度 (km/h) | 速度 (mph) |\n| :--- | :--- | :--- |\n| 0 | 60 | 37.28\
    \ |\n| 0.25 | 65 | 40.39 |\n| 0.50 | 70 | 43.50 |\n| 0.75 | 72 | 44.74 |\n| 1.00\
    \ | 68 | 42.25 |\n| 1.25 | 65 | 40.39 |\n| 1.50 | 62 | 38.53 |\n| 1.75 | 60 |\
    \ 37.28 |\n| 2.00 | 58 | 36.04 |\n| **总和** | **130.25 公里** | **79.01 英里** |\n\n\
    当然，我们的示例非常小，可以手动计算，这样并无法有效利用我们的 GPU，但想象一下我们有成上万个数据点：那么使用 GPU 就开始有意义了。\n\n"
- fmt: "\nWe should also notice that this is another type of problem that does not\
    \ require synchronization between the executing threads.\n\nThis time our kernel\
    \ is super simple:\n\n```cpp\n#define N 10'000'000 // Number of speed measurements\n\
    #define T 0.25 //Interval between measurements (15 minutes)\n__global__ void trapezoidalKernel(double\
    \ *speeds, double *distances, int n) {\n   int i = blockIdx.x * blockDim.x + threadIdx.x;\n\
    \   if (i < n - 1) {\n      distances[i] = 0.5 * (speeds[i] + speeds[i + 1]) *\
    \ T;\n   }\n}\n```\n\nRemember that we must divide by 2 to calculate the average\
    \ height of the trapezoids, so we multiply by `0.5` which is a little faster.\
    \ Also, we must multiply by the section width; in this case we define `T` to be\
    \ `0.25`. All the values are calculated and stored in a different array. After\
    \ executing this kernel, we copy the results back to the host and calculate the\
    \ final distance by adding all the partial results. This is the code in the `main`\
    \ function that performs that step:\n\n```cpp\ncudaMemcpy(h_distances, d_distances,\
    \ \n           (N - 1) * sizeof(double), \n           cudaMemcpyDeviceToHost);\n\
    double gpuResult = 0.0;\nfor (int i = 0; i < N - 1; i++) {\n    gpuResult += h_distances[i];\n\
    }\n```\n\nOne interesting aspect is that the GPU implementation has a performance\
    \ close to that of the CPU. This is because we need to copy data, and because\
    \ the reduction step is processed entirely on the CPU. The process of reduction\
    \ is the topic of the next section, and we shall learn how to take advantage of\
    \ parallelism to accelerate the process.\n\n## Reducing from many\n\nIn parallel\
    \ computing, reduction is a key operation that allows us to take a collection\
    \ of values and combine them into a single result. It might sound like a straightforward\
    \ task — adding up a list of numbers or finding a maximum value, for instance\
    \ — but in parallel contexts reductions can be trickier than you might suppose.\
    \ This is because reductions require us to combine partial results from multiple\
    \ threads, which introduces the need for synchronization. If we do not tackle\
    \ this carefully, the performance gains from parallelism can quickly vanish, as\
    \ we saw in the example from the last section.\n\nThe need for coordination comes\
    \ from the fact that different threads are working together to reduce a dataset\
    \ to a single result. Without synchronized timing and controlled data access,\
    \ threads can get in each other's way, and this can potentially result in overwritten\
    \ values or incorrect answers.\n\nA classic example of a reduction is summing\
    \ an array of numbers. When we perform this operation in parallel, each thread\
    \ might handle a small portion of the array. But eventually, we need to combine\
    \ these partial sums into a result, which requires threads to synchronize at certain\
    \ points. This step distinguishes reductions from embarrassingly parallel tasks,\
    \ where each thread completes its task without ever needing to check in with others.\n\
    \nTo achieve an efficient reduction we can use a technique like tree-based reduction,\
    \ where each thread processes a pair of numbers to compute a partial result. The\
    \ partial results are then combined in pairs again at the next level, reducing\
    \ the number of values by half each time until only one result remains. This method,\
    \ inspired by the idea of a binary tree, can reduce the number of synchronization\
    \ steps as each level of the ‘tree’ requires fewer interactions between threads.\n\
    \n![Figure 6.7: An example of a reduction to sum the array elements](media/file21.png)\n\
    \nFigure 6.7: An example of a reduction to sum the array elements\n\nOne challenge\
    \ with reduction is managing memory access. If multiple threads attempt to update\
    \ the same variable simultaneously they can ‘race’ each other, leading to incorrect\
    \ results or a slowdown in performance. To avoid this we employ atomic operations\
    \ or other synchronization mechanisms that allow threads to safely access shared\
    \ memory. This adds complexity, but without it reduction operations would become\
    \ chaotic and unreliable.\n\nRemember the previous section, where we calculated\
    \ journey distance using the trapezoidal method for integration. When considering\
    \ 1,000,000 data points, the execution times for CPU and GPU approaches were of\
    \ the same order of magnitude. When we add a parallel reduction on the GPU, we\
    \ can reduce the execution time by an order of magnitude. However, the code passes\
    \ through many modifications, as we can see below.\n\n```cpp\n#define N 10'000'000\
    \ //Number of speed measurements\n#define T 0.25 //Interval between measurements\
    \ (15 minutes)\n__global__ void trapezoidalKernel(double *speeds, double *result,\
    \ int n) {\n   extern __shared__ double sharedData[];\n   int tid = threadIdx.x;\n\
    \   int i = blockIdx.x * blockDim.x + threadIdx.x;\n   double localDistance =\
    \ 0.0;\n   if (i < n - 1) {\n     localDistance = 0.5 * (speeds[i] + speeds[i\
    \ + 1]) * T;\n   }\n   sharedData[tid] = localDistance;\n   __syncthreads();\n\
    \   for (int s = blockDim.x / 2; s > 0; s /= 2) {\n        if (tid < s) {\n  \
    \          sharedData[tid] += sharedData[tid + s];\n        }\n        __syncthreads();\n\
    \   }\n   if (tid == 0) {\n       result[blockIdx.x] = sharedData[0];\n   }\n\
    }\n```\n\nNow we need to proceed step by step to understand the differences from\
    \ the original kernel. First, we use shared memory to store the partial results\
    \ within each block. This is important because shared memory is much faster than\
    \ global memory, but it requires synchronization to ensure consistency.\n\nIn\
    \ `trapezoidalKernel`, we define `tid` as `threadIdx.x` and `i` as `blockIdx.x\
    \ * blockDim.x + threadIdx.x`. Each thread calculates its `localDistance` and\
    \ stores it in `sharedData[tid]`. We then use `__syncthreads()` to ensure all\
    \ threads have written their data before we proceed.\n\nThe reduction is then\
    \ performed using a tree-based approach. In each iteration, the stride `s` starts\
    \ at half `blockDim.x` and is halved. Threads with `tid` less than `s` add the\
    \ value of their counterpart `sharedData[tid + s]` to theirs. We call `__syncthreads()`\
    \ after each addition to ensure the sums are ready for the next level. Finally,\
    \ the thread with `tid == 0` writes the final block sum to `result[blockIdx.x]`.\n\
    \nGiving careful thought to this point again, in a large dataset we will have\
    \ many blocks each with many threads. If we computed the partial results for each\
    \ block, how would we reach the ultimate result? Well, we could have a second\
    \ kernel to compute this step, or we could move this small number of values to\
    \ the host and compute it very quickly using the CPU. We will go with this last\
    \ option, and will see some of the changes to the main code below.\n\n```cpp\n\
    int blockSize = 256;\nint gridSize = (N + blockSize - 1) / blockSize;\ndouble\
    \ *d_speeds, *d_partialResults;\ncudaMalloc(&d_speeds, N * sizeof(double));\n\
    cudaMalloc(&d_partialResults, gridSize * sizeof(double));\n```\n\nFirst we define\
    \ the number of blocks necessary for our computation – this is our `gridSize`.\
    \ This will also define the size of the `partialResults` array, because we need\
    \ one slot for each block that completes the processing of speeds.\n\nAnother\
    \ important change is the way we call our kernel:\n"
  raw: "We should also notice that this is another type of problem that does not require\
    \ synchronization between the executing threads.\n\nThis time our kernel is super\
    \ simple:\n\n```\n#define N 10'000'000 // Number of speed measurements\n#define\
    \ T 0.25 //Interval between measurements (15 minutes)\n__global__ void trapezoidalKernel(double\
    \ *speeds, double *distances, int n) {\n   int i = blockIdx.x * blockDim.x + threadIdx.x;\n\
    \   if (i < n - 1) {\n      distances[i] = 0.5 * (speeds[i] + speeds[i + 1]) *\
    \ T;\n   }\n}\n```\n\nRemember that we must divide by 2 to calculate the average\
    \ height of the trapezoids, so we multiply by 0.5 which is a little faster. Also,\
    \ we must multiply by the section width; in this case we define *T* to be 0.25\\\
    . All the values are calculated and stored in a different array. After executing\
    \ this kernel, we copy the results back to the host and calculate the final distance\
    \ by adding all the partial results. This is the code in the `main` function that\
    \ performs that step:\n\n```\ncudaMemcpy(h_distances, d_distances, \n        \
    \   (N - 1) * sizeof(double), \n           cudaMemcpyDeviceToHost);\ndouble gpuResult\
    \ = 0.0;\nfor (int i = 0; i < N - 1; i++) {\n    gpuResult += h_distances[i];\n\
    }\n```\n\nOne interesting aspect is that the GPU implementation has a performance\
    \ close to that of the CPU. This is because we need to copy data, and because\
    \ the reduction step is processed entirely on the CPU. The process of reduction\
    \ is the topic of the next section, and we shall learn how to take advantage of\
    \ parallelism to accelerate the process.\n\n## Reducing from many\n\nIn parallel\
    \ computing, reduction is a key operation that allows us to take a collection\
    \ of values and combine them into a single result. It might sound like a straightforward\
    \ task — adding up a list of numbers or finding a maximum value, for instance\
    \ — but in parallel contexts reductions can be trickier than you might suppose.\
    \ This is because reductions require us to combine partial results from multiple\
    \ threads, which introduces the need for synchronization. If we do not tackle\
    \ this carefully, the performance gains from parallelism can quickly vanish, as\
    \ we saw in the example from the last section.\n\nThe need for coordination comes\
    \ from the fact that different threads are working together to reduce a dataset\
    \ to a single result. Without synchronized timing and controlled data access,\
    \ threads can get in each other's way, and this can potentially result in overwritten\
    \ values or incorrect answers.\n\nA classic example of a reduction is summing\
    \ an array of numbers. When we perform this operation in parallel, each thread\
    \ might handle a small portion of the array. But eventually, we need to combine\
    \ these partial sums into a result, which requires threads to synchronize at certain\
    \ points. This step distinguishes reductions from embarrassingly parallel tasks,\
    \ where each thread completes its task without ever needing to check in with others.\n\
    \nTo achieve an efficient reduction we can use a technique like tree-based reduction,\
    \ where each thread processes a pair of numbers to compute a partial result. The\
    \ partial results are then combined in pairs again at the next level, reducing\
    \ the number of values by half each time until only one result remains. This method,\
    \ inspired by the idea of a binary tree, can reduce the number of synchronization\
    \ steps as each level of the ‘tree’ requires fewer interactions between threads.\n\
    \n![Figure 6.7: An example of a reduction to sum the array elements](media/file21.png)\n\
    \nFigure 6.7: An example of a reduction to sum the array elements\n\nOne challenge\
    \ with reduction is managing memory access. If multiple threads attempt to update\
    \ the same variable simultaneously they can ‘race’ each other, leading to incorrect\
    \ results or a slowdown in performance. To avoid this we employ atomic operations\
    \ or other synchronization mechanisms that allow threads to safely access shared\
    \ memory. This adds complexity, but without it reduction operations would become\
    \ chaotic and unreliable.\n\nRemember the previous section, where we calculated\
    \ journey distance using the trapezoidal method for integration. When considering\
    \ 1,000,000 data points, the execution times for CPU and GPU approaches were of\
    \ the same order of magnitude. When we add a parallel reduction on the GPU, we\
    \ can reduce the execution time by an order of magnitude. However, the code passes\
    \ through many modifications, as we can see below.\n\n```\n#define N 10'000'000\
    \ //Number of speed measurements\n#define T 0.25 //Interval between measurements\
    \ (15 minutes)\n__global__ void trapezoidalKernel(double *speeds, double *result,\
    \ int n) {\n   extern __shared__ double sharedData[];\n   int tid = threadIdx.x;\n\
    \   int i = blockIdx.x * blockDim.x + threadIdx.x;\n   double localDistance =\
    \ 0.0;\n   if (i < n - 1) {\n     localDistance = 0.5 * (speeds[i] + speeds[i\
    \ + 1]) * T;\n   }\n   sharedData[tid] = localDistance;\n   __syncthreads();\n\
    \   for (int s = blockDim.x / 2; s > 0; s /= 2) {\n        if (tid < s) {\n  \
    \          sharedData[tid] += sharedData[tid + s];\n        }\n        __syncthreads();\n\
    \   }\n   if (tid == 0) {\n       result[blockIdx.x] = sharedData[0];\n   }\n\
    }\n```\n\nNow we need to proceed step by step to understand the differences from\
    \ the original kernel. Also, notice that in this example we are using shared memory\
    \ to its best by keeping the partial results within this fast memory, which enables\
    \ us to reduce among the thread blocks.\n\nThe first part of the code is remarkably\
    \ similar, the only difference being the declaration of the `sharedData` array\
    \ that is allocated externally by the kernel launch configuration. After calculating\
    \ their own results, each thread saves their `localDistance` to their index on\
    \ the `sharedData` array. Notice that this does not require any synchronization,\
    \ because each thread uses the `tid` value, which is unique, to persist its results.\n\
    \nWith partials in place we need to effectively reduce, and thus comes the first\
    \ need to synchronize action. We use the `__syncthreads()` function to establish\
    \ a checkpoint which all threads must reach before the kernel can continue.\n\n\
    After this point we loop with half the threads in the block to calculate the first\
    \ round of partial sums. Notice that we use `blockDim.x` to get the number of\
    \ threads in a block and divide by 2, to guarantee that variable `s` (for stride)\
    \ will help us get half of the remaining set on each iteration.\n\nNext all threads\
    \ with an id less than the stride calculate their value plus the counterpart that’s\
    \ in the other half of the array. Again, for each step we must `__syncthreads()`\
    \ and make sure that all the partials are correctly computed. This is a common\
    \ source of computing errors; whenever we incur value errors in reduction the\
    \ synchronization points are a great starting point to double-check.\n\nEach step\
    \ divides the stride by 2 and repeats the sums, until we reach a point where thread\
    \ 0 adds `sharedData[0]` and `sharedData[1]` to produce the result for this block\
    \ of threads.\n\nGiving careful thought to this point again, in a large dataset\
    \ we will have many blocks each with many threads. If we computed the partial\
    \ results for each block, how would we reach the ultimate result? Well, we could\
    \ have a second kernel call to compute this step, or we could move this small\
    \ number of values to the host and compute it very quickly using the CPU. We will\
    \ go with this last option, and will see some of the changes to the main code\
    \ below.\n\n```\nint blockSize = 256;\nint gridSize = (N + blockSize - 1) / blockSize;\n\
    double *d_speeds, *d_partialResults;\ncudaMalloc(&d_speeds, N * sizeof(double));\n\
    cudaMalloc(&d_partialResults, gridSize * sizeof(double));\n```\n\nFirst we define\
    \ the number of blocks necessary for our computation – this is our `gridSize`.\
    \ This will also define the size of the `partialResults` array, because we need\
    \ one slot for each block that completes the processing of speeds. And of course\
    \ we need to allocate memory for that on the GPU.\n\nAnother important change\
    \ is the way we call our kernel:"
