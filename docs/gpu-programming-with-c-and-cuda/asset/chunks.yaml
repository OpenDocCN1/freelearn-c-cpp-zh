    \ way through a variety of optimization strategies, as well as the use of the\
    \ graphical profiler that is available in the CUDA toolkit. This is an essential\
    \ tool to help attack the hot spots in our kernels so that we use our time as\
    \ effectively and efficiently as possible.\n\nIn the next chapter we will learn\
    \ another strategy to accelerate our code: overlaying memory transfers with kernel\
    \ execution.\n\n## References\n\n[1] Volkov, V. and Demmel, J.W. (2008) Benchmarking\
    \ GPUs to tune dense linear algebra. *SC ’08: Proceedings of the 2008 ACM/IEEE\
    \ conference on Supercomputing*, Article No. 31, pp.1-11\\. ([https://dl.acm.org/doi/10.5555/1413370.1413402](https://dl.acm.org/doi/10.5555/1413370.1413402))\n\
    \n# Chapter 8: Overlaying Multiple Operations\n\n## Join our community on Discord\n\
    \n[https://packt.link/deep-engineering-cpp](https://packt.link/deep-engineering-cpp)\n\
    \n![](media/file70.png)\n\nAn interesting possibility with GPUs is to execute\
    \ multiple operations at the same time. By using CUDA streams, it is possible\
    \ to execute memory transfers to and from the GPU at the same time as we execute\
    \ a kernel, thereby overlaying the operations. This means we can have three things\
    \ happening in an interleaved way.\n\nAnother possibility is to have more than\
    \ one GPU on the same machine, although its higher cost means this is a less common\
    \ setup. We will touch on this interesting alternative in a brief overview; it\
    \ requires careful thinking about the algorithm to ensure we make the most of\
    \ our devices.\n\nBut before we jump into those interesting topics, we will start\
    \ this chapter by exploring how to use VS Code to debug our code. This is a useful\
    \ skill, especially when we have multiple operations happening at the same time!\n\
    \nOver the course of the chapter we're going to cover the following main topics: \n\
    \n*   Debugging CUDA code with VS Code\n\n*   Using CUDA streams to copy memory\
    \ and execute code\n\n*   Using multiple GPUs together\n\n## Technical requirements\n\
    \nWe will use the environment we configured during *Chapter 3* with VS Code and\
    \ our development container. If you have chosen to install the CUDA Toolkit on\
    \ your machine, you can simply run the build commands on a terminal. We will also\
    \ learn how to use VS Code to debug GPU code. The code is provided on the GitHub\
    \ repository.\n\n## Debugging CUDA Code with VS Code\n\nDebugging CUDA applications\
    \ can sometimes feel like untangling a knot in the dark, but with the right tools,\
    \ the process becomes much more manageable. The official documentation for **cuda-gdb**,\
    \ NVIDIA’s debugger for CUDA applications, can be found at [https://docs.nvidia.com/cuda/cuda-gdb](https://docs.nvidia.com/cuda/cuda-gdb).\
    \ However, a powerful combination for CUDA debugging is using cuda-gdb with VS\
    \ Code. This setup offers a seamless experience for tracking down issues in GPU\
    \ code, providing an intuitive interface.\n\nOur setup already has everything\
    \ we need to debug our code. We just need to add launch configurations for the\
    \ programs we would like to debug. First, we click on the **Run and Debug** icon\
    \ on the sidebar.\n\n![](media/file71.png)\n\nFigure 8.1: Accessing Debug configuration\n\
    \nAs we can see on *Figure 8.1*, we need to create a `launch.json` file, which\
    \ we do by clicking on the ‘create a launch.json file’ link, and VS Code will\
    \ guide us through the process.\n\n![Figure 8.2: Selecting the debugger](media/file72.png)\n\
    \nFigure 8.2: Selecting the debugger"
