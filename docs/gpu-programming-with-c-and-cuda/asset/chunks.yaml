    \ Here are the results:\n\n```\nSize:    1 MB, Time:  0.0915 ms, Bandwidth: 10.667\
    \ GB/s\nSize:   10 MB, Time:  0.8858 ms, Bandwidth: 11.024 GB/s\nSize:   30 MB,\
    \ Time:  2.6194 ms, Bandwidth: 11.185 GB/s\nSize:   50 MB, Time:  4.2118 ms, Bandwidth:\
    \ 11.593 GB/s\nSize:  100 MB, Time:  8.2360 ms, Bandwidth: 11.857 GB/s\nSize:\
    \  300 MB, Time: 24.5889 ms, Bandwidth: 11.915 GB/s\nSize:  500 MB, Time: 40.8161\
    \ ms, Bandwidth: 11.963 GB/s\nSize: 1024 MB, Time: 83.3972 ms, Bandwidth: 11.991\
    \ GB/s\n```\n\nAs we can see, we are below the theoretical 16 GB/s bandwidth,\
    \ and if we look at the last row, to transfer 1 GB we must wait 83 ms. During\
    \ that time the GPU is idle, processing nothing, and here comes our strategy:\
    \ split our data into chunks, copy a little bit, start processing that while copying\
    \ the next chunk to a different memory buffer, and then when the new buffer is\
    \ ready start processing that. This is what we are going to do, and then we will\
    \ use these results to also help us determine the best transfer size to process.\n\
    \n### Multiplying with CUDA streams"
