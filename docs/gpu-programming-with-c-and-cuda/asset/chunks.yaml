  trans: '

    我们首先定义了并行性，并考虑了如何利用它来提高任务性能。起初不需要任何代码，只需要对日常生活中的活动进行一些反思，使问题变得清晰简单。随后，我们讨论了编程环境，由于
    GPU 编程需要此类专门的工具包，我们提出了使用 `Docker` 来保持一切整洁有序的替代方案。这种方法具有双重趣味，因为它也适用于其他的编程环境。


    下一章带领我们进入了简单程序的开发阶段，作为我们的第一个里程碑。我们执行了实际上使用 GPU 的代码！然而，这第一个程序并不是一个真正的并行程序，因此我们将重点转移，去研究那些能够真正利用
    GPU 核心力量解决更大问题的程序。此外，我们还学习了如何在我们的 `GPU devices` 之间进出数据。


    此之后，有许多新概念需要解释，因此我们花了一些时间回顾了 `GPU programming` 的每一个方面，以确保在每个阶段都为接下来的内容奠定基础。然后，我们转向了并行算法的设计，以及如何充分利用我们的
    `GPU hardware`。我们讨论了这些解决编程问题的方法所面临的挑战和特点。


    然后，是检查性能优化策略的时候，同时也查看了性能分析工具，该工具帮助我们在应用优化技术时找到需要关注的热点。我们见证了 `shared memory` 的实际应用以及它对整体执行时间的影响。


    我们了解到，当通过使用 `streams` 重叠内存传输和计算时，可以实现另一层的性能提升。我们还利用性能分析器验证了应使用的最佳数据传输大小。


    如果我们的代码无法与其他程序集成，那么它又有什么用呢？这个问题促使我们去探索如何将代码封装成库，以及如何从 `Python` 调用我们的 GPU 代码。


    最后，在最后一个章节中，在我们已经了如何创建 GPU 程序之后，我们展望了眼前的道路。我们看到了了诸如 `cuBLAS` 和 `Thrust` 这样可以提高我们生产力的库，并讨论了决定何时应该编写自定义的
    `CUDA kernels` 以及何时我们应该依赖现有库的策略。我们发现，将串顺序代码移动到 GPU 可能是很有用的，如果这样做可以避免消耗 GPU 带来的性能增益的数据传输。


    本章最后对如何测试代码进行了简要介绍，包括在 `C++` 层次的测试，以及当代码已经作为共享库暴露时在 `Python` 层次的测试。


    到此，我们共同到达了通往 GPU 性能编程核心之旅的终点。希望你现在已经拥有了所需的知识，可以在自己的项目中探索并利用 GPU 的力量。旅途愉快！

    '
