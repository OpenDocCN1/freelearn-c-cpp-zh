    ## 理解线程、块和网的概念


    在`第 4 章`中，我们终于执行了真正的并行 CUDA 程序，并看到启动内核（kernel）需要配置。不仅如此，这种启动配置也是程序本身的一部分。仔细观察向量加法程序，我们看到
    CPU 版本有一个 `for` 循环，而 GPU 版本则用配置来代替这个 `for` 循环。因此，我们需要讨论决定执行如何发生的概念。线程、块和网共同工作，但让我们先单独了解它们。


    ### 线程 (Threads)


    `thread`（线程）是 CUDA 中的基本执行单元，每个线程都有自己的 `unique ID`（唯一 ID），允许它独立访问数据的特定部分。对于给定的问题，我们定义了一组可以处理所需数据的线程。线程
    ID 可以是一维、二维或三维的（`threadIdx.x, threadIdx.y, threadIdx.z`），取决于定义的块配置。


    每个线程都有一些本地内存和寄存器。每个局部变量都分配到寄存器中，但每个线程的寄存器数量是的，所以如果我们定义了太多局部变量，可能会导致 `register
    spilling`（寄存器溢出），此时必须将变量分配到访问速度较慢的本地内存中。


    在我们看不的地方，每个流多处理器（`SM`）上的 `thread scheduler`（线程调度器）管理 `warps`（线程束）的执行——这是对硬件组织和控制的底层分组的说法。


    ### 块 (Blocks)


    块（block）是线程的高级分组，它们共同执行内核，并同步和共享内存。我们可以将块视为线程的容器。与线程一样，块可以按一、二或三维组织（`blockIdx.x,
    blockIdx.y, blockIdx.z`）。这提供了一种灵活的方法，将线程和块映射到图像处理或科学模拟等多维问题。


    > 块和线程束不是一回事！


    > 请记住，虽然两者都是线程组，但块是由我们在调用内核执行时定义的。另一方面，线程束是硬件为组织线程执行定义的底层分组。线程束拥有 32 个线程，它们同时执行相同的指令。


    截至目前，每个块最多包含 1024 个线程，这是硬件的一种的一种限制。它影响了我们构建问题的方式。记住，我们拥有的内存是有限的，因此分配给块的线程越多，它们共享以及定义局部变量的内存就越少。


    块的一个重要特性是它们允许线程通过共享内存进行协作。它们可以使用这种特殊内存来共享中间结果或相互通信，只要它们位于同一个块中。


    > 共享内存是一项强化功能！


    > 共享内存是一种特殊的片上内存，靠近核心，并在块的线程之间共享。由于它比全局内存快得多，因此使用它来提高性能至关重要。


    像这样组织结构会有什么区别呢？嗯，系统可能会以任何顺序在可用的流多处理器上调度块，唯一的限制是不同块之间的线程将无法相互通信。


    在块内部，线程可以通过使用 `__syncthreads()` 函数进行同步，该函数会使所有线程在该调用点处等待，直到所有线程都到达该处。我们将在`第 6
    章`中的一个具体的示例中使用它。


    ### 网 (Grids)


    '
- fmt: '

    A grid, not surprisingly, is a collection of blocks used to execute a kernel.
    The grid organizes many blocks that can be executed independently across the streaming
    multiprocessors. Once again, like threads and blocks, a grid can also be one-dimensional,
    two-dimensional, or three-dimensional, depending on the problem structure (`gridDim.x,
    gridDim.y, gridDim.z`).


    But what is this fixation with levels of organization? Let''s remember that one
    way in which our hardware accelerates our computations is to parallelize the execution
    of parts of our code as much as possible. In Chapter 4 we saw how the vector addition
    program did not have a loop to go over all data points exactly because the *hardware
    took care of that for us*. By using these three layers of organization with three
    dimensions each, we guarantee that we can assign a unique thread id to each execution
    thread that will directly map to the data it has to process, making it ready for
    execution at any time.


    > **The right sizes**

    > The number of threads per block is called the block size, and the number of
    blocks in the grid is called the grid size. This can be a little confusing at
    the beginning but these sizes matter. The numbers that go in the block dimensions
    define the number of threads, and this can be at most 1024 (as of this writing).
    However, the number of blocks will be defined by the dimensions of the grid!


    It is worth stopping for a moment to remember that the original objective of GPUs
    was to process *graphical* problems. This helps us understand why having three-dimensional
    structures makes total sense. The fact that we are using GPUs for general purposes
    should not blind us to their origins.


    ### Putting it all together


    Before we move on to discuss how to define the number of threads and blocks we
    should use, it is worth recapping how these configurations work together.


    We use the `blockDim` to define the number of threads and how they are arranged
    within the blocks, for example:


    ```

    dim3 blockDim(1024, 1, 1)

    ```


    As well as


    ```

    dim3 blockDim(32, 32, 1)

    ```


    Will both give us the same number of threads because `blockDim.x * blockDim.y
    * blockDim.z = 1024`. However, the first example is a good approach to working
    with vectors while the second is better suited to working with matrices.


    So, what we should note is that the values that define the block dimensions are
    used by the scheduler to allocate the threads, and thus we have for each `threadIdx.x`,
    `threadIdx.y`, and `threadIdx.z` the different values.


    In a 1D situation we have the global index for a thread given by:


    ```

    int globalIdx = blockIdx.x * blockDim.x + threadIdx.x;

    ```


    Whereas in a 2D situation we will have two global indices for the thread given
    by:


    ```

    int globalIdx_x = blockIdx.x * blockDim.x + threadIdx.x;

    int globalIdx_y = blockIdx.y * blockDim.y + threadIdx.y;

    ```


    The same holds true for how `gridDim` defines the number of blocks; this is why
    we have used `blockIdx.x` and `blockIdx.y` in the previous calculation for global
    indices.


    ### Launching configurations


    Understanding threads, blocks, and grids is key to understanding the configuration
    we use to launch a kernel execution. When we were adding vectors in Chapter 4,
    we chose to use 256 threads per block, and after that we had to calculate how
    many blocks were needed to accommodate all our data points. For the case of vectors
    of size 100,000,000 we would have:


    `100,000,000 / 256 = 390,625 blocks needed`


    However, we do not always have easy numbers, and in that case we use a more general
    formula to find the required number of blocks:


    We use the integer value so as to ignore anything after the decimal point. This
    is equivalent to using the `floor` function, but that function still returns a
    floating-point value which would need to be converted to an integer. And with
    that, comes the need to calculate inside our kernel what our unique thread id
    is. We do this by getting the current block and thread ids (which are given to
    us by runtime) and performing a simple calculation like:


    ```

    uniqueId = (blockDim.x * blockIdx.x) + threadIdx.x

    ```


    Here we use the `.x` to refer to the dimension of the block or grid that was specified
    during kernel launch configuration. Since our vector addition example is a one-dimensional
    problem, it makes sense to launch the kernel with both block size and grid size
    using just one dimension.


    256 threads per block is a common choice for balancing performance and occupancy,
    occupancy being a key concept that refers to the ratio of warps executing to the
    maximum number of warps that a streaming multiprocessor can support. The larger
    the occupancy value the higher the performance, up to a certain point. This is
    because high occupancy can help hide memory latency by swapping the waiting warp
    with a ready warp. If we have too many waiting warps or too many ready warps,
    however, we will see a performance decrease.


    > **Big enough problems**

    > It is a curious fact that if you measure the execution of a program that is
    processing a piece of data that matches the number of CUDA cores on your GPU,
    the numbers will be worse than those seen for a larger problem that exceeds the
    number of available processors. This is a little counterintuitive at first, but
    a lot of things are happening to make a CUDA program execute on the device. For
    example, we have to copy data in and out. If the problem is too small it is effect
    not worth that work.


    Now that we understand all the indexing we need, and how to define the configuration
    for our kernel executions, we are ready to learn in the next section how CUDA
    can help improve performance when dealing with transfers.


    ### Asynchronous data transfers


    As we saw in Chapter 4, when copying data to and from the device, we need to specify
    the direction in which we are moving data. However, in our first examples, we
    waited to copy our entire dataset before starting to process. Luckily there is
    something we can do to improve this. Actually, there are two things that work
    together to improve performance: asynchronous data transfers and streams. We will
    look at asynchronous data transfers first.


    Being asynchronous means that once data transfer starts, control returns immediately
    to the CPU which is then free to run other code, for example, to gather another
    part of our large dataset. The function that we use for this is `cudaMemcpyAsync`,
    which is conveniently named in a way that''s already familiar since we learned
    how to use `cudaMemcpy`, the synchronous version.


    For the sake of clarity let''s consider a more concrete example. If we have to
    read data from storage, it can take a while (depending on our equipment). Even
    with modern SSDs (as of writing NVMe memory is the fastest consumer-available
    storage), it is still slower than main memory. This means we could load part of
    our data and start transferring it to our device with an asynchronous data transfer,
    and after scheduling the transfer we can start loading the next chunk from disk.
    By overlaying the operations in this way we can make the data transfer time invisible.
    Pretty clever, right?


    Exploring our example a little further, let''s put the times needed to process
    our fictitious data together.


    Scenario 1 – the naive approach:


    1 – load data from disk

    2 – transfer data to the device

    3 – process data on the device

    4 – transfer data back to the host.


    This scenario is represented in Figure 5.1, where we see that the only performance
    gains we might achieve are if we use a large number of processing cores, but only
    during the processing phase.


