    It is important to note that when using those great non-default streams, things
    happen asynchronously, and this means we have to check to see whether the previous
    operation has been completed before we start trying to use anything that is part
    of that previous operation. There are specific resources to control this, including
    what are called `events`. Although we have seen CUDA events superficially superficially
    in `Chapter 4` when measuring execution times, we will learn much more in the
    next section. For now, it is enough to know that we can use them to guarantee
    our execution sanity when it comes to asynchronous streams.


    Synchronization is an essential part of working with CUDA streams because it ensures
    that tasks which depend on each other are executed in the correct order. In CUDA,
    synchronization refers to controlling when a particular stream should start executing
    a task relative to other streams or when the CPU should wait for a stream to finish.
    Without proper synchronization you can end up with race conditions, where data
    is read or modified before an operation is fully completed, leading to incorrect
    results.


    The primary function for synchronizing streams is `cudaStreamSynchronize()`. This
    function blocks the host (CPU) until all the tasks in the specified stream have
    been completed. It''s useful when you need to ensure that a stream has finished
    all its tasks before proceeding to the next part of your program. For example,
    after launching a kernel in one stream and performing memory transfers in another,
    you may want to synchronize them to ensure that the data is available before attempting
    further computation.


    Another commonly used function is `cudaDeviceSynchronize()`, which forces the
    host to wait for completion of all previously launched operations on the GPU,
    across all streams. While `cudaDeviceSynchronize()` is a more global synchronization
    point compared to `cudaStreamSynchronize()`, it is often considered less efficient
    because it halts the entire device instead of just a specific stream. As a result,
    it should be used carefully and only when necessary.


    In the next section, we continue to talk about events and how they can help us
    with CUDA programming and synchronization.


    Following the events


    The two main purposes of CUDA events are to measure performance and to help with
    synchronization. They make this possible by providing mechanisms for tracking
    the execution times associated with certain operations. Specifically for synchronization
    we can wait on an event to complete, and with that we have the possibility for
    a task running in a stream to wait on the completion of another task in a different
    stream.


    Events are created using the `cudaEventCreate()` function, which allocates the
    resources necessary for the event.


    When creating an event, we can specify certain flags to modify the event''s behavior.
    For example, the `cudaEventBlockingSync` flag ensures that the event will block
    the CPU thread that waits on it until the event is complete. Conversely, the `cudaEventDisableTiming`
    flag allows the event to be used only for synchronization without measuring timing.


    Once an event is no longer needed, it is crucial to free the resources associated
    with it. This is done using the `cudaEventDestroy` function, which takes the event
    as a parameter.


    With CUDA events we have a great mechanism for measuring the elapsed time between
    various operations on the GPU. The timing functionality is primarily accessed
    through the `cudaEventRecord` and `cudaEventElapsedTime` functions. When we call
    `cudaEventRecord`, the current GPU time is captured and associated with the specified
    event. This allows us to create time stamps for specific operations, such as kernel
    launches or data transfers, enabling precise performance analysis. What happens
    on the backstage is that the runtime captures what is in execution at the time
    we called `cudaEventRecord`, and monitors this to track event completion.


    To measure the time elapsed between two events, we use the `cudaEventElapsedTime`
    function. This function calculates the time difference in milliseconds between
    two recorded events and returns it as a floating-point value.


    One important aspect of event timing is the overhead associated with using events.
    Although the creation, recording, and querying of events are lightweight operations,
    they do introduce some level of overhead. We should be mindful of this overhead
    when carrying out performance measurements in performance-critical sections of
    code.


    Events can also be used to measure the performance impact of various execution
    strategies. For instance, by placing events before and after different kernel
    configurations, we can analyze how changes in grid and block sizes influence execution
    times.


    When you want to ensure that a specific operation has been completed before proceeding,
    you can use the `cudaEventSynchronize` function. This function blocks the calling
    thread until the specified event has been recorded, guaranteeing that any dependent
    operations will not start until the previous operations have completed. This is
    particularly useful when the host code relies on the results of GPU computations.


    Remember that when we started recording the event, the runtime captures what is
    running, so, with our vector addition from `Chapter 4` for example, we recorded
    the `startEvent` when there was nothing executing, then we issued memory transfers,
    a kernel execution and a last memory transfer. After that we called another event
    recording, but this time a lot of things were going on, so when we called `cudaEventSynchronize`
    on `stopEvent`, the program waited for everything associated with this event to
    complete before resuming execution again. *This* is the magic behind an event:
    it understands what is associated with it and can track everything for synchronization.


    One last speed booster that we have to explore is shared memory, a special memory
    that enables thread communication locally. It is the topic of the next section.


    Accelerating with shared memory


    As mentioned earlier in this chapter, in the `Threads` section, there is special
    on-chip memory that (again, as of this writing) has only 48KB per block that is
    visible to all the threads in that block. That 48KB is memory enough to keep,
    let''s say, an array of float numbers to store the result of each thread''s execution.
    That way, by the end of execution, one of the threads – typically thread 0 – can
    go over all of that shared array and sum all the values.


    Another typical use for shared memory is pre-fetching data from global memory
    and processing it locally. Let''s say we need to compute the dot product of a
    vector against many different vectors. We could load the main vector to shared
    memory and reuse this against all the other global accesses, and although simple,
    this saves global memory access to become half of the naive approach. Depending
    on the sizes of the data that we need to process we can bring two vectors from
    global memory at once and load two shared arrays. After that our threads will
    process data locally – saving all the global accesses that would otherwise be
    performed – and at the end of our computation we store a single value to a given
    global memory address.


    The lifetime of data allocated to shared memory – which typically is an array
    of the block size (remember, the number of threads in a block) – is the same as
    that of the block. Once the block gets deallocated that shared memory is freed
    as well.


    With that, we have put together all the internals from the GPU realm to empower
    us to write much more performant programs.

    '
