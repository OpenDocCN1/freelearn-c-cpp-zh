  \ | |\n\n# 7. 用植被填充你的世界\n\n在我们的环境中使用植被不仅能增加美学上和视觉上有吸引力的元素，还能深化叙事、传达情感并营造独特的氛围。从密集的森林到广阔的草地，屏幕上的植被在设定场景和刻画所描环境方面起着至关重要的作用。在本章中，我们将探索如何策略性地使用植被从叙事和电影美学方面丰富场景的电影效果。\n\
  \n为了实现这一点，Unreal Engine 提供了一套工具，就像一把带有所有固有特征的画笔一样，允许我们快速添加或移除几何体簇。通过 `Foliage Mode`（植被模式），可以在短时间内填充大区域。需要注意的是，这种模式被设计用于作为场景中的细节元素，允许我们在任何需要的地方放置植被。此外，Unreal\
  \ Engine 已经包含了允许我们程序化添加植被以覆盖广阔地形的工具。\n\n将涵盖的主题包括：\n\n* 理解术语\n* 使用 `Foliage Mode`\n\
  * 静态网格植被优化\n\n# 技术要求\n\n本章的技术要求与 *第 1 章* 以及后续章节的规范相同；请参考该章节。\n\n尽管如此，请记住在使用 Unreal\
  \ Engine 5（5.5 或更高版本）结合 `Lumen Global Illumination`（全局 全局光照）、`Reflections`（反射）和\
  \ `Nanite` 虚拟几何体时的推荐硬件：\n\n* **操作系统**：Windows 10 64 位版本 1909 修订 .1350 或更高，或版本 2004\
  \ 和 20H2 修订 .789 或更高。支持 DirectX 12 Agility SDK。\n* **处理器**：四核 Intel 或 AMD，2.5 GHz\
  \ 或更快。\n* **内存**：8 GB RAM。\n* **软件光线追踪**：此功能可能需要支持 DirectX 11 的显卡。\n* **硬件光线追踪**：需要\
  \ Windows 10 1909 或更高版本支持 DirectX 12 以及特定的显卡（例如 NVIDIA RTX-2000 系列或更高、AMD RX-6000\
  \ 系列或更高、Intel Arc A 系列显卡）。\n* **网络访问**：需要网络连接以下载本章的插件。\n\n# 理解术语\n\n以下是本章使用的术语列表：\n\
  \n* **Actor 植被**：指的是包含 Actor 实例的蓝图植被资产。这种 Actor 提供了更大的活性和交互性，但由于其动态性，成本更高。\n* **静态网格植被**：这种植被使用实例化网格，设计为直接通过画刷工作。适用于非破坏性的植被工作流。\n\
  * **画刷**：以画刷形式存在的工具，通过尺寸、强度、淡化和密度属性，允许我们在场景上绘制植被。\n* **密度**：指每 10 平方米绘制植被实例数量。\n\
  * **裁剪距离 (Cull Distance)**：植被的绘制距离，超过此距离将不再显示在屏幕上。此参数可以针对特定植被类型进行修改。默认情况下设置了此距离，且最初所有植被都会渲染。\n\
  \n# 使用植被模式\n\n现在我们对这些重要概念有了广泛的了解，让我们看看如何访问 `Foliage Mode`。\n\n## 启用植被模式\n\n在如 *第\
  \ 6 章* 所述创建环境后，我们现在有了放置植被所需的空间。要做到这一点，我们需要访问编辑模式。我们可以在 `编辑器工具栏` 中操作：打开 `Modes` 下拉菜单，就像我们创建地形时那样。在这种情况下，我们选择\
  \ `Foliage` (`Shift + 3`) 来打开允许我们向场景中绘制植被的工具。\n\n![图 7.1 – 植被模式](img/B21600_07_1.png)\n\
  \n\n\n\n\n# 图 7.1 – 植被模式 (Foliage Mode)\n\n值得提到，`Foliage Mode` 通过生成实例来减少绘制调用（draw\
  \ calls），因为场景中的元素数量可能非常。一旦打开 `Foliage Mode`，我们将看到包含两个清晰区域的面板：\n\n*   **工具面板 (Tool\
  \ Palette)**：位于顶部，此区域包含了在项目中创建植被时的主要工具，如 `Select`（选择）、`All`（全选）、`Deselect`（取消选择）、`Invalid`（无效）、`Lasso`（套索）、`Paint`（绘制）、`Reapply`（重新应用）、`Single`（单个）、`Fill`（填充）、`Erase`（擦除）、`Remove`（移除）和\
  \ `Move`（移动）。\n*   **植被面板 (Foliage Palette)**：位于底部，我们可以通过点击 `+ Foliage` 按钮或直接从 `Content\
  \ Browser` 浏览器中拖入静态网格（Static Meshes）和/或静态网格植被（Static Mesh Foliage）来添加植被。\n\n![图\
  \ 7.2 – 工具面板 (1) 和植被面板 (2) 区域](img/B21600_07_2.png)\n\n图 7.2 – 工具面板 (1) 和植被面板 (2)\
  \ 区域\n\n由于我们尚未指定想要绘制的植被类型，因此没有可用数据。若要继续操作，我们需要将各种静态网格分配到面板区域。在此区域中，我们将选择要绘制到场景中的不同网格。\n\
  \n我们将使用 Megascans 植被，可以通过 Quixel Bridge 下载。`Wild Grass`（野草）是一个很好的开始工作示例。\n\n## 建议\n\
  \n使用低质量设置允许我们下载低多边形网格，最重要的是纹理分辨率将为 1024，这对于低矮植被来说足够了。在本章的“静态网格植被优化”部分中，我们将回顾提高性能的措施。这些资产已经在\
  \ `Foliage` 文件夹中创建了静态网格植被，因此只需将它们拖入面板即可，无需重新创建。\n\n![](img/B21600_07_3.png)\n\n\
  图 7.3 – 野草\n\n当将 Megascans 植被导入 `Content Browser` 时，会创建一个包含静态网格植被资产的 `Foliage` 文件夹。这些资产已准备好拖入面板以开始工作。如果我们直接拖入静态网格，Unreal\
  \ 将创建静态网格植被并提示保存它们的路径。\n\n![图 7.4 – 静态网格植被组织结构](img/B21600_07_4.png)\n\n图 7.4 –\
  \ 静态网格植被组织结构\n\n一旦将各种类型的植被分配到面板上，我们首先注意到的是模型的小缩略图。在左上角，`蓝色` 勾选标记表示该项目已被选中并将被绘制。如果未被选中，缩略图显示为深色。\n\
  \n在右上角，`磁盘` 图允许我们保存拖入静态网格时创建的静态网格植被。在右下角，数字 `0` 表示正在绘制的元素数量。\n\n![图 7.5 – 面板上的静态网格植被](img/B21600_07_5.png)\n\
  \n图 7.5 – 面板上的静态网格植被\n\n此外，我们注意到光标已变为`蓝色` 半球，这表示我们将在场景中绘制时使用的笔刷大小。我们稍后将深入如何绘制植被，首先重点理解如何有效地使用\
  \ `Paint` 工具。\n\n![图 7.6 – 植被笔刷](img/B21600_07_6.png)\n\n图 7.6 – 植被笔刷\n\n当选择任何类型的植被时，会展开一个菜单，显示一系列影响植被在场景中绘制方式的细节。\n\
  \n![图 7.7 – 植被细节菜单：网格 (1)、绘制 (2)、放置 (3) 和实例设置 (4)](img/B21600_07_7.png)\n\n图 7.7\
  \ – 植被细节菜单：网格 (1)、绘制 (2)、放置 (3) 和实例设置 (4)\n\n此菜单包含许多功能，但我们重点关注几个关键功能：\n\n*   **Mesh\
  \ (网格)**：在这里，我们有静态网格以及用于生成实例的类。\n*   **Painting (绘制)**：此功能允许我们修改网格在场景中的绘制方式。我们可以调整每\
  \ 10 平方米的实例密度（`Density`）、避免重叠的实例间距（`Radius`），甚至调整缩放以引入尺寸的多变性（`Scaling`）。\n*   **Placement\
  \ (放置)**：在此部分中，我们调整实例在场景中的定位方式。我们可以为放置设置高度偏移（`Z Offset`）、确定实例是否应垂直于表面对齐（`Align to\
  \ Normal`）、引入围绕 `Z` 轴的随机旋转（`Random Yaw`）、调整放置的角度（`Ground Slope Angle`）并指定高度（`Height`）。\n\
  *   **Instance Settings (实例设置)**：此部分调整各种选项，例如生成阴影和碰撞的能力，以及使用 `Lighting Channels`（光通道）控制实例如何接收来自不同类型光源的光照。\n\
  \n![图 7.8 – 植被细节菜单：光通道](img/B21600_07_8.png)\n\n图 7.8 – 植被细节菜单：光通道\n\n*   **Cull\
  \ Distance (裁剪距离)**：一个与优化相关的重要属性是 `Cull Distance`，默认情况下 `Min` 和 `Max` 值均设置为 `0`，这意味着已禁用。该距离在\
  \ `Min` 和 `Max` 值之间变化，以确保资产逐渐淡出而不是突然消失。\n*   **Scalability (可扩展性)**：激活此项允许对植被密度进行实时控制。你可以通过\
  \ `foliage.DensityScale` 启用它，值范围从 `0.1` 到 `1.0`。\n\n## 使用植被工具\n\n从现在起，我们在章节开头看到的**植被\
  \ (Foliage)** 工具面板再次变得至关重要。\n\n![图 7.12 – 植被工具](img/B21600_07_12.png)（注：为了上下文添加了引用）\n\
  \n### Paint (绘制)\n\n当我们使用各种工具时，选项将主要以笔刷的形式打开，以调整绘制方式。自然地，为了开始绘制，我们选择 `Paint` 选项。\n\
  \n通过此工具，我们可以修改笔刷大小（`Brush Size`）、绘制密度（`Paint Density`）以及擦除密度（`Erase Density`）。这些密度充当植被密度的倍数。\n\
  \n重要说明\n\n作为一个非常重要的建议，如果你正在处理关卡，必须确保你正在正确的关卡中工作。确保 **Place in Current Level**（见*图\
  \ 7.13*）选项处于激活状态，以确保植被放置在正确的关卡中。\n\n![图 7.13 – 植被工具：绘制](img/B21600_07_13.png)（注：为了上下文添加了引用）\n\
  \n以这种方式工作，所有信息（包括植被在场景中的位置以及我们用于绘制的面板）将保存在植被 Actor 中。\n\n![图 7.14 – 显示植被 Actor 和实例的大纲视图](img/B21600_07_14.png)\n\
  \n\n\n\n\n在此，取决于选择的关卡管理系统，会出现两种情况：传统关卡或 `World Partition`。在传统工作流中，当我们把 `Static Mesh\
  \ Foliage` 拖入调色板时，`Outliner` 中会创建一个 `InstanceFoliageActor` 类，它收集了关于我们植被实例的所有信息。相反，如果我们使用的是基于距离的自动数据管理和关卡流送系统（`World\
  \ Partition`），则在我们进行第一次笔画（拖入时）时会创建 `InstanceFoliageActor`。\n\n*图 7.15* 展示了绘制和擦除植被在\
  \ `Viewport` 中的显示效果，有助于可视化上述描述的过程：\n\n![Figure 7.15 – Paint and erase](img/B21600_07_15.jpg)\n\
  \n图 7.15 – 绘制与擦除\n\n### Erase\n\n与 `Paint` 工具类似，使用 `Erase` 工具时也会出现相同的选项（参见*图 7.16*）。但在这种情况下，我们的目标是移除植被。我们可以通过按住\
  \ `Shift` 键并使用`left mouse button`（左鼠标键）来实现这一点，就像绘制时一样。\n\n![Figure 7.16 – Foliage\
  \ tools: Erase](img/B21600_07_16.png)\n\n图 7.16 – 植被工具：擦除\n\n### Lasso\n\n此工具允许使用笔刷选择实例，类似于使用\
  \ `Paint` 或 `Erase` 工具。\n\n![Figure 7.17 – Foliage tools: Lasso](img/B21600_07_17.png)\n\
  \n图 7.17 – 植被工具：套索工具\n\n在这种情况下，你只能调整笔刷大小并使用过滤器指定选择应用范围。要在拖动笔刷时取消选择实例，请使用 `Shift`\
  \ + `left mouse button`。\n\n![Figure 7.18 – Foliage tools: \uFEFFLasso (result)](img/B21600_07_18.jpg)\n\
  \n图 7.18 – 植被工具：套索工具（结果）\n\n### Deselect\n\n使用此工具，我们可以取消所有之前使用 `Lasso` 工具选中的实例。\n\
  \n![Figure 7.19 – Foliage tools: Deselect](img/B21600_07_19.png)\n\n图 7.19 – 植被工具：取消选择\n\
  \n### Remove\n\n使用此工具，我们可以移除所有之前使用 `Lasso` 工具选中的实例。\n\n![Figure 7.20 – Foliage tools:\
  \ Remove](img/B21600_07_20.png)\n\n图 7.20 – 植被工具：移除\n\n### Select\n\n使用 `Paint`\
  \ 工具绘制植被后，我们可以单独选择实例，以便随后删除它们，甚至可以执行移动、旋转和缩放等变换操作。\n\n![Figure 7.21 – Foliage tools:\
  \ Select](img/B21600_07_21.png)\n\n图 7.21 – 植被工具：选择\n\n### All\n\n使用此工具，你可以通过单击来选择所有实例。一旦选中，你可以使用\
  \ `Remove` 删除它们，或使用 `Move` 将它们移动到当前关卡。\n\n![Figure 7.22 – Foliage tools: Remove\
  \ and Move](img/B21600_07_22.png)\n\n图 7.22 – 植被工具：移除与移动\n\n### Single\n\n此工具允许你每次点击鼠标放置一个植被。每点击一次，它都会从调色板中选定的植被类型中随机绘制一种。\n\
  \n![Figure 7.23 – Foliage tools: Single](img/B21600_07_23.png)\n\n图 7.23 – 植被工具：单次\n\
  \n### Fill\n\n此工具允许我们用过滤器中选的植被来填充场景中的任何类型的 `Actor`。\n\n![Figure 7.24 – Foliage tools:\
  \ Fill](img/B21600_07_24.png)\n\n图 7.24 – 植被工具：填充\n\n如你所见，没有选择 `Landscape`（地形）的选项，因为它覆盖的面积很大，可能会显著影响项目性能。如果我们以平面、球体或盒体为例，每次\
  \ `left-click`（左点击）都会根据我们为这些实例设置的配置来填充植被。\n\n![Figure 7.25 – Foliage tools: Fill\
  \ meshes](img/B21600_07_25.png)\n\n图 7.25 – 植被工具：填充网格\n\n### Reapply\n\n一旦绘制了植被，你可以更改实例的某些参数。\n\
  \n![Figure 7.26 – Foliage tools: Reapply](img/B21600_07_26.png)\n\n图 7.26 – 植被工具：重新应用\n\
  \n操作步骤如下：\n\n1. **选择植被类型**：使用 `Reapply` 工具从调色板中选择你想要应用更改的植被类型。\n2. **调整细节**：在植被的\
  \ `Details`（细节）部分中进行所需的更改。\n3. **应用更改**：将更改绘制到关卡中的实例上。\n\n![Figure 7.27 – Applying\
  \ changes with Reapply tool](img/B21600_07_27.png)\n\n图 7.27 – 使用 Reapply 工具应用更改\n\
  \n### 注意事项\n\n选择和取消选择实例可能是一个很好的练习。\n\n\n\n\n植被通常会有运动以模拟风力效果，这通常通过使用材质和顶点着色器修改顶点位置来实现，特别是在使用\
  \ `World Position Offset` 时。对于距离摄像较远且运动几乎不可觉的植被，不需要进行动画处理。在这种情况下，我们可以使用 `Static\
  \ Mesh Foliage` 中的 `World Position Offset Disabled Distance` 属性禁用这种运动。设置一个距离摄像的距离（例如\
  \ 2,500 cm）将防止 `World Position Offset` 影响该点之外的植被。这有助于减少计算、避免意外的伪影并保持最佳性能。\n\n![Figure\
  \ 7.33 – World Position Offset Disable Distance](img/B21600_07_33.png)\n\n图 7.33\
  \ – World Position Offset Disable Distance\n\n更优的方案是对植被使用 `Nanite`。要激活此几何虚拟化系统，进入\
  \ Mesh Editor，找到 `Nanite Settings` 部分，并勾选 `Enable Nanite Support`。应用更改并保存。如果你发现植被在场景中看起来很扁平，请额外选择\
  \ `Preserve Area` 以确保在减少多边形数量时，能够有效地保持体积（或屏幕面积）。\n\n![Figure 7.34 – Enable Nanite](img/B21600_07_34.png)\n\
  \n图 7.34 – Enable Nanite\n\n##  Lighting\n\nUnreal 的渲染引擎 `Lightmass` 会根据每个实例的需要单独生成阴影图和光照贴。在\
  \ Static Mesh 中有几个设置必须检查，以确保预计算光照能与植被良好结合。设置不当会导致构建光照后出现黑色网格：\n\n*   检查 Unreal 是否使用正确的\
  \ UV 通道来生成光照贴，并确保 UV 已正确展开。如果未展开，只要网格至少有一个正确的 UV 通道，Unreal 就可以快速生成它们。\n*   光照贴分辨率应该足够小，允许单个组/簇（group/cluster）内实例的所有阴影图（默认为\
  \ `100`）分组，而不超过最大纹理分辨率（`4096 x 4096`）。\n\n## Textures\n\n优化植被的另一个重要点是纹理的使用，纹理往往过大，尤其是高质量的\
  \ Megascans 植被。\n\n理想情况下，从头创建植被是最优的，但在处理 Megascans 资产时，Quixel Bridge 提供的最小纹理分辨率为\
  \ `1024 x 1024 px`。然而，这并不意味着你必须始终这种分辨率。这取决于植被的类型和 `Static Mesh` 的大小。\n\n例如，对于茎非常细的\
  \ `Wild Grass`，`256 x 256 px` 的纹理可能足够了。另一方面，对于具有大树干的森林，你可能需要 `2048 x 2048 px` 的纹理。\n\
  \n不同类型的植被需要不同的纹理分辨率，因此为每种情况专门配置纹理非常重要。在纹理编辑器中，在 `Compression` 部分，将 `Maximum Texture\
  \ Size` 从默认值 `0`（意味着无限制）调整为 2 的幂值，在显著减少内存负载的同时保持场景中的细节：\n\n![Figure 7.35 – Maximum\
  \ Texture Size](img/B21600_07_35.png)\n\n图 7.35 – Maximum Texture Size\n\n对于拥有一组纹理的\
  \ `Static Mesh`，你可以单独编辑它们，但考虑到项目可能有很多纹理，一起编辑它们会更高效。操作方法如下：\n\n1.  同时选择所有想要修改的纹理。\n\
  2.  `Right-click` 弹出上下文菜单。\n3.  导航到 `Asset Actions` 并选择 `Edit Selection in Property\
  \ Matrix`（ 5.3 之前的 Unreal 版本使用 `Bulk Edit in Property Matrix`）。\n\n此操作允许你高效地对多个选中的纹理属性进行批量编辑。\n\
  \n![Figure 7.36 – Edit Selection in Property Matrix](img/B21600_07_36.png)\n\n图\
  \ 7.36 – Edit Selection in Property Matrix\n\n1.  现在，将打开一个窗口，显示纹理编辑器本身可见的所有纹理属性。在右侧出现的\
  \ `Pinned Columns` 标签中，你会找到 `Compression` 部分，在那里你再次找到 `Maximum Texture Size` 来设置所需的分辨率。\n\
  \n![Figure 7.37 – Maximum Texture Size on Edit Selection in Property Matrix](img/B21600_07_37.png)\n\
  \n图 7.37 – Maximum Texture Size on Edit Selection in Property Matrix\n\n在本节中，我们讨论了构成植被的\
  \ Static Meshes 的各种审核策略。这些考虑重点在于提高我们项目的实时性能。根据项目的大小和 PC 的硬件规格，我们可以使用它们在编辑器中和运行期间维持性能。\n\
  \n# Summary\n\n在本章中，我们深入研究了使用 Unreal Engine 的 `Foliage Mode` 来高效地在我们的环境中填充植被。我们学习了如何使用\
  \ `Paint`、`Erase`、`Fill` 和 `Select` 等工具选择、配置和涂涂各种类型的植被。此外，我们讨论了优化实例密度、配置适当的 LOD、管理植被运动和光照以及调整纹理以在不牺牲视觉质量的情况下增强性能的重要性。\n\
  \n通过熟练掌握 `Foliage Mode` 并应用优化技术，我们可以在 Unreal Engine 中创建更具浸感和动态的世界。在视觉保度和项目性能之间取得平衡至关重要，确保我们的环境不仅看起来很好，而且在不同的硬件配置上运行良好。理解这些工具和技术使开发者能够构建既惊艳又高效的环境，从而提升用户的整体游戏体验。\n\
  \n在下一章中，我们将处理材质。我们将从理解与材质相关的基本概念以及与材质创建相关的界面开始。我们将学习 Unreal Engine 中 PBR Material\
  \ 的原理。最后，我们将讨论从纹理创建材质以及用于景观的材质。\n\n# Subscribe to Game Dev Assembly Newsletter!\n\
