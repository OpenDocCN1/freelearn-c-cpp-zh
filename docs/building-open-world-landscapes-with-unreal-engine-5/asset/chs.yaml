  \n## 图籍附带的免费福利\n\n您的购买包含本书的一份免费 PDF 副本以及其他专属福利。请查看序言中的*图籍附带的免费福利*章节以立即解锁它们，并最大化您的学习体验。\n\
  \n# 技术要求\n\n`Unreal Engine` 对于 `version 5.5` 有最低和推荐的硬件要求，并且针对其高级渲染功能有特殊的硬件要求。\n\n\
  这些特殊要求确保了 `UE5` 中的高级渲染功能能够充分发挥其潜力，并提供最佳的视觉质量和性能。如果您计划在项目中大量使用这些功能，那么满足或超过这些要求至关重要。\n\
  \n以下是概览。\n\n这些是最低硬件要求：\n\n* **操作系统**：Windows 10 64 位版本\n* **处理器**：双核 Intel 或 AMD，2.5\
  \ GHz 或更高\n* **内存**：8 GB RAM\n* **显卡**：至少 1 GB VRAM 的 DirectX 11 兼容显卡\n* **硬盘**：100\
  \ GB 空闲空间（推荐使用 SSD）\n\n### 重要说明\n\n请注意，这些是运行引擎和处理基础项目的最低要求。更复杂的项目或使用高级功能可能需要更好的硬件。\n\
  \n这些是推荐的硬件要求：\n\n* **操作系统**：Windows 10 64 位版本 1909 revision .1350 或更高，或者版本 2004\
  \ 和 20H2 revision .789 或更高版本\n* **处理器**：四核 Intel 或 AMD，2.5 GHz 或更高\n* **内存**：8 GB\
  \ RAM\n* **显卡**：带有最新驱动程序的 DirectX 11 或 12 兼容显卡\n\n### 注意\n\n这些推荐配置在运行 `Unreal Engine`\
  \ 和 `UE5` 时将提供更流畅、更高效的体验，特别是对于较大的项目。\n\n## UE5 的特殊硬件要求\n\n`UE5` 引入了诸如 `Lumen Illumination`（光线光照）、`Nanite`\
  \ 虚拟几何体等高级渲染功能。这些功能可能具有额外的硬件要求以充分利用其能力。\n\n以下是 `Lumen Illumination` 和 `Reflections`（反射）的要求：\n\
  \n* **软件光线**：此功能可能需要支持 Shader Model 5 的显卡\n* **硬件光线**：需要 Windows 10 build 1909.1350\
  \ 或更高，支持 DirectX 12 以及特定的兼容显卡（例如 NVIDIA RTX-2000 系列或更高、AMD RX-6000 系列或更高、Intel Arc\
  \ 系列显卡）\n\n以下是 Nanite 虚拟几何体的要求：\n\n* Windows 10 build 1909.1350 或更高，或者支持 DirectX\
  \ 12 Agility SDK 的 Windows 11\n* 需要 DirectX 12（带有 Shader Model 6.6 原子操作）或 Vulkan\
  \ (`VK_KHR_shader_atomic_int64`)\n* 必须在项目设置中启用 **SM6** (**Shader Model 6**)（新项目默认启用）\n\
  \n## 其他渲染功能\n\n`UE5` 对其他渲染功能可能有特定的硬件要求或建议，因此查看官方 `UE5` 文档以获取最新信息至关重要。\n\n**重要说明**：在编写时，使用的是较早版本的\
  \ `Unreal Engine`。然而，截图、示例和练习已经过审查，以反映 5.6 版本引入的更改。由于界面不断更新，您可能仍会在菜单、布局或命名规范上看到细微差异。这些差异不会影响您遵循指令或完成练习。\n\
  \n# 学习 Unreal Engine 术语\n\n在本节中，我们将探索 `Unreal Engine` 场景下常用的关键术语，阐明基础概念：\n\n\n\n\
  \n\n*   **Project（项目）**：Unreal Engine 项目是你创作活动中所有元素的容器。它允许你通过将内容组织到文件夹中构建工作。每个项目由一个\
  \ `.uproject` 文件表示，这对于项目的创建、打开和保存至关重要。这一概念将虚幻引擎与其他`数字内容创建` (`DCC`) 工具区分开来，因为它采用了基于项目的方法，这由于其起源于游戏引擎，编译在其中起着关键作用。\n\
  *   **Blueprint（蓝图）**：`Blueprint 视觉脚本系统`是 Unreal Editor 中一个全面的游戏性脚本工具。它采用基于节点的界面来构建游戏元素。使用蓝图创建的对象通常通称为\
  \ `Blueprints`。这种区别使得虚幻引擎脱颖而出，为非 C++ 程序员提供了一种实现编程逻辑的强大方法。\n*   **Object（对象）**：对象代表虚幻引擎中的基础构建块。本质上，它们封装了资产的核心功能。对象（或\
  \ C++ 中称为 `UObjects`）是所有其他虚幻引擎类的父类。换句话说，虚幻中的每个元素或类都派生自 `UObject`。\n*   **Actor（Actor）**：Actor\
  \ 是任何虚幻引擎项目的骨干，代表了所有可以放置或生成在游戏关卡中的对象。这一广泛的类别包含了多种元素，例如从不同角度捕捉游戏世界的摄像、提供游戏内物理结构和对象的静态网格体，或定义玩家进入游戏世界的玩家起始位置。Actor\
  \ 是多用途的，并支持 3D 变换，使其能够在游戏空间内移动（平移）、旋转和更改大小（缩放）。它们的生命周期是动态的；它们可以在游戏过程中通过脚本代码进行实例化或移除，从而允许随时间变化或响应玩家操作而变化的交互性和响应式游戏环境。\n\
  *   **Pawn（代理类）**：Pawn 是 Actor 的特殊子类，设计用于作为玩家或 AI 实体在游戏中的表现或化身。它们本质上是游戏中具有某种形式的代理能力的字符或实体。与更广泛的\
  \ `Actor` 类不同，Pawn 专门用于被控制。它们可以由人类玩家引导，为玩家与游戏世界的交互提供直接界面，也可以由游戏的 AI 自动控制和驱动，作为具有不同复杂程度自主性的\
  \ `非玩家角色` (`NPCs`)。这种双重性允许玩家控制的字符与游戏环境（包括 AI 控制的实体）之间进行丰富的交互。\n*   **Character（角色）**：在虚幻引擎类的层次结构中，Character\
  \ 是 Pawn 的进一步完善，专为更复杂的、玩家控制的实体定制，通常是那些用双腿行走或需要复杂的运动动力学的实体。该子类针对双足移动进行了优化，并预配置了碰撞检测设置（这对于与游戏世界进行真实的交互至关重要）以及将玩家动作映射到角色移动和行为的输入绑定。角色的设计旨在便于创建具有高级能力的玩家化身，包括跑步、跳跃和其他玩家角色通常执行的动作，并由额外的代码支持，这些代码增强了游戏中玩家控制角色的交互性和响应性。\n\
  *   **Brush（刷子）**：Brush 是 Actor 的一种类型，用于定义 3D 形状，例如立方体或球体。它们在关卡几何设计中很有用，被称为 `二叉空间划分`\
  \ (`BSP`) 刷子。虽然它们对于快速关卡布局（Blocking）很有用，但通常不作为关卡设计的最终方法。相反，随着项目的进行，它们通常会被静态网格体取代。虚幻引擎还提供了现代的几何建模和关卡布局方法，这些将在*第\
  \ 6 章*中讨论。\n*   **Level（关卡）**：虽然我们将在*第 5 章 中讨论关卡，但从这段旅程开始就了解这是一个重要概念。虚幻引擎中的关卡是一个自包含的环境或场景，游戏性在此发生。它是构成游戏空间的所有元素的组合，包括形成物理世界的几何体、填充其中的\
  \ Actor 和 Pawn，以及定义玩家体验的各种交互和静态对象。每个关卡的设计都是为了提供一套独特的挑战、叙事和美学，封装在 `.umap` 文件中。关卡是游戏展开的舞台或世界，由开发者设计以创建沉浸式且引入胜的环境。它们是绘制游戏故事的画布，允许游戏机制、叙事元素以及游戏的视觉和听觉体验无缝整合。\n\
  *   **World（世界）**：世界是构成你的游戏或项目的所有关卡的容器。通常，世界被组织成特定的关卡，每个关卡都有独特的用途，例如光照、事件或几何。世界和关卡的组织取决于项目需求，强调了根据项目的特定需求量定制此结构的重要性。在做出这些组织决策时，理解项目的范围至关重要。\n\
  \n现在已经理解了技术要求（包括虚幻引擎中的技术和关键概念），让我们探索可以在哪里找到安装程序和安装过程。\n\n# 安装虚幻引擎\n\n要开始，你需要按照以下步骤安装\
