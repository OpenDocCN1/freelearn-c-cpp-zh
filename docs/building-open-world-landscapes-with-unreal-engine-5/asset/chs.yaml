  \ VERSIONS`的区域。要安装特定版本的虚幻引擎，点击`ENGINE VERSIONS`旁边的`+`图标。\n14. 虚幻引擎提供了多个可选版本。从列表中选择你需要的版本。\n\
  \n根据你的计算机配置和互联网连接速度，虚幻引擎的下载和安装可能需要 10 到 40 分钟或更长时间。\n\n1.  选择好版本后，点击`Install`按钮。启动器将开始下载并安装特定版本的虚幻引擎。\n\
  2.  安装完成后，点击`Launch`按钮启动你安装的虚幻引擎。\n\n\n\n\n\n你的计算机上可以安装多个版本的 Unreal Engine。请记住在右上角的\
  \ `Launch`（启动）按钮下拉列表中选择你偏好的版本；建议使用 Unreal Engine 5.5 或更高版本。你只能从已安装的版本中进行选择。\n\n\
