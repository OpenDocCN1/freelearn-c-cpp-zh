  \ |\n\n# 2\n\n# Quixel Bridge, Megascans 和 Fab\n\n在本章中，我们将深入研究 `Unreal Engine 5`\
  \ (`UE5`) 的技术细节，将重点转向其对于项目开发至关重要的资产管理工具和插件。在第一章建立的基础理解基础上，本章旨在分析 `Fab` 平台的功能、`Quixel\
  \ Bridge` 插件的技术方面以及不断增长的 `Megascans` 库。\n\n在探索了 Unreal Engine 周围的生态系统以及 Epic Games\
  \ 的系列收购后，我们将讨论 `Fab`——这是 Epic Games 最新的市场创新。本节将剖析它在统一来自 `Quixel`、`Sketchfab`、`Unreal\
  \ Engine Marketplace`（现为 `Fab`）和 `ArtStation Marketplace` 的数字资产供应方面的作用。重点将放在导航涵盖\
  \ 3D 模型、材质、音效、VFX 和数字人的广泛目录，并将这些资产集成到 Unreal Engine 的统一工作流中。\n\n`Quixel Bridge`\
  \ 插件是 Unreal Engine 生态系统的关键组成部分，提供了一个用户友界面，可以直接在 `Level Editor`（关编辑器）中访问和管理 `Megascans`\
  \ 库。它支持高级功能，如资产浏览、定向搜索以及将包括 `MetaHumans` 在内的资产无缝集成到 Unreal Engine 项目中。\n\n随后，我们将深入研究\
  \ `Megascans` 库的细节。作为高保真 3D 资产、材质和各种环境材质的综合仓库，Megascans 提供了无可拟的真实感细节，这对于创建沉浸式环境至关重要。本章将涵盖如何下载\
  \ Megascans 资产并将其导入 Unreal Engine，以及在添加到项目后如何对其进行组织和配置。\n\n本章将涵盖的关键主题包括：\n\n*  \
  \ Unreal Engine 生态系统的演变及其收购情况的理解\n*   介绍 `Fab` – 一个引擎，一个市场\n*   介绍 `Quixel Bridge`\n\
  *   导入并集成 `Megascans` 资产\n*   理解导入的资源\n*   练习 2.1：从 `Quixel Bridge` 向 Unreal Engine\
  \ 添加 3D 资产\n*   练习 2.2：为 `Static Mesh`（静态网格）选择并应用材质\n*   为什么在 `Quixel Bridge` 中资产配置很重要？\n\
  \n本章旨在为这些工具提供深入的技术见解，重点关注 UE5 中资产管理和集成的效率与质量。\n\n# 技术要求\n\n本章的技术要求与与第一章](#Chapter_1.xhtml__idTextAnchor020)\
  \ 的规范相同。请参考该章节，但让我们记住对于带有 `Lumen 全局光照和反射` 以及 `Nanite` 虚拟几何体的 UE5 工作所需的推荐硬件：\n\n\
  *   **操作系统**：Windows 10 64 位版本 1909 修订 .1350 或更高版本，或 2004 和 20H2 修订 .789 或更高版本。支持\
  \ `DirectX 12 Agility SDK`\n*   **处理器**：四核 Intel 或 AMD，2.5 GHz 或更高\n*   **内存**：8\
  \ GB RAM\n*   **软件光追踪**：此功能可能需要支持色器模型 5 的 `DirectX 11` 视频\n*   **硬件光追踪**：这需要 Windows\
  \ 10 版本 1909.1350 或更高版本，并支持 DirectX 12 的兼容显卡（例如 NVIDIA RTX-2000 系列或更高、AMD RX-6000\
  \ 系列或更高、Intel A 系列显卡）\n*   **网络访问**：需要连接网络以下载本章所需的插件和内容\n\n# Unreal Engine 生态系统的演变及其收购情况的理解\n\
  \n让我们回溯一下 Unreal Engine 生态系统这个动态且不断扩张的宇宙。它的主要目标是成为一个全面的工具和平台组合，共同定义数字创作格局。虽然生态系统中的许多资源是免费的（例如在\
  \ Unreal Engine 内部使用 Quixel 资产），但其他工具和平台遵循自己的许可或市场模式。\n\n为了给 Unreal Engine 生态系统的演变提供背景，仔细研究其战略扩张和收购至关重要。后续涵盖\
  \ `Unreal Engine Marketplace`（现名为 `Fab`）、`Quixel`、`ArtStation` 和 `Sketchfab` 的小节是理解\
  \ Epic Games 如何增强 Unreal Engine 功能和提供的关键支柱。每个平台都有其独特的贡献，对于扩大创作者可用的工具和资产范围至关重要。\n\
  \n\n\n\n\n# 虚幻引擎商城（现为 Fab）\n\n`Unreal Engine Marketplace` 一于 2014 年 9 月 4 日发布，它是数字创作领域的基石，提供了大量专为虚幻引擎设计的艺术资源、资产和工具。通过提供易于获取的高质量资源，它实现了游戏开发和艺术的民主化。商城培养了一个充满活力的社区，并为后来的\
  \ `Fab` 奠定了基础——`Fab` 是 Epic Games 的统一平台，现在将 `Marketplace`、`Quixel` 以及其他 Epic 资产库集成到单一生态系统中（请参见\
  \ `介绍 Fab – 一个引擎，一个市场` 章节）。它的诞生标志着虚幻引擎作为全面的实时 3D 创作工具演进过程中的一个重要里程碑。\n\n# Quixel\n\
  \n2019 年 11 月 12 日，Epic Games 在伦敦的虚幻引擎学院发布了一项重大公告：`Quixel` 将成为其庞大生态系统的一部分。这次整合对于虚幻引擎用户来说是一个关键时刻，因为这意味着他们无需额外费用即可不受限制地访问整个\
  \ `Megascans` 库。\n\n### 注意\n如果您想进一步了解有关此次整合及其影响的信息，我们建议查看以下链接：[`www.unrealengine.com/en-US/blog/epic-games-and-quixel-join-forces-to-empower-creators`](https://www.unrealengine.com/en-US/blog/epic-games-and-quixel-join-forces-to-empower-creators)。\n\
  \n# ArtStation\n\n2021 年 4 月 30 日，Epic Games 宣布收购 `ArtStation`，这是数字艺术家社区的领先平台。这一重大举措将\
  \ `ArtStation` 广泛的艺术家网络及其丰富的创意内容库整合到 Epic Games 生态系统中。此次收购旨在赋能各个学科的艺术家，为他们提供更多的资源和工具。\n\
  \n### 注意\n有关此次收购的更多详细信息和见解，请查看此链接：[`www.epicgames.com/site/en-US/news/artstation-is-now-part-of-epic-games`](https://www.epicgames.com/site/en-US/news/artstation-is-now-part-of-epic-games)。\n\
  \n# Sketchfab\n\n2021 年 7 月 21 日，Epic Games 和 `Sketchfab` 宣布 3D 内容创作和分发领域的一项重大进展。`Sketchfab`\
  \ 以其广泛的 Web 服务闻名，该服务简化了 3D 内容的发现、编辑、购买和销售，加入了 Epic Games 庭。`Sketchfab` 拥有超过 400\
  \ 万个 3D 资产的强大集合，并在主要的 3D 工具和平台中实现了全面的技术集成。这一举是扩展创作者生态系统并推进互联元宇宙愿景的战略性一步。\n\n###\
  \ 注意\n有关 `Sketchfab` 的更多信息，请访问以下链接：[`www.epicgames.com/site/en-US/news/sketchfab-is-now-part-of-epic-games`](https://www.epicgames.com/site/en-US/news/sketchfab-is-now-part-of-epic-games)。\n\
  \n总体而言，虚幻引擎是一个强大且灵活的数字创作平台。从基础引擎到多样化且战略性的整合与创作，例如 `Unreal Engine Marketplace`（现为\
  \ `Fab`）、`ArtStation`、`Sketchfab`、`Twinmotion` 和 `RealityCapture`，该生态系统仍在不断进化。\n\
  \n\n\n\n\n要购买产品，请打开其页面，从下拉菜单中选择许可，并点击`Buy Now`或`Add to Cart`。如果需要，系统会提示你接受最新的`End\
  \ User License Agreement` (`EULA`)。在检查购物车后，继续结账并按照支付步骤操作。订单完成后，你将收到确认，并能够从列表或`My\
  \ Library`下载你的产品。\n\nUnreal Engine 和 UEFN 产品必须通过 Fab 插件或 Epic Games Launcher 下载。\n\
  \nFab 上的免费内容很容易找到和领取。你可以通过`Price` | `Free` 进行过滤，或者探索 `Discover` | `Offers` 下的 `Limited-Time\
  \ Free` 部分。产品也可能出现在 `Free Content` 类别或特定的促销页面上。\n\n要获取免费资产，请接受 EULA 并直接下载资产或将其添加到你的库中。\n\
  \n### 我的库与下载\n\n所有获取的产品都存储在 Fab 的 `My Library` 标签页中，该标签页提供了资产的集中视图。从此部分，你可以浏览收藏、使用搜索栏并应用过滤器来快速定位特定项目。\n\
  \n#### 注意\n\n虽然下载可以是匿名的，但若要将项目保存到库中供以后使用，则登录。在*图 2.4*中，你可以看到存储在 `My Library` 部分的所有已获取项目。\n\
  \n![Figure 2.4 – My Library](img/B21600_02_004.png)\n\n图 2.4 – 我的库\n\n虽然创建者提供的所有格式都可以直接从\
  \ Fab 网站下载，但还有其他访问和管理内容的方法。\n\n### 在 Unreal Engine 中使用 Fab\n\n对于用于 Unreal Engine\
  \ 的资产，当使用相同的 Epic Games 账户时，也可以通过 Epic Games Launcher 中的 Fab 库获取这些文件。为了确保产品显示在 Launcher\
  \ 中，你必须先将它们添加到你的 Fab 库中。添加后，资产可以在 Launcher 的 `Library` 部分中访问，允许你轻松地将其集成到你的 Unreal\
  \ Engine 项目中，如*图 2.5*所示：\n\n![Figure 2.5 – Epic Games Launcher – Fab Library](img/B21600_02_005.png)\n\
  \n图 2.5 – Epic Games Launcher – Fab Library\n\n#### 注意\n\n如果你安装了 UE 版本 5.3 或 5.4，则需要手动从\
  \ Epic Games Launcher 中的 Fab 库下载插件。对于新的引擎安装或更新，插件会自动包含在内。\n\n安装完成后，可以通过 Unreal Engine\
  \ 顶部的菜单通过 `Window` | `Fab` 访问 Fab，或者通过点击工具栏上的 `Fab` 图标通过内容抽屉进行访问（见*图 2.6*）。示例项目需要将资产添加到你的库中并通过\
  \ Launcher 下载，而基于项目基础的内容可以直接导入到已打开的项目中。\n\n![Figure 2.6 – Fab tool location and\
  \ interface inside Unreal Engine](img/B21600_02_006.png)\n\n图 2.6 – Unreal Engine\
  \ 内部 Fab 工具的位置和界面\n\nFab 代表了数字资产管理和集成的一大跨越，由 Epic Games 设计。作为一个统一的市场平台，它将 Unreal\
  \ Engine 生态系统中来自不同平台的一系列资产汇聚。这种在 Unreal Engine 内的集成反映了 Quixel Bridge 的功能，为将各种数字资产直接导入到项目场景提供了一个精简且高效的过程。用户还可以通过集成的\
  \ Sketchfab 3D 查看器检查拓扑、纹理和动画等细节，确保在选择内容时做出明智的决策。\n\n凭借用户友好的界面和大量的高质量资产库，Fab 简化了\
  \ Unreal Engine 用户的工作流。它的集成反映了 Epic Games 对赋能创作者和增强 Unreal Engine 生态系统的持续承诺。\n\n\
  Fab 生态系统背后的关键技术之一是 Quixel，其工具（最著名的 Quixel Bridge）构 Unreal Engine 实时世界构建流水线的基础部分。在下一节中，我们将探索\
  \ Quixel Bridge 如何驱动高质量资产工作流，并在 Unreal Engine 的环境创建中发挥核心作用。\n\n# 介绍 Quixel Bridge\n\
  \n在本节中，我们将注意力转向实际应用，特别是在 Unreal Engine 环境下操作 `Quixel Bridge`。要开始这一手操性探索，第一步是打开你的\
  \ Unreal Engine 项目。Quixel Bridge 无缝集成到 Unreal Engine 中，是通往大量高质量资产库的强大门户。这种集成简化了将写实\
  \ 3D 资产直接导入你的项目的过程，提升了作品的效率和视觉质量。\n\n### 为 Unreal Engine 启用 Quixel Bridge\n\nQuixel\
  \ Bridge 默认包含在你的 UE5 安装中。要验证并激活 Unreal Engine 环境中的 Quixel Bridge 插件，请遵循以下步骤：\n\n\
  1.  导航到 `Edit`，然后从下拉菜单中选择 `Plugins`。\n2.  在 `Plugins` 窗口中，通过在搜索栏输入 `Quixel Bridge`\
  \ 使用搜索功能。\n3.  找到 Quixel Bridge 插件后，点击其旁边的复选框确保已激活，如*图 2.7*所示：\n\n![Figure 2.7 –\
  \ Searching for the Quixel Bridge plugin](img/B21600_02_007.png)\n\n图 2.7 – 搜索 Quixel\
  \ Bridge 插件\n\n1.  如果在你的 `Plugins` 窗口未列出 `Quixel Bridge` 插件，可能需要通过 Epic Games Launcher\
  \ 进行额外的安装步骤。要执行此操作，请采取以下步骤：\n    1.  打开 Epic Games Launcher 并导航到 `Library` 部分。\n\
  \    2.  在此区域内，滚动到 `Fab Library` 部分并在搜索栏中输入 `bridge`，如*图 2.8*所示。\n    3.  在搜索结果中找到\
  \ Quixel Bridge 后，选择 `Install to Engine`。这将插件集成到你的引擎中。\n\n![Figure 2.8 – Epic Games\
  \ Library](img/B21600_02_008.png)\n\n图 2.8 – Epic Games Library\n\n安装完成后，重启 Unreal\
  \ Engine 并通过 `Edit` | `Plugins` 启用新安装的 Quixel Bridge 插件。\n\n### 在 Unreal Engine\
  \ 中启动 Quixel Bridge\n\n在 Unreal Engine 编辑器中，可以通过多个位置访问 Quixel Bridge，为项目集成资产提供了活性。以下是访问\
  \ Quixel Bridge 的方法：\n\n*   一种直接的方法是通过内容快捷方式——一个快速高效的入口。\n*   或者，你可以通过顶部菜单选择 `Window`\
  \ 并选择 `Quixel Bridge` 来访问 Quixel Bridge。\n*   另一种方便的方法是在 `Content Browser` 中；只需在空白处*右键点击*并导航到\
  \ `Get Content` 部分即可找到 Quixel Bridge。\n\n我们看到访问 Quixel Bridge 的三种选项：\n\n![Figure\
  \ 2.9 – Locations from where Quixel Bridge is accessible](img/B21600_02_009.png)\n\
  \n图 2.9 – 访问 Quixel Bridge 的位置\n\n建议尝试每种方法，这将允许你设置此后的偏好。\n\n### 在 Unreal Engine\
  \ 中使用 Quixel Bridge\n\nQuixel Bridge 专为与 Unreal Engine 集而设计，兼容多个操作系统，包括 Windows、macOS\
  \ 和 Linux。\n\n\n\n\n\nQuixel Bridge 的一项关键操作要求是拥有`active internet connection`。这种连接对于从其在线内容库显示和下载资产至关重要。然而，Quixel\
  \ Bridge 也考虑了可能无法连接网络的情况。在这种情况下，你仍然可以访问本地存储。这可以通过导航到 `Local` 标签页来实现，该标签方便地位于 Quixel\
  \ Bridge 的左侧导航栏中。在这里，你可以浏览并利用之前下载并存储在磁盘上的资产，确保即使在离线状态下你的工作流也不会中断。\n\n## 浏览内容\n\n\
  在 Unreal Engine 中，Quixel Bridge 作为一个多功能浮窗运行，具有极高的适应性以匹配你的工作流。其界面专为定制而设计，允许你根据自己的方便和屏幕布局调整窗口的大小和位置。我们可以参考这里的\
  \ Quixel Bridge 界面作为示例：\n\n![Figure 2.10 – Quixel Bridge – asset selection and details](img/B21600_02_010.png)\n\
  \n图 2.10 – Quixel Bridge – 资产选择与详情\n\nQuixel Bridge 用户界面的核心是一个搜索栏，你可以用它在各个类别中快速搜索特定项目。为了进一步增强搜索，Quixel\
  \ Bridge 集成了一个过滤器栏，配备了一系列特定的过滤器，例如资产类型、颜色、生物群、状态和尺寸。点击位于右上角的 `filter` 图标可以轻松显示或隐藏此过滤器栏。\n\
  \n在 Quixel Bridge 面板的左侧，一组按钮提供了不同标签页的访问，每个标签都有特定的用途：\n\n* `Home`：此标签页分为多个部分，显示所有类别中的最新集合、热门资产和最新上传内容。它具有一个结构化的类别树，包含多个层级的子类别，列出了所有可用的资产类型。在这里还可以按类别和子类别进行过滤。\n\
  * `Collections`：在这里，你将找到精选内容，包括各种生物群的参考图和渲染图、必备资源、建筑选择、教程资产和社区集合。\n* `MetaHuman`：对于使用\
  \ MetaHuman Creator 应用 ([`metahuman.unrealengine.com/`](https://metahuman.unrealengine.com/))的用户，Quixel\
  \ Bridge 中 `MetaHumans` 标签页下的 `My MetaHumans` 页面提供了已创建的访问。这些角色可以下载并无缝集成到你的项目中。\n\
  * `Favorites`：Quixel Bridge 中的任何资产都可以标记为收藏，以便将来快速方便地访问。要将资产标记为收藏，只需将鼠标悬停在上方并点击 `heart`\
  \ 图标。\n* `Local`：此部分显示所有已下载并在你的机器上用的资产，提供了对本地仓库的在线和离线访问。\n\n在了解主要标签页后，让我们进入处理 Quixel\
  \ Bridge 资产。\n\n## 资产\n\n在 Quixel Bridge 中，选择资产会打开一个信息面板，提供其特征的详细概述。该面板有助于评估资产的各个方面以及对你项目的适用性。图标提供了快速见解，例如文件大小（对于资源管理至关重要）以及纹理是否可平铺（tileable），这是创建无缝环境的关键。\n\
  \n面板还会显示相关资产，有助于寻找视觉上一致或互补的选项，并简化选择过程。\n\n右面板底部是选择资产下载分辨率的控件。\n\n位于资产右面板底部的是一个用于选择资产下载分辨率的关键控件，如\
  \ `Figure 2.11` 所示：\n\n![Figure 2.11 – Asset information from selected object in\
  \ Quixel Bridge](img/B21600_02_011.png)\n\n图 2.11 – 来自 Quixel Bridge 中选中对象的资产信息\n\
  \n此功能允许你自定义资产以符合你的项目需求，提供平衡视觉质量和性能的分辨率选项。选择分辨率后，你可以下载资产或将其直接添加到你的项目中。\n\n## 下载设置\n\
  \n在 Unreal Engine 版本的 Quixel Bridge 资产管理背景下，意识到下载资产的默认存储位置至关重要。这些位置根据你正在使用的操作系统而异：\n\
  \n* 对于 Windows 用户，资产存储在 `C:\\Users\\user\\Documents\\Megascans Library`\n* 在 macOS\
  \ 上，默认路径为 `~/Documents/Megascans Library`\n* 对于 Linux，资产同样放置在 `~/Documents/Megascans\
  \ Library`\n\n理解资产存储是关键，因为高质量的下载会迅速消耗磁盘空间。大型库可能会导致大量的存储占用，因此确保有足够的空间以避免工作流中断非常重要。\n\
  \n如果你需要更改资产的默认存储路径，Quixel Bridge 提供了一种简单的方法。要修改此设置，点击 Quixel Bridge 窗口右上角的 `user`\
  \ 图标并选择 `Preferences`：\n\n![Figure 2.12 – Quixel Bridge Preferences](img/B21600_02_012.png)\n\
  \n图 2.12 – Quixel Bridge Preferences\n\n在 `Preferences` 对话框中，你会找到一个输入新库路径的选项。在这里，它指定了未来保存资产的目标位置。输入新路径后，点击\
  \ `Save` 确认更改。此调整允许你自定义资产的存储位置，确保它与你的项目组织和磁盘空间管理策略一致。\n\n## 分辨率\n\n在 Quixel Bridge\
  \ 中，你能够根据项目的特定需求，精细地选择每个资产（无论是表面、贴花还是其他类型）的质量。这一功能对于优化项目中视觉保真度和性能效率之间的平衡是基础性的。\n\
  \nQuixel Bridge 内所有的 3D 资产都以 `UAsset` 格式提供，这是 Unreal Engine 的原生资产格式，确保了无缝集成和兼容性。这些\
  \ 3D 资产提供多种分辨率，以满足不同的项目需求。可用辨率包括 `Nanite`、`high`、`medium` 和 `low`。`Nanite` 分辨率代表了\
  \ Unreal Engine 渲染技术的尖端，能够在对性能影响最小的情况下实现精细且复杂的几何体。在 `high`、`medium` 和 `low` 分辨率之间的选择提供了进一步灵活性，允许你根据项目范围和硬件能力选择资产细节与资源分配之间的最佳平衡。\n\
  \n同样，Quixel Bridge 中提供的其他资产类型，如表面、3D 植物、贴花和瑕疵，也可以访问多种分辨率。这些包括最高级（highest）、`high`、`medium`\
  \ 和 `low` 选项，提供了一系列质量级别以适应各种艺术愿景和技术限制。最高分辨率提供了无与伦比的细节和纹理深度，非常适合特写镜头或高分辨率渲染。相反，较低的分辨率更适合背景元素或性能密集型场景。\n\
  \nQuixel Bridge 对资产分辨率的这种细粒度控制，使创作者能够精确定制他们的资产选择，确保其 Unreal Engine 项目中的每个元素在视觉质量和性能效率方面都得到优化。\n\
  \n## 导出设置\n\n在 Quixel Bridge 中，每个资产的特定导出设置都可以通过资产信息面板访问，让你精确控制资产如何导出或集成到你的 Unreal\
  \ Engine 项目中。\n\n要访问这些设置，点击质量选择器和 `Download` 按钮之间的导出设置按钮。这将打开 `Export Settings`\
  \ 对话框。\n\n\n\n\n\n![图 2.13 – 输出质量设置](img/B21600_02_013.png)\n\n图 2.13 – 输出质量设置\n\
  \n在将资产添加到场景之前，必须配置这些设置，以确保其与您的项目需求实现最佳集成和对齐。`Export Settings`（导出设置）对话框的关键功能包括：\n\
  \n*   **自动填充植被画家 (Auto-Populate Foliage Painter)**：启用此选项后，系统将根据最新导入的资产自动更新项目中的植被编辑器的资产列表。此功能对于散布资产和植物资产特别有用，简化了向场景中添加自然元素的流程。在导出此类资产之前，激活此项设制是至关重要的。\n\
  *   **应用于选定 (Apply to Selection)**：激活此设置会将导出的材质直接应用到场景中当前选中的对象上。这是一个用于为项目中的特定元素快速分配新材质的便捷工具。\n\
  *   **主材质覆盖 (Master Material Overrides)**：此部分允许您灵活地使用自定义的主材质替换插件提供的默认主材质。它提供了更高程度的定制，允许项目中的资产具有更加个性化和独特的外观。\n\
  *   **材质混合设置 (Material Blend Settings)**：在此，您可以使用已导入到 `Content Browser`（内容浏览器）的材质进行混合。Quixel\
  \ Bridge 插件包含顶点混合着色器（vertex blend shader），用于材质混合过程。此功能有助于实现复杂的材质效果，例如不同地形类型之间的过渡或各种表面纹理的整合，增强项目的真实感和视觉深度。\n\
  \n至此，我们已经学习了如何在 Quixel Bridge 界面中移动。现在我们将了解如何将库资产导入到我们的 Unreal Engine 项目中。\n\n#\
  \ 导入并集成 Megascans 资产\n\n将 Megascans 资产导入 Unreal Engine 与导入其他 3D 模型、材质和纹理不同，但并不复杂。\n\
  \n让我们来看将 Megascans 资源引入场景的两种方法：\n\n*   **方法 1 – 直接拖放 (direct drag and drop)**：这种方法涉及`直接从\
  \ Quixel Bridge 将资产拖入` 您的 Unreal Engine 场景中。这种方法既直观又高效，特别是在动态设计过程中工作时。如果资产之前没有下载过，Quixel\
  \ Bridge 将根据资产信息面板中指定的分辨率进行`自动下载`。\n*   **方法 2 – 下载并添加到内容浏览器 (download and add to\
  \ Content Browser)**：为了进行更有控制的资产管理，您可以选择将下载和添加资产到场景作为独立步骤。要下载资产，请在 Quixel Bridge\
  \ 的网格视图中选择它，并点击`绿色` `Download` 按钮。下载完成后，您可以点击 `Add` 按钮将资产添加到场景中。这在`图 2.14` 中所示：\n\
  \n![图 2.14 – 下载并添加到项目](img/B21600_02_014.png)\n\n图 2.14 – 下载并添加到项目\n\n下载的内容将出现在\
  \ `Content Browser` 内部的 `Megascans` 文件夹中，准备在您的项目中使用。\n\n这些每种方法都为资产集成提供了定制化的方案，确保无论您是需要即时的拖放功能，还是倾向于组织化的、分步骤添加资产，Quixel\
  \ Bridge 都能适应您在 Unreal Engine 中的工作流。\n\n### 注意事项\n\n在资产下载过程中，Unreal Engine 中最初会显示资产的占位符或低版本。一旦最终的高分辨率资产完全下载，它将自动替换场景中的占位符。这种机制确保了工作流的连续性，允许您在获取最终版本的同时对资产进行定位和缩放。\n\
  \n第一次从 Quixel Bridge 将资产下载到 Unreal Engine 时，Bridge 会在您的 `Content Browser` 中创建特定的文件夹：\n\
  \n*   `Megascans` 文件夹：此文件夹作为所有从 Quixel Bridge 下载的资产的主要存储位置，将它们组织在您的 Unreal Engine\
  \ 项目中。\n*   `MSPresets` 文件夹：它包含了在场景中渲染已下载资产所需的所有模板主材质。这些预设材质对于确保资产以其预期的纹理和着色正确显示至关重要。\n\
  \n到目前，我们一直直接与 Quixel Megascans 资源进行工作，这些资源在默认情况下结构正确、命名规范并组织在文件夹中。这种组织方案是为未来项目构建资产的良好示例。让我们仔细看看这种文件夹结构是如何运作的。\n\
  \n# 理解导入的资源\n\n当资产从 Quixel Bridge 下载到 Unreal Engine 时，它会被系统地组织在 `Content Browser`\
  \ 中的 `Megascans` 文件夹中。该文件夹作为所有下载资产的中心化存储库，确保了高效的资产管理和访问性。在 `Megascans` 文件夹中，每个资产都存储在其各自的子文件夹中，维护了结构化可导航的层次结构。\n\
  \n对于 3D 资产，每个子文件夹通常包含几个关键组件：\n\n*   **静态网格 (Static Mesh)**：这是资产的 3D 模型，代表其几何结构。\n\
  *   **材质实例 (Material Instance)**：伴随静态网格的是主材质的变体，针对特定资产进行了调整和优化。\n*   **纹理 (Textures)**：这些是定义资产表面外观的图像文件，例如颜色、反射率和表面细节。\n\
  \n我们将在本节稍后的部分详细了解这些内容。\n\n下图显示了您在下载 3D 资产后获得的标准文件结构：一个 3D 静态网格、一个材质实例和特定的纹理。`Material\
  \ Instance` 父材质将基于您定义的 Megascans 材质或默认材质。\n\n![图 2.15 – 内容浏览器中的 Quixel Bridge 3D\
  \ 资产](img/B21600_02_015.png)\n\n图 2.15 – 内容浏览器中的 Quixel Bridge 3D 资产\n\n### 注意事项\n\
  \n根据下载方法，Unreal Engine 可能会生成一个 `Preview`（预览）文件夹。该文件夹在下载高分辨率版本期间，临时存放低质量版本的资产。此功能对于保持工作流的连续性特别有用，允许在获取最终版本之前对资产进行初步的放置和调整。\n\
  \n当您第一次从 Quixel Bridge 下载资产到 Unreal Engine 时，Bridge 会确保资产可以使用，并预分配了材质和纹理。这与外部导入或自创建资产的过程不同。对于此类资产，您必须手动添加任何内容，包括纹理，并创建必要的材质或\
  \ `Material Instance`。\n\n静态网格 (Static Mesh)\n\nUnreal Engine 中的 `Static Mesh Actor`\
  \ 是一种基础 Actor 形式，用于在关中显示 3D 网格。“静态”一词意味着网格的几何结构是不变的，而不是指 Actor 是不可移动的。然而，在实际上，Static\
  \ Mesh Actor 可以在游戏过程中移动或进行其他修改。\n\n\n\n\n\n每当你打开或双击 `Static Mesh` 时，`Static Mesh\
  \ Editor` 就会打开并显示选中的 `Static Mesh`：\n\n![图 2.16 – 从 Megascans 下载的马鞍 Static Mesh\
  \ 视图](img/B21600_02_016.png)\n\n图 2.16 – 从 Megascans 下载的马鞍 Static Mesh 视图\n\n在 `Static\
  \ Mesh Editor` 中，你可以在 `Details` 面板查看细节级别 (`LOD`)、碰撞和光照映射等参数。调整这些参数有助于优化性能和光照准确性。\n\
  \n# 材质与材质实例\n\n理解材质（Material）和材质实例（Material Instance`）的概念对于在 Unreal Engine 中进行有效的资源创建和管理至关重要。虽然我们将在第\
  \ 8 章中深入探讨这些概念，但现在对它们有一个基础的理解是非常重要的。\n\n### 材质\n\nUnreal Engine 中的 `material` 从根本上决定了场景中物体的表面属性。从概念上讲，可以将材质想象为赋予网格视觉外观的“油漆”。\n\
  \n在技术层面，材质指导渲染引擎表面如何与光线交互，涵盖了颜色、反射率、纹理、凹凸度和透明度等方面。这些属性是通过来自纹理的输入数据、基于节点的材质表达式以及材质固有属性组合计算出来的。\n\
  \n图 2.17 显示了材质预览和连接的纹理节点：\n\n![图 2.17 – 材质与材质实例视图](img/B21600_02_017.png)\n\n图 2.17\
  \ – 材质与材质实例视图\n\n我们可以在左上角看到材质的预览，在图中可以看到将连接到 `material attributes` 的不同纹理。\n\n###\
  \ 材质实例化\n\n另一方面，`Material instancing` 提供了一种在无需昂贵的重新编译的情况下更改材质外观的方法。标准材质不同，任何更改都需要重新编译（这是一个必须在游戏运行前完成的过程），而参数化材质可以通过实例进行编辑，从而跳过重新编译。这种方法不仅优化了工作流，还有助于提高材质性能。\n\
  \n在图 2.18 中，我们可以看到暴露参数的结构，它们允许对 `Material Instance` 进行实时调整：\n\n![图 2.18 – 材质与材质实例视图](img/B21600_02_018.png)\n\
  \n图 2.18 – 材质与材质实例视图\n\n# 纹理\n\nUnreal Engine 中的 `Textures` 是图像资产，主要用于材质，但它们也可以应用于其他场景，例如\
  \ `heads-up display` (`HUD` 显示显示）。\n\n在材质中，纹理被映射到应用材质的表面。它们可以直接用于输入，如 `Base Color`、`Normal\
  \ Map` 或 `Opacity Mask`，也可以被用作掩码，或者利用其 `RGBA` 值用于其他计算中。\n\n单个材质可能包含多个纹理，每种纹理都有不同的功能。例如，一个基础材质可能包含一个\
  \ `Base Color` 纹理、一个 `Specular` 高光纹理和一个 `Normal Map` 法线贴。此外，它还可能包含封装在这些纹理 Alpha\
  \ 通道中的 `Emissive` 发光和 `Roughness` 粗糙贴。这种将多个值打包到单个纹理中的做法通过节省绘制调用（draw calls）和减少磁盘空间需求来优化性能，同时提供广泛的视觉效果。\n\
  \n在下面的图中，我们可以看到用 `Texture Properties Editor` 打开的 `Base` 纹理：\n\n![图 2.19 – 纹理视图](img/B21600_02_019.png)\n\
  \n图 2.19 – 纹理视图\n\n总之，在 Unreal Engine 中对 Static Mesh、材质、材质实例以及纹理的理解和应用，对于创建引人注目且真实的\
  \ 3D 环境至关重要。\n\n让我们快速回顾一下本节讨论的术语：\n\n*   **Static Meshes（静态网格）：** Unreal Engine\
  \ 中的核心 3D 构建块，为游戏世界中的操作提供了稳定的几何结构和灵活性，对于创建详细且沉浸式的场景至关重要。\n*   **Materials and Material\
  \ Instances**：定义了视觉和交互的表面属性。材质为网格增加了真实感，而材质实例允许在不重新编译的情况下进行高效、非破坏性的编辑和快速调整，优化了工作流和性能。\n\
  *   **Textures**：为材质添加了分层次的细节和真实感，增强了视觉效果并支持复杂的计算。这对于实现高质量视觉效果和提升项目的审美影响至关重要。\n\n\
  通过将 Quixel Bridge 集成到 Unreal Engine，创作者可以获得高质量的 3D 资产并无缝导入到游戏开发、建筑可视化或电影叙事中。这一资产流水线能够快速实现写实模型、纹理和材质，帮助构建更具沉浸感的环境。然而，仔细管理资源以避免如文件结构混乱或分辨率不匹配等问题，这些问题可能会影响性能和视觉一致性。确保资源在\
  \ `Content Browser` 中正确分类，并针对特定用例优化分辨率，对于保持性能与视觉保真度之间的平衡至关重要。掌握导入过程和高效的资源管理将简化你的工作流并提高\
  \ Unreal Engine 项目的整体质量。\n\n在下一节中，我们将完成一个实践练习，以应用学到的关于 Quixel Bridge 和资源导入流的知识。\n\
