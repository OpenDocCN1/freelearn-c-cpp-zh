  \ |\n\n# 4\n\n# 项目结构与命名规范\n\n想象一下：一个没有任何文件夹的 Unreal 项目，所有资产杂乱无章地散落在根目录下并带有随机名称。这种混乱的设置将是开发者的噩梦，导致检索资产非常耗时。\n\
  \n现在，想象同一个项目经过了严密的组织，资产按逻辑分组并进行具有描述性的命名。在这种情况下，定位资产变得轻而易举，最大限度地提高了开发效率和生产力。\n\n\
  在 Unreal Engine 中维护清晰且一致的项目结构和命名规范是关重要的。这不仅适用于资产和代码等项目元素，也适用于场景 Actor。这在构建开放世界景观时尤为关键，因为多个资产、关卡和系统必须协同工作。虽然这些实践可能不会直接影响引擎性能或图形保真度，但它们对于任何项目的成功都至关重要。\n\
  \n\n\n\n\n本节提供了关于高效项目结构和命名规范的详细技术见解。通过实施这些实践，你可以显著提升虚幻引擎 5 (UE5) 中资产管理与集成的效率和质量。此外，保持项目文件的整洁和清晰有助于改善团队成员之间的协作，并在项目随复杂性增长时促进其可扩展性。\n\
  \n让我们详细探索这些工具和技术，发现它们将如何简化你的开发流程。\n\n## 保持整洁与清晰\n\n实现一个结构良好且组织有序的项目对于在虚幻引擎 5 中进行高效开发至关重要。通过遵循这些指南，你可以增强协作、简化调试并提高项目的可扩展性：\n\
  \n-   **项目结构**：\n    - **文件夹层级结构**：建立清晰的文件夹层级对于定义良好的项目结构至关重要，因为它能够以组织的方式将资产、代码和其他资源隔离开。这种结构化的方法通过更更容易定位、管理和更新项目文件，促进了团队成员之间的高效协作。\n\
  \    - **内容组织**：根据资产类型（纹理、网格、蓝图等）将资产分类到不同的文件夹中，可以简化资产的检索和修改。\n- **文件夹组织**：\n   \
  \ - **资产管理**：以组织的方式在 `Content` 目录中存储资产可以简化资产管理。按资产类型分类的子文件夹简化了导航，并有助于数字构建和调试过程。\n\
  \    - **资产识别**：虽然虚幻引擎的界面通过图标视觉上识别资产类型，但 Git 和 Windows 资源管理器等外部程序完全依赖资产名称和目录路径。\n\
  \    - **源代码**：为 C++ 或蓝图类分配特定的文件夹有助于版本控制，并促进模块化和面向对象的编码实践。\n\n在在*图 4.1* 中，我们可以看到虚幻引擎\
  \ `Content Browser`（内容浏览器）的截图，其中通过颜色编码的条纹定义了所存储资产的类别。\n\n![图 4.1 – 虚幻引擎界面中的不同资产及其图标](img/B21600_04_1.png)\n\
  \n图 4.1 – 虚幻引擎界面中的不同资产及其图标\n\n另一方面，在*图 4.2* 中，我们可以从文件系统中看到之前查看的所有资产具有相同的 `.uasset`\
  \ 扩展名，地图（maps）除外，它们具有 `.umap` 扩展名：\n\n![图 4.2 – 文件系统中的不同资产](img/B21600_04_2.png)\n\
  \n图 4.2 – 文件系统中的不同资产\n\n在虚幻引擎中存储资产时，它们会被转换为一种允许引擎实时解释并应用到我们项目中的格式。这强调了根据所使用的资产类型将其正确分类到文件夹中的重要性。\n\
  \n## 增强协作\n\nUE5 中的高效协作依赖于清晰的通信和一致的工作流。为语言、命名规范和版本控制建立共享标准，有助于团队在开发的不同阶段高效地工作。这些实践确保了每位贡献者都能充满信心地导航、修改和扩展项目。以下指南将帮助你在整个项目过程中保持协调的团队工作：\n\
  \n- ****语言**：选择通用语言（通常是英语）可确保有效通信，并便于与不同的利益相关者进行共享。\n-   **一致的命名规范**：\n    - **资产识别**：对资产采用一致的命名规范可以增强理解并简化协作，特别是在多部门项目中。\n\
  \    - **蓝图和类**：蓝图和类采用清晰且具有指示性的命名规范有助于通信，并防止协作期间出现错误或重复工作。\n-   **版本控制**：\n    -\
  \ **分支命名**：在版本控制系统 (VCS) 中建立分支命名规范有助于识别分支的用途和范围，促进无缝协作。\n    - **提交消息**：标准化的提交消息使团队成员能够理解更改并做出明智的，促进高效的协作和问题跟踪。\n\
  -   **外包**：在与外部团队协作时，语言选择、项目结构和命名规范至关重要。\n\n保持清晰的项目结构和一致的命名规范不仅改进了当前的工作流，还为未来的增长奠定了坚实的基础。\n\
  \n## 促进可扩展性与维护\n\n在游戏开发世界中，虚幻引擎 5 是实现创意愿景的多功能工具。然而，只有当开发者优先考虑结构良好的项目时，它的全部潜力才能发挥出来。这种组织对于可扩展性和维护是关键，能够更易地适应、高效调试并为未来做好准备。\n\
  \n以下是高效的项目管理如何确保对增长的适应性：\n\n-   **模块化**：结构良好的项目可以轻松适应新需求或设计变更。代码和资产的模块化有助于可扩展性，简化了新功能的集成或游戏世界的扩展。\n\
  -   **未来前瞻性**：投入时间建立健壮的项目结构并遵循命名规范，可以预先解决随着项目由于复杂性增加而可能出现的问题。\n-   **调试与故障排除**：组织良好的项目结构可以加速问题的识别和解决。开发者可以高效地定位问题，最大限地减少停机时间并改进开发过程。\n\
  \n因此，为了充分利用 UE5 的功能，开发者必须意识到项目结构和命名规范的关键作用。一个精心组织的项目不仅能促进协作并提高日常效率，还为可扩展和可维护的游戏开发奠定了基础。\n\
  \n# 项目结构和命名规范示例\n\n在查看具体的命名规范之前，理解为什么虚幻引擎中的 `Content` 文件夹在项目结构中具有如此性至关重要。该文件夹是项目中使用的所有资产的中心枢纽——无论它们是\
  \ 3D 模型、材质、纹理还是蓝图。\n\n一个组织良好的 `Content` 文件夹不仅确保团队成员可以轻松地找到和管理资产，还能防止文件重复、引用丢失和资产使用不一致等问题，这些问题在大规模项目中会导致不必要的复杂性。\n\
  \n这种组织在开放世界环境或涉及多个团队的项目中尤为*关键*，因为高效的协作取决于统一的结构。正因为这些原因，在 `Content` 文件夹内遵循正确的项目结构被认为是行业最佳实践。\n\
  \n为了说明如何有效地应用这些原则，我们将参考 Allar Style Guide：这是一个被广泛采用的行业标准，它提供了在日常工作流中构建和命名资产的具体示例。该指南概述的实践不仅促进了项目的一致性，还提高了可扩展性和性能，是任何工作室或开发团队不可或缺的工具。\n\
  \n\n\n\n在随后的章节中，我们将概述 Allar 项目结构和命名规范的关键原则。\n\n### 允许的字符\n\n任何标识符应尽可能仅包含以下字符：`A–Z`、`a–z`、`0–9`、`_`。\n\
  \n### 资产命名\n\n此逻辑组内的任何资产应遵循标准的 `Prefix_BaseAssetName_Variant_Suffix` 格式，如下：\n\n\
  *   `Prefix`（前缀）和 `Suffix`（后缀）应根据资产类型遵循资产名称修饰表，如下所示。对于其他资产，请参考 Allar Style Guide\
  \ 文档：[`github.com/Allar/ue5-style-guide`](https://github.com/Allar/ue5-style-guide)。\n\
  \n在下表的 Allar Style Guide 中我们可以看到 Unreal Engine 中常用资产及其变体使用的后缀和前缀。\n\n![图 4.3 – Allar\
  \ Style Guide 资产名称修饰表（来源: https://github.com/Allar/ue5-style-guide?tab=readme-ov-file#asset-name-modifiers)](img/B21600_04_3.png)\n\
  \n图 4.3 – Allar Style Guide 资产名称修饰表（来源: [`github.com/Allar/ue5-style-guide?tab=readme-ov-file#asset-name-modifiers`](https://github.com/Allar/ue5-style-guide?tab=readme-ov-file#asset-name-modifiers))\n\
  \n对纹理和材质相关资源的命名规范进行分类也同样重要，这有助于它们的后续使用。图 4.4 展示了这一点：\n\n![图 4.4 – Allar Style Guide\
  \ 资产名称修饰表（来源: https://github.com/Allar/ue5-style-guide?tab=readme-ov-file#126-textures)](img/B21600_04_4.png)\n\
  \n图 4.4 – Allar Style Guide 资产名称修饰表（来源: [`github.com/Allar/ue5-style-guide?tab=readme-ov-file#126-textures`](https://github.com/Allar/ue5-style-guide?tab=readme-ov-file#126-textures))\n\
  \n*   `BaseAssetName`（基础资产名称）应该是与一组资产相关的且易于识别的名称。例如，如果所有资产都与名为 Bob 的角色相关，那么 `Bob`\
  \ 就是 `BaseAssetName`。\n\n*   `Variant`（变体）代表资产的特定变体，并且同样简短易于识别。它对基础资产的子集进行分组。例如，Bob\
  \ 的不同皮肤命名为邪恶皮肤 `Bob_Evil` 和复古皮肤 `Bob_Retro`。\n\n对于独特但通资产变体，`Variant` 由从 `01` 开始的两位数字指定。例如，由环境艺术家创建的岩石将命名为\
  \ `Rock_01`、`Rock_02`、`Rock_03` 等。\n\n让我们查看 Unreal Engine 中一个完整资产的特定案例，考虑骨骼网格、材质和纹理：\n\
  \n![图 4.5 – Bob 的资产命名示例（来源: https://github.com/Allar/ue5-style-guide?tab=readme-ov-file#11e1-bob)](img/B21600_04_5.png)\n\
  \n图 4.5 – Bob 的资产命名示例（来源: [`github.com/Allar/ue5-style-guide?tab=readme-ov-file#11e1-bob`](https://github.com/Allar/ue5-style-guide?tab=readme-ov-file#11e1-bob))\n\
  \n让我们也看看处理具有不同变体的资产时会遇到的情况。\n\n![图 4.6 – 岩石变体资产命名示例（来源: https://github.com/Allar/ue5-style-guide?tab=readme-ov-file#11e2-rocks)](img/B21600_04_6.png)\n\
  \n图 4.6 – 岩石变体资产命名示例（来源: [`github.com/Allar/ue5-style-guide?tab=readme-ov-file#11e2-rocks`](https://github.com/Allar/ue5-style-guide?tab=readme-ov-file#11e2-rocks))\n\
  \n如你所见，这种结构简单且具有扩展性，但并不意味着它是僵化的。你可以根据项目的特定需求对其进行调整，只要它保持内部逻辑，让项目中的每个人都能有效理解并与其协作工作即可。\n\
  \n### 内容目录结构\n\nAllar 使用 Unreal **Content Browser**（内容浏览器）的过滤和搜索功能查找特定类型的资产，而不是按类型将资产组织到文件夹中。由于名称名称指示了它们的类型，因此不需要额外的\
  \ `Asset` 或 `AssetType` 文件夹。这种方法避免了冗余，并利用了 **Content Browser** 的过滤系统。例如，要查看 `Environment/Rocks/`\
  \ 目录下的静态网格，只需激活 **Static Mesh**（静态网格）过滤器。\n\n在图 4.7 中可以看到开放世界项目结构的示例：\n\n![计算机 AI\
  \ 生成的内容可能不正确](img/B21600_04_7-A.png)![图 4.7 – 项目结构](img/B21600_04_7.png)\n\n\n\n\
  \n## 通用资产指南\n\n- **应正确设置细节级别 (LODs)**：此检查取决于特定项目，但通常，任何在不同距离下可见的网格应具有适当的 LOD。LOD\
  \ 随着 3D 模型距离视图越远而降低其复杂度，通过减少图形流水线的负载来提高渲染效率。\n- **所有网格必须具有碰撞体**：这有助于引擎完成边界计算、遮挡和光照等任务。此外，碰撞体应与资产精确对齐。\n\
  - **所有网格应正确缩放**：关卡设计师或 Blueprint 作者不应需要调整网格的缩放。在引擎中缩放网格应被视为缩放覆盖，而非缩放修正。\n\n### Niagara\n\
  - **不应有空格**：所有名称应大大写开头，随后的单词也应大写开头，且不使用空格。应仅使用 `A–Z`、`a–z`、`0–9` 和 `_` 字符，以避免在使用\
  \ `HLSL`或其他脚本系统时出现意外问题。\n\n### 纹理\n- **纹理尺寸应该是 2 的幂（2, 4, 8, 16, 32 或 64 像素）**：虽然引擎常用方形纹理，但只要遵循此\
  \ 2 的幂规则，矩形纹理也是接受的。这确保了为纹理生成 mipmaps（多映射），有助于引擎运行更高效。此规则不适用于 UI 纹理，UI 可以根据需要任意尺寸。\n\
  - **纹理密度应该是均匀的**：所有纹理的大小应与其标准用场景匹配。合适的纹理密度随项目而异，但该项目内的所有纹理应具有一致的密度。例如，如果项目的纹理密度为每\
  \ 1 单位 8 像素，那么用于应用于 100x100 单位立方体的纹理应为 1,024x1,024，因为这是最接近项目纹理密度的 2 的幂。\n- **纹理不应过于巨大**：除非你有非常明确的理由，否则任何纹理的尺寸都不应超过\
  \ 8,192。\n- **纹理应正确分组**：每个纹理都有一个用于 LOD 的 `Texture Group`（纹理组）属性，应根据其用途正确设置。例如，所有\
  \ UI 纹理应属于 UI 纹理组。\n\n### 内容目录结构\n- **世界组合 (World Composition)**：对于大型开放世界项目或具有大量环境的关卡，Unreal\
  \ Engine 的 `World Composition` 功能允许你将一个巨大的世界分成更小、更容易管理的子关卡。每个子关卡都可以独立编辑，减少了团队成员之间出现错误或冲突的可能性。这在协作环境中特别有用，因为不同的团队成员可以同时处理项目的不同部分。\n\
  - **子项目和资产划分**：对于具有多个不同游戏系统或环境的项目，考虑将大型资产集划分为子项目。\n- **代码和资产的模块化**：以模块化的方式组织代码和资产，可以确保单个元素可以重用、替换或修改，而不影响项目的其他部分。\n\
  - **过于复杂的文件夹层级**：虽然为高度特定的资产创建深度嵌套的文件夹结构看起来很直观，但实际上会导致混乱。相反，目标应该是简单且扁化的文件夹结构，依赖 `Content\
  \ Browser`（内容浏览器）中强大的过滤工具。\n- **缺乏早期命名规范**：如果从一开始没有清晰且一致的命名规范，就会出现资产重复和混乱，尤其是在协作项目中。\n\
  - **冗余文件夹**：团队由于沟通或组织不当，创建过多文件夹或重复文件夹结构是常见现象。冗余文件夹会减慢项目导航并弄乱 `Content Browser`。\n\
  \n之前讨论的所有点都是我们开发的资源进行格式化和结构的重要初始考虑。保持一致性是关键，因为知道即使将信息从一个项目迁移到另一个项目时，所有资源都遵循相同的格式和结构也是令人安心的，消除了在这方面调整的需求。\n\
  \n# Unreal Engine 版本控制工具\n\n在游戏开发的动态世界中，协作、代码更改和资产管理是持续不断的，版本控制工具在维护秩序和效率方面起着至关重要的作用。\n\
  \n`Revision control`（版本控制，也称为 `source control` 或 `version control`）是一个跟踪项目代码和资产更改的在线系统，它与时间戳关联，有助于有效的协作。\n\
  \n该工具提供了以下功能：\n- 跟踪项目修改\n- 保护版本历史\n- 项目版本对比\n- 允许在出错时回滚到之前的版本\n- 避免冲突（当多个开发者同时修改同一个文件时）\n\
  - 适用于大多数类型（主要是文本），自动或手动合并更改\n- 适用于中小型开发团队\n\n让我们深入了解一下 Unreal Engine 提供的版本控制选项。\n\
  \n## Unreal Engine 版本控制选项\n\n版本控制是协作开发的基石。它允许多个开发者同时处理项目，跟踪对代码和资产的更改，并在出现问题时允许回滚到之前的版本。\n\
  \n要在 Unreal Engine 中直接启用版本控制功能，你可以点击右下角的 `Revision Control` 按钮。点击 `Connect to Revision\
  \ Control` 后，你就可以选择所需的 VCS 并进行配置。\n\n在图 4.8 中，我们可以看到版本控制的登录窗口，你可以从引擎兼容的服务中进行选择：\n\
  \n```\n![4.8 – 窗口](img/B21600_04_8.png)\n```\n4.8 – 窗口\n\n实现 Unreal Engine 版本控制有多种工具，例如：\n\
  \n- **Subversion (SVN)** 是一种类似于 Perforce 的集中式 VCS。虽然它在游戏开发中并不常见，但 Unreal Engine\
  \ 确实支持 SVN。\n\n其优点如下：\n- 集中仓库简化了管理\n- 与 Git 相比学习曲线更易\n- 适用于要求简单的小项目\n- 对二进制文件的支持优于\
  \ Git\n\n其缺点如下：\n- 缺乏高级的分支和合并功能\n- 集中模型可能会导致瓶颈\n\n- **Git** 是一种在软件开发行业广泛使用的分布式版本控制系统\
  \ (DVCS)。Unreal Engine 内置了对 Git 的支持，轻松集成到你的工作流中。\n\n其优点如下：\n- 广泛使用并良好支持\n- 去中心化，允许轻松的分支和合并\n\
  - 高效处理文本文件\n- 社区庞大且活跃\n\n其缺点如下：\n- 处理大型二进制文件可能具有挑战。对于初学者来说学习曲线较陡。\n\n- **Plastic\
  \ SCM** 是一种专注于分支和合并能力的 DVCS。虽然它没有 Git 或 Perforce 那样有名，但它为版本控制提供了强大的功能。\n\n以下是它的优点：\n\
  \n\n\n\n\n* 分支的可视化有助于更好地理解\n* 高效的分支和合并处理\n* 对大型二进制资产支持良好\n* 分布式架构提供了灵活性\n\n以下是它的缺点：\n\
  \n* 与 `Git` 和 `Perforce` 相比，社区较小\n* 行业普及程度较低\n* `Perforce`（也称为 `Helix Core`）是一种集中版本控制系统（VCS），通常用于大型项目或企业。Unreal\
  \ Engine 为偏好该系统的团队提供了强大的 Perforce 集成。\n\n以下是它的优点：\n\n* 对大型二进制资产支持卓越\n* 强大的锁定机制可防止冲突\n\
  * 高效处理大型项目和资产\n* 高级的分支和合并能力\n\n以下是它的缺点：\n\n* 集中式模型可能导致瓶颈\n* 大规模团队的许可费用\n\n`Table\
  \ 4.1` 显示了 Unreal Engine 支持的所有系统之间的比较：\n\n| **特性** | **Subversion (SVN)** | **Git**\
  \ | **Plastic SCM** | **Perforce** |\n| :--- | :--- | :--- | :--- | :--- |\n| 版本控制模型\
  \ | 集中式 | 分布式 | 分布式 | 集中式 |\n| 锁定机制 | 无（基于合并） | 无（基于合并） | 无（基于合并） | 文件锁定 |\n| 可扩展性\
  \ | 适用于中小型项目 | 适用于所有规模的项目 | 适用于所有规模的项目 | 极其适用于大型项目 |\n| 分支与合并 | 支持分支和合并 | 强力支持 |\
  \ 强大的分支和合并能力 | 支持，但灵活性较低 |\n| 与 UE 集成 | 原生支持 | 原生支持 | 原生支持 | 原生支持 |\n| 社区支持 | 活跃社区\
  \ | 大型且活跃的社区 | 活跃社区 | 大型且活跃的社区 |\n\n`Table 4.1 – VCS 特性比较`\n\n选择合适的修订控制系统取决于项目的特定需求、团队偏好以及开发工作流的复杂度。在做决定时，请考虑项目规模、资产类型、协作需求和个人开发者偏好等因素。\n\
  \n在下一节中，我们将讨论在 VCS 环境中工作时遵循的最佳实践。\n\n## Unreal Engine 源码控制的最佳实践\n\n在 VCS 环境中工作可以让我们确保自己和同事的工作是安全且经过备份的。然而，记住一些关键考虑因素以充分利用该系统至关重要：\n\
  \n* **定期提交 (Commit)**：定期提交有助于维护清晰的更改历史，并更容易识别和回滚有问题的更新。\n* **使用命名规范**：为提交和分支应用您团队的命名规范。\n\
  * **使用有意义的提交信息**：编写描述性的提交信息以提供上下文，并让团队成员更容易理解每项更改的目的。由于我们正在讨论文件夹标准化、文件名规范和版本控制管理，引入至少一种广泛接受的提交信息标准是非常重要的。\n\
  \n推荐的方法是遵循 `Conventional Commits` 规范，该规范为提交信息提供了结构化的格式，使其更易理解和自动化。该格式使用特定的前缀（如 `fix`、`feat`\
  \ 或 `chore`）来指示提交的性质。有关更多详细的指南，请参考 `Conventional Commits` 规范。\n\n* **策略性分支**：根据项目的需求规划您的分支策略。功能分支、发布分支和热修复分支（hotfix\
  \ branches）在游戏开发中很常见。\n* **定期代码审查**：定期的代码审查有助于尽早发现问题，确保代码质量，并促进团队成员之间的知识共享。\n* **在重大更改前备份**：在进行重大更改之前，为项目创建备份或快照，以防发生意外问题。\n\
  \n有效的源码控制是游戏开发的关键环节，Unreal Engine 提供了与 `Git` 和 `Perforce` 等流行工具的无缝集成。无论您是在从事一个小型独立项目还是大型制作项目，采用源码控制的最佳实践都将有助于更顺畅的开发流程、改进协作以及更可靠的代码库。选择最适合您项目需求的源码控制系统，并在开发之旅中享受版本控制的好处。\n\
  \n## 练习 4.1：应用项目结构和命名规范协议\n\n让我们参与一个实践练习，以巩固对应用项目结构和命名规范协议的理解。创建一个新项目并组织一些资产吧！\n\
