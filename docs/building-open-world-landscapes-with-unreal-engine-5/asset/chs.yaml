  \ Olivero\n\n# 序言\n\n当 `Unreal Engine 5` 在几年前开始改变数字环境设计时，我的学生——坦率说，也包括我自己！——寻找一种结构化且完整的指南，来创建广阔沉浸式的开放世界。遗憾的是，当时提供此类详尽指导的可用资源非常稀缺。在大多数时间里，我的学生迷失在互联网上不完整的视频教程的迷宫中，我应该说，收效寥寥……\n\
  \n我真希望他们那时手裡有像本像这样一本书，这会为他们节省无数次试错的时间！\n\n《使用 Unreal Engine 5 构建开放世界景观》为掌握引擎复杂的地形系统及其相关功能提供了一份全面的指南。作者\
  \ David Ignacio García 和 Ramón Olivero 在结构化内容方面做得非常出色，系统地介绍了对有效环境设计至关重要的核心原理和高级技术。从基础开始，他们细致地解构了许多复杂的流程，将其转化为一系列易于管理、易于复制的步骤。这种方法对于首次接触该软件的人来说特别有益。\n\
  \n此外，这本书对于寻求提升技能的资深 `Unreal Engine` 用户来说，还提供了几项关键优势，因为它培养了对底层方法的深层理解，而不仅仅是提供一个浅显的概述。\n\
  \n本书不仅是一本技术手册；它是一份精心设计的教育资源，赋能读者以批判性思维参与到 `Unreal Engine 5` 环境系统的巨大创造潜力之中。\n\n我全心推荐它。\n\
  \n*Marco Secchi,*\n*自由职业游戏开发者，NABA（意大利 Nuova Accademia di Belle Arti）学术讲师*\n\n#\
  \ 贡献者\n\n# 关于作者\n\nDavid Ignacio García 是一位实时 3D 技术专家、企业家和教育工作者，专注于构建健壮的 `Unreal\
  \ Engine` 工作流和解决方案，对实时生态系统长期承诺。他接受过建筑师培训，从建筑可视化转向交互式模拟和虚拟制作，领导团队为 AEC（建筑、工程和施工）、娱乐和企业设计可扩展的\
  \ `Unreal Engine` 工作流。\n\n他是 `BaboonLab` 的创始人，该公司是 Epic Games 服务合作伙伴，专注于 `Unreal\
  \ Engine` 咨询、教育和项目开发；他还是 `IdealTwin` 的开发者，这是一个 SaaS 平台将数据驱动的数字孪生体验带网页和 `Unreal Engine`。作为金牌\
  \ Unreal 授权讲师，David 通过 `UT-HUB` 和 Epic 项目培训了数百名学生和专业人士，包括他在 `Unreal Fellowship`\
  \ 中担任的助教、导师和高级讲师。他还在 Epic Games 担任跨欧洲和中东的合作伙伴教育顾问，加强了合作伙伴和教育生态系统，并加速了生产级工作流的采纳。\n\
  \nDavid 的工作跨越城市规模可视化、程序化世界构建、性能优化和像素流部署，始终强调可维护的、生产级的实践。他的目标是桥接创意意图与技术执行，使团队能够有信地交付广阔的实时世界。\n\
  \nRamón Olivero 是一位建筑师和 3D 可视化爱好者，从建筑可视化演变为大规模世界构建专家。这一轨迹使他成为一名专注于程序化工具、实时环境和虚拟制作的技术美术师。凭借多年的大学教学经验，他将职业重心放在桥接创意愿景与技术执行上。作为一名\
  \ `Unreal Engine` 讲师，Ramón 通过学术计划和行业倡议培训了数百名学生和专业人士，包括 Epic Games 的 `Unreal Fellowship`。\n\
  \n他的工作赋能艺术家和开发者采用生产级工作流，优化流水线，并实时赋予广阔世界生命。Ramón 担任 `UT-HUB` 的工作室负责人和讲师。他对教学和终身学习的投入持续激励着创造者去探索交互世界的可能性。\n\
  \n# 关于评审员\n\nOmar Costa 是一位网络安全专家和独立游戏开发者，拥有 IT 管理学位和元宇宙产品管理 MBA。他拥有语言（`C#`、`C++`、`Python`、`JavaScript`）方面的技术经验，以及使用\
  \ `Unreal`、`Unity` 和 `Godot` 引擎构建项目的经验。在职业领域，他所在一个多学科 GRC（治理、风险与合规）团队的一员，专注于网络安全供应商风险评估。他曾领导过复杂的创新和技术转型项目，利用技术作为战略差异化。他的通才背景和独特的经验组合使他能够以创意、分析和技术的视角进行评审，重点关注验证本书的准确性和架构完整性。\n\
  \n\n\n\n\n我向作者和整个 Packt 出版团队表示诚挚的感谢。能够为这本书贡献力量并与如此专业的人士合作，我深感荣幸。\n\nSimone Destro\
  \ 是一位 3D 开发人员和技术艺术家，专门负责使用 Unreal Engine 构建的实时应用程序。在 3D 行业拥有多年经验，他参与了涵盖建筑、汽车、时尚和虚拟体验等多个项目。Simone\
  \ 将技术专长与强大的艺术视觉相结合，为来自不同创意领域的客户和工作室开发交互式环境、配置器和沉浸式视觉叙事。他的背景通过沉浸式数字设计连接了艺术与技术。\n\n\
  # 目录\n\n1. 封面\n2. 索引\n\n# 前言\n\n创建自然且可信的开放世界一直是游戏开发中面临的最大挑战之一。开放世界对宏大规模、精细的细节以及技术复杂性的要求，往往让艺术家和设计师感到无不从心。《使用\
  \ Unreal Engine 5 构建开放世界景观》一书的目标是让这段旅程变得易于上手。它提供了一个结构化且实用的框架，帮助你理解 `Unreal Engine\
  \ 5` (`UE5`) 如何提供所需的工具，让你充满自信和艺术意图地设计、构建和优化大规模环境。\n\n在本书书中，我们将探索世界创建的每一个关键阶段：从初始的项目设置和高效资产管理，到关卡组织和\
  \ `World Partition`（世界分区），再到地形雕刻、材质创建、植被工作流、光照设计和性能优化。每个主题都与下一个无缝衔接，引导你从核心原理过渡到构建生产级环境的高级技术。\n\
  \n本书遵循实战性学习方法：每个概念都通过真实世界的示例和反映专业工作室实践的逐步练习来引入。重点不仅在于获得使用工具的专业知识，还在于理解每个决策背后的逻辑，帮助你同时培养技术能力和创意判断力。\n\
  \n在这段旅程结束时，你将在 `UE5` 中构建出自己优化的开放世界环境。更重要的是，你将理解将一个想法从早期参考收集和世界规划转变为视觉丰富、高效且可扩展的环境所需的完整工作流。无论你的目标是游戏开发、影视制作还是虚拟制作，本书都为你提供所需的见解和技能，将你的创意愿景转化为一个引人入胜的世界。\n\
  \n# 本书适合读者\n\n如果你想使用 `UE5` 创建令人信服的开放世界环境，这本书就是适合你的。它是为有志的关卡和游戏设计师、环境和技术艺术家、独立开发者，以及需要清晰的、生产级工作流的教育者或学生提供的实用指南。\n\
  \n你将学习与工作室相关的技能：雕刻地形、构建景观材质、绘制植被和草丛、设置光照以及优化大型关卡。在此过程中，你将使用 `World Partition` 进行流处理，利用\
  \ `Quixel Megascans` 获取高质量资产，并应用性能分析技术以保持性能达标。结果是你可以放入作品集的的世界，并针对游戏、电影或虚拟制作对其进行迭代。\n\
  \n不需要先验的专业知识，只需对 Unreal Engine 和核心 3D 概念有基本的了解。本书将引导你从基本原理逐步迈向自信的执行，让你能够交付既美观又运行高效的环境。\n\
  \n# 本书涵盖内容\n\n### 第 1 章，*在 Unreal Engine 中启动项目*，确定了开发环境和核心术语。它将引导你完成安装 `UE5`、从模板创建新项目以及导航界面、视口和基本面板的操作。在本章结束时，你将能够配置基础项目设置，并理解开始构建环境所需的关键工具。\n\
  \n### 第 2 章，*Quixel Bridge、Megascans 和 Fab*，梳理了 `UE5` 资产生态系统，并展示了如何获取和管理生产级内容。它引入了\
  \ `Fab` 作为统一市场，然后演示了如何在编辑器内部使用 `Quixel Bridge` 浏览、导入和组织 `Megascans` 资产，包括表面、3D 模型和数字人类。\n\
  \n### 第 3 章，*导入与静态网格*，侧重于为 `UE5` 中的实时使用导入和验证静态网格。它涵盖了整洁的导入工作流、比例和朝向检查、常见的导入问题以及优化技术，包括多细节级别\
  \ (`LODs`)、网格简化和高效的 UV。该章还将材质应用于网格上，并演示了平衡视觉保真度与性能的实际练习。\n\n### 第 4 章，*项目结构与命名约定*，建立了清晰的文件夹层级和一致的命名，以保持\
  \ `UE5` 项目的可扩展性和团队友好性。它引用了 `Allar` 风格指南作为实用基准，然后展示了如何将约定应用于资产、Actor 和代码。该章还引入了版本控制选项（`Git`、`Perforce`、`Plastic`\
  \ 和 `SVN`）以及仓库的最佳实践，实现了可靠的协作和安全的迭代。\n\n### 第 5 章，*管理关卡与层*，解释了 `UE5` 如何组织游戏世界以及为什么这种结构对规模、协作和性能关重要。它引入了关卡、光照场景和层，然后将传统的关卡/子关卡层级与\
  \ `World Partition` 进行对比，详细介绍了流处理、基于区域的编辑和多用户工作流。\n\n### 第 6 章，*构建你的景观*，从规划转向 `UE5`\
  \ 中的实战环境创建。它引入了将想法转化为可玩场景实用方法，涵盖了项目/模板选择、早期场景布局（Blocking）和验证技术，然后引导你通过 `Landscape`\
  \ 和 `Sculpt` 工具塑造自然地形。\n\n### 第 7 章，*用植被填充你的世界*，引入了 `UE5` 用于添加、管理和优化植物生命的工具，以塑造情绪、叙事和氛围。它解释了植被术语，演示了使用\
  \ `Foliage Mode` 对大区域进行快速绘制和编辑，并概述了用于覆盖的程序化方案。该章以关于密度、`LODs`、剔除和实例化的性能提示结束，以确保丰富的场景在大规模下依然保持高效。\n\
  \n### 第 8 章，*材质简介*，解释了表面如何对光产生反应以及如何在 `UE5` 中构建基于物理的材质。它让你熟悉“材质编辑器”界面、常用节点和纹理输入，然后介绍了物理基础渲染\
  \ (`PBR`) 工作流，用于创建一致、可复用的材质和材质实例。该章还强调了在大规模编写着色时组织和性能方面的实用技巧。\n\n### 第 9 章，*创建你世界的氛围光照*，专注于在\
  \ `UE5` 中构建可信且高效的开放世界光照。它引入了“环境光照混合器”和用于物理环境的关键 Actor，然后解释了针对质量和性能的 `Lumen`、`Virtual\
  \ Shadow Maps`（虚拟阴影映射）和 `Nanite` ，包括调整曝光、阴影和时间以获得一致的结果。\n\n\n\n\n\n## 第 10 章](#Chapter_10.xhtml__idTextAnchor407)，*设置你的后处理体积体*，展示了如何使用全局体积体控制场景的最终外观。它涵盖了核心效果的设置和调优：色彩分级和色调映射、`Bloom`（光晕）、`Depth\
  \ of Field`（景深），以及用于保持艺术方向一致的混合和优先级。本章以大型开放世界关卡中动态变化和性能的最佳实践结束。\n\n## 第 11 章](#Chapter_11.xhtml__idTextAnchor431)，*理解编程逻辑与蓝图*，介绍了\
  \ UE5 的可视化脚本，用于在不编写代码的情况下构建游戏和工具逻辑。它解释了基于节点的工作流、核心概念（`variables`、`events`、`functions`\
  \ 和 `Construction Script`）以及常见的 `Blueprint`（蓝图）类型。随后，本章介绍了如何创建 `Blueprint Class`（蓝图类），并展示了如何原型化可用工具，以简化环境的创建和迭代。\n\
  \n## 第 12 章](#Chapter_12.xhtml__idTextAnchor463)，*优化与测试你的场景*，将性能作为一种持续的设计约束重新定义了世界构建。它解释了实时渲染流水线，并展示了如何对场景进行分析以定位瓶颈，然后针对网格、材质、光照、碰撞和用于开放世界规模的\
  \ LODs 应用最佳实践。\n\n# 如何充分利用本书的价值\n\n你应该熟悉基础 3D 概念，如 `meshes`（网格）、`UVs`、`textures`（纹理）、`materials`（材质）和\
  \ `lighting`（光照），以及 Unreal Engine 的导航和界面。如果你已经打开了项目、移动了相机并在场景中放置了几个 `Actors`（演员），你就可以开始了。\n\
  \n## 建议的知识（有帮助但非必读）\n\n对如 `Fab` 或 `Quixel Bridge` 等资产管理工具、项目组织以及实时性能概念（`LODs`、`draw\
  \ calls` 和 `culling`）有一定的了解将帮助你更容易跟上进度。对 `Blueprints`（蓝图）的基础理解也会让练习更加直观。\n\n## 加速学习的额外技能\n\
  \n了解如何使用 `Git`、`Perforce` 和 `Tortoise` 等版本控制系统可以使实验更安全。构建和维护情绪板或视觉参考文件夹有助于定义一致的艺术方向。理解比例、尺寸和构图有助于在大型环境中做出更好的设计决策，而掌握\
  \ `PBR` 材质和纹理贴（`Base Color`、`Normal`、`Roughness`、`Metallic` 和 `Ambient Occlusion`）可确保表面对光线做出真实的反应。\n\
  \n## 软件/硬件要求\n\n为了顺畅学习，请确保你的系统符合或超过以下规范。书中所有的示例和截图均在 Windows 10/11 上开发和测试，这是推荐平台。虽然\
  \ macOS 用户可以完成大多数练习，但可能会出现细小的界面差异和某些性能波动。\n\n| 本书涵盖的软件 | 详情 |\n| --- | --- |\n|\
  \ Unreal Engine 5.5 或更高版本 | 通过 Epic Games Launcher 免费获取。确保已安装 Starter Content（基础内容）和\
  \ `Quixel Bridge` 插件 |\n| Epic Games Launcher | 下载 Unreal Engine、管理更新以及访问 `Fab`（统一市场）所需\
  \ |\n| Quixel Bridge / Fab 集成 | 浏览资产并从 Megascans 库导入资产所需 |\n| Visual Studio 2022\
  \ (社区版) 或 Rider for Unreal Engine | |\n| 版本控制客户端 | 使用 `Git`、`Perforce` 或 `Plastic\
  \ SCM` 管理项目迭代 |\n| 图像编辑软件（可选） | Adobe Photoshop、GIMP 或 Substance 3D Sampler 用于创建或调整纹理\
  \ |\n| Web 浏览器 | 访问在线参考所需 |\n\n| 本书涵盖的硬件 | 规范 |\n| --- | --- |\n| 操作系统 | Windows\
  \ 10/11（推荐）或 macOS Monterey（或更高版本） |\n| 处理器 (CPU) | 6 核或更高（Intel i7 / AMD Ryzen\
