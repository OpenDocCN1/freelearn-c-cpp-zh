  \ | |\n\n# 第 4 部分：蓝图、测试与优化\n\n此部分重点关注你的 Unreal Engine 项目的技术精炼和性能方面。它首先通过 `Blueprints`\
  \ 引入编程逻辑，`Blueprints` 是 Unreal Engine 基于节点的视觉脚本系统，用于创建交互和可重用工具。你将学习如何使用性能分析技术来评估和优化场景，这些技术可以揭示几何、光照和材料中的性能瓶颈。\n\
  \n最后一章概述了维护视觉保真度与效率平衡的最佳实践，为你的项目稳定、高质量的实时执行做好准备。\n\n本书的这一部分包含以下章节：\n\n* *第 11 章,\
  \ *理解编程逻辑和蓝图*\n* *第 12 章, *优化和测试你的场景*\n\n# 第 11 章：理解编程逻辑和蓝图\n\n`Blueprint-system`\
  \ 是一种视觉脚本工具，使艺术家和开发者都能设计并实现复杂的游戏功能，而无需编写传统代码。这允许艺术家创建可以简化和增强环境创建工作流的工具，提供更大的灵活性和效率。\n\
  \n蓝图基于基于节点的接口，这简化了功能的开发过程，消除了对编程知识的要求。\n\n在此系统内定义的类被称为 `Blueprints`。这些 `Blueprints`\
  \ 允许对放置在场景中（或不放置）的任何元素进行原型，使其参与游戏功能并根据需要进行复制。\n\n本章将向你介绍蓝图编程，涵盖了有效使用它的基本概念和基本原理。\n\
  \n以下是要涵盖的核心主题：\n\n*   使用 `Blueprints` 编程的基本备概念\n*   探索 `Blueprint` 类型\n*   创建 `Blueprint\
  \ Class`\n*   练习 11.1：开发一个随机放置 `Static Meshes` 的工具\n*   练习 11.2：创建带有组件的 `Blueprints`\n\
  *   调试和优化 `Blueprints`\n\n# 技术要求\n\n为了继续本章的开发，你需要一台安装了 **Unreal Engine 5.5**（或更高版本）的\
  \ PC，且该 PC 符合 EPIC Games 提供的推荐要求：[`dev.epicgames.com/documentation/en-us/unreal-engine/hardware-and-software-specifications-for-unreal-engine`](https://dev.epicgames.com/documentation/en-us/unreal-engine/hardware-and-software-specifications-for-unreal-engine)。请确保系统也已连接到互联网。\n\
  \n# 使用蓝图进行编程的基本概念\n\n在我们开始构建第一个 `Blueprints` 之前，理解一些与其操作和结构相关的基本概念至关重要。\n\n## 节点\
  \ (Nodes)\n\n`Nodes` 代表动作、事件或函数。每个节点都有特定的目的，例如移动物体、触发动画或检查条件。\n\n## 连接 (Connections)\n\
  \n节点通过 `connections` 连接在一起，定义了执行流和数据传输。这些连接分为主要类型：执行线（由`箭头`表示）和数据线（由`线条`表示）。\n\n\
  在*图 11.1* 中，我们可以看到节点连接的构造：\n\n![Figure 11.1 – Node connections](img/B21600_11_01.png)\n\
  \n图 11.1 – 节点连接\n\n蓝图的构建是通过连接不同类型的逻辑（称为节点）完成的，这些逻辑分类。我们可以通过在蓝图工作区*右键点击*来查看它们：\n\n\
  *   **执行流**：按顺序由处理器执行的序列。\n*   **分支**：执行流的分叉。\n*   **变量**：带有名称存储的数据，可以对其进行检索、修改和操作。\n\
  *   **事件**：在被触发时启动执行流的节点。\n*   **函数**：执行特定任务的执行流。它可以接收参数、返回结果，并可能有访问限制。\n*   **数学表达式**：折叠到单个节点中的数学运算。\n\
  *   **宏**：组合在一起的操作集合以简化重用。\n\n在*图 11.3* 中，我们可以看到蓝图的基本构造，其中我们可以看到从事件开始的执行流到达相应的函数。\n\
  \n理解蓝图的内部逻辑对于创建和调试项目是关重要的。在我们的项目中可以使用不同类型的蓝图，我们称之为 *Blueprint 类型*。\n\n# 探索蓝图类型\n\
  \n让我们在后续章节中查看 Unreal Engine 中提供的一些蓝图类型。\n\n## 级别蓝图 (Level Blueprint)\n\n`Level Blueprint`\
  \ 是一种特定级别的蓝图类型，包含影响其所在级别的逻辑和事件。级别蓝图直接与特定级别绑定，用于管理涉及该级别内多个 Actor 或系统的事件。\n\n## 蓝图类\
  \ (Blueprint Class)\n\n\n\n通常简单称为 `Blueprint`（蓝图），这种类型允许创建者轻松地开发功能。`Blueprint Class`（蓝图类）封装了数据和方法，为创建动态交互内容提供了模块化且可重用的结构。在定义\
  \ `Blueprint Class` 时，你可以建立一组特征和功能，这些功能将被该类的所有实例继承，确保游戏设计的一性和效率。\n\n## 纯数据蓝图\n\n\
  `Data-Only Blueprint`（纯数据蓝图）是一种 `Blueprint Class`，它仅包含继承自父类的代码（节点图的形式的形式）、变量和组件。这允许对继承的属性进行调整和修改，但不能添加新元素。\n\
  \n## 蓝图接口\n\n`Blueprint Interface`（蓝图接口）是一个一个或多个函数的集合——仅包含函数名称，不包含实现——它们可以添加到其他蓝图中。任何添加了\
  \ `Blueprint Interface` 的 `Blueprint` 都可以访问这些函数。\n\n## 蓝图宏库\n\n`Blueprint Macro\
  \ Library`（蓝图宏库）是一个容器，存放一组宏或独立图表，这些图表可以作为节点放置在其他蓝图中。\n\n## 蓝图工具类\n\n`Blueprint Utility`（蓝图工具类）是一种仅限编辑器的\
  \ `Blueprint`，用于执行编辑器操作或扩展编辑器功能。\n\n现在我们对蓝图的结构及其分类有了更好的了解，让我们开始创建第一个 `Blueprint\
  \ Class`吧。\n\n# 创建蓝图类\n\n创建 `Blueprint Class` 的常见方法如下：\n\n1. 在 `Content Browser`（内容浏览器）中右键点击。\n\
  2. 在 `CREATE BASIC ASSET`（创建基础资产）部分选择快捷方式，或从 `Blueprint` 菜单中选择 `Blueprint Class`\
  \ 。\n\n在*图 11.2* 中，我们可以看到从 `Content Browser` 创建 `Blueprint Class` 的选项：\n\n![Figure\
  \ 11.2 – Create Blueprint](img/B21600_11_02.png)\n\n图 11.2 – 创建蓝图\n\n## 了解蓝图类的层次结构\n\
  \n在创建 `Blueprint` 时，在完成“创建蓝图类”章节中的`步骤 1` 和`步骤 2` 后，虚幻引擎将提示你为 `Blueprint` 选择一个基类。一个窗口会自动出现，允许你选择合适的\
  \ `Blueprint Class`（如*图 11.3*所示）。这一步至关重要，因为它定义了你的 `Blueprint` 将继承的核心功能和特征。\n\n![Figure\
  \ 11.3 – Select the parent class](img/B21600_11_03.png)\n\n图 11.3 – 选择父类\n\n虚幻引擎使用**面向对象编程**（**OOP**）方法，这意味着引擎是围绕被称为“对象”的离散元素组织的。一个`object`由属性组成，这些通常可以在关卡中选中项目的\
  \ `Details`（细节）面板中查看，通常在 `Blueprint Editor`（蓝图编辑器）内部也可以查看。\n\n对象按层次结构组织成类，这意味着对象从层次结构中的父类继承属性。这允许对象从其父类继承属性和行为，并能够修改或添加新的属性。\n\
  \n虚幻引擎中所有的 `Blueprint` 类都继承自基类 `UObject`。层次结构遵循此模式：**Object >> Actor >> Pawn >>\
  \ Character**。\n\n例如，`Character` 类继承自 `Pawn` 属性和行为，而 `Pawn` 类继承自 `Actor` 类，依此类推，直到\
  \ `UObject`。\n\n在*图 11.3* 中，你可以看到常用类的列表。在 `ALL CLASSES` 部分下，你可以找到虚幻引擎中提供的每一个类。\n\
  \n最常用的类包括以下：\n\n* **Actor**: 包含一个带有位置、旋转和缩放数据的 `Transform` 组件。它可以从一开始就存在于场景中，也可以在运行时生成。它还可以包含其他组件。\n\
  * **Pawn**: 一个可以被放入并接收来自控制器输入的 `Actor`。\n* **Character**: 一种具有行走能力的 `Pawn` 类型。\n\
  * **Player Controller**: 负责控制 `Pawn` 的 `Actor`。\n* **Game Mode Base**: 定义游戏规则。\n\
  \n在本章中，我们将关注 `Actor` 类的蓝图，因为它们提供了最常见的功能。为你的 `Blueprint` 选择类将定义它的特征。\n\n在这种情况下，我们将创建一个\
  \ `Actor` 类蓝图 `BP_Rocks`，因为它需要放置在关卡中并向其添加组件。\n\n在*图 11.4* 中，我们可以看到新创建的 `Blueprint\
  \ Actor` 在 `Content Browser` 内部的外：\n\n![Figure 11.4 – Blueprint Class](img/B21600_11_04.png)\n\
  \n图 11.4 – 蓝图类\n\n如你所示，创建任何类型的 `Blueprint` 并根据需要为其分配不同的类是非常简单的。现在，让我们看看这个新 `Blueprint`\
  \ 里面。\n\n## 探索蓝图界面\n\n双击之前创建的 `Blueprint` 进入 `Blueprint interface` 菜单。在这个界面中，我们能够定义组件、处理事件并为我们的蓝图组织和模块化流程。\n\
  \n在*图 11.5* 中，我们可以看到编辑器的结构，你可以在那里视觉化地编写逻辑并管理整个 `Blueprint` 设置：\n\n![Figure 11.5\
  \ – Overview of Blueprint Editor](img/B21600_11_05.png)\n\n图 11.5 – 蓝图编辑器概览\n\n\
  让我们查看可用菜单的分类：\n\n1. **Toolbar（工具栏）**: 快速访问最常用的工具。\n2. **Components（组件）**: 用于向 `Blueprint`\
  \ 添加不同类型对象的标签页。\n3. **My Blueprint（我的蓝图）**: 可以在其中创建各种元素的标签页，如函数、宏、变量。\n4. **Viewport（视口）**:\
  \ 仅出现在具有空间呈现的蓝图中。它显示了 `Blueprint` 实例在空间中的外观。\n5. **Construction Script（构造脚本）**:\
  \ 用于编程序 `Blueprint` 构造函数的专用空间。\n6. **Event Graph（事件图表）**: 专门用于事件编程的空间。\n7. **Details（细节）**:\
  \ 显示选中元素的属性。\n8. **Compiler Results（编译结果）**: 显示编译结果。\n\n如你所见，蓝图界面非常简单（与材质编辑器界面非常相似）。它的设计使得艺术家和程序员可以在同一个空间内工作，而无需编写代码。尽管如此，让我们进入下一节，我们将在那里开发一个用于随机放置元素的工具。\n\
  \n# 练习 11.1：开发一个随机放置静态网格体的工具\n\n在本次练习中，我们将使用一系列变量开发一个随机放置静态网格体（Static Meshes）的工具。这个工具在环境创建中非常有用，允许你在关卡中快速随机地定位元素。让我们开始吧！\n\
  \n## 创建 Actor 类的蓝图\n\n第一步是创建一个 `Actor` 类的蓝图，然后将其放置在场景中。按照以下步骤操作：\n\n1. 将 `Blueprint`\
  \ 放置在场景中，只需从 `Content Browser` 拖入关卡。\n2. 现在，打开 `Blueprint`。\n3. 为了创建在环境创建期间使用的工具，它们需要在编辑器中运行。为此，我们将使用\
  \ **Construction Script**（构造脚本）。进入 **Construction Script** 标签页开始。\n\n![Figure 11.6\
  \ – Construction Script](img/B21600_11_06.png)\n\n图 11.6 – 构造脚本\n\n## 添加节点\n\n在编写工具之前，理解本次练习所需的几个概念至关重要。\n\
  \n* **Loop**: 为每个索引执行循环\n* **Variable**: 变量允许存储稍后访问的值。\n\n\n\n\n此工具将能够定义需要创建多少个静态网格（Static\
  \ Mesh），为了确定这个数量，我们将使用一个名为 `For Loop` 的节点。`Loop Body` 将执行固定次数，该次数由 `First Index`（起始索引）和\
  \ `Last Index`（结束索引）之间的整数值定义。`Index` 引脚输出一个整数，指定循环执行的次数。`Completed` 引脚在最后一次循环完成后触发。\n\
  \n在*图 11.7* 中，我们可以看到 `For Loop` 节点以及组成它的节点：\n\n![Figure 11.7 – For Loop node](img/B21600_11_07.png)\n\
  \n图 11.7 – For Loop 节点\n\n### 在 Unreal Engine 中创建节点\n\n在 Unreal Engine 中创建节点非常简单：\n\
  \n1. 只需在 `Graph` 中点击右键，就会弹出一个列有可用节点的菜单。\n2. 保持开启 `Context Sensitive`（上下文敏感）选项非常重要（如*图\
  \ 11.8* 所示），可以将搜索限制为与你当前正在工作的蓝图（Blueprint）或节点相关的节点。\n\n![Figure 11.8 – For Loop\
  \ – Context Sensitive](img/B21600_11_08.png)\n\n图 11.8 – For Loop – 上下敏感\n\n3. 搜索节点的另一种方法是拖动线条（按住`left\
  \ mouse button`）并释放。之后，只需输入节点名称并按 `Enter` 键将其添加到 `Graph` 中。\n\n![Figure 11.9 – Create\
  \ node](img/B21600_11_09.png)\n\n图 11.9 – 创建节点\n\n4. 现在，你需要一个名为 `Add Static Mesh\
  \ Component` 的节点，它允许我们访问其变换（transformation），即它的位置、旋转和缩放。\n\n![Figure 11.10 – Add\
  \ Static Mesh Component](img/B21600_11_10.png)\n\n图 11.10 – Add Static Mesh Component\n\
  \n5. 要访问位置、旋转和缩放，需要分离 `Relative Transform`（相对变换）输入。右键点击该输入执行此操作。结构分离后，我们将保持这样（稍后我们会返回此结构体来定义工具的区域）。接下来，我们将定义想要实例化的网格。\n\
  \n![Figure 11.11 – Split Struct Pin](img/B21600_11_11.png)\n\n图 11.11 – 分离结构引脚\n\
  \n6. 要添加静态网格，选择该节点并进入 `Details`（细节）面板。\n7. 在 `Static Mesh` 区域，选择你想要添加的网格。\n\n接下来，你需要创建用于控制\
  \ `For Loop` 生成的重复次数的值，以及所创建的静态网格的位置、旋转和缩放值。这将通过变量来实现。\n\n### 添加变量\n\n如前所述，变量可以存储不同类型的数据，范围从数值、文本到向量数据等。每个变量都属于特定类型，且只能是该类型。\n\
  \n在蓝图中创建变量有几种方法：\n\n1. 在你想要连接变量的输入上点击右键，并选择 `Promote to Variable`（提升为变量）。这将自动创建一个该输入所需的适当类型的变量并进行连接，如*图\
  \ 11.12* 所示：\n\n![Figure 11.12 – Create variable](img/B21600_11_12.png)\n\n图 11.12\
  \ – 创建变量\n\n这是根据你正在工作的节点创建特定变量的简单方法。\n2. 另一种方法直接从 `My Blueprint` 部分（*图 11.5* 中的\
  \ 3 部分）创建变量，在那里你可以手动创建各种类型的变量。这让你对蓝图逻辑所需的变量类型和属性具有完全控制权。\n\n从 `My Blueprint` 标签页，点击\
  \ `plus` (`+`）符号创建变量。\n\n![Figure 11.13 – Create variable](img/B21600_11_13.png)\n\
  \n图 11.13 – 创建变量\n\n点击 `+` 符号，你会发现根据它们存储的值的类型，有不同类型的变量，如*图 11.14* 所示：\n\n![Figure\
  \ 11.14 – Variable types](img/B21600_11_14.png)\n\n图 11.14 – 变量类型\n\n以下是 Unreal\
  \ Engine 中可用的常用变量类型列表：\n\n* **Boolean**（布尔型）：真/假\n* **Byte**（字节）：使用 8 位，表示 0 到 255\
  \ 之间的值\n* **Integer**（整数）：整数字\n* **Integer 64**（64 位整数）：更大的整数\n* **Float**（浮点型）：实数\n\
  * **Name**（名称）：用于识别游戏内某些内容的文本\n* **String**（字符串）：文本 – 比较两个 name 变量比比较两个 string 变量更快\n\
  * **Text**（文本）：始终可见且可以被翻译的文本字符串\n* **Vector**（向量）：描述组件的 x, y, z 位置\n* **Rotator**（旋转器）：描述在\
  \ x, y, z 上的方向\n* **Transform**（变换）：包含 3D 空间中的平移、旋转和缩放\n\n了解如何创建变量以及存在的类型后，使用它们来存储以后可能需要的任何值是一个良好的习惯。这样我们将拥有：\n\
  \n*   **Float**: 500\n*   **Float**: 1\n\n为了使变量变得可编辑，我们将在 `Details` 面板中启用 `Instance\
  \ Editable`（实例可编辑）。这将允许我们在编辑器中更改值，如*图 11.15* 所示：\n\n![Figure 11.15 – Area and scale\
  \ configuration](img/B21600_11_15.png)\n\n图 11.15 – 区域和缩放配置\n\n通过这种方式我们将拥有：\n\n\
  *   **Integer**: 10\n*   **Integer**: 5\n\n为了完成逻辑，我们将 `Construction Script` 连接到\
  \ `For Loop` 节点，如*图 11.16* 所示：\n\n![Figure 11.16 – Variable input](img/B21600_11_16.png)\n\
  \n图 11.16 – 变量输入\n\n\n\n\n\n\n![Figure 11.19 – Blueprint in the level](img/B21600_11_19.png)\n\
  \n图 11.19 – 层级中的蓝图\n\n现在，当我们选中新创建的蓝图并进入`Details`面板时，可以直接在编辑器中调整`Static Meshes`的实例数量、面积和缩放，如*图\
  \ 11.20*所示：\n\n![Figure 11.20 – Variables in the Details tab](img/B21600_11_20.png)\n\
  \n图 11.20 – Details 选项卡中的变量\n\n在本次练习中，我们在 Unreal Engine 中创建了一个蓝图工具，用于在场景中随机放置 `Static\
  \ Meshes`。我们为实例数量、面积和缩放配置了变量，并使用节点来管理网格的位置和变换。该工具通过允许直接在编辑器中进行快速调整，简化了环境创建，同时提升了活性和效率。\n\
  \n在下一次练习中，我们将通过组件来修改这些元素的各个方面。\n\n# 练习 11.2：使用组件创建蓝图\n\n在本次练习中，我们将专注于创建一个包含多种用于环境组件的蓝图，并编写逻辑来修改其中一些属性。这允许我们为复杂资产创建容器，以便直接从层级中进行管理。\n\
  \n## 创建 Actor 类的蓝图并添加组件\n\n1. 首先创建一个 `Actor` 类的新蓝图。你可以通过在`Content Browser`中*右键点击*并选择菜单顶部的快捷选项，或者进入右键菜单的`Blueprint`部分（如*图\
  \ 11.2*所示）。将其命名为 `BP_Assembly_01`。\n\n2. 创建完成后，打开蓝图并添加所需的组件来构建资产。要添加组件，请使用`Components`面板（位于`Blueprint`菜单的左上角）并点击`Add`按钮来搜索并包含所需的元素。\n\
  \n在本次练习中，我们将使用以下组件：\n\n* `Static Mesh`\n* `Niagara Particle System Component`\n\
  * `Rect Light`\n\n要添加组件，只需在`Components`面板的搜索栏中输入其名称，如*图 11.21*所示：\n\n![Figure 11.21\
  \ – Add component](img/B21600_11_21.png)\n\n图 11.21 – 添加组件\n\n1. 一旦添加了`Static Mesh`组件，就有选择要包含的特定`Static\
  \ Mesh Asset`。这可以通过`Details`面板来实现。你可以根据所需的蓝图组合添加任意数量的`Static Meshes`。\n\n2. 随着组件被添加到蓝图中，系统会自动创建一个`hierarchy`（层级），以便进行更好的资产管理。该层级有助于组织资产结构。层级结构如*图\
  \ 11.22*所示，可以通过点击并拖拽组件将其向上或向下移动来修改。层级结构根据所执行的操作具有重要意义，因为对主元素进行的更改将传播到其下方的元素。\n\n\
  ![Figure 11.22 – Component hierarchy](img/B21600_11_22.png)\n\n图 11.22 – 组件层级\n\n\
  一旦创建并配置了元素（包括`Rect Light`），就可以在`Blueprints Editor`中看到结果，如*图 11.23*所示：\n\n![Figure\
  \ 11.23 – Final composition in Blueprint Editor](img/B21600_11_23.png)\n\n图 11.23\
  \ – 蓝图编辑器中的最终组合\n\n此蓝图的最终目标为为 Rect Light`组件提供逻辑和功能，允许我们之后直接从编辑器中调整它的强度。\n\n为了实现这一点，一旦创建了所需的组件，我们需要访问这些组件的属性。为了修改它们的值，必须为`Rect\
  \ Light`元素创建一个引用。\n\n## 创建引用\n\n`reference`（引用）允许我们访问组件的属性以修改其值。由于我们的目标是在编辑器中调整组件属性，所有的编程将在`Construction\
  \ Script`中完成。\n\n在蓝图中创建引用非常简单。以下是访问光属性进行修改的方法：\n\n1. 从`Components`选项卡将`Rect Light`组件拖入`Graph`。这会创建一个`Rect\
  \ Light`节点，作为组件的引用，如*图 11.24*所示：\n\n![Figure 11.24 – Component reference](img/B21600_11_24.png)\n\
  \n图 11.24 – 组件引用\n\n1. 有了此引用，我们现在可以访问之前添加的`Rect Light`组件的属性。要修改所需的属性，只需从引用节点引出连接线并搜索特定属性。在这种情况下，我们将调整光的`intensity`（强度）和`color`（颜色）。\n\
  \n当从引用搜索节点（启用`Context Sensitive`）时，显示的选项与引用的类型相关，如*图 11.25*所示。这确保了只有与`Rect Light`相关的适当属性和函数可供修改。\n\
  \n![Figure 11.25 – Set intensity node](img/B21600_11_25.png)\n\n图 11.25 – Set 强度节点\n\
  \n1. 我们需要的节点是`Set intensity`和`Set color`。\n\n    * 对于`Set intensity`，我们需要找到该节点并连接引用。编译后，必须设置强度值。\n\
  \n    * 对于`Set color`，过程相同，区别在于我们将设置初始颜色。编译后，我们可以调整颜色。\n\n\n\n\n\n1. 选择关卡中你想包含在蓝图（Blueprint）中的资产。你可以从视口（Viewport）或\
  \ `Outliner`（大纲）进行操作。\n\n2. 进入工具栏中的 `Blueprints` 菜单，选择 `Convert Selection to Blueprint\
  \ Class`（将选择转换为蓝图类）选项，如*图 11.28*所示：\n\n![Figure 11.28 – Convert selection to Blueprint](img/B21600_11_28.png)\n\
  \n图 11.28 – 将选择转换为蓝图\n\n在下一个练习中，我们将学习如何从已放置在关卡中的 Actor 创建蓝图。\n\n# 练习 11.3：从编辑器创建蓝图\n\
  \n有时，在整个项目中重复某些资产或资产组合是必要的。手动这样做可能会枯燥且重复。一个快速且实用的解决方案是从关卡中已放置的 Actor 创建蓝图并将选择转换为蓝图。这允许我们像之前看到的那样对各种功能进行控制和编程。\n\
  \n是从关卡中的 Actor 创建蓝图的方法：\n\n1. 选择关卡中你想包含在蓝图中的资产。你可以从视口（Viewport）或 `Outliner`（大纲）进行操作。\n\
  \n2. 进入工具栏中的 `Blueprints` 菜单，选择 `Convert Selection to Blueprint Class`（将选择转换为蓝图类）选项，如*图\
  \ 11.29*所示：\n\n![Figure 11.29 - Convert selection to Blueprint](img/B21600_11_28.png)\n\
  \n图 11.29 - 将选择转换为蓝图\n\n选择 `Convert Selection to Blueprint Class` 后，将出现如*图 11.30*所示的窗口。\n\
  \n![Figure 11.30 - Create Blueprint from Selection](img/B21600_11_30.png)\n\n图 11.30\
  \ - 从选择创建蓝图\n\n在此窗口中，你可以选择如何创建蓝图组件：\n\n*   **Child Actors（子 Actor）**：创建一个将选中资产作为子\
  \ Actor 组件的蓝图。\n*   **Harvest Components（收获组件）**：创建一个将选中资产作为组件的蓝图。\n\n1. 对于本次练习，我们将使用\
  \ `Harvest Components` 方法，因为它简化了这些组件的修改和编程。命名蓝图（例如 `BP_SideWalk`）并选择项目内容中的路径来保存它。此过程将生成一个由关卡中选定资产组成的蓝图，使其易于在\
  \ `Outliner` 中作为单个实体管理这些元素，如*图 11.31*所示：\n\n![Figure 11.31 - Blueprint in the level](img/B21600_11_31.png)\n\
  \n图 11.31 - 关卡中的蓝图\n\n从现在起，你可以根据需要多次使用该蓝图来实现所需的设计，从而在关卡中进行快速重复和迭代。一旦创建了蓝图，就可以在关卡中轻松多次实例化。在*图\
  \ 11.32*中，你可以看到此过程的最终结果：\n\n![Figure 11.32 - Final Level Assembly](img/B21600_11_32.png)\n\
  \n图 11.32 - 最终关卡装配\n\n在练习中，我们学习了如何从关卡中现有的 Actor 创建蓝图。通过选择所需的资产并使用 `Convert Selection\
  \ to Blueprint Class` 选项，我们可以快速生成组合这些资产的蓝图。我们使用了 `Harvest Components` 方法将资产作为组件包含在蓝图中。这种方法简化了复杂组合的管理和迭代，允许在关卡中进行快速复制和调整。最终结果展示了我们如何能够高效地在项目中应用和复用这些蓝图。\n\
  \n完成蓝图工作流后，让我们将注意力转向通过有效的调试和优化实践来维护和改进它们。\n\n# 蓝图的调试与优化\n\n调试和优化可确保你的逻辑在不同场景下都能高效且可预测地运行。尽早养成的小习惯可以在日后的故障排除和性能调优中节省数小时的时间。\n\
  \n让我们来看一些最佳实践：\n\n*   **使用 Print String 进行流程检查**：在关键分支处放置 `Print String`，以确认测试期间执行顺序和参数值。\n\
  *   **断点和单步（Breakpoints and stepping）**：*右键点击*执行引脚并选择 `Add Breakpoint`（添加断点）。在编辑器中运行并单步执行以检查运行时的值。\n\
  *   **监控数值（Watch values）**：*右键点击*数据引脚并选择 `Watch this Value`（监控此值），在图表运行时查看实时更新。\n\
  *   **构造脚本（Construction Script）规范**：避免在 `Construction Script` 中编写复杂的循环。使用缓存结果，并仅暴露你真正需要在\
  \ `Details` 面板中调整的 `Instance Editable`（实例可编辑）变量。（你已经在*练习 11.2：使用组件创建蓝图*中这样做了，当时暴露了灯控制。）\n\
  \n## 下一步和蓝图故障排除\n\n现在，让我们进入实际的后续和额外的学习资源，继续改进你的蓝图工作流。\n\n*   **蓝图核心概念 (Epic)**：如果你是视觉脚本的新手，这份官方文档提供了一个简洁的路径，理想作为本章练习的入门指南或复习资料：[`dev.epicgames.com/community/learning/courses/QGD/unreal-engine-blueprint-essential-concepts/P7L/unreal-engine-introduction-to-blueprint-essential-concepts`](https://dev.epicgames.com/community/learning/courses/QGD/unreal-engine-blueprint-essential-concepts/P7L/unreal-engine-introduction-to-blueprint-essential-concepts)。\n\
  *   **示例项目**：探索 Epic 示例项目（例如 Lyra：[`dev.epicgames.com/community/learning/courses/QGD/unreal-engine-sample-game-in-engine`](https://dev.epicgames.com/community/learning/courses/QGD/unreal-engine-sample-game-in-engine)），查看用于输入、UI\
  \ 和脚手架生产级蓝图模式。\n\n以下是在处理蓝图时可以采用的一些良好实践：\n\n*   **一致的命名**：布尔值使用 `bIs…`，限制值使用 `Max…`，输出引脚使用\
  \ `Out…`。\n*   **保持图表可读性**：使用注释框、**Reroute**（重路由）节点，并确保每个函数只负责一个职责。\n*   **创建函数库（Function\
  \ Library）**：为跨多个蓝图复用的工具程序创建一个函数库。\n\n### 蓝图问题故障排除\n\n在结束课程之前，以下是针对你在处理蓝图时可能遇到的一些常见问题的解答：\n\
  \n*   *在搜索中找不到节点*。启用 **Context Sensitive**（上下文相关）并先从兼容的引脚拖动；然后调色板将过滤出该类型的有效操作。\n\
  *   *我的 Construction Script 不影响游戏*。**Construction Script**（构造脚本）在编辑器中运行。将运行时行为移动到\
  \ **Event Graph**（事件图），使用 **BeginPlay**、**Tick** 或自定义事件。\n*   *我的实例没有显示*。检查目标网格的\
  \ **Collision**（碰撞）设置、区域边界（XY 平面与 Z 轴），并确认你的循环 `Last Index ≥ First Index`（参见*图 11.17*中所示的*练习\
  \ 11.1*图表）。\n\n到本章节结束。\n\n有了这些调试和工作流实践，你现在为构建、测试和优化蓝图奠定了坚实的基础。\n\n# 总结\n\n在本章中，我们涵盖了在\
  \ UE 中使用蓝图的核心概念和实际应用。我们首先对蓝图节点、连接和执行流进行了基础理解，包括变量、事件、函数和宏。然后，我们探索了不同的蓝图类，例如关卡蓝图（Level\
  \ Blueprint）、蓝图类（Blueprint Class）、仅数据蓝图（Data-Only Blueprint）、蓝图接口（Blueprint Interface）、蓝图宏库（Blueprint\
  \ Macro Library）和蓝图工具（Blueprint Utilities），学习了如何根据各种目的创建和利用它们。\n\n通过实践，我们培养了创建蓝图的技能，包括：\n\
  \n*   **创建蓝图类**：我们学习了如何创建和配置蓝图、设置变量并使用循环在场景中随机分布静态网格。\n\n\n\n\n\n*   **使用组件创建蓝图**：我们专注于添加和管理不同的组件，例如\
  \ `Static Mesh`、`Niagara Particle System Component` 和 `Rect Light`，并学习了如何使用引用修改组件属性并将其暴露以供编辑。\n\
  *   **从编辑器创建蓝图**：我们演示了如何将现有的关卡 `Actors` 转换为 `Blueprints`，从而更方便地管理和复制关卡内的资产。\n\n\
