  \ |\n\n# 6. 构建你的景观\n\n在之前的章节中，我们讨论了如何将外部资产（如 3D 模型和纹）导入引擎，并探索了 **Quixel Megascans**\
  \ 库的使用。我们还分析了引擎中提供的关卡结构和不同类型，包括旧选项和 `World Partition` 提供的新工具。\n\n从零开始创建一个环境初看起来可能是一项艰巨的任务，这完全正常。然而，通过将其分解为较小的任务，它变得比人们想象的要容易得多。虽然考虑关卡开发的各个方面至关重要，但我们必须考虑不同的资产以及我们追求的视觉效果。\n\
  \n因此，在本章中，我们将首先探索一系列帮助我们把想法转化为项目的技术，以及帮助我们验证是否处于正确方向的工具。\n\n随后，我们将深入研究由 Unreal Engine\
  \ 为创建自然环境设计的工具集。\n\n涵盖的主题和练习包括：\n\n*   关卡设计简介\n*   场景开发：灵感与参考\n*   环境创建\n*   项目创建和模板选择\n\
  *   使用 Unreal Engine 的景观工具\n*   使用 Unreal Engine 的雕刻工具\n*   练习 6.1：从高度图创建地形\n* \
  \  练习 6.2：创建自定义景观\n*   练习 6.3：雕刻新地形\n\n\n\n\n\nUnreal Engine 中开放世界的 `Level design`\
  \ 提供了独特的机遇与挑战，需要创造力、技术技能和战略规划的结合。与线性且受限的关卡不同，开放世界提供了广阔的环境，允许玩家自由探索并与多种元素进行交互。这种自由要求采用严谨的设计方法，以确保世界感觉是沉浸式的、连贯且引人入胜的\n\
  \n# 场景开发：灵感与参考\n\n无疑，在开始任何涉及场景构建的创意项目之前，最重要的任务之一就是拥有坚实的概念图或分镜脚本（针对过场动画），以便直观地理解我们即将开发的场景，而且，还需要一组参考资料在整个过程中指导我们。这之所以重要，原因有以下几点：\n\
  \n*   **视觉引导**：概念和参考为设计师和艺术家提供了清晰的视觉指南。这些内容有助于为正在创建的开放世界建立理想的基调、风格和氛围。\n*   **一致性**：拥有视觉参考可以确保整个世界的美学一致性。这对于维持游戏环境的视觉凝聚力和玩家的沉浸感至关重要。\n\
  *   **灵感与创意**：参考和概念可以激发新的想法和创意方法。\n*   **开发效率**：从一开始就有清晰的视觉方向，可以减少后期开发过程中进行大量迭代和修改的可能性。\n\
  \n一旦收集了相应的参考资料并确定了理想的外观和类型，下一步就是环境创建。\n\n# 环境创建\n\n在关卡设计中，通常有两种方法。一种是艺术家使用预制模型和结构，提供对关卡意图的清晰即时感知；另一种是迭代设计，从简单的形状开始逐步塑造关卡。\n\
  \n让我们探索每种方法的工作方式\n\n## 选择环境创建方法\n\n目前，行业中最常用的创建环境的技术有两种：\n\n*   全建模环境 (Fully modeled\
  \ environment)\n*   `Landscape` 工具\n\n每种方法都有系列需要考虑的因素，例如使用的材质、非破坏性工作流。让我们详细查看每一种\n\
  \n### 全建模环境\n\n`Fully modeled environment`（称为 `environment modeling`）是视频游戏中的常用技术，在\
  \ `3ds Max`、`Maya`、`Blender` 和 `Houdini` 等工具中创建每一个表面。这种方法允许对地形分辨率、多面数量和其他等方面进行完全控制。随后，可以添加材质和纹理来增强环境的真实感和视觉吸引力。当对环境设计的每个方面都需要精确控制，并且满足特定的艺术或技术要求时，这种方法通常很受青睐\n\
  \n#### 注意事项\n\n以下引用的在线示例。你可以在提供的链接中查看艺术家 `Nikolay Usov` 如何使用一组预制资产创建一个接近真实世界预期的场景（在\
  \ `Blockout` 中）：[`blog.csdn.net/shebao3333/article/details/12893792`](https://blog.csdn.net/shebao3333/article/details/12893792)。同样适用于\
  \ `Edgar Martinez`，他根据关卡和空间概念为 `Uncharted 4`（2016 年发布）开发了一个关卡。你在这里查看他的工作（顶部图片）：[`www.artstation.com/artwork/5gJ8A`](https://www.artstation.com/artwork/5gJ8A)。\n\
  \n### Landscape 工具\n\n`Unreal Engine 5` (`UE5`) 提供了一专门用于构建、设计和自定义景观的工具工具。这些 `Landscape`\
  \ 工具满足了关卡设计艺术家的核心需求。\n\n在引擎中使用 `Landscape` 工具的主要优势是它们提供的即时反馈循环。对景观的更改会立即反映在场景中，包括与环境、光照和其他资产的交互。这有助于实现快速的迭代和调整。\n\
  \n除了实时可视化，UE5 的 `Landscape` 工具拥有大量功能。这些包括精确的地形雕刻、真实的纹理和材质、河流和湖泊等水体的创建，以及通过植被系统进行高效生成。\n\
  \n此外，这些工具与 `UE5` 内的其他系统无缝集成，确保世界创建连贯且详细。它们被设计得直观且易于使用，让关卡设计艺术家能够专注于创意和愿景，而无需处理技术复杂性。在\
  \ `Rebirth` 项目中，通过景观来定义规模和环境可读性的性显而易见，因为建筑是由简单的几何形状组成的。你在这里查看图片：[`cdn2.unrealengine.com/Unreal+Engine%2Fspotlights%2Fquixel-creates-real-time-photoreal-cinematic-rebirth-in-ue4%2Fblog_body_archviz2_img-1640x882-14fa65b68470052eea412ebdee56892b8e1d6.jpg`](https://cdn2.unrealengine.com/Unreal+Engine%2Fspotlights%2Fquixel-creates-real-time-photoreal-cinematic-rebirth-in-ue4%2Fblog_body_archviz2_img-1640x882-14fa65b68470052eea412ebdee56892b8e1d6.jpg)。无论采用什么方法，环境创建中最重要的阶段之一都是\
  \ blockout，我们将在下一节探讨\n\n## 理解 blockout 过程\n\n`blockout` 也被称为 `graybox level`，使用简单的\
  \ 3D 模型创建的关卡快速稿，没有任何最终细节。它的主要目标是制作关卡原型，测试基础元素、比例和指标。\n\n在开发的这个阶段，重点是空间实验，而不是被复杂的细节所困。因此，它是早期阶段一个非常有价值的工具，有助于建立关卡的结构并实现平衡的设计和指标。\n\
  \n*   它为精炼游戏环境提供了坚实的基础\n*   它使设计师和艺术家探索各种想法和解决方案，而无需在早期投入不必要的细节\n*   它通过在进入详细阶段之前优先建立稳固的结构和游戏流程，从而节省了时间和资源\n\
  \n我们在这里看到 `Brian Lesiangi` 如何使用方块和圆柱体创建一个 3D 环境（在 `Blockout` 部分）：[`www.unrealengine.com/en-US/tech-blog/balinese-temple-telling-a-powerful-story-through-ue4-environments`](https://www.unrealengine.com/en-US/tech-blog/balinese-temple-telling-a-powerful-story-through-ue4-environments)。\n\
  \n1.  在开始 blockout 阶段时，我们的主要工具将是引擎本身提供的工具，如 `Landscape`、`BSP` 或基础几何模型。关键是关注功能而非细节，并通过**移动**、**旋转**和**缩放**不同的原语进行实验以达到理想的结果。使用颜色代码也有助于根据未来的材质颜色可视化场景的整体外观。\n\
  \n\n\n\n2. 随着我们进入更高级的阶段，我们可以引入 3D 对象，这对于增强真实感的场景布置（`set dressing`）至关重要。Quixel Megascans\
  \ 目前提供了各种材料和 3D 对象（包括开放式和封闭式），可用于增强我们的景观。\n\n我们可以看到一个场景布置的清晰示例，`Pasquale Scionti`\
  \ 使用 Unreal 的地形系统结合 Megascans 的网格和资源增强了场景，如下：[`cdnb.artstation.com/p/assets/images/images/038/615/101/large/pasquale-scionti-new2.jpg?1623594223`](https://cdnb.artstation.com/p/assets/images/images/038/615/101/large/pasquale-scionti-new2.jpg?1623594223%20)\n\
  \n正如我们在`第 2 章`所示，Megascans 是集成到 Unreal Engine 中的资源和资产库，它通过专注于自然环境的集合来加速景观的创建。\n\n\
  ![图 6.1 – Quixel Bridge – 自然集合](img/B21600_06_01.png)\n图 6.1 – Quixel Bridge – 自然集合\n\
  \n在启动任何项目时，我们必须意识到我们面对的是一张空白画布。确定哪种工作方法最适合我们的项目并据此调整我们的努力是非常关重要的。\n\n# 项目创建与模板选择\n\
  \n如前所述，在启动项目时，我们面对的是一张空白画布。理解我们正在开发的项目类型，并在 Unreal Engine 中选择一个初始包含我们所需元素的模板至关重要。\n\
  \n## 创建空白项目\n\n为了开始在 Unreal Engine 中开发我们的环境，我们将从创建一个新的空白项目开始。在我的案例中，我使用的是引擎的 5.3\
  \ 版本，并在启动器的 `Games` 类别中选择了 `Third Person`（第三称）模板：\n\n![图 6.2 – Epic Games – 模板选择](img/B21600_06_02.png)\n\
  图 6.2 – Epic Games – 模板选择\n\n下一步是创建一个文件夹（我们将其命名为 `OpenWorldLevel`），我们可以在其中添加特定于我们项目的资产。\n\
  \n这是一个将所有项目相关信息整合在一个地方的好习惯。如果将来我们需要迁移到新项目，重定向资产位置将更快，而且所有项目相关信息都将存放在处。\n\n在此文件夹中，我们将添加一个新的关卡。要执行此操作，我们进入\
  \ `File` 菜单并选择 `New Level…` 选项（键盘上按 `Ctrl` + `N`）：\n\n![图 6.3 – 文件菜单 | 新关卡…](img/B21600_06_03.jpg)\n\
  图 6.3 – 文件菜单 | 新关卡…\n\n最后，我们可以从不同的默认关卡中进行选择。我们将选择 `Open World`（开放世界）选项：\n\n![图 6.4\
  \ – 创建新关卡](img/B21600_06_04.png)\n图 6.4 – 创建新关卡\n\n创建关卡后，在开始进行任何修改之前，将其保存到上一步创建的\
  \ `OpenWorldLevel` 文件夹中是时候时候：\n\n![图 6.5 – 保存新关卡](img/B21600_06_05.png)\n图 6.5 –\
  \ 保存新关卡\n\n如果我们花时间考虑一下我们拥有的内容，目前应该已经创建一个 `World Partition Level`（世界分区关卡），并设置了默认灯光和地形：\n\
  \n![图 6.6 – 参考关卡](img/B21600_06_06.png)\n图 6.6 – 参考关卡\n\n## 删除现有地形\n\n下一步是删除现有的地形以便我们可以生成自己的地形。只需按照以下步骤操作：\n\
  \n1. 在 Unreal Engine 的 `Outliner`（大纲视图）中选择地形。\n2. 展开下拉菜单并选择所有组件。\n3. 按键盘上的 `Delete`\
  \ 键删除它们。\n\n![图 6.7 – 选择地形组件](img/B21600_06_07.png)\n图 6.7 – 选择地形组件\n\n1. 最后，选择容器（`Landscape`）并以相同的方式删除它。\n\
  \n![图 6.8 – 已删除的地形](img/B21600_06_08.png)\n图 6.8 – 已删除的地形\n\n此时，我们可以开始使用 `Landscape`\
  \ 工具了。\n\n# 使用 Unreal Engine 的地形工具\n\n对于 Unreal Engine 中的 `Landscape` 工具，我们首先需要将当前的引擎模式（`Selection\
  \ Mode`）切换到 `Landscape Mode`（地形模式）：\n\n![图 6.9 – 地形模式](img/B21600_06_09.png)\n图\
  \ 6.9 – 地形模式\n\n我们将看到以下菜单：\n\n![图 6.10 – 地形菜单](img/B21600_06_10.png)\n图 6.10 – 地形菜单\n\
  \n通过 `Landscape Mode` 中的工具，你可以通过修改现有地形或从零开始构建新地形来创建自定义环境。\n\n处理 `Landscape` 有三个阶段：\n\
  \n* **Manage**（管理）：创建新地形，调整其属性\n* **Sculpt**（雕刻）：编辑高度图以塑造地形\n* **Paint**（绘制）：编辑权重图以在层层之间进行混合\n\
  \n让我们详细学习每个阶段。\n\n## 管理工具\n\n`Manage` 部分包含了针对整个地形的工具，如 `New`（新建）和 `Import`（导入），以及管理组件的工具：`Select`（选择）、`Add`（添加）和\
  \ `Delete`（删除）。\n\n![图 6.11 – 管理工具](img/B21600_06_11.png)\n图 6.11 – 管理工具\n\n以下是每个工具使用的摘要：\n\
  \n* **New**：创建新地形\n* **Import**：从外部程序导入地形\n* **Select**：选择组件以修改其属性\n* **Add**：向地形添加额外组件\n\
  * **Delete**：从地形中移除组件\n* **Splines**（样线）：为道路、路径或其他遵循地形的网格创建样线\n\n你可以在工具面板的 `Create\
  \ New` 部分从零创建新地形。\n\n以下是用于创建我们地形的工具概览：\n\n![图 6.12 – 地形创建面板概述](img/B21600_06_12.png)\n\
  图 6.12 – 地形创建面板概述\n\n我们将深入探讨图 6.12 中注释的选项的功能，稍后将在下一节的图 6.16 中讨论。\n\n## 地形面板\n\n\
  让我们看看每个选项及其允许我们做什么：\n\n* **Create New**：在你的关卡中创建一个新地形。\n* **Import from File**：从另一个程序创建的地形高度图。\n\
  * **World Partition Grid Size**：每个轴上流送代理的数量。\n* **Material**：为你的地形分配材质。\n* **Location**：新地形的位置。\n\
  * **Rotation**：新地形的旋转角度。\n* **Scale**：新地形的缩放。这决定了每个象元的大小，默认为 100 单位。\n* **Section\
  \ Size**：单个组件区域中的象元数量。每个区域独立渲染，提供了组件内部 LOD 转换的控制。\n* **Sections Per Component**：单个组件中的区域数量。这与区域大小结合决定了每个组件的大小。组件是组织地形数据的基本单位。\n\
  * **Number of Components**：在 X 和 Y 方向上的组件数量，决定了地形的整体尺寸。\n* **Overall Resolution**：新地形的整体顶点分辨率（不包括相邻组件之间的重叠顶点）。\n\
  * **Total Components**：将为此地形创建的组件总数。\n* **Fill World**：使你的地形尽可能大。\n* **Create**：使用指定的设置在世界中创建你的地形。\n\
  \n\n\n\n## 地形组件\n\n虽然我们涵盖的内容相对简单，但理解地形的内部结构以及它们在满足项目分辨率需求方面的作用至关重要。\n\n地形由多个 `Landscape\
  \ Component`（地形组件）组成，这些是虚幻引擎中用于渲染、可见性计算和碰撞的核心元素。每个 `Landscape Component` 的大小相同，且始终为正方形。这些组件的大小在创建地形时设置，并基于整体尺寸和所需的\
  \ LOD。\n\n*图 6.13* 显示了一个简单的地形（用 `green` 勾勒出），它由四个 `Landscape Component` 组成。每个组件由单个四边形单元（quad）组成，其中一个组件被分离出来，以演示顶点在\
  \ `Landscape Components` 汇合边界处是如何复制的。\n\n![Figure 6.13 – Landscape Components composition](img/B21600_06_13.jpg)\n\
  \n图 6.13 – 地形组件组成\n\n组件可以可选地进一步细分为一个或四个（2x2）子区域，以增加地形的分率。这些子区域是 `Landscape LOD`\
  \ 计算的基本单位。\n\n使用四个（2x2）子区域提供的高度图尺寸与使用四倍数量且每个只有一个子区域的 `Landscape Components` 提供的尺寸相同，但使用较少的\
  \ `Landscape Components` 可以提高性能。\n\n每个区域的大小（以顶点计数）必须是 2 的幂次方（最高至 256x256），以便在纹理的多级缓冲（mipmaps）中存储不同的\
  \ `LOD Levels`。这决定了 `Landscape Component` 中四边形单元的数量： 2 的幂次方减 1（每个 `Landscape Component`\
  \ 有一个区域）或 2 的幂次方减 2（每个 `Landscape Component` 有四个区域）。\n\n*图 6.14* 中的后续示例显示了一个单独的\
  \ `Landscape Component`（用 `green` 勾勒出），包含四个区域。每个区域由九个（3x3）四边形单元组成。再次，你可以观察到顶点在区域汇合处是复制的：\n\
  \n![Figure 6.14 – Landscape component subsections](img/B21600_06_14.jpg)\n\n图 6.14\
  \ – 地形组件子区域\n\n`Landscape Actor` 采用了颜色编码，以简化每类型 `Landscape Component` 的识别。地形边缘用\
  \ `yellow` 高亮显示；每个组件边缘为 `light green`，区域边缘为 `medium green`，而单个地形四边形单元为 `dark green`：\n\
  \n![Figure 6.15 – Landscape configuration readout](img/B21600_06_15.jpg)\n\n图 6.15\
  \ – 地形配置读取\n\n在*图 6.16* 中，我们可以看到在虚幻引擎中创建地形的默认配置。\n\n![Figure 6.16 – Default Landscape\
  \ settings](img/B21600_06_16.png)\n\n图 6.16 – 默认地形设置\n\n默认设置最显著的特点之一是理解为：通过将比例保持在\
  \ 100%，我们可以确定地形的尺寸和面积。每个区域的大小由 1x1 米的模块组成。因此，默认区域大小为 63x63，每个 `Landscape Component`\
  \ 的尺寸为 63 米 x 63 米。如果我们将此乘以初始设置中的组件数量（63x8），我们得到 504x504 米的面积，这可以在 `Overall Resolution`\
  \ 设置中确认。\n\n重要说明\n\n任何虚幻引擎地形中的 `Overall Resolution` 设置都显示顶点的数量，因此结果将始终比 `Section\
  \ Size` x `Number of Components` 的乘积*高出一个顶点*。\n\n一旦对地形的初始配置满意，我们可以点击 `Create` 按钮完成地形创建。从现在起，我们将访问第二个工作标签页，称为\
  \ `Sculpt`（雕刻）。\n\n# 使用虚幻引擎的雕刻工具\n\n现在我们有了一个可以操作的 `Landscape surface`，可以使用 `Sculpt\
  \ tools`（雕刻工具）调整地形的高度并创建山谷、丘陵、和其他和其他。可以使用不同的层来隔离区域，或区分宽泛的雕刻变化与精细的细节。要创建新层或配置现有层，请在\
  \ `Edit Layers` 部分*右键点击*：\n\n![Figure 6.17 – Landscape Sculpt tools](img/B21600_06_17.png)\n\
  \n图 6.17 – 地形雕刻工具\n\n让我们探索此工作模式下的可用工具：\n\n*   **Sculpt（雕刻）**：在所选层内*左键点击*并移动鼠标来抬高地形。点击时按住\
  \ *Shift* 可降低地形。\n*   **Erase（擦除）**：重置所选层内的雕刻变化。\n*   **Smooth（平滑）**：平滑所选层内的雕刻变化。根据笔刷衰减设置，地形边缘将在笔刷边缘变平坦。\n\
  *   **Flatten（扁平化）**：根据初始*左键点击*位置的高度平整所选层的地形。\n*   **Ramp（坡度）**：在地形上选择两点，并在工具设置中按\
  \ `Add Ramp` 在所选层内创建一个坡度。\n*   **Erosion（侵蚀）**：模拟所选层内土壤移动引起的侵蚀。\n*   **Hydro（水侵蚀）**：模拟所选层内降雨引起的侵蚀。\n\
  *   **Noise（噪声）**：在所选层内添加噪声以随机抬高和降低地形，营造更自然的外观。\n*   **Visibility（可见性）**：遮罩地形中的单个四边形单元以创建洞，这对于制作洞穴或地下/隐藏区域的入口有用。\n\
  *   **Mirror（镜像）**：将所选层的一侧复制到另一侧，便于创建镜像地形。\n*   **Copy（复制）**：将所选层的一侧复制到另一侧。\n* \
  \  **Select（选择）**：选择地形区域作为区域。\n\n这些工具的使用在大多数情况下是直观易懂的。点击每个工具可以发现，它们与地形工具共享一些选项。\n\
  \n让我们看看最常用且频繁使用的笔刷。\n\n![Figure 6.18 – Landscape Sculpt options](img/B21600_06_18.png)\n\
  \n图 6.18 – 雕刻选项\n\n让我们探索每个可用选项的功能：\n\n*   **Brush Type（笔刷类型）**：不同的笔刷类型。\n*   **Brush\
  \ Falloff（笔刷衰减）**：定义了边缘如何减弱。\n*   **Tool Strength（工具强度）**：调整笔刷对地形的影响强度。\n*   **Brush\
  \ Size（笔刷尺寸）**：设置笔刷的半径或尺寸。\n*   **Brush Falloff（笔刷衰减）**：指定笔刷边缘的衰减量，以笔刷尺寸的比例表示。`0`\
  \ 表示没有衰减，而 `1` 表示跨笔刷半径的最大衰减。\n\n所有这些属性都会影响地形最终外观。对于笔刷属性，还有选项可以微调笔刷行为：\n\n![Figure\
  \ 6.19 – Landscape Sculpt Type / Falloff Options](img/B21600_06_19.jpg)\n\n图 6.19\
  \ – 地形雕刻类型/衰减选项\n\n让我们它们的位置及其描述，从*左到右*阅读：\n\n*   **Brush Type（笔刷类型）**：\n    *  \
  \ **Circular Brush Type（圆形笔刷类型）**：创建圆润的地形效果。\n    *   **Alpha Brush Type（Alpha 笔刷类型）**：使用掩罩图像引导笔刷绘制。\n\
  \    *   **Pattern Brush Type（图案笔刷类型）**：在地形上平铺图案掩罩。\n    *   **Component Brush Type（组件笔刷类型）**：对整个\
  \ `Landscape Component` 应用更改。\n*   **Brush Falloff（笔刷衰减）**：\n    *   **Smooth Brush\
  \ Falloff（平滑笔刷衰减）**：在笔刷边缘提供平滑过渡。\n    *   **Sharp Brush Falloff（锐利笔刷衰减）**：在笔刷边缘产生锐锐过渡。\n\
  \    *   **Spherical Brush Falloff（球形笔刷衰减）**：从中心到笔刷边缘提供平滑过渡。\n    *   **Tip Brush\
  \ Falloff（尖端笔刷衰减）**：在笔刷边缘提供反向的平滑过渡。\n\n\n\n\n\n尝试雕塑笔刷设置，以找到衰减（falloff）、强度和笔刷大小之间的合适平衡点，用于创建山脉、丘陵、路径等。尝试使用小小的半圆形运动为你的地形添加变化。\n\
  \n现在我们已经探索了用于景观创建和编辑的主要工具，让我们开始制作我们的第一个自定义景观。\n\n# 练习 6.1：从高度图创建地形\n\n在本章中，我们讨论了创建景观的不同方法以及用于修改景观的工具。在本次练习中，我们将探索\
  \ Unreal Engine 构建大规模地形的最强大功能之一：通过高度图导入外部数据的能力。\n\n`Heightmaps`（高度图）是表示海拔数据的灰度图像。较暗色调对应地形的较低区域，而较亮的色调表示较高的点。这种方法非常灵活，因为许多\
  \ DCC 工具（如 `Gaea`、`World Machine` 或 `Houdini`）使用高度图在程序之间传输地形信息。\n\n让我们看看这个过程在 Unreal\
  \ Engine 内部是如何运作的：\n\n### 注意\n确保你的高度图是 16 位灰度文件（`PNG` 或 `RAW16`）。避免使用 8 位图像，因为它们会产生明显的条带伪影。\n\
  \n1. 在 Unreal Engine 编辑器中，切换到屏幕左角的 `Landscape Mode`（景观模式）。\n2. 在 `Manage`（管理）部分，选择\
  \ `Import from File`（从文件导入）。\n3. 在 `Heightmap File`（高度图文件）字段中，点击三个点（`…`）并选择高度图。你可以使用在地形工具创建的高度图，或从网上下载免费的高度图。\n\
  4. Unreal 将生成一个预览，显示 `Overall Resolution`（总分辨率）值，并建议组件布局。你的值可能与 `Figure 6.20` 中所示示例不同，这是正常的；只需确认\
  \ Unreal 已正确识别了你的高度图即可。\n\n![Figure 6.20 – 练习最终配置](img/B21600_06_20.png)\n图 6.20\
  \ – 练习最终配置\n\n1. 点击 `Import`（导入）生成地形。这个过程可能需要一段时间，因为 Unreal 不仅要解释高度图图像，还要将其分割组件，以便\
  \ `World Partition`（世界分区）能够高效地管理和流式传输它。\n\n`Figure 6.21` 高亮了在此过程中使用的主要控制控件（`步骤 2`\
  \ 到 `5` ）：\n\n![Figure 6.21 – 从文件导入景观过程](img/B21600_06_21.png)\n图 6.21 – 从文件导入景观过程\n\
  \n### 注意\n如果你选择的高度图太大导致了性能问题，请考虑使用较低分辨率的版本。大多数免费的高度图库提供多种尺寸（例如，`1K`、`2K` 和 `4K`）。使用较低的分率将使导入过程更快，且对系统的负担更小。\n\
  \n一旦过程完成，生成的景观应该像 `Figure 6.22` 所示：\n\n![Figure 6.22 – 从文件导入结果](img/B21600_06_22.png)\n\
  图 6.22 – 从文件导入结果\n\n## 故障排除\n\n有时，在导入过程之后，场景看起来可能是空的，除了几个立方体，如 `Figure 6.23` 所示：\n\
  \n![Figure 6.23 – 从文件导入为空](img/B21600_06_23.png)\n图 6.23 – 从文件导入为空\n\n要解决此问题，请执行以下操作：\n\
  \n1. 转到 `Window` | `World Partition` 并启用 `World Partition Editor`（如果尚未激活）。\n2. 在\
  \ `World Partition` 窗口中，你将看到地图的表示。\n3. 在网格中拖动选择区域，`右键点击`并选择 `Load Region From Selection`（从选择加载区域），如\
  \ `Figure 6.24` 所示：\n\n![Figure 6.24 – 从选择加载区域](img/B21600_06_24.png)\n图 6.24 –\
  \ 从选择加载区域\n\n这将景观的一部分加载到视口（Viewport）中。通过高度图导入地形是专业环境中的一种强大工作流。除了海拔数据外，你还可以导入掩码来驱动材质混合并获得更自然的结果。\n\
  \n### 注意\n有关补充指南和技术细节，请参阅 Epic Games 关于景观高度图的文档：`https://dev.epicgames.com/documentation/en-us/unreal-engine/importing-and-exporting-landscape-heightmaps-in-unreal-engine`。\n\
  \n# 练习 6.2：创建自定义景观\n\n现在我们理解了景观的工具，让我们创建一个自定义表面：\n\n1. 在 Unreal Engine 编辑器中，切换到屏幕左角的\
  \ `Landscape Mode`（景观模式）。\n2. 在 `Manage` 部分，创建一个新景观。\n3. 勾选 `Enable Edit Layers`（启用编辑层）复选框。\n\
  4. 分别将 `World Partition Grid Size` 设置为 `2`，`World Partition Region Size` 设置为 `16`。\n\
  5. 重置景观的 `Location`（位置）值为起始值 (`0`, `0`, `0`)。\n6. 调整 `X` 和 `Y` 轴上的 `Scale`（缩放）为\
  \ `50%`。\n7. 将 `Section Size`（区块大小）设置为 `127`x`127` 四边形（quads）。\n8. 将 `Section Component`（区块组件）设置为\
  \ `2`x`2`。\n9. 点击 `Create`（创建）。\n\n# 练习 6.3：雕塑新地形\n\n现在我们有了了自定义景观，让我们来雕塑地形：\n\n\
  1. 在 `Sculpt` 下，选择 `Sculpt` 工具。\n2. 将 `Strength`（强度）设置为 `0.2`，`Brush Size`（笔刷大小）设置为\
  \ `8192`。\n3. 在 `Edit Layers`（编辑层）部分，选择当前层并点击 `+` 号添加一个新的：\n\n![Figure 6.26 – 添加新层](img/B21600_06_26.png)\n\
  图 6.26 – 添加新层\n\n1. 弹出 `Pick Landscape Class` 。选择 `Landscape Layer` 并点击 `Select`：\n\
  \n![Figure 6.27 – 选择层类](img/B21600_06_27.png)\n图 6.27 – 选择层类\n\n1. 将新层重命名为 `Blocking`（基础）。\n\
  2. 使用 `Sculpt` 笔刷开始塑造地形形状，关注其整体形状。\n3. 当你对结果满意时，你应该得到类似这样的：\n\n![Figure 6.28 – 基础阶段](img/B21600_06_28.png)\n\
  图 6.28 – 基础阶段\n\n1. 为了开始细节化阶段，创建一个新层，类似于我们在本次练习 `步骤 3` 中执行的那样，并将其命名为 `Details`（细节）。\n\
  2. 使用强度值为 `0.7` 的 `Smooth` 工具平滑地形的初始迭代。\n3. 接下来，使用 `Erosion`（侵蚀）和 `Hydro`（水蚀）工具模拟风雨引起的风化效果。可以自由尝试工具参数以获得不同的效果。我得到了这个：\n\
  \n![Figure 6.29 – 首次细节阶段](img/B21600_06_29.png)\n图 6.29 – 首次细节阶段\n\n1. 对于最后的细节，继续使用\
  \ `Sculpt` 工具，但这次在 `Brush Type`（笔刷类型）下选择 `Alpha Brush` 。尝试不同的纹理并使用低强度（在 `0.2` 到\
  \ `0.35` 之间）来添加必要的变形。\n\n![Figure 6.30 – 景观基础与细节层对比](img/B21600_06_30.png)\n图 6.30\
  \ – 景观基础与细节层对比\n\n\n\n\n\n图 6.30 – 地形遮挡与细节层\n\n1. 最后，再次使用 `Smooth` 工具改进过渡，并将新的地形形变无缝地融合。\n\
  \n![图 6.31 – 最终的地形结果](img/B21600_06_31.png)\n\n图 6.31 – 最终的地形结果\n\n1. 完成后，你可以切换回\
  \ `Selection Mode`（选择模式）。如果你已经设置了第三称角色，可以运行关卡并亲身体验你创建的地形结果。这允许你与所创建的环境进行交互并探索。\n\
  \n![图 6.32 – 你的第一个地形已完成](img/B21600_06_32.png)\n\n图 6.32 – 你的第一个地形已完成\n\n开发关卡和开放世界不仅需要创意的迭代，还需要大量的技术研究和测试。在比例、可读性和游戏流程上实现准确性需要时间以及精细的规划，因为每一个设计选择都会影响玩家体验。\n\
  \n### 额外资源\n\n为了补充在本章中学到的知识，你可能会发现探索 Epic Games 教育团队提供的这个资源很有用：[`dev.epicgames.com/community/learning/talks-and-demos/KBd/building-natural-environments-in-unreal-engine`](https://dev.epicgames.com/community/learning/talks-and-demos/KBd/building-natural-environments-in-unreal-engine)。它演示了实践中的类似技术。\n\
  \n# 总结\n\n在本章中，我们研究了在 Unreal Engine 中创建地形的详细过程，强调了开发工作流中每一步的重要性。我们首先讨论了视觉参考（如概念图和分镜脚本）的作用，这对于保持一致性、激发创造力和提高效率至关重要。这些参考提供提供了清晰的视觉指南，确保游戏的色调、风格和氛围保持统一且具有沉浸感。\n\
  \n随后，我们探索了创建环境的两种主要方法：构建一个完全建模的环境以及使用 Unreal Engine 的 `Landscape`（地形）工具。区块搭建（Blockout）过程被强调为使用简单模型进行关卡结构原型的关键阶段，为进一步开发奠定了基础。\n\
  \n通过练习强化了实际应用，这些练习指导了具有特定网格、区域和比例设置的自定义地形的创建。我们还练习了使用各种工具和层来雕刻地形，以实现所需的特征。这些练习强调了迭代设计和实时调整的重要性，培养了动态且灵活的工作流。\n\
  \n在下一章中，我们将探索植被工具，帮助我们在地形上布满各种类型的植被。\n\n# 订阅 Game Dev Assembly 时事通讯！\n\n我们很高兴地介绍\
