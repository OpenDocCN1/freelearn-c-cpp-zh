  图 2.24 – Exercise 02 – New Material Instance and final result\n\n本次练习演示了从 Quixel\
  \ Bridge 选择、下载并应用材质到 Unreal Engine 静态网格体的流程。通过调整平铺、旋转和法线强度属性，你可以显著增强材质的外观，使其无缝融入你的场景。这些调整对于在环境中实现预期的视觉效果和真实感至关重要，展示了\
  \ Unreal Engine 中材质自定义的强大。随着你继续后续章节，这些技能将得到扩展，允许对项目进行更强大的控制和精炼。但在继续之前，值得了解为什么在 Bridge\
  \ 中进行正确的资产设置如此重要。\n\n# 为什么在 Quixel Bridge 中配置资产很重要？\n\n在 Quixel Bridge 中进行正确的资产配置对于\
  \ Unreal Engine 中实时项目的成功起着至关重要的作用。虽然依赖默认设置可能很有吸引力，但忽略特定参数（如纹理分辨率、材质设置或网格质量）可能会导致导致：\n\
  \n* 性能问题\n* 视觉不一致\n* 浪费开发时间\n\n最初的关键决策之一是选择导入资产的 `quality level`（质量级别）。Quixel Bridge\
  \ 允许用户下载高、中、低质量的资产，这不仅影响纹理的分辨率，还会影响静态网格体的复杂性。这种灵活性在开发早期特别有用，因为在该阶段使用低分辨率资产可以加快迭代并减少资源消耗。稍后，一旦环境更加确定，就可以以更高的分辨率重新导入这些资产，在保持材质设置和场景结构的同时提高视觉保真度。\n\
  \n`Texture resolution`（纹理分辨率）尤其是一个关键因素。Quixel Bridge 支持 2K、4K 和 8K 下载，允许开发者根据每个场景的需求定制资产。例如，从远处观察的大型地形表面可能只需要\
  \ 2K 纹理，而视觉焦点资产（如主角道具或电影级场景道具）则受益于 4K 或 8K 纹理。仔细管理分辨率有助于优化内存使用并在实时环境中保持流畅的帧率。\n\n\
  Quixel 还在 `material setup`（材质设置）方面提供了灵活性。用户可以选择导入具有自动配置打包贴的 Unreal 兼容材质，或者在偏好自定义着色器时选择单个纹理文件。这对于风格化项目、高级混合工作流或电影渲染尤为重要，因为这些情况需要更多的控制。\n\
  \n除了纹理和材质，通过 Quixel Bridge 下载的 `Static Meshes`（静态网格）是任何实时项目的关键组成部分。这些网格带有预定义的 LOD（多级细节），允许\
  \ Unreal Engine 根据距离自动减少多边形数量，有助于保持性能。这些 LOD 由 Quixel 生成并针对实时使用进行了优化，节省了艺术家和开发者手动设置它们的耗时过程。\n\
  \n此外，对于针对高视觉保真度的项目，许多 Quixel 网格支持 `Nanite`，这是 Unreal Engine 的虚拟几何系统。启用后，Nanite 允许高效地渲染高多边形网格，消除了对\
  \ LOD 的需求。这对于传统的 LOD 切换可能会明显或分散注意的环境是理想的。\n\n从 Quixel Bridge 导入网格时，用户可以根据项目目标和平台限制决定是否对资产启用\
  \ Nanite。这使得在实时中使用电影级模型成为可能，同时在需要时具有优化的灵活性。\n\n\n\n\n下一章节将重点从特定的资产管理工具转向虚幻引擎（Unreal\
  \ Engine）中的标准导入流水线。它将涵盖在虚幻引擎中不依赖 Quixel Bridge 或 Fab 等外部工具的情况下，处理静态网格（Static Meshes）、材质和纹理的核心概念和技术。主题包括资产组织、性能优化，以及为了真实感和视觉吸引力创建并应用材质和纹理。对于旨在深化对虚幻引擎理解并提高创建沉浸式且视觉震撼的环境的人来说，这些知识至关重要。\n\
