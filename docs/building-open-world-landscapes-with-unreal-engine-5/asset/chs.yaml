  \    *   `GAMES`（游戏）\n    *   `FILM / VIDEO & LIVE EVENTS`（电影/视频与直播活动）\n    *  \
  \ `ARCHITECTURE`（建筑）\n    *   `AUTOMOTIVE, PRODUCT DESIGN & MANUFACTURING`（汽车、产品设计与制造）\n\
  \    *   `SIMULATION`（模拟）\n\n2. 类别模板（`2`）作为包含文件和关卡的基础框架，为各种类型提供了起点。你也可以选择从空模板开始。在\
  \ `GAMES` 类别中，你会发现：\n    *   `First Person`（第一人称）：此模板为第一人称视角的游戏设计。它的特点是一个由持枪的手臂代表玩家角色。玩家可以通过键盘、控制器或触摸设备上的虚拟摇杆在关卡内移动角色。\n\
  \    *   `Third Person`（第三人称）：这包含一个可操作的角色，摄像机在其后方和略上方跟随它。角色带有行走、跑步和跳跃动画。可以通过键盘、控制器或触摸设备上的虚拟摇杆进行控制。\n\
  \    *   `Top Down`（俯视）：其特点是由受鼠标输入控制的角色，相机位于正高处。玩家通过点击所需的终点来控制角色，并利用导航系统避开障碍物。这种俯视视图通常用于动作角色扮演游戏。\n\
  \    *   `Handheld AR`（手持 AR）：专为 Android 和 iOS 设备上的`增强现实`（`AR`）应用而设计。它提供了切换 `AR`\
  \ 模式开关的运行时逻辑。它还提供了用于碰撞检测和光照估计的示例代码。\n    *   `Virtual Reality`（虚拟现实）：配备了`虚拟现实`（`VR`）游戏的基础功能，包括传传送移动、可抓取物体、交互元素和\
  \ VR 观察者摄像。此模板包含一个玩家可以在其中移动并与物体交互的关卡。\n    *   `Vehicle`（车辆）：它包含带有悬挂系统的普通车辆和复杂车辆。模板包括一条简单的轨道和各种障碍物。\n\
  \n3. 在 `Project Defaults`（项目默认）部分（`3`）中，你可以设置项目的规范，包括目标平台（游戏或应用程序运行的硬件）、质量设置、光线追踪选项等。你将在\
  \ `Project Defaults` 中找到这些选项：\n    *   `Implementation`（实现）：选择你如何实现项目逻辑，通过蓝图（Blueprints）或\
  \ C++。\n    *   `Target Platform`（目标平台）：指定你的项目针对 `Desktop`（桌面）还是 `Mobile`（移动）平台。\n\
  \    *   `Quality Preset`（质量预设）：根据项目的目标平台选择最高质量级别，在 `Maximum`（推荐用于计算机或游戏主机项目）或 `Scalable`（可扩展，推荐用于移动设备项目）之间选择。\n\
  \    *   `Starter Content`（基础内容）：包含带有基础纹理和材质的简单静态模型，适用于快速学习和实验。\n    *   `Ray Tracing`（光线追踪）：决定是否为项目启用或禁用光线追踪。\n\
  \n4. 在 `Project Location`（项目位置）（`4`）中，你可以指定保存项目的位置并命名。\n\n在下面的图中，你将看到我们在项目使用的配置：模板类别（`1`）、模板文件（`2`）、`Project\
  \ Location`（`3`）和 `Project Name`（`4`）。\n\n![Figure 1.3 – Project creation from VR\
  \ template](img/B21600_01_003.png)\n\n图 1.3 – 从 VR 模板创建项目\n\n**注意**\n\n我们将利用 `GAMES`\
  \ 类别中的 `Virtual Reality` 模板，以利用传传送移动和 VR 观察者摄像等功能。\n\n1. 最后，点击 `Create`（创建）启动项目创建过程。Unreal\
  \ Engine 将自动打开你新创建的项目。\n\n此过程可能需要几分钟时间，但一旦着色器完成编译且项目加载，主 Unreal Engine 界面将打开，让你能够访问开始开发之旅所需的工具和面板。\n\
  \n# 探索 Unreal Engine 界面\n\n项目加载后，首次启动 UE5 时，你会发现自己处于 Unreal Engine 关卡编辑器界面中，如下所示：\n\
  \n![Figure 1.4 – An overview of the Unreal Engine Level Editor](img/B21600_01_004.png)\n\
  \n图 1.4 – Unreal Engine 关卡编辑器概览\n\n熟悉这些组件的通用用途和功能是非常重要的，特别是如果你是游戏和应用开发新手。让我们详细查看它们。\n\
  \n## 菜单栏 [1]\n\n菜单栏如 `Figure 1.5` 所示，是关卡编辑器中关键的导航中心，提供了大量的工具和选项帮助你创建、编辑和管理项目。\n\n\
  ![Figure 1.5 – The menu bar](img/B21600_01_005.png)\n\n图 1.5 – 菜单栏\n\n以下是菜单栏不同标签及其功能的简单概述：\n\
  \n*   `File`（文件）：此菜单通常包含创建新项目、打开现有项目、保存和导出工作的选项。你也可以在这里找到项目打包和部署选项。\n*   `Edit`（编辑）：此菜单提供各种编辑功能，包括撤销和重做、复制和粘贴，以及在项目中查找和替换元素。它通常也包含这些操作的快捷键。提供了访问\
  \ Unreal Engine 设置和偏好的路径。\n*   `Window`（窗口）：此菜单允许你管理编辑器中打开的窗口和面板。你可以通过停靠或浮动窗口来安排和自定义工作区，还可以访问不同的布局预设。\n\
  *   `Tools`（工具）：此菜单允许你打开许多用于分析和帮助你更好地理解项目的工具。这些新面板或工具通常比从 `Window` 菜单打开的工具更关注开发者或优化。\n\
  *   `Build`（构建）：在此菜单中，你可以找到与构建项目不同元素相关的选项。它包括构建光照、重建关卡、导航和地形等功能。\n*   `Select`（选择）：此菜单允许你在不同的选择选项之间切换，帮助你批量收集你需要的元素，而不是一个一个地选择单个元素。\n\
  \n\n\n\n\n* **Actor（执行器）**：此菜单提供了一系列工具和选项，用于操作关卡中的 Actor——从打开子编辑器到使用对齐功能或优化资产。\n\
  * **Help（帮助）**：此菜单包含帮助你使用 Unreal Engine 的资源和信息。你可以从这里访问文档、教程和社区支持。它还可能包含有关编辑器版本和更新的信息。\n\
  \n## 主工具栏 [2]\n\n主工具栏是 Unreal 编辑器中非常实用的界面组件，提供了常用工具和命令的快捷键。它被贴心地划分为不同的区域，每个区域都有特定的用途：\n\
  \n![Figure 1.6 – The main toolbar](img/B21600_01_006.png)\n\n图 1.6 – 主工具栏\n\n让我们仔细查看主工具栏中经常使用的某些关键功能：\n\
  \n* **Save（保存）**：此按钮用于快速保存当前打开的关卡。但注意的是，它只保存当前关卡中的进度，而不保存你在工作期间创建任何新资产。\n\n* **Selection\
  \ Mode（选择模式）**：在此部分中，你会找到可以在针对关卡内特定内容的不同编辑模式之间快速切换的快捷键：\n    * **Selection（选择）**：用于选择和操作对象\n\
  \    * **Landscape（景观）**：专为地形和景观编辑设计\n    * **Foliage（植被）**：专注于植被的放置和编辑\n    * **Mesh\
  \ Painting（网格绘制）**：适用于在网格上应用和编辑纹理或材质\n    * **Modeling（建模）**：用于详细的 3D 建模和对象创建；需要启用\
  \ `Modeling Tools Editor Mode` 插件\n    * **Fracture（破碎）**：设计用于破碎对象和处理可破坏元素\n   \
  \ * **Brush Editing（笔刷编辑）**：主要用于形状化和雕刻几何体\n    * **Animation（动画）**：专门用于动画相关任务\n\n\
  * **Content Shortcuts（内容快捷方式）**：此部分提供了在关卡编辑器中添加和访问常见类型内容的快捷键：\n    * **Create（创建）**：提供常用资产列表，方便将其添加到你的关卡中。它还提供了访问\
  \ `Place Actors`（放置 Actor）面板的权限，便于快速放置资产。\n    * **Blueprints（蓝图）**：允许蓝图的创建和访问，这是\
  \ Unreal Engine 视觉脚本系统的一个重要方面。\n    * **Cinematics（电影）**：简化了电影序列的创建，包括关卡序列（Level\
  \ sequences）和主序列（master sequences）。\n\n* **Play Mode（播放模式）**：在这里，你会找到快捷按钮，允许你直接在编辑器中启动并体验游戏。它是测试和预览项目功能的宝贵工具。\n\
  \n* **Platforms（平台）**：此部分包含一系列选项，用于配置、准备并将你的项目部署到各种平台，包括桌面、移动设备和主机。它简化了确保项目兼容目标平台的过程。\n\
  \n* **Settings（设置）**：此类涵盖了与 Unreal 编辑器、关卡编辑器视口以及游戏行为相关的系列配置选项。它提供了编辑环境和项目执行的灵活性和控制。\n\
  \n## 关卡视口 [3]\n\n**Level Viewport（关卡视口）**是 Unreal 编辑器界面的一个关键组件，作为显示和编辑当前打开关卡内容的画布。它提供了关卡的动态视觉表示，允许你与组成项目的各种元素交互并操作。\n\
  \n在图 1.7 中，我们可以看到关卡视口。此外，还可以观察到在其工作区内还有其他工具和功能。\n\n![Figure 1.7 – Level Viewport](img/B21600_01_007.png)\n\
  \n图 1.7 – 关卡视口\n\n理解此关键界面内的可用功能可以极大提升你的开发工作流：\n\n* **View modes（视图模式）**：关卡视口提供了显示关卡内容的两种主要方式：\n\
  \    * **Perspective view（透视视图）**：此视图提供 3D 透视，允许你从不同角度导航和探索关卡。它提供了环境的真实写，非常适合评估资产的视觉美感和空间关系。\n\
  \    * **Orthographic view（正交视图）**：相比之下，此视图通过直接向下观察其中一个主轴（`X`、`Y` 或 `Z`）来提供 2D 表示。这种视图模式以更具结构化和平平面化的方式简化了关卡的可视化，非常适合精确的对齐和调整。\n\
  \n* **Viewport controls（视口控制）**：在关卡视口窗口内，你会注意到左上角有一组按钮：\n\n![Figure 1.8 – The Viewport\
  \ controls](img/B21600_01_008.png)\n\n图 1.8 – 视口控制\n\n在图 1.8 中，从左到右，这些按钮包括：\n\n\
  \    * **Viewport options（视口选项）**：点击此按钮将显示一个包含各种视口相关选项的菜单，允许你根据特定需求自定义查看体验。\n  \
  \  * **Perspective（透视）**：在`Perspective（透视）和`Orthographic`正交）视图模式之间切换，允许你根据需要在 3D\
  \ 探索和 2D 精准之间无缝切换。\n    * **View Mode（视图模式）**：Unreal 编辑器关卡视口中的 `View Mode` 下拉列表提供了多种模式来增强项目开发期间的用户体验。这些模式具有多种用途，从使用\
  \ `Lit Mode`（光模式）评估关卡的视觉质量，到使用 `Unlit Mode`（无光模式）简化视图以进行精确对齐。这些模式使用户能够根据特定任务定制关卡的视觉表示，提高在\
  \ Unreal 编辑器中的工作效率。例如，以下是这些模式各自的功能：\n        * **Detail Lighting Mode（细节光照模式）**：突出复杂的光照\n\
  \        * **Lighting Complexity Mode（光照复杂度模式）**：识别资源密集的光照区域\n        * **Shader\
  \ Complexity Mode（着色器复杂度模式）**：准确定着色器密集区域\n        * **Wireframe Mode（线框模式）**：简化几何体\n\
  \        * **Collision Mode（碰撞模式）**：显示碰撞几何体\n        * **Lightmap Density Mode（光照贴密度模式）**：可视化光照贴分辨率\n\
  \        * **Quad Overdraw Mode（过度绘制模式）**：识别渲染低效区域\n        * **Level of Detail\
  \ (LOD) Mode**：允许预览对象的细节级别\n        * **Buffer Visualization（缓冲区可视化）**：访问渲染缓冲区以进行深度分析\n\
  \    * **Show（显示）**：点击此按钮将显示额外的显示选项，对视口内的可见元素进行控制，有助于高效编辑。\n    * **Scalability（可扩展性）**：在此面板中，你可以控制不同渲染组的质量平衡，例如\
  \ `View Distance`（可视距离）、`Anti-Aliasing`（抗锯齿）、`Shadow`（阴影）、`Global Illumination`（全局光照）、`Effects`（特效）或\
  \ `Foliage`（植被）。\n    * **Translation and mappings（变换与映射）**：变换选项提供了对移动的控制，包括用于不受限制放置的自由移动，以及在本地和世界坐标系之间切换坐标。你还可以控制网格吸附，以便与网格、角度或比例值进行精确调整。你还可以控制相机速度。\n\
  \n\n\n\n\n- **资产管理**：它允许用户高效地组织、搜索和分类资产。你可以通过创建文件夹、子文件夹和集合来逻辑化地构建资产结构，轻松定位并访问所需的内容。\n\
  - **资产创建**：用户可以直接在 `Content Browser`（内容浏览器）中创建新资产。无论是新材质、`Blueprint`（蓝图）或其他资产类型，此功能都简化了资产的创建流程。\n\
  - **导入与导出**：通过 `Content Browser` 将资产导入到项目中非常简单。支持的文件格式包括 FBX、OBJ、WAV、PNG 等许多。你还可以导出资产以在其他应用程序中使用。\n\
  - **预览与缩略图生成**：它会为资产生成缩略图，提供视觉预览，帮助快速识别资产。此功能在处理大型资产库时特别有用。\n- **资产信息**：可以很方便地访问每个资产的详细信息。你可以查看属性，例如文件大小、导入设置和引用，这有助于帮助你更有效地管理资产。\n\
  - **资产交互**：拖放功能简化了资产在关卡或 `Blueprint` 图中的放置。你可以轻松地引用并链接资产到项目的其他部分，促进高效的资产集成。\n- **过滤与排序**：强大的过滤和排序选项允许用户根据各种标准（如资产类型、修改日期或关键词）精炼资产搜索，简化资产检索。\n\
  \n## 底部工具栏 [5]\n\n底部工具栏是 Unreal 编辑器界面内一个非常有价值的资源，为核心工具和功能提供了方便的快捷方式，同时也提供了重要的状态信息。\n\
  \n底部工具栏位于 Unreal Engine 编辑器窗口底部，如下所示：\n\n![Figure 1.10 – The bottom toolbar](img/B21600_01_010.png)\n\
  \n图 1.10 – 底部工具栏\n\n底部工具栏分为几个不同的部分，每个部分都有于高效的工作流：\n\n- **输出日志 (Output Log)**：作为调试工具，`Output\
  \ Log` 是开发人员的关键资源。它通过显示有用的信息、警告、错误和调试消息来提供实时反馈。此功能有助于在开发过程中识别并解决问题，确保你的项目顺利运行。\n\
  - **命令控制台 (Command Console)**：`Command Console` 的功能类似于传统的命令行界面，允许用户通过输入控制台命令触发特定的编辑器行为。与编辑器的这种直接交互允许快速执行各种操作，简化了编辑过程。\n\
  - **派生数据 (Derived Data)**：此部分提供了对 `Derived Data` 功能的访问。`Derived Data` 包含了预处理和优化的资产（包括纹理和着色器），这些提高了项目的效率。它是\
  \ Unreal Engine 资产管理系统不可或缺的一部分，确保资产以所需的格式随时可用，从而有助于最佳的运行时性能。\n- **版本控制状态 (Source\
  \ Control Status)**：此区域提供了关于项目版本控制状态的关键信息，特别是当你的项目连接到 SVN、Git 或 Perforce 等版本控制系统时。它作为一个视觉指示，显示当前版本控制状态。如果项目未连接到版本控制，它将显示\
  \ `Revision Control is disabled`（版本控制已禁用）。\n\n## 大纲 (Outliner) [6]\n\n`Outliner`（大纲）面板是\
  \ Unreal 编辑器中一个强大的组织工具，提供了关卡中所有内容的层级视图。它通常默认位于 Unreal 编辑器窗口的右上角，提供了填充项目的资产和对象的视觉化表示。\n\
  \n你可以从下图中看到它的表示示例：\n\n![Figure 1.11 – The Outliner panel](img/B21600_01_011.png)\n\
  \n图 1.11 – 大纲面板\n\n除了作为内容层级查看的基本作用外，`Outliner` 面板提供了许多有价值的功能：\n\n- **可见性控制**：通过与\
  \ `Outliner` 中相关的 `eye`（眼睛）按钮交互，你可以高效地管理关卡内 Actor 的可见性。这允许你立即切换特定 Actor 的可见性，增强你对场景视觉表示的控制。\n\
  \n### 注意事项\n\n请注意，使用 `eye` 按钮隐藏关卡中的 Actor 并会在 `Play Mode`（播放模式）或 `Runtime`（运行时）期间隐藏它们。如果你播放、模拟或渲染你的过视频，必须在\
  \ `Details`（细节）面板中禁用它的可见性，或启用 `Actor Hidden in Game`（游戏隐藏 Actor）。\n\n- **上下文交互**：在\
  \ `Outliner` 面板中右键点击 Actor 会打开特定 Actor 的右键菜单。此菜单允许你访问与所选 Actor 一系列额外操作和设置。它为对单个资产执行针对性操作提供了方便的方法，简化了你的编辑过程。\n\
  - **文件夹管理**：`Outliner` 面板的功能扩展到了 Actor 和资产之外。它还方便了项目中内容文件夹的创建、移动和删除。此功能有助于维护良好的项目结构，确保资产在逻辑上分组并易于访问。\n\
  \n本质上，`Outliner` 面板不仅提供了关卡内容层级的概览，还提供了资产可见性控制、与单个 Actor 的上下文交互以及高效内容文件夹管理的必备工具。通过利用这些功能，你可以在\
  \ Unreal Engine 中更轻松、更精确地导航和管理项目。\n\n## 细节面板 (Details panel) [7]\n\n`Details`（细节）面板是\
  \ Unreal Engine 5 用户界面的核心组件，对项目内所选对象或 Actor 的属性和特征提供了丰富的信息和控制。\n\n你可以从下图中看到它的表示示例：\n\
  \n![Figure 1.12 – The Details panel](img/B21600_01_012.png)\n\n图 1.12 – 细节面板\n\n\
  `Details` 面板通常位于 Unreal 编辑器界面的右侧，提供了一套全面的功能和特性，如图 1.12 所示，它通常不分 `Level Details`（关卡细节）或\
  \ `World Settings`（世界设置）标签进行分组。\n\n`Details` 面板的主要功能如下：\n\n- **属性检查**：`Details`\
  \ 面板的核心是检查和管理所选对象属性的中心。当你选择关卡中的 Actor、资产或组件时，面板会动态填充相关信息，展示其属性的详细细分。这包含了重要的属性，例如变换数据（位置、旋转和缩放）、网格引用、材质等。\n\
  - **自定义与编辑**：除了被动的属性显示，`Details` 面板允许用户自定义和修改这些属性。它提供了交互式字段和控件，允许对对象属性进行直接输入和操作。例如，你可以通过操作这些字段来精确调整\
  \ Actor 的位置或更改其材质分配，从而对关卡元素进行粒度控制。\n- **组件管理**：对于由多个组件（例如静态网格体、灯光和摄像）组成的复杂 Actor，`Details`\
  \ 面板提供了这些组件的层级视图。这种层级结构允许用户在大型 Actor 的上下文中导航并编辑单个组件的属性，简化了编辑过程。\n\n\n\n\n\n*   **高级功能**：高级用户可以利用\
  \ `Details`（细节）面板中的额外功能，例如 Actor（参与者）标记、碰撞设置、复制参数等。这些选项可以对你项目中的对象行为和交互提供精细化的控制。\n\
  \n我们已经涵盖了 Unreal Engine 界面的基础知识，涉及了从菜单栏、工具栏到 `Content Browser`（内容浏览器）和 `Details`（细节）面板的所有内容。这一概述为你深入学习\
  \ Unreal Engine 游戏和应用开发提供了一个良好的起点。\n\n# 总结\n\n在本章中，我们从安装 `Epic Games Launcher` 开始。我们确保了你的系统符合所需的硬件规格，涵盖了最低配置和推荐配置，以优化你的\
  \ Unreal Engine 体验。在打好坚实的基础上，我们向你介绍了 Unreal Engine 生态系统中的关键术语，这对于在游戏开发领域进行有效交流至关重要。\n\
  \n在转向实际应用时，我们专注于项目设置和模板，使你能够根据自己的愿景创建并配置量定制的 Unreal Engine 项目。从选择目标平台到微调射线追踪设置，你掌握了高效启动项目所需的技能。我们的探索以对\
  \ Unreal Engine 界面的深入介绍结束，赋予了你对各个各个组件和功能的见解，为你的创作之旅铺平了道路。\n\n在下一章中，我们将深入探讨 Unreal\
  \ Engine 5 中的 `Quixel Bridge`、`Megascans` 和 `Fab`。这段沉浸式的之旅将引导你完成资产选择、获取以及有效管理这些库的过程。通过关注技术效率和创作潜力，你将学习如何将顶级资产无缝集成到你的\
  \ Unreal Engine 项目中。这些工具支持更顺畅的工作流，并为增强你的游戏开发和世界构建过程提供了可靠的方法。\n\n# 订阅 Game Dev Assembly\
