  * 深入研究纹理实现\n* 材质工作流\n\n# 技术要求\n\n本章的技术要求与第 1 章 以及后续章节的规范相同；请参阅该章节中的 `Technical requirements`（技术要求）部分。\n\
  \n尽管如此，请记住在使用 Unreal Engine 5（推荐版本为 5.5 或更高版本）结合 `Lumen Global Illumination`（全局全局光照）、`Reflections`（反射）以及\
  \ `Nanite` 虚拟几何体的推荐硬件配置：\n\n* **操作系统**：Windows 10 64 位版本 1909 revision .1350 或更高版本，或\
  \ 2004 和 20H2 revision .789 或更高版本。支持 `DirectX 12 Agility SDK`。\n* **处理器**：四核 Intel\
  \ 或 AMD，2.5 GHz 或更快。\n* **内存**：8 GB RAM。\n* **软件光线追踪**：此功能可能需要使用支持 `Shader Model\
  \ 5` 的 `DirectX 11` 显卡。\n* **硬件光线追踪**：需要 Windows 10 build 1909.1350 或更高版本，支持 `DirectX\
  \ 12` 以及特定的兼容显卡（例如 NVIDIA RTX-2000 系列或更新型号、AMD RX-6000 系列或更新型号、Intel® Arc™ A 系列显卡或更新型号）。\n\
  * **网络访问**：需要连接互联网以下载本章所需的插件和额外内容。\n\n# 理解术语\n\n以下是本章使用的术语列表：\n\n* **Shaders（色器）与渲染过程**：Shader\
  \ 决定了顶点和像素的渲染方式，使用适用于 Unreal Engine 的 `High-Level Shading Language` (`HLSL`) 编写。在渲染管道，Shader\
  \ 是负责决定每个顶点或像素在屏幕上渲染方式的专用程序。这些色器代码随后会被翻译成 GPU 硬件可以执行的一系列汇编指令，最终生成显示在屏幕上的最终像素颜色。\n\
  * **HLSL**：`HLSL` 让材质具备通信 GPU 指令的能力，使艺术家和程序员能够控制屏幕视觉效果。\n* **Expressions（表达式）与 functions（函数）**：表达式是执行数学运算或为材质提供信息的单个节点。它们在材质编辑器中组合在一起并将结果传递给主节点。执行特定任务的节点组被称为函数。\n\
  * **Main node（主节点）**：材质的 `main node` 是所有节点汇聚以决定其外观的地方。该节点的输入决定了材质的外观。\n* **PBR**：`Physically-Based\
  \ Rendering`（基于物理的渲染）是一种着色和渲染技术，能够更准确地模拟光线与不同材质的相互作用。\n\n现在我们已经理解了 Unreal Engine\
  \ 中材质的基本概念，让我们深入材质编辑器界面。\n\n# 探索材质编辑器界面\n\nUnreal Engine 中的 `Material Editor` 有它自己的工作空间和相关工具。该图形界面使用名为\
  \ `Material Expressions`（材质表达式）的节点运行，这些节点会被翻译成 `HLSL` 代码。这种方法使得在 Unreal Engine 中创建材质的过程变得更加直观。\n\
  \n要创建你的第一个材质，请打开 `Material Editor`。在 Unreal Engine 中，创建不同类型的资产（如材质、蓝图、纹理等）需要首先在指定的文件夹中将它们创建为资产。首先，在\
  \ `Content Browser`（内容浏览器）的空白区域点击右键，并在 `Create Basic Asset` 下选择 `Material`。\n\n\
  ![Figure 8.1 – Content Browser](img/B21600_08_01.png)\n图 8.1 – 内容浏览器\n\n此操作将创建一个准备好重命的资产。然而，并不是所有名称都是允许的。在\
  \ Unreal 中，保持组织结构至关重要，无论是在文件夹级别，还是对于不同资产的前缀和后缀。建议遵循风格指南（在第 4 章中提到）。对于材质，使用前缀 `M_`\
  \ 后跟所需的名称。在这种情况下，由于我们正在查看用户界面，名称将为 `M_UI`。\n\n![Figure 8.2 – Material asset](img/B21600_08_02.png)\n\
  \n图 8.2 – 材质资产\n\n双击材质将打开 `Material Editor`。界面分为几个区域，我们将主要关注图中标记的区域：\n\n![Figure\
  \ 8.3 – Overview of the Material Editor user interface](img/B21600_08_03.png)\n\n\
  图 8.3 – 材质编辑器用户界面概述\n\n*图 8.3* 描述了材质编辑器用户界面的以下区域：\n\n1. Graph（图表）\n2. Palette（调板）\n\
  3. Viewport（视口）\n4. Details（细节）\n5. Toolbar（工具栏）\n6. Stats（统计）\n\n接下来让我们详细查看这些每个区域。\n\
  \n## Graph\n\n当你创建一个材质时，会出现一个带有多个输入的主节点。该主节点作为中心枢纽，你可以在这里连接表达式和函数来创建材质。以下是执行各种操作的控件：\n\
  \n* 左键：选择单个节点；如果点击并拖动，可以同时选择多个节点。\n* 右键 + 拖动：在图中移动或平移。\n* 鼠标滚轮（或右键 + Alt 键）：放大和缩小。\n\
  * 在图中点击右键（或按 Tab 键）：访问调板，稍后会进行介绍。\n* 左键（点击并拖动）：建立连接。\n\n![Figure 8.4 – Material\
  \ Editor user interface: OUTPUTS/INPUTS](img/B21600_08_04.png)\n\n图 8.4 – 材质编辑器用户界面：输出/输入\n\
  \n* 左键 + Alt 键：断开节点。\n* 左键 + Ctrl 键：更改连接。\n\n*图 8.5* 提供了这些快捷键的概述：\n\n![Figure 8.5\
  \ – Material Editor user interface: shortcuts](img/B21600_08_05.png)\n\n图 8.5 –\
  \ 材质编辑器用户界面：快捷键\n\n## Palette\n\n在此窗口中，你可以找到用于组合材质的所有表达式和函数。可以通过按 Tab 或在空白区域点击右键来访问它。节点根据功能进行分类，例如\
  \ `Math`（数学）、`Textures`（纹理）、`Utility`（实用）和 `Material Functions`（材质函数），有助于构建复杂材质的过程：\n\
  \n![Figure 8.6 – Material Editor user interface: node palette](img/B21600_08_06.png)\n\
  \n图 8.6 – 材质编辑器用户界面：调板\n\n## Viewport\n\n最初，材质编辑器中的视口与场景视口共享几乎相同的菜单，除了右下角的图标：\n\n\
  ![Figure 8.7 – Material Editor user interface: Viewport](img/B21600_08_07.png)\n\
  \n图 8.7 – 材质编辑器用户界面：视口\n\n这些图标显示了基础几何体，以便更好地可视化正在创建的材质。从左到右，它们包括 `Cylinder`（圆体）、`Sphere`（球体）、`Plane`（平面）和\
  \ `Cube`（立方体）。最右侧最后一个图标用于可视化内容浏览器中选的任何静态模型。\n\n![Figure 8.8 – Material Editor user\
  \ interface: Preview custom Static Mesh](img/B21600_08_08.png)\n\n图 8.8 – 材质编辑器用户界面：预览自定义静态模型\n\
  \n在材质编辑器中，你正在编辑的材质出现在静态模型的 `Element 0` 上。你可以通过在模型编辑器中打开静态模型并检查 `Material Slots`（材质槽）部分来查看。它显示了分配到静态模型不同部分的材质数量。例如，对于\
  \ `SM_MatPreviewMesh_01`，材质覆盖了整个表面，包括基础。\n\n![Figure 8.9 – Static Mesh editor: Material\
  \ Slots](img/B21600_08_09.png)\n\n图 8.9 – 静态模型编辑器：材质槽\n\n\n\n\n\n## 详情面板 (Details\
  \ panel)\n\n在此区域，将显示图中选中的表达式或函数的所有属性，允许你进行必要的修改。\n\n![图 8.10 – 材质编辑器用户界面：详情](img/B21600_08_10.png)\n\
  \n图 8.10 – 材质编辑器用户界面：详情\n\n## 工具栏 (Toolbar)\n\n此工具栏包含一系列图标，侧重于处理材质时最常用的常用工具。你只需双击任何材质来打开此工具栏。\n\
  \n![图 8.11 – 材质编辑器用户界面：工具栏](img/B21600_08_11.png)\n\n图 8.11 – 材质编辑器用户界面：工具栏\n\n\
  以下是这些工具从左到右的列表：\n\n1. `Save`（保存）：保存材质编辑器中进行的所有更改，包括资源本身。\n2. `Browse to Asset`（浏览至资源）：直接打开“内容浏览器”（Content\
  \ Browser）并定位材质保存的位置。该图标出现在整个虚幻引擎中，是在不同位置之间跳转的最快方法。\n3. `Apply`（应用）：如果材质已分配给场景中的对象，则将应用材质编辑器中进行的所有更改。\n\
  4. `Search`（搜索）：在材质编辑器中打开“搜索”标签页，其中输入表达式、函数或注释的名称将显示列表。\n\n![图 8.12 – 材质编辑器用户界面：工具栏\
  \ | 搜索](img/B21600_08_12.png)\n\n图 8.12 – 材质编辑器用户界面：工具栏 | 搜索\n\n1. `Home`（首页）：缩放到主节点。\n\
  2. `Hierarchy`（层级）：列出从材质创建的实例。这将在“材质实例”（Material Instances）部分中进一步探讨。\n3. `Live Update`（实时更新）：允许在节点和视口中选择预览类型。适用于材质内纹理或掩罩的动画。\n\
  \n![图 8.13 – 材质编辑器用户界面：节点预览](img/B21600_08_13.png)\n\n图 8.13 – 材质编辑器用户界面：节点预览\n\n\
  1. `Clean Graph`（清理图表）：移除所有未直接或间接连接到主节点的节点。包括“隐藏未选连接器”（Hide Unselected Connectors）选项，折叠所有未连接节点的输入和输出。\n\
  2. `Preview State`（预览状态）：根据硬件规格在不同平台和着色器质量之间工作时的可视化和选择模式。\n3. `Hide Unrelated`（隐藏无关项）：快速可视化所选节点之间的连接，对于具有大量节点网络的材质非常有用。\n\
  4. `Stats`（统计）：打开“统计”标签页，将在其相应的章节中进行介绍。\n5. `Platform Stats`（平台统计）：打开显示所用平台材质统计数据和编译错误的标签页。\n\
  \n## 统计数据 (Stats)\n\n虚幻引擎中的 `Stats`面板对于材质优化至关重要。它包括估计渲染开销的 `Instruction Count`（指令数）；指令越少意味着成本越低。节点网络编译期间的编译器错误在此处标记。\n\
  \n正如你所见，虚幻引擎中的 `Material`接口非常全面。我们到为止探索的工具允许我们查看材质的构建（结构）、添加和删除节点，甚至访问 `Stats` 信息，这些信息在未来可以作为性能指标使用。考虑到这一点，让我们配置我们的第一个材质。\n\
  \n# 在材质编辑器中工作 (Working in the Material Editor)\n\n理解材质编辑器中的数据表示和操纵对于在虚幻引擎中创建材质至关重要。主节点中的每个输入定义了材质的物理属性，并设计用于接受特定类型的数据，例如其他材质表达式或函数。让我们学习材质创建中常用的某些常用数据类型。\n\
  \n## 浮点数 (Float)\n\n`Float` 存储单个浮点值，可以是正数或负数，并包含小数点。它通常用作功率或强度值，可以与其他节点结合。通常使用两种材质表达式来定义浮点数：\n\
  \n* `Constant`（常数，快捷键 `1`）：此值在材质编译后保持不变。\n* `Scalar Parameter`（标量参数，快捷键 `S`）：与常量不同，标量参数充当命名变量，可以在编译后甚至在运行时在材质实例中进行修改。\n\
  \n## 双浮点数 (Float2)\n\n`Float2` 存储两个数值，例如 `(2.0, 3.0)`。在材质编辑器中，使用 `Constant2Vector`\
  \ 材质表达式（快捷键 `2`）来定义 float2。这在处理纹理的 UV 坐标或屏幕上的位置时特别有用。\n\n## 三浮点数 (Float3)\n\n虚幻引擎中的\
  \ `Float3` 存储三个数值，通常用于表示像素颜色的红、绿、蓝颜色通道。float3 的一个常见应用是定义纯色。虚幻引擎中使用 `Constant3Vector`\
  \ 表达式（快捷键 `3`）来定义 float3。它在详情中包含一个颜色条，你可以双击它来打开颜色选择器。\n\n![图 8.14 – 材质编辑器数据类型：Float3](img/B21600_08_14.png)\n\
  \n图 8.14 – 材质编辑器数据类型：Float3\n\n## 四浮点数 (Float4)\n\n`Float4` 存储四个浮点值，例如 `(50.0, 0.0,\
  \ 100.0, 0.5)`。有两种常用的材质表达式来定义 float4：\n\n* `Constant4Vector`（四常数向量）：存储四个常数值。最常用的是\
  \ `Constant4Vector`（键盘快捷键 `4`）用于表示 RGBA 颜色，包括 Alpha 通道。\n* `Vector Parameter`（向量参数）：代表带参数的\
  \ float4。\n\n![图 8.15 – 材质编辑器数据类型：Vector Parameter](img/B21600_08_15.png)\n\n图 8.15\
  \ – 材质编辑器数据类型：向量参数\n\n通过以下引脚访问每个通道：\n\n1. `RGB`：返回 float4 的三个值——在示例中`(1.0, 0.5,\
  \ 0.3)`\n2. `R`：返回 **R** 通道的值，`1.0`\n3. `G`：返回 **G** 通道的值，`0.5`\n4. `B`：返回 **B**\
  \ 通道的值，`0.3`\n5. `A (5)`：返回 **A** 通道的值，`0.0`\n\n要一起处理所有的 RGBA 值，你将使用 `AppendVector`\
  \ 表达式来连接 A 通道\n\n![图 8.16 – 材质编辑器数据类型：RGBA](img/B21600_08_16.png)\n\n图 8.16 – 材质编辑器数据类型：RGBA\n\
  \n到目前为止，我们一直在处理内部的浮点表达式，观察了它们如何既作为灰度比例又作为强度或强度的单个值。通过向 `Scalar Parameter` 添加更多值，我们正在分配构建更复杂值的通道，最终包含一个允许我们控制透明度的第四通道。在下一节中，我们将探索\
  \ PBR 材质的主要属性。\n\n# PBR 材质概述 (Overview of PBR materials)\n\n虚幻引擎中的 PBR 材质遵循物理定律，以准确描述光与表面的相互作用。虚幻引擎目前采用\
  \ PBR 金属度-粗糙度系统，包含三个核心属性：金属度（Metallic）、高光（Specular）和粗糙度（Roughness）。除了这些之外，基础颜色（Base\
  \ Color）、法线（Normal）和环境光遮蔽（Ambient Occlusion）等特定输入对于定义 PBR 材质的外观和表面属性至关重要。\n\n让我们探索创建\
  \ PBR 材质所需的关键输入。\n\n## 基础颜色 (Base Color)\n\n基础颜色定义了材质的主要颜色，代表不带阴影或高光反射的漫反射光。它可以连接到统一颜色以对对象着色，或者使用纹理来模拟木材或岩石等材质。此输入还提供了材质颜色/外观和反射的着色器信息，对于金属元素特别相关，我们将进一步阐述。\n\
  \n![图 8.17 – PBR 材质：基础颜色](img/B21600_08_17.png)\n\n图 8.17 – PBR 材质：基础颜色\n\n## 金属度属性\
  \ (Metallic property)\n\n\n\n\n\nPBR 中的 `Metallic` 属性决定了材质是金属（导体）还是非金属（电介体）。该参数的范围从\
  \ `0` 到 `1`，其中 `0`（纹理中的黑色）表示非金属，而 `1`（纹理中的白色）表示金属。\n\n![图 8.18 – PBR 材质：金属性](img/B21600_08_18.png)\n\
  \n图 8.18 – PBR 材质：金属性\n\n最初，材质应分类为纯金属（`1`）或非金属（`0`），避免使用中间值。金属和非金属通常共存在同一种材质中。\n\
  \n## Specular（高光）\n\n此输入向着色器传递表面应反射的光量，其值范围从 `0` 到 `1`。\n\n对于非金属（电介体）表面，光线反射通常在\
  \ 2–5% 到最大 8–10% 之间。在 Unreal Engine 中，约为 `0.05` 的 `Specular` 值代表约 4–5% 入射光的真实世界反射。纯金属材质反射出入射光\
  \ 70% 到 100% 之间。当 `Metallic` 值设置为 `1` 时，着色器会在内部处理反射。纯金属材质的精确反射率取决于其 `Base Color`（基础颜色）输入，正如前节所述。\n\
  \n## Roughness（粗糙度）\n\n`Roughness` 定义了材质的表面纹理，影响反射呈现为漫反射还是高光反射。粗糙表面将光线向许多方向散射，产生漫反射并呈现哑光的外观。`Roughness`\
  \ 取值范围从 `0` 到 `1`：\n\n*   值为 `0`（使用纹理时为黑色）模拟抛光表面，产生锐利的高光反射。\n\n![图 8.19 – PBR 材质：Metallic\
  \ = 1 时的粗糙度](img/B21600_08_19.png)\n\n图 8.19 – PBR 材质：Metallic = 1 时的粗糙度\n\n*  \
  \ 值为 `1`（使用纹理时为白色）模拟粗糙或哑光表面，导致漫反射反射。\n\n![图 8.20 – PBR 材质：Metallic = 0 时的粗糙度](img/B21600_08_20.png)\n\
  \n图 8.20 – PBR 材质：Metallic = 0 时的粗糙度\n\n## Normal（法线）\n\n`Normal` 输入为材质添加表面细节，影响光线如何相互作用以创建阴影和高光。在\
  \ Unreal Engine 中，它使用一种蓝色的纹理，每个通道（`R`、`G` 和 `B`）影响不同的方面：`R` 代表水平细节，`G` 代表垂直细节，`B`\
  \ 代表深度。\n\n图 8.21 展示了这种增强：左侧物体缺少 `Normal` 贴图，而右侧应用 `Normal` 贴图的对象显示出增加细节，无需高面数网格：\n\
  \n![图 8.21 – PBR 材质：无法线贴图（左）和有法线贴图（右）](img/B21600_08_21.png)\n\n图 8.21 – PBR 材质：无法线贴图（左）和有法线贴图（右）\n\
  \n## Ambient Occlusion（环境光蔽）\n\n`Ambient Occlusion` 使用纹理贴图模拟表面缝隙中的自阴影，纹理范围从黑色到深灰色（值接近\
  \ `0`）到接近白色（值接近 `1`）。这些阴影指示光线反射较少的区域，营造出较暗的区域。这种效果对于静态或固定灯光有效，但在设置为 `Movable`（移动）移动性的灯光下不激活。\n\
  \n![图 8.22 – PBR 材质：环境光蔽](img/B21600_08_22.png)\n\n图 8.22 – PBR 材质：环境光蔽\n\n理解 PBR\
  \ 材质中的这些节点允许我们能够在创建材质时掌握所有可能的控制。掌握这些信息后，让我们开始为项目创建实用的材质。\n\n# 练习 8.1：创建金色材质\n\n\
  利用我们目前学到的知识，让我们创建一个基础的 PBR 材质，特别是金色的：\n\n1.  首先，通过将 `Metallic` 输入设置为值为 `1` 的 `Constant`\
  \ 节点（直接在节点的 `Details` 面板中）来确保它是纯金属材质。\n2.  接下来，使用 `Constant3Vector` 节点应用颜色，设置 `Details`\
  \ 为 `R` = `0.944`, `G` = `0.766` 以及 `B` = `0.366`。\n3.  最后，对于 `Roughness` 输入，连接另一个值为\
  \ `0` 或 `0.05` 的 `Constant` 节点，为反射添加一些不完美性。\n\nEt voilà！你现在有了可以使用的第一个完美金色材质：\n\n\
  ![图 8.23 – PBR 材质练习](img/B21600_08_23.png)\n\n图 8.23 – PBR 材质练习\n\n# 深入纹理实现\n\n\
  在在上一个练习中，我们看到可以使用由三个浮点数（值）组成的简单节点来创建金色材质。但当我们谈论 100% PBR 材质时，这是可能的，因此我们必须理解 Unreal\
  \ Engine 中纹理的正确用法。\n\n## 格式和分辨率\n\n我们已经使用了颜色（float3）、粗糙度（标量）和金属级别（float）的值。这些输入也接受纹理贴图，贴图必须在文件格式和分辨率上符合特定标准。Unreal\
  \ Engine 支持多种图像格式，包括 JPG、FLOAT、JPEG、PCX、PNG、PSD、EXR、TIF、BMP、TGA 和 DDS。\n\n纹理尺寸是至关重要的，并非所有分辨率都能在引擎中正常工作。在下表中，我们可以看到基于\
  \ 2 的幂的像素：\n\n| 1 x 1 | 2 x 2 | 4 x 4 | 8 x 8 | 16 x 16 | 32 x 32 | 64 x 64 |\n\
  | 128 x 128 | 256 x 256 | 512 x 512 | 1024 x 1024 | 2048 x 2048 | 4096 x 4096 |\
  \ 8192 x 8192 |\n\n表 8.1 – 纹理分辨率（像素）\n\nUnreal Engine 可以处理不是 2 的幂的尺寸，但使用 2 的幂可以启用\
  \ mipmap（多级渐变）。什么是 mipmap？它是原始纹理在降低分辨率下的版本，正如图 8.24 所示：\n\n![图 8.24 – 纹理的 mipmap](img/B21600_08_24.png)\n\
  \n图 8.24 – 纹理的 mipmap\n\n引擎创建更小的纹理版本，称为 mipmap，以增强渲染质量并减少伪影。这些 mipmap 用于在远处元素之间平滑过渡。\n\
  \n## 在材质编辑器中使用纹理\n\n在 Unreal Engine 的材质编辑器中，一旦纹理导入内容浏览器，处理它们就是至关重要的。`Texture Sample`\
  \ 节点（快捷键 `T`）是此过程的关键，允许处理图像通道（`R`、`G`、`B` 和 `A`），例如处理 float4 向量。\n\n将此 `Texture\
  \ Sample` 节点连接到材质的 `Base Color` 参数，得到如下结果：\n\n![图 8.27 – 连接到输入的纹理](img/B21600_08_27.png)\n\
  \n图 8.27 – 连接到输入的纹理\n\n处理纹理带来了额外的挑战，因为它们的显示很大程度上取决于物体以及其 UV 布局情况（详情请参见第 3 章#Chapter_3.xhtml__idTextAnchor138）。为了控制我们的纹理，我们使用\
  \ `Texture Coordinate` 节点（快捷键 `U`），其颜色为红色。\n\n调整 `UTiling` 和 `VTiling` 参数允许我们沿着相应的轴线多次重复纹理；例如，将两者都设置为\
  \ `2` 将导致纹理重复四次（在 *U* 和 *V* 方向上各两次）。因此，`Texture Sample` 节点在其 UVs 输入中的默认值为 1。\n\n\
  \n\n\n为了获得更大的实用性，在节点之外管理这些 UV 平铺值是有是有益的，我们可以将其整合到参数中。这种方法允许我们在材质实例（Material Instances）中观察并调整\
  \ UV 平铺值，这将在本章的 `Material Instances` 子节中讨论。\n\n![Figure 8.30 – Texture tiling construction](img/B21600_08_30.png)\n\
  \n图 8.30 – 纹理平铺构建\n\n在本节中，我们探索了在 PBR 材质中使用纹理进行可视化，以及使用 `Texture Coordinate` 节点来调整表面纹理的缩放或平铺。注意的是，同一个\
  \ `Texture Coordinate` 节点可以用于同一材质中的多个纹理。考虑到这一点，让我们深入研究材质工作流，以理解如何在不影响性能的情况下在整个项目中管理和复用材质。\n\
  \n**提示**：如果你想探索更复杂或现成的材质，可以在 Fab 和 Quixel Bridge 中找到多种示例，这两者都可以直接从 Epic Games Launcher\
  \ 访问。你还可以从启动器中的 `Learn` 选项卡打开示例项目，以学习专业环境中使用的高级材质设置和工作流。\n\n# 材质工作流\n\nUnreal Engine\
  \ 的材质编辑器（Material Editor）是材质工作的六种工具之一，包括实例（instances）、函数（functions）、层（layers）、参数集合（parameter\
  \ collection）和 HLSL。这些工具因其快速创建材质并在开发过程中根据需要更新属性的高效率而受欢迎。\n\n在后续章节中，我们将详细探索这些工具，讨论它们的特性以及如何增强材质创建过程。\n\
  \n## 材质实例\n\n`Material Instances` 提供了一种在不进行昂贵的重新编译的情况下更改材质外观的方法。随着材质变得复杂，直接在材质编辑器中调整可能会变得耗时。材质实例通过允许无需重新编译的修改解决了这一问题，提高了工作流效率，并可能增强材质性能。\n\
  \n可以通过对材质本身`右键点击`并选择 `Create Material Instance` 来创建实例：\n\n![Figure 8.31 – Create\
  \ Material Instance](img/B21600_08_31.png)\n\n图 8.31 – 创建材质实例\n\n或者，你可以在 `Content\
  \ Browser` 中`右键点击` `Material` 类别并选择 `Material Instance` 来创建实例，如图 `Figure 8.32` 所示：\n\
  \n![Figure 8.32 – Material Instance](img/B21600_08_32.png)\n\n图 8.32 – 材质实例\n\n\
  最佳实践是为每种表面类型创建一个主材质（master material）并从其生成实例。这确保了对主材质的更改会影响许多场景对象。平衡主材质和实例的数量关重要；较大的项目可能会使用\
  \ 20–50 个被许多实例依赖的主材质。\n\n## 地形纹理化\n\n在创建场景时，通常会使用需要适当纹理的环境。Unreal Engine 提供了特定的\
  \ `Landscape` 工具来导入高度图和雕刻地形。在纹理化方面，任何类型的材质都可以应用到我们的地形上；然而，要使用层和笔刷进行纹理化，需要对材质进行相应的配置。\n\
  \n让我们从学习在地形上开始涂画图层的最常用节点开始。\n\n### 常见的地形材质表达式\n\n在地形材质设置的语境下，我们利用 `Texture Coordinate`\
  \ 等节点来管理纹理显示。\n\n专门针对地形，以下是最常见的表达式。\n\n![Figure 8.33 – Landscape material: common\
  \ expressions](img/B21600_08_33.png)\n\n图 8.33 – 地形材质：常见表达式\n\n其中，`LandscapeLayerCoords`\
  \ 节点提供了定制的 UV 信息。此外，`Landscape Layer Weight` 和 `Landscape Layer Blend` 等节点有助于在地形表面上绘制图层。\n\
  \n在 `Figure 8.34` 中，我们可以详细查看 `Landscape Layer Blend` 节点提供的可用选项：\n\n![Figure 8.34\
  \ – Landscape Layer Blend](img/B21600_08_34.png)\n\n图 8.34 – 地形层混合\n\n以下是 `Landscape\
  \ Layer Blend` 节点中每个选项的含义：\n\n1. **Layers**（层）：通过 `+` 图标，你可以添加自动出现在节点中的层。\n2. **Index\
  \ [1]**：这是折叠的层视图。\n3. **Layer Name**（层名称）：这是分配给层的唯一名称。此名称将出现在 `Landscape Mode` 的\
  \ `Paint` 部分。建议不要在这些名称中使用空格。\n4. **Blend Type**（混合类型）：这些是在不同层之间进行涂画的不同混合类型。这些可以是\
  \ `LB_AlphaBlend`、`LB_HeightBlend` 或 `LB_WeightBlend`。如果使用 `LB_HeightBlend`，会出现一个新输入\
  \ `Height ‘layer name’`，可以在此处连接纹理；通常，高度图作为层之间更精确过渡的掩码。\n5. **Preview Weight**（预览权重）：此值表示层权重，用于在材质编辑器中专门预览混合效果。\n\
  6. **Const Layer Input**（常量层输入）：在这里，如果你不想使用纹理，可以输入一个数值值作为颜色。它主要用于调试图层。\n7. **Const\
  \ Height Input**（常量高度输入）：如果你不想使用纹理，可以使用它可以提供数值作为高度。\n\n另外两个表达式 `Landscape Layer\
  \ Sample` 和 `Landscape Grass Output` 通常配合使用，如图 `Figure 8.35` 所示：\n\n![Figure 8.35\
  \ – Landscape Layer Sample and Landscape Grass Output](img/B21600_08_35.png)\n\n\
  图 8.35 – 地形层采样与草地输出\n\n如图 `Figure 8.35` 所示，`Landscape Layer Sample` 表达式从具有精确名称的层获取值。如果你将其命名为\
  \ `Grass`，它将获取该层的值。此表达式对于材质显示植物非常有用。\n\n`Landscape Grass Output` 表达式是一个输出，类似于主节点，负责在通过\
  \ `Landscape Layer Sample` 节点指定的层中程序生成 3D 植物。\n\n### 从地形材质生成植物\n\n从地形材质将生成什么类型的植物？显然，我们需要指定植物的类型以及在什么条件下生成它。这就是新资产大显用场：`Landscape\
  \ Grass Type`。\n\n![Figure 8.36 – The Landscape Grass Type asset](img/B21600_08_36.png)\n\
  \n图 8.36 – 地形草地资产\n\n要创建此资产，在 `Content Browser` 中`右键点击`并导航到 `Foliage` | `Landscape\
  \ Grass Type`。创建后双击（与 Unreal 中的所有资产一样）打开资产，你会发现一系列与我们在 `Chapter 7` 中看到的 `Static\
  \ Mesh Actor` 非常相似的属性。\n\n\n\n\n- `Align to Surface (8)`：决定植被是否垂直于地形表面对齐。适用于地面覆盖物，但对于树木等垂直物体可能并不理想。\n\
  - `Instance World Position Offset Disable Distance (9)`：超过此距离后，植被的任何模拟移动（例如风力效果）将被禁用，以提高性能并避免视觉伪影。\n\
  \n一旦配置了此资产，就可以在材质中应用它了。你应该将其放置在 `Landscape Grass Output` 节点的属性中，在其中你将找到一系列元素。通过点击\
  \ `+` 按钮，你可以添加创建植被所需的所有元素。\n\n![Figure 8.38 – Landscape Grass Type in Landscape\
  \ Grass Output](img/B21600_08_38.png)\n图 8.38 – Landscape Grass Output 中的 Landscape\
  \ Grass 类型\n\n我们可以添加第二个元素，在 `Rock` 层上显示沉积物或小岩石。\n\n![Figure 8.39 – Landscape Grass\
  \ output: GrassCover and Debris](img/B21600_08_39.png)\n图 8.39 – Landscape Grass\
  \ output：GrassCover 和 Debris\n\n在探索了常见的地形材质表达式后，让我们使用 *第 2 章 中的 Megascans 资源创建一个。\n\
  \n### 实现地形材质表达式\n\n使用 Bridge 导入草地、岩石和雪地面的纹理。然后，通过拖动这些纹理将它们添加到材质编辑器中，每个纹理都会创建一个 `Texture\
  \ Sample` 节点。材质通常需要许多纹理，但虚幻引擎限制每个材质为 16 个纹理采样。\n\n![Figure 8.40 – Texture Sample:\
  \ Shared Wrap](img/B21600_08_40.png)\n图 8.40 – Texture Sample：Shared Wrap\n\n使用\
  \ `LandscapeCoords` 节点和如 `Tile Grass` 这样的标量参数调整每个表面的纹理缩放。此参数通过 `Multiply` 节点连接，确保纹理适应场景的比例。每个纹理组件，包括法线贴图和包含\
  \ `Ambient Occlusion`（环境光反射）、`Roughness`（粗糙度）和 `Displacement`（位移）的打包纹理，都应相应连接。\n\
  \n![Figure 8.41 – Tiling set up](img/B21600_08_41.png)\n图 8.41 – 瓦铺设置\n\n我们将使用 `SetMaterialAttributes`\
  \ 表达式来简化纹理的数据管理。每个纹理或纹理采样都提供浮点数据：`Base Color`（基础颜色）和 `Normal`（法线）为 float3，`Specular`（高光）、`Roughness`（粗糙度）和\
  \ `Ambient Occlusion`（环境光反射）为 float。将这些纹理连接到节点会将它们合并为 `Material Attributes`，从而全面定义我们的表面属性。表达式的\
  \ `Details` 面板包含一个 `+` 按钮，可根据需要按顺序添加通道或输入。\n\n![Figure 8.42 – The SetMaterialAttributes\
  \ expression](img/B21600_08_42.png)\n图 8.42 – SetMaterialAttributes 表达式\n\n现在，从打包纹理的\
  \ `G` 通道链接 `Base Color` 和 `Roughness`，从 `R` 通道链接 `Ambient Occlusion`，并连接 `Normal`\
  \ 贴图。对于 `Specular`，连接一个 `0.15` 的值（见图 8.43），这并不严格符合 PBR，但可以减少整个表面的亮度，在大面积地形上营造出潮湿的外。\n\
  \n注意 `Tile Grass` 不是标准节点；它是一个 `ScalarParameter`（标量参数），而 `0.15` 是一个 `Constant`（常量）节点。\n\
  \n![Figure 8.43 – SetMaterialAttributes connected](img/B21600_08_43.png)\n图 8.43\
  \ – SetMaterialAttributes 连接\n\n这些表面中的每一个都连接到 `Landscape Layer Blend`。此外，`Grass`\
  \ 和 `Snow` 层被设置为 `LB_HeightBlend`，需要另一个 `Height`（高度）贴图输入。我们利用打包纹理的 `B` 通道来建立此连接，如图\
  \ 8.44 所示：\n\n![Figure 8.44 – Final SetMaterialAttributes](img/B21600_08_44.png)\n\
  图 8.44 – 最终的 SetMaterialAttributes\n\n最终的材质设置如下：\n\n![Figure 8.45 – Overview of\
  \ the final material setup ](img/B21600_08_45.png)\n图 8.45 – 最终材质设置概览\n\n如你所示，主节点没有完全展开，这是因为主节点的\
  \ `Details` 面板中启用了 `Use Material Attributes` 属性。\n\n![Figure 8.46 – Landscape material:\
  \ Use Material Attributes](img/B21600_08_46.png)\n图 8.46 – 地形材质：使用 Material Attributes\n\
  \n一旦创建了材质，最好创建一个实例并将其应用到地形上。在这种情况下，选择场景中的地形，并在 `Details` 面板中分配该实例。\n\n![Figure 8.47\
  \ – Landscape Details](img/B21600_08_47.png)\n图 8.47 – 地形细节\n\n在分配材质或实例时，地形可能会显示为黑色。这是正常的，因为地形仍然缺少某些正确显示材质的资产。\n\
  \n![Figure 8.48 – Landscape material assigned to the landscape](img/B21600_08_48.png)\n\
  图 8.48 – 分配给地形的地形材质\n\n这些资产是必要的。\n\n\n\n\n最后，通过掌握使用 `Landscape` 图层进行绘图和分层的技术，我们拥有了将地形转换为动态且富有艺术底蕴景观的能力。通过利用\
  \ Unreal Engine 强大的绘图工具，我们能够创建出细致且具有视觉吸引力的景观，适用于各种开放世界设置。\n\n从本质上说，理解并有效利用 Unreal\
  \ Engine 的材质系统赋予了开发者和艺术家创建沉浸式且迷人的开放世界环境的能力，为游戏开发中无限的创造可能奠定了基础。\n\n在下一章中，我们将仔细研究如何使用\
