  \ |\n\n# 第 3 部分\n\n# 用于实现主义的光照与后期处理\n\n在本部分中，你将开始研究光照和后期处理如何塑造场景的整体视觉基调。本部分解释了如何使用\
  \ `Environment Light Mixer` 及相关 Actor 为开放世界环境创建物理准确且具有氛围感的光照设置。你还将探索利用 `Lumen`、`Virtual\
  \ Shadow Maps` 和 `Nanite` 实现动态光照的背后的原理，以保持一致的性能和视觉质量。本部分以后期处理技术结束，通过 `Color Grading`、`Exposure`\
  \ 和 `Bloom` 精炼你的最终图像，确保整个场景呈现出协调且精细的外观。\n\n本书包含以下章节：\n\n*   *第 9 章, *创建你世界的氛围光照***\n\
  \n*   *第 10 章, *设置你的后期处理体积体***\n\n# 第 9 章\n\n# 创建你世界的氛围光照\n\n光照对于塑造任何虚拟环境的情绪和氛围至关重要。在开放世界游戏中，它为场景增了情感深度，引导玩家如何体验和交互世界。有效的光照可以唤起情感，从日出的温暖到黑暗森林的紧张感，使其成为世界构建的一个重要方面。\n\
  \n在 Unreal Engine 中，艺术家使用工具来控制光强、颜色和阴影，增强视觉效果和情感影响。这些工具（包括大气效果和集成光照系统）有助于创建动态、沉浸式的体验。\n\
  \n在本章中，我们将关注 Unreal Engine 中的开放世界光照，探索 `Environment Light Mixer` 和关键的 `Environment\
  \ Light Mixer`：\n\n*   `Environment Light Mixer`\n*   `Environment Light Mixer`\n\
  \n# 技术要求\n\n在开始之前，了解光照的一些关键概念和函数是非常关重要的。\n\n# Unreal Engine 中的光照\n\n在游戏开发中，光照可以转化一个平的场景。UE5\
  \ 通过其突破性的功能改变了数字创作，例如 `Lumen`（一个完全动态的全局光照系统）和 `Nanite`（一种允许前所未有的细节的虚拟几何技术）。这些新技术开启了光照的新境界。\n\
  \n在任何环境中，光照都有以下几个关键用途：\n\n*   **可见性**：确保物体可见\n*   **情绪与氛围**：建立情感基调\n*   **真实性与沉浸感**：增加场景的可信度\n\
  *   **引导观众**：将注意力引向特定元素\n\n## 光移动性\n\n**光移动性**是 Unreal Engine 中的一个关键概念，定义了光照在移动和适应方面的行为。本章探索了不同类型的的移动性，并强调了强大的\
  \ `Lumen` 系统。\n\n你可以在每个单独光的 `Details` 面板中找到并选择光移动性选项：\n\n![](img/B21600_09_01.png)\n\
  \n光移动性可分为三种主要类型：`Static`、`Stationary` 和 `Movable`。每种类型都有独特的特征和用例，影响项目的视觉质量和性能。让我们深入查看：\n\
  \n*   `Static`：它是完全预计算并集成到环境中，在游戏过程中保持不变。它对于不需要光照调整的物体和环境理想。\n*   `Stationary`：它提供了一个中间，光可以在游戏过程中更改颜色和强度，同时保持静态阴影。此选项适用于需要某些动态但不需要完全动态光照计算需求的场景。\n\
  *   `Movable`：它是完全动态的，允许光及其阴影随时间移动和演变。这种灵活性提供了增强的真实性，但需要更高的计算资源。\n\n在整个项目开发过程中，我们将专门使用\
  \ `Movable` 动态光照，它具有上述优势。\n\n\n\n\n\n由于我们的重点将保持在`Movable`（可移动）光源上，你可以参考虚幻引擎关于`Lighting`的文档来获取`Static`（静态）和`Stationary`（固定）光线的详细信息：[`dev.epicgames.com/documentation/en-us/unreal-engine/light-types-and-their-mobility-in-unreal-engine?application_version=5.5`](https://dev.epicgames.com/documentation/en-us/unreal-engine/light-types-and-their-mobility-in-unreal-engine?application_version=5.5)。\n\
  \n在使用`Movable`光源处理实时更新的同时，理解虚幻引擎如何在动态光照条件下管理全局光照同样重要。\n\nUE5 中的`动态全局光照`（DGI`）是指用于模拟实时真实光照的一系列技术，光与表面相互作用，并根据环境及其物体产生动态变化。最著名的实现方式是通过名为`Lumen`的系统。\n\
  \n## 探索 Lumen\n\nUE5 的`Lumen`系统代表了实时`全局光照`（GI`）的巨大飞跃。Lumen 提供了 DGI，允许在复杂且变化的环境中实现真实的光照，而无需大量的预计算。本节将探索\
  \ Lumen 的工作原理以及如何有效地利用它。\n\nLumen 是一个完全动态的 GI 系统，模拟光线与表面及体积的实时相互作用。与传统的烘焙 GI 解决方案不同，Lumen\
  \ 对光照条件、几何形状和材质的变化做出即响应。其主要优势包括：\n\n* **实时反馈**：环境的变化会立即反映在光照中，增强了创造力和迭代速度\n* **真实性**：准确模拟光线从表面反弹的过程，捕捉间接光照、反射和阴影的细微差别\n\
  \nLumen 利用了多种高级技术来实现其效果，包括：\n\n* **表面缓存（Surface cache）**：一个存储表面光照信息的系统，以便重复使用和动态更新，确保高效的实时性能\n\
  * **软件光线追踪（Software ray tracing）**：使用软件算法追踪光路径的方法，能够在不需要硬件射线追踪的情况下实现高质量反射和间接光照\n\
  * **场景表示（Scene representation）**：场景几何形状和材质的动态表示，允许 Lumen 在场景变化时准确计算光线交互\n\nLumen\
  \ 在以下方面表现尤为强大：\n\n* **开放世界环境**：提供动态昼夜循环和真实的环境光照，而无需大量的预烘焙\n* **室内场景**：在光照和阴影频繁变化的室内环境中实现详细且真实的光照\n\
  * **交互式体验**：通过实时光照调整增强 VR 和 AR 应用，以响应用户交互和环境变化\n\nLumen 之所以成为场景照明的最佳选择，是因为它的实时能力、高视觉保真度、易用性、性能效率、跨平台通用性、通过\
  \ Nanite 与高细节环境的兼容性，以及它提供的增强创作自由。\n\n在理解了 Lumen 的核心概念后，让我们看看虚幻引擎提供了哪些工具来照亮我们的项目，例如`Environment\
  \ Light Mixer`。\n\n## 使用 Environment Light Mixer\n\n`Environment Light Mixer`是一个编辑器窗口，允许你创建和修改关卡的环境光照组件，包括天空、云层、大气光和天空光。对于设计师和艺术家来说，这个工具提供了一个集中位置，可以高效地编辑这些组件，并提供了调整访问所需属性细节程度的灵活性。\n\
  \n你可以在主工具栏的`Window`（窗口）下拉菜单下找到`Env. Light Mixer`窗口，如图 9.2 所示：\n\n![Figure 9.2 –\
  \ Env. Light Mixer location](img/B21600_09_02.png)\n\n图 9.2 – Env. Light Mixer 位置\n\
  \n一旦打开`Env. Light Mixer`窗口，我们将看到一个不包含任何额外信息的窗口（仅在我们从新的空关卡开始时）：\n\n![Figure 9.3 –\
  \ The Environment Light Mixer, where you can directly and easily add all the Actors\
  \ needed to set your environment’s light system](img/B21600_09_03.png)\n\n图 9.3\
  \ – 可以直接且方便地添加设置环境光照系统所需的所有 Actor\n\n窗口顶部的按钮允许我们添加在项目中创建基础光照方案所需的各种 Actor。一旦添加，我们就可以从此窗口直接控制它们的所有属性，管理和调整负责光照的\
  \ Actor 变得更容易。添加后，我们的窗口看起来应该是这样的：\n\n![Figure 9.4 – The Environment Light Mixer\
  \ allows you full control over every detail of the Actors](img/B21600_09_04.png)\n\
  \n图 9.4 – Environment Light Mixer 允许你对 Actor 的每个细节进行完全控制\n\n虚幻引擎的大气 Actor 旨在模拟真实世界的光照和大气效果。通过理解现实世界的对应物，创作者可以更好地利用这些工具，在项目中实现真实且沉浸式的环境。\n\
  \n让我们看看`Env. Light Mixer`中包含了哪些 Actor：\n\n* `DirectionalLight`（方向性光）：在虚幻引擎中，此 Actor\
  \ 模拟阳光。它是一个关键光源，会均匀地影响整个场景，模拟太阳发出的平行光线。\n* `SkyAtmosphere`（天空大气）：虚幻引擎中的此 Actor 模拟光线在地球大气中的散射，产生诸如蓝天、日落以及一天中不同时间段颜色转换等效果。\n\
  * `SkyLight`（天空光）：此 Actor 捕捉来自天空的环境光并将其应用到整个场景。它模拟了来自天穹的漫射光，并影响未受太阳直接照射的区域。\n* `ExponentialHeightFog`（指数高度雾）：此\
  \ Actor 模拟密度随高度增加而增加的大气雾，创建真实的深度效果并使远处物体柔化。\n* `VolumetricCloud`（体积云）：此 Actor 生成真实的云，可以投射阴影并与光动态交互，影响场景的光照条件。\n\
  \n让我们在随后的章节中详细讨论这些 Actor。\n\n## DirectionalLight\n\n这种光类型模拟来自无限距离光源的照明，导致所有阴影都以平行方式投影。这使其成为复制阳光的完美选择。\n\
  \n### 光属性\n\n与其他 Actor 一样，你可以在这里使用所有不同的移动性（mobility），以便在需要时进行烘焙光照，或充分利用 Lumen 提供的全部\
  \ DGI 优势。这些参数可以在 Actor 的`Details`面板中调整，让你控制移动性设置和属性。\n\n让我们讨论此 Actor 最重要的属性：\n\n\
  * `Intensity`（强度）：控制`DirectionalLight`发射的总能量，直接影响场景中阳光的亮度。较高的强度将产生更亮的光照效果。\n* `Light\
  \ Color`（光色）：定义阳光的颜色。可以通过调整来模拟一天中不同的时间，例如日出或日落时的暖色调，以及中午的冷色调。\n* `Source Angle`（源角度）：以度表示光源（太阳）的角度大小。默认设置为`0.5357`，以匹配太阳的平均视觉大小。增加此值将使太阳看起来更大并使阴影变柔和。\n\
  * `Indirect Lighting Intensity`（间接光照强度）：控制`DirectionalLight`生成的间接光（反弹光）。这对于户外场景中在阴影区域创建真实的柔和光照至关重要。\n\
  \n\n\n\n\n- `Volumetric Scattering Intensity`（体积散射强度）：调整体积散射的强度，影响光通过雾气或云等大气元素的散射程度，从而增加场景的氛围深度。\n\
  - `Specular Scale`（高光比例）：乘以高光区域的强度，影响反射表面对阳光的响应，增强金属或水等材质的真实感。\n- `Contact Shadow\
  \ Length`（接触阴影长度）：定义屏幕空间光线追踪计算接触阴影的距离，物体与表面接触处产生更锐利的阴影，这对于细节户外环境尤为重要。\n- `Lighting\
  \ Channels`（光照通道）：指定 `DirectionalLight` 将影响哪些光照通道，允许更精确控制不同物体或材质对场景中阳光的响应。\n\n控制方向光最终外观的另一个重要方面与光柱（God\
  \ rays）的视觉行为有关，我们可以从 `Light Shafts` 部分进行控制。\n\n### Light Shafts（光柱）\n\n光柱也被称为 `God\
  \ rays`，我们只需在 `Details` 面板中启用该选项即可创建光柱，结合 `Volumetric Fog`，我们可以在光照中创造出有趣的视觉效果，正如\
  \ `Figure 9.5` 所示：\n\n![Figure 9.5 – Light shaft effect combined with Volumetric\
  \ Fog](img/B21600_09_05.png)\n\nFigure 9.5 – 结合体积雾的光柱效果\n\n`DirectionalLight` 的\
  \ `Details` 面板有一个有一个 `Light Shafts` 部分，如 `Figure 9.6` 所示：\n\n![Figure 9.6 – Light\
  \ Shaft details](img/B21600_09_06.png)\n\nFigure 9.6 – 光柱详情\n\n在 `DirectionalLight`\
  \ 的 `Light Shafts` 部分，我们可以根据情况和想要实现的效果尝试不同的光柱方法：`Light Shaft Occlusion`（光柱遮挡）和 `Light\
  \ Shaft Bloom`（光柱泛光）。\n\n当物体直接遮挡光源时，`Light Shaft Occlusion` 更有效；而当光源在场景中可见且我们想要增强效果时，`Light\
  \ Shaft Bloom` 则更有效。\n\n## SkyLight（天光）\n\n`SkyLight` 捕捉来自关卡远处区域（如天空或远物体）的环境光照，并利用这些信息来照亮场景。这确保了无论天空如何生成（无论是来自动态大气系统、分层云、静态天空盒还是远山景观），天空的外观（包括其光照和反射）在整个环境中保持一致。这种一致性通过将远处元素的光照与近物体融合，有助于营造场景统一的视觉效果。\n\
  \n或者，你可以手动为 `SkyLight` 分配自定义的 `Cubemap`，如 `Figure 9.7` 所示。此功能允许对光照和反射进行完全控制，让你能够使用特定图像来决定场景中环境光的行为。这在天空或背景与光照系统直接关联的情况下（例如使用预渲染的天空纹理）特别有用。\n\
  \n![Figure 9.7 – SkyLight details](img/B21600_09_07.png)\n\nFigure 9.7 – SkyLight\
  \ 详情\n\n此外，`SkyLight` 与 Lumen 无缝协作实现实时 GI（全局光照），确保光照根据环境或一天的时间动态变化，为开放世界提供高水平的真实感。\n\
  \n在接下来的节中，我们将探索如何配置 `SkyLight` 以获取我们场景整体外观的实时反馈。\n\n### Movable Sky Light（可移动天光）\n\
  \n当 `SkyLight` 设置为 `Movable` 时，它完全以实时运行，不依赖于预计算的光照数据。这意味着它可以捕捉场景中所有物体的光照和反射信息（无论其移动性如何：静态、固定或动态），并随着场景的变化动态更新光照。这对于需要实时适应光照条件的环境非常理想，例如具有不断变化天气或昼夜循环的户外开放世界。\n\
  \n### Real Time Capture（实时捕捉）\n\n`Real Time Capture` 模式提供动态和高光的环境光照，使得在场景元素带有实时反射的情况下进行动态时间时间模拟成为可能。\n\
  \n当 `SkyLight` 的移动性设置为 `Stationary` 或 `Dynamic`，且在 `SkyLight` 组件的 `Details` 面板中启用\
  \ `Real Time Capture` 时可以使用此模式。\n\n![Figure 9.8 – SkyLight Real Time Capture allows\
  \ you to see the impact of GI and reflections in real time](img/B21600_09_08-A.png)\n\
  \n![](img/B21600_09_08-B.png)\n\nFigure 9.8 – SkyLight Real Time Capture 允许你实时看到\
  \ GI 和反射的影响\n\n参与构建我们户外光照系统的最后一个 Actor 是 `SkyAtmosphere`。它与 `SkyLight` 和 `DirectionalLight`\
  \ 协同工作，生成场景中的天空穹。让我们看看它是如何工作的。\n\n## SkyAtmosphere（天空大气）\n\n虚幻引擎中的 `SkyAtmosphere`\
  \ 组件采用基于物理的渲染方法，用于创建真实的天空和大气效果。这个多功能系统可以模拟类地球大气层，允许真实的时刻转换（例如壮丽的日出和日落），以及奇异的外星大气层。它提供了一个空中视角，便于从地面到天空再到外太空的平滑过渡。\n\
  \n以下是它的核心特性：\n\n- `Dynamic sky color`（动态天空颜色）：天空颜色根据太阳的高度进行调整，特别是主方向光向量与地平线的对齐程度。这导致了太阳升起和落下时产生自然的色彩梯度。\n\
  - `Control over scattering and fuzzy settings`（散射和模糊设置的控制）：用户可以通过调整散射参数完全控制大气密度，从而实现各种场景（从晴朗天空到浓雾）的自定义视觉效果。\n\
  - `Aerial perspective`（大气透视）：该系统精确模拟了行星曲率，提供了从地面到天空的真实过渡，增强了场景的沉浸感。\n\n此外，`SkyAtmosphere`\
  \ 系统使用米氏散射（Mie Scattering）和瑞利散射（Rayleigh Scattering）技术模拟光吸收。这些效果通过准确描述光与大气中粒子和分子的相互作用，有助于一天天空色彩的变化。\n\
  \n`SkyAtmosphere` Actor 可以在 `Place Actor` 调面板/菜单的 `VISUAL EFFECTS` 标签下找到，如 `Figure\
  \ 9.9` 所示：\n\n![Figure 9.9 – SkyAtmosphere Actor location inside the VISUAL EFFECTS\
  \ tab](img/B21600_09_09.png)\n\nFigure 9.9 – SkyAtmosphere Actor 的位置\n\n现在我们知道了主要特性，让我们看看涉及过程的部分。\n\
  \n### Rayleigh Scattering（瑞利散射）\n\n在类地球大气中，`Rayleigh Scattering` 是阳光与大气中分散的小粒子相互作用产生的。高层大气的密度远低于靠近地面的低层大气。这种密度差异对光散射如何影响天空颜色起着至关重要的作用。\n\
  \n调整大气中的粒子密度会影响散射程度。情况如下：\n\n- `Decreased scattering`（减少散射）：降低粒子密度会导致散射减少，模拟出比地球稀\
  \ 10 倍的大气。这创造了一个更清晰的天空，蓝色调较少，太阳看起来更强烈。\n- `Standard scattering`（标准散射）：此水平保持与地球相似的大气密度，允许自然光散射。这种配置在白天产生了我们熟悉的蓝色天空以及真实的大气效果。\n\
  \n\n\n\n\n-   **增加散射**：提高粒子密度会增强光散射，模拟出比地球密度 10 倍的大气。这导致更深蓝色的天空和更生动的大气效果，营造出更具戏剧性的视觉体验。\n\
  \n让我们来看看这些参数位于 `SkyAtmosphere` `Details` 面板的什么位置：\n\n![Figure 9.10 – SkyAtmosphere\
  \ Rayleigh controls](img/B21600_09_10.png)\n\n图 9.10 – SkyAtmosphere 瑞利控制\n\n在`Figure\
  \ 9.11` 中，我们可以看到使用默认 `Rayleigh Scattering`（瑞利散射）值的场景，其中，由于大气的散射较低，我们可以看到天空呈现`blue`（蓝色）：\n\
  \n![Figure 9.11 – Default Rayleigh Scattering Scale](img/B21600_09_11.png)\n\n图\
  \ 9.11 – 默认瑞利散射比例\n\n在`Figure 9.12` 中，我们看到改变 `Rayleigh Scattering` 强度如何改变场景的整体色调：\n\
  \n![Figure 9.12 – Modified Rayleigh Scattering Scale](img/B21600_09_12.png)\n\n\
  图 9.12 – 修改后的瑞利散射比例\n\n### Mie 散射\n\n`Mie Scattering`（米散射）发生在光与大气中悬浮的较大粒子（如尘埃、花粉或污染物）交互时。这些粒子被称为气溶胶，可以是自然产生的，也可以是人类活动的副产品。\n\
  \n与主要涉及较小粒子的 `Rayleigh Scattering` 不同，`Mie Scattering` 往往吸收更多的光，导致天空呈现雾蒙外观。这种现象导致光主要向正前方散射，通常会在太阳等光源周围形成明亮的光晕。\n\
  \n调整气溶胶密度可以显著影响天空的清晰度和雾度。以下是不同水平的气溶胶密度如何影响散射：\n\n-   **降低气溶胶密度**：气溶胶浓度较低时，天空看起来更清晰，雾霾减少。光散射的方向性变弱，导致产生更具活力的蓝色天空。\n\
  -   **默认 散射比例**：此设置代表标准的气溶胶密度水平，提供了一种兼顾清晰度和自然大气效果的平衡视觉效果。\n-   **增加气溶胶密度**：较高的气溶胶浓度会导致天空更加被遮挡和雾化，其特征是显著的正向散射。这导致在太阳等光源周围产生更明显的光晕，增强了大气效果。\n\
  \n我们可以在 `Details` 面板的 `Atmosphere - Mie` 选项卡中找到这些参数，如 `Figure 9.13` 所示：\n\n![Figure\
  \ 9.13 – Atmosphere Mie and Mie Scattering controls](img/B21600_09_13.png)\n\n图\
  \ 9.13 – 大气 Mie 和米散射控制\n\n项目中的默认值应该带给我们像 `Figure 9.14` 中的那结果：\n\n![Figure 9.14 –\
  \ Default Mie Scattering Scale](img/B21600_09_14.png)\n\n图 9.14 – 默认米散射比例\n\n在`Figure\
  \ 9.14` 中，我们可以看到 `SkyAtmosphere` 中 `Mie Scattering` 的默认行为。我们可以看到环境的深度，并看到光源是如何直接照射场景中树木的。\n\
  \n如果我们增加该值，就可以看到它对场景整体外观以及光照的影响：\n\n![Figure 9.15 – Modified Mie Scattering Scale](img/B21600_09_15.png)\n\
  \n图 9.15 – 修改后的米散射比例\n\n在`Figure 9.15` 中，我们看到具有高 `Mie Scattering` 值的相同场景。环境中有一种雾气的感觉，我们看到大气效果在场景中占据了中心位置。此外，之前到达树木的光现在不再影响环境了。\n\
  \n### 艺术导向\n\n`SkyAtmosphere` 组件提供了艺术控制，允许你自定义项目天空和大气的外观，以适应你的创意愿景。\n\n主要的控制通过 `Color\
  \ Picker`（颜色选择器）工具实现，它允许我们根据所需的色调和饱和度为天空染色。这种调整是在 `SkyAtmosphere` 当前设置的基础上应用的。\n\
  \n在`Figure 9.16` 中，我们可以看到使用 `Art Direction` 选项卡中的 `Color Picker` 工具对天空产生的颜色效果：\n\
  \n![Figure 9.16 – Art Direction inside the SkyAtmosphere Actor](img/B21600_09_16.jpg)\n\
  \n图 9.16 – SkyAtmosphere 实例内部的艺术导向\n\n此部分允许我们调整场景的整体外观，从修改天空颜色到控制其对环境的视觉贡献。这些调整旨在创建模拟不同于地球的大气效果，例如外星或奇幻环境。\n\
  \n### 从太空观测的行星大气\n\n除了从行星表面创建令人惊叹的大气外，虚幻幻引擎中的 `SkyAtmosphere` 系统还允许设计从太空观察的行星大气。此功能允许从行星表面穿过大气层进入外层太空的无缝过渡，而不需要复杂的配置或额外的设置。这创造了极具沉浸感的体验，对于太空模拟或涉及行星探索的游戏特别有用。\n\
  \n`Figure 9.17` 展示了从太空观察行星大气的示例：\n\n![Figure 9.17 – Planetary atmospheres](img/B21600_09_17.png)\n\
  \n图 9.17 – 行星大气\n\n要为特定行星配置 `SkyAtmosphere`，你可以在 `Details` 面板中找到相关参数。在这里，你可以调整行星半径、大气层以及控制大气行为和外观的重要变量，如\
  \ `Figure 9.18` 所示：\n\n![Figure 9.18 – Skyosphere details](img/B21600_09_18.png)\n\
  \n图 9.18 – 大气细节\n\n到为止我们讨论了由 `SkyAtmosphere` 生成的雾。现在我们将探索一个名为 `ExponentialHeightFog`\
  \ 的不同 Actor，它模拟区域内的雾聚集。\n\n## ExponentialHeightFog\n\n`ExponentialHeightFog` 为地图的较低区域增加密度，并随着海拔的增加而减少，具有平滑的梯度。这种雾系统还提供两种不同的颜色：一个面向方向性光（如果没有则朝上），另一个面向反半球。\n\
  \n`Figure 9.19` 说明了场景内 `ExponentialHeightFog` 的深度和分布：\n\n（注：此处原文未对应图片路径或描述）\n\n\
  这种效果通常是细微的，但当我们与没有 `ExponentialHeightFog` 的图像进行对比时，我们在 `Figure 9.20` 中看到场景失去了对比度：\n\
  \n与 `SkyAtmosphere` 一样，`ExponentialHeightFog` 可以在 `Place Actor` 菜单的 `Visual Effects`\
  \ 类别中找到，如 `Figure 9.21` 所示：\n\n![Figure 9.21 – ExponentialHeightFog location](img/B21600_09_21.png)\n\
  \n图 9.21 – ExponentialHeightFog 位置\n\n这里是你将能够使用的一些属性：\n\n-   **Fog Density (雾密度)**：控制雾的整体密度，决定其在整个场景中的厚度。\n\
  -   **Fog Inscattering Color (雾散射颜色)**：定义雾的主要颜色，影响光在雾中的散射方式。\n-   **Start Distance\
  \ (起始距离)**：设置相机到雾开始开始显示的距离。\n-   **Volumetric Fog (体积雾)**：启用 `Volumetric Fog`，提供更真实的雾模拟。该模拟的解析可以通过\
  \ `Scalability Settings`（扩展设置）进行调整。\n-   **Extinction Scale (消光比例)**：修改 `Volumetric\
  \ Fog` 中雾粒子吸收的光量。较高的值会通过增加光吸收使雾变得不透明。\n\n\n\n\n\n- **使用雾光散射颜色覆盖光照颜色**：启用后，`Fog Inscattering\
  \ Color` 将替换 `SkyLight` 的 `Volumetric Scattering Color` 以及 `DirectionalLight` 的\
  \ `Directional Inscattering Color`。为了获得最佳效果，请确保在 `DirectionalLight` 上激活了 `Atmosphere\
  \ Sun Light`。然而，请注意，这可能会产生非物理的体积光照，且可能与其他表面的光照不匹配。\n\n使用 `ExponentialHeightFog`\
  \ 的性能开销与使用两层恒定密度雾相当，但它针对 `Start Distance` 进行了优化。通过设置起始距离，可以排除观察者正前方区域的雾气，从而通过 Z\
  \ 缓冲区进行像素剔除来提高性能。\n\n由于我们正在讨论如 `ExponentialHeightFog` 等大气效果，因此涵盖虚幻引擎大气工具包中的另一个关键组件\
  \ `VolumetricCloud` 也是非常重要的。\n\n## VolumetricCloud（体积云）\n\n虚幻引擎中的 `VolumetricCloud`\
  \ 组件提供了一个基于物理的云渲染系统，采用了材质驱动的方法。这使得艺术家和设计师能够为他们的项目创建各种云的形态。云系统具有很高的动态性，支持实时的昼夜过渡，并在实时捕捉模式下与\
  \ `SkyAtmosphere` 和 `SkyLight` 组件无缝集成。它的可扩展性确保了它能够适应各种项目需求，无论是从地面、空中观察，还是从表面向外太空的过渡。\n\
  \n我们可以从 `PLACE ACTORS` | `Visual Effects` | `VolumetricCloud` 面板添加 `VolumetricCloud`，正如*图\
  \ 9.22* 所示：\n\n![Figure 9.22 – VolumetricCloud Actor](img/B21600_09_22.png)\n\n\
  图 9.22 – VolumetricCloud Actor\n\nActor 的覆盖范围取决于项目的需求；我们可以从大气层内部和外部获得极佳的细节，正如我们在\
  \ `Epic Games` 的这张体积云图片中看到的那样（在*方向性光的交互与阴影* 章节中）：[`dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-clouds?application_version=4.27`](https://dev.epicgames.com/documentation/en-us/unreal-engine/volumetric-clouds?application_version=4.27)。\n\
  \n`VolumetricCloud` 的一个关键特性是阻挡光线并在下方表面投射真实的阴影。云的遮挡和阴影主要由大气光和用于表示云的体积材质控制。这些设置允许您自定义各种云的行为，例如创建光柱和模拟云团内部的自阴影效果。\n\
  \n虚幻引擎内部的动态光照系统不仅限于 `Lumen`；它还包含了另外两种能够实现完全动态实时光照设置的技术：虚拟阴影映射（Virtual Shadow Maps）和\
  \ Nanite。\n\n# 使用虚拟阴影映射、Nanite 和 Lumen 增强实时渲染\n\nUE5 引入了突破性的技术，提升了 3D 环境的真实感和性能。本节探索了这些关键创新之一——虚拟阴影映射和\
  \ `Nanite` 以及它们与 `Lumen` 全局光照系统的相互作用。这些技术共同使创作者能够实时实现前所未有的细节和动态光照。\n\n虚拟阴影映射 (`VSMs`)\
  \ 代表了 UE5 中阴影渲染的新方法，旨在提高阴影质量和性能。从概念上说，VSM 本质上是非常高分辨率的阴影映射，目前采用 16k x 16k 像素的虚拟分辨率实现。为了进一步增强方向光的分分辨率，VSM\
  \ 使用了裁剪映射（clipmaps）。\n\n您可以在 `Project Settings` | `Rendering` | `Shadows` | `Shadow\
  \ Map Method` 中找到 `Virtual Shadow Maps` 配置选项，正如*图 9.23* 所示：\n\n![Figure 9.23 – VSM\
  \ options in Project Settings](img/B21600_09_23.png)\n\n图 9.23 – 项目设置中的 VSM \n\n\
  传统的阴影映射往往面临锯齿、低分辨率和性能开销等问题。VSM 通过一种复杂的方法解决了这些挑战，将阴影映射分为 128 x 128 像素的瓦片（或页面）。只有在根据深度缓冲区分析需要为屏幕像素着色时，才会分配并渲染页面。这种高效的系统允许页面在帧之间进行缓存，进一步提高性能，除非被移动物体或光源使其失效。\n\
  \nUE5 中的实时渲染需要在视觉保真度和性能之间取得平衡。`Nanite`、`Lumen` 和 `SMVs` 的结合为在不牺牲性能的情况下实现高质量视觉效果提供了强大的解决方案。本节探索了为什么在实时工作中一起使用这些技术是一种良好的做法，以及它们如何增强整个渲染流水线。\n\
  \n当一起使用时，`Nanite`、`Lumen` 和 VSM 会显著增强场景的视觉保真度。`Nanite` 为几何形状提供了复杂的细节，`Lumen` 确保了动态且真实的光照，而\
  \ VSM 则提供了高质量的阴影。这种组合使得环境在视觉上令人惊叹且具有沉浸感。\n\n在*图 9.24* 中，我们可以看到 `Project Settings`\
  \ | `Rendering` | `Hardware Ray Tracing` | `Ray Traced Shadows` 下的 `Ray Traced Shadows`\
  \ 选项：\n\n![Figure 9.24 – Project Settings | Ray Traced Shadows](img/B21600_09_24.png)\n\
  \n图 9.24 – 项目设置 | 光线阴影\n\n在*图 9.25* 中，我们可以看到一个包含带有 `Nanite` 接收光线阴影的网格和几何体的场景。注意的是，可以看到一些伪影，这是由于\
  \ `Nanite` 使用备用网格（Fallback）在场景上投影阴影导致的。\n\n这种现象强调了理解 `Nanite` 如何与其他技术（特别是光线追踪）交互的重要性。虽然\
  \ `Nanite` 允许极其复杂的几何结构，但投影阴影系统是必要的。这会导致视觉差异，特别是在阴影细节对整体真实感至关重要的复杂场景中。\n\n![Figure\
  \ 9.25 – Ray Traced Shadows](img/B21600_09_25.png)\n\n图 9.25 – 开启光线阴影\n\n另一方面，如果我们保持使用\
  \ `Lumen`、VSM 和 `Nanite` 等技术的一致性，结果的质量将非常显著，正如*图 9.26* 所示：\n\n![Figure 9.26 – Ray\
  \ Traced Shadows](img/B21600_09_26.png)\n\n图 9.26 – 关闭光线阴影\n\n\n\n\n在 UE5 中结合使用\
  \ Nanite、Lumen 和 VSMs 是实现高质量、实时渲染的最佳实践。这些技术互为补充，增强了视觉保真度，优化了性能，并使开发过程更加顺畅。通过利用它们的优势，你可以创建详尽、沉浸式且响应迅速的环境，推向实时\
  \ 3D 渲染的边界。\n\n接下来的章节将深入探讨特定的用例和高级技术，以最大限度地发挥这些强大工具的潜力。特别是，关于优化场景光照和性能测试的深度讨论，你可以参考\
  \ 第 12 章。\n\n# 总结\n\n在本章中，我们探索了虚幻引擎提供的各种用于户外环境的光照工具。通过组合这些 Actor——`DirectionalLight`、`SkyLight`、`SkyAtmosphere`、`ExponentialHeightFog`\
  \ 和 `VolumetricCloud`（注：应为体积云），可以创建不同类型的光照。实现所需效果的方法并没有一种，因此我鼓励你进行实验并探索不同的组合，以获得多种结果。\n\
  \n在下一章中，我们将讨论名为 `Post Process Volume`（后处理体积）的 Actor 及其在决定场景最终外观方面的重要性。\n\n# 订阅 Game\
