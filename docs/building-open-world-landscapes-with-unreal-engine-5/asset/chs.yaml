  \ |\n\n# 3. 导入与静态网格\n\n在开放世界游戏中，成千上万的静态网格组城市、植被和道具。本章重点关注如何在 `Unreal Engine 5` (`UE5`)\
  \ 中导入并优化这些网格，以提升性能和视觉保真度。\n\n静态网格是游戏开发中环境和物体设计的核心。该过程从深入研究如何将静态网格导入虚幻引擎开始。这一步不仅仅是文件传输；它需要一种策略性的方法，以确保这些资产经过性能优化、满足技术要求，并且没有常见的导入相关问题。\n\
  \n在处理导入过程后，章节将转向优化技术。这里的重点是平衡性能与视觉保真度，这是游戏开发中的关键考虑因素。对`细节级别` (`LOD`) 设置、网格简化和高效\
  \ UV 映射的高级探索，将为在保持审美质量的同时增强这些网格的性能提供实用见解。\n\n本章的最后一部分涵盖了材质在静态网格上的应用和调整。这部分涵盖了基础应用，重点关注将这些物体真实地整合到虚拟环境中的技术。关于材质分配的讨论将探索纹理、着色器和光照如何协同工作以创建具有视觉吸引力的资产。\n\
  \n本章还包含了一些实操练习，旨在强化所涵盖的概念并提供操作经验。这些练习对于巩固你的理解并将理论知识应用于现实世界的场景至关重要。\n\n当我们深入研究这些主题时，必须意识到，在虚幻引擎中导入和优化静态网格的每一个方面，对于创建复杂、详细且高性能的游戏环境都是基础性的。你在这里学习的技能和技术将对你作为游戏创造者的开发道路产生帮助，使你能够有效地将想象中的世界变为现实。\n\
  \n将涵盖的关键主题包括：\n\n*   理解不同的网格格式及其影响\n*   导入前文件准备的最佳实践\n*   导入静态网格\n*   材质分配与调整\n\
  *   网格优化技术\n*   练习 3.1：导入我们的第一个静态网格\n*   练习 3.2：导入 FBX 作为骨骼网格\n\n# 技术要求\n\n为了继续本章的开发，必须有一台安装了\
  \ `Unreal Engine 5.5`（或更高版本）的 PC，且需要符合 EPIC Games 推荐的要求并接入互联网：[`dev.epicgames.com/documentation/en-us/unreal-engine/hardware-and-software-specifications-for-unreal-engine`](https://dev.epicgames.com/documentation/en-us/unreal-engine/hardware-and-software-specifications-for-unreal-engine)。\n\
  \n# 理解不同的网格格式及其影响\n\n在虚幻引擎中创建和填充虚拟环境的复杂过程中，初始的关键步骤之一是选择合适的静态网格格式。静态网格作为游戏环境中代表物体和结构的\
  \ 3D 模型，有多种文件格式。每种格式都有其自身的特性，会显著影响游戏的性能以及资产在虚幻引擎生态系统中的兼容性。\n\n## 虚幻引擎中常用的静态网格格式\n\
  \n虚幻引擎允许处理各种格式的 3D 模型。理解这些格式对于确保你的项目兼容性和性能至关重要。我们将讨论流行的格式，如 `FBX`、`OBJ`、`USD` 和\
  \ `GLTF`，以及其他支持的格式如 `STL` 和 `COLLADA`。这些知识将帮助你在虚幻引擎中导入和管理 3D 资产时做出明智的决定。让我们详细查看这些每一个格式：\n\
  \n*   `FBX (Filmbox Format)`：`FBX` 通常是虚幻引擎的首选，它是一种多功能格式，支持广泛范围的功能，包括 3D 模型、动画和纹理。它处理复杂资产的能力使其成为详细游戏环境的理想选择。\n\
  *   `OBJ (Object File)`：`OBJ` 格式以简单著称，广泛用于不需要动画的静态网格。其直截了当使其使其于使用，尽管缺乏 `FBX` 中的一些高级功能，如骨骼、蒙皮信息、动画、一个文件中的多个动画片段、曲线甚至嵌入的纹理文件。\n\
  *   `USD (Universal Scene Description)`：对于需要复杂的场景管理和协作工作流的项目，`USD` 在游戏开发中变得越来越重要。它促进了无缝资产共享、非破坏性编辑和分层管理，使其在虚幻引擎中处理复杂资产时非常有价值。虽然功能强大，但其实时渲染性能应与\
  \ `FBX` 或 `OBJ` 等格式进行比较。\n*   `GLTF (Graphics Library Transmission Format)`：`GLTF`\
  \ 因其轻量高效的格式而受欢迎，是开放世界游戏开发的理想选择。其紧凑的大小和快速加载速度对性能至关重要。`GLTF` 支持 PBR 工作流，与虚幻引擎的渲染能力良好，并与流行的\
  \ 3D 建模工具无缝集成。应评估其在大规模环境中的性能以确保满足特定的项目需求。\n*   `GLB (Binary GLTF)`：`GLB` 是 `GLTF`\
  \ 格式的二进制版本，将所有资产（几何、材质和纹理）合并到一个文件中。它高效且减少了处理多个文件的复杂性。`GLB` 具有与 `GLTF` 相同的优势，如支持\
  \ PBR 工作流和快速加载速度，使其成为虚幻引擎中实时应用的理想选择。\n\n\n\n\n\n*   **其他格式**：虚 Engine 还支持其他格式，如\
  \ `STL`（立体轮廓法）和 `COLLADA`（协作设计活动）。这些格式都有特定的使用场景，例如 `STL` 用于 3D 打印模型，而 `COLLADA`\
  \ 则作为多种 3D 应用的交换文件格式。\n\n正如你在 Unreal Engine 中看到的，你可以处理多种格式，甚至将它们全部放在同一个项目和关卡中。让我们来看看在为\
  \ 3D 模型选择格式时需要考虑的一些优势。\n\n## 格式选择的重要性\n\n格式的选择会在以下几个方面直接影响开发工作流和最终输出：\n\n*   **性能**：某些格式在处理数据复杂度方面比其他格式更高效。例如，支持\
  \ `LOD` 的 `FBX`、`OBJ` 和 `GLTF` 等格式可以极大优化游戏内的渲染性能。\n*   **兼容性**：某些格式与 Unreal Engine\
  \ 的集成更加无缝，确保了更平滑的导入过程、更好的资产管理以及更少的兼容性问题。在处理复杂场景或集成来自各种来源的资产时，这一点至关重要。\n*   **功能支持**：根据格式的不同，动画、光照效果和纹理映射等特定功能的支持程度可能不同。选择在这些功能上与项目需求一致的格式，对于实现预期的视觉和交互效果至关重要。\n\
  *   **工作流效率**：某些格式更有利于迭代工作流，允许轻松的更新和修改——例如，`FBX` 和 `OBJ` 可以重新导入，并保持与之前文件相同的属性。这将显著影响开发速度和灵活性，特别是在具有动态需求的大项目中。\n\
  \n总而言，理解每种静态网格（Static Mesh）格式的区别和影响，对于任何在 Unreal Engine 中工作的开发者来说都是必不可少的。这些知识不仅确保了\
  \ 3D 模型高效有效地集成到游戏环境中，而且在优化性能和保持平稳开发过程方面起着关键作用。当我们深入研究导入静态网格的细节时，记住这些考虑因素将是整合的关键。\n\
  \n## 选择正确的格式\n\n在 Unreal Engine 中构建开放世界环境时，为静态网格选择合适的格式是一项显著影响游戏世界质量和性能的决策。正确的选择取决于资产视觉保真度与其渲染效率之间的平衡，特别是在广阔且细节丰富的开放世界设置中。\n\
  \n以下是选择正确格式的各种策略快照：\n\n*   **模型复杂度**：对于高度详细的模型（如主角色），由于具有动画和复杂纹理等高级功能，`FBX` 是首选。较简单的资产可以由\
  \ `OBJ` 等格式高效处理。\n*   **动画**：当需要动画或骨骼绑定时，`FBX` 仍然是首选格式，而 `ALEMBIC` (`ABC`) 是复杂动画的有用替代方案。\n\
  *   **开放世界游戏**：管理 `LOD` 设置对于开放世界游戏至关重要，`FBX` 支持不同的网格分辨率以优化渲染性能，而 `OBJ` 需要手动设置。\n\
  *   **纹理和材质兼容性**：纹理和材质的兼容性也很重要，`FBX` 在嵌入这些元素方面表现出色，`GLTF`/`GLB` 正成为一种高效的替代方案。\n\
  *   **项目规模**：对于大型项目，`FBX` 因其易于管理和广泛接受而青青，而简单的项目可能会使用 `OBJ` 或 `COLLADA`（导出为 `.dae`\
  \ 文件）。\n\n在 Unreal Engine 中使用静态网格构建环境时，选择正确的选格式是保持高效流水线的关键。`FBX` 是支持最广泛且功能最丰富的格式，提供了几何形状、层次结构、碰撞和自定义光照贴\
  \ UV 的可靠导入，使其成为大多数 Unreal Engine 工作流的默认选择。\n\n当需求不同时，请根据用例考虑替代方案。`OBJ` 是一种更简单的替代方案，适用于静态、非动画网格（材质直接在引擎中分配），对轻量级道具或快速迭代很有用。`GLTF`（以及\
  \ `GLB`）由于其紧凑的大小以及嵌入几何和纹理的能力，在实时或基于 Web 的管道中越来越流行，尽管材质兼容性可能有所不同。由 Pixar 开发的 `USD`\
  \ 为大规模协作流水线提供了强力的、无破坏的解决方案，特别是在涉及多个 DCC 工具时。\n\n虽然所有这些格式都可以用于将静态网格引入 Unreal，但你的选择应该符合项目范围、团队工作流和性能需求。`FBX`\
  \ 在大多数情况下都将是你的首选格式，但探索其他格式可以帮助根据特定的生产需求定制你的流水线。\n\n### 注意事项\n\n虽然我们列出了 Unreal Engine\
  \ 中静态网格格式的建议作为通用指南，但开发者和艺术家对每个项目进行单独评估是*至关重要的*。你项目的特定需求（如资产复杂性和性能目标）应该驱动格式的选择。记住，这些指南只是起点，将它们调整以适应你游戏的独特需求对于在视觉质量和性能之间实现最佳平衡至关重要。\n\
  \n# 导入前的文件准备最佳实践\n\n3D 模型从创建到集成到游戏引擎的转换是游戏开发中的关键阶段。本节深入探讨了必要的导入前关键过程，确保模型不仅视觉上吸引人，而且在\
  \ Unreal Engine 中经过了性能优化。重点领域包括优化网格拓扑、高效的 UV 展开以及纹理烘焙（texture baking）过程。\n\n## 优化网格拓扑：确保几何形状高效\n\
  \n网格拓扑是 3D 模型的基础结构，对于在游戏环境中平衡视觉质量和性能至关重要。优化拓扑涉及精炼模型的几何形状以减少计算负载，同时保持其审美完整性。这一过程对于确保模型不仅好看，而且运行高效至关重要，特别是在资源密集型场景下。\n\
  \n在现代游戏中，优化的网格拓扑在支持性能模式（更高的 FPS）和质量模式等配置选项方面起着关键作用。通过简化网格结构，开发者使能够在各种硬件上实现更流畅的游戏体验。在性能模式下，经过良好优化的网格减少了处理需求，从而获得更高的帧率。在质量模式下，高效的几何形状允许在不大幅牺牲性能的情况下增强视觉细节。这种灵活性确保了玩家可以在高性能和卓越的视觉保真度之间进行选择，满足多样化的偏好和硬件能力。\n\
  \n## UV 展开：为纹理化奠基础\n\nUV 展开是将 3D 模型表面映射到 2D 纹理空间的过程。这一步对于准确高效地为模型贴图至关重要，因为它决定了纹理如何包裹在\
  \ 3D 几何上。\n\n## 纹理烘焙：捕捉细节和真实感\n\n纹理烘焙是一种强大的技术，用于捕捉高多形模型的复杂细节并将其打印到纹理上，供低变形模型使用。这一过程是创建详细且对性能友好的资产的基石。\n\
  \n\n\n\n\n通过严格遵循这些最佳实践，开发者可以确保他们的静态网格（Static Meshes）不仅在视觉上令人印象深刻，而且针对 Unreal Engine\
  \ 中实时游戏渲染的严苛环境进行了优化。这种准备是实现无缝且高效的游戏体验的基础。\n\n# 导入静态网格\n\n此过程涉及将 3D 模型从外部软件传输到引擎中，同时确保其属性得到保持并正确配置，以实现最佳性能和视觉保真度。\n\
  \n## 导入静态网格的步骤指南\n\n让我们详细查看将资源导入 Unreal Engine 的过程。\n\n1. **导航到内容浏览器 (Content Browser)**：你可以在\
  \ Unreal Engine 界面的底部看到它。如果没有看到，可以前往 `Menu`（菜单）窗口查找 `Content Browser`。你也可以尝试使用键盘快捷键\
  \ `Ctrl` + `Space bar`。\n\n    1. **访问内容浏览器**：首先，在 Unreal Engine 中访问 `Content Browser`。这是管理所有游戏资产（包括静态网格）的枢纽。![图\
  \ 3.1 – 内容浏览器](img/B21600_03_001.png)\n\n    图 3.1 – 内容浏览器\n\n    1. **创建资产文件夹**：在导入之前，通过在\
  \ `Content Browser` 中创建适当的文件夹来组织你的项目。这一步骤有助于高效管理资产并避免混乱。\n\n2. **导入网格**：\n\n   \
  \ 1. **选择文件**：有几种方法可以导入你的资产：\n\n        1. 使用 `Content Browser` 中的 `Import` 按钮导航到你的静态网格文件位置。![图\
  \ 3.2 – 导入选项](img/B21600_03_002.png)\n\n    图 3.2 – 导入选项\n\n        1. 直接将文件拖入到目标文件夹。\n\
  \n        2. 选择上方编辑器菜单上的 `File` 选项卡并选择 `Import Into Level…`（导入到关卡……）。![图 3.3 – 导入选项](img/B21600_03_003.png)\n\
  \n    图 3.3 – 导入选项\n\n        1. 在 `Content Browser` 中进入目标文件夹，右键点击并选择 `Import to\
  \ Current Folder`（导入到当前文件夹）。![图 3.4 – 导入选项](img/B21600_03_004.png)\n\n    图 3.4\
  \ – 导入选项\n\n        1. **配置导入设置**：将弹出一个框，提供各种导入选项。在这里调整比例（scale）等设置，比例必须与你在 3D 建模软件中使用的匹配，以保持游戏环境的一致性。\n\
  \n3. **调整导入设置**：\n\n    1. **法线和切线**：配置 Unreal Engine 如何解释法线和切线。此设置对于确保网格上的光照和阴影符合预期至关重要。\n\
  \n    2. **材质导入选项**：决定是否与网格一起导入材质和纹理。如果网格使用了在 Unreal Engine 中创建的材质，取消勾选此选项以防止材质重复。\n\
  \n让我们以导入 FBX 文件为例，看看是如何应用这些考虑因素。\n\n## 理解导入选项中的主要参数\n\n每种格式都有独特的 `Import Options`（导入选项）窗口或向导，我们将介绍对应\
  \ FBX 格式的最常用的一个。\n\n### 网格与变换 (Mesh and Transform)\n\n虽然我们在这里不会描述每一个选项，但理解每个部分的主要参数是非常重要的。\n\
  \n*图 3.5* 显示了 FBX 格式的导入选项：\n\n![图 3.5 – FBX 导入选项](img/B21600_03_005.png)\n\n图 3.5\
  \ – FBX 导入选项\n\n当你第一次向项目导入任何 FBX 时，将可以使用默认值。你可以根据导入的 FBX 的特定需求修改这些值。在 `FBX Import\
  \ Options` 对话框中使用的这些值会被保存供以后使用——即使关闭了 Unreal Engine，下次启动引擎时也可以使用它们。或者，你可以使用右上角的\
  \ `Reset to Default`（重置默认）按钮恢复所有默认值。\n\n### 静态网格与骨骼网格 (Static Mesh versus Skeletal\
  \ Mesh)\n\n如果 FBX 包含一个或多个动画，它应该有一个骨骼，因此 `Skeletal Mesh`（骨骼网格）和 `Import Mesh`（导入网格）选项将被勾选。如果你不想导入骨骼或任何动画，应该取消勾选\
  \ `Skeletal Mesh` 复选框，你会看到所有与动画相关的参数都会消失，如*图 3.5* 所示。\n\n相反，如果你想导入带有动画的 FBX，请保持\
  \ `Skeletal Mesh` 选项勾选。在这种情况下，你可能会处于这种情况：\n\n* **导入网格（或预览网格）、骨骼和动画**：这通常是你想要导入要工作的网格的起点，你没有适用于该特定网格的现有骨骼，而且还想导入新动画。在这种情况下，你应该具备以下设置：\n\
  \n    * `Skeletal Mesh`: 勾选\n    * `Import Mesh`: 勾选\n    * `Skeleton`: 无\n    *\
  \ 在 `Animation` 区域下：`Import Animations` 勾选\n\n* **导入网格（或预览网格）和动画并从项目中选择骨骼**：这是一个常见的情况，你正在使用通用骨骼（如\
  \ MetaHuman 骨骼、模型人或游戏中的任何其他角色或道具），并想为它导入新的皮肤和动画。需要以下设置：\n\n    * `Skeletal Mesh`:\
  \ 勾选\n    * `Import Mesh`: 勾选\n    * `Skeleton`: 从项目中选择你的角色或道具骨骼\n\n* **从项目选择骨骼并导入网格（或预览网格）和动画**：你可能处于这种情况，你拥有了资产所需的所有网格及其骨骼，只需要导入新动画。设置如下：\n\
  \n    * `Skeletal Mesh`: 勾选\n    * `Import Mesh`: 取消勾选\n    * `Skeleton`: 从项目中选择你的角色或道具骨骼\n\
  \    * 在 `Animation` 区域下：`Import Animations` 勾选\n\n**注意**：在导入动画时，为 Unreal Engine\
  \ 指定骨骼网格的参考帧。。可以通过 `Import Options` 菜单的 `Advanced`（高级）下拉菜单启用 `Use T0 As Ref Pose`\
  \ ，避免导入资产后出现警告，如*图 3.6* 所示。\n\n![图 3.6 – Advanced 导入选项](img/B21600_03_006.png)\n\
  \n图 3.6 – Advanced 导入选项\n\n**注意**：在导入资产时，你可能会在 `Message Log`（消息日志）中看到警告（参见*图 3.7*）。当编辑器检测到资产问题时，会显示影响文件的警告。要继续使用导入的资产，只需点击窗口底部的\
  \ `CLEAR`（清除）按钮并关闭它。\n\n![图 3.7 – 消息日志](img/B21600_03_007.png)\n\n图 3.7 – 消息日志\n\
  \n#### 碰撞 (Collision)\n\n对于静态网格，如之前所述，取消勾选 `Skeletal Mesh` 选项。之后，你需要决定是否为你的网格选择\
  \ `Build Nanite`（构建 Nanite），或者在 FBX 文件不包含碰撞体的情况下选择 `Generate Missing Collision`（生成缺失碰撞）。如果你要在\
  \ DCC 工具中创建简化的碰撞几何体，你可以在使用以下碰撞语法命名几何体时导入这些碰撞，参考 Unreal Engine 文档：\n\n* `UBX_[RenderMeshName]##`:\
  \ 盒子必须使用标准的 3D 长方体对象创建。你不能移动顶点或进行任何使其偏离长方体的变形，否则它将无法正常工作。不要更改顶点或形状，因为它需要保持为长方体才能正常工作。\n\
  \n* `UCP_[RenderMeshName]##`: 胶囊必须是带有半球形顶部的圆柱体对象。它不需要许多分段（8 段是一个很好的数字），因为它会被转换为真正的胶囊用于碰撞。像盒子一样，你不应该移动单个顶点。\n\
  \n\n\n\n\n* `USP_[RenderMeshName]_##`: 球体不需要太多的分段（8 段是一个不错的数字），因为它会被转换为真正的球体以进行碰撞检测。像箱体一样，你不应该移动单个顶点。\n\
  * `UCX_[RenderMeshName]_##`: 凸物体可以是任何完全封闭的凸 3D 形状。例如，箱体也可以被视为凸物体。\n\n## 优化与 LOD\n\
  \n我们将在优化章节中详细讨论 LOD，但在导入过程中，理解几个简单的步骤对你来说非常重要。我们已经讨论过`细节水平`（Level of Detail）或 `LOD`，如果这是你第一次使用\
  \ Unreal Engine，了解它在引擎中如何运作对你非常有帮助。\n\nUnreal Engine 中的 LOD 是一种通过根据 3D 模型距离摄像机的远调整其复杂度来优化游戏性能的技术。本质上，它涉及创建一个模型的多个版本，每个版本都有不同的\
  \ LOD。最详细的版本（`LOD0`）在物体靠近相机时使用，以确保最高的视觉质量。随着物体移远，引擎会切换到细节较低的版本（`LOD1`、`LOD2` 等），这些版本的多边形较少，渲染所需的处理能力也更低。这种切换根据引擎内部设置的距离阈值自动发生。\n\
  \n这种系统在大型开放世界游戏中特别有利，因为在这些游戏中，同时渲染大量高细节物体会消耗游戏性能。通过对远处的物体使用更简单的模型（它们在屏幕上看起来较小，因此不需要那么多细节），Unreal\
  \ Engine 可以显著减少计算负载，从而带来更流畅的游戏体验。此外，Unreal Engine 提供了用于手动创建 LOD 和自动生成 LOD 的工具，为开发者针对不同观察距离优化模型的方法提供了灵活性。LOD\
  \ 结合纹理流送和多级缓冲（mipmaps）等技术，确保了游戏在高效运行的同时不会损害视觉体验。\n\n在 Unreal Engine 中，`LOD Groups`\
  \ 是预设设置，根据 3D 模型的典型用途对其进行分类，并相应地优化其 LOD 配置。每个 `LOD Group`（例如 `Character` 或 `Vehicle`）都带有默认设置，决定了模型应该有多少个\
  \ LOD 级别以及在哪些距离进行切换。该系统简化了 LOD 设置过程，允许开发者快速为不同类型的物体应用适当 LOD 设置。通过使用 `LOD Groups`，开发者可以确保游戏中各种模型具有一致且最优的\
  \ LOD 行为，在保持视觉保真的同时提升性能。\n\n正如你看到的，在 `FBX Import Options` 窗口中，有一个名为 `Static Mesh\
  \ LOD Group` 的列表，你可以在那里为资产选择所需的 `LOD Group`。如果你不想让 Unreal Engine 自动生成 LOD，也可以勾选\
  \ `Import Mesh LODs` 选项。\n\n## 网格下的其他常用设置\n\n大多数情况下，参数和选项具有非常具描述性的名称，如果你在它们上悬停一两秒钟，通常还会看到更详细的描述。无论如何，我们可以简短讨论最常用的几个：\n\
  \n* `Generate Lightmap UVs`: 在大多数情况下，你的网格会为其纹理和材质创建生成 UV。在一般情况下，此 UV 在 Unreal Engine\
  \ 中被分配为 `Channel 0`。对于静态光照烘焙（这对目标移动端或 XR 的游戏非常有用），静态网格（Static Meshes）需要一个新的 UV 用于光照贴图。如果你启用此选项，Unreal\
  \ Engine 将从 `Channel 0` 获取 UV 岛并将其重新排列到 `Channel 1` 中，对其进行优化以作为光照贴图使用。\n* `Combine\
  \ Meshes`: 这并不像看起来那么简单。如你所知，FBX 文件可能包含多个网格，如果未勾选此选项，Unreal Engine 将把每个网格作为独立的静态网格导入。如果勾选，则只会生成一个静态网格，并重新分配材质\
  \ ID。这对于优化和组织目的可能是好的，但如果你想从此 FBX 中复用资产或网格用于其他设计，则不符合意愿。\n\n## 材质\n\n在 `Materials`\
  \ 部分下，你可以为资产和文件的纹理及材质导入过程选择一些基础的关键选项。在 `Search Location` 下，将选择并搜索资产的纹理位置。`Material\
  \ Import` 选项允许你创建材质、材质实例（Material Instances），或者让你的静态网格不分配材质以便后期设置。\n\n![Figure 3.8\
  \ – Material impor\uFEFFt options](img/B21600_03_008.png)\n\n图 3.8 – 材质导入选项\n\n\
  ## 完成导入过程\n\n最后，如果你想批量导入并修改不同文件的设置，请选择 `Import`；如果你设置的设置适用于所有选中的批量导入文件，请选择 `Import\
  \ All`。\n\n## 解决常见的导入问题\n\n即使准备得很仔细，在导入过程中也可能出现问题。识别并解决这些问题对于维持工作流效率和资产质量至关重要。\n\
  \n* 比例错误 (Scaling errors):\n    * `问题识别`: 如果网格看起来太大或太小，说明 3D 建模软件与 Unreal Engine\
  \ 之间的缩放单位不匹配。\n    * `解决方案`: 在导入设置中调整缩放因子。确保你的 3D 建模软件中的测量单位与 Unreal Engine 中的一致（例如厘米）。\n\
  * 缺少材质 (Missing textures):\n    * `问题识别`: 纹理可能导入失败，导致网格显示无纹理或材质错误。\n    * `解决方案`:\
  \ 确保纹理路径设置正确，并且纹理与网格文件位于同一目录。如果纹理仍然丢失，请在 `Material Editor` 中手动重新分配。\n* 阴影问题 (Shading\
  \ issues):\n    * `问题识别`: 由于法线或平滑组错误，可能会出现不的光的光问题，如黑点或意外的阴影。\n    * `解决方案`: 在原始\
  \ 3D 模型中验证法线和平滑组。在 Unreal Engine 中，尝试使用导入设置中的 `Compute Normals` 和 `Compute Tangents`\
  \ 选项来解决这些问题。\n* 网格方向 (Mesh orientation):\n    * `问题识别`: 网格可能出现旋转或翻转，因为不同的 3D 软件包使用不同的轴向。\n\
  \    * `解决方案`: 在你的 3D 建模软件中调整轴向以匹配 Unreal Engine 的坐标系（`X`向前，`Z` 向上）。或者在导入过程中调整旋转值来纠正方向。\n\
  * 网格闪烁 (Mesh flickering):\n    * `问题识别`: 当两个表面非常接近或重叠时会发生深度冲突（Z-fighting），导致表面闪烁的渲染问题。\n\
  \    * `解决方案`: 确保 3D 模型中避免重叠几何结构。你可能还需要建模软件中调整表面之间的距离，或优化网格以删除重复面。\n* 导入耗时 (Importing\
  \ time):\n    * `问题识别`: 高面数网格或过复杂的几何结构会导致导入和实时渲染时的性能问题。\n    * `解决方案`: 通过减少多边形数量、合并较小组件以及简化不必要的细节来优化网格。你也可以调整\
  \ Unreal Engine 中的 LOD 设置来提高性能。\n\n\n\n\n\n在 3D 游戏开发中，`material assignment`（材质分配）是一个关键过程，它能够显著提升模型的视觉吸引力。本节将深入探讨在\
  \ Unreal Engine 等游戏引擎中分配和修改材质的技术层面。\n\n## 分配材质\n\n材质分配过程涉及为 3D 模型应用纹理贴图并定义材质属性。该过程从\
  \ `Material Editor`（材质编辑器）开始，开发者可以在其中创建材质实例，定义颜色、反射率和纹理贴图等各种参数。\n\n可以通过 Unreal Engine\
  \ 的 `Details`（细节）面板可以看到应用到 `Static Meshes`（静态网格）`material IDs` 的材质，如*图 3.9* 所示：\n\
  \n![Figure 3.9 – Materials in the Details panel](img/B21600_03_009.png)\n\n图 3.9\
  \ – 细节面板中的材质\n\n在 `Details` 面板中，我们可以看到应用于场景实例的材质。如果进入 `Static Mesh Editor`（静态网格编辑器），我们可以看到应用到资源及其未来实例的\
  \ `material IDs`。\n\n![Figure 3.10 – Materials in the Static Mesh Editor](img/B21600_03_010.png)\n\
  \n图 3.10 – 静态网格编辑器中的材质\n\n这两个工作区更改材质的主要优势在于，通过简单修改材质实例，即可创建 `Static Meshes` 的变体。\n\
  \n## 修改材质\n\n材质修改意味着调整属性以实现预期的视觉效果。这可能包括调整漫反射颜色、调整高光高亮，或更改法线贴图以增强表面细节。在游戏等实时应用中，材质还需针对性能进行优化，这可能涉及简化着色器或降低纹理分辨率。\n\
  \n在 Unreal Engine 的材质构建系统中，我们拥有父材质和 `Material Instances`（材质实例）。`Material Instances`\
  \ 帮助我们精调材质的最终外观。它们的界面非常简单，并包含了各种滑块。\n\n![Figure 3.11 – Material Instance](img/B21600_03_011.png)\n\
  \n图 3.11 – 材质实例\n\n父材质定义了主材质的架构，包括其节点和主要属性。它们的构建基于节点和数学运算。\n\n![Figure 3.12 – Parent\
  \ Material](img/B21600_03_012.png)\n\n图 3.12 – 父材质\n\n这种双重性允许我们从父材质生成 `Material\
  \ Instances`，从而保持相对较低的性能成本。\n\n## 性能与美学\n\n平衡材质的视觉质量与游戏性能是一项微妙的任务，需要对艺术和技术方面都有深入的理解。现在我们将对最重要的方面进行高层概述。\n\
  \n### 平衡视觉质量与性能\n\n关键在于不加重 GPU 和 CPU 负担的情况下实现尽可能高的视觉保真度。这涉及优化纹理分辨率、利用高效的着色器算法以及使用诸如纹理\
  \ `LOD` 技术。开发者必须仔细考虑材质复杂度对帧率和加载时间的影响。\n\n### 针对环境条件的材质调整\n\n游戏中的材质通常需要对环境条件做出动态响应。这可能包括光照变化、天气效果或与其他游戏元素的交互。例如，材质在雨期间可能需要看起来是湿的，或者在角色移动不同环境时更改纹理。实现这种动态材质调整涉及在游戏引擎内编写交互脚本，可能需要高级技术，如\
  \ `shader morphing`（着色器变形）或 `dynamic texture blending`（动态纹理混合）。\n\n在本节中，我们涵盖了与 `Static\
  \ Meshes` 材质分配相关的主要概念，以及资源及其后续实例初始配置的重要性。我们还讨论了父材质和 `Material Instances`（我们将在第 8\
  \ 章](#Chapter_8.xhtml__idTextAnchor341) 中深入探索）。最后，我们解决了了材质和纹理性能的一些考虑因素。在下一节中，我们将专注于\
  \ `Static Meshes` 的优化。\n\n# 网格优化技术\n\n项目优化从一开始就开始。屏幕上的每个元素都有性能成本，因此意识到这一点至关重要，以确保优化过程在任何项目的开发早期就启动。\n\
  \n## 为什么要优化？\n\n在 3D 游戏开发中，`mesh optimization`（网格优化）是一个修改和微调网格的过程，以确保符合 Unreal Engine\
  \ 等游戏引擎的性能要求，同时不损害视觉质量。\n\n优化的网格直接有助于游戏的整体性能。较低的多边形数量减少了 GPU 的渲染负载，从而实现更流畅的帧率和更快的渲染速度。这在需要同时渲染大量资源的开放世界游戏中尤为关键。此外，优化的网格消耗更少的内存，对于资源有限的平台的重要考虑因素。\n\
  \n## 优化策略\n\n本小节探讨了用于有效优化网格的各种技术和方法。每种策略都旨在减少计算负担，同时保持资源的审美本质。\n\n- **减少技术**：这种技术涉及策略性地移除多余顶点，从而在不显著影响外观的情况下简化网格。有效的多边形减少可以大幅缩短渲染时间并提高整体游戏性能。\n\
  \n- **LOD 实现**：`LOD` 系统涉及创建模型的多个版本，每个版本具有不同的复杂度级别。游戏引擎根据摄像机的近距离动态选择最合适的版本，在不损害视觉质量的情况下优化资源使用。这还包括\
  \ `Hierarchical LOD` (`HLOD`)，其中多个 `Static Meshes` 将合并或组合以提高性能。\n\n- **减少绘制调用（draw\
  \ call）的优化**：将多个小纹理合并为一个较大的纹理（`texture atlasing` 纹理图集）并将几个小网格分组渲染（`mesh batching`\
  \ 网格批处理）可以显著减少绘制调用。这种技术对于具有重复元素的环境（如景观或建筑内部）特别有效。\n\n- **Nanite**：当然，在提到 Unreal\
  \ Engine 时我们不能忘记 `Nanite`，它允许渲染具有海量多边形的细节资产，远超传统方法的处理能力。`Nanite` 通过高效流传输和处理任何时候所需的可见细节来实现这一点。\n\
  \n我们已经学习了网格优化对于 3D 游戏开发至关重要，以确保在不损害视觉质量的情况下高性能。关键优化策略对于你的项目至关重要，如果项目适用，我们将尽可能利用\
  \ `Nanite`。\n\n现在，我们将进行导入静态网格和骨骼网格的练习。\n\n# 练习 3.1：导入我们的第一个静态网格\n\n让我们参与一个新的实践练习，将一个\
  \ FBX 静态网格导入 Unreal Engine。我们将使用 Francis Lamoureux 在 **Sketchfab** 上上传名为 **Windmill**（风车）（Lamoureux\
  \ 2022）。\n\n从 Sketchfab 下载 FBX 文件\n\n1.  访问 `https://sketchfab.com/`。\n\n2.  注册或登录\
  \ Sketchfab。\n\n\n\n\n3. 访问 Sketchfab 中的资源链接：[`skfb.ly/osGzx`](https://skfb.ly/osGzx)。\n\
  \n4. 点击 `Download 3D Model` 按钮。\n\n![图 3.13 – 从 Sketchfab 下载 3D 模型](img/B21600_03_013.png)\n\
  \n图 3.13 – 从 Sketchfab 下载 3D 模型\n\n1. 下载 `FBX` 文件。\n\n![图 3.14 – 下载风扇 FBX](img/B21600_03_014.png)\n\
  \n图 3.14 – 下载风扇 FBX\n\n1. 将文件保存到所需的位置并将其解压。\n\n## 将 FBX 文件导入 Unreal Engine\n\n现在我们已经从电脑上下载了模型，让我们在\
  \ `Unreal Engine` 中打开一个新项目。\n\n1. 在 `Unreal Engine`-u0-`Editor`（编辑器）中，找到屏幕底部的 `Content\
  \ Browser`（内容浏览器）。\n\n2. 在 `Content Browser` 中`右键点击`并选择 `New Folder`（新建文件夹），创建一个用于导入你的\
  \ `FBX` 文件的文件夹（例如，在 `Props` 和 `OpenWorlds-Packt` 下将其命名为 `Windmill`）。路径如下：`Content\
  \ | OpenWorlds-Packt | Props | Windmill`。\n\n3. 使用 `Importing Static Meshes`（导入静态网格）节中编写的任何技术从\
  \ `source` 文件夹导入文件。例如，将文件`拖放`到 `Content Browser` 中。\n\n4. 你将看到 `FBX Import Options`（FBX\
  \ 导入选项）窗口。\n\n    1. 如果你想实现相对于 `UE Mannequin` 的缩放，将 `Offset Uniform Scale`（偏移统一缩放）设置为\
  \ `300`（此调整是必要的，因为 `Static Mesh` 并不是按照现实比例创建的，在导入期间需要适当调整大小）。\n\n    2. 从 `Force\
  \ All Mesh as Type`（强制所有网格类型）下拉菜单中选择 `Static Mesh`静态网格）。\n\n    3. 取消勾选 `Import\
  \ Only Animations`（仅导入动画）复选框。\n\n    4. 启用 `Combine Static Meshes`（合并静态网格）。\n\n\
  \    5. 将 `LevelArchitecture` 分配为 `Static Mesh LODGroup`（静态网格 LOD 组）。\n\n    6.\
  \ 启用 `Generate Lightmap UVs`（生成光照 UV）复选框。![图 3.15 – 静态网格 FBX 导入选项](img/B21600_03_015.png)\n\
  \n    图 3.15 – 静态网格 FBX 导入选项\n\n    1. 现在我们可以点击 `FBX Import Options` 窗口最后的 `Import`\
  \ 按钮。\n\n    2. 你现在会看到一个名为 `FBX` 的 `Static Mesh` 和名为 `standardSurface1` 的材质。![图\
  \ 3.16 – 已导入的静态网格 FBX](img/B21600_03_016.png)\n\n    图 3.16 – 已导入的静态网格 FBX\n\n \
  \   1. 从 `textures` 文件夹导入纹理。\n\n### 注意事项\n\n这种情况并不常见，但有时纹理可能会损坏或损坏并被 `Unreal Engine`\
  \ 拒绝。如果是这样，你可以随时使用喜爱的图像编辑器软件打开图像并重新保存。之后尝试重新导入。长文件名和路径也可能导致导入冲突。如果是这种情况，尝试缩短文件名并重新导入。\n\
  \n在接下来的截图中，我们可以看到导入过程中的静态网格、材质和纹理。\n\n![图 3.17 – 已导入的纹理、静态网格 FBX](img/B21600_03_017.png)\n\
  \n图 3.17 – 已导入的纹理、静态网格 FBX\n\n1. 你现在会在 `Content Browser` 中看到你的纹理。\n\n    1. 双击缩略图打开\
  \ `standardSurface1` 材质。你将看到：\n\n        * `Param`\n        * `standardSurface1`\n\
  \n    2. 在材质图中删除 `Param` 节点，连接它们，遵循 `图 3.18`：![图 3.18 – 材质，FBX](img/B21600_03_018.png)\n\
  \n    图 3.18 – 材质，FBX\n\n    3. 注意高亮的 `Param` 节点，或者取消选择所有，你将看到 `Material` 细节面板。\n\
  \n    4. 在 `Blend Mode` 下选择 `Masked`。\n\n    5. 点击 `Search` 按钮旁边的 `Apply`。![图 3.19\
  \ – 材质，FBX](img/B21600_03_019.png)\n\n    图 3.19 – 材质，FBX\n\n    查看你的 `Static Mesh`\
  \ 预览已经发生了变化。你可以根据需要多次将 `FBX Static Mesh` 放入场景中。\n\n![图 3.20 – 材质，FBX](img/B21600_03_020.png)\n\
  \n    图 3.20 – 材质，FBX\n\n在导入第一个静态网格后，我们现在准备好进入骨网格导入的后续阶段。\n\n# 练习 3.2：将 FBX 导入骨网格\n\
  \n在此练习中，我们将学习如何导入 `Skeletal Meshes`。我们的目标是如 `图 3.21` 所示导入 `FBX` 骨网格。\n\n1. 在 `Unreal\
  \ Engine`-u0-`Editor`（编辑器）中，找到屏幕底部的 `Content Browser`（内容浏览器）。\n\n2. 在 `Content Browser`\
  \ 中`右键点击`并选择 `New Folder`（新建文件夹），创建一个用于导入你的 `FBX` 文件的文件夹（例如，在 `Props` 和 `OpenWorlds-Packt`\
  \ 下将其命名为 `Windmill`）。路径如下：`Content | OpenWorlds-Packt | Props | Windmill`。\n\n3.\
  \ 使用 `Importing Static Meshes`（导入静态网格）节中编写的任何技术从 `source` 文件夹导入文件。例如，将文件`拖放`到 `Content\
  \ Browser` 中。\n\n4. 你将看到 `FBX Import Options`（FBX 导入选项）窗口。\n\n\n\n\n\n图 3.25 – 导入比例，重新导入基础网格，Skeletal\
  \ Mesh FBX\n\n![图 3.26 – 导入比例，重新导入动画，Skeletal Mesh FBX](img/B21600_03_026.png)\n\
  \n图 3.26 – 导入比例，重新导入动画，Skeletal Mesh FBX\n\n1. 如果你修改了导入比例并重新导入了资产，你将在关卡中的资产实例中直接看到修改。\n\
  \n2. 为了看到动画播放，请点击顶部工具栏上的 `Simulate` 按钮。双击检查资产设置是否正确。放置在关卡中的 `Skeletal Mesh` 在 `Animation`\
  \ 部分应具有以下设置：\n\n![图 3.27 – 设置与仿真，Skeletal Mesh FBX](img/B21600_03_027.png)\n\n图\
  \ 3.27 – 设置与仿真，Skeletal Mesh FBX\n\n1. **Animation Mode**: `Use Animation Asset`\n\
  2. **Anim to Play**: `Desired animation`（例如，`FBX_Anim`）\n3. **Looping**: 勾选\n4.\
  \ **Playing**: 勾选\n\n`Skeletal Meshes`是将动画对象（或准备好制作动画的对象）引入我们项目的简单方法，允许我们通过移动元素为场景注入活力。\n\
  \n# 总结\n\n本章的第一部分关注了 Unreal Engine 中资产摄入的概念，这是将外部资产集成到游戏项目中的关键过程。我们深入了将 `Static\
  \ Meshes`（特别是 `FBX` 格式）导入到 Unreal Engine 的详细步骤。这包括准备 `Content Browser`、配置符合项目要求的导入设置，以及解决导入过程中可能出现的常见问题。通过引导你完成导入\
  \ `FBX` 文件的实际练习，本章旨在使你掌握关于如何高效地将外部 3D 模型引入 Unreal Engine 项目的基础知识，为后续在游戏环境中进行进一步的操作和集成奠定基础。\n\
  \n本章的第二部分详细讨论了优化技术，这对于在保持高视觉质量的同时增强游戏性能至关重要。我们探索了 `Level of Detail`（`LOD`）策略的实现，解释了如何使用不同的\
  \ `LODs` 根据模型距离摄像机的远近来管理模型的复杂度。本章还涵盖了材质的优化策略，强调了美学与性能之间的平衡，以及根据环境条件进行调整的重要性。\n\n\
  下一章将把重点转向 Unreal Engine 中项目结构和命名规范的基础元素。游戏开发中的这一至关方面确保了资产的高效管理和组织，这对于在包含众多元素的复杂项目中尤为重要。\n\
