  \ |\n\n# 12\n\n# 优化和测试你的场景\n\n在 `Unreal Engine` 中创建环境主要是一个艺术过程。通过规划和开发，我们可以根据主要目标的要求构建广泛且真实的场景。虽然艺术性构成了基础，但技术理解同样重要。\n\
  \n在每一章的开发过程中，我们对所用工具的特定方面简要提供了一些提示和建议。在前面的章节中探索了世界构建的艺术层面后，现在是时候将注意力转向让这些世界平畅运行的技术层了。\n\
  \n在本章中，我们将优化视为一个全局概念，它应该贯穿于始终始终，并能帮助我们解决项目中出现的性能问题。我们还将讨论如何向环境中添加角色以遍历场景并对其进行评估。在开放世界环境中，极大的规模、密度和远视距离会放大每一个性能成本：视野中更多的物体、更长的流送路径以及更沉重的光照和后期处理负载。将优化视为一种持续的设计约束，而不是后期的补丁。\n\
  \n当我们谈论实时渲染时，重要一点是理解在开发过程中必须做出妥协，以抵消随着资产添加到项目而产生的潜在性能损失。这些包括 `Static Meshes` 中的多边形数量、纹理分辨率、碰撞处理和光照复杂性。我们的目标应该是项目开发各个方面之间找到平衡。基本方面是`性能`、`质量`和`功能性`。在这种`维特鲁威三角形`中，将始终存在权衡；我们总是会牺牲一个方面来获得另一个方面。\n\
  \n我们在本章中涵盖的关键主题包括：\n\n*   启动项目前需要考虑的因素\n*   理解实时渲染\n*   理解性能分析（Profiling）\n*   最佳实践\n\
  \n# 技术要求\n\n为了继续完成本章的开发，你需要一台安装了 `Unreal Engine 5.5`（或更高版本）的 PC，并需满足 `Epic Games`\
  \ 推荐的配置：[`dev.epicgames.com/documentation/en-us/unreal-engine/hardware-and-software-specifications-for-unreal-engine`](https://dev.epicgames.com/documentation/en-us/unreal-engine/hardware-and-software-specifications-for-unreal-engine)。请确保你也有活跃的网络连接。\n\
  \n# 启动项目前需要考虑的因素\n\n在启动项目之前，评估影响性能稳定性的性的技术因素非常重要。考虑以下几点：\n\n*   在启动项目之前，建议建立最低要求以确保项目具有功能性。定义项目正确运行所需的帧率，通常以\
  \ `FPS` 表示。\n*   定义实现该帧率的工作流，即我们需要考虑哪些引擎特性和技术来维持它，例如光线追踪（ray tracing）、`Lumen` 或纹像素密度（texel\
  \ density）。\n*   记住，添加到项目的每个功能或资产都有性能成本，因此确保添加的任何内容对项目都有有意义的贡献至关重要。\n*   项目的目标平台（Windows、Android、iOS\
  \ 或游戏主机）是另一个从一开始就需要考虑的非常重要的因素，因为它直接影响项目的构建及其优化。\n*   优化场景的另一个重要因素是运行该场景的硬件。意识到所需的最低规格至关重要，因为优化和测试必须基于这些约束进行。因此，优化必须与测试并肩进行，以确保性能保持稳定。\n\
  \n在深入渲染过程之前，有必要回顾一些关键概念；让我们在下一节中理解它们。\n\n# 理解实时渲染\n\n`Unreal Engine` 是一个`实时渲染`引擎，这意味着它在每一帧中都必须执行大量的计算，以便在屏幕上绘制必要的像素。这些计算由\
  \ `CPU` 和 `GPU` 共同执行，每个部分同步处理渲染过程的不同部分。\n\n`Unreal` 中有两种渲染方法：\n\n*   **延迟渲染（Deferred\
  \ rendering）**：首先将材质属性渲染到 `GBuffer`，并在随后的渲染次中应用光照。它很好地支持许多动态光照和复杂的材质，这就是为什么它是大多数内容的默认选择。\n\
  *   **正向渲染（Forward rendering）**：光照在物体渲染期间进行评估。它可以提供更低的过度绘制（overdraw）并支持多采样抗锯齿（MSAA），这使得它对于光照数量有限的特定风格化、VR\
  \ 或移动场景具有吸引力。\n\n在本章中，我们将关注*延迟渲染*，因为它是最广泛使用的，对大多数内容性能良好。\n\n## 理解网格是如何绘制的：顶点、三角形和像素\n\
  \n场景中的每个 3D 对象最终都由`三角形`组成。每个三角形由空间中的三个点定义，称为`顶点`。一个`顶点`存储了位置、法线方向、UV 坐标以及颜色或其他顶点数据。\n\
  \n当你看到**高多边形网格**时，你实际上看到的“一个具有大量三角形的网格”，这意味着也有大量的顶点。所有这些三角形共同构成了资产的可见表面。\n\n在实时渲染中，`GPU`\
  \ 接收这些顶点，将它们转换为屏幕空间（相机看到的内容），然后填充（或“栅格化”）每个三角形内部的像素。这会最终成为你屏幕上的图像。\n\n为什么这对性能很重要？\n\
  \n*   `CPU` 负责准备和提交需要绘制的内容，即哪些物体是激活的、在哪里、以及这一帧是否应该渲染。\n*   `GPU` 负责处理可见物体、处理它们的三角形、着色像素并合成最终帧。\n\
  \n如果一个网格有数百万个三角形，`GPU` 就必须处理并着色它们。诸如 `Nanite` 这样的系统通过智能流送和减少三角形密度来帮助，但底层成本仍然与*现在需要绘制多少三角形/像素*相关。\n\
  \n\n\n\n\n这里有一个实用的心理模型需要记住：\n\n1. 顶点定义三角形。\n2. 三角形定义网格（mesh）。\n3. GPU 对这些三角形的可视像素进行着色。\n\
  \n理解这一链条有助于我们在本章节后续部分更易地解读性能分析数据，特别是当我们谈论 GPU 时间、三角形成本和阴影成本时。\n\n在下一节中，我们将用简化的语言解释\
  \ Unreal 的渲染过程是如何运作的，以及如何识别每个阶段的性能瓶颈。\n\n## 深入探究 Unreal Engine 中的渲染过程\n\n在开始优化之前，了解\
  \ Unreal 渲染过程的工作原理非常有用的。这使我们能够识别应该在何处应用优化来提高性能。\n\n缺乏优化可能与过度优化一样不利；因此，确切知道在何处进行优化对于在视觉质量和性能之间取得最佳平衡至关重要。\n\
  \n我们可以将渲染过程分为三个线程，它们反映了 CPU 和 GPU 执行的计算：\n\n*   **CPU**：负责模拟和逻辑（动画、变换、物理、AI、生成和碰撞）\n\
  *   **Draw (CPU)**：负责命令提交以及可见性/遮挡工作，为 GPU 将要渲染的内容做好准备\n*   **GPU**：执行渲染：深度预通过、光照、后处理和合成\n\
  \n我们将在*探索渲染工作流*部分中详细探讨这些阶段。\n\n为了分析每个阶段消耗了多少时间，Unreal 提供了实时统计数据。这些数据帮助我们测量 CPU (**Game**)、**Draw**\
  \ 和 GPU 线程，并在深入研究工作流之前快速发现瓶颈。\n\n你可以使用几个统计命令直接在编辑器中查看这些性能统计数据。最常用的如下：\n\n*   `stat\
  \ unit`\n*   `stat fps`\n\n在 Unreal Engine 中激活统计数据最简单的方法之一是使用视口（Viewport）右上角的下拉菜单（**眼睛**图标\
  \ | **Viewport Stats** | **COMMON STATS**），如*图 12.1* 所示：\n\n![Figure 12.1 – Select\
  \ stats](img/B21600_12_01.png)\n\nFigure 12.1 – 选择统计\n\n所选统计数据的摘要将出现在视口的右上角，如*图\
  \ 12.2* 所示：\n\n![Figure 12.2 – Detail stats](img/B21600_12_02.png)\n\nFigure 12.2\
  \ – 详细统计\n\n我们也可以通过以下控制台命令启用统计，使用 cvars（见*图 12.3*）：\n\n*   `stat unit` 显示 CPU、Draw\
  \ 和 GPU 的每线程时间（ms），以及总帧时间，颜色从*绿色*到*红色*编码，以便快速分级处理。\n*   `stat fps` 显示当前的每秒帧数和帧时间；用它来验证你的\
  \ ms 拆分与观察到的 FPS 是否一致。\n\n![Figure 12.3 – Command console](img/B21600_12_03.png)\n\
  \nFigure 12.3 – 命令控制台\n\n在实时计时可见的情况下，让我们逐步了解渲染工作流，以理解每个线程在做什么，以及优化在何处影响最大。\n\n##\
  \ 探索渲染工作流\n\n现在我们已经可以看到系统的计算时间了，让我们回到理解 Unreal Engine 中的渲染过程。该过程由三个阶段（或*帧*）组成，如*图\
  \ 12.4* 所示：\n\n![Figure 12.4 – Render workflow](img/B21600_12_04.png)\n\nFigure\
  \ 12.4 – 渲染工作流\n\n在*图 12.4*所示的图中，我们可以看到以下线程：\n\n*   **CPU**\n*   **DRAW (CPU)**\n\
  *   **GPU**\n\n这三个线程是同步的，但并非同时启动。每个线程都负责特定的计算，以便在过程结束时绘制出相应的帧。\n\n该过程的每个阶段需要一定的时间（以毫秒或\
  \ ms 为单位），这定义了场景的帧率（FPS）。\n\nUnreal Engine 必须实时渲染绘制屏幕分辨率定义的像素数量所需的所有信息。分辨率越高，在相同时间内绘制的像素就越多。这就是为什么在高分辨率下渲染需要大量的\
  \ CPU 和 GPU 功率。\n\n例如，在 30 FPS 下，渲染单帧将需要 33 ms。这被称为**延迟**，即渲染一帧所需的时间。\n\n现在让我们拆解渲染过程的每个线程，以更详细地了解它们。\n\
  \n#### Frame 0\n\n在渲染之前，Unreal 必须知道渲染什么以及在何处。由于是实时的，元素会不断改变位置，因此它们的位置必须在每一帧中重新计算。这需要对场景进行一系列逻辑计算：\n\
  \n*   **动画**：决定动画对象将移动到哪里\n*   **对象位置**：定义每个对象在场景中的位置\n*   **物理**：识别哪些对象受物理影响影响，并计算适用于它们的物理类型\n\
  *   **AI**：计算 AI 的行为，以确定 AI 驱动的 Actor 将去哪里或做什么\n*   **生成、销毁、隐藏、取消隐藏**：引擎必须确定哪些对象将被生成、销毁、隐藏或取消隐藏\n\
  *   **碰撞**：这些检查识别存在多少次碰撞以及它们占据的体积\n\n所有这些计算在渲染开始之前必须由 CPU 处理。结果是场景中所有对象的一完整变换集。\n\
  \n在 **Stat Unit** 中，这些计算由 **Game** 线程表示，如*图 12.5* 所示：\n\n![Figure 12.5 – Game thread](img/B21600_12_05.png)\n\
  \nFigure 12.5 – Game 线程\n\n**Stat Unit** 中的值以毫秒表示，这是解释性能变化的更可靠的测量方法。得益于值的颜色编码，我们可以快速判断它们是否可以接受，范围从*绿色*到*红色*。因此，通过这些计算，我们能够理解场景中\
  \ Actor 的行为。记住，问题的常见来源是编程任务和骨骼网格（Skeletal Meshes）。开发者应该密切关注 **Game** 线程，这里的峰值通常是问题的第一个信号。\n\
  \n### Frame 1\n\n在这个阶段，我们现在有了对象的变换信息，但并不是所有对象都需要渲染。我们需要确定哪些对象应该被实际渲染：即在当前帧中可见的对象。\n\
  \n此过程部分发生在 CPU 和 GPU 之间，尽管 CPU 承担了更重的负载。\n\n为了实现这一点，Unreal 开始执行遮挡过程，创建所有可见对象的列表。此检查是在对象级别进行的，而不是每个三角形，因此通过跳过完全隐藏的\
  \ Actor 来减少 GPU 的过度绘制。然而，每个 Actor 都会产生 CPU/**Draw** 线程的可见性测试，这意味着成千上万的小对象会将成本转移到\
  \ Draw 线程。\n\n由于过程是复杂的，Unreal 使用四个不同的系统来生成可见对象列表（距离裁剪、视锥裁剪、预计算可见性和遮挡裁剪）。这是这种与延迟渲染器配合得很好的混合解决方案之一。每个系统在处理特定任务方面都是有效的，并按照性能成本从*低*到*高*的顺序执行。\n\
  \n让我们按顺序查看这些系统，从最简单且成本效益的方法距离裁剪开始。\n\n#### 距离裁剪\n\n距离相机一定距离的对象将不再渲染。每个 Actor 都有一个定义最小绘制距离（Min\
  \ Draw Distance）的参数，可以在 Actor 的 **Details**（细节）面板的 **LOD** 部分下找到，如*图 12.6* 所示：\n\
  \n![Figure 12.6 – Min Draw Distance](img/B21600_12_06.png)\n\nFigure 12.6 – 最小绘制距离\n\
  \n\n\n\n\n`Desired Max Draw Distance` 参数允许我们控制 `Actor` 停止渲染的距离。\n\n## 视锥体裁剪 (Frustum\
  \ culling)\n\n视体是一个`截头锥`（参见*图 12.7*），代表了相机的视野范围。当物体进入此视野范围时，它会被完全渲染。这种裁剪是针对每个对象的，而不是针对每个三角形的。\n\
  \n![Figure 12.7 – Frustum camera](img/B21600_12_07.png)\n\n图 12.7 – 视体相机\n\n###\
  \ 注意\n\n所有视体之外且与视体不相交的 `Actors` 都不会在帧中进行计算或渲染。\n\n## 预计算可见性 (Precomputed visibility)\n\
  \n这种方法将场景划分为网格，每个单元格存储了从该位置可以看到哪些物体的信息。这些单元格是在光照烘焙过程中生成的。\n\n## 遮挡裁剪 (Occlusion\
  \ culling)\n\n这种方法从摄像机的视角检查每个对象的可见性。这是最消耗资源的过程，取决于 `Actor` 的包围体。从摄像机的位置，Unreal 必须检查场景中的每个对象，以确定它是可见的、部分可见的还是完全隐藏在另一个\
  \ `Actor` 或 `Static Mesh` 之后。\n\n通过对每一帧运行所有这些过程，Unreal 确定哪些物体遮挡了其他物体，确保只渲染必要的像素。\n\
  \n在 `Draw` 线程中，我们可以看到计算场景遮挡所需的时间，如*图 12.8*所示：\n\n![Figure 12.8 – Draw thread](img/B21600_12_08.png)\n\
  \n图 12.8 – Draw 线程\n\n通过所有这些计算，我们现在知道场景中哪些对象被遮挡了。\n\n`Actors 的数量`和它们的`大小`是优化 `Draw`\
  \ 线程时考虑的主要方面。场景中的 `Actors` 越多，Unreal 需要执行的遮挡检查就越多，从而增加 `Draw` 时间。此外，`Actor` 的大小也很重要：非常大的\
  \ `Actors` 几乎总是渲染，而较小的对象由于需要更多的遮挡计算，处理成本更高。\n\n## 第 2 帧 (Frame 2)\n\n在这一阶段，我们已经知道物体的位置以及哪些物体是可见的。现在开始了最复杂的一步：渲染这些物体。\n\
  \n然而，在开始渲染本身之前，还有一个额外的问题需要解决。我们需要一个`预通过` (pre-pass)，因为我们知道要渲染哪些物体以及它们在哪里，但我们还不知道它们的渲染顺序——具体来说，哪些物体比其他物体更靠近相机。\n\
  \n问题的出现是因为 Unreal 是逐个渲染对象的。如果我们不在不知道它们离相机有多远的情况下进行渲染，我们将反复在相同位置生成像素，并用仅属于单个物体的像素覆盖它们（由于元素之间的遮挡）。这浪费了性能。\n\
  \n为了避免这种情况，在渲染之前会创建一个`深度通过通过` (depth pass)，它建立了物体相对于摄像机的顺序。这确保了被其他物体隐藏的物体像素会被掩码，而不会进行不必要的渲染。\n\
  \n本质上，这个过程掩码了不可见的像素，因此只渲染可见的像素。此外，这是生成所有渲染通过的阶段，这些通过随后被组合在一起，形成帧的最终图像。\n\n在 `GPU\
  \ Time` 线程中，我们可以看到绘制场景所需像素花费的时间，如*图 12.9*所示：\n\n![Figure 12.9 – GPU Time thread](img/B21600_12_09.png)\n\
  \n图 12.9 – GPU Time 线程\n\n当 GPU 线程时间激增时，通常是由材质中的高分辨率纹理以及场景渲染的分辨率引起的。这两个方面是优化场景的关键因素。\n\
  \n应用到渲染的后期处理效果是 GPU 时间的另一个主要来源，还有光照和阴影计算。\n\n在开放世界环境中，记住渲染充满物体的大型区域需要 GPU 执行密集的计算，每帧消耗大量的毫秒数。因此，该线程的优化尤为关键。\n\
  \n## 绘制调用 (Draw calls)\n\n`draw call` 是一组共享相同属性的多边形——换句话说，即一个对象。一旦开始此阶段，GPU 就开始渲染。渲染过程是逐个绘制调用执行的。\n\
  \n物体被逐个渲染到 `GBuffer` 中，然后 `GBuffer` 不同的图像或渲染通过以生成最终帧。\n\n要可视化 `GBuffer` 通过，请前往视口右上角的\
  \ `View Mode`，然后选择 `Buffer Visualization` | `Overview`，如*图 12.10*所示：\n\n![Figure\
  \ 12.0 – Buffer Visualization menu](img/B21600_12_10.png)\n\n图 12.10 – Buffer Visualization\
  \ 菜单\n\n启用后，这将显示视口的新版本，显示出与当时场景最终渲染图像分离的缓冲区，并实时更新，如*图 12.11*所示：\n\n![Figure 12.11\
  \ – Passes in the GBuffer and image composed](img/B21600_12_11.png)\n\n图 12.11 –\
  \ GBuffer 中的通过和组合的图像\n\n绘制调用对性能有显著影响。事实上，现在`draw calls 的数量`对性能的影响比`三角形的数量`更大。减少绘制调用并不意味着降低场景质量。有方法可以在保持视觉保真度的同时优化绘制调用：\n\
  \n*   合并相邻的 `Actors`（`Tools` | `Merge Actors`），并在安全的情况下合并 `Materials` 以减少提交开销\n\
  *   可以在 `Stat Unit` 中监控绘制调用，如*图 12.12*所示：\n\n![Figure 12.12 – Draw calls counter](img/B21600_12_12.png)\n\
  \n图 12.12 – 绘制调用计数\n\n`Actor` 生成的绘制调用数量与其材质、几何形状和光照有关。\n\n注意\n\nNanite 几何体不计算绘制调用，但它们的*材质*计算。这是一个需要记住的重要细节。\n\
  \n\n\n\n\n*   **光复杂度 (Light Complexity)**：此模式允许我们可视化场景中动态光源的数量及其影响半径的重叠情况，这会导致实时光照计算的复杂度增加。颜色越暖，表示重叠的光源越多。\n\
  \n![图 12.14 – 光复杂度模式](img/B21600_12_14.jpg)\n\n图 12.14 – 光复杂度模式\n\n*   **着色器复杂度\
  \ (Shader Complexity)**：此模式允许我们查看每个着色器的处理成本。区域越偏`红色`或`白色`，该着色器处理的指令越多。最好避免出现大面积的`白色`或`红色`区域。\n\
  \n![图 12.15 – 着色器复杂度模式](img/B21600_12_15.png)\n\n图 12.15 – 着色器复杂度模式\n\n在我们的案例中，使用这些模式使识别出项目中光照和材质（Materials）相关的计算最多的地方。\n\
  \n还有更高级的工具可以识别场景中可能发生高计算开销的地方。这些工具可以分为两类：**GPU 可视化器 (GPU Visualizer)** 和 **统计 (Statistics)**，它们从捕获的帧中收集信息，并提供帧渲染详细分解。\n\
  \n## 使用 GPU 可视化器\n\nGPU 可视化器捕获 GPU 上某一帧的信息，以识别在该帧期间发生以及每个过程消耗的时间。\n\n由于它提供了引擎渲染的信息，获取真实数据的最佳方法是在最终分辨率下进行捕获。请执行以下操作：\n\
  \n1.  前往**编辑器偏好 (Editor Preferences)** | **关卡编辑器 (Level Editor)** | **播放 (Play)**\
  \ | **游戏视口设置 (Game Viewport Settings)**。\n2.  在**新视口分辨率 (New Viewport Resolution)**\
  \ 中设置你需要的分辨率。这样捕获将在所选分辨率下进行。\n\n打开 GPU 可视化器有两种方法。你可以任选其一：\n\n*   按下 `Ctrl` + `Shift`\
  \ + `,`\n*   在控制台中输入 `profileGPU`\n\n当捕获正确完成后，你将看到**GPU 可视化器**窗口，如 `图 12.16` 所示：\n\
  \n![图 12.16 – GPU 可视化器](img/B21600_12_16.jpg)\n\n图 12.16 – GPU 可视化器\n\n在 GPU 可视化器内部，两个部分提供了类似的信息，但显示方式不同。\n\
  \n顶部有一个`条形的可视化表示`，每个条形代表一个过程以及它在帧计算中所占的时间比例：\n\n![图 12.17 – GPU 可视化器详情](img/B21600_12_17.png)\n\
  \n图 12.17 – GPU 可视化器详情\n\n在 `图 12.18` 所示的示例中，我们可以看到阴影占据帧处理时间最大的比例，达到 `15.08` ms：\n\
  \n![图 12.18 – GPU 可视化器详情](img/B21600_12_18.jpg)\n\n图 12.18 – GPU 可视化器详情\n\n### 注意\n\
  \n根据操作系统的区域，UI 数字可能会带有逗号分隔符。\n\n在这里，我们看到来自 Nanite 网格的虚拟阴影消耗了总帧的 `14.95` ms。通过这些信息，我们知道需要开始优化场景的这部分。在这种情况下，问题源于景观植被生成的阴影，如\
  \ `图 12.19` 所示供参考：\n\n![图 12.19 – 景观详情](img/B21600_12_19.png)\n\n图 12.19 – 景观详情\n\
  \n尽管它们是 Nanite 网格，但由于数量巨大，生成了大量的阴影。\n\n为了最小化这种成本，可以应用几种策略：\n\n*   **减少植物数量**：在这种情况下，它们是通过植被绘制/材质驱动刷出的，因此有必要在相应的植被执行体\
  \ (Foliage Actor) 中调整密度。\n*   **略微放大网格比例**：这样它们可以覆盖更大的空间，减少所需的总数。\n*   **缓存阴影**：为了让它们不被反复计算，例如通过烘焙光照并设置为静态。\n\
  \n请记住，尽管 Nanite 允许我们处理极高面数的网格，但它可能会引入其他性能问题，例如阴影计算或材质数量。\n\n使用 Nanite 网格时，建议启用**虚拟阴影映射\
  \ (Virtual Shadow Maps)** 作为阴影映射方法，使阴影计算更高效。\n\n为了收集关于场景资产的可操作性能数据，我们将从 Unreal 的**统计\
  \ (Statistics)** 工具开始，下一节将介绍。\n\n## 使用统计和资源使用进行审计\n\n打开**统计**，前往**工具 (Tools)** |\
  \ **审计 (Audit)** | **统计 (Statistics)**，这将显示如 `图 12.20` 所示的窗口：\n\n![图 12.20 – 统计工具](img/B21600_12_20.png)\n\
  \n图 12.20 – 统计工具\n\n**统计**窗口提供了一个按类型（静态网格、骨骼网格、材质、纹理等）分组的关卡资产排序表格。每组列出了每个资产指标，例如三角形/顶点、材质槽、LOD\
  \ 数量、近似资源大小（内存）以及当前关卡中的实例计数。你可以对列进行过滤、搜索和排序以快速发现异常值。\n\n#### 使用资源使用 (Resource Usage)\n\
  \n此选项提供了项目使用的资产列表，按类型组织，以查看消耗了多少内存。\n\n打开**资源使用**，前往**工具 (Tools)** | **审计 (Audit)**\
  \ | **资源使用 (Resource Usage)**，将显示以下内容：\n\n![图 12.21 – 资源使用工具](img/B21600_12_21.png)\n\
  \n图 12.21 – 资源使用工具\n\n**资源使用**提供了项目内存占用的高级分解，按类别（**纹理**、**材质 Shader**、**静态网格**、**Niagara\
  \ 脚本**、**音频**等）分组，你可以查看每个组和单个资产消耗了多少 CPU RAM 和 GPU VRAM。在**资源使用**中标记出最大的元祸首后，下一步是采取行动。在下一节中，我们将这些发现转化为具体的修复。\n\
  \n# 最佳实践\n\n一旦我们确定了项目中可能导致性能损失的方面，必须应用必要的修改来提高性能。在这一节中，我们将卷起袖子全面提高性能，处理几何、LOD 和材质，以便我们做的每种更改都能减少绘制成本、平衡\
  \ GPU 时间并保持内存处于预算范围内。\n\n## 几何图形\n\n如果屏幕上显示的资产过多，花费在**绘制 (Draw)** 线程的时间将增加。我们可以通过几种方式进行优化：\n\
  \n*   将静态网格转换为 Nanite 以最小化三角形计算\n*   合并网格以减少场景中的 Actor 总数\n\n要合并 Actor，请使用专用工具。首先选择要合并的\
  \ Actor，然后前往**工具 (Tools)** | **合并执行体 (Merge Actors)**，如 `图 12.22` 所示：\n\n![图 12.22\
  \ – 合并执行体](img/B21600_12_22.png)\n\n图 12.22 – 合并执行体\n\n通过**合并执行体**工具，我们可以合并静态网格甚至是它们的材质，为管理几何图形提供了极大的灵活性。\n\
  \n为了避免遮挡问题，合并几何图形时必须遵循某些规则：\n\n*   合并靠近的 Actor，因为合并网格会生成包含组合体积的新边界，可能会影响遮挡。\n* \
  \  避免合并巨大的物体，因为这些物体在屏幕上总是会被渲染，会对遮挡产生不利影响。\n\n如果合并材质，可以定义哪些纹理映射应该合并以及它们的解析。请记住，当将多个映射合并为一张时，纹理分辨率会降低。\n\
  \n## LOD\n\n继续讨论几何图形，我们可以使用 LOD 来提高非 Nanite 静态网格的性能（Nanite 网格已经包含了它们内部的 LOD 系统）。\n\
  \n\n\n\n\nLOD 是原始网格的简化版本，减少了三角形数量。虚幻引擎（Unreal Engine）根据相机距离切换这些网格：当物体远离时使用低多面版本，当相机靠近时使用高多面版本。\n\
  \n在开放世界中，长视线和流送使得 LOD 变得至关重要。将每个网格 LOD 与 `World` `Partition` 中的 `HLODs` 配对，可以将远处区域合并为轻量级代理，从而减少绘制调用（draw\
  \ calls）和过度绘制（overdraw）。按资产类型（植被与建筑）设置 LOD 距离，需要时使用抖过渡（dithered transitions），并在较低的\
  \ LOD 上去除阴影或复杂材质，以保持远处内容的廉价，同时确保近处细节清晰。\n\n## 生成 LOD\n\nLOD 可以在虚幻引擎或外部软件中通过`手动`或`自动`生成。让我们检查这两个过程。\n\
  \n在虚幻引擎中，要自动生成 LOD，请打开静态网格编辑器（双击 `Content Browser` 中的 `Actor`）。\n\n在 `Details` 面板中，`LOD\
  \ Settings` 下，你将找到以下选项（参见*图 12.23*）：\n\n* **Number of LODs**：定义将创建多少个 LOD \n* **Auto\
  \ Compute LOD Distance**：禁用此选项以手动控制距离\n* **Apply Changes**：生成 LOD。显示 LOD 的距离是自动定义的，但可以进行调整\n\
  * **Screen Size**：定义显示每个 LOD 的相机距离（基于屏幕覆盖的百分比）\n\n![Figure 12.23 – LODs](img/B21600_12_23.png)\n\
  \n图 12.23 – LODs\n\n现在，让我们来看看如何手动创建 LOD。手动创建 LOD 有两种方法：\n\n* **Import LOD meshes**：在自动生成\
  \ LOD 后，使用 `LOD Import` 为每个 LOD 槽分配特定的网格\n* **Reduction settings (per LOD)**：控制每个网格的三角形数量，定义每个\
  \ LOD 级别的几何密度\n\n## 纹理\n\n在创建 `Master Material` 时，通常会使用与该材质绑定的特定纹理。\n\n即使材质没有应用到场景中的任何物体，这些纹理也会加载到内存中。即使\
  \ `Material Instances` 没有使用它们，它们也会加载到内存中。\n\n避免这种情况的最佳方法是使用系列简单、低分辨率的纹理来最小化内存占用：\n\
  \n![Figure 12.24 – Textures for Master Material](img/B21600_12_24.png)\n\n图 12.24\
  \ – Textures for Master Material\n\n尽可能使用 2 的幂纹理（power-of-two textures）是非常重要的，因为非\
  \ 2 的幂纹理有两个缺点：\n\n* 没有 mipmaps，这会导致摩尔纹和闪烁效应\n* 会占用更多的内存空间\n\n纹理的`compression format`（压缩格式）也非常重要，因为它直接影响视觉质量和内存占用。\n\
  \n参考以下示例：\n\n* **DXT1 Texture**：\n    * 512x512 | 171 kB\n    * 1024x1024 | 683\
  \ kB\n* **ARGB8 Texture**：\n    * 511x513 | 1,024 kB\n    * 1023x1025 | 4,096 kB\n\
  \n纹理压缩主要类型：\n\n* **Default**：这是块压缩（4–8 bpp），可以极大地减少显存和带宽。适用于颜色映射（albedo, ORM）。\n\
  \    * **Trade-off**：渐变或 UI 上会出现块状/断带伪影。\n* **Grayscale compression**：这种单通道压缩（4\
  \ bpp）是掩码/高度图的理想选择。与在 RGBA 中存储相同数据相比，它减少了内存。\n* **Trade-off**：只有一个通道；如果你需要最小化采样器而非纯内存，请使用通道打包（在\
  \ RGBA 中放置多个掩码）。\n\n![Figure 12.25 – Textures compression](img/B21600_12_25.png)\n\
  \n图 12.25 – Textures compression\n\n现在我们已经探索了几何、LOD 和纹理的优化策略，让我们通过分析场景来看这些原则如何在实践中应用。\n\
  \n## 示例：场景分析\n\n`Nanite` 是一种几何虚拟化系统，允许我们在场景中拥有大量高三角形数量的网格。然而，它们仍然会影响光照和材质等部分的性能。\n\
  \n因此，在使用 `Nanite` 时必须格外小心，特别是通过 `Foliage` 工具添加资产时。虽然工具优化了植被的放置，但如果这些资产也是 `Nanite`\
  \ 网格，我们很容易产生大量的几何体。引擎将需要计算（例如）这些资产投射的阴影，这可能会消耗帧渲染时间的很大一部分——即使使用 `Virtual Shadow\
  \ Maps` 作为阴影方法。\n\n在我们正在优化的场景中，我们观察到以下线程的计算时间较高：\n\n* **Draw**: 35.57 ms\n* **GPU**:\
  \ 35.16 ms\n\n此外，GPU 可视器显示 `ShadowDepths` 消耗了渲染时间的大部分，达到 `15.08` ms。其中，`14.95` ms\
  \ 用于计算场景中 `Nanite` 资产的 `Virtual Shadow Maps`：\n\n![Figure 12.26 – Virtual Shadow\
  \ Maps render time](img/B21600_12_26.png)\n\n图 12.26 – Virtual Shadow Maps render\
  \ time\n\n\n\n\n\n因此，在调用某个区域为“已优化”之前，请在场景的上下文中进行快速的场景分析。注意 `Game` 线程上任何与 AI、动画或重叠事件相关的停顿，然后在目标分辨率下重新进行性能剖析。这会将性能发现与真实的玩家交互联系起来，而不仅仅是合成计时。\n\
  \n优化和测试不是孤立的任务，而是必须在整个开发过程中反复审视的持续过程。通过将技术剖析与实际游戏性的验证相结合，你将能够交付不仅在视觉上令人惊艳，而且稳定、高效且充满探索乐趣的世界。\n\
  \n## 前方的旅程\n\n这标志着我们完成了在 Unreal Engine 中创建开放世界景观的旅程：从世界构建的艺术基础，到技术优化，再到最终的游戏性验证。凭借这些工具和实践，你现在已经准备好为玩家创造广阔、高性能且沉浸式的世界了。\n\
  \n任何故事、游戏或电影片段都需要一个可以容身其足的世界，因此我们能开发的内容具有无限可能。将每一种可能性都视为一个捕捉你内在火花的机会，并将其转化为他人可以进入的世界吧！\n\
