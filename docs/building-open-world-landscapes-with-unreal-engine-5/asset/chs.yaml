  \ Engine 安装为最新版本，以访问最新的功能和改进。\n\n# 设置项目和模板\n\n当你不指定特定项目而启动 Unreal Engine 时，Unreal\
  \ 项目浏览器（Unreal Project Browser）会自动打开，如下：\n\n![Figure 1.2 – The Unreal Project Browser](img/B21600_01_002.png)\n\
  \n图 1.2 – Unreal 项目浏览器\n\n`Figure 1.2` 显示了以下部分：\n\n1. 在此浏览器中，你可以选择模板的类别（`1`）。如果你之前在\
