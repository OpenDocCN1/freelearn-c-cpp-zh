  \ |\n\n# 第二部分\n\n# 创建并详细化你的开放世界\n\n在这一部分中，你将介绍在 Unreal Engine 中构建和精炼环境的实际流程。它从关卡和层管理的概述开始，以便在大世界中实现更好的控制和扩展性。随后，你将进入使用\
  \ `Landscape`（地形）和 `Sculpt`（雕刻）工具进行地形创建，学习如何塑造和修改自然表面。接下来的章节将指导你使用 `Foliage`（植被）系统添加植被，并创建定义表面外观和真实性的材质。\n\
  \n这些章节共同确立了制作详细、可信且准备好光照渲染的环境的关键技术。\n\n本书的这一部分包含以下章节：\n\n* *第 5 章, *管理关卡和层*\n* *第\
  \ 6 章, *构建你的地形*\n* *第 7 章, *用植被填充你的世界*\n* *第 8 章, *材质简介*\n\n# 5. 管理关卡和层\n\n在与 Unreal\
  \ Engine 一工作时，理解游戏世界在关卡中的组织方式至关重要。关卡塑造了游戏环境、叙事和性能优化。\n\n在此基础上，考虑构建环境的两种主要方法。Unreal\
  \ Engine 提供了管理游戏环境的两种方法：使用关卡、子关卡和层的传统方法，以及现代的 `World Partition`（世界划分）系统。这两种方法最终共享相同的结构基础。它们的主要区别在于如何处理加载和卸载，尤其是在运行时。理解每个系统如何工作对于高效、大规模地开发交互、电影化的项目至关重要。\n\
  \n在传统工作流中，这种层次结构可以通过嵌套在持久关卡中的子关卡进一步扩展。每个子关卡都有自己的层和 `Actor` 集。这种方法通过允许团队在不同关卡之间工作而不产生冲突来支持协作工作流。它广泛应用于游戏和电影，其中环境之间的切换可以通过脚本编写或实时触发。\n\
  \n另一方面，`World Partition` 系统通过提供精简和优化的方法彻底改变了环境构建。该系统支持大型世界并增强了性能管理，通过将关卡划分为区域来促进协作。这允许多个团队成员同时工作而不产生冲突。\n\
  \n在制作阶段选择传统的关卡/子关卡组织还是 `World Partition` 系统至关重要。这一决定影响项目的开发流程和工作流。虽然从传统层次的项目可以转换为\
  \ World Partition，但一旦采用了该方法就无法返回。本章将探讨这些概念，让你清晰理解它们之间的以及对游戏开发的影响。\n\n\n\n\n为了继续本章节的学习，你需要一台安装了\
  \ `Unreal Engine 5.5`（或更高版本）且符合 Epic Games 推荐要求并可连接互联网的 PC：[`dev.epicgames.com/documentation/en-us/unreal-engine/hardware-and-software-specifications-for-unreal-engine`](https://dev.epicgames.com/documentation/en-us/unreal-engine/hardware-and-software-specifications-for-unreal-engine)。\n\
  \n# 使用关卡（Levels）\n\n`Levels`（关卡）是虚幻引擎游戏世界的基石，包含了每一个资产、环境、角色和交互对象。简单来说，组织层次结构从关卡开始，关卡可以包含多个层。每一层组织关卡内的\
  \ `Actors`，并帮助在 `Content Browser` 中保持整洁且模块化的结构。因此，关卡的设计和组织对于叙事进展和游戏体验都至关重要。\n\n\
  在下一节中，我们将介绍有关关卡创建、存储、组织、管理以及通过子关卡（sublevels）和持久关卡（persistent levels）进行交互的方面。\n\n\
  ### 重要说明\n\n本节面向新用户，将涵盖虚幻引擎中关卡创建的基础知识（即创建、保存和打开关卡）。如果你已经熟悉这些概念，我建议直接跳到 `Managing\
  \ levels`（管理关卡）章节。\n\n## 创建关卡\n\n在虚幻引擎中可以通过多种方式创建关卡：\n\n*   **通过主菜单**：导航至 `File`（文件）\
  \ | `New Level…`（新建关卡…）开始创建新关卡。\n\n![Figure 5.1 – File | New Level…](img/B21600_05_1.png)\n\
  \n图 5.1 – File | New Level…\n\n此操作提供了各种模板来启动你的关卡设计，包括 `Open World`（开放世界）、`Empty\
  \ Open World`（空开放世界）、`Basic`（基础）和 `Empty Level`（空关卡）。\n\n![Figure 5.2 – New Level\
  \ templates](img/B21600_05_2.png)\n\n图 5.2 – New Level templates\n\n每个模板都满足不同的项目需求。\n\
  \n*   **Open World**：包含示例内容的关卡，利用 `World Partition` 功能构建一个庞大的、可流式的开放世界。\n*   **Empty\
  \ Open World**：采用 `World Partition` 但不包含任何内容的关卡。\n*   **Basic**：配备了平面图、照明、大气和指数雾的关卡。\n\
  *   **Empty Level**：完全没有任何内容的关卡。\n\n要创建一个新的标准关卡，请选择 `Basic` 或 `Empty Level`。一旦完成后，按下\
  \ `Create`（创建），将加载一个新的关卡供你开始工作。\n\n*   **通过 Content Browser**：右键点击并选择 `Create Basic\
  \ Asset`（创建基础资产） | `Level`（关卡）。这种方法无法访问虚幻引擎预定义的关卡模板，并创建一个空关卡，如果你了解自己的需求，这是一种更直接的方法。\n\
  \n![Figure 5.3 – Content Browser | Level](img/B21600_05_3.png)\n\n图 5.3 – Content\
  \ Browser | Level\n\n## 保存关卡\n\n与其他资产一样，你需要在关闭虚幻引擎或切换到另一个关卡时保存关卡以保留你的更改。你可以使用以下方法之一保存关卡：\n\
  \n*   从主菜单中，进入 `File`（文件），然后选择 `Save Current Level`（保存当前关卡）\n*   使用快捷键 `Ctrl` +\
  \ `S`（Windows）或 `Cmd` + `S`（Mac）\n\n如果是你第一次保存关卡，请为 `Level Asset`（关卡资产）指定位置和名称。\n\
  \n## 打开关卡\n\n可以通过以下方式访问关卡：\n\n*   在 `Content Browser` 中定位并双击它们\n*   导航至 `File`（文件）\
  \ | `Open Level`（打开关卡），然后从项目资产中选择所需的关卡\n\n## 管理关卡\n\n`Levels` 窗口是管理项目分级关卡结构的枢纽，包括持久关卡和任何子关卡。可以通过\
  \ `Window`（窗口） | `Levels` 访问此窗口：\n\n![Figure 5.4 – Levels tab](img/B21600_05_4.png)\n\
  \n图 5.4 – Levels tab\n\n此界面允许对关卡进行添加、组织和可见性管理，简化了开发流程，特别是在处理复杂环境或大型开发团队工作时。\n\n\
  ### 持久关卡与子关卡\n\n`Persistent Level`（持久关卡）充主主卡。\n\n![Figure 5.5 – Persistent Level](img/B21600_05_5.png)\n\
  \n图 5.5 – Persistent Level\n\n同时，子关卡可以通过各种方法动态加载，例如 `Level Streaming Volumes`（关卡流式体积）、`Blueprints`（蓝图）或\
  \ `C++ 代码`。这使得关卡设计能够模块化。\n\n### 可见性和操作\n\n你可以通过右键点击 `Levels` 标签页中的任何关卡/子关卡来选择不同的操作。\n\
  \n![Figure 5.6 – Level operations](img/B21600_05_6.png)\n\n图 5.6 – Level operations\n\
  \n你还可以点击关卡名称左侧的 `eye`（眼睛）图标来开启或关闭关卡的可见性。\n\n![Figure 5.7 – Visibility](img/B21600_05_7.png)\n\
  \n图 5.7 – Visibility\n\n调整关卡的可见性仅用于查看目的，不会影响关卡在执行期间是否会流式传输到游戏中。然而，如果关卡在此处不可见，在重构期间将不受影响。如果你已经创建了并嵌套在持久关卡中的子关卡，可以按照以下步骤将任何\
  \ `Actors` 移动到另一个：\n\n1.  选择你想让 `Actors` 迁移到的关卡。\n2.  进入 `Outliner`（大纲）并选择所有你想迁移的\
  \ `Actors`。\n3.  右键点击它们并选择 `Move Selected Actors to Level`（将选定的 Actor 移动到关卡）。\n\n\
  ## 关卡详情\n\n`Levels` 窗口中由 `pencil`（铅笔）图标显示的 `Level Details`（关卡详情）按钮提供了当前关卡的额外信息。持久关卡不显示额外细节，但你可以使用下拉菜单切换到另一个关卡。对于子关卡，你可以调整位置、旋转、流式体积和调试颜色等参数。还可用高级设置，例如为了更好的性能设置最小卸载请求时间。\n\
  \n## 关卡流式传输\n\n**Level streaming**（关卡流式传输）在游戏过程中异步加载和卸载关卡，以减少内存占用并创建无缝的世界。这一过程使我们能够在游戏期间将地图文件加载/卸载到内存中，并切换它们的可见性。通过将世界分成更小的部分，只有需要时的部分部分会被渲染并占用资源。\n\
  \n### 关卡流式传输选项\n\n在虚幻引擎中，流式传输选项控制关卡和内容在游戏过程中如何加载和显示。这些选项对于优化性能和确保无缝的体验至关重要，特别是在流式传输的情况下。让我们概述后续章节常用的流式传输选项。\n\
  \n#### Always Loaded（始终加载）\n\n标记为此选项的关卡会在游戏开始时始终加载到内存中，并在游戏期间保持加载。这通常用于始终需要的内容，例如核心游戏机制或持久环境。\n\
  \n#### Blueprint（蓝图）\n\n此选项允许根据蓝图中定义的条件或事件加载或卸载关卡，为开发者提供了根据玩家操作、游戏状态变化或其他游戏事件进行动态内容加载精确控制。\n\
  \n#### Level Streaming Volumes（关卡流式体积）\n\n在虚幻引擎中，`Level Streaming Volumes` 根据玩家的位置控制关卡的流式传输。这些体积决定了何时加载或卸载关卡，简化了关卡管理。基于体积的流式传输比脚本方法更容易使用，并且可以根据需要调整体积大小，确保随着游戏的演变实现平滑过渡。\n\
  \n使用 Level Streaming Volumes 的两个主要目的是：\n\n\n\n\n\n*   **游戏内行为**：当玩家视角进入 `Level Streaming\
  \ Volume`（关卡流送体积）时，关联关卡会被加载到游戏中，变为激活并可交互状态。当玩家离开该体积时，关卡将卸载并从活动内存中移除。这种方法确保只加载游戏世界的相关部分，从而优化了资源使用和性能。\n\
  *   **编辑器预览**：在 Unreal Editor 中，`Level Streaming Volumes` 模拟了游戏中的关卡加载和卸载行为。这允许开发者根据编辑器内相机的位置预览关卡的显示效果和功能，从而简化了关卡设计和测试流程。\n\
  \n管理关卡流送的另一个功能是，在无法通过其他方式实现的情况下（例如使用预计算光照），更改项目中的一天时间。这就是光照场景（lighting scenarios）发挥作用的地方。\n\
  \n# 探索光照场景\n\nUnreal Engine 支持预计算光照场景，允许在一个关卡中设置多种光照方案。这可以将实时光照与高效的预计算光照相结合，允许开发者无需实时计算即可在昼夜循环等光照配置之间切换，在保持性能的同时增强视觉效果。\n\
  \n你可以在 `Levels` 窗口中通过对想要修改的关卡进行`右键点击`找到这些选项，如下截图所示：\n\n![Figure 5.9 – Lighting Scenario](img/B21600_05_9.png)\n\
  图 5.9 – 光照场景\n\n现在让我们来看一下预计算光照场景的关键方面：\n\n*   **灵活性与视觉质量**：预计算光照场景模拟了关卡内的动态光照环境，提供了与实时光照相当的视觉丰富性。这种方法在氛围和情绪不断变化的游戏中具有优势，能为玩家提供沉浸式体验。\n\
  *   **效率**：由于光照是预计算的，游戏利用高度优化的光照图（lightmap）数据，显著减少了游戏过程中的计算负载。这种效率使得从高端 PC 到移动设备等各种硬件上都能实现高质量的光照效果。\n\
  \n在配置光照场景时，我们可以与关卡光照和阴影相关的信息分开。这种方法是一种管理硬件资源的简单方式，允许引擎根据需要仅加载和应用每个关卡的构建数据。\n\n如果你需要进一步分离或组织同一关卡内\
  \ `Actors`（参与者）的信息，还有其他策略可用，例如图层（layers），我们将在接下来讨论。\n\n# 使用图层\n\nUnreal Engine 中的\
  \ `Layers`（图层）面板组织了关卡内的 `Actors`，使得复杂场景的导航和编辑变得更容易。`Actors` 可以同时位于多个图层中，允许灵活分类。从开始使用结构良好的图层系统可以提高效率和组织性。总之，`Layers`\
  \ 面板对于管理大型关卡至关重要，确保了对游戏环境的控制以及流畅的流程。\n\n创建和管理 `Layers` 的过程与其他 3D 设计或数字内容创作（DCC）程序非常相似。你需要访问\
  \ `Layers` 菜单来创建和管理它们。让我们看看如何操作。\n\n## 创建图层\n\n要访问 Unreal Engine 中的 `Layers` 面板，请前往菜单栏中的\
  \ `Window` | `Layers`。此面板对于管理你关卡内 `Actors` 的可见性和组织至关重要。\n\n![Figure 5.10 – Layers\
  \ tab](img/B21600_05_10.png)\n图 5.10 – 图层标签页\n\n在 `Layers` 面板中，你可以从头创建新图层，也可以通过对\
  \ `Outliner` 中选中的 `Actors` 进行分组来创建，帮助组织复杂环境。要重命名图层，对其进行`右键点击`并选择 `Rename` 选项。这简化了图层管理，特别是在具有许多分类元素的项目中。\n\
  \n对图层进行`右键点击`还会显示一个包含额外图层管理选项的上下文菜单，包括但不限于以下：\n\n*   **将所选参与者添加到所选图层 (Add Selected\
  \ Actors to Selected Layers)**：此选项可快速将视口或 `Outliner` 中当前选的 `Actors` 分配到选定的图层，便于快速组织。\n\
  *   **选择参与者 (Select Actors)**：此选项可以方便地一次选择图层内的所有 `Actors`，简化批量编辑或检查等流程。\n\n![Figure\
  \ 5.11 – Layer operations](img/B21600_05_11.png)\n图 5.11 – 图层操作\n\n## 使用图层\n\nUnreal\
  \ Engine 中的 `Layers` 面板组织了场景 `Actors` 并提供了每个图层内容的详细视图，包括 `Actors` 的名称和额外细节。这种控制扩展到了单个图层管理，带有可见性切换开关，以便关注场景的特定方面。\n\
  \n![Figure 5.12 – Visibility and layers content](img/B21600_05_12.png)\n图 5.12 –\
  \ 可见性和图层内容\n\n`See Contents` 按钮允许对图层 `Actors` 进行更深层的检查和管理，提高组织和工作流效率。\n\n![Figure\
  \ 5.13 – Content in Layers](img/B21600_05_13.png)\n图 5.13 – 图层中的内容\n\n`Layers` 面板提供了管理\
  \ Unreal Engine 项目的基本工具，无论是精调场景元素还是重构游戏世界。\n\n通过这种方式，我们还可以管理每个图层内的 `Actors`，使组织过程根据需要尽可能详细。这允许通过图层进行宏观组织，并通过单个\
  \ `Actors` 进行微观组织。\n\n![Figure 5.14 – Removing content](img/B21600_05_14.png)\n\
  图 5.14 – 移除内容\n\n到目前，我们讨论了关卡作为结构化和组织项目的基础工具，以及用于在 `Outliner` 中划分 `Actors` 的图层。然而，这些并不是唯一的工具。从\
  \ Unreal Engine 5 开始，引入了一个更灵活、更具扩展性的系统：`World Partition`（世界分区）。\n\n\n\n\n\n* **使用\
  \ Open World 模板创建新关卡**：对于现有项目或添加新关卡，可以使用为 `World Partition` 设计的 `Open World` 模板。它可以简化将\
  \ `World Partition` 特性集成到游戏特定区域的过程。\n\n![Figure 5.1 – Open World New Level template](img/B21600_05_15.png)\n\
  \n图 5.15 – Open World 新关卡模板\n\n* **将现有关卡转换为使用 World Partition**：开发者可以将现有关卡转换为支持\
  \ `World Partition`，增强大规模环境的性能和管理。这涉及修改关卡设置以适应网格单元框架，并追溯将 `World Partition` 的优势应用于之前设计的游戏区域。\n\
  \n每种方法都提供了利用 `World Partition` 的方式，无论是启动新项目、扩展现有游戏，还是优化当前关卡。启用 `World Partition`\
  \ 允许开发者利用虚幻引擎的能力创建沉浸式、广大的游戏世界，并实现高效的资源管理和流畅的玩家体验。\n\n## 使用 World Partition\n\n虚幻引擎中的\
  \ `World Partition` 系统将大型游戏世界压缩到单个持久性关卡文件中，并分为可流式网格单元。它通过仅加载靠近玩家等流源的单元来增强性能，通过动态加载世界的各个部分来最小化资源消耗。\n\
  \n在 `World Partition` 系统中，Actor 的管理基于其在 Actor `Details`（细节）面板中的 `Is Spatially Loaded`（空间加载）设置。启用后，Actor\
  \ 将加载到流源范围内的内存中，确保动态元素被加载以增强玩家的沉浸感。禁用的 Actor 无论与流源的距离都会保持加载状态，确保基本元素始终可用。\n\n虚幻引擎中的\
  \ `World Partition` 在运行时动态加载和卸载网格单元，受 `streaming sources`（流源）和 `runtime grid settings`（运行时网格设置）的影响。\n\
  \n### Streaming sources\n\n流源（例如玩家位置或世界中的指定点）决定了加载行为，确保无缝的游戏体验。这些源默认启用，以确保 `World\
  \ Partition` 系统的流畅运行。\n\n![Figure 5.16 – Enable Streaming Source](img/B21600_05_16.png)\n\
  \n图 5.16 – 启用流源\n\n### Runtime grid settings\n\n`World Partition` 系统中的运行时网格由 `World\
  \ Settings`（世界设置）面板中的设置控制，具体位于 `World Partition Setup` 部分。这些设置决定了网格区域如何初始加载以及如何与流源交互。在开发大型世界时，网格区域初始为未加载状态，标记为\
  \ `Always Loaded`（始终加载）的 Actor 除外，确保环境背景等关键元素在关卡开始时已就绪。\n\n开发者可以灵活地通过 `World Partition`\
  \ 选项卡手动管理网格区域的加载状态，对任何给定时间激活的世界部分进行精确控制。\n\n### 在 World Partition Editor 中加载和卸载区域\n\
  \n`World Partition Editor`可以通过 `Window` | `World Partition` | `World Partition Editor`\
  \ 菜单访问，它提供了一个直接在虚幻编辑器中管理网格单元流的图形化界面。\n\n![Figure 5.17 – How to get the World Partition\
  \ Editor](img/B21600_05_17.png)\n\n图 5.17 – 如何获取 World Partition Editor\n\n该工具对于以下操作至关重要：\n\
  \n* **手动加载和卸载区域**：开发者可以在 `World Partition Editor` 中的网格上`right-click` 以加载或卸载特定区域，便于对游戏世界的结构和优化进行详细控制。\n\
  \n![Figure 5.18 – Loading/unloading regions](img/B21600_05_18.png)\n\n图 5.18 – 加载/卸载区域\n\
  \n* **生成小地图**：你可以通过使用 `Build` 菜单中 `World Partition` 部分的 `Build Minimap` 选项或 `World\
  \ Partition Minimap Builder` 命令，在 `World Partition` 窗口中创建小地图以便于导航。这将生成你的 `World\
  \ Partition` 世界的图像并将其显示在 `World Partition` 窗口中。此小地图简化了对整个游戏世界的概述，有助于网格单元管理。\n\n\
  ![Figure 5.19 – Building Minimaps](img/B21600_05_19.png)\n\n图 5.19 – 构建小地图\n\n创建和管理小地图可能会消耗大量资源，这突显了虚幻引擎\
  \ `World Partition` 系统可以实现的世界的规模和复杂性。\n\n掌握了操作 `World Partition` 的知识后，现在让我们学习它的组件和功能。\n\
  \n## World Partition 的组件和功能\n\n虚幻引擎中的 `World Partition` 通过集成以下组件简化了大型游戏世界的管理和流处理：\n\
  \n* Data Layers（数据层）\n* Level Instancing（关卡实例化）\n* Hierarchical Level of Detail\
  \ (HLOD，层级细节水平)\n* One File Per Actor (OFPA)\n\n这增强了最终游戏的质量和性能，为玩家在探索时提供沉浸且不中断的体验。本节将深入探讨\
  \ `World Partition` 的这些组件和功能，阐明它们如何增强游戏开发工作流。让我们逐查看。\n\n### Data Layers\n\n虚幻引擎\
  \ World Partition 系统中的 `Data Layers` 代表了一种复杂的框架，用于组织和管理游戏世界中的 Actor。该系统便于将 Actor\
  \ 分离到不同的层，这些层可以被单独加载或卸载，从而简化了复杂环境的处理。Data Layers 通过允许直接在关卡编辑器中以及通过蓝图实现的游戏逻辑对游戏资产进行动态控制，增强了开发工作流。\n\
  \n在 `Content Browser`（内容浏览器）中，`right-click` 并导航到 `Miscellaneous`（杂项）类别，那里有 `Data\
  \ Layer` 选项。\n\n![Figure 5.20 – Data Layer in Content Browser](img/B21600_05_20.png)\n\
  \n图 5.20 – 内容浏览器中的 Data Layer\n\n通过在 `Content Browser` 上`right-click`，选择 `Miscellaneous`，然后在菜单中选择\
  \ `Data Layer` 创建新的 Data Layer：\n\n![Figure 5.21 – Creating Data Layers](img/B21600_05_21.png)\n\
  \n图 5.21 – 创建 Data Layers\n\n此新创建的资产需要与 `Data Layer Outliner` 关联，可以在菜单 `Window`\
  \ | `World Partition` | `Data Layer Outliner` 中找到。这将显示以下屏幕：\n\n![Figure 5.22 – How\
  \ to add Actors to Data Layers and all of its options](img/B21600_05_22.png)\n\n\
  图 5.22 – 如何将 Actor 添加到 Data Layers 及其所有选项\n\nData Layers 简化了协作和资产管理，减少了大型项目中的版本控制问题和冲突。\n\
  \n\n\n\n\n关卡实例化（Level Instancing）是一种旨在增强和简化关卡编辑体验的工作流，它允许你使用一个或多个 `Actors` 来创建关卡实例（Level\
  \ Instances Instances），这些实例可以在你的世界中放置并重复。这种工作流提供了许多优势，例如情境编辑（in-context editing），让你能够立即看到更改对世界产生的影响，并在保存时将其中一个实例的更改传播到所有实例中。它还实现了高效的复制，允许你快速创建任何静态网格布局的模板，包括兴趣点、建筑和游戏性设置。我将按照引擎本身的方式来介绍它。\n\
  \n## HLOD 系统\n\n`HLOD 系统` 是虚幻引擎 `World Partition`（世界分区）系统不可或缺的一部分，旨在优化大型开放世界游戏的性能。它通过动态管理远端非交互对象（如山脉、树木和悬崖）的细节水平来实现这一点，确保它们在保持可见的同时不会显著影响性能。\n\
  \n### 在 World Partition 中实现 HLOD\n\n在 `World Partition` 中，HLOD 系统将许多 `Static Mesh\
  \ Actors` 组织到自定义层中。这些层为一组对象创建一个的代理网格（proxy mesh）和材质，视觉上表示未卸载的网格单元。这减少了每帧的绘制调用（draw\
  \ calls），对于大型游戏环境的性能至关重要。\n\n需要注意的是，某些世界组件（如景观和水）由于其动态性质或复杂性，与 `HLOD Actors` 不兼容。\n\
  \n### 创建 HLOD 层\n\n要使用 HLOD 系统，开发者需要在 `Content Browser`（内容浏览器）下的 `Miscellaneous`\
  \ 类别中创建一个新的 `HLOD layer asset`。命名后，该资产将有助于管理和优化 `Static Mesh Actors`。\n\n![Figure\
  \ 5.23 – HLOD layer](img/B21600_05_23.png)\n\n图 5.23 – HLOD 层\n\n这些是 HLOD 层的类型：\n\
  \n*   `Instancing`（实例化）：这种方法使用其最低的 `Level of Detail` (`LOD`) 设置将 `Static Mesh` 资产转换为\
  \ `Instanced Static Mesh` (`ISM`) 组件。它非常适合高效创建代表树木和植被等对象的冒充网格（impostor meshes）。\n\
  *   `Merged Mesh`（合并网格）：在此层类型中，多个 `Static Mesh` 资产合并合并单个代理网格，从而简化渲染。\n*   `Simplified\
  \ Mesh`（简化网格）：与 `Merged Mesh` 层类似，它将 `Static Mesh` 资产组合成单个代理网格。然而，它还简化了网格以降低复杂度并提高性能。\n\
  \n### 使用 HLOD 层\n\n要创建 HLOD 代理网格，通过选择 `Static Mesh Actors` 并指定相应的层来将其分配到 HLOD 层。这简化了详细世界的管理。分配后，执行命令脚本（commandlet）来生成代理几何结构，减少远端对象的渲染负载。这对于大规模环境至关重要，确保了远端区域的表示而不会让系统过载。\n\
  \n![Figure 5.24 – Actor Details for HLOD Layer](img/B21600_05_24.png)\n\n图 5.24\
  \ – HLOD 层的 Actor 细节\n\n通过在 `World Partition` 系统中利用 `HLOD Layer`，开发者可以显著提升虚幻引擎项目的性能，特别是那些包含广阔开放世界的项目。该系统不仅优化了远端对象的渲染方式，还通过为管理各种游戏组件的\
  \ LOD 提供清晰的框架，简化了开发流程。\n\n## 每个 Actor 一个文件的策略\n\n虚幻引擎中的 `OFPA` 策略通过将每个 `Actor` 分配到其自己的文件中，简化了大型关卡管理和协作。这减少了多个用户在同一关卡上工作时的复杂性和冲突。OFPA`\
  \ 简化了开发并提高了与源控制系统的配合效率。\n\n以下是 `OFPA` 策略的一些优势：\n\n*   `减少协作中的重叠`：`OFPA` 通过将更改隔离在单个\
  \ `Actor` 文件中，最大限度减少减少源控制中的合并冲突。这允许同时处理关卡的不同部分，而不会覆盖彼此的工作。\n*   `增强源控制效率`：隔离 `Actor`\
  \ 更改使得源控制操作更易于管理，特别是对于拥有众多贡献者的大型项目。\n*   `简化关卡修改`：对 `Actors` 的修改不需要重新保存整个关卡，加速了迭代过程，并有助于游戏元素的测试和精炼。\n\
  \n`World Partition` 通过自动化流送和分区，使得虚幻引擎中大型环境的管理变得更加简单。它消除了对手动子关卡（sublevels）的需求，提升了性能和开发效率。这允许开发者专注于设计和游戏性。无论是启动新项目、转换关卡还是调整设置，`World\
  \ Partition` 都提供了所需的工具来简化工作流并提高游戏世界的可扩展性与性能。\n\n# 练习 5.1：关卡系统的设置与配置\n\n在本次练习中，我们将从零创建一个关卡系统。我们将学习使用\
  \ `Streaming Volume`（流送音体）添加新关卡的步骤，以便根据角色的位置加载和卸载它们。让我们看看如何实现这一目标。\n\n## 设置关卡和子关卡\n\
  \n在开始之前，在项目中创建一个根文件夹，我们将在其中创建即将生成的关卡：\n\n1.  对于这次练习，让我们创建两个关卡：一个使用 `Basic` 模板，另一个使用\
  \ `Empty Level` 模板。这将确保两个关卡都具有基础的光照条件。\n2.  将你需要的任何资产放入第二个关卡。记得在 `Levels` 标签中添加你的子关卡，并确保在放入内容时关卡处于\
  \ `blue` 状态，表示它处于正确的关卡层。你可以通过右键点击 `World Outliner`（世界大纲）并启用 `Level` 列来检查放置了哪些关卡资产。\n\
  3.  在我们的沙箱中放置资产后，确保已为测试设置了 `GameMode`。进入 `World Settings`（世界设置），并在 `Game Mode` 部分的\
  \ `GameMode Override` 下选择 `GameMode`。\n\n## 使用 Streaming Volumes 加载和卸载关卡\n\n为了启用\
  \ `Level Streaming Volume`，你需要遵循以下步骤：\n\n1.  双击选择持久关卡。它将显示为 `blue`。\n2.  然后，在关卡中添加\
  \ `Level Streaming Volume`覆盖需要加载的整个区域。\n\n![Figure 5.25 – Level Streaming Volume](img/B21600_05_25.png)\n\
  \n图 5.25 – Level Streaming Volume\n\n3.  添加后，它看起来应该是这样的：\n\n![Figure 5.26 – Level\
  \ Streaming Volume in Level Editor](img/B21600_05_26.png)\n\n图 5.26 – 编辑器中的 Level\
  \ Streaming Volume\n\n4.  接下来，通过从 `Levels` 标签中选择子关卡来访问关卡细节。\n\n![Figure 5.27 – Loading\
  \ the level details](img/B21600_05_27.png)\n\n图 5.27 – 加载关卡细节\n\n5.  然后，向 `Streaming\
  \ Volume` 中添加一个新数组并选择将使用的实际 `Level Streaming Volume` (LSV)：\n\n![Figure 5.28 – Choosing\
  \ the LSV](img/B21600_05_28.png)\n\n图 5.28 – 选择 LSV\n\n6.  确保 `Initially Loaded`（初始加载）和\
  \ `Initially Visible`（初始可见）复选框未勾选。\n7.  完成后，返回视图并选择 `Level Streaming Volume`。在 `Details`\
  \ 面板中，设置该音体的以下属性：\n    *   `Editor Pre Vis Only`：未勾选\n    *   `Disabled`：未勾选\n \
  \   *   `Streaming Usage`：`SVB Visibility Blocking on Load`\n\n\n\n\n\n2. 尝试将 `Streaming\
  \ Usage` 修改为 `SVB Loading not Visible`。检查其差异。\n\n通过这个简单的练习，我们在 Unreal Engine 中创建了一套关卡加载和卸载系统。这些系统有助于减少我们项目中的计算负载，甚至可以在开发或关卡设计阶段作为临时工具使用。\n\
  \n# 选择正确的关卡管理方法\n\n本章介绍的所有系统和工具都必须根据你项目的特定目标、开发工作流以及团队的规模和结构来使用。\n\n无论你是在构建浸式世界，还是在实现跨学科协作，清晰地理解关卡（Levels）、子关卡（Sublevels）和层（Layers）是如何协同工作的，对于任何制作流程都是至关重要的。良好的结构不仅可以提高组织性和性能，还能确保更顺的协作和扩展性。\n\
  \n## 关卡管理的核心系统\n\n为了帮助视觉化这些系统是如何相互连接的，以下概念思维导图概述了 Unreal Engine 中关卡管理的三个核心层：\n\n\
  *   **Levels（基础结构）**：\n    *   将你的世界组织为持久关卡和子关卡\n    *   为动态条件启用光照场景\n*   **Layers（Actor\
  \ 组织）**：\n    *   在关卡内分组、过滤和管理 Actors\n    *   分离逻辑、视觉效果和交互性\n*   **World Partition（动态流送系统）**：\n\
  \    *   根据距离和规则自动加载\n    *   使用 Data Layers 管理运行时和编辑器加载\n    *   高效地流送 AI、音频和物理等内容\n\
  \n这种分层的概念视图展示了一个自然的演进过程：从结构基础（`levels`），到编辑和逻辑分组（`layers`），再到关注性能的运行时管理（`World Partition`）。\n\
  \n一个常见的困惑点是 `layers` 和 `Data Layers` 之间的区别。虽然两者都用于分组 Actors，但它们的用途和行为完全不同。Layers\
  \ 纯是组织性的，仅存在于编辑器中。它们帮助你在关卡设计期间管理可见性和结构，但在运行时没有产生影响。相反，Data Layers 是 `World Partition`\
  \ 系统的一部分，允许你在游戏过程中或编辑器会话期间动态加载和卸载 Actors。这使得 Data Layers 对于性能优化和大规模协作至关重要，尤其是在开放世界项目中。\n\
  \n## 选择最合适的工作流\n\n在决定使用哪种系统来管理 Unreal Engine 中的关卡时，项目的规模和复杂度起着重要作用。对于大规模的开放世界项目，`World\
  \ Partition` 通常是最佳选择，因为它具有动态加载能力和对大量资产的高效处理。该系统允许世界区域的无缝流送，这对于像 *Fortnite*（2017\
  \ 年首次发布）和 *霍格沃茨之遗》（2023 年首次发布）这样的游戏至关重要，在这些游戏中，玩家持续穿过广阔的环境而不会遇到性能瓶颈。\n\n另一方面，传统的关卡和子关卡系统更适用于较小的线性游戏，或者对模块化和关卡分离是关键的项目。例如，像\
  \ *Inside*（2016 年首次发布）这样的游戏就有效地使用了这种方法，允许创建孤立且高度控制的环境，非常适合叙事驱动的游戏类型。\n\n此外，诸如 `OFPA`\
  \ 等工具可以显著简化小型和大型项目中的工作流，允许多个团队成员同时在同一个关卡上工作而不会产生冲突。这对于像《战争机器 4》（2016 年首次发布）这样的大型游戏特别有益，在这些游戏中，协作的世界构建对于满足项目截止日期至关重要。\n\
  \n# 总结\n\n本章介绍了 Unreal Engine 用于结构化和管理环境的系统：关卡、层和 `World Partition`。你学习了如何使用持久关卡和子关卡组织项目，如何通过层管理\
  \ Actors，以及通过 `Data Layers`、`HLOD` 和 `OFPA` 等 `World Partition` 工具优化大型开放世界。\n\n\
  本章还引导你完成了带有关卡流送体积（Level Streaming Volumes）的实际设置，并提供了在传统和现代工作流之间进行选择的标准。通过掌握这些系统，你可以构建出适用于线性和开放世界项目的可扩展、高性能的世界。\n\
  \n下一章将引导你如何在 Unreal Engine 中制作浸式环境。它将介绍用于创建真实室外场景的景观工具，涵盖了地形生成。\n\n# 订阅 Game Dev\
