  \ |\n\n# 10\n\n# 设置你的后处理体积\n\n虚幻引擎中的 `Post Process Volume`（`PPV`）是一个多功能且强大的 Actor，旨在让开发者对场景的视觉呈现具有完全控制权。它通过应用后处理效果（如\
  \ `Color Grading`（调色）、`Bloom`（光晕）和 `Depth of Field`（景深））来实现所需的审美效果。\n\n这些效果可以增强真实感，营造氛围，并将玩家的注意力集中在游戏环境中的关键元素。`Post\
  \ Process Volume` 可以设置为影响整个关卡，也可以限制在特定区域，为视觉风格的运用提供了灵活性。\n\n在本章中，我们将涵盖从设置 `Post\
  \ Process Volume` 的基础知识到高级自定义技术的所有内容。你将学习如何配置关键属性、理解混合体积（blending volumes）的作用，并利用它们实现场景内的实时动态变化。在本章结束时，你将掌握在你的开放世界环境中有效实施后处理的知识，使视觉体验能够根据你的创意愿景和游戏需求进行量身定制。\n\
  \n要涵盖的主题包括以下内容：\n\n*   在虚幻引擎中探索 `Post Process Volumes`\n*   调色和色调映射工作流\n*   `Post\
  \ Process Volume` 的性能和帧率考虑因素\n*   练习 10.1：户外场景中的色彩调整\n\n# 技术要求\n\n为了继续本章的学习，你需要一台安装了\
  \ `Unreal Engine 5.5`（或更高版本）的 PC，且需满足 EPIC Games 推荐的配置：[`dev.epicgames.com/documentation/en-us/unreal-engine/hardware-and-software-specifications-for-unreal-engine`](https://dev.epicgames.com/documentation/en-us/unreal-engine/hardware-and-software-specifications-for-unreal-engine)。请确保系统也已连接到互联网。\n\
  \n# 在虚幻引擎中探索后处理体积\n\n要将 `Post Process Volume` 引入你的关卡，你可以使用 `Place Actors` 面板。一旦体积放置在关卡中，`Details`（细节）面板将允许你访问其属性和功能，这些功能根据其功能和影响按分类组织。`Post\
  \ Process Volume` 的特定设置决定了它如何与场景和其他重叠体积进行交互。例如，启用 `Infinite Extent (Unbound)`（无限范围（无边界））选项允许体积影响整个场景，而禁用它则将效果限制在指定区域。此外，当多个体积重叠时，你可以管理它们的交互，以在不同的视觉风格之间创建无缝过渡。\n\
  \n配置和设置 `Post Process Volume` 并没有单一的标准方法。这是因为它在塑造你的项目视觉风格方面起着关键作用，而这通常具有很主观性。因此，我们将首先介绍可用的特定设置，然后深入探讨通用工作流，解释如何修正场景。\n\
  \n`Post Process Volume` 可以在 `Menu`（菜单） | `PLACE ACTORS`（放置 Actor）面板的 `Volumes` 类别中找到，如图\
  \ 10.1 所示：\n\n![图 10.1 – 后处理体积位置](img/B21600_10_01.png)\n\n图 10.1 – 后处理体积位置\n\n\
  一旦添加到我们的关卡中，我们可以看到 `Post Process Volume` 的外观。我们可以看到我们场景中的 `Post Process Volume`\
  \ 是一个没有面的立方体，如图 10.2 所示。我们可以将其留在场景的任何地方（如果我们想让它影响整个关卡），也可以通过它的位置和缩放来确定我们感兴趣的效果区域。\n\
  \n![图 10.2 – 关卡中的后处理体积](img/B21600_10_02.png)\n\n初看之下，`Post Process Volume` 似乎对场景没有显著影响。然而，真正的力量在于\
  \ `Details` 面板，其属性在此发挥作用。在这里，你可以精细调整一系列设置，如曝光、对比度和色彩校正，以塑造环境的最终外观。\n\n# 何时使用后处理体积\n\
  \n所以，你可能会问：为什么要使用 `Post Process Volumes` 呢？后处理是一种快速的、可艺术引导的图层，让你能够统一色调、引导视觉并营造氛围，而无需重建光照或材质。让我们来看一些用例。\n\
  \n*   全局外观控制：使用一个单一的无边界 `Post Process Volume` 来定义项目的基准色调映射、曝光策略和微妙的色彩平衡。\n*   叙事性过渡：使用局部\
  \ `Post Process Volumes` 用于洞穴、室内、水下、梦境——任何玩家跨越边界时感知应该发生变化的区域。\n*   焦点和可读性：轻微的暗角、柔和的局部曝光或节制的\
  \ `Bloom` 以增加主体清晰度，而不会让整个场景过亮。\n\n让我们 true 看看应该谨慎使用 `Post Process Volumes` 的情况：\n\
  \n*   过度处理：厚重的胶片颗粒、强色差和激进的暗角会导致玩家疲劳并降低可读性，特别是在带有大量 UI 的场景中。\n*   VR 和快速游戏：扭曲边缘或增加延迟的效果（例如，深度景深、强烈的镜片效果）会损害舒适度和响应速度。\n\
  *   艺术方向不一致：多个具有冲突设置的局部 `Post Process Volumes` 会导致视觉上的不连续。\n\n\n\n\n既然我们已经知道了后处理体积（Post\
  \ Process Volumes）在何情况下有用以及何情况下会引起问题，我们将检查它们的主要优势和局限性。理解这些权衡将指导你如何在不同场景中应用它们。\n\n\
  以下是使用后处理体积的优点：\n\n*   后处理体积是非破坏性的、实时的且具有高度的艺术可控制性。它们支持平滑混合和分区域的外观创作。\n\n现在，我们将深入探讨使用后处理体积的缺点：\n\
  \n*   某些效果并不是`免费`的；它们会消耗 GPU 资源，如果过度使用可能会损害清晰度。\n*   复杂的重叠需要纪律管理（优先级、混合半径和权重管理）。\n\
  \n与任何视觉工具一样，后处理体积在有意图地使用时最有效。目标是支持玩家体验，而不是让其被淹没。因此，首先决定视觉效果的`intent`（可读性、氛围、引导）。然后应用最少的效果集来实现这一目标。最后，通过移动、战斗、UI\
  \ 和不同的显示器进行持续测试。\n\n## 后处理体积属性\n\n`Post Process Volume` 提供的工具箱非常丰富，这使得该 Actor（`Post\
  \ Process Volume`）对于确定关卡的视觉外观至关重要。`Post Process Volume` 还影响与动态光照、阴影和路径追踪整体设置相关的其他方面。\n\
  \n在本节中，我们将特别关注后处理体积的功能以及影响场景视觉方面的特性。\n\n如果我们进入 `Details` 面板，我们可以看到该 Actor 包含的所有部分，如\
  \ `Figure 10.3` 所示：\n\n![Figure 10.3 – PostProcessVolume properties in the Details\
  \ panel](img/B21600_10_03.png)\n\n图 10.3 – Details 面板中的 PostProcessVolume 属性\n\n\
  在 `Figure 10.3` 显示的属性中，我们现在关注 `Post Process Volume Settings` 并探索其中的下拉属性：\n\n*  \
  \ **Priority（优先级）**：此属性决定体积的优先级级别。在多个体积重叠的情况下，优先级最高的体积优于优先级较低的体积。如果重叠的体积具有相同的优先级，则它们生效的顺序未定义。\n\
  *   **Blend Radius（混合半径）**：定义了体积周围以世界单位为单位的用于混合效果的半径。例如，当玩家移动到体积内时，视觉外观可能与体积外的区域不同。混合半径在体积周围创建了一个过渡区。\n\
  *   **Blend Weight（混合权重）**：控制体积设置的影响程度。值为 `1` 时按全强度应用设置，而值为 `0` 则抵消其效果。\n*   **Enabled（启用）**：此设置控制体积是否影响后处理。启用时，其属性将得到应用并可以与其他体积混合。如果不启用，体积对场景的视觉效果没有影响。\n\
  *   **Infinite Extent (Unbound)（无限范围（无边界））**：此此选项控制是否考虑体积的物理边界。启用时，无论物理尺寸如何，体积都会影响整个场景。如果不启用，体积仅影响其指定边界内的区域。`Infinite\
  \ Extent (Unbound)` 如图 `Figure 10.4` 所示：\n\n![Figure 10.4 – Post Process Volume\
  \ Settings](img/B21600_10_04.png)\n\n图 10.4 – Post Process Volume Settings\n\n##\
  \ 后处理体积特性\n\n在本小节中，我们将探索 `Post Process Volume` 中可用的关键后处理效果。为了测试更改这些值的影响，我们将使用 `Figure\
  \ 10.5` 所示的控制图像。对于后续章节中讨论的每个效果——例如 `Color Grading, Bloom, and Exposure`——调整将应用到此图像上（如果适用），允许我们观察每个设置如何影响场景的视觉效果。\n\
  \n![Figure 10.5 – Post Process Volume control image](img/B21600_10_05.png)\n\n图\
  \ 10.5 – Post Process Volume 控制图像\n\n在选择了基础场景和后处理体积后，让我们逐一查看包含的属性，从 `Lens` 部分开始。\n\
  \n### Note\n\n由于此后处理体积被设置为 `Infinite Extent (Unbound)`，因此不需要对 `Transform` 部分（`Location`、`Rotation`、`Scale`）进行调整。\n\
  \n### Lens 部分\n\n`Lens` 类别包含了模拟相机镜头产生的真实世界效果的属性和设置，如 `Figure 10.6` 所示：\n\n![Figure\
  \ 10.6 – PostProcess Volume Lens settings](img/B21600_10_06.png)\n\n图 10.6 – PostProcess\
  \ Volume Lens settings\n\n让我们来看看这些属性：\n\n*   **Mobile Depth of Field（移动端景深）**：就像真实相机一样，景深根据距离焦点的距离（在焦点前方或后面）对场景应用模糊。这种效果通常用于移动应用程序和游戏，以增强视觉深度和焦点。\n\
  *   **Bloom（光晕）**：`Bloom` 是真实相机中发现的一种光光现象，通过在光源和反射表面周围创建光晕来增强渲染图像的感知真实感。`Bloom`与其他效果（如光晕和污垢遮罩）协同工作，尽管这些效果不受通用的\
  \ `Bloom` 属性处理。在 `Figure 10.7` 中，以 `0.2` 的强度应用 `Bloom` 效果；左侧图像显示 `Standard` 方法，而右侧图像说明了\
  \ `Convolution` 方法：\n\n![Figure 10.7 – Bloom effects](img/B21600_10_07.png)\n\n\
  图 10.7 – Bloom 效果\n*   **Exposure and Local Exposure（曝光与局部曝光）**：引擎自动管理曝光，通常称为 `eye\
  \ adaptation`（眼睛适应），根据视图中的当前亮度调整场景的明暗程度。这种效果模拟了人眼适应不同光照条件的方式，例如从昏暗的室内过渡到明亮的室外，或反之。`Exposure`\
  \ 类别提供了选择曝光方法并控制在给定时间内场景可以变得多亮或多暗的属性。\n\n此外，还有一个名为 `Local Exposure`（局部曝光）的功能，它有自己的一属性。`Local\
  \ Exposure` 允许在艺术家定义的参数内对曝光进行精细调整，利用保留亮度细节的边缘感知数据结构。这在高对比度场景中特别有价值，例如透过门窗可以看到明亮室外的室内环境。\n\
  \n在 `Figure 10.8` 中，你可以看到场景的曝光（`Auto Exposure Histogram`）；`left` 图像的 `Exposure Compensation`\
  \ 为 `-2`，而 `right` 图像应用了 `+2`。\n\n![Figure 10.8 – Exposure – Exposure compensation](img/B21600_10_08.png)\n\
  \n图 10.8 – Exposure – Exposure 补偿\n*   **Chromatic Aberration（色差）**：色差是一种模拟真实相机镜头中看到的色彩偏移的效果。当光线以不同角度进入镜头时，这种现象会导致\
  \ RGB 颜色分离。\n\n在 `Figure 10.9` 中，`Chromatic Aberration` 效果的 `Intensity` 为 `3.0`，`Start\
  \ Offset` 为 `0.8`。效果在图像边缘最为明显：\n\n![Figure 10.9 – Chromatic Aberration](img/B21600_10_09.png)\n\
  \n图 10.9 – Chromatic Aberration\n*   **Dirt Mask（污垢标记）**：`Dirt Mask` 是一种纹理驱动的效果，增强屏幕特定区域的\
  \ `Bloom`。它可以创建相机镜头缺陷的外，如污垢或灰尘。要看到 `Dirt Mask` 效果，必须激活 `Bloom` 效果。\n\n在 `Figure\
  \ 10.10` 中，使用 `T_ScreenDirt02_w` （引擎内置）作为 `Dirt Mask Texture` 来演示 `Dirt Mask` 效果，`Dirt\
  \ Mask Intensity` 为 `75`。\n\n![Figure 10.10 – Dirt Mask](img/B21600_10_10.png)\n\
  \n图 10.10 – Dirt Mask\n\n\n\n\n- **相机 (Camera)**：此类别包含了一组控制相机快门和电影级景深的属性。\n\n- **镜头光晕\
  \ (Lens Flare)**：`Lens Flare` 效果是一种基于图像的技术，用于模拟在观察亮物体时，由于相机镜头的缺陷导致的光散射。与 `Dirt Mask`\
  \ 类似，`Lens Flare` 与 `Bloom` 效果协同工作。\n\n在*图 10.11* 中，`Lens Flare` 效果应用于场景，其 `Intensity`\
  \ 为 `2.0`，`Bokeh Size` 为 `7.15`，`Bokeh Shape` 源自 `Bokeh_5Sides` 图像（包含在引擎中）。\n\n\
  ![Figure 10.11 – Lens Flare effect](img/B21600_10_11.png)\n\n图 10.11 – Lens Flare\
  \ 效果\n\n- **图像特效 (Image Effects)**：这允许开发者应用 `Vignette`（暗角）和 `Sharpen`（锐化）效果，更改场景中最终渲染的图像。\n\
  \n    - **暗角 (Vignette)**：`Vignette` 是一种基于图像的效果，它向图像边缘逐渐淡出，创建一个微妙的无边框窗口，正如我们在*图\
  \ 10.12*中看到的。\n\n    - **暗角强度 (Vignette Intensity)**：此设置控制屏幕角落的变暗程度，以增强暗角效果。值越高，暗角量越多，而值为\
  \ 0 则移除效果。\n\n![Figure 10.12 – Vignette](img/B21600_10_12.png)\n\n图 10.12 – 暗角\n\
  \n到为止，我们已经涵盖了对应 `Lens` 类的后期处理卷（Post Process Volume）参数（参见*图 10.6*）。现在，让我们概述一下专注于`调色\
  \ (Color Grading)` 的工具。\n\n### 调色章节 (Color Grading section)\n\n`Color Grading` 和\
  \ `Film`（胶）类别协同工作，定义项目大部分的视觉风格。`Color Grading` 类别提供了允许对渲染场景进行色彩校正的属性，如*图 10.13*\
  \ 所示：\n\n![Figure 10.13 – Color Grading options for the Post Process Volume](img/B21600_10_13.png)\n\
  \n图 10.13 – 后期处理卷的调色选项\n\n在 `Color Grading` 类别中，你会找到允许控制对比度、颜色、饱和度等的属性，从而对场景的外观提供完全的艺术控制。可用设置包括：\n\
  \n- **色温控制 (Color Temperature Control)**：调整图像的整体暖冷色调。\n\n- **色彩平衡属性 (Color Balance\
  \ Properties)**：这些属性允许对全局色调进行调整，以及特定范围，包括阴影、中间调和高光。\n\n- **杂项 (Miscellaneous)**：其他选项，例如扩展色域和用于更高级调色的`Look-Up\
  \ Tables` (`LUTs`)。\n\n与 `Color Grading` 相关的控制控件分布在多个标签页中。你可以调整图像的温度，应用全局调整，并微调特定的色调（`Shadows`、`Midtones`\
  \ 和 `Highlights`）。在这些部分中，你有能力修改图像的 `Saturation`（饱和度）、`Contrast`（对比度）、`Gamma`（伽马）、`Gain`（增益）和\
  \ `Offset`（偏移量）。此外，在 `Misc` 类别中，你可以找到 `Color Grading LUT` 的设置。\n\n接下来，我们将探索 `Film`\
  \ 部分。\n\n### 胶片章节 (Film section)\n\n`Film` 部分允许你调整图像响应属性，就像它是照摄影胶片一样。在*图 10.14*中，我们可以看到可用选项：\n\
  \n![Figure 10.14 – Film options inside the Post Process Volume details](img/B21600_10_14.png)\n\
  \n图 10.14 – 后期处理卷中的胶片选项\n\n`Film` 类别包含了符合 `学院色彩编码系统` (`ACES`) 标准的属性，确保在各种格式和显示器上具有的色彩表示。这有助于保持源素材的完整性，减少当新媒介出现时对调整的需求。让我们来看下\
  \ `Film` 下的属性：\n\n- **斜率 (Slope)**：这控制色调映射器（tonemapper）使用的 S 曲线的陡度。值越高，陡度越大，导致图像*更暗*，而较低的值会减少陡度，使图像*更亮*。\n\
  \n- **足部 (Toe)**：这调整色调映射器中的暗色调，影响最深阴影的渲染方式。\n\n- **肩部 (Shoulder)**：这调整色调映射器中的亮色调，影响最亮高光的显示方式。\n\
  \n- **黑色裁剪 (Black clip)**：这确定了*黑色*颜色开始丢失细节并截断其值的阈值。\n\n- **白色裁剪 (White clip)**：这设置*白色*颜色开始裁剪的点，导致它们丢失细节。对此设置的调整通常是微妙的。\n\
  \n在下一节中，我们将探索各种`全局光照 (Global Illumination)` 选项及其相关属性。\n\n### 全局光照章节 (Global Illumination\
  \ section)\n\n后期处理卷的另一个关键功能是允许你选择在场景中使用的 `Global Illumination` 方法，并调整与视觉质量和场景性能相关的某些参数。\n\
  \n#### 注意事项 (Important note)\n\n同样重要的是，在 Unreal Engine 5 中创建新项目时，后期处理卷使用的默认 `Global\
  \ Illumination` 方法将是 `Lumen`。\n\n`Global Illumination` 的后期处理卷设置允许你选择应用于场景的动态全局光照类型。高级属性提供了调整某些全局光照方法（如预计算光照）强度和颜色的选项。这些是主要的全局光照方法：\n\
  \n- **Lumen 全局光照与反射 (Lumen Global Illumination and Reflections)**：该方法提供实时全局光照和反射，增强场景的真实性。（UE\
  \ 中默认启用。）\n\n- **屏幕空间 (Beta) (Screen Space)**：这种技术使用屏幕空间数据近似全局光照，平衡性能和视觉质量。\n\n\
  - **光线追踪全局光照 (Ray Tracing Global Illumination)**：该方法利用光线追踪高质量的光照和反射，适用于优先考虑视觉保真的项目。\n\
  \n- **高级 (Advanced)**：在 `Advanced` 部分，你可以调整`间接光颜色` (Indirect Lighting Color) 和 `间接光强度`\
  \ (Indirect Lighting Intensity)。*颜色选择器*允许你更改间接光的颜色，而强度设置则让你能够增加或减少应用于场景的间接光量。\n\n\
  ![Figure 10.15 – Global Illumination options inside the Post Process Volume](img/B21600_10_15.png)\n\
  \n图 10.15 – 后期处理卷中的全局光照选项\n\n此外，还有一个 `Film Grain`（胶片颗粒）效果可以实现以更改场景的整体外观。\n\n###\
  \ 胶片颗粒特效 (Film Grain effect)\n\n`Film Grain` 是一种模拟处理过的摄影胶片外观的光学效果。它可以以微小的随机颗粒形式出现，并为渲染帧增加电影感。\n\
  \n以下是与 `Film Grain` 效果相关的关键属性：\n\n- **胶片颗粒强度 (Film Grain Intensity)**：控制颗粒效果的整体强度；值越高，纹理越明显。\n\
  \n- **胶片颗粒阴影强度 (Film Grain Intensity Shadows)**：调整图像暗部的颗粒可见性。\n\n- **胶片颗粒中间调强度 (Film\
  \ Grain Intensity Midtones)**：定义中间调范围内的颗粒可见性，平衡明暗区域之间的纹理。\n\n- **胶片颗粒高光强度 (Film\
  \ Grain Intensity Highlights)**：设置帧亮部分颗粒的强度。\n\n- **胶片颗粒阴影值 (Film Grain Shadows\
  \ Max)**：限制应用于阴影区域的最大颗粒强度。\n\n- **胶片颗粒高光值 (Film Grain Highlights Max)**：限制高光部分的最大颗粒效果以避免过度曝光噪声。\n\
  \n- **胶片颗粒像素大小 (Film Grain Texel Size)**：决定颗粒图案的比例；值越小产生越精细、密的纹理，而值越大颗粒越粗糙。\n\n\
  - **胶片颗粒纹理 (Film Grain Texture)**：指定用于生成电影感颗粒图案的纹理资产。\n\n在*图 10.16*中，我们可以看到使用以下设置的\
  \ `Film Grain` 效果：`Film Grain Intensity` 设置为 `1`，`Film Grain Texel Size` 设置为 `5`。\n\
  \n\n\n\n![图 10.16 – 后处理体积内的胶片颗粒细节](img/B21600_10_16.png)\n\n图 10.16 – 后处理体积内的胶片颗粒细节\n\
  \n使用 Post Process Volume 的主要优势之一是能够在 Unreal Engine 中实时进行调整并查看结果。这种实时反馈允许你精确地微调场景的视觉效果。\n\
  \n此外，你可以通过将多个 Post Process Volume 相互嵌套并正确应用 `Priority Order`（优先级顺序），尝试在不同属性之间进行不同的过渡。接下来，我们将讨论一种侧重于调色和色调映射调整的工作流。\n\
  \n## 重叠与混合的最佳实践\n\n以下最佳实践将帮助你更有效地构建和组织你的 Post Process Volumes：\n\n*   **从全局开始，后局部**：为曝光和色调映射定义一个稳定的全局\
  \ Post Process Volume（无边界/unbound）。仅为特定的感知目标添加本地 Post Process Volume。\n*   **审慎地使用优先级和混合半径**：在重叠时高优先级胜出；将\
  \ `Blend Radius`（混合半径）设置为 `0` 以避免进入/退出时的跳变（popping）。\n*   **限制堆叠体积的数量**：过多的重叠 Post\
  \ Process Volumes 会增加调试复杂度，并可能产生*浑浊*的视觉效果。尽量更少、更清晰的区域。\n*   **在极端之间设置过渡体积**：在极亮和极暗区域之间放置中间\
  \ Post Process Volume，以平滑曝光过渡（避免眼睛适应的剧烈跳变）。\n*   **记录意图**：在 Post Process Volume\
  \ 的 `Description`（描述）字段中添加一行注释，说明其用途（例如：`Cave cool/low-contrast` 洞穴冷色/低对比）。\n\n\
  一旦你的 Post Process Volumes 结构良好且过渡流畅，下一步是完善图像本身。这就是调色和色调映射发挥作用的地方。\n\n# 调色和色调映射工作流\n\
  \n到此时，我们已经涵盖了 Post Process Volume 内可用的属性和设置。在本节中，我们将讨论一种侧重于调色和色调映射的简单工作流，这将让你能够高效地处理色彩校正和初始图像调整。\n\
  \n`Color grading`（调色）是调整图像颜色和色调值以实现预期美感或氛围的过程。这涉及改变特定颜色的亮度、对比度、饱和度和色调，以创建协调的视觉效果，增强场景的叙事性。\n\
  \n`Tonemapping`（色调映射）则是一种技术，用于将`high dynamic range` (`HDR` 高动态范围）图像中宽的颜色和亮度范围映射到更适合显示的有限动态范围内。此过程有助于保持亮部和暗部的细节，确保最终输出看起来平衡且具有视觉吸引力。\n\
  \n工作流如下所示：\n\n![图 10.17 – 调色和色调映射工作流](img/B21600_10_17.png)\n\n图 10.17 – 调色和色调映射工作流\n\
  \n这些是步骤：\n\n1.  直接在 `Project Settings`（项目设置）中的 `Rendering` 选项卡下关闭 `Auto-Exposure`（自动曝光）。\n\
  2.  在 `Post Process Volume Details`（后处理体积详情）的 `White Balance`（白平衡）下设置色温。\n3.  调整\
  \ `Film`（胶片），这是主要的色调映射器；这将应用于全局 `Global` 项目。\n4.  然后，根据需要进行全局或逐场景的色彩校正。\n5.  如果需要额外的全局色彩调优，可以使用\
  \ `Shadow`（阴影）、`Midtones`（中间调）、`Highlights`（高光）控制。\n\n讨论的参数对场景的视觉外观有很大影响。实现不同的效果并理解需要修改哪些设置需要时间和大量的练习。在进入练习之前，让我们来看\
  \ Post Process Volume 的性能和帧率考虑。\n\n# Post Process Volume 的性能和帧率考虑\n\n后期特效每帧运行。有些是*轻量*的（计算开销小），有些是*重量级*的（开销大）。知道它们的区别有助于你在不牺牲视觉效果的情况下保持流畅的帧率。\n\
  \n## 使用心理模型\n\n在优化之前，通过典型的性能开销对后期特效分类会有帮助。在决定应用哪些效果以及强度多少时，可以使用以下内容作为心理模型。这对于新手或中级用户特别有用：\n\
  \n*   **重量级（慎用）**：`Ray-Traced GI`（光线追踪全局光）、`Circle DOF`（景深）、`Convolution Bloom`（卷积光晕）、高质量的\
  \ `SSAO/SSGI` 以及高品质的 `Lumen`。虽然它们非常适合英雄镜头，但对于快速游戏来说风险很大。\n*   **中等重量（仔细调整）**：默认的\
  \ `Lumen GI/Reflections`、`SSGI`、`SSAO`、`Local Exposure`（局部曝光）、`Motion Blur`（运动模糊）。如果值保守，通常没问题。\n\
  *   **轻量级（通常安全）**：`Color Grading (LUT)`（调色）、微妙的 `Vignette`（暗角）、轻微的 `Chromatic Aberration`（色差）、默认\
  \ `Auto Exposure`、低强度 `Sharpen`（锐化）。\n\n## 如何快速测试\n\n一旦确定了哪些特效可能影响性能，请在场景中验证它们的实际成本。快速且重复的测试将帮助你客观地衡量\
  \ GPU 影响：\n\n1.  建立基准（目标分辨率和屏幕百分比）。运行 `Stat Unit` 和 `Stat GPU`。\n2.  在 Post Process\
  \ Volume 中一次切换一个特效，观察 `GPU` 列（每个通道的时间）。如果帧时间跳跃，说明该特效在你的场景中开销很大。\n3.  在较高的屏幕百分比下重新测试（例如\
  \ 120–150%）。如果成本增加，说明该特效随分辨率缩放。\n4.  更改后，检查 UI-HUD 的可读性和舒适度（特别是 VR 和竞技模式）。\n\n考虑到性能因素，现在让我们将注意力从优化转向创作，将这些概念应用到场景中。\n\
  \n# 练习 10.1：户外场景中的色彩调整\n\n让我们通过使用 Post Process Volume 给场景一个独特的观，将我们学到的概念付诸实践：\n\n\
  1.  首先，通过 `Place Actors` 菜单向场景添加 Post Process Volume。将其设置为 `Infinite Extent (Unbound)`（无限范围/无边界），以便它影响整个场景，如图\
  \ 10.18 所示：\n\n![图 10.18 – 范围](img/B21600_10_18.png)\n\n图 10.18 – 范围\n\n2.  将 `Temperature\
  \ Type` 设置为 `Color Temperature`（色温），将 `Temp` 设置为 `8000`，并调整 `Tint`（色调）为 `0.48`：\n\
  \n![图 10.19 – 设置期望色温](img/B21600_10_19.png)\n\n图 10.19 – 设置期望色温\n\n3.  接下来，将 `Global`（全局）色彩校正设置为\
  \ `1.1`，并将 `Contrast`（对比度）设置为 `1.2`：\n\n![图 10.20 – 色彩调整](img/B21600_10_20.png)\n\
  \n图 10.20 – 色彩调整\n\n4.  现在对 Post Process Volume 做一些辅助更改。我们可以添加 `Bloom`（光晕）、`Chromatic\
  \ Aberration`（色差）和其他让场景脱颖而出的特效。在图 10.21 中，你可以看到对场景的额外调整，调整 `Bloom`、`Lens Flare`（镜光）以及\
  \ `Dirt Mask`（污迹边缘）：\n\n![图 10.21 – 调整](img/B21600_10_21.png)\n\n图 10.21 – 调整\n\n\
  所有这些调整都取决于你尝试实现的特定场景和效果。关键是遵循结构化的工作流，以确保每一步都建立在上一步的基础上，从而实现统一的视觉风格，如图 10.22 所示：\n\
  \n![图 10.22 – 后处理体积的控制图像](img/B21600_10_22.png)\n\n图 10.22 – 后处理体积的控制图像\n\n\n\n\
  当我们谈论颜色调整时，并没有唯一的正确答案。事实上，由于多种因素的影响，两位艺术家可能会为同一个场景产生完全不同的视觉效果。关键在于遵循一种组织良好的工作流，在项目开发过程中不会阻碍后续步骤。这确保了创作过程的更加顺畅，并允许在保持整个项目一致性的同时，在实现预期审美方面具有灵活性。\n\
  \n# 总结\n\n在本章中，我们探索了 `Post Process Volume` 在塑造场景视觉方面的重要性，因为它在定义最终外观方面起着至关重要的作用。我们涵盖了它如何在局部和全局范围内影响场景、如何混合不同的\
  \ `Post Process Volumes`，并重点关注与颜色调整相关的控制。我们还强调了 `Post Process Volume` 在管理场景光照方面的重要性，并在工作流中测试了所有控制，以开发出场景的最终效果。\n\
  \n作为最后的建议，`Post Process Volume` 应该始终存在于你的场景中。它是一个强大的 Actor，允许对效果和光照进行简单调整。即使在开发过程中，进行临时调整以促进进度也是至关重要的。\n\
