  \n`constexpr` 修饰符是 C++ 中一个灵活的工具，允许我们在编译时和运行时运行函数。如果我们想确保函数仅在编译时求值，可以使用 `consteval`\
  \ 修饰符。\n\n## consteval 修饰符\n\n`consteval` 修饰符应用于函数。它指定函数仅在编译时求值。这防止了函数在运行时意外运行，这种情况在\
  \ `constexpr` 函数中可能会发生。\n\n如果我们想确保函数仅在编译时求值，可以使用 `consteval` 修饰符。\n\n现在，让我们来看这个例子：\n\
  \n```cpp\nconsteval square(int x) {\n    return x*x;\n}\n\nint main() {\n    constexpr\
  \ int arg = 2;\n    int ret = square(arg);\n    return ret;\n}\n```\n\n如果你在 Compiler\
  \ Explorer 中运行此示例，它将返回 `4` 并生成很小的汇编代码。但是如果我们现在从变量 `arg` 移除 `constexpr` 修饰符，编译将会报错：\n\
  \n```cpp\nconsteval square(int x) {\n    return x*x;\n}\n\nint main() {\n    int\
  \ arg = 2;\n    int ret = square(arg);\n    return ret;\n}\n```\n\n```\n<source>:\
  \ In function 'main()':\n<source>:7:21: error: call to consteval function 'square(arg)'\
  \ is not a constant expression\n    7     int ret = square(arg);\n             \
  \        ~~~~~~\n<source>:7:21: error: the value of 'arg' is not usable in constant\
  \ expression\n<source>:6:9: note: 'int arg' is not const\n    6     int arg = 2;\n\
  ```\n\n\n\n\n* 第 16 章, 设计可扩展有限状态机\n* 第 17 章, 库与框架\n* 第 18 章, 交叉开发\n\n# 12\n\n# 编写\
  \ C++ HAL\n\n**硬件抽象层**（**HAL**, Hardware Abstraction Layer）是嵌入式项目中的核心软件组件。它通过提供一个抽象硬件细节的易用接口，简化了与硬件外设的交互。HAL\
  \ 负责内存映射外设寄存器的读写，允许你直接使用 GPIO、定时器和串口通信接口等外设，而无需直接处理底层的硬件细节。它通常支持同一家族内的多个设备。\n\n\
  通过使用 `HAL`，固件在不同设备以及来自同一供应商的相似系列之间更具可移植性。它隐藏了内存映射外设的寄存器布局，使得在各种设备上复用驱动程序和业务逻辑变得更容易。HAL\
  \ 处理平台特定的细节，使开发者能够关注应用程序而非硬件细微差别。它还管理不同系列**微控制器**（**MCU**）之间的差异。\n\n建议使用供应商提供的 HAL（通常以\
  \ C 库的形式提供），因为它们经过充分测试并定期维护。尽管如此，在某些情况下可能需要直接与内存映射外设进行工作，因此在本章中，我们将探索一些 C++ 技术，帮助你编写更安全、表达更丰富的\
  \ HAL。本章将涵盖以下主题：\n\n* 内存映射外设\n* 定时器\n\n## 技术要求\n\n本章的示例可以在 GitHub ([`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter12`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter12))\
  \ 上找到。为了充分利用本章内容，请在 Renode 模拟器中运行示例。\n\n## 内存映射外设\n\n**内存映射外设**允许程序通过读写特定的内存地址来控制硬件设备。外设寄存器和\
  \ RAM 被映射到同一个地址空间，使得与硬件寄存器的通信就像读写指向这些位置的指针一样简单。\n\n在书中之前的示例中，我们使用了 ST 提供的、用 C 编写的\
  \ HAL，它通过**通用微控制器软件接口标准**（**CMSIS**, Common Microcontroller Software Interface Standard）头文件控制硬件外设。\n\
  \nCMSIS 是适用于基于 Arm Cortex 的微控制器的独立厂商 HAL 和软件库集合。它由 Arm 开发，标准化了硬件访问和配置，简化了软件开发并提高了在不同制造商之间代码的可移植性。每个微控制器供应商都提供自己的\
  \ CMSIS 实现，将核心 API 和驱动程序适配到其特定设备。接下来，我们将探索 STM32F072 微控制器访问内存映射外设的 CMSIS 实现。\n\n\
  ### CMSIS 内存映射外设\n\nCMSIS 对寄存器的访问通过指向结构体的指针进行建模，结构体描述了寄存器布局。CMSIS 定义了表示内存映射外设指针的宏。\n\
  \n根据 CMSIS 命名规范，结构体使用外设名称缩写和 `_TypeDef` 后缀命名。**复位时钟控制**（**RCC**）外设结构体命名为 `RCC_TypeDef`。它定义示例项目的\
  \ `platform/CMSIS/Device/ST/STM32F0xx/Include/stm32f072xb.h` 文件中，如下：\n\n```\ntypedef\
  \ struct\n{\n  __IO uint32_t CR;         /* Address offset: 0x00 */\n  __IO uint32_t\
  \ CFGR;      /* Address offset: 0x04 */\n  __IO uint32_t CIR;       /* Address offset:\
  \ 0x08 */\n  __IO uint32_t APB2RSTR;  /* Address offset: 0x0C */\n  __IO uint32_t\
  \ APB1RSTR;  /* Address offset: 0x10 */\n  __IO uint32_t AHBENR;    /* Address offset:\
  \ 0x14 */ \n  __IO uint32_t APB2ENR;   /* Address offset: 0x18 */ \n  __IO uint32_t\
  \ APB1ENR;   /* Address offset: 0x1C */  \n  __IO uint32_t BDCR;      /* Address\
  \ offset: 0x20 */  \n  __IO uint32_t CSR;       /* Address offset: 0x24 */   \n\
  \  __IO uint32_t AHBRSTR;   /* Address offset: 0x28 */  \n  __IO uint32_t CFGR2;\
  \     /* Address offset: 0x2C */\n  __IO uint32_t CFGR3;     /* Address offset:\
  \ 0x30 */\n  __IO uint32_t CR2;       /* Address offset: 0x34 */\n} RCC_TypeDef;\n\
  ```\n\n在同一个头文件中，除了 `RCC_TypeDef` 结构体，还定义了以下宏：\n\n```\n#define PERIPH_BASE      \
  \     0x40000000UL\n/*!< Peripheral memory map */\n#define APBPERIPH_BASE      \
  \  PERIPH_BASE\n#define AHBPERIPH_BASE       (PERIPH_BASE + 0x00020000UL)\n/*!<\
  \ AHB peripherals */\n#define RCC_BASE            (AHBPERIPH_BASE + 0x00001000UL)\n\
  /*!< Peripheral_declaration */\n#define RCC                 ((RCC_TypeDef *) RCC_BASE)\n\
  ```\n\n这段代码是 CMSIS 的一部分，在 `stm32f072xb.h` 头文件中与 `RCC_TypeDef` 结构体一起使用。\n\n\n\n\n\
  ```\nstruct read_access{};\nstruct write_access{};\nstruct read_write_access : read_access,\
  \ write_access {};\ntemplate<std::uintptr_t Address, typename Access = read_write_access,\
  \ typename T = std::uint32_t>\nstruct reg {\ntemplate <typename Access_ = Access>\n\
  static std::enable_if_t<std::is_base_of_v<read_access, Access_>, T> \nread()\n{\n\
  \    return *reinterpret_cast<volatile T*>(Address);\n}\ntemplate <typename Access_\
  \ = Access>\nstatic std::enable_if_t<std::is_base_of_v<write_access, Access_>, void>\n\
  write(T val)\n{\n    *reinterpret_cast<volatile T*>(Address) = val;\n}\n};\n```\n\
  \n在此段代码中，类模板 `reg` 模拟了一个硬件寄存器。它具有以下模板参数：\n\n*   `uintptr_t Address`：硬件寄存器的内存地址\n\
  *   `typename Access`：寄存器的访问权限（默认为 `read_write_access`）\n*   `typename T`：与寄存器大小匹配的数据类型（默认为\
  \ `std::uint32_t`）\n\n类模板 `reg` 有两个静态方法：`read()` 和 `write()`。它们分别用于从寄存器读取和向寄存器写入数据。这两个方法都使用\
  \ SFINAE 在编译时启用或禁用，这我们在 *第 8 章 中介绍过这种技术。我们使用了以下几种类型的访问控制：\n\n*   `struct read_access`\n\
  *   `struct write_access`\n*   `struct read_write_access`：它继承自 `read_access` 和 `write_access`\n\
  \n为了为了使用 SFINAE 在编译时启用和禁用 `write()` 和 `read()` 方法，我们将这两个方法都制成了模板函数。这允许我们在这些方法的返回类型中使用类模板\
  \ `enable_if`，根据其提供的条件来启用或禁用它们。\n\n`write()` 和 `read()` 的模板参数都是 `Access_`，它默认为 `Access`。它通过使替换依赖于函数自身的模板参数，确保了\
  \ SFINAE 能够正常工作。\n\n我们使用 `std::enable_if_t<std::is_base_of_v<read_access, Access_>,\
  \ T>` 来启用 `read()` 方法。这意味着如果 `std::is_base_of_v<read_access, Access_>` 为真（即如果 `Access_`\
  \ 派自 `read_access` 或等于它），则 `std::enable_if_t` 解析为 `T`，且该函数被启用。否则，它会导致替换失败，该函数不会被包含在重载集中。我们以类似的方式启用\
  \ `write()` 方法，通过检查 `Access_` 类型是否派自 `write_access` 或等于它。\n\n我们使用 `reinterpret_cast<volatile\
  \ T*>` 将整数模板参数 `Address` 转换为指向类型为 `T`（默认为 `std::uint32_t`）的 `volatile` 变量的指针。`volatile`\
  \ 关键字告诉编译器，该内存位置的值可能会在程序控制之外随时改变——通过硬件改变。这防止了编译器应用某些优化，这些优化可能会省略对该地址必要的读写操作。\n\n\
  如果没有 `volatile`，编译器可能会假设对同一地址的多次读取会产生相同的值，或者对该地址的写入可以重排序甚至省略，这在与硬件交互时可能会导致错误行为。\n\
  \n正如我们在 *第 9 章 中讨论的，使用 `reinterpret_cast` 将整数转换为指针在 C++ 中被认为是一种实现定义的行为（implementation-defined\
  \ behavior）。这意味着 C++ 标准没有具体规定它的工作方式，不同的编译器或平台可能会有不同的处理方式。直接写入特定的内存位置在本质上是不安全的，并且依赖于无法保证在所有系统间可移植的行为。因此，我们需要对该解决方案的移植性保持谨慎，因为某些平台可能不同的实现指针转换。\n\
  \n以下是使用类模板 `reg` 的几个示例：\n\n```\nusing rcc = reg<0x40021000>;\nauto val = rcc::read();\
  \ // 正常\nrcc::write(0xDEADBEEF); // 正常\nusing rcc_read = reg<0x40021000, read_access>;\n\
  auto val = rcc_read::read(); // 正常\nrcc_read::write(0xDEADBEEF); // 编译错误，无写权限\n\
  using rcc_write = reg<0x40021000, write_access>;\nauto val = rcc_write::read();\
  \ // 编译错误，无读权限\nrcc_write::write(0xDEADBEEF); // 正常\n```\n\n这些示例演示了所实现的访问内存映射外设备的接口用法。在使用类模板\
  \ `reg` 定义类型时，我们为其提供寄存器的地址；如果我们处理的是只写或只读寄存器，则会提供 `write` 访问权限。默认访问类型允许我们同时拥有读和写权限。\n\
  \n上述解决方案与 CMSIS 方法一样有效。你可以尝试完整示例，并在 Renode 中运行完整示例来比较二进制大小。启动 Visual Studio Code，将其附加到运行中的容器，按照\
  \ *第 4 章 中的描述打开 `Chapter12/cpp_hal` 项目，并运行以下命令：\n\n## C++ 中类型安全的内存映射外设备\n\n\n\n\n\
  \n# 从 RCC 寄存器建模 HSION 和 HSITRIM 位域\n\n让我们检查 STM32F0x2 参考手册中定义的 `RCC CR` 寄存器位域，如\
  \ `图 12.1` 所示。\n\n![图 12.1 – RCC CR 寄存器](img/B22402_12_01.png)\n\n图 12.1 – RCC CR\
  \ 寄存器\n\n`图 12.1` 描述了 `RCC CR` 寄存器中的位域。让我们定义一个结构体 `hsion` 来描述 `RCC CR` 寄存器中的 HSI\
  \ 时钟 `enable` 位域。它在位置 `0` 处只有一个位，因此我们可以对其建模：\n\n```cpp\nusing rcc = reg<0x40021000>;\n\
  struct hsion {\n    using reg = rcc;\n    using T = reg::RegType;\n    static constexpr\
  \ T c_position = 0U;\n    static constexpr T c_mask = (1U << c_position);\n    enum\
  \ class value : T {\n        disable = 0U,\n        enable  = 1U,\n    };\n};\n\
  ```\n\n在此代码中，我们通过提供 `RCC` 寄存器的地址，将类型 `rcc` 声明为类模板 `reg` 的实例。然后，我们创建一个具有以下属性的结构体\
  \ `hsion`：\n\n*   一个公共的 `typedef` 成员 `reg`，将其设置为 `rcc`。得益于 `BitFieldConcept`，这“了”\
  \ `hsion` 到 `rcc` 寄存器。\n*   `constexpr` 变量 `c_position` 和 `c_mask`，用于 `set` 方法的位操作。\n\
  *   一个 `enum` 类 `value`，定义了 `enable` 和 `disable`。\n\n我们可以使用以下代码通过 `hsion` 结构体启用或禁用\
  \ HSI 时钟：\n\n```cpp\nrcc::set<hsion>(hsion::value::enable);\nrcc::set<hsion>(hsion::value::disable);\n\
  ```\n\n这段代码允许我们安全地设置寄存器中的位。它具有很强的表达性：语法 `rcc::set<hsion>(hsion::value::enable);`\
  \ 清晰地表达了意图——将 `rcc` 寄存器上的 `hsion` 位域设置为 `enable`。\n\n正如我们在 `图 12.1` 中看到的，`CR` 寄存器中定义的大多数位域都是\
  \ `enable`/`disable` 位。例外是：\n\n*   `HSICAL[7:0]: HSI 时钟校准`：这些位在启动时自动初始化，并可以通过软件通过\
  \ `HSITRIM` 设置调整。\n*   `HSITRIM[4:0]: HSI 时钟修调`：这些位提供了额外的用户可编程修调值，加到 `HSICAL[7:0]`\
  \ 位上。该设置允许对可能影响 HSI 频率的电压温度变化进行调整。\n\n`HSICAL` 位在启动时初始化，这意味着我们不应该修改它们。`HSITRIM`\
  \ 位是用户可编程的，占用 5 位。在 `BitField` 值的 `enum` 中定义 5 位的所有组合是不现实的，因此我们将通过通过模板参数提供值的方法来处理，如此处的代码所示：\n\
  \n```cpp\ntemplate<auto Bits>\nstruct hsi_trim {\n    using reg = rcc;\n    using\
  \ T = reg::RegType;\n    static_assert(std::is_same_v<T, decltype(Bits)>);\n   \
  \ static constexpr T c_position = 3;\n    static constexpr T c_mask = (0x1F << c_position);\n\
  \    static_assert(Bits <= 0x1F);\n    enum class value : T {\n        val = Bits\n\
  \    };\n};\n```\n\n在此代码中，我们使用 `auto` 模板参数 `Bits` 定义了类模板 `hsitrim`。`auto` 关键字用于指示我们正在使用非类型模板参数。我们使用\
  \ `static_assert` 来确保提供的参数 `Bits` 的类型 (`decltype(Bits)`) 与底层寄存器的类型相同，以满足 `BitFieldConcept`\
  \ 施的要求。\n\n我们用 `Bits` 编码 `enum` 类值 `val`。这把值编码在类型本身中，使其能够与 `reg` 结构体的 `set` 方法配合使用。我们还利用\
  \ `static_assert` 确保提供的值在分配的位数范围内——`static_assert(Bits <= 0x1F)`。再次，我们利用编译时操作来确保类型安全。这里是使用\
  \ `hsitrim` 结构体的示例：\n\n```cpp\nrcc::set<hsi_trim<0xFLU>>(hsi_trim<0xFLU>::value::val);\n\
  ```\n\n这段代码将 `rcc` 寄存器中的 `hstrim` 值设置为 `0xF`。你可以在 Renode 中尝试完整的示例。启动 Visual Studio\
  \ Code，将其附加到运行的容器，打开 `Chapter12/cpp_hal` 项目（如第 4 章 所示），并在 Visual Studio Code 终端中运行以下命令，或直接在容器终端中运行：\n\
  \n```bash\n$ cmake -B build -DCMAKE_BUILD_TYPE=Release -DMAIN_CPP_FILE_NAME=main_type_safe_reg.cpp\n\
  $ cmake --build build --target run_in_renode\n```\n\n## hsion 和 hsi_trim 的通用版本\n\
  \n为了能够复用具有单位的位域，对于像 `hsion` 这样的单位（`enable`/disable`），我们将定义 `reg_bits` 类，如下：\n\n\
  ```cpp\ntemplate<typename Reg, uint32_t Pos>\nstruct reg_bits {\n    using reg =\
  \ Reg;\n    using T = reg::RegType;\n    static constexpr T c_position = Pos;\n\
  \    static constexpr T c_mask = (1U << c_position);\n    enum class value : T {\n\
  \        disable = 0,\n        enable = 1;\n    };\n};\n```\n\n我们可以使用 `reg_bits`\
  \ 定义 `hsion`：\n\n```cpp\nusing hsion = reg_bits<rcc, 0U>;\n```\n\n接下来，对于像 `hstrim`\
  \ 这样具有值的类型，我们将创建一个用的 `reg_bits`。代码如下：\n\n```cpp\ntemplate<auto Bits, typename Reg,\
  \ uint32_t Pos = 0>\nstruct reg_bits {\n    using reg = Reg;\n    using T = reg::RegType;\n\
  \    static_assert(std::is_same_v<T, decltype(Bits)>);\n    static constexpr T c_position\
  \ = Pos;\n    static constexpr T c_mask = (0x1F << c_position);\n    static_assert(Bits\
  \ <= 0x1F);\n    enum class value : T {\n        val = Bits;\n    };\n};\n```\n\n\
  我们可以使用 `reg_bits` 定义 `hstrim`：\n\n```cpp\nusing hsitrim = reg_bits<0xFLU, rcc, 3U>;\n\
  ```\n\n### 定时器\n\n`STM32F7` 有多个定时器，包括 TIM2 和 TIM3。TIM2 是 32 位定时器，而 TIM3 是 16 位定时器。\n\
  \n我们将创建一个依赖于包含定时器特定细节的定时器特征的模板类。这里是定时器特征的代码：\n\n```cpp\nstruct timer2_traits {\n\
  \    constexpr static std::uintptr_t base_address = 0x40000000;\n    constexpr static\
  \ IRQn_Type irqn = TIM2_IRQn;\n    constexpr static std::uint32_t arr_bit_mask =\
  \ 0xFFFFFFFF;\n};\nstruct timer3_traits {\n    constexpr static std::uintptr_t base_address\
  \ = 0x40000400;\n    constexpr static IRQn_Type irqn = TIM3_IRQn;\n    constexpr\
  \ static std::uint32_t arr_bit_mask = 0xFFFF;\n};\n```\n\n接下来，让我们看看定时器模板类：\n\n\n\
  \n\n```cpp\ntemplate <typename TimerTraits>\nstruct timer {\n    constexpr static\
  \ std::uintptr_t base_address =\n                                    TimerTraits::base_address;\n\
  \    using cr1 = reg<base_address + 0x00>;\n    using dier = reg<base_address +\
  \ 0x0C>;\n    using sr = reg<base_address + 0x10>;\n    using psc = reg<base_address\
  \ + 0x28>;\n    using arr = reg<base_address + 0x2C>;\n\n    template<auto Bits>\n\
  \    using psc_bits = reg_bits<Bits, psc, static_cast<uint32_t>(0xFFFF)>;\n    template<auto\
  \ Bits>\n    using arr_bits = reg_bits<Bits, arr, TimerTraits::arr_bit_mask>;\n\
  \    using uie = reg_bits_enable_disable<dier, 0UL>;\n    using cen = reg_bits_enable_disable<cr1,\
  \ 0UL>;\n    using uif = reg_bits_enable_disable<sr, 0UL>;\n    template<std::uint32_t\
  \ Period>\n    static void start() {\n        // a magic number prescaler value\n\
  \        // for 1ms timer resolution\n        constexpr std::uint32_t prescaler\
  \ = 9999;\n        constexpr std::uint32_t auto_reload = Period - 1;\n        psc::template\
  \ set<psc_bits<prescaler>>\n                    (psc_bits<prescaler>::value::val);\n\
  \        arr::template set<arr_bits<auto_reload>>\n                    (arr_bits<auto_reload>::value::val);\n\
  \        dier::template set<uie>(uie::value::enable);\n        NVIC_SetPriority(TimerTraits::irqn,\
  \ 1);\n        NVIC_EnableIRQ(TimerTraits::irqn);\n        cr1::template set<cen>(cen::value::enable);\n\
  \    }\n};\n```\n\n在这段代码中，我们定义了一个带有模板参数 `TimerTraits` 的模板类 `timer` —— 该类是一个提供硬件特定常量的特性的类。`timer`\
  \ 模板类提供了一个通用的接口，用于配置和控制定时器，并通过 `TimerTraits` 为每个特定的定时器进行定制。\n\n请注意，为了示例的简单，这是设置\
  \ STM32 定时器外设所需的最小代码。\n\n在 `timer` 类内部，我们定义了寄存器类型别，如下：\n\n```cpp\nconstexpr static\
  \ std::uintptr_t base_address = TimerTraits::base_address;\nusing cr1 = reg<base_address\
  \ + 0x00>;\nusing dier = reg<base_address + 0x0C>;\nusing sr = reg<base_address\
  \ + 0x10>;\nusing psc = reg<base_address + 0x28>;\nusing arr = reg<base_address\
  \ + 0x2C>;\n```\n\n这些类型别代表定时器的硬件寄存器，每个寄存器映射到特定的内存地址。每个寄存器都是 `reg` 模板类的实例化，提供了对硬件寄存器的读写访问权限。\n\
  \n接下来，我们为位域（`BitFields`）定义了类型别：\n\n```cpp\ntemplate<auto Bits>\nusing psc_bits =\
  \ reg_bits<Bits, psc, static_cast<uint32_t> (0xFFFF)>;\ntemplate<auto Bits>\nusing\
  \ arr_bits = reg_bits<Bits, arr, TimerTraits::arr_bit_mask>;\nusing uie = reg_bits_enable_disable<dier,\
  \ 0UL>;\nusing cen = reg_bits_enable_disable<cr1, 0UL>;\nusing uif = reg_bits_enable_disable<sr,\
  \ 0UL>;\n```\n\n在这段代码中，我们使用模板类 `reg_bits` 和 `reg_bits_enable_disable` 实例化了位域。\n\n\
  最后，我们在模板类 `timer` 中定义了模板静态方法 `start`。该 `static` 函数根据所需的周期设置定时器并启动它。该代码执行了以下步骤：\n\
  \n1. 计算分频器（Prescaler）和自动重载（Auto-Reload）值。该函数使用模板参数 `Period` 来计算这些值。\n2. 设置分频器（PSC）和自动重载（ARR）寄存器。\n\
  3. 在 `DIER` 寄存器上启用更新中断。它使用 `uie` 位域来启用 `DIER` 寄存器中的更新中断。\n4. 使用 CMSIS 函数配置用于定时器中断的\
  \ `NVIC`。\n5. 启动定时器。它使用 `cen` 位域来启用 `CR1` 寄存器中的定时器计数。\n\n现在让我们如何使用提供的定时器模板类：\n\n\
  ```cpp\nusing timer2 = timer<timer2_traits>;\nusing timer3 = timer<timer3_traits>;\n\
  extern \"C\" void TIM2_IRQHandler(void)\n{\n    if (timer2::sr::read() & TIM_SR_UIF)\n\
  \    {\n        timer2::sr::set<timer2::uif> (timer2::uif::value::disable);\n  \
  \      printf(\"TIM2 IRQ..\\r\\n\");\n    }\n}\nextern \"C\" void TIM3_IRQHandler(void)\n\
  {\n    if (timer3::sr::read() & TIM_SR_UIF)\n    {\n        timer3::sr::set<timer3::uif>\
  \ (timer3::uif::value::disable);\n        printf(\"TIM3 IRQ..\\r\\n\");\n    }\n\
  }\nint main()\n{\n    timer2::start<1000>();\n}\n```\n\n\n\n\n在`第 12 章`中，我们探索了使用\
  \ C++ 进行 HAL（硬件抽象层）开发的优势。然而，尽管有这些优势，厂商通常以 C 库的形式提供 HAL。这些库已经在全球范围内数百万设备上经过了充分测试，且厂商通常对其进行良好维护并提供定期更新。因此，直接使用这些库比在\
  \ C++ 中重新实现 HAL 更有意义。\n\n接下来，我们将为 UART 外设设备创建一个基于接口的设计，这将为我们提供更灵活的软件设计，并允许我们把使用\
  \ UART 接口的组件与底层细节解耦。\n\n## 用于灵活软件设计的 UART 接口\n\n在`第 5 章`中，我们涵盖了接口对于灵活软件设计的重要性。在那一章中，我们有了一个\
  \ `uart` 接口类，它由 `uart_stm32` 类实现。`gsm_lib` 类依赖于 `uart` 接口，这意味着我们可以在不同的 `uart` 接口实现上复用它。\n\
  \n来自`第 5 章`的 `uart_stm32` 类仅为了演示目的提供了一个简单的实现。它使用 C 标准库中的 `printf` 和 `putc` 函数向标准输出写入消息。现在，我们将介绍\
  \ `uart_stm32` 类的实际实现，该实现已用于书籍 GitHub 仓库中的所有示例，使使我们能够在 Renode 模拟器中看到输出。让我们从此处所示代码的\
  \ `uart` 接口 `class` 开始：\n\n```cpp\n#include <cstdint>\n#include <span>\nnamespace\
  \ hal\n{\nclass uart\n{\n  public:\n    virtual void init(std::uint32_t baudrate)\
  \ = 0;\n    virtual void write(std::span<const char> data) = 0;\n};\n}; // namespace\
  \ hal\n```\n\n`uart` 接口是一个带有两个虚方法的简单类：\n\n*   `virtual void init(std::uint32_t baudrate)`：用于初始化\
  \ UART 外设的方法，带有一个参数 `baudrate`。\n*   `virtual void write(std::span<const char> data)`：用于通过\
  \ UART 外设发送数据的方法。与通常的 C 方法（使用数据缓冲区指针和长度）不同，它拥有一个 `std::span<const char>` 参数。使用 `std::span`\
  \ 增加了代码的内存安全性。\n\n接下来，让我们查看 `uart_stm32` 类定义：\n\n```cpp\n#include <span>\n#include\
  \ <cstdint>\n#include <uart.hpp>\n#include <stm32f0xx_hal.h>\n#include <stm32f072xb.h>\n\
  namespace hal\n{\nclass uart_stm32 : public uart\n{\n  public:\n    uart_stm32(USART_TypeDef\
  \ *inst);\n    void init(std::uint32_t baudrate = c_baudrate_default);\n    void\
  \ write(std::span<const char> data) override;\n  private:\n    UART_HandleTypeDef\
  \ huart_;\n    USART_TypeDef *instance_;\n    std::uint32_t baudrate_;\n    static\
  \ constexpr std::uint32_t c_baudrate_default = 115200;\n};\n}; // namespace hal\n\
  ```\n\n在 `uart_stm32` 类定义中，我们可以注意到以下点：\n\n*   重写了来自 `uart` 接口的虚方法 `init` 和 `write`。\n\
  *   一个接受 `USART_TypeDef` 指针的构造函数。该类型是在 CMSIS 头文件 `stm32f072xb.h` 中描述 UART 外设寄存器布局的\
  \ `struct`。\n*   在私有成员中，我们看到了 `UART_HandleTypeDef`，这是定义在 `stm32f0xx_hal_uart.h`\
  \ 文件中的类型。\n\n接下来，让我们查看这段代码中 `uart_stm32` 类构造函数和方法的实现：\n\n```cpp\nhal::uart_stm32::uart_stm32(USART_TypeDef\
  \ *inst): instance_(inst)\n{\n}\n```\n\n在这段代码中，我们看到了 `uart_stm32` 构造函数的实现。它使用初始化列表语法设置了私有成员\
  \ `USART_TypeDef *instance_`。CMSIS 定义了宏 `USART1`、`USART2`、`USART3` 和 `USART4`，它们指定了这些外设的地址，我们可以使用它们来初始化\
  \ `uart_stm32` 对象。\n\n`uart` 接口定义了 `init` 方法，因为 UART 外设初始化依赖于其他硬件初始化（即时钟配置）。如果在构造函数中实现初始化，如果有人定义了\
  \ `global` 或 `static` `uart_stm32` 对象，我们可能会遇到问题。`init` 方法所示所示：\n\n```cpp\nvoid hal::uart_stm32::init(std::uint32_t\
  \ baudrate)\n{\n    huart_.Instance = instance_;\n    huart_.Init.BaudRate = baudrate;\n\
  \    huart_.Init.WordLength = UART_WORDLENGTH_8B;\n    huart_.Init.StopBits = UART_STOPBITS_1;\n\
  \    huart_.Init.Parity = UART_PARITY_NONE;\n    huart_.Init.Mode = UART_MODE_TX_RX;\n\
  \    huart_.Init.HwFlowCtl = UART_HWCONTROL_NONE;\n    huart_.Init.OverSampling\
  \ = UART_OVERSAMPLING_16;\n    huart_.Init.AdvancedSampling = UART_DISABLE;\n  \
  \  __HAL_UART_Init(&huart_);\n}\n```\n\n`uart` 接口是一个带有两个虚方法的简单类：\n\n*   `virtual\
  \ void init(std::uint32_t baudrate)`：用于带单个参数 `baudrate` 初始化 UART 外设的方法。\n*   `virtual\
  \ void write(std::span<const char> data)`：用于通过 UART 外设发送数据的方法。与通常使用数据缓冲区指针和长度的 C\
  \ 方法相比，它拥有一个 `std::span<const char>` 参数。使用 `std::span` 增加了代码的内存安全性。\n\n`uart` 接口定义了\
  \ `init` 方法，因为 UART 外设初始化依赖于其他硬件初始化（即时钟配置）。\n\ncpp\nhuart_.Instance = instance_;\n\
  huart_.Init.BaudRate = baudrate\nhuart_.Init.WordLength = UART_WORDLENGTH_8B\nhuart_.Init.StopBits\
  \ = UART_STOPBITS_1\nhuart_.Init.Parity = UART_PARITY_NONE\nhuart_.Init.Mode = UART_MODE_TX_RX\n\
  huart_.Init.HwFlowCtl = UART_HWCONTROL_NONE\nhuart_.Init.OverSampling = UART_OVERSAMPLING_16\n\
  huart_.Init.AdvancedSampling = UART_DISABLE\n__HAL_UART_Init(&huart_);\n\n`uart`\
  \ 接口定义了 `init` 方法，因为 UART 外设初始化依赖于其他硬件初始化（即时钟配置）。如果在构造函数中实现初始化，如果有人定义了 `global`\
  \ 或 `static` `uart_stm32` 对象，我们可能会遇到问题。\n\n接下来，让我们查看 `uart_stm32` 类定义：\n\n```cpp\n\
  void hal::uart_stm32::write(std::span<const char> data)\n{\n    char * data_ptr\
  \ = const_cast<char *>(data.data());\n    HAL_UART_Transmit(&huart_, reinterpret_cast<uint8_t\
  \ *>(data_ptr), data.size(), HAL_MAX_DELAY);\n}\n```\n\n在 `write` 方法中，我们调用了 ST HAL\
  \ 的 `HAL_UART_Transmit` 并传递了指针和大小。值得我们需要去掉 const，因为 `HAL_UART_Transmit` 函数不接受 const\
  \ 指针。\n\n接下来，让我们查看这段代码中 `uart_stm32` 类构造函数和方法的实现：\n\n```cpp\nhal::uart_stm32::uart_stm32(USART_TypeDef\
  \ *inst): instance_(inst)\n{\n}\n```\n\n在这段代码中，我们看到了 `uart_stm32` 构造函数的实现。它使用初始化列表语法设置了私有成员\
  \ `USART_TypeDef *instance_`。CMSIS 定义了宏 `USART1`、`USART2`、`USART3` 和 `USART4`，它们指定了这些外设的地址，我们可以使用它们来初始化\
  \ `uart_stm32` 对象。\n\n`uart` 接口定义了 `init` 方法，因为 UART 外设初始化依赖于其他硬件初始化（即时钟配置）。如果在构造函数中实现初始化，如果有人定义了\
  \ `global` 或 `static` `uart_stm32` 对象，我们可能会遇到问题。`init` 方法所示：\n\n```cpp\nvoid hal::uart_stm32::init(std::uint32_t\
  \ baudrate)\n{\n    huart_.Instance = instance_;\n    huart_.Init.BaudRate = baudrate;\n\
  \    huart_.Init.WordLength = UART_WORDLENGTH_8B;\n    huart_.Init.StopBits = UART_STOPBITS_1;\n\
  \    huart_.Init.Parity = UART_PARITY_NONE;\n    huart_.Init.Mode = UART_MODE_TX_RX;\n\
  \    huart_.Init.HwFlowCtl = UART_HWCONTROL_NONE;\n    huart_.Init.OverSampling\
  \ = UART_OVERSAMPLING_16;\n    huart_.Init.AdvancedSampling = UART_DISABLE;\n  \
  \  __HAL_UART_Init(&huart_);\n}\n```\n\n## 用于灵活软件设计的 UART 接口\n\n在`第 5 章`中，我们涵盖了接口对于灵活软件设计的重要性。在那一章中，我们有了一个\
  \ `uart` 接口类，它由 `uart_stm32` 类实现。`gsm_lib` 类依赖于 `uart` 接口，这意味着我们可以在不同的 `uart` 接口实现上复用它。\n\
  \n来自`第 5 章`的 `uart_stm32` 类仅为了演示目的提供了一个简单的实现。它使用 C 标准库中的 `printf` 和 `putc` 函数向标准输出写入消息。现在，我们将介绍\
  \ `uart_stm32` 类的实际实现，该实现已用于书籍 GitHub 仓库中的所有示例，使使我们能够在 Renode 模拟器中看到输出。让我们从此处所示代码的\
  \ `uart` 接口 `class` 开始：\n\n```cpp\n#include <cstdint>\n#include <span>\nnamespace\
  \ hal\n{\nclass uart\n{\n  public:\n    virtual void init(std::uint32_t baudrate)\
  \ = 0;\n    virtual void write(std::span<const char> data) = 0;\n};\n}; // namespace\
  \ hal\n```\n\n`uart` 接口是一个带有两个虚方法的简单类：\n\n*   `virtual void init(std::uint32_t baudrate)`：用于带单个参数\
  \ `baudrate` 初始化 UART 外设的方法。\n*   `virtual void write(std::span<const char> data)`：用于通过\
  \ UART 外设发送数据的方法。与通常使用数据缓冲区指针和长度的 C 方法相比，它拥有一个 `std::span<const char>` 参数。使用 `std::span`\
  \ 增加了代码的内存安全性。\n\n接下来，让我们查看 `uart_stm32` 类定义：\n\n```cpp\n#include <span>\n#include\
  \ <cstdint>\n#include <uart.hpp>\n#include <stm32f0xx_hal.h>\n#include <stm32f072xb.h>\n\
  namespace hal\n{\nclass uart_stm32 : public uart\n{\n  public:\n    uart_stm32(USART_TypeDef\
  \ *inst);\n    void init(std::uint32_t baudrate = c_baudrate_default);\n    void\
  \ write(std::span<const char> data) override;\n  private:\n    UART_HandleTypeDef\
  \ huart_;\n    USART_TypeDef *instance_;\n    std::uint32_t baudrate_;\n    static\
  \ constexpr std::uint32_t c_baudrate_default = 115200;\n};\n}; // namespace hal\n\
  ```\n\n在 `uart_stm32` 类定义中，我们可以注意到以下点：\n\n*   重写了来自 `uart` 接口的虚方法 `init` 和 `write`。\n\
  *   一个接受 `USART_TypeDef` 指针的构造函数。该类型是在 CMSIS 头文件 `stm32f072xb.h` 中描述 UART 外设寄存器布局的\
  \ `struct`。\n*   在私有成员中，我们看到了 `UART_HandleTypeDef`，这是定义在 `stm32f0xx_hal_uart.h`\
  \ 文件中的类型。\n\n接下来，让我们查看这段代码中 `uart_stm32` 类构造函数和方法的实现：\n\n```cpp\nhal::uart_stm32::uart_stm32(USART_TypeDef\
  \ *inst): instance_(inst)\n{\n}\n```\n\n在这段代码中，我们看到了 `uart_stm32` 构造函数的实现。它使用初始化列表语法设置了私有成员\
  \ `USART_TypeDef *instance_`。CMSIS 定义了宏 `USART1`、`USART2`、`USART3` 和 `USART4`，它们指定了这些外设的地址，我们可以使用它们来初始化\
  \ `uart_stm32` 对象。\n\n`uart` 接口定义了 `init` 方法，因为 UART 外设初始化依赖于其他硬件初始化（即时钟配置）。如果在构造函数中实现初始化，如果有人定义了\
  \ `global` 或 `static` `uart_stm32` 对象，我们可能会遇到问题。`init` 方法所示所示：\n\n```cpp\nvoid hal::uart_stm32::init(std::uint32_t\
  \ baudrate)\n{\n    huart_.Instance = instance_;\n    huart_.Init.BaudRate = baudrate;\n\
  \    huart_.Init.WordLength = UART_WORDLENGTH_8B;\n    huart_.Init.StopBits = UART_STOPBITS_1;\n\
  \    huart_.Init.Parity = UART_PARITY_NONE;\n    huart_.Init.Mode = UART_MODE_TX_RX;\n\
  \    huart_.Init.HwFlowCtl = UART_HWCONTROL_NONE;\n    huart_.Init.OverSampling\
  \ = UART_OVERSAMPLING_16;\n    huart_.Init.AdvancedSampling = UART_DISABLE;\n  \
  \  __HAL_UART_Init(&huart_);\n}\n```\n\n`uart` 接口是一个带有两个虚方法的简单类：\n\n*   `virtual\
  \ void init(std::uint32_t baudrate)`：用于带单个参数 `baudrate` 初始化 UART 外设的方法。\n*   `virtual\
  \ void write(std::span<const char> data)`：用于通过 UART 外设发送数据的方法。与通常使用数据缓冲区指针和长度的 C\
  \ 方法相比，它拥有一个 `std::span<const char>` 参数。使用 `std::span` 增加了代码的内存安全性。\n\n`uart` 接口定义了\
  \ `init` 方法，因为 UART 外设初始化依赖于其他硬件初始化（即时钟配置）。\n\ncpp\nhuart_.Instance = instance_;\n\
  huart_.Init.BaudRate = baudrate\nhuart_.Init.WordLength = UART_WORDLENGTH_8B\nhuart_.Init.StopBits\
  \ = UART_STOPBITS_1\nhuart_.Init.Parity = UART_PARITY_NONE\nhuart_.Init.Mode = UART_MODE_TX_RX\n\
  huart_.Init.HwFlowCtl = UART_HWCONTROL_NONE\nhuart_.Init.OverSampling = UART_OVERSAMPLING_16\n\
  huart_.Init.AdvancedSampling = UART_DISABLE\n__HAL_UART_Init(&huart_);\n\n`uart`\
  \ 接口定义了 `init` 方法，因为 UART 外设初始化依赖于其他硬件初始化（即时钟配置）。如果在构造函数中实现初始化，如果有人定义了 `global`\
  \ 或 `static` `uart_stm32` 对象，我们可能会遇到问题。\n\n接下来，让我们查看 `uart_stm32` 类定义：\n\n```cpp\n\
  void hal::uart_stm32::write(std::span<const char> data)\n{\n    char * data_ptr\
  \ = const_cast<char *>(data.data());\n    HAL_UART_Transmit(&huart_, reinterpret_cast<uint8_t\
  \ *>(data_ptr), data.size(), HAL_MAX_DELAY);\n}\n```\n\n在 `write` 方法中，我们调用了 ST HAL\
  \ 的 `HAL_UART_Transmit` 并传递了指针和大小。值得我们需要去掉 const，因为 `HAL_UART_Transmit` 函数不接受 const\
  \ 指针。\n\n接下来，让我们查看这段代码中 `uart_stm32` 类构造函数和方法的实现：\n\n```cpp\nhal::uart_stm32::uart_stm32(USART_TypeDef\
  \ *inst): instance_(inst)\n{\n}\n```\n\n在这段代码中，我们看到了 `uart_stm32` 构造函数的实现。它使用初始化列表语法设置了私有成员\
  \ `USART_TypeDef *instance_`。CMSIS 定义了宏 `USART1`、`USART2`、`USART3` 和 `USART4`，它们指定了这些外设的地址，我们可以使用它们来初始化\
  \ `uart_stm32` 对象。\n\n`uart` 接口定义了 `init` 方法，因为 UART 外设初始化依赖于其他硬件初始化（即时钟配置）。如果在构造函数中实现初始化，如果有人定义了\
  \ `global` 或 `static` `uart_stm32` 对象，我们可能会遇到问题。`init` 方法所示所示：\n\n```cpp\nvoid hal::uart_stm32::init(std::uint32_t\
  \ baudrate)\n{\n    huart_.Instance = instance_;\n    huart_.Init.BaudRate = baudrate;\n\
  \    huart_.Init.WordLength = UART_WORDLENGTH_8B;\n    huart_.Init.StopBits = UART_STOPBITS_1;\n\
  \    huart_.Init.Parity = UART_PARITY_NONE;\n    huart_.Init.Mode = UART_MODE_TX_RX;\n\
  \    huart_.Init.HwFlowCtl = UART_HWCONTROL_NONE;\n    huart_.Init.OverSampling\
  \ = UART_OVERSAMPLING_16;\n    huart_.Init.AdvancedSampling = UART_DISABLE;\n  \
  \  __HAL_UART_Init(&huart_);\n}\n```\n\n## 适配器模式中的 UART 接口\n\n此示例中所有软件组件（`uart`\
  \ 接口、`uart_stm32` 的实现以及 ST HAL）之间的关系可以通过下面的 UML 图表示：\n\n![Figure 13.1 – The uart_stm32\
  \ class diagram](img/B2402_13_01.png)\n\n图 13.1 – uart_stm32 类图\n\n在*图 13.1*中，我们看到了\
  \ `uart_stm32` 类 UML 图。该类有效地实现了**适配器设计模式**，这是一种允许不兼容的类协同工作的结构性设计模式。适配器模式涉及创建一个适配器类来封装现有类（或模块），并提供客户端期望的新接口。\n\
  \n在我们案例中，尽管 `stm32f0xx_hal_uart` 是一个 C 模块而非 C++ 类，`uart_stm32` 类充当了适配器，封装了 C HAL\
  \ 代码并通过 C++ `uart` 接口将其暴露。这种适配允许系统的其他类或客户端（例如 `GSM` 库）使用标准的 C++ 接口与 UART 硬件交互，而无需担心底层的\
  \ C 实现细节。\n\n\n\n\n在这段代码中，我们看到了 `uart` 接口的一个简单客户端示例——`gsm_lib`，它包含一个构造函数，用于初始化引用\
  \ `hal::uart &uart_`。这种方法被称为**依赖注入**。`gsm_lib` 类的依赖项在外部构造，并通过构造函数作为引用提供给该类。依赖接口还能够实现了松耦合，这带来了以下优势：\n\
  \n*   `gsm_lib` 不关心 `uart` 接口的实现细节。它不需要知道波特率、硬件设置等。\n*   `gsm_lib` 不绑定到特定的目标。我们可以通过在这些平台上实现\
  \ `uart` 接口，从而在不同平台上复用它。\n*   `gsm_lib` 的软件测试非常容易，因为我们可以模拟（mock）`uart` 接口，并使用测试中使用的\
  \ mock 对象实例化 `gsm_lib` 对象。\n\n与其在 `uart_stm32` 类中直接使用 C HAL 库，我们可以将 C 库的函数封装在一个所谓的\
  \ `static` 类中，并对所有参数进行直接映射。\n\n# 介绍静态类\n\n我们在这里讨论的 `static` 类概念在 C++ 语言中并不存在。它是从\
  \ C# 等语言中借用的，在那些语言中定义为一个只包含 `static` 成员和方法的类。它不能被实例化。在 C# 中，静态类使用 `static` 关键字声明。\n\
  \n在 C++ 中，可以通过定义一个包含所有 `static` 方法和成员的类，并删除默认构造函数来创建一个静态类。删除构造函数确保了无法创建该类的任何实例，从而在编译时强制执行此规定。禁用实例化向用户传达了清晰的意图：*这是一个*\
  \ `static` *类*。你正在使用的函数不依赖于任何特定实例的状态，因为不存在实例。如果存在任何内部状态，它也是共享的，并将影响所有使用该类的人*。\n\n\
  我们将修改之前的示例，并创建一个 `uart_c_hal` `static` 类来封装 UART C HAL 函数，如代码所示：\n\n```\nstruct\
  \ uart_c_hal {\n    uart_c_hal() = delete;\n    static inline HAL_StatusTypeDef\
  \ init(UART_HandleTypeDef *huart)\n    {\n        return HAL_UART_Init(huart);\n\
  \    }\n    static inline HAL_StatusTypeDef transmit(UART_HandleTypeDef *huart,\n\
  \                                             uint8_t *pData,\n                \
  \                             uint16_t Size,\n                                 \
  \            uint32_t Timeout)\n    {\n        return HAL_UART_Transmit(huart, pData,\
  \ Size, Timeout);\n    }\n};\n```\n\n在这段代码中，我们简单地将 C 函数映射到 `uart_c_hal` 类的 `static`\
  \ 方法中。接下来，我们将修改 `uart_stm32` 类来使用 `uart_c_hal`，如下所示：\n\n```\ntemplate <typename\
  \ HalUart>\nclass uart_stm32 : public uart\n{\n  public:\n    uart_stm32(USART_TypeDef\
  \ *inst) : instance_(inst) {}\n    void init(std::uint32_t baudrate = c_baudrate_default)\
  \ override {\n      huart_.Instance = instance_;\n      huart_.Init.BaudRate = baudrate;\n\
  \      // ...\n      // init huart_ struct\n      HalUart::init(&huart_);\n    }\n\
  \    void write(std::span<const char> data) override {\n      // 由于 ST HAL 的 API\
  \ ，我们必须去掉 const 属性\n      char * data_ptr = const_cast<char *>(data.data());\n \
  \     HalUart::transmit(&huart_,\n                        reinterpret_cast<uint8_t\
  \ *>(data_ptr),\n                        data.size(),\n                        HAL_MAX_DELAY);\n\
  \    }\n  private:\n    UART_HandleTypeDef huart_;\n    USART_TypeDef *instance_;\n\
  \    std::uint32_t baudrate_;\n    static constexpr std::uint32_t c_baudrate_default\
  \ = 115200;\n};\n```\n\n在这段代码中，我们看到 `uart_stm32` 现在是一个模板类，它使用来自模板参数 `HalUart` 的\
  \ `init` 和 `transmit` 方法。现在我们可以使用这个类模板，如下：\n\n```\nuart_stm32<uart_c_hal> uart(USART2);\n\
  uart.init();\ngsm_lib gsm(uart);\n```\n\n`uart_stm32` 类模板仍然实现了 `uart` 接口，这意味着我们仍然可以在\
  \ `gsm_lib` 类中使用它。将 C HAL 函数封装在 `static` 类中并调整 `uart_stm32` 通过模板参数来使用它，将 C HAL 与\
  \ `uart_stm32` 的实现解耦。这使得离线测试 `uart_stm32` 类成为可能，因为不再不再依赖于特定平台的代码。\n\n静态类是在 C++ 项目中使用\
  \ C 库的一种方法。它们允许我们将 C 库的函数封装在可以通过模板参数传递给 C++ 类的类型中，使得代码更加灵活且更容易测试。\n\n接下来，我们将看到如何应用\
  \ RAII 技术来有效地封装 **little fail-safe** (`littlefs`) 文件系统 C 库。\n\n# 使用 RAII 封装 littlefs\
  \ C 库\n\nRAII 是一种简单而强大的 C++ 技术，用于通过对象的生命周期管理资源。资源可以代表不同的内容。资源在对象生命周期开始时获取，在对象生命周期结束时释放。\n\
  \n该技术被用于管理动态分配的内存。当对象生命周期结束时，析构函数将释放内存。\n\nRAII 技术可以应用于其他资源，如文件，并且我们将其应用于 `littlefs`\
  \ ([`github.com/littlefs/littlefs`](https://github.com/littlefs/littlefs))。我们将从\
  \ `littlefs` —— 针对微控制器的文件系统开始。\n\n## LittleFS - 针对微控制器的文件系统\n\n`littlefs` 文件系统为微控制器设计，具有以下特点：\n\
  \n*   **掉电保护**：它设计用于处理意外掉电。在掉电的情况下，它将恢复到最后良好的状态。\n*   **动态磨损均衡**：它针对闪存进行了优化，提供了跨块的磨损均衡。它还包含了检测并跳过块的机制，确保长期可靠性。\n\
  *   **有限 RAM/ROM**：它针对低内存使用进行了优化。无论文件大小如何，RAM 消耗都是恒定的，动态内存取决于可配置的缓冲区，这些缓冲区可以设置为\
  \ `static`。\n\n我们将首先通过 `littlefs` 的基本用法，然后查看如何在 C++ 包装类中应用 RAII。我们将通过一个 `littlefs`\
  \ 示例，它将：\n\n*   格式化并挂载文件系统。\n*   创建文件，写入内容，然后关闭。\n*   打开文件，读取内容，然后关闭。\n\n完整的示例包含在\
  \ `examples/lfs_raii/app/src/main.cpp` 中。让我们从格式化和挂载文件系统的代码开始，如下：\n\n```\nlfs_t lfs;\n\
  const lfs_config * lfs_ramfs_cfg = get_ramfs_lfs_config();\nlfs_format(&lfs, lfs_ramfs_cfg);\n\
  lfs_mount(&lfs, lfs_ramfs_cfg);\n```\n\n这段代码执行了以下步骤：\n\n*   声明了一个类型为 `lfs_t` 的文件系统对象\
  \ `lfs`。该对象将与 `littlefs` 文件系统交互。它持有文件系统的状态，是后续所有文件操作所需的。\n*   函数 `get_ramfs_lfs_config()`\
  \ 返回指向 `lfs_config` 结构的指针，该结构包含了在 RAM 存储介质上运行所需的全部配置参数。包括读取、写入和擦除的函数指针，以及块大小、块数和缓存大小等参数。在项目中使用部分\
  \ RAM 作为存储介质。基于 RAM 的 `littlefs` 配置定义在 C 文件 `examples/lfs_raii/app/src/lfs_ramfs.c`\
  \ 中。\n\n\n\n\n*   它格式化存储介质以便为 `littlefs` 使用做准备。`lfs_format` 函数初始化存储介质上的文件系统结构。此过程会擦除任何现有数据并设置必要的元数据结构。格式化通常在第一次使用文件系统之前或重置时完成。\n\
  \n*   它挂载文件系统以便为文件操作做好准备。`lfs_mount` 函数根据存储介质上的现有结构在 RAM 中初始化文件系统状态。在执行读取或写入任何文件操作之前，此步骤是必要的。\n\
  \n接下来，让我们创建一个文件并向其中写入一些数据。代码所示：\n\n```\nlfs_file_t file;\nif(lfs_file_open(&lfs,\
  \ &file, “song.txt”, LFS_O_WRONLY | LFS_O_CREAT) >= 0)\n{\n    const char * file_content\
  \ = “These are some lyrics!”;\n    lfs_file_write(&lfs,\n                   &file,\n\
  \                   reinterpret_cast<const void *>(file_content),\n            \
  \       strlen(file_content));\n    lfs_file_close(&lfs, &file);\n}\n```\n\n此代码执行了以下步骤：\n\
  \n*   声明一个类型为 `lfs_file_t` 的名为 `file` 的文件对象。该对象代表 `littlefs` 文件系统中的文件。它持有文件的状态，是执行读取和写入等文件操作所需的。\n\
  \n*   尝试使用函数 `lfs_file_open` 打开一个名为 `“song.txt”`的文件进行写入。该函数提供了以下参数：\n\n    *   `&lfs`:指向文件对象的指针，之前已初始化并挂载。\n\
  \    *   `&file`:指向将与打开的文件关联的文件对象的指针。\n    *   `“song.txt”`:要打开的文件名。\n    *   `LFS_O_WRONLY\
  \ | LFS_O_CREAT`:标志位，指定以只写模式打开文件，并在文件不存在时创建它。\n\n    *   如果 `lfs_file_open` 函数返回非负值，代码将尝试使用\
  \ `lfs_file_write` 函数向其写入一些数据。\n\n*   我们将要写入的内容声明为字符串字面量 `file_content`。\n\n*  \
  \ 函数 `lfs_file_write` 提供了以下参数：\n\n    *   `&lfs`:指向文件对象的指针。\n    *   `&file`:指向与打开的文件关联的文件对象的指针。\n\
  \    *   `reinterpret_cast<const void *>(file_content)`:按照函数要求将字符字符串转换为 `const void*`\
  \ 指针。\n    *   `strlen(file_content)`:根据字符串长度计算的写入字节数。\n\n*   写入后关闭文件以确保数据完整性。`lfs_file_close`\
  \ 将任何待处理写入刷新到存储介质并释放与文件相关的资源。\n\n向文件中写入数据后，我们将尝试以只读模式打开同一个文件并读取数据。读取文件的代码所示：\n\n\
  ```\nif(lfs_file_open(&lfs, &file, “song.txt”, LFS_O_RDONLY)>= 0) {\n    std::array<char,\
  \ 64> buff = {0};\n    lfs_file_read(&lfs,\n                  &file,\n         \
  \         reinterpret_cast<void *>(buff.data()),\n                  buff.size()\
  \ - 1);\n    printf(“This is content from the file\\r\\n%s\\r\\n”, buff.data());\n\
  \    lfs_file_close(&lfs, &file);\n}\n```\n\n此代码执行了以下步骤：\n\n*   使用函数 `lfs_file_open`\
  \ 并提供标志 `LFS_O_RDONLY` 尝试以只读访问打开文件 `“song.txt”`。\n\n*   如果 `lfs_file_open` 函数返回非负值，代码将尝试从打开的文件读取数据。\n\
  \n*   `std::array<char, 64> buff = {0}` 声明了一个固定大小为 `64` 个字符的名为 `buff` 的数组，并将所有元素初始化为零（`‘\\\
  0’`），确保缓冲区在视为 C 字符串时是空字符终止的。\n\n*   使用函数 `lfs_file_read` 从打开的文件读取数据到 `buff` 数组。该函数提供了以下参数：\n\
  \n    *   `&lfs`:指向文件对象的指针。\n    *   `&file`:指向与打开的文件关联的文件对象的指针。\n    *   `reinterpret_cast<const\
  \ void *>(buff.data())`:按照函数要求将 `buff` 底层数组指针转换为 `const void*` 指针。\n\n*   `buff.size()\
  \ – 1`:从文件中读取的字节数。减去 1 是为字符串末尾的空终止终止（`‘\\0’`）留出空间。\n\n*   读取后关闭文件以确保数据完整性。\n\n你可以在\
  \ Renode 中运行完整的示例。\n\n\n\n\n\n```\nfs::lfs::init();\n{\n    fs::file song_file(“song.txt”,\
  \ LFS_O_WRONLY | LFS_O_CREAT);\n    if(song_file.is_open()) {\n    song_file.write(“These\
  \ are some lyrics!”);\n    // destructor is called on song_file object\n    // ensuring\
  \ the file is closed\n}\n}\n```\n\n我们首先通过调用 `fs::lfs::init()` 初始化文件系统。接下来，我们引入局部作用域来演示析构函数的调用并执行后续步骤：\n\
  \n*   以写入模式打开 `song.txt`（如果文件不存在则创建）。\n*   如果文件打开成功，则在文件中写入字符串字面量。\n*   离开作用域时，调用析构函数，确保文件被关闭。\n\
  \n接下来，我们将打开文件并从中读取数据。代码所示：\n\n```\nfs::file song_file(“song.txt”);\nstd::array<char,\
  \ 64> buff = {0};\nif(song_file.is_open()) {\n    song_file.read(buff);\n    printf(“This\
  \ is content from the file\\r\\n%s\\r\\n”,\n    buff.data());\n}\n```\n\n此代码执行了后续步骤：\n\
  \n*   以读取模式（默认模式）打开 `song.txt`。\n*   声明 `std::array<char, 64> buff` 并初始化为零。\n* \
  \  如果文件打开成功，从文件中读取数据到 `buff` 中。\n\n你可以在 Renode 模拟器中运行完整的示例。启动 Visual Studio Code，将其附加到正在运行的容器，打开\
  \ `Chapter13/lfs_raii` 项目（如 *第 4 章* 所示），并在 Visual Studio Code 终端中运行以下命令，或直接在容器终端中运行：\n\
  \n```\n$ cd Chapter13/lfs_raii\n$ cmake -B build -DMAIN_CPP_FILE_NAME=main_lfs_raii.cpp\n\
  $ cmake --build build --target run_in_renode\n```\n\n我们为 `littlefs` 库编写的简单 C++ 封装应用了\
  \ RAII 原则，确保在对象生命周期结束时调用析构函数来正确处理资源。这确保了即使代码中有多个返回路径，文件也会关闭。它还简化了开发体验，使代码更加简洁整洁。`std:span`\
  \ 的使用增加了安全性。\n\n## 总结\n\n在本章中，我们涵盖了在 C++ 项目中使用 C 库的几种技术。通过将 C 代码封装在 C++ 类中，我们可以在松耦合的软件模块中更好地组织代码。C++\
  \ 增加了类型安全性，且编译时特性允许我们轻松地在 `static` 类中组织 C 封装。\n\n应用 RAII 非常简单，并为我们提供了一种强大的机制来管理资源，正如我们在\
  \ `littlefs` 文件系统示例看到的那样。\n\n在下一章中，我们将介绍裸机固件中的超循环（super-loop），并查看如何使用 C++ 中的调度器（sequencer）等机制对其进行增强。\n\
  \n## 加入我们的 Discord 社区\n\n加入我们社区的 Discord 空间，与作者和其他读者讨论：\n\n[`packt.link/embeddedsystems`](https://packt.link/embeddedsystems)\n\
  \n![](img/QR_code_Discord.png)\n\n# 14\n\n# 使用调度器增强超循环\n\n**超循环**（Super-loop）是裸机固件的基础软件架构。它是一个无限循环，执行任务（函数），通常由**中断服务程序**（**ISR**）中设置的标志位控制。随着业务逻辑复杂性的增加，超循环的大小也随之增大，可能会迅速变成一团乱麻。为了在裸机限制（无操作系统）下解决这个问题，我们可以使用调度器。\n\
  \n**调度器**（sequencer）以组织化的方式存储并执行任务（函数）。我们不再在 ISR 中设置标志位、在超循环中检查标志位并在标志位设置时执行函数，而是只需从\
  \ ISR 向调度器添加任务。然后，超循环运行调度器，并由调度器执行已添加的任务。调度器中的任务可以设置优先级，因此调度器将先执行高优先的任务。\n\n在本章中，我们将通过以下主要主题涵盖调度器的设计和实现：\n\
  \n*   超循环以及使用调度器的动机\n*   设计调度器\n*   存储可调用对象\n*   实现调度器\n\n## 技术要求\n\n本章的示例可在 GitHub\
  \ 上找到 ([`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter14`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter14))。为了充分利用本章，请在\
  \ Renode 模拟器中运行示例。\n\n# 超循环和使用调度器的动机\n\n在进入调度器的设计和实现之前，我们首先分析超循环的局限性。在典型的超循环场景中，我们检查从\
  \ ISR 设置的标志位。以下是超循环的伪代码示例：\n\n```\nbool data_read_ready = false;\nbool data_send_timeout\
  \ = false;\nint main() {\n    // 初始化硬件\n\n    while(1) {\n        if(data_read_ready)\
  \ {\n            sensor_data_read_and_buffer();\n            data_read_ready = false;\n\
  \        }\n        if(data_send_timeout) {\n            data_send_from_buffer();\n\
  \            data_send_timeout = false;\n        }\n        if(!data_read_ready\
  \ && !data_send_timeout) {\n            enter_sleep();\n        }\n    }\n}\n```\n\
  \n在上述示例中，我们执行了以下步骤：\n\n1.  检查 `data_read_ready` 标志位，如果设置了则执行 `sensor_data_read_and_buffer()`\
  \ 并重置 `data_read_ready`。\n2.  检查 `data_send_timeout` 标志位，如果设置了则执行 `data_send_from_buffer()`\
  \ 并重置 `data_send_timeout`。\n3.  最后，如果 `data_read_ready` 和 `data_send_timeout` 都为假，则\
  \ `enter_sleep()`。\n\n这个示例虽然简单，但随着标志位数量的增加，超循环的大小、全局变量的数量以及忘记在 `if` 语句中包含它们的可能性随之增加。\n\
  \n为了解决裸机环境下的超循环问题，我们将使用调度器。我们不再定义全局标志位并从 ISR 设置它们，而是从 ISR 向调度器添加任务。每个任务将包含优先级信息，使调度器能够根据优先级进行组织。\n\
  \n在主循环中，调度器反复运行。它通过始终从队列中选择最高优先级的任务并执行，保持任务管理的高效有序。\n\n接下来，我们将进行调度器的设计。\n\n## 设计调度器\n\
  \n我们将基于 *第 10 章 中介绍的命令模式来设计调度器。在命令模式中，调度器将承担调用者（invoker）的角色。在我们的设计中，我们将使用“任务”（task）一词代替“命令”。这种任务等同于一个函数——它代表一个特定的功能单元——而不是操作系统定义的任务。\n\
  \n![Figure 14.1 – Sequencer design – UML diagram](img/B22402_14_01.png)\n\n图 14.1\
  \ – 调度器设计 – UML 图\n\n*图 14.1* 展示了调度器的 UML 图。我们可以看到它在命令模式中扮演调度器的角色，正如之前所述。没有命令接口和具体的命令，此\
  \ UML 设计使用了 `std::function` 类模板（我们在 *第 10 章 的 *GPIO 中断管理器*示例中使用了相同的方法）。\n\n`sequencer`\
  \ 类持有任务数组，用于存储可调用对象。调度器提供简单的接口，仅包含两个方法：\n\n*   `void add(task t)`：用于向调度器添加任务的方法\n\
  \n\n\n\n\n*   `void run()`: 用于获取优先级最高的任务、执行该任务并将其从序列器（sequencer）中移除的方法。\n\n在进入序列器方法的实现之前，我们首先将概述\
  \ `task` 类以及用于存储任务的 `std::array` 替代方案。`task` 类表示一个功能单元，该单元将根据优先级由序列器执行。它具有以下成员：\n\
  \n*   `std::function<void()> the_task_`: 一个实际的、将被执行的可调用对象。\n*   `std::uint8_t priority_`:\
  \ 根据此优先级在序列器的存储器中对任务进行排序。\n\n以下是实现 `task` 类的代码：\n\n```\ntemplate<typename CallableHolder>\n\
  class task {\npublic:\n    constexpr static std::uint8_t c_prio_default = 250;\n\
  \    constexpr static std::uint8_t c_prio_max = 255;\n    constexpr static std::uint8_t\
  \ c_prio_min = 0;\n    task(CallableHolder the_task, std::uint8_t prio = c_prio_default)\
  \ :\n        the_task_(the_task), priority_(prio) {}\n    void execute() {\n   \
  \     if(the_task_) {\n            the_task_();\n        }\n    }\n    bool operator<(const\
  \ task &rhs) const\n    {\n        return priority_ < rhs.priority_;\n    }\nprivate:\n\
  \    CallableHolder the_task_;\n    std::uint8_t priority_ = c_prio_default;\n};\n\
  ```\n\n这段代码将任务实现为一个类模板，允许我们配合不同的可调用者（callable holders）使用。我们之前在书中引入的是 `std::function`。该类模板\
  \ `task` 具有以下成员：\n\n*   一个初始化 `the_task_` 成员的构造函数，其类型为 `CallableHolder`。\n*   `void\
  \ execute()` 方法，它对 `the_task_` 调用 `operator()`。\n*   `operator<`，它通过优先级比较任务。\n\n\
  这段代码演示了类模板 `task` 的用法：\n\n```\n using callable_holder = std::function<void()>;\n\
  \    auto fun_a = []() {\n        printf(\"High priority task!\\r\\n\");\n    };\n\
  \    task<callable_holder> task_a(fun_a, 255);\n    auto fun_b = []() {\n      \
  \  printf(\"Low priority task!\\r\\n\");\n    };\n    task<callable_holder> task_b(fun_b,\
  \ 20);\n    if(task_a < task_b) {\n        task_b.execute();\n    }\n    else {\n\
  \        task_a.execute();\n    }\n```\n\n在例示例中，我们使用 `std::function<void()>` 实例化类模板\
  \ `task`。我们创建了两个对象 `task_a` 和 `task_b`，然后通过使用 `operator<` 比较它们，并执行优先级更高的一个。此示例中的任务对象是用\
  \ lambda 初始化的，它们在内部存储在 `std::function<void()>` 中。如果你运行前面的示例，将看到以下输出：\n\n```\nHigh\
  \ priority task!\n```\n\n如你所见，得于重载的 `operator<`，优先级更高的任务被执行了。\n\n在 *第 10 章 中，我们看到类模板\
  \ `std::function` 可以诉助于动态内存分配以存储捕获的 lambda。为了缓解这一担忧，我们将引入**嵌入式模板库** (**ETL**），这是一个定义了一系列容器和算法的库，其操作是确定性的且不使用动态内存分配。ETL\
  \ 将 *第 17 章 中详细讨论。\n\n# 存储可调用对象\n\n除了 `std::function`，可以使用 `etl::delegate` —— 一个来自\
  \ ETL 的可调用者。它的局限性之一是不支持带捕获的 lambda。这可能会影响代码的表达能力，但它为我们提供了等效的功能，允许我们捕获不同的可调用对象。这段代码演示了配合\
  \ `etl::delegate` 使用类模板 `task`：\n\n```\n using callable_etl = etl::delegate<void()>;\n\
  \    using task_etl = task<callable_etl>;\n    class test {\n    public:\n     \
  \   test(int x) : x_(x) {}\n        void print() const {\n            printf(\"\
  This is a test, x = %d.\\r\\n\", x_);\n        }\n        void static print_static()\
  \ {\n            printf(\"This is a static method in test.\\r\\n\");\n        }\n\
  \    private:\n        int x_ = 0;\n    };\n    test test_1(42);\n    task_etl task_member_fun(callable_etl::create<test,\
  \ &test::print>\n                                                        (test_1));\n\
  \    task_member_fun.execute();\n    task_etl task_static_fun(callable_etl::create<test::print_static>());\n\
  \    task_static_fun.execute();\n    task_etl task_lambda([](){\n        printf(\"\
  This is non capturing lambda!\\r\\n\");\n    });\n    task_lambda.execute();\n```\n\
  \n这段代码演示了我们如何使用 `etl::delegate` 来存储可调用对象：\n\n*   `callable_etl::create<test, &test::print>(test_1)`\
  \ 使用用类 `test` 其成员 `print` 实例化的模板方法 `create` 创建 `etl::delegate`。\n*   `callable_etl::create<test::print_static>()`\
  \ 创建了 `etl::delegate`。\n*   `task_lambda([](){ printf(\"This is non capturing lambda!\\\
  r\\n\"); });` 创建了 `etl::delegate`。\n\n\n\n\n```\npriority queue elements:\ntop element:\
  \ 16, size: 6\ntop element: 12, size: 5\ntop element: 10, size: 4\ntop element:\
  \ 8, size: 3\ntop element: 6, size: 2\ntop element: 1, size: 1\n```\n\n如从输出所示，优先级队列中的元素是经过排序的。这使得它成为存储可以通过重载的\
  \ `operator<` 可以进行排序的任务的良好解决方案。你可以在 Renode 模拟器中运行完整示例。启动 Visual Studio Code，将其挂载到运行中的容器，打开\
  \ `Chapter14/sequencer` 项目（如 第 4 章 所示），并在 Visual Studio Code 终端中运行以下命令，或直接在容器终端中运行它们：\n\
  \n```\ncmake -B build -DCMAKE_BUILD_TYPE=MinSizeRel\n-DMAIN_CPP_FILE_NAME=main_pq.cpp\n\
  cmake --build build --target run_in_renode\n```\n\n现在我们已经有了序列化器（sequencer）所需的所有元素，我们将开始进行实现。\n\
  \n# 实现序列化器\n\n在本章中，我们引入了 `etl::delegate` —— 这是 ETL 中 `std::function` 和固定大小 vector\
  \ 实现的替代方案。由于 ETL 避免了动态内存分配，我们将使用这些组件来实现序列化器的实现。下面是更新后的 UML 图：\n\n![图 14.2 – 使用 ETL\
  \ 组件的序列化器 UML 图](img/B22402_14_02.png)\n\n图 14.2 – 使用 ETL 组件的序列化器 UML 图\n\n图 14.2\
  \ 展示了使用 `delegate` 和 `vector` ETL 组件以及标准库优先级队列的序列化器 UML 图。这段代码实现了 `sequencer`：\n\
  \n```cpp\ntemplate<typename Task, std::size_t Size>\nstruct sequencer {\n    sequencer()\
  \ = delete;\n    static void add(Task task) {\n        if(pq.size() < Size) {\n\
  \            __disable_irq();\n            pq.push(task);\n            __enable_irq();\n\
  \        }\n    }\n    static void run() {\n        if(!pq.empty()) {\n        \
  \    __disable_irq();\n            auto task = pq.top();\n            pq.pop();\n\
  \            __enable_irq();\n            task.execute();\n        }\n    }\nprivate:\n\
  \    static inline std::priority_queue<Task, etl::vector<Task, Size>> pq{};\n};\n\
  ```\n\n在这段代码中，`sequencer` 被实现为一个静态模板类，`Task` 和 `Size` 是模板参数。这允许我们将其用于基于 `std::function`\
  \ 或 `etl::function` 的任务，并定义 ETL vector 的大小。`sequencer` 具有以下成员：\n\n*   `static inline\
  \ std::priority_queue<Task, etl::vector<Task, Size>> pq{}` 一个基于 ETL vector 的私有静态优先级队列。\n\
  *   `static void add(Task task)`：一个静态方法，使用 `push` 方法向队列添加任务，通过禁用和启用中断来保护，因为它可以从\
  \ ISR（中断服务例程序）中调用。\n*   `static void run()`：一个静态方法，用于从队列中取出顶元素并执行它。对队列的访问通过禁用和启用中断来保护。\n\
  \n下面是使用序列化器的示例：\n\n```cpp\n using callable_etl = etl::delegate<void()>;\n    using\
  \ task_etl = task<callable_etl>;\n    class test {\n    public:\n        test(int\
  \ x) : x_(x) {}\n        void print() const {\n            printf(\"This is a test,\
  \ x = %d.\\r\\n\", x_);\n        }\n        void static print_static() {\n     \
  \       printf(\"This is a static method in test.\\r\\n\");\n        }\n    private:\n\
  \        int x_ = 0;\n    };\n    test test_1(42);\n    task_etl task_member_fun(callable_etl::create<test,\
  \ &test::print>\n                                                        (test_1),\
  \ 20);\n    task_etl task_static_fun(callable_etl::create<test::print_static>(),\
  \ 30);\n    task_etl task_lambda([](){\n        printf(\"This is non capturing lambda!\\\
  r\\n\");\n    }, 10);\n    using seq = sequencer<task_etl, 16>;\n    seq::add(task_member_fun);\n\
  \    seq::add(task_static_fun);\n    seq::add(task_lambda);\n    while(true)\n \
  \   {\n        seq::run();\n    }\n```\n\n在这段代码中，我们执行了以下操作：\n\n*   实例化基于 `etl::delegate`\
  \ 的任务 `task_member_fun`、`task_static_fun` 和 `task_lambda`。\n*   我们使用序列化器的 `add`\
  \ 方法向序列化器添加任务。\n*   我们在主 `while` 循环中使用 `run()` 方法运行序列化器。\n\n运行上述代码将产生以下输出：\n\n```\n\
  This is a static method in test.\nThis is a test, x = 42.\nThis is non capturing\
  \ lambda!\n```\n\n正如我们在代码中看到的，任务是根据分配的优先级执行的。你可以在 Renode 中运行完整示例。启动 Visual Studio\
  \ Code，将其挂载到运行中的容器，并打开 `Chapter14/sequencer` 项目（如 第 4 章 所示）。\n\n\n\n\n你可以在`第 4 章`设置的\
  \ Docker 容器中的 Renode 模拟器中尝试本章的示例。确保 Docker 容器正在运行。\n\n你可以在 GitHub 上找到本章的文件：[`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter15/observer`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter15/observer)。\n\
  \n## 观察者模式\n\n`Observer pattern` 通常用于事件驱动系统，将事件发布给订阅的对象，通常通过调用它们的方法来实现。发布事件的对象称为\
  \ `subject`主题或 `publisher`发布者。从发布者处接收事件的对象称为 `observers`观察者或`subscribers`订阅。从现在起，我们将使用\
  \ `publisher` 和 `subscriber` 术语。\n\n`publisher` 内部有一个订阅者列表，并提供一个接口用于从内部列表中注册和注销\
  \ `subscriber`。它还提供了 `notify` 方法，由其客户端调用，进而反过来调用订阅者的 `update` 方法——这就是为什么我们说发布者通知了订阅者。\n\
  \n嵌入式系统中常见的发布者-订阅者机制示例是温度发布者，它会定期通知记录器、显示器和数据发送器。在继续实现此示例之前，我们首先将查看观察者模式的 UML 图。\n\
  \n![Figure 15.1 – UML diagram of the Observer pattern](img/B22402_15_01.png)\n\n\
  图 15.1 – 观察者模式的 UML 图\n\n`Figure 15.1` 描述了观察者模式的 UML 类图。在图中，我们看到 `publisher` 类具有以下成员：\n\
  \n*   `etl::vector<subscribers_, 8>`：指向订阅者接口的内部指针列表，我们将使用 ETL 中的 `vector`。\n*  \
  \ `register_sub(subscriber *)`：用于注册订阅者的方法。`register` 关键字在 C++ 中是被保留的并用作存储说明符，因此我们使用\
  \ `register_sub` 作为该方法的名称。\n*   `unregister(subscriber *)`：用于注销订阅者的方法。\n*   `notify(float)`：发布者客户端用于触发订阅者更新的方法。\n\
  \n`subscriber` 接口类有一个纯虚方法——`void update(float)`。该方法在 `subscriber` 类的具体实现中被重写。为了看到其实效果，我们将继续观察者模式的运行时实现。\n\
  \n## 运行时实现\n\n我们将通过温度发布者的示例来介绍观察者模式的运行时实现。订阅者将是记录器、显示器和数据发送器。订阅者接口和具体订阅者的代码在此：\n\
  \n```cpp\n#include <cstdio>\n#include “etl/vector.h”\n#include <algorithm>\nclass\
  \ subscriber {\npublic:\n    virtual void update(float) = 0;\n    virtual ~subscriber()\
  \ = default;\n};\nclass display : public subscriber {\npublic:\n    void update(float\
  \ temp) override {\n        printf(“Displaying temperature %.2f \\r\\n”, temp);\n\
  \    }\n};\nclass data_sender : public subscriber {\npublic:\n    void update(float\
  \ temp) override {\n        printf(“Sending temperature %.2f \\r\\n”, temp);\n \
  \   }\n};\nclass logger : public subscriber {\npublic:\n    void update(float temp)\
  \ override {\n        printf(“Logging temperature %.2f \\r\\n”, temp);\n    }\n\
  };\n```\n\n前面的代码定义了 `subscriber` 接口和具体订阅者类：`display`、`data_sender` 和 `logger`。具体类重写了接口类中的纯虚\
  \ `update` 方法。为了示例的简单性，所有具体实现都将温度打印到标准输出。\n\n使用接口类允许发布者依赖于接口。发布者维护一个指向订阅者接口的内部容器。这使得通过基接口类的指针添加订阅者接口的不同实现成为可能。`publisher`\
  \ 类的代码在此：\n\n```cpp\nclass publisher {\npublic:\n    void register_sub(subscriber\
  \ * sub) {\n        if(std::find(subs_.begin(), subs_.end(), sub) == subs_.end())\n\
  \        {\n            subs_.push_back(sub);\n        }\n    }\n    void unregister(subscriber\
  \ * sub) {\n        if(auto it = std::find(subs_.begin(), subs_.end(),\n       \
  \                           sub); it != subs_.end())\n        {\n            subs_.erase(it);\n\
  \        }\n    }\n    void notify(float value) {\n        for(auto sub: subs_)\
  \ {\n            sub->update(value);\n        }\n    }\nprivate:\n    etl::vector<subscriber*,\
  \ 8> subs_;\n};\n```\n\n在前面的 `publisher` 类中，我们看到以下成员：\n\n*   `etl::vector<subscriber*,\
  \ 8> subs_`：一个用于维护订阅者的私有容器。如果你在 Compiler Explorer 中运行此示例，请确保使用 `Libraries` 选项添加\
  \ ETL 库。\n*   `void register_sub(subscriber * sub)`：用于注册订阅者的方法。它使用 `std::find` 算法检查订阅者是否已经添加。\n\
  *   `void unregister(subscriber * sub)`：用于注销订阅者的方法。它使用 `std::find` 算法检查订阅者之前是否添加。\n\
  *   `void notify(float value)`：遍历订阅者并调用它们的 `update` 方法。\n\n```cpp\nint main() {\n\
  \    logger temp_logger;\n    display temp_display;\n    data_sender temp_sender;\n\
  \    publisher temp_publisher;\n\n    temp_publisher.register_sub(&temp_logger);\n\
  \    temp_publisher.register_sub(&temp_display);\n    temp_publisher.notify(24.02f);\n\
  \n    temp_publisher.unregister(&temp_logger);\n    temp_publisher.register_sub(&temp_sender);\n\
  \    temp_publisher.notify(44.02f);\n\n    return 0;\n}\n```\n\n\n\n\n我们将基于变长模板（variadic\
  \ templates）来实现。我们将从一个简化的实现开始，以解释变长模板、参数包（parameter packs）和折叠表达式（fold expressions）——这些\
  \ C++ 特性允许我们创建者模式的编译时版本。让我们继续下面的代码：\n\n```cpp\n#include <cstdio>\nstruct display\
  \ {\n    static void update(float temp) {\n        printf(“Displaying temperature\
  \ %.2f \\r\\n”, temp);\n    }\n};\nstruct data_sender {\n    static void update(float\
  \ temp) {\n        printf(“Sending temperature %.2f \\r\\n”, temp);\n    }\n};\n\
  struct logger {\n    static void update(float temp) {\n        printf(“Logging temperature\
  \ %.2f \\r\\n”, temp);\n    }\n};\ntemplate <typename... Subs>\nstruct publisher\
  \ {\n    static void notify(float temp) {\n        (Subs::update(temp), ...);\n\
  \    }\n};\nint main() {\n    using temp_publisher = publisher<display,\n    data_sender,\n\
  \    logger>;\n    temp_publisher::notify(23.47);\n    return 0;\n}\n```\n\n在上面的代码中，我们有了订阅者结构体\
  \ `display`、`data_sender` 和 `logger`。所有结构体实现了静态方法 `update`，该方法接受 `temperature` 作为参数并打印它。\n\
  \n`publisher` 结构体是一个变长类模板。`变长模板`是指包含至少一个`参数包`的模板。参数包（template parameter pack）是一个接受零或多个模板参数的模板参数。`typename...\
  \ Subs` 是一个名为 `Subs` 的类型模板参数包，这意味着可以用零或多个不同类型实例化结构体 `publisher`。总结一下：\n\n*   `publisher`\
  \ 是一个变长类模板，因为它有一个模板参数包 `typename... Subs`。\n*   我们可以通过提供变数量的类型作为模板参数来实例化它。这就是向发布者注册订阅者的方法。\n\
  \n在 `main` 函数中，我们创建了别名 `temp_publisher` 为 `publisher<display, data_sender, logger>`。我们在该别名上调用\
  \ `notify` 方法，得益于 `notify` 方法中的折叠表达式，这将导致对通过模板参数包提供的类型中 `update` 函数的调用。\n\n谜题的最后一块是折叠表达式\
  \ `(Subs::update(temp), ...)`。这是一个使用逗号运算符作为折叠运算符的折叠表达式。它展开为：`(display::update(temp),\
  \ data_sender::update(temp), logger::update(temp))`。\n\n折叠表达式确保了 `display::update(temp)`\
  \ 首先调用，然后是 `data_sender::update(temp)`，最后是 `logger::update(temp)`。逗号运算符的操作数的求值顺序严格从左到右。每个\
  \ `update(temp)` 调用都会返回一个值（很可能是 `void`）。\n\n逗号运算符丢弃除最后一个以外的所有返回值，因此只有最后的 `logger::update(temp)`\
  \ 决定了折叠的结果。如果它们都返回 `void`，整个表达式也返回 `void`。\n\n折叠表达式是在 C++17 中引入的，使用逗号运算符是调用参数包中每个类型函数的简洁方式。在此之前，需要递归来遍历类型并在上面调用函数。\n\
  \n在 Compiler Explorer 中检查反汇编输出时，你会发现生成的汇编代码相对短，总共大约 30 行，如下：\n\n```assembly\n.LC0:\n\
  \        .ascii  “Displaying temperature %.2f \\015\\012\\000”\n.LC1:\n        .ascii\
  \  “Sending temperature %.2f \\015\\012\\000”\n.LC2:\n        .ascii  “Logging temperature\
  \ %.2f \\015\\012\\000”\nmain:\n        push    {r4, r5, r6, lr}\n        mov  \
  \   r4, #-536870912\n        ldr     r5, .L3\n        mov     r2, r4\n        mov\
  \     r3, r5\n        ldr     r0, .L3+4\n        bl      printf\n        mov   \
  \  r2, r4\n        mov     r3, r5\n        ldr     r0, .L3+8\n        bl      printf\n\
  \        mov     r2, r4\n        mov     r3, r5\n        ldr     r0, .L3+12\n  \
  \      bl      printf\n        mov     r0, #0\n        pop     {r4, r5, r6, lr}\n\
  \        bx      lr\n.L3:\n        .word   1077377105\n        .word   .LC0\n  \
  \      .word   .LC1\n        .word   .LC2\n```\n\n在这段汇编代码中，我们可以看到没有对 `display`、`data_sender`\
  \ 和 `logger` 结构体的静态 `update` 方法的调用。这意味着编译器能够优化掉这些调用，以及订阅者的注册和对发布者 `notify` 方法的调用，从而变成了直接调用\
  \ `printf` 函数。\n\n结果是较小的内存占用和快速的性能。这个示例演示了**零成本抽象**的设计原则：我们为发布者和订阅者提供了抽象，但零开销，因为编译器可以优化代码，使其效率像手工编写的一样高。\n\
  \n比较编译时实现与使用相同优化级别（`-O3`）的运行时实现对应的汇编输出。这是显而易见的。\n\n\n\n我们在 `*第 8 章*`#Chapter_08.xhtml)\
  \ 中更详细地涵盖了这些概念。变变模板类 `publisher` 有了一个新方法 – `call_update_or_notify`。在 `notify` 方法中，我们使用折叠表达式和逗号运算符在参数包\
  \ `typename... Subs` 中的每个类型上调用该方法。\n\n在 `call_update_or_notify` 方法中，我们使用 `if constexpr`\
  \ 在编译时检查类型是 `Updatable` 还是 `Notifiable`，并分别调用其 `update` 或 `notify` 静态方法。\n\n以下是使用新版本者模式的示例：\n\
  \n```\n using temp_publisher = publisher<display, data_sender>;\n    temp_publisher::notify(23.47);\n\
  \    using temp_publisher_new = publisher<temp_publisher, logger>;\n    temp_publisher_new::notify(42.42);\n\
  ```\n\n在上述代码中，我们通过为变变类模板 `publisher` 提供类型 `display` 和 `data_sender` 来实例化 `temp_publisher`，这两个订阅者都是\
  \ `Updatable` 的。\n\n接下来，我们通过为 `publisher` 提供之前实例化的 `temp_publisher` 和订阅者 `logger`\
  \ 来实例化 `temp_publisher_new`。以下是上述示例的输出：\n\n```\nDisplaying temperature 23.47\nSending\
  \ temperature 23.47\nDisplaying temperature 42.42\nSending temperature 42.42\nLogging\
  \ temperature 42.42\n```\n\n你可以在 Renode 中运行完整示例。启动 Visual Studio Code，将其附加到运行中的容器，按照[**第\
  \ 4 章*` 中描述的方法打开 `Chapter15/observer` 项目，并在 Visual Studio Code 终端中运行以下命令，或直接在容器终端中运行：\n\
  \n```\n$ cmake -B build -DMAIN_CPP_FILE_NAME=main_observer_ct.cpp\n$ cmake --build\
  \ build --target run_in_renode\n```\n\n这种观察者模式的实现允许我们以更灵活的方式注册订阅者。为了使其更具通用性，你可以作为一个练习，你可以修改它，使得\
  \ `notify` 方法能够接收变数量的参数。\n\n## 总结\n\n在本章中，我们学习了观察者模式，包括运行时和编译时实现。\n\n编译时实现利用了我们在编译时对应用程序的了解。它基于变变模板类和折叠表达式。结果是产生了极其紧凑且快速的代码，因为我们没有在容器中存储订阅者的信息，也不需要遍历容器来调用\
  \ `update` 方法。\n\n在下一章中，我们将涵盖**有限状态机 (FSM)** 以及状态模式在 C++ 中的实现。\n\n## 在 Discord 上加入我们的社区\n\
  \n加入我们社区的 Discord 空间，与作者和其他读者进行讨论：\n\n[`packt.link/embeddedsystems`](https://packt.link/embeddedsystems)\n\
  \n![](img/QR_code_Discord.png)\n\n# 16\n\n# 设计可扩展的有限状态机\n\n**有限状态机** (`FSM`) 是一种抽象的计算模块，用于表示在任何给定时间只能处于有限数量状态中的某一个的系统。`FSM`\
  \ 可以根据给定输入从一个状态转换到另一个状态，并在转换过程中执行某些操作。\n\n在控制理论中，有摩尔机（Moore）和梅利机（Mealy）的分类。摩尔 `FSM`\
  \ 的输出仅取决于状态，也就是说 `FSM` 只使用入口操作。梅利 `FSM` 的输出取决于输入和当前状态，也就是说它执行的操作是由当前状态和输入共同决定的。\n\
  \n我们在本章中将涵盖的 `FSM` 是摩尔机和梅利 `FSM` 的结合，因为它们既支持在转换期间执行的操作，也支持仅依赖于当前状态的入口和退出操作。`FSM`\
  \ 也称为**统一建模语言** (**UML**) 状态机，用于嵌入式系统的实际应用来描述和控制机器。例如，`FSM` 常用于控制洗衣机、电梯系统或网络设备中的通信协议，根据各种输入管理复杂的操作序列。理解\
  \ `FSM` 将帮助你设计出更具预测性和可维护性的嵌入式系统。\n\n在本章中，我们将涵盖以下主要主题：\n\n*   `FSM` – 一种简单实现\n\n\
  *   `FSM` – 使用状态模式的实现\n\n*   使用标签分发（tag dispatching）的状态模式实现\n\n*   Boost SML (状态机语言)\n\
  \n## 技术要求\n\n为了充分利用本章内容，我强烈建议在阅读示例时使用 Compiler Explorer ([`godbolt.org/`](https://godbolt.org/))。选择\
  \ GCC 作为你的编译器并目标 x86 架构。这将让你看到标准输出 (`stdio`) 结果并更好地观察代码的行为。由于使用了大量的现代 C++ 特性，请确保通过在编译器选项框中添加\
  \ `-std=c++23` 选择 C++23 标准。\n\nCompiler Explorer 可以方便地尝试代码、调整代码并立即查看其如何影响输出和生成的汇编代码。大多数示例也可以\
  \ ARM Cortex M0 目标的 Renode 模拟器上运行，并在 GitHub 上可用 ([`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter16`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter16))。\n\
  \n## FSM – 一个简单实现\n\n直接进入处理**低功耗蓝牙** (**BLE**) 状态的 `FSM` 示例，分析其缺点，并查看如何使用状态模式来改进它。示例\
  \ `FSM` 将为了清晰易于理解而进行简化。我们将三个状态——`idle`（空闲）、`advertising`（广播）和 `connected`（已连接）。这里是状态图：\n\
  \n![图 16.1 – BLE 连接状态图](img/B2402_16.png)\n\n*图 16.1 – BLE 连接状态图*\n\n图 `16.1` 描述了状态之间的转换，描述如下：\n\
  \n*   默认状态为 `idle`。它在发生 `ble_button_pressed` 事件时转换到 `advertising` 状态。在转换过程中，执行 `start_advertising`\
  \ 操作。\n*   从 `advertising` 状态，`FSM` 可以在 `connection_request` 事件跳转到 `connected`，或在\
  \ `timer_expired` 状态下返回 `idle` 同时通过执行 `stop_advertising` 操作停止广播。\n*   当处于 `connected`\
  \ 状态时，`FSM` 仅可以在 `ble_button_pressed` 事件跳转到 `idle`，同时执行 `disconnect` 操作。\n\n`FSM`\
  \ 也可以使用状态转换表来描述。该表显示了 `FSM` 根据当前状态和输入（接收到的事件）移动的状态，以及它在转换期间执行的操作。以下是本章中分析的 BLE 设备\
  \ `FSM` 的转换表：\n\n| **当前状态** | **事件** | **目标状态** | **操作** |\n| --- | --- | --- |\
  \ --- |\n| **idle** | `ble_button_pressed` | advertising | `start_advertising` |\n\
  | **advertising** | `timer_expired` | `idle` | `stop_advertising` |\n| **advertising**\
  \ | `connection_request` | connected |  |\n| **connected** | `ble_button_pressed`\
  \ | `idle` | disconnect |\n\n表 16.1 – BLE 设备状态转换表\n\n*表 16.1* 通过列出转换来描述 BLE 设备 `FSM`。它是描述\
  \ `FSM` 行为的状态图的替代方案。我们将首先通过定义状态和事件来实现这个 `FSM`。\n\n\n\n\n我们将状态和事件建模为 `enum` 枚举器，如下代码所示：\n\
  \n```\nenum class ble_state {\n    idle,\n    advertising,\n    connected\n};\n\
  enum class ble_event {\n    ble_button_pressed,\n    connection_request,\n    timer_expired\n\
  };\n```\n\n上述 `enum` 枚举器描述了我们的 BLE 设备 `FSM` 的状态和事件。\n\n# 跟踪当前状态和处理事件 – FSM 类\n\n\
  接下来，我们将定义一个 `ble_fsm` 类，它将跟踪当前状态并提供一个公共方法 `handle_event`，我们将使用该方法向 `FSM` 馈送事件。代码如下：\n\
  \n```cpp\nclass ble_fsm {\npublic:\n    void handle_event(ble_event event);\n  \
  \  ble_state get_state() const {\n        return current_state_;\n    }\nprivate:\n\
  \    ble_state current_state_ = ble_state::idle;\n    void start_advertising() {\n\
  \        printf(\"Action: start_advertising()\\n\");\n    }\n    void stop_advertising()\
  \ {\n        printf(\"Action: stop_advertising()\\n\");\n    }\n    void disconnect()\
  \ {\n        printf(\"Action: disconnect()\\n\");\n    }\n};\n```\n\n在上面的代码中，我们定义了\
  \ `ble_fsm` 类，包含以下成员：\n\n*   `ble_state current_state_` – 一个默认值为 `ble_state::idle`\
  \ 的私有成员。我们用它来跟踪当前状态，初始值设置为 `idle`。\n*   `void start_advertising()` – 用于实现动作的私有方法。\n\
  *   `void stop_advertising()` – 用于实现动作的私有方法。\n*   `void disconnect()` – 用于实现动作的私有方法。\n\
  *   `ble_state get_state() const` – 用于获取当前状态的私有方法。\n*   `void handle_event(ble_event\
  \ event)` – 一个公共方法，用于根据 `current_event_` 通过执行动作并更改当前状态来响应事件。\n\n`handle_event` 方法实现了\
  \ `FSM` 的实际行为，其代码在此处：\n\n```cpp\nvoid ble_fsm::handle_event(ble_event event) {\n\
  switch (current_state_) {\n    case ble_state::idle:\n    if (event == ble_event::ble_button_pressed)\n\
  \    {\n        start_advertising();\n        current_state_ = ble_state::advertising;\n\
  \    }\n    break;\n    case ble_state::advertising:\n    if (event == ble_event::connection_request)\n\
  \    {\n        current_state_ = ble_state::connected;\n    }\n    else if (event\
  \ == ble_event::timer_expired)\n    {\n        stop_advertising();\n        current_state_\
  \ = ble_state::idle;\n    }\n    break;\n\n    case ble_state::connected:\n    if\
  \ (event ==ble_event::ble_button_pressed)\n    {\n        disconnect();\n      \
  \  current_state_ = ble_state::idle;\n    }\n    break;\n\n    default:\n    break;\n\
  }\n}\n```\n\n上述代码显示了 `ble_fsm` 类 `handle_event` 方法的实现。它对 `current_state_` 使用 `switch`\
  \ 语句，根据该状态处理并接收事件。事件的处理通过调用适当的并按照 `FSM` 的描述更改状态来实现。\n\n接下来，我们将看到如何使用 `ble_fsm` 类。\n\
  \n### 使用 ble_fsm 类\n\n我们首先定义一个辅助函数 `state_to_string`，用于调试我们的 `FSM`。代码如下：\n\n```cpp\n\
  static const char* state_to_string(ble_state state) {\n    switch (state) {\n  \
  \      case ble_state::idle:        return \"idle\";\n        case ble_state::advertising:\
  \ return \"advertising\";\n        case ble_state::connected:   return \"connected\"\
  ;\n        default:                     return \"unknown\";\n    }\n}\n```\n\n`state_to_string`\
  \ 函数为给定的状态 `enum` 返回一个字符串字面量。\n\n接下来，让我们看看如何使用 `ble_fsm` 类，如下代码所示：\n\n```cpp\nint\
  \ main() {\n    ble_fsm my_ble_fsm;\n    const auto print_current_state = [&]()\
  \ {\n        printf(\"Current State: %s\\n\",\n            state_to_string(my_ble_fsm.get_state()));\n\
  \    };\n    print_current_state();\n    my_ble_fsm.handle_event(ble_event::ble_button_pressed);\n\
  \    print_current_state();\n    my_ble_fsm.handle_event(ble_event::connection_request);\n\
  \    print_current_state();\n    my_ble_fsm.handle_event(ble_event::ble_button_pressed);\n\
  \    print_current_state();\n\n    return 0;\n}\n```\n\n`main` 函数中的上述代码创建了一个 `ble_fsm`\
  \ 类型的对象 `my_ble_fsm`，并按照以下顺序向其馈送事件：\n\n1.  它首先将 `ble_event::ble_button_pressed`\
  \ 传递给 `FSM` 的 `handle_event` 方法。`FSM` 的初始状态为 `idle`。\n2.  接下来，它将 `ble_event::connection_request`\
  \ 传递给 `FSM` 的 `handle_event` 方法，将其切换到 `connected`。\n3.  最后，它将 `ble_event::ble_button_pressed`\
  \ 传递给 `FSM` 的 `handle_event` 方法，将其切换回 `idle`。\n\n## 分析输出\n\n运行完整示例将产生以下输出：\n\n```\n\
  Current State: idle\nAction: start_advertising()\nCurrent State: advertising\nCurrent\
  \ State: connected\nAction: disconnect()\nCurrent State: idle\n```\n\n上述输出显示了 `FSM`\
  \ 的状态和执行的动作。你可以从书的 GitHub 在 Renode 中运行完整示例。它位于 `Chapter16/fsm` 下，你可以使用以下命令进行构建：\n\
  \n```\n$ cmake -B build\n$ cmake --build build --target run_in_renode\n```\n\n\n\
  \n\n```cpp\nclass idle : public state{\npublic:\n    ble_state handle_event(ble_event\
  \ event) {\n        if (event == ble_event::ble_button_pressed) {\n            start_advertising();\n\
  \            return ble_state::advertising;\n        }\n        return get_state_enum();\n\
  \    }\n    ble_state get_state_enum() {\n       return ble_state::idle;\n    }\n\
  private:\n    void start_advertising() {\n        printf(\"Action: start_advertising()\\\
  n\");\n    }\n};\n```\n\n在前面的代码中，我们看到 `idle` 类实现了 `state` 接口类中定义的纯虚方法：\n\n*   `ble_state\
  \ handle_event(ble_event event)` – `idle` 类检查收到的事件是否为 `ble_event::ble_button_pressed`，如果是，则调用\
  \ `start_advertising()` 并返回 `ble_state::advertising` `enum`。如果收到任何其他事件，它返回通过 `get_state_enum()`\
  \ 提供的状态。\n\n*   `ble_state get_state_enum()` – 这返回返回 `idle` 类对应的 `ble_state` `enum`，即\
  \ `ble_state::idle`。\n\n接下来，我们将遍历派生类 `advertising`，如下代码所示：\n\n```cpp\nclass advertising\
  \ : public state{\npublic:\n    ble_state handle_event(ble_event event) {\n    \
  \    if (event == ble_event::connection_request) {\n            return ble_state::connected;\n\
  \        }\n        if (event == ble_event::timer_expired) {\n            stop_advertising();\n\
  \            return ble_state::idle;\n        }\n        return get_state_enum();\n\
  \    }\n    ble_state get_state_enum() {\n       return ble_state::advertising;\n\
  \    }\nprivate:\n    void stop_advertising() {\n        printf(\"Action: stop_advertising()\\\
  n\");\n    }\n};\n```\n\n在此代码中，`advertising` 类通过妥善地处理事件实现了 `state` 接口类中定义的纯虚方法。\n\
  \n接下来，我们将查看 `connected` 具体类：\n\n```cpp\nclass connected : public state{\npublic:\n\
  \    ble_state handle_event(ble_event event) {\n        if (event == ble_event::ble_button_pressed)\
  \ {\n            disconnect();\n            return ble_state::idle;\n        }\n\
  \        return get_state_enum();\n    }\n    ble_state get_state_enum() {\n   \
  \    return ble_state::connected;\n    }\nprivate:\n    void disconnect() {\n  \
  \      printf(\"Action: disconnect()\\n\");\n    }\n};\n```\n\n正如我们在前面的代码中所看到的，`connected`\
  \ 类实现了状态接口，并妥善地实现了虚方法 `handle_event()` 和 `get_state_enum()`。\n\n接下来，我们将重构 `ble_fsm`\
  \ 类，使用状态类接口在容器中存储指向具体类对象的指针。\n\n### 重构 ble_fsm 类\n\n我们将从重构 `ble_fsm` 类开始，如下代码所示：\n\
  \n```cpp\nclass ble_fsm {\npublic:\n    void handle_event(ble_event event) {\n \
  \       if(auto the_state = get_the_state(current_state_)) { \n            current_state_\
  \ = the_state->handle_event(event);\n        }\n    }\n    ble_state get_state()\
  \ const {\n        return current_state_;\n    }\n    void add_state(state *the_state)\
  \ {\n        states_.push_back(the_state);\n    }\nprivate:\n    ble_state current_state_\
  \ = ble_state::idle;\n    etl::vector<state*, 3> states_;\n    state* get_the_state(ble_state\
  \ state_enum); };\n```\n\n让我们拆解 `ble_fsm` 类的实现：\n\n*   `ble_state current_state_`\
  \ – 一个带有默认值 `ble_state::idle` 的私有成员。我们使用它来跟踪当前状态，正如之前之前的那样。\n\n*   `etl::vector<state*,\
  \ 3> states_` – 用于存放指向状态接口指针的容器。如果你正在使用 Compiler Explorer 跟此示例，可以将其替换为 `std::vector`（并包含\
  \ `<vector>` 头文件）。\n\n*   `state* get_the_state(ble_state state_enum)` – 一个用于使用\
  \ `ble_state` `enum` 获取实际状态的私有方法。\n\n*   `void handle_event(ble_event event)` –\
  \ 一个用于处理事件的公共方法。它调用带有 `current_state_` 的 `get_the_state` 方法来获取实际状态对象的指针。如果指针有效，则调用状态对象上的\
  \ `handle_event()` 并返回值存储在 `current_state_` 中。\n\n接下来，让我们查看 `get_the_state` 方法的实现如下：\n\
  \n```cpp\nstate* ble_fsm::get_the_state(ble_state state_enum) {\nconst auto is_state_enum\
  \ = & {\n        return the_state->get_state_enum() == state_enum;\n};\nauto it\
  \ = std::find_if(states_.begin(), states_.end(), is_state_enum);\nif (it != states_.end())\
  \ {\n    return *it;\n}\n```\n\n在 `get_the_state` 方法中，我们使用 `std::find_if`（来自 `<algorithm>`\
  \ 头文件）搜索匹配 `state_enum` 的状态。`is_state_enum`  表达式作为谓词。如果找到了状态，则返回它；否则返回 `nullptr`。\n\
  \n### 实现状态模式\n\n接下来，我们将看到如何使用上述代码实现实现：\n\n```cpp\nint main() {\n    ble_fsm ble_fsm;\n\
  \    idle idle_s;\n    advertising advertising_s;\n    connected connected_s;\n\n\
  \    ble_fsm.add_state(&idle_s);\n    ble_fsm.add_state(&advertising_s);\n    ble_fsm.add_state(&connected_s);\n\
  \n    const auto print_state = [&]() {\n        printf(\"Current State: %s\\n\"\
  , state_to_string(ble_fsm.get_state()));\n    };\n\n    ble_fsm.handle_event(ble_event::ble_button_pressed);\n\
  \    print_state();\n    ble_fsm.handle_event(ble_event::connection_request);\n\
  \    print_state();\n    ble_fsm.handle_event(ble_event::timer_expired);\n    print_state();\n\
  \    ble_fsm.handle_event(ble_event::ble_button_pressed);\n    print_state();\n\n\
  \    return 0;\n}\n```\n\n在此代码中，我们看到在创建一个 `ble_fsm` 类型的 `ble_fsm` 对象后，创建了状态实例：`idle`、`advertising`\
  \ 和 `connected`。然后通过 `add_state()` 方法将它们添加到 `ble_fsm` 中。接下来，我们像最初那样使用 `FSM` 并向其输入事件。\n\
  \n你可以从项目的 GitHub 上运行完整的示例。它位于 `Chapter16/fsm`，你可以使用以下命令进行构建和运行：\n\n```bash\n$ cmake\
  \ -B build -DMAIN_CPP_FILE=main_fsm_state_pattern.cpp\n$ cmake --build build --target\
  \ run_in_renode\n```\n\n## 状态模式\n\n让我们查看 BLE 设备连接 FSM 的 UML 图，如图 16.2 所示：\n\n![图\
  \ 16.2 – BLE 设备连接 FSM – UML 图](img/B22402_16_2.png)\n\n图 16.2 – BLE 设备连接 FSM – UML\
  \ 图\n\n*图 16.2* 描述了 BLE 设备连接 `FSM` 的 UML 图。我们已经通过将状态模式应用于 `FSM`。让我们总结一下：\n\n*  \
  \ `FSM` 类在容器中持有指向状态类接口的指针。\n*   `FSM` 跟踪当前状态。\n*   `FSM` 将 `handle_event()` 调用委托给当前的具体状态。\n\
  *   具体状态实现了状态接口。\n*   具体状态实现了动作并在处理事件时妥善地调用它们。\n*   具体状态从 `handle_event()` 方法返回一个新状态。这允许\
  \ `FSM` 更新状态。\n\n状态模式是一种简单而有效的模式。然而，正如我们在上一个示例中看到的，具体状态使用 `if-else` 逻辑处理事件。随着 `FSM`\
  \ 复杂性的增加，处理函数也可能变得混乱。为了缓解这一点，我们可以应用标签分发（tag-dispatching）技术。\n\n\n\n\n\n# 使用标签分发（tag\
  \ dispatching）实现状态模式\n\n在之前的示例（在前面的章节）中，事件处理程序中的程序流是在运行时使用 `if-else` 逻辑决定的。接下来，我们将使用标签分发技术，将不同事件的事件处理解耦到独立的方法中。我们不再依赖\
  \ `ble_event` `enum`，而是创建空类型作为事件，如下面的代码所示：\n\n```cpp\nstruct ble_button_pressed{};\n\
  struct connection_request{};\nstruct timer_expired{};\n```\n\n现在，`state` 类将为每个定义的事件重载\
  \ `handle_event` 虚方法，如下所示：\n\n```cpp\nclass state {\npublic:\n    virtual ble_state\
  \ handle_event(ble_button_pressed) {\n        return get_state_enum();\n    }\n\
  \    virtual ble_state handle_event(connection_request) {\n        return get_state_enum();\n\
  \    }\n    virtual ble_state handle_event(timer_expired) {\n        return get_state_enum();\n\
  \    }\n    virtual ble_state get_state_enum() = 0;\n};\n```\n\n在此代码中，我们看到 `state`\
  \ 类不再是一个接口，而是一个抽象类（因为并不是所有虚方法都是纯虚）。它为 `ble_button_pressed`、`connection_request`\
  \ 和 `timer_expired` 类型重载了 `handle_event` 函数。它通过返回 `get_state_enum` 生成的值来实现所有重载——`get_state_enum`\
  \ 是一个纯虚方法，由派生类（即具体的状态）来实现。\n\n接下来，让我们看看 `advertising`类的实现：\n\n```cpp\nclass advertising\
  \ : public state{\npublic:\n    ble_state handle_event(connection_request cr){\n\
  \        return ble_state::connected;\n    }\n    ble_state handle_event(timer_expired\
  \ te){\n        stop_advertising();\n        return ble_state::idle;\n    }\n  \
  \  ble_state get_state_enum() {\n       return ble_state::advertising;\n    }\n\
  private:\n    void stop_advertising() {\n        printf(\"Action: stop_advertising()\\\
  n\");\n    }\n};\n```\n\n在此代码中，我们看到 `advertising` 类实现了虚方法 `handle_event` 的以下重载：\n\
  \n- `ble_state handle_event(connection_request cr)` 返回 `ble_state::connected`。\n\
  - `ble_state handle_event(timer_expired te)` 调用 `stop_advertising` 并返回 `ble_state::idle`。\n\
  \n通过使用重载函数，我们可以在独立的方法中实现不同事件的处理，并通过调用带有不同类型的 `handle_event` 来轻松地分发这些调用。为了完成实现，我们还需要在\
  \ `FSM` 中为所有可能的事件重载 `handle_event` 方法。我们可以通过将其变为模板方法来轻松实现这一点，如下代码所示：\n\n```cpp\n\
  class ble_fsm {\npublic:\n    template<typename E>\n    void handle_event(E event)\
  \ {\n        if(auto the_state = get_the_state(current_state_))\n        {\n   \
  \         current_state_= the_state->handle_event(event);\n        }\n    }\n//...\n\
  };\n```\n\n前面的代码显示了 `ble_fsm` 类中的模板方法 `handle_event`，使得我们的标签分发技术应用完整了。\n\n你可以在书籍的\
  \ GitHub 仓库中的 Renode 模拟器运行完整示例。它被放在 `Chapter16/fsm` 下，你可以使用以下命令编译并运行它：\n\n```bash\n\
  $ cmake –B build\n-DMAIN_CPP_FILE_NAME=main_fsm_state_pattern_tag_dispatch.cpp\n\
  $ cmake --build build --target run_in_renode\n```\n\n到此为止，我们在本章中看到了在 C++ 中实现 `FSM`\
  \ 的三种方法。我们从简单的基于 `switch` 和 `if-else`的方法开始，应用了状态设计模式，然后利用了标签分发。每一步都为我们的设计提供了更多的灵活性——使得代码更易读且更易管理，这在处理复杂的\
  \ `FSM` 时非常重要。\n\n还有其他实现 `FSM` 的方法，基于状态转移表，该表可以在一个地方描述转移。Boost **State Machine Language**\
  \ (**SML**) 使用基于表的方法，使用描述性语法来描述 `FSM`。\n\n# Boost SML\n\nBoost SML 是一个高表达的 C++14\
  \ 单头文件库，用于实现 `FSM`。我们将直接通过实现相同的 BLE 设备连接 `FSM` 来跳跃学习过程。以下是代码：\n\n```cpp\n#include\
  \ \"sml.hpp\"\nnamespace sml = boost::sml;\nstruct ble_button_pressed{};\nstruct\
  \ connection_request{};\nstruct timer_expired{};\nconstexpr auto start_advertising\
  \ = [](){\n    printf(\"Action: start_advertising()\\n\");\n};\nconstexpr auto stop_advertising\
  \ = [](){\n    printf(\"Action: stop_advertising()\\n\");\n};\nconstexpr auto disconnect\
  \ = [](){\n    printf(\"Action: disconnect()\\n\");\n};\nstruct ble_fsm {\n  auto\
  \ operator()() const {\n    using namespace sml;\n        return make_transition_table(\n\
  \        *\"idle\"_s + event<ble_button_pressed>\n        / start_advertising  \
  \                        = \"advertising\"_s,\n        \"advertising\"_s  + event<connection_request>\
  \ = \"connected\"_s,\n        \"advertising\"_s  + event<timer_expired>     \n \
  \       / stop_advertising                           = \"idle\"_s\n    );\n  }\n\
  };\n```\n\n让我们拆解 `make_transition_table` 语法：\n\n- `src_state`：这是转移开始的状态。\n- `+ event`：这是触发转移的事件。\n\
  - `[ guard ]`：guard 是可选谓词，必须为真才会发生转移。\n- `/ action`：action 是转移发生时执行的可选 lambda。\n\
  - `= dst_state`：这是 `FSM` 将去的目标状态。\n\n现在让我们看看如何使用我们讨论过的 SML 使用 `FSM`：\n\n```cpp\n\
  \ sm<ble_fsm> my_ble_fsm{};\n    const auto print_current_state = [&]() {\n    \
  \    printf(\"Current State: \");\n        if(my_ble_fsm.is(\"idle\"_s)) {\n   \
  \         printf(\"idle\\n\");\n        }\n        if(my_ble_fsm.is(\"advertising\"\
  _s)) {\n            printf(\"advertising\\n\");\n        }\n        if(my_ble_fsm.is(\"\
  connected\"_s)) {\n            printf(\"connected\\n\");\n        }\n    };\n  \
  \  print_current_state();\n    my_ble_fsm.process_event(ble_button_pressed{});\n\
  \    print_current_state();\n    my_ble_fsm.process_event(connection_request{});\n\
  \    print_current_state();\n    my_ble_fsm.process_event(timer_expired{});\n  \
  \  print_current_state();\n```\n\n在此代码中，我们创建一个类型为 `sm<ble_fsm>`的对象 `my_ble_fsm`。然后，我们使用\
  \ `process_event` 方法向它发送事件。\n\n\n\n\n\nBoost SML 不仅是一个表达丰富的库，而且性能极高，这得益于它使用编译时模板元编程对代码进行积极优化。事件分发依赖于标签分发（在编译时解析）并结合最少的运行时查找，避免了开销昂贵的分支或间接。这种方法通常优于基于\
  \ `switch`-`enum` 的手动解决方案以及基于状态模式（State pattern）的实现（后者会产生虚调用开销）。具体的性能对比，请参见以下链接中的基准：[`github.com/boost-ext/sml?tab=readme-ov-file#benchmark`](https://github.com/boost-ext/sml?tab=readme-ov-file#benchmark)。\n\
  \n## 总结\n\n在本章中，我们学习了 `FSM` 的实现，从简单的 `switch-case` 方法开始，到状态模式、标签分发，以及使用 Boost SML\
  \ 库编写具有高度表现力的代码。\n\n最基础的基于 `switch` 的实现适用于状态和转换有限的小型 `FSM`。当 `FSM` 的复杂性增加时，它变得难以阅读和管理。转向基于状态模式的解决方案可以提高代码的可读性并使更改更加容易。Boost\
  \ SML 提供了极致的表达，为我们提供了一种易读的语法，允许我们以简洁的方式编写非常复杂的 `FSM`。\n\n在下一章中，我们将概述适用于嵌入式系统开发的\
  \ C++ 库和框架。\n\n# 17 库与框架\n\n虽然 C++ 标准库提供了大量的容器和算法，但在某些方面——例如动态内存分配——在受限环境中可能会带来挑战。在*第\
  \ 2 章* 中，我们探索了这些问题以及解决办法。然而，专门的库，如嵌入式模板库（`ETL`），提供了具有确定性的行为和固定的内存占用，非常适合嵌入式系统。\n\
  \n嵌入式应用程序依赖于供应商以 C 库形式提供的硬件抽象层（`HALs`）。在*第 12 章* 中，我们研究了如何使用接口将应用层 C++ 代码与底层的 C\
  \ 硬件交互解耦。将整个 HAL 封装在 C++ 中是一项大量的工作，但幸运的是，有像 Google 的 Pigweed 这样的项目正在解决这个问题，同时为嵌入式开发提供了额外的功能和灵活性。\n\
  \n在*第 11 章* 中，我们探索了 C++ 如何在编译时进行计算以减少内存占用。在*第 15 章* 中，我们学习了观察者模式并研究了它的编译实现。Intel\
  \ 的编译时初始化与构建（`CIB`）进一步提升了这些想法，允许在编译时以声明的方法配置固件应用程序。在本章中，我们将介绍以下 C++ 库：\n\n*   标准库\n\
  *   嵌入式模板库\n*   Pigweed\n*   编译时初始化与构建\n\n## 技术要求\n\n你可以在*第 4 章* 中设置的 Docker 容器中的\
  \ Renode 模拟器中尝试本章的示例。请确保 Docker 容器正在运行。\n\n你可以在 GitHub 上找到本章的文件：[`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter17`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter17)。\n\
  \n## 标准库\n\nC++ 标准定义了两种类型的标准库实现：托管式（hosted）和无托管式（freestanding）：\n\n*   无托管式实现设计用于不依赖于通常由操作系统提供的服务运行，例如文件系统访问或多线程支持。因此，C++\
  \ 标准仅规定了无托管式实现必须提供的有限标准库头文件子集。\n*   托管式实现需要一个全局定义的 `main` 函数，环境负责在启动时调用此函数。在无托管式实现中，启动例程和程序的入口点是由实现定义的，这允许开发者在指定应用程序的初始化和执行流时具有更大的灵活性。\n\
  \n尽管标准在全局定义的 `main` 函数方面对托管式和无托管式实现做了明确的区分，但本书中某些示例的配置模糊了两者之间的界限。\n\n## 无托管和托管式实现\n\
  \n尽管标准在全局定义的 `main` 函数方面对托管式和无托管式实现做了明确的区分，但本书中某些示例的配置模糊了两者之间的界限。这之所以可能，是因为：\n\n\
  *   正如我们在*第 4 章* 中观察到的，我们在链接脚本中设置了入口 `Reset_Handler`。\n*   `Reset_Handler` 实现在汇编启动脚本中，执行初始化并显式调用\
  \ `main`。\n*   我们在*第 7 章* 中使用了标准库的精简子集，避免了对操作系统的依赖。\n\n这种混合方法利用了 GCC 的灵活性，将无托管执行（自定义入口点，无操作系统）与托管功能（标准头文件、工具）结合在裸机环境中。\n\
  \n为了显式请求 GCC 使用标准库的无托管实现，应使用编译器标志 `-ffreestanding`。C++ 标准库提供了许多“按需付费”的组件，即使在资源受限的环境中也非常有用。在之前的章节中，你已经与标准库的许多部分一起工作，因此对它的功能有了良好的理解。在这里，我们将概述最适合资源受限环境的部分，并指出哪些部分应该谨慎使用或尽量避免。\n\
  \n### 数值与数学\n\n嵌入式系统通常用于自动化和过程控制，需要对数值类型、范围和数学运算进行精确控制。C++ 标准库提供了 `<cstdint>`、`<limits>`\
  \ 和 `<cmath>` 头文件，用于定义固定宽度整数、查询数值限制和执行数学计算，有助于确保在资源受限环境中的预测性、可移植性和效率。\n\n### <cstdint>\n\
  \n`<cstdint>` 头文件提供了固定宽度类型，如 `std::int8_t`、`std::uint32_t` 以及在 `stdint.h` 中定义的其他常用\
  \ C 类型。这些类型在嵌入式环境中非常有用，对于直接硬件寄存器访问、可预测的溢出行为和内存使用。通过使用它们，你显式说明了变量大小的意图，从而提高了可移植性，并防止在具有不同原生整数宽度的平台之间出现意外。\n\
  \n### <limits>\n\n该头文件提供了 `std::numeric_limits` 模板，描述了基本数值类型的属性（如最小值、最大值、符号和精度）。这对处理溢出特别。。用法发生在编译时，或通过编译器的简单内联完成，运行时开销极小。通过使用\
  \ `std::numeric_limits::max()` 等函数，你避免了散布硬编码常量或特定架构的假设，有助于可移植性和可维护性。\n\n### <cmath>\n\
  \n\n\n\n\n`<cmath>` 头文件提供了标准的数学函数，如 `std::sin`、`std::cos`、`std::sqrt` 等。在嵌入式环境中，特别是在没有浮点运算硬件的环境下，这些函数在运行时性能和代码大小方面可能相当昂贵。请仔细考虑你是否真的需要浮点运算，如果需要，考虑近似算法或定点例程是否足够且高效。\n\
  \n## 容器与算法\n\n嵌入式系统通常需要管理结构化数据，并在紧的资源限制下需要高效处理这些数据。C++ 标准库提供了如 `<array>`、`<<span>>`\
  \ 和 `<algorithm>` 等容器和算法头，用于组织数据并执行搜索、排序和转换等常见操作，使代码更具可读性和可维护性。\n\n### std::array\n\
  \n标准库中唯一避免动态分配的固定大小容器是 `std::array`。我们在第 1 章 讨论泛型类型时介绍过它。在同一章节中，我们基于 `std::array`\
  \ 实现了环形缓冲区（ring buffer），这使得能够使用相同的泛型代码创建不同类型和大小的环形缓冲区。\n\n`std::array` 通常实现为 C 风格数组的封装。除了是一个泛型类型外，它还提供了\
  \ `at` 方法，用于带有运行时边界检查的索引访问，使其成为原始数组更安全的替代方案。如果请求了越界索引，`at` 方法将抛出异常。如果禁用了异常，它可能会调用\
  \ `std::terminate` 或 `std::abort`，取决于库的实现。应根据系统要求，通过实现适当的终止和信号处理器来处理这些行为。\n\n###\
  \ std::priority_queue\n\n`std::priority_queue` 是提供优先级队列功能的容器适配器。默认情况下，它使用 `std::vector`\
  \ 作为底层容器。但如第 14 章所示，你可以用 ETL 中的 `etl::vector` 替换它，从而避免动态内存分配的问题。\n\n### std::span\n\
  \n如第 9 章所示，`std::span` 是对连续对象序列的轻量级非所有权封装，其中第一个元素位于位置 0。它提供了基本功能，如 `size()` 方法、用于访问元素的\
  \ `operator[]` 以及 `begin()` 和 `end()` 迭代器，使其能够无缝集成标准库算法。\n\n`std::span` 可以由 C 风格数组构造，也可以由\
  \ `std::array`、`std::vector` 或 `etl::vector` 等容器构造。这使其成为使用独立指针和大小参数的实用替代方案，在将 C++\
  \ 代码与 HAL 中使用的 C 库进行接口时特别有用。\n\n### 迭代器\n\n迭代器是类似于通用指针的抽象，为遍历和访问容器内的元素提供了一种统一方法。例如，标准库容器实现了\
  \ `begin()` 和 `end()` 方法，它们返回标记序列起始和末尾之后位置的迭代器。这种一致的接口允许算法在不同的容器类型上泛化地工作，增强了代码的可重用性和清晰度。\n\
  \n让我们来看使用 `std::array` 的后续示例：\n\n```cpp\n#include <array>\n#include <algorithm>\n\
  #include <cstdio>\nint main() {\n    std::array<int, 5> arr = {5, 3, 4, 1, 2};\n\
  \    std::array<int, 5>::iterator start = arr.begin();\n    auto finish = arr.end();\n\
  \    std::sort(start, finish);\n    for (auto it = arr.begin(); it != arr.end();\
  \ ++it) {\n        printf(\"%d \", *it);\n    }\n    printf(\"\\n\");\n    return\
  \ 0;\n}\n```\n\n此示例演示了如何在标准库容器上使用迭代器：\n\n*   迭代器 `start` 被显式声明为 `std::array<int,\
  \ 5>::iterator` 以展示完整类型名，而迭代器 `finish` 使用 `auto` 声明以保持简洁，允许编译器推断其类型。\n*   使用从 `arr.begin()`\
  \ 和 `arr.end()` 获取的迭代器 `start` 和 `finish` 应用 `std::sort` 算法，以按升序对数组进行排序。\n*   循环使用\
  \ `auto` 声明迭代器 `it`，使代码更简洁。循环遍历排序后的数组，并使用 `printf` 打印每个元素。\n\n迭代器用于遍历容器。它们不仅促进了泛型编程，还允许在不改变算法逻辑的情况下切换容器类型。\n\
  \n### 算法\n\n标准库中的算法提供了一种跨不同容器解决常见问题的统一方法，使代码更具表现力且更容易维护。它们允许你使用统一接口执行搜索、排序、拷贝和累加数据等操作。这里列出了一些常用的算法：\n\
  \n*   `std::sort`：默认按升序对范围范围排序，使用小于运算符进行比较。它也可以接受自定义比较器，以根据不同的标准（如降序或特定对象属性）进行排序。\n\
  *   `std::find`：在范围内搜索给定值的首次出现并返回指向它的迭代器。如果未找到该值，则返回结束迭代器，表示搜索失败。\n*   `std::for_each`：对范围内的每个元素应用指定的函数或\
  \ lambda 。\n*   `std::copy`：将一个范围的元素拷贝到另一个目标范围。\n*   `std::copy_if`：仅拷贝满足指定谓元的元素，对于过滤数据非常有用。\n\
  *   `std::min` 和 `std::max`：分别返回两个中较小或较大的值（默认使用小于运算符或提供的比较函数）。\n*   `std::min_element`\
  \ 和 `std::max_element`：返回范围内最小或最大元素的迭代器。当你需要找到极值的位置而非仅比较值时非常有用。\n*   `std::accumulate`：遍历范围并使用二值操作组合元素（默认为加法）。这允许执行求和、求积或任何自定义聚合。\n\
  \n## 模板元编程\n\n如第 8 章所述，C++ 类型特性是编译时谓元和转换，允许根据类型属性实施约束。它们允许在不产生运行时负载的情况下编写健壮的代码。在第\
  \ 12 章中，我们使用类型特性创建了安全的寄存器访问，在编译时防止了无效类型的使用。\n\n以下是提到的章节中使用的具体类型特性：\n\n- 根据布尔编译时表达式启用或禁用函数模板\n\
  *   `std::is_same`：检查两个类型是否完全相同\n*   `std::is_enum`：检查类型是否为枚举类型\n*   `std::underlying_type`：获取枚举的底层整数类型\n\
  *   `std::is_arithmetic`：检查类型是否为算术类型（整数或浮点数）\n*   `std::is_integral`：检查类型是否为整数类型\n\
  *   `std::is_floating_point`：检查类型是否为浮点类型\n\n## 嵌入式应用中应避免的标准库部分\n\n标准库中的许多容器（如 `std::vector`、`std::list`\
  \ 和 `std::string`）使用动态内存分配。如果你的嵌入式应用不允许动态内存分配，则应避免使用内容。\n\n\n\n\n`iostream` 库包含在头文件`<iostream>`\
  \ 中，它消耗大量的内存资源并依赖动态分配。这就是为什么我们使用 `<cstdio>`头文件和 `printf` 函数进行控制台输出。\n\n在`第 10 章`中，我们介绍了了`<functional>`头文件中的\
  \ `std::function`。在那里，我们概述了在某些情况下 `std::function` 可以使用动态内存分配，这意味着如果使用，应当谨慎。请注意，`std::function`\
  \ 在独立实现（freestanding implementation）中不可用。\n\n接下来，我们将简要概述 ETL，它在受限的嵌入式环境中是对标准库的补充。\n\
  \n## 嵌入式模板库\n\n在`第 2 章`中，我们看到 `std::vector` 默认使用动态内存分配。我们也看到可以使用 `std::polymorphic_allocator`\
  \ 和单调缓冲区（monotonic buffer）来使其使用静态分配的内存。这种方法仍然不是万无一的，因为在某些情况下，`std::vector` 即使使用这种方法也可能退回到动态内存分配。\n\
  \n为了解决标准库在嵌入式环境中带来的挑战，ETL 提供了一系列模板容器和算法，它们紧密模拟了标准库对应项的接口，但针对资源有限的系统进行了定制。\n\n##\
  \ 固定大小容器\n\nETL 的主要优势之一是它的容器（如 `etl::vector`、`etl::list`、`etl::string` 等）允许你在编译时指定固定的最大尺寸。容器实现确保在运行时不执行动态内存分配，因为内存已作为原子或静态存储提前预留。\n\
  \n由于 ETL 容器设计用于模拟标准库容器，并且它们实现了迭代器，因此它们可以与标准库的大多数算法和容器适配器配合使用。这允许我们利用标准库的组件而不必担心动态分配。\n\
  \nETL 还为不支持 C++11 的平台提供了 `etl::array`，因为 `std::array` 是在 C++11 引入的。\n\n## 使用 etl::delegate\
  \ 存储调用对象\n\n如`第 14 章` 了解更多关于 ETL 的信息。\n\n接下来，我们将讨论 Pigweed —— 这是一个由 Google 开发的用于嵌入系统的轻量级模块化\
  \ C++ 库集合，提供了日志、断言和蓝牙连接等组件，以简化开发并提高代码复用。\n\n## Pigweed\n\n嵌入式系统开发中最大的挑战之一是可移植性。要让代码具有真正的可移植性，它必须依赖接口。要在不同的硬件目标上运行它，有人需要在不同的目标上实现这些接口。在各种项目和设备之间保持一致的接口可能是困难的。Google\
  \ 的 Pigweed 项目旨在通过为嵌入式应用提供软件模块来解决这个问题，并已经为许多目标实现了硬件接口。\n\nPigweed 用于复杂项目和大型团队。除了硬件接口，它还：\n\
  \n*   封装了构建在其上的软件模块，例如日志、串口通信（SPI、I2C 和 UART）、蓝牙主机控制器接口 (`HCI`）、交互式控制台、远程过程调用 (`RPC`)\
  \ 系统等。\n*   提供了嵌入式友好库组件替代方案：固定大小字符串和容器。\n*   开箱管理整个工具链并简化了开发环境的设置。\n*   提供了一个完整的框架——\
  \ `pw_system` —— 它将 Pigweed 的许多模块整合在一起，构建出一个具有 RPC、日志等功能的运行系统。\n\n如你所见，Pigweed 不仅仅是一个库——它是一个完整的开发生态系统。它可以作为框架使用，你也可以挑选适合你需求的单个模块。正如文档网站\
  \ [`pigweed.dev/`](https://pigweed.dev/) 上所述的，Pigweed 仍处于早期阶段；某些模块仍处于开发阶段，而某些已经稳定并使用在已上市的设备上。与任何库一样，你需要评估它在你的项目中的潜在用途。\n\
  \n我们将通过 Pigweed 的 Sense 教程来演示它的某些能力——主要是交互式控制台和 `RPC` 系统。\n\n## Pigweed 的 Sense\
  \ 教程\n\nSense 项目是一个演示项目，它利用了许多 Pigweed 组件并展示了它们是如何工作的。\n\nSense 是空气质量传感器的简化版本，仅包含完整产品的部分功能。其目标是通过遵循以下步骤，让你获得使用\
  \ Pigweed 的实践经验：\n\n1.  首先，确保 Docker 守护进程正在运行。以网络主机模式启动 Docker 镜像并将其附加到 Bash。你可以在\
  \ Linux 环境下使用以下命令：\n\n```\n$ sudo systemctl start docker\n$ docker run --network=host\
  \ -d -it --name dev_env mahmutbegovic/cpp_in_embedded_systems\n$ docker exec -it\
  \ dev_env /bin/bash\n```\n\n对于基于 Windows 的主机，使用以下命令转发运行教程所需的端口：\n\n```\n$ docker\
  \ run -d -it --name dev_env -p 33000:33000 -p 8080:8080 mahmutbegovic/cpp_in_embedded_systems\n\
  ```\n\n2.  接下来，克隆 Sense 仓库：\n\n```\n$ git clone https://pigweed.googource.com/pigweed/showcase/sense\n\
  ```\n\n3.  接下来，启动 VS Code，附加到运行的容器并打开 `/workspace/sense` 文件夹。如果 VS Code 弹出建议安装扩展的消息，接受它；否则，进入“扩展”（Extensions），搜索\
  \ `Pigweed` 并安装它。\n\n4.  安装完成后，进入资源管理器视图并展开 **BAZEL BUILD TARGETS** 节点。点击“刷新列表”（Refresh\
  \ Target List）按钮。\n\n刷新列表可能需要 30 秒到几分钟。Pigweed 使用 Bazel 进行构建自动化。刷新后的列表应该像所示：\n\n\
  5.  接下来，展开 `//apps/blinky` 节点。\n\n6.  现在，我们将构建一个在主机上运行的应用版本。右键点击 `simulator_blinky\
  \ (host_device_simulator_binary)` 然后选择“构建目标”（Build Target）。构建可能需要 10 分钟。完成后，你应该看到类似下面的消息：\n\
  \n7.  构建完成后，我们将启动应用。右键点击 `simulator_blinky (host_device_simulator_binary)` 然后选择“运行目标”（Run\
  \ Target）。如果成功，你将在终端中看到以下消息：**等待连接到端口 33000**。\n\n\n\n\n2. 接下来，右键点击 `simulator_console\
  \ (native_binary)` 并选择 `Run Target`（运行目标）。这将构建控制台并连接到运行中的模拟器。如果成功，你应该看到以下界面：\n\n\
  ![图 17.6 – 在终端视图中运行的交互式控制台](img/B22402_17_6.png)\n\n图 17.6 – 在终端视图中运行的交互式控制台\n\n\
  在`图 17.6` 中，你可以看到 Visual Studio Code 终端视图中的交互式控制台。\n\n1. 为了方便操作，右键点击 `Run //apps/blinky:simulator_console`\
  \ 并选择 `Move Terminal into New Window`（将终端到新窗口）。这将控制台移动到一个独立的窗口中，如图所示：\n\n![图 17.7\
  \ – 在独立窗口中运行的交互式控制台](img/B22402_17_7.png)\n\n图 17.7 – 在独立窗口中运行的交互式控制台\n\n在`图 17.7`\
  \ 中，右上角的 `Device Logs`（设备日志）面板显示了来自模拟设备（在主机上运行的应用程序）的日志。它每秒发送一次 `LED blinking`（LED\
  \ 闪烁）消息。\n\n1. 接下来，我们将使用 RPC 协议向设备发送消息，以获取设备测量的温度。在左下角的面板 `Python Repl` 中输入以下命令：\n\
  \n```\n$ device.rpcs.board.Board.OnboardTemp()\n```\n\n你应该能看到如下响应：\n\n```\n$ (Status.OK,\
  \ board.OnboardTempResponse(temp=20.0))\n```\n\n1. 接下来，发送一条切换 LED 状态的消息：\n\n```\n\
  $ device.rpcs.blinky.Blinky.Blink(interval_ms=200, blink_count=3)\n```\n\n此调用将使\
  \ LED 以 200 ms 的间隔闪烁三次，之后停止发送 `LED blinking` 消息。这向我们说明我们也可以为 RPC 调用提供参数。\n\n接下来，我们将详细介绍\
  \ Pigweed 的 RPC。\n\n### RPC 和 Protocol Buffers\n\nPigweed 的 RPC 系统基于 Protocol Buffers\
  \ – 这是一种用于数据序列化的平台无关的机制。Protocol Buffers 是一种拥有自己语法的语言，它可以编译为目标语言，例如在我们 Sense 设备上的\
  \ C++，以及我们在 Python `Read Eval Print Loop`（`REPL`）中使用的 Python 代码。\n\n那么，为什么要在嵌入式应用中使用像\
  \ Protocol Buffers 这样的额外抽象层呢？标准化序列化为你的项目带来了几个好处：\n\n*   紧凑的二进制消息 – 它们的开销极小。\n* \
  \  系统不同部分之间精确的约（`.proto` 文件），确保所有方对交换数据的结构和含义达成一致。\n*   通过修改 proto 文件可以管理通信协议的更新。\n\
  \n简而言之，你不需要在多个代码库（C++ 和 Python）中编写并维护序列化和反序列化代码，而是在 proto 文件中编写通信协议，并使用 Protocol\
  \ Buffers 编译器生成用于序列化的 C++ 和 Python 代码。\n\n让我们查看 `modules/blinky/blinky.proto` 文件中的部分内容，该文件描述了在*Pigweed\
  \ Sense 教程*章节中使用的 Blinky 服务，该服务通过以下代码以 200 ms 的间隔闪烁 LED 三次：\n\n```\nsyntax = \"\
  proto3\";\npackage blinky;\nimport \"pw_protobuf_protos/common.proto\";\nservice\
  \ Blinky {\n// 切换 LED 的开启或关闭。\nrpc ToggleLed(pw.protobuf.Empty) returns(pw.protobuf.Empty);\n\
  // 按指定的次数闪烁板 LED。\nrpc Blink(BlinkRequest) returns (pw.protobuf.Empty);\n}\nmessage\
  \ BlinkRequest {\n// 闪烁 LED 的间隔，单位为毫秒。uint32 interval_ms = 1;\n// 闪烁 LED 的次数。\n\
  optional uint32 blink_count = 2;\n}\n```\n\n此 proto 文件定义了一个名为 `Blinky` 的服务用于控制 LED，使用了\
  \ Protocol Buffers 版本 3（`syntax = \"proto3\"`）。它导入了一个 `common` proto 文件并定义了两个方法：\n\
  \n*   `ToggleLed`: 一个简单的方法，使用空请求和响应来切换 LED 的开启或关闭。\n*   `Blink`: 一个使用可配置的 `interval_ms`\
  \ 和可选 `blink_count`（`BlinkRequest` 的成员）闪烁 LED 的方法。使用 `optional` 关键字意味着调用该方法时可以省略此参数。\n\
  \n这是对 blinky.proto 文件的简要说明。可以在以下网站找到更关于 Protocol Buffers 的详细指南：[`protobuf.dev/programming-guides/proto3/`](https://protobuf.dev/programming-guides/proto3/)。\n\
