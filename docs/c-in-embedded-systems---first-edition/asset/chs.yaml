  \n---\n由于由于提供的文本包含大量重复的段落，以下是按逻辑顺序整理且不重复的**完整翻译内容**：\n\n[content]\n2. 接下来，右键点击 `simulator_console\
  \ (native_binary)` 并选择 `Run Target`（运行目标）。这将构建控制台并连接到运行中的模拟器。如果成功，你应该看到以下界面：\n\n\
  ![图 17.6 – 在终端视图中运行的交互式控制台](img/B22402_17_6.png)\n\n图 17.6 – 在终端视图中运行的交互式控制台\n\n\
  在`图 17.6` 中，你可以看到 Visual Studio Code 终端视图中的交互式控制台。\n\n1. 为了方便操作，右键点击 `Run //apps/blinky:simulator_console`\
  \ 并选择 `Move Terminal into New Window`（将终端到新窗口）。这将控制台移动到一个独立的窗口中，如图所示：\n\n![图 17.7\
  \ – 在独立窗口中运行的交互式控制台](img/B22402_17_7.png)\n\n图 17.7 – 在独立窗口中运行的交互式控制台\n\n在`图 17.7`\
  \ 中，右上角的 `Device Logs`（设备日志）面板，我们可以看到来自模拟设备（在主机上运行的应用程序）的日志。它每秒发送一次 `LED blinking`（LED\
  \ 闪烁）消息。\n\n1. 接下来，我们将使用 RPC 协议向设备发送消息，以获取设备测量的温度。在左下角的面板 `Python Repl` 中输入以下命令：\n\
  \n```\n$ device.rpcs.board.Board.OnboardTemp()\n```\n\n你应该能看到如下响应：\n\n```\n$ (Status.OK,\
  \ board.OnboardTempResponse(temp=20.0))\n```\n\n1. 接下来，发送一条切换 LED 状态的消息：\n\n```\n\
  $ device.rpcs.blinky.Blinky.Blink(interval_ms=200, blink_count=3)\n```\n\n此调用将使\
  \ LED 以 200 ms 的间隔闪烁三次，之后停止发送 `LED blinking` 消息。这向我们说明我们也可以为 RPC 调用提供参数。\n\n接下来，我们将详细介绍\
  \ Pigweed 的 RPC。\n\n### RPC 和 Protocol Buffers\n\nPigweed 的 RPC 系统基于 Protocol Buffers\
  \ – 这是一种用于数据序列化的平台无关的机制。Protocol Buffers 是一种拥有自己语法的语言，它可以编译为目标语言，例如在我们 Sense 设备上的\
  \ C++，以及我们在 Python `Read Eval Print Loop`（`REPL`）中使用的 Python 代码。\n\n那么，为什么要在嵌入式应用中使用像\
  \ Protocol Buffers 这样的额外抽象层呢？标准化序列化为你的项目带来了几个好处：\n\n*   紧凑的二进制消息 – 它们的开销极小。\n* \
  \  系统不同部分之间精确的约（`.proto` 文件），确保所有方对交换数据的结构和含义达成一致。\n*   通过修改 proto 文件可以管理通信协议的更新。\n\
  \n简而言之，你不需要在多个代码库（C++ 和 Python）中编写并维护序列化和反序列化代码，而是在 proto 文件中编写通信协议，并使用 Protocol\
  \ Buffers 编译器生成用于序列化的 C++ 和 Python 代码。\n\n让我们查看 `modules/blinky/blinky.proto` 文件中的部分内容，该文件描述了在*Pigweed\
  \ Sense 教程*章节中使用的 Blinky 服务，该服务通过以下代码以 200 ms 的间隔闪烁 LED 三次：\n\n```\nsyntax = \"\
  proto3\";\npackage blinky;\nimport \"pw_protobuf_protos/common.proto\";\nservice\
  \ Blinky {\n// 切换 LED 的开启或关闭。\nrpc ToggleLed(pw.protobuf.Empty) returns(pw.protobuf.Empty);\n\
  // 按指定的次数闪烁板 LED。\nrpc Blink(BlinkRequest) returns (pw.protobuf.Empty);\n}\nmessage\
  \ BlinkRequest {\n// 闪烁 LED 的间隔，单位为毫秒。uint32 interval_ms = 1;\n// 闪烁 LED 的次数。\n\
  optional uint32 blink_count = 2;\n}\n```\n\n此 proto 文件定义了一个名为 `Blinky` 的服务用于控制 LED，使用了\
  \ Protocol Buffers 版本 3（`syntax = \"proto3\"`）。它导入了一个 `common` proto 文件并定义了两个方法：\n\
  \n*   `ToggleLed`: 一个简单的方法，使用空请求和响应来切换 LED 的开启或关闭。\n*   `Blink`: 一个使用可配置的 `interval_ms`\
  \ 和可选 `blink_count`（`BlinkRequest` 的成员）闪烁 LED 的方法。使用 `optional` 关键字意味着调用该方法时可以省略此参数。\n\
  \n这是对 blinky.proto 文件的简要说明。可以在以下网站找到关于 Protocol Buffers 的详细指南：[`protobuf.dev/programming-guides/proto3/`](https://protobuf.dev/programming-guides/proto3/)。\n\
  \n对于 `blinky` proto 文件中的每个服务，Pigweed 的代码生成器将生成一个对应的 C++ 类。生成的 `Blinky` 类位于文件包内专门的\
  \ `pw_rpc::nanopb` 子命名空间中：`blinky::pw_rpc::nanopb::Blinky::Service`。\n\n生成的类作为一个基类，必须通过继承它来实现服务的方法。它对派生类进行了模板化。`BlinkService`\
  \ 类实现了该基类。以下代码是其在 `modules/blinky/service.h` 文件中的定义部分：\n\n```\nclass BlinkyService\
  \ final : public ::blinky::pw_rpc::nanopb::Blinky::Service {\npublic:\n    pw::Status\
  \ ToggleLed(const pw::protobuf::Empty&, pw::protobuf::Empty&);\n    pw::Status Blink(const\
  \ BlinkRequest&, pw::protobuf::Empty&);\n};\n```\n\n\n\n正如你在`第 15 章`中所看到的，观察者模式通常用于事件驱动系统，以将事件源（发布者）与对事件做出响应的实体（观察者或订阅者）解耦。通过使用订阅者接口，观察者可以注册到事件源，然后由事件源通知它们更改或事件，而无需了解观察者实现的细节。\n\
  \n这种解耦使得系统设计具有更高的灵活性和模块化，因为可以添加、删除或修改组件，而将它们与事件生成器紧密耦合。CIB 库利用了这一特性，它实现了编译时观察者模式，为配置固件应用程序提供声明式接口。通过在编译时解析依赖并建立事件驱动关系，CIB\
  \ 消除了运行时开销，同时保持组件的松耦合和高效互连。\n\n我们将从一个简单的温度发布者示例开始探索 CIB 库。整个示例可以在 [`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter17/cib`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter17/cib)\
  \ 找到。你可以使用以下命令运行它：\n\n```\n$ cmake –B build\n$ cmake --build build --target run_in_renode\n\
  ```\n\n你可以使用 `app/src/main.cpp` 来跟进示例，因为在编写时，CIB 尚未以库的形式在 Compiler Explorer 中可用。\n\
  \n## 在温度发布者示例中使用 CIB\n\n让我们从以下步骤开始：\n\n1.  首先，我们需要将一个服务（发布者）声明为继承自 `callback::service`\
  \ 的空结构体。`callback::service` 是一个变变模板类，提供了订阅者将接受的类型，如下代码所示：\n\n    ```\n    struct\
  \ send_temperature : public callback::service<float> {};\n    ```\n\n2.  接下来，我们将创建订阅者（在\
  \ CIB 库上下文中也称为组件）`display_temperature_component` 和 `data_sender_component`，如下代码所示：\n\
  \n    ```\n    struct display_temperature_component {\n    constexpr static auto\
  \ display_temperature = [](float temperature) {\n        printf(\"Temperature is\
  \ %.2f C\\r\\n\", temperature);\n    };\n    constexpr static auto config = cib::config(\n\
  \        cib::extend<send_temperature>(display_temperature)\n    );\n    };\n  \
  \  struct data_sender_component {\n    constexpr static auto send_temp = [](float\
  \ temp) {\n        printf(\"Sending temperature %.2f C\\r\\n\", temp);\n    };\n\
  \    constexpr static auto config = cib::config(\n        cib::extend<send_temperature>(send_temp)\n\
  \    );\n    };\n    ```\n\n前面的代码定义了两个组件，它们执行以下操作：\n\n*   在 `constexpr`  表达式 `display_temperature`\
  \ 和 `send_temp` 中为 `send_temperature` 服务提供处理程序。\n\n*   定义 `constexpr static auto\
  \ config` 成员，通过该成员它们扩展服务（订阅事件）。\n\nConfig 成员是变变模板类 `cib::config` 的实例，它们被 CIB 库用于在编译时接线应用程序，即将服务（事件生成器、发布者）与扩展这些服务的软件组件（观察者）连接起来。编译时初始化和构建过程由\
  \ `cib::nexus` 执行，它需要提供项目配置。以下是该简单项目的配置代码：\n\n```\nstruct my_project {\nconstexpr\
  \ static auto config = cib::config(\n    cib::exports<send_temperature>,\n\n   \
  \ cib::components<display_temperature_component,\n                    data_sender_component>\n\
  );\n};\n```\n\n该项目配置是一个简单的结构体 `my_project`，带有带有 `constexpr` 成员 `config`，它提供了以下内容：\n\
  \n*   `cib::exports<send_temperature>`：用于声明服务（发布者）。\n\n*   `cib::components<display_temperature_component,\
  \ data_sender_component>`：用于声明可以扩展服务的软件组件。\n\n1.  接下来，让我们看看如何在下面的代码在固件应用程序中使用所有这些内容：\n\
  \n    ```\n    int main() {\n        cib::nexus<my_project> nexus{};\n        nexus.init();\n\
  \        for(int i = 0; i < 3; i++)\n        {\n            nexus.service<send_temperature>(42.0f);\n\
  \        }\n        return 0;\n    }\n    ```\n\n在这段代码中，我们执行了这些步骤：\n\n*   `cib::nexus<my_project>\
  \ nexus{};`：创建项目配置 `my_project` 提供的模板类 `cib::nexus` 的实例。\n\n*   `nexus.init();`：初始化\
  \ Nexus。\n\n*   `nexus.service<send_temperature>(42.0f);`：访问服务并提供 float 参数（温度）。这将触发对扩展\
  \ `send_temperature` 服务的组件中 lambda 的调用。\n\n## 扩展温度发布者示例\n\n接下来，我们将使用两个组件扩展这个简单的示例——一个虚拟温度传感器和\
  \ I2C 组件，我们将它们命名为 `temperature_sensor_component` 和 `i2c`。我们还将引入两个新服务——`runtime_init`\
  \ 和 `main_loop`：\n\n1.  让我们从在代码中定义新服务开始：\n\n    ```\n    struct runtime_init : public\
  \ flow::service<> {};\n    struct main_loop : public callback::service<> {};\n \
  \   ```\n\n在这里，我们定义了两个服务：\n\n*   `runtime_init`：继承自 `flow::service`。\n\n*   `main_loop`：继承自\
  \ `callback::service`，允许我们执行操作。\n\n2.  我们现在转向 I2C 组件的实现，如下代码所示：\n\n    ```\n   \
  \ struct i2c {\n    constexpr static auto init = flow::action<\"i2c_init\">(\n \
  \       [](){\n            printf(\"I2C init ...\\r\\n\");\n        });\n    constexpr\
  \ static auto config = cib::config(\n        cib::extend<runtime_init>(*init)\n\
  \    );\n    };\n    ```\n\n这段代码定义了一个新组件 `i2c`，它包含：\n\n*   `constexpr static auto\
  \ init`：实现外设初始化的 `flow::action`。\n\n*   `constexpr static auto config`：将上述操作添加到\
  \ `runtime_init` 流中。`*` 运算符显式地将操作添加到流。如果没有它，操作将被引用但未被添加，导致编译错误。\n\n3.  接下来，让我们通过下面的代码查看温度传感器组件：\n\
  \n    ```\n    struct temperature_sensor_component {\n    constexpr static auto\
  \ init = flow::action<\"temp_sensor_init\">(\n        []() {\n            printf(\"\
  Initializing temperature sensor ... \\r\\n\");\n        });\n    constexpr static\
  \ auto read_temperature = []() {\n        float temperature = 23.4f;\n        cib::service<send_temperature>(temperature);\n\
  \    };\n    constexpr static auto config = cib::config(\n\n        cib::extend<main_loop>(read_temperature),\n\
  \        cib::extend<runtime_init>(i2c::init >> *init)\n    );\n    };\n    ```\n\
  \n前面的代码显示了 `temperature_sensor_component` 结构体具有以下成员：\n\n*   `constexpr static auto\
  \ init`：实现温度传感器初始化的 `flow::action`。\n\n*   `constexpr static auto read_temperature`：实现定期读取温度传感器的\
  \ lambda，并通过 `cib::service<send_temperature>` 发布读取到的值。\n\n*   `constexpr static\
  \ auto config`：使用 `read_temperature` 扩展 `main_loop` 服务，并使用 `i2c::init >> *init`\
  \ 扩展 `runtime_init` 流，表示 `i2c::init` 在 `init` 之前。\n\n4.  接下来，我们需要修改 `my_project`\
  \ 结构体以导出新服务并添加组件，如下代码所示：\n\n\n\n\n\n```cpp\nstruct my_project {\n    constexpr static\
  \ auto config = cib::config(\n        cib::exports<runtime_init,\n             \
  \        main_loop,\n                     send_temperature>,\n\n        cib::components<i2c,\n\
  \                        temperature_sensor_component,\n                       \
  \ display_temperature_component,\n                        data_sender_component>\n\
  );\n};\n```\n\n在此代码中，我们简单地添加了：\n\n- 将 `runtime_init` 和 `main_loop` 服务添加到 `cib::exports`\
  \ 中\n- 将 `i2c` 和 `temperature_sensor_component` 添加到 `cib::components` 中\n\n1. 最后，让我们来看新的\
  \ `main` 函数，所示：\n\n```cpp\nint main() {\n    cib::nexus<my_project> nexus{};\n \
  \   nexus.init();\n    nexus.service<runtime_init>();\n    for(int i = 0; i < 3;\
  \ i++)\n    {\n        nexus.service<main_loop>();\n    }\n    return 0;\n}\n```\n\
  \n与之前一样，我们首先创建一个 `cib::nexus` 实例并对其进行初始化。然后，我们执行以下步骤：\n\n1. `nexus.service<runtime_init>()`：这将运行\
  \ `runtime_init` 流中的所有动作，并确保按指定的顺序执行。\n2. `nexus.service<main_loop>()`：这是主循环中的调用，执行所有扩展此服务的\
  \ lambda。\n\n这种结构在许多固件应用中是典型的：初始化所有组件（包括硬件外设），然后在主循环中反复调用相关服务。应用程序的任何更改都是在 `my_project`\
  \ 结构体以声明式的方式完成的——通过扩展服务以及添加或删除组件。所有的初始化都在组件本身完成，这意味着 `main` 函数不需要了解单个组件及其依赖的细节。\n\
  \nCIB 库还包含了日志、中断、消息和字符串常量库——这些都利用了 C++ 的编译计算。你可以在 GitHub 上找到更多关于 CIB 的信息：`https://github.com/intel/compile-time-init-build`。\n\
  \n你可以在 Renode 中运行完整的 CIB 示例。启动 Visual Studio Code，将其附加到运行中的容器，按照第 4 章 所示打开 `Chapter17/cib`\
  \ 项目，并在 Visual Studio Code 终端中运行以下命令，或直接在容器终端中运行：\n\n```bash\n$ cmake –B build\n\
  $ cmake --build build --target run_in_renode\n```\n\n运行上面的示例将产生此处输出：\n\n```\nI2C\
  \ init ...\nInitializing temperature sensor ...\nSending temperature 23.40 C\nTemperature\
  \ is 23.40 C\nSending temperature 23.40 C\nTemperature is 23.40 C\nSending temperature\
  \ 23.40 C\nTemperature is 23.40 C\n```\n\n此示例演示了 CIB 库在具有松耦合组件的事件驱动系统中使用，某些组件生成事件，另一些组件对事件做出反应。发布者和订阅者之间的连接在编译时完成，从而最小化了内存占用并降低了运行时开销，同时声明式的项目配置提高了可读性。\n\
  \n## 总结\n\n在本章中，我们概述了贯穿本书使用的库——C++ 标准库和 ETL。你还了解了 Google 的 Pigweed 库及其功能，以及 Intel\
  \ 的 CIB 库。\n\n在下一章中，我们将介绍跨平台开发。\n\n# 18\n\n# 跨平台开发\n\n在之前的章节中，我们探索了为嵌入式系统设计和实现软件组件的实用示例。每个示例都展示了良好的软件设计实践，并引导你使用现代\
  \ C++ 技术进行实现。\n\n我们在整本书中遵循的设计实践帮助我们创建了可移植的、跨平台的代码。编写跨平台代码至关重要，因为能够能够在不同的硬件配置之间复用软件组件。当我们结束这段旅程时，让我们回顾一下早些章节中展示的关键实践。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 编写可移植代码重要性\n- SOLID 设计原则\n- 可测试性\n\n## 技术要求\n\n本章侧重于跨平台开发。此处显示的代码运行在多个平台上，包括常见的桌面架构。\n\
  \n你可以使用 Compiler Explorer (`https://godbolt.org/`) 来运行这些示例。所有源代码都可以在 GitHub 上找到：`https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter18`。\n\
  \n# 编写可移植代码的重要性\n\n硬件项目会成熟、演变并适应市场需求和供应链状况。在 2020 年到 2022 年之间，全球半导体行业面临严重的供应链危机，这主要由\
  \ COVID-19 大流行引发并被多种因素加剧。封锁中断了生产，而对电子产品（如笔记本电脑、服务器）的需求激增与汽车部门的计算失误产生了碰撞。汽车制造商最初取消了芯片订单，随后在需求反弹时急于补货。\n\
  \n结果是，许多组件变得稀缺、价格过高或完全无法获得。产品必须通过更换电子组件（如传感器、驱动器、通信模块甚至微控制器）来适应变化。这反过来要求对固件进行修改以匹配新硬件。\n\
  \n对于编写得良好的固件，这种适应是相对直接的，仅涉及实现特定的硬件接口。例如，如果一个产品使用了加速度计并需要更换它，良好的固件架构只需要为新组件实现接口，而保持业务逻辑不变。\n\
  \n跨平台代码也可以运行在主机的仿真环境中。在第 17 章 中，我们在主机上运行了 Pigweed 的演示应用程序。这种可行性归功于 Pigweed 良好的接口设计，它允许在主机上实现底层硬件接口。相同的业务应用代码可以在多个目标上运行，包括主机（其中输入输出是模拟的）。\n\
  \n结构良好的代码更容易阅读、修改和维护。良好的设计原则使项目随着需求的演变而保持灵活。接下来，我们将检查 SOLID 五原则。\n\n## SOLID 设计原则\n\
  \n书中的示例都符合 SOLID 设计原则，这些原则最初由 Robert C. Martin 在其 2000 年的论文《设计原则与设计模式》中描述。它们是编写随时间推移保持适应性且易于维护的代码的认可指南。尽管\
  \ SOLID 原则最初是面向对象编程的，但它们对创建模块化、可维护和可扩展代码的关注适用于更广泛的软件设计领域。SOLID 记忆词中的每个字母代表一个原则：\n\
  \n- **单一职责原则 (SRP)**：一个类应该只有一个职责，使其只有一个更改的理由。\n- **开/闭原则 (OCP)**：一个类应该对扩展开放，但对修改关闭。通过动态或静态多态扩展类来添加新功能，而不是通过修改它。\n\
  - **里氏夫替换原则 (LSP)**：派生类应该能够替换其父类而不破坏软件的行为。\n- **接口隔离原则 (ISP)**：接口类应该保持短小简洁，以便派生类仅实现它们需要的方法。\n\
  - **依赖倒置原则 (DIP)**：高层模块（如加速度计）不应依赖于低层模块（如 I2C）。两者都应该依赖于抽象（接口），而不是具体的实现。\n\n\n\n\n\
  \n接下来，我们将通过一个加速度计接口设计的示例，解释如何使用它，并展示它是如何符合 SOLID 原则的以及为什么这种符合性很重要。首先，我们将设计一个加速度计接口类。代码所示：\n\
  \n```cpp\n#include <cstdio>\n#include <cstdint>\nclass accelerometer {\npublic:\n\
  struct data {\n    float x;\n    float y;\n    float z;\n};\nenum class sampling_rate\
  \ {\n    c_20_hz,\n    c_50_hz,\n    c_100_hz,\n};\nenum error {\n      ok,\n  \
  \    not_supported\n};\nvirtual error set_sampling_rate(sampling_rate) = 0;\nvirtual\
  \ data get_data() = 0;\n};\n```\n\n上述代码中的 `accelerometer` 接口类将由 `adxl_345` 类实现，该类将使用\
  \ `i2c` 接口与实际加速度计硬件通信（ADXL345 集成电路是一个带有 I2C 数字接口的小型加速度计）。此外，我们将在 STM32 平台上运行代码，因此我们将创建一个\
  \ `i2c` 接口的（存根）实现 `i2c_stm32`。代码所示：\n\n```cpp\nclass i2c {\npublic:\nvirtual void\
  \ write() = 0;\n};\nclass i2c_stm32 : public i2c {\npublic:\nvoid write() override\
  \ {\n    printf(\"i2c::write...\\r\\n\");\n}\n};\nclass adxl_345 : public accelerometer\
  \ {\npublic:\nadxl_345(i2c &i2c_obj) : i2c_(i2c_obj) {}\nerror set_sampling_rate(sampling_rate)\
  \ override {\n    printf(\"adxl_345: setting sampling rate\\r\\n\");\n    i2c_.write();\n\
  \    return error::ok;\n}\ndata get_data() override {\n    return data{0.02f, 0.981f,\
  \ 0.03f};\n}\nprivate:\ni2c &i2c_;\n};\n```\n\n接下来，我们将设计一个简单的 `tap_detection_algo`\
  \ 类，该类使用加速度计接口收集运动数据并识别短时间、突然的运动，通常称为点击（taps）。点击是加速度的快速峰值，可以作为应用程序中的用户输入或触发事件。点击检测类的模板代码如下文所示：\n\
  \n```cpp\nclass tap_detection_algo {\npublic:\ntap_detection_algo(accelerometer\
  \ &accel) : accel_(accel) {\n    auto err = accel_.set_sampling_rate(\n        accelerometer::sampling_rate::c_100_hz);\n\
  \    if(err == accelerometer::error::not_supported) {\n    // 尝试另一个采样率并适配\n    }\n\
  }\nbool run () {\n    auto accel_data = accel_.get_data();\n    printf(\"algo: x\
  \ = %.2f, y = %.2f, z = %.2f\\r\\n\", accel_data.x, \n                         \
  \                            accel_data.y,\n                                   \
  \                  accel_data.z);\n    // 处理数据\n    return false;\n}\nprivate:\n\
  \    accelerometer &accel_;\n};\n```\n\n最后，我们将为 `main` 函数编写代码，以实例化加速度计并运行点击检测算法：\n\
  \n```cpp\nint main() {\n    i2c_stm32 i2c1;\n    adxl_345 accel(i2c1);\n\n    tap_detection_algo\
  \ algo(accel);\n    algo.run();\n\n    return 0;\n}\n```\n\n上述代码在下方的 UML 图所示：\n\n\
  ![图 18.1 – 点击检测算法 UML 图](img/B22402_18-01.png)\n\n图 18.1 – 点击检测算法 UML 图\n\n图 18.1\
  \ 显示了我们设计的软件组件架构。UML 图所示的类代码经过了简化，用于演示以下 SOLID 原则。\n\n### 单一职责原则 (SRP)\n\n`accelerometer`\
  \ 类是一个包含所有虚方法的接口类。它的单一职责是定义一个供高层组件使用并由如 `adxl_345` 等具体加速度计实现实现的接口。\n\n`adxl_345`\
  \ 类实现了加速度计接口，它只负责通过 I2C 或 SPI 等串行接口与 ADXL 345 加速度计进行通信。该类发生变化的唯一原因是修复与高层协议中与传感器本身通信相关的\
  \ Bug，而不是针对串行总线本身。\n\n`i2c` 类是一个接口类，负责为不同实现的 I2C 外设定义一个通用接口，而 `i2c_stm32` 实现了该接口。具体实现发生变化的唯一原因是与串行硬件外设相关的\
  \ Bug 修复或优化。\n\n`tap_detection_algo` 类获取加速度计数据并使用收集的数据实现点击检测算法。更改该类的唯一原因是修复或优化算法。\n\
  \n### 开开放对关闭原则 (OCP)\n\n针对 `i2c` 和加速度计组件的基于接口的设计允许我们能够在不修改任何现有代码的情况下扩展软件。例如，如果我们想在德州仪器（Texas\
  \ Instruments）微控制器上运行此代码，我们只需要为该平台实现 `i2c` 接口即可。\n\n### 里德夫替换原则 (LSP)\n\nLSP 由 Barbara\
  \ Liskov 在 1987 年提出。LSP 侧重于基类和子类之间设计稳健的契约。任何依赖基类的客户端在使用派生类时都应该正常工作，而不会出现意外行为。在示例中，如果\
  \ `adxl_345` 在请求采样率时静默失败而不是处理它，就会构成契约违约。\n\n### 接口隔离原则 (ISP)\n\nISP 是关于将大型、单体接口拆分为更关注的接口，以便每个类只实现它真正需要的方法。违反这一原则的示例是一个过于宽大的接口，导致\
  \ `adxl_345` 被强制提供它不支持的方法。\n\n### 依赖倒置原则 (DIP)\n\n我们讨论的示例代码清楚地展示了依赖倒置原则 (`DIP`)。通过基于接口的设计，软件组件实现了解耦：\n\
  \n- `tap_detection_algo` 类依赖于 `accelerometer` 接口，该接口由 `adxl_345` 实现。\n- `adxl_345`\
  \ 类依赖于 `i2c` 接口，该接口由 `i2c_stm32` 实现。\n\nSOLID 原则允许我们编写高度解耦的软件并创建可用的、硬件无关的代码。解耦的代码更具活性，添加新功能也更容易。\n\
  \n*作为一个练习，在不修改现有类的情况下添加添加加速度计日志功能能力。*\n\n\n\n\n前面的代码实现了一个简单的点击检测算法。它接收一个加速度计引用，并在每次调用\
  \ `run()` 时获取当前的传感器数据。如果是第一个样本，它会存储该值并返回 `false`（未检测到点击）。在随后的调用中，它会比较每个轴上当前读取数与上一个读取数的差值。如果任何一个轴上的绝对差超过了常量阈值，它将通过返回\
  \ `true` 来信号点击信号，然后更新上一个样本。\n\n为了进行单元测试，我们将创建一个 `fake_accel` 类来模拟加速度计的读取序列。这样，我们就可以控制输入数据来检查\
  \ `tap_detection_algo` 是否工作。`fake_accel` 类的代码所示：\n\n```cpp\nclass fake_accel : public\
  \ accelerometer {\npublic:\nfake_accel(const std::vector<data>& samples)\n: samples_(samples),\
  \ index_(0) {}\nerror set_sampling_rate(sampling_rate) override {\n    return error::ok;\n\
  }\ndata get_data() override {\n    if (index_ < samples_.size()) {\n        return\
  \ samples_[index_++];\n    }\n    return samples_.back();\n}\nprivate:\nstd::vector<data>\
  \ samples_;\nsize_t index_;\n};\n```\n\n这个类 `fake_accel` 是加速度计接口的测试替身（test double）。它通过以下方式模拟加速度计数据：\n\
  \n* 通过构造函数接受预定义数据样本的 `vector`。\n* 实现 `set_sampling_rate` 以始终返回成功结果。\n* 通过 `get_data()`\
  \ 按顺序返回每个样本，一旦所有样本使用完毕，它将重复返回最后一个样本。\n\n这对于测试依赖于加速度计读取的组件非常有用。让我们看看如何使用此处代码中的 GoogleTest\
  \ 框架来测试点击检测算法：\n\n```cpp\nTEST(TapDetectionAlgoTest, DetectTapOnSuddenChange) {\n\
  std::vector<accelerometer::data> samples = {\n    {0.0f, 1.0f, 0.0f}, // 初始读取\n\
  \    {0.0f, 1.0f, 0.0f}, // 无变化 -> false\n    {0.0f, 2.0f, 0.0f} // 显著变化\n};\nfake_accel\
  \ fakeAccel(samples);\ntap_detection_algo algo(fakeAccel);\nEXPECT_FALSE(algo.run());\n\
  EXPECT_FALSE(algo.run());\nEXPECT_TRUE(algo.run());\n}\n```\n\n此测试验证了点击检测算法能够正确识别加速度计数据的突发变化为点击。测试设置了一个带有三个样本的伪加速度计：\n\
  \n* 第一个样本：`{0.0f, 1.0f, 0.0f}` – 用于初始化（无点击检测）。\n* 第二个样本：`{0.0f, 1.0f, 0.0f}` – 与第一个样本相比没有变化，因此未检测到点击。\n\
  * 第三个样本：`{0.0f, 2.0f, 0.0f}` – y 轴上的显著变化（差值为 `1.0`，超过了 `0.5` 的阈值）触发了点击检测。\n\n测试期望前两次\
  \ `run()` 返回 `false`，第三次调用返回 `true`。得益于基于接口的设计，我们可以将 `fake_accel` 引用传递给 `tap_detection_algo`\
  \ 构造函数，因为 `fake_accel` 实现了 `accelerometer` 接口。我们为 `fake_accel` 构造函数提供了一个样本 `vector`\
  \ 容器以馈算法。这允许我们轻松地使用测试数据集测试算法。\n\n完整示例可以在 GitHub 上找到 ([`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter18`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter18))。运行时请确保在\
  \ Compiler Explorer 中添加了 GoogleTest 库。\n\n## 总结\n\n在本章中，我们学习了为什么编写移植、跨平台的代码对于嵌入式开发非常重要。它让你能够轻松重用软件组件并适应硬件变化，同时提高可测试性。\n\
  \n你还学习了 SOLID 原则以及它们如何应用于使用 C++ 的嵌入系统中软件组件的设计。代码的可读性和灵活性是良好软件最重要的特质之一。\n\n我们人类阅读代码，而阅读你代码的人可能是未来的你。因此，具有易读性的代码应该是首要任务。只有在绝对需要时才牺牲可读性并为性能进行优化。灵活的代码允许你轻松地适应变化或添加新功能。\n\
  \n通过本章，我们的旅程结束了。我们从探索关于 C++ 的常见误区并破解它们开始。从那里开始，我们涵盖了现代 C++ 的许多重要方面，并学习了如何将它们应用于嵌入式应用开发。\n\
  \n我们探索了如何使用 lambda 编写表达丰富的代码，并利用编译时计算生成查找表，从而节省内存和处理能力。我们还利用 C++ 的类型安全来实现类型安全的 HAL。\n\
  \n接下来，我们学习了如何应用适配器（Adapter）、观察者（Observer）和状态（State）等设计模式来解决嵌入式系统的典型问题。我们探索了 C++\
  \ 标准库、ETL、Pigweed 和 cib，并学习了如何在嵌入式应用它们。\n\n在本书的所有示例中，我们专注于编写可读、可维护且松耦合的代码，以增强我们的软件设计和开发技能。\n\
