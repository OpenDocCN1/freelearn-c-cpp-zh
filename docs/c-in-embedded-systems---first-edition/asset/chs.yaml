  \ `false` 时提升为值为 `0` 的 `int`，在设置为 `true` 时提升为 `1`。\n- 其他整数类型（包括位域）被转换为以下列表中能够表示被转换类型所有值的最小类型：\n\
  \    * `int`\n    * `unsigned int`\n    * `long`\n    * `unsigned long`\n    * `long\
  \ long`\n    * `unsigned long long`\n- `float` 可以提升为 `double`。\n\n为了更好地理解整数提升规则，我们将来看下一个示例：\n\
  \n```cpp\n#include <cstdint>\n#include <type_traits>\nint main() {\n    std::uint8_t\
  \ a = 1;\n    std::uint16_t b = 42;\n    auto res1 = a + b;\n    static_assert(std::is_same_v<int,\
  \ decltype(res1)>);\n    return 0;\n}\n```\n\n在上面的示例中，我们相加了 `uint8_t` 和 `uint16_t`。根据提升规则，两种类型都将提升为\
  \ `int`，因为它们可以用 `int` 完全表示。相加的结果存储在变量 `res1` 中，该变量被声明为 `auto`，这意味着编译器将推导其类型。我们期望它是一个\
  \ `int`，并使用 `static_assert` 和 `std::is_same_v` 进行了验证。\n\n在这个示例中，两种类型都提升为了同一种类型。如果提升后类型不同，那么它们将根据**常规算术转换**\
  \ (usual arithmetic conversion) 的规则转换为一种公共类型。\n\n常规算术转换的目标是将类型转换为一种公共类型，该类型也是结果的类型。常规算术转换有若干规则：\n\
  \n* 如果两种类型都是有符号或无符号整数，则公共类型是整数转换等级更高的类型。这些等级按降序列在下方（无符号整数的等级与其匹配的有符号整数对应）：\n   \
  \ * `long long`\n    * `long`\n    * `int`\n    * `short`\n    * `signed char`\n\
  * 如果其中一种类型是有符号整数而另一个是无符号整数，则适用以下规则：\n    * 如果无符号类型的整数转换等级大于或等于有符号类型，则公共类型为该无符号类型。\n\
  \    * 否则，如果有符号类型可以表示无符号类型的所有值，则公共类型为该有符号类型。\n    * 否则，公共类型为该有符号类型的无符号整数。\n* 如果其中一种类型是浮点类型而另一种是整数，则整数被转换为该浮点类型。\n\
  * 如果两种类型都是浮点类型但浮点转换等级不同，则转换等级较低的类型将转换为另一种类型。浮点转换等级按降序列在下方所示：\n    * `long double`\n\
  \    * `double`\n    * `float`\n\n让我们通过下面的示例来更好地理解常规算术转换的规则：\n\n```cpp\n#include\
  \ <type_traits>\nint main() {\n    struct bitfield{\n        long long a:31;\n \
  \   };\n    bitfield b {4};\n    int c = 1;\n    auto res1 = b.a + c;  \n    static_assert(sizeof(int)\
  \ == 4);\n    static_assert(sizeof(long long) == 8);\n    static_assert(std::is_same_v<int,\
  \ decltype(res1)>);\n    long e = 5;\n    auto res2 = e - b.a;\n    static_assert(std::is_same_v<long,\
  \ decltype(res2)>);\n    return 0;\n}\n```\n\n在上面的示例中，我们有一个 31 位的 `bitfield`，其底层类型为\
  \ `long long`。我们首先将 `b.a` 和类型为 `int` 的变量 `c` 相加。如果我们所在的平台 `int` 的大小为 4 字节，即使底层类型\
  \ `long long` 的大小为 8 字节，位域也会提升为 `int`。提升后的位域将与 `int c` 相，因此该操作的结果也将是 `int`，我们通过使用\
  \ `std::is_same_v` 检查 `res1` 的类型验证了这一点。\n\n在示例的第二部分，我们从 `long` 类型 `e` 中减去位域。在这种情况下，位域首先提升为\
  \ `int`；然后根据常规算术转换的规则，它被转换为 `long`，这意味着结果类型也将是 `long`。\n\n你可以从书籍的 GitHub 仓库运行上面的示例。它位于\
  \ `Chapter09/type_safety` 下，你可以使用以下命令进行构建并运行：\n\n```\n$ cmake -B build -DMAIN_CPP_FILE_NAME=\"\
  main_usual_arithmetic_conversion.cpp\"\n$ cmake --build build --target run_in_renode\n\
  ```\n\n程序成功编译这一事实已足以确认常规算术转换的结果，因为我们使用了 `static_assert` 来验证它。\n\n现在，让我们来看一个结果可能会令人意料的示例：\n\
  \n```cpp\n#include <cstdio>\nint main() {\n    int a = -4;\n    unsigned int b =\
  \ 3;\n    if (a > b) {\n        printf(\"%d\\r\\n\", a);\n    }\n    return 0;\n\
  }\n```\n（注：原文中存在多次重复段落，已按要求去重处理）\n\n```cpp\n#include <cstdio>\nint main() {\n  \
  \  int a = -4;\n    unsigned int b = 3;\n    if (a > b) {\n        printf(\"%d\\\
  r\\n\", a);\n    }\n    return 0;\n}\n```\n\n### 数组到指针转换 (Array-to-Pointer)\n\n\
  接下来我们将讨论数组到指针转换。数组可以隐式转换为指针。以下是契约：\n\n* 指针指向第一个元素\n* 丢失了大小信息\n\n这是一个简单的契约，但让我们来看示例：\n\
  \n```cpp\n#include <cstdio>\nvoid print_ints(int *arr, std::size_t len) {\n    for(std::size_t\
  \ i = 0; i < len; i++) {\n        printf(\"%d\\r\\n\", arr[i]);\n    }\n}\nint main()\
  \ {\n    int array_ints[3] = {1, 2, 3};\n    print_ints(array_ints, 3);\n    return\
  \ 0;\n}\n```\n\n在上面的示例中，我们有 `print_ints` 函数，接收一个 `int` 指针 `arr` 和一个 `size_t` 参数\
  \ `len`。在 `main` 函数中，我们通过传递 `array_ints`（数组）和 `3` 来调用 `print_ints` 函数。数组 `array_ints`\
  \ 将被隐式转换为指向其第一个元素的指针。这里有两个潜在问题：\n\n* 它期望我们传递给它的指针是有效的。它没有验证这一点。\n* 它期望接收到的 `len`\
  \ 参数是它所操作数组的实际大小。调用者可能会传递一个越界的大小。\n\n为了消除这些潜在问题，在 C++ 中，与其使用指针来处理数据数组，可以使用 `std::span`\
  \ 类模板。它是连续对象序列的包装，序列的第一个元素位于位置零。它可以从 C 风格数组构造，拥有 `size` 方法，并且我们对其可以使用范围的 `for` 循环。让我们用\
  \ `std::span` 代替指针写之前的示例：\n\n```cpp\n#include <cstdio>\n#include <<span>>\nvoid\
  \ print_ints(const std::span<int> arr) {\n    for(int elem: arr) {\n        printf(\"\
  %d\\r\\n\", elem);\n    }\n}\nint main() {\n    int arr[3] = {1, 2, 3};\n    print_ints(arr);\n\
  \    return 0;\n}\n```\n\n\n\n\n在上面的示例中，我们可以看到 `print_ints` 函数现在看起来简单多了。它接收一个整数的\
  \ `std::span`，并使用基于范围的 for 循环来遍历元素。在调用处，我们现在只需要传递 `arr`，即一个包含 3 个整数的数组。它被隐式转换为 `std::span`。\n\
  \n类模板 `std::span` 还具有 `size` 方法、运算符 `[]` 以及 `begin` 和 `end` 迭代器，这意味着我们可以在标准库算法中使用它。我们还可以从\
  \ `span` 构造一个子 span。它可以从 C 风格数组构造，也可以从 `std::array` 和 `std::vector` 等容器构造。它是解决通常依赖指针和大小参数的接口潜在问题的一种极解决方案。\n\
  \n### 函数到指针的转换\n\n函数可以隐式转换为该函数的指针。下面的示例演示了这一点：\n\n```\n#include <cstdio> \n#include\
  \ <type_traits>\nvoid print_hello() {\n    printf(\"Hello!\\r\\n\");\n}\nint main()\
  \ { \n    void(*fptr)() = print_hello;\n    fptr();\n    fptr = &print_hello;\n\
  \    (*fptr)();\n    static_assert(std::is_same_v<decltype(fptr), void(*)()>);\n\
  \    static_assert(std::is_same_v<decltype(print_hello), void()>);\n    return 0;\
  \ \n}\n```\n\n在上面的示例中，我们将函数 `print_hello` 赋值给函数指针 `fptr`。在 C++ 中，我们不需要在函数名后使用取地址运算符\
  \ `&` 来将其赋值给函数指针。此外，通过函数指针调用函数时，不需要对其进行解引用。尽管如此，`print_hello` 和 `fptr` 仍然是不同的类型，我们通过\
  \ `static_assert` 和 `is_same` 类型性符确认了这一点。\n\nC++ 中的隐式转换让代码编写变得更加容易。它们有时会导致非预期的行为并对程序产生潜在问题。为了缓解这些疑虑，我们可以在需要时显式转换类型。\n\
  \n接下来，我们将介绍显式转换。\n\n## 显式转换\n\nC++ 支持 C 风格的强制转换，但也支持函数风格转换以及以下转换运算符：\n\n- `const_cast`\n\
  - `static_cast`\n- `dynamic_cast`\n- `reinterpret_cast`\n\n我们将从 `const_cast` 开始逐一介绍转换运算符。\n\
  \n### const_cast\n\n`const_cast` 用于去掉 `const` 属性以便与非 const 正确的函数工作。我们将通过下面的示例来更好地理解它：\n\
  \n```\n#include <cstdio>\nvoid print_num(int & num) {\n    printf(\"num is %d\\\
  r\\n\", num);\n}\nint main() {\n    const int num = 42;\n    print_num(const_cast<int&>(num));\n\
  \    int & num_ref = const_cast<int&>(num);\n    num_ref = 16;\n    return num;\n\
  }\n```\n\n在上面的示例中，我们在两种不同的场景下使用了 `const_cast`。我们首先使用它去掉 `const int num` 的 `const`\
  \ 属性，以便将其传递给 `print_num` 函数。`print_num` 函数有一个参数——指向 `int` 的非 const 引用。由于我们知道该函数并试图修改引用所绑定的对象，因此我们决定去掉\
  \ `const` 属性，这样就可以将 `const int` 的引用传递给它而不会导致编译器报错。\n\n然后，我们使用 `const_cast` 去掉 `num`\
  \ 的 `const` 属性，以便将其赋值给非 const 引用 `num_ref`。如果你在 Compiler Explorer 中运行此示例，将看到以下输出：\n\
  \n```\nProgram returned: 42\nnum is 42\n```\n\n程序返回 `42`，这意味着 `num` 的值为 `42`，尽管我们尝试通过\
  \ `num_ref` 将其设置为 `16`。这是因为通过非 const 引用或指针修改 const 变量是未定义行为。\n\n`const_cast` 主要用于非\
  \ const 正确的函数交互。尽管如此，这是危险的且应该避免，因为我们无法保证传递的去掉 const 属性的指针或引用不会尝试修改指针所指向的对象或引用所绑定的对象。接下来，我们将介绍\
  \ `static_cast`。\n\n### static_cast\n\nC++ 中最常用的转换运算符是 `static_cast`，它用于以下场景：\n\n\
  - 将基类指针向上转换为派生类指针，反之亦然\n- 丢弃值表达式\n- 在具有已知转换路径的类型之间转换，例如从 `int` 到 `float`、`enum`\
  \ 到 `int`、`int` 到 `enum` 等\n\n我们将通过下面的示例介绍 `static_cast` 的几种用法：\n\n```\n#include\
  \ <cstdio>\nstruct Base {\n    void hi() {\n        printf(\"Hi from Base\\r\\n\"\
  );\n    }\n};\nstruct Derived : public Base {\n    void hi() {\n        printf(\"\
  Hi from Derived\\r\\n\");\n    }\n};\nint main() {\n    // 无符号 int 到有符号 int \n \
  \   int a = -4; \n    unsigned int b = 3; \n    if(a + static_cast<int>(b) > 0)\
  \ {\n        printf(\"%d is greater than 0\\n\");\n    } else {\n        printf(\"\
  %d is not greater than 0\\n\");\n    }\n    // 丢弃表达式\n    int c;\n    static_cast<void>(c);\n\
  \    Derived derived;\n    // 向上转换\n    Base *base_ptr = &derived;\n    base_ptr->hi();\n\
  \    // 向下转换\n    Derived *derived_p = static_cast<Derived*>(base_ptr);\n    derived_p->hi();\n\
  \    return 0;\n}\n```\n（注：提供的 `static_cast` 示例代码块存在碎片化，我将其格式化为可读代码块，并保持了周围文本描述的逻辑。）\n\
  \n\n\n\n```cpp\n#include <cstdio>\nstruct Base {\n    virtual void hi() {\n    \
  \    printf(\"Hi from Base\\r\\n\");\n    }\n};\nstruct Derived : public Base {\n\
  \    void hi() override {\n        printf(\"Hi from Derived\\r\\n\");\n    }\n \
  \   void derived_only() {\n        printf(\"Derived only method\\r\\n\");\n    }\n\
  };\nvoid process(Base *base) {\n    base->hi();\n    if(auto ptr = dynamic_cast<Derived*>(base);\
  \ ptr ! = nullptr) \n    {\n        ptr->derived_only();\n    }\n}\nint main() {\n\
  \    Base base;\n    Derived derived;\n    Base * base_ptr = &derived;\n    process(&base);\n\
  \    process(base_ptr);\n    return 0;\n}\n```\n\n在上面的示例中，我们有一个函数 `process`，它接受一个\
  \ `Base` 指针作为参数。该函数使用 `dynamic_cast` 将 `Base` 指针向下转型为 `Derived` 指针。在*带初始化器的 if 语句*中，我们使用对\
  \ `Base` 指针执行 `dynamic_cast<Derived*>` 的结果来初始化 `ptr`。在 `if` 语句的条件中，我们检查 `ptr` 是否于\
  \ `nullptr`，如果是，我们就可以安全地将其作为 `Derived` 类对象的指针。接下来，我们将介绍 `reinterpret_cast`。\n\n\
  ### reinterpret_cast\n\n`reinterpret_cast` 用于通过重新解释底层位在类型之间进行转换。它可以用于以下情况：\n\n*\
  \   将指针转换为足够容纳其所有值的整数。\n*   将整数值转换为指针。指针转换为整数再转换回其原始类型，保证具有原始值，并且可以安全地进行解引用。\n*\
  \   在不同类型的指针之间进行转换，例如在 `T1` 和 `T2` 之间。只有当生成的指针是 `char`、`unsigned char`、`std::byte`\
  \ 或 `T1` 时，生成的指向 `T2` 的指针才能被安全地进行解引用。\n*   将函数指针 `F1` 转换为指向不同函数 `F2` 的指针。将 `F2`\
  \ 转换回 `F1` 将得到指向 `F1` 的指针。\n\n为了更好地理解 `reinterpret_cast`，我们将通过以下示例：\n\n```cpp\n\
  #include <cstdio>\n#include <cstdint>\nint fun() {\n    printf(\"fun\\r\\n\");\n\
  \    return 42;\n}\nint main() {\n    float f = 3.14f;\n    // 使用 float 地址初始化一个\
  \ int 指针\n    auto a = reinterpret_cast<int*>(&f);\n    printf(\"a = %d\\r\\n\"\
  , *a);\n    // 上述等同于：\n    a = static_cast<int*>(static_cast<void*>(&f));\n    printf(\"\
  a = %d\\r\\n\", *a);\n    // 转换回 float 指针\n    auto fptr = reinterpret_cast<float*>(a);\n\
  \    printf(\"f = %.2f\\r\\n\", *fptr);\n    // 将指针转换为整数\n    auto int_val = reinterpret_cast<std::uintptr_t>(fptr);\n\
  \    printf(\"Address of float f is 0x%8X\\r\\n\", int_val);\n    auto fun_void_ptr\
  \ = reinterpret_cast<void(*)()>(fun);\n    // 未定义行为\n    fun_void_ptr();\n    auto\
  \ fun_int_ptr = reinterpret_cast<int(*)()>(fun);\n    // 安全调用\n    printf(\"fun_int_ptr\
  \ returns %d\\r\\n\", fun_int_ptr());\n    return 0;\n}\n```\n\n你可以从书的 GitHub 仓库运行上面的示例。它被放在\
  \ `Chapter09/type_safety` 下，你可以使用以下命令构建并运行：\n\n```bash\n$ cmake -B build -DMAIN_CPP_FILE_NAME=\"\
  main_reinterpret_cast.cpp\"\n$ cmake --build build --target run_in_renode\n```\n\
  \n在 Renode 中运行示例将提供以下输出：\n\n```\na = 1078523331\na = 1078523331\nf = 3.14\nAddress\
  \ of float f is 0x20003F18\nfun\nfun\nfun_int_ptr returns 42\n```\n\n上面的示例演示了 `reinterpret_cast`\
  \ 的用法。我们首先使用 `reinterpret_cast<int*>(&f)` 通过一个 float 的地址初始化了一个指向 int 的指针。这等同于使用\
  \ `static_cast`，即 `static_cast<int*>(static_cast<void*>(&f))`。我们打印解引用整数指针的值，它是 `1078523331`。这是\
  \ `float` 变量 `f` 中包含的实际位模式。它是 `3.14` 的 IEEE-754 浮点表示。\n\n然而，根据 C++ 标准，对由 float 地址初始化的整数指针进行解引用并不是一种已定义行为。这被称为*类型别名*（type\
  \ punning）——将一个类型的对象视为另一种类型。使用 `reinterpet_cast` 进行类型别名是常见的，因为尽管存在未定义行为，它已被证明在大多数平台上都能产生预期的结果。在在过完这个示例之后，我们将讨论替代方案。\n\
  \n如果我们将转换为整数的指针转换回指向 float 的指针，它是安全的。\n\n\n\n\n在 C++ 中，使用 `std::memcpy` 是（截至 C++23）进行类型转换（type\
  \ punning）的唯一可用。在上面的示例中，我们在 `process_data_memcpy` 函数中演示了这一点。人们通常会担心字节拷贝会导致额外的内存和运行时开销，但事实是，对\
  \ `memcpy` 的调用通常会被编译器优化掉。你可以通过在 Compiler Explorer 中运行上述示例，并尝试不同的优化级别来验证这一点。\n\n\
  C++20 引入了 `std::bit_cast`，它也可以用于类型转换，如下例所示：\n\n```cpp\n#include <cstdio>\n#include\
  \ <bit>\nint main() {\n    float f = 3.14f;\n    auto a = std::bit_cast<int>(f);\n\
  \    printf(\"a = %d\\r\\n\", a);\n    return 0;\n}\n```\n\n上述程序的输出为：\n\n```\na\
  \ = 1078523331\n```\n\n上面的示例和程序输出演示了如何使用 `std::bit_cast` 进行类型转换。`std::bit_cast`\
  \ 将返回一个对象。我们将要转换的目标类型指定为模板参数。这将是 `std::bit_cast` 的返回类型。源类型的大小和目标类型的大小必须相同。这意味着 `std::bit_cast`\
  \ 并不是将一种类型的数组解释为另一种类型数组的选项，对于这一点，我们仍然需要使用 `std::memcpy`。\n\n接下来，我们将看到如何在 C++ 中使用强类型（strong\
  \ types）来提高类型安全性。\n\n## 强类型\n\n当我们讨论类型安全时，也应该讨论使用整数和浮点数等常用类型来表示时间、长度和体积等物理单位的接口安全性。让我们来看厂商\
  \ SDK 中的以下函数：\n\n```cpp/**\n  * @brief 启动直接连接建立程序。\nGAP 将向控制器发起 LE_Create_Connection\
  \ 调用，其启动者过滤器策略设置为“忽略白名单并仅处理针对指定设备的可连接广告数据包”。\n  * @param LE_Scan_Interval 定义为控制器从上一次\
  \ LE 扫描到开始下一次 LE 扫描之间的时间间隔。\nTime = N * 0.625 msec.\n  * Values:\n  - 0x0004 (2.500\
  \ ms)  ... 0x4000 (10240.000 ms)\n  * @param LE_Scan_Window LE 扫描持续的时间。LE_Scan_Window\n\
  应小于或等于 LE_Scan_Interval。\nTime = N * 0.625 msec.\n  * Values:\n  - 0x0004 (2.500\
  \ ms)  ... 0x4000 (10240.000 ms)\n  * @param Peer_Address_Type 对等端设备的地址类型。\n  *\
  \ Values:\n  - 0x00: 公共设备地址\n  - 0x01: 随机设备地址\n  * @param Peer_Address 要连接设备的公共设备地址或随机设备地址。\n\
  \    * @param Conn_Interval_Min 连接事件间隔的最小值。该值应小于或等于 Conn_Interval_Max。\nTime = N\
  \ * 1.25 msec.\n  * Values:\n  - 0x0006 (7.50 ms)  ... 0x0C80 (4000.00 ms)\n  *\
  \ @param Conn_Interval_Max 连接事件间隔的最大值。该值应\n大于或等于 Conn_Interval_Min。\nTime = N *\
  \ 1.25 msec.\n  * Values:\n  - 0x0006 (7.50 ms)  ... 0x0C80 (4000.00 ms)\n  * @param\
  \ Conn_Latency 以连接事件数为单位的连接从延迟。\n  * Values:\n  - 0x0000 ... 0x01F3\n  * @param\
  \ Supervision_Timeout LE 链路的监控超时。\n它应该是 10 ms 的倍数，并且大于 (1 + connSlaveLatency) *\
  \ connInterval * 2。\nTime = N * 10 msec.\n  * Values:\n  - 0x000A (100 ms)  ...\
  \ 0x0C80 (32000 ms)\n  * @param Minimum_CE_Length 关于此 LE 连接所需最小连接长度的信息参数。\nTime\
  \ = N * 0.625 msec.\n  * Values:\n  - 0x0000 (0.000 ms)  ... 0xFFFF (40959.375 ms)\n\
  \  * @param Maximum_CE_Length 关于此 LE 连接所需最大连接长度的信息参数。\nTime = N * 0.625 msec.\n\
  \  * Values:\n  - 0x0000 (0.000 ms)  ... 0xFFFF (40959.375 ms)\n  * @retval 表示成功或错误代码的值。\n\
  */\ntBleStatus aci_gap_create_connection(\n                              uint16_t\
  \ LE_Scan_Interval,\n                              uint16_t LE_Scan_Window,\n  \
  \                            uint8_t Peer_Address_Type,\n                      \
  \        uint8_t Peer_Address,\n                              uint16_t Conn_Interval_Min,\n\
  \                              uint16_t Conn_Interval_Max,\n                   \
  \           uint16_t Conn_Latency,\n                              uint16_t Supervision_Timeout,\n\
  \                              uint16_t Minimum_CE_Length,\n                   \
  \           uint16_t Maximum_CE_Length);\n```\n\n\n\n成功编译该示例意味着我们向 `aci_gap_create_connection_wrapper`\
  \ 传递了所有正确的参数。作为一个练习，尝试向 `conn_l` 和 `conn_p` 参数传递整数值，以观察它们是如何防止编译器进行隐式转换的。之后，尝试从\
  \ `conn_l` 和 `conn_p` 构造函数中移除 `explicit` 关键字，看看会发生什么。\n\n我们可以通过引入一个表示持续时间的强类型 `time`\
  \ 来进一步改进示例，并将其作为 `conn_l` 和 `conn_p` 类型的私有成员。代码如下：\n\n```cpp\nclass time {\nprivate:\n\
  \    uint16_t time_in_ms_;\npublic:\n    explicit time(uint16_t time_in_ms) : time_in_ms_(time_in_ms){}\n\
  \    uint16_t & get_ms() {return time_in_ms_;}\n};\ntime operator\"\"_ms(unsigned\
  \ long long t) {\n    return time(t);\n}\nclass conn_l {\nprivate:\n    uint16_t\
  \ val_;\npublic:\n    explicit conn_l(time t) : val_(t.get_ms()/0.625f){}\n    uint16_t\
  \ & get() {return val_;}\n};\nclass conn_p {\nprivate:\n    uint16_t val_;\npublic:\n\
  \    explicit conn_p(time t) : val_(t.get_ms()/1.25f){}\n    uint16_t & get() {return\
  \ val_;}\n};\n```\n\n在上面的示例中，我们创建了一个强类型 `time` 并将其作为 `conn_l` 和 `conn_p` 类型的私有成员。我们还创建了一个自定义字面量\
  \ `operator\"\"_ms`，使得下面的函数调用成为可能：\n\n```cpp\nPixelRatio stat = aci_gap_create_connection_wrapper(\n\
  \            conn_l(80_ms),\n            conn_l(120_ms),\n            PUBLIC_ADDR,\n\
  \            nullptr,\n            conn_p(50_ms),\n            conn_p(60_ms),\n\
  \            0_ms,\n            4000_ms,\n            conn_l(10_ms),\n         \
  \   conn_l(15_ms)\n    );\n```\n\n在上面的示例中，我们使用自定义字面量 `operator\"\"_ms` 来创建强类型 `time`\
  \ 对象，并用于实例化 `conn_l` 和 `conn_p` 对象。\n\n对原始接口的这些改进提高了代码的可读性和编译时错误检测。通过使用强类型，我们让向函数传递错误值变得困难得多，增加了我们代码库的类型安全性。\n\
  \n## 总结\n\n类型安全是任何用于关键应用程序的编程语言的一个重要方面。理解隐式转换的潜在问题对于缓解类型安全担忧至关重要。类型别名（Type punning）是\
  \ C++ 中另一个值得关注的领域，我们学习了如何正确处理它。我们还学习了如何使用强类型来缓解具有相同类型的参数传递错误值的问题。\n\n接下来，我们将介绍 C++\
  \ 中的 lambda 表达式。\n\n## 在 Discord 上加入我们的社区\n\n加入我们社区的 Discord 空间，以便与作者和其他读者进行讨论：\n\
  \n[`packt.link/embeddedsystems`](https://packt.link/embeddedsystems)\n\n![](img/QR_code_Discord.png)\n\
  \n# 10\n\n# 使用 Lambda 编写表现性代码\n\nC++ 中的 lambda 表达式允许我们编写短代码块，这些封装了功能并将周围的状态捕获到一个可调用对象中。我们可以在可调用对象上使用\
  \ `operator()` 来执行其中实现的功能。\n\nLambda 的用途包括将函数对象（也称为仿函数——重写了 `operator()` 的类对象）传递给标准库算法或任何期望函数对象的代码，封装通常只在单个函数中使用的小代码块，以及变量初始化。它们在不使用单独函数或类方法的情况下本地化功能的能力使\
  \ C++ 现代化，使得编写更简洁、更有表现力的代码成为可能。\n\n在嵌入式开发中，lambda 特别适用于响应定时器或外部中断的操作、任务调度以及类似的事件驱动机制。本章的目标是学习如何使用\
  \ lambda 表达式编写具表现力的 C++ 代码。在本章中，我们将涵盖以下主要主题：\n\n*   Lambda 表达式基础\n*   使用 `std::function`\
  \ 存储 lambda\n*   `std::function` 与动态内存分配\n\n## 技术要求\n\n为了充分利用本章内容，我强烈建议在阅读示例时使用\
  \ Compiler Explorer ([`godbolt.org/`](https://godbolt.org/))。选择 `GCC` 作为你的编译器并目标\
  \ x86 架构。这将允许你看到标准输出（stdio）结果并更好地观察代码的行为。由于我们使用了许多现代 C++ 特性，请确保通过在编译器选项框中添加 `-std=c++23`\
  \ 选择 C++23 标准。\n\nCompiler Explorer 可以方便地尝试代码、调整代码并立即查看其对输出和生成的汇编的影响。大多数示例也可以在 ARM\
  \ Cortex-M0 目标的 Renode 模拟器上运行，并在 GitHub 上可用 ([`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter10`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter10))。\n\
  \n## Lambda 表达式基础\n\nLambda 表达式或 lambda 允许我们编写短代码块，封装功能并将周围的状态捕获到一个可调用对象中。我们可以在可调用对象上使用\
  \ `operator()` 来执行其中实现的功能。\n\nLambda 表达式或 lambda 在 C++ 中引入的，允许我们编写封装功能并将周围的状态捕获到一个可调用对象的短代码块。我们可以在可调用对象上使用\
  \ `operator()` 来执行其中实现的功能。\n\nLambda 的常见用途包括将函数对象（也称为仿函数——重写了 `operator()` 的类对象）传递给标准库算法或任何期望函数对象的代码，封装通常只在单个函数中使用的小代码块，以及变量初始化。它们在不使用单独函数或类方法的情况下本地化功能的能力使\
  \ C++ 现代化，使得编写更简洁、更有表现力的代码成为可能。\n\n在嵌入式开发中，lambda 特别适用于响应定时器或外部中断的操作、任务调度以及类似的事件驱动机制。本章的目标是学习如何使用\
  \ lambda 表达式编写具表现力的 C++ 代码。让我们通过下面的示例来演示如何使用 lambda：\n\n```cpp\n#include <cstdio>\n\
  #include <array>\n#include <algorithm>\nint main() {\n    std::array<int, 4> arr{5,\
  \ 3, 4, 1};\n    const auto print_arr = &arr {\n        printf(\"%s\\n\", message);\n\
  \        for(auto elem : arr) {\n            printf(\"%d, \", elem);\n        }\n\
  \        printf(\"\\n\");\n    };\n    print_arr(\"Unsorted array:\");\n    std::sort(arr.begin(),\
  \ arr.end(), [](int a, int b) {\n       return a < b;\n    });\n    print_arr(\"\
  Sorted in ascending order:\");\n    std::sort(arr.begin(), arr.end(), [](int a,\
  \ int b) {\n       return a > b;\n    });\n    print_arr(\"Sorted in descending\
  \ order:\");\n    return 0;\n}\n```\n\n运行上面的示例，我们将得到以下输出：\n\n```\nUnsorted array:\n\
  5, 3, 4, 1,\nSorted in ascending order:\n1, 3, 4, 5,\nSorted in descending order:\n\
  5, 4, 3, 1,\n```\n\n我们看到的是 lambda `print_arr` 用于打印数组 `arr` 的输出。让我们分析 `print_arr`\
  \ lambda：\n\n*   `[&arr]` 语法通过引用捕获 `arr`。这意味着 lambda 在其内部可以访问并使用 `arr`。\n\n*   我们可以按值捕获变量，也可以通过在变量名前加\
  \ `&` 按引用捕获，正如我们在 `print_arr` lambda 中做的那样。\n\n*   引用捕获 `[&arr]` 让 lambda 看到外部对\
  \ `arr` 进行的任何更改。如果我们按值捕获，lambda 将拥有 `arr` 的副本。\n\n*   通过在 `main` 中定义 `print_arr`，我们封装了打印数组的功能，而无需创建单独的函数。这使得代码保持在一起并提高了可读性。\n\
  \n\n\n在 `std::sort` 的调用处直接定义比较器可以使代码更加简洁。这让我们立即看出数组是如何排序的，而无需在代码的其他地方查找。\n\n在配合\
  \ `std::sort` 算法使用 lambda 表达式的情况下，两个 lambda 表达式都非常短小且简单，易于推断它们的返回值。保持 lambda 简短和直观被认为是一种良好的实践，因为它提高了可读性，并让其他人能够立即理解代码的意图。我们也可以像下面的示例那样显式地指定\
  \ lambda 的返回类型：\n\n```\n auto greater_than = [](int a, int b) -> bool {\n      \
  \  return a > b;\n    };\n```\n\n在这里，我们显式定义了返回类型。这是可选的，当我们想要显式指定 lambda 返回的类型时可以使用它。此外，注意此\
  \ lambda 的捕获子列表是空方括号 `[]`。这表示该 lambda 没有捕获周围作用域的任何变量。\n\n当 lambda 通过引用捕获变量时，重要的是，这引入了生命周期依赖——这意味着引用所绑定的对象在调用\
  \ lambda 时必须存在——否则，我们将使用所谓的悬空引用，这是未定义行为。这在异步操作中尤其令人担心——即当 lambda 被传递给函数并在稍后调用时。接下来，我们将学习如何使用\
  \ `std::function` 存储 lambda 以异步使用。\n\n### 使用 std::function 存储 lambda\n\n`std::function`\
  \ 是一个类模板，允许我们存储、拷贝和调用调用对象（如函数指针和 lambda 表达式）。我们将通过一个简单的代码示例来演示这一点：\n\n```\n#include\
  \ <cstdio>\n#include <cstdint>\n#include <functional>\nint main() {\n    std::function<void()>\
  \ fun;\n    fun = []() {\n        printf(\"This is a lambda!\\r\\n\");\n    }; \n\
  \    fun();\n    std::uint32_t reg = 0x12345678;\n    fun = [reg]() {\n        printf(\"\
  Reg content 0x%8X\\r\\n\", reg);\n    };\n    reg = 0;\n    fun();\n    return 0;\n\
  }\n```\n\n让我们来看这个示例：\n\n* 在 `main` 函数中，我们首先创建了一个类型为 `std::function<void()>` 的对象\
  \ `fun`。这规定了 `fun` 可以存储任何返回 `void` 且不带参数的调用对象。这包括函数指针、lambda 表达式或任何具有匹配签名的 `operator()`\
  \ 对象。\n* 随后我们将一个 lambda 表达式赋值给 `fun` 并调用它，它会在控制台打印消息“This is a lambda!”。\n* 接下来，我们将另一个\
  \ lambda 表达式赋值给 `fun` 对象。这次，该 lambda 从周围作用域按值捕获了 `uint32_t reg` 并将其打印出来。按值捕获意味着\
  \ lambda 在定义时刻创建了 `reg` 自己的拷贝。\n* 在调用存储在 `fun` 中的可调用对象之前，我们将 `reg` 的值改为 `0`，以显示它是按值捕获的。调用\
  \ `fun` 会打印 `Reg content 0x12345678`。\n\n让我们在一个更有趣的示例中使用 `std::function`，其中我们将用它来存储一个指向\
  \ GPIO 中断的回调函数。代码如下：\n\n```\n#include <cstdio>\n#include <cstdint>\n#include <functional>\n\
  namespace hal\n{\nclass gpio\n{\npublic:\n    gpio(const std::function<void()> &\
  \ on_press) {\n        if(on_press) {\n            on_press_ = on_press;\n     \
  \   }\n    }\n    void execute_interrupt_handler () const {\n        if(on_press_)\
  \ {\n            on_press_();\n        }\n    }\nprivate:\n    std::function<void()>\
  \ on_press_ = nullptr;\n};\n}; // namespace hal\nint main () {\n    hal::gpio button1([]()\
  \ {\n        printf(\"Button1 pressed!\\r\\n\");\n    });\n    // invoke stored\
  \ lambda\n    button1.execute_interrupt_handler();\n    return 0;\n}\n```\n\n在上面的代码中，我们创建了一个表示\
  \ GPIO 的 `hal::gpio` 类：\n\n该类存储了 `std::function<void()> on_press_`，它可以持有任何调用对象（如\
  \ lambda 函数）。它被初始化为 `nullptr`，表示它不持有任何调用对象。\n\n* 它提供了方法 `execute_interrupt_handler`，该方法检查\
  \ `on_press_` 是否评估为真（即它是否存储了调用对象），如果是，则执行它。\n\n在 `main` 函数中，我们创建了 `button1`，一个 `hal::button`\
  \ 类的对象：\n\n* 我们为构造函数提供了一个打印 Button1 pressed! 的简单 lambda 表达式。\n* 接下来，我们调用方法 `execute_interrupt_handler`，它会调用存储的\
  \ lambda，程序将打印 `Button1 pressed!`。\n\n在真实的固件中，我们会从中断服务程序中调用 `execute_interrupt_handler`\
  \ 方法。\n\n上面的代码是命令模式的应用示例，得益于 `std::function` 和 lambda 表达式，该模式在 C++ 中以一种简单且表现力强实现。\n\
  \n## 命令模式\n\n命令模式是一种行为设计模式，用于捕获函数调用及其所需的参数——允许我们延迟执行这些函数。\n\n我们将通过命令模式的经典定义。让我们先从该模式的\
  \ UML 图开始，并在稍后进行解释：\n\n![Figure 10.1 – Command pattern – UML diagram](img/B2402_10.png)\n\
  \n图 10.1 – 命令模式 – UML 图\n\n图 10.1 描绘了命令模式的 UML 图。我们注意到图中这些实体：\n\n`command` 接口带有一个\
  \ `execute` 方法，以及一个 `concrete_command` 实现。\n\n* `receiver` 定义在 `concrete_command`\
  \ 实现中。它执行一个 `action`。\n* `invoker` 持有 `command` 接口的引用并执行它。\n* `client` 创建 `receiver`\
  \ 并将其传递给 `concrete_command` 的构造函数。\n\n通过使用 `command` 接口，我们能够创建不同的具体命令并将其提供给调用者。相比于命令接口和具体命令，我们可以使用类模板\
  \ `std::function` 和 lambda 表达式来实现相同的目的。\n\n在我们之前的示例中，我们创建了 `hal::gpio` 类作为 `invoker`。它有一个\
  \ `std::function<void()>` 成员——相当于命令接口。具体命令是存储在 `std::function<void()>` 中的 lambda\
  \ 表达式。\n\n`receiver` 是 lambda 函数体——我们示例中的 `printf` 函数——而 `client` 是 `main` 函数。客户端创建一个接收者（`hal::gpio\
  \ button1`）并为它提供一个具体命令（lambda 表达式）。我们直接从 `main` 函数调用调用者的 `execute_interrupt_handler`。\n\
  \n接下来，我们将扩展这个示例，在 STM32 平台上从中断处理程序调用 `execute_interrupt_handler`。该设计将支持多个引脚的中断。我们将引入\
  \ `gpio_interrupt_manager` 实体，它将负责注册调用者并调用它们的 `execute_interrupt_handler` 方法。\n\n\
  # GPIO 中管理器\n\n我们希望利用 `std::function` 类模板和 lambda 表达式，为固件提供一种表现力强的创建 GPIO 中断处理的方式，如下代码所示：\n\
  \n```\nconst hal::gpio_stm32<hal::port_a> button1(hal::pin::p4, [](){\n    printf(\"\
  Button1 pressed!\\r\\n\");\n});\n```\n\n\n\n从上述代码中，我们可以看到正在配置的 `pin` 和 `port`，以及将在中断时执行的回调函数。我们将创建的机制将处理中断处理程序的注册到一个我们命名为\
  \ `gpio_interrupt_manager` 的中心实体中。在继续设计之前，请按照下面的说明在 Renode 中运行完整示例。\n\n1. 启动 Visual\
  \ Studio Code，将其附加到正在运行的容器，按照第 4 章 中的描述打开 `Chapter10/lambdas` 项目，并在 Visual Studio\
  \ Code 终端中运行以下命令，或直接在容器终端中运行它们：\n\n   ```\n   $ cd Chapter10/lambdas\n   $ cmake\
  \ -B build -DCMAKE_BUILD_TYPE=Debug -DMAIN_CPP_FILE_NAME=main_std_function_command_pattern.cpp\n\
  \   $ cmake --build build --target run_in_renode\n   ```\n\n2. 在 Renode 中，我们可以使用以下命令模拟\
  \ `button1` 和 `button2` 按钮的按下和释放：\n\n   ```\n   gpioPortA.button1 PressAndRelease\n\
  \   gpioPortA.button2 PressAndRelease\n   ```\n\n3. 输入上述命令应会在 Renode 控制台中产生以下输出：\n\
  \n   ```\n   Button1 pressed!\n   Button2 pressed!\n   ```\n\n如你所见，lambda 中提供的动作是由按钮产生的中断调用的。让我们通过这个示例的\
  \ UML 图来了解它的工作原理：\n\n![图 10.2 – GPIO 中断管理器 UML 图](img/B22402_10_02.png)\n\n图 10.2\
  \ – GPIO 中断管理器 UML 图\n\n在图 10.2 中，我们看到了 GPIO 中断管理器的 UML 图。它基于命令模式。我们使用 `std::function<void()>`\
  \ 代替了命令接口，并使用 lambda 表达式作为具体命令。调用者是 `hal::gpio` 抽象类，它将 lambda 存储在成员 `on_press` 中。如从下面的代码所示，它在构造函数中向\
  \ `gpio_interrupt_manager` 注册了自己：\n\n```\ngpio::gpio(const std::function<void()>\
  \ & on_press) {\n   on_press_ = on_press;\n   gpio_interrupt_manager::register_interrupt_handler(this)\n\
  }\n```\n\n`gpio_interrupt_manager` 是一个简单的结构体。它作为中断处理机制的中心实体，具有以下特性：\n\n* 它包含一个 `hal::gpio`\
  \ 指针数组——`std::array<gpio*, c_gpio_handlers_num> gpio_handlers`。\n* 它提供了一个静态方法来注册一个\
  \ `hal::gpio` 指针——`void register_interrupt_handler(gpio * pin)`。\n* 它提供了一个静态方法来执行存储在数组中的中断处理程序——`void\
  \ execute_interrupt_handlers()`。\n\n`execute_interrupt_handlers` 方法是从中断服务例程调用的，如下所示：\n\
  \n```\nextern \"C\" void EXTI4_15_IRQHandler(void) {\n    gpio_interrupt_manager::execute_interrupt_handlers();\n\
  }\n```\n\n`EXTI4_15_IRQHandler` 是定义在向量表中的服务例程序（定义在 `platform/startup_stm32f072xb.s`\
  \ 中）。这就是为什么我们使用 `\"C\"` 语言链接并将其实现为全局函数。`execute_interrupt_handlers` 方法遍历 `hal::gpio`\
  \ 指针数组，并如下所示调用它们的 `execute_interrupt_handler` 方法：\n\n```\nvoid gpio_interrupt_manager::execute_interrupt_handlers()\
  \ {\n    for(std::size_t i = 0; i < w_idx; i++) {\n        gpio_handlers[i]->execute_interrupt_handler();\n\
  \    }\n}\n```\n\n`hal::gpio` 是一个具有以下特性的抽象类：\n\n* 它实现了 `gpio_interrupt_manager`\
  \ 使用的 `execute_interrupt_handler` 方法，正如我们之前所的。\n* 它定义了纯虚拟方法 `[[nodiscard]] virtual\
  \ bool is_interrupt_generated() const = 0`。该方法需要由实现特定平台的派生类进行重写。\n* 它定义了虚方法 `virtual\
  \ void clear_interrupt_flag() const = 0`。该方法需要由实现特定平台的派生类进行重写。\n\n`execute_interrupt_handler`\
  \ 的代码如下所示：\n\n```\nvoid gpio::execute_interrupt_handler () const {\n    if(is_interrupt_generated()){\n\
  \        clear_interrupt_flag();\n        if(on_press_) {\n            on_press_();\n\
  \        }\n    }\n}\n```\n\n`execute_interrupt_handler` 方法实现了以下功能：\n\n* 它使用虚方法\
  \ `is_interrupt_generated` 检查中断是否应该由当前对象处理。该方法必须由派生类重写。派生类拥有判断产生的中断是否需要由当前对象处理所需的数据。\n\
  * 如果中断应该由当前对象处理，则使用虚方法 `clear_interrupt_flag` 清除中断位，如果 `on_press_` 存储了可对象，则调用它。\n\
  \n`hal::gpio_stm32` 是派自 `hal::gpio` 的类模板。我们用端口作为参数实例化它，并使用厂商提供的 C HAL 库实现了与平台相关的操作，例如\
  \ GPIO 初始化。\n\n在示例中，我们使用结构体 `port_a` 实例化了 `hal::gpio_stm32`，它包含静态函数 `void init_clock()`。`hal::gpio_stm32`\
  \ 是派自 `hal::gpio` 的类模板。我们用端口作为参数实例化它，并使用厂商提供的 C HAL 库实现了与平台相关的操作，例如 GPIO 初始化。\n\n\
  在示例中，我们使用结构体 `port_a` 实例化了 `hal::gpio_stm32`，它包含静态函数 `void init_clock()`。`hal::gpio_stm32`\
  \ 是派自 `hal::gpio` 的类模板。我们用端口作为参数实例化它，并使用厂商提供的 C HAL 库实现了与平台相关的操作，例如 GPIO 初始化。\n\n\
  这总结了 GPIO 中断管理器的实现。你可以参考 `Chapter10/lambdas` 文件夹中的更多细节。接下来，我们将讨论使用 `std::function`\
  \ 对内存的影响。\n\n## std::function 与动态分配\n\n`std::function` 需要存储 lambda 捕获的所有变量。这种行为是实现定义的，大多数实现会使用堆内存。`std::function`\
  \ 需要存储 lambda 捕获的所有变量。这种行为是实现定义的，大多数实现会使用堆内存。如果捕获的数据较小（例如 16 字节），它将存储在栈上。这被称为小对象优化。为了演示\
  \ `std::function` 捕获数据的行为，我们将通过以下示例：\n\n```\n#include <cstdio>\n#include <cstdint>\n\
  #include <cstdlib>\n#include <functional>\n#include <array>\n\nvoid *operator new(std::size_t\
  \ count) {\n  printf(\"%s, size = %ld\\r\\n\", __PRETTY_FUNCTION__, count);\n  return\
  \ std::malloc(count);\n}\nvoid operator delete(void *ptr) noexcept {\n  printf(\"\
  %s\\r\\n\", __PRETTY_FUNCTION__);\n  std::free(ptr);\n}\nint main () {\n    std::function<void()>\
  \ func;\n    auto arr = []() {\n        constexpr std::size_t c_array_size = 6;\n\
  \        std::array<int, c_array_size> ar{};\n        for(int i = 0; i < ar.size();\
  \ i++) {\n            ar[i] = i;\n        }\n        return ar;\n    }();\n    auto\
  \ array_printer = [arr]() {\n        for(int elem: arr) {\n            printf(\"\
  %d, \", elem);\n        }\n        printf(\"\\r\\n\");\n    };\n    func = array_printer;\n\
  \    // 调用存储的 lambda\n    func();\n    return 0;\n}\n```\n\n在上述示例中，我们重写了 `new` 和\
  \ `delete` 运算符，以展示存储捕获 6 个整数数组的 lambda 将触发动态内存分配。如果在 Compiler Explorer 中使用 `x86-64\
  \ GCC 14.2` 运行上述示例，你将看到以下输出：\n\n```\nvoid* operator new(std::size_t), size = 24\n\
  0, 1, 2, 3, 4, \nvoid operator delete(void*)\n```\n\n\n\n\n此示例还演示了如何使用 lambda 生成数组成员来初始化变量\
  \ `arr`。如果你将 `constexpr std::size_t c_array_size` 更改为 4，你将会注意到 `new` 和 `delete`\
  \ 运算符将不再被调用，这意味着在这种情况下，捕获的数据存储在栈内存上。\n\n为了解决这个问题，我们可以将 lambda 对象的 `std::reference_wrapper`\
  \ 赋值给 `std::function<void()> fun`，而不是像下面这行代码那样直接赋值对象本身：\n\n```\nfun = std::ref(array_printer);\n\
  ```\n\n这将使 `std::function` 对象使用指向 lambda 对象的引用器，而不是复制它并存储该 lambda 捕获的所有变量。使用这种方法，我们必须注意\
  \ lambda 对象的生命周期，这意味着如果它离开了作用域而我们尝试通过 `std::function` 对象调用它，将导致程序的未定义行为。\n\n我们也可以使用普通的函数指针来存储\
  \ lambda，但仅当它们不捕获周围作用域的任何内容时，如下例所示：\n\n```\n#include <cstdio>\n#include <functional>\n\
  int main () {\n    void(*fun)(void);\n    fun = []() {\n        printf(\"Lambda!\\\
  r\\n\");\n    };\n    fun();\n    return 0;\n}\n```\n\n在上面的示例中，我们将 lambda 赋值给函数指针，这在某些应用中可以作为存储\
  \ lambda 到 `std::function` 类模板的替代方案。这使得将不带捕获的 lambda 传递给期望函数指针的 C 函数成为可能。\n\n##\
  \ 总结\n\nLambda 表达式和 `std::function` 是强大的现代 C++ 工具，允许我们编写具表现力的代码，并以优雅的方式实现命令模式等设计模式。我们学习了从周围作用域捕获数据的不同方式——按值或按引用。我们还学习学习了命令模式设计模式，并学习了如何将其应用到\
  \ GPIO 中断管理器中。\n\n在下一章中，我们将介绍 C++ 中的编译时计算。\n\n# 11 编译时计算\n\n**编译时计算**指的是编译器在编译时执行函数的能力，而不是将它们转换为机器码。这意味着复杂操作的结果可以由编译器计算，并存储在运行时使用的变量中。只有当函数的所有参数在编译时已知时，编译器才能在编译时执行该函数。\n\
  \n我们可以在 C++ 件中使用编译时计算来计算复杂的数学运算、生成生成查找表和数组，并在运行时使用生成的值。在编译时执行这些操作将节省宝贵的内存和处理器（空间和时间）资源，并将它们留给其他更重要的操作。\n\
  \n本章的目标是学习如何在 C++ 中使用编译时计算，将复杂操作转移到编译时并节省宝贵的资源。在本章中，我们将涵盖以下主要主题：\n\n*   模板 (Templates)\n\
  *   `constexpr` 标识符\n*   `consteval` 标识符\n\n## 技术要求\n\n为了充分利用本章，我强烈建议在阅读示例时使用 Compiler\
  \ Explorer ([`godbolt.org/`](https://godbolt.org/))。为 x86 架构选择 GCC 作为编译器。这将允许你看到标准输出\
  \ (stdio) 结果并更好地观察代码的行为。由于我们使用了大量现代 C++ 特性，请确保通过编译器选项框中添加 `-std=c++23` 来选择 C++23\
  \ 标准。\n\nCompiler Explorer 能够轻松尝试代码、调整代码，并立即查看它们如何影响输出和生成的汇编代码。大多数示例还可以在 ARM Cortex-M0\
  \ 目标上的 Renode 模拟器中运行，并在 GitHub 上可用 ([`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter11`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter11))。\n\
  \n## 模板\n\nC++ 中第一个编译时计算机制是**模板元编程 (TMP)**。使用 TMP，我们可以将操作结果存储在类型中，如下面的计算阶乘示例所示：\n\
  \n```\ntemplate <unsigned int N>\nstruct factorial {\n    static const unsigned\
  \ int value = N * factorial<N-1>::value;\n};\ntemplate <>\nstruct factorial<0> {\n\
  \    static const unsigned int value = 1;\n};\nint main () {\n    const int fact\
  \ = factorial<5>::value;\n    return fact;\n}\n```\n\n如果你在 Compiler Explorer 中运行此示例（即使没有优化），你将看到它返回\
  \ 120。生成的汇编代码很短，不包含任何函数调用。它只是将值 120 放置在 `main` 函数的返回寄存器中，这意味着阶乘计算是在编译时完成的。你可以在这里查看生成的汇编代码：\n\
  \n```\nmain:\n        push    rbp\n        mov     rbp, rsp\n        mov     DWORD\
  \ PTR [rbp-4], 120\n        mov     eax, 120\n        pop     rbp\n        ret\n\
  ```\n\n在前面的示例中，我们执行了以下步骤：\n\n*   我们定义了一个类模板 `factorial`。它有一个 `unsigned int` 类型的参数\
  \ `N`，只有一个成员：`static const unsigned int value = N * factorial<N-1>::value`。\n* \
  \  在成员 `value` 的赋值表达式中，我们在模板级别使用递归，因为通过乘以 `N` 来计算它。\n*   为了解决这个问题，我们可以将 lambda 对象的\
  \ `std::reference_wrapper` 赋值给 `std::function<void()> fun`，而不是对象本身，如下面代码行所示：\n\n\
  ```\nfun = std::ref(array_printer);\n```\n\n这将使 `std::function` 对象使用指向 lambda 对象的引用器，而不是复制它并存储该\
  \ lambda 捕获的所有变量。使用这种方法，我们必须注意 lambda 对象的生命周期，这意味着如果它离开了作用域而我们尝试通过 `std::function`\
  \ 对象调用它，将导致程序的未定义行为。\n\n我们使用普通的函数指针来存储 lambda，但仅当它们不捕获周围作用域的任何内容时，如下例所示：\n\n```cpp\n\
  #include <cstdio>\n#include <functional>\nint main () {\n    void(*fun)(void);\n\
  \    fun = []() {\n        printf(\"Lambda!\\r\\n\");\n    };\n    fun();\n    return\
  \ 0;\n}\n```\n\n在上面的示例中，我们将 lambda 赋值给函数指针，这在某些应用中可以作为存储 lambda 到 `std::function`\
  \ 类模板的替代方案。这使得将不带捕获的 lambda 传递给期望函数指针的 C 函数成为可能。\n\n*(注：原文中后续 Templates 部分存在大量重复和乱码，译文已根据逻辑进行了去重处理。)*\n\
  \n\n\n\n\n如果你在 Compiler Explorer 中使用 `x86-64 GCC 14.2` 编译器运行此示例且不启用优化，我们可以观察到以下现象：\n\
  \n* 程序返回 `0`。\n* 生成的汇编代码很小，它只是将 `0` 移动到返回寄存器。\n* 如果你更改 `ret` 变量的初始化，使得 `sin` 函数接受\
  \ `3.14/2` 作为参数，程序将返回 `1`。\n\n现在，如果我们尝试将 Compiler Explorer 中的编译器更改为 `x86-64 clang\
  \ 18.1.0`，将得到以下编译器错误：\n\n```\n<source>:4:19: error: constexpr variable 'ret' must\
  \ be initialized by a constant expression\n    4 |     constexpr int ret = round(sin(3.14));\n\
  \      |                   ^     ~~~~~~~~~~~~~~~~\n<source>:4:31: note: non-constexpr\
  \ function 'sin' cannot be used in a constant expression\n    4 |     constexpr\
  \ int ret = round(sin(3.14));\n```\n\n编译器报告我们违反了规则，即初始化的整个表达式必须是一个常量表达式，因为表达式 `round(sin(3.14))`\
  \ 中的函数 `sin` 是非 `constexpr` 的。这是因为 Clang 对数学函数的实现是非 `constexpr` 的，而 GCC 将它们实现为 `constexpr`\
  \ 函数。在新的 C++26 标准中，许多数学函数将成为 `constexpr` 函数。\n\n尽管即将来的 C++26 标准强制要求数学函数应该是 `constexpr`，但我们将继续使用当前的\
  \ GCC 实现，因为这是我们在书中示例中针对 STM32 目标所使用的编译器。所有的 `constexpr` 函数都必须满足以下要求：\n\n* 它的 `return`\
  \ 类型必须是 `literal` 类型。\n* 它的每个参数都必须是 `literal` 类型。\n* 如果函数不是构造函数，它必须只能有一个 `return`\
  \ 语句。\n\n为了更好地理解 `constexpr` 函数，让我们在下面的示例中将阶乘算法实现为一个 `constexpr` 函数：\n\n```cpp\n\
  constexpr unsigned int factorial(unsigned int n) {\n    unsigned int prod = 1;\n\
  \    while(n > 0) {\n        prod *= n;\n        n--;\n    }\n    return prod;\n\
  }\nint main () {\n    constexpr int calc_val = 5;\n    constexpr unsigned int ret\
  \ = factorial(calc_val);\n    return ret;\n}\n```\n\n在这个示例中，我们将 `factorial` 算法实现了一个简单的\
  \ `constexpr` 函数。与基于 TMP（模板元编程）的解决方案相比，这段代码对许多有 C 背景的开发者来说非常熟悉。没有模板级别的递归和奇怪的语法。C++11\
  \ 的 `constexpr` 函数仍然依赖递归，但 C++14 放宽了 `constexpr` 函数的限制，允许使用局部变量和循环。\n\n如果我们在 Compiler\
  \ Explorer 中使用 `x86-64 GCC 14.2` 编译器运行上述示例且不启用优化，我们可以观察到：\n\n* 程序返回 120。\n* 生成的汇编代码很小，它只是将\
  \ 120 移动到返回寄存器。\n* 在生成的汇编代码中没有 `factorial` 函数，这意味着编译器在编译时执行了该函数。我们提供了一个带有常量表达式参数的阶乘函数，编译器在编译时评估了该函数。\n\
  * 如果我们从 `calc_val` 和 `ret` 变量声明中移除 `constexpr` 限定符，我们将在生成的汇编调用中看到 `factorial` 函数，并在\
  \ `main` 中我们将看到对该函数的调用，这意味着在这种情况下 `factorial` 函数是在运行时执行的，对于固件来说，它将成为二进制文件的一部分。\n\
  \n从这个示例中可以看出，`constexpr` 函数既可以在编译时执行，也可以在运行时执行，取决于我们提供的参数。接下来，我们将通过实际示例来查看如何在固件开发中使用\
  \ `constexpr` 限定符。\n\n### 示例 1 – MAC 地址解析器\n\n**介质访问控制**（**MAC**）地址被用于不同通信栈的 MAC\
  \ 层，包括以太网、Wi-Fi 和蓝牙。在这里，我们将创建一个 48 位的 MAC 地址编译时解析器，它将帮助我们把用冒号分隔的十六进制数表示的常见 MAC 地址格式转换为\
  \ `uint8_t` 数组，这通常用于软件栈中。代码显示如下：\n\n```cpp\n#include <array>\n#include <cstdint>\n\
  #include <string_view>\n#include <charconv>\nstruct mac_address {\n    static constexpr\
  \ std::size_t c_bytes_num = 6;\n    static constexpr std::size_t c_mac_addr_str_size\
  \ = 17;\n\n    std::array<uint8_t, c_bytes_num> bytes{};\n    bool is_valid = false;\n\
  \    constexpr mac_address(std::string_view str) {\n        if (str.size() != c_mac_addr_str_size)\
  \ {\n            return;\n        }\n        for (size_t i = 0; i < c_bytes_num;\
  \ ++i) {\n            const std::string_view byte_str = str.substr(i * 3, 2);\n\
  \            uint8_t value = 0;\n            auto result = std::from_chars(byte_str.data(),\
  \ byte_str.data() \n                                            + byte_str.size(),\
  \ value, 16);\n            if (result.ec != std::errc()) {\n                return;\n\
  \            }\n            bytes[i] = value;\n        }\n        is_valid = true;\n\
  \    }\n};\nint main () {\n    constexpr mac_address addr(\"00:11:22:33:44:55\"\
  );\n    static_assert(addr.is_valid);\n    return addr.bytes[5];\n}\n```\n\n在 `main`\
  \ 函数中，我们创建了一个 `mac_address` 实例，提供了字符串字面量 `\"00:11:22:33:44:55\"`。如果在 Compiler Explorer\
  \ 中使用 `x86-64 GCC 14.2` 编译器运行上述示例且不启用优化，我们可以观察到：\n\n* 程序返回十进制 `85`。将其转换为十六进制将得到\
  \ `0x55`，这对应 MAC 地址的最后一个字节。\n* 生成的汇编代码很小。它填充了我们使用的 MAC 地址。没有构造函数的调用，这意味着它在编译时执行。\n\
  * 如果我们将构造函数提供的 MAC 地址更改为 `\"000:11:22:33:44:55\"` 或 `\"G0:11:22:33:44:55\"`，编译器将由于\
  \ `static_assert(addr.is_valid)` 失败而报错。\n\n现在让我们详细解释 `mac_address` 结构体：\n\n* 该结构体包含\
  \ `std::array<uint8_t, c_bytes_num> bytes` 和 `bool is_valid`。除了构造函数外不包含任何方法。\n*\
  \ 构造函数接受 `std::string_view` 类模板，它封装了指向提供字面量第一个元素的指针及其大小。\n* 构造函数使用 `string_view`\
  \ 对象的 `substr` 方法创建子视图，并使用 `std::from_chars` 将其转换为 `uint8_t` 值，存储在 `bytes` 数组中。\n\
  * 如果没有错误，构造函数将 `is_valid` 设置为 true。通过 `static_assert`，我们可以在编译时验证提供的 MAC 地址字面量是否转换成功。我们不能在\
  \ `constexpr` 函数中使用断言。另一种方法是抛出异常，这将导致编译错误，但我们决定不在嵌入式目标上使用异常。\n\n你还可以在 Renode 模拟器上针对\
  \ STM32 运行上述示例。启动 Visual Studio Code，连接到运行中的容器，并按照*第 4 章 中的描述打开 `Chapter11/compile_time`\
  \ 项目，然后在 Visual Studio Code 终端中运行以下命令，或者直接在容器终端中运行：\n\n```bash\n$ cd Chapter11/compile_time\n\
  $ cmake -B build -DCMAKE_BUILD_TYPE=MinSizeRel -DMAIN_CPP_FILE_NAME=main_constexpr_mac_address.cpp\n\
  $ cmake --build build --target run_in_renode\n```\n\n这里是 `main_constexpr_mac_address.cpp`\
  \ 文件中 `main` 函数的部分：\n\n\n\n\n```cpp\nconstexpr mac_address addr(\"00:11:22:33:44:55\"\
  );\nstatic_assert(addr.is_valid);\nconst std::array<uint8_t, 6> addr_arr{0x00, 0x11,\
  \ 0x22, 0x33, 0x44, 0x55};\nconst auto & mac_ref = addr.bytes;\n//const auto & mac_ref\
  \ = addr_arr;\nprintf(\"%02X:%02X:%02X:%02X:%02X:%02X\\r\\n\", mac_ref[0], mac_ref[1],\
  \ mac_ref[2], mac_ref[3], mac_ref[4], mac_ref[5]);\n```\n\n为了确认将字符串字面量转换为数组的工作是在编译时完成的，你可以将引用\
  \ `mac_ref` 绑定到 `addr_arr` 并比较两种情况下的二进制大小。它们都是 6,564 字节，这意味着 `constexpr` 构造函数没有包含在二进制文件中，因为它实际上是由编译器在编译时执行的。\n\
  \n接下来，我们将通过一个使用 C++ 中 `constexpr` 函数为温度热敏电阻创建查找表的示例。\n\n### 示例 2 – 生成查找表\n\n热敏电阻是电阻随温度变化的电阻器。它们通常用于嵌入式系统。它们通常具有非线性曲线。有多种方法可以将模拟数转换器（`ADC`）从热敏电阻读取的值转换为温度。最常用的方法之一是\
  \ **beta 系数**（beta coefficient）。它是通过测量热敏电阻在两个温度点下的电阻计算出的。它用于通过公式计算温度：\n\n![](img/B22402_11_001.png)\n\
  \n在该方程中，`T[0]` 是 25^oC (298.15K) 的室温，`R[0]` 是热敏电阻在室温下的电阻。使用 beta 系数（制造商提供的常量）是对热敏电阻曲线的简化，因为它依赖于仅在两个点测量曲线。\n\
  \nSteinhart-Hart 方程提供更准确的曲线拟合方法，因为它依赖于通过四个温度点测量热敏电阻计算出的四个系数。方程所示：\n\n![](img/B22402_11_002.png)\n\
  \n系数 `A`、`B`、`C` 和 `D` 在四个不同的温度点测量热敏电阻温度后计算得出——这意味着这些是制造商为热敏电阻提供的常量。Steinhart-Hart\
  \ 方程计算出的温度为开尔文。Steinhart-Hart 方程的缺点对于小型嵌入式目标来说计算量太大。\n\n在这个示例中，我们将使用 Steinhart-Hart\
  \ 方程创建一个查找表，并依靠它通过从嵌入式目标中的读取 ADC 值来确定温度。如方程所示，温度是电阻和给定常数的函数。对于选定的电阻范围和选定的分辨率，我们将生成一个温度值查找表。然后，我们将模拟读取热敏电阻值并搜索查找表以确定温度。\n\
  \n我们将选择一个想要作为查找表基础的电阻范围以及我们想要使用的点数。为此，我们需要一种功能，在给定范围内生成等间距的数字数组，也称为线性空间（linear space）。接下来，我们将该线性空间作为信号生成器的参数。让我们按照如下方式实现：\n\
  \n1. 这里是显示线性空间生成器的代码：\n\n```cpp\n#include <array>\n#include <cstdio>\ntemplate <typename\
  \ T, std::size_t N>\nstruct signal : public std::array<T, N> {\n  constexpr signal()\
  \ {}\n  constexpr signal(T begin, T end) {\n    static_assert(N > 1, \"N must be\
  \ bigger than 1\"); \n    float step = (end - begin) / (N - 1);\n    for (std::size_t\
  \ i = 0; i < N; i++) {\n      this->at(i) = begin + i * step;\n    }\n  }\n};\n\
  int main() {\n    constexpr signal<float, 10> x_axis(0, 9);\n    for(auto elem:\
  \ x_axis) {\n        printf(\"%.2f, \", elem);\n    }\n    printf(\"\\r\\n\");\n\
  \    return 0;\n}\n```\n\n如果我们运行此程序，它将打印 0 到 10 范围内的 10 个数字，如下：\n\n```\n0.00, 1.00,\
  \ 2.00, 3.00, 4.00, 5.00, 6.00, 7.00, 8.00, 9.00,\n```\n\n打印的数字是由 `signal` `struct`\
  \ 在编译时生成的。为了回到我们的示例，假设这些值是我们想要使用 Steinhart-Hart 方程计算温度的电阻值。让我们详细介绍实现：\n\n- `signal`\
  \ 是一个类模板。模板参数为 `typename T` 和 `std::size_t N`。它们决定了 `struct` 基础的数组类型。\n\n\n\n前面的代码将创建一个名为\
  \ `result` 的新信号，该信号是信号 `sig` 中每个元素乘以标量 `2.0` 的结果。\n\n1.  同样地，我们可以通过将现有信号除以一个标量来创建一个新信号，如下所示：\n\
  \n```cpp\nauto result = sig / 2.0f;\n```\n\n这段代码将创建一个名为 `result` 的新信号，该信号是信号 `sig`\
  \ 中每个元素除以标量 `2.0` 的结果。\n\n1.  为了支持位于运算符 `*` 和 `/` 左侧的标量，我们需要实现全局运算符 `operator*`\
  \ 和 `operator/`。我们将通过将它们声明为 `struct signal` 的友元（friend）来实现，如下所示：\n\n```cpp\ntemplate\
  \ <typename T, std::size_t N>\nstruct signal : public std::array<T, N> {\n// ...\n\
  \  friend constexpr signal operator*(const T &t, const signal &sig)\n  {\n    return\
  \ sig * t;\n  }\n  friend constexpr signal operator/(const T &t, const signal &sig)\n\
  \  {\n    signal ret;\n    for (std::size_t i = 0; i < N; i++) {\n      ret.at(i)\
  \ = t / sig.at(i);\n    }\n    return ret;\n  }\n};\n```\n\n此代码中的友元函数 `operator*`\
  \ 允许在标量位于左侧（`scalar * signal`）时进行标量乘法，这是成员函数无法实现的。由于乘法具有交换律（`a * b = b * a`），我们只需调用成员函数\
  \ `operator*` 并返回结果（`return sig * t`）。\n\n1.  在友元函数 `operator/` 中，我们执行以下步骤：\n  \
  \ 1. 创建一个新的信号 `ret`。\n   2. 遍历信号 `sig` 的元素，对于每个元素，用标量 `t` 除以该元素。\n   3. 返回信号 `ret`。\n\
  \n2.  通过将运算符 `*` 和 `/` 同时重载为全局和成员函数，我们现在可以像下面的示例一样创建信号：\n\n```cpp\nint main() {\n\
  \    // ...\n    constexpr signal<float, 10> x_axis(0, 9);\n    print_signal(x_axis);\n\
  \    auto linear_fun = 2.f * x_axis;\n    print_signal(linear_fun);\n    auto linear_fun2\
  \ = linear_fun / 2.f;\n    print_signal(linear_fun2);\n    return 0;\n}\n```\n\n\
  这段代码将产生以下输出：\n\n```\n0.00, 1.00, 2.00, 3.00, 4.00, 5.00, 6.00, 7.00, 8.00, 9.00,\n\
  0.00, 2.00, 4.00, 6.00, 8.00, 10.00, 12.00, 14.00, 16.00, 18.00,\n0.00, 1.00, 2.00,\
  \ 3.00, 4.00, 5.00, 6.00, 7.00, 8.00, 9.00,\n```\n\n从输出中可以看出，原始创建的 `x_axis` 代表从\
  \ 0 到 9.00 具有 10 个点的线性空间，乘以 2.0 以创建 `linear_fun`。然后我们将 `linear_fun` 除以 2.0 以创建 `linear_fun2`，它与\
  \ `x_axis` 匹配。\n\n1.  为了能够编写 Steinhart-Hart 方程，我们还需要重载运算符 `+` 和 `-`，如下所示：\n\n```cpp\n\
  template <typename T, std::size_t N>\nstruct signal : public std::array<T, N> {\n\
  // ...\n  constexpr signal operator+(const T &t) const {\n    return signal(*this,\
  \ &\n                  { return elem + t; });\n  };\n  constexpr signal operator-(const\
  \ T &t) const {\n    return signal(*this, &\n                      { return elem\
  \ - t; });\n  };\n  constexpr signal operator+(const signal &sig) const {\n    signal\
  \ ret;\n    for (std::size_t i = 0; i < N; i++)\n    {\n      ret.at(i) = this->at(i)\
  \ + sig.at(i);\n    }\n    return ret;\n  };\n  friend constexpr signal operator+(const\
  \ T &t, const signal &sig)\n  {\n    return sig + t;\n  }\n};\n```\n\n在此代码中，我们重载了以下运算符：\n\
  - 成员 `constexpr signal operator+(const T &t)`，允许我们向信号添加一个标量（`signal + scalar`）\n\
  - 成员 `constexpr signal operator-(const T &t)`，允许我们从信号中减去一个标量（`signal - scalar`）\n\
  - 成员 `constexpr signal operator+(const signal &sig)`，允许我们逐元素相加两个信号（`signal1 + signal2`）\n\
  - 全局 `constexpr signal operator+(const T &t, const signal &sig)`\n\n### 编写 Steinhart-Hart\
  \ 方程的信号\n\n现在我们有了所有元素来编写一个表示 Steinhart-Hart 方程的信号，如下：\n\n```cpp\nint main() {\n\
  \  // ...\n  constexpr signal<float, 10> x_axis(0, 9);\n  print_signal(x_axis);\n\
  \  constexpr auto linear_fun = 2.f * x_axis;\n  print_signal(linear_fun);\n  constexpr\
  \ auto linear_fun2 = linear_fun / 2.f;\n  print_signal(linear_fun2);\n  return 0;\n\
  }\n```\n\n这段代码将产生以下输出：\n\n```\n0.00, 1.00, 2.00, 3.00, 4.00, 5.00, 6.00, 7.00, 8.00,\
  \ 9.00,\n0.00, 2.00, 4.00, 6.00, 8.00, 10.00, 12.00, 14.00, 16.00, 18.00,\n0.00,\
  \ 1.00, 2.00, 3.00, 4.00, 5.00, 6.00, 7.00, 8.00, 9.00,\n```\n\n### 将信号保存到 CSV 文件\n\
  \n为了将信号保存到 CSV 文件，我们可以使用 `<fstream>` 头文件，如下：\n\n```cpp\n#include <fstream>\n\nvoid\
  \ save_to_csv(const std::string& filename, const signal<float, 10>& sig) {\n   \
  \ std::ofstream file(filename);\n    if (file.is_open()) {\n        for (int i =\
  \ 0; i < sig.size(); ++i) {\n            file << sig.at(i) << \"\\n\";\n       \
  \ }\n        file.close();\n    }\n}\n```\n\n`save_to_csv` 函数遍历 `signal` 的元素并将每个值写入指定的文件。\n\
