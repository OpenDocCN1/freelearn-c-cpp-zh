  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n献给我的妻子 Ferisa 以及我的父母 Safet 和 Enisa，感谢他们的爱与支持。\n\
  – Amar\n\n## 前言\n\n在本书《嵌入式系统的 C++》中，Amar Mahmutbegović 向你展示了如何将现代 C++ 应用于嵌入式系统。这些系统通常运行在资源受限的环境中，CPU\
  \ 功率、内存和电能有限，并且必须满足对定时和可靠性的严格要求。它们可能需要避免递归和动态内存管理等编程实践。\n\nC 长期一直是嵌入式系统的首选语言。然而，C++\
  \ 提供了更有表现力的抽象和设计范式、更好的类型安全以及更好的资源和内存安全，同时保留了 C 的底层硬件访问能力。你可能因为过去对 C++ 在嵌入式系统中适用性的疑虑而不愿使用它。这门语言及其编译器在几十年中不断演进，消除了这些疑虑。更好的类型内存安全意味着编译器可以在编译时发现更多错误，而不会产生运行时开销。\n\
  \nAmar 将带你了解实现这些改进的现代 C++ 特性（通过 `C++23`）。这包括了静态和动态绑定、动态和编译时多态、模板和元编程、资源管理以及编译时计算等技术，以及支持健壮设计的模式和原则。他从经验嵌入式系统开发者的视角出发，提供了简单实用的示例。\n\
  \n他向你展示了如何使用 `Compiler Explorer` 和 `Renode` 等工具检查生成的机器码并模拟嵌入式目标，让你亲眼证实这些方法确实如其承诺。\n\
  \n你在这里学到的方法将帮助你构建更可靠、灵活、可维护、可重用、自适应且高效的嵌入式系统。\n\n*Steve Branam*\nAmazon Robotics\
  \ 高级软件开发工程师\n\n# 贡献者\n\n# 关于作者\n\nAmar Mahmutbegović 是 Semblie 的联合创始人兼工程负责人，在那里他领导使用现代\
  \ C++ 进行固件开发。他的专业知识扩展到 BLE 消费级设备和医疗设备的开发，为包括初创公司在内的广泛客户提供复杂的解决方案。Amar 对创新的投入有助于将电子产品理念走向世界。Amar\
  \ 积极通过博客和 LinkedIn 在嵌入式社区中分享 C++ 的优势。他还指导年轻工程师，提升他们在现代开发实践中的技能。他的工作旨在使嵌入式系统更易于访问、维护和扩展具扩展性，为全球的开发者弥合传统方法与现代效率之间的鸿沟。\n\
  \n我深感谢我的妻子、朋友以及我的挚爱 Ferisa Živčić，感谢她在过去一年里包容我。在全职工作的同时写书占据了我大量的空闲时间和精力，我对她的耐心、理解和支持感激不尽。\n\
  \n我很庆幸拥有最好的父母 Enisa 和 Safet。他们教会了我学习和努力工作的重要性，并用坚定的道德价值观引导我。\n\n非常感谢所有支持我并在任何方面提供过帮助的家人、朋友和同事。\n\
  \n# 关于评审员\n\nDirk Jan ten Kate 是一位高级嵌入式软件工程师，在嵌入式系统领域拥有 15 年以上的经验，专攻汽车和气体测量行业。在他目前的雇主处，他开发了一个模块化的、硬件无关的固件平台，作为所有新产品的基础。Dirk\
  \ Jan 对软件质量充满热情，推动测试驱动开发和持续集成实践的采用。他的专业知识跨越系统设计、微控制器开发、RTOS、`CAN`、`BLE`、高层通信协议、底层串行协议以及\
  \ `C` 和 `C++` 编程。\n\nRugved Hattekar 是一位才华的工程师，在嵌入式系统、机器人和自动驾驶技术方面拥有深厚的背景。他曾使用 `C/C++`\
  \ 为关键安全系统开发软件，专注于软硬件集成、传感器融合和实时性能。在 GPR, Inc.，他利用地质雷达参与车辆定位和地图构建。在 Luminar Technologies，他担任高级\
  \ Lidar 软件开发人员，专注于 Lidar 传感器的嵌入式数字信号处理。Rugved 为嵌入式 C++ 应用带来了深入的技术见解。\n\nJacob Beningo\
  \ 帮助嵌入式团队实现架构、开发流程和技能的现代化，以交付高质量的实时系统。凭借二十年的经验和完成的百多个项目，他通过 Beningo Embedded Group\
  \ 和 Embedded Software Academy 提供专家培训、咨询和指导。\n\n# 标记\n\n1. 封面\n2. 索引\n\n## 前言\n\n\
  C++ 是一种通用的多范式编程语言，支持过程化、面向对象以及某种程度上函数式的编程范式。它最初是带类的 C，但随着时间的推移，它演变成了一种在不牺牲性能的情况下编写高表现力代码的现代语言。尽管如此，C\
  \ 仍然是嵌入式开发中的主导语言，这主要由于其简单性和学习曲线平缓。\n\n然而，C 的简单性往往使得编写复杂系统变得过于冗长，增加了开发者的认知负担并使代码更容易出错。这正是\
  \ C++ 大显身手之处。通过泛型编程、运行时和编译时多态、编译时计算以及增强的类型和内存安全等特性，它是嵌入式系统开发的极佳选择。\n\n\n\n\n\n关于\
  \ C++ 的误解（例如代码膨胀和运行时开销）仍然广泛存在。本书从破除这些误解开始，引导你学习 C++ 基础。随后，重点将转向更高级的现代 C++ 概念，并将它们应用于解决嵌入式开发中的现实问题。\n\
  \n本书的目标是向你展示如何通过精心挑选示例和应用良好的软件开发实践，在嵌入式系统中有效使用现代 C++。\n\n## 本书适合读者\n\n本书适用于日常工作中主要使用\
  \ C 语言并希望发现现代 C++ 的嵌入式开发者。预计读者对 C++ 有一定了解，但并非必须熟悉，因为书中也涵盖了 C++ 基础。\n\n## 本书内容\n\n\
  - 第 1 章，*破除关于 C++ 的常见误解*，探讨了关于 C++ 的广泛误解并系统地破除了这些观点。你还将深入了解 C++ 的历史和零开销原则。\n- 第\
  \ 2 章，*资源受限嵌入式系统中的挑战*，研究了资源受限嵌入式系统中面临的设计挑战，重点关注分析技术和内存管理。它还展示了如何避免潜在的问题语言特性，如异常和\
  \ RTTI。\n- 第 3 章，*嵌入式 C++ 生态系统*，回顾了嵌入式领域用于 C++ 开发的工具，包括工具链、静态分析器、性能分析工具和测试框架。\n\
  - 第 4 章，*为 C++ 嵌入式项目配置开发环境*，引导你为 C++ 嵌入式项目搭建现代开发环境，包括使用模拟器在虚拟环境中测试你的代码。\n- 第 5 章，*类——C++\
  \ 程序的构建块*，引导你理解 C++ 中的类，包括存储生存期、初始化、继承以及动态多态。\n- 第 6 章，*类之外——基础 C++ 概念*，涵盖了命名空间和函数重载等基础\
  \ C++ 特性。它还讨论了与 C 的互操作，并引入了标准库容器和算法。\n- 第 7 章，*强化固件——实用的 C++ 错误处理方法*，讲解了 C++ 中的各种错误处理技术，包括错误码、断言和全局处理器。它还解释了异常的机制及其工作原理。\n\
  - 第 8 章，*使用模板构建通用且可重用的代码*，介绍了模板和概念（Concepts）。它还提供了模板元编程和编译时多态的介绍。\n- 第 9 章，*通过强类型提高类型安全*，讨论了\
  \ C++ 中的隐式和显式类型转换，并引入了强类型概念。来自嵌入式库的实际示例演示了如何提高类型安全。\n- 第 10 章，*使用 Lambda 编写表达性代码*，引入了\
  \ Lambda 并向你展示如何在命令设计模式中使用它们来实现一个表达性良好的中断管理器。\n- 第 11 章，*编译时计算*，探索了 C++ 的编译时计算能力，并演示了如何使用它们构建一个信号生成器库，该库在编译时生成查找表。\n\
  - 第 12 章，*编写 C++ HAL*，演示了如何在 C++ 中实现硬件抽象层（HAL），使用模板元编程确保类型安全。\n- 第 13 章，*配合 C 库*，展示了如何在\
  \ C++ 项目中有效使用 C 库。通过使用文件系统 C 库的示例演示了 RAII 原则。\n- 第 14 章，*使用序列器增强超循环*，展示了如何使用序列器（Sequencer）改进简单的基于超循环（Super-loop）的设计。它还引入了嵌入式模板库\
  \ (`ETL`) 及其编译时知的固定大小容器类模板。\n- 第 15 章，*实用模式——构建温度发布者*，引导你学习观察者设计模式，并演示了如何将其应用于恒温器和\
  \ HVAC 控制器等系统。\n- 第 16 章，*设计可扩展的有限状态机*，探索了实现有限状态机的不同方法。从基础的枚举-switch 方法开始，引入了状态模式，然后介绍了\
  \ Boost.SML 库。\n- 第 17 章，*库与框架*，强调了 C++ 标准模板库（STL）中适用于受限系统固件开发的部分。它还介绍了 CIB 和 Pigweed\
  \ 库。\n- 第 18 章，*跨平台开发*，讨论了良好的软件设计对于实现嵌入式软件的可移植性和可测试性的重要性。\n\n## 充分利用本书内容\n\n书中的许多示例可以在\
