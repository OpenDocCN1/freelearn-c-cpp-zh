  \n本书从探索关于 C++ 的常见误区并揭穿它们开始。您将深入 C++ 的历史，并对零开销原则（zero-overhead principle）产生理解。此外，您将研究嵌入式系统的设计挑战，并学习如何使用\
  \ C++ 解决这些挑战。这部分还涵盖了嵌入式 C++ 生态系统，并引导您搭建 C++ 项目开发环境，包括配置工具链、构建系统和仿真器。\n\n本部分包含以下章节：\n\
  \n* *第 1 章, *揭秘关于 C++ 的常见误区*\n* *第 2 章, *资源受限嵌入式系统中的挑战*\n* *第 3 章, *嵌入式 C++ 生态系统*\n\
  * *第 4 章, *搭建 C++ 嵌入式项目开发环境*\n\n# 1\n\n### 揭秘关于 C++ 的常见误区\n\n为微控制器和嵌入式系统编写软件是具有挑战性的。为了充分利用资源受限系统的性能，嵌入式开发人员需要良好的平台架构知识。他们需要意识到可用资源，包括处理器能力、可用内存和外设。由于可以通过内存映射外设直接访问硬件，`C`\
  \ 语言在半世纪以来一直是嵌入式系统的首选语言。\n\n任何编程语言的目标都是执行将特定应用的抽象转换为可以转换为机器码的代码的过程。例如，`面向业务的语言`（`COBOL`）用于银行应用程序，而\
  \ `Fortran` 用于科学研究和复杂的数学计算。相比之下，C 是一种通用编程语言，常用于`操作系统`（`OSs`）和嵌入式系统应用。\n\nC 是一种语法简单易于学习的语言。语法简单意味着它无法表达复杂的思想。C\
  \ 允许复杂操作，但与抽象了这些细节的高级语言相比，它需要更显式、详细的代码来管理复杂性。\n\n在 20 世纪 70 年代后期，高级语言无法满足 C 的性能要求。这促使丹麦计算机科学家\
  \ Bjarne Stroustrup 开始研究 `C with Classes`，它是 C++ 的前身。如今，C++ 是一种为了性能设计的多范式语言。C++\
  \ 的起源仍然是一些误区的来源，这经常导致人们在嵌入式系统编程中采用它时产生犹豫。本章将向您介绍这些误区并揭穿它们。本章将涵盖以下主题：\n\n* C++ 简史\n\
  * 带类的 C\n* 臃肿与运行时开销\n\n## 技术要求\n\n为了充分利用本章内容，我强烈建议在阅读示例时使用 Compiler Explorer ([`godbolt.org/`](https://godbolt.org/))。选择\
  \ `GCC` 作为您的编译器，目标架构选择 `x86`。这将允许您看到标准输出 (`stdio`)结果。本章的示例可以在 GitHub 上获取（[`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter01`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter01)）。\n\
  \n## C++ 简史\n\n在 60 年代中期，模拟编程语言 `SIMULA` 为软件开发引入了类和对象。`类` 抽象允许我们以简洁的方式在编程中表示现实世界的概念，使代码更具可读性。在嵌入式开发中，`UART`、`SPI`、`TemperatureSensor`、`PidController`\
  \ 和 `TemperatureController` 是可以实现为类的概念。SIMULA 还引入了类之间的层次关系。例如，`PT100` 类也是 `TemperatureSensor`\
  \ 类，而 `TemperatureController` 类拥有 `TemperatureSensor` 的成员实例（对象）和一个 `PidController`。这被称为**面向对象编程**（`OOP`）。\n\
  \n在反思编程语言演进时，C++ 的创始人 Bjarne Stroustrup 分享了他设计 C++ 的方法。Stroustrup 旨在弥合高级抽象与底层效率之间的差距。他这样说：\n\
  \n> 我的想法非常简单。从 SIMULA 中获取为了人类表示事物的通用抽象思想，结合底层技术（当时处理这类需求的最佳语言是贝尔实验室的 Dennis Ritchie\
  \ 开发的 C 语言），并将这两个想法结合起来，这样既可以进行高级抽象，又能保持足够的高效并接近硬件，以应对真正的计算任务。\n\n\n\n\n虽然 C 语言仍然是嵌入式开发的首选，占据了高达\
  \ 60% 的嵌入式项目，但 C++ 的采用率一直在稳定增长。估计 C++ 在嵌入式开发领域的使用率约为 20-30%，它提供了类、改进的类型安全以及编译时计算等特性。\n\
  \n尽管 C++ 提供了这些特性，C 在嵌入式编程中仍然占据主导地位。这有许多原因，本章将介绍其中一些。C++ 比 C 语言更复杂，对于初级开发者来说更难上手。C\
  \ 更容易学习，能够让初级开发者更快地参与到项目中。\n\nC 的简单性是一个优点，因为它允许初级开发者更快地为项目做出贡献，但也使得编写复杂逻辑变得过于冗长。这通常由于缺乏表达力而导致代码库体积巨大。这正是\
  \ C++ 通过更高抽象大显身手，如果接受这种抽象，代码将变得更易读和理解。\n\nC++ 没有被更广泛采用的其他原因与关于 C++ 的误解有关。人们仍然认为\
  \ C++ 仅仅是“带类的 C”，由于标准库中的动态内存分配，在安全关键系统中使用 C++ 是绝对不可接受的，或者它会产生臃肿代码并增加空间和时间开销。本章将结合嵌入式开发的背景解决一些关于\
  \ C++ 最常见的误解。让我们打破这些误解，为嵌入式系统中的 C++ 开启新的视角！\n\n## 带类的 C\n\n从历史上说，C++ 起始于“带类的 C”。首个\
  \ C++ 编译器 `Cfront` 将 C++ 转换为 C，但那是很久以前的事了。随着时间的推移，C 和 C++ 分别演变，现在由不同的语言标准定义。C 保持了它的简单性，而\
  \ C++ 已经变成一种现代语言，能够在不牺牲性能水平的情况下为问题提供抽象解决方案。但 C++ 有时仍被称为“带类的 C”，这意味着 C++ 除了类之外没有增加任何额外价值。\n\
  \nC++11 标准于 2011 年发布，是 C++ 的第二个主要版本。它包含了许多使语言现代化的特性，例如范围循环、lambda 表达式和 `constexpr`。随后的\
  \ C++14、C++17、C++20 和 C++23 发布持续保持了语言的现代化，并引入了特性，使得“带类的 C”仅仅成为现代 C++ 的遥远先驱。\n\n\
  ## 现代 C++\n\n为了证明 C++ 不仅仅是带类的 C，让我们探索几个短的 C 代码示例及其对应的现代 C++ 等等代码。让我们从一个打印整数缓冲区元素的简单示例开始：\n\
  \n```cpp\n#define N 20\nint buffer[N];\nfor(int i = 0; i < N; i ++) {\n    printf(\"\
  %d \", buffer[i]);\n}\n```\n\n上述 C 代码可以翻译为以下 C++ 代码：\n\n```cpp\nstd::array<int,\
  \ 20> buffer;\nfor(const auto& element : buffer) {\n    printf(\"%d \", element);\n\
  }\n```\n\n我们首先注意到 C++ 版本更短。它使用的单词更少，而且比 C 代码更接近英语。它更易读。现在，如果你有 C 背景且没有接触过高级语言，第一个版本看起来可能更容易读，但让我们比较一下。我们首先注意到\
  \ C 代码定义了常量 `N`，它决定了 `buffer` 的大小。这个常量被用于定义 `buffer` 并作为 `for` 循环的边界。\n\nC++11 引入的范围循环消除了在循环停止条件中使用容器大小的认知负担。大小信息已经包含在\
  \ `std::array` 容器中，范围循环利用该容器轻松地遍历数组。此外，缓冲区不需要索引，因为元素是通过常量引用访问的，这确保了元素在循环内部不会被修改。\n\
  \n让我们看一些简单的 C 代码，它的作用是如果 `array_a` 中的整数小于 10，则将所有元素拷贝到 `array_b`：\n\n```c\nint w_idx\
  \ = 0;\nfor(int i = 0; i < sizeof(array_a)/sizeof(int); i++) {\n    if(array_a[i]\
  \ < 10) {\n        array_b[w_idx++] = array_a[i];\n    }\n}\n```\n\n这里是具有相同功能的 C++\
  \ 代码：\n\n```cpp\nauto less_than_10 =  [](auto x) -> bool {\n    return x < 10;\n\
  };\nstd::copy_if(std::begin(array_a), std::end(array_a), std::begin(array_b), less_than_10);\n\
  ```\n\n我们不需要手动遍历 `array_a` 并仅在元素超过 10 时将它们拷贝到 `array_b`，而是可以使用 C++ 标准模板库中的 `copy_if`\
  \ 函数。`std::copy_if` 的前两个参数是迭代器，定义了要考虑的 `array_a` 元素元素范围：第一个迭代器指向数组的开头，第二个迭代器指向最后一个元素之后的位置。第三个参数是指向\
  \ `array_b` 起点的迭代器，第四个参数是 `less_than_10` lambda 表达式。\n\nLambda 表达式是一个匿名函数对象，可以在调用它的位置声明，也可以作为参数传递给函数。请注意，lambda\
  \ 将在*第 10 章*中详细介绍。\n\n### 泛型类型\n\n之前的示例使用了 `std::array`。它是一个类模板，封装了一个 C 风格的数组以及其大小。请注意，模板将在*第\
  \ 8 章*中详细介绍。\n\n`std::array<int, 10>` 创建了一个容器类型，其底层是一个大小为 `10` 的 C 风格的整数数组。`std::array<int,\
  \ 20>` 是一个容器类型，其底层是一个大小为 `20` 的 C 风格整数数组。`std::array<int, 10>` 和 `std::array<int,\
  \ 20>` 是不同的类型。它们具有相同的底层类型，但大小不同。\n\n`std::array<float, 10>` 将产生第三种类型，因为它在底层类型上与\
  \ `std::array<int, 10>` 不同。使用不同的参数产生不同的类型。模板类型是泛型类型，在实例化时变为具体类型。\n\n为了更好地理解并欣赏泛型类型，让我们检查\
  \ C 中环形缓冲区的实现，并与 C++ 中基于模板的解决方案进行比较。\n\n#### C 中的环形缓冲区\n\n**环形**（ring）或**缓冲区**（circular\
  \ buffer）是嵌入式编程中常用的数据结构。它通常实现为围绕带有读写索引的数组的一组函数。`count` 变量用于数组空间管理。\n\n*   **push**\
  \ 函数用于向环形缓冲区存储元素。每次 push 时，数据元素被存储在数组中，并增加写入索引。如果写入索引等于数据数组的元素个数，则将其重置为 0。\n*  \
  \ **pop** 函数用于从环形缓冲区检索元素。每次 pop 时，如果底层数组不空，我们返回由索引索引的数组元素。增加读取索引。\n\n每次 push 时我们增加\
  \ `count` 变量，并在 pop 时减少它。当 `count` 等于数据数组的大小时，我们需要移动读取索引。\n\n让我们定义要在我们的 C 模块中实现的环形缓冲区实现要求：\n\
  \n*   它不应该使用动态内存分配\n*   当缓冲区满时，我们将覆盖旧元素\n\n\n\n\n- 提供 `push` 和 `pop` 函数，用于在缓冲区中存储和检索数据\n\
  - 整数将存储在环形缓冲区中。\n\n以下是针对上述要求的 C 语言简单实现方案：\n\n```c\n#include <stdio.h>\n#define BUFFER_SIZE\
  \ 5\ntypedef struct {\n  int arr[BUFFER_SIZE]; // 用于直接存储 int 值的数组\n  size_t write_idx;\
  \     // 下一个写入元素的索引 (push)\n  size_t read_idx;      // 下一个读取元素的索引 (pop)\n  size_t\
  \ count;         // 缓冲区中的元素数量\n} int_ring_buffer;\nvoid int_ring_buffer_init(int_ring_buffer\
  \ *rb) {\n  rb->write_idx = 0;\n  rb->read_idx = 0;\n  rb->count = 0;\n}\nvoid int_ring_buffer_push(int_ring_buffer\
  \ *rb, int value) {\n  rb->arr[rb->write_idx] = value;\n  rb->write_idx = (rb->write_idx\
  \ + 1) % BUFFER_SIZE;\n  if (rb->count < BUFFER_SIZE) {\n    rb->count++;\n  } else\
  \ {\n    // 缓冲区已，向前移动 read_idx\n    rb->read_idx = (rb->read_idx + 1) % BUFFER_SIZE;\n\
  \  }\n}\nint int_ring_buffer_pop(int_ring_buffer *rb) {\n  if (rb->count == 0) {\n\
  \    return 0;\n  }\n  int value = rb->arr[rb->read_idx];\n  rb->read_idx = (rb->read_idx\
  \ + 1) % BUFFER_SIZE;\n  rb->count--;\n  return value;\n}\nint main() {\n  int_ring_buffer\
  \ rb;\n  int_ring_buffer_init(&rb);\n  for (int i = 0; i < 10; i++) {\n    int_ring_buffer_push(&rb,\
  \ i);\n  }\n  while (rb.count > 0) {\n    int value = int_ring_buffer_pop(&rb);\n\
  \    printf(\"%d\\n\", value);\n  }\n  return 0;\n}\n```\n\n我们使用 `for` 循环来初始化缓冲区。由于缓冲区大小为\
  \ `5`，从 `5` 到 `9` 的值将存储在缓冲区中，因为环形缓冲区会覆盖现有数据。现在，如果我们想在环形缓冲区中存储浮点数、字符或用户定义的数据结构，该怎么办呢？我们可以为不同的类型实现相同的逻辑，并创建一组新的数据结构和函数，如\
  \ `float_ring_buffer` 或 `char_ring_buffer`。我们能否创建一个可以存储不同数据类型并使用相同函数的解决方案？\n\n我们可以使用\
  \ `unsigned char` 数组作为不同数据类型的存储器，并使用 `void` 指针将不同数据类型传递给 `push` 和 `pop` 函数。唯一缺少的是数据类型的大小，我们可以通过向\
  \ `ring_buffer` 结构体添加一个 `size_t elem_size` 成员来解决这个问题：\n\n```c\n#include <stdio.h>\n\
  #include <string.h>\n#define BUFFER_SIZE 20 // 缓冲区中可用总字节\ntypedef struct {\n  unsigned\
  \ char data[BUFFER_SIZE]; // 用于存储字节值的数组\n  size_t write_idx;                // 下一个写入字节的索引\n\
  \  size_t read_idx;                 // 下一个读取字节的索引\n  size_t count;     // 缓冲区当前使用的字节数\n\
  \  size_t elem_size; // 每个元素的大小（字节）\n} ring_buffer;\nvoid ring_buffer_init(ring_buffer\
  \ *rb, size_t elem_size) {\n  rb->write_idx = 0;\n  rb->read_idx = 0;\n  rb->count\
  \ = 0;\n  rb->elem_size = elem_size;\n}\nvoid ring_buffer_push(ring_buffer *rb,\
  \ void *value) {\n  if (rb->count + rb->elem_size <= BUFFER_SIZE) {\n    rb->count\
  \ += rb->elem_size;\n  } else {\n    rb->read_idx = (rb->read_idx + rb->elem_size)\
  \ % BUFFER_SIZE;\n  }\n  memcpy(&rb->data[rb->write_idx], value, rb->elem_size);\n\
  \  rb->write_idx = (rb->write_idx + rb->elem_size) % BUFFER_SIZE;\n}\nint ring_buffer_pop(ring_buffer\
  \ *rb, void *value) {\n  if (rb->count < rb->elem_size) {\n    // 数据不足以弹出\n    return\
  \ 0;\n  }\n  memcpy(value, &rb->data[rb->read_idx], rb->elem_size);\n  rb->read_idx\
  \ = (rb->read_idx + rb->elem_size) % BUFFER_SIZE;\n  rb->count -= rb->elem_size;\n\
  \  return 1; // 成功\n}\nint main() {\n  ring_buffer rb;\n  ring_buffer_init(&rb,\
  \ sizeof(int)); // 为 int 值初始化缓冲区\n  for (int i = 0; i < 10; i++) {\n    int val\
  \ = i;\n    ring_buffer_push(&rb, &val);\n  }\n  int pop_value;\n  while (ring_buffer_pop(&rb,\
  \ &pop_value)) {\n    printf(\"%d\\n\", pop_value);\n  }\n  return 0;\n}\n```\n\n\
  这个 `ring_buffer` 解决方案可以存储不同的类型。`pop_value` 变量用于从 `ring_buffer_pop` 获取结果。`ring_buffer_pop`\
  \ 函数在成功时返回 1，如果数据不足则返回 0。`ring_buffer_push` 函数使用 `memcpy` 处理数据拷贝。`ring_buffer_init`\
  \ 函数设置缓冲区。`main` 函数演示了使用方法。\n\n\n\n\n\n让我们使用模板来实现一个通用的环形缓冲区（ring buffer）。我们可以使用\
  \ `std::array` 类模板作为底层类型，并在其周围封装我们的推入（push）和弹出（pop）逻辑。以下代码展示了 C++ 中 `ring_buffer`\
  \ 类型可能的外观：\n\n```\n#include <array>\n#include <cstdio>\ntemplate <class T, std::size_t\
  \ N> struct ring_buffer {\n  std::array<T, N> arr;\n  std::size_t write_idx = 0;\
  \ // 下一个写入（推入）元素的索引\n  std::size_t read_idx = 0;  // 下一个读取（弹出）元素的索引\n  std::size_t\
  \ count = 0;     // 缓冲区中的元素数量\n  void push(T t) {\n    arr.at(write_idx) = t;\n\
  \    write_idx = (write_idx + 1) % N;\n    if (count < N) {\n      count++;\n  \
  \  } else {\n      // 缓冲区满了，移动 read_idx\n      read_idx = (read_idx + 1) % N;\n\
  \    }\n  }\n  T pop() {\n    if (count == 0) {\n      // 缓冲区为空，返回默认构造的 T。\n   \
  \   return T{};\n    }\n    T value = arr.at(read_idx);\n    read_idx = (read_idx\
  \ + 1) % N;\n    --count;\n    return value;\n  }\n  bool is_empty() const { return\
  \ count == 0; }\n};\nint main() {\n  ring_buffer<int, 5> rb;\n  for (int i = 0;\
  \ i < 10; ++i) {\n    rb.push(i);\n  }\n  while (!rb.is_empty()) {\n    printf(\"\
  %d\\n\", rb.pop());\n  }\n  return 0;\n}\n```\n\n使用模板的 C++ 环形缓冲区实现比基于标记粘贴（token-pasting）的\
  \ C 解决方案更具可读性且更容易使用。`ring_buffer` 模板类可以实例化具有整数、浮点或其他任何不同大小的底层类型的环形缓冲区。相同的推入和弹出逻辑可以应用于不同底层类型的环形缓冲区。得益于模板，我们可以对不同类型应用`不要重复自己`（`DRY`）原则。`模板`使得泛型类型的实现变得简单，而这在\
  \ C 中是非常具有挑战性且冗长的。\n\n模板还用于`模板元编程`（`TMP`），这是一种编程技术，编译器使用模板生成临时源代码，这些代码由编译器与源码的其余部分合并，然后进行编译。TMP\
  \ 最著名的例子之一是`在编译时计算阶阶乘`。TMP 是一种高级技术，将在 *第 8 章 中介绍。现代 C++ 还具有 `constexpr` 修饰符，这是一种对初学者更友好的编译时计算技术。\n\
  \n### constexpr\n\nC++11 引入了 `constexpr` 修饰符，它声明可以在编译时求出函数或变量的值。该修饰符随着时间的演进，扩展了功能。`constexpr`\
  \ 变量必须立即初始化，且其类型必须是字面量类型（literal type，如 int、float 等）。我们是这样声明 `constexpr` 变量的：\n\n\
  ```\nconstexpr double pi = 3.14159265359;\n```\n\n使用 `constexpr` 修饰符是 C++ 中声明编译时常量的优方法，优于使用\
  \ C 风格的宏。让我们分析一个使用 C 风格宏的简单示例：\n\n```\n#include <cstdio>\n#define VOLTAGE 3300\n\
  #define CURRENT 1000\nint main () {\n    const float resistance = VOLTAGE / CURRENT;\n\
  \    printf(\"resistance = %.2f\\r\\n\", resistance);\n    return 0;\n}\n```\n\n\
  ```\n这个简单程序的输出可能会令人惊讶：\nresistance = 3.00\n```\n\n`VOLTAGE` 和 `CURRENT` 都被解析为整数字面量，除法结果也是如此。浮点字面量使用\
  \ `f` 后缀声明，但在本例中它被省略了。使用 `constexpr` 定义编译时常量更安全，因为它允许我们指定常量的类型。我们是这样使用 `constexpr`\
  \ 编写相同的示例的：\n\n```\n#include <cstdio>\nconstexpr float voltage = 3300;\nconstexpr\
  \ float current = 1000;\nint main () {\n    const float resistance = voltage / current;\n\
  \    printf(\"resistance = %.2f\\r\\n\", resistance);\n    return 0;\n}\n```\n\n\
  ```\n这将导致\nresistance = 3.30\n```\n\n这个简单的示例说明，`constexpr` 编译时常量比传统的 C 风格宏常量更安全且更易读。`constexpr`\
  \ 修饰符的另一个主要用途是提示编译器某个函数可以在编译时求值。`constexpr` 函数必须满足的一些要求如下：\n\n*   返回类型必须是字面量类型\n\
  *   每个函数参数必须是字面量类型\n*   如果 `constexpr` 函数不是构造函数，则它需要恰好有一个 `return` 语句\n\n让我们来看一个利用\
  \ `constexpr` 函数的简单示例：\n\n```\nint square(int a) {\n    return a*a;\n}\nint main\
  \ () {\n    int ret = square(2);\n    return ret;\n}\n```\n\n为了更好地了解底层发生了什么，我们将检查上述代码的汇编代码。以下是输出：\n\
  \n```\nsquare(int):\n        push    {r7}\n        sub     sp, sp, #4\n        str\
  \     r0, [sp]\n        movs    r1, #2\n        mul     r3, r0, r1\n        ldr\
  \     r0, [sp], #4\n        mov     r0, r3\n        add     sp, sp, #4\n       \
  \ pop     {r7}\nmain:\n        push    {r7}\n        sub     sp, sp, #4\n      \
  \  str     r0, [sp]\n        movs    r0, #2\n        bl      square\n        ldr\
  \     r0, [sp]\n        add     sp, sp, #4\n        pop     {r7}\n```\n\n汇编代码正在执行以下操作：\n\
  \n*   操作栈指针\n*   调用 `square` 函数\n*   将 `r7` 的值存入偏移量为 4 的位置\n*   从偏移量为 4 的位置加载值到\
  \ `r3`\n*   将 `r3` 移动到 `r0`，这是 ARM 存储值的调用约定\n\n我们可以看到输出中存在不必要的操作，这会增加二进制文件的大小并影响性能。这个示例在\
  \ C 和 C++ 中都是有效的代码，用两种编译器编译它都会得到相同的汇编。\n\n如果我们对 `square` 函数使用 `constexpr` 修饰符，我们是在指示编译器可以在编译时对其进行求值：\n\
  \n```\nconstexpr int square(int a) {\n    return a*a;\n}\nint main() {\n    constexpr\
  \ int val = square(2);\n    return val;\n}\n```\n\n这段代码会导致 `square(2)` 表达式在编译时求值，使得整数\
  \ `val` 成为一个 `constexpr` 变量，即编译时常量。以下是生成的汇编：\n\n```\nmain:\n        push    {r7}\n\
  \        sub     sp, sp, #4\n        str     r0, [sp]\n        movs    r0, #4\n\
  \        str     r0, [sp], #4\n        add     sp, sp, #4\n        pop     {r7,\
  \ pc}\n        bx      pc\n```\n\n我们可以看到，程序返回值 `4`，这是 `square(2)` 编译时计算的结果。生成的汇编中没有\
  \ `square` 函数，只有编译器为我们执行的计算结果。\n\n\n\n\n自 `C with Classes` 以来，C++ 已经取得了巨大的进步。本章示例展示了\
  \ C++ 相比 C 提供的优势——更有表现力、可读性更高且紧凑的代码；标准模板库容器；算法；用户定义的泛型；以及编译时计算，这只是开始。我希望我成功打破了“C++\
  \ 只是带类的 C”这一迷思。关于 C++ 的另一个常见迷思是它会导致臃肿的代码并增加运行时开销。让我们继续打破关于 C++ 的迷思吧！\n\n## 膨胀与运行时开销\n\
  \n`bloatware` 一词描述的是设备上操作系统预装的不需要的软件。在编程领域，不需要的软件指的是由框架、库或语言构造本身插入二进制文件的代码。在 C++\
  \ 中，被指责导致代码膨胀的语言构造是构造函数、析构函数和模板。我们将通过检查 C++ 代码生成的汇编输出来分析这些误解。\n\n## 构造函数和析构函数\n\n\
  当你提到 C++ 时，非 C++ 开发者首先想到的是它是一门面向对象的语言，而且你必须实例化对象。对象是类的实例。它们是占用内存的变量。称为 `constructors`\
  \ 的特殊函数用于构建或实例化对象。\n\n构造函数用于初始化对象（包括类成员的初始化），而析构函数用于清理资源。它们与对象的生命周期紧密相关。对象通过构造函数创建，当对象变量离开作用范围时，就会调用\
  \ `destructor`。\n\n构造函数和析构函数都会增加二进制文件的大小并增加运行时开销，因为它们的执行需要时间。我们将通过一个包含一个私有成员、一个构造函数、一个析构函数和一个\
  \ getter 的简单类示例，检查构造函数和析构函数的影响：\n\n```\nclass MyClass\n{\n    private:\n       \
  \  int num;\n    public:\n        MyClass(int t_num):num(t_num){}\n        ~MyClass(){}\n\
  \        int getNum() const {\n            return num;\n        }\n};\nint main\
  \ () {\n   MyClass obj(1);\n   return obj.getNum();\n}\n```\n\n`MyClass` 是一个非常简单的类，有一个通过构造函数设置的私有成员。我们可以通过\
  \ getter 它，为了保险起见，我们声明了一个空的析构函数。以下是在未启用优化的情况下编译的前述代码的汇编等效代码：\n\n```\nMyClass::MyClass(int)\
  \ [base object constructor]:\n        push    {r7}\n        sub     sp, sp, #12\n\
  \        add     r7, sp, #0\n        str     r0, [r7, #4]\n        str     r1, [r7]\n\
  \        ldr     r3, [r7, #4]\n        ldr     r2, [r7]\n        str     r2, [r3]\n\
  \        ldr     r3, [r7, #4]\n        mov     r0, r3\n        adds    r7, r7, #12\n\
  \        mov     sp, r7\n        ldr     r7, [sp], #4\n        bx      lr\nMyClass::~MyClass()\
  \ [base object destructor]:\n        push    {r7}\n        sub     sp, sp, #12\n\
  \        add     r7, sp, #0\n        str     r0, [r7, #4]\n        ldr     r3, [r7,\
  \ #4]\n        mov     r0, r3\n        adds    r7, r7, #12\n        mov     sp,\
  \ r7\n        ldr     r7, [sp], #4\n        bx      lr\nMyClass::getNum() const:\n\
  \        push    {r7}\n        sub     sp, sp, #12\n        add     r7, sp, #0\n\
  \        str     r0, [r7, #4]\n        ldr     r3, [r7, #4]\n        ldr     r3,\
  \ [r3]\n        mov     r0, r3\n        adds    r7, r7, #12\n        mov     sp,\
  \ r7\n        ldr     r7, [sp], #4\n        bx      lr\nmain:\n        push    {r4,\
  \ lr}\n        sub     sp, sp, #12\n        add     r7, sp, #0\n        adds   \
  \  r3, #7\n        movs     r1, #\n\n        \nr0\n\n        \nMyMy,\n\n\n\n\n\n\
  \n\n\n```\n\n*(注：提示中提供的汇编文本包含一些格式伪迹/重复；我在应用要求的规则的同时保留了结构)*\n\n如果你不理解汇编，就不要担心它。我们可以看到有一些函数标签和大量的指令。对于一个类的简单抽象来说；这些是我们不希望在二进制文件中看到的膨胀。更准确地说，我们有\
  \ 59 行汇编。如果我们启用优化，生成的汇编将只有几行，但让我们在不优化的情况下继续分析。我们注意到的第一点是析构函数什么都没做。如果从从 C++ 代码中删除它，生成的汇编长度为\
  \ 44 行：\n\n```\nMyClass::MyClass(int) [base object constructor]:\n        push \
  \   {r7}\n        sub     sp, sp, #12\n        add     r7, sp, #0\n        str \
  \    r0, [r7, #4]\n        str     r1, [r7]\n        ldr     r3, [r7, #4]\n    \
  \    ldr     r2, [r7]\n        str     r2, [r3]\n        ldr     r3, [r7, #4]\n\
  \        mov     r0, r3\n        adds    r7, r7, #12\n        mov     sp, r7\n \
  \       ldr     r7, [sp], #4\n        bx      lr\nMyClass::getNum() const:\n   \
  \     push    {r7}\n        sub     sp, sp, #12\n        add     r7, sp, #0\n  \
  \      str     r0, [r7, #4]\n        ldr     r3, [r7, #4]\n        ldr     r3, [r3]\n\
  \        mov     r0, r3\n        adds    r7, r7, #12\n        mov     sp, r7\n \
  \       ldr     r7, [sp], #4\n        bx      lr\n```\n\n我们可以看到，没有对析构函数的调用，二进制文件中也没有析构函数代码。教训是`你不为不使用的东西付费`。这是\
  \ C++ 的设计原则之一。通过删除析构函数，编译器就不为其生成任何代码并在对象变量离开范围时调用它。\n\n我们必须意识到的下一个点是 C++ 并不是 OOP\
  \ 语言。它是一门多范式语言。它同时是过程化的、面向对象的、泛型的，甚至是函数的。如果我们希望拥有只能通过构造函数设置的私有成员，那么我们就为此付出代价。C++\
  \ 中的结构体默认具有公有成员，所以让我们把 `MyClass` 类更改为没有构造函数的 `MyClass` 结构体：\n\n```\nstruct MyClass\n\
  {\n    int num;\n};\nint main () {\n   MyClass obj(1);\n\n   return obj.num;\n}\n\
  ```\n\nSetter 和 getter 函数在 OOP 范式中很常见，但 C++ 不是（仅仅是）OOP 语言，我们并不限于使用 setter 和 getter。当我们移除\
  \ `getNum` getter 时，我们得到了只有一个成员的结构体基础示例。生成的汇编只有 14 行：\n\n```\nmain:\n        push\
  \    {r7}\n        sub     sp, sp, #12\n        add     r7, sp, #0\n        movs\
  \    r3, #1\n        str     r3, [r7, #4]\n        ldr     r3, [r7, #4]\n      \
  \  mov     r0, r3\n        adds    r7, r7, #12\n        mov     sp, r7\n       \
  \ ldr     r7, [sp], #4\n        bx      lr\n```\n\n\n\n\n在本例及之前的示例中，我们在禁用优化的情况下编译了\
  \ C++ 代码，并能够看到生成的汇编代码结果中存在可以被删除的不必要操作。让我们检查启用 `O3` 优化级别的上一个示例的汇编代码：\n\n```\nmain:\n\
  \        movs    r0, #1\n        bx      lr\n```\n\n之前的汇编代码是包含类、构造函数、析构函数和 getter\
  \ 函数的原始示例的输出。生成的程序只有两条指令。变量 `obj` 的成员 `num` 的值被存储在 `r0` 寄存器中并作为返回值。汇编代码去除了所有与栈操作相关的必要指令，以及使用\
  \ `r3` 将值存储在偏移量为 `4` 的栈指针中、重新加载到 `r3` 并移动到 `r0` 的操作。生成的汇编代码只有几行。\n\n移除不必要的指令是优化过程的工作。然而，在嵌入式项目中，通常会避免优化，因为有些人声称优化会破坏代码。但事实如此吗？\n\
  \n## 优化\n\n未优化的代码会导致不必要的指令，影响二进制文件的大小和性能。然而，许多嵌入式项目仍然在禁用优化的情况下构建，因为开发者`不信任编译器`，并担心它会`破坏程序`。这确实有一定的道理，但事实证明，这种情况发生在程序编写得不规范时。如果程序包含未定义行为，程序是不规范的。\n\
  \n未定义行为最为人知的示例之一是**符号整数溢出**。标准并没有定义当你在平台上的符号整数最大值加上 `1` 时会发生什么。编译后的程序不需要被执行任何有意义的操作。程序是不规范的。让我们来看以下代码：\n\
  \n```\n#include <cstdio>\n#include <limits>\nint foo(int x) {\n    int y = x + 1;\n\
  \    return y > x;\n}\nint main() {\n    if(foo(std::numeric_limits<int>::max()))\
  \ {\n        printf(\"X is larger than X + 1\\r\\n\");\n    }\n    else {\n    \
  \    printf(\"X is NOT larger than X + 1\\. Oh nooo !\\r\\n\");\n    }\n    return\
  \ 0;\n}\n```\n\n使用 GCC 为 x86 和 Arm Cortex-M4 编译该代码将得到相同的结果。如果程序在没有优化的情况下编译，`foo`\
  \ 函数返回 `0`，你可以在输出中看到 `X is NOT larger than X + 1\\. Oh nooo !`。编译器执行了整数溢出，如果我们将最大整数值传递给\
  \ `foo`，它将返回 `0`。请记住，标准并没有规定这一点，这种行为取决于编译器。\n\n如果我们在开启优化的情况下编译程序，输出是 `X is larger\
  \ than X + 1`，这意味着 `foo` 返回了 `1`。让我们查看经过优化编译的程序的汇编输出：\n\n```\nfoo(int):\n      \
  \  movs    r0, #1\n        bx      lr\n.LC0:\n        .ascii  \"X is larger then\
  \ X + 1\\015\\000\"\nmain:\n        push    {r3, lr}\n        movw    r0, #:lower16:.LC0\n\
  \        movt    r0, #:upper16:.LC0\n        bl      puts\n        movs    r0, #0\n\
  \        pop     {r3, pc}\n```\n\n我们可以看到，`foo` 没有执行任何计算。编译器假设程序是规范的，并且没有未定义行为。`foo`\
  \ 将始终返回 `1`。确保程序中没有未定义行为是开发者的责任。这正是为什么“优化会破坏程序”的说法仍然存在的原因。归咎于编译器没有处理未定义行为要容易。\n\n\
  当然，编译器中可能存在 bug，在启用优化时会破坏程序功能，而在禁用时程序运行正常。这种情况非常罕见，但并非未出现过，这就是为什么有单元测试和集成测试等验证技术来确保代码的功能，无论是在启用还是禁用优化的情况下构建的。\n\
  \n优化是通过移除机器码中不必要的指令来减小二进制体积并提高性能。未定义行为取决于编译器，必须由开发者处理以确保程序的规范性。应该建立单元测试和集成测试等技术来验证程序的功能，从而降低编译器破坏程序的风险。对于在\
  \ C++ 代码中使用抽象的同时保持最小的二进制占用和最大的性能，优化过程至关重要。在书的剩余部分中，我们将使用最高优化级别 `O3`。\n\n我们将检查的下一个代码膨胀嫌疑对象是模板。它们是如何导致代码膨胀的？它们为我们的嵌入式代码库带来了什么价值？\n\
  \n## 模板\n\n使用不同参数实例化**模板**会导致编译器生成不同的类型，这实际上增加了二进制文件的大小。这是预料之中的。我们在 C 中使用标记粘贴运算符和宏实现的环形缓冲区泛型实现也有完全相同的情况。另一种方法是类型擦除，我们在使用\
  \ `void` 指针的 C 实现中使用了它。如果我们施加静态数据分配的限制以及由于指针间接导致的性能限制，它在灵活性上会有缺陷。\n\n使用泛型是一种设计选择。我们可以使用它们并付出二进制文件大小增加的代价，但如果我们为不同的数据类型分别实现环形缓冲区（`ring_buffer_int`），也会发生这种情况。维护一个模板化类型比修复相同的\
  \ bug 要容易得多。使用泛型不会导致二进制文件大小比同等独立类型大。让我们查看模板对 `ringbuffer` 二进制文件大小的影响：\n\n```\nint\
  \ main() {\n#ifdef USE_TEMPLATES\n  ring_buffer<int, 10> buffer1;\n  ring_buffer<float,\
  \ 10> buffer2;\n#else\n  ring_buffer_int buffer1;\n  ring_buffer_float buffer2;\n\
  #endif\n  for (int i = 0; i < 20; i++) {\n    buffer1.push(i);\n    buffer2.push(i\
  \ + 0.2f);\n  }\n  for (int i = 0; i < 10; i++) {\n    printf(\"%d, %.2f\\r\\n\"\
  , buffer1.pop(), buffer2.pop());\n  }\n  return 0;\n}\n```\n\n如果使用 `USE_TEMPLATES`\
  \ 构建，程序将使用泛型 `ring_buffer 类型`，否则将使用 `ring_buffer_int` 和 `ring_buffer_float` 类型。如果我们在禁用优化的情况下使用\
  \ GCC 构建此示例，模板版本的二进制文件将略大（24 字节）。这是由于模板版本符号表中较大的符号。如果我们从目标文件中剥离符号表，它们的大小将相同。此外，使用\
  \ `O3` 构建两个版本的结果是相同的。\n\n泛型增加二进制文件大小并不比我们手动编写独立类型要大。模板由于在不同编译单元中实例化具体类型会对构建时间产生影响，如果需要，有技术可以避免这一点。所有参数相同的实例化类型函数在二进制文件中只会产生一个函数，因为链接器会移除重复符号。\n\
  \n## RTTI 和异常\n\nC++ 中的**运行时类型信息** (**RTTI**) 是一种允许在运行时确定对象类型的机制。大多数编译器使用虚表实现 RTTI。每个多态类（至少包含一个虚函数的类）都有一个虚表，其中包含运行时类型识别所需的类型。RTTI\
  \ 带来时间和空间成本。如果使用了类型识别，它会增加二进制文件的大小并影响运行时性能。这就是编译器提供禁用 RTTI 方法的原因。让我们来看一个带有基类和派生类的简单示例：\n\
  \n\n\n\n\n```cpp\n#include <cstdio>\nstruct Base {\n    virtual void print () {\n\
  \        printf(\"Base\\r\\n\");\n    }\n};\nstruct Derived : public Base {\n  \
  \  void print () override {\n        printf(\"Derived\\r\\n\");\n    }\n};\nvoid\
  \ printer (Base &base) {\n    base.print();\n}\nint main() {\n    Base base;\n \
  \   Derived derived;\n    printer(base);\n    printer(derived);\n  return 0;\n}\n\
  ```\n\n程序的输出如下：\n\n```\nBase\nDerived\n```\n\n带有虚函数的类具有虚表（vtables），用于进行动态分发。动态分发是选择使用多态函数的哪个实现的过程。`printer`\
  \ 函数接受 `Base` 类的引用。根据传递给 `printer` 的引用类型（`Base` 或 `Derived`），动态分发过程将从 `Base` 或 `Derived`\
  \ 类中选择 `print` 方法。虚表也用于存储类型信息。\n\n通过使用 `dynamic_cast`（ RTTI 机制的一部分），我们可以使用指向父类的引用或指针查找有关类型的信息。让我们修改上一个示例中的\
  \ `printer` 方法：\n\n```cpp\nvoid printer (Base &base) {\n    base.print();\n    if(Derived\
  \ *derived = dynamic_cast<Derived*>(&base); derived!=nullptr) {\n        printf(\"\
  We found Base using RTTI!\\r\\n\");\n    }\n}\n```\n\n输出如下：\n\n```\nBase\nDerived\n\
  We found Base using RTTI!\n```\n\n正如我们已经提到的，RTTI 可以被禁用。在 GCC 中，我们可以通过向向传递传递 `-fno-rtti`\
  \ 标志来做到这一点。如果我们尝试使用此标志编译修改后的示例，编译器将抛出 `error: dynamic_cast' not permitted with '-fno-rtti'`。如果我们将\
  \ `printer` 方法恢复为原始实现，删除 `if` 语句，并在分别启用和禁用 RTTI 的情况下进行构建，我们可以注意到当启用 RTTI 时，二进制文件的尺寸更大。RTTI\
  \ 在某些场景下非常有用，但它为资源受限的设备带来了巨大的开销，因此我们将保持其禁用。\n\n在 C++ 嵌入式项目中经常被禁用的另一个 C++ 特性是异常。`Exceptions`\
  \ 是一种基于 `try-catch` 块的错误处理机制。让我们来看利用异常的简单示例以更好地理解它们：\n\n```cpp\n#include <cstdio>\n\
  struct A {\n  A() { printf(\"A is created!\\r\\n\"); }\n  ~A() { printf(\"A is destroyed!\\\
  r\\n\"); }\n};\nstruct B {\n  B() { printf(\"B is created!\\r\\n\"); }\n  ~B() {\
  \ printf(\"B is destroyed!\\r\\n\"); }\n};\nvoid bar() {\n    B b;\n    throw 0;\n\
  }\nvoid foo() {\n  A a;\n  bar();\n  A a1;\n}\nint main() {\n  try {\n    foo();\n\
  \  } catch (int &p) {\n    printf(\"Catching an exception!\\r\\n\");\n  }\n  return\
  \ 0;\n}\n```\n\n程序的输出如下：\n\n```\nA is created!\nB is created!\nB is destroyed!\n\
  A is destroyed!\nCatching an exception!\n```\n\n在这个简单的示例中，`foo` 在 `try` 块中被调用。它创建了一个本地对象\
  \ `a` 并调用了 `bar`。`bar` 函数创建了一个本地对象 `b` 并抛出一个异常。在输出中，我们看到 `A` 和 `B` 被创建，然后 `B` 被销毁，接着\
  \ `A` 被销毁，最后我们看到 `catch` 块被执行。这被称为 `stack unwinding`（栈展开），为了让这种情况发生，标准实现最常用的是展开表（unwind\
  \ tables），它存储了异常处理器、要调用的析构函数等信息。展开表可能会变得很大且复杂，这增加了应用程序的内存占用，并由于运行时用于异常处理的机制引入了不确定性。这就是为什么异常在嵌入式系统中经常被禁用。\n\
  \n## 总结\n\nC++ 遵循 `零开销原则`（zero-overhead principle）。语言中只有两个不遵循该原则的特性是 RTTI 和异常，这就是为什么编译器支持一个关闭它们的开关。\n\
  \n零开销原则基于我们在本章中建立的两个陈述：\n\n*   你不为未使用的东西付费\n*   你所使用的东西与你可能手写的代码一样高效\n\n在大多数嵌入式项目中，RTTI\
  \ 和异常都是禁用的，因此你不需要为它们付费。使用泛型类型和模板是一种设计选择，它并不比手写单个类型（`ring_buffer_int`、`ring_buffer_float`\
  \ 等）更贵，但它允许为不同类型复用代码逻辑，使代码更具可读性且更容易维护。\n\n高风险系统并不是禁用编译器优化能力的理由。无论我们是在禁用还是启用优化的情况下构建程序，代码功能都需要经过验证。开启优化时最常见的错误来源是未定义行为（undefined\
  \ behavior）。理解并防止未定义行为是开发者的责任。\n\n现代 C++ 是一种能为嵌入式世界提供很多语言。本书的任务是帮助你发现 C++ 以及它能为你的嵌入式项目带来什么，让我们让我们开启这段旅程吧。\n\
  \n\n\n\n\n`安全关键嵌入式系统`是指故障可能导致财产或环境损坏、人员受伤甚至生命损失的系统。这些系统的故障是不可接受的。汽车的刹车、转向系统和气囊就是安全关键系统的良好示例。这些系统的正正常运行对于车辆的安全行驶至关重要。\n\
  \n接下来，我们将分析汽车气囊控制单元的实时性要求。\n\n## 气囊控制单元与实时要求\n\n安全关键嵌入式系统通常具有硬实时要求，这意味着任何错过截止日期的情况都会导致系统失败。`气囊控制单元`（`ACU`）从加速度计和压力传感器收集数据，运行处理所收集数据的算法，并检测侧碰、正面碰撞和追尾。在检测到碰撞后，`ACU`\
  \ 会控制不同约束系统的部署，包括气囊和安全带预紧器。\n\n`ACU` 的实现必须能够抵抗各种场景，例如传感器和电子设备的故障。这些这些问题可以通过冗余传感器、比较传感器数据、与阈值进行数据比较以及自检测试来缓解。最重要的是，`ACU`\
  \ 需要满足时间要求，因为它们只有几毫秒的时间来收集数据、做出决策并启动约束系统的部署。\n\n如果 `ACU` 未及时检测到碰撞，它就会失败；但如果它部署约束系统稍晚一点，也会失败，因为这对驾驶员和乘客造成的伤害比\
  \ `ACU` 完全不启动部署更大。这就是为什么 `ACU` 必须满足硬实时要求，而对于固件来说，这意味着所有最坏情况执行时间必须是预测的。\n\n气囊部署延迟的影响是许多关于人员受伤研究的主题。以下节录是论文*气囊部署时间对车辆正面碰撞期间乘客受伤影响的研究*的结论部分，该论文发表于\
  \ MATEC Web of Conferences 184(1):01007，作者为 Alexandru Ionut Radu、Corneliu Cofaru、Bogdan\
  \ Tolea 和 Dragoș Sorin Dima，文中概述了延迟气囊部署的仿真结果：\n\n> “发现，在发生正面碰撞时增加气囊部署时间的延迟，乘客头部受伤的概率会增加高达\
  \ 46%。减小气囊点燃时乘客头部与仪表盘/方向盘之间的距离，会导致传递到乘客头部的气体膨胀力产生额外的加速度，并将乘客向后推，从而由于头部与头枕之间的冲击增加了受伤潜力。因此，在气囊部署延迟为\
  \ 0 ms 时观察到受伤概率增加了 8%，而 100 ms 的延迟导致头部加速度值增加了 54%。因此，气囊的作用发生了反转，它不再起着缓冲碰撞的作用，而是导致了伤害。”\n\
  \n下图显示了碰撞和延迟气囊部署的图解插图（来源：[`www.researchgate.net/publication/326715516_Study_regarding_the_influence_of_airbag_deployment_time_on_the_occupant_injury_level_during_a_frontal_vehicle_collision`](https://www.researchgate.net/publication/326715516_Study_regarding_the_influence_of_airbag_deployment_time_on_the_occupant_injury_level_during_a_frontal_vehicle_collision)):\n\
  \n![图 2.1 – 约束系统延迟部署的碰撞仿真](img/B22402_2_1.png)\n\n图 2.1 – 约束系统延迟部署的碰撞仿真\n\n`图 2**.1`\
  \ 有效地说明了如果 `ACU` 不满足硬实时要求并产生延迟结果会发生什么。该图取自论文*气囊部署时间对车辆正面碰撞期间乘客受伤影响的研究*。\n\n`ACU`\
  \ 失败并导致未部署或延迟部署的原因有多个：\n\n* 传感器故障\n* 电子设备故障\n* 碰撞检测算法失败\n* 固件未能满足截止日期\n\n传感器和电子设备的故障通过冗余、数据完整性检查、交叉比较以及启动和运行自检来缓解。这给固件及其正确运行带来了了额外压力。碰撞检测算法可能会因为构建在其上的模型存在问题，或其他不属于固件责任范围的因素而失败。固件的工作是及时为算法提供传感器数据，在设定的时间窗口内及时地执行该算法，并根据算法的输出采取行动。\n\
  \n## 测量固件性能与非确定性\n\n我们如何确保固件将在规定的实时要求内运行所有功能？我们通过测量来确保。我们可以测量不同的指标，例如性能分析、对外部事件的响应以及\
  \ A-B 定时测量。性能分析将告诉我们程序在哪些函数上花费了大部分时间。对外部事件的响应将指示系统响应外部事件（如中断或通信总线上的消息）需要多少时间。\n\n\
  ### A-B 定时与实时执行\n\n在处理实时要求时，最重要的指标是`A-B 定时测量`。我们测量固件从点 A 执行程序到点 B 需要的时间。A-B 定时可以测量函数的持续时间，但并不一定。我们可以用它来测量不同的内容。根据系统状态和输入，从\
  \ A 到 B 的耗时可能不同。\n\n进行 A-B 测量的简单方法是切换`通用输出引脚`（`GPIO`）并使用示波器测量 `GPIO` 变化之间的时间。这是一种简单的解决方案，效果良好但扩展性差，因为我们需要每个想要测量的函数对应一个\
  \ `GPIO`，或者一次只能测量一个函数。我们也可以使用微控制器（`MCU`）的内部定时器进行精确测量，并通过 UART 端口输出信息。这将要求我们仅仅为了测量而使用通用定时器。大多数微控制器都有用于插桩和分析的专用单元。\n\
  \n某些基于 ARM 的微控制器具有`数据观察点和追踪`（`DWT`）单元。DWT 用于数据追踪和系统性能分析，包括：\n\n* 程序计数器（`PC`）采样\n\
  * 周期计数\n\nDWT 生成事件并通过`插桩宏单元`（`ITM`）输出它们。ITM 单元还可以用于输出固件本身生成的数据，格式类似于 `printf`。ITM\
  \ 缓冲数据并将其发送到 ITM 端。`单线输出`（`SWO`）可以作为 ITM 端。\n\n我们可以如下利用 DWT 和 ITM 进行性能分析：\n\n1.\
  \ DWT 可以对 `PC` 进行定期采样并使用 ITM 通过 `SWO` 发送。\n2. 在主机上，捕获并分析接收到的数据。\n3. 通过使用固件的链接器映射文件，我们可以生成程序中每个函数的时间分布。\n\
  \n这可以帮助我们查看哪个函数最耗时。它对于 A-B 定时测量并不有用，但允许我们在不进行任何直接软件插桩的情况下，查看程序的大部分时间花在了哪里。\n\n###\
  \ 使用 GCC 进行软件插桩\n\n`GNU 编译器集`（`GCC`）通过使用 `-finstrument-functions` 标志支持对函数的进行软件插桩，这会在每个函数中插入\
  \ `entry` 和 `exit` 调用。这些调用具有以下签名：\n\n\n\n\n\n```\n__attribute__((no_instrument_function))\n\
  void __cyg_profile_func_enter(void *this_fn, void *call_site)\n{\n}\n__attribute__((no_instrument_function))\n\
  void __cyg_profile_func_exit(void *this_fn, void *call_site)\n{\n}\n```\n\n我们可以在\
  \ `__cyg_profile_func_enter` 和 `__cyg_profile_func_exit` 函数中利用 `DWT` 和 `ITM` 来发送时钟周期计数并在主机上对其进行分析，以实现\
  \ A-B 时间测量。以下是 `entry` 和 `exit` 函数的简化实现示例：\n\n```\nextern \"C\" {\n__attribute__((no_instrument_function))\n\
  void __cyg_profile_func_enter(void *this_fn, void *call_site)\n{\n    printf(\"\
  entry, %p, %d\", this_fn, DWT_CYCCNT);\n}\n__attribute__((no_instrument_function))\n\
  void __cyg_profile_func_exit(void *this_fn, void *call_site)\n{\n    printf(\"exit,\
  \ %p, %d\", this_fn, DWT_CYCCNT);\n}\n}\n```\n\n上述实现使用 `extern` `\"C\"` 作为 `entry`\
  \ 和 `exit` 插桩函数的链接语言指定符，因为这些函数会被编译器与 C 库链接。该示例还假设 `printf` 已重定向到使用 `ITM` 作为输出，并且\
  \ `DWT` 中的周期计数器寄存已启动。\n\n另一种选项是使用 `ITM` 的时间戳功能，从 `entry` 和 `exit` 插桩函数同时发送时间戳和函数地址。在链接器映射文件（map\
  \ file）的帮助下，我们可以重建函数调用和返回的序列。存在用于发送跟踪数据的专用格式，例如“通用跟踪格式”（`CTF`），以及称为“跟踪查看器”（trace\
  \ viewers）的桌面工具，它们允许我们简化软件插桩。`CTF` 是一种开放格式，用于将包含一个或多个字段的数据包中的事件序列化。专用工具，如 `barectf`（[`barectf.org/docs/barectf/3.1/index.html`](https://barectf.org/docs/barectf/3.1/index.html)），用于促进\
  \ `CTF` 数据包的生成。\n\n事件使用 `YAML Ain’t Markup Language`（`YAML`）配置文件描述。`barectf` 使用该配置文件生成包含跟踪函数的简单\
  \ C 库。这些函数被用于源代码中想要发射跟踪数据的地方。\n\n`CTF` 跟踪数据可以通过不同的传输层（如 `ITM` 或串口）发送。可以使用 `Babeltrace`（[`babeltrace.org`](https://babeltrace.org)）和\
  \ `TraceCompass`（[`eclipse.dev/tracecompass`](https://eclipse.dev/tracecompass)）等工具进行分析。还有其他有助于跟踪生成、传输和查看的工具，例如\
  \ `SEGGER SystemView`。在目标端，包含一个由 `SEGGER` 提供的小型软件模块以调用跟踪函数。跟踪数据通过 `SWD` 使用 `SEGGER`\
  \ 的“实时传输”（`RTT`）协议发送，并并在 `SystemView` 中进行分析。\n\n我们已经涵盖了一些 A-B 测量的基本方法。还有更高级的技术，它们通常取决于目标能力，因为存在一些更高级的跟踪单元可以用于\
  \ A-B 测量。\n\n## 固件中的确定性与非确定性\n\n如果我们使用 A-B 测量方法测量函数的持续时间，并且对于相同的输入具有相同的持续时间和函数输出，我们称该函数是`确定性`的。如果一个函数依赖于全局状态，且对于相同输入测得的持续时间不同，我们称它是`非确定性`的。\n\
  \n`C++` 中的默认动态内存分配器往往是非确定性的。分配持续时间取决于分配器的当前全局状态以及分配算法的复杂性。我们可以在不同的全局状态下测量相同输入的持续时间，但很难评估所有可能的全局状态，并使用默认分配器保证`最坏执行时间`（`WCET`）。\n\
  \n动态内存分配的非确定性行为只是安全关键系统面临的问题之一。另一个问题是它可能会失败。如果没有可用内存或内存出现碎片化，分配可能会失败。这就是为什么许多安全级编码标准，如“汽车行业软件可靠性协会”（`MISRA`）和“汽车开放系统架构”（`AUTOSAR`）不建议使用动态内存。\n\
  \n接下来，我们将探索动态内存管理的影响以及安全关键性问题。\n\n# 动态内存管理\n\n`C++` 标准定义了对象的以下存储生存期：\n\n* **自动存储生存期**：具有自动存储生存期的对象在程序进入和退出定义的块时自动创建和销毁。这些通常是函数内部的局部变量，声明为\
  \ `static`、`extern` 或 `thread_local` 的除外。\n* **静态存储生存期**：具有静态存储生存期的对象在程序启动时分配，程序结束时释放。所有在命名空间范围内（包括全局命名空间）声明的对象具有这种静态生存期，以及使用\
  \ `static` 或 `extern` 声明的对象。\n* **线程存储生存期**：引入 `C++11`，具有线程存储生存期的对象与其定义的线程同步创建和销毁，允许每个线程拥有变量的独立实例。它们使用\
  \ `thread_local` 指定符声明。\n* **动态存储生存期**：具有动态存储生存期的对象使用动态内存分配函数（`C++` 中的 `new` 和 `delete`）显式创建和销毁，从而赋予软件开发者对这些对象生命期的控制权。\n\
  \n动态存储为软件开发者提供了极大的灵活性，提供了对对象生命期的完全控制。能力越大，责任越大。对象使用 `new` 运算符进行动态分配，并使用 `delete`\
  \ 释放。每个动态分配的对象必须恰好释放一次，且在释放后绝不能再访问。这是一条简单的规则，但未能遵循它会导致一系列问题，如下：\n\n* 当动态分配的内存没有被正确释放时，会发生内存泄漏。随着时间的推移，这些未使用的内存会累积，可能会耗尽系统资源。\n\
  * 当指针仍然引用一个已释放的内存位置时，会发生悬空指针。访问此类指针会导致未定义行为。\n* 当对已经释放的内存再次进行删除时，会发生双重释放错误，导致未定义行为。\n\
  \n动态内存管理的另一个问题是内存碎片。\n\n## 内存碎片\n\n**内存碎片**发生在随着时间推移，空闲内存被划分为许多不连续的小块，导致即使在有足够内存的情况下，分配大块内存也变得困难或不可能。主要有两种类型：\n\
  \n* **外部碎片**：当可用总内存可以满足分配请求，但由于碎片化没有没有连续块足够大时，就会发生这种情况。这在内存分配和释放频繁发生且尺寸差异巨大的系统中很常见。\n\
  * **内部碎片**：当分配的内存块大于请求的内存时发生，会导致分配块内部的空间浪费。这发生在使用具有固定大小内存块或内存池的分配器，以及设计用于提供 WCET\
  \ 的分配器时。\n\n内存碎片会导致内存使用效率低下，降低性能或防止进一步分配，导致内存溢出场景，即使看起来有足够的可用内存。让我们通过下图来可视化动态内存分配预留的内存区域：\n\
  \n![图 2.2 – 用于动态内存分配的内存区域](img/B22402_2_2.png)\n\n图 2.2 – 用于动态内存分配的内存区域\n\n\n\n\n\
  在`Figure 2.2` 中，每个块代表在分配过程中分配的内存单元。空区域未被分配，或者已使用 `delete` 操作符被释放。尽管有充足的可用内存，如果请求分配四个内存单元，分配将失败，因为由于内存碎片，没有四个连续的内存块可用。\n\
  \n默认内存分配器的非确定性行为和内存溢出（OOM）场景是安全关键系统主要关注的问题。MISRA 和 AUTOSAR 为在安全关键系统中使用 C++ 提供了编码准则。\n\
  \nMISRA 是一个为汽车行业所用电子元件开发的软件提供准则的组织。它是汽车制造商、零部件供应商和工程咨询公司之间的合作。MISRA 产生的标准也用于航空航天、国防、太空、医疗等其他行业。\n\
  \nAUTOSAR 是一个由汽车制造商、供应商以及来自电子、半导体和软件行业的其他公司组成的全球开发伙伴关系。AUTOSAR 还为在关键和安全相关系统中使用 C++\
  \ 制定了准则。\n\n## C++ 动态内存管理的安全关键准则\n\n涵盖 C++03 标准的 MISRA C++ 2008 禁止使用动态内存分配，而 AUTOSAR\
  \ 的《关键和安全相关系统中 C++14 语言的使用指南》等规定了以下规则：\n\n*   规则 `A18-5-5`（强制，工具链，部分自动化）\n\n> “内存管理函数应确保以下内容：(a)\
  \ 产生具有最坏执行时间的确定性行为，(b) 避免内存碎片，(c) 避免内存耗尽，(d) 避免分配或释放不匹配，(e) 不依赖于内核的非确定调用。”\n\n*\
  \   规则 `A18-5-6`（强制，验证/工具链，非自动化）\n\n> “应进行分析以分析动态内存管理的失败模式。特别是应分析以下失败模式：(a) 由于不存在最坏执行时间导致的非确定性行为，(b)\
  \ 内存碎片，(c) 内存耗尽，(d) 分配与释放不匹配，(e) 依赖于内核的非确定调用。”\n\n现在完全遵循这两条规则是一项极其困难的任务。我们可以编写一个具有确定性\
  \ WCET 并能最小化碎片的自定义分配器，但我们如何编写一个能避免内存溢出的分配器呢？或者，在发生这种情况时，我们如何确保系统不失败？对分配器的每次调用都需要验证操作是否成功，并在失败时以某种方式缓解。或者，我们需要能够准确地估算分配器所需的内存量，以便它在任何情况下运行时都不会耗尽内存。这为我们的软件设计增加了一个全新的复杂性层级，其增加的复杂度超过了允许动态内存分配所带来的价值。\n\
  \n动态内存分配策略的一种折中方法是在启动时允许分配，但在系统运行时不允许。这是《联合打击战斗机飞行器 C++ 编码标准》所使用的策略。MISRA C++ 2023\
  \ 也建议在系统运行时避免使用动态内存分配，并作为一种缓解策略，建议在启动时使用。\n\nC++ 标准库大量使用动态内存分配。异常处理机制的实现也经常使用动态分配。在放弃在嵌入式项目中使用标准库之前，让我们发现\
  \ `std::vector` 容器的内部工作原理，看看 C++ 提供了什么来缓解我们的顾虑。\n\n## C++ 标准库中的动态内存管理\n\n我们引入了 `std::vector`\
  \ 作为标准库中一个动态内存分配的容器。`vector` 是一个模板类，我们可以指定底层类型。它连续存储元素，我们可以使用 `data` 方法直接访问底层的连续存储。\n\
  \n下面的代码示例演示了 vector 的用法：\n\n```\n std::vector<std::uint8_t> vec;\n  constexpr std::size_t\
  \ n_elem = 8;\n  for (std::uint8_t i = 0; i < n_elem; i++) {\n    vec.push_back(i);\n\
  \  }\n  const auto print_array = [](uint8_t *arr, std::size_t n) {\n    for (std::size_t\
  \ i = 0; i < n; i++) {\n      printf(\"%d \", arr[i]);\n    }\n    printf(\"\\r\\\
  n\");\n  };\n  print_array(vec.data(), n_elem);\n```\n\n我们创建了一个底层类型为 `uint8_t` 的\
  \ vector，并使用 `push_back` 方法添加了 `0` 到 `8` 的值。示例还演示了对底层连续存储指针的访问，我们将其作为参数传递给 `print_array`\
  \ lambda 表达式。\n\n`vector` 的通常分配策略是在第一次插入时分配一个元素，然后每次达到容量时翻一倍。存储 `0` 到 `8` 的值将导致\
  \ 4 次分配请求，如图所示：\n\n![Figure 2.3 – Vector allocation requests](img/B22402_2_3.png)\n\
  \n图 2.3 – Vector 分配请求\n\n`Figure 2.3` 描述了 vector 的分配请求。为了在任何平台上检查 vector 的实现，我们可以重载\
  \ `new` 和 `delete` 运算符并监控分配请求：\n\n```\nvoid *operator new(std::size_t count) {\n\
  \  printf(\"%s, size = %ld\", count);\n  return std::malloc(count);\n}\nvoid operator\
  \ delete(void *ptr) noexcept {\n  printf(\"%s\\r\\n\", __PRETTY_FUNCTION__);\n \
  \ std::free(ptr);\n}\n```\n\n重载的 `new` 运算符将分配调用传递给 `malloc`，并打印调用者请求的大小。重载的 `delete`\
  \ 运算符仅打印函数签名以便我们看到它是何时调用的。某些使用 GCC 的标准库实现通过 `malloc` 实现 `new` 运算符。我们的 vector 分配调用将产生以下输出：\n\
  \n```\nvoid* operator new(std::size_t), size = 1\nvoid* operator new(std::size_t),\
  \ size = 2\nvoid* operator new(std::size_t), size =  4\n** operator((std::size_t),),\
  \ =  8\n = 8\n```\n\n上述结果是使用 GCC 编译器得到的，它们在 x86_64 和 Arm Cortex-M4 平台上都是相同的。当 vector\
  \ 填充可用内存时，它请求分配当前使用内存的两倍。然后它将数据从原始存储拷贝到新获取的内存。之后，它会删除之前使用的存储，正如之前生成的输出所示。\n\n重载\
  \ `new` 和 `delete` 运算符允许我们全局更改分配机制，以满足要求确定性 WTEC 并避免内存溢出的安全关键准则，这非常具有挑战性。\n\n如果预先知道元素数量，可以通过\
  \ `reserve` 方法优化 vector 的分配请求：\n\n```\n vec.reserve(8);\n```\n\n使用 `reserve` 方法将使\
  \ vector 请求 8 个元素，只有当我们超过元素数量时它才会请求更多内存。这对于允许在启动时进行动态分配的项目很有用，如果我们能保证在任何点的元素数量保持在预留内存范围内。如果我们向\
  \ vector 添加第九个元素，它将产生另一个分配请求，请求容纳 16 个元素的内存。\n\nC++ 标准库还允许为容器使用本地分配器。让我们看看 vector\
  \ 的声明：\n\n```cpp\ntemplate<\n    class T,\n    class Allocator = std::allocator<T>\n\
  > class vector;\n```\n\n\n\n我们可以看到第二个模板参数是 `Allocator`，默认参数是 `std::allocator`，它使用了\
  \ `new` 和 `delete` 操作符。C++17 引入了 `std::pmr::polymorphic_allocator`，这是一种分配器，它根据构造时使用的\
  \ `std::pmr::memory_resource` 类型表现出不同的分配行为。\n\n有一种内存资源可以通过提供一个初始的静态分配缓冲区来构造，它被称为\
  \ `std::pmr::monotonic_buffer_resource`。单调缓冲区（monotonic buffer）是为了性能而设计的，它只在被销毁时释放内存。使用静态分配的缓冲区初始化它使其适用于嵌入式应用。让我们看看如何将它用于\
  \ vector：\n\n```cpp\n using namespace std;\n  using namespace std::pmr;\n  array<uint8_t,\
  \ sizeof(uint8_t) * 8> buffer{0};\n  monotonic_buffer_resource mbr{buffer.data(),\
  \ buffer.size()};\n  polymorphic_allocator<uint8_t> pa{&mbr};\n  std::pmr::vector<uint8_t>\
  \ vec{pa};\n```\n\n在前面的示例中，我们执行了以下操作：\n\n1. 创建一个 `std::array` 容器，底层类型为 `uint8_t`。\n\
  2. 构造单调缓冲区并将刚刚创建的数组作为初始缓冲区提供给它。\n3. 使用单调缓冲区创建一个多态分配器，并用它创建一个 vector。\n\n请注意，该 vector\
  \ 来自于 `std::pmr` 命名空间，它只是 `std::vector` 的部分特化，如下所示：\n\n```cpp\nnamespace pmr {\n\
  \    template< class T >\n    using vector = std::vector<T, std::pmr::polymorphic_allocator<T>>;\n\
  }\n```\n\n利用单调缓冲区创建的 vector 将在缓冲区提供的空间内分配内存。让我们通过基于之前代码构建的示例来看这种 vector 的行为：\n\n\
  ```cpp\n#include <cstdio>\n#include <cstdlib>\n#include <array>\n#include <memory_resource>\n\
  #include <vector>\n#include <new>\nvoid *operator new(std::size_t count, std::align_val_t\
  \ al) {\n  printf(\"%s, size = %ld\\r\\n\", __PRETTY_FUNCTION__, count);\n  return\
  \ std::malloc(count);\n}\nint main() {\n  using namespace std;\n  using namespace\
  \ std::pmr;\n  constexpr size_t n_elem = 8;\n  array<uint8_t, sizeof(uint8_t) *\
  \ 8> buffer{0};\n  monotonic_buffer_resource mbr{buffer.data(), buffer.size()};\n\
  \  polymorphic_allocator<uint8_t> pa{&mbr};\n  std::pmr::vector<uint8_t> vec{pa};\n\
  \  //vec.reserve(n_elem);\n  for (uint8_t i = 0; i < n_elem; i++) {\n    vec.push_back(i);\n\
  \  }\n  for (uint8_t data : buffer) {\n    printf(\"%d \", data);\n  }\n  printf(\"\
  \\r\\n\");\n  return 0;\n}\n```\n\n之前的程序将提供以下输出：\n\n```\nvoid* operator new(std::size_t,\
  \ std::align_val_t), size = 64\n0 0 1 0 1 2 3 0\n```\n\n我们看到，尽管使用了单调缓冲区，程序仍然调用了\
  \ `new` 操作符。你可以注意到对 `reserve` 方法的调用被注释了。这将导致如之前描述的 vector 扩展策略。当单调缓冲区的初始内存用完时，它将回退到上游内存资源指针。默认的上游内存资源将使用\
  \ `new` 和 `delete` 操作符。\n\n如果我们打印作为 `monotonic_buffer_resource` 初始存储的缓冲区，可以看到 vector\
  \ 正在分配第一个元素并从中存储 `0`，然后它将其翻倍并存储 `0` 和 `1`，接着再次翻倍，存储了 `0`、`1`、`2` 和 `3`。当它尝试再次翻倍时，单调缓冲区将无法满足分配请求，并将回退到使用依赖\
  \ `new` 和 `delete` 操作符的默认分配器。我们可以在下面的图中直观地看到：\n\n![Figure 2.4 – 单调缓冲区资源使用的缓冲区状态](img/B22402_2_4.png)\n\
  \n图 2.4 – 单调缓冲区资源使用的缓冲区状态\n\n`Figure 2.4` 描述了单调缓冲区资源使用的内部状态。我们可以看到单调缓冲区资源没有以任何方式释放内存。在分配缓冲区请求时，如果缓冲区中有足够的空间容纳请求数量的元素，它将返回缓冲区中最后一个可用元素的指针。\n\
  \n你会发现此示例中使用的 `new` 操作符的签名与之前使用的不同。实际上，标准库定义了多个版本的 `new` 和匹配的 `delete` 操作符，在不检查的情况下，很难判断标准库中的容器使用的是哪一个版本。这使得全局重载它们并将实现替换为自定义实现变得更具挑战性，因此局部分配器通常是更好的选择。\n\
  \n利用在栈上的缓冲区初始化的单调缓冲区来使用的多态分配器，可能是处理 C++ 时缓解某些顾虑的良好选择。\n\n## 禁用不需要的 C++ 特性\n\n你可能注意到我们使用了标准库的\
  \ `printf` 向标准输出打印调试信息，而不是 `std::cout`。原因有二：`std::cout` 全局对象的内存占用较大且使用了动态内存分配。C++\
  \ 与 C 库配合良好，使用 `printf` 是一个很好的替代方案。\n\n我们已经讨论过异常处理机制，它通常依赖于动态内存分配。在 C++ 中禁用异常只需向编译器传递相应的标志。对于\
  \ GCC 来说，该标志是 `-fno-exceptions`。运行时类型信息（**RTTI**）也是如此。我们可以通过 `-fno-rtti` 标志禁用它。\n\
  \n禁用异常将在抛出异常时调用 `std::terminate`。我们可以用自己的实现替换默认的终止处理器并进行妥善处理，如下例所示：\n\n```cpp\n\
  #include <cstdio>\n#include <cstdlib>\n#include <exception>\n#include <array>\n\
  int main() {\n  constexpr auto my_terminate_handler = []() {\n    printf(\"This\
  \ is my_terminate_handler\\r\\n\");\n    std::abort();\n  };\n  std::set_terminate(my_terminate_handler);\n\
  \  std::array<int, 4> arr;\n  for (int i = 0; i < 5; i++) {\n   arr.at(i) = i;\n\
  \  }\n  return 0;\n}\n```\n\n之前的示例演示了如何使用 `std::set_terminate` 通过自己的实现来设置终止处理器。这允许我们处理运行时不应发生的情况，并尝试从从中恢复或优雅地终止。C++\
  \ 中的某些特性或行为无法通过编译器标志禁用，但仍有其他方法来处理它们，\n\n正如我们之前所见，我们可以重定义全局 `new` 和 `delete` 操作符。我们也可以删除它们，这会导致当使用调用了\
  \ `new` 的软件组件时编译失败，从而而允许在需要时有效地防止任何动态内存分配的尝试。\n\n\n\n\n```cpp\n#include <cstdio>\n\
  #include <vector>\n#include <new>\nvoid *operator new(std::size_t count) = delete;\n\
  void *operator new[](std::size_t count) = delete;\nvoid *operator new(std::size_t\
  \ count, std::align_val_t al) = delete;\nvoid *operator new[](std::size_t count,\
  \ std::align_val_t al) = delete;\nvoid *operator new(std::size_t count, const std::nothrow_t\
  \ &tag) = delete;\nvoid *operator new[](std::size_t count, const std::nothrow_t\
  \ &tag) = delete;\nvoid *operator new(std::size_t count, std::align_val_t al, const\
  \ std::nothrow_t &) = delete;\nvoid *operator new[](std::size_t count, std::align_val_t\
  \ al,const std::nothrow_t &) = delete;\nint main() {\n  std::vector<int> vec;\n\
  \  vec.push_back(123);\n  printf(\"vec[0] = %d\\r\\n\", vec[0]);\n  return 0;\n\
  }\n```\n\n上述示例将产生以下编译器信息（可能还有其他信息）：\n\n```\n/usr/include/c++/13/bits/new_allocator.h:143:59:\
  \ error: use of deleted function 'void* operator new(std::size_t, std::align_val_t)'\n\
  \  143 |             return static_cast<_Tp*>(_GLIBCXX_OPERATOR_NEW (__n * sizeof(_Tp),\n\
  ```\n\n通过删除 `new` 运算符，我们可以让尝试使用动态内存管理的 C++ 程序编译失败。如果我们想确保程序没有使用动态内存管理，这种方法非常有用。\n\
  \n## 总结\n\nC++ 允许极程度的灵活性。资源受限的嵌入式系统和安全关键性指南会对某些 C++ 特性的使用施限制，例如异常处理、RTTI（运行时类型识别）以及标准\
  \ C++ 库中容器和其他模块对动态内存分配的使用。C++ 承认了这些考虑，并提供了禁用不需要的功能的机制。在本章中，我们学习了通过本地分配器以及通过重载全局\
  \ `new` 和 `delete` 运算符来缓解动态内存分配疑虑的不同策略。\n\n学习曲线虽然陡峭但值得投入，因此让我们继续在嵌入式系统中发现 C++ 的之旅。\n\
  \n在下一章中，我们将探索用于嵌入式开发的 C++ 生态系统。\n\n# 3\n\n# 嵌入式 C++ 生态系统\n\n每个嵌入式系统的核心都是微控制器。从基础内核到现代内核的过渡反映了技术的演进。微控制器领域非常广泛，从成本效益的\
  \ 8 位、16 位内核到现代的基于 32 位 Arm 和 RISC-V® 的微控制器。这种架构的多样性影响了工具和编译器的开发。虽然某些厂商专注于对 C 语言的支持，但许多厂商已经意识到\
  \ C++ 的重要性，并在其工具链中为 C++ 开发提供了良好的支持。\n\n由于嵌入式系统非常庞大，无法涵盖所有可用架构和供应商，我们将重点关注 Arm® Cortex®-M，它是现代微控制器和**片上系统**（**SoCs**）的主流架构之一。我们将介绍支持\
  \ Arm Cortex-M C++ 开发的可用开发环境和工具链。我们还将介绍静态分析器等工具，学习如何对嵌入式目标进行性能分析，并涵盖单元测试等方法。\n\n\
  在本章中，我们将涵盖以下主要主题：\n\n*   编译器和开发环境\n*   静态分析器\n*   单元测试\n*   性能分析 (Profiling)\n\n\
  ## 技术要求\n\n为了充分利用本章，我强烈建议在阅读示例时使用 Compiler Explorer ([`godbolt.org/`](https://godbolt.org/))。选择\
  \ `GCC` 作为你的编译器并目标 x86 架构。这将允许你看到标准输出 (stdio) 结果并更好地观察代码的行为。由于我们使用了许多现代 C++ 特性，请确保在编译器选项框中添加\
  \ `-std=c++23` 以选择 C++23 标准。\n\n本章的示例可以在 GitHub 上 ([`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter03`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter03))\
  \ 获取。\n\n## 编译器和开发环境\n\nC++ 在嵌入式系统中的采用受到编译器支持的影响。虽然大多数编译器都支持 C，但对 C++ 的支持进展较慢。如今，根据目标架构和功能安全需求，有多种适用于\
  \ C++ 的编译器和工具链。对 32 位架构（如 Arm Cortex-M）的支持通常良好，但支持水平取决于工具链厂商和功能安全需求。\n\n许多厂商提供其工具的功能安全版本，其中包含了根据不同行业安全标准认证的编译器。功能安全标准旨在确保即使在发生硬件故障或操作错误的情况下，软件也能正确、安全地运行。`IEC\
  \ 61508` 是功能安全的国际性伞性安全标准，以下是针对某些行业的安全标准：\n\n*   **ISO 26262**：汽车安全标准\n*   **EN 50128**：欧洲铁路安全标准\n\
  *   **IEC 62304**：医疗软件国际标准\n*   **IEC 60730**：家用电器电气控制\n\n功能安全需求是我们在为新项目选择编译器时检查清单上的首要项目之一。如果需要认证编译器，我们将限于商业版本。虽然许多提供嵌入式开发工具的厂商提供了工具的功能安全版本，但也存在免费的开发环境和开源编译器可用于非关键应用。\n\
  \n开发环境整合了不同的工具，使开发过程无缝化并让你专注于开发。这些工具也可以根据个人或组织的喜好单独使用。嵌入式开发的工具（无论是单独使用还是集成在开发环境中）列如下：\n\
  \n*   代码编辑器：可以是简单的文本编辑器，也可以是更高级的工具，如 `Vim` 或支持插件功能的语法高亮、自动补全、跨文件代码导航和重构功能。\n*  \
  \ 编译器和链接器：用于将代码转换为对象文件并将其链接到可以烧录的可执行文件和二进制文件。一些流行的 C++ 编译器有 `GCC`、`Clang`、`Arm Compiler\
  \ for Embedded` 和 `IAR C/C Compiler`。\n*   调试器：用于烧录和调试目标。调试系统的部分包括调试器探针以及与探针通信以调试连接目标的软件。\n\
  *   构建系统：`GNU Make` 和 `Ninja` 等工具用于控制编译和链接过程。`CMake` 和 `Bazel` 用于构建自动化和依赖管理。\n*\
  \   静态分析工具：用于分析源代码。根据功能，它们可以检测某些形式的未定义行为，如越界访问、未初始化变量、空指针解引用等。专用的静态分析工具可以检查代码是否符合\
  \ MISRA 或 AUTOSAR 标准。\n*   运行时性能分析器：这些是目标能力、软件插桩和调试器探针的结合，用于测量函数执行时间并分析软件性能。\n\n\
  大多数嵌入式**集成开发环境**（**IDE**）提供功能：\n\n*   项目创建和组织\n*   构建自动化\n*   调试\n\n某些开发环境集成了更高级的代码分析功能，例如：\n\
  \n*   静态分析\n*   性能分析和性能评估\n\n\n\n\n\n在接下来的页面中，我们将介绍行业内一些最常用的开发环境和编译器。\n\n### 适用于嵌入式系统的\
  \ Arm Keil MDK 和 Arm Compiler\n\n`Arm® Keil® MDK` 是一套用于（主要）Arm Cortex-M 微控制器嵌入式开发的工具集，包含以下内容：\n\
  \n* Keil Studio，一套针对 VS Code 的扩展 set\n* Keil μVision，一个基于 Windows® 的传统 IDE\n* Arm\
  \ Compiler for Embedded，一个 C 和 C++ 编译器\n* Arm Virtual Hardware\n\n`Keil Studio`\
  \ 和 `Keil μVision` 均提供了嵌入式开发所需的所有 IDE 功能，包括针对不同目标的项目配置、构建以及在目标上进行调试。\n\nKeil μVision\
  \ 支持集成 `PC-Lint`（一种静态 C 和 C++ 分析器），而 VS Code (Keil Studio) 则可以被配置为使用 `clang-tidy`\
  \ 或 `cppcheck`。\n\nKeil μVision 内置了 `Keil Simulator`，允许在 PC 上的模拟目标上运行固件，它还作为 μVision\
  \ 调试器的一部分集成了性能分析器。\n\nArm Keil MDK 带有 `Arm Virtual Hardware Fixed Virtual Platforms`，这是\
  \ Arm 的云平台，允许您在模拟目标上运行二进制文件，为模拟环境下的 CI/CD 提供基础设施支持。\n\nKeil MDK 提供一个供非商用使用的基础版本（社区版），以及两个商业版本（基础版和专业版），具体取决于所提供的功能。只有专业版商业版本提供功能安全支持和扩展维护。接下来，我们将介绍\
  \ `Arm Compiler for Embedded`，这是一个随 MDK 附带的 C 和 C++ 编译器，它包含了链接器和标准库。\n\n`Arm Compiler\
  \ for Embedded` 是 Arm 提供的 C 和 C++ 编译器。Arm 还提供了编译器的 `功能安全` (`FuSa`) 版本，该版本已根据 IEC\
  \ 61508、ISO 26262、EN 50128 和 IEC 62304 安全标准认证。\n\nFuSa 版本仅在 MDK 的最高版本——专业版可用。\n\n\
  Arm Compiler for Embedded 由以下工具链组件组成：\n\n* `armclang`，一个基于低级虚拟机 (`LLVM`) 的编译器\n\
  * `armlink`，一个链接器，用于将对象文件和库组合以生成可执行文件\n* Arm C 库\n* 基于 LLVM `libc++` 项目的 Arm C++\
  \ 库\n\nArm Compiler 支持 C++17 标准，而最新版本的 Arm Compiler for Embedded FuSa 6.16 支持 C++\
  \ 14。尽管在编写此本书时已经是 2024 年，但对最新版本 C++ 标准的支持进展仍然缓慢。在 C++17 之后，C++20 和 C++23 已经发布。\n\
  \n商业编译器对最新 C++ 标准的支持仍然相当缓慢，这导致这些环境无法使用最新的语言特性。\n\n### IAR C/C++ 编译器和适用于 Arm 的 IAR\
  \ Embedded Workbench\n\n`IAR Embedded Workbench®` 是一种适用于 Arm Cortex-M、Cortex-R 和\
  \ Cortex-A 核心的开发环境（IAR 代表 Ingenjörsfirma Anders Rundgren）。它集成了以下工具：\n\n* IDE，包括调试器和性能分析器\n\
  * IAR C/C++ 编译器\n* `IAR C-STAT®`，静态分析器\n* `IAR C-RUN®`，用于运行时分析的工具\n\nIAR Embedded\
  \ Workbench 是开发 Arm Cortex-M 核心的全方位解决方案。该 IDE 配备了调试器等标准工具，还提供了更高级的嵌入式工具，例如性能分析器和在模拟器中运行固件。\n\
  \nIAR 提供了 `C-STAT`，一种静态分析工具，可以针对 `MISRAC++2008` 等安全编码标准进行静态分析。\n\nIAR 还提供了 `C-RUN`，一种运行时分析工具，通过对代码进行插桩，涵盖堆检查、边界检查、缓冲区溢出、整数溢出和其他运行时检查。\n\
  \nIAR C/C++ 编译器从 9.30.1 版本支持 C++17。适用于 Arm 的 IAR Embedded Workbench FuSa 版本（9.50.3\
  \ 版本，2024 年 2 月）也提供了 C++17 的支持。\n\nIAR C/C++ 编译器和 Arm Compiler for Embedded 是嵌入式开发的商业选择。除了从商业项目中可以获得的支持外，这些工具的优势在于它们为安全关键型项目提供了经过安全认证的版本。\n\
  \n一些微控制器供应商提供其自己的开发环境版本，通常基于 Eclipse®，为其自己的产品提供额外支持。\n\n### 供应商支持的 IDE 和 GCC\n\n\
  商业开发环境的替代方案是供应商支持的环境，这些环境主要基于 Eclipse 和 `GNU Compiler Collection` (`GCC`) 工具，以及用于调试的\
  \ `GNU Project Debugger` (`GDB`)。例如 ST® 的 STM32CubeIDE 和 NXP® 的 MCUXpresso。\n\n\
  这些工具配备了代码配置器 UI，它们可以生成用于 GPIO 配置、时钟设置和外设驱动程序初始化的 C 代码。\n\n某些供应商（如 Nordic Semiconductor®）选择了将\
  \ VS Code 作为其 IDE 解决方案的基础。他们提供了用于 GPIO 配置和调试的插件。VS Code 是一种现代代码编辑器，允许开发者使用 `IntelliSense`\
  \ 等插件进行代码补全、参数信息显示、语法高亮等许多功能，以增强开发体验。\n\n### GCC\n\n`GCC` 是通用领域最常用的 C 和 C++ 编译器之一。它是免费软件，也是不需要经过认证编译器的非关键应用中最流行的编译器。然而，即使是\
  \ `GCC` 也可以认证。认证过程包括编译和运行测试程序，并将输出与预期结果进行比较。所有发现的问题都必须记录文档，并建立一套流程来缓解这些问题。\n\n商业编译器对最新\
  \ C++ 标准的支持仍然相当缓慢，这使得这些环境无法使用最新的语言特性。\n\n\n\n\n\n在`图 3.2` 中，我们可以看到预处理器为我们的简单 `hello\
  \ world` 示例精确地增加了 800 行代码。预处理器遍历 `cstdio` 文件，解析所有的预处理器指令，并将结果粘贴到编译单元中，导致产生了 808\
  \ 行代码。\n\nCompiler Explorer 的默认视图是汇编输出，我们只需从上一个示例中移除 `-E` 标志即可获取，如下所示：\n\n![图 3.3\
  \ – Compiler Explorer: 汇编输出](img/B22402_3_03.png)\n\n图 3.3 – Compiler Explorer:\
  \ 汇编输出\n\n在`图 3.3` 中，我们可以看到 GCC 编译过程生成的汇编输出。我们可以看到优化过程将 `printf` 函数替换为了 `puts`。此外，我们没有看到\
  \ `puts` 函数的函数体，因为该函数是我们所链接的 C 标准库的一部分。该过程的步骤如下：\n\n1. 汇编器将从汇编代码生成目标代码。\n2. 链接器将生成的目标代码与包含\
  \ `puts` 实现（以及其他函数）的 C 标准库链接在一起。\n\n在这个简单的示例中，我们运行了 GCC 的编译过程，这并不会产生我们可以在微控制器上运行的代码，因为我们还需要执行以下步骤：\n\
  \n1. 添加时钟和硬件外设初始化代码。\n2. 为我们的目标平台的架构和指令集设置编译器标志。\n3. 添加一个启动汇编脚本，其中包含重位处理程序以及 C 和\
  \ C++ 运行时初始化。\n4. 添加链接脚本，为目标设备定义不同的内存区域，包括 RAM 和 Flash 区域。\n5. 为链接器添加指令，以链接到特定的\
  \ C 和 C++ 标准库。\n\nGCC 编译过程最后一个阶段（链接阶段）的输出是一个**可执行可链接格式**（**ELF**）文件。ELF 文件使用 `objdump`\
  \ 工具转换为二进制或 hex 格式，因为二进制和 hex 格式通常用于烧录过程以加载到目标设备上。\n\n从第 10 版本开始，GCC 集成了一个静态分析器，可以通过\
  \ `-fanalyzer` 编译器标志来启用。\n\n## 静态分析器\n\n**静态分析器**是遍历源代码并检测代码中潜在问题的工具，例如未定义行为，或者它们检查代码是否符合\
  \ MISRA® 或 AUTOSAR® 等安全标准。并不是所有的静态分析器都具有相同的功能，只有商业版本支持安全标准检查。使用静态分析器可以检测到的某些问题如下：\n\
  \n* 使用未初始化的数据\n* 数组越界访问\n* 空指针解引用\n* 除以零\n* delete 后使用、重复 delete 以及其他内存管理问题\n\n\
  我们可以通过向 GCC 驱动程序程序提供 `-fanalyzer` 标志来启用 GCC 的静态分析器。让我们来看一个简单的求和函数，它接收一个 `std::array<int,\
  \ 4>` 常量引用并返回如下例所示的和：\n\n```\n#include <array>\nint sum(const std::array<int, 4>\
  \ &arr) {\n    int ret;\n    for(int elem: arr) {\n        ret += elem;\n    }\n\
  \    return ret;\n}\n```\n\n上一个示例的问题是我们没有将 `ret` 变量初始化为零。在 `sum` 函数栈分配变量期间，`ret`\
  \ 变量的值将由分配位置上的任何内容填充，导致未定义行为。我们可以在 Compiler Explorer 中添加 `-fanalyzer` 标志并打开编译器输出，如下截图所示：\n\
  \n![图 3.4 – Compiler Explorer: 静态分析器，使用未初始化的值](img/B22402_3_04.png)\n\n图 3.4 – Compiler\
  \ Explorer: 静态分析器，使用未初始化的值\n\n在`图 3.4` 中，我们可以在新面板看到编译器输出，我们通过点击 **Output (0/42)**\
  \ 启用。可以看到静态分析器识别出我们正在使用未定义的变量并发出了警告。GCC 与许多其他编译器一样可以发出编译器警告，也可以检测不同的代码问题，包括未初始化变量。可以使用\
  \ `-Wall`、`-Wextra`、`-Wpedantic` 等标志启用常规编译器警告，但在这种情况下它们无法捕捉未初始化变量。\n\n我们可以从下面的截图看到这一点：\n\
  \n![图 3.5 – Compiler Explorer: GCC 警告，未初始化值](img/B22402_3_05.png)\n\n图 3.5 – Compiler\
  \ Explorer: GCC 警告，未初始化值\n\n在`图 3.5` 中，我们看到 GCC 并没有使用常规编译器警告对未初始化的数据发出警告。使用 `-fanalyzer`\
  \ 标志启用静态分析器有助于检测该问题，但请记住，静态分析需要更多的时间，这对于较大的代码库可能是一个问题。还有一个 GCC 标志 `-Wuninitialized`，它应该为未初始化的变量生成警告。在这个特定的示例中，只有当程序使用不同于\
  \ 0 的优化标志（例如 `-O2`）编译时，才会生成警告。\n\n不同的编译器具有不同的功能，包括检测代码问题。如果我们使用 `clang` 编译器编译此示例（在\
  \ Compiler Explorer 中将编译器切换到 **armv7-a clang 11.0.1**），我们将看到 `clang` 编译器会检测到这个未初始化变量问题并发出警告。此外，静态分析器的功能不同，因此通过多个静态分析器运行代码是一个良好的做法，因为其中一个可能会检测另一个无法检测的问题，反之亦然。\n\
  \n这是另一个静态分析器运行的示例，检测越界访问：\n\n![图 3.6 – Compiler Explorer: 静态分析器，越界访问](img/B22402_3_06.png)\n\
  \n图 3.6 – Compiler Explorer: 静态分析器，越界访问\n\n在`图 3.6` 中，我们正尝试访问一个四个元素的数组的第五个元素，这将导致未定义行为。这被\
  \ GCC 的静态分析器捕捉到了，它发布了一个描述性的警告。在 GCC 中，可以将警告视为错误会导致编译失败且不生成 ELF 文件。要将警告视为错误，只需在 GCC\
  \ 驱动程序调用中添加 `-Werror` 编译器标志。\n\n其他常用的静态分析器还包括 `clang-tidy` 和 `cppcheck`。`clang-tidy`\
  \ 可以在 Compiler Explorer 中通过 **Add tool** 选项启用`clang-tidy` ([`clang.llvm.org/extra/clang-tidy/`](https://clang.llvm.org/extra/clang-tidy/))\
  \ 和 `cppcheck` ([`cppcheck.sourceforge.io/`](https://cppcheck.sourceforge.io/))\
  \ 都很容易安装和使用，正如之前提到的，使用多个静态分析器检测不同的代码问题通常是一个好主意。\n\n## 单元测试\n\n单元测试是通过测试框架对代码单元进行测试的过程，该框架提供了设置测试、运行测试和报告的基础。那么，什么是代码单元？这取决于我们要测试什么；它可以是一个函数或一个软件模块，或者我们可以把单元测试理解为对工作单元的测试。当用户按下按钮时，固件需要做什么，或者当我们通过\
  \ **蓝牙®低功耗** (**BLE**) 连接接收特定数据包时，它需要做什么？\n\n\n\n\n根据单元测试的粒度，我们可以在个体层面上对固件的不同组件以及它们之间的相互作用进行测试，以确保功能的正常运行。单元测试在与其它软件组件隔立的状态下测试代码单元或工作单元。这迫使我们在开发过程中关注这些单元的功能，并更轻松地拆分组件之间的职责，从而构建出更健壮的软件。\n\
  \n大多数 C++ 测试框架并不太适合运行在小型嵌入式目标上，原因在于其生成的二进制文件体积过大，特别是由于使用了标准库中的 `ostream`。这使得我们有了在主机机（host\
  \ machine）上运行单元测试而不是在嵌入式目标上运行。这并不是意味着单元测试不能在嵌入式目标上运行。在目标上运行测试需要花费更多时间，因为所有测试都需要针对目标进行编译并烧录到目标中，而且我们还需要主机机上的一个报告捕获机制来读取测试结果。\n\
  \n在主机机上脱离目标运行测试是一种常见做法。然而，这种方法存在争议，因为测试是在不同的架构上运行的，即使是数据类型的大小也可能不同。为了解决这个问题，可以强制使用固定宽度的数据类型（例如\
  \ `uint8_t` 或 `int32_t`）。此外，主机机和目标机使用的编译器之间可能存在差异，因此建议使用相同版本的编译器。在主机机上运行测试更快更简单，但架构和配置之间的差异可能会对测试结果产生影响。通过手动目标测试以及系统和集成测试可以发现代码功能中的潜在问题，并作为功能验证的额外层。\n\
  \nC++ 有不同的测试框架，其中一些最常用的框架如下：\n\n* Google Test\n* Catch2\n* Boost.Test\n* CppUTest\n\
  \n我们可以通过在 Compiler Explorer 中添加相关库来轻松尝试它们。首先要的是是添加一个“仅执行（Execution Only）”面板，如图所示：\n\
  \n![图 3.7 – Compiler Explorer：执行面板](img/B22402_3_07.png)\n\n图 3.7 – Compiler Explorer：执行面板\n\
  \n在 `图 3.7` 中，我们添加了一个执行面板并选择了 `x86-64 gcc 13.2` 作为编译器。现在，我们需要点击执行面板中的 `Libraries`\
  \ 按钮来添加 Google Test 库。它会打开一个新窗口，我们可以在其中搜索并包含一个库，如图所示：\n\n![图 3.8 – Compiler Explorer：包含库](img/B22402_3_08.png)\n\
  \n图 3.8 – Compiler Explorer：包含库\n\n在 `图 3.8` 中，我们搜索了 Google Test 库，并通过在下拉菜单中选择版本将其添加到项目中。让我们看看如何使用\
  \ Google Test 测试我们在第一章中的通用环形缓冲区实现。以下是带有环形缓冲区实现和几个简单测试的代码：\n\n```cpp\n#include <array>\n\
  #include <cstdio>\n#include \"gtest/gtest.h\"\ntemplate <class T, std::size_t N>\
  \ struct ring_buffer {\n  std::array<T, N> arr;\n  std::size_t write_idx = 0;\n\
  \  std::size_t read_idx = 0;\n  std::size_t count = 0;\n  void push(T t) {\n   \
  \ arr.at(write_idx) = t;\n    write_idx = (write_idx + 1) % N;\n    if (count <\
  \ N) {\n      count++;\n    } else {\n      read_idx = (read_idx + 1) % N;\n   \
  \ }\n  }\n  T pop() {\n    if (count == 0) {\n      return T{};\n    }\n    T value\
  \ = arr.at(read_idx);\n    read_idx = (read_idx + 1) % N;\n    --count;\n    return\
  \ value;\n  }\n  bool is_empty() const {\n      return count == 0;\n  }\n  std::size_t\
  \ get_count() const {\n      return count;\n  }\n};\nTEST(RingBufferInt, PushPop)\
  \ {\n    ring_buffer<int, 2> rb;\n    rb.push(1);\n    rb.push(2);\n    EXPECT_EQ(rb.pop(),\
  \ 1);\n    EXPECT_EQ(rb.pop(), 2);\n}\nTEST(RingBufferInt, GetCount) {\n    ring_buffer<int,\
  \ 20> rb;\n    for(int i = 0; i < 50; i++) {\n        rb.push(i);\n    }\n    EXPECT_EQ(rb.get_count(),\
  \ 20);\n    for(int i = 0; i < 10; i++) {\n        rb.pop();\n    }\n    EXPECT_EQ(rb.get_count(),\
  \ 10);\n}\nint main() {\n  testing::InitGoogleTest();\n  return RUN_ALL_TESTS();\n\
  }\n```\n\n在前面的示例中，环形缓冲区的实现与第一章相同，但增加了 `get_count` 方法，该方法返回缓冲区当前持有的元素数量。我们使用 `TEST`\
  \ 宏定义了一个测试套件 `RingBufferInt`。我们指定了两个名为 `PushPop` 和 `GetCount` 的测试。\n\n在 `PushPop`\
  \ 测试中，我们正在测试 `push` 和 `pop`。在 `GetCount` 测试中，我们使用 `EXPECT_EQ` 宏检查 `get_count` 是否返回\
  \ `20` 或 `10`。运行前面的程序将在执行面板产生标准输出，如下：\n\n![图 3.9 – Compiler Explorer：执行](img/B22402_3_09.png)\n\
  \n图 3.9 – Compiler Explorer：执行\n\n在 `图 3.9` 中，我们在执行面板中看到了测试结果。`TEST` 宏确保测试被自动注册，我们不需要手动添加。Google\
  \ Test 提供了更多功能，这个例子只是对其能力的一种瞥。编写单元测试让我们思考代码如何与其他模块交互。通过关注代码单元，我们可以编写出松耦合的代码，使软件更加灵活和健壮。单元测试对于测试驱动开发（TDD）等开发技术至关重要，它要求我们在编写代码之前编写测试。在我们编写单元测试后，编写通过测试的实际代码，然后添加更多测试、重构实现并迭代。\n\
  \n单元测试是验证代码功能的强大工具，无论我们在目标上还是主机平台上运行它们。尽管如此，它们并没有告诉我们关于固件性能的很多信息。这一点，我们需要在目标上运行固件并使用性能分析工具。\n\
  \n## 性能分析 (Profiling)\n\n在目标上运行代码并进行性能分析是确保关键功能的最坏执行时间（WCET）并在需要时进行必要的优化的最佳方法。性能分析的挑战在于它是一种侵入性操作，因为需要修改或对源代码进行插桩，以启用能够告诉我们目标内部发生情况的跟踪。\n\
  \n性能分析取决于目标能力。某些内核集成了跟踪单元（正如我们在上一章中看到的），提供了极低侵入性的性能分析。此外，某些目标具有特殊接口，允许通过连接到主机机的高级调试和跟踪探器进行高速跟踪数据传输。我们可以从下面的图中看到某些\
  \ Cortex-M 目标的性能分析基础设施示例：\n\n![图 3.10 – 通过调试探器连接到主机的 Arm 目标](img/B22402_3_10.png)\n\
  \n图 3.10 – 通过调试探器连接到主机的 Arm 目标\n\n在 `图 3.10` 中，我们可以看到通过调试探器连接到主机的 Arm 。性能分析或跟踪数据流可以通过以下步骤描述：\n\
  \n1. 使用 DWT 采样程序计数器（PC）并产生事件。\n2. ITM 将由 DWT 和插桩代码生成的事件通过单线输出（SWO）发送到调试探器。\n\n\n\
  \n\n3. 调试探针通过 USB 将追踪数据传输到主机机上的捕获软件上。\n\n4. 捕获软件通常是较大软件包的一部分，该软件包可以分析和可视化捕获到的接收数据。\n\
  \n为了获得关于函数执行时间的精确信息，需要对源代码进行插桩，即添加能够生成追踪数据的指令。我们在上一章中已经看到如何使用 `GCC` 编译器的功能（在每个函数的入口和出口处添加指令）来实现这一点。这些数据可以通过\
  \ `ITM` 发送到运行在主机机上的性能分析软件中。这种方法准确性良好，但通过在代码中添加指令，我们为了测量牺牲了性能。\n\nPC 采样（程序计数）比代码插桩的侵入性更小，但准确性较低，且仅能检测固件中的瓶颈，无法提供精确的定时信息。\n\
  \n某些 Arm 内核集成了`嵌入式跟踪单元`（`ETM`）。`ETM` 记录指令执行情况，生成追踪数据并将其发送到连接的探针。通过指令追踪数据，分析器可以准确地测量函数的执行时间，并为每个函数调用创建调用图，这与代码插桩的效果相同。`ETM`\
  \ 使得可以在无插桩的情况下进行代码分析。\n\n`代码插桩`仍然是一种非常常用的方法，因为它对目标机的集成追踪能力依赖较小。`SEGGER` 的 `SystemView`\
  \ 是一个用于嵌入式目标的分析器示例。正如我们在上一章中简要讨论过的，我们需要在目标上使用 `SEGGER` 的 `SystemView` 和 `RTT` 库来启用追踪生成。接下来，你可以看到\
  \ `SystemView` 生成的数据：\n\n![图 3.11 – SystemView](img/B22402_3_11.png)\n\n图 3.11 –\
  \ SystemView\n\n在`图 3.11` 中，我们看到了来自插桩固件的函数名称，包括最小和最大运行时间。代码分析可以帮助优化固件中时间敏感的区域，使我们能够满足系统的定时要求。\n\
  \n## 总结\n\n在本章中，我们发现了`嵌入式`领域 C++ 开发的可用工具。有多种可选的开发环境和编译器。虽然商业解决方案提供有保障的支持，并且其工具具有功能安全版本，但免费工具也很常见，在需要时甚至可以经过认证。\n\
  \n静态分析器可以帮助避免常见的编程问题并确保符合安全准则。通过使用单元测试，我们可以验证固件的功能，性能分析器可以帮助检测瓶颈、测量 `WCET`（最坏执行时间）并确保定时要求。\n\
  \n在下一章中，我们将使用选定的免费工具为嵌入式应用创建一个 C++ 开发环境。\n\n## 加入我们的 Discord 社区\n\n加入社区的 Discord\
  \ 空间与作者和其他读者讨论：\n\n[`packt.link/embeddedsystems`](https://packt.link/embeddedsystems)\n\
  \n![](img/QR_code_Discord.png)\n\n# 4. 为 C++ 嵌入式项目设置开发环境\n\n在上一章中，我们探索了嵌入式工具生态并回顾了行业中最常用的工具。现在，我们将为现代嵌入式开发环境及其每个组件设定要求。然后，我们将设置开发环境，以运行本书后续部分提供的示例。\n\
  \n集成环境的主要卖点之一是易于使用。它们通过简单的安装步骤为您提供所需的一切内容。相比之下，定制化环境需要单独安装所有组件，包括每个组件的所有依赖项。确保构建的可复现性和调试环境的可靠性至关重要，因此对定制环境进行容器化具有重要意义。\n\
  \n我们将为您提供一个用于书中开发的 `Docker` 容器作为开发环境，但我们将单独分析它的所有组件。了解我们在日常工作中使用的工具，对于理解和控制其背后的过程是必要的。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n*   对现代软件开发环境的要求\n*   容器化开发环境\n*   容器化开发环境与 `Visual Studio\
  \ Code`\n\n## 技术要求\n\n对于本章，您需要安装 `Docker`（[https://www.docker.com/]）。请遵循针对您特定操作系统的安装说明。本章将引导您完成下载和运行带有预配置开发环境的容器的基本步骤。对于更高级的\
  \ `Docker` 使用，请参阅其网站上的官方 `Docker` 文档。\n\n本章的代码可以在 GitHub 上找到（[`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter04.`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter04.)）。\n\
  \n## 现代软件开发环境的要求\n\n`固件开发`与任何其他形式的软件开发无异，我们使用的工具对于有效工作至关重要。为了让本书和示例尽可能易于获取，我们设定的第一个要求是使用免费工具。`编译器`是每个开发需求的基础和最重要部分，因此让我们定义需求并根据我们的需求选择一个编译器。\n\
  \n### 编译器\n\n由于我们正在探索现代 C++，我们需要编译器支持 `C++23` 标准。`ARM GNU Toolchain`（基于 `GCC`）的最新版本是\
  \ 13.2；它支持 `C++23` 且免费免费。它也是 ARM 开发中最常用的免费编译器工具链，使其完美契合我们的编译器需求。\n\n`ARM GNU Toolchain`\
  \ 带有 C 和 C++ 编译器、用于调试的 `GNU Debugger`（`GDB`）以及其他有用工具（如 `objcopy`、`objdump`、`size`\
  \ 等），可以从 [`developer.arm.com/downloads/-/arm-gnu-toolchain-downloads`](https://developer.arm.com/downloads/-/arm-gnu-toolchain-downloads)\
  \ 下载。适用于 Arm Cortex-M 的架构是 `arm-none-eabi`。\n\n`arm-none-eabi` 的 `ARM GNU Toolchain`\
  \ 适用于所有常见的主机架构：\n\n*   GNU/Linux x86_64 和 AArch64 架构\n*   Windows x86 架构（兼容 x86_64）\n\
  *   macOS x86_64 和 Apple silicon\n\n编译单个或几个文件只需运行终端命令，但构建即使简单的嵌入式项目也涉及以下步骤：\n\n\
  1.  编译所有 C 和 C++ 源文件、包含 `main` 函数的文件以及若干来自`硬件抽象层`（`HAL`）的文件。你将在第 12 章学习更多关于 `HAL`\
  \ 的知识。\n\n    1. 设置编译器包含路径。\n    2. 设置编译器 C 和 C++ 标志。\n    3. 设置编译器定义宏。\n    4.\
  \ 编译启动汇编脚本。\n    5. 设置链接选项，包括链接脚本、静态库、CPU 架构和指令集以及标准库选项。\n\n完成这些操作后，我们必须将 ELF 文件转换为烧录程序常用的其他格式，例如\
  \ `bin` 和 `hex`。\n\n在终端中手动运行所有这些任务将是一个乏味的过程，因此我们开发环境的下一个要求是*构建自动化*。构建自动化的第一个候选工具是\
  \ `make` 工具。它是一个常用工具，用于自动化跨行业的大量软件项目。它是这项任务的良好选择，但它是一个老旧工具，语法奇怪。然而，我们可以使用 `CMake`，这是一个更灵活、语法更现代的工具，它可以为我们生成\
  \ Makefile。\n\n\n\n\n\n### 构建自动化\n\n`CMake` 并不是一个真正的构建自动化工具，但它能为其他自动化工具（如 `make`set）生成文件。它是一个跨平台、免费且开源的软件，用于构建自动化过程，该过程涉及软件的测试、打包和安装。它通过使用与编译器无关的方法来实现这一点。\n\
  \n我们将使用 `CMake` 来帮助为 `make` 工具生成目标，这些目标将执行以下操作：\n\n* 配置源文件，包括用于构建 `ELF` 文件的路径和链接器设置\n\
  * 将 `ELF` 文件转换为十六进制和二进制格式\n* 启动模拟器并加载生成的 `ELF` 文件\n\n我们不仅使用构建自动化来构建固件，还用它来启动运行固件的模拟器。\n\
  \n### 模拟器\n\n为了让这本书让更广泛的读者都能读懂，我们将使用 `simulator` 来运行已为 `ARM Cortex M` 目标编译的示例。`Renode`\
  \ ([`github.com/renode/renode`](https://github.com/renode/renode)) 是一个开源仿真框架，对 `ARM`\
  \ 目标有良好的支持。\n\n`Renode` 允许你运行具有多个目标的仿真，并模拟它们之间的无线和有线连接。我们将在一个涉及在单个目标上运行仿真的简单场景中使用它。`Renode`\
  \ 还可以启动 `GDB` 服务器，允许你连接到它并调试目标。\n\n我们将使用高度可配置的 `Visual Studio Code` 将仿真执行、调试以及编译器和构建自动化集成。\n\
  \n### 代码编辑器\n\n`Visual Studio Code` 是一个现代且灵活的代码编辑器。它为我们提供了所需的所有扩展，以便将我们所有的工具集成到单一环境中。我们将在\
  \ `Visual Studio Code` 中安装以下扩展：\n\n* `C/C++`：此扩展提供语法高亮、代码自动补全和代码导航\n* `Cortex-Debug`:此扩展允许通过\
  \ `GDB` 执行调试\n* `CS 128 Clang-Tidy`:此扩展将 `clang-tidy` 集成到 `Visual Studio Code` 中\n\
  * `Dev Containers`:此扩展连接到正在运行的容器并将其用于开发目的\n\n我们将基于 `Docker` 容器构建我们的开发环境。`Visual\
  \ Studio Code` 将连接到该容器并使用它。\n\n### 容器化开发环境\n\n`Visual Studio Code Dev Containers`\
  \ 扩展允许 `Visual Studio Code` 连接到正在运行的 `Docker` 容器并使用其中已安装的所有工具。要使用此功能，我们需要构建一个容器。\n\
  \n我们将使用 `Docker` 构建一个包含以下工具的容器：\n\n* `ARM GNU Toolchain` 版本 13.2\n* `CMake` 和 `make`\
  \ 工具\n* `Renode` 版本 1.14\n\n请确保已按照官方网站提供的说明 ([`docs.docker.com`](https://docs.docker.com))\
  \ 在你的主机上安装了 `Docker`。\n\n你可以在本书的 GitHub 仓库 ([`github.com/PacktPublishing/Cpp-in-Embedded-Systems`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems))\
  \ 的 `Chapter04` 文件夹中找到用于构建容器的 `Dockerfile`。\n\n此外，还可以从 `Docker Hub` ([`hub.docker.com/`](https://hub.docker.com/))\
  \ 下载一个镜像。你可以使用以下命令来拉取它：\n\n```\n$ docker pull mahmutbegovic/cpp_in_embedded_systems:latest\n\
  ```\n\n请按照你所在平台的说明确保 `Docker` 守护进程已启动；这些说明可以在官网上找到。下载镜像后，使用以下命令启动 `Docker`：\n\n\
  ```\n$ docker run -d -it --name dev_env mahmutbegovic/cpp_in_embedded_systems\n\
  ```\n\n这将以分离和交互模式启动 `Docker` 容器。如果你已经使用 `docker run` 命令创建了 `Docker` 容器，你需要通过运行以下命令启动它：\n\
  \n```\n$ docker start dev_env\n```\n\n要访问已启动容器的 `bash`，我们可以使用以下命令：\n\n```\n$ docker\
  \ exec -it dev_env /bin/bash\n```\n\n如下截图所示，我们可以运行各种命令来确保编译器、调试器、模拟器和其他工具已安装在容器中：\n\
  \n![Figure 4.1 – Development environment container bash](img/B22402_04_01.png)\n\
  \n图 4.1 – 开发环境容器 bash\n\n*图 4.1* 显示了我们用于检查已安装工具版本的命令的预期输出。\n\n我们可以使用运行中的容器作为一个自包含的环境。让我们先从\
  \ GitHub 克隆项目仓库 ([https://github.com/PacktPublishing/Cpp-in-Embedded-Systems)：\n\
  \n```\n$ git clone https://github.com/PacktPublishing/Cpp-in-Embedded-Systems.git\n\
  ```\n\n完成此后，进入 `Chapter04/bare` 文件夹。该文件夹包含了用于 `STM32F072` 的 *Hello, World!* 示例固件，我们将在\
  \ `Renode` 中运行它。项目组织如下文件夹：\n\n* `app`: 包含业务层代码，包括 `main.cpp`\n* `hal`: 包含 `HAL`\
  \ C++ 代码\n* `platform`: 包含特定平台的代码，包括 ST 提供的 C 语言 `HAL` 层以及 `CMSIS`、启动和链接脚本\n* `renode`:\
  \  `Renode` 脚本\n\n### 使用 CMake 构建 Hello, World! 程序\n\n我们必须指定工具链、源文件和编译器标志。在 `CMake`\
  \ 中要做的第一件事是指定版本，如下所示：\n\n```\ncmake_minimum_required(VERSION 3.13)\n```\n\n`CMake`\
  \ 是一个强大的工具，允许我们编写高度灵活的构建。然而，在我们的示例中，我们需要指定工具链。以下行指定了工具链：\n\n```\nset(CMAKE_C_COMPILER\
  \ \"arm-none-eabi-gcc\")\nset(CMAKE_CXX_COMPILER \"arm-none-eabi-g++\")\nset(CMAKE_ASM_COMPILER\
  \ \"arm-none-eabi-gcc\")\n```\n\n使用 `CMAKE_C_COMPILER`、`CMAKE_CXX_COMPILER` 和 `CMAKE_ASM_COMPILER`\
  \ 变量，我们分别为 C、C++ 和汇编器指定路径。我们需要使用这三者，因为我们的项目包含了 C 语言的 `HAL`、我们的 C++ 代码以及汇编。\n\n现在，我们需要通过运行\
  \ `CMakeLists.txt` 中的行来指定指定编译器选项和预处理器宏：\n\n```\nset(CDEFS \"-DUSE_HAL_DRIVER -DSTM32F072\"\
  )\nset(MCU \"-mcpu=cortex-m0 -mthumb\")\nset(COMMON_FLAGS \"${MCU} ${CDEFS} -fdata-sections\
  \ -ffunction-sections -Wno-address-of-packed-member -Wall -Wextra -Wno-unused-parameter\"\
  )\nset(CMAKE_C_FLAGS \"${COMMON_FLAGS}\")\nset(CMAKE_CXX_FLAGS \"${COMMON_FLAGS}\
  \ -Wno-register -fno-exceptions -fno-rtti -fno-threadsafe-statics\")\n```\n\n在这里，我们设置了\
  \ `USE_HAL_DRIVER` 和 `STM32F072` 编译时宏，这些宏被 `HAL` 使用。然后，我们设置了一些适用于 C 和 C++ 的编译器标志：\n\
  \n* `-mcpu=cortex-m0` 和 -`mthumb`: 架构特定的标志。\n\n\n\n\n\n- `-Wno-unused-parameter`:\
  \ 禁用关于函数中未使用参数的警告。\n\n然后，我们设置了 C++ 特有的编译器标志：\n\n- `-Wno-register`: 禁用关于使用 `register`\
  \ 关键字的警告，该关键字在现代 C++ 中已弃用，但在旧代码中可能仍在使用。\n- `-fno-exceptions`: 禁用 C++ 中的异常支持。\n-\
  \ `-fno-rtti`: 禁用运行时类型信息 (`RTTI`)）。\n- `-fno-threadsafe-statics`: 防止编译器使用额外的代码来确保静态局部变量以线程安全的方式初始化。\n\
  \n我们 CMake 文件的下一部分是项目特定的：我们必须声明一个新项目，为它命名，启用我们想要使用的语言，并指定 CMake 目标（target）、源文件和链接器选项。\n\
  \n这是我们为 C++（混合 C）项目准备的基础编译器设置：\n\n```cmake\nproject(bare VERSION 1.0.6)\nenable_language(C\
  \ CXX ASM)\nset(CMAKE_CXX_STANDARD 17)\nset(CMAKE_CXX_STANDARD_REQUIRED True)\n\
  ## 全局包含目录\ninclude_directories(\n  ${CMAKE_SOURCE_DIR}/platform/inc\n  ${CMAKE_SOURCE_DIR}/platform/CMSIS/Device/ST/STM32F0xx/Include\n\
  \  ${CMAKE_SOURCE_DIR}/platform/CMSIS/Include\n  ${CMAKE_SOURCE_DIR}/platform/STM32F0xx_HAL_Driver/Inc\n\
  \  ${CMAKE_SOURCE_DIR}/app/inc\n  ${CMAKE_SOURCE_DIR}/hal/uart/inc\n  ${CMAKE_SOURCE_DIR}/hal/inc\n\
  \  )\nset(EXECUTABLE ${PROJECT_NAME}.elf)\nadd_executable(\n  ${EXECUTABLE}\n  platform/STM32F0xx_HAL_Driver/Src/stm32f0xx_hal.c\n\
  \  platform/STM32F0xx_HAL_Driver/Src/stm32f0xx_hal_cortex.c\n  platform/STM32F0xx_HAL_Driver/Src/stm32f0xx_hal_gpio.c\n\
  \  platform/STM32F0xx_HAL_Driver/Src/stm32f0xx_hal_rcc.c\n  platform/STM32F0xx_HAL_Driver/Src/stm32f0xx_hal_uart.c\n\
  \  platform/STM32F0xx_HAL_Driver/Src/stm32f0xx_hal_uart_ex.c\n  platform/startup_stm32f072xb.s\n\
  \  platform/src/stm32f0xx_hal_msp.c\n  platform/src/stm32f0xx_it.c\n  platform/src/system_stm32f0xx.c\n\
  \  app/src/main.cpp\n  hal/uart/src/uart_stm32.cpp\n  )\n```\n\n在前面的 CMake 代码中，我们使用了\
  \ `TARGET`。它代表一个由 CMake 构建的实体，无论是整个固件（一个可执行文件）还是静态库。在我们案例中，目标是整个固件，目标名称使用项目名称和 `.elf`\
  \ 后缀创建，这意味着 CMake 将为我们创建一个 `bare.elf` 目标。\n\n剩下的步骤是使用以下行指定链接器选项：\n\n```cmake\ntarget_link_options(\n\
  \  ${EXECUTABLE}\n  PUBLIC\n  -T${CMAKE_SOURCE_DIR}/platform/STM32F072C8Tx_FLASH.ld\n\
  \  -mcpu=cortex-m0\n  -mthumb\n  -specs=nano.specs\n  -Wl,--no-warn-rwx-segments\n\
  \  -Wl,-Map=${PROJECT_NAME}.map,--cref\n  -Wl,--gc-sections)\n```\n\n在这里，我们指定了要使用的链接脚本——即\
  \ `STM32F072C8Tx_FLASH.ld`——设置了目标 CPU 和指令集，并指定了要创建的新-lib nano 系统库和映射文件。\n\n现在，让我们使用\
  \ CMake 构建固件。\n\n### 使用 CMake 构建固件\n\n在这里，我们将使用以下命令创建一个构建文件夹并在 `Debug` 模式下配置构建：\n\
  \n```bash\n$ cd Cpp-in-Embedded-Systems/Chapter04/bare/\n$ mkdir build && cd build\n\
  $ cmake .. -DCMAKE_BUILD_TYPE=Debug\n```\n\n如果你使用 `ls –l` 列出构建文件夹中的文件，你会看到 CMake\
  \ 生成了 `Makefile`，它被用于构建固件。让我们运行它来构建固件：\n\n```bash\n$ make -j4\n```\n\n你应该能看到以下输出：\n\
  \n![Figure 4.2 – 构建固件](img/B22402_04_02.png)\n\n图 4.2 – 构建固件\n\n`Figure 4.2` 显示了构建固件的输出。可以使用以下命令在\
  \ Renode 中运行生成的 ELF 文件 `bare.elf`：\n\n```bash\n$ make run_in_renode\n```\n\n这将使用来自\
  \ `renode_scripts` 文件夹的 `stm32f072.resc` Renode 脚本启动模拟器。该脚本将使用 STM32F072 目标架构创建一个新的\
  \ Renode 机器并加载 `bare.elf` 文件。我们将在终端输出中看到以下：\n\n![Figure 4.2 – 构建固件](img/B22402_04_02.png)\n\
  \n\n\n\n\n*   **初始化栈指针**：它从栈的末尾（`_estack`）设置初始栈指针。\n*   **拷贝数据**：它将初始化值从闪 内存拷贝到\
  \ SRAM 中的数据段，以确保初始化的全局/静态变量被正确设置。\n*   **清零 BSS**：它通过将 BSS 段置零来清除它，这对未初始化的全局/静态变量是必要的。\n\
  *   **调用 SystemInit**：`SystemInit` 函数用于设置默认系统时钟（系统时钟源、PLL 倍数和分频因子、AHB/APBx 分频器以及\
  \ flash 设置）。\n*   **调用 __libc_init_array**：`__libc_init_array` 函数用于初始化 C++ 程序中的静态构造函数，或在\
  \ C 程序中运行初始化函数。\n*   **调用 main**：此操作结束启动脚本的活动，并将程序流转移到 `main` 函数。\n\n现在我们的现代开发环境已经完全准备就绪，我们准备好开始学习嵌入式系统的\
  \ C++ 了。Renode 模拟器允许我们高效地运行、测试和调试固件，消除了在开发初期阶段对物理硬件的需求。这为嵌入式系统的学习和测试提供了一个灵活且高效的解决方案。\n\
  \n## 总结\n\n在本章中，我们定义了嵌入式系统 C++ 开发环境的组件。我们通过 Docker 容器遍历所有组件，并将其连接到 Visual Studio\
  \ Code 以实现无缝的开发体验和调试。\n\n我们还使用 `CMake` 设置了编译器标志，使用 Renode 模拟器运行了固件，并通过调试器通过相关的汇编启动脚本学习了如何设置\
  \ C 和 C++ 运行时环境。\n\n在下一章中，我们将使用在本章创建的开发环境来学习更多关于 C++类的知识。\n\n# 第二部分\n\n# C++ 基础\n\
  \n在介绍嵌入式开发中的 C++ 之后，本书的重点转向了面向初学者和此前经验有限读者的 C++ 基础。这部分将深入探讨核心语言特性，如类（包括继承和运行时多态）以及其他基本概念。它还探索了\
  \ C++ 中提供的各种错误处理机制，包括异常的使用。\n\n本部分包含以下章节：\n\n*   *第 5 章, *类 – C++ 的构建模块*\n*   *第\
  \ 6 章, *超越类 – 基础 C++ 概念*\n*   *第 7 章, *强化固件 – 实用的 C++ 错误处理方法*\n\n# 5\n\n# 类 – C++\
  \ 应用的构建模块\n\nC++ 中的**类**是将代码组织成逻辑单元的手段。它们允许我们在蓝图中结构化数据以及对该数据执行操作的函数。这些蓝图可以用于构建类的实例，被称为**对象**。我们可以用数据初始化对象，通过调用在对象上的函数或方法来操纵它们，将它们存储在容器中，或者将它们的引用传递给其他类的对象，以实现系统不同部分之间的交互。\n\
  \n类是 C++ 应用的基本构建块。它们帮助我们以具有隔离职责的单元组织代码，反映了与系统其他部分的依赖和交互。它们可以被组合或扩展，允许我们重用其功能并添加额外能力。我们使用它们来对嵌入式系统的不同部分进行抽象，包括低级组件如**通用异步收发器**（`UART`）驱动程序和库，或者业务逻辑组件如蜂窝调制解调器库。\n\
  \n本章的目的是深入研究 C++ 类，并学习我们如何使用它们来编写更好的代码。在本章中，我们将涵盖以下主要主题：\n\n*   封装\n*   存储持续时间和初始化\n\
  *   继承和动态多态\n\n## 技术要求\n\n为了充分利用本章内容，我强烈建议在阅读示例时使用 Compiler Explorer ([`godbolt.org/`](https://godbolt.org/))。选择\
  \ GCC 作为你的编译器并目标 x86 架构。这将允许你看到标准输出 (stdio) 结果并更好地观察代码的行为。由于使用了许多现代 C++ 特性，请确保通过编译器选项框中添加\
  \ `-std=c++23` 选择 C++23 标准。\n\n本章的示例可以在 GitHub 上找到 ([`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter05)`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter05))。\n\
  \n## 封装\n\n**封装**是一种编程概念，将代码组织成同时包含数据和操作这些数据的函数的单元。它并不严格相关于**面向对象编程**（`OOP`），并且经常用于其他编程范式。封装允许我们将代码解耦为具有单一职责的单元，使代码更容易理解，提高可读性并便于维护。\n\
  \n从 OOP 的角度来看，封装也可以是指隐藏对象的成员或限制从外部对这些成员的访问。在 C++ 中，这可以通过访问修饰符来实现：\n\n*   Public（公共）\n\
  *   Private（私有）\n*   Protected（保护）\n\n**Public** 和 **private** 是常用的修饰符。它们赋予我们控制类接口的能力，即控制哪些类成员对类的用户是可见的。示例演示了如何定义一个带有公共和私有访问区域类，展示了封装的概念：\n\
  \n```cpp\n#include <cstdint>\nclass uart {\npublic:\n    uart(std::uint32_t baud\
  \ = 9600): baudrate_(baud) {}\n    void init() {\n        write_brr(calculate_uddiv());\n\
  \    }\nprivate:\n    std::uint32_t baudrate_;\n    std::uint8_t calculate_uddiv()\
  \ {\n        return baudrate_ / 32000;\n    }\n    void write_brr(std::uint8_t)\
  \ {}\n};\nint main () {\n    uart uart1(115200);\n    uart1.init();\n    return\
  \ 0;\n}\n```\n\n在这个示例中，`uart` 类具有公共和私有访问区域。让我们逐步分析代码：\n\n*   `public` 部分包含一个构造函数，该构造函数初始化私有成员\
  \ `baudrate_`。\n*   我们在公共部分中还有一个 `init` 方法，在其中我们使用私有方法 `write_brr` 向特定于 STM32 平台的**波特率寄存器**（`BRR`）写入值。\n\
  *   写入 BRR 寄存器的值在私有方法 `calculate_uddiv` 中计算。\n\n正如我们看到的，`uart` 类内部具有公共访问修饰符的方法可以使用私有成员变量和方法。但是，如果我们尝试在\
  \ `uart1` 对象上使用 `write_brr`，例如 `uart1.write_brr(5)`，程序的编译将失败。\n\n私有访问修饰符允许我们从类的用户（在本例中为\
  \ `main` 函数）那里隐藏方法和数据。这有助于我们为 C++ 类定义清晰的接口。\n\n这个示例说明了 C++ 中访问修饰符的作用，但也让我们用它来解释\
  \ `init` 方法。如果我们已经有了构造函数，为什么还需要它呢？\n\n`init` 的目的是允许我们完全控制硬件的初始化。对象也可能被构造为全局或静态变量。静态和全局对象的初始化是在进入\
  \ `main` 函数并初始化硬件之前完成的。这就是为什么嵌入式项目中类中的某种 `init` 方法很常见。通过使用它，我们可以确保所有硬件外设都按照正确的顺序进行初始化。\n\
  \n\n\n\nC++ 中类的默认访问修饰符是 `private`，因此我们可以按照上一个示例的定义 `uart` 类如下：\n\n```cpp\nclass\
  \ uart {\n    std::uint32_t baudrate_;\n    std::uint8_t calculate_uartdiv();\n\
  \    void write_brr(std::uint8_t);\npublic:\n    uart(std::uint32_t baud = 9600);\n\
  \    void init();\n};\n```\n\n我们选择显式地定义 `private` 访问区域。我们将其放在 `public` 区域之后，因为公开可访问的成员是类的接口，当你阅读代码和类定义时，你首先想看到的是接口。你想知道如何与该类交互，以及哪些方法是你可以使用的公共接口的一部分。\n\
  \n在这个示例中，我们拥有的唯一数据成员是 `baudrate_`。它是 `private` 的，`uart` 类用户设置它的唯一方式就是通过构造函数。对于我们想要暴露给公开的数据成员，定义\
  \ setter（设置器）和 getter（访问器）是一种常见的做法。\n\n### 设置器访问器 (Setters and getters)\n\n在 `uart`\
  \ 类中，我们可以如下为 `baudrate_` 成员定义设置器访问器：\n\n```cpp\n std::uint32_t get_baudrate() const{\n\
  \        return baudrate_;\n    }\n    void set_baudrate(baudrate) {\n        baudrate_\
  \ = baudrate;\n    }\n```\n\n现在，这允许我们从公开接口设置和获取 `baudrate` 值，但这些微不足道的设置器访问器并没有为我们的接口增加任何价值。它们仅仅是暴露了\
  \ `baudrate_` 成员。这与将其放在 `public` 访问修饰符下是一样的。设置器访问器应该有明确的用途。例如，setter 可以包含验证逻辑，如下所示：\n\
  \n```cpp\n void set_baudrate(baudrate) {\n        if (baudrate <= c_max_baudrate)\
  \ {\n            baudrate_ = baudrate;\n        } else {\n            baudrate =\
  \ c_max_baudrate;\n        }\n    }\n```\n\n在修改后的 setter 中，我们对要设置的值进行了合理性检查，并且在这样做合理的情况下才设置私有成员，否则将其设置为系统支持的最大波特率（`c_max_baudrate`）。这只是一个示例；在\
  \ UART 初始化之后更改波特率可能没有意义。\n\n在某种意义上，通过 setter 和 getter 暴露数据成员破坏了封装性。封装的想法是隐藏实现细节，而数据成员就是实现细节。因此，setter\
  \ 特尤其是 getter 应该谨慎使用，并且在它们具有有意义的用途时才使用。\n\n我们可以使用 C++ 类来仅封装功能，而不包含数据，或者包含与类的所有用户共享的数据。对于这一点，我们可以使用静态方法。\n\
  \n### 静态方法 (Static methods)\n\n`static methods`（静态方法）是使用 `static` 关键字声明的 C++ 方法，无需实例化对象即可访问。在\
  \ `uart` 类示例中，除了构造函数外，我们还有 `init` 方法，它是公开接口的一部分。我们通过在之前使用单参数构造函数创建的对象上调用该方法（并提供\
  \ `baudrate`）来使用它。我们也可以将 `uart` 类设计为具有所有静态方法的类型，并如下所示使用它：\n\n```cpp\n#include <cstdint>\n\
  class uart {\npublic:\n    static void init(std::uint32_t baudrate) {\n        write_brr(calculate_uartdiv(baudrate));\n\
  \    }\nprivate:\n    static std::uint8_t calculate_uartdiv(std::uint32_t baudrate)\
  \ {\n        return baudrate / 32000;\n    }\n    static void write_brr(std::uint8_t)\
  \ {}\n};\nint main () {\n    uart::init(115200);\n    return 0;\n}\n```\n\n如你所示，我们删除了单参数构造函数并将所有方法声明为\
  \ `static`。我们还删除了 `baudrate_` 私有数据成员，并将其直接从 `init` 方法传递给 `calculate_uartdiv` 方法。我们现在有了一个无需实例化对象即可使用的类型。我们通过使用类名后跟双冒号和方法名来调用\
  \ `init` 方法，如 `main` 函数所示。值得注意的是，静态方法只能使用类中的静态数据成员和其他静态函数，因为非静态成员需要实例化对象。\n\n我们可以使用\
  \ `namespaces`（命名空间）将 C++ 中的函数分组到通用的 `unit` 中。然而，将它们分组到一个类型中是有用的，因为我们可以将类型作为模板参数传递。我们将在本书的后面讨论命名空间和模板，以更好地理解这种方法的用处。命名空间将在`第\
  \ 6 章`\n\n`structs` 在 C++ 中常用于仅具有公开数据成员类型。它们与类大部分相同，区别在于 struct 的默认访问级别是 `public`。它们主要用于数据。这里有一个只包含数据的\
  \ struct 示例：\n\n```cpp\nstruct accelerometer_data {\n    uint32_t x;\n    uint32_t\
  \ y;\n    uint32_t z;\n};\n```\n\n`accelerometer_data` 可以由 `sensor` 类产生，存储在 `ring_buffer`\
  \ 类中，并由 `sensor_fusion` 类消费。`accelerometer_data` 的成员是来自 `x`、`y` 和 `z` 轴的值，它们是对用户公开的。在这种情况下，我们仅将\
  \ `accelerometer_data` struct 作为数据容器，并在其他地方实现与此数据相关的行为。这只是一个示例。在简单的 struct 中结构化数据与使用具有复杂行为的类是一种设计选择，取决于具体的应用。\n\
  \nStruct 也用于将函数分组为类型。它们通常都被声明为 `static` 并对用户公开。在这种情况下，使用 struct 而不是类是方便的，因为默认访问修饰符是\
  \ `public`，这也反映了我们的意图，即 struct 通常用于所有成员公开的情况。\n\n## 存储周期与初始化 (Storage duration and\
  \ initialization)\n\nC++ 自动存储对象在声明时初始化并在离开作用域时销毁。对象也可以具有静态存储周期。对象的数据成员也可以具有静态存储修饰符，这些成员的初始化有相应的规则。我们首先介绍非静态成员的初始化。\n\
  \n### 非静态成员初始化 (Non-static member initialization)\n\n有多种方法初始化非静态类成员。当我们讨论初始化和 C++\
  \ 时，首先想到的是构造函数。虽然构造函数是强大的 C++ 特性，允许我们对初始化进行很好的控制，但让我们从**默认成员初始化器 (default member\
  \ initializers)** 开始。\n\n### 默认成员初始化器 (Default member initializers)\n\n从 C++11 开始，可以在类定义中直接为成员设置默认值，如下：\n\
  \n```cpp\nclass my_class{\n    int a = 4;\n    int *ptr = nullptr;\n}\n```\n\n\n\
  \n如果我们使用任何 C++11 之前的标准进行编译，那么这段简单的代码段将无法编译。默认成员初始化允许我们在类定义中为类成员设置默认值，这提高了代码的可读性，并避免了在有多个构造函数时重复设置同一个成员变量。这在为指针设置默认值时特别有用。\n\
  \n如果我们不对 `ptr` 使用默认初始化器，它将加载来自内存的某个随机值。解引用这样的指针将导致从随机位置读取或写入数据，可能导致严重的错误。这种假设性情况会被编译器或静态分析器检测到，因为它们会报告使用了未初始化的值，而这属于未定义行为。尽管如此，这仍然说明了用默认值初始化成员变量的重要性，而默认成员初始化是完成此任务的一种方案。\n\
  \n### 构造函数与成员初始化列表\n\n构造函数是类定义中没有名称的方法，不能显式调用。它们在对象初始化时被触发。可以用无参数调用的构造函数称为默认构造函数。我们已经在\
  \ `uart` 类示例中见过一个：\n\n```\nuart(std::uint32_t baud = 9600): baudrate_(baud) {\n\
  \    // 空构造函数体\n    }\n```\n\n尽管这个构造函数有一个参数，但我们使用了默认参数，当无参数调用构造函数时，将提供该默认参数。如果在调用处没有提供参数，则将使用默认值\
  \ `9600` 作为 `baud` 参数的值。\n\n当我们想要使用默认构造函数时，使用以下语法：\n\n```\nuart uart1;\n```\n\n\
  这也被称为**默认初始化**，它在带有没有初始化器的情况下声明对象时执行。请注意，这里没有括号，因为括号会导致语法歧义，并被编译器解释为函数声明。\n\n```\n\
  uart uart1();\n```\n\n上一行将被编译器解释为声明一个名为 `uart1` 的函数，该函数返回 `uart` 类的对象且不接受任何参数。这就是为什么我们在使用默认构造函数时不使用括号的原因。\n\
  \n由于我们的 `uart` 类构造函数也可以接受参数，我们可以使用直接初始化语法并为构造函数提供参数，如下所示：\n\n```\nuart uart1(115200);\n\
  ```\n\n这将调用 `uart` 类的构造函数，并为 `baud` 参数提供值 `115200`。虽然我们已经解释了与默认构造函数语法相关的细节，但我们仍然需要解释\
  \ `baudrate_` 成员变量的初始化。在这种情况下，我们使用了成员初始化列表。它指定在冒号之后、复合语句左大括号之前，格式为 `baudrate_(baud)`。在我们的案例中，成员初始化列表中项；如果有更多项，则用逗号分隔，如下例所示：\n\
  \n```\nclass sensor {\npublic:\n    sensor(uart &u, std::uint32_t read_interval):\n\
  \                uart_(u),\n                read_interval_(read_interval) {}\nprivate:\n\
  \    uart &uart_;\n    const std::uint32_t read_interval_;\n};\nint main() {\n \
  \   uart uart1;\n    sensor sensor1(uart1, 500);\n    return 0;\n}\n```\n\n在前面的代码中，我们在\
  \ `sensor` 构造函数的成员初始化列表中初始化了对 `uart` 对象的引用以及对 `read_interval_` 无符号整数。\n\n需要注意的是对\
  \ `uart` 类对象的引用。C++ 中的引用类似于 C 语言中的指针；即它们指向一个已经创建的对象。但是，它们在声明时必须初始化，并且不能重新赋值指向另一个对象。引用和带有\
  \ `const` 限定的成员必须使用成员初始化列表进行初始化。\n\n构造函数可以没有参数或有多个参数。如果构造函数有一个参数且声明时没有使用 `explicit`\
  \ 修饰符，它被称为转换构造函数。\n\n### 转换构造函数与显式修饰符\n\n**转换构造函数**允许编译器从参数类型到类的类型进行隐式转换。为了更好地理解，让我们来看下面的示例：\n\
  \n```\n#include <cstdio>\n#include <student>\nstruct uart {\n    uart(std::uint32_t\
  \ baud = 9600): baudrate_(baud) {}\n    std::uint32_t baudrate_;\n};\nvoid uart_consumer(uart\
  \ u) {\n   printf(\"Uart baudrate is %d\\r\\n\", u.baudrate_);\n}\nint main() {\n\
  \    uart uart1;\n    uart_consumer(uart1);\n    uart_consumer(115200);\n    return\
  \ 0;\n}\n```\n\n这个示例中有趣的部分是使用 `115200` 参数调用 `uart_consumer` 函数。`uart_consumer` 函数期望\
  \ `uart` 类的对象作为参数，但由于隐式转换规则和现有的转换构造函数，编译器使用 `115200` 作为参数构造了一个 `uart` 类对象，导致程序输出如下结果：\n\
  \n```\nUart baudrate is 9600\nUart baudrate is 115200\n```\n\n隐式转换可能是不安全的，而且通常是不希望的。为了防止这种情况，我们可以使用\
  \ `explicit` 修饰符声明构造函数，如下所示：\n\n```\nexplicit uart(std::uint32_t baud = 9600): baudrate_(baud)\
  \ {}\n```\n\n使用 `explicit` 编译前面的示例将导致错误：\n\n```\n<source>:19:19: error: could not\
  \ convert '115200' from 'int' to 'uart'\n   19 |     uart_consumer(115200);\n```\n\
  \n通过将构造函数声明为 `explicit`，我们可以确保我们类的任何用户都不会创建发生隐式转换的情况。但如果我们想防止使用 `float` 类型调用我们的构造函数呢？我们可以删除特定的构造函数，这将导致编译失败。我们可以在类声明中使用以下语法实现：\n\
  \n```\nuart(float) = delete;\n```\n\n使用 `float` 类型调用构造函数将导致以下错误：\n\n```\n<source>:12:25:\
  \ error: use of deleted function 'uart(float)'\n   12 |     uart uart1(100.0f);\n\
  ```\n\n我们还可以使用列表初始化，它会收窄转换。我们可以如下使用它：\n\n```\nuart uart1{100000f};\n```\n\n这种调用将导致以下错误：\n\
  \n```\n<source>:11:25: error: narrowing conversion of '1.0e+5f' from 'float' to\
  \ 'uint8_t' {aka 'unsigned char'} [-Wnarrowing]\n   11 |     uart uart1{100000f};\n\
  ```\n\n列表初始化限制了隐式转换并有助于在编译时检测问题。\n\n### 静态成员初始化\n\n静态成员不绑定于类的对象。它们是具有静态存储期的变量，可以通过类的任何对象访问。让我们通过一个简单的示例来更好地理解静态成员以及我们如何初始化它们：\n\
  \n```\n#include <cstdio>\nstruct object_counter {\n    static int cnt;\n    object_counter()\
  \ {\n        cnt++;\n    }\n    ~object_counter() {\n        cnt--;\n    }\n};\n\
  int object_counter::cnt = 0;\nint main() {\n    {\n        object_counter obj1;\n\
  \        object_counter obj2;\n        object_counter obj3;\n        printf(\"Number\
  \ of existing objects in this scope is: %d\\r\\n\",\n                          \
  \                 object_counter::cnt);\n    }\n    printf(\"Number of existing\
  \ objects in this scope is: %d\\r\\n\", \n                                     \
  \  object_counter::cnt);\n    return 0;\n}\n```\n\n\n\n在这个示例中，我们有一个简单的 `object_counter`\
  \ 结构体。该结构体有一个静态数据成员，整数类型的 `cnt`。在构造函数中，我们增加了了这个计数器变量，而在析构函数中，我们减少了它。在 `main` 函数中，我们在一个匿名作用域内创建了三个\
  \ `object_counter` 对象。\n\n当程序流离开该匿名作用域时，将调用析构函数。我们在作用域内部和离开作用域后打印了现有对象的数量。在匿名作用域内部，`cnt`\
  \ 的值应该等于 `3`，因为我们创建了三个对象；当我们退出该作用域时，析构函数减少了 `cnt` 变量，它的值应该为 `0`。以下是示例的输出：\n\n```\n\
  Number of existing objects in this scope is: 3\nNumber of existing objects in this\
  \ scope is: 0\n```\n\n输出显示 `cnt` 静态变量的行为正如我们预测的那样。在这种情况下，我们在类声明中声明了一个静态变量，但我们通过以下行代码对其进行了定义：\n\
  \n```\nint object_counter::cnt = 0;\n```\n\n在 C++17 标准中，可以在结构体（或类）定义内部使用 `inline`\
  \ 修饰符声明静态变量并提供初始化器，如下所示：\n\n```\nstruct object_counter {\n    inline static int\
  \ cnt = 0;\n    ...\n};\n```\n\n这使得代码更加简洁，更容易使用（因为我们不需要在类定义之外定义变量），而且更容易阅读。\n\n\
  我们已经涵盖了 C++ 类的基础知识，包括访问修饰符、初始化方法和构造函数。现在，我们将看到如何使用继承和动态多态来重用类。\n\n## 继承与动态多态\n\n\
  在 C++ 中，我们可以通过继承扩展类的功能而无需修改它。继承是建立类之间层级关系的示例；例如，`ADXL345` 是一种加速度计。让我们通过一个简单的示例来演示\
  \ C++ 中的继承：\n\n```cpp\n#include <cstdio>\nclass A {\npublic:\n    void method_1()\
  \ {\n        printf(\"Class A, method1\\r\\n\");\n    }\n    void method_2() {\n\
  \        printf(\"Class A, method2\\r\\n\");\n    }\nprotected:\n    void method_protected()\
  \ {\n        printf(\"Class A, method_protected\\r\\n\");\n    }\n};\nclass B :\
  \ public A{\npublic:\n    void method_1() {\n        printf(\"Class B, method1\\\
  r\\n\");\n    }\n    void method_3() {\n        printf(\"Class B, method3\\r\\n\"\
  );\n        A::method_2();\n        A::method_protected();\n    }\n};\nint main()\
  \ {\n    B b;\n    b.method_1();\n    b.method_2();\n    b.method_3();\n    printf(\"\
  -----------------\\r\\n\");\n    A &a = b;\n    a.method_1();\n    a.method_2();\n\
  \    return 0;\n}\n```\n\n在这个示例中，`class B` 继承了 `class A` 的私有和保护成员。`class A` 是基类，`class\
  \ B` 派生自它。派生类可以访问基类的公共和保护成员。在 `main` 函数中，我们创建了一个 `class B` 的对象，并调用了 `method_1`、`method_2`\
  \ 和 `method_3` 方法。部分代码的输出所示：\n\n```\nClass B, method1\nClass A, method2\nClass B,\
  \ method3\nClass A, method2\nClass A, method_protected\n```\n\n在 `main` 函数的第一行中，我们看到对对象\
  \ `b` 调用 `method_1` 函数执行的是在 `class B` 中定义的 `method_1`，尽管它派生自 `class A`，且 `class\
  \ A` 也定义了 `method_1`。这被称为**静态绑定**，因为调用 `method_1` 的决策是在 `class A` 中定义的并由编译器完成。\n\
  \n派生类 `class B` 的对象包含基类 `class A` 的对象。如果我们对对象 `b` 调用 `method_2`，编译器在 `class B` 中找不到定义，但由于类\
  \ `B` 继承自类 `A`，编译器将在对象 `a` 上调用 `method_2`，而对象 `a` 是对象 `b` 的一部分。\n\n在 `method_3`\
  \ 中，我们看到可以从派生类调用基类的方法。我们还可以看到调用基类的保护方法。这是私有访问修饰符的用例之一；它允许派生类访问。\n\n我们可以将派生类的对象赋值给基类的引用。我们也可以对指针执行相同的操作。以下是对引用进行调用方法的结果：\n\
  \n```\nClass A, method1\nClass A, method2\n```\n\n在基类引用上调用 `method_1` 将导致调用在 `class\
  \ A` 中定义的 `method_1`。这是静态绑定的另一个实例。但如果我们希望对基类引用或指针的调用导致执行派生类上的函数呢？而且我们为什么想这样做呢？让我们先解决*如何做*的问题。C++\
  \ 通过虚函数提供了一种动态绑定机制。\n\n### 虚函数\n\n在我们的示例中，我们将一个类型为 `A&` 的引用赋值给 `class B` 的对象。如果我们希望对\
  \ `method_1` 的调用导致执行派生类上的函数，我们必须在基类中将 `method_1` 声明为 `virtual`：\n\n```cpp\nclass\
  \ A {\npublic:\n    virtual void method_1() {\n        printf(\"Class A, method1\\\
  r\\n\");\n    }\n    virtual void method_2() {\n        printf(\"Class A, method2\\\
  r\\n\");\n    }\n    ...\n};\n```\n\n现在，当对引用 `A&` 调用 `method_1` 时，它将执行在 `class B`\
  \ 中定义的 `method_1`：\n\n```cpp\nclass B : public A {\npublic:\n    void method_1()\
  \ override {\n        printf(\"Class B, method1\\r\\n\");\n    }\n    ...\n};\n\
  ```\n\n这种机制被称为动态绑定。\n\n### 虚函数实现\n\n每个重写虚函数的类都有一个虚表。你可以将其想象为函数指针的隐藏表。类的每个对象一个指向该表的指针。该指针在运行时用于访问表。为了更好地理解这一点，让我们稍微修改\
  \ `class A` 和 `class B`：\n\n```cpp\nclass A {\npublic:\n    virtual void method_1()\
  \ {\n        printf(\"Class A, method1\\r\\n\");\n    }\n    virtual void method_2()\
  \ {\n        printf(\"Class A, method2\\r\\n\");\n    }\n};\nclass B : public A\
  \ {\npublic:\n    void method_1() override {\n        printf(\"Class B, method1\\\
  r\\n\");\n    }\n};\n```\n\n`class B` 重写了 `method_1`。编译器将为 `class B` 生成一个虚表，以及每个\
  \ `class B` 对象将持有的指针。该虚指针指向生成的虚表。这可以可视化如下：\n\n![图 5.1 – 虚表](img/B22402_05_01.png)\n\
  \n图 5.1 – 虚表\n\n*图 5.1* 描绘了 C++ 中使用虚表和虚指针实现虚函数的可能方式。如果我们对 `class B` 对象的引用调用 `method_2`，它将沿着虚指针找到虚表，并选择指向\
  \ `class B` 中 `method_2` 的函数指针，即重写的虚函数。这种机制发生在运行时。访问重写函数需要经过间接层，这导致了空间和时间开销。\n\n\
  \n\n在 C++ 中，我们可以将虚函数定义为纯虚函数。如果一个类拥有纯虚函数，它就被称为 `abstract class`（抽象类），并且不能被实例化。派生类必须重写纯虚函数，否则它们也将成为抽象类。让我们来看下面的代码示例：\n\
  \n```cpp\nclass A {\npublic:\n    virtual void method_1() = 0;\n};\nclass B : public\
  \ A{\n};\nint main() {\n    B b;\n    return 0;\n}\n```\n\n该程序将无法编译，因为 `class B`\
  \ 没有重写来自 `class A` 的 `method_1` 虚方法。抽象类将某些行为（方法）的实现实现责任交给了派生类。拥有所有虚方法的类被称为接口（interfaces）。继承定义了类与类之间的层次关系，我们可以说\
  \ `class B` 是一种 `class A`，就像猫是动物一样。我们可以在 `Unified Modeling Language`（统一建模语言，`UML`）图中表示这种关系。\n\
  \n### UML 类图\n\nUML 图用于描述软件组件。如果它们描述的是类之间的关系，则被称为 UML 类图。下图所示这样一个图：\n\n![Figure\
  \ 5.2 – UML diagram of class A and class B’s relationship](img/B22402_05_02.png)\n\
  \n图 5.2 – class A 和 class B 之间关系的 UML 图\n\n`Figure 5.2` 描述了一个 UML 类图，可视化了 `A` 和\
  \ `B` 之间的层次关系。连接 `B` 和 `A` 带有指向 `A` 的空心三角形箭头的线表示 `B` 是 `A`。该 UML 图还显示了两个类中可用的方法。\n\
  \nUML 图对于描述设计模式有用，我们将在本书中使用它们来帮助可视化代码示例中软件组件之间的关系。\n\n我们已经学习了什么是继承，以及如何结合虚函数使用来实现动态绑定。让我们回到为什么我们需要这些机制以及我们如何使用它们来创建更好的软件的问题。我们在本章中学到的机制为动态（运行时）多态提供了手段。\n\
  \n### 动态多态\n\n`Polymorphism`（多态）是一种允许为不同类型使用单一接口的机制。由于通过基于基类的接口来处理子类型或派生类，这种多态也被称为\
  \ `subtyping`（子类型化）。在 C++ 中的动态多态是通过继承和虚函数实现的。\n\n多态允许我们为不同的实现使用单一接口。让我们来看 GSM 调制调器的库示例。GSM\
  \ 调制调器通常通过 `UART` 接口与主机微控制器通信。微控制器可能有多个 UART 外设，例如 STM32 上的 `UART` 和低功耗通用异步收发器（`LPUART`）。我们可能希望在不同的微控制器上使用该库。\n\
  \n我们可以为不同平台上的不同 UART 实现定义一个通用接口，并在 GSM 库中使用该接口。`UART` 的实现由使用 GSM 库的平台提供，它将实现通用的\
  \ `UART` 接口。我们可以使用 UML 类图来可视化我们的库设计，如下：\n\n![Figure 5.3 – UML diagram of GSM library\
  \ and UART interface](img/B22402_05_03.png)\n\n图 5.3 – GSM 库和 UART 接口的 UML 图\n\n\
  在 `Figure 5.3` 中，我们看到了 `gsm_lib`、`uart` 和 `uart_stm32` 类之间的关系。GSM 库的功能在 `gsm_lib`\
  \ 类中实现，它使用了 `uart` 接口。`uart` 接口由 `uart_stm32` 类实现。GSM 库的功能非常复杂，但让我们通过一个非常简化的代码示例来演示这三个类之间的关系以及它们是如何协同工作的。以下是一个简化的示例：\n\
  \n```cpp\n#include <span>\n#include <cstdio>\n#include <cstdint>\nclass uart {\n\
  public:\n    virtual void init(std::uint32_t baudrate) = 0;\n    virtual void write(std::span<const\
  \ char> data) = 0;\n};\nclass uart_stm32 : public uart{\npublic:\n    void init(std::uint32_t\
  \ baudrate = 9600) override { \n        printf(\"uart_stm32::init: setting baudrate\
  \ to %d\\r\\n\", baudrate);\n    } \n    void write(std::span<const char> data)\
  \ override {\n        printf(\"uart_stm32::write: \");\n        for(auto ch: data)\
  \ {\n            putc(ch, stdout);\n        }\n    }\n};\nclass gsm_lib{\n    public:\n\
  \        gsm_lib(uart &u) : uart_(u) {}\n        void init() {\n            printf(\"\
  gsm_lib::init: sending AT command\\r\\n\");\n            uart_.write(\"AT\");\n\
  \        }\n    private:\n        uart &uart_;\n};\nint main() {\n    uart_stm32\
  \ uart_stm32_obj;\n    uart_stm32_obj.init(115200);\n    gsm_lib gsm(uart_stm32_obj);\n\
  \    gsm.init();\n    return 0;\n}\n```\n\n在这个代码示例中，我们看到 `uart` 类有两个纯虚函数，这使得它成为接口类。该接口被\
  \ `uart_stm32` 类继承并实现。\n\n\n\n\n## 命名空间 (Namespaces)\n\nC++ 中的 `Names` 用作作用域限定符，用于访问类型名称、函数、变量等。它们允许我们在使用许多软件组件且经常存在相似标识符的大型代码库中，更容易地区分类型和函数名。\n\
  \n在 C 语言中，我们通常为类型和函数添加前缀以便于区分，例如：\n\n```\ntypedef struct hal_uart_stm32{\n    UART_HandleTypeDef\
  \ huart_;\n    USART_TypeDef *instance_; \n} hal_uart_stm32;\nvoid hal_init();\n\
  uint32_t hal_get_ms();\n```\n\n在 C++ 中，我们可以使用命名空间代替 C 风格的标识符前缀来按逻辑组组织代码，如下所示：\n\n\
  ```cpp\nnamespace hal {\nvoid init();\nstd::uint32_t tick_count;\nstd::uint32_t\
  \ get_ms() {\n    return tick_count;\n}\nclass uart_stm32 {\nprivate:\n    UART_HandleTypeDef\
  \ huart_;\n    USART_TypeDef *instance_; \n};\n};\n```\n\n`hal` 命名空间的所有成员在命名空间内部都可以不带限定符地访问。要在代码外部访问\
  \ `hal` 命名空间的标识符，我们使用命名空间作为限定符，后跟作用域运算符（`::`），所示：\n\n```cpp\nhal::init();\nstd::uint32_t\
  \ time_now = hal::get_ms();\n```\n\n在这个示例中，除了 `hal` 命名空间，我们看到了之前示例中使用的 `std` 命名空间。C++\
  \ 标准库的类型和函数定义在 `std` 命名空间中。\n\n我们可以使用 `using` 指令在不带限定符的情况下访问标识符，如下所示：\n\n```cpp\n\
  using std::array;\narray<int, 4> arr;\n```\n\n`using` 指令也可以用于整个命名空间，所示：\n\n```cpp\n\
  using namespace std;\narray<int, 4> arr;\nvector<int> vec;\n```\n\n建议谨慎使用 `using`\
  \ 指令，特别是对于 `std`，将其限制在有限的作用范围内使用，或者更好一点是仅引入单个标识符。\n\n同一个命名空间可以在不同的头文件中声明标识符。例如，`std::vector`\
  \ 定义在 `vector.h` 中，`std::array` 定义在 `array.h` 头文件中。这允许我们将逻辑上属于同一组的不同头文件的代码组织在命名空间中。\n\
  \n未在显式命名空间内声明的函数和类型是全局命名空间的一部分。将所有代码组织在命名空间是一个良好的习惯。唯一不能在命名空间内声明必须在全局命名空间中的函数是 `main`。要访问全局命名空间的标识符，我们使用作用域运算符，所示：\n\
  \n```cpp\nconst int ret_val = 0;\nint main() {\n    return ::ret_val;\n}\n```\n\n\
  行 `return ::ret_val;` 使用了作用域运算符 `::` 但没有指定命名空间。这意味着它指向全局命名空间。因此，`::ret_val` 访问定义在任何函数或类外的\
  \ `ret_val` 变量——全局作用域。\n\n### 匿名命名空间 (Unnamed namespaces)\n\n命名空间可以在不带名称限定符的情况下声明。这允许我们声明对于其所在编译单元局部的函数和类型。在下面的示例中，我们可以看到一个匿名命名空间的示例：\n\
  \n```cpp\nnamespace {\nconstexpr std::size_t c_max_retries;\nstd::size_t counter;\n\
  };\n```\n\n在代码中，我们有一个匿名命名空间，其中声明了几个变量。它们具有“内部链接”（internal linkage），意味着它们无法被其他编译单元的代码访问。我们可以在\
  \ C 和 C++ 中通过使用 `static` 存储限定符来实现相同的效果。\n\n### 嵌套命名空间 (Nested namespaces)\n\n命名空间也可以嵌套。我们可以在命名空间中包含另一个命名空间，所示：\n\
  \n```cpp\nnamespace sensors {\nnamespace environmental {\nclass temperature {\n\
  };\nclass humidity {\n};\n};\nnamespace indoor_air_quality{\nclass c02{\n};\nclass\
  \ pm2_5{\n};\n};\n};\n```\n\n在这个示例中，我们用命名空间组织了传感器。我们有一个顶层命名空间 `sensors`，它包含两个命名空间：`environmental`\
  \ 和 `indoor_air_quality`。C++17 标准允许我们这样写命名空间，所示：\n\n```cpp\nnamespace sensors::environmental\
  \ {\nclass temperature {\n};\nclass humidity {\n};\n};\n```\n\n命名空间是提高代码可读性的好方法，因为它们允许我们保持标识符简短，而无需\
  \ C 风格的前缀。\n\n## 函数重载 (Function overloading)\n\n在上一章讨论继承时，我们提到了“静态绑定”（static binding）。我们看到属于不同类的函数可以拥有相同的名称。然而，我们也可以为不同的函数参数拥有相同的函数名，所示：\n\
  \n```cpp\n#include <cstdio>\nvoid print(int a) {\n    printf(\"Int %d\\r\\n\", a);\n\
  }\nvoid print(float a) {\n    printf(\"Float %2.f\\r\\n\", a);\n}\nint main() {\n\
  \    print(2);\n    print(2.f);\n    return 0;\n}\n```\n\n在这个示例中，我们有两个 `print` 函数。其中一个以\
  \ `int` 作为参数，另一个以 `float` 作为参数。在这个示例中，我们有两个 `print` 函数。一个具有 `int` 参数，另一个具有 `float`。在调用处，编译器将根据参数选择\
  \ `print` 函数。\n\n在相同作用域内具有相同名称函数被称为“重载函数”（overloaded functions）。与其其使用不同的名称（如 `print_int`\
  \ 和 `print_float`），我们可以对两个函数使用相同的名称。\n\n为了区分这两个重载函数（一个接受 `int`，另一个接受 `float`），编译器采用名为“名字修饰”（name\
  \ mangling）的技术。名字修饰通过编码额外信息（如参数类型）来修改函数名称。这确保每个重载函数在编译代码中都有唯一的符号。如果我们检查之前示例的汇编输出，可以观察到修饰后的名称：\n\
  \n```\n_Z5printi:\n        mov     r1, r0\n        ldr     r0, .L2\n        b  \
  \     printf\n_Z5printf:\n        vcvt.f64.f32    d16, s0\n        ldr     r0, .L5\n\
  \        vmov    r2, r3, d16\n        b       printf\n```\n\n我们看到编译器为具有 `int` 和\
  \ `float` 参数的 `print` 函数分配了 `_Z5printi` 和 `_Z5printf` 标签。\n\n重载函数可以具有不同数量的参数。返回值不能用于函数重载。具有相同名称和相同参数的两个函数不能具有不同的返回值。以下代码将导致编译错误：\n\
  \n```cpp\nint print(int a);\nvoid print(int a);\n```\n\n这段代码会被编译器视为函数重复定义并导致错误。\n\
  \n函数重载是 C++ 的一项基础但强大的特性，提供了一种编译时或静态多态机制。\n\n## 与 C 的互操作性 (Interoperability with\
  \ C)\n\n在之前的章节中，能够在 Renode 模拟器中运行的代码示例同时使用了 C++ 和 C 代码。我们使用了供应商提供的 HAL 库以及 Arm 的**通用微控制器软件接口标准**\
  \ (**CMSIS**），它们都是用 C 语言编写并包含在 `platform` 文件夹中的。\n\n如果你查看 `CMakeLists.txt` 文件及其中的\
  \ `add_executable` 函数，你会看到列出了 `platform` 文件夹中的 C 文件以及几个 C++ 文件。构建项目将产生以下控制台输出：\n\
  \n\n\n\n\n```\n[  7%] Building C object CMakeFiles/bare.elf.dir/platform/STM32F0xx_HAL_Driver/Src/stm32f0xx_hal.c.o\n\
  [ 15%] Building C object CMakeFiles/bare.elf.dir/platform/STM32F0xx_HAL_Driver/Src/stm32f0xx_hal_cortex.c.o\n\
  [ 23%] Building C object CMakeFiles/bare.elf.dir/platform/STM32F0xx_HAL_Driver/Src/stm32f0xx_hal_gpio.c.o\n\
  [ 30%] Building C object CMakeFiles/bare.elf.dir/platform/STM32F0xx_HAL_Driver/Src/stm32f0xx_hal_rcc.c.o\n\
  [ 38%] Building C object CMakeFiles/bare.elf.dir/platform/STM32F0xx_HAL_Driver/Src/stm32f0xx_hal_uart.c.o\n\
  [ 46%] Building C object CMakeFiles/bare.elf.dir/platform/STM32F0xx_HAL_Driver/Src/stm32f0xx_hal_uart_ex.c.o\n\
  [ 53%] Building ASM object CMakeFiles/bare.elf.dir/platform/startup_stm32f072xb.s.o\n\
  [ 61%] Building C object CMakeFiles/bare.elf.dir/platform/src/stm32f0xx_hal_msp.c.o\n\
  [ 69%] Building C object CMakeFiles/bare.elf.dir/platform/src/stm32f0xx_it.c.o\n\
  [ 76%] Building C object CMakeFiles/bare.elf.dir/platform/src/system_stm32f0xx.c.o\n\
  [ 84%] Building CXX object CMakeFiles/bare.elf.dir/app/src/main.cpp.o\n[ 92%] Building\
  \ CXX object CMakeFiles/bare.elf.dir/hal/uart/src/uart_stm32.cpp.o\n[100%] Linking\
  \ CXX executable bare.elf\n```\n\n每个 C 和 C++ 文件都被视为一个编译单元，并分别由 C 和 C++ 编译器独立构建。编译后，所有的\
  \ C 和 C++ 对象文件被链接成单个 ELF 文件。\n\n### C++ 中的外部链接与语言链接\n\n可以从其他编译单元引用的变量和函数具有 `external\
  \ linkage`（外部链接）。这使得它们在编译器可以访问声明的情况下，能够与其他文件中的代码进行链接。它们还有一个名为 `language linkage`（语言链接）的属性。该属性允许\
  \ C++ 与 C 代码进行链接。C++ 中的 C 语言链接使用以下语法声明：\n\n```\nextern \"C\" {\nvoid c_func();\n\
  }\n```\n\n带有 C 语言链接的声明将根据 C 语言链接约定进行链接，防止发生符号修饰（以及其他问题），以确保与 C 编译单元内编译的代码正确链接。\n\
  \n### C++ 中的 C 标准库\n\nC++ 封装了 C 标准库，并提供了与 C 语言版本同名的头文件，但带有 `c` 前缀且没有扩展名。例如，C 语言头文件\
  \ `<stdlib.h>` 的 C++ 等效文件是 `<cstdlib>`。\n\n在 GCC 中，C++ 封装包含了 C 标准库头文件；例如，`<cstdio>`\
  \ 包含了 `<stdio.h>`。如果你深入 `<stdio.h>`，你会发现它使用 `__BEGIN_DECLS` 和 `__END_DECLS` 宏来保护函数声明。这些宏的定义如下：\n\
  \n```\n/* C++ 需要知道类型和声明是 C 而不是 C++  */\n#ifdef    __cplusplus\n## define __BEGIN_DECLS\
  \    extern \"C\" {\n## define __END_DECLS    }\n#else\n# define __BEGIN_DECLS\n\
  # define __END_DECLS\n#endif\n```\n\n在这里，我们可以看到标准 C 库头文件通过在使用 C++ 编译器时添加语言链接限定来处理\
  \ C++ 兼容性。这种做法也用于许多微控制器供应商提供的 HAL 实现中。如果你打开 `platform/STM32F0xx_HAL_Driver/Inc`\
  \ 中的任何 C 头文件，你会发现当声明被 C++ 编译器访问时，它们受到了 C 语言链接限定符的保护，如下所示：\n\n```\n#ifdef __cplusplus\n\
  extern \"C\" {\n#endif\n// Declarations\n#ifdef __cplusplus\n}\n#endif\n```\n\n\
  C 库经常被 C++ 程序使用，特别是在嵌入式领域，因此使用语言链接限定符保护它们始终是一个好主意。如果我们在 C++ 程序中使用内部未进行保护的 C 库，可以在\
  \ `include` 处对其进行保护，如下所示：\n\n```\nextern \"C\" {\n#include \"c_library.h\"\n}\n\
  ```\n\nC 语言链接限定符确保了使用 C 代码的 C++ 代码的正确链接，这在嵌入式项目中常见。\n\n# 参考文献\n\n在上一章中，我们简要提到了引用，但没有进行详细解释。引用是对象的别名；也就是说，它们引用对象，因此必须立即初始化。它们不是对象，所以没有指向引用的指针或引用数组。\n\
  \nC++ 中有两种不同类型的引用：`lvalue`（左值）引用和 `rvalue`（右值）引用。\n\n 值类别\n\nC++ 表达式具有 lvalue 或\
  \ rvalue 值类别。值类别有更详细的划分，但我们将保留这种具有历史起源的简单分类。\n\n`Lvalues`（左值）通常出现在赋值表达式的左侧，但并不总是如此。左值具有程序可以访问的地址。以下是左值的一些示例：\n\
  \n```\nvoid bar();\nint a = 42; // a 是左值\nint b = a; // a 也可以出现在右侧\nint * p = &a;\
  \ // 指针 p 是左值\nvoid(*bar_ptr)() = bar; // 函数指针 bar_ptr 是左值\n```\n\n`Rvalues`（右值）通常出现在赋值表达式的右侧。示例包括字面量、不返回引用的函数调用以及内置运算符调用。我们可以它们视为临时值。下面的示例显示了一些右值：\n\
  \n```\nint a = 42; // 42 是右值\nint b = a + 16; // a + 16 是右值\nstd::size_t size =\
  \ sizeof(int); // sizeof(int) 是右值\n```\n\n这里是另一个完整的示例，可以帮助你更好地理解右值：\n\n```cpp\n\
  #include <cstdio>\nstruct my_struct {\n    int a_;\n    my_struct() : a_(0) {}\n\
  \    my_struct(int a) : a_(a) {}\n    int& operator=(int a) {\n        a_ = a;\n\
  \        return *this;\n    }\n    int& a() { return a_; }\n};\n\nint main() {\n\
  \    my_struct s;\n    printf(\"a_ = %d\\r\\n\", s.a());\n    s = my_struct(16);\n\
  \    printf(\"a_ = %d\\r\\n\", s.a());\n    return 0;\n}\n```\n\n\n\n\n\n第一个声明用于通过拷贝\
  \ `value` 来初始化一个新的 vector 成员。第二个带有右值引用（rvalue reference）的声明将移动 `value`，这意味着一个新的\
  \ vector 成员将接管 `value` 对象动态分配的资源。让我们来看下面的示例来理解移动语义的基础：\n\n```\n#include <string>\n\
  #include <vector>\n#include <cstdio>\nint main()\n{\n    std::string str = \"Hello\
  \ world, this is move semantics demo!!!\";\n    printf(\"str.data address is %p\\\
  r\\n\", (void*)str.data());\n    std::vector<std::string> v;\n    v.push_back(str);\n\
  \    printf(\"str after copy is <%s>\\r\\n\", str.data());\n    v.push_back(std::move(str));\n\
  \    //v.push_back(static_cast<std::string&&>(str));\n    printf(\"str after move\
  \ is <%s>\\r\\n\", str.data());\n\n    for(const auto & s:v) {\n        printf(\"\
  s is <%s>\\r\\n\", s.data());\n        printf(\"s.data address is %p\\r\\n\", (void*)s.data());\n\
  \    }\n    return 0;\n}\n```\n\n在这个示例中，我们对 `std::vector<std::string>` 的 `push_back`\
  \ 方法进行了两次调用。第一次调用 `v.push_back(str);` 将 `str` 拷贝到 vector 中。执行此操作后，原始的 `str` 保持不变，这通过输出证实了这一点：\n\
  \n```\nstr.data address is 0x84c2b0\nstr after copy is <Hello world, this is move\
  \ semantics demo!!!>\n```\n\n第二次调用 `v.push_back(std::move(str));` 使用 `std::move`\
  \ 将 `str` 强制转换为右值引用。这告诉编译器 `str` 的资源可以被移动而不是拷贝。结果，`str` 的内部数据被转移到 vector 中的新字符串中，而\
  \ `str` 处于一个有效但未指定的状态，通常变为空：\n\n```\nstr after move is <>\ns is <Hello world, this\
  \ is move semantics demo!!!>\ns.data address is 0x84d330\ns is <Hello world, this\
  \ is move semantics demo!!!>\ns.data address is 0x84c2b0\n```\n\n在前面的输出中，我们还使用 `s.data()`\
  \ 和 `str.data()` 打印字符串底层字符数组的地址。以下是发生的情况：\n\n* 原始 `str` 的数据位于地址 `0x84c2b0`。\n* 将\
  \ `str` 拷贝到 vector 后，第一个元素 `v[0]` 在另一个地址（`0x84d330`）拥有它自己的数据拷贝，这证实了进行了深拷贝。\n\n移动之后，vector\
  \ 中的第二个元素 `v[1]` 现在指向了原始数据地址 `0x84c2b0`。这表明 `str` 的内部数据被移动到了 `v[1]` 而没有经过拷贝。这只是移动语义的浅一角；其中还有很多内容，但由于它主要用于管理动态分配的资源，我们不再对其进行详细介绍。\n\
  \n## 标准库容器和算法\n\n我们在之前的章节中已经讨论了 C++ 库中的一些容器，例如 `std::vector` 和 `std::array`。由于 `std::vector`\
  \ 依赖于动态内存分配，`std::array` 通常是嵌入式应用的首选容器。\n\n### 数组\n\n标准库中的数组在栈上分配一块连续的内存。我们可以将数组视为\
  \ C 风格数组的简单封装，它在类型内部包含了数组的大小。它是一个模板类型，使用底层数据类型和大小进行实例化。\n\n我们可以使用一种方法来访问数组的成员，如果使用的索引越界，该方法将抛出异常。这使得它成为\
  \ C 风格数组更安全的选择，因为它允许我们在运行时捕获并处理越界访问错误。如果禁用了异常，我们可以用我们的功能来设置一个全局的终止处理程序（terminate\
  \ handler）。我们在本书的*第 2 章讨论异常时*有机会看到这一点。\n\n我们可以使用 `std::array` 创建一个类似 vector 的容器，并将其与\
  \ `std::stack` 或 `std::priority` 队列等容器适配器配合。我们将新类型命名为 `fixed_vector`。它将继承自 `std::array`\
  \ 并实现 `push_back`、`pop_back`、`empty` 和 `end` 方法。下面是使用标准库数组实现我们新类型的代码：\n\n```\ntemplate\
  \ <typename T, size_t S> class fixed_vector : public std::array<T, S> {\n  public:\n\
  \    void push_back(const T &el) {\n        if(cnt_ < S) {\n            this->at(cnt_)\
  \ = el;\n            ++cnt_;\n        }\n    }\n    T &back() {\n        return\
  \ this->at(cnt_-1);\n    }\n    void pop_back() {\n        if(cnt_) {\n        \
  \    --cnt_;\n        }\n    }\n    auto end() {\n        return std::array<T, S>::begin()\
  \ + cnt_;\n    }\n    bool empty() const {\n        return cnt_ == 0;\n    }\n \
  \ private:\n    size_t cnt_;\n};\n```\n\n## 容器适配器\n\n栈是一个后进先出（LIFO）容器适配器，而优先级队列会在插入元素对其进行排序。我们可以通过下面的示例看到如何配合\
  \ `fixed_vector` 使用它们：\n\n### 栈和优先级队列\n\n```cpp\n#include <cstdio>\n#include <vector>\n\
  #include <queue>\n#include <stack>\n\nint main() {\n    std::priority_queue<int,\
  \ std::vector<int>, std::greater<int>> pq;\n    pq.push(10);\n    pq.push(4);\n\
  \    pq.push(8);\n    pq.push(1);\n    printf(\"从优先级队列弹出元素： \");\n    while(!pq.empty())\
  \ {\n        printf(\"%d \", pq.top());\n        pq.pop();\n    }\n    printf(\"\
  \\n\");\n\n    std::stack<int, std::vector<int>> st;\n    st.push(10);\n    st.push(4);\n\
  \    st.push(8);\n    st.push(1);\n    printf(\"从栈弹出元素 (LIFO): \");\n    while(!st.empty())\
  \ {\n        printf(\"%d \", st.top());\n        st.pop();\n    }\n    printf(\"\
  \\n\");\n    return 0;\n}\n```\n\n### 算法\n\nC++ 标准库在 `algorithm` 头文件中提供了大量的模板算法函数，这些函数可以与不同的容器良好工作。我们现在来看其中的一些。\n\
  \n### std::copy 和 std::copy_if\n\n`std::copy` 和 `std::copy_if` 用于从一个容器元素拷贝到另一个。`std::copy_if`\
  \ 还接受一个谓词函数，用于控制是否拷贝某个成员，如下例所示：\n\n```cpp\n#include <cstdio>\n#include <vector>\n\
  #include <array>\n#include <algorithm>\n#include <numeric>\nvoid print_container(const\
  \ auto& container) {\n    for(auto& elem: container) {\n       printf(\"%d \", elem);\n\
  \    }\n       printf(\"\\n\");\n}\nint main() {\n    std::array<int, 10> src{0};\n\
  \    std::array<int, 10> dst{0};\n    std::iota(src.begin(), src.end(), 0);\n  \
  \  std::copy_if(src.begin(), src.end(), dst.begin(),[] \n        (int x) {return\
  \ x > 3;});\n    print_container(src);\n    print_container(dst);\n    return 0;\n\
  }\n```\n\n\n\n\n`std::sort` 用于对容器中的元素进行排序。在下面的示例中我们将生成元素并对其进行排序：\n\n```cpp\nint\
  \ main() {\n    std::array<int, 10> src{0};\n    std::random_device rd;\n    std::mt19937\
  \ gen(rd());\n    std::uniform_int_distribution<> distrib(1, 6);\n    auto rand\
  \ = & -> int {\n        return distrib(gen);\n    };\n    std::transform(src.begin(),\
  \ src.end(), src.begin(), rand);\n    print_container(src);\n    std::sort(src.begin(),\
  \ src.end());\n    print_container(src);\n    return 0;\n}\n```\n\n在这个示例中，我们使用 `std::transform`\
  \ 填充 `src` 数组，它对 `src` 数组的每个成员应用 `rand` lambda 表达式。我们使用了 `random` 头文件中的类型来生成 1 到\
  \ 6 之间的随机数。用随机数填充数组后，我们使用 `std::sort` 对其排序。该程序可能的输出如下：\n\n```\n6 6 1 1 6 5 4 4 1\
  \ 1\n1 1 1 1 4 4 5 6 6 6\n```\n\n我们首先看到排序和应用 `std::sort` 之前数组中的值。我们本可以在 `for` 循环中填充初始数组，但我们利用这个机会在这里演示了\
  \ `std::transform`。\n\n这些是 C++ 标准库中的一些算法；还有许多其他算法可以有效地解决容器中的常见任务。\n\n## 总结\n\n在本章中，我们涵盖了\
  \ C++ 基础知识，如命名空间、函数重载、引用以及标准库容器和算法。我们还学习了 C 互操作如何在 C++ 程序中实现和使用。\n\n在下一章中，我们将学习\
  \ C++ 中的错误处理机制。\n\n# 7\n\n# 增强固件 – 实用的 C++ 错误处理方法\n\n为了确保固件的正常运行，我们必须处理来自特定特定代码、项目中使用的库以及我们自己代码的错误。错误码是\
  \ C 中标准的错误处理机制，在 C++ 中也被使用。然而，C++ 为我们提供了其他工具，最值得注意的是异常，由于二进制占用大且具有非确定性，异常在嵌入式项目中通常会被避免。尽管如此，我们将在本章中讨论\
  \ C++ 中的异常，以展示它们在错误处理过程中的优势。\n\n除了异常，C++ 还提供了更多错误处理选项，本章也将进行讨论。本章的目标是理解错误码的潜在问题并查看如何在\
  \ C++ 中缓解这些问题。\n\n在本章中，我们将涵盖以下主要主题：\n\n*   错误码和断言 (asserts)\n*   异常\n*   `std::optional`\
  \ 和 `std::expected`\n\n## 技术要求\n\n为了充分利用本章的内容，我建议建议使用 Compiler Explorer (`https://godbolt.org/`)。选择\
  \ `GCC` 作为你的编译器并将目标设置为 `x86`。这将允许你看到标准输出 (`stdio`) 结果并更好地观察代码的行为。由于我们使用了现代 `C++`\
  \ 特性，请确保在编译器选项框中添加 `-std=c++23` 以选择 `C++23` 标准。\n\nCompiler Explorer 让你轻松尝试代码、进行修改，并立即看到其对输出和生成的汇编的影响。示例可以在\
  \ GitHub (`https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter07`)\
  \ 上找到。\n\n## 错误码和断言\n\n`错误码` 是 `C` 中报告和处理错误的常用方法。它们在 `C++` 中仍然被使用。失败的函数通过枚举代码报告错误，这些代码由调用者检查并进行恰当处理。让我们从调用者和被调用者的角度来分析错误码是如何工作的。\n\
  \n返回错误的函数必须有一个暴露给调用者的错误列表。该列表在软件生命周期中维护，并可能会发生变化。枚举错误码可以被添加、删除或修改。调用者必须意识到被调用者返回的错误码，并需要处理它们。或者，如果它不知道如何处理错误，它应该在调用栈中进一步传播它。\n\
  \n让我们观察一个返回错误的函数简单示例，并分析这对比使用该函数的代码的影响：\n\n```cpp\nenum class error {\n    Ok,\n\
  \    Error1,\n    Error2,\n    Unknown\n};\nerror h() {\n    return error::Error1;\n\
  }\nerror g() {\n    auto err = h();\n    if(err!=error::Ok) {\n        if(err ==\
  \ error::Error1) {\n           // 直接处理错误\n        }\n        else if(err == error::Error2)\
  \ {\n            // 传播此错误\n            return err;\n        }\n        else {\n\
  \            // 未知错误\n            return error::Unknown;\n        }\n    }\n   \
  \ return error::Ok;\n}\nvoid f() {\n    auto err = g();\n    if(err==error::Ok)\
  \ {\n        printf(\"Succes\\r\\n\");\n    }\n    else {\n        // 处理错误\n   \
  \ }\n}\n```\n\n在前面的示例中，`h` 函数返回一个 `enum class error` 类型的错误。（注：原文此处存在大量重复，翻译已按要求去重）。\n\
  \n\n\n`全局错误处理器` 可以实现为自由函数。它们在全系统范围内用于处理不可恢复的错误，以及当由于错误严重而需要停止固件执行时。\n\n让我们来看一个使用加速度计的固件示例。如果与加速度计的\
  \ `I²C` 通信出现任何问题，那么继续执行代码将毫无意义——固件将向用户显示消息并终止：\n\n```cpp\n#include <cstdio>\n#include\
  \ <cstdint>\n#include <cstdlib>\nint i2c_read(uint8_t *data, size_t len) {\n   \
  \ return 0;\n}\nnamespace error {\n    struct i2c_failed{};\n    struct spi_failed{};\n\
  \    void handler(i2c_failed err) {\n        printf(\"I2C error!\\r\\n\");\n   \
  \     exit(1);\n    }\n    void handler(spi_failed err) {\n        printf(\"SPI\
  \ error!\\r\\n\");\n        exit(1);\n    }\n};\nclass accelerometer {\npublic:\n\
  \    struct data {\n        int16_t x;\n        int16_t y;\n        int16_t z;\n\
  \    };\n    data get_data() {\n        uint8_t buff[6];\n        if(i2c_read(buff,\
  \ 6) != 6) {\n            error::handler(error::i2c_failed{});\n        }\n    \
  \    return data{};\n    }\n};\nint main () {\n    accelerometer accel;\n    auto\
  \ data = accel.get_data();\n    return 0;\n}\n```\n\n在上述示例中，我们有一个带有 `get_data` 方法的\
  \ `accelerometer` 类，该方法使用了 C 语言中特定厂商 HAL 的 `i2c_read` 函数（假设情况如此）。\n\n`i2c_read`\
  \ 函数返回读取的字节数。在我们的示例中，返回值被硬编码为 `0`，以便模拟加速度计（或 `I²C` 总线）的错误行为。如果 `i2c_read` 返回的数字与请求的字节数不同，`get_data`\
  \ 将调用 `error::handler`。\n\n我们使用标签分发（tag-dispatching）机制实现了一个错误处理器。我们通过所谓的标签或空类型来重载\
  \ `error::handler` 函数。在我们的示例中，我们有两个标签 `i2c_failed` 和 `spi_failed`，以及两个重载的错误处理器。与使用\
  \ `enum` 定义错误码相比，标签分发有几个优势：\n\n-   我们需要为代码中使用的每个标签重载错误处理器。每种错误类型都单独地实现了错误处理器。这增加了代码的可读性。\n\
  -   如果我们调用了一个未重载的错误处理器，编译将失败，迫使我们实现它。\n\n在我们的示例中，错误处理器将使用 `printf` 函数打印消息并调用 `exit`\
  \ 函数，从而有效地终止程序。在现实世界中，如何处理错误取决于应用程序。例如，对于医疗设备，如果关键操作在发生错误后变得不，我们将首先尝试从错误中恢复。\n\n\
  如果恢复失败，系统将进入关键错误状态，提醒医疗人员并优雅地终止治疗操作。\n\n`I²C` 总线上的错误或更通用地说，与外部设备的通信失败必须通过稳健的错误处理机制进行适当处理。\n\
  \n另一方面，存在某些指示编程错误的条件——如果代码正确，这些情况永远不应该发生。这些包括对前置条件的违反，例如由于代码中的逻辑错误导致输入参数超出预期边界。在这种情况下继续执行可能会导致未定义行为或系统不稳定。为了在开发期间检测这些编程错误，我们使用断言（asserts）。\n\
  \n### 断言 (Assert)\n\n断言主要用于开发期间，通过验证代码中特定点的某些条件为真来检测编程错误。它们通过在发生意外条件时停止执行，帮助识别逻辑错误和错误的假设。标准库中的\
  \ `<cassert>` 定义了一个 `assert` 宏。它被用于检查逻辑表达式，如果逻辑表达式为假，它会打印诊断信息并调用 `std::abort`，从而有效地终止程序。\n\
  \n为了更好地理解断言以及如何使用它们，让我们来看下面的代码示例：\n\n```cpp\n#include <cassert>\n#include <cstdint>\n\
  enum class option : std::uint8_t {\n    Option1 = 0,\n    Option2,\n    Option3,\n\
  \    Last\n};\noption uint8_to_option(uint8_t num) {\n    assert(num < static_cast<uint8_t>(option::Last));\n\
  \    return static_cast<option>(num);\n}\nint main() {\n    const option opt = uint8_to_option(3);\n\
  \    return 0;\n}\n```\n\n在上述示例中，我们定义了一个以 `uint8_t` 为底层类型的 `option` 枚举类。我们将使用它允许用户在网络接口上选择选项，并且我们确保从\
  \ `uint8_t` 到 `option` 枚举的转换始终正确。如果 `uint8_to_option` 函数接收到的 `uint8_t` 参数不小于 `option::Last`，将触发断言。\n\
  \n在示例中，我们使用参数 `3` 调用了 `uint8_to_option`，它并不小于 `option::Last`，这意味着 `assert` 宏将打印以下诊断信息并调用\
  \ `std::abort`：\n\n```assertion \"num < static_cast<uint8_t>(option::Last)\" failed:\
  \ file \"/home/amar/Cpp-in-Embedded/Chapter07/error_handling/app/main.cpp\", line\
  \ 21, function: option uint8_to_option(uint8_t)\n```\n\n\n\n\n```cpp\nvoid log_pc_and_halt(std::uint32_t\
  \ pc) {\n    printf(\"Assert at 0x%08lX\\r\\n\", pc);\n    while(true) {}\n}\n#define\
  \ light_assert(expr)         \\\n        (static_cast<bool> (expr)  \\\n       \
  \ ? void (0)                 \\\n        : log_pc_and_halt(hal::get_pc())    \\\n\
  \        )\n```\n\n我们定义了一个名为 `light_assert` 的宏，它不再调用 `__assert_failed`，而是调用 `log_pc_and_halt`。它将\
  \ `hal::get_pc` 的返回值作为参数传递给 `log_pc_and_halt`。为了看到这段代码的运行，你可以查看 `Chapter07/error_handling`\
  \ 项目中的示例。\n\n本章的项目已经配置好，你可以配置它使用不同的主 C++ 文件，并使用 `CMake` 配置将使用哪一个。让我们使用以下命令启动 Docker\
  \ 容器：\n\n```\n$ docker start dev_env\n$ docker exec -it dev_env /bin/bash\n```\n\
  \n这应该会让我们进入 Docker 终端。运行 `ls –l` 以确保 `Cpp-in-Embedded-Systems` 仓库已克隆。如果没有，请使用以下命令克隆：\n\
  \n```\n$ git clone https://github.com/PacktPublishing/Cpp-in-Embedded-Systems.git\n\
  ```\n\n启动 Visual Studio Code，将其附加到运行中的容器，并按照 第 4 章 中的描述打开 `Chapter07/error_handling\
  \ project`，然后在 Visual Studio Code 终端中运行以下命令，或直接在容器终端中运行：\n\n```\n$ cd Chapter07/error_handling\n\
  $ cmake -B build -DCMAKE_BUILD_TYPE=Debug -DMAIN_CPP_FILE_NAME=main_assert.cpp\n\
  $ cmake --build build --target run_in_renode\n```\n\n上述命令将使用 `app/src/main_assert.cpp`\
  \ 文件构建固件并在 Renode 模拟器中运行它。你应该在终端中看到类似下面的输出：\n\n```\n14:11:06.6293 [INFO] usart2:\
  \ [host: 0.31s (+0.31s)|virt: 0s (+0s)] Assert example\n14:11:06.6455 [INFO] usart2:\
  \ [host: 0.32s (+15.87ms)|virt: 0.11ms (+0.11ms)] Assert at 0x08000F74\n```\n\n\
  正如我们所见，断言评估的表达式为假，并打印出了程序计数器值 `0x08000F74`。我们可以以下命令将此值转换为源文件的行号：\n\n```\n$ arm-none-eabi-addr2line\
  \ --exe bare.elf 0x08000F74\n```\n\n这将产生如下输出：\n\n```\n/workspace/Cpp-in-Embedded-Systems/Chapter07/error_handling/app/src/main_assert.cpp:30\
  \ (discriminator 1)\n```\n\n如你所示，我们通过这种方法并仅记录 4 字节的数据（地址），就能获取断言源码的确切行号。在此实现中，`log_pc_and_halt`\
  \ 仅打印地址。在生产实现中，我们将地址存储在非易失性内存中并将其用于事后调试。\n\n`hal::get_pc()` 函数用 `inline` 修饰符声明。我们使用\
  \ `inline` 是作为编译器的提示，将函数指令直接插入到调用点，而不是进行函数调用。编译器并不一定需要遵循我们的意图，这可以通过使用 `O0` 优化级别构建此示例来观察到。\n\
  \n### 练习题！\n\n作为一个练习，编辑 `CMakeLists.txt` 中的 `CMAKE_C_FLAGS_DEBUG` 和 `CMAKE_CXX_FLAGS_DEBUG`，用\
  \ `O0` 代替 `Og`。构建并运行程序，然后在输出上运行 `addr2line` 工具。为了缓解这一疑虑，你可以定义一个宏来代替 `hal::get_pc()`\
  \ 函数。\n\n我们使用断言来捕获编程错误——如果代码正确，这些情况永远不应该发生。它们通常被用于验证关键函数内部的假设和不变性。断言的主要目的是调试；它们帮助开发者在开发阶段发现并修复错误。然而，正如我们所见，自定义断言也可以为生产环境构建提供宝贵的见解，用于事后分析。虽然断言对于开发期间检测编程错误很有用，但它们并不是生产代码适当错误处理的替代品。错误代码可能是繁琐的，因为它们需要在调用栈上手动传播错误。C++\
  \ 异常作为这些问题的解决方案，提供了一种结构化的处理错误的方法，而不会让代码充斥错误检查逻辑。\n\n我们将介绍 C++ 异常，以便更好地理解它们在错误处理方面的优势。\n\
  \n## 异常\n\nC++ 中的异常是一种错误处理机制，基于抛出和捕获任意类型对象的原理。从标准库抛出的所有异常都派生于 `<exception>` 头文件中定义的\
  \ `std::exception` 类。我们将可能抛出异常的代码放在 `try` 块中，并在 `catch` 块中定义我们想要捕获的异常类型。\n\n```cpp\n\
  try {\n    // 可能抛出异常的代码\n} catch (const std::exception& e) {\n    // 处理异常\n}\n```\n\
  \n\n\n你可以按照以下指令在 Renode 模拟器中运行前面的示例。启动 Visual Studio Code，将其附加到正在运行的容器，按照 `*第 4\
  \ 章` 中的描述打开 `Chapter07/error_handling project`，并在 Visual Studio Code 终端中运行以下命令，或直接在容器终端中运行它们：\n\
  \n```\n$ cd Chapter07/error_handling\n$ cmake -B build -DCMAKE_BUILD_TYPE=Debug\
  \ -DMAIN_CPP_FILE_NAME=main_exceptions.cpp\n$ cmake --build build --target run_in_renode\n\
  ```\n\n异常传播（Exception propagation）对于那些我们不想手动使用错误代码在软件层之间传播的错误非常有用。然而，异常的问题在于，它们不像错误代码那样在函数声明中是可见的。我们需要依赖良好的文档来了解哪些函数会抛出错误，以及这些错误在何处被处理。\n\
  \n有一种说法，异常是用于处理极罕见的异常错误的。但什么是异常错误呢？这取决于库、应用程序和用例。这很难概括。加速度计读取失败可能是一个可恢复的错误，可以通过重置来解决。我们可以在\
  \ `I²C` 总线通信失败时抛出异常，捕获此错误的上层可能会决定尝试重置加速度计。\n\n通过 `DAC` 控制升压电压调节器输出失败也可能是可恢复的，但我们可能希望终止程序，因为我们正在实现一种医疗设备，这可能是防止对用户造成任何伤害的最佳行动。在这种情况下，我们希望尽可能地反应，异常传播和栈回溯（stack\
  \ unwinding）可能不是理想的，因此我们将依靠全局处理器或断言（asserts）。\n\n异常是有代价的，无论是在 Flash 还是 RAM 内存消耗上，而且执行时间并不总是能得到保证，如果我们处理的是硬实时系统，这就是一个问题。但它们也解决了错误传播问题并强制了错误处理。如果某个特定类型没有\
  \ `catch` 句，将调用 `std::terminate_handler`，程序将不会继续执行。\n\n错误代码和异常可以共存，而且它们经常共存。嵌入式\
  \ C++ 项目经常使用 C 语言库或旧的 C++ 代码，这些代码通常使用错误代码。我们可以通过将异常用于极罕见的错误来获益，为我们的固件增加额外的健壮性。尽管如此，是否使用异常的决定受到可用内存资源以及我们正在从事的项目类型的影响。\n\
  \n接下来，我们将涵盖 C++ `std::optional` 和 `std::expected` 模板类，它们被用函数的返回类型。\n\n# std::optional\
  \ 和 std::expected\n\nC++17 引入了 `std::optional`，它是一个模板类，要么拥有值，要么什么都没有。这对于函数可能返回也可能不返回值的情况非常有用。为了更好地理解它，让我们来看下面的示例：\n\
  \n```\n#include <cstdio>\n#include <optional>\nstruct sensor {\n    struct data\
  \ {\n        int x;\n        int y;\n    };\n    static inline bool ret_val = true;\n\
  \    static std::optional<data> get_data() {\n        ret_val = !ret_val;\n    \
  \    if(ret_val) {\n            return data{4, 5};\n        }\n        else {\n\
  \            return std::nullopt;\n        }\n    }\n};\nint main()\n{\n    const\
  \ auto get_data_from_main = [] () {\n        auto result = sensor::get_data();\n\
  \        if(result) {\n            printf(\"x = %d, y = %d\\r\\n\", (*result).x,\
  \ (*result).y);\n        }\n        else {\n            printf(\"No data!\\r\\n\"\
  );\n        }\n    };\n    get_data_from_main();\n    get_data_from_main();\n  \
  \  return 0;\n}\n```\n\n在前面的示例中，我们有一个带有 `get_data` 方法的 `sensor` 结构体，它在满足某些条件时返回值，否则不返回。传感器并没有错误状态，它只是还没有准备好数据。为此，我们使用\
  \ `std::optional<data>` 来声明传感器可能返回也不返回 `data` 结构体。我们使用 `ret_val` 布尔值来模拟每秒调用 `get_data`\
  \ 函数时数据就绪。\n\n在 `main` 函数中，我们创建了 `get_data_from_main` Lambda 表达式，它调用了传感器的 `get_data`。`std::optional<data>`\
  \ 返回值在 `if` 语句中转换为布尔值。如果转换为 `true`，则意味着它持有数据，否则它什么都不持有。我们通过解引用 `result` 对象来访问 `data`\
  \ 类型。\n\nC++ 23 引入了 `std::expected<T, E>`，它是一个模板类，要么持有类型为 `T` 的预期对象，要么持有类型为 `E`\
  \ 的非预期对象。为了更好地理解这一点，让我们来看下面的示例：\n\n```cpp\n#include <cstdio>\n#include <expected>\n\
  struct ble_light_bulb {\n    enum class error {\n        disconnected,\n       \
  \ timeout\n    };\n    struct config {\n        int r;\n        int g;\n       \
  \ int b;\n    };\n    bool ret_val;\n    std::expected<config, error> get_config()\
  \ {\n        ret_val = !ret_val;\n        if(ret_val) {\n            return config\
  \ {10, 20, 30};\n        }\n        else {\n            return std::unexpected(error);\n\
  \        }\n    }\n};\nint main()\n{\n    ble_light_bulb bulb;\n    const auto get_config_from_main\
  \ = [&bulb]() {\n        auto result = bulb.get_config();\n        if(result.has_value())\
  \ {\n            auto conf = result.value();\n            printf(\"Config %d, g\
  \ %d, b %d\\r\\n\", conf.r, conf.g, conf.b);\n        } else {\n            auto\
  \ err = result.error();\n            if(err == ble_light_bulb::error::disconnected)\
  \ {\n                printf(\"The bulb is disconnected!\\r\\n\");\n            }\
  \ else if(err == ble_light_bulb::error::timeout) {\n                printf(\"Timeout!\\\
  r\\n\");\n            }\n        }\n    };\n    get_config_from_main();\n    return\
  \ 0;\n}\n```\n\n在前面的示例中，我们有一个 `ble_light_bulb` 结构体，这是一个 BLE（低功耗蓝牙）灯泡，带有 `get_config`\
  \ 方法，它通过连接读取某些配置。该方法返回 `config` 或一个 `error`。在 `main` 函数中，我们定义了 `get_config_from_main`\
  \ Lambda 表达式，它调用了 `ble_light_bulb` 对象的 `get_config`。我们对 `std::expected` 返回对象使用 `has_value`\
  \ 方法来检查它是否持有预期值。我们使用 `value` 方法访问预期值或使用 `error` 方法访问 `error`。\n\n你可以按照以下指令在 Renode\
  \ 模拟器中运行前面的示例。启动 Visual Studio Code，将其附加到正在运行的容器，按照 `*第 4 章*` 中的描述打开 `Chapter07/error_handling\
  \ project`，并在 Visual Studio Code 终端中运行以下命令，或直接在容器终端中运行它们：\n\n```\n$ cd Chapter07/error_handling\n\
  $ cmake -B build -DCMAKE_BUILD_TYPE=Debug -DMAIN_CPP_FILE_NAME=main_expected.cpp\n\
  $ cmake --build build --target run_in_renode\n```\n\n## 总结\n\n在本章中，我们分析了 C++ 中不同的错误处理策略。涵盖了错误代码、全局处理器、断言、异常、`std::optional`\
  \ 和 `std::expected`。我们学习了它们的优缺点以及在什么情况下适用它们。\n\n在下一章中，我们将详细介绍模板。\n\n## 加入我们的 Discord\
  \ 社区\n\n加入我们的社区 Discord 空间，与作者和其他读者进行讨论：\n\n[`packt.link/embeddedsystems`](https://packt.link/embeddedsystems)\n\
  \n![](img/QR_code_Discord.png)\n\n# 第 3 部分\n\n# C++高级概念\n\n在基础的基础上，本部分介绍了模板等高级概念，包括静态多态和编译时计算。它还指导你如何提高\
  \ C++ 的类型安全性，并使用 Lambda 编写表达丰富的代码。这些高级技术将通过实践示例进行教学。\n\n本部分包含以下章节：\n\n\n\n\n- 第\
  \ 8 章, 使用模板构建泛型和可重用代码\n- 第 9 章, 使用强类型提高类型安全性\n- 第 10 章, 使用 Lambda 编写具表现力的代码\n- 第\
  \ 11 章, 编译时计算\n\n# 8. 使用模板构建泛型和可重用代码\n\n在本书之前的示例中，我们使用了类模板，但没有进行详细解释。到目前，你应该对 `C++`\
  \ 中的模板有了基本的了解，并知道如何使用标准库中的模板容器类来根据不同的底层类型对容器进行特化。我们还涵盖了 `std::optional` 和 `std::expected`\
  \ 模板类，我们可以用它们来处理函数的不同返回类型。\n\n正如你所看到的，模板在 `C++` 标准库中被大量使用。它们允许我们为不同的类型实现相同的功能，使我们的代码具有重用性和泛性，这是\
  \ `C++` 的优势之一。模板是一个极其复杂的话题；关于 `C++` 中的模板和元编程，已经有整本书的著作了。本章将帮助你更详细地理解 `C++` 中的模板。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n* 模板基础\n* 元编程\n* 概念 (Concepts)\n* 编译时多态\n\n## 技术要求\n\n为了充分利用本章的内容，我强烈建议在阅读示例时使用\
  \ Compiler Explorer ([`godbolt.org/`](https://godbolt.org/))。为 `x86` 架构选择 `GCC`\
  \ 作为你的编译器。这将允许你看到标准输出并更好地观察代码的行为。由于我们使用的是现代 `C++`，请确保通过在编译器选项框中添加 `-std=c++23` 来选择\
  \ `C++23` 标准。\n\nCompiler Explorer 让你能够轻松尝试代码、调整代码，并立即看到它们如何影响输出和生成的汇编代码。本章的示例可以在\
  \ GitHub 上找到 ([`github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter08`](https://github.com/PacktPublishing/Cpp-in-Embedded-Systems/tree/main/Chapter08))。\n\
  \n## 模板基础\n\n“模板”（template）一词的定义是“一种用于、模式或模具（如薄板或板），用作所制物品形状的指南”。这个定义可以适用于 `C++`\
  \ 中的模板。\n\n在 `C++` 中，模板作为函数和类的模式或模具，允许创建实际的函数和类。从这个角度来看，模板本身并不是真实的函数或类型；相反，它们是生成具体函数和类型的指南。为了更好地理解这个定义，让我们来看下面的代码示例：\n\
  \n```\n#include <cstdio>\ntemplate<typename T>\nT add(T a, T b) {\n   return a +\
  \ b;\n}\nint main() {\n    int result_int = add(1, 4);\n    float result_float =\
  \ add(1.11f, 1.91f);\n    printf(\"result_int = %d\\r\\n\", result_int);\n    printf(\"\
  result_float = %.2f\\r\\n\", result_float);\n    return 0;\n}\n```\n\n在这个示例中，我们有一个带有模板类型参数\
  \ `T` 的模板函数 `add`。在 `main` 函数中，我们看到了对 `add` 函数的两次调用：\n\n* 第一次调用具有整数参数，返回值存储在 `result_int`\
  \ 中\n* 第二次调用具有浮点数参数，返回值存储在 `result_float` 浮点变量中\n\n现在，我们之前说过模板类型和函数不是实际的类型和函数，那么如果它不是真实的函数，我们如何调用这个模板函数呢？\n\
  \n### 调用模板函数\n\n在这个示例中，当编译器看到对 `add` 模板函数的调用时，它会推导出模板参数并替换模板参数，在本例中，类型 `T` 在第一次调用时替换为类型\
  \ `int`，在第二次调用 `add` 时替换为 `float`。在参数推导后，模板被实例化；也就是说，编译器创建了 `add` 函数的两个实例：一个以整数为参数，另一个以浮点数为参数。我们可以从这里前面示例的汇编输出看到：\n\
  \n```\n_Z3addIiET_S0_S0_:\n        push    rbp\n        mov     rbp, rsp\n     \
  \   mov     DWORD PTR [rbp-4], edi\n        mov     DWORD PTR [rbp-8], esi\n   \
  \     mov     edx, DWORD PTR [rbp-4]\n        mov     eax, DWORD PTR [rbp-8]\n \
  \       add     eax, edx\n        pop     rbp\n        ret\n_Z3addIfET_S0_S0_:\n\
  \        push    rbp\n        mov     rbp, rsp\n        movss   DWORD PTR s[rbp-4],\
  \ xmm0\n        movss   DWORD PTR [rbp-8], xmm1\n        movss   xmm0, DWORD PTR\
  \ [rbp-4]\n        addss   xmm0, DWORD PTR [rbp-8]\n        pop     rbp\n      \
  \  ret\n```\n\n在先的汇编输出中，我们看到了 `add` 函数的两个实例：接受整数的 `_Z3addIiET_S0_S0_` 和接受浮点数的 `_Z3addIfET_S0_S0_`。这就是\
  \ `C++` 模板的基本原理。\n\n在前面的基础上，如果我们尝试调用一个没有定义 `operator+` 的 `add` 函数会发生什么？让我们来看下面的示例：\n\
  \n```cpp\nstruct point {\n    int x;\n    int y;\n};\nint main() {\n    point a{1,\
  \ 2};\n    point b{2, 1};\n    auto c = add(a, b);\n    return 0;\n}\n```\n这将导致编译错误：`no\
  \ match for 'operator+'`。我们可以通过如下方式为 `point` 结构体定义 `operator+` 来解决这个问题：\n\n```cpp\n\
  struct point {\n    int x;\n    int y;\n    point operator+(const point& other)\
  \ const {\n        return point{x + other.x, y + other.y};\n    }\n    void print()\
  \ {\n        printf(\"x = %d, y = %d\\r\\n\", x, y);\n    }\n};\n```\n\n在前面的实现中，我们为\
  \ `point` 结构体定义了 `operator+`，并且定义了 `print` 函数，这有助于我们打印点。之后我们可以成功编译示例。\n\n如果我们出于某种原因，希望\
  \ `add` 函数在与 `point` 使用时的行为与仅仅应用 `operator+` 不同怎么办？假设我们想在求和后将 `x` 和 `y` 都增加 1。我们可以使用模板特化来实现。\n\
  \n### 模板特化\n\n**模板特化** 允许我们为特定类型提供模板函数的实现，如下所示的为 `point` 类型特化的 `add` 函数示例：\n\n```cpp\n\
  template<>\npoint add<point>(point a, point b) {\n   return point{a.x+b.x+1, a.y+b.y+1};\n\
  }\n```\n\n在这种情况下，当用 `point` 类型参数调用 `add` 函数时，编译器将跳过通用模板实例化，而是使用这个特化版本。这允许我们为 `point`\
  \ 对象定制函数行为，在两个 `point` 实例相加时每个坐标都增加 1。现在让我们来看完整的 `main` 函数：\n\n```cpp\nint main()\
  \ {\n    point a{1, 2};\n    point b{2, 1};\n    auto c = add(a, b);\n    c.print();\n\
  \    static_assert(std::is_same_v<decltype(c), point>);\n    return 0;\n}\n```\n\
  \n\n\n\n如果我们运行上一步中带有模板特化的示例，将得到以下输出：\n\n```\nx = 4, y = 4\n```\n\n编译器对 `point` 类型使用了函数特化。模板特化使模板成为一种灵活的工具，允许我们在需要时为编译器提供自定义实现。\n\
  \n在上前的示例中，我们可以看到对于变量 `c`，我们使用了 `auto` 作为类型说明符。`auto` 关键字引入于 C++11，在使用时，编译器从初始化表达式中推导出变量的实际类型。为了确认变量\
  \ `c` 的推导类型为 `point`，我们使用了 `static_assert`，它执行编译时断言检查。\n\n作为 `static_assert` 的参数，我们使用了元编程库中的类型\
  \ trait `std::is_same_v`，它检查两个类型是否相同，如果相同则求值为 `true`。我们使用 `decltype` 说明符来确定 `c`\
  \ 的类型，它在编译时获取表达式的类型。这允许我们验证为 `c` 推导的类型确实是 `point`。如果此断言失败，编译器将生成一个错误。\n\n## 模板元编程\n\
  \n`Template metaprogramming`（模板元编程）涉及使用模板根据模板参数中使用的类型在编译时生成不同的函数、类型和常量。模板元编程是现代\
  \ C++ 库中大量使用的高级技术。它可能会让人无从从，所以如果它看起来难以理解也是完全没问题的。将此视为对这一有趣话题的介绍和探索。\n\n让我们回到 `add`\
  \ 模板函数的示例。如果我们想强制该模板函数仅用于整数和浮点数等算术类型，可以做什么？\n\n元编程库中的 `<type_traits>` 头文件为我们提供了\
  \ `std::enable_if` 模板类型，它接受两个参数：一个布尔值和一个类型。如果布尔值为 `true`，则结果类型将具有一个公共 `typedef`\
  \ 成员 `type`。让我们来看下面的示例：\n\n```cpp\n#include <type_traits>\ntemplate<typename T>\n\
  std::enable_if<true, T>::type\nadd(T a, T b) {\n   return a + b;\n}\n```\n\n在上前的示例中，我们用\
  \ `std::enable_if` 代替了 `add` 模板函数的返回类型。由于我们将布尔参数设置为 `true`，它将具有公共的 `typedef` 类型\
  \ `T`，这意味着 `add` 函数模板的返回类型将是 `T`。\n\n我们将使用类型 trait 类模板 `std::is_arithmetic<T>` 来扩展这个示例，如果\
  \ `T` 是算术类型，它将有一个名为 `value` 的公共布尔值并设置为 `true`。上前的示例将产生以下代码：\n\n```cpp\ntemplate<typename\
  \ T>\nstd::enable_if<std::is_arithmetic<T>::value, T>::type\nadd(T a, T b) {\n \
  \  return a + b;\n}\n```\n\n在上前的示例中，我们没有直接硬编码 `true` 作为 `std::enable_if` 的条件，而是使用\
  \ `std::is_arithmetic<T>::value`。让我们看看使用该模板函数和上一步中 `point` 类型的 `main` 函数：\n\n```cpp\n\
  int main() {\n    auto a = add(1, 2); // OK\n    auto b = add(1.1, 2.1); // OK\n\
  \    point p_a{1, 2};\n    point p_b{2, 1}; \n    auto p_c = add(p_a, p_b); // compile-error\n\
  \    return 0;\n}\n```\n\n如果我们尝试编译这段代码，编译将失败并带有包含以下内容的冗错误消息：\n\n```\n<source>: In\
  \ function 'int main()':\n<source>:30:17: error: no matching function for call to\
  \ 'add(point&, point&)'\n  30 |     auto c = add(p_a, p_b); // compile-error\n \
  \    |              ~~~^~~~~~~~~~\n<source>:30:17: note: there is 1 candidate\n\
  <source>:19:1: note: candidate 1: 'template<class T> typename std::enable_if<std::is_arithmetic<_Tp>::value,\
  \ T>::type add(T, T)'\n  19 | add(T a, T b) {\n     | ^~~\n<source>:19:1: note:\
  \ template argument deduction/substitution failed:\n<source>: In substitution of\
  \ 'template<class T> typename std::enable_if<std::is_arithmetic<_Tp>::value, T>::type\
  \ add(T, T) [with T = point]':\n<source>:30:17:   required from here\n  30 |   \
  \  auto c = add(p_a, p_b); // compile-error\n     |              ~~~^~~~~~~~~~\n\
  <source>:19:1: error: no type named 'type' in 'struct std::enable_if<false, point>'\n\
  \  19 | add(T a, T b) {\n     | ^~~\n```\n\n上前的编译器错误看起来很令人生畏，而且难以阅读。这是模板臭名的问题之一。在处理这个问题之前，让我们专注于分析在这种情况下发生了什么。\n\
  \n模板参数推导/替换失败，因为 `std::is_arithmetic<point>::value` 的结果为 `false`。上前的编译器错误看起来很令人生畏，而且难以阅读。这是模板臭名的问题之一。\n\
  \n\n\n\n`Concepts`（概念）是模板参数要求的命名集合。它们在编译时进行求值，并在重载解析期间用于选择最合适的函数重载；也就是说，它们被用于确定哪个函数模板将被实例化并编译。\n\
  \n我们将为算术类型创建一个概念，并在我们的 `add` 模板函数中使用它，如下所示：\n\n```\ntemplate<typename T>\nconcept\
  \ Arithmetic = std::is_arithmetic_v<T>;\ntemplate<Arithmetic T>\nT add(T a, T b)\
  \ {\n    T result = a + b;\n    if constexpr (std::is_integral_v<T>) {\n       \
  \ printf(\"%d + %d = %d\\r\\n\", a, b, result);\n    } else if constexpr (std::is_floating_point_v<T>)\
  \ {\n        printf(\"%.2f + %.2f = %.2f\\r\\n\", a, b, result);\n    }\n    return\
  \ a + b;\n}\n```\n\n在前面的代码中，我们创建了 `Arithmetic` 概念并将其用于 `add` 函数模板中，以对模板类型 `T` 施加限制。`add`\
  \ 模板函数现在更易于读了。从模板声明中可以看出，类型 `T` 必须满足 `Arithmetic` 概念的要求，这使得代码更容易易读和理解。\n\n概念不仅让代码更易于读，还提高了编译器错误的可读性。如果我们尝试对类型\
  \ `point` 调用函数模板 `add`，我们现在会得到一个类似于下方的错误：\n\n```\n<source>: In function 'int main()':\n\
  <source>:41:17: error: no matching function for call to 'add(point&, point&)'\n\
  \  41 |     auto c = add(p_a, p_b); // compile-error\n     |              ~~~^~~~~~~~~~\n\
  <source>:41:17: note: there is 1 candidate\n<source>:22:3: note: candidate 1: 'template<class\
  \ T>  requires  Arithmetic<T> T add(T, T)'\n  22 | T add(T a, T b) {\n     |   ^~~\n\
  <source>:22:3: note: template argument deduction/substitution failed:\n<source>:22:3:\
  \ note: constraints not satisfied\n<source>: In substitution of 'template<class\
  \ T>  requires  Arithmetic<T> T add(T, T) [with T = point]':\n<source>:41:17:  \
  \ required from here\n  41 |     auto c = add(p_a, p_b); // compile-error\n    \
  \ |              ~~~^~~~~~~~~~\n<source>:18:9:   required for the satisfaction of\
  \ 'Arithmetic<T>' [with T = point]\n<source>:18:27: note: the expression 'is_arithmetic_v<T>\
  \ [with T = point]' evaluated to 'false'\n  18 | concept Arithmetic = std::is_arithmetic_v<T>;\n\
  \     |                      ~~~~~^~~~~~~~~~~~~~~~~~\n```\n\n与之前没有使用概念时遇到的错误相比，前面的编译器错误要更容易读和理解发生了什么。我们可以轻松地追溯错误根源，即\
  \ `Arithmetic` 概念施加的约束不满足 `point` 类型。\n\n接下来，我们将讨论编译时多态，并看看如何利用概念来帮助我们强制执行强接口。\n\
  \n## 编译时多态\n\n在第 5 章中，我们讨论了动态或运行时多态。我们用它为 `uart` 定义了一个接口，该接口由 `uart_stm32` 类实现。`gsm_lib`\
  \ 类仅依赖于 `uart` 接口，而不依赖于具体的实现（包含在 `uart_stm32` 中）。这被称为**松耦合**，允许我们为 `gsm_lib` 类拥有可移植的代码。\n\
  \n我们可以轻松地在不同的硬件平台上为 `gsm_lib` 提供另一个 `uart` 接口实现。这一原理被称为**依赖倒置**。它指出高层模块（类）不应该依赖于底层模块，两者都应该依赖于抽象（接口）。我们可以通过\
  \ C++ 中的继承和虚函数来实现这一原理。\n\n虚函数会导致间接性，导致实现它们所需的运行时开销并增加二进制文件的大小。它们允许函数调用的运行时派发，但这是代价的。在嵌入式应用中，我们通常知道所有的类型，这意味着可以使用模板和重载解析来实现函数调用的静态或编译时派发。\n\
  \n### 使用类模板实现编译时多态\n\n我们可以 `gsm_lib` 变成一个类模板，它有一个用于 `uart` 类型的参数，如下例所示：\n\n```\n\
  #include <span>\n#include <cstdio>\n#include <cstdint>\nclass uart_stm32 {\npublic:\n\
  \    void init(std::uint32_t baudrate = 9600) {\n        printf(\"uart_stm32::init:\
  \ setting baudrate to %d\\r\\n\", baudrate);\n    }\n    void write(std::span<const\
  \ char> data) {\n        printf(\"uart_stm32::write: \");\n        for(auto ch:\
  \ data) {\n            putc(ch, stdout);\n        }\n    }\n};\ntemplate<typename\
  \ T>\nclass gsm_lib{\npublic:\n    gsm_lib(T &u) : uart_(u) {}\n    void init()\
  \ {\n        printf(\"gsm_lib::init: sending AT\");\n        uart_.write(\"AT\"\
  );\n    }\nprivate:\n    T &uart_;\n};\nint main() {\n    uart_stm32 uart_stm32_obj;\n\
  \    uart_stm32_obj.init(115200);\n    gsm_lib<uart_stm32> gsm(uart_stm32_obj);\n\
  \    gsm.init();\n    return 0;\n}\n```\n\n在前面的示例中，编译器使用 `uart_stm32` 类实例化 `gsm_lib`\
  \ 类模板。`gsm_lib` 使用对 `uart_stm32` 对象的引用。这意味着任何接受 `std::span<char>` 的 `write` 方法的类型都可以编译。\n\
  \n### 递归模板模式 (CRTP)\n\nCRTP 是一种 C++ 模式，其中派生类使用自身作为基类实例化的模板类。是的，这听起来很困惑，让我们进入代码以更好地理解：\n\
  \n```\ntemplate<typename U>\nclass uart_interface {\npublic:\n    void init(std::uint32_t\
  \ baudrate = 9600) {\n        static_cast<U*>(this)->initImpl(baudrate);\n    }\n\
  };\nclass uart_stm32 : public uart_interface<uart_stm32> {\npublic:\n    void initImpl(std::uint32_t\
  \ baudrate = 9600) {\n        printf(\"uart_stm32::init: setting baudrate to %d\\\
  r\\n\", baudrate);\n    }\n};\n```\n\n前面的代码实现了 CRTP。派生类 `uart_stm32` 继承自使用 `uart_stm32`\
  \ 类实例化的 `uart_interface` 类模板。基类模板暴露了一个接口，可以通过对 `this` 进行 `static_cast` 来访问派生类。它提供了\
  \ `init` 方法，该方法调用 `uart_stm32` 类对象的 `initImpl`。\n\nCRTP 允许我们在基类中定义接口并在派生类中实现它，类似于我们用于运行时多态的继承机制。确保在\
  \ `gsm_lib` 中使用此接口的剩余部分是使用概念创建类型约束，如下：\n\n```\ntemplate<typename T>\nconcept TheUart\
  \ = std::derived_from<T, uart_interface<T>>;\n```\n\n前面的代码是一个概念，我们将用于限制 `gsm_lib`\
  \ 类模板接受的类型。它仅接受继承自由该类型实例化的 `uart_interface` 类类的类型。以下是完整的代码示例：\n\n\n\n\n\n```cpp\n\
  #include <span>\n#include <cstdio>\n#include <cstdint>\ntemplate<typename U>\nclass\
  \ uart_interface {\npublic:\n    void init(std::uint32_t baudrate = 9600) {\n  \
  \     static_cast<U*>(this)->initImpl(baudrate);\n    }\n    void write(std::span<const\
  \ char> data) {\n       static_cast<U*>(this)->writeImpl(data);\n    }\n};\nclass\
  \ uart_stm32 : public uart_interface<uart_stm32> {\npublic:\n    void initImpl(std::uint32_t\
  \ baudrate = 9600) {\n        printf(\"uart_stm32::init: setting baudrate to %d\\\
  r\\n\", baudrate);\n    }\n    void writeImpl(std::span<const char> data) {\n  \
  \      printf(\"uart_stm32::write: \");\n        for(auto ch: data) {\n        \
  \    putc(ch, stdout);\n        }\n    }\n};\ntemplate<typename T>\nconcept TheUart\
  \ = std::derived_from<T, uart_interface<T>>;\ntemplate<TheUart T>\nclass gsm_lib{\n\
  public:\n    gsm_lib(T &u) : uart_(u) {}\n    void init() {\n        printf(\"gsm_lib::init:\
  \ sending AT command\\r\\n\");\n        uart_.write(\"AT\");\n    }\nprivate:\n\
  \    T &uart_;\n};\nint main() {\n    uart_stm32 uart_stm32_obj;\n    uart_stm32_obj.init(115200);\n\
  \    gsm_lib gsm(uart_stm32_obj);\n    gsm.init();\n    return 0;\n}\n```\n\n在前面的代码中，我们使用了\
  \ `CRTP` 来实现编译时或静态子类型多态。`uart_stm32` 是一个依赖于所定义接口的具体类。`uart_stm32` 是依赖于接口定义的具体类。`uart_stm32`\
  \ 是依赖于接口定义的具体类。`uart_stm32` 是依赖于接口定义的具体类。`uart_stm32` 是依赖于接口定义的具体类。`uart_stm32`\
