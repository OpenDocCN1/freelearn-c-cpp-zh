  \ 2D 游戏的经验和信心。\n\n本书的这一部分包含以下章节：\n\n* *第 5 章 *理解向量*\n* *第 6 章 *创建 2D 小游戏 - 第一部分*\n\
  * *第 7 章 *创建 2D 小游戏 - 第二部分*\n\n# 5\n\n# 理解向量\n\n向量是游戏开发中最基础的概念之一，帮助开发者表示移动、方向和定位。在本章中，你将深入了解向量的基础知识，以及它们在游戏机制中起的作用。你将学习如何在\
  \ Godot 引擎中（通过视觉界面和代码）有效地使用向量来控制和影响对象。\n\n在本章中，我们将涵盖以下主要主题：\n\n* 什么是向量？\n* 在 Godot\
  \ 中使用向量\n\n在本章结束时，你将对如何操作向量、将其应用于移动以及解决游戏开发问题获得实践理解。无论是开发平台游戏、RPG 还是 3D 冒险游戏，掌握向量将为你提供控制移动、敌人\
  \ AI 和环境交互的强大工具。\n\n# 技术要求\n\n本章的文件可以在书籍的 GitHub 仓库获取：`https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/5/vectors`\n\
  \n访问此链接查看代码运行视频：`https://packt.link/6sNsX`\n\n# 什么是向量？\n\n如果你熟悉点的概念，可以将向量理解为类似的，但有一个关键区别：向量不仅表示空间中的`位置`，还包含了关于`方向`和`量级`（从起点移动多远以及向哪个方向移动）的信息。相反，`点`只是一个位置，不包含任何关于方向或移动的信息。这如图\
  \ 5.1 所示：\n\n![img](img/B31515_05_1.png)\n\n图 5.1 – 二维空间中向量与点的演示\n\n在图 5.1 中，向量以箭头的形式表示。箭头指示向量指向的`方向`，而箭的长度（从尾部到头部）代表它的`量级`，即它从起点延伸的距离。位置\
  \ (8,5) 的点是一个静态位置，没有方向或量级。\n\n\n\n\n\n如果我们从原点向我们定义的点画一条箭头，我们就创建了一个向量。这在*图 5.2*中所示：\n\
  \n![img](img/B31515_05_2.png) \n\n图 5.2 向量具有方向（角度）和大小\n\n在视频游戏中，向量用于表示玩家的速度、控制他们的准星方向并确定他们的视野（即他们面向的方向）——这一切都可以通过一个向量来实现。同时，我们使用一个点来持续跟踪玩家的位置。这在*图\
  \ 5.3*中所示：\n\n![img](img/B31515_05_3.png) \n\n图 5.3 表示玩家当前位置的点\n\n在*图 5.3*中，我们可以看到玩家位于原点东边\
  \ `2` 单位，北边 `1` 单位。\n\n**速度**（Velocity）是物体在特定方向上的速率。在游戏开发中，它用于描述物体（如玩家或敌人）移动得有多快以及朝哪个方向移动。速度通常由向量表示，显示了移动的*速率*（大小）和*方向*。\n\
  \n如果我们想让玩家向左上方移动，可以使用速度为 `(-2,3)` 的速度向量。这在*图 5.4*中表示出来：\n\n![img](img/B31515_05_4.png)\
  \ \n\n图 5.4 表示玩家速度的向量\n\n在*图 5.4*中，该*速度向量*指示玩家将向左移动 `2` 单位并向上移动 `3` 单位。注意，`x` 坐标始终位于\
  \ `y` 坐标之前。\n\n向量还可以告诉我们玩家面向的方向。*图 5.5*显示了如何使用向量来指示玩家在游戏中面向的方向。\n\n![img](img/B31515_05_5.png)\
  \ \n\n图 5.5 指示方向的向量\n\n在*图 5.5*中，*方向向量*告诉我们玩家正指向右侧（旋转了 90 度）。\n\n向量本身仅仅是数字——如果没有语境，它们没有太大意义。例如，向量\
  \ `(1, 0)` 根据其使用方式可以表示方向、位置或速度。为了让这些向量具有意义，我们需要分配单位。在 Godot 中，2D 单位以*像素*计算，而 3D\
  \ 单位以*米*计算。\n\n例如，如果我们在 2D 游戏中有一个玩家角色，向量 `(1, 0)` 表示向右移动。在这种情况下，适用以下规则：\n\n*   `1`\
  \ 表示玩家在水平方向（`x` 轴）上移动一个单位（或像素）\n*   `0` 表示玩家不向上或向下移动（`y` 轴）\n\n如果玩家在每一帧都根据此向量移动，角色将每帧稳稳地向右移动\
  \ `1` 像素。\n\n当我们只需要方向而不关心距离或速度时，我们可以对向量进行*归一化*（normalize）。一个**归一化向量**的长度（或大小）为 `1`，且仍然指向相同的方向。这在将方向与其他值结合时特别有用，例如当将方向向量乘以速度以得到速度时。\n\
  \n例如，如果我们归一化向量 `(2, 0)`，我们得到 `(1, 0)`。它仍然指向右侧，但现在有了标准的长度 `1`，便于在游戏逻辑中进行一致的缩放。\n\n\
  ## Godot 中的坐标\n\n屏幕的一个重要特性是原点 `(0, 0)` 在屏幕的左上角。这意味着当我们向上移动时，`y` 为负值，向下移动时为正值。这由*图\
  \ 5.6*中的向量 `(4, 3)` 所示：\n\n![img](img/B31515_05_6.png) \n\n图 5.6 计算机从左上角向下渲染屏幕（此图像由\
  \ Godot 引擎贡献者提供，根据 CC BY 3.0 许可）\n\n在*图 5.6*中，向量 `(4, 3)` 具有角度为 `theta` 的方向或旋转，以及大小为\
  \ `m`。在这种情况下，*箭头*是一个位置向量，表示空间中相对于原点的点。关于向量需要记住的一点是，它们通常显示方向和大小（物体移动有多远或有多快），而不是起始位置。把向量想象成一个箭头：它告诉你该向哪里走以及多快，但不是你在地图上的位置。要确定物体的实际位置，你需要将向量与起点或参考点结合起来。\n\
  \n然而，有一个值得提到的特殊情况：**位置向量**（position vectors）。在数学和游戏开发（包括 Godot）中，像 `Vector2(2, 3)`这样的向量也可以表示\
  \ 2D 空间中的位置。这种向量被理解为从原点 `(0, 0)` 开始指向坐标 `(2, 3)`。在这种情况下，向量告诉你物体相对于原点的位置。\n\n所以，根据语境的不同，向量可以执行以下操作之一：\n\
  \n*   显示物体移动得有多远以及朝哪个方向（速度或力）\n*   指示相对于原点的位置\n\n\n\n\n在此代码中，我们将精灵的当前 `x` 和 `y`\
  \ 位置存储在单独的变量中，然后将其打印出来，观察它们在精灵横跨屏幕时是如何变化的。\n\n这种效果在 Godot 中的体现显示在输出控制台中，正如 `Sprite2D`\
  \ 正在`图 5.9` 中横跨屏幕一样：\n\n![img](img/B31515_05_9.png) \n\n图 5.9 – 当精灵移动时，控制台显示向量的\
  \ `x` 和 `y` 参数\n\n`图 5.9` 展示了我们如何始终访问向量的参数。我们可以利用这些信息来检测我们何时靠近 `Viewport` 的边缘，然后反转\
  \ `movement_vector`。这会使精灵从屏幕侧面发生“反弹”。使用以下代码实现这种行为：\n\n```python\n## 存储屏幕边缘的 x 和\
  \ y 位置\nvar horizontal_edge = get_viewport_rect().size.x\nvar vertical_edge = get_viewport_rect().size.y\n\
  ## 检查屏幕边界以反转方向\nif x_position < 0 or x_position > horizontal_edge:\n    # 反转 x 方向\n\
  \    movement_vector.x *= -1 \nif y_position < 0 or y_position > vertical_edge:\n\
  \    # 反转 y 方向\n    movement_vector.y *= -1 \n```\n\n这段代码成功地限制或约束了精灵的移动，使其保持在屏幕边界内。\n\
  \n我们还可以对向量进行数学运算，如加法、减法和乘法。这非常重要，因为允许我们以更动态、更灵活的方式操控物体的位置、移动和方向。幸运的是，游戏引擎会为你执行所有这些计算，但了解它在做什么是有好处的\n\
  \n## 移动与定位\n\n在游戏开发中，移动和定位是创建动态且引人胜的游戏的核心。在 Godot 中，向量是定义 2D 和 3D 空间中位置、方向和速度的本质工具。通过理解如何使用向量，你可以在游戏世界中平滑且准确地移动角色、弹体和物体。\n\
  \n本节将向你介绍如何在 Godot 中使用向量，教你如何计算方向、处理玩家移动以及有效地定位物体。这些概念为创建响应且真实的游戏机制奠定了基础。\n\n###\
  \ 向量加法\n\n我们使用`加法`通过将移动向量加到当前位置来更新物体的位置。例如，当你让角色横跨屏幕时，你在每一帧都会向角色的位置向量添加一个方向向量。\n\
  \n向量加法如`图 5.10`所示。相应的 `x` 和 `y` 值被相加（蓝色的向量 A `(2,5)` 加到绿色的向量 B `(3,1)`，得到红色的向量 C\
  \ `(5,6)`）。\n\n![img](img/B31515_05_10.png) \n\n图 5.10 – 将向量 `(2,5)` 加到向量 `(3,1)`，得到向量\
  \ `(5,6)`\n\n`图 5.10` 同样显示了你相加向量的顺序并不重要，因为结果的向量将始终是相同的。\n\n为了理解这在游戏中是如何工作的，我们可以考虑角色跳跃的例子。这在`图\
  \ 5.11`所示：\n\n![img](img/B31515_05_11.png) \n\n图 5.11 – 使用向量加法进行跳跃\n\n为了理解跳跃机制，我们可以逐帧查看。重力始终将角色向下拉；因此，加速度向量始终是\
  \ `(0, -1)`。\n\n起始位置是 `(0,0)`。当按下跳跃键时，速度向量被设置为 `(1,3)`，角色向上并向右移动。如果我们将速度加到位置向量上，我们得到一个新的速度向量\
  \ `(1,3)`。然而，我们必须加上加速度向量，新的结果是速度 `(1,2)`。如果我们继续这样操作，就可以穿过整个跳跃周期。\n\n### 向量减法\n\n\
  `减法`有助于计算两点之间的距离或差值，例如玩家与敌人之间的距离，这可以用于碰撞检测或 AI 行为。\n\n`向量减法`的工作原理类似——通过逐个减去每个分量，向量减法有助于确定一个从一个位置指向另一个位置的向量。\n\
  \n例如，想象一个球位于 `(1,2)`，一个洞位于 `(4,3)`。为了找到球滚向洞以到达洞的方向，你可以通过从洞的位置减去球的位置来找到差值。\n\n这在`图\
  \ 5.12`中所示：\n\n![img](img/B31515_05_12.png) \n\n图 5.12 – 向量减法\n\n`图 5.12` 展示了如何使用向量减法来计算到达某点所需的长度和方向。\n\
  \n我们对向量执行的下一个基本操作是乘法。\n\n### 向量乘法\n\n向量具有方向和大小两个值，但只表示大小的值被称为`标量`（scalar）。\n\n当我们谈论向量时，向量内部的每个数字被称为`分量`（component），单个数字本身被称为`标量`。例如，`(3,\
  \ 4)` 是一个向量，而 `5` 是一个`标量`。在游戏中，将向量乘以标量对于改变其大小非常有用。\n\n归一化向量是一种特殊的向量，其长度（或大小）恰好为\
  \ 1。它指向相同的方向，但大小已被缩小为 1。例如，如果玩家面向右侧，我们可能会使用 `(1, 0)`。如果我们将其乘以标量 100，得到 `(100, 0)`，这代表向右移动\
  \ 100 像素。\n\n```python\nvar direction = Vector2(1, 0).normalized()\nvar distance\
  \ = 100\nvar arrival_position = player.position + direction * distance\n```\n\n\
  我们还可以看到如何使用向量乘法来缩放图像。想象玩家得到了一个强化道具。玩家的大小表示为一个向量，例如 `(1, 2)`，这意味着宽度为 1，高度为 2。如果强化道具使其大小翻倍，我们将大小向量乘以标量\
  \ 2。\n\n这在`图 5.13`中所示：\n\n![img](img/B31515_05_13.png) \n\n图 5.13 – 标量乘法产生的影响\n\n\
  在`图 5.13`中，将大小向量乘以标量使玩家在宽度和高度上都变成了一倍，但其整体形状和比例保持不变。\n\n将向量乘以标量实际上拉长了向量而不改变其方向。这也可以通过箭头来演示，正如`图\
  \ 5.14`所示：\n\n![img](img/B31515_05_14.png) \n\n图 5.14 – 标量乘法演示（此图由 Godot Engine\
  \ 贡献者提供，根据 CC BY 3.0 许可）\n\n`图 5.14`显示将向量乘以标量将得到更长的向量。同样重要的是，乘以负标量将反转方向。\n\n## 向量长度\n\
  \n从原点到向量 *x* 和 *y* 位置的距离被称为向量的长度。这也被称为向量的大小。为了找到这个长度，Godot 有了内置的 `length()` 函数：\n\
  \n```python\nvar vector_length: float = vector.length()\n```\n\n为了理解 `length()`\
  \ 函数是如何工作的，请考虑这个例子。如果一个角色在 2D 平台跳游戏中以速度向量 `v(4,3)` 移动，我们可能想要确定角色移动有多快，以便调整动画或实现如落地时的尘土等效果。\n\
  \n\n\n要找到角色的速度，我们需要计算速度向量 `v` 的长度（或模）。我们可以此向量可视化为一个直角三角形，其中一条边为 3（`x` 分量），另一条边为\
  \ 4（`y` 分量）。使用勾股定理，我们可以找到斜边，它代表了角色的速度。具有分量 (`x`, `y`) 的向量的模以及所得的速度公式如图 5.15 所示：\n\
  \n![img](img/B31515_05_15.png)\n\n图 5.15 – 使用勾股定理确定向量模\n\n图 5.15 展示了 `length()`\
  \ 函数如何计算向量的模。这意味着角色在游戏世界中以每秒 `5` 个单位的速度移动。这在图 5.16 中得到了可视化：\n\n![img](img/B31515_05_16.png)\n\
  \n图 5.16 – 长度的视觉化表示\n\n图 5.16 展示了如何计算向量的长度。注意，这同样适用于 3D 向量。\n\n## 距离\n\n通常，我们想要找到两个对象（例如玩家和运动传感器）之间的**距离**，以确定玩家是否足够近以触发警报。我们可以使用\
  \ Godot 中的 `distance_to()` 函数来实现此。例如，如果玩家位于 (3,3) 位置，而运动传感器位于 (1,2) 位置，我们可以计算它们之间的距离，检查玩家是否在传感器的范围内，从而激活警报。\n\
  \n`distance_to()` 函数背后的数学原理结合了向量减法和向量长度。计算距离 `D`，我们从运动传感器向量 `M` 中减去玩家向量 `P`，然后计算所得向量的长度：\n\
  \n```\nD = (P - M).length()\n```\n\n```\nD = √[(3 - 1)² + (3 - 2)²] = √[4 + 1] =\
  \ √5 ≈ 2.24\n```\n\n该方程如图 5.17 所示：\n\n![img](img/B31515_05_17.png)\n\n图 5.17 – 计算到对象的距离\n\
  \n图 5.17 展示了如何计算到另一个对象的距离。从运动传感器向量中减去玩家向量，还是反过来，都没有关系；结果是相同的。\n\n## 归一化\n\n在处理方向（而不是位置或速度）时，确保它们具有单位长度（即长度为\
  \ 1），这简化了我们的计算。\n\n例如，想象一个机器人需要朝 (1,0) 方向移动，以 20 m/s 的恒定速度交付包裹。机器人的速度是多少？因为方向向量的长度为\
  \ 1，我们可以轻松地将其乘以机器人的速度来计算其速度：(20,0)。如果方向向量有任何其他长度，机器人移动将太快或太慢。\n\n长度为 1 的向量被称为**归一化**向量。那么，我们如何归一化向量（将其长度设置为\
  \ 1）呢？\n\n这很简单：我们只需要将每个分量除以向量的长度。\n\n由于这是一个非常常见的操作，Godot 有一个内置函数来为我们完成。该函数名为 `normalized()`，可以如下所示用于我们的示例：\n\
  \n```\nextends Node2D\n## 当节点第一次进入场景树时调用。\nfunc _ready():\n    # 归一化方向向量，使其长度为 1\n\
  \    direction = direction.normalized()\n\n    # 通过方向乘以速度来计算速度\n    velocity = direction\
  \ * speed\n```\n\n关于向量还有很多需要学习的内容，还有其他操作，如**点积**和**叉积**。这一切都属于数学中的**线性代数**领域。然而，你现在有了足够的理解来制作出色的\
  \ Godot 游戏，引擎将为我们完成所有的数学计算！\n\n# 总结\n\n在本章中，我们探索了向量的基本概念及其在游戏开发中的关键性作用。你学习了如何在 Godot\
  \ 引擎中操作向量，应用向量加法、减法和乘法来控制移动和定位。我们还涵盖了重要主题，如计算向量长度、确定对象之间的距离以及对向量进行归一化以保持方向的一致。\n\
  \n通过掌握这些概念，你现在已经有能力在游戏项目有效地地使用向量，增强游戏机制和交互。\n\n在下一章中，我们将从理论转向实践，在 Godot 中创建我们的第一个\
