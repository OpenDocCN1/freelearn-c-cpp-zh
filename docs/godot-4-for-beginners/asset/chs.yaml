- "# Godot 4 初学者指南\n\n\n\n![](img/Cover.png)\n\n\n\n\n\n\n\n\n\n\n**关系负责人** : Neha\
  \ Pande\n**内容工程师** : Shreya Sarkar\n**文字编辑** : Safis Editing\n**校对员** : Shreya Sarkar\n\
  **增长负责人** : Lee Booth\n首次出版：2025 年 8 月\n\nGrosvenor House\nBirmingham\n\n\n\n\n\n\
  # 前言\n\n得益于像 Godot 这样强大又易于上手的引擎，创建游戏从未如此变得简单。然而，深入研究像 Godot 这样的引擎——尽管用户友好——但仍然涉及掌握一系列多样的技能，从编程和数学等显而易见的技能到软件架构和游戏设计等不明显的技能。即使你已经了解游戏引擎的原理，切换到另一个引擎也是枯燥的。\n\
  \n本书由专业游戏开发导师 Robert Henning 编写，正解决了这一问题，并引导读者进入广大的游戏开发领域。通过 Robert 的教学方法，培养新技能将变得容易得多。此外，你将享受这个过程，因为书中包含了练习和项目，这些项目提供了早期成就感来增强你的动力。\n\
  \n尽管我从未亲面对过 Robert，但他以非常直接的方式帮助我成为一名专业的游戏开发者——通过在 YouTube 上创建教程和 Godot 引擎相关的内容，这些内容既帮助了我也激励了我。在写这篇前言时，他的频道已经超过\
  \ 50,000 个订阅，这证明了他的视频的实用性，以及他帮助人们在 Godot 中开始游戏开发的积极意愿。\n\n阅读这些页面并完成练习让我回到了我还是一个初学者（一张白纸）的时候，并让我尝试新事物感到兴奋。因为如果说有什么最重要的事情，那就是：始终保持初学者的心态并进行实验。每当你学习新东西或做练习时，都要将其推向极限。在这里和那里修改一个值直到它崩溃，然后退后一步。只有当我们离开路径时，我们才能清楚地看到为什么最初会有那条路。\n\
  \n所以，我不再多留你了。去探索 Robert 在这本优秀书中铺设的路径吧。将其看作一场冒险。自由地实验，探索可能性，并找到你自己的风格。你不会后悔的。\n\n\
  *Sander Vanhove*，*首席游戏开发者、技术艺术家，以及畅销书*《通过使用 Godot 4 开发游戏来学习 GDScript》的作者\n\n# 贡献者\n\
  \n# 关于作者\n\nRobert Henning 拥有超过 20 年的计算机科学教育经验，专长游戏开发。他教过使用 `Scratch`、带有 `Greenfoot`\
  \ 的 `Java`、`Delphi`、`Construct 3`、`Unity` 和 `Godot` 进行游戏开发。作为 `Godot` 的热诚支持者，Robert\
  \ 从早期版本就开始推广该平台。\n\nRobert 还运营着一个流行的 YouTube 频道（`https://www.youtube.com/@GameDevJourney`），提供教程并展示使用\
  \ `Godot` 制作的游戏。他的实战方法和对易于学习的投入使他赢得了信赖教育者的声誉。《初学者 Godot 4》是他专业知识的结晶，旨在通过清晰、逐步的指令引导新成员创建他们自己的游戏。\n\
  \n# 关于审稿人\n\nDeepak Jadhav 是一位经验丰富的专家，在游戏开发和项目管理方面拥有丰富经验，特别是扩展现实（XR）技术领域。他擅长创建沉浸式增强现实（AR）和混合现实（MR）体验，为各行业提供创新解决方案。他的专业知识涵盖游戏编程、游戏引擎（`Godot`、`Unity`\
  \ 和 `Unreal`）、AI 系统实现以及将这些技能应用于企业应用。Deepak 拥有游戏开发和项目管理硕士学位以及计算机技术学士学位，使他具备领导复杂的\
  \ XR 和游戏开发项目的技术和管理技能。\n\nUral 是一位位于土耳其的游戏开发者，拥有兽医学博士学位。他的游戏开发之旅始于高中的 `Python`，这使他使用\
  \ `Godot`、`Unity` 和 `Unreal Engine` 等引擎从事了各种项目。他从 2018 年开始将 `Godot` 作为他的第一个游戏引擎，并独立开发了多个游戏。自\
  \ 2021 以来，他一直是 Harmonia Games 的首席开发者。Ural 对探索不同的工作流和游戏架构充满热情。他使用 `C++` 从头构建了自己的游戏引擎，并在\
  \ Steam 上发布了游戏 *REM the Dreamer*。\n\nHenrique “Ludonaut” Campos 是一位独立游戏开发者和设计师，在行业工作多年。他从\
  \ 2015 年开始担任计算机图形和人工智能大学教师，并在 2018 年至 2022 年在 GDQuest 团队工作，目前他还是工作室和学校的独立顾问。以 Ludonaut\
  \ 为名，Henrique 在他的 YouTube 频道上创作游戏开发内容、游戏、素材、电子书和课程。作为《Godot 4 游戏开发模式》作者，Henrique\
  \ 为 Godot 用户制作重用且可扩展的代码库铺平了道路。\n\n\n# 序言\n\n你好，欢迎阅读《初学者 Godot 4》！我叫 Robert Henning，我曾也是一名\
  \ Godot 初学者，所以我知道寻找帮助你学习使用 Godot 引擎制作游戏的感受是什么。正是因为缺乏针对初学者的优质 Godot 资源，我写了这本书。\n\n\
  本书采取实践、循序渐进的方法教授游戏开发，从下载和安装 Godot 4 游戏引擎的基础知识开始，通过一系列逐步复杂的主题逐渐建立你的知识。每一章都设计得非常具有实用性和互动性，让你能够通过真实世界的案例和项目立即应用所学到的知识。本书的结构确保即使是没有任何编程或游戏开发经验的人，也能跟上并取得成功。\n\
  \n\n\n\n\n在本书中，你将熟悉 `Godot 4` 界面及其提供的工具，同时还将学习 Godot 独特的节点、场景、信号和脚本系统背后的基础游戏开发哲学。你将使用\
  \ Godot 的脚本语言 `GDScript`，并探索 2D 和 3D 工作流。在此过程中，你将构建角色控制器，设计如敌人和危险源等交互元素，实现评分系统和可收集物品，并发现如何打磨你的项目以获得更专业的质感。本书还将引导你学习游戏设计的基础知识，帮助你不仅理解如何构建游戏，还学会如何打造有趣且引人入胜的体验。\n\
  \n读完本书后，你将对 `Godot 4` 游戏引擎及其界面有深入理解，并能够创建 2D 和 3D 游戏、操作光照、使用 `GDScript` 编写脚本，以及实现玩家、敌人和物品等关键游戏元素。你还将擅长设计和构建引人入胜的游戏关卡、追踪分数以及管理游戏结束状态，使你能够将自己的游戏想法变为现实。\n\
  \n现在轮到你开始了。带着好奇心、耐心和实践，你会在不经意间构建出属于自己的游戏。让我们开启游戏开发之旅吧！\n\n# 本书适合读者\n\n本书非常适合任何游戏开发新手，想要探索强大且易于上手的\
  \ `Godot` 引擎。无论你是志向成为游戏开发者的新人、寻找免费开源工具的独立创作者、渴望构建交互式项目的学生，还是对将自己的想法变为现实感到好奇的艺术家，本书都将为你提供使用\
  \ `Godot 4` 的坚实基础。通过清晰的解释和实战项目，本书旨在帮助你完成从好奇到创造的转变——无需先前的经验。\n\n此外，想要学习游戏开发基础知识的学生、寻求全面资源来教授基础知识的教育者，以及希望使用开源且对新手友好的\
  \ `Godot` 游戏引擎来实现游戏想法的准游戏开发者，都将发现本书的价值连城。\n\n无论你是从零开始，还是已经掌握了一些基础知识，本书都会通过清晰、循序渐进的引导带你熟悉\
  \ `Godot 4`。不需要先前的编程经验——虽然对变量、循环和条件语句等概念的基础了解会有帮助，但书中每个核心编程概念都会从头开始解释。\n\n# 本书涵盖内容\n\
  \n- **第 1 章**](#Chapter_1.xhtml__idTextAnchor017), *让我们开始 Godot 之旅！*，探索了 `Godot\
  \ 4.0` 的历史和核心特性，旨在为你提供安装、启动以及在引擎中创建第一个项目的知识。\n- **第 2 章**](#Chapter_2.xhtml__idTextAnchor032),\
  \ *探索 Godot 引擎界面*，探索了界面的基本功能并帮助你在 `Godot 4` 中编辑第一个项目。你将理解支撑 Godot 的节点和场景设计哲学。\n\
  - **第 3 章**](#Chapter_3.xhtml__idTextAnchor047), *3D 简介*，解释了如何构建和光照简单的 3D 环境，帮助你建立起在\
  \ `Godot` 3D 工作区导航的信心。\n- **第 4 章**](#Chapter_4.xhtml__idTextAnchor062), *使用 GDScript\
  \ 编写脚本*，提供了编写基本游戏机制的基础知识，让你能自信地控制游戏的逻辑和流程。\n- **第 5 章**](#Chapter_5.xhtml__idTextAnchor087),\
  \ *理解向量*，解释了什么是向量以及它们为什么在游戏机制中起着关键作用。你将学会如何在 `Godot` 引擎中有效使用向量。\n- **第 6 章**](#Chapter_6.ididTextAnchor107),\
  \ *在 Godot 中创建 2D 小游戏 – 第一部分*，详细介绍了一个交互式、完全可玩的平台跳关卡的创建过程，并解释了这些组件如何协同工作形成许多平台类游戏的基础。本章包括使用\
  \ `TileMap` 创建关卡设计、开发玩家角色、编写玩家角色脚本以及学习整洁代码。\n- **第 7 章**](#Chapter_7.xhtml__idTextAnchor123),\
  \ *在 Godot 中创建 2D 小游戏 – 第二部分*，探索了如何通过代码让你的游戏机制活起来，并创造更动态、更吸引人的平台跳体验。本章包括制作玩家动画、编写平台游戏机制、可收集物品、巡逻敌人以及关卡完成。\n\
  - **第 8 章**](#Chapter_8.xhtml__idTextAnchor146), *在 Godot 中创建 3D 小游戏 – 第一部分*，解释了如何创建可用的\
  \ 3D 场景、控制你的玩家角色，并设计视觉美观又兼具功能的关卡。本章包括创建 3D 角色、设计关卡、使用角色控制器脚本以及实现相机控制器。\n- **第 9\
  \ 章**](#Chapter_9.xhtml__idTextAnchor175), *在 Godot 中创建 3D 小游戏 – 第二部分*，继续上一章开始的工作，并包含了最后的润色，如添加强化道具、引入障碍和打磨关卡。\n\
  - **第 10 章**](#Chapter_10.xhtml__idTextAnchor196), *添加游戏反馈（Game Juice）*，详细介绍了微小的变化如何极大提升游戏的手感。你将获得增强玩家沉浸感的视觉和音频反馈的实践经验，让你的游戏玩起来更有趣、更有满足感。\n\
  - **第 11 章**](#Chapter_11.id213), *理解游戏设计*，阐述了游戏设计在简化开发、减少昂贵错误和提高玩家满意度方面的价值。\n-\
  \ **第 12 章**](#Chapter_12.xhtml__idTextAnchor253), *接下来去哪里*，提供了一份精选资源列表，以深化你的知识、扩展技能并与其他开发者联系。你还将发现如何保持动力、关注最新趋势并在游戏开发社区中建立自己的立足点。\n\
  \n# 如何利用本书\n\n为了充分参与书中的练习和示例，你需要下载并安装 `Godot Engine 4.3`。该版本的引擎引入了对于理解和实现我们所涵盖的技术的关键特性和更新。无论你是\
  \ Godot 新手，还是拥有较早版本的经验，使用 4.3 版本对于确保与书中讨论的项目和概念兼容至关重要。\n\n| 本书涵盖的软件/硬件 | 操作系统要求\
  \ |\n| :--- | :--- |\n| Godot Engine 4.3 | Windows, macOS, Linux |\n\n你可以从官方网站 `godotengine.org`\
  \ 轻松下载 `Godot Engine 4.3`。虽然现在有了 `4.4.1` 版本，但建议使用 `4.3` 以确保与书中示例完全兼容。\n\n**如果你使用的是本书的电子版，我们建议你手动输入代码，或者从本书的\
  \ GitHub 仓库获取代码（链接将在下一节提供）。这样做可以帮助你避免与复制粘贴代码相关的任何潜在错误。**\n\n\n\n\n\n请注意，作者承认使用了\
  \ `ChatGPT` 等尖端 AI 技术，其唯一目的是提高书籍的语言表达和清晰度，从而为读者提供流畅的阅读体验。需要注意的是，内容本身是由作者编写并由专业出版团队编辑的。\n\
