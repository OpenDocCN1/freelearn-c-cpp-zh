  *   **Pixel Adventure 2** : [`pixelfrog-assets.itch.io/pixel-adventure-2`](https://pixelfrog-assets.itch.io/pixel-adventure-2)\n\
  \n## 通过代码控制玩家动画\n\n动画在赋予游戏生命方面起着至关重要的作用，让玩家的操作感觉流畅且及时。在这一部分，我们将探索如何通过代码触发不同的玩家动画。通过学习如何通过控制动画，你将能够无缝地在空闲、跑步和跳跃等移动状态之间切换，提升游戏的整体感和精致度。\n\
  \n花时间考虑触发上一章中创建的每个动画的条件。我们应该尝试想象什么会触发该动画，以便我们在代码中实现它：\n\n*   `idle` 动画在玩家静止时（`x`\
  \ 和 `y` 速度均为 `0`）被触发。\n\n\n\n\n- 当玩家向左或向右移动时，触发 `run` 动画。为了确保精灵面向正确的方向，我们将根据移动方向对其翻转。\n\
  - 当玩家向下移动（`y` 速度在增加）且没有在贴壁滑动时，触发 `fall` 动画。\n- 当玩家在第一次跳跃期间向上移动（`y` 速度在减小）时，播放 `jump`\
  \ 动画（防止玩家通过连续按 `jump` 来“悬浮”或“飞行”）。\n- 当玩家已在空中、再次跳跃且没有在贴壁滑动时，触发 `double-jump` 动画。\n\
  - 当玩家在墙壁上滑动并向墙壁方向按键时，触发 `wall-slide` 动画。精灵将翻转以使其背对它正在滑动的那面墙壁。\n\n在上一个章节中，我们导入并命名了所有动画，现在对每个动画应该触发的条件有了清晰的理解。然而，为了有效地实现这些动画，还缺少一些关键环节：\n\
  \n- 我们无法判断玩家当前是否正在贴壁滑动\n- 我们无法判断这是否是玩家的第一次跳跃\n- 我们无法判断这是否是双击\n\n这些检查至关重要，因为我们的动画需要准确地表示玩家的操作和状态。例如，触发贴壁滑动动画需要我们检测玩家何时在贴着墙壁滑动。同样，区分第一次跳跃和双击可以确保每个动作都播放正确的动画。\n\
  \n## 辅助变量\n\n通过使用辅助变量来填补这些空白，我们可以创建一个更动态、响应更灵敏的玩家角色，使动画与上一个章节中建立的游戏机制无缝衔接。\n\n为了确保我们的角色动画能反映玩家的操作，我们需要追踪某些状态，例如玩家是否正在贴壁滑动或他们执行了多少次跳跃。为了做到，我们将引入两个新变量。\n\
  \n在你的 `Player` 脚本顶部，常量之后，添加以下变量：\n\n```\nvar jump_count = 0\nvar is_wall_sliding\
  \ = false\n```\n\n这些变量将帮助我们管理并检测触发正确动画所需的条件。\n\n前面的变量将解决我们的问题，我们只需要在正确的位置使用它们即可。从\
  \ `jump_count` 变量开始。当玩家跳跃或双击时，我们将 `jump_count` 增加 `1`。当玩家再次回到地面时，我们将 `jump_count`\
  \ 重置为 `0`。\n\n在 `handle_jump()` 函数中，如下所示增加 `jump_count`：\n\n```\nfunc handle_jump():\n\
  \    # 如果玩家在地面上，重置跳跃计数\n    if is_on_floor():\n        jump_count = 0\n    # 从地面跳跃（第一次跳跃）\n\
  \    if Input.is_action_just_pressed(\"ui_accept\") and is_on_floor():\n       \
  \ velocity.y = JUMP_VELOCITY\n        jump_count += 1\n    # 在空中双击\n    elif Input.is_action_just_pressed(\"\
  ui_accept\") and jump_count < 2:\n        velocity.y = JUMP_VELOCITY\n        jump_count\
  \ += 1\n```\n\n在前面的代码中，当玩家跳跃时，`jump_count` 增加 `1`，当玩家落地时，`jump_count` 重置为 `0`。\n\
  \n现在我们已经添加了追踪玩家状态的必要变量，可以在下一节开始实现使用这些的机制。\n\n# 贴壁滑动和双击机制\n\n在本节中，我们将创建专门的函数来处理 `wall-sliding`\
  \ 和 `double-jumping`，确保玩家移动的平畅且响应灵敏。这些机制不仅会增强游戏体验，还将直接触发相应的动画。我们还将创建一个 `animate`\
  \ 函数，来调用所有特定的动画。\n\n贴壁滑动和双击是独特的玩家移动方式，需要额外的逻辑才能正常工作。通过将这些动作分离到自己的函数中，我们可以保持代码的整洁和易于维护，同时确保每个机制都按预期运行。让我们从创建这些专用函数开始。\n\
  \n## 双击函数\n\n`double jump` 是平台类游戏中的经典机制，为玩家提供了额外的助力和对移动的更好控制。要实现这一功能，我们需要追踪玩家何时在空中，并确定是否允许第二次跳跃。\n\
  \n本节将引导你创建一个处理双击逻辑的函数，确保为玩家提供流畅且灵敏的体验。\n\n让我们来看下面的代码：\n\n```\nfunc double_jump():\n\
  \    # 处理双击\n    if Input.is_action_just_pressed(\"ui_accept\") and !is_on_floor()\
  \ and jump_count < 2:\n        velocity.y = JUMP_VELOCITY\n        jump_count +=\
  \ 1\n```\n\n在前面的双击函数中，首先检查玩家是否按了 `jump` 键，以及他们当前是否在空中（不在地面上）且跳跃次数少于 `2`（防止飞行）。如果所有这些条件都成立，玩家就可以再次跳跃。\n\
  \n## 贴壁滑动函数\n\n贴壁滑动依赖于另一个值才能工作：`friction`（摩擦力）。这样我们在墙壁上滑动速度就会比掉落速度慢。为了看到效果，请在程序顶部添加如下新常量：\n\
  \n```\nconst SPEED = 150.0\nconst JUMP_VELOCITY = -400\nconst FRICTION = 100\n```\n\
  \n前面的常量 `friction` 将是我们在墙壁上滑动的速度。选择 `100` 这个值是因为它的效果最好；不过你可以在测试时选择任何你觉得合适的数字。\n\n\
  现在，实现 `wall_slide` 函数：\n\n```\nfunc wall_slide(delta):\n    if is_on_wall() and\
  \ !is_on_floor():\n        if Input.is_action_just_pressed(\"ui_left\") or Input.is_action_just_pressed(\"\
  ui_right\"):\n            is_wall_sliding = true\n        else:\n            is_wall_sliding\
  \ = false\n    else:\n        is_wall_sliding = false\n    if is_wall_sliding:\n\
  \        velocity.y = min(velocity.y, FRICTION)\n```\n\n`wall_slide` 函数通过检查特定条件并修改移动，为玩家开启了贴壁滑动机制。为了更好地理解该函数如何工作，让我们在接下来的章节中逐步拆解它。\n\
  \n### 检查条件\n\n第一个 `if` 条件检查玩家是否触碰墙壁（`is_on_wall()`）且未在地面上（`!is_on_floor()`）。\n\n\
  这验证了两点：\n\n- 玩家是否触碰墙壁（使用 `is_on_wall()` 函数）\n- 玩家不在地面（通过 `!is_on_floor()` 条件判断）\n\
  \n### 检测输入\n\n在墙壁检测块内部，以下代码检查玩家输入：\n\n```\nif Input.is_action_just_pressed(\"ui_left\"\
  ) or Input.is_action_just_pressed(\"ui_right\")\n```\n\n该条件判断玩家是否按了*左*（`ui_left`）或*右*（`ui_right`）移动键。这会导致两种情况：\n\
  \n- 如果按了任意一个键，代码将 `is_wall_sliding` 设置为 `true`，开启贴壁滑动\n- 如果没有按键，该变量被设置为 `false`，停止贴壁滑动\n\
  \n### 重置贴壁滑动\n\n`else` 块确保如果玩家不在墙上或在地面上，`is_wall_sliding` 将设置为 `false`。这防止了意外的滑动。\n\
  \n### 限制向下速度\n\n最后的检查 `if is_wall_sliding:` 在其块内应用了 `velocity.y = min(velocity.y,\
  \ FRICTION)`。\n\n在这里，`min()` 函数比较当前的向下速度（`velocity.y`）与预定义的 `FRICTION` 值。如果 `velocity.y`\
  \ 大于 `FRICTION`（意味着玩家掉得太快），`min()` 将返回较小值——即 `FRICTION` 值。这有效地限制了贴壁滑动时的下降速度，确保玩家以受控的较慢速度下降。\n\
  \n\n\n\n这带来了更平滑且更易管理的爬壁滑动体验，防止了在墙上快速失控地掉落。\n\n通过结合这些检查和动作，`wall_slide` 函数确保玩家能够根据其输入和环境无缝地进入和退出受控的墙壁滑动。这为直观的游戏机制奠定了基础。\n\
  \n记得在 `process` 函数中调用我们的新函数，以便我们能够使用它们：\n\n```\nfunc _physics_process(delta):\n\
  \    apply_gravity(delta)\n    double_jump()\n    wall_slide(delta)\n    move_and_slide()\n\
  ```\n\n`_physics_process(delta)` 函数是我们调用所有自定义移动和物理相关函数的地方。通过调用这些函数，我们是在要求 Godot\
  \ 将这些函数作为物理引擎的一部分来运行。`_physics_process()` 是 Godot 游戏循环的一部分，以固定间隔运行，确保玩家的操作以及与游戏世界的交互以一致且实时的方式进行更新。\n\
  \n对于基于物理的逻辑，使用 `_physics_process()` 是重要的，因为它与物理引擎同步。如果我们改用 `_process()` ——它每帧运行一次并可能根据帧率变化\
  \ —— 可能会导致抖动或不一致的移动，特别是在性能较低的机器上，因为 `_process()` 无法保证一致的物理计算。\n\n## Animate 函数\n\
  \n下一步是在代码中重写动画触发器。每个动画触发器都用注释进行了描述。\n\n`AnimatedSprite2D` 节点将播放相应的动画，但我们需要该节点的引用来调用它的函数。我们可以在场景就绪时获取该引用，因此我们给变量加上\
  \ `@onready` 注解，如下代码所示：\n\n```\nextends CharacterBodyD\n@onready var animations\
  \ = $AnimatedSpriteD\n```\n\n接下来，我们将声明一个新函数并将其命名为 `animate`：\n\n```\n#Handle Animations\n\
  func animate():\n    # 静态止玩家\n    if velocity.x == 0 and velocity.y == 0:\n    \
  \    animations.play(\"idle\")\n    # 玩家移动（向左或向右）\n    elif velocity.y == 0:\n \
  \       animations.play(\"run\")\n    # 玩家掉落\n    elif velocity.y > 0 and !is_wall_sliding:\n\
  \        animations.play(\"fall\")\n    # 玩家跳跃（第一次跳）\n    elif velocity.y < 0 and\
  \ jumpCount == 0:\n        animations.play(\"jump\")\n    # 玩家正在双跳\n    elif is_on_floor()\
  \ and jumpCount > 0 and !is_wall_sliding:\n        animations.play(\"double_jump\"\
  )\n    # 玩家正在墙上滑动\n    elif is_wall_sliding:\n        animations.play(\"wall_slide\"\
  )\n    # 根据移动方向翻转精灵图\n    animations.flip_h = velocity.x < 0\n```\n\n记得在 `_physics_process()`\
  \ 函数中调用 `animate()` 函数：\n\n```\nfunc _physics_process(delta):\n    apply_gravity(delta)\n\
  \    standard_player_movement()\n    double_jump()\n    wall_slide(delta)\n    animate()\n\
  \    move_and_slide()\n```\n\n在前面的代码中，我们再次确保了调用所有自定义函数并在 `physics_process` 函数中重复运行。现在，测试游戏，你的玩家应该会播放动画了！我们的下一步是设置`穿透平台`（pass-through\
  \ platforms），让玩家可以从下方跳过平台，并按下方向键从上方掉落平台。\n\n## 穿透平台\n\n我们在 `TileMap` 上创建了两个不同的物理层，以便玩家可以跳过某些平台并掉落通过。由于我们将这些瓦片制作为`单向瓦片`（one-way\
  \ tiles），我们可以从下方跳过它们而不需要编写代码。\n\n现在，我们需要设置代码，当我们站在平台上并按下 `down` 时，允许玩家掉落这些平台。我们的代码应该检查玩家是否按下了\
  \ `down`，并简单的关闭碰撞掩码（Collision Mask）数字 `3`（穿透层）。这意味着玩家将停止检测 `pass_through` 层的碰撞，并将一直掉落直到到达一个它正在检测碰撞的层，即地面层。这在\
  \ `check_pass_through()` 函数中得到了演示，如下：\n\n```\nfunc check_pass_through():\n    if\
  \ Input.is_action_pressed(\"ui_down\"):\n        set_collision_mask_value(3, false)\n\
  \    else:\n        set_collision_mask_value(3, true)\n```\n\n如前面的代码所示，了一个名为 `check_pass_through()`\
  \ 的新函数。它会检查用户是否按下了 `down` 键，如果是，它会将碰撞掩码第 `3` 层的值的值设置为 `false`（禁用）。如果玩家没有按下 `down`\
  \ 键，该值将重置为 `true`（启用）。\n\n记得在 `_physics_process()` 的函数调用列表中添加 `check_pass_through()`；否则该函数将不会运行！\n\
  \n```\nfunc _physics_process(delta):\n    apply_gravity(delta)\n    standard_player_movement()\n\
  \    double_jump()\n    wall_slide(delta)\n    animate()\n    check_pass_through()\n\
  \    move_and_slide()\n```\n\n现在玩家可以在关卡中跑步、跳跃、双跳和爬壁滑动，还可以穿过特殊平台。我们的下一步是在关卡周围散布一些物品供玩家收集。\n\
  \n## 添加可收集物品\n\n在许多游戏中，`可收集物品`通过提供奖励、道具或玩家所需的资源，在增强游戏性方面起着至关重要的作用。这些物品可以创造成就感、鼓励探索并为游戏增加策略深度。在本节中，我们将学习如何在\
  \ Godot 中创建可收集物品系统。\n\n你将学习如何设计可收集物品、检测玩家与其交互，以及实现奖励的逻辑。在本节结束时，你将拥有一个可以扩展以包含各种收集物品的可用系统。\n\
  \n对于可收集物品，我们将使用 `Items` | `Fruits` 文件夹中的草莓。但是，只要你适应随后的步骤，你可以使用任何物品。\n\n## 草莓场景（我们的可收集物品）\n\
  \n在我们的游戏中，玩家将收集`草莓`。一旦玩家收集了关卡中所有的`草莓`，就会出现旗帜，玩家触摸即可完成关卡。\n\n按照以下步骤创建可收集物品场景：\n\n\
  1. 创建新场景并将 `Area2D` 作为根节点。`Area2D` 是一个不可的节点，定义了一个二维区域，用于检测物体是否碰撞或停止碰撞。\n2. 添加一个\
  \ `AnimatedSprite2D` 节点作为子节点。\n3. 回想一下，为了制作动画，我们需要使用多个显示精灵不同运动阶段的帧。这些帧通常组合在一张名为`精灵图`（sprite\
  \ sheet）的图像中。\n4. 为了制作动画，我们首先导入精灵图，然后将其分为单独的帧。要此操作，选择 `AnimatedSprite2D` 节点，并在 `Inspector`\
  \ 的 `Sprite Frames` 属性中点击 `New SpriteFrames`。\n\n\n\n\n[content]\n3. 现在，在从 Pixel\
  \ Frog 下载的资源中找到 `Items` | `Fruits` 文件夹（参见*技术要求*部分），并将草莓的图像拖入 `FileSystem` 中的 `Collectibles`\
  \ 文件夹。\n\n4. 选择 `idle` 动画，然后点击 `Add frames from a Sprite Sheet` 按钮或按 `C` + `trl`\
  \ + `Shift` + `O`。现在，选择 `Collectibles` 文件夹中的 `Idle` 文件。\n\n5. 现在，你必须计算玩家图像并根据需要更新\
  \ `Horizontal` 和 `Vertical` 帧属性（参见*图 7.3*）。\n\n6. 然后，点击 `Select All` 按钮，紧接着点击 `Add\
  \ x Frame(s)` 按钮。*图 7.3* 显示了草莓空闲帧（idle frames）： \n\n![img](img/B31515_07_3.png)\
  \ \n\nFigure 7.3 – 设置水平和垂直帧并将其添加到动画\n\n现在你已经像*图 7.3* 所示从图像（精灵图）中切割了单个帧，你的 `SpriteFrames`\
  \ 窗口将更新用于 `idle` 动画的图像。这在*图 7.4* 中所示：\n\n![img](img/B31515_07_4.png) \n\nFigure\
  \ 7.4 – 用于空闲动画的帧\n\n![img](img/lightbulb_11.png) \n\n![img](img/1_G.png) **快速贴士**：需要查看此图像的高分辨率版本吗？在下一代\
