  \ – 部分 2\n\n在上一章中，我们引导你通过了在 Godot 中创建第一个完整的 2D 平台跳跃关卡的过程。我们使用 `TileMap` 构建了关卡，设置了带有动画的玩家角色，并清理了默认的基础移动脚本。现在，是时候更进一步了，添加更复杂的机制并精炼玩家与游戏世界交互的方式了。\n\
  \n在本章中，你将学习如何通过代码直接触发玩家动画。我们还将深入研究自定义行为，例如贴墙滑动、双跳和穿过平台——这些是许多平台游戏中常见的机制。我们还将添加收集物品和巡逻的敌人。最后，我们将为完成关卡编写一个检查点系统，允许玩家在游戏中不断进展。\n\
