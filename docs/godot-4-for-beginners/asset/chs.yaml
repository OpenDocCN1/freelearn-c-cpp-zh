  \ 2.0` 的强大功能来开发你的想法，从简单的平台跳跃到复杂的 `RPGs`。\n\n无论你是一个心心勃勃的游戏开发者、一个寻求创意出口的爱好者，还是仅仅是一个对游戏编程世界感兴趣的人，这本书都将引导你了解\
  \ `Godot 4` 游戏引擎的错综复杂。从编程基础入门开始，你将涵盖从数据到逻辑的所有内容，同时熟悉 `Godot` 的内置工具，如物理引擎、导航和摄像。随着学习的深入，你将对更高级的工具获得更深层次的见解，将你的编程水平推向新的高度。在易于遵循的逐步步骤教程、示例、练习和实验的帮助下，你将无缝整合这些新学知识，从零开始创建一个类《吸血鬼幸存者》的游戏。\n\
  \n读完这本书后，你将熟练掌握利用 `Godot 4` 游戏引擎将你的游戏愿景变为现实。”\n\n*   Campos, H. (2025). *Godot 4\
  \ 游戏开发模式：使用 Godot 中行业验证的解决方案构建健性游戏系统* . Packt Publishing Ltd. ([`www.packtpub.com/en-us/product/game-development-patterns-with-godot-4-9781835880296?srsltid=AfmBOoo26F6O5FFeCa5HioxsnGU9jrLlGrs8DHGUhT6ho3YN5r77i6Gj`](https://www.packtpub.com/en-us/product/game-development-patterns-with-godot-4-9781835880296?srsltid=AfmBOoo26F6O5FFeCa5HioxsnGU9jrLlGrs8DHGUhT6ho3YN5r77i6Gj))\n\
