  \ 2018 年至 2022 年间在 `GDQuest` 团队工作。Henrique 还是工作室和学校的独立顾问。以 `Ludonaut` 为名，Henrique\
  \ 在他的 YouTube 频道上创作游戏开发内容，并在他的 `itch.io` 个人资料上发布制作的游戏、资产、电子书和课程。作为《使用 Godot 4.0\
