  \n![带有几个黑块的 QR 码 AI 生成的内容可能不准确](img/Discord_QR.png)\n\n# 第一部分\n\n# 学习 Godot 引擎的工作原理\n\
  \n在本书的第一部分中，您将为使用 Godot 游戏引擎建立坚实的基础。我们将从探索 Godot 的起源及其独特之处开始。我们还将手操作界面，学习场景（scenes）和节点（nodes）是如何工作的。在本部分结束时，您将准备好开始游戏。\n\
  \n本书部分包含以下章节：\n\n*   `第 1 章`：让我们用起来吧！\n*   `第 2 章`：探索 Godot 界面\n*   `第 3 章`：3D 简介\n\
