  \ 游戏的开发者准备的。读者应该具备 `Godot` 的基础知识。之前过 `Blender` 有帮助但并非必须。”\n\n*   Johnson, J. (2023).\
  \ *Godot 4 游戏开发食谱：通过 50 多个实用的配方构建高质量的 2D 和 3D 游戏* . Packt Publishing Ltd. ([`www.packtpub.com/en-mx/product/godot-4-game-development-cookbook-9781838826079`](https://www.packtpub.com/en-mx/product/godot-4-game-development-cookbook-9781838826079))\n\
