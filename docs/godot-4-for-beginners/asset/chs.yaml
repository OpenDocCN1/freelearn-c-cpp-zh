  \ |\n| *注意：在开始之前请准备好您的购买发票。* |\n\n## 探索 Godot 引擎界面\n\n在本章中，你将在 Godot 4 中编辑你的第一个项目并探索界面的基本功能。你还将对支撑\
  \ Godot 的节点和场景设计哲学有更深入的理解。对于每天使用 Godot 来说，理解它的设计意图是至关重要的基础。\n\n在本章中，我们将涵盖以下主要主题：\n\
  \n*   重要术语\n*   编辑现有的 Godot 项目\n*   创建一个额外的场景\n*   响应玩家输入\n\n在本章结束时，你将能够创建新项目、构建场景并轻松地操作界面——这对任何游戏开发者来说都是必备的技能。\n\
  \n# 技术要求\n\n本章的代码文件可以在本书的 GitHub 仓库中找到：[`github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch2/godotintro`](https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch2/godotintro)\n\
  \n访问此链接查看代码运行视频：[`packt.link/2R1xc`](https://packt.link/2R1xc)\n\n## 重要术语\n\n这是一个重要的部分。在我们深入本章并遇到不认识的术语之前，让我们快速查看一下它们：\n\
  \n*   **节点 (Nodes)**：节点是 Godot 4 场景的基础构建模块。每个节点代表游戏世界中的一个单一对象，例如精灵（sprite）、音效、UI\
  \ 元素等。多个节点通常形成一个层级结构，通常由父节点控制子节点的行为。\n\n在处理节点时，我们可以按 `Q`、`W`、`E` 和 `S` 来使用不同的工具：\n\
  \n*   `Q` – **选择工具**：允许我们选择节点并在视口（Viewport）中对其定位。\n*   `W` – **移动工具**：允许我们沿着各个轴线移动节点。\n\
  *   `E` – **旋转工具**：允许我们沿着各个轴线旋转对象。\n*   `S` – **缩放工具**：允许我们沿着各个轴线缩放对象的大小。\n\n每个节点都有决定其行为和外观的属性。例如，精灵节点具有\
  \ `Texture`、`Position` 和 `Scale` 等属性，如*图 2.1* 所示：\n\n![img](img/B31515_02_1.png)\n\
  \n图 2.1 – Sprite2D 节点的一些属性\n\n*   **场景 (Scenes)**：场景是节点的集合。它们可以组成关卡、菜单、角色、敌人或游戏的任何其他部分。场景可以保存为单独的文件，并在需要时通过实例化（instancing）加载到你的游戏中。\n\
  *   **脚本 (Scripts)**：脚本是游戏开发的重要部分。它们允许你创建自定义动作和交互，使你的游戏独独特。\n\n为了可视化节点如何组合成场景，请查看*图\
  \ 2.2*，它显示了可收集物品 `Strawberry`。它由一个 `Area2D` 节点、一个 `CollisionShape2D` 节点和一个 `AnimatedSprite2D`\
  \ 节点组成。它们共同构成了 `Strawberry` 场景。\n\n![img](img/B31515_02_2.png)\n\n图 2.2 – 组合成场景的节点组合\n\
  \n让我们进入章节吧！\n\n## 编辑现有的 Godot 项目\n\n我们在上一章中创建了一个 Godot 项目，当我们启动 Godot 时，可以在**项目管理器\
  \ (Project Manager)** 窗口中看到它，并可以通过选择**编辑 (Edit)** 或按 `Ctrl` + `E` 然后双击我们的项目名称 `GodotIntro`\
  \ 来重新打开它：\n\n![img](img/B31515_02_3.png)\n\n图 2.3 – 我们来自*第 1 章* 的现有 Godot 项目\n\n\
  Godot 编辑器将打开并显示你最后的工作。在我的情况下，是**脚本 (Script)** 视图。通过点击屏幕顶部的 **2D** 将视图切换到 2D：\n\n\
  ![img](img/B31515_02_4.png)\n\n图 2.4 – 通过点击顶部的 2D 切换到 2D 视图\n\n现在我们可以仔细查看 Godot\
  \ 编辑器的主要功能了。你的屏幕现在应该像*图 2.1*所示：\n\n![img](img/B31515_02_1.png)\n\n图 2.1 – Sprite2D\
  \ 节点的一些属性\n\n\n\n就像你可以将同一张贴纸贴在多块积木上，或者为多个构建使用同一份说明书一样，Godot 中的资源在整个游戏中是可重用、可自定义且共享的。\n\
  \n它们本身并不构建结构，而是为你你已经组合好的部分添加样式、数据和行为。\n\n这种分层方法——`Nodes`（积木）、`Scenes`（模块）和 `Resources`（自定义细节和说明）——让\
  \ Godot 成为一个强大且直观的游戏构建工具，就像乐高让构建富有想象力的创造变得有趣且易于一样。\n\n## 创建额外的场景\n\n假设我们想要断开其中一块乐高积木（参见之前关于*乐高——理解\
