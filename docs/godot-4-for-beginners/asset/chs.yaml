  \ `Save Scene` 来保存你的新场景。将场景命名为 `main.tscn`，如图 3.4 所示：\n\n![img](img/B31515_03_4.png)\
  \ \n\n图 3.4 – 将我们的场景保存为 main\n\n我们为探索场景做好了准备。我们可以利用快捷键来轻松地完成操作。\n\n## 在场景中移动\n\n\
  你可以像在大多数 3D 游戏中那样在 3D 场景中移动：\n\n* 按住*鼠标右键* 环顾四周\n* 使用 `WASD` 在场景中飞行（在按住*右键点击*时）\n\
  * 使用 `E` 向上飞行\n* 使用 `Q` 向下飞行\n* 使用*鼠标中间键* 绕着屏幕上任何内容的中心飞行\n\n在 2D 中，我们使用 `Sprite2D`\
  \ 来视觉化物体。在 3D 中，我们将使用 `MeshInstance3D`。\n\n在 3D 图形中，**网格**（mesh）是 3D 对象或形状的数字模型，通过用线条（称为*顶点*）连接点和平面表面（*面*）来创建。\n\
  \n要在我们的场景中创建网格实例，我们可以将一个预先创建的 3D 模型拖到场景中，或者使用带有 `MeshInstance3D` 的原始形状。要做到这一点，向场景树添加一个新的\
  \ `MeshInstance3D` 节点：\n\n![img](img/B31515_03_5.png) \n\n图 3.5 – 向我们的场景添加 `MeshInstance3D`\
  \ 节点\n\n尽管我们现在有了一个网格，但仍然没有任何可见的物体。你可以把它想象成没有纹理的精灵。我们需要选择一个基础形状。使用右侧的 `Inspector`窗口，点击\
  \ `Mesh` 属性下拉菜单并选择 `New BoxMesh`。\n\n这将创建一个立方体，你可以使用相同的 `Select`、`Move`、`Rotate`\
  \ 和 `Scale` 工具对其进行操作。\n\n![img](img/B31515_03_6.png) \n\n图 3.6 – 为我们的 `MeshInstance3D`\
  \ 添加 `BoxMesh`\n\n现在 `MeshInstance3D` 有了网格形状，我们可以在视口（Viewport）中看到立方体或箱子：\n\n![img](img/B31515_03_7.png)\
  \ \n\n图 3.7 – `MeshInstance3D` 现在作为 3D 立方显示在视口中\n\n> 注意：在 2D 中，物体的位置和大小是以*像素*为单位的，而在\
  \ 3D 中，Godot 使用*公制*，因此每个单位是 1 米，代表 1 米 1 米的区域。\n\n我们可以使用 `MeshInstance3D` 中的多个简单形状制作一个\
  \ 3D 火柴人。看下下面的结果，并尝试使用 `Selection`、`Move`、`Rotate` 和 `Scale` 工具自己重新创建。\n\n![img](img/B31515_03_8.png)\
  \ \n\n\n\n\n在本小节中，我们将挑战自己，练习刚刚学习的技能。\n\n尝试复刻`图 3.16`所示的三种材质。第一种简单地使用了低粗糙度和高 `Metallic`（金属性）值的\
  \ `Albedo`（漫反射）。第二种使用了 `Transparency`（透明度），第三种具有 `Texture`（纹理）值。\n\n![img](img/B31515_03_16.png)\
  \ \n\n图 3.16 – 金属（左）、透明（中）和纹理（右）材质\n\n要完成挑战，首先向场景添加三个 `MeshInstance3D`节点。在 `Inspector`（检查器）窗口中，选择基础的\
  \ `CapsuleMesh`（胶囊体），并按 `Ctrl` + `D` 复制它。\n\n这些步骤的预期结果如`图 3.17`：\n\n![img](img/B31515_03_17.png)\
  \ \n\n图 3.17 – 带有 CapsuleMesh 形状的三个 MeshInstance3D 网格\n\n挑战的下一步是创建第一个材质。\n\n###\
  \ 第一个材质\n\n现在我们需要在 `Materials` 文件夹中创建三个新资源。我们将为每个材质使用 `StandardMaterial3D` 资源。为了方便识别，将材质命名为\
  \ `metal_material.tres`、`transparent_material.tres` 和 `textured_material.tres`：\n\
  \n![img](img/B31515_03_18.png) \n\n图 3.18 – 我们的新材质\n\n你可以点击并拖动每个材质到每个胶囊体上，这样当我们开始更改材质属性时，就能看到网格实时更新：\n\
  \n![img](img/B31515_03_19.png) \n\n图 3.19 – 将你的材质拖到胶囊体上\n\n在你的金属材质上，打开 `Albedo`\
  \ 属性并将颜色更改为与挑战相同的颜色（天蓝色）。同时调整 `roughness`（粗糙度）和 `Metallic` 属性，直到你满意它看起来光光且有反射，像金属一样。\n\
  \n![img](img/B31515_03_20.png) \n\n图 3.20 – 创建反光的金属材质\n\n注意在`图 3.20`中你应该调整的属性，以创建你想要的金属效果。\n\
  \n### 第二个材质\n\n再次开始，将材质的 `Albedo` 属性改为亮粉色以匹配挑战。同样将 `Alpha` 通道降低到一半左右。你会发现现在这没有效果。这是因为我们需要调整\
  \ `Transparency` 属性来使用 `Alpha`。\n\n![img](img/B31515_03_21.png) \n\n图 3.21 – 创建透明的粉色胶囊体\n\
  \n注意`图 3.21`中材质的属性，你需要调整这些属性来创建你想要的透明效果。\n\n### 第三个材质\n\n最后一个材质具有纹理而不是颜色。纹理简单来说就是包裹在胶囊形状上的图像。我们可以直接使用之前在`第\
  \ 2 章`处理 2D 工作时为 sprite 使用的同一个机器人图像。展开 `Albedo` 下拉菜单，并将图像拖到空的 `Texture` 属性上：\n\n\
  ![img](img/B31515_03_22.png) \n\n图 3.22 – 为材质添加纹理\n\n你可以清楚地看到机器人的平面 2D 图像已应用到胶囊形状上并在周围拉伸。\n\
  \n任何 3D 场景的另一个基本部分是光照。在下一节中，我们将探索不同类型的光以及如何在你的 3D 场景中有效使用它们。\n\n# 为场景创建光照\n\n为了影响情绪和氛围并在视觉上增强游戏，光照至关重要。良好的光照可以增加深度、突出细节并引导玩家的注意力，这些都让游戏世界更有沉浸感和吸引力。\n\
  \nGodot 提供了几种可用的光节点。我们现在将查看几个主要的节点。我们将这些节点添加到当前场景，并检查它们对这三个胶囊体的影响。\n\n点击 `scene\
  \ tree` 中的 `+` 向场景添加一个新节点。使用关键字 `light` 进行搜索。你会发现 Godot 中有三种与光相关的节点，如`图 3.23`所示：\n\
  \n![img](img/B31515_03_23.png) \n\n图 3.23 – Godot 中的三个主要光节点\n\n`Directional light`（平行光）通过向你的整个\
  \ 3D 场景投射平行光来模拟阳光，从特定方向提供一致的照明，非常适合户外环境。现在是在 Godot 中实现平行光的时候了。\n\n## 平行光\n\n向场景添加一个\
  \ `DirectionalLight3D` 节点。这种光模拟太阳，以平行光的形式向单方向发出无限光。它用于距离场景远的高强度光。\n\n在 Viewport\
  \ 中，节点是一个指向光来源的白色箭头。你可以 `rotate` 此节点来改变光的方向。此节点的位置不会影响场景，因为光来自各个地方。\n\n尝试旋转光以查看它对场景的影响。你也可以在\
  \ `Inspector` 窗口中更改光的 `Color`（颜色）和 `Energy`（能量）属性。\n\n你可以看到光来源的方向显示为一个大箭头。\n\n![img](img/B31515_03_24.png)\
  \ \n\n图 3.24 – 光的方向\n\n![img](img/B31515_03_25.png) \n\n图 3.25 – 颜色和能量属性\n\n![img](img/B31515_03_26.png)\
  \ \n\n图 3.26 – 切换可见性\n\n## 区域光\n\n点击 `scene tree` 中的 `+` 向场景添加一个新节点。使用关键字 `light`\
  \ 进行搜索。你会发现 Godot 中三种与光相关的节点。\n\n向场景添加一个 `OmniLight3D` 节点。此节点从单点向所有方向发射光，就像灯泡一样。就像现实中的灯泡一样，越靠近它就越亮。\n\
  \n![img](img/B31515_03_27.png) \n\n图 3.27 – 区域光的范围\n\n然而，没有表面反射的话很难看到。按照以下步骤操作：\n\
  \n1. 使用你的新技能通过添加另一个 `MeshInstance3D` 节点向场景添加表面。将其重命名为 `Ground`。\n2. 给它 `PlaneMesh`\
  \ 形状。缩放并移动平面，使其看起来像一个巨大的地板。\n3. 创建新材质并将其保存为 `ground_material.tres`。\n4. 将材质的 `Albedo`\
  \ 属性设置为 `white`（白色），并将其应用到 `Ground`。\n\n![img](img/B31515_03_28.png) \n\n图 3.28\
  \ – 添加了白色材质的 Ground 平\n\n去尝试更改 `OmniLight3D` 的 `Color` 和 `Energy` 属性。注意它是如何改变场景氛围的。\n\
  \n![img](img/B31515_03_29.png) \n\n图 3.29 – 改变 OmniLight3D 的颜色\n\n\n\n\n现在我们只剩下最后一个灯可以实验了。\n\
  \n## 聚光灯 (Spotlight)\n\n就像在剧院一样，`SpotLight3D` 是一个向单方向以锥形发射光的节点。这非常适用于头灯或路灯等光源。点击场景树中它们右侧的可见性切换开关来禁用\
  \ `OmniLight3D` 和 `DirectionalLight3D`。\n\n现在向场景添加一个 `Spotlight3D` 节点。你将看到光的锥形线框，同样，我们可以再次使用橙色小圆圈来改变光的范围和角度。\n\
  \n你可以在 `Figure 3.32` 中看到聚光灯投射的光锥显示为 `white` 色的锥体：\n\n![img](img/B31515_03_32.png)\n\
  \n图 3.32 – 将 `SpotLight3D` 放置在带有纹理的胶囊网格上\n\n当然，我们也可以更改光的 `Color`（颜色）和 `Energy`（能量）属性，并且可以像处理\
  \ `DirectionalLight3D` 那样开启阴影：\n\n![img](img/B31515_03_33.png)\n\n图 3.33 – 修改聚光灯的颜色和角度并开启阴影\n\
  \n现在你知道了如何在 Godot 中添加和操作这三种类型的灯，你已经拥有了为你的 3D *Made in Godot* 游戏创建氛围氛围。\n\n# 总结\n\
  \n在本章中，你通过 Godot 迈了 3D 游戏开发的第一步。你学习了如何使用网格（meshes）创建基础 3D 对象，为你的场景提供了构建块。然后，我们探索了如何通过应用材质、添加颜色、纹理和深度来增强这些对象。最后，我们引入了灯光，演示了如何使用不同类型的灯来营造氛围、突出重点区域并为你的场景增加真实感。\n\
  \n通过掌握这些技能，你现在拥有了设计和照亮简单 3D 环境的工具，为你继续在游戏开发之旅中进行更复杂的项目奠定了基础。\n\n在下一章中，我们将详细查看如何使用\
  \ `GDScript`，这是专为配合 Godot 引擎设计的内置编程语言。\n\n| 立即解锁此书的专属福利 | 扫描此二维码或访问 `packtpub.com/unlock`\
  \ ，然后按名称搜索此书。 | ![img](img/B31515_Unlock_Benefits_QR.png) |\n| *注意：在开始之前请准备好购买发票。*\
  \ | | |\n\n# 使用 GDScript 编写\n\n在本章中，你将开启 `GDScript` 之旅，这是 Godot 核心的脚本语言。脚本是游戏开发中至关重要的部分，让你能够控制游戏世界中的行为和交互。通过学习\
  \ `GDScript`，你将获得定义游戏机制、创建动态交互以及构建超越静态资产的功能。\n\n我们将首先向你展示如何在 Godot 中创建、编辑和保存脚本。然后，我们将介绍关键的编程概念，如变量和数据类型，以及它们如何与\
  \ Godot 的执行顺序共同工作。你将探索允许你进行计算和比较的数学和逻辑运算符，随后介绍使用 `if`、`else if` 和 `else` 语句进行决策。\n\
  \n最后，我们将深入研究内置函数和自定义函数的使用，以高效地构建你的代码。\n\n在本章中，我们将涵盖以下主要主题：\n\n*   理解 `GDScript`\n\
  *   创建脚本\n*   理解函数\n*   理解变量\n*   理解运算符\n*   关系和比较运算符\n*   使用自定义函数\n\n在本章结束时，你将拥有编写基本游戏机制的基础知识，并能自信地控制游戏的逻辑和流程。\n\
  \n# 技术要求\n\n本章的代码文件可以在此书的 GitHub 仓库中找到：`[`github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch4/introtoscripting`](https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch4/introtoscripting)`\n\
  \n访问此链接查看代码运行的视频：`[`packt.link/lmzgi`](https://packt.link/lmzgi)`\n\n# 理解 GDScript\n\
  \nGodot 拥有自己的内置脚本语言 `GDScript`，这是一种类似于 Python 的高级编程语言。与 Python 不同，`GDScript` 针对\
  \ Godot 基于场景的设计哲学进行了优化，并且可以指定变量的严格类型指定。\n\n脚本用于为我们的节点编写自定义行为。在接下来的几个小节中，我们将查看如何创建、编辑和保存脚本。\n\
  \n## 创建脚本\n\n我们之前已经处理过脚本了，但重复是很好的老师。所以，让我们记住脚本通常是附加到节点上的。\n\n从创建一个新的 Godot 项目开始。我将我的项目命名为\
  \ `IntroToScripting`。现在创建一个 2D 场景，这将为我们在场景树提供 `Node2D` 作为根节点。\n\n有几种不同的方法可以将脚本附加到此节点。选择\
  \ `Node2D`，在 `Inspector`（检查器）中找到 `Script` 属性并从 `<empty>` 下拉菜单选择 `New Script…`（新建脚本……）。\n\
  \n![img](img/B31515_04_1.png)\n\n图 4.1 – 通过检查器为节点添加新脚本\n\n你也可以右键点击想要附加脚本的节点，在弹出菜单中选择\
  \ `Attach Script…`（附加脚本……），点击带有加号的脚本图标。\n\n![img](img/B31515_04_2.png)\n\n图 4.2\
  \ – 通过右键附加脚本\n\n给你的脚本命名，例如 `IntroToScripting`，然后点击 `Create`（创建）。\n\n![img](img/B31515_04_3.png)\n\
  \n图 4.3 – 命名并创建脚本\n\n我们现在看到了脚本编辑器。这是 Godot 中 `GDScript` 编程语言的内置开发环境 (`IDE`)。与其他引擎相比，这是\
  \ Godot 的一个主要优势，因为你不需要第三方程序。\n\n如果你查看 `Figure 4.3`，你会看到我们勾了 `Template`（模板）旁的复选框，这意味着脚本将预填充一些代码。\n\
  \n在 `Figure 4.4` 中，我们可以看到预填充的代码：\n\n![img](img/B31515_04_4.png)\n\n图 4.4 – 脚本编辑器\n\
  \n如 `Figure 4.4` 所示，脚本文件现在出现在 `FileSystem`（文件系统）下，扩展名为 `.gd`。此外，我们还可以看到两个列表：`Filter\
  \ Scripts`（过滤脚本）包含了我们的脚本，`Filter Methods`（过滤方法）包含了函数。注意我我将 `Node2D` 重命名为 `IntroToScripting`\
  \ 以匹配脚本的名字。\n\n脚本编辑器带有代码格式化。你可以看到格式化是因为代码的不同部分具有不同的颜色。这有助于我们快速识别代码部分。你会注意到 `func`\
  \ 关键字是红色的，而函数名是蓝色的。**自动补全**也是一项功能，编辑器会尝试预测你输入的内容并提示选项。这提高了效率，并在你不确定某些内容时帮助你找到它们。\n\
  \n让我们逐行分解 `Figure 4.4` 中所示的代码：\n\n1.  第一行：`extends` 关键字是红色的，所以我们知道它是关键字，而 `Node2D`\
  \ 是深绿色的意味着它是一个类引用。\n\nGDScript 是一种面向对象的编程语言，这意味着将代码组织成类。将类想象成创建某物的蓝图。`Node2D` 是\
  \ Godot 中的内置类，由开发者预定义。通过编写 `extends Node2D`，我们是在告诉 Godot 我们想要使用 `Node2D` 的所有功能，同时添加我们自己的新功能和行为。\n\
  \n\n\n\n1. **第 4 行**：这一行是 `gray`（灰色），意味着它是一个 `comment`（注释）。这一行由程序员编写，用于解释后续代码的作用。它有助于更容易理解代码。哈希符号（`#`）告诉计算机在运行程序时忽略这一行；它仅供人类阅读。\n\
  \n2. **第 5 行**：`func` 关键字是 `red`（红色），显示它是 GDScript 中的一个特殊关键字。`_ready()` 是浅绿色的，意味着它是开发者为我们创建的\
  \ `built-in`（内置）函数。圆括号 `()` 告诉我们这是一个方法，而冒号 `:` 则意味着其之后所有缩进的内容都是该方法的一部分。\n\n3. **第\
  \ 6 行**：`pass` 关键字告诉计算机跳过这一行。你不能有一个空函数，所以 `pass` 可以防止程序报错。这里还有一个内联注释，它是一条提醒你用自己的代码来替换这一行，以便在函数中执行操作的笔记。\n\
  \n4. **第 9 行**：这里的注释解释了 `_process` 函数会在游戏的每一帧中运行一次。将每一帧想象成快速移动动画中的单张图片。游戏每秒显示许多帧以创建流畅的动作。`delta`\
  \ 变量是当前帧与上一帧之间的时间差，我们使用它来确保游戏的移动和动画保持流畅且一致，无论运行游戏的计算机速度有多快或有多慢。\n\n5. **第 10 行**：我们再次看到了\
  \ `func` 关键字，它告诉我们正在定义一个函数。`_process` 显示为绿色，意味着它是 Godot 提供的内置函数。在括号内部，我们看到了 `delta`\
  \ 这个词。这是一个 `parameter`（参数），它像是一段传递到函数中的小信息，帮助它执行任务。在这种情况下，`delta` 用于表示帧与帧之间的时间，确保游戏运行顺畅。\n\
  \n6. **第 11 行**：`pass` 关键字再次出现。`pass` 关键字告诉计算机跳过这一行。你不能有一个空函数，所以 `pass` 可以防止程序报错。\n\
  \n现在你已经学习了脚本的基础知识，下一部分将探索 GDScript 中最重要的工具之一：函数。我们将深入探讨函数是如何工作的，并从 `_ready` 和 `_process`\
  \ 等内置函数开始，这些函数有助于控制你游戏的流程和行为。\n\n# 理解函数\n\n**函数** 就像一组指令，告诉计算机执行特定的操作。把它想象成代码内部的一个微型程序。你给它起名字，当你\
  \ `call`（调用）该名字时，函数就会运行并执行它的工作。例如，如果你有一个名为 `player_jump()` 的函数，每当你调用它，计算机都会按照该函数中的步骤让玩家跳跃。函数有助于组织你的代码，这样你就不需要重复编写相同的指令。\n\
  \n有些函数是内置的，因为编程语言或引擎（如 Godot）的开发者已经创建了它们来处理常见或本质的任务。\n\n例如，有一个内置函数可以告诉游戏每帧更新屏幕。你不需要自己编写它，因为这是几乎每个游戏都需要的功能，而且它为你节省了时间。\n\
  \n但我们也需要编写自己的函数，因为每个游戏或程序都是不同的。你可能想创建一个函数，以特殊方式移动角色，或者检查玩家是否赢得了关卡。由于只有你确切知道游戏需要做什么，因此你可以创建自定义函数来处理这些特定任务。\n\
  \n在 Godot 中，内置函数如 `_ready` 和 `_process` 在控制游戏随时间推移的行为和更新方面起着至关重要的作用。以下是这些函数的作用：\n\
  \n* `_ready`：`_ready` 函数就像是节点的 `starting point`（起点）。把它想象成一切都已就绪并准备好运行的时刻，就像戏剧开始时幕布拉开的时刻。`_ready`\
  \ 函数是节点及其所有子节点一起进入场景树后第一个运行的函数。节点是从下往上加载的，子节点在它们的父节点之前加载。你可以在此函数中放置任何你想在对象一准备就绪时立即运行的代码，例如在屏幕上显示角色或启动动画。\n\
  \n* `_process`：`_process` 函数就像是你的游戏对象的 `heartbeat`（心跳）。它会反复运行，每帧运行一次（就像你游戏的每一帧快照）。你使用它来持续更新内容，例如移动角色或跟踪时间。函数内部的\
  \ `delta` 是一个小值，告诉你自上一帧以来已经过去了多少时间，因此你可以确保一切发生得平顺，无论运行游戏的计算机有多快有多慢。\n\n现在你已经理解了函数是如何工作的，你可以接受游戏循环（game\
  \ loop）的概念了。\n\n## 理解游戏循环\n\n大多数游戏运行在一个循环内部，该循环不断更新游戏中正在发生的事情——例如移动角色、检查碰撞以及在屏幕上绘制图形。这被称为\
  \ **game loop**（游戏循环）。它每秒运行多次（通常为每秒 60 次或更多），每次运行时，它都会更新并重新重绘游戏。\n\n在 Godot 中，你通常不需要自己写循环。相反，Godot\
  \ 会为你处理它。最常见的三个将在后续章节中讨论。\n\n### `_ready()`\n\n此函数在节点被添加到场景树时调用一次。它用于在游戏开始前进行任何设置。使用\
  \ `_ready()` 执行以下操作：\n\n* 设置初始值\n* 连接信号\n* 隐藏或显示内容\n* 准备任何只需要一次的内容\n\n### `_process(delta)`\n\
  \n此函数每帧运行一次。用于应该持续发生的事情，例如检查输入、更改动画或移动物体。注意 `delta` 是自上一帧以来的时间（秒）。这可以帮助你在帧率变化的情况下保持移动流畅。使用\
  \ `_process(delta)` 执行以下操作：\n\n* 玩家输入\n* 动画\n* UI 更新\n* 非物理相关的更新\n\n### `_physics_process(delta)`\n\
  \n这类似于 `_process`，但它以固定速率运行（默认每秒 60 次）。这使其非常适合涉及物理的任务，例如带有碰撞的移动。使用 `_physics_process(delta)`\
  \ 执行以下操作：\n\n* 物理计算\n* 使用 `move_and_slide()` 或 `move_and_collide()` 移动\n* 重力和跳跃\n\
  \n为了演示 `physics_process` 函数是如何工作的，请按照以下步骤操作：\n\n1. 创建一个以 **Sprite2D** 为根节点的新场景，如图\
  \ 4.5 所示。\n\n![img](img/B31515_04_5.png)\n\n图 4.5 – 作为场景节点的 Sprite2D 节点\n\n2. 使用\
  \ Godot `icon.svg` 文件作为精灵的纹理。\n\n3. 通过右键点击节点并选择 **Attach Script…** 或点击带有 **+** 符号的脚本图标附加脚本。在脚本中添加以下代码：\n\
  \n```\nextends Sprite2D\nvar speed = 100\nvar velocity = Vector2.ZERO\nfunc _ready():\n\
  \    print(\"精灵准备好移动了！\")\nfunc _process(delta):\n    # 输入并设置方向\n    velocity =\
  \ Vector2.ZERO\n    if Input.is_action_pressed(\"ui_right\"):\n        velocity.x\
  \ += 1\n    if Input.is_action_pressed(\"ui_left\"):\n        velocity.x -= 1\n\
  func _physics_process(delta):\n    # 使用物理移动精灵\n    position += velocity * speed\
  \ * delta\n```\n\n\n\n\n\n![img](img/3_G.png) **快速提示**：通过`AI Code Explainer`AI 代码解释器）和`Quick\
  \ Copy”（快速复制）功能增强你的编码体验。在下一代 Packt Reader 中打开此书。点击`Copy`按钮（`1`）可以快速将代码复制到你的编码环境中，或点击`Explain`按钮（`2`）让\
  \ AI 助手向你解释一段代码。\n\n![img](img/image_%282%29.png)\n\n![img](img/4_G2.png) 购买此书将免费赠送**下一代\
  \ Packt Reader**。扫描二维码 或访问 `packtpub.com/unlock`，然后使用搜索栏通过名称找到此书。双检显示的版本，以确保你获取的是正确的版本。\n\
  \n![一个白色背景上的二维码。AI 生成的内容可能不准确。](img/B31511_Unlock_Benefits_QR.png)\n\n当你运行场景时，场景加载后你将在\
  \ `Output`（输出）窗口中看到消息，然后你可以使用方向键将精灵向左或向右移动，游戏循环会不断更新屏幕。\n\n在下一节中，我们将探索编程中最基础的方面之一——`variables`变量。你将学习什么是变量、它们如何存储数据，以及如何使用它们管理游戏信息（例如玩家统计数据、得分等）。\n\
  \n# 理解变量\n\n将变量想象成带标签的盒子，你可以在里面存储信息。就像你可以把东西放在盒子里以后再回来它一样，变量持有着一段信息（如数字或单词），你可以在程序运行期间使用并更改它。\n\
  \n例如，如果你正在制作游戏并想要跟踪玩家的健康值，你会创建一个名为 `health` 的变量。每当玩家找到心形或受伤时，你都可以对 `health` 变量进行加法或减法。它帮助你的程序记住并处理数据，就像盒子装载你的物品，直到你需要用它为止。\n\
  \n我们可以在变量中存储不同类型的数据，但最常见的如下：\n\n* 整数（全数字），如 `1`、`2`、`3`\n* 实数（浮点数或小数），如 `0.1`、`0.2`、`0.3`\n\
  * 文本字符串（字符集合），如 `Hello World`、`ABC`、`\"@:!3\"`\n* 布尔值（真和假值），如 `True`、`False`、`0`、`1`\n\
  \n在下一节中，我们将探索编程中的基础概念变量。你将学习如何在 Godot 中定义变量，并遵循最佳实践在脚本中组织它们。\n\n## 创建变量\n\n在编程中，良好的做法是将变量放在脚本顶部，位于类定义或该类的扩展下方。我们将变量放在\
  \ `extends Node2D` 这一行下面。\n\n变量需要通过给它们指定一个名称和一个要存储的值来定义。我们编写 `var` 关键字告诉编译器这是一个变量。现在我们通过给它一个名称来识别我们的变量（我们将使用\
  \ `health` 作为名称）。要给它赋值，我们使用等号。这在编程中被称为`assignment operator`赋值运算符，它与数学中的相等性并不同。它的作用是将右侧的值赋给左侧的变量。\n\
  \n最后，我们必须分配一个初始或默认值——在这种情况下，我们将 `health` 设置为 `100`：\n\n```\nextends Node2D\nvar\
  \ health = 100\n```\n\n创建变量并赋值只是为了将值存储在计算机内存中。我们可以通过变量的名称访问此值。然后我们可以对值进行某些操作，例如将其输出到屏幕上。\n\
  \n为了这样做，我们需要调用内置的 `print` 函数并传入我们要打印的变量名称。只有在节点就绪后才能显示此值。调用 `print` 函数的最佳位置是 `_ready`\
  \ 函数中：\n\n```\nextends Node2D\nvar health = 100\n## 当节点首次进入场景树时调用。\nfunc _ready():\n\
  \    print(health)\n```\n\n接下来，运行程序。如果提示，选择使用当前场景作为主场景。注意，你不会在游戏窗口中看到任何输出。相反，该值将显示在\
  \ `Output` 窗口的控制台中。\n\n![img](img/B31515_04_6.png)\n\n图 4.6 – health 变量的值显示在 Output\
  \ 控制台中。\n\n建立变量后，理解它们可以持有的不同类型的数据至关重要。在下一节中，我们将探索数据类型，它们定义了你的变量存储的信息种类，从数字到文本等等。\n\
  \n## 数据类型\n\n在章节开头，我提到了我们变量中存储的不同类型的数据。将数据类型想象成用于存放特定信息的不同容器可能会有所帮助。就像你不会把水放在纸盒里或把食物放在瓶子里一样，在编程中，你根据正在处理的数据类型使用不同`types`变量。\n\
  \n以下是一些示例：\n\n* 数字放入名为 `int`（用于整数）或 `float`（用于小数）的容器中\n* 文本放入名为 `string` 的容器中（代表分组的字符）\n\
  * 布尔值只持有 `true` 或 `false`\n\n由于 GDScript 像 Python 一样是一种动态语言，我们不需要指定要存储的变量类型。然而，随着程序变大，有更多团队成员参与，通过指定数据类型更容易发现错误和\
  \ Bug。这可以防止人们将错误类型的数据存储在错误的变量中。\n\n我们可以这样修改健康变量：\n\n```gdscript\nextends Node2D\n\
  var health = 100\n```\n\n这不会影响程序的输出。当我们想要对值进行微调时，例如为了对玩家跳跃高度进行更细粒度的控制，可以使用 `float`。这是一个小数，并且可以这样创建：\n\
  \n```gdscript\nextends Node2D\nvar health = 100\nvar jump_strength = 220.5\n```\n\
  \n在此代码中，我们定义了一个名为 `jump_strength` 的变量，并指定其数据类型为 `float`，允许其存储小数。通过将其设置为 `220.5`，我们对角色可以跳的高度提供了更精确的控制，因为小数值比整数提供了更精细的调整。这对于细微调整就能产生巨大影响的游戏机制特别有用。\n\
  \n在下一节中，我们将探索编程中的命名规范，这是命名变量、函数和其他元素的重要指南。遵循这些规范不仅让你的代码更易读和理解，还能在项目增长时避免错误和困惑。\n\
  \n## 命名规范\n\n我们命名节点、场景、变量和函数的方式同样重要。命名规范是编程中命名事物（如变量、函数或类）的指南。它们有助于让你的代码更容易阅读和理解，不仅对你，也对可能参与你项目的人来说如此。\n\
  \n\n\n\n\n*   `snake_case` : 用于场景、变量和函数。它之所以被称为 `snake_case` 是因为每个新单词都用下划线连接，使得组合看起来像一条小蛇。\n\
  \n*   `SCREAMING_SNAKE_CASE` : 用于常量。所有字母字符均为大写。\n\n*   `PascalCase` : 用于类和场景中的节点。每个新单词的开头都是大写字母。\n\
  \n在命名时，最重要的元素是名称应该是有意义且具有描述性的，这样程序就能变得自文档化。\n\n通常情况下，对于冷却时间（cooldowns）和运行中对象的状态测试，我们会使用布尔值（Boolean\
  \ value）。例如，检查玩家当前是否正在冲刺：\n\n```\nextends Node2D\nvar health : int = 100\nvar jump_strength\
  \ : float = 220.5\nvar is_dashing : bool = true\n```\n\n在前面的代码中，声明了一个名为 `is_dashing`\
  \ 的布尔变量并将其初始化为值 `true`。这意味着玩家目前正处于冲刺状态。像这样的布尔变量通常用于跟踪游戏中的某个条件是否为真或为假。\n\n我们在这里将看到的最后一个变量是\
  \ `String`。`String` 用于存储字符组合，我们通常用它来存储文本。请注意，当我们定义 `String` 时，它的首字母是大写的。这是因为 `String`\
  \ 是一个类，与其他数据类型不同，因为它不是原始类型（primitive）。此外，`String` 还有许多与之相关的方法。我们可以使用 `String` 来存储玩家的名字。\n\
  \n在接下来的示例中，我们声明并初始化了一个 `String` 变量。字符串用于存储文本，例如玩家的名字。接下来的一行代码创建了一个名为 `player_name`\
  \ 的变量，并为它分配了默认值 `\"Unknown Player\"`。这允许我们在游戏中存储并显示玩家的名字。\n\n如果你查看以下代码，你会发现字符串被分配了它们独特的金色，这样在你的代码中就很容易识别出来：\n\
  \n```\nextends Node2D\nvar health : int = 100\nvar jump_strength : float = 220.5\n\
  var is_dashing : bool = true\nvar player_name : String = \"Unknown Player\"\n```\n\
  \n在接下来的章节中，我们将探索编程中**运算顺序**（order of operations）的概念。理解操作如何按照特定顺序执行对于编写准确且高效的代码至关重要。这确保了计算和逻辑按照正确的顺序执行以实现所需的结果。\n\
  \n# 理解运算符\n\n`Operators`（运算符）是用于在编程中执行操作的符号。\n\n这些运算符是基本的工具，允许你执行不同的操作，例如数学计算、比较和逻辑评估，帮助你控制代码的行为以及与数据交互的方式。\n\
  \n首先，让我们看看**数学运算符**（mathematical operators）：\n\n*   **加法 (Addition)**：`+` 号用于增加变量的值。\n\
  *   **减法 (Subtraction)**：`–` 号用于减少变量的值。\n*   **乘法 (Multiplication)**：`*` 号用于将变量的值乘以另一个值。\n\
  *   **除法 (Division)**：`/` 号用于将变量的值除以另一个值。\n\n我们可以尝试在程序中使用 `player_level` 变量来实验这些运算符。\n\
  \n在我们的代码中，玩家的等级是 `23`。如果我们加上 `7`，它将变为 `30`。查看这里的 `_ready()` 函数来直其实效果：\n\n```\nfunc\
  \ _ready():\n    print(player_name)\n    print(player_level)\n    print(player_exp)\n\
  \    print(has_key)\n    player_level = player+level + 7\n    print(player_level)\n\
  ```\n\n你现在会注意到输出首先是 `23`，然后当再次打印时，它变成了 `30`。\n\n需要注意的是，赋值操作是从右到左执行的。在这种情况下，我们获取值\
  \ `7`，将其加到 `player_level` 的当前值，然后使用赋值运算符 `(=)` 将结果存回左侧的 `player_level` 变量中。这意味着\
  \ `player_level` 的现有值用新结果更新了。\n\n在编程时，我们总是希望关注效率，这意味着避免重复。正如你所示，我们重复了变量名。为了以后避免这种情况，我们可以使用一种新运算符称为**快捷运算符**（shortcut\
  \ operator），我们可以如下更高效地重构代码：\n\n```\n#player_level = player_level + 7\nplayer_level\
  \ += 7\nprint(player_level)\n```\n\n如果我们想将等级降到 `0`，可以减去 `30`：\n\n```\nplayer_level\
  \ -= 30\nprint(player_level)\n```\n\n我们对乘法和除法也可以相同的操作：\n\n![img](img/B31515_04_7.png)\n\
  \n图 4.7 – 乘法与除法\n\n你也可以将变量相加。如果我们创建一个 `spike_damage` 的变量，那么每次玩家撞到尖刺时，我们就可以通过该值减少他们的生命：\n\
  \n![img](img/B31515_04_8.png)\n\n图 4.8 – 使用 `spike_damage` 变量\n\n在我们开始解决更复杂的表达式之前，理解运算顺序非常重要。\n\
  \n## 运算顺序\n\n虽然计算机一次运行一行，从程序的顶部到底部，但在数学和编程中，存在一种特定的顺序（就像在烹饪中需要先做某些事一样），运算顺序告诉计算机先执行计算的哪些部分。这里使用\
  \ **PEMDAS** 是一种简单的记忆方法：\n\n*   **括号 (Parentheses)**：先执行括号内的计算。\n*   **指数 (Exponents)**：然后计算幂或根（例如数字平方）。\n\
  *   **乘法和除法 (Multiplication and Division)**：接下来，从左到右执行乘法和除法。\n*   **加法和减法 (Addition\
  \ and Subtraction)**：最后，从左到右执行加法和减法。\n\n例如，在表达式 `3 + 5 * 2` 中，计算机先执行乘法 `5 * 2 =\
  \ 10`，然后执行加法 `3 + 10 = 13`，因为乘法在加法之前。\n\n## 练习题\n\n为了练习使用变量，尝试创建四个存储玩家信息的变量。每个变量应该使用不同的数据类型。这个练习还引入了一个重要的概念：作用域（scope）——请注意下面的解释。\n\
  \n变量如下：\n\n*   玩家名字\n*   玩家等级\n*   玩家经验值\n*   玩家是否有钥匙？\n\n练习的答案是：\n\n*   `var player_name\
  \ : String = \"Riptide\"`\n*   `var player_level : int = 23`\n*   `var player_exp\
  \ : float = 123.45`\n*   `var has_key : bool = false`\n\n我们可以在 `_ready()` 函数中将它们全部打印出来，每个占一行：\n\
  \n```\nfunc _ready():\n    print(player_name)\n    print(player_level)\n    print(player_exp)\n\
  \    print(has_key)\n```\n\n执行前面的代码会将值打印到控制台。\n\n变量作用域\n\n在前面的解决方案中，变量是在 `_ready()`\
  \ 函数内部声明和初始化的。这把变量的作用域限制为局部的（local），意味着它在声明它的 `_ready()` 函数内可访问。与类变量（定义在程序顶部且可以在整个类中访问）不同，局部变量只能在定义的特定函数或代码块中使用。这被称为**变量作用域**（variable\
  \ scope）。\n\n\n\n\n\n通常，我们需要比较两个值来确定它们是否满足特定条件（真或假）。这允许我们的代码根据比较结果进行分支并执行不同的操作。为了评估这些条件，我们使用关系运算符，它们能帮助我们比较值。\n\
  \n可用的不同比较运算符如下：\n\n- **相等**：使用两个等号（`==`）来测试两个值是否相同。\n- **大于**：使用角括号（`>`），我们可以比较一个值是否更大。\n\
  - **大于或等于**：使用（`>=`），我们可以测试一个值是否大于或等于另一个值。\n- **小于**：使用角括号（`<`），我们可以比较一个值是否更小。\n\
  - **小于或等于**：使用带有等号的角括号（`<=`），我们可以测试测试一个值是否小于或等于另一个值。\n- **不等于**：使用感叹号和等号（`!=`），我们可以测试一个值是否与另一个值不同。\n\
  \n我们在 `if` 语句中使用这些运算符，这是编程中的基础。这些 `if` 语句允许我们检查一个条件是否为真，只有当条件为真时，语句内部的代码块才会运行。这使得我们的游戏更加灵活，使其能够根据测试条件的结果执行不同的操作。\n\
  \n这些在以下代码中都有演示：\n\n```\nvar player_lives : int = 3\nif health == 0:\n    player_lives\
  \ -= 1\nif player_lives < 1:\n    print(\"GAME OVER!\")\nif player_lives <= 0:\n\
  \    print(\"GAME OVER!\")\nif spike_damage > health:\n    print(\"GAME OVER!\"\
  )\nif player_exp >= 1000:\n    player_level += 1\n    print(\"LEVEL UP\")\nif has_key\
  \ != true:\n    print(\"DOOR LOCKED\")\n```\n\n在前面的代码中，我们的游戏根据所比较变量的值产生不同的输出。\n\n\
  为了让游戏根据某些条件做出不同的响应，我们可以使用 `if`、`elif` 和 `else` 关键字。`if` 语句检查条件是否为真并运行其内部的代码。如果条件为\
  \ `false`，我们可以使用 `elif`（`else if` 的缩写）检查另一个条件。最后，`else` 用作默认值，当之前的所有条件都不为 `true`\
  \ 时运行。\n\n例如，假设我们想检查玩家拥有的生命数量并做出相应的响应，如下代码所示：\n\n```\nif player_lives > 0:\n   \
  \ print(\"Keep playing!\")\nelif player_lives == 0:\n    print(\"Game Over!\")\n\
  else:\n    print(\"Invalid number of lives!\")\n```\n\n前面的代码允许玩家在还有剩余生命的情况下继续游戏；如果没有，它会打印游戏结束，并且对于异常值，它会显示错误。\n\
  \n## 练习题\n\n为了获得该概念的经验，请编写脚本使用我们创建的 `health` 变量检查玩家的健康状况。根据健康状态显示不同的消息。\n\n- 如果健康为\
  \ `80` 或更高，打印 `\"You're in great shape!\"`\n- 如果健康在 `50` 到 `79` 之间，打印 `\"You're\
  \ doing okay, but be careful!\"`\n- 如果健康低于 `50`，打印 `\"Warning! Your health is low!\"\
  `\n- 如果健康为 `0` 或更低，打印 `\"Game over! You've run out of health.\"`\n\n使用 `if`、`elif`\
  \ 和 `else` 语句完成此任务。\n\n解决方案在这里：\n\n```python\n# 检查玩家健康状况并打印适当的消息\nif health >= 80:\n\
  \    print(\"You're in great shape!\")\nelif health >= 50:\n    print(\"You're doing\
  \ okay, but be careful!\")\nelif health > 0:\n    print(\"Warning! Your health is\
  \ low!\")\nelse:\n    print(\"Game over! You've run out of health.\")\n```\n\n前面的代码根据玩家健康变量的值显示正确的消息。\n\
  \n在下一节中，我们将深入学习在 Godot 中创建自定义函数。你将学习如何定义自己的函数来组织代码、提高其可重用性，并为你的游戏项目添加独特的功能。\n\n\
  # 使用自定义函数\n\n保持代码整洁和有序的一部分包括创建我们自己的自定义函数。自定义函数允许我们将代码拆分为更小的、可重用的部分，使其更容易理解和维护。我们并不局限于使用\
  \ Godot 自带的函数——我们可以定义自己的函数并在游戏中执行特定任务。\n\n要创建一个自定义函数，我们使用 `func` 关键字，后面跟着函数名（这是我们在代码中标识函数的方式）。名称之后，我们添加两个圆括号\
  \ `()`，它们可以包含任何我们传递给函数的信息（参数）。最后，我们用冒号（`:`）结束函数头，并在下一行定义函数将执行的操作（这被称为函数体）。\n\n我们已经有一个变量存储了尖刺造成的伤害值。如果我们写一个自定义函数，在每次我们被尖刺击中时调用它，将会怎样：\n\
  \n```python\n# 处理尖刺伤害并返回剩余 #health\nfunc take_spike_damage():\n    health -= damage_amount\n\
  \    if health <= 0:\n        print(\"Game Over\")\n    else:\n        print(\"\
  Player's current health: \", health)\n```\n\n在前面的代码中，我们的游戏根据所比较变量的值产生不同的输出。\n\n\
  为了让游戏根据某些条件做出不同的响应，我们可以使用 `if`、`elif` 和 `else` 关键字。`if` 语句检查条件是否为真并运行其内部的代码。如果条件为\
  \ `false`，我们可以使用 `elif`（`else if` 的缩写）检查另一个条件。最后，`else` 用作默认值，当之前的所有条件都不为 `true`\
  \ 时运行。\n\n例如，假设我们想检查玩家拥有的生命数量并做出相应的响应，如下代码所示：\n\n```python\nif player_lives > 0:\n\
  \    print(\"Keep playing!\")\nelif player_lives == 0:\n    print(\"Game Over!\"\
  )\nelse:\n    print(\"Invalid number of lives!\")\n```\n\n前面的代码允许玩家在还有剩余生命的情况下继续游戏；如果没有，它会打印游戏结束，并且对于异常值，它会显示错误。\n\
  \n## 参数与参数或函数输入\n\n函数可以接受输入值并产生输出，允许我们编写灵活且可重用的代码。这些输入在 GDScript 中被称为参数，它们允许我们在调用函数时向其传递信息。发送给函数的数据被称为参数（argument），而参数就像一个占位符变量，在函数内部持有该值。\n\
  \n例如，在 Godot 内置的 `_process(delta)` 函数中，传递了 `delta` 参数，代表自上一帧以来经过的时间。参数使得函数能够根据接收的数据有不同的行为，为我们的代码提供了灵活性。\n\
  \n我们可以更新 `take_spike_damage()` 函数以接收一个参数，用于定义尖刺造成的伤害。这样，函数在每次被调用时都可以处理不同的伤害值：\n\n\
  ```python\n# 带有参数的处理尖刺伤害的自定义函数\nfunc take_spike_damage(damage_amount):\n    health\
  \ -= damage_amount\n    if health <= 0:\n        print(\"Game Over\")\n    else:\n\
  \        print(\"Player's current health: \", health)\n```\n\n\n\n\n\n```\n## 当节点首次进入场景树时调用。\n\
  func _ready():\n    # 带有不同的伤害值调用函数\n    take_spike_damage(10) # 尖刺造成 10 点伤害\n  \
  \  take_spike_damage(5) # 尖刺造成 5 点伤害\n```\n\n在前面的代码中，我们必须记住为函数提供尖刺造成的伤害值。\n\n在接下来的章节中，我们将介绍如何在\
  \ Godot 中通过使用 `return` 关键字让函数返回输出。这允许函数在执行完任务后传回一个结果或值，然后该值可以在游戏中的其他地方使用。\n\n##\
  \ 函数可以返回输出\n\n函数不仅接受输入，还可以产生输出。在编程中，这是通过`返回值`（return values）实现的。返回值是函数在执行完其任务后提供的结果。通过使用\
  \ `return` 关键字，你可以将一个值传回调用该函数的地方。这允许函数执行计算或数据处理，然后返回结果供后续使用。\n\n我们可以修改之前的示例，添加一个函数来计算并返回玩家在受到伤害后的剩余血量。这将展示函数如何提供有用的结果。\n\
  \n```\n# 处理尖刺伤害并返回剩余血量的自定义函数\nfunc take_spike_damage(damage_amount) -> int:\n  \
  \  health -= damage_amount\n    if health <= 0:\n        print(\"Game Over\")\n\
  \        return 0 # 如果血量耗尽则返回 0\n    else:\n        print(\"玩家当前血量: \", health)\n\
  \        return health # 返回剩余血量\n```\n\n在前面的代码中，我们修改了函数以返回玩家健康变量的值。\n\n我们还需要修改对函数的调用，并存储和使用该结果：\n\
  \n```\n## 当节点首次进入场景树时调用。\nfunc _ready():\n    # 使用函数并存储返回值的示例\n    var remaining_health\
  \ = take_spike_damage(10)\n    # 假设 damage_amount 为 10\n    print(\"剩余血量: \", remaining_health)\n\
  ```\n\n在前面的代码中，我们现在将函数返回的结果存储在一个新变量中，然后将其打印出来。\n\n是时候练习所学的内容了。\n\n创建一个函数，根据受到的伤害来管理玩家血量。按照以下步骤操作：\n\
  \n1. 创建一个名为 `calculate_health_after_damage` 的函数。\n2. 该函数应该有两个参数：`current_health`\
  \ 和 `damage`。\n3. 在函数内部，从 `current_health` 中减去伤害并返回新的血量值。\n\n以下是调用该函数时的使用示例：\n\n\
  ```\n## 当节点首次进入场景树时调用。\nfunc _ready():\n    var player_health = 100\n    var spike_damage\
  \ = 20\n    var new_health = calculate_health_after_damage(player_health, spike_damage)\n\
  \    print(\"玩家新血量:\", new_health)\n```\n\n在前面的代码中，我们将计算玩家在受到伤害后血量的结果存储在一个新变量中，然后打印出该结果。\n\
  \n练习的解决方案所示：\n\n```\n## 定义计算玩家受到伤害后血量的函数\nfunc calculate_health_after_damage(current_health:\
  \ int, damage: int) -> int:\n    var new_health = current_health - damage\n    return\
  \ new_health\n```\n\n在前面的代码中，解决方案显示我们必须声明一个接受两个参数的函数，减去它们，并将结果作为整数返回。\n\n# 总结\n\n\
