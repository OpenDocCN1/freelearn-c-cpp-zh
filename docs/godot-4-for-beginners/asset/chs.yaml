  \ 3D 小游戏 – 第二部分*\n*   *第 10 章 ，*添加游戏润色 juice*\n*   *第 11 章 ，*理解游戏设计*\n*   *第 12\
  \ 章 ，*下一步去向何？*\n\n# 8：在 Godot 中创建 3D 小游戏 – 第一部分\n\n创建一个结构良好的 3D 游戏世界，需要理解如何组合场景、设计关卡以及实现功能控制器。在本章中，我们将进入\
  \ Godot 中 3D 游戏创建的核心构建模块。通过学习如何组合和组织场景，你将为创建动态、交互的环境奠下坚实的基础。\n\n你将从构建一个 3D 角色场景并挂载脚本控制其移动开始。接下来，你将学习如何通过结合静态物体、碰撞体和网格来设计关卡。我们还将实现一个相机控制器，提供平滑且响应迅速的玩家视角。最后，我们将所有内容整合到一个完整的关卡中并进行测试以确保功能完备。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n*   在 3D 中工作：Godot 的新维度\n*   构建 3D 角色\n*   创建关卡设计\n*   使用\
  \ `Character Controller` 脚本工作\n*   使用变量\n*   探索函数\n*   实现相机控制器\n*   运行测试\n\n在本章结束时，你将能够创建重用的\
  \ 3D 场景，控制你的玩家角色，并设计出具有视觉吸引力又实用的关。这些技能对于构建沉浸式 3D 游戏至关重要，并将未来章节中的高级功能铺平道路。\n\n# 技术要求\n\
  \n本章的代码文件可以在本书的 GitHub 仓库获取：`https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch8`\n\
  \n项目中使用的游戏资产由 Essssam 根据 **知识共享零号** (**CC0**) 许可发布。Essssam 允许我们在任何媒介或格式中传播、重混、改编并基于这些材料进行创作，甚至用于商业目的。\n\
  \n可以在此处找到：`https://essssam.itch.io/3d-leap-land`\n\n访问此链接查看代码运行视频：`https://packt.link/6dr7h`\n\
  \n## 在 3D 中工作：Godot 的新维度\n\n直到现在，我们一直在 2D 中工作——通过平面场景、精灵和屏幕空间移动学习 Godot 的基础。在本章中，我们将进入\
  \ 3D 世界，在更复杂的环境中处理深度、透视、光照和物理。\n\n虽然从 2D 到 3D 的过渡起初看起来可能令人生畏，但 Godot 一致的基于节点和基于场景的设计让这种跨越变得容易应对得多。模块化和层次结构的相同原理仍然适用——现在我们处理的是\
  \ `Node3D`、`MeshInstance3D` 和 `Camera3D` 等 3D 节点，并在三维空间中构建场景。\n\n本章将引导你完成创建基础 3D\
  \ 角色的过程。你将学习如何将必要的组件组合并组织成一个独立的场景，该场景稍后可以重用并集成到更大的 3D 世界中——就像我们在 2D 中做的那样。\n\n##\
  \ 构建 3D 角色\n\n仅仅因为我们现在在三维空间工作并不意味着 Godot 的节点和场景设计哲学发生了变化。我们将继续在各自的场景中设计不同的组件，然后使用它们来构建关卡或主场景。\n\
  \n### 重要备注\n\n注意，你可以通过按住`右鼠标键` 在 3D 场景中飞行。\n\n`右鼠标键` 允许你导航 3D 视口。我们将继续在各自的场景中设计不同的组件，然后使用它们来构建关卡或主场景。\n\
  \n1.  创建一个新的 `CharacterBody3D` 节点并将其命名为 `Player`。\n2.  创建一个 `assets` 文件夹并将 `obj`\
  \ 和 `tex` 文件移入。\n3.  作为 `Player` 的子节点添加 `MeshInstance3D` 节点。\n4.  选择 `MeshInstance3D`并在检查器（Inspector）中找到\
  \ `Mesh` 属性。从文件系统（FileSystem）中拖入 `slime.obj` 到此处。\n5.  从 `tex` 文件夹中拖入 `palette.png`\
  \ 到 `MeshInstance3D`。\n6.  作为 `Player` 的子节点添加 `CollisionShape3D` 节点。在检查器中找到 `Shape`\
  \ 属性并选择新的 `SphereShape3D`。调整碰撞框以适应史莱。\n7.  作为 `Player` 的子节点添加 `Camera3D` 节点。移动并旋转它以便看到史莱。\n\
  8.  作为 `Player` 根节点的节点添加 `DirectionalLight3D` 节点以照亮场景。\n\n\n\n2. 在 `MeshInstance3D`\
  \ 节点的 `Transform` 属性中，绕 `y` 轴旋转模型 180 度。\n\n3. 将场景保存为 `player.tscn` 并按下 `F6` 预览。它看起来应该像\
  \ `Figure 8.7` 所示：\n\n![img](img/B31515_08_7.png) \n\n图 8.7 – 游戏中史莱姆的视图\n\n`Player`\
  \ 场景现在大部分完成，准备好导入到更复杂的场景中（例如关卡场景），这也是我们接下来要做的工作。\n\n# 创建关卡设计\n\n现在我们已经创建了 3D 玩家角色，下一步是为他们构建一个可以存在并移动的关卡。\n\
  \nGodot 中的 `关卡设计` 意味着创建环境——地板、墙壁、平台和场景——这些元素构成了你游戏的可玩世界。在 3D 中，这涉及到在空间中放置和排列 3D\
  \ 对象，以定义玩家可以去哪里、可以与什么交互，以及游戏玩法将如何展开。\n\n在本节中，我们将使用 Godot 内置的节点和工具创建一个基础的 3D 关卡。结束时，你将拥有一个可以让角色行走和测试移动的空间。\n\
  \n## 创建关卡组件\n\n为了构建关卡，我们使用各种 `关卡组件`。这些是组成环境的各个部分，例如地板、墙壁、斜坡或平台。关卡组件通常由 `StaticBody3D`、`MeshInstance3D`\
  \ 和 `CollisionShape3D` 节点组成。\n\n关卡的大部分区域，如地面、墙壁、围栏、桥和其他非移动结构，都是使用 `StaticBody3D`\
  \ 节点创建的。这些对象在游戏过程中 intended 不会移动，也不会受物理力或碰撞的影响。相反，它们为游戏环境提供了稳定且优化的基础。\n\n对静态元素使用\
  \ `StaticBody3D` 节点非常重要，原因有以下几点：\n\n*   **性能**：Godot 通过将它们从涉及移动和碰撞解决的昂贵物理计算排除来优化\
  \ `StaticBody3D` 节点。这显著减少了 CPU 占用，尤其是在复杂场景中。\n*   **物理稳定性**：由于这些物体被固定在位置，它们为玩家或敌人等移动物体提供了可靠的碰撞表面，确保了交互的一致性。\n\
  *   **光照和烘焙**：静态物体与光照烘焙和全局照明系统配合良好。由于它们不会移动，可以精确计算光照贴和阴影，在不增加运行时性能成本的情况下提高视觉质量。\n\
  \n尽管 `StaticBody3D` 节点不响应物理力，但它们仍然可以通过代码或动画手动重新定位，例如在触发时升起吊桥或降低平台。这赋予了你灵活性，同时又不会牺牲及效率。\n\
  \n为了在 3D 空间中可视化这些组件，我们使用 `MeshInstance3D` 节点，它显示了对象的可见形状。为了让这些对象在游戏世界中具有交互性（例如允许玩家在上面行走或与它们碰撞），我们将它们与\
  \ `CollisionShape3D` 节点配对。让我们在下一节查看创建一个关卡组件的示例。\n\n### 示例：创建一个草地平台\n\n创建关卡组件的过程如步骤所示，并需要对每个组件重复操作：\n\
  \n1. 创建一个以 `StaticBody3D` 节点为根的新场景。将其重命名为 `Grass.`。将其保存为 `grass.tscn`。\n2. 添加一个\
  \ `MeshInstance3D` 节点并将 `Mesh` 属性设置为 `ground_grass_4.obj`。\n3. 将 `palette.png` 拖到模型上以设置纹理。\n\
  4. 添加一个 `CollisionShape3D` 节点并选择 `New BoxShape3D`。\n5. 使用句柄调整碰撞盒以适应地面模型。\n\n场景看起来应该像\
  \ `Figure 8.8` 所示：\n\n![img](img/B31515_08_8.png) \n\n图 8.8 – 地面场景\n\n#### 注意事项\n\
  \n注意，此过程需要在你想要添加到关卡的每个组件（关卡的一部分）中都重复一遍。这在 `Figure 8.9` 中作了注释。\n\n![img](img/B31515_08_9.png)\
  \ \n\n图 8.9 – 指向不同关卡组件的箭头（均为独立场景）\n\n在下一节中，我们将学习如何处理不规则的碰撞形状。\n\n## 处理不规则的碰撞形状\n\
  \n某些模型不符合规则的碰撞形状（如箱体或球体）——例如，弯曲或不平的结构，如桥。幸运的是，Godot 提供了工具来帮助为这些更复杂的模型自动生成碰撞形状。\n\
  \n为了看到实践中如何操作，我们将使用不规则网格设置一个 `Bridge` 场景，并让 ot 为其生成碰撞结构：\n\n1. 创建一个以 `StaticBody3D`\
  \ 为根的新场景。将其重命名为 `Bridge` 并将场景保存为 `bridge.tscn`。\n2. 添加一个 `MeshInstance3D` 节点并将 `Mesh`\
  \ 属性设置为 `bridge_1.obj`。\n3. 将 `palette.png` 拖到模型上以设置纹理。\n4. 选择 `MeshInstance3D`\
  \ 节点（Bridge 模型）。\n5. 点击屏幕顶部的 `Mesh` 菜单并点击 `Create Collision Shape…`，如 `Figure 8.10`\
  \ 所示：\n\n![img](img/B31515_08_10.png) \n\n图 8.10 – 为 Bridge 场景自动生成碰撞形状\n\n点击 `Create\
  \ Collision Shape…` 后，会弹出一个菜单。对于 `Collision Shape placement`，选择 `Sibling`，对于 `Collision\
  \ Shape Type`，选择 `Trimesh`。这在 `Figure 8.11` 所示：\n\n![img](img/B31515_08_11.png)\
  \ \n\n图 8.11 – Godot 创建碰撞形状的选项\n\n*   选择 `Sibling` 确保生成的碰撞形状作为网格并行的独立节点添加，而不是它的子节点。这保持了场景层级的整洁，并便于独立管理网格及其碰撞形状。\n\
  *   选择 `Trimesh` 作为碰撞类型对于不移动的静态 3D 模型（如关卡几何体）是理想的。`Trimesh` 碰撞创建一个与网格表面匹配的形状，允许精确的碰撞检测。然而，它最好仅用于静态对象，因为计算代价很大且不适合动态对象。\n\
  \n1. Godot 将为 `Bridge` 生成一个碰撞形状多边形，生成的场景树如 `Figure 8.12` 所示：\n\n![img](img/B31515_08_12.png)\
  \ \n\n图 8.12 – Bridge 场景的场景树\n\n#### 注意事项\n\n让 Godot 为对象生成碰撞形状的缺点是 `性能`。使用简单或原始形状更好。\n\
  \n## 创建布局\n\n在开始创建关卡时，我首先探索了资源包包含的模型。这些模型代表了各种环境元素，如地形、结构和道具。我使用了之前设置草地和桥时相同的方法：*将模型导入\
  \ Godot 并每个模型转换为场景*。\n\n通过为每个组件创建单独场景，我能够构建一组模块化的关卡元素。这些场景随后形成了完整的关卡布局。你可以遵循同样——从下载的资源包中选择模型（参考技术要求部分），为每个组件创建场景，然后在新场景中组合它们来设计你的关卡。\n\
  \n最后，确保在关卡场景中添加一个 `DirectionalLight3D` 节点。这确保了环境光良好，模型具有真实的阴影和深度。\n\n我创建的关卡如 `Figure\
  \ 8.13` 所示：\n\n![img](img/B31515_08_13.png) \n\n图 8.13 – 示例关卡\n\n接下来，我们将学习如何有效地组织关卡场景。\n\
  \n\n\n\n在 `Figure 8.13` 中，关卡中的每个组件都是独立的场景，这使得它们易于复用和管理。`Figure 8.14` 显示了我用于构建关卡的场景节点列表。请注意，我将相似或重复的对象——例如\
  \ `Fences`围栏、`Grass`草、`Crates`箱和 `Rocks`石头——分到了各自的父节点中：\n\n![img](img/B31515_08_14.png)\n\
  \n图 8.14 – 组成关卡的独立场景\n\n**分组**非常重要，因为它能保持场景树的整洁，特别是对于较大的关卡。它允许你同时移动或操作整类别的对象，从而节省时间并减少错误。例如，如果你想禁用所有围栏或对所有草应用着色器，将它们分组会让这一切简单得多。\n\
  \n值得注意的是，这些对象大部分（如地面、围栏、岩石和桥梁）都是静态的。它们在游戏过程中不会移动，应该使用 `StaticBody3D` 实现，以获得更好的性能和准确的物理效果。\n\
  \n相比之下，玩家等动态对象被设计为移动并对环境做出反应，因此使用启用物理的节点（如 `CharacterBody3D`）来实现。\n\n这种结构不仅有助于关卡设计，还能随着项目的增长确保平滑的性能和更整洁的代码管理。\n\
  \n如 `Figure 8.14` 所示，我们现在有一个复杂的 `Level 1` 场景，它由许多较小的场景组成。虽然场景中有一个玩家，但还没有办法控制它。在下一节中，我们将编写角色控制器脚本。\n\
  \n# 编写角色控制器脚本\n\n在本节中，我们将编写一个脚本，允许玩家在 3D 世界中移动角色。这个脚本是至关重要的，因为没有它，我们的角色将保持静态——无法在关卡中行走、奔跑或跳跃。在本节结束时，你将拥有一个完全可控制的玩家角色，它可以响应输入并以有意义的方式与游戏环境交互。\n\
  \n让我们开始为 `Player` 场景的 `CharacterBody3D` 节点添加新脚本。确保 `Empty` 的 `Template` 未勾选，这样我们就不会获得任何预设代码，并且可以像\
  \ `Figure 8.15` 所示创建一个完全自定义的角色控制器：\n\n![img](img/B31515_08_15.png)\n\n图 8.15 – 为玩家添加一个空脚本\n\
  \n当 `Template` 复选框未勾选时（如 `Figure 8.15` 所示），我们看到的脚本只有一行代码：\n\n```\nextends CharacterBody3D\n\
  ```\n\n这一行代码意味着该脚本正在添加或自定义 Godot 中内置的 `CharacterBody3D` 节点。`CharacterBody3D` 节点用于创建\
  \ 3D 角色（例如玩家或敌人），它们可以移动、跳跃或与环境交互。通过 `extending` 它，我们可以编写自己的代码来让角色的行为完全符合我们的意愿。\n\
  \n尽管我们在 `Player` 场景中添加了相机，但这不会是游戏过程中使用的唯一相机。相反，我们将在关卡中设置第二个静态相机，可以通过旋转它从不同角度查看玩家。在\
  \ Godot 中，一个场景可以包含多个相机，你可以通过在 `Inspector`（检查器）中将其标记为 `Current` 来选择哪一个处于激活状态。\n\n\
  ## 使用变量\n\n在深入代码之前，让我们花一点时间理解它在做什么。在这个脚本中，我们将定义一些重要的属性来控制玩家角色的移动方式，例如他们行走有多快或跳跃有多高。我们将使用\
  \ `exported variables`（导出变量），这意味着这些属性不仅在代码中定义，而且直接在 Godot 编辑器的 `Inspector` 面板中可见并可编辑。\n\
  \n这使得开发更加灵活且高效。例如，设计师和艺术家可以在不需要触碰代码的情况下微调移动速度、跳跃高度或重力等数值。同时，程序员可以保持脚本中逻辑的整洁。这种关注点分离有助于团队更有效地协作，让每个人都能快速测试和平衡游戏性平衡，而不会有损坏代码中任何内容的风险。\n\
  \n## 将玩家脚本与相机链接\n\n我们现在可以开始准备角色与游戏世界中的其他组件交互了。一个重要的元素是相机，它需要在玩家穿过关卡时流畅地跟随他们。为了实现这一点，我们将设置一种让\
  \ `Player` 脚本与控制相机的独立场景进行通信的方法。\n\n稍后，我们将创建一个 `View` 场景作为相机控制器。我们将为相机指定一个要跟随的目标（即\
  \ `player`）。我们还为添加对此 `View` 的引用，这样我们就可以直接从 `Player` 脚本控制相机的行为，例如旋转或缩放。\n\n首先在 `Player`\
  \ 脚本中添加这两行代码：\n\n```\n@export_subgroup(\"Components\")\n@export var view: Node3D\n\
  ```\n\n在这里，`@export` 注解使变量在 `Inspector` 中可见。在这种情况下，它还将将变量组织在 `CharacterBody3D` 节点属性下的一个名为\
  \ `Components` 的新类别或子组中。变量 `view` 现在将出现在该子组中，它的设计用于引用一个 `Node3D` 节点，我们将稍后创建该节点作为相机控制器。如\
  \ `Figure 8.16` 所示：\n\n![img](img/B31515_08_16.png)\n\n图 8.16 – 导出名为 Components\
  \ 的组和一个变量\n\n如 `Figure 8.16` 所示，添加 `@export` 注解使得变量在 `Inspector` 中可编辑，无需修改代码。\n\n\
  接下来为玩家的移动属性导出另一个组，包含跳跃强度：\n\n```\n@export_subgroup(\"Properties\")\n@export var\
  \ movement_speed = 250\n@export var jump_strength = 7\n```\n\n因为这些变量在 `Inspector`\
  \ 中可用，我们可以在测试游戏时通过调整数值来找到移动的正确*感觉*。\n\n现在为玩家添加一些通用变量：\n\n*   `movement_velocity`\
  \ : 用于存储玩家在空间移动的速度\n*   `rotation_direction` : 用于跟踪玩家转向的方向\n*   `gravity` : 用于模拟重力对玩家的影响\n\
  \n因此，在 `Player` 脚本中添加以下行：\n\n```\nvar movement_velocity: Vector3\nvar rotation_direction:\
  \ float\nvar vertical_velocity = 0\n```\n\n让我们理解此代码段中的重要元素：\n\n*   `movement_velocity`\
  \ 根据玩家输入存储速度向量\n*   `rotation_direction` 存储角色根据移动方向应该旋转的角度\n*   `vertical_velocity`\
  \ 跟踪作用在角色身上的垂直力\n\n除了移动，我们还需要变量来管理玩家的跳跃能力并跟踪收集物。具体而言，我们将变量来实现以下功能：\n\n*   检测玩家是否在地面\n\
  *   控制单跳和双跳\n*   计算玩家收集了多少 `Gems`\n\n让我们在脚本中定义这些变量：\n\n```\nvar previously_floored\
  \ = false\nvar jump_single = true\nvar jump_double = true\nvar gems = 0\nvar smoothing_factor\
  \ = 10\nconst GRAVITY = 25\n```\n\n在此代码段中，`previously_floored` 跟踪角色在上一帧是否在地面上，对于检测落地很有用。这在稍后代码中使用时会变得更加清晰。\n\
  \n最后，我们需要一个代表角色的视觉 3D 网格的引用变量。我们将使用这个引用在跳跃和落地时调整模型的比例——这是一种增加视觉吸引力的简单方法，在动画中被称为*挤压与拉伸*（squash\
  \ and stretch）。\n\n```\n@onready var model = $MeshInstance3D\n```\n\n\n\n\n\n这一行告诉\
  \ Godot 将 `MeshInstance3D` 节点（当前节点的子节点）赋值给变量 `model`，但只有在场景完全加载并准备就绪后才进行。`@onready`\
  \ 关键字确保在进行此引用时节点已经存在。\n\n## 添加引用变量的替代方法\n\n添加引用变量有一个快捷方法，就像之前为玩家模型使用的那种一样。你将想要引用的节点拖入脚本中，在你松开鼠标键时，按住键盘上的\
  \ `Ctrl` 键。Godot 将自动为你写出该引用，你可以根据需要对其进行重命名。这在*图 8.17*中所示：\n\n![img](img/B31515_08_17.png)\
  \ \n\n图 8.17 – 将节点拖入脚本并在松开时按住 Ctrl 键\n\n随着我们的 `Player` 脚本增长，保持结构有序和可读性至关重要。我们不会将所有逻辑写在一个长代码块中，而是将其拆分为更小的、专注于特定功能的函数。`Functions`\
  \ 允许我们将相关的代码行分组到一个名称下，使我们的脚本更整洁、更易理解且更易维护。\n\n在下一节中，我们将开始定义函数来处理角色行为的关键部分。每个函数将专注于一个特定的任务，帮助我们构建一个结构良好且可重用的角色控制器。\n\
  \n# 探索函数\n\n如前所述，随着玩家变得更加互动，控制它的脚本将变得更加复杂。为了保持代码整洁且易于管理，将其拆分为函数：即可重用的逻辑块，每个块处理一个特定的任务。\n\
  \n在本节中，我们将定义函数来控制重力、处理移动输入、管理跳跃行为并跟踪宝石收集。理解如何这样组织代码是在 Godot 中编写可扩展和易于维护的脚本的关键步骤。\n\
  \n让我们从创建一个处理重力的函数开始：\n\n```\nfunc handle_gravity(delta):\n    vertical_velocity\
  \ += GRAVITY * delta\n    if vertical_velocity > 0 and is_on_floor():\n        jump_single\
  \ = true\n        vertical_velocity = 0\n```\n\n让我们来拆解一下：\n\n* `vertical_velocity\
  \ += GRAVITY * delta` : 这会随着时间逐渐增加重力，模拟掉落的效果\n\n* `if vertical_velocity > 0 and\
  \ is_on_floor()` : 这检查玩家是否正在下落（`vertical_velocity > 0`）并且已经着（`is_on_floor()` 返回\
  \ `true`）\n\n* `jump_single = true` : 一旦玩家落地，我们就允许他们再次跳跃\n\n* `vertical_velocity\
  \ = 0` : 重置垂直速度，以免玩家继续向下加速\n\n此函数确保玩家受到重力影响，并且只有在落地后才能再次跳跃。\n\n现在，让我们创建一个处理跳跃的函数：\n\
  \n```\nfunc jump():\n    vertical_velocity = -jump_strength\n    model.scale = Vector3(0.5,\
  \ 1.5, 0.5)\n    if jump_single:\n        jump_single = false\n        jump_double\
  \ = true\n    else:\n        jump_double = false\n```\n\n让我们详细查看此部分：\n\n* `vertical_velocity\
  \ = -jump_strength` : 反转重力将玩家向上推，产生跳跃效果。\n\n* `model.scale = Vector3(0.5, 1.5, 0.5)`\
  \ : 增加了一个*挤压与拉伸*（squash and stretch）视觉效果，压缩玩家的宽度并夸大高度以增加游戏的趣味性（juice）。你将在*第 10 章中学习游戏趣味性。\n\
  \n* `if jump_single:` : 检查是否是第一次跳跃。\n\n* `jump_single = false` : 标记第一次跳跃已使用。\n\n\
  * `jump_double = true` : 在空中启用第二次跳跃。\n\n* `else` : 检查第一次跳跃是否已经使用。\n\n* `jump_double\
  \ = false` : 禁止进一步跳跃。\n\n此函数在管理单跳和双跳逻辑的同时，控制了跳跃的物理和视觉反馈。\n\n此时此刻，为我们的控制方案创建一个自定义输入映射是一个良好的习惯。让我们在下一节中深入探讨。\n\
  \n## 创建输入映射\n\nGodot 允许我们创建自己的 `input map`（输入映射），这是一个允许我们定义自定义动作（如 `jump` 或 `move_left`）并将一个或多个按键、鼠标按钮或手柄输入分配给每个动作的系统。有助于保持代码整洁灵活，因为我们可以通过名称引用动作，而不是直接检查特定的按键按下。\n\
  \n现在，让我们看看创建输入映射的步骤：\n\n1. 首先，点击 `Project` | `Project Settings` | `Input Map`。\n\
  \n2. 点击 `Add New Action` 处，输入动作名称（例如 `left`），然后按 `Enter`。重复多次操作，添加 `right`、`up`、`down`\
  \ 和 `jump` 的名称。稍后我们需要独立移动摄像头的动作，因此添加如 `camera_left`、`camera_right`、`camera_up` 和\
  \ `camera_down` 等动作。\n\n3. 现在，点击每个新动作对应的 `+` 号，然后按下你想要链接到动作的按键。这在*图 8.18*中所示。\n\n\
  ![img](img/B31515_08_18.png) \n\n图 8.18 – 将节点拖入脚本并在松开时按住 Ctrl 键\n\n## 实现控制和动作\n\n\
  现在我们已经如*图 8.18* 所示创建了输入动作，我们可以继续为玩家移动创建一个函数了。让我们处理输入：\n\n```\nfunc handle_controls(delta):\n\
  \    # 移动\n    var input := Vector3.ZERO\n    input.x = Input.get_axis(\"left\"\
  , \"right\")\n    input.z = Input.get_axis(\"up\", \"down\")\n    input = input.rotated(Vector3.UP,\
  \ view.rotation.z)\n    if input.length() > 1:\n        input = input.normalized()\n\
  \    movement_velocity = input * speed * delta\n    # 跳跃\n    if Input.is_action_just_pressed(\"\
  jump\"):\n        if jump_single or jump_double:\n            jump()\n```\n\n`handle_controls`\
  \ 函数将玩家方向（`left`、`right`、`up`、`down`）存储在 `input` 向量中。然后根据当前的 `view` 对进行调整。如果不进行此更改，移动将始终基于全局的\
  \ `x` 和 `z` 位置，而不是根据视角变化。\n\n为了保持玩家在所有方向上的速度相同，我们必须对输入进行归一化（将其长度设置为 `1`）。这确保了对角移动不会比单轴移动更快，否则在按下两个键时会给玩家带来意想不到的速度加速。\n\
  \n现在我们必须根据输入更新速度。为了处理跳跃，我们必须检测是否按下了跳跃键，如果玩家可以跳跃（即*单跳*或*双跳*），则调用 `jump()` 函数。\n\n\
  ## 处理游戏事件和反馈\n\n当玩家收集宝石时，我们将增加计数并向游戏的其他部分发送计数已更改的信号。为此在脚本顶部创建自定义信号。\n\n作为脚本的第二行代码，添加以下内容：\n\
  \n```\nsignal gem_collected\n```\n\n现在，**Inspector**中将出现一个新的信号，如*图 8.19*所示：\n\n\
  ![img](img/B31515_08_19.png) \n\n图 8.19 – 创建自定义信号\n\n接下来，我们在脚本中创建一个名为 `collect_gems()`\
  \ 的新函数。该函数所示：\n\n```\nfunc collect_gems():\n    gems += 1\n    gem_collected.emit(gems)\n\
  ```\n\n在此函数中，我们将更新宝石的当前计数并随当前计数发射 `gem_collected` 信号。\n\n现在，创建一个处理玩家移动的函数 `handle_movement(delta)`，如下所示和解释：\n\
  \n```\nfunc handle_movement(delta):\n    var applied_velocity: Vector3\n    applied_velocity\
  \ = velocity.lerp(movement_velocity,\n    delta * smoothing_factor)\n    applied_velocity.y\
  \ = -gravity\n    velocity = applied_velocity\n    move_and_slide()\n```\n\n\n\n\
  \n在这里，本地变量 `applied_velocity` 在每一帧中计算并存储玩家的速度。计算是通过 `lerp` 函数完成的，该函数使用线性插值将当前速度（`velocity`）缓慢移动到目标速度（`movement_velocity`）。这使得玩家的移动更加流畅。\n\
  \n## Note\n\n`线性插值`（Linear interpolation）是一种技术，通过计算机计算并填充中间的所有值，从而从一个值平滑或逐渐地移动到另一个值。\n\
  \n将速度的垂直部分设置为负重力，可以确保玩家在水平速度进行插值时受到重力的影响。\n\n最后，正如代码的最后两行所示，我们必须更新当前速度并调用 `move_and_slide`\
  \ 来移动角色并检测碰撞。\n\n现在我们需要一个函数来处理玩家的旋转：\n\n```\nfunc handle_rotation(delta):\n    if\
  \ Vector2(velocity.z, velocity.x).length() > 0:\n        rotation_direction = Vector2(velocity.z,\n\
  \        velocity.x).angle()\n    rotation.y = lerp_angle(rotation.y, rotation_direction,\n\
  \    delta * smoothing_factor)\n```\n\n在前面的代码中，`handle_rotation` 函数检查玩家是否在移动，然后通过计算移动方向的弧度角度来更新全局变量\
  \ `rotation_direction`。\n\n最后，使用角度插值将角色的 `y` 轴平滑旋转以面向移动方向，以防止任何突然的旋转变化。\n\n我们为玩家的最终自定义函数将处理落地时的重生和动画效果。如代码所示，创建\
  \ `handle_respawn()` 函数：\n\n```\nfunc handle_respawn(delta):\n    var border_position_y\
  \ = -10\n    # 玩家在以下位置以下重生的阈值\n    if position.y < border_position_y:\n        get_tree().reload_current_scene()\n\
  \    # 缩放动画（跳跃和落地）\n    model.scale = model.scale.lerp(Vector3(1, 1, 1), delta\n\
  \    * smoothing_factor)\n    # 落地时的动画\n    if is_on_floor() and vertical_velocity\
  \ > 2 and\n    !previously_floored:\n        model.scale = Vector3(1.25, 0.75, 1.25)\n\
  \    previously_floored = is_on_floor()\n```\n\n让我们研究一下 `handle_respawn()` 函数：\n\
  \n*   **场景加载（重生）**：如果玩家的 `position.y` 落在 `-10` 以下（意味着他们掉出了关卡），我们调用 `get_tree().reload_current_scene()`\
  \ 来重新加载当前场景并在起始位置重生玩家。\n*   **重置缩放（恢复尺寸）**：我们使用 `model.scale.lerp(Vector3(1, 1,\
  \ 1), delta * smoothing_factor)` 在跳跃或落地产生任何挤压伸效果后，将玩家的缩放逐渐插值回正常状态。\n*   **落地动画（挤压效果）**：如果玩家位于地面上（`is_on_floor()`）、之前掉落速度快（`gravity\
  \ > 2`），且上一帧不在地面（`!previously_floored`），我们通过将 `model.scale` 更改为 `Vector3(1.25, 0.75,\
  \ 1.25)` 来触发挤压效果。\n*   **地面状态跟踪**：最后，我们更新 `previously_floored` 变量以跟踪玩家在上一帧是否在地面上。\n\
  \n为了保持所有这些机制顺畅运行，我们需要在 Godot 的主物理循环中调用我们的自定义函数：\n\n```\nfunc _physics_process(delta):\n\
  \    handle_controls(delta)\n    handle_gravity(delta)\n    handle_movement(delta)\n\
  \    handle_rotation(delta)\n    handle_respawn(delta)\n```\n\n`_physics_process(delta)`\
  \ 函数是 Godot 内置的物理计算循环，每帧物理帧调用一次（默认每秒 60 次）。它确保我们的游戏逻辑无论帧率如何都能保持一致的运行。通过在这里调用我们的自定义函数，我们使重力、移动、跳跃、相机效果和重生与物理引擎同步。\n\
  \n现在我们的角色控制器已经工作了——处理了移动、跳跃和落地动画——是时候设置相机，让它在 3D 空间中正确地跟随玩家了。配置良好的相机可以通过帮助玩家保持方向感并专注于周围环境来提高游戏体验。在下一节中，我们将相机连接到玩家，并编写脚本使其平滑地响应玩家的移动和旋转。\n\
  \n# 实现相机控制器\n\n要开始配置相机，我们将首先创建一个新场景作为相机控制器，然后将其链接到玩家。\n\n1.  创建一个新场景并添加一个 `Node3D`\
  \ 节点作为根。将其重命名为 `View`。现在添加一个 `Camera3D` 节点作为子节点。场景树如图 8.20 所示：\n\n![img](img/B31515_08_20.png)\n\
  \n图 8.20 – View 的场景组成\n\n2.  选择 `Camera3D` 节点，并在 `Inspector`（检查器）中将 `Current` 属性设置为\
  \ `On`——标记此相机为要使用的相机。你也可以通过将 `FOV` 属性设置为 `40` 来调整视野。这如图 8.21 所示：\n\n![img](img/B31515_08_21.png)\n\
  \n图 8.21 – 设置相机为当前\n\n3.  现在，为 `View` 节点附加脚本并将其保存为 `view.gd`。确保将模板设置为 `Empty`。相机需要一个目标节点来观察。这将是玩家。\n\
  \n```\n@export_group(\"Properties\")\n@export var target: Node\n```\n\n这个导出的 `target`\
  \ 变量将出现在 `Inspector` 中，允许我们将 `Player` 节点拖入。这样相机就知道该跟随什么了。现在控制相机缩放和旋转速度的变量：\n\n```\n\
  @export_group(\"Zoom\")\n@export var zoom_minimum = 16\n@export var zoom_maximum\
  \ = 4\n@export var zoom_speed = 10\n```\n\n这些变量定义了缩放行为：`zoom_minimum` 和 `zoom_maximum`\
  \ 决定了相机放大的大小。此外，`zoom_speed` 控制缩放的速度。\n\n接下来，让我们定义 `rotation_speed` 变量：\n\n```\n\
  @export_group(\"Rotation\")\n@export var rotation_speed = 120\n```\n\n该变量设置了当玩家旋转或使用输入旋转相机时相机旋转的速度。\n\
  \n我们将使用两个标准变量来跟踪相机的当前旋转和缩放：\n\n```\nvar camera_rotation: Vector3\nvar zoom = 10\n\
  ```\n\n让我们进一步研究：\n\n*   `camera_rotation` 将存储相机的当前旋转角度（角度）\n*   `zoom` 跟踪当前的缩放值，我们将根据玩家输入随时间修改它\n\
  \n最后，我们需要此场景中实际的 `Camera3D` 节点的引用，以便对其进行操作：\n\n```\n@onready var camera = $Camera3D\n\
  ```\n\n在内置的 `_ready()` 函数中，我们将存储相机的初始旋转：\n\n```\nfunc _ready():\n    camera_rotation\
  \ = rotation_degrees \n```\n\n这使用相机的当前旋转角度初始化 `camera_rotation` 变量，以便我们从已知的起始点对其进行更新和修改。\n\
  \n就像玩家一样，相机可以在场景中移动。让我们创建一个函数来处理相机输入：\n\n\n\n\n\n```python\nfunc handle_input(delta):\n\
  \    # Rotation\n    var input := Vector3.ZERO\n    input.y = Input.get_axis(\"\
  camera_left\", \"camera_right\")\n    input.x = Input.get_axis(\"camera_up\", \"\
  camera_down\")\n    camera_rotation += input.limit_length(1.0) *\n    rotation_speed\
  \ * delta\n    camera_rotation.x = clamp(camera_rotation.x, -80, -10)\n    # Zooming\n\
  \    zoom += Input.get_axis(\"zoom_in\", \"zoom_out\") *\n    zoom_speed * delta\n\
  \    zoom = clamp(zoom, zoom_maximum, zoom_minimum)\n```\n\n`handle_input(delta)`\
  \ 函数根据玩家的输入处理相机旋转和缩放。水平和垂直旋转根据用户按下的按键存储在名为 `input` 的变量中。\n\n接下来，根据此输入更新相机旋转。输入被限制在最大\
  \ `1.0`，我们将其乘以 `rotation_speed` 变量和 `delta` 以确保一切运行平滑。最后，我们将垂直旋转限制在 `-80` 到 `-10`\
  \ 度之间。这是为了避免过度倾斜。\n\n对于缩放，我们根据玩家输入更新 `zoom` 变量，然后将其乘以缩放速度和 `delta` 以确保缩放平滑。同样，我们将缩放级别限制在预定义的最小和最大缩放值之间。\n\
  \n接下来，`_physics_process` 函数需要按照如下实现：\n\n```python\nfunc _physics_process(delta):\n\
  \    # Set position and rotation to targets\n    self.position = self.position.lerp(target.position,\n\
  \    delta * 4)\n    rotation_degrees =\n    rotation_degrees.lerp(camera_rotation,\
  \ delta * 6)\n    camera.position = camera.position.lerp(Vector3(0, 0,\n    zoom),\
  \ 8 * delta)\n    handle_input(delta)\n```\n\n再次使用线性插值（Linear interpolation）来平滑地移动相机位置到目标（玩家）。\n\
  \n我们通过乘以 `delta * 4` 来控制重新定位的速度。\n\n现在，使用线性插值并乘以 `delta * 6` 作为速度，将当前旋转平滑地移动到所需的旋转。\n\
  \n为了实现平滑缩放效果，我们沿着 `z` 轴移动相机位置以匹配缩放级别。我们乘以 `delta * 8` 来控制速度。\n\n最后，我们调用 `handle_input(delta)`\
  \ 函数，它处理玩家输入并控制相机的移动。\n\n尽管我们希望一切都能按预期运行，但我们仍然需要进行测试、修正并再次测试。这使得游戏开发成为一个迭代过程：我们进行更改，测试该更改是否产生了我们预期的结果，并以这种方式继续。因此，我们的下一步是测试目前为止所做的工作。\n\
  \n## 运行测试\n\n返回 `Level 1` 场景。将 `View` 场景拖入关卡。将 `Player` 场景拖入关卡。选择 `View` 节点，并将 `Player`\
  \ 场景拖入 `View` 的 `Target` 属性中，如图 8.22 所示：\n\n![img](img/B31515_08_22.png)\n\n图 8.22\
  \ – 将玩家设置为摄像机跟随的目标\n\n现在选择 `Player` 节点。在 `Inspector`（检查器）中，将 `View` 场景拖入 `View`\
  \ 属性，以便玩家使用我们的 `View` 场景作为相机控制器。如图 8.23 所示：\n\n![img](img/B31515_08_23.png)\n\n\
  图 8.23 – 将我们的 View 场景设置为玩家的相机控制器\n\n现在运行 `Level 1` 场景并测试游戏。你可以移动玩家和相机在关卡中移动！\n\n\
  # 总结\n\n在本章中，我们探索了如何为关卡构建和组织场景。我们从使用 `StaticBody3D`、`MeshInstance3D` 和 `CollisionShape3D`\
  \ 节点创建简单场景开始，表示游戏世界中的对象。\n\n接下来，我们设计了一个带有控制移动的 `Player` 场景，并添加了一个独立的 `View` 场景，其中包含一个玩家可以控制的\
  \ `Camera3D` 节点。最后，我们通过组装复杂的关卡场景，将所有的单个场景组件结合在一起。\n\n在下一章中，我们将添加危险因素和收集品。\n\n# 加入我们的\
  \ Discord 社区\n\n加入我们社区的 Discord 空间，与作者和其他读者进行讨论：\n\n`packt.link/godot-4-game-dev`\n\
  \n![一个带有几个黑色方块的二维码，AI 生成的内容可能不准确。](img/Discord_QR.png)\n\n# 9\n\n# 在 Godot 中创建 3D\
  \ 迷易游戏 – 第二部分\n\n精通游戏机制和完善玩家体验是创建引人入胜关卡的关键步骤。在本章中，我们将深入研究交互式和动态元素的设计，以增强游戏性并提升你关卡的整体感觉。你将学习如何创建赋予临时能力的收集性强化道具，引入障碍物来挑战玩家，并添加视觉和音频效果让环境栩如生。\n\
  \n通过实践活动，你将实现一个可以临时提高玩家跳跃高度的收集品，让他们触到达新的平台。你将设计一个可以发射炮弹的大炮，提供设计感。在本章中，我们将涵盖：\n\n\
  *   探索收集品\n*   引入障碍物\n*   完成我们的关卡\n\n在本章结束时，你将拥有一个可玩的关卡，并为未来应对更复杂的机制做好准备。\n\n本章的文件可以在此处获取：[`github.com/PacktPublishing/Godot-4-Beginners/tree/ch9`](https://github.com/PacktPublishing/Godot-4-Beginners/tree/ch9)\n\
