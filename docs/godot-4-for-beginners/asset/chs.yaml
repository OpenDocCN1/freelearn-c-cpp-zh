  如果你是游戏开发者、游戏设计师、技术美术或在 `Godot Engine` 和 `GDScript` 编程语言方面有经验的单人开发者，这本书就是为你准备的。它非常适合希望创建稳固、可重用且可靠，并随其创意愿景不断适应和成的专业人士。”\n\
  \n*   Bradfield, C. (2023). *Godot 4 游戏开发项目：使用最强大的开源游戏引擎之一构建五款跨平台 2D 和 3D 游戏* .\
  \ Packt Publishing Ltd. ([`www.packtpub.com/en-in/product/godot-4-game-development-9781804616987`](https://www.packtpub.com/en-in/product/godot-4-game-development-9781804616987))\n\
