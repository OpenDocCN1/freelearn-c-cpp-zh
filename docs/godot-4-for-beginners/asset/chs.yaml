  \n![img](img/B31515_Image_QR.png)\n\n1. 如你在*图 7.4* 中所示，顶部的栏中有用于动画的控件。我将空闲帧率设置为 `20\
  \ FPS`，并开启了循环。你可以尝试这些设置以找到你喜欢的。你可以在*图 7.5* 中看到此：\n\n![img](img/B31515_07_5.png)\
  \ \n\nFigure 7.5 – 突出显示循环和 FPS 的动画控制\n\n1. 为了完成草莓可收集物品的设置，我们需要作为 `Area2D` 节点的子添加一个\
  \ `CollisionShape2D` 节点。对于该节点的 `Shape` 属性，选择 `CapsuleShape2D` 视口（Viewport）中调整它以适应草莓。这在*图\
  \ 7.6* 中所示：\n\n![img](img/B31515_07_6.png) \n\nFigure 7.6 – 调整碰撞范围以适应草莓\n\n草莓现在可以与物体碰撞，并检测物体何时与它碰撞。我们需要编写代码来为草莓制作动画，并在玩家与它碰撞时执行某些操作，例如移除草莓并在玩家的草莓收集分数上加\
  \ `1`。\n\n## 实现莓脚本\n\n草莓只需要只需要做两件事：制作动画以及在玩家收集它时消失。我们现在将编写草莓来完成这两件事。\n\n在 `Strawberry`\
  \ 场景中，选择你的 `Strawberry` 节点并点击 `Attach New Script` 按钮/图标，如*图 7.7* 所示：\n\n![img](img/B31515_07_7.png)\
  \ \n\nFigure 7.7 – 挂载新脚本按钮/图标\n\n`idle` 动画必须重复播放；我们已经将其设置为循环，因此在 `ready` 函数中，我们只需要启动动画。为了方便引用场景中的其他节点，Godot\
  \ 提供了一个快捷方式。通过在节点名称前加上美元符号（`$`），我们可以快速访问该节点及其函数。\n\n这种快捷方式在频繁与场景中的其他节点交互时特别有用（例如控制角色动画或更新\
  \ UI 元素），因为它能保持代码更具可读且高效。使用此快捷方式播放草莓的 `idle` 动画，如下代码所示：\n\n```\nfunc _ready():\n\
  \    $AnimatedSprite2D.play(\"idle\")\n```\n\n当我们的玩家与草莓碰撞或重叠时，我们希望信号草莓执行一个函数。在函数中，我们可以从关卡中移除草莓，并将玩家收集的草莓数量加\
  \ `1`。`Area2D` 节点可以响应多种内置信号，其中一个当物体进入节点区域时。\n\n要设置此项，选择 `Strawberry` 节点，然后点击 `Node`\
  \ 选项卡（`Inspector` 选项卡的右侧）。在 `Signals` 类别下，在 `Area2D` 下，选择 `body_entered` 信号并点击右下角的\
  \ `Connect`，或者简单双击信号名称。这在*图 7.8* 中所示：\n\n![img](img/B31515_07_8.png)\n\nFigure 7.8\
  \ – body_entered 信号\n\n\n\n我们将使用 `Mushroom` 敌人。创建一个新场景并使用 `CharacterBody2D`、`AnimatedSprite2D`\
  \ 和 `CollisionShape2D` 进行设置，其中 `CapsuleShape2D` 仅覆盖蘑菇的一部分，如*图 7.12* 所示：\n\n![img](img/B31515_07_12.png)\n\
  \n图 7.12 – 设置 Mushroom 场景\n\n使用 `Mushroom` 敌人文件夹中提供的帧集，并设置 `SpriteFrames` 以及 `idle`（待机）和\
  \ `run`（运行）动画，使其在 `20 FPS` 下循环播放。我使用 `idle` 中的一帧并对其旋转创建了自己的 `death`（死亡）动画，如图*图 7.13*所示：\n\
  \n![img](img/B31515_07_13.png)\n\n图 7.13 – Mushroom 敌人的动画\n\n为 `Mushroom` 节点挂载新脚本，并确保使用的模板是空对象（empty\
  \ object），如图*图 7.14*所示：\n\n![img](img/B31515_07_14.png)\n\n图 7.14 – 使用对象：Mushroom\
  \ 敌人的空模板\n\n使用 `Empty` 模板将确保我们的脚本创建时没有默认或添加的代码，并且尽可能简单。\n\n添加代码来设置蘑菇的 own、方向和健康值，代码所示：\n\
  \n```\nextends CharacterBody2D\nconst SPEED = 75\nvar direction = 1\nvar health\
  \ = 1\n```\n\n注意，`direction` 变量的值将 `-1` 或 `1`，分别表示向左或向右移动。\n\n现在，我们有了控制 Mushroom\
  \ 敌人速度、方向和健康值的变量。\n\n此外，添加一个函数为蘑菇应用重力，允许它掉落并接触地面，代码所示：\n\n```python\nfunc add_gravity(delta):\n\
  \    # Add gravity.\n    if not is_on_floor():\n        velocity += get_gravity()\
  \ * delta\n```\n\n如果蘑菇不在地面上，重力将将其向下拉。\n\n现在，创建一个函数来让蘑菇移动。我将其命名为 `update_direction()`，它所做的只是让敌人以恒定速度向右移动，代码所示：\n\
  \n```python\nfunc update_direction():\n    # Move enemy at constant speed\n    velocity.x\
  \ = SPEED * direction\n```\n\n蘑菇在水平面上的速度乘以速度和方向。\n\n这两个函数都必须在 `_physics_process(delta)`\
  \ 函数中配合 `move_and_slide()` 一起调用，代码所示：\n\n```python\nfunc _physics_process(delta):\n\
  \    add_gravity(delta)\n    update_direction()\n    move_and_slide()\n```\n\n我们还必须在蘑菇上设置碰撞，使其与地板和玩家碰撞。通过开启\
  \ `Collision Layer` `1` 并开启 `Collision Mask` `1`、`2` 和 `3` 来实现。\n\n如果现在将一个蘑菇放入关卡并运行游戏，蘑菇将开始向右移动，直到碰撞墙壁。\n\
  \n我们将使用内置的 `is_on_wall()` 函数检测蘑菇何时碰撞墙壁，并反转它的方向，代码所示：\n\n```python\nfunc reverse_direction():\n\
  \    #Reverse direction when hitting a wall\n    if is_on_wall():\n        direction\
  \ = -direction\n```\n\n注意，通过反转或否定 `direction` 的值，我们可以判断蘑菇是向左还是向右移动。\n\n确保在调用 `move_and_slide()`\
  \ 之后调用 `reverse_direction()`，代码所示，否则碰撞将无法正确检测：\n\n```python\nfunc _physics_process(delta):\n\
  \    add_gravity(delta)\n    moveEnemy()\n    move_and_slide()\n    reverse_direction()\n\
  ```\n\n如果你将蘑菇放在一个悬空平台上，当它到达平台边缘时，它会掉落。为了防止这种情况，使用 `RayCast2D` 节点检测蘑菇何时靠近边缘并反转方向。为\
  \ `Mushroom` 的子节点添加 `RayCast2D` 节点，如图*图 7.15*所示：\n\n![img](img/B31515_07_15.png)\n\
  \n图 7.15 – 为我们的 Mushroom 节点添加 RayCast 节点\n\n`RayCast2D` 仅仅是对象发射的一条不可见的射线，用于在发射的方向上寻找碰撞。在这种情况下，我们正在寻找下方的碰撞，以确定我们何时不再地板上。我们的射线发射在蘑菇稍微右侧一点（我使用了\
  \ `Target Position` `x`: `0`, `y`: `14` 以及 `Transform Position` `x`: `15` 和 `y`:\
  \ `7`），这样我们就能看到自己何时接近*无地板区域*，并在掉落前反转方向！如图*图 7.16* 所示放置你的射线：\n\n![img](img/B31515_07_16.png)\n\
  \n图 7.16 – 从蘑菇右侧向下发射射线\n\n现在，我们可以写一个函数，当射线未与地板碰撞时反转蘑菇的方向，并将射线移动到相反侧。\n\n```python\n\
  func platform_edge():\n    if not $RayCast2D.is_colliding():\n        direction\
  \ *= -1\n        $RayCast2D.position.x *= -1\n```\n\n注意，通过反转或否定 `direction` 的值，我们可以判断蘑菇是向左还是向右移动。\n\
  \n\n\n当蘑菇（Mushroom）的健康值为 `0` 时，它应该禁用碰撞，停止与玩家的碰撞检测，并播放 `death` 动画。可以通过下面的自定义函数实现：\n\
  \n```\nfunc mushroom_death():\n    if health <= 0:\n        $CollisionShape2D.disabled\
  \ = true\n        $HurtPlayerZone.monitoring = false\n        $AnimatedSprite2D.play(\"\
  death\")\n```\n\n`mushroom_death()` 函数应该在 `_physics_process()` 函数中调用，如代码所示：\n\n\
  ```\nfunc _physics_process(delta):\n    add_gravity(delta)\n    moveEnemy()\n  \
  \  move_and_slide()\n    reverse_direction()\n    platform_edge()\n    mushroom_death()\n\
  ```\n\n连接蘑菇 `AnimatedSprite2D` 节点的 `_on_animated_sprite_2d_animation_finished()`\
  \ 信号。当 `death` 动画结束时，它将触发函数将蘑菇从场景中移除，如代码所示：\n\n```\nfunc _on_animated_sprite_2d_animation_finished():\n\
  \    if $AnimatedSprite2D.animation == \"death\":\n        queue_free()\n```\n\n\
  在你的关卡中添加更多蘑菇和收集品。为了防止场景树过于拥挤，添加一个类型为 `Node` 的子节点。将其重命名为 `Enemies` 并将所有蘑菇拖到它下方。你可以对\
  \ `Collectibles` 执行同样的操作，如图 7.18 所示：\n\n![img](img/B31515_07_18.png) \n\n图 7.18\
  \ – 通过分组节点组织场景树\n\n现在关卡有了敌人和收集品，我们需要一个 `win` 条件。根据我们的目的，一旦玩家收集了所有的草莓（Strawberries），一个检查点旗帜就会升起。触摸该旗帜将结束关卡。让我们在下一节学习更多关于关卡完成的知识。\n\
  \n## 实现关卡完成\n\n关卡完成机制是任何游戏中至关重要的部分，为玩家提供成就感和结束感。在本节中，我们将创建一个系统，收集所有草莓将触发一系列事件：检查点旗帜播放动画并飞出，信号目标完成。玩家随后移动到旗帜处，触摸它即可结束关卡。\n\
  \n该系统不仅增加了视觉和交互亮点，还强化了玩家的进度和目标达成。到本节结束，你将拥有一个精美且有回报的关卡完成序列，增强你游戏的整体体验。\n\n创建一个包含以下内容的新场景：\n\
  \n*   `Area2D` 作为根节点（重命名为 `CheckPoint`）\n*   `AnimatedSprite2D`\n*   带有 `RectangleShape2D`\
  \ 的 `CollisionShape2D`\n\n场景树如图 7.19 所示：\n\n![img](img/B31515_07_19.png) \n\n图 7.19\
  \ – 检查点场景的场景树\n\n为旗帜创建三个动画，分别命名为 `flag_fly`、`idle` 和 `trigger`。在 Pixel Frog 的 `assets`\
  \ 文件夹中，导航到 `Items` | `Checkpoints` | `Checkpoint` 文件夹。\n\n*   对于 `idle` 动画，使用 `Checkpoint\
  \ (No Flag).png` 的单帧。\n*   对于 `trigger` 动画，使用 `Checkpoint (Flag Out).png` 精灵集。不要循环动画，并以\
  \ `20 FPS` 运行。\n*   对于 `flag_fly` 动画，使用 `Checkpoint (Flag Idle).png` 精灵集。循环动画并以\
  \ `20 FPS` 运行。\n\n`flag_fly` 动画的示例图如图 7.20 所示：\n\n![img](img/B31515_07_20.png) \n\
  \n图 7.20 – 为检查点设置旗帜动画\n\n为 `CheckPoint` 节点挂载脚本以自定义其行为。我们将创建自己的信号来触发旗帜飞出。一旦玩家收集了关卡中所有的草莓，玩家将发射\
  \ `trigger` 信号。`CheckPoint` 的代码显示并解释如下：\n\n```\nextends Area2D\nsignal trigger\n\
  var level_complete = false\n## 动画播放完成时运行的信号\nfunc _on_animated_sprite_2d_animation_finished():\n\
  \    $AnimatedSprite2D.play(\"flag_fly\")\n    level_complete = true\n## 我们自定义的信号\n\
  func _on_trigger():\n    $AnimatedSprite2D.play(\"trigger\")\n## 当刚体进入时运行的信号\nfunc\
  \ _on_body_entered(body):\n    if level_complete:\n        get_tree().quit()\n```\n\
  \n如所示，我们创建了自己的信号并将其命名为 `trigger`。然后，在 `Inspector`（检查器）中，我们将该信号连接到脚本。我们还有一个名为 `level_complete`\
  \ 的布尔变量来判断关卡何时完成。链接到信号的 `trigger` 函数播放 `trigger` 动画，然后信号动画完成，这将切换到 `flag_fly` 动画并将\
  \ `level_complete` 设置为 `true`。目前，当玩家触摸旗帜时，游戏将退出。\n\n然而，我们需要在玩家收集所有草莓后从 `Player`\
  \ 脚本发射 `trigger` 信号。返回 `Player` 脚本并添加新名为 `level_strawberries` 的变量来跟踪草莓的数量。为了防止场景树过于拥挤，添加一个类型为\
  \ `Node` 的子节点。将其重命名为 `Enemies` 并将所有蘑菇拖到它下方。你可以对 `Collectibles` 执行同样的操作，如图 7.18 所示：\n\
  \n![img](img/B31515_07_18.png) \n\n图 7.18 – 通过分组节点组织场景\n\n\n\n扫描此二维码或访问 packtpub.com/unlock，然后按书名搜索本书。\
