  \n![img](img/B31515_Image_QR.png)\n\n3. 现在切换到 `Physics Layer 1`。这是 `pass_through`\
  \ 瓦格的层。现在我们将绘制保存的瓦格。你可以为每个单独的瓦格调整碰撞多边形。确保你也将 `polygon_0_one_way` 设置为勾选。这将允许玩家从下方跳过该瓦格。现在用此画刷绘制所有的\
  \ `pass_through` 瓦格。这在 `Figure 6.26` 中所示：\n\n![img](img/B31515_06_26.png)\n\nFigure\
  \ 6.26 – 调整碰撞多边形、单向碰撞以及绘制通行瓦格\n\n4. 在按照 `Figure 6.25` 和 `Figure 6.26` 所示调整瓦格后，你可以运行并测试游戏了。虽然玩家可以与瓦格发生碰撞，但没有力（如重力）作用于玩家身上，而且它对输入没有响应——你基本上被卡在被放置的地方。\n\
  \n在下一节中，我们将编写玩家脚本来控制移动、动画和交互，并应用重力等力。\n\n## 为 Player 脚本添加 CharacterBody2D 模板\n\n\
  Godot 为基础玩家移动提供了预写的代码模板。这节省了我们重复造轮子的时间，并让我们更快地制作游戏。\n\n在 `Player` 场景中，选择你的 `Player`\
  \ 节点，并点击如 `Figure 6.27` 所示的 `Attach New Script` 图标：\n\n![img](img/B31515_06_27.png)\n\
  \nFigure 6.27 – 附加新脚本按钮\n\n如 `Figure 6.27` 所示，你可以通过选择节点并点击 `Attach New Script` 按钮为\
  \ Godot 中的任何节点挂载脚本以自定义其行为。当你点击该按钮时，将看到一些创建脚本的选项，如 `Figure 6.28` 所示：\n\n![img](img/B31515_06_28.png)\n\
  \nFigure 6.28 – 注意正在使用的 Basic Movement 模板\n\n如 `Figure 6.28` 所示，脚本将使用模板创建，这意味着将有用于基础移动和重力的预生成代码。该脚本如下：\n\
  \n```\nextends CharacterBody2D\nconst SPEED = 300.0\nconst JUMP_VELOCITY = -400.0\n\
  func _physics_process(delta):\n    # Add the gravity\n    if not is_on_floor():\n\
  \        velocity += get_gravity() * delta\n    # Handle jump\n    if Input.is_action_just_pressed(\"\
  ui_accept\") and is_on_floor():\n        velocity.y = JUMP_VELOCITY\n    # Get the\
  \ movement direction and handle deceleration\n    var direction = Input.get_axis(\"\
  ui_left\", \"ui_right\")\n    if direction:\n        velocity.x = direction * SPEED\n\
  \    else:\n        velocity.x = move_toward(velocity.x, 0, SPEED)\n    move_and_slide()\n\
  ```\n\n![img](img/3_G.png) **快速提示**：使用 **AI Code Explainer** 和 **Quick Copy** 功能增强你的编码体验。在下一代\
  \ Packt Reader 中打开此书。点击 `Copy` 按钮 (`1`) 快速将代码复制到你的编码环境中，或点击 `Explain` 按钮 (`2`) 让\
  \ AI 助手向你解释一段代码。\n\n![img](img/4_G1.png) ![img](img/4_G.png) 购买此书将包含**下一代 Packt\
  \ Reader** 和此书的**免费 PDF/ePub 副本**。扫描二维码 或访问 [packtpub.com/unlock](https://packtpub.com/unlock)，然后使用搜索栏通过名称查找这本书。双击显示的版本以确保你获得的是正确的版本。\n\
  \n![img](img/B31515_Image_QR.png) 为了让我们的项目更易于管理并赋予更多结构，我们将深入这些代码。在这样做之前，我们应该理解每一行代码：\n\
  \n![img](img/1_G.png) 如 `Figure 6.27` 所示，你可以为 Godot 中的任何节点挂载脚本，通过选择它并点击 `Attach\
  \ New Script` 按钮来自定义其行为。当你点击该按钮时，将看到一些创建脚本的选项，如 `Figure 6.28` 所示：\n\n![img](img/B31515_06_28.png)\
  \ Figure 6.28 – 注意正在使用的 Basic Movement 模板\n\n如 `Figure 6.28` 所示，脚本将使用模板创建，这意味着将有用于基础移动和重力的预生成代码。该脚本如下：\n\
  \n```\nextends CharacterBody2D\nconst SPEED = 300.0\nconst JUMP_VELOCITY = -400.0\n\
  func _physics_process(delta):\n    # Add the gravity\n    if not is_on_floor():\n\
  \        velocity += get_gravity() * delta\n    # Handle jump\n    if Input.is_action_just_pressed(\"\
  ui_accept\") and is_on_floor():\n        velocity.y = JUMP_VELOCITY\n    # Get the\
  \ movement direction and handle deceleration\n    var direction = Input.get_axis(\"\
  ui_left\", \"ui_right\")\n    if direction:\n        velocity.x = direction * SPEED\n\
  \    else:\n        velocity.x = move_toward(velocity.x, 0, SPEED)\n    move_and_slide()\n\
  ```\n\n![img](img/3_G.png) **快速提示**：使用 **AI Code Explainer** 和 **Quick Copy** 功能增强你的编码体验。在下一代\
  \ Packt Reader 中打开此书。点击 `Copy` 按钮 (`1`) 快速将代码复制到你的编码环境中，或点击 `Explain` 按钮 (`2`) 让\
  \ AI 助手向你解释一段代码。\n\n![img](img/4_G1.png) ![img](img/4_G.png) \n\n\n\n如果有输入（玩家按了\
  \ `left` 或 `right` 键），角色的 `x` 轴速度将设置为按照 `SPEED` 定义的速度向该方向移动。\n\n如果没有输入，角色将使用 `move_toward()`\
  \ 逐渐减速，使 `x` 速度平滑地接近 `0`，模拟减速过程。\n\n*   `move_and_slide()`：这根据 `velocity` 移动角色。它还会处理沿表面（如地板或墙壁）滑动，使移动更加平滑。\n\
  \n现在我们已经了解了基础移动代码是如何工作的，现在是关注改进其结构了。编写整洁、组织良好的代码对于使项目在随着复杂性增加时依然易于阅读、维护和扩展至关重要。为了实现这一点，我们将通过将移动代码拆分为单独的函数来重构，从而提高其可读性和重用性。\n\
  \n## 清理代码\n\n将代码拆分为`单独函数` 是`整洁代码`概念的一部分，有助于在项目增长时保持良好的组织和清晰度。通过这种方式结构化你的代码，它将变得更容易阅读、测试和调试。每个函数都专注于特定的任务，减少了冗余，并并在出现问题时更容易发现和修复。这种方法还让你的项目更具扩展性，因为在添加新功能或更改时变得更加流畅，而不会干扰核心代码。\n\
  \n添加重力、处理跳跃和获取方向都可以放在它们自己的函数中。更改你的代码以与下面的代码块内容一致：\n\n```\nextends CharacterBody2D\n\
  ## 玩家移动速度和跳跃高度的常量\nconst SPEED = 300.0\nconst JUMP_VELOCITY = -400.0\n## 此函数在每个物理帧运行（适用于移动和碰撞）\n\
  func _physics_process(delta):\n    # 如果玩家不在地板上，则应用重力\n    apply_gravity(delta)\n\
  \    # 检查跳跃输入并应用跳力\n    handle_jump()\n    # 处理左/右移动输入\n    handle_movement(delta)\n\
  \    # 移动角色并处理与环境的碰撞\n    move_and_slide()\n## 此函数给玩家的速度添加重力\nfunc apply_gravity(delta):\n\
  \    # 仅当玩家在空中时才应用重力\n    if not is_on_floor():\n        velocity += get_gravity()\
  \ * delta\n## 此函数在按下跳跃键时让玩家跳跃\nfunc handle_jump():\n    # 仅当玩家位于地面上时才允许跳跃\n    if\
  \ Input.is_action_just_pressed(\"ui_accept\") and is_on_floor():\n        velocity.y\
  \ = JUMP_VELOCITY\n## 此函数处理水平移动输入\nfunc handle_movement(delta):\n    # 获取 -1 到 1\
  \ 之间的左/右移动输入值\n    var direction = Input.get_axis(\"ui_left\", \"ui_right\")\n \
  \   # 如果有移动输入，更新该方向的速度\n    if direction:\n        velocity.x = direction * SPEED\n\
  \    else:\n        # 如果输入，逐渐减慢玩家直到停止\n        velocity.x = move_toward(velocity.x,\
  \ 0, SPEED)\n```\n\n代码的功能与之前相同，但现在特定操作位于它们自己的函数中，因此更容易找到错误并进行改进。\n\n代码现在很整洁，并被拆分为更小、更易维护的部分。在下一章中，我们将自定义更多玩家的行为并播放动画。我们还将添加一个收集品、一个敌人和一个检查点来完成关卡。\n\
  \n# 总结\n\n在本章中，我们涵盖了在 Godot 中构建第一个 2D 平台跳跃关卡的必要步骤。我们首先在 `TileMapLayer` 节点中设置了带有碰撞层的\
  \ `TileSet`，并使用 `TileMap` 系统绘制关卡。从那里开始，我们创建了玩家角色，导入了不同动画所需的动画精灵帧。在角色就绪后，我们使用 Godot\
  \ 的 `CharacterBody2D` 模板实现了一个默认脚本。最后，我们花时间通过将其拆分为单独函数来清理和组织代码，这是遵循清洁代码原则的关键部分。\n\
  \n在下一章中，我们将为玩家制作动画，并编写双跳和贴墙等特殊能力。我们还将设置收集物品、一个可以击败的敌人和一个可以到达的检查点来完成关卡。\n\n# 在 Discord\
