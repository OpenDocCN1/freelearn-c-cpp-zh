  \n访问此链接查看代码运行的视频：[`packt.link/RjbW3`](https://packt.link/RjbW3)\n\n# 什么是 Godot？\n\
  \n简而言之，Godot 是一个游戏引擎。它最初由 Juan Linietsky 和 Ariel Manzur 于 2007 年创建，作为阿根廷多家工作室的内部工具。你可能的问题是：“游戏引擎究竟是什么？”以及“是什么让\
  \ Godot 如此特别？”\n\n嗯，制作游戏是困难的——非常困难！有无数活动部分都需要完美地工作。虽然从零构建一切是可能的，但大多数开发者依赖于游戏引擎来处理这些大量工作。\n\
  \n因此，**游戏引擎**是一个简化游戏开发的软件框架。它提供了构建游戏的核心工具和系统——例如渲染、物理、输入处理和资源管理——让开发人员能够更多地关注游戏性、故故事和设计，而不是底层的技术代码。\n\
  \n## 是什么让 Godot 如此特别？\n\nGodot 成为初学者和资深游戏开发者热门选择的原因有许多。以下是使其让该引擎脱颖而出的核心特性：\n\n*\
  \ **开源且免费**：2014 年，Godot 以 MIT 协议作为开源发布。这意味着它是完全免费的——即使对于商业项目也是如此——开发者可以完全访问源代码。这使得\
  \ Godot 具有高度定制性并由社区驱动。\n\n* **多功能场景系统**：Godot 最具定义性的特征之一是它的场景系统。Godot 中的一切都是场景——场景由节点组成。场景还可以嵌套在其他场景中，从而轻松地构建复杂、可重用且模块化的组件。这种结构使得游戏项目的组织和扩展变得极其直观。\n\
  \n* **强大的 2D 和 3D 支持**：Godot 包含了用于 2D 和 3D 开发的专用工具。无论你是在制作像素风格平台游戏，还是完整的 3D 体验，Godot\
  \ 都为这两个维度提供了专门的工作流。虽然其他引擎也支持两者，但 Godot 的 2D 系统通常因其精确性和活性而受到赞誉。\n\n* **资源——硬币的另一面**：除了场景和节点，Godot\
  \ 使用称为**资源 (resources)** 的东西——它们无处不在。精灵上的纹理是一个资源。你播放的音频是资源。甚至 `Path2D` 节点中的路径也是资源。资源是数据容器，可以在整个项目中重复使用，在检查器中编辑或从磁盘保存和加载。它们促进了一致性，减少了重复，并保持你的项目轻量化且有序。\n\
  \n* **轻量级且跨平台**：Godot 轻量且安装快速，即使在旧机器上也能运行良好。这种低系统要求对于可用性和普及性是一个巨大的胜利——任何人都可以开始制作游戏，不需要高端电脑。此外，当你的游戏完成后，你可以将其导出到多种平台，包括\
  \ Windows、macOS、Linux、Android、iOS 和 HTML5。\n\n* **蓬勃社区和活跃开发**：Godot 有一个友好、不断发展的开发者和教育者社区。无论你是新手还是丰富的程序员，都能获得大量的支持。\n\
  \n# 设置 Godot 4\n\n要下载最新版本的 Godot，请遵循以下步骤：\n\n1. 访问 Godot 网站 ([`www.godotengine.org`](https://www.godotengine.org))\
  \ 并点击 **Download** 按钮。\n2. 网站应检测您的操作系统。点击 `Godot Engine` 按钮而不是 `.NET` 版本。\n3. 如果无法检测平台，可以向下滚动选择支持的平台。\n\
  \n下载完成后，是时候创建我们的文件夹结构了：\n\n1. 在 Windows 上，打开 ZIP 文件。主执行文件名称类似于 `Godot_v4.3-stable_win64.exe`。\n\
  \    * 在 macOS 上，双击 ZIP 文件。\n    * 在 Linux 上，在终端运行以下命令：\n```\nUnzip Godot_v4.3-stable_linux.x86_64.zip\
  \ -d Godot\n```\n2. 将此文件提取到 PC 上的文件夹中。我建议将其命名为 `Godot4`。\n3. 在该文件夹内创建一个名为 `Godot\
  \ 4 Projects` 的文件夹。这是存储使用 Godot 4 创建的所有项目的地方。\n\n启动 Godot 了！\n\n1. *右键点击* `.exe`\
  \ 文件并选择**固定到开始**，让 Godot 在**开始**菜单可用。\n2. 你也可以点击**更多选项**然后选择**固定到任务栏**，让 Godot 始终在屏幕底部待命。\n\
  3. 双击 Godot4 文件夹内解出的 `.exe` 文件即可启动 Godot 4！\n\n\n\n\nGodot 已经运行起来了。我们的下一步是创建我们的第一个项目——我们游戏开发的奇妙冒险现在开始！\n\
  \n# 创建新项目\n\n在遵循上一节的步骤后，你现在会看到 Godot `Project Manager`（项目管理器）：\n\n![img](img/B31515_01_007.png)\
  \ \n\n图 1.10 – Godot 项目管理器\n\n这是你启动 Godot 时看到的第一个窗口。在这里，你可以创建、删除、导入、编辑和运行游戏项目。\n\
