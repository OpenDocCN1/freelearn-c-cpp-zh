  \ |\n| *注意：在开始之前准备好您的购买发票。* | |\n\n# 10 添加游戏汁 (Game Juice)\n\n游戏开发不仅关乎机制和关卡设计，还关乎游戏的手感。这就是“游戏汁”（Game\
  \ Juice）大用场。游戏汁指的是所有让游戏更有趣、响应更迅速的小增强，从视觉效果、音效设计到 UI 反馈和动画。添加游戏汁可以将基础游戏变成玩家喜爱的精良且吸引吸引的体验。\n\
  \n在本章中，我们将探索什么是游戏汁以及它为什么重要。你将学习如何通过添加为玩家反馈的动态效果，让你的游戏感觉更加精良且响应迅速。我们将实现几个“多汁”元素来增强体验：当玩家到达检查点时爆发的纸屑炮、基于\
  \ `heads-up display` (`HUD`) 的血条（当生命值减少时心脏会变灰），以及让关卡栩生生的沉浸式背景音频和音效。\n\n在本章中，我们将涵盖以下主要主题：\n\
  \n*   理解游戏汁\n*   实现血条 HUD\n*   添加击中动画\n*   创建纸屑炮效果\n*   添加音频和音效\n\n在本章结束时，你将理解细小的变化如何极大地提升游戏的手感。你将在实现视觉和音频反馈以增强玩家沉浸感方面获得经验，让你的游戏玩起来更有趣、更有满足。\n\
  \n让我们开始为你的游戏提供应有的额外润色吧！\n\n# 技术要求\n\n到本书的现在，你应该知道如何执行以下操作：\n\n*   创建节点和场景（参见 *第\
  \ 2 章* ）\n*   完成来自 *第 7 章* 的 `Pixel Adventure` 项目\n\n你还应该了解变量和函数（参见 *第 8 章*），以便在\
  \ `GDScript` 中使用。\n\n本章的代码文件可以在本书的 GitHub 仓库中找到：`https://github.com/PacktPublishing/Godot-4-for-Beginners/tree/main/ch10`\n\
  \n访问此链接查看代码运行的视频：`https://packt.link/W1K5s`\n\n## 理解游戏汁\n\n当游戏玩起来感觉很好时，我们现在知道这通常归于所谓的\
  \ `game juice`（游戏汁）。这指的是小但影响巨大的增强——例如微妙的动画、粒子效果或音效设计——它们让游戏变得更加响应、令人满意且精良。\n\n汁不会改变游戏的机制，但它改变了玩家体验机制的方式。因此，给游戏添加\
  \ `juice` 意味着在一个运行良好的游戏基础上添加多层满足感来提升手感。对于玩家来说，满足感是由感官创造的，因此我们需要喂给这些感官。创建视觉效果和添加音频将增强玩家的体验。你可以将其想象为正从一个美味的橙子上挤出每一滴汁。\n\
  \n以下是使用游戏汁提升玩家体验的一些示例：\n\n*   标准跳跃配合 `squash and stretch`（挤压与拉伸）动画可以更有冲击力\n*   收集硬币配合`闪烁效果`和`令人满意的声效`感觉更有回报感\n\
  *   战斗中受伤配合`屏幕抖动`和为了冲击力的短暂停顿`更具参与感\n\n在下一节中，我们将探索制作汁的基础方面面。\n\n## 制作汁的基础：动画和音频\n\
  \n本节将向你介绍制作汁的基础技术，我们很快就会把它们应用于实践中，例如击中动画、血条 HUD、纸屑炮和音频反馈。这些基础在 3D 和 2D 中同样有用，无论什么类型或视角，它们都能提升你的游戏。\n\
  \n### 视觉反馈（动画和粒子效果）\n\n`视觉反馈`在让动作具有冲击力方面起着关键作用。游戏汁中使用的两种常用技术如下：\n\n*   `Squash and\
  \ stretch`（挤压与拉伸）：当角色落地、跳跃或改变方向时略微变形其比例，给他们一种弹跳、活力的外观。这种动画让运动更有表现力。\n*   `Particle\
  \ effects`（粒子效果）：在玩家跑步或跳跃时添加轨迹让运动更具动态。即使是微小的粒子爆发也能传递能量。\n\n你很快将在游戏中实现这些想法，包括：\n\n\
  *   一个让敌人产生反应的击中动画\n*   一个用爆炸庆祝的纸屑炮\n\n### 音频反馈（音乐和音效）\n\n创造多汁体验时，`音频`与视觉一样重要。它强化了玩家的动作，增加了个性并营造了氛围。考虑以下几：\n\
  \n*   `音效`：落地时满意的声音或击中敌人时的清脆冲击声可以让场景栩生生\n*   `背景音乐`：选择良好的曲目可以设定关卡的情感基调，引导玩家探索时的感受\n\
  \n我们将在本章晚些时候探索如何实现环境音乐和角色音效。\n\n\n\n\n\n让我们先打开 `Pixel Adventure` Godot 项目，并添加一个以\
  \ `AnimatedSprite2D` 节点作为根节点的新场景。将节点重命名为 `HUD` 并场景保存为 `hud.tscn`，如图 10.2 所示：\n\n\
  ![img](img/B31515_10_2.png) \n\n图 10.2 – 表示玩家生命值的 HUD 场景\n\n我们将使用一种简单的技术来表示血值的损失。血条开始将有三颗完整的红色心形。每当玩家受伤时，我们会将其中一颗心形从红色变为灰色。\n\
  \n你可以使用免费开源的图像编辑软件，例如 `LibreSprite` ([`libresprite.github.io/#!`](https://libresprite.github.io/#!/))，来绘制你自己的心形，并创建四个表示血值变化的帧，正如我在图\
  \ 10.3 中所示：\n\n![img](img/B31515_10_3.png) \n\n图 10.3 – 表示玩家生命值变化的心形帧\n\n## 资源\n\
  \n如果你不擅意画自己的心形，可以使用 Shlok Gupta 创建的。不过，你仍然需要对其进行修改，以便在不同的血量水平显示心形。你可以在他们的 `Itch`\
  \ 页面找到：[`gamedevshlok.itch.io/heartpack`](https://gamedevshlok.itch.io/heartpack)。\n\
  \n当你的心形图像准备好后，进入名为 `HUD` 的 `AnimatedSprite2D` 节点的 `Sprite Frames` 属性，并选择 `New SpriteFrames`，如图\
  \ 10.4 所示：\n\n![img](img/B31515_10_4.png) \n\n图 10.4 – AnimatedSprite2D 节点的新 SpriteFrames\n\
  \n现在，点击属性中的 `SpriteFrames` 单词打开 `Animation Frames` 窗口。将默认动画重命名为 `idle` 并添加这四个帧，如图\
  \ 10.5 所示：\n\n![img](img/B31515_10_5.png) \n\n图 10.5 – 血条的空闲动画具有四帧，代表总血量\n\n正如你在图\
  \ 10.5 中所示，每当玩家失去血量，我们就会更改动画帧以匹配。我们不需要为血条添加脚本；我们只需要在附加到 `level1.tscn` 的脚本中引用它即可。\n\
  \n在 `Level1` 场景中，将新创建的 `hud.tscn` 拖入你的关卡并将其放置在左上角，如图 10.6 所示：\n\n![img](img/B31515_10_6.png)\
  \ \n\n图 10.6 – HUD 的理想位置\n\n一旦你将 HUD 放置在场景中，你的 `Level1` 场景树应该包含 `HUD` 场景，并看起来如图\
  \ 10.7 所示的场景层级：\n\n![img](img/B31515_10_7.png) \n\n图 10.7 – 第 1 卡的场景层级\n\n场景如图 10.7\
  \ 所示准备就绪后，是时候打开附加到 `Level1` 的脚本并进行一些添加了，以便 HUD 能根据玩家的血量更新心形状态。\n\n## 在关卡脚本中更新 HUD\n\
  \n现在我们基于心形的血量系统已经就绪，我们需要确保玩家的当前血量反映在屏幕上。为了实现这一点，我们将从 `Level` 脚本更新 HUD。HUD 将根据玩家剩余的心形数量视觉变化，在受到伤害时将心形变灰。\n\
  \n我们将首先添加一个 `@onready` 变量来引用 HUD 场景。在 `_process()` 函数中，我们将更新 HUD 的 `frame` 属性以匹配玩家的当前血量。这决定了显示多少个心形为激活（红色）而非非激活（灰色）。例如，如果玩家有三颗心，我们将\
  \ HUD 帧设置为 `3` 以显示三颗红色心形。\n\n以下是更新后的 `Level` 脚本：\n\n```\nextends Node2D\n@onready\
  \ var update_health_hud = $HUD\n@onready var player = $Player\n@onready var strawberries\
  \ = $Collectibles\nfunc _ready():\n    player.level_strawberries = strawberries.get_child_count()\n\
  func _process(delta):\n    update_health_hud.frame = player.get_hearts()\n```\n\n\
  让我们拆解代码以更好地理解：\n\n*   `update_hud` 存储对 `HUD` 节点的引用，以便我们可以轻松访问并更新它。\n*   在每帧运行的 `_process()`\
  \ 中，我们设置 HUD 的 `frame` 来反映玩家当前的心形数量。这意味着当玩家获得或失去血量时，HUD 将实时进行视觉更新。\n\n`player.get_hearts()`\
  \ 这一行依赖于我们在 `Player` 脚本中创建的新函数。该函数简单地返回玩家拥有的心形数量：\n\n```\nfunc get_hearts():\n \
  \   return hearts\n```\n\n为了支持这一点，在 `Player` 脚本顶部添加一个新变量来存储玩家的血量：\n\n```\nvar hearts\
  \ = 3\n```\n\n`hearts` 变量跟踪我们拥有的血量。我们将其初始化为 `3`。当玩家受到伤害时，它会减少。`hurt()` 函数：\n\n```\n\
  func hurt():\n    hearts -= 1\n    if hearts <= 0:\n        death()\n```\n\n如果 `hearts`\
  \ 达到 `0`，我们触发 `death()` 函数：\n\n```\nfunc death():\n    velocity.y = -600\n    set_collision_mask(2)\n\
  \    set_collision_mask(3)\n```\n\n这是代码的拆解：\n\n*   `velocity.y = -600` 让玩家在死亡时向上冲出\n\
  *   `set_collision_mask(2)` 和 `set_collision_mask(3)` 禁用与环境的碰撞\n\n另一个提供视觉反馈的细节是击中效果（通常为白色或红色），用以信号他们击中了，使体验更具响应性。\n\
  \n## 添加击中动画\n\n在本节中，我们将创建一个简单的动画，让玩家在受伤时会闪烁白光。这不仅让伤害的瞬间更具戏剧性，还能帮助玩家意识到自己的状态。\n\n\
  在你的文件管理器中，找到 `Pixel Adventure/Main Characters/Ninja Frog` 文件夹（你可以在这里下载所有资源：[`pixelfrog.itch.io/`](https://pixelfrog.itch.io/））并将\
  \ `Hit.png` 文件拖入 Godot **FileSystem**。\n\n在 `Player` 场景中，选择 `AnimatedSprite2D` 节点并添加名为\
  \ `hit` 的新动画。现在，点击**从精灵表添加帧**按钮并设置为 `7` 个水平帧和 `1` 个垂直帧。然后，选择所有帧并导入它们。将动画速度设置为 `16`\
  \ FPS 并取消循环。`hit` 动画看起来将如图 10.8 所示：\n\n![img](img/B31515_10_8.png) \n\n图 10.8 –\
  \ 新的击中动画\n\n为了确保我们的动画在需要时运行，在 `Player` 脚本顶部的 `vars` 组中添加名为 `isHit` 的辅助变量。它将是一个布尔值，默认设置为\
  \ `false`：\n\n```\nvar isHit = false\n```\n\n\n\n\n\n```\nfunc hurt():\n    isHit\
  \ = true\n    hearts -= 1\n    if hearts <= 0:\n        death()\n```\n\n现在，我们可以修改\
  \ `animate()` 函数，包含对玩家血量数量的检查以及他们是否被击：\n\n```python\nfunc animate():\n    if isHit:\n\
  \        animations.play(\"hit\")\n        await animations.animation_finished\n\
  \        animations.play(\"idle\") # 回到空闲状态\n        return # 防止在本帧发生进一步变化\n   \
  \ if hearts == 0:\n        return  # 死亡，不再继续播放动画\n    # 静止的玩家\n    if velocity.x\
  \ == 0 and velocity.y == 0:\n        animations.play(\"idle\")\n    # 玩家向右移动\n \
  \   elif velocity.x >= 0 and velocity.y == 0:\n        animations.play(\"run\")\n\
  \        animations.flip_h = false\n    # 玩家向左移动\n    elif velocity.x <= 0 and velocity.y\
  \ == 0:\n        animations.play(\"run\")\n        animations.flip_h = true\n  \
  \  # 玩家正在坠落\n    elif velocity.y > 0 and !is_wall_sliding:\n        animations.play(\"\
  fall\")\n    # 玩家正在跳（初跳）\n    elif velocity.y < 0 and jump_count == 0:\n       \
  \ animations.play(\"jump\")\n    # 玩家正在双跳\n    elif !is_on_floor() and jump_count\
  \ > 0 and\n    !is_wall_sliding:\n        animations.play(\"double_jump\")\n   \
  \ # 玩家正在右侧壁滑\n    elif is_wall_sliding and\n    Input.is_action_pressed(\"ui_right\"\
  ):\n        animations.flip_h = false\n        animations.play(\"wall_slide\")\n\
  \    # 玩家正在左侧壁滑\n    elif is_wall_sliding and\n    Input.is_action_pressed(\"ui_left\"\
  ):\n        animations.flip_h = true\n        animations.play(\"wall_slide\")\n\
  ```\n\n`animate()` 函数负责根据玩家的移动、健康状况以及是否被击中在不同的动画状态之间切换。让我们逐一检查每个条件，以理解正在发生的情况。\n\
  \n首先，让我们看看 `idle` 状态的代码：\n\n```python\nif velocity.x == 0 && velocity.y == 0 &&\
  \ hearts > 0 && isHit == false:\n    animations.play(\"idle\")\n```\n\n如果玩家没有移动（`velocity.x\
  \ == 0 and velocity.y == 0`）、还活着（`hearts > 0`）并且刚刚没有被击中（`isHit == false`），我们就播放\
  \ `\"idle\"` 动画。\n\n接下来，让我们检查 `hit` 状态：\n\n```python\nelif is_hit:\n    animations.play(\"\
  hit\")\n```\n\n如果玩家被击中了，我们播放 `\"hit\"` 动画来显示反应。这通常在恢复其他动画之前播放一短时间。\n\n这就是我们检测向右运行的方法：\n\
  \n```python\nelif velocity.x >= 0 && velocity.y == 0 && hearts > 0:\n    animations.play(\"\
  run\")\n    animations.flip_h = false\n```\n\n如果玩家正在向右水平移动（x 轴速度为正）、没有垂直移动，且仍然活着，我们就播放\
  \ `\"run\"` 动画并确保精灵图朝右（`flip_h = false`）。\n\n向左运行的代码也类似：\n\n```python\nelif velocity.x\
  \ <= 0 && velocity.y == 0 && hearts > 0:\n    animations.play(\"run\")\n    animations.flip_h\
  \ = true\n```\n\n这与上一个条件相同，但针对向左移动。我们将水平翻转精灵图（`flip_h = true`）以面向左侧。\n\n以下是处理坠落的方式：\n\
  \n```python\nelif velocity.y > 0 and !is_wall_sliding && hearts > 0:\n    animations.play(\"\
  fall\")\n```\n\n如果玩家正在向下移动（`velocity.y > 0`）、没有在墙上滑动且仍然活着，我们就显示 `\"fall\"` 动画。\n\
  \n跳跃逻辑如下：\n\n```python\nelif velocity.y < 0 && jump_count == 0 && hearts > 0:\n\
  \    animations.play(\"jump\")\n```\n\n这个条件检查玩家是否正在向上跳（`velocity.y < 0`）以及这是他们的第一次跳（`jump_count\
  \ == 0`），这会触发 `\"jump\"` 动画。\n\n这是对双跳的检查：\n\n```python\nelif !is_on_floor() and\
  \ jump_count > 0 and !is_wall_sliding:\n    animations.play(\"double_jump\")\n```\n\
  \n如果玩家在空中（不在地板上）、已经使用过一次跳跃且没有在墙上滑动，我们就显示 `\"double_jump\"` 动画。\n\n这处理了右侧的壁滑：\n\n\
  ```python\nelif is_wall_sliding and Input.is_action_pressed(\"ui_right\"):\n   \
  \ animations.flip_h = false\n    animations.play(\"wall_slide\")\n```\n\n如果玩家正在壁滑并按住右移动键，我们就播放\
  \ `\"wall_slide\"` 动画并让精灵图朝右。\n\n最后，这是我们用于左侧壁滑的代码：\n\n```python\nelif is_wall_sliding\
  \ and Input.is_action_pressed(\"ui_left\"):\n    animations.flip_h = true\n    animations.play(\"\
  wall_slide\")\n```\n\n# 创建纸屑效果\n\n为了增强成就感，并在玩家触碰检查点标志时，我们将发射五颜色的纸屑。让我们开始吧！\n\n我们首先创建一个以\
  \ `Node2D` 为根节点的新场景。将节点重命名为 `Confetti_Cannon`，添加一个 `GPUParticles2D` 节点作为子节点，并将其重命名为\
  \ `Blue`，这将代表蓝色纸屑。如图所示（此处无图片）：\n\n现在，选择 `Blue` 纸屑粒子节点。在 **Inspector**（检查器）中，找到 **Process\
  \ Material** 设置，然后添加 `New ParticleProcessMaterial`，如图 10.10：\n\n接下来，点击 `ProcessMaterial`（文字）以展开粒子设置菜单。\n\
  \n纸屑在飞行时应该旋转，但它们不应该离开玩家。在 **Particle Flags**（粒子标志）设置中启用 **Rotate Y** 并禁用 **Z**，如图\
  \ 10.11 所示：\n\n纸屑应该呈弧形移动，以模拟现实生活中纸屑的行为。为了实现这一点，请调整纸屑生成的角度。你可以根据需要调整数字——我将最小角度设置为\
  \ `209`，最大角度设置为 `327`，如图 10.12 所示：\n\n确保将 **Direction**（方向）变量设置为 **x** = `0.0`、**y**\
  \ = `-1.0` 且 **z** = `0.0`，如图 10.13 所示。\n\n\n\n\n纸屑粒子也应该散开，而不是全部沿着同一条路径移动。为了让它们在角度范围内散开，我选择了\
  \ `100` 的 `Spread`（扩散）值，这将为每个新粒子选取一个 –100 到 100 度之间的角度。\n\n此外，由于纸屑通常是一个爆炸性事件，我们希望改变粒子的\
  \ `Initial Velocity`（初速度）值。这两个更改都如*图 10.13*所示：\n\n![img](img/B31515_10_13.png) \n\
  \n图 10.13 – 改变纸屑粒子的扩散和初速度设置\n\n为了让效果更加震撼，我们可以改变每个粒子在穿过卡时的旋转速率。这可以通过改变 `Angular Velocity`（角速度）值来实现。我将速率锁定在\
  \ `280`，如*图 10.14*所示：\n\n![img](img/B31515_10_14.png) \n\n图 10.14 – 为粒子设置可变角速度\n\
  \n纸屑还应该以稳定的速率远离中心加速，我们可以轻松地在线性加速度设置（即 `Linear Accel`）中进行设置，如*图 10.15*所示：\n\n![img](img/B31515_10_15.png)\
  \ \n\n图 10.15 – 为粒子设置线性加速度\n\n为了防止纸屑离旗帜太远，我们应该在 `Accelerations`（加速度）部分增加 `Gravity`（重力），如*图\
  \ 10.16*所示：\n\n![img](img/B31515_10_16.png) \n\n图 10.16 – 增大粒子在 y 方向上的重力\n\n为了控制纸屑粒子的外观，我们进入\
  \ `ParticlesProcessMaterial` 的 `Display`（显示）属性。现在改变纸屑粒子的 `Scale`（比例）值——我将最小尺寸设置为\
  \ `5`，最大尺寸设置为 `20`。对于 `Color`（颜色），我选择了*天蓝色*。这些更改可以在*图 10.17*中看到：\n\n![img](img/B31515_10_17.png)\
  \ \n\n图 10.17 – 设置粒子的比例变化和颜色\n\n下一步是控制这些粒子在屏幕上停留的时间以及它们在存活期间的行为。这些设置可以在 `Time` 属性中找到。默认寿命为\
  \ `1` 秒，这没问题；但我们必须开启 `One Shot`（单次触发），这样纸屑只会发射一次而不会不断生成。你可以改变 `Explosiveness`（爆发性）和\
  \ `Randomness`（随机性），或使用*图 10.18*所示的值：\n\n![img](img/B31515_10_18.png) \n\n图 10.18\
  \ – 调整粒子的 Time 属性\n\n最后一步是进入 `Drawing`（绘制）属性并勾选 `Local Coords`（本地坐标）复框。这只需确保粒子遵循它们自己的路径，而不是它们可能附着的任何父节点的路径。它能让粒子保持在我们在场景中放置它们的位置。这如*图\
  \ 10.19*所示：\n\n![img](img/B31515_10_19.png) \n\n图 10.19 – 在 Drawing 属性中设置粒子使用本地坐标\n\
  \n预览此纸屑粒子效果，滚动到 `Inspector`（检查器）的最上方并开启 `Emitting`（发射）复选框。每当你勾选它，都应该看到蓝色的纸屑粒子在场景中发射，如*图\
  \ 10.20*所示：\n\n![img](img/B31515_10_20.png) \n\n图 10.20 – 开启 Emitting 会发射粒子\n\n\
  我们现在有了一个天蓝色纸屑粒子的场景，但纸屑炮应该向天空射出彩虹颜色的粒子。\n\n要实现这一点，复制蓝色粒子，然后*右键点击* `ParticleProcessMaterial`\
  \ 并选择 `Make Unique`（唯一化），然后在 `Display` 属性下更改颜色（正如我们在*图 10.17*中中所做的那样），并重命名粒子节点以匹配。这如*图\
  \ 10.21*所示：\n\n![A screenshot of a computer AI-generated content may be incorrect.](img/B31515_10_21.png)\
  \ \n\n图 10.21 – 纸屑炮场景树\n\n注意，并不是所有的纸屑粒子都在发射。我们将在下一节修复这个问题。\n\n## 为纸屑炮编写脚本\n\n为了确保所有纸屑粒子在正确的时间发射，我们为\
  \ `Confetti_Cannon` 节点挂载一个脚本并如下定义 `fire()` 函数。\n\n```python\nextends Node2D\nfunc\
  \ fire():\n    $Blue.emitting = true\n    $Orange.emitting = true\n    $Green.emitting\
  \ = true\n    $Yellow.emitting = true\n    $Red.emitting = true\n    $Pink.emitting\
  \ = true\n```\n\n此 `fire()` 函数通过将它们的 `emitting` 属性设置为 `true` 同时打开所有纸屑粒子发射器。每行代码都针对一个不同颜色的粒子节点——`Blue`、`Orange`、`Green`、`Yellow`、`Red`\
  \ 和 `Pink` 并激活它们。\n\n## 音频和音效\n\n声音是游戏开发中强大的工具，以视觉效果无法实现的方式塑造玩家的体验。精心设计的配乐可以营造氛围，无论是快节奏的动作序列还是冷静的探索场景。此外，音效为玩家的操作提供了即时反馈，让游戏世界感觉更加生动且灵活。\n\
  \n在本节中，我们将探索如何通过音频增强游戏体验。我们将添加背景音乐来营造氛围，并为关键交互（如收集物品、受伤或完成关卡）引入音效。在本节结束时，你将学会如何实现和调整音频，使游戏更具沉浸感和吸引力。\n\
  \n所以，让我们通过添加有趣的背景音乐让关卡变得更加愉快。免费音乐的一个良好资源是 Incompetech：\n\n[`incompetech.com/music/royalty-free/music.html`](https://incompetech.com/music/royalty-free/music.html)\n\
  \n我从该网站选择了 Kevin MacLeod 的 *Adventures in Adventureland* 轨道。该轨道根据 Creative Commons:\
  \ By Attribution 4.0 许可授权 ([`creativecommons.org/licenses/by/4.0/`](http://creativecommons.org/licenses/by/4.0/))。\n\
  \n让我们先在 `Assets` 文件夹创建一个名为 `Audio` 的子文件夹，并将 `Adventures in Adventureland.mp3` 文件拖入其中，如*图\
  \ 10.23*所示：\n\n![img](img/B31515_10_23.png) \n\n图 10.23 – 向我们的音频文件夹添加背景音乐\n\n\n\n\
  要播放音频，Godot 有一个名为 `AudioStreamPlayer` 的特殊节点。它是播放背景音乐的理想选择，因为它不会以位置方式播放音频。如果你希望音频从屏幕上不同的来源播放，则需要使用\
  \ `AudioStreamPlayer2D` 或 `AudioStreamPlayer3D` 节点。\n\n由于关卡将背景音乐，请向关卡场景添加一个新的 `AudioStreamPlayer`\
  \ 节点，如图 10.24 所示：\n\n![img](img/B31515_10_24.png)\n\n图 10.24 – 向关卡场景添加 `AudioStreamPlayer`\
  \ 节点\n\n选中 `AudioStreamPlayer` 后，查看 `Inspector`（检查器）中的属性。在这里，`Stream` 属性是它将播放的音频源。将\
  \ MP3 文件拖入 `Stream`。将音量降低至 `–20` dB 并将 `Autoplay` 设置为 `On`。所有这些更改均如图 10.25 所示：\n\
  \n![img](img/B31515_10_25.png)\n\n图 10.25 – 为我们的音频播放器设置流\n\n由于 `Autoplay` 被设置为 `true`，轨道将在关卡加载时立即开始播放。如果你想停止音乐，可以从挂载到关卡的脚本更改所有这些设置，并将\
  \ `playing` 设置为 `false`。\n\n现在背景音乐已经运行起来了，让我们继续为游戏添加音效。\n\n## 实现音效\n\n音效不会自动且持续地播放。相反，它们由事件触发或与事件配对。一个很好的例子是玩家跳跃或收集物品。\n\
  \n首先，你需要下载你喜欢的音效。你可以访问 `Open Game Art` ([`opengameart.org/`](https://opengameart.org/))\
  \ 并搜索跳跃音和硬币或收集音。这个网站是免费游戏资源的极佳来源，所有资源均根据 Creative Commons CC0 许可提供。\n\n一旦你有了合适的跳跃音和收集音，请将文件添加到\
  \ Godot `FileSystem` 中的 `Audio` 文件夹中。这如图 10.26 所示：\n\n![img](img/B31515_10_26.png)\n\
  \n图 10.26 – 向我们的 `Audio` 文件夹添加音效\n\n由于我们的游戏非常简单，且只有两个音效（一个用于*跳跃*，一个用于*收集*），我们将向\
  \ `Player` 场景添加两个 `AudioStreamPlayer` 节点来处理此操作。重命名 `AudioStreamPlayer` 节点以反映它们将播放的音效，如图\
  \ 10.27 所示：\n\n![img](img/B31515_10_27.png)\n\n图 10.27 – 为 `Player` 场景添加多个音频流\n\n\
  对于具有多个重叠音效的复杂游戏，添加多个 `AudioStream` 节点并不是最优解决方案，你可以考虑使用 `Sound Manager` 场景或为音乐和音效设置音频总线（audio\
  \ buses）。\n\n每个 `AudioStreamPlayer` 节点都应该播放相关的音效，因此确保将正确的文件拖到每个 `Stream` 中，如图 10.28\
  \ 所示：\n\n![img](img/B31515_10_28.png)\n\n图 10.28 – 两个不同音效的两个音频流\n\n当两个音频流都设置了正确的声音和默认设置后，打开\
  \ `player.gd` 脚本，并以 `onready` 变量的形式添加 `AudioStreamPlayer` 节点的引用。你可以通过将节点拖入脚本，然后在松开之前按住\
  \ `Ctrl` 来实现。代码所示所示：\n\n```python\nextends CharacterBody2D\n@onready var animations\
  \ = $AnimatedSprite2D\n@onready var jump = $Jump\n@onready var collect = $Collect\n\
  ```\n\n现在已经获得了每个节点的引用，我们可以找到触发流播放的正确时机。当玩家按下*jump* 键时，应该触发跳跃。\n\n在 `standard_player_movement()`\
  \ 函数中，跳跃通过特定的 `if` 语句处理。\n\n\n\n\n在本章结束时，你将理解深思熟虑的游戏设计在简化开发、减少昂贵错误以及提高玩家满意度方面的价值。无论你是渴望设计自己的游戏，还是希望作为开发团队的一员进行高效工作，这些课程都将让你从更清晰的视角理解优秀游戏是如何制作的。\n\
  \n# 技术要求\n\n不需要任何先的游戏设计经验或知识。\n\n# 理解游戏设计的基础\n\n游戏是一种娱乐形式，成功的游戏通常被描述为“有趣”。但这到底意味着什么？哪些元素结合在一起创造了有趣且有回馈的体验？这些都是游戏设计试图回答的问题。\n\
  \n单凭超写实的视觉效果和优化的编程并不能保证游戏好玩。事实上，一些最受喜的游戏之所以成功，并不是因为它们的外观或技术有多先进，而是因为它们带给玩家的感受。一个引人入胜、令人满意且令人记忆的游戏——无论图形或性能如何——都是深思熟虑的游戏设计的产物。\n\
  \n让我们来看一些例子：\n\n*   `Stardew Valley (2016 发布)`：这款独立农场模拟游戏成为全球热门，并不是因为尖端的画质，而是因为其令人满意的游戏循环、进步感以及与角色之间有意义的互动。它的游戏设计关注玩家选择、日常活动和社区建设——这一切都贡献了深度沉浸的体验。\n\
  *   `Celeste (2018 发布)`：`Celeste` 是一款具有挑战性的 2D 平台游戏，它将紧凑的控制与具有情感共鸣的叙述相结合。该设计鼓励坚持，奖励玩家掌握困难关卡，同时还提供了能够尊重不同技能水平的无障碍选项。它是游戏设计如何同时支持游戏性和情感影响的完美范例。\n\
  *   `Among Us (2018 发布)`：这款社交推理游戏因其巧妙的设计而爆发式流行，这种设计鼓励了沟通、欺骗和合作。尽管艺术风格简单，但核心循环——找出谁是冒充者——让玩家保持参与并回流如返。\n\
  \n这些例子说明，优秀的游戏设计并不意味着复杂或写实。相反，它意味着创建与玩家产生连接的系统和体验。\n\n这些体验是在设计过程中被雕琢的，尽可能详尽和周到至关重要。毕竟，你正在为整个游戏的构建奠定基础。\n\
  \n游戏设计感可能比编程更抽象，这是因为它更倾向于艺术和叙事。正如你已经所经历的，制作游戏是困难的；有很多变动的部分都需要协同工作。游戏设计可能更具挑战性，因为成功没有严格的公式。与编程不同，这里没有硬规则——只有原则、模式，以及对玩家认为什么有意义和种有趣的深度理解。\n\
  \n# 介绍游戏设计文档\n\n已经有一些成熟的框架来记录你的设计。一旦你有了一个游戏想法，使用这些行业认可的框架（例如`游戏设计文档`（`GDD`）或功能清单）来捕获它，将帮助你更清晰地开发想法，并更接近游戏设计的金标准。\n\
  \n在 Godot 中工作时，拥有一个坚实的设计计划可以产生巨大的影响。例如，早期明确定义游戏机制可以让你决定需要哪些节点、脚本和场景。如果你的设计包含角色升级、关卡转换或特定的互动，你可以从一开始就考虑到这些因素来构建你的\
  \ Godot 项目。\n\n将你的设计决策直接与 Godot 的场景系统、输入处理以及使用 `GDScript` 进行脚本相关起来，将帮助你避免猜测和重复工作，并构建一个不仅有趣而且结构清晰且易于维护的游戏。\n\
  \n在下一节中，我们将看看如何有效地记录你的游戏设计。这是一个关键步骤，可以帮助你将想法转化为清晰、可操作的计划，并确保你在 Godot 中的开发过程保持专注、高效并与你的原始愿景一致。\n\
  \n# 为什么你的游戏设计需要文档？\n\n你可能认为，因为你制作的游戏很小，或者因为你只有一个人在，所以没有真的需要写什么。然而，这可能是一个短视的决定。即使是最简单的游戏项目也能受益于清晰的文档——它可以帮助你保持条理，更彻底地思考你的想法，并避免开发后期昂贵的失误。\n\
  \n记录设计至关重要，这样你（以及其他参与游戏的其他人）就能了解游戏的一切，以及完成它需要做什么。游戏是复杂的，具有许多互动功能。通常，你只有在解决问题的过程中发现解决方案。几个月后，你可能甚至不记得为什么包含某个内容或它是如何运作的。这就是文档变得无价的价值。\n\
  \n在 Godot 中工作时，为游戏设计开发文档非常有帮助，因为它让你更高效地规划游戏结构，决定你需要哪些节点、不同对象之间将如何互动，以及如何在 `GDScript`\
  \ 中组织脚本。这种前期的清晰性减少了混乱或杂乱重写的风险，并帮助你在项目复杂性增加时保持专注。\n\n创建一个 `GDD` 有助于你完成以下工作：\n\n*\
  \   通过清晰列出已做的决策，减少重复工作并避免重复劳动\n*   在休息后回到项目时，记住设计选择背后的原因\n*   在整个开发过程中跟踪更改和想法\n\
  *   识别机制、功能和系统之间的依赖关系\n*   保持与愿景和范围一致\n*   如果你以后引入额外的团队成员或贡献者，会让协作变得更容易\n\n你的游戏设计文档承担着两个重要工作：它们回顾并记录你目前所做的所有决策，并展望未来引导游戏的开发。它们既是你思考的记录，也是构建游戏的路线图。\n\
  \n因此，你的 `GDD` 成为你项目的单一事实来源，在整个开发过程中保持脚实、专注和高效。\n\n# 理解 GDD 的指导原则\n\n首先，重要的是要记住 `GDD`\
  \ 是活文档。这意味着它们经常更改，并在游戏开发过程中应该不断查看和参考。这是因为，尽管游戏的核心想法可能不会，但周围的许多元素应该演变，文档应该通过适应来反映这种变化。\n\
  \n## 其他阅读\n\n你可以通过阅读 **Gamescrye** 和 **Roobyx** 的 GitHub 仓库中的 `GDD` 来查看商业游戏是如何制作的：\n\
  \n*   [`gamescrye.com/resources/game-design-documents/`](https://gamescrye.com/resources/game-design-documents/)\n\
  *   [`github.com/Roobyx/awesome-game-design`](https://github.com/Roobyx/awesome-game-design)\n\
  \n准备 `GDD` 的任何良好的协作文档和设计软件，如 **Notion** ([`www.notion.com/`](https://www.notion.com/))、**Obsidian**\
  \ ([`obsidian.md/`](https://obsidian.md/)) 或 **OneNote** ([`www.OneNote.com`](https://www.OneNote.com))\
  \ 都非常好。不过，也有针对游戏开发行业定制的解决方案，例如 **CodeDecks** ([`www.codecks.io/`](https://www.codecks.io/))\
  \ 和 **HacknPlan** ([`hacknplan.com/`](https://hacknplan.com/))。\n\n\n\n\n\n为了让你的游戏设计文档真正发挥作用，应该遵循一些最佳实践。这些原则将帮助确保你的想法被清晰地传达，并能够实际指导开发。让我们来看看这些内容：\n\
  \n### 可视化思考\n结合文本、图表、流程图、线框和其他视觉元素来传达你的想法。视觉元素是能够跨越障碍的通用语言，使复杂的概念变得更容易理解、更具可操作性，并让每个人都能适应。\n\
  \n### 保持简洁明了\n清晰和简洁是关键。你的文档应该：\n* **直击要点**：使用项目符号高效地传达观点。\n* **准确**：要具体——包含像速度或高度等数值的精确值，并始终使用现在时态编写。\n\
  * **优先级排序**：明确哪些功能是必需的（`MVP`），哪些是锦上添花的，哪些是完全可选的。\n\n### 保持组织良好\n组织良好的文档可用性要高得多。最佳实践包括：\n\
  * **使用基于 Web 的格式**：这便于访问和更新。\n* **逻辑化结构化信息**：从概述开始，然后进入具体细节。\n\n### 通过示例学习\n编写设计文档没有唯一的`正确`方法。一种很有帮助的入门方法是研究真实世界游戏的示例。Game\
  \ Docs 网站（`https://gamedocs.org/documents/`）提供了精选的设计文档集合。探索这些内容，看看他人是如何构建想法的，并根据你的项目调整适用的部分。现在你已经理解了有效文档背后的核心原则，让我们仔细查看\
  \ GDD 包含的内容。\n\n# 探索游戏文档\n到目前，我们知道 GDD 是一个针对视频游戏的高度描述性的、动态的设计文档。对于使用 Godot（或任何游戏引擎）的开发者来说，准备良好的\
  \ GDD 可以通过清晰地概述系统、场景结构和 `GDScript` 来简化开发流程。GDD 的第一页或首页应该是游戏的高层概览，有时被称为推介文档（pitch\
  \ document）。在接下来的章节中我们将查看：\n\n## 标题：你会给你的游戏起什么名字？\n标题通常是一个临时标题，会随着游戏的演变而改变。标题应该代表游戏的核心思想，因此值得花些时间考虑这个问题。例如，我们的临时标题可以是\
  \ `SILENT STATION`。让我们在接的子章节中开发它。\n\n## 团队：谁来构建或开发游戏？\n列出负责游戏的人员以及他们负责的内容。不要担心头衔；专注于他们具体将制作哪些方面。\n\
  \n## 状态：项目状态如何？\n使用红绿灯系统或看板是最好的。创建以颜色为主题的标题：\n* **待办 TO DO**（黄色）\n* **进行中 DOING**（橙色）\n\
  * **已完成 DONE**（绿色）\n* **阻塞 BLOCKED**（红色）\n\n在这些标题下列出游戏功能。任何阻碍游戏进度或重大问题都应归为红色。示例见\
  \ `图 11.1`：\n\n![img](img/B3115_11.png)\n图 11.1 – 开发任务的简单看板示例\n\n## 概念陈述：用一句话描述你的游戏是什么的？\n\
  用一句话描述你游戏的核心功能。尝试包含背景、主角、主要目标和障碍。这里是来自 `SILENT STATION` 的示例：\n\n*一个孤独的宇航员必须仅使用手电筒在废弃的外星空间站（`背景`）中穿行，寻找失踪的船员（`目标`），同时避开对声音有反应的敌生物（`障碍`）。*\n\
  \n## 扩展概念和独特卖点（USP）：你的游戏独特之处在哪里？如何更详细地描述？\n在本节中，我们扩展概念陈述并描述玩法。请记住，这是一个简要扩展核心循环和玩家进的段落。突出游戏的独特卖点（`USPs`），这些有时被称为“钩子”（hook）——这是留住玩家投入精力的关键。这里是来自\
  \ `SILENT STATION` 的示例：\n\n*玩家必须带着有限的光束探索漆黑、幽闭的走廊，同时管理视觉和声效。该游戏的独特机制是其对声音有反应的敌人，结合了可以吸引危险的实时语音输入，使麦克风成为游戏循环的一部分。*\n\
  \n## 类型类型：你正在制作什么种类型的游戏？\n这些是具有相似游戏性特征的视频游戏分类。虽然单一类型的游戏仍然存在，但这些市场可能已经过度饱和，通过融合多种类型来创建新的游戏风格和机制，你可能会更成功。这里是来自\
  \ `SILENT STATION` 的示例：\n\n*带有光线解谜和探索元素的生存恐怖游戏。*\n\n## 受众：这个游戏是为谁准备的？\n这是你的目标市场。在这里，你可能会列出年龄范围和娱乐软件分级委员会（`ESRB`）分。你会查看该受众的游戏类型，甚至链接到更详细的玩家画像页面以及游戏将如何吸引他们。这里是来自\
  \ `SILENT STATION` 的示例：\n\n*成熟玩家（ESRB 16+），他们喜欢像《异形隔离》或《死亡空间》等叙事驱动的科幻恐怖游戏。*\n\n\
  ## 体验：玩家在玩时应该感受或体验什么？\n玩家在游戏中的体验是什么？游戏将让他们产生什么感觉？体验持续多久？此标题可以链接到关于玩家进度目标的详细页面，细节可以在那里展示。这里是来自\
  \ `SILENT STATION` 的示例：\n\n*游戏旨在营造恐惧和紧张感，并穿插短暂的缓解。它鼓励缓慢探索、注意音频线索，并通过营救幸存者建立情感连接。*\n\
  \n## 锚点：核心想法、灵感或参考点是什么？\n这些是游戏中让玩家与角色联系、让他们投入故事并让他们继续下去的体验。这些可以是开场场景、重要的 Boss 战或解锁剧情发展的重大物品发现。在此处突出这些内容，然后链接到提供更多剧情线索细节的页面是关键。这里是来自\
  \ `SILENT STATION` 的示例：\n\n* *宇航员最初与基地失去联系的时刻*\n* *在冷冻舱中发现第一个幸存者*\n* *首次遇到对声音有反应的敌人*\n\
  * *通过潜行路线开启整个扇区的电力* \n\n## 平台：游戏将在哪些平台发布？\n这是你针对的平台。它可能是 PC、移动设备或主机。可以是其中一个或全部，或者完全是其他东西。通常，你会缩小范围并专注于单一平台。这里是来自\
  \ `SILENT STATION` 的示例：\n\n*PC（初始），未来有扩展至主机的潜力。*\n\n## 评审竞争：有哪些相似的游戏？你的游戏将如何脱颖而出？\n\
  列出一些与你的游戏相似或直接竞争的游戏。然后，链接到一个你对竞争对手进行深度分析的页面。突出你游戏的独特之处。\n\n\n\n\n类似于《异形机械：隔离》和《观察》，但不同之处在于将独特的麦克风输入和声音作为核心机制。\n\
  \n## 资产：你的游戏需要哪些美术、声音和其他资源？\n\n你可能会包含一些确立游戏整体基调的概念图，并链接到一个更详细的文档，该文档列出了游戏所需的所有已知声音和图像资产。这将详细包括界面、动画、世界和角色。\n\
  \n以下是来自 `SILENT STATION` 的示例：\n\n* `音频：环境氛围音、语音行、生物音`\n* `视觉：模块化科幻内部瓦片集、动态光照资产`\n\
  * `UI：氧气表、手电筒电池图标、声音检测计`\n\n## 变现：游戏将如何产生收益（如果有的话）？\n\n在这里，你解释游戏将如何产生收益。游戏可能是一次性购买、免费游戏，或者包含游戏内购买。无论情况何如何，都需要在链接的系统和功能页面上进行详细说明。\n\
  \n将这些内容作为你游戏设计文档（GDD）第一页的主标题，并将它们链接到 GDD 中包含更多详细信息的其他页面，将为你的游戏概念提供极好的概述，并让每个阅读者清楚地了解这是一种什么样的游戏以及目标群体。\n\
  \n设计过程的下一步将是关注现在需要更多细节的游戏关键元素。\n\n以下是来自 `SILENT STATION` 的示例：\n\n付费模式——一次性购买。未来的\
  \ DLC（可下载内容）可以添加新的剧情或挑战模式。\n\n## 详细描述 GDD 中的游戏元素\n\n此部分将重点介绍 GDD 中需要更多细节的部分。这些章节之所以需要大量细节是因为它们是基础元素，没有它们游戏就不复存在。\n\
  \n因此，你和其他团队成员需要非常清楚游戏包含什么内容，它是如何运作以及如何影响游戏中的其他系统。使用后续章节中的指南为你的游戏想法添加尽可能多的细节。注意，每个标题代表\
  \ GDD 中的一个页或多个新页面。\n\n## 玩家进度与目标\n\n在本节中，你应该回答关于 `玩家` 的以下问题：\n\n* 他们是谁？\n* 他们知道什么？\n\
  * 他们的叙事弧线是什么？\n* 他们的目标是什么？\n* 他们是如何进展的？\n* 核心循环是什么？\n* 外层循环是什么？\n\n`玩家进度与目标` 页面链接到主页上的锚点。作为一个基于网络的文档，这通常是一个超链接，但这些点在概念上也是连接的，引导游戏如何随时间推展开。\n\
  \n为了清晰地定义进度，将其拆分为两个层很有帮助：\n\n* **核心玩法循环**：核心玩法循环代表玩家为了玩游戏而重复的基本动作。例如，在平台游戏中，这可能涉及跑步和跳跃以穿越关卡、攻击敌人以及避开危险。\n\
  * **外层循环**：另一方面，外层循环描述了更广泛的进度系统——玩家参与核心循环如何获得奖励。这包括解锁新关卡、获得升级或推进剧情。\n\n核心循环应该反馈外层循环，反之亦然，创造出令人满意且不断增强的游戏体验。\n\
  \n以下是来自 `SILENT STATION` 的示例：\n\n`玩家进度与目标`：\n\n* `开始：在医疗舱醒来`\n* `中期：修复通信阵列`\n* `后期：撤离剩余船员`\n\
  * `核心循环：探索` → `寻找工具` → `避开噪音` → `推进`\n* `外层循环：解锁新区域、使用新工具回溯、拼凑故事`\n\n## 游戏世界与背景\n\
  \n在本节中，你应该回答关于世界的问题：\n\n* **世界观**：是否有为游戏设定场景的背景故事？\n* **世界物理规则**：你可以跑步、飞行、坠落、漂浮等吗？\n\
  * **世界关键点**：玩家如何穿过游戏、地点等？\n* **彩蛋**：你是否有任何隐藏的惊喜供玩家去发现？\n\n如果需要，此页面可以链接到关于世界虚构的新文档。\n\
  \n以下是来自 `SILENT STATION` 的示例：\n\n`游戏世界与背景`：\n\n* `空间站背景：流浪月上被遗弃的研究设施`\n* `重力和氧气按房间进行管理`\n\
  * `通过环境叙事暗示政府秘密实验`\n\n图 `11.2` 所示的世界地图是游戏世界如何进行视觉表示的示例，有助于传达你游戏设定中的结构、规模和关键位置：\n\
  \n![img](img/B31515_11_2.png)\n\n图 `11.2` – 世界地图（鸣谢：[`kenney.nl/`](https://kenney.nl/))\n\
  \n这张地图提供了游戏世界的俯视图，显示了不同区域如何连接，以及关键事件或挑战可能发生在何处。在 GDD 中包含这样的视觉效果有助于你和你的团队保持游戏空间布局和叙事流的一致。\n\
  \n## 用户界面\n\n此部分应详细说明玩家与游戏世界交互以及接收有关世界和自身状态信息的所有方式。此外，务必关注视觉效果和感受。你应该回答这些问题：\n\n\
  * 控制方案是什么？\n* 控制方案是什么？（考虑提供线框图。）\n* 你提供什么样的帮助系统，它看起来是什么样？\n* 你们是如何呈现的？\n* `选项（Options）`菜单看起来什么样？\n\
  * `暂停（Pause）`菜单看起来什么样？\n\n以下是来自 `SILENT STATION` 的示例：\n\n*极简 UI，事内界面（手电筒光效、整合条）*\n\
  \n图 `11.3` 显示了元素：\n\n![img](img/B31515_11_3.png)\n\n图 `11.3` – UI 原型（鸣谢：kenney.nl/)\n\
  \n## 音频与视觉风格\n\n此页面提供了游戏氛围和环境的细节。它应该清晰地定义游戏看起来和听起来应该是什么样。这一切构成了游戏的整体情绪，你应该回答如下问题：\n\
  \n* 色调板是什么？\n* 音乐风格是什么？\n* 艺术风格是什么？\n* 包含参考、示例和概念图\n* 提供环境、角色、敌人、物体等想法\n\n此页面应链接到完整的资产列表。\n\
  \n* `风格化写实` \n* `分层环境调、定位音频、玩家呼吸声`\n\n图 `11.4` 显示了色调板示例。更多示例请查看 `Lospec` ([`lospec.com/`](https://lospec.com/))。\n\
  \n![img](img/B31515_11_4.png)\n\n图 `11.4` – 色调板示例\n\n## 游戏系统与功能\n\n游戏从未真正完成——总会有诱惑添加新的、酷的功能来让游戏变得更好。那么，你如何决定在这一部分包含哪些功能？\n\
  \n答案是列出为了游戏最小可行性产品（MVP）或`垂直切片（vertical slice）`的可玩所需的所有系统和功能：\n\n* MVP 是你游戏的最简单版本，包含了足够的核心功能以供运行和测试。\n\
  * 垂直切片是游戏的一个小的、经过完全完善的部分，代表了最终的视觉、感受和游戏性。\n\n考虑回答这些问题：\n\n* 为什么需要这个功能？\n* 该功能如何与其他任何功能交互？\n\
  \n\n\n\n* 每项功能对游戏性有何贡献？\n* 每项功能对变现有何贡献？\n\n以下是来自 *SILENT STATION* 的示例：\n\n### 手电筒系统：\n\
  \n* *必要性：手电筒是玩家在黑暗环境中导航唯一方式，营造了紧张感并实现了对可见性的控制*\n* *功能交互：与电量管理和潜行系统集成；电池电量有限，需要策略性地使用*\n\
  * *对游戏性的贡献：控制了玩家的视野范围，影响了探索、节奏，并增加了脆弱性*\n* *对变现的贡献：没有直接影响，但对情感基调和市场吸引力至关重要*\n\n\
  `Figure 11.5` 展示了游戏中的各个系统和功能如何像积木一样运作。每个区块代表一个不同的系统，例如移动、物理、UI 或关卡设计。这些系统单独看起来可能很简单，但当它们仔细连接在一起时，就会相互支持并增强，创造出一个连贯且引入胜的体验。\n\
  \n![img](img/B31515_11_5.png)\n\n图 11.5 – 系统和功能如何共同工作创造更大的体验\n\n（来源：https://kenney.nl/）\n\
  \n就像 `Figure 11.5` 中一样，正是这些区块的组合和交互形成了游戏的完整结构。\n\n## 软件需求\n\n本节应专门列出开发游戏所需的软件工具，必要时也包括资源工具。它还应该概述每个工具的作用。你应该回答以下问题：\n\
  \n* 将使用什么游戏引擎？\n* 使用什么进行世界构建和关卡设计？\n* 使用什么来处理对话树和叙事结构？\n* 使用什么来进行任务和剧情设计？\n* 开发游戏还需要哪些其他工具？\n\
  \n以下是来自 *SILENT STATION* 的示例：\n\n* *使用 Godot 4 作为游戏引擎*\n* *使用 Blender 进行建模*\n* *使用\
  \ Reaper 进行音频编辑*\n\n`Figure 11.6` 显示了 Godot 引擎界面的截图：\n\n![img](img/B31515_11_6.png)\n\
  \n图 11.6 – Godot 引擎界面\n\n![黑色背景上的放大镜 AI 生成可能不准确。](img/1_G1.png) **快速提示**：需要查看此图像的高分辨率版本吗？在下一代\
  \ Packt Reader 中打开此书，或在 PDF/ePub 版本中查看。\n\n![img](img/4_G.png) 您的购买包含了此书以及一份的**免费\
  \ PDF/ePub 版**。扫描 QR 码或访问 [packtpub.com/unlock](http://packtpub.com/unlock)，然后使用搜索栏通过名称查找此书。双检显示的版本，以确保你获得的是正确的版本。\n\
  \n![img](img/B31515_Unlock_Benefits_QR.png)\n\n## 游戏对象\n\n此页面应列出你游戏中定义的所有对象的详细信息。你应该列出这些元素的细节，包括以下内容：\n\
  \n* 所有非玩家角色 (`NPCs`) 和敌人\n* 关于 NPC 和敌人的背景故事\n* NPC 和敌人的对话，包括指向对话文件的链接\n* 所有 NPC\
  \ 和敌人的属性，如能力、特殊攻击等\n* 其他游戏对象的属性和值，例如移动平台等\n* 游戏对象的所有函数、方法或行为\n* 此页面应链接到资源列表页面\n\
  * 此页面应链接到资源属性和属性列表页面\n\n以下是来自 *SILENT STATION* 的示例：\n\n* *敌人：“回声幽灵”——盲目，但对声音高度敏感*\n\
  * *幸存者：拥有对话树和脚本事件*\n\n`Figure 11.7` 展示了链接到世界地图的资源：\n\n![img](img/B31515_11_7.png)\n\
  \n图 11.7 – 链接到游戏世界地图的资源（来源：https://kenney.nl/）\n\n## 详细资源列表\n\n这是你的设计文档应该链接的页面。它可以是一个不断更新的电子表格，因为它包含了整个资源列表，定义了每个对象及其属性。这应该包括每一个对象：游戏中所使用的所有文本、图形和音频内容。\n\
  \n你应该从从开始*原型制作*和*测试*游戏性时就开始创建此列表。这是因为你需要的资源数量将给你一个关于游戏规模的良好指示，并对制作所需时间做出估算。如果你不创建资源列表并保持更新，将非常难以跟踪开发进度。\n\
  \n以下是来自 *SILENT STATION* 的示例：\n\n*你将链接到显示模型名称、文件类型、多面体计数和使用标签的电子表格*\n\n![img](img/B31515_11_8.png)\n\
  \n图 11.8 – 保持游戏中所有资源的列表是关重要的（来源：https://kenney.nl/）\n\n## 原型\n\n通常，你可能想要测试想法、功能和机制。当你开发原型来测试这些想法时，你应该将它们链接到你的\
  \ GDD（游戏设计文档）。关于原型提供尽可能详细的信息，包括制作日期、原型目的以及测试了什么。你还应该包括这如何改变设计。\n\n以下是来自 *SILENT\
  \ STATION* 的示例：\n\n* *原型 1：敌人检测测试*\n* *原型 2：手电筒电量消耗与关卡节奏*\n\n## 玩测试\n\n在开发游戏期间，你会进行很多测试。这是游戏开发中至关重要的步骤，因为这是一个渐进的过程。你应该在文档中包含测试结果的链接。\n\
  \n该页面应包含以下概述：\n\n* 你在测试什么？\n* 为什么要测试它？\n* 你学到了什么？\n* 它是如何影响开发的？\n\n以下是来自 *SILENT\
  \ STATION* 的示例：\n\n*玩测试 1 发现玩家不理解声音的影响 → 在关卡中加入了微妙的音频教程*\n\n`Figure 11.9` 展示了灰盒（gray\
  \ boxing）的概念，这是一种在早期阶段的技术。在灰盒中，在添加美术或资源之前，使用简单的形状和占位图形来构建关卡布局。这允许开发人员专注于测试核心机制，如移动、碰撞、关卡流程和挑战平衡，而不受视觉效果干扰。\n\
  \n![img](img/B31515_11_9.png)\n\n图 11.9 – 记录所有测试的结果（来源：https://kenney.nl/）\n\n灰盒是测试和玩测试过程中重要的一部分，有助于团队早期发现设计问题，完善玩家体验，并确保游戏在投入视觉效果之前是趣味且有效的。\n\
  \n## 存档\n\n随着时间的，你会尝试不同的想法并测试不同的功能。并不是所有的想法都可行，因此不要扔掉它们，而是创建一个存档并存储在那里。\n\n在开发的后期，这些想法和功能的部分可能会是有用的。存档还能让你感受到设计是如何随时间演变的，并让你从全局视角看到取得了多少进展。\n\
  \n以下是来自 *SILENT STATION* 的示例：\n\n*原始的双人合作想法已存档，但可能会在扩展包中回归*\n\n![img](img/B31515_11_10.png)\n\
  \n图 11.10 – 从存档中提取想法并应用到设计的其他地方（来源：https://kenney.nl/）\n\n## 当前关注的问题和考虑\n\n由于你会刻意限制范围（通常仅限制在最小可行性产品（MVP）或垂直切片所需的内容），你的许多想法和功能将不会进入生产阶段。但是，它们可以被标记为未来的游戏扩展。\n\
  \n\n\n\n同样，你可能对已实现的功能有所疑问，它们目前可能尚未解决或无法按照你的要求工作。你应该在这里列出它们，一旦解决，就可以将它们移动到新的页面或章节，并对问题进行详细描述。\n\
  \n这是一个来自 `SILENT STATION` 的示例：\n\n*关于所有平台的不确定性*\n\n## 实现细节\n\n游戏的每个功能、系统和机制都需要详细的文档来向开发者展示如何实现。这部分不仅仅是侧重于设计，而是侧重于**开发**。它应该回答以下问题：\n\
  \n*   需要哪些算法和数据结构？\n* 导航、对话等功能是如何实现的？\n*   需要哪些系统？\n* 游戏如何运作？\n*   需要什么样的架构？\n*\
  \   为了测试目的，是否有任何技巧（cheats）？\n* 文件夹结构以及命名规范是什么？\n\n这是一个来自 `SILENT STATION` 的示例：\n\
  \n*   使用射线检测（raycasting）的检测系统\n*   敌人使用状态机在巡逻、警觉和追逐之间切换\n\n有了实现细节，设计将从构想转向实际执行。这部分确保了开发者有一个清晰的蓝图来有效地构建游戏系统。在基础奠定之后，下一步是考虑这些元素如何在制作、测试和迭代过程中结合。\n\
  \n# 总结\n\n在本章中，我们探索了游戏设计在游戏开发中的关键作用，并关注游戏文档的结构和目的。我们详细介绍了游戏文档的每个章节，从概念、团队组成到货币化策略、原型以及游戏测试。这种结构化的方法确保了开发者能够清晰地记录游戏的每一个重要方面，并与项目目标保持一致。\n\
  \n创建一个设计文档不仅仅是一个形式，它是将愿景变为现实的关键步骤。无论你是在构建一个简单的游戏还是复杂的冒险游戏，清晰且组织良好的文档都是协作的价值工具。最终，在设计上投入时间可以简化开发流程，减少昂贵的修改，并为良好的玩家体验奠定基础。\n\
  \n现在你已经了解了如何计划和记录你的游戏，下一章节将指导你完成设计完成后的工作。你将探索教育资源、练习技能的方法、连接游戏开发社区并开始构建作品集。你还将学习如何为未来的项目构引人的游戏想法。\n\
  \n| 现在解锁本书的专属福利 | 扫描此二维码或访问 `packtpub.com/unlock`，然后按名称搜索此书。 | ![img](img/B31515_Unlock_Benefits.png)\
  \ |\n| :--- | :--- | :--- |\n| 注意：开始前准备好购买发票。 | | |\n\n# 12 - 下一步去哪里？\n\n恭喜到达《Godot\
  \ 4 入门》的最后一个章节！你现在对使用 Godot 引擎创建游戏有了坚实的基础，并培养了将想法变为现实的实践技能。但旅程并未此结束——本章旨在帮助你在游戏开发职业中进一步。\n\
  \n本章将向你介绍各种支持开发者持续成长的资源和机会。从 YouTube 频道、博客到游戏松（game jams）和素材市场，你将发现可以启发、教学并提升你项目的工具、社区和专家。\n\
  \n在本章中，我们将涵盖以下主要主题：\n\n* 利用教育资源\n* 探索实践机会\n* 社区与社交\n* 利用工具和素材\n* 构建你的作品集\n* 开发游戏想法\n\
  * 下项目的设计指南\n\n在本章结束时，你将拥有一份精选的资源列表来加深知识、扩展技能并与其他开发者建立联系。你还将发现如何保持动力、关注最新趋势并在游戏开发社区中建立自己的影响力。\n\
  \n无论你的游戏开发之旅下一步带你走向哪里，这些资源都将是你持续学习和成功的基础。让我们探索那里有什么！\n\n# 技术要求\n\n不需要任何技术设置——只需要探索、实验以及在游戏开发中迈下一步的意愿。\n\
  \n## 利用教育资源\n\n学习如何在 Godot 中开发游戏并不停止于单一的项目或教程；这是一个持续的过程。本节介绍了各种信赖的教育资源，如 YouTube\
  \ 频道、博客和书籍，它们可以帮助你加深知识、跟进引擎演进并从经验开发者那里获得灵感。\n\n无论你喜欢看视频教程、阅读分步骤指南还是从社区见解中学习，这些资源将支持你增长技能并承担更具雄心的项目的旅程。\n\
  \n## YouTube\n\nYouTube 上有很多免费的游戏开发学习资源。因为 Godot 本身是开源的，引擎周围的社区拥有分享和互助的哲学。社区中有一种观点：`我们不应该垄断知识，而应该通过开放和共享学习更多`。\n\
  \n一些最好的 Godot 游戏开发 YouTube 频道包括：\n\n*   **GDQuest** [`https://www.youtube.com/@Gdquest`](https://www.youtube.com/@Gdquest)]:\
  \ 认为是学习如何使用 Godot 引擎创建游戏的最佳资源，GDQuest 是一个专业且成熟的 Godot 教育者群体。这意味着你将获得那些在 Godot 引擎方面经验丰富者的积累知识。我个人经常使用他们的频道来获取各种节点（nodes）的简明解释，因为他们解释得简洁且直击主题。他们\
  \ YouTube 频道上的所有材料都是免费的，如果你喜欢他们的教学风格，那么探索付费课程是明智的，我将在本章后面讨论。\n*   **Heartbeast**\
  \ [`https://www.youtube.com/@uheartbeast`](https://www.youtube.com/@uheartbeast)]:另一个与\
  \ Godot 相关的极佳资源是 Heartbeast。Benjamin 是 Godot 的早期采用者，他的教程是我见过的最详尽、详细且对初学者友好的教程之一。他非常擅长解释为什么要这样做，我非常推荐他的频道。\n\
  \n\n\n\n\n如果你正在寻找一种从零到尾在 Godot 中创建游戏的完整体验，并且过程中伴有细致详细的解释，那么 Heartbeast 频道非常适合你。如果你想超越他在\
  \ YouTube 频道上讨论的基础知识，Benjamin 也有一些付费课程。\n\n- `Godot Tutorials` ([`www.youtube.com/@GodotTutorials`](https://www.youtube.com/@GodotTutorials)):\
  \ : 如果你想更多地关注 Godot 游戏引擎中的代码编写，请查看 Godot Tutorials 频道。该频道采用详尽的方法使用 Godot 制作游戏，并在教学中也包含了游戏设计的元素。该频道专注于在\
  \ Godot 引擎中使用 `GDScript` 编码原则，这使其成为你深入理解如何在 Godot 中实现各项功能的绝佳去处。\n\n该频道配有一个网站，提供了所有视频教程的文本版本。我非常感谢这一点，因为我通过文本学习得效果更好，所以，如果这也是你的学习风格，请查看\
  \ [`godottutorials.com/`](https://godottutorials.com/) 。\n\n- `GameDev Journey`\
  \ ([`www.youtube.com/@GameDevJourney`](https://www.youtube.com/@GameDevJourney)):\
  \ : 最后，如果你喜欢本书向你呈现材料的方式，那么你也会喜欢我个人 YouTube 频道上的教程。它也有一个配套的网站，以文本格式呈现相同的教程，你可以访问\
  \ [`www.gamedevjourney.co.uk/home`](https://www.gamedevjourney.co.uk/home) 。\n\n\
  这些教程是模块化的，专注于单个游戏机制。除了教程之外，还有开发者日记、关于游戏资产和资源的讨论，以及提供建议以帮助你保持积极性的鼓励性视频。\n\n现在，让我们来看看一些博客推荐。\n\
  \n## 博客\n\n游戏开发是一个不断演变的领域，总有学不完的东西。网上有一些棒的博客涵盖了游戏设计和制作游戏背后的理论。\n\n为了保持最新状态并关注当前的最佳实践，以下博客会很有用：\n\
  \n- `Deconstructor of Fun` ([`www-deconstructoroffun.com/blog`](https://www.deconstructoroffun.com/blog)):\
  \ : 这个博客分析了热门免费游戏的设计，以批判性的眼光审视参与度、留存和货币化方面的哪些做法是有效的，哪些是无效的。内容由一个也大量玩游戏的开发者团队编写，对于想要理解趣味性和盈利能力之间平衡的职业游戏制作者来说，这些内容非常有价值。如果你计划以制作游戏为生，这个博客提供了关于在竞争激烈的市场中让游戏成功的真实世界见解。\n\
  \n- `Game Design Skills` ([`gamedesignskills.com/blog/`](https://gamedesignskills.com/blog/)):\
  \ : 这个博客提供了一个丰富且不断成长的文章库，专注于游戏设计的实践，特别是玩家如何与游戏系统交互。它深入探讨了机制、控制、进度和平衡，使其成为初出茅庐和资深设计师的绝佳资源。无论你是在学习基础知识还是精炼技能，该网站都是探索真实案例和实用设计思维的宝贵之地。\n\
  \n- `Game Developer` ([`www.gamedeveloper.com/`](https://www.gamedeveloper.com/)):\
  \ : Game Developer 是任何在游戏行业工作或学习的人士的首选中心。它涵盖了已发布游戏的详细事后分析（postmortems）、开发者见解和幕后文章，以及定期更新行业趋势和新闻。对于学生、独立开发者和专业人士来说都是理想的，这是一个从真实世界经验中学习并对游戏开发不断变化的格局保持关注的地方。\n\
  \n无论你倾向于快速见解还是深度文章，这些博客都是跟进不断的设计趋势和行业实践的绝佳方式。对于更具结构化且全面的学习方法，请参阅本章末尾“延伸阅读”部分推荐的书籍。\n\
  \n# 探索实践机会\n\n在与许多游戏开发者的交流中，有一条建议被反复提到：制作游戏时要“从小做起”（`start small`）。这种方法的益处如下：\n\n\
  - 从小游戏开始可以让你学习核心概念，如移动、碰撞和基础机制，而不会被大型游戏的规模所淹没。\n- 较小的项目可以更快地完成。这带给你完成某作品并看到它运行的成就感。它还让你获得了从头到尾制作游戏的过程经验，这增强了信心和动力。拥有一个别人可以玩的游戏还让你有机会获得反馈，你从中从中从中学习。\n\
  - 拥有一个小游戏为你提供了一个犯错并从错误中学习的安全空间。试错是初期学习的极佳方法。在较大的项目中，你的错误会累积且难以修复。\n- 当你处理较小的游戏时，你有机会开发基本的解决问题的技能，而不需要同时平衡多个系统。\n\
  - 制作许多小游戏可以让你逐步建立作品集。一组虽小但精良的项目比许多粗糙且未完成的大项目要好。这是展示你工作的好方法。\n- 一旦你完成了一些较小的游戏，你将对游戏开发工作流有更好的理解，并为自己承担更有野心的项目奠定基础。\n\
  \n练习技能的一种棒方法是参加游戏马拉松（game jams）。我们将在下一节讨论这一点。\n\n## 参加游戏马拉松\n\n`Game jams` 是一种限时活动，个人或团队根据给定的主题和一系列限制条件，从头到尾创建一个游戏。它们通常持续从\
  \ 48 小时到一周不等，并对所有水平的参与者开放。\n\n对于初学者来说，游戏马拉松是获得经验的绝佳方式。你将有机会练习从设计机制到编写代码、创作艺术和作曲——这一切都是短短短的创意爆发中完成的。如果你对某个领域没有信心，也不要担心——游戏马拉松吸引各种人士，许多参与者会组成小组并互相学习。\n\
  \n此外，你还将体验完整的游戏周期：脑暴、原型制作、测试和完成一个可玩的项目。这可以极大地增强信心，并是一个很棒的作品集项目。更重要的是，这是一个与同样热爱游戏的人建立联系的有趣且友好的方式。你可以在\
  \ `itch.io` ([`itch.io/`](https://itch.io/)) 上找到适合你水平和时间要求的的游戏马拉松。他们有一个活动日历，你可以在\
  \ [`itch.io/jams`](https://itch.io/jams) 报名。\n\n其他大型马拉松还有：\n\n- `Godot Wild Jam`\
  \ : [`godotwildjam.com/`](https://godotwildjam.com/)\n- `Ludum Dare` : [`ldjam.com/`](https://ldjam.com/)\n\
  - `The Global Game Jam` : [`globalgamejam.org/`](https://globalgamejam.org/)\n\n\
  游戏马拉松只是与他人共同学习的强大例子之一。无论你是团队协作、分享反馈，还是观察他人如何处理同一主题，这些活动都强调了社区对游戏开发的重要性。\n\n在下一节中，我们将探索参与更广泛的游戏开发社区并建立职业人脉如何开启大门、提供支持并帮助你作为开发者进一步成长。\n\
  \n\n\n\n\n游戏开发中最令人鼓舞的特性之一就是其充满鼓励和支持的社区。每一位游戏开发者都知制作一款游戏有多困难，他们也知道初学者时那种感觉连最简单的事情都不会怎么做是什么感受。这就是为什么他们总是乐于帮助他人学习。游戏开发者还相互依赖进行游戏测试和反馈。\n\
  \n## 为什么人脉至关重要\n\n与其他游戏开发者进行`Networking`可以开启大门，让你建立合作关系，并获得导师指导、工作机会和兼职机会。许多游戏开发者通过他们建立的人脉在行业内找到了第一份工作，或者遇到了未来的合作伙伴。\n\
  \n人脉还能提升你的曝光度。通过参与社区以及在游戏马拉松（game jams）、会议和聚会等活动中社交，你可以开始获得关注。这种曝光度对于获得工作、确保资金或为游戏发布获得关注至关重要。\n\
  \n## 在哪里建立人脉\n\n你可以在 `X`、`Reddit` 和 `Discord` 服务器等平台上建立人脉并与社区联系。参加游戏马拉松会让你的名声传出去，甚至可能给你提供加入团队的机会。\n\
  \n参加行业活动和会议（如`游戏开发者大会` (`GDC`)）以及较小的本地聚会，可以提供面对面建立联系和向行业资深人士的机会。\n\n即使你是游戏开发的新手，也可以为他人提供价值。这不仅仅关乎寻求帮助，也关乎提供帮助！如果有人寻求反馈或需要人测试他们的游戏，不要犹豫，尽管去提供。\n\
  \n### 值得关注的人\n\n在 LinkedIn 上值得关注的一些优秀专业人士如下：\n\n*   Sergei Vasiuk ([https://www.linkedin.com/in/sergeivasjuk/])\n\
  *   Gökhan Üzmez ([https://www.linkedin.com/in/gkhnuzmez/])\n*   Jakub Remiar ([https://www.linkedin.com/in/jakubremiar/])\n\
  *   Amir Satvat ([https://www.linkedin.com/in/amirsatvat/])\n*   Mayank Grover ([https://www.linkedin.com/in/mayankgrover/])\n\
  *   Mirko Minenza ([https://www.linkedin.com/in/mirko-minenza/])\n*   Anton Slashcev\
  \ ([https://www.linkedin.com/in/aslashcev/])\n\n通过建立人脉并成为游戏开发社区的一员，你可以提升技能、学习并培养对创作游戏的热爱。周围环绕着志同道合的人将使你找到灵感、指导和同谊，这会让你的游戏开发之旅更有意义。\n\
  \n# 利用工具和资产\n\n在进行游戏开发时，特别是在刚开始阶段，拥有正确的工具和资产来实现你的想法非常重要。游戏开发是一个非常复杂的过程，涉及许多学科，包括艺术、音频、编程和设计。让我们来看一些可以帮助你这些方面的工具和资源。\n\
  \n## 工具\n\n在这一部分中，我们将查看游戏开发关键领域的某些本质工具：\n\n*   `Game engine`：我们选择的游戏引擎是 `Godot`\
  \ ([https://godotengine.org/])，因为它是免费开源的。它对新手友好、轻量级，非常适合 2D 和 3D 项目。\n*   `Graphic\
  \ tools`：这里是用于创建图形的几个推荐工具：\n    *   `GIMP` 是 Photoshop 的免费开源替代品：[https://www.gimp.org/]\n\
  \    *   `Krita` 也是一个用于创建数字绘画和 2D 艺术的免费开源工具：[https://krita.org/en/]\n    *   `LibreSprite`\
  \ 是创建像素艺术的 `Aseprite` 的免费开源替代品：[https://libresprite.github.io]\n    *   `Blender`\
  \ 是一个用于创建 3D 模型和动画的免费开源工具：[https://www.blender.org/]\n*   `Audio tools`：这是一份帮助你起手的免费工具列表：\n\
  \    *   `Audacity` 是一个用于录制和编辑音频的免费工具：[https://www.audacityteam.org/]\n    *   `LMMS`\
  \ 是作曲音乐的免费开源软件：[https://lmms.io/]\n    *   `Bosca Ceoil: The Blue Album` 是制作复古游戏音乐的免费开源工具：[https://yurisizov.itch.io/boscaceoil-blue]\n\
  \    *   `Bfxr` 是一个创建音效的免费工具：[https://www.bfxr.net/]\n*   `Version control`：为了跟踪更改，`Git`\
  \ 通常配合 `GitHub` 或 `GitLab` 使用。\n\n\n\n\n\n`portfolio`（作品集）对于任何有志的游戏开发者来说都是必不可少的。这是因为游戏开发从根本上是一项实践性技能，而不是另一个理论学科。当然，理解设计、编程和艺术的底层概念很重要；然而，游戏开发者能力的真正体现在于他们对这些技能的应用。\n\
  \n你的作品集证明了你对这些概念的掌握程度，并展示了你对游戏开发工具、技术和工作流的经验。你创建功能性、吸引人且趣味性游戏的能力将得到清晰展示。包含你完成的项目和原型，以突出你的实操经验和解决问题的能力，证明你熟悉游戏引擎和素材创建软件等行业标准工具。\n\
  \n开始制作游戏作品集的绝佳去处是 `itch.io`（参见“参加游戏马拉松”部分以查看网站信息）。你只需在 `itch` 上注册一个账户，就可以免费在那里托管你的游戏。每个\
  \ `itch` 页面都可以完全自定义，你可以参考这里提供的简用指南进行此操作：[`itch.io/docs/creators/design`](https://itch.io/docs/creators/design)。\n\
  \n游戏开发者始终在学习，你的作品集将反映这一点。作为开发者，你处于一场终身的旅程中。你的作品集记录了这段旅程，证明你已经将理论付诸实践，并且可以将想法转化为可玩的现实。\n\
  \n## 开发游戏创意\n\n现在你已经拥有了这些信息，你可能渴望开始为你的作品集开发一款游戏。不知道从何处开始可能会令人生生畏。创意并非易事，通常一个提示（prompt）对于点燃灵感的火花非常有帮助，这种火花可以迅速像野火一样蔓延！\n\
  \n如果你为下一个项目的游戏构思感到苦恼，可以使用游戏创意生成器：[`letsmakeagame.net/game-idea-generator/`](https://letsmakeagame.net/game-idea-generator/)\n\
  \n如果随机的想法不能吸引你，那么可以尝试这些经过验证的技巧来寻找创意的开端：\n\n*   **热门游戏混搭 (Mash-up hit games)**：查看至少两款热门游戏的核心机制，然后想出一个方法将它们结合成你游戏中的一种机制。这可以带来一些有趣且突现的玩法。\n\
  *   **简化 (Simplify)**：观察一些复杂的游戏以寻求灵感，并创造性地思考如何将其体验简化为移动端的休闲游戏。考虑增加限制条件，例如只使用单个屏幕或让游戏时长不超过一分钟。\n\
  *   **打磨 (Polish)**：每天在各种数字商店都会发布大量游戏。这是一个创意的金矿，因为其中许多游戏是赶于市场上市的，显然缺乏打磨。你不需要想出一个完全新的想法；你只需要很好地执行一个流行的想法。\n\
  *   **制造惊喜 (Surprise people)**：将一个想法推向荒谬的程度。通常，一款伟大游戏的关键在于意料之外和惊喜元素。\n*   **感受即正义\
  \ (Feeling is fun)**：诉诸玩家的情感。你的观众可能会忘记你的游戏是关于什么的，但他们永远不会忘记游戏带给他们什么样的感受。这会鼓励口碑广告。\n\
  *   **使用新科技 (Use new tech)**：随着生成式 AI 的兴起，每个人都可以获得想法的讨论平台以及无尽的反馈和协助。充分利用这项技术。\n\
  *   **个人灵感 (Personal inspiration)**：如果你的游戏灵感源于自己的真实经历，它将是独特且能引起共鸣的。\n*   **反转 (Reversals)**：反转熟悉的概念是产生有趣想法的良好来源。例如，与其扮演拯救世界的英雄，如果扮演一个试图避免被阻止的反派会怎样？《主宰模式》（最初发布于\
  \ 2007 年）和《无名大鹅模拟游戏》（最初发布于 2019 年）都玩了这个点子——让玩家制造混乱而不是防止混乱。\n*   **反向工程 (Reverse\
  \ engineer)**：你可以解构并重构知名成功的游戏，并为它们添加新的转折。以《俄罗斯方块》（最初发布于 1984 年）为例。如果目标不是拼凑区块，而是破坏一个完整的结构呢？或者想象一款像《星露谷物语》（最初发布于\
  \ 2016 年）这样的农场游戏，但在外星星球上，你必须让作物适应奇异的生物并管理氧气水平。\n\n现在你已经探索了生成独特且有趣的游戏创意的不同方法，是时候采取下一步了——将这些想法转化为完全计划的项目。在下一节中，你将找到一份实用的设计指南，帮助你将概念塑造为一个你可以开始构建的游戏。\n\
  \n# 下一个项目的设计指南\n\n一旦你有了主意，以下设计原则可以帮助你的游戏成为一种有回报的体验：\n\n*   **应该奖励好奇心**：应该鼓励玩家去探索游戏开发者花费大量时间规划和设计的关卡。如果他们偏离了主路线，那么这种时间投入应该是值得的。额外的故事内容、宝藏、稀有物品或强化道具会让玩家继续探索并让玩法保持新鲜感。\n\
  *   **胜负条件要清晰**：不要用模糊的胜负条件困扰玩家。玩家需要关于他们为何失败以及如何获得成功的准确且实时的反馈。视觉线索在这里非常有帮助。使用进度条、血条、危险符号和颜色参考等元素将赋予玩家信心。\n\
  *   **一致性是关键**：教玩家你游戏的规则，然后遵守这些规则。模式可以建立玩家的信任，并创造出一个玩家会喜欢的一致的游戏世界。\n*   **展示而非说教\
  \ (Show don’t tell)**：教程关卡可能非常无聊，由于这通常是玩家的第一个关卡，它可能会让人们对游戏失去兴趣最好的教程是微妙地引导玩家自己发现解决方案和游戏机制，而不破坏沉浸感。一个极佳的例子是\
  \ Valve 开发的《门户》（最初发布于 2007 年），它通过设计巧妙且逐渐复杂的谜题来引入每种新机制。玩家通过实践来学习，而不是阅读说明。这种互动式学习让玩家保持投入，并让教程感觉像是游戏的一部分。\n\
  *   **公平才有趣 (Fair is fun)**：人类有强烈的正义感，他们希望事情是公平的。不要通过允许敌人打破适用于玩家的规则来增加难度。指的是那些可以瞬间移动并违背游戏物理规则的敌人——简单来说就是作弊。\n\
  *   **负面强化 (Negative reinforcement)**：如果玩家努力获得了一个奖励，不要从他们那里夺走。如果某物在没有玩家参与的情况下被夺走，会感到不公平。允许玩家选择放弃物品，通常通过出售或交换。\n\
  *   **清晰的目标 (Clear objectives)**：对玩家来说最沮丧的事情之一是不知道下一步该做什么。即使在开放世界探索游戏中，玩家也应该清楚下一步可以做什么。这可以是一条完全线性的路径，也可以是在多个目标之间的选择。过程可以是挑战性的，但目标必须显而易见。一个很好的例子是《塞尔达传说：荒野之息》（最初发布于\
  \ 2017 年）。虽然游戏给了玩家探索的自由，但它通过环境线索、地图标记和微妙的 NPC 对话持续提供引导，帮助玩家确定方向并选择接下来要做什么。\n\n\n\
  \n\n\n*   **趣味是基础**：趣味是一个模糊的术语。本质上，当我们说一个游戏很有趣时，意味着玩家一直被激励着继续玩下去。核心玩法必须是有趣的；它必须激励玩家继续旅程，否则，无论有多少奖励、内容或故事都将毫无意义。\n\
  *   **玩家最清楚**：尽早听取反馈并实施更改和建议。玩家是否感到无聊、沮丧挫败或困惑？玩家会指出真实的问题，那些阻碍他们继续玩下去的。玩家反馈可以拯救你的游戏。\n\
  *   **尊重玩家**：如果你给玩家提供了选择，那么你就必须尊重他们的决定。不要提供虚假的选择来强制玩家做出“正确”的决定。这会破坏沉浸感。你游戏的结局应该符合玩家的预期。\n\
  \n现在，你已经为设计游戏奠定了坚实的基础，准备好探索游戏开发的特定领域了。以下精选的资源旨在帮助你作为开发者继续学习和成长。\n\n## 进阶阅读\n\n*\
  \   Vanhove, S. (2024). *通过使用 Godot 4 开发游戏学习 GDScript：GDScript 2.0 编程入门与 Godot 引擎游戏开发的趣味介绍*\
  \ . Packt Publishing Ltd. ([`www.packtpub.com/en-in/product/learning-gdscript-by-developing-a-game-with-godot-4-9781804616987?srsltid=AfmBOorONDSKsGBPgQdezH_3z6R8z1cQn57-bahYjmhfNzjd4JT3EP3t`](https://www.packtpub.com/en-in/product/learning-gdscript-by-developing-a-game-with-godot-4-9781804616987?srsltid=AfmBOorONDSKsGBPgQdezH_3z6R8z1cQn57-bahYjmhfNzjd4JT3EP3t))\n\
