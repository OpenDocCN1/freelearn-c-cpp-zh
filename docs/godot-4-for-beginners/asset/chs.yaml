  \ 开发者。使用时注明出处，不代表背书。\n\n## 使用的规范\n\n本书中使用了多种文本规范。\n\n`CodeInText`：表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入和 X 账号。例如：“现在按 `Ctrl` + `S` 将场景保存为 `Scenes` 文件夹中的 `player.tscn`。”\n\n\
  代码块的设置格式如下：\n\n```\nextends Node2D\n@onready var update_health_hud = $HUD\n@onready\
  \ var player = $Player\n@onready var strawberries = $Collectibles\nfunc _ready():\n\
  \    player.level_strawberries = strawberries.get_child_count()\nfunc _process(delta):\n\
  \    update_health_hud.frame = player.get_hearts()\n```\n\n当我们希望在一系列步骤中引起您对命令行输入或输出的注意时，相关的行或项目将**加粗**显示：\n\
  \n```\nextends Node2D\nvar health : int = 100\nvar jump_strength : float = 220.5\n\
  var is_dashing : bool = true\nvar player_name : String = “Riptide”\nvar player_level\
  \ : int = 23\nvar player_exp : float = 123.45\nvar has_key : bool = false\nvar spike_damage\
  \ : int = 10\n```\n\n在 Linux 上，在终端中运行以下命令：\n\n```\nUnzip Godot_v4.3-stable_linux.x86_64.zip\
  \ -d Godot\n```\n\n**加粗**：表示新术语、重要词汇或你在屏幕上看到的单词。例如，菜单或对话框中的单词将如下文本所示。例如：“在 `Particle\
