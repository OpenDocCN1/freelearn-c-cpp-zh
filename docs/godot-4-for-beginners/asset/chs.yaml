  \n可以在这里找到：[`essssam.itch.io/3d-land`](https://essssam.itch.io/3d-land)\n\n访问此链接查看代码视频：[`packt.link/SDDNS`](https://packt.link/SDDNS)\n\
  \n# 探索收集品\n\n**收集品**是关卡目标的方式。通过分散它们，我们可以鼓励玩家进行探索。收集品还可以赋予玩家新能力（临时或永久），或者简单地增加分数。它们可以是为了趣味而收集，也可以作为完成关卡的要求。我们将关卡中添加一些\
  \ Gem。\n\n## 创建 Gem 场景\n\n现在我们理解了收集品的作用，让我们使用 Godot 中的专用场景来构建第一个——Gem：\n\n1.  创建一个以\
  \ `Node3D` 节点为根的新场景。\n2.  将其重命名为 `Gem`。3D 中的收集品工作方式与 2D 类似。在 2D 示例中，我们使用 `Area2D`\
  \ 节点配合 `CollisionShape2D` 节点来检测 `CharacterBody2D` 节点进入 `Strawberry` 节点的区域。在 3D 中，我们将同样使用\
  \ `Area3D` 节点配合 `CollisionShape3D` 节点，以便检测 `CharacterBody3D` 节点（玩家）进入 Gem 的区域。\n\
  3.  作为 `Gem` 的子节点添加 `Area3D` 节点。\n4.  然后添加 `MeshInstance3D` 节点，以便拥有 Gem 本身的视觉模型。使用\
  \ `gem.obj` 文件作为 `MeshInstance3D node 属性中的网格。这与在 2D 中为精灵添加纹理非常。记得将 `palette.png`\
  \ 纹理文件拖到场景中的 Gem 网格上给它上色。\n5.  最后，作为 `Area3D` 的子节点添加 `CollisionShape3D` 节点。对于 `Shape`\
  \ 属性，最简单的方法是将 Gem 包含在 `BoxShape3D` 中。所有这些都如图 9.1 所示：\n\n![img](img/B31515_09_1.png)\n\
  \n\n\n\n\n# 图 9.1 – 设置宝石（Gem）场景的组件\n\n如图 9.1 所示，宝石可以检测到物体何时进入其区域。然而，我们需要编写程序使其按照我们预期的方式做出反应。为了这一点，我们将为宝石添加一个脚本。\n\
  \n## 为宝石添加脚本\n\n你应该问问自己，当玩家收集宝石时，你想要宝石执行什么操作。在我们的 2D 游戏中，我们要求玩家收集所有的草莓来完成关卡。在这个游戏中，宝石将临时增加玩家的跳跃高度，使其能够到达最高的平台，那里是检查点旗帜所在的地方。\n\
  \n确定了宝石后，让我们将其设置为一个可以提升玩家跳跃高度的临时强化道具：\n\n1. 首先为 `Gem` 节点挂载一个新脚本。\n2. 选择 `Area3D`\
  \ 节点，并如图 9.2 所示连接 `body_entered` 信号：\n![img](img/B31515_09_2.png)\n\n图 9.2 – 连接\
  \ `Area3D` 节点的 `body_entered` 信号\n\n3. 我们想检查进入宝石区域的物体是否是玩家。为了做到这一点，我们首先需要创建一个名为\
  \ `player` 的组并将玩家加入其中。\n4. 返回到 `Player` 场景。在 `Inspector`（检查器）中，点击 `Node`（节点），然后点击\
  \ `Groups`（组）。点击 `+` 并添加名为 `player` 的组。将其设置为 `Global`（全局）组。如图 9.3 所示：\n![img](img/B31515_09_3.png)\n\
  \n图 9.3 – 创建 `player` 组\n\n5. 一旦创建了全局 `player` 组，如图 9.3 所示，你会发现 `Player` 场景现在是该组的一部分，因为\
  \ `player` 组的复选框已被勾选。\n6. 因为我们只想临时增加玩家的跳跃高度，我们需要为玩家添加一个计时器作为冷却机制。在 `Player` 场景中，添加一个\
  \ `Timer` 节点作为子节点。将其重命名为 `Jump_cooldown_timer`，如图 9.4 所示：\n![img](img/B31515_09_4.png)\n\
  \n图 9.4 – 为玩家添加计时器以使跳跃强度消失\n\n7. 当玩家收集宝石时，我们将启动计时器。如果计时器正在运行，玩家就可以跳得更高，但一旦计时器超时，我们将跳跃强度恢复到初始值。在\
  \ `Inspector` 中，将计时器设置为 `One Shot`（单次触发）并将 `Wait Time` 设置为 `3` 秒，如图 9.5 所示：\n![img](img/B31515_09_5.png)\n\
  \n图 9.5 – 设置跳跃强化持续持续 3 秒\n\n8. 如图 9.5 所示，`Wait Time` 代表增强跳跃的持续时间。如果你想让跳跃强化持续更久一点，只需增加此值即可。\n\
  9. 接下来，连接 `Timer` 的 `timeout()` 信号，如图 9.6 所示：\n![img](img/B31515_09_6.png)\n\n图\
  \ 9.6 – 为计时器连接超时信号\n\n10. 一旦将计时器的 `timeout()` 信号连接到 `Gem` 脚本（如图 9.6 所示），添加以下代码：\n\
  在第 23 行添加一个名为 `default_jump_strength` 的新变量并将其值设置为 `7`：\n```python\nvar default_jump_strength\
  \ = 7\n```\n现在，所示编写 `timeout` 函数：\n```python\nfunc _on_jump_cooldown_timer_timeout():\n\
  \    jump_strength = default_jump_strength\n```\n这段代码将在计时器结束后将跳跃强度重置为默认值。\n\n11.\
  \ 在离开 `Player` 脚本之前，我们应该为计时器添加一个引用变量，以便我们从 `Gem` 场景启动它。在 `MeshInstance3D` 的 `onready`\
  \ 变量下方添加一个计时器的变量，所示：\n```python\n@onready var model = $MeshInstance3D\n@onready\
  \ var jump_cooldown_timer = $Jump_cooldown_timer\n```\n12. 在 `Player` 脚本中，为强化道具添加一个变量：\n\
  ```python\nvar powerup_jump_strength = 10\n```\n现在添加一个函数，在收集宝石时增加跳跃强度并启动计时器：\n```python\n\
  func on_gem_collected():\n    jump_cooldown_timer.start()\n    jump_strength = powerup_jump_strength\n\
  ```\n13. `Player` 场景现在是 `player` 组的一部分。它还设置了一个计时器来计算增加的跳跃强持续时间，并且我们提供了对计时器的访问权限。现在返回\
  \ `Gem` 场景完成 `body_entered()` 函数：\n```python\nfunc _on_area_3d_body_entered(body):\n\
  \    if body.is_in_group(\"player\"):\n        body.on_gem_collected()\n       \
  \ queue_free()\n```\n当 `body` 进入宝石区域时，将触发此代码。如果该 `body` 是 `player` 组的一部分，则 `body`（玩家）将\
  \ `jump_strength` 增加到 `10`。宝石的冷却计时器将开始运行直到超时，`queue_free()` 确保宝石从场景中移除。\n14. 将 `Gem`\
  \ 场景实例化到 `Level` 场景中（在 `Level` 场景中按下 `Ctrl` + `Shift` + `A`，然后选择 `Gem` 场景），测试玩家在收集宝石后现在到达最高平台。你现在可以在关卡策略地放置宝石。\n\
  \n## 引入障碍\n\n障碍通过创建玩家必须绕过或克服的危险来为关卡引入挑战和刺激性。它们鼓励玩家制定策略、提高技能并在游戏过程中保持专注。障碍可以有许多形式，例如移动平台、尖刺或环境陷阱，并为游戏体验增加多样性。在本节中，我们将为关卡添加一些障碍来测试玩家的敏捷性和时机，创造更有动态的体验。\n\
  \n## 创建大炮场景\n\n添加到关卡的一种有趣的动态障碍是定期发射子弹的大炮，玩家在到达检查点之前必须避免它。大炮是静态的，仅作为装饰或布置。然而，子弹将从大炮移动整个关卡。按照以下步骤设置\
  \ `Cannon` 场景：\n\n1. 以 `Node3D` 节点为根创建一个新场景。将其重命名为 `Cannon`。\n2. 添加 `StaticBody3D`\
  \ 节点作为子节点。\n3. 添加 `MeshInstance3D` 节点并将 `cannon.obj` 用于 `Mesh` 属性。\n4. 记得拖入 `palette.png`\
  \ 来纹化大炮对象。\n5. 添加 `CollisionShape3D` 节点并使用 `New BoxShape3D` 属性封装大炮。\n6. 添加 `Timer`\
  \ 节点并将其重命名为 `Cannonball_timer`。\n7. 添加 `Marker3D` 节点并放置在大炮的口处：**x** 位置 `0.0`，**y**\
  \ 位置 `0.5`，**z** 位置 `–1.0`。\n\n遵循这些步骤，`Cannon` 场景树应该如图 9.7 所示：\n![img](img/B31515_09_7.png)\n\
  \n图 9.7 – 大炮场景的场景树\n\n\n\n\n*图 9.7* 中的组件将用于让大加发挥功能。它是一个静态物体，因为它不会移动，但玩家可以跳到上面并站在上面。炮弹计时器会定期生成炮弹，这些炮弹会穿过整个关卡。标记点（marker）用于确定炮弹出现的位置。\n\
  \n我们希望大加每三秒发射一次球。为了实现这一点，请调整 `Cannonball_timer` 节点的设置，如*图 9.8* 所示：\n\n![img](img/B31515_09_8.png)\
  \ \n\n图 9.8 – 炮弹计时器设置\n\n使用*图 9.8* 所示的设置，大加将每三秒自动发射一次球。如果你想更改发射频率，请调整 `Wait Time`。\n\
  \n大加现在准备好编写脚本了；但是，我们还需要一个球或子弹来发射。我们现在将准备 `Ball` 场景，以便有一个从大加发射的射物体。\n\n## 创建 Ball\
  \ 场景\n\n创建一个新场景并使用 `CharacterBody3D` 节点作为根节点。将其重命名为 `Ball`。\n\n需要注意的是，我们通常会使用 `Area3D`\
  \ 节点作为射物体，因为这允许我们检测碰撞并触发事件，例如造成伤害或在碰撞时销射物体。然而，在我们的游戏中，炮弹仅充当物理障碍——它不会伤害玩家，但在与玩家接触时，只会简单地推开他们。\n\
  \n按照以下步骤完成 `Ball` 场景：\n\n1. 你已经创建了一个以 `CharacterBody3D` 节点作为根节点的新场景。\n2. 你已将根节点重命名为\
  \ `Ball`。\n3. 添加一个 `MeshInstance3D` 节点作为子节点，并使用 `Bullet.obj` 作为 `Mesh` 属性。\n4. 应用\
  \ `palette.png` 作为子弹对象的纹理。\n5. 添加一个 `CollisionShape3D` 节点，并使用新的 `CapsuleShape3D`\
  \ 包围子弹。\n6. 在 `x` 轴上旋转 `CapsuleShape3D` 并调整其大小以完美贴合模型。\n7. 添加一个 `Timer` 节点并将其重命名为\
  \ `Destroy_timer`。\n\n遵循这些步骤，`Ball` 场景树应该看起来像*图 9.9*：\n\n![img](img/B31515_09_9.png)\
  \ \n\n图 9.9 – Ball 场景的组件\n\n*图 9.9* 中看到的一个重要组件是用于球的 `Destroy_timer` 节点。它代表了球的寿命。一旦它超时，我们就会销毁球并将场景从关卡中移除。调整计时器的设置以匹配*图\
  \ 9.10* 所示的内容：\n\n![img](img/B31515_09_10.png) \n\n图 9.10 – 销毁球的计时器设置\n\n*图 9.10*\
  \ 将球的寿命设置为 `5` 秒；计时器自动启动，但每个球只运行一次。球需要穿过关卡并被销毁。为了做到这一点，我们将编写一个脚本。\n\n## 编写 Ball\
  \ 脚本\n\n没有炮弹的大加没什么用处——所以让我们用一个处理它们移动和碰撞的脚本让它们活起来吧。遵循以下步骤：\n\n1. 为 `Ball` 节点挂载脚本。设置一个\
  \ `speed` 变量并赋值为 `3`。这是一个导出变量（export variable），你可以在测试游戏时更改此值，以便找到最适合你游戏的值：\n\n```\n\
  @export var speed = 3\n```\n\n2. 在 `process` 函数中，我们将沿着 `z` 轴移动球。这是深度轴，代表球向向我们移动或远离我们进入或离开屏幕。为了让球平滑地移动，我们将通过将\
  \ `speed` 乘以 `delta` 来改变位置，如下：\n\n```\nfunc _process(delta):\n    position.z -=\
  \ speed * delta\n```\n\n3. 连接 `Destroy_timer` 的 `timeout()` 信号，并在其中代码让球在达到计时器的等待时间后被销毁：\n\
  \n```python\nfunc _on_destroy_timer_timeout():\n    queue_free()\n```\n\n有了这个脚本，炮弹就可以完成我们希望它的两个任务：它可以穿过关卡，并在一定时间后被销毁。现在为大加编写脚本以生成炮弹。\n\
  \n## 编写 Cannon 脚本\n\n要编写 `Cannon` 脚本，首先我们将为 `Cannon` 节点挂载脚本。在整本书中，我一直使用 `@onready\
  \ var` 处理在场景首次创建时应该初始化的变量。这次，我将向你展示这种快捷方式的替代方案，即使用 `_ready` 函数来初始化变量。让我们在这里：\n\n\
  1. 我们将实例化 `Ball` 场景（生成球），因此我们需要一个 `scene` 变量来存储对 `Ball` 场景的引用。我们还需要一个代表球本身的变量（`ball`\
  \ 变量），它将是场景的实例。我们还需要一个引用变量（`marker` 变量）指向 `Marker3D` 节点，以便我们可以将球定位在不可见标记出现：\n\n\
  ```\nvar ball_scene\nvar ball_instance\nvar marker\n```\n\n2. 上述代码中的任何变量都没有经过初始化，也就是说它们没有初始值。我们将在\
  \ `_ready()` 函数中为它们赋值：\n\n```python\n## 当节点被添加到场景时调用\nfunc _ready():\n    # 预加载\
  \ Ball 场景以便我们可以创建一个实例\n    ball_scene = preload(\"res://Scenes/ball.tscn\")\n  \
  \  # 预加载烟雾粒子场景用于视觉效果\n    particles = preload(\"res://Scenes/smoke.tscn\")\n   \
  \ # 从预加载的场景创建 Ball 实例\n    ball_instance = ball_scene.instantiate()\n    # 获取场景中的\
  \ Marker3D 节点\n    marker = $Marker3D\n    # 将 位置设置为 Marker3D 的位置\n    ball_instance.position\
  \ = marker.position\n    # 将实例作为子添加到当前场景\n    add_child(ball_instance)\n```\n\n\
  `ready` 函数在大加被添加到场景时调用*一次*，用于设置状态。让我们逐行解释这里的代码：\n\n* 炮弹场景从指定路径加载并存储在 `scene` 变量中。`preload`\
  \ 关键字确保场景在游戏运行时已就绪，并且相比 `load` 函数提供了性能提升。\n* `Ball` 场景的实例（原始场景的副本）存储在 `ball` 变量中。\n\
  * **Marker3D** 节点的引用存储在 `marker` 变量中。\n* 将新创建的炮弹的位置设置为与 `marker` 相同。\n* 最后，将 `ball`\
  \ 实例添加到节点层级中，使其在场景中可见并活跃。\n\n1. 为了让大加定期发射炮弹，我们需要使用 `Cannonball_timer`。连接 `timeout()`\
  \ 信号并添加以下代码：\n\n```python\nfunc _on_cannonball_timer_timeout():\n    ball = scene.instantiate()\n\
  \    ball.position = marker.position\n    add_child(ball)\n```\n\n由于我们把 **Wait Time**\
  \ 设置为 3 秒，`timeout()` 函数中的代码每 3 秒运行一次。新的炮弹实例将在 `marker` 的位置创建并添加到 **Cannon** 场景的层级中。\n\
  \n1. 在 **Level** 场景中实例化 **Cannon** 场景并测试一切是否符合预期。\n\n# 完成我们的关卡\n\n要完成关卡，玩家必须到达*旗帜*。旗帜位于最高的平台上，到达它的唯一方法是通过宝石增强玩家的跳跃，避开炮弹并冲向旗帜。\n\
  \n\n\n\n这些都是设计决策，关卡中的资源允许我们考虑不同的方案。我们本可以要求玩家获取钥匙来打开大门以到达旗帜。这就是为什么游戏开发如此有成就感！现在我们应该为旗帜创建一个场景。\n\
  \n## 创建旗帜场景\n\n在创建 `Flag` 场景之前，先决定旗帜的作用将会有帮助，因为这将帮助我们确定使用哪些节点。在我们简单的案例中，旗帜只需要在玩家触碰它时退出游戏。当然，如果我们制作更多的关卡，也可以轻松地切换关卡。知道这一点，`Area3D`\
  \ 节点是旗帜的最佳选择。按照以下步骤进行设置：\n\n1. 使用 `Area3D` 作为根节点创建一个场景。\n2. 将其重命名为 `Flag`。\n3. 添加一个\
  \ `MeshInstance3D` 节点并使用 `flag.obj` 作为 `Mesh` 属性。\n4. 应用 `palette.png` 为旗帜赋予纹理。\n\
  5. 添加 `CollisionShape3D` 节点作为旗帜的子节点。\n6. 使用 `New BoxShape3D` 包裹旗帜。\n\n按照这些步骤完成后，你的\
  \ `Flag` 场景层级结构将如*图 9.11*所示：\n\n![img](img/B31515_09_11.png)\n\n图 9.11 – 旗帜场景层级\n\
  \n1. 再次，我们利用 `Area3D` 节点的多功能性来检测 `CharacterBody` 节点（例如玩家）进入其空间。为 `Flag` 节点添加脚本并将其保存为\
  \ `flag.gd`。\n2. 现在连接 `Flag` 节点的 `_on_body_entered` 信号并编写代码：\n\n```python\nextends\
  \ Area3D\nfunc _on_body_entered(body):\n    if body.is_in_group(\"player\"):\n \
  \       get_tree().quit()\n```\n\n这段简单的代码测试了进入旗帜空间的物体是否在 `player` 组中。如果是，我们就退出游戏。\n\
  \n## 切换场景\n\n创建多个关卡超出了本书的范围；但是，如果你创建了另一个关卡，并想在玩家到达旗帜时切换过去，那是非常简单的。\n\n首先，你需要创建第二个关卡并将其保存为场景，例如\
  \ `level_2.tscn`。将场景文件的路径存储在变量中，然后使用内置函数 `get_tree().change_scene_to_file()` 切换到下一个场景。如下处的代码所示：\n\
  \n```python\nextends Area3D\nfunc _on_body_entered(body):\n    if body.is_in_group(\"\
  player\"):\n        var next_scene_file = \"res://scenes/level_2.tscn\"\n      \
  \  get_tree().change_scene_to_file(next_scene_file)\n```\n\n这段代码检查玩家是否进入了特定区域。如果是，它将加载游戏的下一关。它使用组来确保只有玩家会触发动作。它使用场景路径来确定加载哪个关卡。这里是逐行解释：\n\
  \n* 当 `body` 进入 `flag` 区域时\n* 代码检查该 `body` 是否在 `\"player\"` 组中\n* 将指向 `level 2`\
  \ 场景文件的路径存储在名为 `next_scene` 的变量中\n* 使用 `change_scene_to_file` 方法切换到保存的场景\n\n现在玩家有了可以收集的强化道具、需要避开的障碍物和一个需要到达的目标，关卡已经具有基本的可玩性。现在让我们开始通过粒子、移动和颜色等元素为关卡添加润色。\n\
  \n# 完善我们的关卡\n\n创建一个功能性关卡是游戏开发的重要第一步，但要让它在视觉上吸引并吸引玩家需要投入额外的精力——这就是关卡润色的用武之地。\n\n\
  润色关卡意味着通过动态视觉、平滑动画和生动效果等元素来增强其外观和感受。这些添加不仅让你的游戏更具沉浸感，还有助于传达情绪、增加个性并让游戏玩法更加趣味。\n\n\
  在本节中，我们将探索如何添加移动、颜色和粒子效果为你的关卡注入生命，将其从基础设计转变为玩家喜欢的体验。\n\nGodot 提供了一个名为 `WorldEnvironment`\
  \ 的节点，用于设置整个场景的默认环境属性，包括后处理效果、光照背景设置。\n\n在 `Level 1` 场景中，添加一个 `WorldEnvironment`\
  \ 节点。在 `Inspector`（检查器）中，找到 `Environment` 属性并选择 `New Environment`。如*图 9.12*所示：\n\
  \n![img](img/B31515_09_12.png)\n\n图 9.12 – 为世界添加新环境\n\n一旦我们加载了新环境，如*图 9.12*所示，我们现在就可以访问更多的属性和设置。\n\
  \n## 设置背景颜色\n\n通过点击 `Environment`，选择 `Background`（背景），然后选择 `Custom Color`（自定义颜色）并找到蓝色，将关卡的背景颜色改为天蓝色。如*图\
  \ 9.13*所示：\n\n![img](img/B31515_09_13.png)\n\n图 9.13 – 设置背景颜色\n\n现在我们已经添加了背景颜色，如*图\
  \ 9.13*所示，我们应该添加一些效果。\n\n## 添加粒子效果\n\n粒子效果是游戏开发中模拟火、雨或爆炸等强大工具。通过引入粒子效果，可以让你的游戏感觉更有动态。在本节中，我们将探索如何创建烟雾。\n\
  \n按照以下步骤创建烟雾场景：\n\n1. 使用 `CParticles3D` 作为根节点创建一个新场景。\n2. 将其重命名为 `Smoke`。\n3. 展开\
  \ **Drawing**（绘制）部分并找到 **Mesh** 属性。\n4. 将 `cloud_1.obj` 文件拖入 **Mesh** 属性。如*图 9.14*所示：\n\
  \n![img](img/B31515_09_14.png)\n\n图 9.14 – 使用云的一个作为 Mesh\n\n5. 记得通过应用 `palette.png`\
  \ 纹理为网格上色。\n6. 展开 **Gravity**（重力）部分并将 `y` 值设置为正数。这样做后，烟雾就会上升。\n7. 将 `Amount` 属性减少为\
  \ `1`，这样大炮就会冒出一缕烟。\n8. 将 `One Shot`（单次播放）属性设置为 `On`。如*图 9.15*所示：\n\n![img](img/B31515_09_15.png)\n\
  \n图 9.15 – 修改数量并设置 One Shot\n\n9. 通过展开 `Node3D` 的 **Transform**（变换）部分并将 `z` 轴旋转\
  \ `90` 度，让云变为垂直。如*图 9.16*所示：\n\n![img](img/B31515_09_16.png)\n\n图 9.16 –  z 轴旋转模型使其垂直\n\
  \n10. 随时间调整云的缩放，从 `0` 到完整尺寸（`1`）。这样做是通过展开 **Scale**（缩放）部分并将 `Scale Amount Minimum`\
  \ 设置为 `0`，`Scale Amount Maximum` 设置为 `1`。\n11. 通过点击 **New Curve**（新建曲线）创建一个 `Scale\
  \ Amount` 曲线并随时间调整缩放，如*图 9.17*所示：\n\n![img](img/B31515_09_17.png)\n\n图 9.17 – 设置最小、最大和缩放曲线\n\
  \n这设置了从 0 到 1 的缩放；但我建议尝试曲线值，直到找到满意的结果。\n\n`Smoke` 场景已经完成，准备好在 `Cannon` 脚本中实例化。当我们在\
  \ `Cannon` 脚本内部实例化炮弹时，我们应该之后实例化烟雾。现在，返回 `Cannon` 脚本。\n\n1. 添加两个新的全局变量，分别名为 `particles`（引用粒子场景文件）和\
  \ `smoke`（场景的实例）：\n\n\n\n\n\n```\nextends Node3D\nvar ball_scene\nvar ball_instance\n\
  var marker\nvar particles\nvar smoke\n```\n\n2. 调整 `_ready` 函数，以便我们也能预加载烟雾粒子场景。新行已在下面的代码中注释。创建一个烟雾的实例，将其放置在\
  \ `marker` 处，使其成为 `Cannon` 场景的子节点，并将 `emitting` 属性设置为 `true`：\n\n    ```\nfunc _ready():\n\
  \    scene = preload(\"res://scenes/ball.tscn\")\n    particles = preload(\"res://scenes/smoke.tscn\"\
  )\n    ball = scene.instantiate()\n\n    # 创建一个烟雾粒子实例\n    smoke = particles.instantiate()\n\
  \n    marker = $Marker3D\n    ball.position = marker.position\n\n    # 将烟雾效果也放置在\
  \ Marker3D 位置\n    smoke.position = marker.position\n\n    add_child(ball)\n\n \
  \   # 将烟雾效果作为子节点添加到当前场景\n    add_child(smoke)\n\n    # 烟雾粒子效果使其立即发射\n    smoke.emitting\
  \ = true\n```\n\n3. 最后，我们必须在 `timeout` 函数中创建新实例，这样每次大炮发射时都会出现一团烟雾：\n\n    ```\n\
  func _on_cannonball_timer_timeout():\n    ball_instance = ball_scene.instantiate()\n\
  \    smoke = particles.instantiate()\n    smoke.position = marker.position\n   \
  \ Ball_instance.position = marker.position\n    add_child(ball_instance)\n    add_child(smoke)\n\
  \    smoke.emitting = true\n```\n\n对大炮脚本进行这些调整后，你可以再次测试关卡了。你会发现现在每当发射大炮弹时，会有两朵小烟云留在空中。这是为关卡增加动态感的简单方法。\n\
  \n另一种让关卡更有吸引力的方法是添加音频，例如特效和背景音乐。在下一节中，我们将学习如何处理音频。\n\n## 为我们的关卡添加音频\n\n如果玩家角色在跳跃时发出声音，会很有趣。让我们添加一些音频吧！\n\
  \n1. 为了做到，我们需要自己录制声音，或者找到一个具有 Creative Commons 许可的公共领域音频。这里有一个我们可以用于此项目的音频：[`opengameart.org/content/jump-sound-16bit`](https://opengameart.org/content/jump-sound-16bit)\
  \ 。\n\n2. 下载 `jump.wav` 文件。在 `FileSystem` 中，进入 `assets` 文件夹，并创建一个名为 `audio` 的子文件夹。将声音文件放入其中，如图\
  \ 9.18 所示：\n\n![img](img/B31515_09_18.png) \n\n图 9.18 – 将 `jump.wav` 文件添加到我们的音频文件夹\n\
  \n1. 打开 `Player` 场景并添加一个 `AudioStreamPlayer` 节点作为子节点。在 `Stream` 属性中，拖入音频文件。保持其他属性不变。这如图\
  \ 9.19 所示：\n\n![img](img/B31515_09_19.png) \n\n图 9.19 – 给 AudioStreamPlayer 指定一个要播放的音频文件\n\
  \n1. 打开 `Player` 脚本，并在你的 `onready` 变量列表中添加一个 `AudioStreamPlayer` 的引用变量：\n\n    ```\n\
  @onready var model = $MeshInstance3D\n@onready var jump_cooldown_timer = $Jump_cooldown_timer\n\
  @onready var audio_stream_player = $AudioStreamPlayer\n```\n\n2. 我们只想在玩家跳跃时播放跳跃音效。为了实现这一点，我们告诉\
  \ `AudioStreamPlayer` 在运行 `jump` 函数时播放文件。将该请求作为 `jump` 函数的第一行：\n\n    ```\nfunc\
  \ jump():\n    audio_stream_player.play()\n```\n\n3. 玩家跳跃时播放音效所需的只需要这些操作了。\n\n但如果我们想在玩家落地时播放一个效果呢？\n\
  \n1. 从 `Open Game Art` 获取另一个带有 CC0 许可的音效（[`opengameart.org/content/jump-landing-sound`](https://opengameart.org/content/jump-landing-sound)\
  \ ）并将其添加到音频文件夹。\n\n2. 为了在正确的时间播放正确的声音，必须调整代码，在尝试播放之前先将相应的音频文件加载到 `AudioStreamPlayer`\
  \ 中。\n\n3. 在 `jump` 函数的第一行再添加另一行，在播放之前先加载文件：\n\n    ```\nfunc jump():\n    audio_stream_player.stream\
  \ =\n    preload(\"res://assets/audio/jump.wav\")\n    audio_stream_player.play()\n\
  ```\n\n4. 同样，当玩家落地时，我们必须加载相应的音频文件然后播放它。在 `handle_respawn()` 函数中，当玩家落地缩放后添加这些行：\n\
  \n    ```\nif is_on_floor() and gravity > 2 and !previously_floored:\n    model.scale\
  \ = Vector3(1.25, 0.75, 1.25)\n    audio_stream_player.stream =\n    preload(\"\
  res://assets/audio/jum.wav\")\n```\n\n## 使用正弦函数\n\n如所述，我们不会让云朵静止，而是使用正弦波让它们来回漂浮。返回\
  \ `Cloud` 场景并为 `Cloud` 附加脚本。\n\n这里提供了让云朵漂动的完整代码，并逐行进行了解释：\n\n```\nextends Node3D\n\
  @onready var mesh_instance_3d: MeshInstance3D = $MeshInstance3D\nvar time: float\n\
  func _process(delta):\n    time += delta\n    mesh_instance_3d.position = vector3(get_sine(),get_sine(),get_sine())\n\
  func get_sine():\n    return sin(time * 0.5) * 0.5\n```\n\n为了更好地理解，我们来分解这段代码：\n\n\
  *   声明了一个名为 `time` 的浮点型（float）变量来跟踪已时间。它被用于计算运动的正弦波。\n*   为云朵的 `MeshInstance3D`\
  \ 节点创建了一个引用，因为这本质上就是我们要移动的云对象。\n*   在 `process` 函数中，我们每帧都增加 `time` 变量。这确保了正弦波动画随时间平滑进行。\n\
  *   接下来，在每一帧中更新云朵（`MeshInstance3D`）的 `position` 属性。\n*   *x*、*y* 和 *z* 坐标使用 `get_sine()`\
  \ 函数设置，该函数产生一个平滑的振荡值。\n*   `get_sine()` 函数根据 `time` 变量计算平滑的振荡。\n*   `time * 0.5`\
  \ 是波的**频率**，这会减慢振荡速度。\n*   在括号外乘以结果 `0.5` 是波的**振幅**。在这里我们减少了它，使运动不那么剧烈。\n\n\n\n\n\
  \n*   返回整个结果，用于更新 `transform` 属性中的 `position`。\n\n从本质上说，这段脚本为云创建了平滑的震荡运动。正弦波让运动看起来更加自然。\n\
  \n# 总结\n\n在本章中，你通过添加关键游戏元素和优化整体呈现，将关卡转换成了一种动态且引人入胜的体验。你创建了一个可收集的强化道具，可以临时提升玩家的跳跃高度，让他们能够到达更高的平台并完成关卡。我们引入了一个大炮障碍，这为游戏增加了一层挑战，因为玩家必须避开它的炮弹。\n\
  \n为了完成关卡，你实现了一个旗帜机制，为玩家提供了一个清晰且满意的目标。最后，你通过添加用于反馈的音效、营造氛围的背景音乐以及增加视觉吸引力的移动云朵来完善关卡。\n\
  \n在本章结束时，你不仅开发了趣味且互动性关卡的核心机制，还增强了它的表现，使其对玩家来说更有沉浸感和乐趣。这些技能将为未来创建更复杂、更精细的关卡奠定坚实的基础。\n\
