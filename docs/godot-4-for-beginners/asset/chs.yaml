  \ 并在界面操作方面具有一定经验的 Godot 开发者来说，这是一份极具价值的资源。\n\n# 总结\n\n你已经读完了*初学者入门 Godot 4*，但你作为游戏开发者的旅程才刚刚开始。在最后一章中，你探索了继续提升技能的可以采取的后续步骤，从教育资源、社区到资产市场和游戏马拉松（Game\
