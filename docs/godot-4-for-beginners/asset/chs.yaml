  \n图 2.10 – 返回了 GreetingsLabel 节点的 Main 场景\n\n我们现在可以将多个 `greetings_label` 场景的实例拖入\
  \ `Main` 场景，并在 `Inspector`（检查器）的 `Text` 属性中更改每个实例的文本属性。然而，当我们运行 `Main` 场景时，每个标签都会恢复为\
  \ `Go Go Godot!`。这是因为每个实例都附加了相同的脚本，而我们之前将文本属性更改为读取 `Go Go Godot!`。\n\n![img](img/B31515_02_11.png)\n\
  \n图 2.11 – Main 场景中的多个 greetings_label 实例\n\n### 什么是实例？\n\n`Instancing`（实例化）是从蓝图或主设计中生成游戏对象的过程。实例化与场景配合得很好。它让你能够将游戏拆分为可重用的组件，提供了一个结构化复杂系统的工具，并提供用自然方式思考游戏结构的语言。\n\
  \n我们可以通过允许游戏对用户的输入做出反应来演示实例化。\n\n# 响应玩家输入\n\n现在，我们可以做一个实验，根据从用户处输入的输入显示不同的标签。在这种情况下，我们将添加一个精灵（sprite）并将标签放置在它的头部上方。`sprite`\
  \ 是游戏中的 2D 图像或动画，用于表示角色、物体或其他视觉元素。简单来说，就是你在游戏中看到的、会移动或与环境交互的图片或图形。\n\n如果玩家左键点击精灵（`sprite`），我们将显示\
  \ `Hello Folks!`。如果他们右键点击精灵（`sprite`），我们将显示 `Godot is Great! `，而如果他们按下键盘上的 `Enter`\
  \ / `Return` 键，我们将会显示 `Hello World!`。\n\n首先，我们需要一个精灵。获取免费游戏资源的好地方是 `Kenney`。你可以在这里找到网站：[`kenney.nl/`](https://kenney.nl/)。我在此实验中使用的资源可以在这里找到：[`kenney.nl/assets/toon-characters-1`](https://kenney.nl/assets/toon-characters-1)。\n\
  \n当你提取此处文件夹后，可以找到我选择的精灵：`\\kenney_toon-characters-1\\Robot\\PNG\\Poses HD \\character_robot_interact`。\n\
  \n这是我们的精灵的样子：\n\n![img](img/B31515_02_12.png)\n\n图 2.12 – 我们实验使用的机器人精灵角色\n\n然而，你可以为此实验使用任何你喜欢的角色。现在我们将精灵添加到场景中：\n\
  \n1. 在 `FileSystem` 中创建一个新文件夹并将其命名为 `Sprites`：\n\n![img](img/B31515_02_13.png)\n\
  \n图 2.13 – 创建 Sprites 文件夹\n\n2. 现在将角色拖入 `Sprites` 文件夹：\n\n![img](img/B31515_02_14.png)\
  \ （注：根据文本流，这对应于该步骤）\n\n3. 现在为我们的角色创建一个新场景。点击 `Scene` 菜单并选择 `New Scene`，或者点击 `+`\
  \ 图标：\n\n![img](img/B31515_02_15.png) （注：根据文本流）\n\n4. 现在我们搜索 `Sprite2D` 节点并添加它：\n\
  \n![img](img/B31515_02_16.png)\n\n5. 将节点重命名为 `Player`：\n\n![img](img/B31515_02_17.png)\n\
  \n6. 现在按 `Ctrl + S` 将场景保存为 `player.tscn` 并存放在 `Scenes` 文件夹：\n\n![img](img/B31515_02_18.png)\n\
  \n7. 确保你处于 `2D` 视图。现在将你选择的角色图像拖入 `Player` 节点的 `Texture` 属性：\n\n![img](img/B31515_02_19.png)\n\
  \n8. 你的 `Player` 场景应该是这样的：\n\n![img](img/B31515_02_20.png)\n\n9. 现在我们将为 `Player`\
  \ 附加脚本。右键点击 `Player` 节点并选择 `Attach Script…`（附加脚本），或者点击 `+` 图标：\n\n![img](img/B31515_02_21.png)\n\
  \n10. 按 `Ctrl + S` 保存脚本并将其保存在 `Scripts` 文件夹中。你现在会在 `Scripts` 文件夹中有一个 `player.gd`\
  \ 脚本：\n\n![img](img/B31515_02_22.png)\n\n\n\n我们编写部分代码的目的是让用户根据所按的鼠标按钮，从精灵处接收不同的响应。我们将处理三种类型的交互：\n\
  \n* `左键点击`：显示问候语 `Hi Folks!`\n* `右点击`：显示 `Godot is Great!`\n* `按下 En`：显示 `Hello\
  \ World!`\n\n让我们先确保问候语标签在初始状态是隐藏的。\n\n## 在用户提供输入之前隐藏标签\n\n我们不希望在场景首次运行时就能看到问候语。我们希望通过调用它的\
  \ `hide()` 函数来隐藏标签。\n\n由于 `_ready()` 函数是节点及其所有子节点加载到场景树后第一个运行的函数，我们可以使用 Godot 的快捷运算符\
  \ `$` 来访问 `GreetingsLabel` 节点。\n\n一旦获取了节点，我们只需调用 `hide()` 函数即可：\n\n```python\n##\
  \ 当节点第一次进入场景树时调用。\nfunc _ready() -> void:\n    $GreetingsLabel.hide()\n```\n\n####\
  \ 重要说明\n\n请注意，GDScript 是一种缩进语言。这意味着函数后的第一行（如前面的代码所示）需要缩进一个制表符（tab）。游戏引擎需要这一点来确保代码正常运行。我建议所有阅读电子版书籍的读者手动输入代码，或从书籍的\
  \ GitHub 仓库复制代码文件，以避免因复制粘贴代码导致的错误。\n\n有了这段代码后，当你运行游戏时，`GreetingsLabel` 将可见。你可以通过按下\
  \ `F6` 或点击如图 2.27 所示的“运行当前场景”按钮来测试此场景：\n\n![img](img/B31515_02_27.png) \n\n图 2.27\
  \ – 运行当前场景按钮\n\n你会发现你无法再看到问候语了。\n\n### 输入处理\n\n现在，为了让实验保持简单，我们将使用一个内置方法来处理输入。内置方法简单来说就是已经创建并作为\
  \ Godot 引擎一部分提供的方法。你可以通过方法名开头带有下划线来判断是否是内置的。到目前为止你已经看到了两个：`_ready()` 和 `_process()`。\n\
  \n对于输入，我们将利用 `_unhandled_input()`。现在不需要太担心它，只需知道如果没有其他函数/方法来捕获并处理用户输入，这个方法就会运行。\n\
  \n我们声明了 `_unhandled_input` 函数头，然后在函数内部处理不同类型的输入。在我们的实验中，我们正在监听两种类型的输入：鼠标和键盘。对于键盘，我们只监听一个按键\
  \ – `En`。对于鼠标，我们正在监听 `左点击` 和 `右点击`。让我们详细查看一下：\n\n* 当我们检测到来自鼠标的输入时，我们需要再次显示标签，因此我们调用标签的\
  \ `show()` 函数。\n    * 如果我们听到`左点击`，我们将 `GreetingsLabel` 的文本更改为 `Hi Folks!`。\n   \
  \ * 如果是`右点击`，我们将将其设置为 `Godot is Great!`。\n* 当我们检测到来自键盘的输入时，我们需要再次显示标签，因此我们调用标签的\
  \ `show()` 函数。\n    * 如果听到按了 `En`，我们将文本设置为 `Hello World!`。\n\n现在，让我们来看下代码的实现情况：\n\
  \n```python\nextends Sprite2D\n## 此脚本附加到 Sprite2D 节点上。\n## 它监听鼠标和键盘输入，并根据按下的内容\n\
  ## 在标签上显示不同的消息。\n## 当节点第一次进入场景树时调用（即场景开始时）。\nfunc _ready():\n    # 在开始时隐藏标签，直到发生输入事件时才显示。\n\
  \    $GreetingsLabel.hide()\n## 每帧调用一次。'delta' 是自上一帧以来的秒数。\nfunc _process(delta):\n\
  \    # 在此示例中，我们每帧什么都不做，但保留该函数以防以后需要。\n    pass\n## 当玩家执行了尚未被处理的输入操作时调用。\nfunc _unhandled_input(event):\n\
  \    # 检查事件是否为鼠标点击。\n    if event is InputEventMouseButton:\n        # 只要按下鼠标按钮，就显示标签。\n\
  \        $GreetingsLabel.show()\n        # 检查按了哪个鼠标按钮。\n        if event.button_index\
  \ == MOUSE_BUTTON_LEFT:\n            # 如果点击了左鼠标按钮，将标签文本设置为“Hi Folks!”\n        \
  \    $GreetingsLabel.text = \"Hi Folks!\"\n        elif event.button_index == MOUSE_BUTTON_RIGHT:\n\
  \            # 如果点击了右鼠标按钮，将标签文本设置为“Godot is Great!”\n            $GreetingsLabel.text\
  \ = \"Godot is Great!\"\n    # 检查事件是否为按键按下。\n    elif event is InputEventKey:\n\
  \        # 只有在按下 Enter 键时才显示标签并设置文本。\n        if event.keycode == KEY_ENTER:\n \
  \           $GreetingsLabel.show()\n            $GreetingsLabel.text = \"Hello World!\"\
  \n```\n\n\n\n# 创建 3D 对象\n\n到为止，我们一直集中在 2D 场景和 2D 节点，以及使用 `GDScript` 进行一些脚本编写。重要的是，你并不局限于\
  \ 2D，因为 Godot 是一个极其强大的 3D 游戏引擎。\n\n我们将通过在 `Project Manager`（项目管理器）窗口中点击 `+Create`\
  \ 按钮创建一个 Godot 项目来开始对 3D 的探索。记得为你的项目创建一个文件夹并命名。我将我的项目命名为 `IntroTo3D`，如图 3.1 所示：\n\
  \n![img](img/B31515_03_1.png) \n\n图 3.1 – 创建一个新的 Godot 项目\n\n默认情况下，新的 Godot 项目会在\
  \ 3D 视图中打开——这非常方便！现在我们可以创建第一个 3D 场景了。因为 Godot 使用场景树结构，我们需要为树选择一个根节点。最简单的方法是点击 `3D\
  \ Scene` 按钮：\n\n![img](img/B31515_03_2.png) \n\n图 3.2 – 以 `Node3D` 为根创建一个新的 3D 场景\n\
  \n你的 Godot 界面现在应该看起来像图 3.3*。请注意，我们现在多了一个维度——**Z**，代表深度，并且我们使用 `Node3D` 作为场景树的根。\n\
  \n![img](img/B31515_03_3.png) \n\n图 3.3 – 我们的第一个 3D 场景概览\n\n![img](img/1_G.png)\
