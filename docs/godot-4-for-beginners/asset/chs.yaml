  \ `Settings`（设置）按钮：\n\n![img](img/B31515_01_008.png) \n\n图 1.11 – 项目管理器设置按钮\n\n\
  2. 现在，将 `Interface Theme`（界面主题）下拉菜单改为 `Light`（浅色）：\n\n![img](img/B31515_01_009.png)\
  \ \n\n图 1.12 – 在快速设置菜单中切换到浅色主题\n\n现在，让我们走一遍在 Godot 4 中设置新项目的步骤：\n\n1. 点击左上角的 `+\
  \ Create`（创建）按钮创建一个新项目：\n\n![img](img/B31515_01_010.png) \n\n图 1.13 – 如何在 Godot\
  \ 项目管理器中创建新项目\n\n2. 我们现在看到一个新窗口，可以在其中调整项目的细节：\n\n![img](img/B31515_01_011.png) \n\
  \n图 1.14 – 创建新项目子菜单\n\n3. 下一步是给我们的项目命名。我们把它命名为 `GodotIntro`。\n\n同时，确保 `Project Path`（项目路径）指向我们之前创建的\
  \ `Godot 4 Projects` 文件夹，并且开启了 `Create Folder`（创建文件夹）按钮：\n\n![img](img/B31515_01_012.png)\
  \ \n\n图 1.15 – 我们新 Godot 项目的初始设置\n\n4. 这将在 `Godot 4 Projects` 内部创建一个名为 `GodotIntro`\
  \ 的新文件夹。为 Godot 中的每个新项目创建一个新文件夹将有助于我们保持一切整洁。\n\n你可以将 `Renderer`（渲染器）留在 `Compatibility`（兼容）模式。这里解释了每个渲染器选项：\n\
  \n* `Forward+` 是一种旨在改进桌面平台光照渲染的渲染器。这不推荐移动开发，因为它的效率不高。\n* `Mobile` 为移动平台使用了更高效的光照方法，但也可以在桌面上运行。然而，此渲染器不提供高级图形特性。\n\
  * `Compatibility` 具有比 `Mobile` 更少的高级图形特性，但它可以在大多数硬件上运行。\n\n5. 点击 `Create & Edit`（创建并编辑），你将看到以下窗口：\n\
  \n![img](img/B31515_01_013.png) \n\n图 1.16 – Godot 引擎编辑器主界面\n\n6. 默认情况下，Godot 以\
  \ 3D 视图打开。我们可以使用顶部的视图菜单更改它；但是，一旦我们添加第一个节点，Godot 将自动更改视图。\n\n![img](img/B31515_01_014.png)\
  \ \n\n图 1.17 – 切换视图的上下文菜单\n\n从这里开始，我们将创建第一个小项目，并在下一章中详细查看界面：\n\n1. 点击屏幕左上角的 `2D\
  \ Scene`（2D 场景）：\n\n![img](img/B31515_01_015.png) \n\n图 1.18 – 场景窗口\n\n2. 点击此按钮创建\
  \ `Node2D` 作为场景的根节点。你可以在左侧的 `Scene`（场景）窗口看到它。我们可以通过选中它并按 `F2` 来重命名它。将其命名为 `Main`，因为目前它是我们的主节点：\n\
  \n![img](img/B31515_01_016.png) \n\n图 1.19 – 将 Node2D 重命名为 Main\n\n3. 从一开始养成组织良好的习惯是非常重要的。在编辑器左下角的\
  \ `FileSystem`（文件系统）窗口中创建一个新文件夹并命名为 `Scenes`。通过在 `FileSystem` 窗口的任何地方点击右键并选择 `New\
  \ Folder…`（新建文件夹……）来实现：\n\n![img](img/B31515_01_017.png) \n\n图 1.20 – 在 FileSystem\
  \ 窗口中创建文件夹\n\n4. 现在，按 `Ctrl` + `S` 并选择刚刚创建的 `Scenes` 文件夹，将场景保存为 `main.tscn`：\n\n\
  ![img](img/B31515_01_018.png) \n\n图 1.21 – 在 Scenes 文件夹中保存主场景\n\n5. 添加一个 `Label`\
  \ 节点作为 `Main`（我们之前创建的 `Node2D`）的子节点：\n\n![img](img/B31515_01_015.png)\n\n\n\n\n\
  ![白色背景上的二维码，AI 生成的内容可能不准确。](img/B31515_Unlock_Benefits_QR.png)\n\n最后，我们可以通过让标签在屏幕上跳动（就像著名的\
  \ DVD 屏幕保护一样），让场景变得动态！\n\n## 让场景动态化\n\n要做到这一点，我们需要将问题分解为更小的部分：\n\n1. 给标签一个初始速度（速度和方向）。\n\
  2. 找到屏幕的尺寸。\n3. 找到标签的大小。\n4. 测试标签是否到达左边缘或右边缘，并反转方向。\n5. 测试标签是否到达顶部或底部边缘，并反转方向。\n\
  6. 重复地更新标签的位置，使其移动起来。\n\n`velocity` 变量同时控制运动的速度和方向。因为它是一个 `Vector2`，我们可以在一个容器中同时传递\
  \ `x` 和 `y` 值。\n\n在这个示例中，我们将初始速度设置为沿 `x` 轴方向每秒 `150` 像素（向右，因为是正数），以及沿 `y` 轴方向每秒\
  \ `120` 像素（向下，因为 Godot 的坐标系从左上角开始）。\n\n从程序的第二行开始添加这些行：\n\n```\nvar xVelocity = 150\
  \ # 每秒向右 150 像素\nvar yVelocity = 120 # 每秒向下 120 像素\nvar velocity = Vector2(xVelocity,\
  \ yVelocity)  # 初始速度和方向\n```\n\n为了让标签移动，我们需要在每一帧中持续更新它的位置。`_process(delta)` 函数每帧运行一次，使其成为处理此类更新的理想位置。通过在\
  \ `_process()` 内部添加一行调整标签位置的代码，我们可以创建平滑且持续的移动。\n\n在 `_process()` 函数内部的第一行添加以下代码并运行游戏。你将看到标签向右下方移动移动！\n\
  \n```\nposition = position + velocity * delta\n```\n\n在前面的行代码中，我们不断地将当前位置加上速度乘以\
  \ `delta` 的值。这里，`delta` 是自上一帧以来经过的时间量，它是一种确保运动在所有硬件上都保持平滑且一致的方法。\n\n你现在已经向让你的文本移动迈出了第一步——就像经典的\
  \ DVD Logo 一样！\n\n在我们进一步操作并让动作平滑一致之前，理解一个控制 Godot 中事物随时间行为的关键概念至关重要：delta。\n\n让我们花一点时间探索一下\
  \ `delta` 是什么以及它为什么如此重要。\n\n### Delta\n\n当我们在游戏中让物体移动时，我们通常希望它以恒定的速度移动——例如每秒 150\
  \ 像素。但棘手在于：并不是所有电脑都以相同的速度运行游戏。有些可能以每秒 60 帧运行，而其他取决于硬件，运行得更慢或更快。\n\n这就是 `delta` 派用用场。\n\
  \n`delta` 是一个很小的数字，告诉我们自上一帧绘制以来经过了多久。如果你的游戏运行很快，`delta` 可能是 `0.016`（大约是 1/60 秒）。如果运行较慢，`delta`\
  \ 会大一点，例如 `0.03`。\n\n通过将移动速度乘以 `delta`，我们是在说：\n\n*“根据实际经过的时间来移动此物体，而不是经过了多少帧。”*\n\
  \n这意味着无论你的计算机成功绘制了多少帧，物体都会以每秒正确的速度移动。\n\n所以，我们不是每帧移动 150 像素（那会太快了！而是每帧移动 150 × `delta`\
  \ 像素，这会根据性能自动调整。\n\n## 继续跳动标签项目\n\n回到我们的跳动标签项目，下一步是设置一些关于屏幕和标签本身的一些重要信息。这让我们能够检测标签何时撞击边缘并需要反弹。\n\
  \n现在，我们应该添加变量来存储屏幕尺寸和标签尺寸。重要的是，在场景加载之前，我们无法确定这些值。\n\n场景准备就绪后运行的第一个函数是 `_ready()`\
  \ 函数。因此，我们应该在那里初始化（为我们的变量赋值）。首先，将变量添加到顶部的集合中，然后在设置文本后，作为 `_ready()` 函数的第一几行为它们赋值：\n\
  \n```\nvar xVelocity = 150 # 每秒向右 150 像素\nvar yVelocity = 120 # 每秒向下 120 像素\nvar\
  \ velocity = Vector2(xVelocity, yVelocity) # 初始速度和方向\nvar screen_size_x # 屏幕水平维度\n\
  var screen_size_y # 屏幕垂直维度\nvar label_size_x # 标签宽度\nvar label_size_y # 标签高度\n```\n\
  \n现在，在 `_ready()` 函数中为这些变量赋值：\n\n```\nfunc _ready():\n    text = \"Go Go Godot!\"\
  \n    # 获取屏幕尺寸（视口大小）\n    screen_size_x = get_viewport_rect().size.x\n    screen_size_y\
  \ = get_viewport_rect().size.y\n    label_size_x = size.x\n    label_size_y = size.y\n\
  ```\n\n现在唯一要做的工作就是测试标签是否到达了左、右、顶或底边缘，如果到达了，就需要反弹。\n\n我们应该在设置方向后在 `_process()` 函数中测试标签是否到达了左、右、顶或底边缘。\n\
  \n如下所示对左右边缘进行测试：\n\n```\n## 左右边缘\nif position.x < 0 or position.x + label_size_x\
  \ > screen_size_x:\n    velocity.x *= -1\n```\n\n这行代码检查标签是否撞到了屏幕的左边缘或右边缘，如果是，则通过反转水平方向使其“跳弹”。\n\
  \n技术上讲，我们的跳动已经工作了，我们可以留在那里，但在某些少数情况下，标签会在一帧内越过边缘，方向反转了，但我们已经超出了边缘，为了防止这种情况，我们可以使用内置方法将值限制在最小值和最大值之间：\n\
  \n```\n## 左右边缘\nif position.x < 0 or position.x + label_size_x > screen_size_x:\n\
  \    velocity.x *= -1\n    position.x = clamp(position.x, 0, screen_size_x - label_size_x)\n\
  ```\n\n顶底边缘的检查是类似的：\n\n```\n## 上下边缘\nif position.y < 0 or position.y + label_size_y\
  \ > screen_size_y:\n    velocity.y *= -1\n    position.y = clamp(position.y, 0,\
  \ screen_size_y - label_size_y)\n```\n\n跳动标签的完整代码展示在这里：\n\n```\nextends Label\n\
  var xVelocity = 150 # 每秒向右 150 像素\nvar yVelocity = 120 # 每秒向下 120 像素\nvar velocity\
  \ = Vector2(xVelocity, yVelocity) # 初始速度和方向\nvar screen_size_x # 屏幕水平维度\nvar screen_size_y\
  \ # 屏幕垂直维度\nvar label_size_x # 标签宽度\nvar label_size_y # 标签高度\nfunc _ready():\n \
  \   text = \"Go Go Godot!\"\n    # 获取屏幕尺寸（视口大小）\n    screen_size_x = get_viewport_rect().size.x\n\
  \    screen_size_y = get_viewport_rect().size.y\n    label_size_x = size.x\n   \
  \ label_size_y = size.y\nfunc _process(delta):\n    position = position + velocity\
  \ * delta\n    # 左右边缘\n    if position.x < 0 or position.x + label_size_x > screen_size_x:\n\
  \        velocity.x *= -1\n        position.x = clamp(position.x, 0, screen_size_x\
  \ - label_size_x)\n    # 上下边缘\n    if position.y < 0 or position.y + label_size_y\
  \ > screen_size_y:\n        velocity.y *= -1\n        position.y = clamp(position.y,\
  \ 0, screen_size_y - label_size_y)\n```\n\n\n\n\n在本章中，我们学习了 Godot 的历史以及它的节点和场景设计哲学。我们下载并运行了\
  \ Godot。我们创建了第一个项目，并在游戏窗口中产生了第一个输出。我们还通过处理标签（label）的位置和速度使场景变得动态化。我们还学习了屏幕尺寸以及如何将其限制在一个范围之间（clamp），以及\
  \ `delta` 变量所起的重要作用。\n\n在下一章中，我们将更更深入地查看 Godot 编辑器界面以及如何使用它提供的工具。\n\n| 立即解锁本书的专属福利\
