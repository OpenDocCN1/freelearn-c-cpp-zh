  \n## 设置玩家动画\n\n为了制作动画，我们使用描述精灵各种运动阶段的多个帧。这些帧通常组合在一个瓦片集（sprite sheet）中。为了制作动画，我们首先导入瓦片集，然后将其分为帧。要这样做，选择\
  \ `AnimatedSprite2D` 节点，然后在“检查器（Inspector）”中，点击 `Sprite Frames` 属性的 `New SpriteFrames`。\n\
  \n![img](img/B31515_06_12.png)\n\n图 6.12 – New SpriteFrames\n\n在“检查器（Inspector）”中点击\
  \ `SpriteFrames`（如*图 6.12*所示），这将打开屏幕底部的 `SpriteFrames` 区域（见*图 6.13*）。这是我们可以导入帧并创建新动画的空间。\n\
  \n![img](img/B31515_06_13.png)\n\n图 6.13 – SpriteFrames 区域\n\n如*图 6.13*所示，我们目前只有一个默认动画，没有与之相关的图像或帧。现在我们将为玩家的所有动作创建动画，然后从瓦片集中导入与每个动作相关的精灵。执行此操作，请遵循以下步骤：\n\
  \n1. 首先将默认动画重命名为 `idle`。然后点击“添加动画”按钮或按下 `Ctrl + N`。将该动画重命名为 `run`。\n\n2. 创建以下动画列表：`double_jump`、`fall`、`jump`\
  \ 和 `wall_slide`。这些如*图 6.14* 所示：\n\n![img](img/B31515_06_14.png)\n\n图 6.14 – 玩家动作的所有动画\n\
  \n\n\n\n2. 现在在你的 `Assets` 文件夹中选择 `idle` 文件。你必须计算玩家图像，并根据需要更新 `Horizontal` 和 `Vertical`\
  \ 帧属性。然后点击 `Select All` 按钮，接着点击 `Add x Frame(s)` 按钮。这在*图 6.15*中显示了忍者蛙的待机帧：\n\n![img](img/B31515_06_15.png)\n\
  \n图 6.15 – 设置水平和垂直帧并将其添加到动画\n\n1. 像*图 6.15*中那样从图像（精灵图）中剪切单个帧后，你的 `SpriteFrames`\
  \ 窗口将更新为用于 `idle` 动画的图像。这在*图 6.16*中显示：\n\n![img](img/B31515_06_16.png)\n\n图 6.16\
  \ – 待机动画的帧\n\n如你在*图 6.16*中所示，顶部的栏中提供了动画的控件。我将 `idle` 帧率设置为 `8 FPS`，并开启了循环。你可以尝试这些设置以找到你喜好的设置。你可以在*图\
  \ 6.17*中看到这一点。\n\n![img](img/B31515_06_17.png)\n\n图 6.17 – 亮显示循环和 FPS 的动画控件\n\n\
  要设置其余玩家动画，请遵循并重复为 `idle` 动画执行的相同步骤。我们的下一个任务将通过为它们分配碰撞盒（hitbox），确保玩家可以与物体碰撞。\n\n\
  重要说明\n\n你可能注意到玩家在场景中看起来很模糊。这是由于默认纹理过滤引起的。点击 `Project` | `Project Settings` | `Rendering`\
  \ | `Textures` 并将 `Default Texture Filter` 改为 `Nearest`。这是像素艺术的最佳设置。\n\n## 检测碰撞\n\
  \n在游戏中检测物体何时以及何地发生碰撞，并识别哪些物体，是游戏开发的关键方面。在 Godot 中，我们通过将每个对象分配给 `CollisionShape2D`\
  \ 节点来处理此。该节点允许我们定义并调整围绕对象的形状，确保精确的碰撞检测。\n\n以下是分配 `CollisionShape2D` 节点的步骤：\n\n1.\
  \ 将 `CollisionShape2D` 节点作为 `Player` 的子节点。\n\n2. 在 `Inspector` 的 `Shape` 属性中选择 `RectangleShape2D`\
  \ 并调整其大小以适应你的玩家。这个矩形形成了玩家碰撞的边界框，并在*图 6.18*中所示：\n\n![img](img/B31515_06_18.png)\n\
  \n图 6.18 – 将 RectangleShape2D 分配给 CollisionShape2D 节点并生成的边界框\n\n如*图 6.18*所示，任何进入矩形碰撞形状的物体都将记录碰撞。该形状在游戏过程中是不可见的。\n\
  \n1. 将 `Player` 场景保存为 `player.tscn`，然后将文件从 `FileSystem` 拖放到 `Level1` 场景中。\n\n现在你的关卡中有一个玩家了！但是，如果你运行游戏，玩家是静止的，因为还没有实现移动。我们稍后会这一点。\n\
  \n## TileMap 碰撞\n\n如之前所述，我们目前的关卡只是一幅画；没有任何瓦格具有碰撞检测，我们的玩家无法移动。要在我们的瓦格上设置碰撞，我们需要向物理层添加元素。要执行此操作，请遵循以下步骤：\n\
  \n1. 在 `Inspector` 中选择 `TileMapLayer` 节点并点击 `Tile Set`。\n\n2. 在 `Physics Layers`\
  \ 属性中点击 `Add Element`。这在*图 6.19*中所示：\n\n![img](img/B31515_06_19.png)\n\n图 6.19 -\
  \ 为 TileSet 的 Physics Layers 添加元素\n\n一旦你在 TileSet 的 `Physics Layers` 中添加了元素，如*图\
  \ 6.19*所示，你的 TileSet 在 `Physics Layers` 中有两个新属性——`Collision Layer` 和 `Collision\
  \ Mask`。这在*图 6.20*中显示：\n\n![img](img/B31515_06_20.png)\n\n图 6.20 – TileSet 的 Collision\
  \ Layer 和 Collision Mask\n\n如*图 6.20*所示，Godot 4 中碰撞层和掩码的概念在管理游戏世界不同元素之间的碰撞和交互方面起着至关重要的作用。理解如何使用层和掩码对于创建复杂且交互式的游戏环境至关重要。将在下一节中进行详细解释。\n\
  \n确保你已添加了*两个* `Physics Layers` 元素，因为一组用于地面瓦格，另一组将用于通行瓦格。\n\n## 碰撞层和碰撞掩码\n\n碰撞层是物体所属的类别或组，它们决定了它可以与哪些物体交互。通过将物体分配给特定的\
  \ `Collision Layer`，我们将其放在一个定义其潜在交互的组中。例如，如果物体 X 被分配给层 1，它就会被视为层 1 的一部分。其他物体可以根据它们自身的碰撞设置被设置为检测并响应该层中的物体。\n\
  \n另一方面，碰撞掩码定义了物体可以检测并交互的层。例如，如果物体 X 被分配给层 1，它就会被视为层 1 的一部分。其他物体可以根据它们自身的碰撞设置被设置为检测并响应该层中的物体。\n\
  \n\n\n在 `Figure 6.24` 中，我们处于 `Player` 节点，我们已经开启了 `Collision Layer 1` (`player`)，并开启了\
  \ `Collision Mask 2` (`ground`) 和 `Collision Mask 3` (`pass_through`)。这意味着我们启用了相反方向的碰撞，因此玩家现在将与地面和通行层（pass-through）发生碰撞。\n\
  \n让我们的关卡具有交互性的最后一步是将 `TileSet` 中的瓦格绘制为碰撞瓦格。\n\n## 绘制瓦格\n\n要将 `TileSet` 中的瓦格绘制为碰撞瓦格，请遵循以下步骤：\n\
  \n1. 首先，我们需要选择 `TileMapLayer` 节点，在屏幕底部打开 `TileSet`，然后点击 `Paint`。\n\n2. 在 `Paint\
  \ Properties` 中，选择 `Physics Layer 0`。这是 `ground` 层。现在，在所有你希望成为 `ground` 的瓦格上进行绘制。我选择将右侧的瓦格留为\
  \ `pass_through` 瓦格，并且*没有*将它们绘制为碰撞体。这在 `Figure 6.25` 中所示：\n\n![img](img/B31515_06_2.png)\n\
  \nFigure 6.25 – 地面瓦格带有阴影——注意留给通行层的未阴影瓦格\n\n![img](img/lightbulb_1.png)\n\n![img](img/1_G.png)\
  \ **快速提示**：需要查看此图像的高分辨率版本吗？请在下一代 Packt Reader 中打开此书，或在 PDF/ePub 副本中查看。\n\n![img](img/4_G1.png)\
